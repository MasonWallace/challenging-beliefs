<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Challenging Beliefs">
<meta property="og:title" content="Islam vs. the Bible — Challenging Beliefs">
<meta property="og:description" content="78 documented cases — verdicts, sources, and scripted conversations for every one.">
<meta property="og:url" content="https://masonwallace.github.io/challenging-beliefs/islam/">
<meta property="og:image" content="https://commons.wikimedia.org/wiki/Special:FilePath/Samarkand%20Kufic%20Quran%2C%201905%20(2022-07-05)%2003.jpg?width=1200">
<meta name="twitter:card" content="summary_large_image">
<meta name="description" content="78 documented cases — verdicts, sources, and scripted conversations for every one.">
<title>Challenging Beliefs — Islam, Examined Against the Bible</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --bg:#0f1116; --side:#0b0d11; --panel:#161a21; --panel2:#12151b; --line:#232833; --line2:#2b313d;
    --ink:#e7e9ec; --muted:#98a0ac; --dim:#565e6b; --gold:#82b1d8; --gold-ink:#0e1116;
    --red:#e0736a; --red-bg:#38221f; --red-cell:#5e2b27; --red-cell-hi:#8a3a32;
    --amber:#cf9a45; --amber-bg:#332a18; --amber-cell:#54431f; --amber-cell-hi:#7d6224;
    --green:#7fb08d; --green-bg:#1d2c26; --green-cell:#27443a;
    --purp:#b394e0; --purp-bg:#2c2440;
    --teal:#6cb6ad; --teal-bg:#16302e;
    --serif:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif;
    --sans:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    --acc:var(--gold);
    --acc2:var(--purp);
    --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  }
  :root[data-theme="light"]{
    --bg:#f3f4f6; --side:#e9ebee; --panel:#ffffff; --panel2:#f7f8fa; --line:#dfe2e7; --line2:#cfd4db;
    --ink:#1b1e23; --muted:#5c6470; --dim:#9aa1ab; --gold:#2f6b9e; --gold-ink:#ffffff;
    --red:#b03a31; --red-bg:#f6e4e2; --red-cell:#e7b6b1; --red-cell-hi:#cc766d;
    --amber:#8a5f0e; --amber-bg:#f3ecd9; --amber-cell:#e4d1a2; --amber-cell-hi:#c6a75e;
    --green:#3e7455; --green-bg:#e3ede6; --green-cell:#b7d1bf;
    --purp:#6b4fa1; --purp-bg:#ece5f6;
    --teal:#26706a; --teal-bg:#e0eeec;
  }
  *{box-sizing:border-box}
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6}
  a{color:var(--gold)}
  button{font-family:inherit}
  mark{background:color-mix(in srgb,var(--amber) 30%,transparent);color:inherit;border-radius:2px;padding:0 2px}
  kbd{font-family:var(--mono);font-size:.72rem;background:var(--panel);border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;padding:1px 6px;color:var(--muted)}

  .app{display:grid;grid-template-columns:216px minmax(0,1fr) 280px;min-height:100vh}
  @media (max-width:1020px){.app{grid-template-columns:216px minmax(0,1fr)}.preview{display:none}}
  @media (max-width:720px){.app{grid-template-columns:1fr}.side{position:sticky;top:0;z-index:40;height:auto;border-right:0;border-bottom:1px solid var(--line)}
    .side .nav{display:flex;flex-wrap:wrap;gap:2px;padding:0 10px 10px}.side .nav h5{display:none}.side .sideprog{display:none}}

  /* sidebar */
  .side{background:var(--side);border-right:1px solid var(--line);padding:18px 0;position:sticky;top:0;height:100vh;overflow-y:auto}
  @media (max-width:720px){.side{height:auto;overflow:visible}}
  .logo{font-family:var(--serif);font-size:1rem;letter-spacing:.1em;padding:0 18px 14px;color:var(--ink)}
  .logo b{color:var(--gold)}
  .sidesearch{padding:0 14px 12px}
  .sidesearch input{width:100%;font-family:inherit;font-size:.82rem;padding:7px 12px;border-radius:8px;border:1px solid var(--line2);background:var(--panel);color:var(--ink)}
  .sidesearch input:focus{outline:2px solid var(--gold);outline-offset:1px}
  .info{display:inline-grid;place-items:center;width:14px;height:14px;border:1px solid currentColor;border-radius:50%;font-size:.58rem;font-style:normal;font-weight:700;opacity:.75;cursor:help;position:relative;flex:none}
  .info:hover,.info:focus{opacity:1}
  .info .tip{display:none;position:absolute;left:50%;transform:translateX(-50%);top:160%;width:250px;background:var(--side);color:var(--ink);border:1px solid var(--line2);font-family:var(--sans);font-size:.76rem;line-height:1.5;padding:9px 12px;border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.35);z-index:30;text-transform:none;letter-spacing:0;font-weight:400;text-align:left}
  .info:hover .tip,.info:focus .tip{display:block}
  .badge,.tag{display:inline-flex;align-items:center;gap:5px}
  .nav a{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 18px;font-size:.86rem;color:var(--muted);text-decoration:none;cursor:pointer;border-left:2px solid transparent}
  .nav a:hover{background:var(--panel2);color:var(--ink)}
  .nav a.on{background:var(--panel);color:var(--ink);border-left-color:var(--gold)}
  .nav .cnt{font-family:var(--mono);font-size:.68rem;color:var(--dim)}
  .nav h5{font-size:.64rem;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin:18px 18px 6px;font-weight:600}
  .sideprog{margin:22px 18px 8px;font-size:.72rem;color:var(--muted)}
  .pbar{height:4px;background:var(--line);border-radius:2px;margin-top:6px;overflow:hidden}
  .pbar i{display:block;height:100%;background:var(--gold);transition:width .4s ease}

  /* main */
  .main{padding:18px 26px 80px;min-width:0}
  .cmd{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line2);border-radius:8px;padding:4px 8px 4px 14px;margin-bottom:18px}
  .cmd input{flex:1;background:none;border:0;color:var(--ink);font-family:inherit;font-size:.9rem;padding:7px 0;outline:none}
  .cmd input::placeholder{color:var(--dim)}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:20px}
  .tile{background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:12px 14px;cursor:pointer;text-align:left;color:var(--ink)}
  .tile:hover{border-color:var(--gold)}
  .tile.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
  .tile .v{font-family:var(--serif);font-size:1.7rem;font-variant-numeric:tabular-nums;line-height:1.1}
  .tile .l{font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:2px}
  .tile.t-ad .v{color:var(--purp)}.tile.t-un .v{color:var(--red)}.tile.t-co .v{color:var(--amber)}.tile.t-an .v{color:var(--green)}
  h4.bt{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;font-weight:600}
  .vwall{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:10px;align-items:start}
  @media (max-width:1240px){.vwall{grid-template-columns:1fr 1fr}}
  @media (max-width:700px){.vwall{grid-template-columns:1fr}}
  .vcol{background:var(--panel2);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .vcol header{padding:14px 16px 12px;border-bottom:2px solid var(--line)}
  .vcol.ad header{border-bottom-color:var(--purp)}
  .vcol.ad .n,.vcol.ad .t{color:var(--purp)}
  .vcol.ad .vt:hover{border-left-color:var(--purp)}
  .vcol.un header{border-bottom-color:var(--red)}
  .vcol.co header{border-bottom-color:var(--amber)}
  .vcol.an header{border-bottom-color:var(--dim)}
  .vcol header .n{font-family:var(--serif);font-size:1.9rem;line-height:1;font-variant-numeric:tabular-nums}
  .vcol.un .n{color:var(--red)}.vcol.co .n{color:var(--amber)}.vcol.an .n{color:var(--muted)}
  .vcol.an .t{color:var(--muted)}
  .vcol header .t{font-size:.72rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;margin-left:8px}
  .vcol.un .t{color:var(--red)}.vcol.co .t{color:var(--amber)}.vcol.an .t{color:var(--green)}
  .vcol header .d{font-size:.74rem;color:var(--muted);margin-top:4px}
  /* Option B: the four bands run down the page, five cases each */
  .vwall.vstack{display:block;max-width:none}
  .vwall.vstack .vcol{margin:0 0 16px}
  .vwall.vstack .vcol header{padding:16px 18px 14px}
  .vwall.vstack .vcol header .n{font-size:2.1rem}
  .vwall.vstack .vcol header .t{font-size:.8rem;letter-spacing:.12em}
  .vwall.vstack .vcol header .d{font-size:.86rem;margin-top:6px;max-width:70ch;line-height:1.55}
  .vwall.vstack .vt{padding:11px 18px 11px 15px}
  .vwall.vstack .vt h5{font-size:.99rem}
  /* a picture beside every claim; a letter block where no image exists yet */
  .vwall.vstack .vt{display:flex;gap:14px;align-items:center;padding:10px 18px 10px 15px}
  .vth{width:62px;height:46px;flex:0 0 62px;border-radius:7px;object-fit:cover;border:1px solid var(--line2);background:var(--panel)}
  .vth.ph{display:grid;place-items:center;color:var(--dim);font-family:var(--serif);font-size:1.15rem}
  .vtx{display:block;min-width:0;flex:1}
  .vwall.vstack .vt .h5{font-family:var(--serif);font-weight:500;font-size:1.02rem;line-height:1.35;display:block}
  /* the genuinely striking ones carry more weight on the page */
  .vwall.vstack .vt.wow .h5{font-size:1.32rem;line-height:1.28}
  .vwall.vstack .vt.wow .vth{width:78px;height:58px;flex-basis:78px}
  @media (max-width:620px){.vwall.vstack .vt.wow .h5{font-size:1.12rem}}
  .showall{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);
    padding:11px 18px;cursor:pointer;color:var(--gold);font-family:inherit;font-size:.83rem;font-weight:600;letter-spacing:.02em}
  .showall:hover{background:color-mix(in srgb,var(--gold) 8%,transparent)}
  .vgroup h6{font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:0;padding:10px 16px 4px;font-weight:600}
  .vt{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:9px 16px 9px 13px;cursor:pointer;color:var(--ink);border-left:3px solid transparent}
  .vt:hover,.vt.sel{background:var(--panel)}
  .vt.sel{border-left-color:var(--gold)}
  .vcol.un .vt:hover{border-left-color:var(--red)}
  .vcol.co .vt:hover{border-left-color:var(--amber)}
  .vcol.an .vt:hover{border-left-color:var(--green)}
  .vt.dimmed{opacity:.25}
  .vt h5{font-family:var(--serif);font-weight:500;font-size:.92rem;line-height:1.35;margin:0}
  .vt .m{font-size:.66rem;color:var(--dim);letter-spacing:.05em;text-transform:uppercase;margin-top:2px;display:flex;gap:8px;align-items:center}
  .vt .m .rd{color:var(--green)}
  .vt .m .star{color:var(--gold)}

  /* list */
  .rows{display:flex;flex-direction:column}
  .rowitem{display:grid;grid-template-columns:12px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:11px 6px;cursor:pointer;color:var(--ink)}
  .rowitem:hover,.rowitem.sel{background:var(--panel2)}
  .rowitem .stripe{width:4px;height:26px;border-radius:2px}
  .rowitem.v-unrefuted .stripe{background:var(--red)}
  .rowitem.v-contested .stripe{background:var(--amber)}
  .rowitem.v-answered .stripe{background:var(--green)}
  .rowitem h5{font-family:var(--serif);font-weight:500;font-size:1rem;margin:0;line-height:1.35}
  .rowitem .sub{font-size:.72rem;color:var(--muted)}
  .rowitem .meta{display:flex;gap:8px;align-items:center;font-size:.66rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;white-space:nowrap}
  .rowitem .meta .rd{color:var(--green)}

  .badge{font-size:.64rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:3px 9px;border-radius:999px;display:inline-block}
  .badge.v-admitted{background:var(--purp-bg);color:var(--purp)}
  .badge.v-unrefuted{background:var(--red-bg);color:var(--red)}
  .badge.v-contested{background:var(--amber-bg);color:var(--amber)}
  .badge.v-answered{background:var(--green-bg);color:var(--green)}
  .tag{font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line2);border-radius:999px;padding:2px 9px;display:inline-block}

  /* case view */
  .backbar{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
  .backbar button.bk{background:var(--panel);border:1px solid var(--line2);color:var(--muted);border-radius:8px;padding:6px 13px;font-size:.8rem;cursor:pointer}
  .backbar button.bk:hover{color:var(--ink);border-color:var(--gold)}
  .pathnext{margin-left:auto;background:var(--gold);color:var(--gold-ink);border:0;border-radius:8px;padding:7px 14px;font-size:.8rem;font-weight:700;cursor:pointer}
  .case h2{font-family:var(--serif);font-weight:500;font-size:1.6rem;line-height:1.25;margin:10px 0 14px;max-width:30ch;text-wrap:balance}
  .case .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
  .dlab{font-size:.92rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink);margin:28px 0 11px;line-height:1.35}
  .dlab.red{color:var(--red)}.dlab.blue{color:var(--gold)}
  .claimrow{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(270px,1fr);gap:28px;align-items:start}
  .claimrow.solo{grid-template-columns:1fr}
  @media (max-width:900px){.claimrow{grid-template-columns:1fr}}
  .claim p{font-size:.97rem;line-height:1.75;max-width:66ch;margin:0 0 12px}
  .claimside{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:16px 18px;position:sticky;top:16px}
  .claimside .passcols{grid-template-columns:1fr;gap:12px}
  .claimside .sidenote{font-size:.76rem;color:var(--dim);margin:-4px 0 12px}
  .defense p.lead{margin:0 0 4px}
  .defense p{line-height:1.7;margin:0 0 10px}
  .pts{margin:8px 0 0;padding:0;list-style:none;counter-reset:pt}
  .pts li{position:relative;padding:10px 0 10px 36px;border-top:1px dashed color-mix(in srgb,var(--green) 25%,var(--line));line-height:1.7}
  .pts li:first-child{border-top:0}
  .pts li::before{counter-increment:pt;content:counter(pt);position:absolute;left:0;top:10px;width:23px;height:23px;border-radius:50%;background:var(--green-bg);color:var(--green);display:grid;place-items:center;font-size:.72rem;font-weight:700}
  .vbox p{margin:0 0 8px;line-height:1.7}
  .vbox p:last-child{margin-bottom:0}
  .ref-lds{color:var(--red);font-weight:600}
  .ref-bib{color:var(--gold);font-weight:600}
  .qq{font-family:var(--serif);font-style:italic;background:color-mix(in srgb,var(--amber) 16%,transparent);border-radius:3px;padding:0 3px}
  .kw{font-weight:700;text-decoration:underline;text-underline-offset:2px}
  .talk{background:color-mix(in srgb,var(--green) 8%,var(--panel));border:1px solid color-mix(in srgb,var(--green) 30%,var(--line));border-radius:8px;padding:16px 18px;font-size:.93rem;max-width:80ch}
  .talk p{margin:0 0 8px;line-height:1.7}
  .talk p:last-child{margin-bottom:0}
  .dlg{display:flex;flex-direction:column;gap:10px;max-width:76ch}
  .dlg .msg{border-radius:12px;padding:12px 16px;max-width:88%}
  .dlg .msg p{margin:0;font-size:.9rem;line-height:1.65}
  .dlg .who{display:block;font-size:.64rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin-bottom:4px}
  .dlg .them{align-self:flex-start;background:var(--panel);border:1px solid var(--line2);border-bottom-left-radius:4px}
  .dlg .them .who{color:var(--red)}
  .dlg .you{align-self:flex-end;background:color-mix(in srgb,var(--green) 9%,var(--panel));border:1px solid color-mix(in srgb,var(--green) 30%,var(--line));border-bottom-right-radius:4px}
  .dlg .you .who{color:var(--green)}
  .corelinks{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .corelink{font-size:.78rem;background:var(--panel2);border:1px solid var(--line2);color:var(--gold);border-radius:999px;padding:5px 13px;cursor:pointer;text-align:left}
  .corelink:hover{border-color:var(--gold)}
  .gtab{width:100%;border-collapse:collapse;font-size:.86rem;margin:14px 0 6px}
  .gtab th{text-align:left;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:8px 12px;border-bottom:2px solid var(--line2)}
  .gtab th:nth-child(2){color:var(--red)}
  .gtab th:nth-child(3){color:var(--gold)}
  .gtab td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.55}
  .gtab td:first-child{font-weight:700;white-space:nowrap;color:var(--muted)}
  .dodont{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media (max-width:700px){.dodont{grid-template-columns:1fr}}
  .dodont ul{margin:8px 0 0;padding-left:18px;font-size:.86rem;color:var(--muted)}
  .dodont li{padding:3px 0;line-height:1.55}
  .why{background:color-mix(in srgb,var(--gold) 7%,var(--panel));border:1px solid color-mix(in srgb,var(--gold) 28%,var(--line));border-radius:8px;padding:16px 18px;font-size:.93rem;max-width:80ch}
  .why p{margin:0 0 10px;line-height:1.7}
  .why .wtail{color:var(--muted);font-style:italic;margin-bottom:0;border-top:1px dashed color-mix(in srgb,var(--gold) 30%,var(--line));padding-top:10px}
  .compare2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media (max-width:760px){.compare2{grid-template-columns:1fr}}
  .pane{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
  .pane .ref{font-size:.7rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
  .pane.bom .ref{color:var(--red)}.pane.bible .ref{color:var(--gold)}
  .pane .scripture{font-family:var(--serif);font-size:1rem;line-height:1.65}
  .cnote{font-size:.8rem;color:var(--muted);margin-top:8px;max-width:80ch}
  .passcols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  /* a reference with a reason attached needs the full width, so drop to one column */
  .passcols:has(.rrow){grid-template-columns:1fr;gap:18px}
  .chips:has(.rrow){display:block}
  .rrow{display:flex;gap:10px;align-items:baseline;padding:7px 0;border-top:1px solid var(--line)}
  .rrow:first-child{border-top:none;padding-top:1px}
  .rrow .chip{flex:0 0 auto}
  .rwhy{font-size:.83rem;line-height:1.55;color:color-mix(in srgb,var(--ink) 86%,var(--muted))}
  .rwhy b{color:var(--gold);font-weight:600}
  .claimside .rrow{flex-direction:column;gap:5px;align-items:flex-start}
  @media (max-width:620px){.rrow{flex-direction:column;gap:5px;align-items:flex-start}}
  @media (max-width:760px){.passcols{grid-template-columns:1fr}}
  .passcols h6{font-size:.68rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin:0 0 8px}
  .passcols .h-bom{color:var(--red)}.passcols .h-bib{color:var(--gold)}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{font-size:.78rem;font-family:var(--serif);border:1px solid var(--line2);background:var(--panel);border-radius:6px;padding:4px 10px;cursor:pointer;color:var(--ink)}
  .chip:hover{border-color:var(--gold)}
  .chip.open{background:var(--amber-bg);border-color:var(--gold)}
  .chip.ext::after{content:" ↗";color:var(--muted);font-family:var(--sans);font-size:.68rem}
  .versebox{grid-column:1/-1;background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:8px;padding:14px 18px;margin-top:4px}
  .versebox .vr{font-size:.7rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-bottom:8px;display:flex;justify-content:space-between}
  .versebox .vr button{background:none;border:0;color:var(--muted);cursor:pointer;font-size:.8rem}
  .versebox .vtext{font-family:var(--serif);font-size:.98rem;line-height:1.7;max-width:72ch}
  .versebox .vnum{font-family:var(--sans);font-size:.62rem;color:var(--muted);vertical-align:super;margin-right:3px}
  .versebox .vwhy{margin-top:10px;font-size:.8rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px;max-width:76ch}

const DATA=[
{"id":"quran-affirms-torah-gospel","category":"torah-preservation","severity":"high","verdict":"unrefuted","featured":true,"title":"The Quran itself vouches for the Bible","claim":"The Quran treats the Torah and Gospel of Muhammad's own day as real, present and authoritative. It 'confirms what came before it' (Quran 3:3). It asks why Jews come to Muhammad for judgment 'while they have the Torah, in which is the judgment of Allah' (5:43) — with them, in the present tense. It commands 'the People of the Gospel' to 'judge by what Allah has revealed therein' (5:46-47). It tells Jews and Christians they are 'on nothing' until they uphold the Torah and Gospel (5:68). It tells Muhammad himself, if in doubt, to 'ask those who have been reading the Scripture before you' (10:94). And it declares that 'none can alter His words' (6:115; 18:27). A corrupted, unreliable Bible cannot be what any of those verses mean. So the tahrif, or corruption, doctrine faces a fork. Corruption before Muhammad contradicts the Quran. Corruption after Muhammad is ruled out by surviving manuscripts.","quran":["Quran 3:3","Quran 5:43","Quran 5:46-47","Quran 5:68","Quran 10:94","Quran 6:115","Quran 18:27"],"hadith":[],"bible":["Isaiah 40:8"],"sources":[{"name":"Quranic Arabic Corpus — Quran 5:47 (translations)","type":"primary","url":"https://corpus.quran.com/translation.jsp?chapter=5&verse=47"},{"name":"Quran.com — Surah Al-Ma'idah 5:43-68","type":"primary","url":"https://quran.com/en/al-maidah/47-57"},{"name":"Gordon Nickel, Narratives of Tampering in the Earliest Commentaries on the Qur'an (Brill, 2011)","type":"scholarly","url":"https://brill.com/view/title/19538"},{"name":"IslamicDilemma.com — the two-horned argument stated","type":"apologetics","url":"https://islamicdilemma.com/"}],"response":"IslamQA gives the mainstream answer. The Quran confirms the original revealed Torah and Injil. By Muhammad's time the circulating texts had already been altered in places. They were corrupted here and there, yet still held truth. That is why the Quran can appeal to what remains without endorsing the whole. A second line argues that the Injil is a distinct revelation given to Jesus, not the four Gospels Christians possess. On this account affirmation and corruption sit together: the Quran affirms what is genuinely from Allah in their books, and corrects the rest.","responseSource":{"name":"IslamQA — 'Have the Torah and Gospel Been Changed?' (fatwa 2001)","url":"https://islamqa.info/en/answers/2001"},"rationale":"The 'already corrupted by Muhammad's day' answer collides with the plain sense of the verses. Quran 5:43 says the Torah with them contains Allah's judgment now. Quran 5:47 commands present-tense judgment by the Gospel. Quran 10:94 makes readers of the earlier Scripture the check on Muhammad's own revelation. None of that is coherent if those texts were unreliable. The 'lost original Injil' answer posits a book with no historical or manuscript existence at all, and 5:47 addresses the actual People of the Gospel and what they hold. Neither horn is escaped. The answers move the problem rather than resolve it.","plain":[{"t":"Why this case comes first","d":"Most Muslims believe the Bible was changed. That is why they will not accept it as evidence. So every other argument stalls right here. This case answers it from the Quran itself, not from ours."},{"t":"What the Quran says about the Bible","d":"Quran 3:3 says the Quran confirms what came before it. Quran 5:43 asks why Jews come to Muhammad for judgment <b>\"while they have the Torah, in which is the judgment of Allah.\"</b> Quran 5:46-47 tells the People of the Gospel to <b>\"judge by what Allah has revealed therein.\"</b> Quran 5:68 says they stand on nothing until they uphold both books. Quran 10:94 tells Muhammad, if he doubts, to <b>\"ask those who have been reading the Scripture before you.\"</b> Quran 6:115 and Quran 18:27 add that none can alter His words."},{"t":"The answer you will hear","d":"IslamQA gives the mainstream reply, and it is a fair one. The Quran confirms the <i>original</i> Torah and Gospel. By Muhammad's day those books had already been altered in places. Truth remained in them, so the Quran can appeal to that. A second reply says the Injil was a separate book given to Jesus. On that view it was never the four Gospels at all."},{"t":"Where that answer runs out","d":"Now read the verses again. Quran 5:43 says the Torah <i>with them</i> holds Allah's judgment now. Quran 5:47 tells Christians to judge by the Gospel now. Quran 10:94 makes those same readers the check on Muhammad's message. None of that works if the books could not be trusted."},{"t":"How strong is this argument?","d":"Strong for you. No Muslim scholar has published a clean answer. The replies move the problem instead of solving it. Corruption before Muhammad contradicts the Quran. Corruption after him is closed off by manuscripts, which is the next case."},{"say":true,"t":"What to say","d":"\"Your own book tells people in doubt to ask those who read the earlier Scripture. Could we do that together?\""}],"rewritten":true,"refwhy":{"Isaiah 40:8":"The Bible's own form of the claim in Quran 6:115. God's word 'shall stand for ever'.","Quran 3:3":"Says the Quran confirms what came before it. This is the first step of the case.","Quran 5:43":"Asks why Jews come to Muhammad while they have the Torah. Note the present tense.","Quran 5:46-47":"Tells the People of the Gospel to judge by what is in it. A live book, not a lost one.","Quran 5:68":"Says Jews and Christians stand on nothing until they uphold the Torah and the Gospel.","Quran 10:94":"Tells Muhammad to ask those who read the earlier Scripture. It makes them the check on him.","Quran 6:115":"Says no one can change His words. Hard to square with a Bible that was rewritten.","Quran 18:27":"Says the same again. Cited with 6:115 as the pair that closes off the change."},"titleLong":"The cornerstone: the Quran affirms the Scriptures of Muhammad's day"},
{"id":"tahrif-doctrine-late-development","category":"torah-preservation","severity":"high","verdict":"admitted","title":"The 'Bible was changed' doctrine dates to 1064","claim":"The charge that the Bible's text was falsified — tahrif al-nass — is not the Quran's teaching, and it was not early Islam's. Gordon Nickel studied the earliest Quran commentaries, including Muqatil ibn Sulayman in the 8th century and al-Tabari, who died in 923. They understood the tampering verses as misinterpretation, concealment and mispronunciation by Jews and Christians. That is tahrif al-mana, corruption of meaning, not of text. Ibn Abbas, cited in Sahih al-Bukhari's Book of Tawhid, said no one can remove the words of Allah from His books; people distort meanings by misreading. The full text-corruption doctrine only crystallised with Ibn Hazm of Cordoba, who died in 1064 — four centuries after Muhammad. It hardened as a polemical necessity once the differences between Bible and Quran were pressed.","quran":["Quran 2:75","Quran 2:79","Quran 3:78","Quran 4:46","Quran 5:13"],"hadith":["Sahih al-Bukhari 7363"],"bible":[],"sources":[{"name":"Gordon Nickel, Narratives of Tampering (Brill, 2011) — review, CMCS Oxford","type":"scholarly","url":"https://www.cmcsoxford.org.uk/resources/book-reviews/nickel-2011-narratives-of-tampering"},{"name":"Nickel, 'Early Muslim Accusations of Tahrif: Muqatil ibn Sulayman's Commentary'","type":"scholarly","url":"https://www.researchgate.net/publication/302189519_Early_muslim_accusations_of_tahrif_Muqatil_ibn_sulayman's_commentary_on_key_qur'anic_verses"},{"name":"Answering Islam — 'Did Ibn Abbas Believe that the Holy Bible was Corrupt?'","type":"apologetics","url":"https://www.answering-islam.org/Quran/Bible/ibnabbas_bukhari.htm"},{"name":"Sunnah.com — Sahih al-Bukhari 7363","type":"primary","url":"https://sunnah.com/bukhari:7363"}],"response":"Muslim apologists reply that tahrif al-nass is no medieval invention. The Quran says 'a party of them used to hear the words of Allah and then distort it' (2:75). It condemns 'those who write the Book with their own hands, then say: this is from Allah' (2:79) — physical writing, not mere misreading. They also note that the same Ibn Abbas, in Sahih al-Bukhari 7363, says the People of the Book 'changed and altered' their Book and wrote it with their own hands. So the early testimony cuts both ways. On this view Ibn Hazm systematised the doctrine rather than inventing it. Islamweb argues the same in its fatwa on judging by the Torah and Gospel.","responseSource":{"name":"Islamweb — fatwa on judging by the Torah and Gospel","url":"https://www.islamweb.net/en/fatwa/92519/the-quran-ordering-the-jews-and-christians-to-judge-according-to-the-torah-and-the-gospel"},"rationale":"The load-bearing facts are conceded inside Islamic sources and in academic scholarship. The earliest exegetes overwhelmingly read the tampering verses as distortion of meaning. Bukhari preserves Ibn Abbas denying that anyone can change Allah's words in His books. Even reviewers sympathetic to Islam grant that only Ibn Hazm and al-Maqdisi held thoroughgoing textual corruption among the classical authorities. Quran 2:79 addresses a party writing false material and selling it. It never says the Torah's manuscript tradition was rewritten, and no early source identifies when, where or by whom that global rewrite happened. The doctrine every dawah presentation depends on is historically late.","plain":[{"t":"The word behind \"the Bible was changed\"","d":"<i>Tahrif</i> is the Arabic word for corruption. It comes in two very different forms. One says Jews and Christians twist the <i>meaning</i> of their books. The other says the written text itself was rewritten. Almost every conversation assumes the second."},{"t":"What the earliest Muslim scholars taught","d":"Gordon Nickel studied the oldest Quran commentaries. Muqatil ibn Sulayman wrote in the 8th century. Al-Tabari died in 923. Both read the tampering verses as twisted meaning, concealment and misreading — not textual change. Ibn Abbas, quoted in Sahih al-Bukhari's Book of Tawhid, said no one can remove the words of Allah from His books."},{"t":"When the text claim actually appeared","d":"The full text-corruption doctrine was argued by Ibn Hazm of Cordoba. He died in 1064. That is four centuries after Muhammad. It hardened once the differences between the two books were pressed."},{"t":"The reply, at full strength","d":"Muslims answer that the Quran says more than misreading. Quran 2:75 speaks of people who hear Allah's words and distort them. Quran 2:79 condemns those who write the Book with their own hands. And the same Ibn Abbas, in Sahih al-Bukhari 7363, says the People of the Book changed and altered it. Early testimony cuts both ways. Ibn Hazm, they say, organised the doctrine rather than invented it."},{"t":"How strong is this argument?","d":"Strong for you, because the sources are theirs. Even reviewers friendly to Islam grant that only Ibn Hazm and al-Maqdisi held full textual corruption. And no early source says when, where or by whom the Bible was rewritten."},{"say":true,"t":"What to say","d":"\"When do you think the Bible was rewritten, and who did it? I have never found an answer.\""}],"rewritten":true,"refwhy":{"Quran 2:75":"A party 'hear the words of Allah and then distort it'. The first verse the reply leans on.","Quran 2:79":"The best verse for the text claim. People 'write the Book with their own hands'.","Quran 3:78":"Describes a party who twist the Book with their tongues. That is speech, not a rewrite.","Quran 4:46":"Jews who 'change words from their places'. Early scholars read this as twisted meaning.","Quran 5:13":"The same charge again. These five verses are the whole base of the change doctrine.","Sahih al-Bukhari 7363":"Cuts against you. In Bukhari, Islam's soundest collection, Ibn Abbas says they changed and altered their Book."},"titleLong":"Tahrif of the text is a late doctrine: early Islam taught corruption of meaning"},
{"id":"manuscripts-predate-muhammad","category":"torah-preservation","severity":"high","verdict":"unrefuted","featured":true,"title":"Bible copies 900 years older than Muhammad","claim":"Whatever text the Quran affirmed in Muhammad's day, between 610 and 632 AD, is recoverable — and it is the same in substance as today's Bible. The Dead Sea Scrolls date from about 250 BC to 70 AD. They include the complete Great Isaiah Scroll, from about 125 BC, with Isaiah 53 intact, and they substantially match the Masoretic text behind modern Old Testaments. The Septuagint translation dates to the 3rd and 2nd centuries BC. Codex Sinaiticus and Codex Vaticanus, from the mid-4th century AD, each contain the complete New Testament or nearly so, and they are the base of modern critical editions. They predate Muhammad by about 250 years. So the second horn is sealed: no corruption after Muhammad is possible, because the text from before him survives, and it is our text.","quran":["Quran 5:48","Quran 10:94"],"hadith":[],"bible":["Isaiah 53:5-6"],"sources":[{"name":"Israel Museum — The Great Isaiah Scroll (digital, c. 125 BCE)","type":"institutional","url":"http://dss.collections.imj.org.il/isaiah"},{"name":"Codex Sinaiticus Project — dating (mid-4th century)","type":"institutional","url":"https://codexsinaiticus.org/en/codex/date.aspx"},{"name":"Leon Levy Dead Sea Scrolls Digital Library (Israel Antiquities Authority)","type":"institutional","url":"https://www.deadseascrolls.org.il/"},{"name":"Anthony Ferguson, 'How Much Can the Most Famous Dead Sea Scroll Prove?' (Text & Canon Institute)","type":"scholarly","url":"https://textandcanon.org/how-much-can-the-most-famous-dead-sea-scroll-prove/"}],"response":"The strongest Muslim reply concedes the manuscripts and redirects. Textual stability since 600 AD is beside the point, because the corruption alleged is older than any of these witnesses. The originals of Moses and Jesus were lost or altered in the centuries before Qumran and Sinaiticus. So today's Bible faithfully transmits a text that had already gone wrong. IslamQA adds two supports. The Dead Sea Scrolls themselves show textual plurality, with variant editions of Jeremiah and Samuel. And the New Testament critical apparatus records hundreds of thousands of variants. That proves the transmission was human and fallible, not divinely guarded as the Quran's is claimed to be.","responseSource":{"name":"IslamQA — 'Have the Torah and Gospel Been Changed?'","url":"https://islamqa.info/en/answers/2001"},"rationale":"The redirect impales itself on the first horn. If the Bible was already corrupt centuries before Muhammad, then the Quran's commands to judge by it, its claim that the Torah 'with them' contains Allah's judgment, and its instruction to resolve doubt by asking its readers are all commendations of a corrupt book. The variant-plurality point is a category error. No Dead Sea Scroll and no New Testament variant tradition removes the crucifixion, the resurrection or divine sonship — the things the Quran needs absent. Those are textually secure across every manuscript stream. The manuscripts leave no window in which the required wholesale corruption could have happened.","plain":[{"t":"The question this settles","d":"If the Bible was changed, it happened at some point in time. Manuscripts let us check when. Muhammad received the Quran between 610 and 632 AD. So the question is simple. What did the Bible look like before then?"},{"t":"What survives from before Muhammad","d":"The Dead Sea Scrolls were copied between about 250 BC and 70 AD. They include the complete Great Isaiah Scroll, from about 125 BC, with Isaiah 53 intact. The Septuagint, the Greek Old Testament, is older still — the 3rd to 2nd century BC. Codex Sinaiticus and Codex Vaticanus date to the mid-300s AD. Each holds the whole New Testament, or nearly all of it."},{"t":"What that means","d":"These copies predate Muhammad by 250 to 900 years. They are the base of the modern critical editions. So the Bible read in 600 AD is in substance the Bible read today. There is no window left for a later rewrite."},{"t":"The best Muslim reply","d":"IslamQA grants the manuscripts and moves the date. The corruption, they say, is older than any of these copies. The books of Moses and Jesus were altered long before Qumran or Sinaiticus. They add two things. The Scrolls show variety, with different editions of Jeremiah and Samuel. And the New Testament has hundreds of thousands of variants."},{"t":"How strong is this argument?","d":"Strong for you, because the reply falls into the first trap. If the Bible was already corrupt, the Quran told people to judge by a corrupt book. And no variant in any manuscript removes the crucifixion, the resurrection or the divine Son. Those are secure across every copy we have."},{"say":true,"t":"What to say","d":"\"Which century do you think the change happened in? We can look at copies from before it.\""}],"rewritten":true,"refwhy":{"Isaiah 53:5-6":"Found whole in the Great Isaiah Scroll, copied about 125 BC. The proof this text is old.","Quran 5:48":"Says the Quran confirms the Scripture before it and watches over it. It assumes that book exists.","Quran 10:94":"The 'ask those who read the Scripture' verse. It only works if their copies were sound."},"titleLong":"The manuscripts close the trap: the Bible of 600 AD is the Bible of today"},
{"id":"crucifixion-denial-vs-history","category":"jesus-cross","severity":"high","verdict":"unrefuted","featured":true,"title":"Quran 4:157 denies the crucifixion, 600 years later","claim":"Quran 4:157 says of the Jews: 'they did not kill him, nor did they crucify him; but another was made to resemble him to them.' That is a single verse, composed about 600 years after the event and more than a thousand kilometres away. All four gospels report the event. So does a pre-Pauline creed dated to within a few years of it (1 Corinthians 15:3-8). So do two non-Christian historians: Josephus (Antiquities 18.3.3) and Tacitus (Annals 15.44). Critical historians across the spectrum treat it as bedrock. Bart Ehrman, an agnostic, writes: 'One of the most certain facts of history is that Jesus was crucified on orders of the Roman prefect of Judea, Pontius Pilate.' Gerd Lüdemann, an atheist, writes: 'The fact of the death of Jesus as a consequence of crucifixion is indisputable.' No case for the denial rests on historical method. It rests only on the Quran's authority.","quran":["Quran 4:157","Quran 4:158"],"hadith":[],"bible":["1 Corinthians 15:3-8","Mark 15:24-39","John 19:16-30","Luke 23:33-46"],"sources":[{"name":"Reformed Faith & Practice (RTS journal) — Islam's Denial of Jesus' Crucifixion","type":"scholarly","url":"https://journal.rts.edu/article/it-was-made-to-appear-like-that-to-them-islams-denial-of-jesus-crucifixion-in-the-quran-and-dogmatic-tradition/"},{"name":"Berkeley Institute for Islamic Studies — The Crucifixion of Christ in Islam","type":"scholarly","url":"https://bliis.org/essay/the-crucifixion-of-christ-in-islam/"},{"name":"Quran.com — Surah An-Nisa 4:157","type":"primary","url":"https://quran.com/4/157"},{"name":"Stand to Reason — The Quran Gets Crucifixion Wrong","type":"apologetics","url":"https://www.str.org/w/the-quran-gets-crucifixion-wrong"}],"response":"The classical Sunni answer is substitution. Allah cast Jesus's likeness onto another — Judas, Simon of Cyrene, or a volunteer disciple, depending on the tafsir. That man was crucified while Allah raised Jesus alive (4:158). 'It was made to appear so to them' explains exactly why every observer, and so every historical record, honestly reports a crucifixion. A miracle escapes historical method by definition. The Ahmadiyya hold instead that Jesus survived the cross. And a minority scholarly stream, documented by Todd Lawson and argued by Mahmoud Ayoub, reads 4:157 as denying only the Jews' boast of agency: they did not kill him, God's plan prevailed. On that reading the event itself is left neither affirmed nor denied.","responseSource":{"name":"About Islam — 'If Jesus Wasn't Crucified… Then Who Was?'","url":"https://aboutislam.net/counseling/ask-about-islam/jesus-between-crucifixion-and-who-was-crucified/"},"rationale":"Substitution cannot be falsified, by design. It concedes all the evidence and overrides it with an unwitnessed miracle attested six centuries later. That is an abandonment of historical argument, not an answer to one. It also makes God the author of the deception that founded Christianity. The Lawson and Ayoub reading is the strongest move, because it stops denying the event. But it rescues the Quran by surrendering the traditional Islamic claim. Read traditionally, 4:157 stands against the strongest evidence set in ancient history. There is no counter-evidence at all.","plain":[{"t":"What the verse says","d":"Quran 4:157 says of the Jews: <b>\"they did not kill him, nor did they crucify him; but another was made to resemble him to them.\"</b> Quran 4:158 says Allah raised Jesus to Himself. This is the sharpest disagreement between the two faiths."},{"t":"What stands against it","d":"The verse was written about 600 years later, over a thousand kilometres away. All four gospels report the crucifixion. So does a creed inside 1 Corinthians 15:3-8, dated within a few years of the event. So do two non-Christian historians: Josephus, in Antiquities 18.3.3, and Tacitus, in Annals 15.44."},{"t":"Even sceptical historians agree","d":"Bart Ehrman is an agnostic. He writes that <b>\"one of the most certain facts of history is that Jesus was crucified on orders of the Roman prefect of Judea, Pontius Pilate.\"</b> Gerd Lüdemann is an atheist. He writes that <b>\"the fact of the death of Jesus as a consequence of crucifixion is indisputable.\"</b>"},{"t":"The Muslim answer, at full strength","d":"Classical Sunni teaching says someone was substituted. Tafsir names Judas, Simon of Cyrene, or a volunteer disciple. That is why every witness honestly reported a crucifixion. A miracle escapes historical method by definition. The Ahmadiyya say instead that Jesus survived the cross. A smaller scholarly line, documented by Todd Lawson and Mahmoud Ayoub, reads 4:157 as denying only that the Jews achieved it."},{"t":"How strong is this argument?","d":"Strong for you, and there is no counter-evidence. Substitution cannot be tested, and it makes God the author of the mistake. The Lawson and Ayoub reading is the cleverest move, because it stops denying the event. But it saves the verse by giving up what Muslims have always claimed."},{"say":true,"t":"What to say","d":"\"Historians who do not believe in Jesus still agree he was crucified. Where would you start looking?\""}],"rewritten":true,"refwhy":{"1 Corinthians 15:3-8":"Holds a creed dated within a few years of the death. This is the earliest evidence here.","Mark 15:24-39":"Mark's account of the death. It ends with the soldier at the cross.","John 19:16-30":"John's account, closing with 'It is finished'. The fourth witness to one death.","Luke 23:33-46":"Luke's account, with the words spoken from the cross. The second of four reports.","Quran 4:157":"The denial itself. 'They did not kill him, nor did they crucify him.' All of this answers that.","Quran 4:158":"Says Allah raised him up. This is what the Quran puts in place of the death."},"titleLong":"Quran 4:157 denies the best-attested fact of Jesus's life"},
{"id":"quran-jesus-resume","category":"jesus-cross","severity":"medium","verdict":"contested","title":"The Quran's Jesus is sinless; its Muhammad is not","claim":"The Quran gives Jesus a profile it gives no one else, including Muhammad. He is virgin-born (3:47). He is 'the Messiah, Jesus son of Mary, distinguished in this world and the Hereafter' (3:45). He is announced as 'a pure boy', that is, sinless (19:19). He works miracles, healing the blind and the leper and raising the dead (3:49; 5:110). He never dies; 'Allah raised him to Himself', so he is alive in heaven now (4:158). In Islamic eschatology he returns at the end of the age (Sahih al-Bukhari 3448). Muhammad, by contrast, is commanded to 'ask forgiveness for your sin' (47:19; 48:2), performs no miracle in the Quran, and is dead in Medina. Every data point the Quran itself supplies points to Jesus's uniqueness — and then forbids the conclusion they suggest.","quran":["Quran 3:45","Quran 3:47","Quran 3:49","Quran 5:110","Quran 19:19","Quran 4:158","Quran 47:19","Quran 48:2","Quran 3:59"],"hadith":["Sahih al-Bukhari 3448"],"bible":["Luke 1:34-35","John 11:43-44","Hebrews 4:15","Acts 1:9-11"],"sources":[{"name":"Quran.com — Surah Al-Imran 3:45-49","type":"primary","url":"https://quran.com/3/45-49"},{"name":"Catholic Answers — Exposing the 'Muslim Jesus'","type":"apologetics","url":"https://www.catholic.com/magazine/print-edition/exposing-the-muslim-jesus"},{"name":"John Gilchrist — 'The Virgin Birth' (Christ in Islam and Christianity)","type":"apologetics","url":"https://www.answering-islam.org/authors/gilchrist/jesus/chapter4.html"},{"name":"Sunnah.com — Sahih al-Bukhari 3448 (descent of the son of Mary)","type":"primary","url":"https://sunnah.com/bukhari:3448"}],"response":"The Quran heads off the inference itself: 'The example of Jesus with Allah is like that of Adam; He created him from dust, then said to him: Be, and he was' (3:59). A fatherless origin proves creative sovereignty, not divinity — otherwise Adam, who had no father and no mother, would be more divine still. Omar Suleiman of the Yaqeen Institute develops this reading. Every miracle in 3:49 carries the refrain bi-idhnillah, 'by Allah's permission', marking Jesus as an empowered servant rather than a source. His sinlessness and his ascension are honours Allah bestows on whom He wills, and prophets differ in gifts (2:253) without differing in nature. Jesus's greatness is affirmed exactly as the second greatest of servants — never as God's son, a title he himself will disown (5:116-117).","responseSource":{"name":"Omar Suleiman (Yaqeen Institute) — reflection on Quran 3:59","url":"https://quranreflect.com/posts/325"},"rationale":"The Adam analogy and the bi-idhnillah refrain are genuine, coherent answers to the virgin birth and the miracles taken one at a time. This is Islam's best-drilled ground. But the analogy covers origin only. Adam sinned. Jesus is the only figure the Quran calls pure. He is never shown sinning, never recorded dying, and is titled al-Masih without that title ever being defined. He is stationed alive in heaven pending his return — while the Quran's final prophet is twice told to seek forgiveness for his sin. The cumulative asymmetry is unanswered as a whole, even though every part has a rehearsed reply. That is why this is contested rather than unrefuted, and a door-opener rather than a defeater.","plain":[{"t":"Collect what the Quran says about Jesus","d":"Born of a virgin (Quran 3:47). Called <b>\"the Messiah, Jesus son of Mary, distinguished in this world and the Hereafter\"</b> (3:45). Announced as a pure boy, meaning sinless (19:19). Healing the blind and the leper, and raising the dead (3:49; 5:110). Never dead, but raised to Allah (4:158). Returning at the end of the age (Sahih al-Bukhari 3448)."},{"t":"Now do the same for Muhammad","d":"The Quran tells him to ask forgiveness for his sin, twice (47:19; 48:2). He works no miracle in the Quran. He died in Medina and is buried there. That comparison is the Quran's own, not ours."},{"t":"The Muslim answer, at full strength","d":"This is Islam's best-drilled ground. Quran 3:59 says the case of Jesus is like Adam, created from dust by the word <i>Be</i>. Adam had no father and no mother, so a virgin birth shows power, not deity. Every miracle in 3:49 carries the phrase <i>bi-idhnillah</i>, by Allah's permission. Quran 2:253 says prophets differ in gifts, not in nature. Omar Suleiman of the Yaqeen Institute makes this case well. And Quran 5:116-117 has Jesus himself refuse the title."},{"t":"Where it still bites","d":"The Adam answer covers origin only. Adam sinned. Jesus is the one figure the Quran calls pure. He is never shown sinning, never recorded dying, and is alive in heaven now. He is titled <i>al-Masih</i>, Messiah, which the Quran never defines."},{"t":"How strong is this argument?","d":"Genuinely arguable, both ways. Each piece has a rehearsed reply. The whole pattern does not. Treat it as a door, not a defeater — it starts a conversation about Jesus rather than ending one."},{"say":true,"t":"What to say","d":"\"Why do you think God gave Jesus a record he gave to nobody else, including Muhammad?\""}],"rewritten":true,"refwhy":{"Luke 1:34-35":"The Gospel's virgin birth. Here the two books agree, which is why the case can start.","John 11:43-44":"Jesus raises Lazarus. The Gospel form of the raising Quran 3:49 grants him.","Hebrews 4:15":"Says Jesus was without sin. It is the Christian match for the Quran's 'pure boy'.","Acts 1:9-11":"He is taken up and promised back. Set this beside Quran 4:158 and the hadith on his return.","Quran 3:45":"Calls him 'the Messiah, Jesus son of Mary', held high in this world and the next.","Quran 3:47":"The virgin birth. Mary asks how she can have a son when no man has touched her.","Quran 3:49":"The miracles. He heals the blind and raises the dead, each time by Allah's leave.","Quran 5:110":"The same miracle list, told again later. A second witness inside the Quran.","Quran 19:19":"The angel promises 'a pure boy'. This is the line read as sinlessness.","Quran 4:158":"Says Allah raised him to Himself. The Quran records no death for Jesus.","Quran 47:19":"Tells Muhammad to ask forgiveness for his sin. This is half of the comparison.","Quran 48:2":"The second verse on forgiving Muhammad's sin. The pair is why the case says twice.","Quran 3:59":"Cuts against you. It is the Muslim reply's key verse: Jesus is like Adam, made from dust.","Sahih al-Bukhari 3448":"In Bukhari, the soundest Sunni collection. Jesus returns at the end of the age."},"titleLong":"Whose resume is that? What the Quran concedes about Jesus"},
{"id":"gospel-judgment-test","category":"torah-preservation","severity":"high","verdict":"unrefuted","title":"The Quran orders Christians to judge by the Gospel","claim":"The Quran creates a verification procedure and then fails it. Quran 10:94 tells Muhammad: 'If you are in doubt about what We have revealed to you, then ask those who have been reading the Scripture before you.' The Scripture-readers are the arbiters. Quran 5:47 commands: 'Let the People of the Gospel judge by what Allah has revealed therein', with a warning that whoever does not judge by it is 'defiantly disobedient'. Now run the test. The Gospel possessed by every People of the Gospel community in 632 AD was the fourfold Gospel, its text secured by Codex Sinaiticus and Codex Vaticanus two centuries earlier. Judging by that Gospel, as commanded, returns the verdict that Jesus was crucified, rose, and is the divine Son — a verdict against the book that issued the command.","quran":["Quran 10:94","Quran 5:47","Quran 5:46"],"hadith":[],"bible":["John 20:28-31","Mark 14:61-64","1 Corinthians 15:3-4","John 3:16"],"sources":[{"name":"Quranic Arabic Corpus — Quran 10:94","type":"primary","url":"https://corpus.quran.com/translation.jsp?chapter=10&verse=94"},{"name":"QuranX — classical tafsirs on 5:47","type":"primary","url":"https://quranx.com/tafsirs/5.47"},{"name":"The Islamic Dilemma (tract summarizing the argument)","type":"apologetics","url":"https://islamicdilemma.com/"},{"name":"Jesus to Muslims — Does the Qur'an refer to the Torah and the Gospel?","type":"apologetics","url":"https://jesustomuslims.org/reach-out/articles/does-quran-refer-torah-and-gospel"}],"response":"Classical tafsir handles both verses. Al-Tabari and Ibn Kathir read 10:94 as rhetorical: the address is formally to Muhammad but is really aimed at doubters. The ones to ask are the honest scholars of the Book, such as Abdullah ibn Salam, who recognised Muhammad foretold in their texts — not Christians at large on matters of doctrine. On 5:47, Islamweb fatwa 92519 argues the command is to judge by what Allah actually revealed in the Injil. That means the authentic core, including Muhammad's description and God's law, not every doctrine the church later layered on top. A command to use a book's genuine content is not an endorsement of its corruptions. And the Injil of the Quran is the revelation given to Jesus, not the four biographical Gospels written by others.","responseSource":{"name":"Islamweb — fatwa 92519 on judging by the Torah and Gospel","url":"https://www.islamweb.net/en/fatwa/92519/the-quran-ordering-the-jews-and-christians-to-judge-according-to-the-torah-and-the-gospel"},"rationale":"Each escape is circular. 'Ask only those who converted' filters the arbiters by agreement with the conclusion, which guts 10:94 as a test; the verse names no such filter and assumes the consulted Scripture is reliable. 'Judge by the authentic core' requires a criterion for which Gospel content is authentic, and the only criterion offered is agreement with the Quran — the book under test. And the 'real Injil' is historically empty. No 7th-century community called 'People of the Gospel' possessed any book but the fourfold Gospel. So 5:47's command has no possible referent except the text that refutes the Quran's Christology. The test stands as designed, and the Quran fails it.","plain":[{"t":"The Quran sets a test","d":"Quran 10:94 tells Muhammad: <b>\"If you are in doubt about what We have revealed to you, then ask those who have been reading the Scripture before you.\"</b> Quran 5:47 commands: <b>\"Let the People of the Gospel judge by what Allah has revealed therein.\"</b> Whoever does not is called defiantly disobedient."},{"t":"Now run the test","d":"In 632 AD every community called People of the Gospel held one thing. The fourfold Gospel. Its text is fixed by Codex Sinaiticus and Codex Vaticanus, two centuries earlier. Judge by that Gospel and it says Jesus was crucified, rose, and is the divine Son."},{"t":"The Muslim answer, at full strength","d":"Classical tafsir handles both verses. Al-Tabari and Ibn Kathir read 10:94 as aimed at doubters, not at Muhammad. The ones to ask are honest scholars of the Book, like Abdullah ibn Salam, who accepted Muhammad. On 5:47, Islamweb fatwa 92519 says judge by what Allah truly revealed in the Injil. That means its genuine core, not later church additions."},{"t":"Where that runs out","d":"Each escape needs the answer before the test. Filtering the judges down to those who already agree empties 10:94. The verse names no such filter. Judging by the genuine core needs a rule for which core is genuine. The only rule offered is agreement with the Quran, and that is the book being tested."},{"t":"How strong is this argument?","d":"Strong for you. No published answer holds. There was no other Gospel in Christian hands in 632 AD. So the command has one possible meaning, and the test returns a verdict against the book that set it."},{"say":true,"t":"What to say","d":"\"Quran 5:47 tells Christians to judge by the Gospel. May I show you what it says?\""}],"rewritten":true,"refwhy":{"John 20:28-31":"Thomas says 'My Lord and my God'. This is a verdict the test would return.","Mark 14:61-64":"Jesus answers the high priest and is condemned for it. The claim in his own mouth.","1 Corinthians 15:3-4":"The death and rising, in one short early creed. A second verdict the test returns.","John 3:16":"Names Jesus as God's only Son. The third thing judging by the Gospel yields.","Quran 10:94":"'Ask those who have been reading the Scripture before you.' The verse that sets the test.","Quran 5:47":"Tells the People of the Gospel to judge by it. Refusing is called disobedience.","Quran 5:46":"The verse just before. It says the Gospel was given with guidance and light."},"titleLong":"The test the Quran sets and fails: judge by the Gospel, ask its readers"},
{"id":"uthman-burning-companion-codices","category":"quran-text","severity":"medium","verdict":"admitted","title":"Uthman's order: burn every other Quran","claim":"The contrast between a perfectly preserved Quran and a corrupted Bible fails on Islam's own sources. Sahih al-Bukhari 4987 records that within about twenty years of Muhammad's death Muslims were 'differing about the Quran as the Jews and Christians differed about their Scripture'. So Caliph Uthman had one recension copied and ordered all other Quranic material, 'whether written in fragmentary manuscripts or whole copies, be burnt'. Companion codices differed. Early Islamic sources report that Ibn Masud's codex lacked Surahs 1, 113 and 114, and Bukhari 4977 preserves the dispute, while Ubayy ibn Ka'b's contained two extra surahs. Bukhari 4992 shows companions disputing recitations in Muhammad's own lifetime, resolved by the 'seven ahruf' concession. A text preserved by destroying its variant witnesses cannot indict the Bible for having variant witnesses that survived.","quran":["Quran 15:9"],"hadith":["Sahih al-Bukhari 4987","Sahih al-Bukhari 4992","Sahih al-Bukhari 4977"],"bible":[],"sources":[{"name":"Sunnah.com — Sahih al-Bukhari 4987 (Uthman's collection and burning order)","type":"primary","url":"https://sunnah.com/bukhari:4987"},{"name":"Sunnah.com — Sahih al-Bukhari 4977 (the mu'awwidhatayn questioned)","type":"primary","url":"https://sunnah.com/bukhari:4977"},{"name":"Keith E. Small, Textual Criticism and Qur'an Manuscripts (Lexington, 2011)","type":"scholarly","url":"https://en.wikipedia.org/wiki/Textual_Criticism_and_Qur%CA%BC%C4%81n_Manuscripts"},{"name":"Answering Islam — tahrif and preservation double standard","type":"apologetics","url":"https://www.answering-islam.org/Shamoun/tahrif.htm"}],"response":"The best Muslim scholarship, from Al-Azami and the Yaqeen Institute, argues this proves preservation rather than corruption. The Quran was revealed in seven ahruf, or modes, all divinely authorised, so companion differences were sanctioned variation and not error. Uthman's standardisation was done by a committee of memorisers cross-checking against Hafsa's master copy, with community consensus, and it eliminated only unauthorised or abrogated readings before drift could set in. That is the opposite of the Bible's uncontrolled copying. Living mass memorisation, tawatur, carried the text alongside the writing. And Yaqeen's analysis finds that fewer than 4% of variant readings attributed to companions even have authentic chains.","responseSource":{"name":"Yaqeen Institute — 'The Uthmanic Codex: Understanding How the Quran was Preserved'","url":"https://yaqeeninstitute.org/read/paper/the-uthmanic-codex-understanding-how-the-quran-was-preserved"},"rationale":"Every fact in the claim sits in Sahih al-Bukhari itself — the differing recitations, the burning order, the companion codex disputes. So the events are conceded, and only their interpretation is defended. The ahruf framework is a theological explanation, not a historical control. The ahruf themselves are undefined in the sources, the burned material is unrecoverable by design, and 'the variants were all authorised' cannot be tested once the witnesses are ash. The narrow point survives every response. The Quran's uniformity is the product of a documented 7th-century editorial intervention, which forfeits the dawah contrast with a Bible whose variant manuscripts were preserved and can be openly compared.","plain":[{"t":"The comparison this undoes","d":"Dawah often draws one contrast. A perfectly preserved Quran against a corrupted Bible. This case uses only Sahih al-Bukhari, Islam's most trusted hadith collection."},{"t":"What Bukhari records","d":"Within about twenty years of Muhammad's death, Muslims were differing about the Quran <b>\"as the Jews and Christians differed about their Scripture\"</b> (Sahih al-Bukhari 4987). Caliph Uthman had one version copied. He then ordered all other Quranic material burnt, <b>\"whether written in fragmentary manuscripts or whole copies.\"</b>"},{"t":"The copies that were destroyed","d":"Early Islamic sources say Ibn Masud's codex lacked Surahs 1, 113 and 114. Sahih al-Bukhari 4977 preserves that dispute. Ubayy ibn Ka'b's copy held two extra surahs. Sahih al-Bukhari 4992 shows companions arguing over recitation in Muhammad's own lifetime, settled by the seven <i>ahruf</i> concession."},{"t":"The Muslim answer, at full strength","d":"Al-Azami and the Yaqeen Institute make a serious case. The Quran came in seven <i>ahruf</i>, or modes, all revealed. So the differences were allowed variation, not error. Uthman's committee of memorisers checked against Hafsa's master copy, with the community's consent. Mass memorisation carried the text alongside writing. Yaqeen finds that under 4% of companion variant readings even have sound chains."},{"t":"How strong is this argument?","d":"They admit the events themselves. Only the meaning is argued. But \"the variants were all authorised\" cannot be checked once the witnesses are ash. The narrow point survives. The Quran's uniformity came from a 7th-century editorial act, and a Bible whose variants were kept can be compared openly."},{"say":true,"t":"What to say","d":"\"Why do you think Uthman needed to burn the other copies?\""}],"rewritten":true,"refwhy":{"Quran 15:9":"The preservation promise Muslims cite. Allah sent the Reminder and will guard it.","Sahih al-Bukhari 4987":"The burning order itself, in Bukhari. All other Quranic material was to be burnt.","Sahih al-Bukhari 4992":"In Bukhari. Men argue over how to recite, in the Prophet's own lifetime. He allows both, under the seven modes.","Sahih al-Bukhari 4977":"Preserves the row over Ibn Masud's copy. Evidence the companions' texts differed."},"titleLong":"Uthman's bonfire: the Quran's own standardization crisis"},
{"id":"sanaa-palimpsest-qiraat","category":"quran-text","severity":"medium","verdict":"contested","title":"Sanaa: a Quran scraped clean and rewritten","claim":"Physical and living evidence confirms that the Quran has textual plurality. The Sanaa palimpsest was found in 1972 in the Great Mosque of Sanaa, and its parchment is radiocarbon-dated to the 7th century. Its lower, erased text differs from the Uthmanic standard in wording and surah order. It is the only surviving non-Uthmanic text tradition, and it matches the reports of companion codices. Today the Quran is printed in multiple canonical readings, the qira'at. The Hafs text is used by most of the world; the Warsh text is used across North and West Africa. They differ in hundreds of places, mostly minor, but some changing meaning — Quran 3:146 reads qatala, 'fought', or qutila, 'was killed'. Keith Small's manuscript study concludes that an early edited form of the consonantal text is recoverable, but the original forms of the text are not. 'Not one dot has changed' is a dawah slogan, not a manuscript finding.","quran":["Quran 15:9","Quran 3:146","Quran 2:132","Quran 19:19"],"hadith":["Sahih al-Bukhari 4992"],"bible":[],"sources":[{"name":"Sanaa manuscript (with Sadeghi & Goudarzi 2012 findings)","type":"scholarly","url":"https://en.wikipedia.org/wiki/Sanaa_manuscript"},{"name":"Keith E. Small, Textual Criticism and Qur'an Manuscripts","type":"scholarly","url":"https://en.wikipedia.org/wiki/Textual_Criticism_and_Qur%CA%BC%C4%81n_Manuscripts"},{"name":"Qira'at — canonical readings, Hafs/Warsh","type":"scholarly","url":"https://en.wikipedia.org/wiki/Qira'at"},{"name":"Sunnah.com — Sahih al-Bukhari 4992 (seven ahruf dispute)","type":"primary","url":"https://sunnah.com/bukhari:4992"}],"response":"The Yaqeen Institute treatment by Khatib and Khan, and Al-Azami's History of the Qur'anic Text, answer that the qira'at are not variants in the Western text-critical sense. They are parallel revealed recitations within the ahruf. All were mass-transmitted from the Prophet. All fit the Uthmanic skeleton, and all are doctrinally identical. Differences like qatala and qutila enrich meaning without contradiction. Bible variants can affect whole passages, such as Mark 16 and John 7:53-8:11. The Sanaa lower text is explained as a companion's personal or pre-canonical copy, properly washed and superseded. That shows the community enforcing the standard exactly as the preservation promise in 15:9 implies.","responseSource":{"name":"Yaqeen Institute — 'The Origins of the Variant Readings of the Qur'an'","url":"https://yaqeeninstitute.org/read/paper/the-origins-of-the-variant-readings-of-the-quran"},"rationale":"Honest grading cuts both ways. Against the dawah slogan the claim wins: multiple printed texts with real wording differences exist today, the Sanaa lower text is a physically extant non-Uthmanic Quran, and academic study confirms early editing. So 'letter-perfect, unlike the Bible' is false as stated. But against academic standards the Quran's transmission is genuinely tight. Behnam Sadeghi published the Sanaa findings with Mohsen Goudarzi in 2012. He himself argues that the Uthmanic text substantially reflects the Prophet's recitation. And the qira'at differences are far smaller than the rhetoric suggests. The double standard is exposed; wholesale corruption of the Quran is not shown. Use this entry to level the playing field, not to mirror the dawah overclaim in reverse.","plain":[{"t":"What was found at Sanaa","d":"In 1972 workers in the Great Mosque of Sanaa, Yemen, found old Quran manuscripts. One had been scraped clean and written over. Modern imaging recovered the lower layer. The parchment is radiocarbon-dated to the 7th century. Its wording and surah order differ from the standard text."},{"t":"What is in print today","d":"The Quran is printed in more than one canonical reading, called <i>qira'at</i>. The Hafs text is used almost everywhere. The Warsh text is used across North and West Africa. They differ in hundreds of places. Most are minor, but some change meaning — Quran 3:146 reads <i>qatala</i>, fought, or <i>qutila</i>, was killed."},{"t":"What a specialist concluded","d":"Keith Small studied the manuscripts closely. His finding is careful. An early edited form of the consonantal text can be recovered. The original forms of the text cannot. So \"not one dot has changed\" is a slogan, not a manuscript finding."},{"t":"The Muslim answer, at full strength","d":"Khatib and Khan at the Yaqeen Institute, and Al-Azami, answer this well. The <i>qira'at</i> are parallel revealed recitations, not variants in the Western sense. All fit the Uthmanic skeleton and all were mass-transmitted. None changes doctrine, unlike Mark 16 or John 7:53-8:11. The Sanaa lower text was a personal or pre-canonical copy, washed once it was superseded."},{"t":"How strong is this argument?","d":"It cuts both ways, and say so. Against the slogan, it wins. Against academic standards, the Quran's transmission is genuinely tight — Behnam Sadeghi himself argues the Uthmanic text largely reflects Muhammad's recitation. Use it to level the ground, not to overclaim in reverse."},{"say":true,"t":"What to say","d":"\"Have you ever compared a Hafs and a Warsh Quran side by side? I would like to see it with you.\""}],"rewritten":true,"refwhy":{"Quran 15:9":"The verse the Muslim reply rests on. Allah sent the Reminder and will guard it.","Quran 3:146":"The clearest reading that changes sense. Either 'fought' or 'was killed', by one dot.","Quran 2:132":"A known place where the Hafs and Warsh printings use a different form of the verb.","Quran 19:19":"Another split reading. The angel says either 'that I may give' or 'that He may give'.","Sahih al-Bukhari 4992":"The seven modes hadith, in Bukhari. It is Islam's own answer for why readings differ."},"titleLong":"Sanaa's lower text and the ten readings: one Quran, which one?"},
{"id":"trinity-father-jesus-mary","category":"doctrine-of-god","severity":"high","verdict":"contested","title":"Quran 5:116 names Mary; no creed ever did","claim":"Quran 5:116 has Allah interrogate Jesus: 'Did you say to people, take me and my mother as two gods besides Allah?' It is the only place the Quran names the members of the godhead it rejects. It names Mary, not the Holy Spirit. No orthodox Christian creed, East or West, ever included Mary in the Trinity. The critique runs like this. An all-knowing author would refute what the Nicene church confessed: one Being, three Persons — Father, Son and Holy Spirit. Refuting a triad that includes Mary instead looks like a human author reflecting garbled or folk Christianity in 7th-century Arabia. Quran 5:75 points the same way, arguing that Jesus and Mary 'both ate food', which pairs them as the two venerated creatures.","quran":["Quran 5:116","Quran 5:75","Quran 4:171"],"hadith":[],"bible":["Matthew 28:19","2 Corinthians 13:14","John 1:1-3"],"sources":[{"name":"Gabriel Said Reynolds, The Quran and the Bible (2018 commentary on 5:116)","type":"scholarly","url":"https://en.wikipedia.org/wiki/Gabriel_Said_Reynolds"},{"name":"Sam Shamoun, 'The Quran and the Holy Trinity' (Answering Islam)","type":"apologetics","url":"https://answering-islam.org/Shamoun/quran_trinity.htm"},{"name":"WikiIslam — 'Parallelism: Quranic Version of Trinity' (surveys Reynolds, Griffith, Sirry)","type":"journalism","url":"https://wikiislam.net/wiki/Parallelism:_Quranic_Version_of_Trinity"},{"name":"Islamic Awareness — 'Mary, A Part Of Trinity?'","type":"muslim","url":"https://www.islamic-awareness.org/quran/contrad/external/marytrin"}],"response":"There are two levels to the answer, and the second is stronger. The popular one says the verse addresses a real heresy: Epiphanius, who died in 403, describes the Collyridians, Arabian women who offered cakes to Mary as a goddess. On that reading the Quran corrects them, not Nicaea. The academic answer, used by Gabriel Said Reynolds, Sidney Griffith, Mun'im Sirry and David Thomas, is that 5:116 is not a doctrinal report at all. It is eschatological rhetoric. It warns against the drift toward excessive veneration of Jesus and Mary. That drift was visible in icons and in 'Theotokos' devotion. It gives examples of shirk rather than defining the Trinity.","responseSource":{"name":"Islamic Awareness — 'Mary, A Part Of Trinity?'; David Thomas and Mun'im Sirry","url":"https://www.islamic-awareness.org/quran/contrad/external/marytrin"},"rationale":"The rhetorical-warning reading is a genuine steelman with mainstream academic backing, so 'strawman, full stop' overclaims. But that steelman has costs Muslims rarely price in. There is no evidence the Collyridians existed in 7th-century Hijaz; the sect is attested once, 250 years earlier. Much of the classical tafsir tradition read 5:116 as what Christians actually believed, so the rhetoric-only reading is partly a modern retreat. And even granting the rhetoric, one gap remains. The Quran nowhere states the actual formula — Father, Son and Spirit, one essence — in order to refute it. A book claiming divine omniscience, sent to correct Christians, never once describes correctly the doctrine it condemns. That silence is the enduring point.","plain":[{"t":"What the verse asks","d":"Quran 5:116 has Allah question Jesus: <b>\"Did you say to people, take me and my mother as two gods besides Allah?\"</b> This is the only place the Quran names the members of the godhead it rejects. It names Mary, not the Holy Spirit."},{"t":"Why that matters","d":"No Christian creed has ever put Mary in the Trinity. Not in the East, not in the West, not once. Quran 5:75 also pairs Jesus and Mary as two who ate food — the two honoured creatures."},{"t":"The Muslim answer, at full strength","d":"There are two levels, and the second is much stronger. The popular one says the verse targets a real group. Epiphanius, who died in 403, describes the Collyridians, Arabian women who offered cakes to Mary as a goddess. The academic one is used by Gabriel Said Reynolds, Sidney Griffith, Mun'im Sirry and David Thomas. On that reading 5:116 is not a report of doctrine at all. It warns against excessive honour paid to Jesus and Mary, which was visibly practised."},{"t":"What that answer costs","d":"There is no evidence the Collyridians existed in 7th-century Arabia. The sect is attested once, 250 years earlier. Much classical tafsir read 5:116 as what Christians really believed. So the rhetoric-only reading is partly a modern retreat."},{"t":"How strong is this argument?","d":"Genuinely arguable. Saying \"strawman, full stop\" overclaims. But one point stands. The Quran never states the actual Trinity — one Being, three Persons — in order to answer it. That silence is what to press, gently."},{"say":true,"t":"What to say","d":"\"Christians have never believed Mary is part of the Trinity. Would you like me to tell you what we do believe?\""}],"rewritten":true,"refwhy":{"Matthew 28:19":"Names Father, Son and Holy Spirit. Mary is not one of the three, and never was.","2 Corinthians 13:14":"A second three-fold line: Christ, God, and the Holy Spirit. Again no Mary.","John 1:1-3":"The Word was God, and all was made by him. Useful for saying what we do hold.","Quran 5:116":"The verse this case turns on. 'Take me and my mother as two gods besides Allah.'","Quran 5:75":"Says the Messiah and his mother both ate food. It pairs the same two figures again.","Quran 4:171":"The other Trinity verse. It says 'do not say Three' but never names the three."},"titleLong":"Does the Quran think the Trinity is Father, Jesus, and Mary?"},
{"id":"trinity-third-of-three","category":"doctrine-of-god","severity":"medium","verdict":"contested","title":"'Third of three': a heresy Christians also reject","claim":"Quran 5:73 condemns those who say 'Allah is the third of three' — thalithu thalatha — and 4:171 commands 'do not say Three'. Orthodox Trinitarian teaching has never asserted that God is one of three gods. The Athanasian formula is explicit: 'not three Gods, but one God'. 'Third of three' describes tritheism, a position the church condemns as heresy. So the Quran anathematises a numerical polytheism that Christians also anathematise, while never engaging the actual claim: one divine Being eternally existing as three Persons.","quran":["Quran 5:73","Quran 4:171"],"hadith":[],"bible":["Deuteronomy 6:4","Mark 12:29","1 Corinthians 8:6","Matthew 28:19"],"sources":[{"name":"Sidney Griffith, The Bible in Arabic (on 'thalith thalatha' as possibly a Syriac epithet)","type":"scholarly","url":"https://press.princeton.edu/books/paperback/9780691168081/the-bible-in-arabic"},{"name":"Sam Shamoun, 'The Quran and the Holy Trinity'","type":"apologetics","url":"https://answering-islam.org/Shamoun/quran_trinity.htm"},{"name":"IslamQA 243142 — the Trinity the Quran declares false","type":"muslim","url":"https://islamqa.info/en/answers/243142/"}],"response":"The strongest reply has three parts. First, 'third of three' may render Syriac Christian usage. Sidney Griffith notes that some Syriac texts call Christ thlithaya, one of three, so the Quran may echo actual Arabic-Christian speech rather than misdescribe the doctrine. Second, whatever the creeds say, worshipping three distinct persons is in practice indistinguishable from three gods; IslamQA 243142 refuses the metaphysical fine print and rejects the arithmetic at its root. Third, Shabir Ally argues the verse targets what ordinary Christians effectively believed, and that the 'one essence' defence is philosophically incoherent anyway, so refuting 'three' is sufficient.","responseSource":{"name":"IslamQA 243142; Shabir Ally (Let the Quran Speak) on 5:73","url":"https://islamqa.info/en/answers/243142/"},"rationale":"If 'third of three' echoes a Syriac title of Christ, the phrase has a defensible pedigree, and 'your maths is still three' is a coherent if blunt polemical stance. But the Muslim defence concedes the core observation. The Quran refutes the Trinity only in a form Christians themselves anathematise, and never once states the actual claim in order to answer it. The Christian can fairly say: my belief has never been addressed by the Quran, only a caricature adjacent to it. The 'deliberate simplification' defence is possible but unevidenced, and it is equally consistent with an author who knew Christianity only through popular report.","plain":[{"t":"What the Quran condemns","d":"Quran 5:73 condemns those who say Allah is <b>\"the third of three\"</b> — in Arabic, <i>thalithu thalatha</i>. Quran 4:171 says plainly: do not say Three."},{"t":"Christians condemn it too","d":"Three gods is tritheism. The church has always called it heresy. The Athanasian formula is explicit: not three Gods, but one God. So the Quran here rejects something Christians also reject."},{"t":"The Muslim answer, at full strength","d":"There are three replies, and they are not weak. Sidney Griffith notes that some Syriac Christians called Christ <i>thlithaya</i>, one of three. So the phrase may echo real Arab Christian speech. IslamQA 243142 argues that worshipping three persons is in practice the same as three gods. Shabir Ally adds that the one-essence defence is incoherent anyway, so refuting three is enough."},{"t":"What the reply concedes","d":"Even at its best it grants the observation. The Quran answers the Trinity only in a form Christians curse. It never states the real claim: one divine Being, eternally three Persons. A Christian can fairly say his belief has not been addressed."},{"t":"How strong is this argument?","d":"Genuinely arguable, and useful either way. It is not a knockout. It is a way to be understood. Most Muslims have never heard the doctrine stated properly, and this is your chance."},{"say":true,"t":"What to say","d":"\"I agree with Quran 5:73 — God is not one of three. Can I tell you what we actually mean?\""}],"rewritten":true,"refwhy":{"Deuteronomy 6:4":"'The LORD our God is one LORD.' Christians hold this too, so three gods is not our claim.","Mark 12:29":"Jesus quotes that same line as the first commandment. Use it when a Muslim assumes you deny it.","1 Corinthians 8:6":"Paul says one God and one Lord in one breath, with Jesus inside the sentence.","Matthew 28:19":"The three names in one baptism formula. This is the belief Quran 5:73 does not describe.","Quran 5:73":"Condemns those who say Allah is 'the third of three'. The whole case is about this line.","Quran 4:171":"'Do not say Three.' The other half of the Quran's rejection."},"titleLong":"'Allah is the third of three' — tritheism, not the Trinity"},
