{"id":"women-testimony-inheritance","title":"Half a witness, half an heir: women's legal standing in Islam's own texts","category":"practice","claim":"Quran 2:282 requires two women to replace one male witness 'so that if one errs, the other can remind her,' and 4:11 fixes a daughter's inheritance at half a son's. Muhammad drew the theological conclusion himself: 'Is not the witness of a woman equal to half that of a man?... This is because of the deficiency of a woman's mind' (Sahih al-Bukhari 2658), and in Bukhari 304 declares women 'deficient in intelligence and religion' and 'the majority of the dwellers of Hell-fire.' These are not fringe readings — classical fiqh built evidentiary and inheritance law on them, and they remain live in sharia codes today. Scripture's trajectory is different in kind: male and female are jointly God's image (Genesis 1:27), the risen Christ's first commissioned witnesses were women (Luke 24:9-11) — legally worthless testimony in that culture, preserved anyway — and in Christ 'there is no male and female' (Galatians 3:28).","quran":["Quran 2:282","Quran 4:11","Quran 4:34"],"hadith":["Sahih al-Bukhari 2658","Sahih al-Bukhari 304"],"bible":["Genesis 1:27","Luke 24:9-11","Galatians 3:28","Proverbs 31:10-31"],"sources":[{"name":"Sahih al-Bukhari 2658","type":"primary","url":"https://sunnah.com/bukhari:2658"},{"name":"Sahih al-Bukhari 304","type":"primary","url":"https://sunnah.com/bukhari:304"},{"name":"Wikipedia — Status of women's testimony in Islam","type":"institutional","url":"https://en.wikipedia.org/wiki/Status_of_women%27s_testimony_in_Islam"},{"name":"IslamQA 111867 — Meaning of the lack in reason and religion in women","type":"muslim","url":"https://islamqa.info/en/answers/111867"},{"name":"Quran 2:282 (text)","type":"primary","url":"https://quran.com/2/282"}],"response":"IslamQA and classical commentators explain the 'deficiency' as domain-specific, not essential: the testimony rule concerns financial contracts women then rarely handled, so a second woman guards against inexperience-driven error; the religion 'deficiency' refers only to exemption from prayer and fasting during menstruation — an excused, not culpable, lack. Inheritance halves reflect economics, not worth: men bear mandatory financial responsibility for women (mahr, full family maintenance), so a sister's unencumbered half can exceed a brother's encumbered whole. Modern Muslim scholars add that 2:282 is context-bound commercial procedure, noting other testimony contexts where a woman's word stands alone (24:6-9).","responseSource":{"name":"IslamQA 111867","url":"https://islamqa.info/en/answers/111867"},"verdict":"admitted","rationale":"The texts and their operative legal force are undisputed — the defenses reinterpret motive, not content. And the softening glosses collide with the sources themselves: Bukhari 2658 grounds the testimony rule in 'deficiency of mind,' not commercial inexperience, and the economics defense does not touch 'majority of the dwellers of Hell-fire.' Classical fiqh applied the half-witness rule far beyond finance, and states applying sharia apply it now. Because the substance is affirmed by Islam's most authentic hadith and mainstream fatwa bodies, this is admitted; the honest debate is only over whether the arrangement is demeaning, which the texts' own stated rationale settles.","severity":"high"},
{"id":"fatiha-daily-prayer-jews-christians","title":"Seventeen times a day: the Fatiha and 'those who earned wrath... those astray'","category":"practice","claim":"Every observant Muslim recites Surah al-Fatiha in each unit of the five daily prayers — at minimum seventeen times daily — closing with a plea to be guided in the path of those God favored, 'not of those who have earned anger, nor of those who go astray' (1:7). Muhammad himself identified the referents: 'Those who have earned the anger are the Jews, and those who are led astray are the Christians' (Jami at-Tirmidhi 2954, graded hasan; from Adi ibn Hatim). Ibn Kathir records that 'the scholars of tafsir' held this view, citing broad early consensus, and it stands in Tafsir al-Jalalayn and mainstream Salafi teaching today. The world's second-largest religion thus liturgically defines itself, dozens of times a day, against Jews and Christians by name. Contrast the New Testament's posture toward those outside: 'love your enemies and pray for them' (Matthew 5:44) and Paul's 'my heart's desire and prayer to God for them is that they may be saved' (Romans 10:1).","quran":["Quran 1:7"],"hadith":["Jami at-Tirmidhi 2954"],"bible":["Matthew 5:44","Romans 10:1"],"sources":[{"name":"Tafsir Ibn Kathir on al-Fatiha 1:7 (Quran.com)","type":"primary","url":"https://quran.com/en/al-fatihah/7/tafsirs/en-tafisr-ibn-kathir"},{"name":"Jami at-Tirmidhi 2954","type":"primary","url":"https://sunnah.com/tirmidhi:2954"},{"name":"Troid (Salafi) — Tafsir of al-Fatiha: the misguided and those who earned anger","type":"muslim","url":"https://www.troid.org/tafsir-surah-al-fatihah-the-misguided-and-those-who-have-earned-allahs-anger/"},{"name":"Reaching Muslim Peoples — Rethinking al-Maghdubi 'Alayhim","type":"apologetics","url":"https://www.reachingmuslimpeoples.com/post/rethinking-al-maghdoubi-alaihim-muslims-christians-jews-and-the-wrath-of-god"}],"response":"Many Muslim teachers argue the verse names categories, not ethnicities: 'those who earned anger' are all who know truth and abandon it, 'those astray' all who strive without knowledge — Jews and Christians appear in the hadith as historical exemplars, not exclusive targets, and Muslims who fit the descriptions are equally included. The prayer, they stress, is a positive petition for guidance, not a curse on anyone; nothing in it asks harm for Jews or Christians. Modern expositors (e.g., Najam Academy's treatment) note the Quran elsewhere commends righteous People of the Book (3:113-115), so 1:7 cannot be a blanket condemnation.","responseSource":{"name":"Najam Academy — Who are 'those who have earned God's anger'?","url":"https://najamacademy.com/who-are-those-who-have-earned-gods-anger-in-surah-fatiha/"},"verdict":"admitted","rationale":"The identification is Islam's own, from Muhammad's mouth in a hasan hadith, endorsed by Ibn Kathir as the view of 'the scholars of tafsir' — the categorical reading is the modern softening, not the classical mainstream. Graded admitted because the substance (the canonical exegesis names Jews and Christians) is affirmed within Islamic tradition itself; the defense that it is exemplary rather than exhaustive is genuine but does not remove Jews and Christians from the referent — it universalizes the condemnation while keeping them as its archetypes. For evangelism the point is posture: daily self-definition against the biblical communities versus daily intercession for the lost.","severity":"medium"},
{"id":"hadith-chain-of-custody","title":"The hadith dilemma: Islam's own chain-of-custody problem","category":"muhammad-test","claim":"Nearly everything Islam knows about Muhammad — how to pray, the five pillars' details, Aisha's age, the sira's events, the Quran's own compilation story — comes from hadith first written down generations after his death in 632. Bukhari (d. 870) reportedly sifted some 600,000 circulating reports and kept roughly 7,000 (with repetitions) as authentic — meaning the Muslim community itself generated fabrications on an industrial scale for two centuries. Western scholarship (Goldziher, Schacht, Juynboll) showed isnads were routinely improved and back-projected, with 'common links' suggesting many chains were fabricated wholesale. The dilemma for dawah: if hadith are unreliable, Islam cannot perform its own prayers, define its pillars, or narrate its prophet — and the Quran becomes an unmoored text with no context. If hadith are reliable, then Bukhari's reports — Aisha at nine, the bewitchment, Banu Qurayza, 'deficient in mind' — all stand. Meanwhile the Gospels were written within living memory of eyewitnesses, a fraction of the hadith gap.","quran":["Quran 16:44","Quran 33:21"],"hadith":["Sahih al-Bukhari 1","Sahih Muslim 1"],"bible":["Luke 1:1-4","1 Corinthians 15:3-8","2 Peter 1:16"],"sources":[{"name":"Wikipedia — Criticism of hadith","type":"institutional","url":"https://en.wikipedia.org/wiki/Criticism_of_hadith"},{"name":"IlmGate — Analyzing Schacht's theory and two of his critiques (Azami, Motzki)","type":"muslim","url":"https://www.ilmgate.org/analyzing-schachts-theory-and-two-of-his-critiques-azami-and-motzki/"},{"name":"ResearchGate — Hadith, Law, and Orientalism: a critical study of Schacht","type":"scholarly","url":"https://www.researchgate.net/publication/393097039_HADITH_LAW_AND_ORIENTALISM_A_CRITICAL_STUDY_OF_JOSEPH_SCHACHT'S_THEORETICAL_CONTRIBUTIONS"},{"name":"Jonathan Brown on historical criticism of Islamic primary texts","type":"muslim","url":"https://yousuf.blog/2018/02/09/dr-jonathan-brown-on-historical-criticism-of-islamic-primary-texts/"},{"name":"Kerr — Comparing methods (hadith criticism)","type":"scholarly","url":"https://kerrs.blog/posts/comparing-methods/"}],"response":"Muslim scholars answer that hadith science is history's most rigorous authentication system: transmitters were biographically vetted (ilm al-rijal), chains cross-checked, and mass-transmitted (mutawatir) reports are epistemically certain. Azami and Motzki showed Schacht's dating arguments overreach — early written records (sahifas of companions like Hammam ibn Munabbih) push documentation back near the eyewitness generation, and Motzki's isnad-cum-matn analysis authenticates material Schacht dismissed. Jonathan Brown argues the tradition itself catalogued fabrications and graded reports with a sophistication Western criticism only rediscovered. The 600,000 figure counts chain-variants, not distinct lies.","responseSource":{"name":"IlmGate — Azami and Motzki vs. Schacht","url":"https://www.ilmgate.org/analyzing-schachts-theory-and-two-of-his-critiques-azami-and-motzki/"},"verdict":"unrefuted","rationale":"The Muslim defense is serious scholarship, but it sharpens rather than escapes the dilemma — every rehabilitation of hadith reliability re-authenticates Bukhari's most damaging contents, which the same apologists elsewhere minimize. Conversely, every appeal to fabrication, context, or weak chains against those reports saws off the branch Islamic practice sits on. The asymmetry with the New Testament is quantitative and qualitative: 25-60 years versus 150-250, continuous written transmission versus memorized chains, and hostile-witness-checkable public events. As a structured dilemma — parallel to the app's tahrif centerpiece — it has no published Muslim resolution that keeps both consistency and orthodoxy.","severity":"high"},
{"id":"mariya-hafsa-surah-66","title":"Mariya, Hafsa, and Surah 66: an oath annulled by revelation","category":"muhammad-test","claim":"Surah 66 opens with Allah rebuking Muhammad: 'O Prophet, why do you prohibit what Allah has made lawful for you, seeking the approval of your wives?' (66:1), then dissolves his oath (66:2) and warns his wives that if he divorces them Allah will give him better ones (66:5). Sunan an-Nasa'i 3959 — graded sahih by al-Albani — supplies the occasion: Muhammad 'had intercourse with' his slave woman (identified in tafsir as Mariya the Copt) in Hafsa's quarters or on her day; Aisha and Hafsa pressed him until he swore Mariya forbidden to himself, whereupon revelation descended freeing him from the oath. An alternative sahih occasion (Bukhari 4912) involves only honey. Either way the structure matches the Zaynab pattern the app already covers: heaven intervenes, promptly and specifically, to release Muhammad from a domestic bind and side with his desires — precisely what Aisha noted dryly ('your Lord hastens to fulfill your wishes').","quran":["Quran 66:1-5"],"hadith":["Sunan an-Nasa'i 3959","Sahih al-Bukhari 4912"],"bible":["Numbers 30:2","Matthew 5:33-37","James 5:12"],"sources":[{"name":"Sunan an-Nasa'i 3959","type":"primary","url":"https://sunnah.com/nasai:3959"},{"name":"Sahih al-Bukhari 4912 (honey account)","type":"primary","url":"https://sunnah.com/bukhari:4912"},{"name":"Wikipedia — At-Tahrim","type":"institutional","url":"https://en.wikipedia.org/wiki/At-Tahrim"},{"name":"Ask Ghamidi — the Mariya narration discussed","type":"muslim","url":"https://ask.ghamidi.org/forums/discussion/85181/"}],"response":"Muslim scholars overwhelmingly prefer the honey account in Bukhari and Muslim as the surah's occasion: Aisha herself narrates a jealous scheme about a honey drink at Zaynab's house, and the strongest-authenticated report should fix the context. The Mariya narrations, they argue, are aberrant (shadhdh) or conflated later reconstructions, and even if some chain is technically sound, occasion-of-revelation reports are notoriously fluid. On the substance: the surah shows Muhammad's humanity and Allah's correction — he is rebuked, not indulged — and the principle established (one may not make the lawful unlawful by oath) is sober jurisprudence, with expiation prescribed (66:2), matching Quran 5:89.","responseSource":{"name":"Ask Ghamidi — Narration on Mariya and Surah 66","url":"https://ask.ghamidi.org/forums/discussion/85181/"},"verdict":"contested","rationale":"Graded contested honestly: the honey narration is the better-attested occasion, and Christians should not overclaim the Mariya version — though al-Albani's sahih grading of Nasa'i 3959 means Muslims cannot simply wave it away either. But even on the most favorable Muslim reading, the pattern stands on the Quran's face: a chapter of eternal scripture devoted to Muhammad's harem friction, dissolving his oath, and threatening his wives with replacement (66:5). Combined with 33:37 and 33:50-51 (already in the app), it exhibits revelation repeatedly bending toward the prophet's personal convenience — the cumulative case, not the single incident, carries the evangelistic weight.","severity":"medium"},
{"id":"safiyya-khaybar-marriage","title":"Safiyya of Khaybar: bride of the man who killed her husband — that week","category":"muhammad-test","claim":"At Khaybar (628 AD), the Muslims killed Kinana ibn al-Rabi, husband of the seventeen-year-old Jewish noblewoman Safiyya bint Huyayy — Ibn Ishaq adds that Kinana was first tortured with fire to reveal treasure, then beheaded (Guillaume, p. 515). Her father had already been executed with Banu Qurayza. Safiyya was taken captive, initially allotted to Dihya al-Kalbi, then reassigned to Muhammad (Sahih al-Bukhari 4200). Sahih al-Bukhari 371 records that Muhammad consummated the marriage on the journey home, at Sidd as-Sahba, days after her husband's death — the companions wondering aloud whether she was wife or concubine. Islamic sources present this as honor; the plain sequence is: kill a woman's husband and father, and marry her within the week, with no possibility of free consent and the mourning-period (idda) rules set aside. Set this against the biblical prophet-test: 'by their fruits you will know them' (Matthew 7:16).","quran":["Quran 33:50"],"hadith":["Sahih al-Bukhari 371","Sahih al-Bukhari 4200"],"bible":["Matthew 7:15-20","2 Samuel 11:26-27; 12:9","1 Thessalonians 4:3-5"],"sources":[{"name":"Sahih al-Bukhari 371","type":"primary","url":"https://sunnah.com/bukhari:371"},{"name":"Sahih al-Bukhari 4200","type":"primary","url":"https://sunnah.com/bukhari:4200"},{"name":"Guillaume, The Life of Muhammad (Ibn Ishaq)","type":"primary","url":"https://archive.org/details/GuillaumeATheLifeOfMuhammad"},{"name":"WikiIslam — Safiyah","type":"apologetics","url":"https://wikiislam.net/wiki/Safiyah"},{"name":"Answering Islam — Muhammad and Safiyya: disregarding the idda","type":"apologetics","url":"https://www.answering-islam.org/Muhammad/Inconsistent/idda_safiyyah.html"}],"response":"Muslim writers respond that Safiyya was honored, not violated: Muhammad freed her, made emancipation her mahr, and elevated a captive to Mother of the Believers; later reports show her expressing love for him and defending him. Kinana died, they argue, for breaching Khaybar's surrender terms by hiding treasure — a treaty violation, with the torture detail resting on Ibn Ishaq's chainless report, not sahih hadith. Her marriage protected her from ordinary captivity in a world where a defeated noblewoman had no better outcome. The consummation followed her purification (istibra), satisfying the applicable waiting rule for captives, and Al Hakam argues her consent is explicitly recorded.","responseSource":{"name":"Al Hakam — Did Muhammad force Safiyya into marriage?","url":"https://www.alhakam.org/islam-today-did-prophet-muhammad-force-safiyya-bint-huyayy-into-marriage-after-killing-her-father"},"verdict":"admitted","rationale":"The core sequence — husband killed at Khaybar, Safiyya taken from the captives, consummation on the return journey — is Bukhari, not polemic; only the torture detail depends on the sira alone. The defenses concede every load-bearing fact and reframe them as magnanimity. But 'consent' by a teenager whose husband and father the marrying party's forces killed, offered marriage or captivity, is not consent in any meaningful sense, and 'honor' presupposes the legitimacy of the captivity system itself (Quran 33:50). Graded admitted: Islamic sources affirm the substance, and the dispute is entirely over whether it was praiseworthy — which is precisely the character question the prophet-test category exists to pose.","severity":"high"},
{"id":"mutah-temporary-marriage","title":"Mut'ah: the temporary marriage Muhammad permitted","category":"practice","claim":"Sahih hadith establish that Muhammad permitted mut'ah — marriage contracted for a fixed term and payment, dissolving automatically: companions on campaign were allowed to marry women 'for a fixed time' even for a garment (Sahih Muslim 1404), and Jabir reports the practice continued through Abu Bakr's reign until Umar banned it (Sahih Muslim 1405). Sunni Islam holds Muhammad finally prohibited it (Sahih al-Bukhari 5115; Sahih Muslim 1406 — 'Allah has forbidden it until the Day of Resurrection'), though the abrogation is variously dated to Khaybar, Mecca's conquest, or Umar's caliphate. Shia Islam rejects the abrogation, grounds the practice in Quran 4:24 ('give them their due compensation for what you have enjoyed'), and practices mut'ah today, where it functions in documented cases as religiously laundered prostitution. Either Muhammad sanctioned term-limited sexual contracts, or the community that transmitted his religion cannot agree on what he finally commanded — both horns matter evangelistically against 'a marriage covenant witnessed by God' (Malachi 2:14).","quran":["Quran 4:24"],"hadith":["Sahih Muslim 1404","Sahih Muslim 1405","Sahih Muslim 1406","Sahih al-Bukhari 5115"],"bible":["Malachi 2:14-15","Matthew 19:4-6","Hebrews 13:4"],"sources":[{"name":"Sahih al-Bukhari 5115","type":"primary","url":"https://sunnah.com/bukhari:5115"},{"name":"Sahih Muslim — Book of Marriage (mut'ah reports)","type":"primary","url":"https://sunnah.com/muslim:1404a"},{"name":"Wikipedia — Nikah mut'ah","type":"institutional","url":"https://en.wikipedia.org/wiki/Nikah_mut%27ah"},{"name":"Al-Islam.org (Shia) — Temporary marriage: evidences from Sunni hadith collections","type":"muslim","url":"https://al-islam.org/shiite-encyclopedia/temporary-marriage-islam-part-2-evidences-sunni-hadith-collections"},{"name":"IslamQA 20738 — Is mut'ah marriage allowed?","type":"muslim","url":"https://islamqa.info/en/answers/20738"}],"response":"Sunni scholars answer that mut'ah belongs to Islam's gradualist pedagogy, like the phased prohibition of alcohol: permitted briefly under wartime hardship, then abrogated by the Prophet himself 'until the Day of Resurrection' (Sahih Muslim 1406), with the four Sunni schools unanimous on its prohibition — so Islam cannot be charged with what it abolished. Umar's ban merely enforced the Prophet's ruling. Shia scholars answer the opposite: 4:24 sanctions it, no abrogating verse exists, and Umar had no authority to forbid what Muhammad allowed; regulated mut'ah, with dower, term, and idda, is a lawful institution, not prostitution.","responseSource":{"name":"IslamQA 20738","url":"https://islamqa.info/en/answers/20738"},"verdict":"contested","rationale":"Graded contested because the Sunni abrogation defense is a genuine, well-sourced internal answer — Bukhari and Muslim do record prohibition, and it would be unfair to charge Sunni Islam with a practice it anathematizes. But the challenge is not fully answered: Muhammad undeniably permitted term-limited sexual contracts for some period (both sects agree), which is itself the moral datum against the biblical vision of marriage; the abrogation chronology is internally tangled; and a quarter of the Muslim world's second-largest branch practices mut'ah now on Quranic grounds Sunnis cannot conclusively rebut without Umar's authority. The disagreement also feeds the hadith-epistemology entry: the two communities' canons yield opposite final rulings.","severity":"medium"},
{"id":"kaaba-black-stone-pagan-rites","title":"The Black Stone and the Kaaba: pre-Islamic rites retained","category":"practice","claim":"Islam's central rites predate Islam. The Kaaba was a functioning pagan shrine housing 360 idols until Muhammad cleansed it in 630 (Sahih al-Bukhari 4287); pre-Islamic Arabs already performed tawaf, venerated the Black Stone, and ran between Safa and Marwa — a rite associated with the idols Isaf and Na'ila that the Quran had to expressly re-authorize (2:158). Muslims still kiss or salute the embedded Black Stone in the Kaaba's corner; Umar's famous unease is canonical: 'I know that you are a stone and can neither benefit nor harm. Had I not seen the Prophet kissing you, I would not have kissed you' (Sahih al-Bukhari 1597) — while other hadith give the stone quasi-magical properties: it descended from paradise whiter than milk, blackened by sins, and will testify on judgment day (Jami at-Tirmidhi 877, 961). The question for a faith that defines itself against idolatry: why does pure monotheism's holiest act incorporate a pagan sanctuary's stone-veneration circuit, unchanged in form?","quran":["Quran 2:125","Quran 2:158","Quran 3:96-97","Quran 22:26-29"],"hadith":["Sahih al-Bukhari 1597","Sahih al-Bukhari 4287","Jami at-Tirmidhi 877"],"bible":["John 4:21-24","Acts 17:24-25","Isaiah 44:9-20"],"sources":[{"name":"Sahih al-Bukhari 1597 (Umar and the stone)","type":"primary","url":"https://sunnah.com/bukhari:1597"},{"name":"Sahih al-Bukhari 4287 (360 idols)","type":"primary","url":"https://sunnah.com/bukhari:4287"},{"name":"Jami at-Tirmidhi 877 (stone from paradise)","type":"primary","url":"https://sunnah.com/tirmidhi:877"},{"name":"WikiIslam — Pre-Islamic Arab religion in Islam","type":"apologetics","url":"https://wikiislam.net/wiki/Pre-Islamic_Arab_Religion_in_Islam"},{"name":"Wikipedia — Black Stone","type":"institutional","url":"https://en.wikipedia.org/wiki/Black_Stone"},{"name":"Answering Islam — Stone kissing and idolatry","type":"apologetics","url":"https://www.answering-islam.org/Muhammad/Inconsistent/stone_kissing.html"}],"response":"The Islamic answer is that the direction of history is reversed: Abraham and Ishmael built the Kaaba for pure monotheism (Quran 2:127), and the pagan rites were later corruptions of an originally Abrahamic pilgrimage — Islam did not adopt paganism; it stripped paganism off an ancient monotheist sanctuary and restored the original. Kissing the stone, IslamQA explains, is pure ittiba' (following the Prophet's example), explicitly not worship — Umar's statement is cited by Muslims themselves as proof the act carries no belief in the stone's power. Tawaf and Safa-Marwa commemorate Abrahamic history (Hagar's search for water), re-sanctified by revelation.","responseSource":{"name":"IslamQA 118085 — Why do Muslims kiss the Black Stone?","url":"https://islamqa.info/en/answers/118085"},"verdict":"contested","rationale":"Graded contested, conservatively. The continuity of the rites with pre-Islamic paganism is a matter of Islamic record (Bukhari 4287; the 2:158 re-authorization presupposes pagan association), and the 'Abrahamic original' has zero pre-Islamic evidentiary support — it depends wholly on the Quran's assertion, and the Ishmael entry shows Genesis places Abraham nowhere near Mecca. But the Muslim intent-distinction is real: mainstream Islam explicitly denies the stone any power, and Umar's canonical statement functions as an internal anti-idolatry guardrail. The strong claim 'Muslims worship a stone' fails; the fair claim — Islam's central rite is a retained pagan circuit resting on an unevidenced origin story — stands.","severity":"medium"},
{"id":"sword-verses-final-command","title":"Surah 9 and the chronology problem: which verses are Islam's last word?","category":"practice","claim":"Surah 9 — by Muslim consensus among the last revealed — commands: 'kill the polytheists wherever you find them' after the sacred months (9:5), and 'fight those who do not believe in Allah... from the People of the Book until they pay the jizya with willing submission, and feel themselves subdued' (9:29). Under Islam's own abrogation doctrine (2:106, already in the app), later revelation governs earlier: Ibn Kathir's tafsir records Ad-Dahhak's judgment that the 'Verse of the Sword' 'abrogated every agreement of peace between the Prophet and any idolator, every treaty, and every term.' Classical jurists across the schools built offensive-jihad doctrine on exactly this chronology, and Muhammad's own summary is canonical: 'I have been ordered to fight the people until they say: none has the right to be worshipped but Allah' (Sahih al-Bukhari 25). The frequently quoted 'no compulsion in religion' (2:256) is Medinan but earlier — which is why the classical tradition, not Islamophobes, treated the sword verses as operative. Jesus's final commands run the other direction: 'put your sword back' (Matthew 26:52); 'make disciples... teaching them' (Matthew 28:19-20).","quran":["Quran 9:5","Quran 9:29","Quran 2:256","Quran 8:39"],"hadith":["Sahih al-Bukhari 25"],"bible":["Matthew 26:52","Matthew 28:18-20","2 Corinthians 10:3-4"],"sources":[{"name":"Tafsir Ibn Kathir on 9:5","type":"primary","url":"https://quranx.com/Tafsir/Kathir/9.5"},{"name":"Sahih al-Bukhari 25","type":"primary","url":"https://sunnah.com/bukhari:25"},{"name":"Wikipedia — Sword Verse","type":"institutional","url":"https://en.wikipedia.org/wiki/Sword_Verse"},{"name":"Discover The Truth — An historical examination of the Sword Verse (Muslim rebuttal)","type":"muslim","url":"https://discover-the-truth.com/2016/04/22/an-historical-examination-of-the-sword-verse-surah-95/"}],"response":"Muslim scholars answer that context confines both verses: 9:1-4 addresses pagan tribes who violated their treaties — 9:4 explicitly exempts those who kept terms, and 9:6 commands escorting an enemy who seeks protection to safety; 9:29 concerns hostile Byzantine-aligned powers ahead of Tabuk, not all Christians everywhere. The sweeping abrogation claims are attributed to individual exegetes, not consensus; many classical and nearly all modern scholars hold 2:256 and 60:8 un-abrogated, making jihad defensive or state-conducted, never vigilante. Bukhari 25's 'the people' is read as the specific treaty-breaking Arab polytheists, per the parallel narrations.","responseSource":{"name":"Discover The Truth — Sword Verse examination","url":"https://discover-the-truth.com/2016/04/22/an-historical-examination-of-the-sword-verse-surah-95/"},"verdict":"contested","rationale":"Contested is the honest grade: the contextual defense has genuine textual anchors (9:4, 9:6), and painting all Islam with Ad-Dahhak's maximalism would be the mirror error of Muslim apologists' minimalism. What the defense cannot dissolve: 9:29 targets People of the Book as such, prescribing fighting until tribute and subjugation — a command classical fiqh of every school operationalized for a millennium of expansionist jurisprudence; the contextual reading is historically the reformist position, not the classical one. The evangelistic use is precise, not polemical: ask which trajectory each founder's final commands set — and note this entry deliberately complements, without duplicating, the app's sharia (#35) and spread-by-sword (#38) entries.","severity":"high"},
{"id":"muhammad-bewitched","title":"The bewitched prophet: Bukhari's magic spell and the reliability of revelation","category":"muhammad-test","claim":"Sahih al-Bukhari 3268 — narrated by Aisha — reports that a Jewish sorcerer, Labid ibn al-A'sam, worked magic on Muhammad using his hair and a comb 'so that he began to imagine that he had done a thing which he had not really done,' a state lasting by some accounts months. Muslim (2189) carries the same account; it is as authenticated as hadith get. The problem is double. Internally: the Quran indignantly denies the charge that Muhammad was 'a bewitched man' (17:47; 25:8) — yet Islam's most authentic hadith affirm exactly that. Epistemically: a prophet whose mind could be made to experience things that never happened, by a hostile magician, for an extended period during his revelatory career, has no way to certify which of his experiences — including revelations — were genuine. The biblical test excludes this categorically: God's true prophet is not overpowered by sorcery ('there is no enchantment against Jacob,' Numbers 23:23), and God's word does not come through a compromised channel (Deuteronomy 18:21-22).","quran":["Quran 25:8","Quran 17:47","Quran 113:1-5"],"hadith":["Sahih al-Bukhari 3268","Sahih Muslim 2189"],"bible":["Numbers 23:23","Deuteronomy 18:21-22","1 John 5:18"],"sources":[{"name":"Sahih al-Bukhari 3268","type":"primary","url":"https://sunnah.com/bukhari:3268"},{"name":"Answering Islam — Muhammad's bewitchment examined","type":"apologetics","url":"https://www.answering-islam.org/Responses/Menj/bewitchment.htm"},{"name":"IslamQA 68814 — The story of the magic and its meaning","type":"muslim","url":"https://islamqa.info/en/answers/68814"},{"name":"SeekersGuidance — Was the Prophet affected by magic?","type":"muslim","url":"https://islamqa.org/hanafi/seekersguidance-hanafi/224578/was-the-prophet-allah-bless-him-and-give-him-peace-affected-by-magic/"}],"response":"IslamQA and mainstream commentators respond that the magic affected only Muhammad's worldly, domestic life — classically, imagining he had approached his wives when he had not — and never touched revelation, whose integrity Allah guarantees (5:67; 15:9). It was an illness like any bodily ailment prophets suffer, it ended in a miracle (Allah revealed the spell's location and cure, per the hadith itself, with Surahs 113-114 linked to the deliverance), and 25:8's denial concerns the pagans' charge that the Quran itself was sorcery's product — a different claim from the prophet suffering a temporary spell. Some early scholars and modernists simply rejected the report as contradicting the Quran.","responseSource":{"name":"IslamQA 68814","url":"https://islamqa.info/en/answers/68814"},"verdict":"unrefuted","rationale":"The 'worldly matters only' firewall is asserted, never demonstrated: the hadith's own description — believing he had done what he had not done — is a defect of perception and memory, the exact faculties revelation depends on, and no criterion is offered by which Muhammad or anyone else could partition bewitched experiences from genuine ones. The minority who reject the report to save the Quran (a live Muslim position) impale themselves on the hadith-epistemology dilemma: Bukhari's most rigorously authenticated Aisha material falls, and Islamic method falls with it. The internal tension with 25:8 is answered only by redescribing the pagans' charge. No resolution holds all three: sahih hadith, Quranic denial, prophetic reliability.","severity":"medium"},
{"id":"sins-cast-on-jews-christians","title":"Islam's substitute: 'your ransom from the Fire — a Jew or a Christian'","category":"salvation","claim":"Sahih Muslim preserves a startling soteriology: 'When it is the Day of Resurrection, Allah will deliver to every Muslim a Jew or a Christian and say: That is your rescue from Hell-Fire' (Sahih Muslim 2767a). The companion narration is stronger still: Muslims will arrive 'with sins like mountains,' and Allah will forgive the Muslims 'and place them on the Jews and Christians' instead (2767c-d); 'No Muslim dies but Allah admits in his stead a Jew or a Christian in Hell-Fire' (2767b). This is substitutionary atonement inverted: the innocent-of-those-sins damned in place of the guilty, by ethnic-religious category, without consent, justice, or love. The gospel's substitution is its precise mirror: the sinless one voluntarily bears sin for the guilty — 'He himself bore our sins in his body on the tree' (1 Peter 2:24); 'the Lamb of God who takes away the sin of the world' (John 1:29). Every human heart senses guilt must go somewhere; the two religions answer with opposite substitutes.","quran":["Quran 53:38","Quran 6:164"],"hadith":["Sahih Muslim 2767a","Sahih Muslim 2767b"],"bible":["1 Peter 2:24","John 1:29","Isaiah 53:5-6","2 Corinthians 5:21"],"sources":[{"name":"Sahih Muslim 2767b","type":"primary","url":"https://sunnah.com/muslim:2767b"},{"name":"Sahih Muslim 2767a (in context)","type":"primary","url":"https://sunnah.com/muslim/50/57-60"},{"name":"IslamQA 9488 — Meaning of the hadith about sins placed on the People of the Book","type":"muslim","url":"https://islamqa.info/en/answers/9488"},{"name":"Answering Islam (Shamoun) — How will a Muslim be saved according to the hadiths?","type":"apologetics","url":"https://www.answering-islam.org/authors/shamoun/saved_in_hadith.html"},{"name":"Street Theologian — Christians: a Muslim's ransom from hell?","type":"apologetics","url":"https://streettheologian.substack.com/p/christians-a-muslims-ransom-from"}],"response":"IslamQA explains that the unbelievers are not punished for the Muslims' sins — that would contradict 'no bearer of burdens bears the burden of another' (6:164). Rather, the Jew or Christian enters Hell for his own disbelief; 'ransom' (fida') is figurative: each person has a place in Paradise and a place in Hell, and when a Muslim is forgiven, the unbeliever 'inherits' the vacated place in Hell that his own sins already earned, as the Muslim inherits his place in Paradise (per the parallel in Muslim's collection). Al-Nawawi's commentary takes the wording as metaphor for the fixed populations of the two abodes, so no injustice occurs.","responseSource":{"name":"IslamQA 9488","url":"https://islamqa.info/en/answers/9488"},"verdict":"admitted","rationale":"The hadith are sahih Muslim material and IslamQA's harmonization concedes the wording requires rescue: the 'inherited places' reading must flatly re-explain 'Allah would forgive the Muslims and place [their sins] on the Jews and Christians,' which states transfer, not vacancy. Even granting Nawawi's metaphor, the admitted picture remains: Muslims with mountain-sized sins are forgiven not through any atonement but by category membership, while Jews and Christians serve as their counterweight — mercy without a ground, at the expense of justice, precisely the problem the cross answers (Romans 3:26). Graded admitted since the texts and their canonical status are affirmed; only the mechanics are debated. Powerful, underused evangelistic bridge to substitution rightly understood.","severity":"medium"},
{"id":"uzair-son-of-god","title":"'The Jews say Ezra is the son of Allah' — a claim no Jew ever made","category":"science-history","claim":"Quran 9:30 asserts as fact: 'The Jews say: Ezra (Uzair) is the son of Allah' — parallel to the Christian confession of Christ — and pronounces Allah's curse on both groups for it. But no Jewish text, sect, or tradition in the entire historical record calls Ezra the son of God: not the Tanakh, Talmud, Mishnah, Philo, Josephus, Qumran, or any rabbinic source. Judaism's defining confession is the Shema (Deuteronomy 6:4), and deifying a scribe would be its ultimate blasphemy. Historians, as the standard literature concedes, find the verse 'enigmatic' precisely because the belief is unattested. The error matters doubly for dawah: first, an omniscient author does not misreport the theology of a community living in Medina alongside Muhammad; second, the verse's symmetry ('...and the Christians say the Messiah is the son of Allah') shows the Quran treating both sonship claims as parallel human inventions — misunderstanding the Christian claim it means to refute, as the app's sonship entries already document.","quran":["Quran 9:30"],"hadith":[],"bible":["Deuteronomy 6:4","Ezra 7:6-10","Nehemiah 8:1-8"],"sources":[{"name":"Answering Islam — Was Uzayr (Ezra) called the Son of God?","type":"apologetics","url":"https://www.answering-islam.org/Responses/Saifullah/ezra.htm"},{"name":"Wikipedia — Uzair","type":"institutional","url":"https://en.wikipedia.org/wiki/Uzair"},{"name":"Tafsir Ibn Kathir on 9:30","type":"primary","url":"https://quran.com/en/9:30/tafsirs/en-tafisr-ibn-kathir"},{"name":"IslamQA 164633 — A Jewish person rejecting what the Qur'an says about Uzayr","type":"muslim","url":"https://islamqa.info/en/answers/164633"}],"response":"Muslim commentators from Tabari onward answer that the verse reports a claim of some Jews, not all: classical tafsir names individual Medinan Jews (e.g., Finhas) or a Yemeni or Arabian Jewish faction who venerated Ezra as restorer of the Torah to the point of calling him Allah's son; Arabic reportedly permits attributing a subgroup's saying to the group. The absence from surviving Jewish literature proves little, they argue, since a heterodox Arabian sect would leave no rabbinic paper trail — and some modern Muslim writers point to 4 Ezra's exalted Ezra, or the deified-scribe traditions around Enoch/Metatron, as the kind of milieu the Quran could be indicting.","responseSource":{"name":"IslamQA 164633","url":"https://islamqa.info/en/answers/164633"},"verdict":"unrefuted","rationale":"The defense is an argument from silence about a sect for which the only evidence is the verse needing rescue — methodologically circular, and the classical commentators' mutually conflicting identifications (one man, one delegation, a Yemeni sect) show they possessed no actual historical referent. 4 Ezra and Metatron traditions never call Ezra God's son and belong to different figures and genres. The verse generalizes ('the Jews say') exactly as it does for Christians, where the Quran means the mainstream confession — so the subgroup reading is special pleading. As with the Mary-in-the-Trinity entry already in the app, the pattern is a polemicist's misreport of neighbors' beliefs, not omniscience.","severity":"medium"},
{"id":"allah-name-polemic","title":"'Allah is a foreign god's name' — a polemic Christians should drop","category":"doctrine-of-god","claim":"A popular evangelical polemic claims 'Allah' is intrinsically the name of a false deity, so Muslims linguistically worship someone other than the biblical God, and Christians must never use the word. The evidence is against the linguistic claim. 'Allah' is simply Arabic for 'God' (al-ilah, 'the God'), cognate with Hebrew Eloah/Elohim and Aramaic Alaha — likely close to what Jesus's own Aramaic-speaking circle called God. Arab Christians used it before Muhammad existed: the trilingual Zabad inscription (512 AD), on a church of St. Sergius, opens its Arabic line invoking al-ilah; pre-Islamic Christian Arab tribes prayed to Allah, and every Arabic Bible from the earliest translations to today renders 'God' as 'Allah' — millions of Arab Christians confess 'Allah' as Father, Son, and Holy Spirit every Sunday. The real issue is conceptual, not lexical: whether the Quran's characterization of God is true — which is the work of the app's doctrine-of-god entries, and it is not advanced by a false etymology argument.","quran":["Quran 29:46","Quran 112:1-4"],"hadith":[],"bible":["Genesis 1:1","Mark 15:34","Acts 17:23-31"],"sources":[{"name":"Islamic Awareness — The Zebed inscription (512 CE)","type":"muslim","url":"https://www.islamic-awareness.org/history/islam/inscriptions/zebed"},{"name":"Wikipedia — Allah (etymology and pre-Islamic usage)","type":"institutional","url":"https://en.wikipedia.org/wiki/Allah"},{"name":"ResearchGate — Allah, Al-Ilah, and Allahumma: Arabic usage before the 9th century","type":"scholarly","url":"https://www.researchgate.net/publication/380923390_Allah_Al-Ilah_and_Allahumma_The_Arabic_Language_Usage_before_the_9th_century_AD_in_the_Christian-Muslim_Middle_Eastern"},{"name":"Sidney Griffith — The Church in the Shadow of the Mosque (Princeton UP)","type":"scholarly","url":"https://press.princeton.edu/books/paperback/9780691146287/the-church-in-the-shadow-of-the-mosque"}],"response":"Muslim apologists happily agree with the linguistic facts and press them further: since Allah is the God of Abraham by name and heritage, and Quran 29:46 instructs Muslims to tell the People of the Book 'our God and your God is one,' Christians who concede the shared name should concede a shared God — differing only in later 'corruptions' like the Trinity. On this footing Islam presents itself as the purification of Abrahamic monotheism rather than a rival deity's cult, and dawah regularly cites Arab Christian usage of 'Allah' as evidence that Islam worships the same God Christians do, merely more consistently.","responseSource":{"name":"Islamic Awareness — Zebed inscription","url":"https://www.islamic-awareness.org/history/islam/inscriptions/zebed"},"verdict":"answered","rationale":"Graded answered: the polemic's factual core is simply wrong, and Muslim (and Arab Christian) sources answer it decisively — 'Allah' predates Islam as the Arabic word for God, used in Christian inscriptions and every Arabic Bible. Christians who lead with it lose credibility with any Arabic-speaking hearer in the first minute. The entry's evangelistic value is triage: drop the lexical argument, keep the conceptual one. Whether the Quran's Allah — a non-triune monad who is not Father, has no Son, and saves without atonement — accurately describes the God of Abraham is the real question, and the app's doctrine-of-god and tahrif entries prosecute it on ground that actually holds.","severity":"low"}
];
const VERSES={"Quran 3:3":{"ref":"Surah Ali 'Imran (3)","verses":[{"v":3,"t":"He hath revealed unto thee (Muhammad) the Scripture with truth, confirming that which was (revealed) before it, even as He revealed the Torah and the Gospel."}]},"Quran 5:43":{"ref":"Surah Al-Ma'idah (5)","verses":[{"v":43,"t":"How come they unto thee for judgment when they have the Torah, wherein Allah hath delivered judgment (for them)? Yet even after that they turn away. Such (folk) are not believers."}]},"Quran 5:46-47":{"ref":"Surah Al-Ma'idah (5)","verses":[{"v":46,"t":"And We caused Jesus, son of Mary, to follow in their footsteps, confirming that which was (revealed) before him in the Torah, and We bestowed on him the Gospel wherein is guidance and a light, confirming that which was (revealed) before it in the Torah - a guidance and an admonition unto those who ward off (evil)."},{"v":47,"t":"Let the People of the Gospel judge by that which Allah hath revealed therein. Whoso judgeth not by that which Allah hath revealed: such are evil-livers."}]},"Quran 5:68":{"ref":"Surah Al-Ma'idah (5)","verses":[{"v":68,"t":"Say O People of the Scripture! Ye have naught (of guidance) till ye observe the Torah and the Gospel and that which was revealed unto you from your Lord. That which is revealed unto thee (Muhammad) from thy Lord is certain to increase the contumacy and disbelief of many of them. But grieve not for the disbelieving folk."}]},"Quran 10:94":{"ref":"Surah Yunus (10)","verses":[{"v":94,"t":"And if thou (Muhammad) art in doubt concerning that which We reveal unto thee, then question those who read the Scripture (that was) before thee. Verily the Truth from thy Lord hath come unto thee. So be not thou of the waverers."}]},"Quran 6:115":{"ref":"Surah Al-An'am (6)","verses":[{"v":115,"t":"Perfected is the Word of thy Lord in truth and justice. There is naught that can change His words. He is the Hearer, the Knower."}]},"Quran 18:27":{"ref":"Surah Al-Kahf (18)","verses":[{"v":27,"t":"And recite that which hath been revealed unto thee of the Scripture of thy Lord. There is none who can change His words, and thou wilt find no refuge beside Him."}]},"Quran 15:9":{"ref":"Surah Al-Hijr (15)","verses":[{"v":9,"t":"Lo! We, even We, reveal the Reminder, and lo! We verily are its Guardian."}]},"Isaiah 40:8":{"ref":"Isaiah 40","verses":[{"v":8,"t":"The grass withereth, the flower fadeth: but the word of our God shall stand for ever."}]},"Matthew 24:35":{"ref":"Matthew 24","verses":[{"v":35,"t":"Heaven and earth shall pass away, but my words shall not pass away."}]},"Quran 2:75":{"ref":"Surah Al-Baqarah (2)","verses":[{"v":75,"t":"Have ye any hope that they will be true to you when a party of them used to listen to the word of Allah, then used to change it, after they had understood it, knowingly?"}]},"Quran 2:79":{"ref":"Surah Al-Baqarah (2)","verses":[{"v":79,"t":"Therefore woe be unto those who write the Scripture with their hands and then say, \"This is from Allah,\" that they may purchase a small gain therewith. Woe unto them for that their hands have written, and woe unto them for that they earn thereby."}]},"Quran 3:78":{"ref":"Surah Ali 'Imran (3)","verses":[{"v":78,"t":"And lo! there is a party of them who distort the Scripture with their tongues, that ye may think that what they say is from the Scripture, when it is not from the Scripture. And they say: It is from Allah, when it is not from Allah; and they speak a lie concerning Allah knowingly."}]},"Quran 4:46":{"ref":"Surah An-Nisa (4)","verses":[{"v":46,"t":"Some of those who are Jews change words from their context and say: \"We hear and disobey; hear thou as one who heareth not\" and \"Listen to us!\" distorting with their tongues and slandering religion. If they had said: \"We hear and we obey: hear thou, and look at us\" it had been better for them, and more upright. But Allah hath cursed them for their disbelief, so they believe not, save a few."}]},"Quran 5:13":{"ref":"Surah Al-Ma'idah (5)","verses":[{"v":13,"t":"And because of their breaking their covenant, We have cursed them and made hard their hearts. They change words from their context and forget a part of that whereof they were admonished. Thou wilt not cease to discover treachery from all save a few of them. But bear with them and pardon them. Lo! Allah loveth the kindly."}]},"Quran 5:48":{"ref":"Surah Al-Ma'idah (5)","verses":[{"v":48,"t":"And unto thee have We revealed the Scripture with the truth, confirming whatever Scripture was before it, and a watcher over it. So judge between them by that which Allah hath revealed, and follow not their desires away from the truth which hath come unto thee. For each We have appointed a divine law and a traced-out way. Had Allah willed He could have made you one community. But that He may try you by that which He hath given you (He hath made you as ye are). So vie one with another in good works. Unto Allah ye will all return, and He will then inform you of that wherein ye differ."}]},"Isaiah 53:5-6":{"ref":"Isaiah 53","verses":[{"v":5,"t":"But he was wounded for our transgressions, he was bruised for our iniquities: the chastisement of our peace was upon him; and with his stripes we are healed."},{"v":6,"t":"All we like sheep have gone astray; we have turned every one to his own way; and the LORD hath laid on him the iniquity of us all."}]},"1 Peter 1:24-25":{"ref":"1 Peter 1","verses":[{"v":24,"t":"For all flesh is as grass, and all the glory of man as the flower of grass. The grass withereth, and the flower thereof falleth away:"},{"v":25,"t":"But the word of the Lord endureth for ever. And this is the word which by the gospel is preached unto you."}]},"Quran 4:157":{"ref":"Surah An-Nisa (4)","verses":[{"v":157,"t":"And because of their saying: We slew the Messiah, Jesus son of Mary, Allah's messenger - they slew him not nor crucified him, but it appeared so unto them; and lo! those who disagree concerning it are in doubt thereof; they have no knowledge thereof save pursuit of a conjecture; they slew him not for certain."}]},"Quran 4:158":{"ref":"Surah An-Nisa (4)","verses":[{"v":158,"t":"But Allah took him up unto Himself. Allah was ever Mighty, Wise."}]},"1 Corinthians 15:3-8":{"ref":"1 Corinthians 15","verses":[{"v":3,"t":"For I delivered unto you first of all that which I also received, how that Christ died for our sins according to the scriptures;"},{"v":4,"t":"And that he was buried, and that he rose again the third day according to the scriptures:"},{"v":5,"t":"And that he was seen of Cephas, then of the twelve:"},{"v":6,"t":"After that, he was seen of above five hundred brethren at once; of whom the greater part remain unto this present, but some are fallen asleep."},{"v":7,"t":"After that, he was seen of James; then of all the apostles."},{"v":8,"t":"And last of all he was seen of me also, as of one born out of due time."}]},"Mark 15:24-39":{"ref":"Mark 15","verses":[{"v":24,"t":"And when they had crucified him, they parted his garments, casting lots upon them, what every man should take."},{"v":25,"t":"And it was the third hour, and they crucified him."},{"v":26,"t":"And the superscription of his accusation was written over, THE KING OF THE JEWS."},{"v":27,"t":"And with him they crucify two thieves; the one on his right hand, and the other on his left."},{"v":28,"t":"And the scripture was fulfilled, which saith, And he was numbered with the transgressors."},{"v":29,"t":"And they that passed by railed on him, wagging their heads, and saying, Ah, thou that destroyest the temple, and buildest it in three days,"},{"v":30,"t":"Save thyself, and come down from the cross."},{"v":31,"t":"Likewise also the chief priests mocking said among themselves with the scribes, He saved others; himself he cannot save."},{"v":32,"t":"Let Christ the King of Israel descend now from the cross, that we may see and believe. And they that were crucified with him reviled him."},{"v":33,"t":"And when the sixth hour was come, there was darkness over the whole land until the ninth hour."},{"v":34,"t":"And at the ninth hour Jesus cried with a loud voice, saying, Eloi, Eloi, lama sabachthani? which is, being interpreted, My God, my God, why hast thou forsaken me?"},{"v":35,"t":"And some of them that stood by, when they heard it, said, Behold, he calleth Elias."},{"v":36,"t":"And one ran and filled a sponge full of vinegar, and put it on a reed, and gave him to drink, saying, Let alone; let us see whether Elias will come to take him down."},{"v":37,"t":"And Jesus cried with a loud voice, and gave up the ghost."},{"v":38,"t":"And the veil of the temple was rent in twain from the top to the bottom."},{"v":39,"t":"And when the centurion, which stood over against him, saw that he so cried out, and gave up the ghost, he said, Truly this man was the Son of God."}]},"John 19:16-30":{"ref":"John 19","verses":[{"v":16,"t":"Then delivered he him therefore unto them to be crucified. And they took Jesus, and led him away."},{"v":17,"t":"And he bearing his cross went forth into a place called the place of a skull, which is called in the Hebrew Golgotha:"},{"v":18,"t":"Where they crucified him, and two other with him, on either side one, and Jesus in the midst."},{"v":19,"t":"And Pilate wrote a title, and put it on the cross. And the writing was, JESUS OF NAZARETH THE KING OF THE JEWS."},{"v":20,"t":"This title then read many of the Jews: for the place where Jesus was crucified was nigh to the city: and it was written in Hebrew, and Greek, and Latin."},{"v":21,"t":"Then said the chief priests of the Jews to Pilate, Write not, The King of the Jews; but that he said, I am King of the Jews."},{"v":22,"t":"Pilate answered, What I have written I have written."},{"v":23,"t":"Then the soldiers, when they had crucified Jesus, took his garments, and made four parts, to every soldier a part; and also his coat: now the coat was without seam, woven from the top throughout."},{"v":24,"t":"They said therefore among themselves, Let us not rend it, but cast lots for it, whose it shall be: that the scripture might be fulfilled, which saith, They parted my raiment among them, and for my vesture they did cast lots. These things therefore the soldiers did."},{"v":25,"t":"Now there stood by the cross of Jesus his mother, and his mother's sister, Mary the wife of Cleophas, and Mary Magdalene."},{"v":26,"t":"When Jesus therefore saw his mother, and the disciple standing by, whom he loved, he saith unto his mother, Woman, behold thy son!"},{"v":27,"t":"Then saith he to the disciple, Behold thy mother! And from that hour that disciple took her unto his own home."},{"v":28,"t":"After this, Jesus knowing that all things were now accomplished, that the scripture might be fulfilled, saith, I thirst."},{"v":29,"t":"Now there was set a vessel full of vinegar: and they filled a sponge with vinegar, and put it upon hyssop, and put it to his mouth."},{"v":30,"t":"When Jesus therefore had received the vinegar, he said, It is finished: and he bowed his head, and gave up the ghost."}]},"Luke 23:33-46":{"ref":"Luke 23","verses":[{"v":33,"t":"And when they were come to the place, which is called Calvary, there they crucified him, and the malefactors, one on the right hand, and the other on the left."},{"v":34,"t":"Then said Jesus, Father, forgive them; for they know not what they do. And they parted his raiment, and cast lots."},{"v":35,"t":"And the people stood beholding. And the rulers also with them derided him, saying, He saved others; let him save himself, if he be Christ, the chosen of God."},{"v":36,"t":"And the soldiers also mocked him, coming to him, and offering him vinegar,"},{"v":37,"t":"And saying, If thou be the king of the Jews, save thyself."},{"v":38,"t":"And a superscription also was written over him in letters of Greek, and Latin, and Hebrew, THIS IS THE KING OF THE JEWS."},{"v":39,"t":"And one of the malefactors which were hanged railed on him, saying, If thou be Christ, save thyself and us."},{"v":40,"t":"But the other answering rebuked him, saying, Dost not thou fear God, seeing thou art in the same condemnation?"},{"v":41,"t":"And we indeed justly; for we receive the due reward of our deeds: but this man hath done nothing amiss."},{"v":42,"t":"And he said unto Jesus, Lord, remember me when thou comest into thy kingdom."},{"v":43,"t":"And Jesus said unto him, Verily I say unto thee, To day shalt thou be with me in paradise."},{"v":44,"t":"And it was about the sixth hour, and there was a darkness over all the earth until the ninth hour."},{"v":45,"t":"And the sun was darkened, and the veil of the temple was rent in the midst."},{"v":46,"t":"And when Jesus had cried with a loud voice, he said, Father, into thy hands I commend my spirit: and having said thus, he gave up the ghost."}]},"Quran 3:45":{"ref":"Surah Ali 'Imran (3)","verses":[{"v":45,"t":"(And remember) when the angels said: O Mary! Lo! Allah giveth thee glad tidings of a word from him, whose name is the Messiah, Jesus, son of Mary, illustrious in the world and the Hereafter, and one of those brought near (unto Allah)."}]},"Quran 3:47":{"ref":"Surah Ali 'Imran (3)","verses":[{"v":47,"t":"She said: My Lord! How can I have a child when no mortal hath touched me? He said: So (it will be). Allah createth what He will. If He decreeth a thing, He saith unto it only: Be! and it is."}]},"Quran 3:49":{"ref":"Surah Ali 'Imran (3)","verses":[{"v":49,"t":"And will make him a messenger unto the Children of Israel, (saying): Lo! I come unto you with a sign from your Lord. Lo! I fashion for you out of clay the likeness of a bird, and I breathe into it and it is a bird, by Allah's leave. I heal him who was born blind, and the leper, and I raise the dead, by Allah's leave. And I announce unto you what ye eat and what ye store up in your houses. Lo! herein verily is a portent for you, if ye are to be believers."}]},"Quran 5:110":{"ref":"Surah Al-Ma'idah (5)","verses":[{"v":110,"t":"When Allah saith: O Jesus, son of Mary! Remember My favour unto thee and unto thy mother; how I strengthened thee with the holy Spirit, so that thou spakest unto mankind in the cradle as in maturity; and how I taught thee the Scripture and Wisdom and the Torah and the Gospel; and how thou didst shape of clay as it were the likeness of a bird by My permission, and didst blow upon it and it was a bird by My permission, and thou didst heal him who was born blind and the leper by My permission; and how thou didst raise the dead by My permission; and how I restrained the Children of Israel from (harming) thee when thou camest unto them with clear proofs, and those of them who disbelieved exclaimed: This is naught else than mere magic;"}]},"Quran 19:19":{"ref":"Surah Maryam (19)","verses":[{"v":19,"t":"He said: I am only a messenger of thy Lord, that I may bestow on thee a faultless son."}]},"Quran 47:19":{"ref":"Surah Muhammad (47)","verses":[{"v":19,"t":"So know (O Muhammad) that there is no Allah save Allah, and ask forgiveness for thy sin and for believing men and believing women. Allah knoweth (both) your place of turmoil and your place of rest."}]},"Quran 48:2":{"ref":"Surah Al-Fath (48)","verses":[{"v":2,"t":"That Allah may forgive thee of thy sin that which is past and that which is to come, and may perfect His favour unto thee, and may guide thee on a right path,"}]},"Quran 3:59":{"ref":"Surah Ali 'Imran (3)","verses":[{"v":59,"t":"Lo! the likeness of Jesus with Allah is as the likeness of Adam. He created him of dust, then He said unto him: Be! and he is."}]},"Luke 1:34-35":{"ref":"Luke 1","verses":[{"v":34,"t":"Then said Mary unto the angel, How shall this be, seeing I know not a man?"},{"v":35,"t":"And the angel answered and said unto her, The Holy Ghost shall come upon thee, and the power of the Highest shall overshadow thee: therefore also that holy thing which shall be born of thee shall be called the Son of God."}]},"John 11:43-44":{"ref":"John 11","verses":[{"v":43,"t":"And when he thus had spoken, he cried with a loud voice, Lazarus, come forth."},{"v":44,"t":"And he that was dead came forth, bound hand and foot with graveclothes: and his face was bound about with a napkin. Jesus saith unto them, Loose him, and let him go."}]},"Hebrews 4:15":{"ref":"Hebrews 4","verses":[{"v":15,"t":"For we have not an high priest which cannot be touched with the feeling of our infirmities; but was in all points tempted like as we are, yet without sin."}]},"Acts 1:9-11":{"ref":"Acts 1","verses":[{"v":9,"t":"And when he had spoken these things, while they beheld, he was taken up; and a cloud received him out of their sight."},{"v":10,"t":"And while they looked steadfastly toward heaven as he went up, behold, two men stood by them in white apparel;"},{"v":11,"t":"Which also said, Ye men of Galilee, why stand ye gazing up into heaven? this same Jesus, which is taken up from you into heaven, shall so come in like manner as ye have seen him go into heaven."}]},"Quran 5:47":{"ref":"Surah Al-Ma'idah (5)","verses":[{"v":47,"t":"Let the People of the Gospel judge by that which Allah hath revealed therein. Whoso judgeth not by that which Allah hath revealed: such are evil-livers."}]},"Quran 5:46":{"ref":"Surah Al-Ma'idah (5)","verses":[{"v":46,"t":"And We caused Jesus, son of Mary, to follow in their footsteps, confirming that which was (revealed) before him in the Torah, and We bestowed on him the Gospel wherein is guidance and a light, confirming that which was (revealed) before it in the Torah - a guidance and an admonition unto those who ward off (evil)."}]},"Quran 29:46":{"ref":"Surah Al-'Ankabut (29)","verses":[{"v":46,"t":"And argue not with the People of the Scripture unless it be in (a way) that is better, save with such of them as do wrong; and say: We believe in that which hath been revealed unto us and revealed unto you; our Allah and your Allah is One, and unto Him we surrender."}]},"John 20:28-31":{"ref":"John 20","verses":[{"v":28,"t":"And Thomas answered and said unto him, My Lord and my God."},{"v":29,"t":"Jesus saith unto him, Thomas, because thou hast seen me, thou hast believed: blessed are they that have not seen, and yet have believed."},{"v":30,"t":"And many other signs truly did Jesus in the presence of his disciples, which are not written in this book:"},{"v":31,"t":"But these are written, that ye might believe that Jesus is the Christ, the Son of God; and that believing ye might have life through his name."}]},"Mark 14:61-64":{"ref":"Mark 14","verses":[{"v":61,"t":"But he held his peace, and answered nothing. Again the high priest asked him, and said unto him, Art thou the Christ, the Son of the Blessed?"},{"v":62,"t":"And Jesus said, I am: and ye shall see the Son of man sitting on the right hand of power, and coming in the clouds of heaven."},{"v":63,"t":"Then the high priest rent his clothes, and saith, What need we any further witnesses?"},{"v":64,"t":"Ye have heard the blasphemy: what think ye? And they all condemned him to be guilty of death."}]},"1 Corinthians 15:3-4":{"ref":"1 Corinthians 15","verses":[{"v":3,"t":"For I delivered unto you first of all that which I also received, how that Christ died for our sins according to the scriptures;"},{"v":4,"t":"And that he was buried, and that he rose again the third day according to the scriptures:"}]},"John 3:16":{"ref":"John 3","verses":[{"v":16,"t":"For God so loved the world, that he gave his only begotten Son, that whosoever believeth in him should not perish, but have everlasting life."}]},"Quran 3:146":{"ref":"Surah Ali 'Imran (3)","verses":[{"v":146,"t":"And with how many a prophet have there been a number of devoted men who fought (beside him). They quailed not for aught that befell them in the way of Allah, nor did they weaken, nor were they brought low. Allah loveth the steadfast."}]},"Quran 2:132":{"ref":"Surah Al-Baqarah (2)","verses":[{"v":132,"t":"The same did Abraham enjoin upon his sons, and also Jacob, (saying): O my sons! Lo! Allah hath chosen for you the (true) religion; therefore die not save as men who have surrendered (unto Him)."}]},"Quran 5:116":{"ref":"Surah Al-Ma'idah (5)","verses":[{"v":116,"t":"And when Allah saith: O Jesus, son of Mary! Didst thou say unto mankind: Take me and my mother for two gods beside Allah? he saith: Be glorified! It was not mine to utter that to which I had no right. If I used to say it, then Thou knewest it. Thou knowest what is in my mind, and I know not what is in Thy Mind. Lo! Thou, only Thou, art the Knower of Things Hidden?"}]},"Quran 5:75":{"ref":"Surah Al-Ma'idah (5)","verses":[{"v":75,"t":"The Messiah, son of Mary, was no other than a messenger, messengers (the like of whom) had passed away before him. And his mother was a saintly woman. And they both used to eat (earthly) food. See how We make the revelations clear for them, and see how they are turned away!"}]},"Quran 4:171":{"ref":"Surah An-Nisa (4)","verses":[{"v":171,"t":"O People of the Scripture! Do not exaggerate in your religion nor utter aught concerning Allah save the truth. The Messiah, Jesus son of Mary, was only a messenger of Allah, and His word which He conveyed unto Mary, and a spirit from Him. So believe in Allah and His messengers, and say not \"Three\" - Cease! (it is) better for you! - Allah is only One Allah. Far is it removed from His Transcendent Majesty that He should have a son. His is all that is in the heavens and all that is in the earth. And Allah is sufficient as Defender."}]},"Matthew 28:19":{"ref":"Matthew 28","verses":[{"v":19,"t":"Go ye therefore, and teach all nations, baptizing them in the name of the Father, and of the Son, and of the Holy Ghost:"}]},"2 Corinthians 13:14":{"ref":"2 Corinthians 13","verses":[{"v":14,"t":"The grace of the Lord Jesus Christ, and the love of God, and the communion of the Holy Ghost, be with you all. Amen."}]},"John 1:1-3":{"ref":"John 1","verses":[{"v":1,"t":"In the beginning was the Word, and the Word was with God, and the Word was God."},{"v":2,"t":"The same was in the beginning with God."},{"v":3,"t":"All things were made by him; and without him was not any thing made that was made."}]},"Quran 5:73":{"ref":"Surah Al-Ma'idah (5)","verses":[{"v":73,"t":"They surely disbelieve who say: Lo! Allah is the third of three; when there is no Allah save the One Allah. If they desist not from so saying a painful doom will fall on those of them who disbelieve."}]},"Deuteronomy 6:4":{"ref":"Deuteronomy 6","verses":[{"v":4,"t":"Hear, O Israel: The LORD our God is one LORD:"}]},"Mark 12:29":{"ref":"Mark 12","verses":[{"v":29,"t":"And Jesus answered him, The first of all the commandments is, Hear, O Israel; The Lord our God is one Lord:"}]},"1 Corinthians 8:6":{"ref":"1 Corinthians 8","verses":[{"v":6,"t":"But to us there is but one God, the Father, of whom are all things, and we in him; and one Lord Jesus Christ, by whom are all things, and we by him."}]},"Quran 112:1-4":{"ref":"Surah Al-Ikhlas (112)","verses":[{"v":1,"t":"Say: He is Allah, the One!"},{"v":2,"t":"Allah, the eternally Besought of all!"},{"v":3,"t":"He begetteth not nor was begotten."},{"v":4,"t":"And there is none comparable unto Him."}]},"Quran 6:101":{"ref":"Surah Al-An'am (6)","verses":[{"v":101,"t":"The Originator of the heavens and the earth! How can He have a child, when there is for Him no consort, when He created all things and is Aware of all things?"}]},"Quran 19:88-92":{"ref":"Surah Maryam (19)","verses":[{"v":88,"t":"And they say: The Beneficent hath taken unto Himself a son."},{"v":89,"t":"Assuredly ye utter a disastrous thing"},{"v":90,"t":"Whereby almost the heavens are torn, and the earth is split asunder and the mountains fall in ruins,"},{"v":91,"t":"That ye ascribe unto the Beneficent a son,"},{"v":92,"t":"When it is not meet for (the Majesty of) the Beneficent that He should choose a son."}]},"Quran 2:116":{"ref":"Surah Al-Baqarah (2)","verses":[{"v":116,"t":"And they say: Allah hath taken unto Himself a son. Be He glorified! Nay, but whatsoever is in the heavens and the earth is His. All are subservient unto Him."}]},"Quran 53:19-21":{"ref":"Surah An-Najm (53)","verses":[{"v":19,"t":"Have ye thought upon Al-Lat and Al-'Uzza"},{"v":20,"t":"And Manat, the third, the other?"},{"v":21,"t":"Are yours the males and His the females?"}]},"John 1:14":{"ref":"John 1","verses":[{"v":14,"t":"And the Word was made flesh, and dwelt among us, (and we beheld his glory, the glory as of the only begotten of the Father,) full of grace and truth."}]},"John 1:18":{"ref":"John 1","verses":[{"v":18,"t":"No man hath seen God at any time; the only begotten Son, which is in the bosom of the Father, he hath declared him."}]},"Hebrews 1:3":{"ref":"Hebrews 1","verses":[{"v":3,"t":"Who being the brightness of his glory, and the express image of his person, and upholding all things by the word of his power, when he had by himself purged our sins, sat down on the right hand of the Majesty on high;"}]},"Psalm 2:7":{"ref":"Psalms 2","verses":[{"v":7,"t":"I will declare the decree: the LORD hath said unto me, Thou art my Son; this day have I begotten thee."}]},"Colossians 1:15-17":{"ref":"Colossians 1","verses":[{"v":15,"t":"Who is the image of the invisible God, the firstborn of every creature:"},{"v":16,"t":"For by him were all things created, that are in heaven, and that are in earth, visible and invisible, whether they be thrones, or dominions, or principalities, or powers: all things were created by him, and for him:"},{"v":17,"t":"And he is before all things, and by him all things consist."}]},"Quran 11:90":{"ref":"Surah Hud (11)","verses":[{"v":90,"t":"Ask pardon of your Lord and then turn unto Him (repentant). Lo! my Lord is Merciful, Loving."}]},"Quran 85:14":{"ref":"Surah Al-Buruj (85)","verses":[{"v":14,"t":"And He is the Forgiving, the Loving,"}]},"Quran 3:31-32":{"ref":"Surah Ali 'Imran (3)","verses":[{"v":31,"t":"Say, (O Muhammad, to mankind): If ye love Allah, follow me; Allah will love you and forgive you your sins. Allah is Forgiving, Merciful."},{"v":32,"t":"Say: Obey Allah and the messenger. But if they turn away, lo! Allah loveth not the disbelievers (in His guidance)."}]},"Quran 2:190":{"ref":"Surah Al-Baqarah (2)","verses":[{"v":190,"t":"Fight in the way of Allah against those who fight against you, but begin not hostilities. Lo! Allah loveth not aggressors."}]},"Quran 5:18":{"ref":"Surah Al-Ma'idah (5)","verses":[{"v":18,"t":"The Jews and Christians say: We are sons of Allah and His loved ones. Say: Why then doth He chastise you for your sins? Nay, ye are but mortals of His creating. He forgiveth whom He will, and chastiseth whom He will. Allah's is the Sovereignty of the heavens and the earth and all that is between them, and unto Him is the journeying."}]},"1 John 4:8-10":{"ref":"1 John 4","verses":[{"v":8,"t":"He that loveth not knoweth not God; for God is love."},{"v":9,"t":"In this was manifested the love of God toward us, because that God sent his only begotten Son into the world, that we might live through him."},{"v":10,"t":"Herein is love, not that we loved God, but that he loved us, and sent his Son to be the propitiation for our sins."}]},"1 John 4:16":{"ref":"1 John 4","verses":[{"v":16,"t":"And we have known and believed the love that God hath to us. God is love; and he that dwelleth in love dwelleth in God, and God in him."}]},"John 17:24":{"ref":"John 17","verses":[{"v":24,"t":"Father, I will that they also, whom thou hast given me, be with me where I am; that they may behold my glory, which thou hast given me: for thou lovedst me before the foundation of the world."}]},"Matthew 6:9":{"ref":"Matthew 6","verses":[{"v":9,"t":"After this manner therefore pray ye: Our Father which art in heaven, Hallowed be thy name."}]},"Romans 5:8":{"ref":"Romans 5","verses":[{"v":8,"t":"But God commendeth his love toward us, in that, while we were yet sinners, Christ died for us."}]},"Quran 3:54":{"ref":"Surah Ali 'Imran (3)","verses":[{"v":54,"t":"And they (the disbelievers) schemed, and Allah schemed (against them): and Allah is the best of schemers."}]},"Quran 8:30":{"ref":"Surah Al-Anfal (8)","verses":[{"v":30,"t":"And when those who disbelieve plot against thee (O Muhammad) to wound thee fatally, or to kill thee or to drive thee forth; they plot, but Allah (also) plotteth; and Allah is the best of plotters."}]},"Quran 7:99":{"ref":"Surah Al-A'raf (7)","verses":[{"v":99,"t":"Are they then secure from Allah's scheme? None deemeth himself secure from Allah's scheme save folk that perish."}]},"Quran 10:21":{"ref":"Surah Yunus (10)","verses":[{"v":21,"t":"And when We cause mankind to taste of mercy after some adversity which had afflicted them, behold! they have some plot against Our revelations. Say: Allah is more swift in plotting. Lo! Our messengers write down that which ye plot."}]},"Titus 1:2":{"ref":"Titus 1","verses":[{"v":2,"t":"In hope of eternal life, which God, that cannot lie, promised before the world began;"}]},"Numbers 23:19":{"ref":"Numbers 23","verses":[{"v":19,"t":"God is not a man, that he should lie; neither the son of man, that he should repent: hath he said, and shall he not do it? or hath he spoken, and shall he not make it good?"}]},"Hebrews 6:18":{"ref":"Hebrews 6","verses":[{"v":18,"t":"That by two immutable things, in which it was impossible for God to lie, we might have a strong consolation, who have fled for refuge to lay hold upon the hope set before us:"}]},"John 14:6":{"ref":"John 14","verses":[{"v":6,"t":"Jesus saith unto him, I am the way, the truth, and the life: no man cometh unto the Father, but by me."}]},"Quran 3:45-49":{"ref":"Surah Ali 'Imran (3)","verses":[{"v":45,"t":"(And remember) when the angels said: O Mary! Lo! Allah giveth thee glad tidings of a word from him, whose name is the Messiah, Jesus, son of Mary, illustrious in the world and the Hereafter, and one of those brought near (unto Allah)."},{"v":46,"t":"He will speak unto mankind in his cradle and in his manhood, and he is of the righteous."},{"v":47,"t":"She said: My Lord! How can I have a child when no mortal hath touched me? He said: So (it will be). Allah createth what He will. If He decreeth a thing, He saith unto it only: Be! and it is."},{"v":48,"t":"And He will teach him the Scripture and wisdom, and the Torah and the Gospel,"},{"v":49,"t":"And will make him a messenger unto the Children of Israel, (saying): Lo! I come unto you with a sign from your Lord. Lo! I fashion for you out of clay the likeness of a bird, and I breathe into it and it is a bird, by Allah's leave. I heal him who was born blind, and the leper, and I raise the dead, by Allah's leave. And I announce unto you what ye eat and what ye store up in your houses. Lo! herein verily is a portent for you, if ye are to be believers."}]},"Quran 21:91":{"ref":"Surah Al-Anbya (21)","verses":[{"v":91,"t":"And she who was chaste, therefor We breathed into her (something) of Our Spirit and made her and her son a token for (all) peoples."}]},"Quran 3:55":{"ref":"Surah Ali 'Imran (3)","verses":[{"v":55,"t":"(And remember) when Allah said: O Jesus! Lo! I am gathering thee and causing thee to ascend unto Me, and am cleansing thee of those who disbelieve and am setting those who follow thee above those who disbelieve until the Day of Resurrection. Then unto Me ye will (all) return, and I shall judge between you as to that wherein ye used to differ."}]},"Quran 43:61":{"ref":"Surah Az-Zukhruf (43)","verses":[{"v":61,"t":"And lo! verily there is knowledge of the Hour. So doubt ye not concerning it, but follow Me. This is the right path."}]},"Luke 1:35":{"ref":"Luke 1","verses":[{"v":35,"t":"And the angel answered and said unto her, The Holy Ghost shall come upon thee, and the power of the Highest shall overshadow thee: therefore also that holy thing which shall be born of thee shall be called the Son of God."}]},"Quran 3:46":{"ref":"Surah Ali 'Imran (3)","verses":[{"v":46,"t":"He will speak unto mankind in his cradle and in his manhood, and he is of the righteous."}]},"Quran 19:29-33":{"ref":"Surah Maryam (19)","verses":[{"v":29,"t":"Then she pointed to him. They said: How can we talk to one who is in the cradle, a young boy?"},{"v":30,"t":"He spake: Lo! I am the slave of Allah. He hath given me the Scripture and hath appointed me a Prophet,"},{"v":31,"t":"And hath made me blessed wheresoever I may be, and hath enjoined upon me prayer and almsgiving so long as I remain alive,"},{"v":32,"t":"And (hath made me) dutiful toward her who bore me, and hath not made me arrogant, unblest."},{"v":33,"t":"Peace on me the day I was born, and the day I die, and the day I shall be raised alive!"}]},"Quran 25:4-5":{"ref":"Surah Al-Furqan (25)","verses":[{"v":4,"t":"Those who disbelieve say: This is naught but a lie that he hath invented, and other folk have helped him with it, so that they have produced a slander and a lie."},{"v":5,"t":"And they say: Fables of the men of old which he hath had written down so that they are dictated to him morn and evening."}]},"John 2:11":{"ref":"John 2","verses":[{"v":11,"t":"This beginning of miracles did Jesus in Cana of Galilee, and manifested forth his glory; and his disciples believed on him."}]},"Luke 2:52":{"ref":"Luke 2","verses":[{"v":52,"t":"And Jesus increased in wisdom and stature, and in favour with God and man."}]},"John 20:30-31":{"ref":"John 20","verses":[{"v":30,"t":"And many other signs truly did Jesus in the presence of his disciples, which are not written in this book:"},{"v":31,"t":"But these are written, that ye might believe that Jesus is the Christ, the Son of God; and that believing ye might have life through his name."}]},"Quran 9:30":{"ref":"Surah At-Tawbah (9)","verses":[{"v":30,"t":"And the Jews say: Ezra is the son of Allah, and the Christians say: The Messiah is the son of Allah. That is their saying with their mouths. They imitate the saying of those who disbelieved of old. Allah (Himself) fighteth against them. How perverse are they!"}]},"Quran 5:17":{"ref":"Surah Al-Ma'idah (5)","verses":[{"v":17,"t":"They indeed have disbelieved who say: Lo! Allah is the Messiah, son of Mary. Say: Who then can do aught against Allah, if He had willed to destroy the Messiah son of Mary, and his mother and everyone on earth? Allah's is the Sovereignty of the heavens and the earth and all that is between them. He createth what He will. And Allah is Able to do all things."}]},"Quran 5:72":{"ref":"Surah Al-Ma'idah (5)","verses":[{"v":72,"t":"They surely disbelieve who say: Lo! Allah is the Messiah, son of Mary. The Messiah (himself) said: O Children of Israel, worship Allah, my Lord and your Lord. Lo! whoso ascribeth partners unto Allah, for him Allah hath forbidden paradise. His abode is the Fire. For evil-doers there will be no helpers."}]},"John 5:18":{"ref":"John 5","verses":[{"v":18,"t":"Therefore the Jews sought the more to kill him, because he not only had broken the sabbath, but said also that God was his Father, making himself equal with God."}]},"John 8:58-59":{"ref":"John 8","verses":[{"v":58,"t":"Jesus said unto them, Verily, verily, I say unto you, Before Abraham was, I am."},{"v":59,"t":"Then took they up stones to cast at him: but Jesus hid himself, and went out of the temple, going through the midst of them, and so passed by."}]},"John 10:30-33":{"ref":"John 10","verses":[{"v":30,"t":"I and my Father are one."},{"v":31,"t":"Then the Jews took up stones again to stone him."},{"v":32,"t":"Jesus answered them, Many good works have I shewed you from my Father; for which of those works do ye stone me?"},{"v":33,"t":"The Jews answered him, saying, For a good work we stone thee not; but for blasphemy; and because that thou, being a man, makest thyself God."}]},"John 20:28-29":{"ref":"John 20","verses":[{"v":28,"t":"And Thomas answered and said unto him, My Lord and my God."},{"v":29,"t":"Jesus saith unto him, Thomas, because thou hast seen me, thou hast believed: blessed are they that have not seen, and
