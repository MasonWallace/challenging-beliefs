{"id":"sun-muddy-spring","category":"science-history","severity":"medium","verdict":"contested","title":"The sun sets in a muddy spring (18:86)","claim":"Quran 18:86 says Dhul-Qarnayn traveled until 'he reached the setting-place of the sun; he found it setting in a muddy spring.' The parallel 18:90 has a literal rising-place where the sun rises on a people with no shelter from it. Early tafsir shows this was understood literally: al-Tabari preserves narrations taking the sun as actually setting in the spring, and Ibn Kathir describes 'a blackened, muddy and stinking spring.' A supporting hadith (Sunan Abi Dawud 4002: 'It sets in a spring of warm water') exists but is graded weak — critics who lean on it overstate the case; the tafsir record is the stronger evidence of literal cosmology.","quran":["Quran 18:86","Quran 18:90","Quran 36:38-40"],"hadith":["Sunan Abi Dawud 4002"],"bible":[],"sources":[{"name":"Sunan Abi Dawud 4002 (graded da'if)","type":"primary","url":"https://sunnah.com/abudawud:4002"},{"name":"Tafsir al-Tabari on 18:86 (translated survey)","type":"apologetics","url":"https://theislamissue.wordpress.com/2022/03/23/tafsir-al-tabari-for-q1886/"},{"name":"Answering Islam — Muhammad on the Setting Place of the Sun","type":"apologetics","url":"https://www.answering-islam.org/authors/shamoun/mhmd_on_sunset.html"},{"name":"IslamQA 176375 — the correct way to describe the sun","type":"muslim","url":"https://islamqa.info/en/answers/176375"}],"response":"The verse describes what Dhul-Qarnayn perceived from his vantage point ('he found it' = it appeared to him), just as English speakers say 'sunset' — phenomenological, not cosmological, language. He simply reached the westernmost point of his journey, a shoreline where the sun appeared to sink into dark water. The Abu Dawud hadith is weak and cannot establish doctrine; the authentic description is that the sun 'prostrates beneath the Throne' (Bukhari 3199), a metaphysical, not physical, statement.","responseSource":{"name":"IslamQA 176375","url":"https://islamqa.info/en/answers/176375"},"rationale":"The Arabic can grammatically bear a phenomenological reading, and the strongest hadith is weak — so this is not admitted. But the phenomenological defense is anachronistic: 18:90's parallel rising-place, the mirrored structure of the journey, and the earliest tafsir record show the first Muslim generations read it as real cosmology consistent with late-antique Near Eastern beliefs. The defense requires the earliest interpreters to have misread their own book."},
{"id":"reproductive-science-galen","category":"science-history","severity":"high","verdict":"unrefuted","title":"Semen from between backbone and ribs (86:5–7) and Galenic embryology (23:14)","claim":"Quran 86:5–7: man is created from 'a gushing fluid, proceeding from between the backbone and the ribs.' Semen is produced in the testes, not the torso; the verse echoes the Greek view that semen descends from the region of the back, and classical tafsir took it anatomically. Separately, 23:14 gives the embryonic sequence: drop → clinging clot → chewed lump → bones → bones clothed with flesh. This tracks Galen's four stages, including Galen's error — bone forming first and then being 'clothed' with flesh, whereas muscle and bone develop concurrently. Medieval Arabic medicine itself mapped the Quranic terms onto Galen's stages, and the embryo is never a 'clot of blood.'","quran":["Quran 86:5-7","Quran 23:12-14","Quran 22:5","Quran 75:37-39"],"hadith":["Sahih Muslim 2645"],"bible":[],"sources":[{"name":"WikiIslam — Embryology in the Quran","type":"apologetics","url":"https://wikiislam.net/wiki/Embryology_in_the_Quran"},{"name":"Answering Islam — 'Alaqa and other embryological stages","type":"apologetics","url":"https://www.answering-islam.org/Quran/Science/alaqa.html"},{"name":"IslamQA 118879 — commentary on 86:6-7","type":"muslim","url":"https://islamqa.info/en/answers/118879"}],"response":"On 86:5–7: 'sulb' and 'tara'ib' are a merism for the whole torso, or refer respectively to the man's loins and the woman's chest — the fluid of both parents; some modern writers argue the terms denote the embryological origin-sites of the gonads, which do form near the kidneys before descending. On 23:14: the stages are broad visual descriptions accessible to a 7th-century audience; 'alaqah' means 'clinging thing' (accurate for implantation), and 'then' need not be strictly sequential. Keith Moore endorsed the compatibility of these terms with modern embryology.","responseSource":{"name":"IslamQA 118879; Bucaille; iERA embryology paper (later revised)","url":"https://islamqa.info/en/answers/118879"},"rationale":"The reinterpretations are post-hoc: classical exegetes read 86:7 anatomically, and no reading rescues fluid physically gushing from between backbone and ribs. On embryology, the sequence matches Galen down to sharing Galen's specific bones-then-flesh error, and Muslim physicians for centuries used the Quranic terms as translations of Galen's stages. Keith Moore's endorsement came in a Saudi-sponsored context and is not accepted by the scientific community; the iERA paper was withdrawn and revised after criticism. A 'broad visual description' that reproduces the precise erroneous schema of the era's dominant Greek medicine is evidence of human sourcing."},
{"id":"mary-sister-of-aaron","category":"science-history","severity":"high","verdict":"unrefuted","title":"Mary called 'sister of Aaron' and 'daughter of Imran' (19:28; 66:12; 3:35)","claim":"The Quran calls Mary mother of Jesus 'sister of Aaron' (19:28), her mother 'the wife of Imran' (3:35), and Mary 'daughter of Imran' (66:12) — exactly the family of Miriam in the Bible: Miriam, daughter of Amram (Imran), sister of Aaron and Moses (Exodus 15:20; Numbers 26:59), who lived ~1,400 years before Mary. The triple match (father Imran + brother Aaron + the identical name Maryam/Miriam) indicates the two women were conflated. Crucially, this objection is as old as Islam: in Sahih Muslim 2135, the Christians of Najran put precisely this problem to Mughira ibn Shu'ba, and Muhammad's answer was that people 'used to give names after the names of Apostles and pious persons before them.'","quran":["Quran 19:28","Quran 66:12","Quran 3:35-36"],"hadith":["Sahih Muslim 2135"],"bible":["Exodus 15:20","Numbers 26:59","1 Chronicles 6:3"],"sources":[{"name":"Sahih Muslim 2135","type":"primary","url":"https://sunnah.com/muslim:2135"},{"name":"Answering Islam — Is Mary the Sister of Aaron?","type":"apologetics","url":"https://www.answering-islam.org/Silas/mary.htm"},{"name":"Abu Amina Elias — Why Mary is called sister of Aaron","type":"muslim","url":"https://www.abuaminaelias.com/dailyhadithonline/2012/10/05/sister-harun-quran/"}],"response":"The Prophet himself answered this in Sahih Muslim 2135: Semitic naming convention attached people to revered ancestors — 'sister of Aaron' means 'woman of the Aaronic/priestly line' (compare Luke 1:5 calling Elizabeth 'of the daughters of Aaron,' and Mary being her kinswoman). 'Daughter of Imran' likewise denotes descent from the house of Imran/Amram, and Surah 3 is named 'the FAMILY of Imran,' signaling lineage language. So there is no confusion — only idiom.","responseSource":{"name":"Sahih Muslim 2135 (Muhammad's own recorded answer); Abu Amina Elias","url":"https://www.abuaminaelias.com/dailyhadithonline/2012/10/05/sister-harun-quran/"},"rationale":"The steelman is real (Luke 1:5 shows tribal-descent idiom exists) but does not cover the evidence: the Quran never uses 'sister of X' as a lineage idiom anywhere else; it does not merely link Mary to Aaron but gives her the full Exodus family — father Imran, brother Aaron, identical name — and 3:35–36 narrates Imran's wife giving birth to Mary as a continuous story. A lineage idiom explains one datum, not three converging ones. That the difficulty was spotted by 7th-century Christians and required a recorded answer confirms the natural reading was and is the problem."},
{"id":"samaritan-anachronism","category":"science-history","severity":"medium","verdict":"contested","title":"A 'Samaritan' at the golden calf (20:85–97)","claim":"Quran 20:85–97 says the golden calf at Sinai was made not by Aaron (as in Exodus 32) but by 'al-Samiri' — 'the Samaritan.' The Samaritans as a people emerged after the Assyrian conquest of the northern kingdom (post-722 BC) at the earliest — roughly seven centuries after the Exodus period. Scholars note the story likely reflects later anti-Samaritan polemic (the Samaritans' association with calf-worship at Bethel and Dan) retrojected into the Exodus narrative. The Quran also transfers blame from Aaron, whom the Bible explicitly names as the calf's maker.","quran":["Quran 20:85-97"],"hadith":[],"bible":["Exodus 32:1-6","2 Kings 17:24-41"],"sources":[{"name":"Answering Islam — Samaritans in the time of Moses?","type":"apologetics","url":"https://www.answering-islam.org/Quran/Contra/h002.html"},{"name":"Islamic Awareness — The 'Samaritan' Error In The Qur'an?","type":"muslim","url":"https://www.islamic-awareness.org/quran/contrad/external/samaritan.html"},{"name":"Answering Islam — response to Islamic Awareness","type":"apologetics","url":"https://www.answering-islam.org/Responses/Saifullah/samaritan.htm"}],"response":"'Al-Samiri' is an attributive name of one individual, not necessarily 'the Samaritan': it could derive from a clan or place name (the Israelite clan of Shemer — 1 Kings 16:24 shows 'Shemer' as a personal name predating the city of Samaria). Alternatively, Samaritan tradition itself claims pre-exilic Israelite origins, so the name's referent may be older than critics allow. The Quran corrects, rather than copies, the biblical account by exonerating a prophet (Aaron) from idol-making.","responseSource":{"name":"Islamic Awareness — 'The Samaritan Error In The Quran?'","url":"https://www.islamic-awareness.org/quran/contrad/external/samaritan.html"},"rationale":"The etymological escape route is linguistically possible — 'al-Samiri' need not be an ethnonym, and 'Shemer' as a name is attested early. But it is special pleading against the most natural Arabic reading (al-Samiri = the Samaritan, exactly as classical usage renders the ethnic term), and the narrative fits known post-biblical polemical motifs. Neither side can strictly prove the referent — though the critic's reading is the more probable one, and the exoneration of Aaron against Exodus 32 remains a separate, unanswered divergence."},
{"id":"dhul-qarnayn-alexander","category":"science-history","severity":"high","verdict":"unrefuted","title":"Dhul-Qarnayn and the Syriac Alexander Legend (18:83–102)","claim":"The Quran's Dhul-Qarnayn ('Two-Horned One') story — journey to the sun's setting and rising places, a wall of iron and brass imprisoning Gog and Magog until the end times — closely parallels the Syriac Alexander Legend, a Christian propaganda text whose final redaction dates to c. 629–630 AD with a 6th-century core. Kevin van Bladel (2008) and Tommaso Tesei (Oxford, 2023) argue the Quranic account depends on this legend: same sequence, same two-horned motif (Alexander is horned on his coins and in the legend), same fetid water at the sunset place, same eschatological wall. A Greek pagan king, remembered through Christian legend, appears in the Quran as a monotheist hero — and the geography belongs to legend, not history.","quran":["Quran 18:83-102","Quran 21:96"],"hadith":[],"bible":["Ezekiel 38:1-6"],"sources":[{"name":"Kevin van Bladel — 'The Alexander Legend in the Quran 18:83-102' (2008)","type":"scholarly","url":"https://www.academia.edu/33727330/van_Bladel_2008_The_Alexander_Legend_in_the_Quran_18_83_102"},{"name":"Tommaso Tesei — The Syriac Legend of Alexander's Gate (Oxford UP, 2023)","type":"scholarly","url":"https://global.oup.com/academic/product/the-syriac-legend-of-alexanders-gate-9780197646878"},{"name":"'Did the Quran borrow from the Syriac Legend of Alexander?' (dissenting analysis)","type":"muslim","url":"https://ponderingislam.com/2020/02/15/did-the-qur%CA%BEan-borrow-from-the-syriac-legend-of-alexander/"}],"response":"Three lines: (1) Identity — Dhul-Qarnayn is not Alexander but Cyrus the Great (a monotheist-friendly king; the two-horned ram of Daniel 8:20) or an unknown ancient king. (2) Chronology — if the Syriac Legend's final form is c. 629–630, it may be too late to be a source for a Meccan surah; both may draw on a common older oral tradition. (3) Theology — the Quran, answering questions posed via Jews, retells a story its audience knew, correcting it monotheistically; a shared narrative frame is not error, and the Quran omits the legend's explicitly Christian elements.","responseSource":{"name":"Islamic Awareness / Pondering Islam response papers; Maududi (Cyrus identification)","url":"https://ponderingislam.com/2020/02/15/did-the-qur%CA%BEan-borrow-from-the-syriac-legend-of-alexander/"},"rationale":"In academic scholarship the dependence thesis (or at minimum shared legend-matter) is the mainstream view; Tesei's dating of the legend's core to the mid-6th century dissolves the chronology objection, and the Cyrus identification is a 20th-century apologetic with no early tafsir support — classical exegetes themselves commonly identified Dhul-Qarnayn with Alexander. The 'common source' concession still grants the decisive point: the Quran presents legendary material (a literal setting-place of the sun, an eschatological wall no one has found) as factual history."},
{"id":"cosmology-stars-missiles","category":"science-history","severity":"medium","verdict":"unrefuted","title":"Solid sky, seven heavens, and stars as missiles against devils (67:5)","claim":"The Quran describes the sky as a solid structure: a ceiling held up without visible pillars (13:2; 31:10), which could fall on people in pieces (34:9), with seven stacked heavens (67:3), the lowest adorned with 'lamps' (stars) which Allah made 'missiles against the devils' (67:5; cf. 37:6–10; 72:8–9 — jinn ascending to eavesdrop are pelted with burning flames). This treats stars and meteors as the same class of object: meteors are dust grains burning in the atmosphere; stars are distant suns. Mainstream tafsir confirms the reading — Qatada (in Ibn Kathir on 67:5): 'These stars were only created for three purposes: adornment for the heaven, missiles for the devils, and signs for navigation.'","quran":["Quran 67:3-5","Quran 37:6-10","Quran 72:8-9","Quran 15:16-18","Quran 13:2","Quran 34:9"],"hadith":["Sahih Muslim 2229"],"bible":[],"sources":[{"name":"Tafsir Ibn Kathir on 67:5","type":"muslim","url":"https://quran.com/en/67:5/tafsirs/en-tafisr-ibn-kathir"},{"name":"WikiIslam — Shooting Stars in the Quran","type":"apologetics","url":"https://wikiislam.net/wiki/Shooting_Stars_in_the_Quran"},{"name":"WikiIslam — Cosmology of the Quran","type":"apologetics","url":"https://wikiislam.net/wiki/Cosmology_of_the_Quran"}],"response":"In Arabic, 'najm' and 'kawkab' can denote any luminous heavenly body, including meteors — so 67:5 speaks of luminous projectiles from the lower heaven, not literal suns being thrown; Ibn Kathir himself explains that 'a meteor of fire detaches itself from the star,' the star remaining in place. The seven heavens are unseen metaphysical realms, not physical shells, and canopy language is protective metaphor (the atmosphere genuinely shields earth). The verses describe the unseen — a theological datum not falsifiable by astronomy.","responseSource":{"name":"Tafsir Ibn Kathir on 67:5; IslamQA treatments","url":"https://quran.com/en/67:5/tafsirs/en-tafisr-ibn-kathir"},"rationale":"67:5 identifies the objects made into missiles as the same 'lamps' that adorn the lowest heaven — the visible stars — and Qatada's mainstream tafsir states exactly that. Ibn Kathir's detaching-meteor gloss is itself an attempted harmonization that still ties meteors physically to stars, which is false. The reading fits precisely the 7th-century phenomenology of shooting stars. The metaphysical-realms defense is viable in isolation, but the missile verses anchor the cosmology to visible objects."},
{"id":"abrogation-satanic-verses","category":"quran-text","severity":"high","verdict":"contested","title":"Abrogation (2:106) and the satanic verses incident","claim":"Quran 2:106 and 16:101 state that Allah replaces some revealed verses with others — critics ask why an omniscient God's eternal speech needs canceling and re-issuing within 23 years, with 16:101 recording that contemporaries concluded 'You are but a forger.' The sharpest test case is the satanic-verses incident: early Islamic sources — al-Tabari, Ibn Sa'd, al-Waqidi — record that Muhammad, wishing reconciliation with Quraysh, recited praise of the goddesses al-Lat, al-Uzza, and Manat ('these are the exalted cranes whose intercession is hoped for') after 53:19–20, later attributed to Satan and canceled — with 22:52 ('Satan threw something into the recitation of every prophet') read by early exegetes as the divine comment on the event. Shahab Ahmed (Harvard, 'Before Orthodoxy') showed the incident was a standard element of Muslim historical memory for Islam's first ~150 years, and only later became universally rejected.","quran":["Quran 2:106","Quran 16:101","Quran 22:52","Quran 53:19-23","Quran 17:73-75"],"hadith":["Sahih al-Bukhari 4862"],"bible":["Deuteronomy 18:20-22","Malachi 3:6"],"sources":[{"name":"Shahab Ahmed — Before Orthodoxy: The Satanic Verses in Early Islam (Harvard UP)","type":"scholarly","url":"https://nes.princeton.edu/publications/orthodoxy-satanic-verses-early-islam"},{"name":"Answering Islam — The Story of the Cranes","type":"apologetics","url":"https://www.answering-islam.org/Green/satanic.htm"},{"name":"SeekersGuidance — What Is Abrogation (Naskh)?","type":"muslim","url":"https://seekersguidance.org/answers/quran/what-is-abrogation-naskh-in-the-quran/"}],"response":"On abrogation: naskh is progressive legislation, not divine self-correction — staged pedagogy (alcohol banned in three steps), each ruling perfect for its time; Jewish and Christian scripture also supersedes earlier law (the sacrificial system; Acts 10). On the satanic verses: every chain of the story is broken (no Companion eyewitness); it is absent from Bukhari and Muslim; it contradicts the Quran's own guarantee (53:3–4); and its many mutually contradictory versions mark it as storyteller material. Scholars from Ibn Khuzaymah ('a fabrication of the heretics') to al-Albani have rejected it on chain-of-transmission grounds.","responseSource":{"name":"Al-Albani, 'Nasb al-Majaniq'; SeekersGuidance on naskh","url":"https://seekersguidance.org/answers/quran/what-is-abrogation-naskh-in-the-quran/"},"rationale":"Two components, two results. Abrogation as a phenomenon is conceded (2:106 is explicit; classical scholarship catalogued abrogated verses), but whether it is a defect is a theological judgment on which the progressive-legislation steelman is coherent. The satanic-verses incident: Shahab Ahmed's demonstration of early universal acceptance is historically weighty, and 22:52 with 17:73–75 read most naturally as responses to a real event; but the chain criticism is genuine (no single sound chain), so on this app's own evidence standard it cannot be graded admitted. The historical-critical case is stronger than most Muslims allow, and the chain case stronger than most critics allow."},
{"id":"compilation-lost-verses","category":"quran-text","severity":"high","verdict":"admitted","title":"Compiled 'from palm stalks and the breasts of men' — and verses that never entered the mushaf","claim":"Against the perfect-preservation claim (15:9), Sahih sources record: (1) Bukhari 4986 — no compiled Quran existed at Muhammad's death; after heavy reciter casualties at Yamama, Umar feared 'a large part of the Quran may be lost,' and Zayd ibn Thabit collected it 'from palm-leaf stalks, thin white stones, and the hearts of men,' with the ending of Surah at-Tawbah found with only one man. (2) Sahih Muslim 1452a — Aisha states the 'five sucklings' wording 'was recited as part of the Quran' when the Prophet died, yet it is in no mushaf. (3) Umar in Bukhari 6829 affirms the stoning verse was revealed and recited — it too is absent. (4) Ibn Majah 1944 — Aisha: the page with those verses was under her bedding and 'a tame sheep came in and ate it' (the sheep detail rides on a weak chain — but the loss it narrates is independently attested in Sahih Muslim). (5) Abu Musa in Sahih Muslim 1050: 'we used to recite a surah resembling Bara'ah… I have forgotten it.'","quran":["Quran 15:9","Quran 2:106","Quran 87:6-7"],"hadith":["Sahih al-Bukhari 4986","Sahih Muslim 1452a","Sahih al-Bukhari 6829","Sunan Ibn Majah 1944","Sahih Muslim 1050"],"bible":[],"sources":[{"name":"Sahih al-Bukhari 4986","type":"primary","url":"https://sunnah.com/bukhari:4986"},{"name":"Sahih Muslim 1452a","type":"primary","url":"https://sunnah.com/muslim:1452a"},{"name":"IslamQA 175355 — the sheep hadith is not sahih","type":"muslim","url":"https://islamqa.info/en/answers/175355"},{"name":"Al-Azami — The History of the Quranic Text","type":"muslim","url":"https://archive.org/details/history-quranic-text-azami-2nd"}],"response":"Preservation was primarily oral: hundreds of memorizers carried the complete text, so Zayd's written collection was a verification exercise over an already-memorized whole — 'found with only one man' means only one written copy, not only one memory. The 'missing' verses fall under divinely-intended abrogation of recitation (naskh al-tilawah): the stoning and suckling wordings had their recitation withdrawn while (for stoning) the ruling remained — 2:106 explicitly includes verses 'caused to be forgotten.' The sheep story is weak and contradicted by stronger chains without it. Al-Azami's monograph argues the compilation methodology was the most rigorous in the history of any scripture.","responseSource":{"name":"Al-Azami, The History of the Quranic Text; IslamQA 175355; ICRAA","url":"https://www.icraa.org/quran-lost-verse-five-suckling/"},"rationale":"The load-bearing facts are all in Sahih collections and conceded by mainstream scholarship: no complete compiled codex at the Prophet's death, fear of loss at Yamama, wordings believed by Companions to be Quran that are not in today's Quran, and a whole forgotten surah reported. The naskh al-tilawah defense is the concession dressed in doctrine — it grants that recited Quranic material exited the text and explains it as intentional, which is unfalsifiable and circular: any lost verse can be declared 'abrogated in recitation' after the fact, on the authority of the very reports that show the loss. 15:9's guarantee is maintained only by definitional maneuver."},
{"id":"uthman-standardization-qiraat","category":"quran-text","severity":"high","verdict":"admitted","title":"Uthman's burning of rival codices, companion variants, and Hafs vs. Warsh today","claim":"Bukhari 4987: during Uthman's reign, Muslims 'differed in their recitation' so sharply that Hudhayfa feared division 'as Jews and Christians differed'; Uthman had one recension copied and 'ordered that all the other Quranic materials, whether fragmentary manuscripts or whole copies, be burnt.' Companion codices were suppressed — Ibn Mas'ud's reportedly lacked surahs 1, 113, and 114; Ubayy's contained two extra. Aisha and Hafsa both had 2:238 with the added words 'and the asr prayer.' Today the Quran is printed in materially different reading traditions: Hafs (most of the world) vs. Warsh (North/West Africa) differ in hundreds of places, some semantic (3:146 'fought' vs. 'was killed'). The Sanaa palimpsest's lower text shows a pre-Uthmanic text-form, and Daniel Brubaker has documented thousands of physical corrections in early manuscripts. 'A single letter-perfect text transmitted unchanged' is not what the manuscript and hadith record shows.","quran":["Quran 15:9","Quran 2:238","Quran 3:146"],"hadith":["Sahih al-Bukhari 4987","Sahih Muslim 629","Sahih al-Bukhari 5005"],"bible":[],"sources":[{"name":"Sahih al-Bukhari 4987","type":"primary","url":"https://sunnah.com/bukhari:4987"},{"name":"Daniel Brubaker — Corrections in Early Quran Manuscripts","type":"scholarly","url":"https://www.amazon.com/Corrections-Early-Qur%CA%BE%C4%81n-Manuscripts-Manuscript/dp/1949123030"},{"name":"Answering Islam — The Different Arabic Versions of the Quran (Samuel Green)","type":"apologetics","url":"https://answering-islam.org/Green/seven.htm"},{"name":"IRCICA — refutation of Brubaker (Altikulac)","type":"muslim","url":"https://www.ircica.org/publications/studies-on-the-holy-quran/refutation-of-daniel-alan-brubakers-corrections-in-early-qur%CA%BEan-manuscripts"}],"response":"The Quran was revealed in seven ahruf (modes) — all divinely revealed; Uthman's standardization eliminated no revelation but unified the community on one mode to prevent schism, with the Companions' unanimous approval. The canonical readings (Hafs, Warsh, etc.) are parallel mass-transmitted recitations going back to the Prophet — dialect and permitted variation, not corruption; virtually none affect doctrine. Companion codices were personal copies with explanatory notes, not rival Qurans. Brubaker's corrections are routine scribal fixes toward the standard text — a sign of careful control — and radiocarbon-dated early manuscripts (Birmingham, Tübingen) match today's text extraordinarily closely; no other ancient book is this stable.","responseSource":{"name":"Al-Azami; Islamic Awareness qira'at pages; IRCICA refutation of Brubaker","url":"https://www.islamic-awareness.org/quran/text/qiraat/hafs.html"},"rationale":"The facts — mass burning of variant codices by state order, companion codices differing in wording and even surah count per early sources, wives of the Prophet attesting different wording for 2:238, and two materially different printed texts today — are all from Sahih hadith, classical qira'at literature, and observable print editions; none is disputed by informed Muslim scholarship. What is contested is only the interpretation (divinely sanctioned modes vs. suppressed plurality). Fairness requires noting the steelman's genuine strength: early Qurans are remarkably stable POST-Uthman. But 'perfect preservation of one exact text' is refuted by Islam's own canon: what was preserved is the Uthmanic recension, achieved by destroying the evidence of what else existed."},
{"id":"aisha-age","category":"practice","severity":"high","verdict":"admitted","title":"Aisha: married at six, consummated at nine (Bukhari 5134; Muslim 1422)","claim":"Sahih al-Bukhari 5134 (also 3894) and Sahih Muslim 1422 record from Aisha herself: the Prophet married her when she was six and consummated the marriage when she was nine. Bukhari 6130 adds she was playing with dolls at his house. These are among the most multiply-attested biographical facts in the hadith corpus, accepted by all classical scholars, and nine-year consummation became a jurisprudential benchmark. The issue binds Islam because Muhammad is the 'excellent pattern' for all time (33:21), and 65:4 provides a divorce waiting-period for wives 'who have not yet menstruated,' which classical tafsir applies to pre-pubescent marriage.","quran":["Quran 33:21","Quran 65:4"],"hadith":["Sahih al-Bukhari 5134","Sahih al-Bukhari 3894","Sahih Muslim 1422","Sahih al-Bukhari 6130"],"bible":[],"sources":[{"name":"Sahih al-Bukhari 5134","type":"primary","url":"https://sunnah.com/bukhari:5134"},{"name":"Sahih Muslim 1422","type":"primary","url":"https://sunnah.com/muslim:1422"},{"name":"Yaqeen (Jonathan Brown) — The Age of Aisha: Rejecting Historical Revisionism","type":"muslim","url":"https://yaqeeninstitute.org/read/paper/the-age-of-aisha-ra-rejecting-historical-revisionism-and-modernist-presumptions"},{"name":"WikiIslam — Aisha's Age (revisionist arguments catalogued)","type":"apologetics","url":"https://wikiislam.net/wiki/Aisha's_Age"}],"response":"Two incompatible defenses circulate. (A) Revisionist: Aisha was actually ~15–19, arguing from her sister Asma's reported age and other inferences. (B) Traditional-contextualist (the scholarly mainstream — Jonathan Brown's Yaqeen paper): the ages are authentic and revisionism is bad hadith methodology; instead, the marriage must be judged in context: betrothal of minors with consummation at puberty was normal across premodern societies (including in Jewish and Christian law of the era); no contemporary or enemy of Muhammad ever criticized it; Aisha reports it without complaint and became Islam's greatest female scholar; and the marriage was commanded in a dream-revelation.","responseSource":{"name":"Jonathan A.C. Brown (Yaqeen) — 'The Age of Aisha'","url":"https://yaqeeninstitute.org/read/paper/the-age-of-aisha-ra-rejecting-historical-revisionism-and-modernist-presumptions"},"rationale":"The ages are conceded in the strongest possible Islamic sources — Aisha's own first-person narration in both Bukhari and Muslim through multiple chains — and the flagship traditionalist institution explicitly rejects the revisionist escape as methodologically indefensible: no classical scholar in 1,300 years doubted the ages. The live debate is only over the moral evaluation, which is a genuine argument but concedes every fact. For fairness: such marriages were unremarkable in antiquity; the Christian critique properly targets the claim that this man is the timeless moral exemplar (33:21), not 7th-century norms as such."},
{"id":"women-and-captives","category":"practice","severity":"high","verdict":"admitted","title":"Wife-beating (4:34) and sexual access to female captives (4:24; Muslim 1438)","claim":"Quran 4:34 instructs that wives whose rebellion is feared be admonished, then abandoned in bed, then struck — the plain verb daraba, rendered 'beat/strike' by the overwhelming majority of translators; classical tafsir universally understood physical hitting, qualified as 'not severe.' Sunan Abi Dawud 2146 records the trajectory: 'Do not beat Allah's handmaidens' — then permission after Umar's complaint — then, when women complained, 'those men are not the best of you.' Separately, 4:24 permits intercourse with married captive women (prior marriages annulled by capture), and Sahih Muslim 1438 shows companions on the Banu Mustaliq raid asking about coitus interruptus with newly captured women — Muhammad's objection concerned only the futility of thwarting predestination, not the act.","quran":["Quran 4:34","Quran 4:24","Quran 23:5-6","Quran 33:50"],"hadith":["Sunan Abi Dawud 2146","Sahih Muslim 1438","Sunan Abi Dawud 2155"],"bible":["Ephesians 5:25-29","Colossians 3:19","1 Peter 3:7"],"sources":[{"name":"Sahih Muslim 1438","type":"primary","url":"https://sunnah.com/muslim:1438"},{"name":"WikiIslam — Wife Beating in the Quran","type":"apologetics","url":"https://wikiislam.net/wiki/Wife_Beating_in_the_Qur'an"},{"name":"IslamQA 20802 — intercourse with a slave woman","type":"muslim","url":"https://islamqa.info/en/answers/20802"},{"name":"Ayesha Chaudhry — Domestic Violence and the Islamic Tradition (Oxford UP)","type":"scholarly","url":"https://global.oup.com/academic/product/domestic-violence-and-the-islamic-tradition-9780199640164"}],"response":"On 4:34: the permission is a last-resort, symbolic act — classical jurisprudence forbade injury, bruising, or striking the face; the Prophet never hit a wife or servant (Muslim 2328) and said 'the best of you are best to their wives'; some modern scholars read daraba as 'separate from,' and the three steps are de-escalation in a context where unrestricted beating was the norm — the verse restricts, not licenses, violence. On captives: concubinage was the universal law of war in antiquity (including biblical law — Numbers 31:18; Deuteronomy 21:10–14); Islam regulated it (a waiting period before intercourse; captives not split from children; freeing and marrying a captive praised), channeled captives into households rather than massacre, on a trajectory toward abolition.","responseSource":{"name":"IslamQA 20802; Jonathan Brown, Slavery and Islam; classical fiqh restrictions","url":"https://islamqa.info/en/answers/20802"},"rationale":"Both permissions are textually and juristically conceded: no classical authority denied that 4:34 authorizes some physical striking (the dispute is degree), and sexual access to captives is affirmed by 4:24's own context, Sahih Muslim 1438, and mainstream fatwa — IslamQA states it plainly today. The restriction-trajectory steelman is historically serious, and the biblical-law comparison (Deuteronomy 21) must be honestly faced. But the Christian critique lands on the exemplar claim: these are presented not as regulated concessions of a hard era but as the final revelation's permanent legislation, defended as such by living mainstream authorities. The 'daraba means separate' reading is rejected by essentially all classical and most contemporary scholarship."},
{"id":"zaynab-hastening-revelation","category":"muhammad-test","severity":"high","verdict":"admitted","title":"The Zaynab marriage (33:37) and Aisha's 'your Lord hastens to fulfill your desires'","claim":"Quran 33:37 addresses Muhammad's marriage to Zaynab bint Jahsh, the ex-wife of his adopted son Zayd — scandalous under Arab adoption norms. The verse reveals that while Muhammad concealed his interest and feared people's talk, Allah married her to him 'so that there would be no blame on believers concerning the wives of their adopted sons' — and the Quran simultaneously abolished adoption's legal force (33:4–5). Critics observe a recurring pattern of revelations authorizing Muhammad's personal privileges: unlimited wives for him alone (33:50), freedom to reschedule wives' turns (33:51), a ban on other men marrying his widows (33:53). The pattern was visible in his own house: after 33:51 came down, Aisha said to him, 'I feel that your Lord hastens in fulfilling your wishes and desires' (Sahih al-Bukhari 4788).","quran":["Quran 33:37","Quran 33:4-5","Quran 33:50-53","Quran 66:1-5"],"hadith":["Sahih al-Bukhari 4788","Sahih al-Bukhari 7420","Sahih Muslim 1428"],"bible":["Deuteronomy 18:20-22","Jeremiah 23:16-32"],"sources":[{"name":"Sahih al-Bukhari 4788","type":"primary","url":"https://sunnah.com/bukhari:4788"},{"name":"ICRAA — Aisha's statement explained","type":"muslim","url":"https://icraa.org/aishahs-statement-lord-hastens-in-fulfilling-your-desires-explained/"},{"name":"Answering Islam — on Zaynab (Sam Shamoun)","type":"apologetics","url":"https://www.answering-islam.org/Shamoun/zaynab.htm"}],"response":"The marriage was a costly legal reform, not indulgence: pre-Islamic adoption created fictive bloodlines with real inheritance and marriage consequences; abolishing it required a public, unavoidable demonstration, and God chose the hardest case — the Prophet himself — because no one else's example would have broken the taboo. Muhammad resisted ('you feared the people'), which is evidence against opportunism; Zaynab was his cousin whom he could have married years earlier had desire driven him. Aisha's remark was spousal candor, and that Muslims faithfully preserved even this barb in their most authentic collection shows the tradition's honesty. His marriages overall skewed toward widows and political alliances.","responseSource":{"name":"ICRAA; Ibn Kathir and Maududi on 33:37","url":"https://icraa.org/aishahs-statement-lord-hastens-in-fulfilling-your-desires-explained/"},"rationale":"Every factual element is canonical: the desire-then-revelation sequence is in the Quran's own wording, the privileges of 33:50–53 are explicit, and the 'hastens to fulfill your desires' observation is Aisha's, in Bukhari. The legal-reform steelman is internally coherent for Zaynab taken alone, but cannot explain the cumulative pattern, and the 'preserved barb proves honesty' argument cuts both ways — it proves the tradition is honest, and that what it honestly preserves is contemporaneous suspicion inside the Prophet's own house. Whether the pattern proves fabrication is a judgment call; that the pattern exists is admitted in Islam's canon."},
{"id":"prophet-test-signs","category":"muhammad-test","severity":"medium","verdict":"contested","title":"No predictive prophecy, no Quranic miracles: Muhammad and the biblical prophet test","claim":"The biblical test of a prophet is verifiable prediction (Deuteronomy 18:21–22) and God-given signs. The Quran repeatedly records Muhammad declining to produce signs: 'Why has a sign not been sent down to him? Say: signs are only with Allah, and I am only a clear warner' (29:50; also 13:7; 17:90–93). Public miracles appear only in later hadith, in tension with the Quran's stance. The one claimed predictive prophecy, 30:2–4 ('The Romans have been defeated… but they will be victorious within three to nine years'), is problematic: in the original undotted script the words could equally be read 'Rome has conquered… will be defeated'; the timespan is elastic; and on standard dating (Jerusalem 614 → final victory 628) fulfillment falls outside nine years. A vague geopolitical reversal cannot meet Deuteronomy 18's standard of detailed, falsifiable prediction.","quran":["Quran 30:2-4","Quran 29:50-51","Quran 13:7","Quran 17:90-93","Quran 6:37"],"hadith":["Sahih al-Bukhari 3636","Sahih al-Bukhari 4981","Jami at-Tirmidhi 3194"],"bible":["Deuteronomy 18:21-22","Isaiah 41:21-23","John 10:37-38"],"sources":[{"name":"Answering Islam — Muhammad's False Prophecies","type":"apologetics","url":"https://www.answering-islam.org/Shamoun/false_prophecies.htm"},{"name":"About Islam — Fulfilled Prophecy of Surat Ar-Rum (Muslim case)","type":"muslim","url":"https://aboutislam.net/muslim-issues/science-muslim-issues/fulfilled-prophecy-surat-ar-rum/"},{"name":"Answering Islam — Muhammad and Miracles","type":"apologetics","url":"https://answering-islam.org/Responses/Azmy/mhd_miracles.htm"}],"response":"The Rome prophecy was made when Byzantium lay prostrate — predicting its victory then was humanly absurd, and it happened: Heraclius' improbable campaigns (622–628) reversed the war; Abu Bakr's public wager (Tirmidhi 3194) shows 'Rome will win' was the reading from the start, and the recitation consensus fixes it. The same passage adds the believers would simultaneously rejoice — fulfilled at Badr. On signs: the Quran denies signs-on-demand to hostile testers, not miracles absolutely; the Quran's own inimitability (2:23's unanswered challenge) is the standing miracle, and the moon-splitting is referenced in 54:1–2 itself.","responseSource":{"name":"About Islam / Ibn Kathir on 30:2-4 and 54:1","url":"https://aboutislam.net/muslim-issues/science-muslim-issues/fulfilled-prophecy-surat-ar-rum/"},"rationale":"The Rome passage is a genuine pre-event prediction by any dating, so 'no prophecy at all' overstates; Abu Bakr's wager is early evidence for the standard reading. But it survives as prophecy only in its vaguest form: the counter-reading in the defective script is real, the 3–9-year window fits only with favorable date choices, and one elastic reversal cannot bear the weight Deuteronomy 18 places on detailed, falsifiable prediction — compare Isaiah naming Cyrus. The signs question is likewise split: the Quran's own posture (warner without signs) is textually clear and in real tension with the later hadith miracle corpus, which multiplies wonders the Quran conspicuously never claims."},
{"id":"aorta-test","category":"muhammad-test","severity":"medium","verdict":"contested","title":"The aorta test: 'We would have cut his aorta' (69:44–46) and the Khaybar poison","claim":"Quran 69:44–46: 'If he had invented false sayings concerning Us, We would have seized him by the right hand, then We would have cut from him the aorta.' In Sahih al-Bukhari 4428, during his fatal illness Muhammad says: 'O Aisha! I still feel the pain caused by the food I ate at Khaybar, and at this time I feel as if my aorta is being cut from that poison.' The poisoned meat was served by a Jewish woman after Khaybar's conquest, reportedly to test his prophethood — she reasoned a true prophet would be informed. The internal-test argument: the Quran names a specific divine punishment for a false prophet — a severed aorta — and Islam's most authentic source records Muhammad dying describing exactly that sensation, from a poisoning administered as a prophethood test; his companion Bishr died of the same meal.","quran":["Quran 69:44-47"],"hadith":["Sahih al-Bukhari 4428","Sahih al-Bukhari 2617","Sahih Muslim 2190","Sunan Abi Dawud 4512"],"bible":["Deuteronomy 18:20"],"sources":[{"name":"Sahih al-Bukhari 4428","type":"primary","url":"https://sunnah.com/bukhari:4428"},{"name":"Analyzing Islam — Poisoned at Khaybar; Aorta Severed (dossier)","type":"apologetics","url":"https://analyzingislam.com/arguments/bukhari/b17-prophets-poison-death.html"},{"name":"Jesus-Islam — How did Muhammad die?","type":"apologetics","url":"https://jesus-islam.org/questions/how-did-muhammad-die/"}],"response":"69:44–46 describes an immediate, public divine execution for forgery — seizure 'by the right hand' and instant severing, as a demonstration — not death by illness three-plus years after a poisoning (Khaybar 628, death 632). 'I feel AS IF my aorta is being cut' is an Arabic idiom for mortal agony, with a different anatomical word (abhar vs. watin) — a simile of pain, not a report of the 69:46 punishment. Far from disproving him, the episode is claimed as vindication: the meat itself 'spoke' to warn him, he stopped eating, and death from its lingering effect earned him a martyr's honor, after the religion was completed (5:3). No forger controls his dying words; attributing his death to the poison shows guileless candor.","responseSource":{"name":"IslamQA and Islamweb treatments of Bukhari 4428 and 69:44-46","url":"https://islamqa.info/en/answers/"},"rationale":"The factual chain is fully canonical: the verse, the poisoning-as-prophethood-test, and the deathbed aorta statement are all in Bukhari. But the argument's force depends on reading 69:44–46 as a general criterion rather than a threat of immediate exemplary execution; the Arabic uses different anatomical terms, and 'as if' marks a simile. The Christian can fairly say it is at minimum an astonishing irony that Islam's own canon has its prophet dying while describing the false-prophet's punishment, poisoned in a test whose stated logic the outcome vindicated. The Muslim can fairly say the verse doesn't state the general criterion the argument needs. Powerful rhetoric; not a strict internal contradiction."},
{"id":"salvation-scales","category":"salvation","severity":"high","verdict":"admitted","featured":true,"title":"Scales of deeds, no assurance — even for Muhammad — vs. the gospel","claim":"Islamic salvation is a weighing: 'Those whose scales are heavy — they are the successful; those whose scales are light — they have lost their souls, in Hell abiding' (23:102–103; 101:6–9). Allah's love is conditional: 'Allah loves not the disbelievers' (3:32). Assurance is absent by design — even Muhammad: 'By Allah, though I am Allah's Messenger, I neither know what will happen to me, nor to you' (Sahih al-Bukhari 7018; echoing Quran 46:9), and 'none of you will enter Paradise by his deeds… not even I, unless Allah covers me with mercy' (Sahih Muslim 2816). The contrast: the God of the Bible demonstrates love for sinners while they are still sinners (Romans 5:8), salvation is by grace through faith and not by works (Ephesians 2:8–9), sins are borne by a substitute (Isaiah 53:5–6), and assurance is offered as knowledge: 'that you may KNOW that you have eternal life' (1 John 5:13).","quran":["Quran 23:102-103","Quran 101:6-9","Quran 7:8-9","Quran 19:71","Quran 3:32","Quran 46:9"],"hadith":["Sahih al-Bukhari 7018","Sahih Muslim 2816","Sahih Muslim 2643"],"bible":["Romans 5:8","Ephesians 2:8-9","1 John 5:13","John 5:24","Isaiah 53:5-6","Luke 18:9-14","Hebrews 10:14"],"sources":[{"name":"Sahih al-Bukhari 7018","type":"primary","url":"https://sunnah.com/bukhari:7018"},{"name":"Sahih Muslim 2816","type":"primary","url":"https://sunnah.com/muslim:2816"},{"name":"Yaqeen Institute — salvation papers","type":"muslim","url":"https://yaqeeninstitute.org/read/paper/is-there-salvation-outside-of-islam"}],"response":"Islam's soteriology is mercy-saturated, not cold bookkeeping: Allah's mercy 'prevails over His wrath'; one good deed counts tenfold to seven-hundredfold while a sin counts once (Bukhari 6491); sincere monotheism ultimately delivers from eternal Hell; and Muslim 2816 shows entry to Paradise is itself by Allah's mercy, not earned — functionally a grace doctrine. The absence of presumptuous assurance is a feature: it holds the believer between fear and hope, producing humility and moral seriousness, whereas guaranteed salvation invites license — and Christians themselves debate eternal security. 3:32 concerns Allah's love of approval for persistent rejecters, not absence of universal compassion (7:156). Bukhari 7018 predates the revelation of Muhammad's forgiveness (48:1–2).","responseSource":{"name":"Yaqeen soteriology papers; Ibn Qayyim on fear and hope","url":"https://yaqeeninstitute.org/read/paper/is-there-salvation-outside-of-islam"},"rationale":"This entry documents a structural contrast, and every element of the Islamic side is canonical and conceded: salvation weighed by scales, no textual offer of assurance (48:1–2 rescues Muhammad specifically, underlining that others lack the guarantee), conditional divine love in the Quran's explicit wording, and Muhammad's own recorded uncertainty. The steelman honestly complicates the caricature — Muslim 2816 does place final entry on mercy — but mercy applied through a merit-weighing frame with no substitutionary atonement and no offered assurance remains categorically different from Romans 5:8 and 1 John 5:13. This is the entry that leads most directly to the gospel."},
{"id":"taqiyya-deception","category":"practice","severity":"medium","verdict":"contested","title":"Taqiyya: what Islamic deception doctrine actually is — and isn't","claim":"Islamic sources do permit deception in defined circumstances: Quran 16:106 excuses denying faith under compulsion, and 3:28 permits concealment from hostile disbelievers as 'precaution' (tuqah — the root of taqiyya, developed chiefly in Shia jurisprudence under persecution). Sunni sources permit lying in three cases — war, reconciling disputants, and between spouses (Sahih Muslim 2605; Jami at-Tirmidhi 1939), and Muhammad said 'war is deceit' (Sahih al-Bukhari 3030) and authorized deceptive speech in the assassination of Ka'b ibn al-Ashraf (Bukhari 3031). The Christian contrast: God 'cannot lie' (Titus 1:2), and truthful speech under persecution is the martyr's calling (Matthew 10:28; Revelation 2:10). HOWEVER — the popular claim that ordinary Muslims are doctrinally required or encouraged to lie to non-Muslims about their faith is an overreach: taqiyya is a concealment-under-persecution doctrine, not a general license, and mainstream Sunni scholarship treats lying as a major sin outside the named exceptions.","quran":["Quran 16:106","Quran 3:28"],"hadith":["Sahih Muslim 2605","Sahih al-Bukhari 3030","Jami at-Tirmidhi 1939"],"bible":["Titus 1:2","Matthew 10:28","Revelation 2:10","Ephesians 4:25"],"sources":[{"name":"Sahih Muslim 2605","type":"primary","url":"https://sunnah.com/muslim:2605"},{"name":"Sahih al-Bukhari 3030","type":"primary","url":"https://sunnah.com/bukhari:3030"},{"name":"Taqiyya (overview of the doctrine's Shia development and Sunni scope)","type":"scholarly","url":"https://en.wikipedia.org/wiki/Taqiyya"},{"name":"IslamQA — lying is permissible only in specific cases","type":"muslim","url":"https://islamqa.info/en/answers/27261"}],"response":"Muslim scholars respond that taqiyya is a narrow survival concession parallel to Peter's denial being forgiven — not a way of life; that the three-exceptions hadith concerns pragmatic peacemaking of the kind many ethicists accept; that 'war is deceit' describes battlefield stratagem, universal in military ethics; and that Islam's baseline is emphatic truthfulness ('truthfulness leads to righteousness' — Bukhari 6094; false witness among the greatest sins). The claim that Muslims routinely practice taqiyya on non-Muslims is, they note, a polemical stereotype that no mainstream fatwa supports.","responseSource":{"name":"IslamQA 27261; mainstream Sunni treatments of truthfulness","url":"https://islamqa.info/en/answers/27261"},"rationale":"Both sides of this entry matter. The doctrinal facts are documented: sanctioned deception exists in defined cases (war, compulsion, reconciliation, spouses) in sahih sources, which genuinely differs from the biblical ethic of truth unto death. But the popular counter-Islam claim — 'you can't trust anything a Muslim says because taqiyya' — is unsupported by mainstream Islamic law and is conversation poison. PRACTICAL RULE: know the doctrine; never wield it as an accusation against the person in front of you. Accusing an ordinary Sunni of taqiyya is usually false, always unfalsifiable, and instantly ends the conversation."},
{"id":"sharia-apostasy-jizya","category":"practice","severity":"high","verdict":"admitted","title":"Sharia's coercive provisions: death for apostasy, jizya, and hudud punishments","claim":"Classical Islamic law prescribes death for leaving Islam — 'Whoever changes his religion, kill him' (Sahih al-Bukhari 6922; cf. Bukhari 6878 listing apostasy among the three grounds for lawful killing) — a ruling carried by all four Sunni schools and still law in several states today. Quran 9:29 commands fighting the People of the Book 'until they pay the jizya willingly while they are humbled,' establishing the dhimmi system of subordinated tolerance. Hudud punishments include amputation for theft (5:38) and stoning for adultery (from the sunnah — Bukhari 6829's stoning verse; Muslim 1690). The New Testament contrast: faith is uncoerced ('If anyone hears my words and does not keep them, I do not judge him' — John 12:47; the wheat and tares grow together till harvest — Matthew 13:29–30), the sword is renounced for the gospel's spread (Matthew 26:52; John 18:36), and apostates are to be won back, not executed (2 Timothy 2:24–26).","quran":["Quran 9:29","Quran 5:38","Quran 9:5"],"hadith":["Sahih al-Bukhari 6922","Sahih al-Bukhari 6878","Sahih Muslim 1690"],"bible":["John 12:47","John 18:36","Matthew 13:29-30","Matthew 26:52","2 Timothy 2:24-26"],"sources":[{"name":"Sahih al-Bukhari 6922","type":"primary","url":"https://sunnah.com/bukhari:6922"},{"name":"Sahih al-Bukhari 6878","type":"primary","url":"https://sunnah.com/bukhari:6878"},{"name":"Apostasy in Islam (survey of classical rulings and modern state law)","type":"scholarly","url":"https://en.wikipedia.org/wiki/Apostasy_in_Islam"},{"name":"IslamQA 20327 — the ruling on apostasy","type":"muslim","url":"https://islamqa.info/en/answers/20327"}],"response":"Reform-minded Muslim scholars argue: 'no compulsion in religion' (2:256) is the Quran's own principle, and the Quran itself prescribes no worldly penalty for apostasy — the death penalty rests on hadith and is best understood historically as punishing treason against the Muslim polity in wartime, not private belief change (a view advanced by scholars like Jonathan Brown, Taha Jabir Alalwani, and adopted by some modern states). Jizya was a tax in lieu of military service, often lighter than the zakat Muslims paid, and dhimmi status provided real protection unusual for its era. Hudud punishments carry near-impossible evidentiary standards (four eyewitnesses to the act) designed to make application rare — deterrence theater more than practice.","responseSource":{"name":"Jonathan Brown and reformist treatments; IslamQA 20327 (traditional ruling stated plainly)","url":"https://islamqa.info/en/answers/20327"},"rationale":"The provisions themselves are admitted: the apostasy hadith is in Bukhari, all four classical schools carried the ruling, mainstream fatwa sites still affirm it, and roughly a dozen states criminalize apostasy today — several capitally. The reformist steelman is genuine scholarship, but it argues against the classical consensus, not against the sources' existence, and 'no compulsion' must be harmonized by every reformer precisely because the coercive texts are there. The practical stake for evangelism is not polemical but pastoral: this is why your Muslim friend's hesitation is not stubbornness, why security and confidentiality for seekers are non-negotiable, and why counting the cost (Luke 14:28) is part of sharing the gospel with Muslims."},
{"id":"allah-moon-god","category":"doctrine-of-god","severity":"low","verdict":"answered","title":"'Allah is a moon god' — a Christian polemic that fails","claim":"A popular claim in Christian counter-apologetics (popularized by Robert Morey's 'The Moon-God Allah,' 1994) holds that Allah was originally a pagan Arabian moon deity — often linked to the crescent symbol and to the South Arabian god Sin/Hubal — so Muslims allegedly worship a repackaged idol. The argument circulates widely in tracts and online despite its evidentiary problems.","quran":["Quran 29:61-63","Quran 41:37"],"hadith":[],"bible":["Acts 17:23-28"],"sources":[{"name":"Rick Brown, 'Who Is \"Allah\"?' (International Journal of Frontier Missions, 2006)","type":"scholarly","url":"https://www.ijfm.org/PDFs_IJFM/23_2_PDFs/Brown_Allah.pdf"},{"name":"Islamic Awareness — reply to the 'Moon-God Allah' claim","type":"muslim","url":"https://www.islamic-awareness.org/quran/sources/allah/moongod"},{"name":"Answering Islam — assessments cautioning against the Morey thesis","type":"apologetics","url":"https://www.answering-islam.org/"}],"response":"The rebuttal here is not a Muslim response but the evidence itself, acknowledged across the scholarly spectrum including Christian missiologists: 'Allah' is the ordinary Arabic word for God — the cognate of Hebrew Elohim and Aramaic Alaha — used by Arabic-speaking Jews and Christians BEFORE Islam and in every Arabic Bible to this day (Genesis 1:1 in Arabic begins 'In the beginning Allah created…'). The Quran explicitly condemns worship of the moon (41:37: 'Do not prostrate to the sun or the moon'). The crescent symbol entered Islamic use centuries later via the Ottomans. Morey's archaeological linkages (Hubal, the Sin temple at Hazor) are rejected by the relevant specialists.","responseSource":{"name":"Rick Brown (IJFM); mainstream Semitics scholarship","url":"https://www.ijfm.org/PDFs_IJFM/23_2_PDFs/Brown_Allah.pdf"},"rationale":"Fairly weighed, this criticism fails: the linguistic evidence (Allah as the standard Semitic word for God, used by pre-Islamic Christians and in Arabic Bibles today) and the Quran's own prohibition of moon-worship defeat the thesis, and Christian scholars of missions have themselves published the refutations. The real dispute with Islam is about God's CHARACTER and triunity — not the Arabic word for him. Christians who use the moon-god argument hand every informed Muslim an easy win and discredit their stronger arguments. Marked answered so you never make this mistake."},
{"id":"quran-late-composition","category":"quran-text","severity":"low","verdict":"answered","title":"'The Quran was written centuries after Muhammad' — refuted by the manuscripts","claim":"Revisionist scholarship of the 1970s (John Wansbrough; Patricia Crone and Michael Cook's 'Hagarism') proposed that the Quran crystallized one to two centuries after Muhammad, assembled from communal traditions across the Near East — a theory still repeated in some skeptical and Christian polemics as if established.","quran":["Quran 15:9"],"hadith":[],"bible":[],"sources":[{"name":"University of Birmingham — Birmingham Quran manuscript radiocarbon dating (2015): 95% probability of 568–645 AD","type":"institutional","url":"https://www.birmingham.ac.uk/facilities/cadbury/birmingham-quran-mingana-collection/birmingham-quran/faqs"},{"name":"Behnam Sadeghi & Mohsen Goudarzi, 'Ṣan'ā' 1 and the Origins of the Qur'ān' (Der Islam, 2012)","type":"scholarly","url":"https://en.wikipedia.org/wiki/Sanaa_manuscript"},{"name":"Nicolai Sinai, 'When did the consonantal skeleton of the Quran reach closure?' (BSOAS, 2014)","type":"scholarly","url":"https://www.cambridge.org/core/journals/bulletin-of-the-school-of-oriental-and-african-studies/article/abs/when-did-the-consonantal-skeleton-of-the-quran-reach-closure-part-i/09404F16DF01B41BC4F6CA00A9C10A48"}],"response":"The evidence answered the theory: radiocarbon dating places the Birmingham Quran folios at 568–645 AD with 95% confidence — within or immediately after Muhammad's lifetime — and the Sanaa palimpsest's lower text is likewise 7th-century. Mainstream scholarship (Sinai, Sadeghi, even revisionism-sympathetic scholars) now holds the consonantal text was substantially fixed by the mid-7th century. Wansbrough's late-crystallization thesis is effectively dead in the academy.","responseSource":{"name":"Birmingham radiocarbon results; Sadeghi & Goudarzi; Sinai (BSOAS)","url":"https://www.birmingham.ac.uk/facilities/cadbury/birmingham-quran-mingana-collection/birmingham-quran/faqs"},"rationale":"Fairly weighed, the late-composition claim fails: the physical manuscripts date the Quran's text to the 7th century, and serious scholarship across the spectrum accepts an early consonantal skeleton. Note what this does NOT concede: an early text is not a perfectly preserved text (see the Uthman and lost-verses cases — the standardization story sits in Bukhari itself), and early does not mean true. But Christians who claim the Quran was invented centuries later argue against the evidence — and against their own interest, since the same manuscript sciences vindicate the Bible's transmission. Marked answered to keep the strong arguments clean."},
{"id":"spread-only-by-sword","category":"practice","severity":"low","verdict":"answered","title":"'Islam spread only by the sword' — the caricature versus the record","claim":"A common polemical claim holds that Islam's growth was purely military — populations converted at swordpoint wherever Muslim armies won. The claim is used to contrast Islam's spread with Christianity's early growth under persecution.","quran":["Quran 2:256","Quran 9:29"],"hadith":[],"bible":["Matthew 26:52"],"sources":[{"name":"Ira Lapidus, A History of Islamic Societies (Cambridge UP) — conversion followed conquest by centuries","type":"scholarly","url":"https://www.cambridge.org/core/books/history-of-islamic-societies/6B94F3E4F72D4C2E0E1F30E9414A34E2"},{"name":"Richard Bulliet, Conversion to Islam in the Medieval Period (Harvard UP)","type":"scholarly","url":"https://www.hup.harvard.edu/books/9780674331594"},{"name":"Spread of Islam (survey: trade and Sufi networks in Indonesia, West Africa)","type":"scholarly","url":"https://en.wikipedia.org/wiki/Spread_of_Islam"}],"response":"The historical record answers the caricature: Islamic ARMIES conquered fast, but CONVERSION was slow and mostly voluntary — Bulliet's conversion-curve research shows Egypt, Syria, and Persia remained majority non-Muslim for two to three centuries under Muslim rule, precisely because the jizya/dhimmi system presupposed large non-Muslim populations (you cannot tax converts you forced). The world's largest Muslim country, Indonesia, was never conquered by an Arab army — Islam arrived through traders and Sufi networks; the same is true of much of West Africa. Forced-conversion episodes existed but were exceptional and often condemned by jurists citing 2:256 ('no compulsion in religion').","responseSource":{"name":"Bulliet's conversion curves; Lapidus; the jizya system's own logic","url":"https://www.hup.harvard.edu/books/9780674331594"},"rationale":"Fairly weighed, the 'only by the sword' claim fails — conquest and conversion were different processes, and Islam's own tax system proves it. What survives is the narrower, documented point made elsewhere on this site: Islamic LAW contains coercive provisions (apostasy, jizya 'while they are humbled') that the New Testament has no parallel to, and the political order Islam built privileged conversion in one direction. Argue that — the documented asymmetry — not the caricature. Marked answered so the credible version of the argument stays credible."}
];

 a man, makest thyself God."}]},"John 20:28-29":{"ref":"John 20","verses":[{"v":28,"t":"And Thomas answered and said unto him, My Lord and my God."},{"v":29,"t":"Jesus saith unto him, Thomas, because thou hast seen me, thou hast believed: blessed are they that have not seen, and yet have believed."}]},"Philippians 2:6-11":{"ref":"Philippians 2","verses":[{"v":6,"t":"Who, being in the form of God, thought it not robbery to be equal with God:"},{"v":7,"t":"But made himself of no reputation, and took upon him the form of a servant, and was made in the likeness of men:"},{"v":8,"t":"And being found in fashion as a man, he humbled himself, and became obedient unto death, even the death of the cross."},{"v":9,"t":"Wherefore God also hath highly exalted him, and given him a name which is above every name:"},{"v":10,"t":"That at the name of Jesus every knee should bow, of things in heaven, and things in earth, and things under the earth;"},{"v":11,"t":"And that every tongue should confess that Jesus Christ is Lord, to the glory of God the Father."}]},"Daniel 7:13-14":{"ref":"Daniel 7","verses":[{"v":13,"t":"I saw in the night visions, and, behold, one like the Son of man came with the clouds of heaven, and came to the Ancient of days, and they brought him near before him."},{"v":14,"t":"And there was given him dominion, and glory, and a kingdom, that all people, nations, and languages, should serve him: his dominion is an everlasting dominion, which shall not pass away, and his kingdom that which shall not be destroyed."}]},"Quran 21:105":{"ref":"Surah Al-Anbya (21)","verses":[{"v":105,"t":"And We have already written in the book [of Psalms] after the [previous] mention that the land [of Paradise] is inherited by My righteous servants"}]},"Quran 19:28":{"ref":"Surah Maryam (19)","verses":[{"v":28,"t":"O sister of Aaron, your father was not a man of evil, nor was your mother unchaste"}]},"Quran 5:31":{"ref":"Surah Al-Ma'idah (5)","verses":[{"v":31,"t":"Then Allah sent a crow
