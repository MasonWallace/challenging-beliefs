const KNOW={"didyouknow":[{"t":"An empty grave waits for Jesus in Medina","d":"A long-standing tradition, resting on a report in Tirmidhi, holds that a burial spot in the Prophet's chamber in Medina — beside Muhammad, Abu Bakr, and Umar — is reserved for Jesus (Isa), who Muslims believe will return, live out a natural life, die, and be buried there. Mainstream Muslim media discuss the reserved spot matter-of-factly.","src":"https://www.dailysabah.com/opinion/columns/who-does-the-single-grave-in-the-tomb-of-prophet-muhammad-belong-to","id":"crucifixion-denial-vs-history","img":{"src":"https://commons.wikimedia.org/wiki/Special:FilePath/Wide%20shot%20of%20the%20Green%20Dome%20at%20The%20Prophet's%20Mosque%20(Al%20Masjid-e-Nabawi).jpg?width=520","cap":"The Green Dome over Muhammad's burial chamber, Medina"}},{"t":"Jesus returns — to break the cross","d":"In Sahih al-Bukhari, Muhammad says the son of Mary will descend as a just ruler, 'break the cross, kill the pigs, and abolish the jizya.' In Islamic eschatology Jesus returns not to vindicate Christianity but to end it — dismantling its central symbol and folding everyone into Islam.","src":"https://sunnah.com/bukhari:3448","id":"crucifixion-denial-vs-history"},{"t":"The one-eyed false messiah","d":"Muslims await the Dajjal, a one-eyed deceiver with 'kafir' (disbeliever) written between his eyes, whom every prophet warned about. He performs counterfeit miracles before Jesus descends and destroys him — a striking parallel to the Christian Antichrist.","src":"https://sunnah.com/bukhari:7131"},{"t":"The Mahdi: Islam's awaited deliverer","d":"Sunnis await a yet-unborn descendant of Muhammad who will fill the earth with justice before the end; Twelver Shia believe he was born in the 9th century and has been alive in hiding (occultation) ever since. The Mahdi-Jesus-Dajjal drama forms a complete end-times narrative most Christians have never heard.","src":"https://www.britannica.com/topic/mahdi"},{"t":"Jinn: a third order of beings","d":"The Quran teaches God made angels from light, humans from clay, and jinn from 'smokeless fire' (55:15) — invisible beings who eat, marry, die, and will be judged. Solomon is said to have commanded armies of jinn as builders and divers (34:12-13), and belief in jinn possession remains live and mainstream.","src":"https://quran.com/55/15"},{"t":"The evil eye 'is real'","d":"An authenticated hadith states 'the influence of an evil eye is a fact' — envious glances can cause real harm. This is why many Muslims say 'mashallah' when complimenting a baby, and why blue-eye amulets (culturally frowned on by scholars) blanket the Muslim world.","src":"https://sunnah.com/muslim:2188","img":{"src":"https://commons.wikimedia.org/wiki/Special:FilePath/Kapadokya'dan%20Nazar%20Boncu%C4%9Fu.jpg?width=520","cap":"Nazar amulets against the evil eye"}},{"t":"Gabriel's six hundred wings","d":"Muhammad is reported to have seen Gabriel in his true form with six hundred wings, filling the horizon. Gabriel (Jibril) holds a towering place in Islam as the sole conduit of the Quran, delivered piecemeal over 23 years.","src":"https://sunnah.com/bukhari:4857"},{"t":"Two angels ride your shoulders","d":"The Kiraman Katibin ('noble scribes') sit on each person's right and left shoulders, recording every good and bad deed for the Day of Judgment (Quran 50:17-18; 82:10-12). Many Muslims end prayer by greeting both angels with a turn of the head.","src":"https://quran.com/50/17","id":"salvation-scales"},{"t":"Angels avoid homes with dogs or pictures","d":"Per hadith, 'angels do not enter a house in which there is a dog or images' of living beings. This is why many observant Muslims won't keep dogs indoors (guard and working dogs excepted) and why some homes have no family photos on the walls.","src":"https://sunnah.com/bukhari:3322"},{"t":"Devils are chained during Ramadan","d":"Muhammad taught that when Ramadan begins, 'the gates of heaven are opened, the gates of Hell are closed, and the devils are chained.' It frames Ramadan as a month when sin is harder to blame on Satan — any evil done is your own nafs (self).","src":"https://sunnah.com/bukhari:1899","img":{"src":"https://commons.wikimedia.org/wiki/Special:FilePath/Fanous%20Ramadan.jpg?width=520","cap":"A Ramadan fanous lantern"}},{"t":"One night worth 83 years","d":"Laylat al-Qadr, the night the Quran began descending, is 'better than a thousand months' (Quran 97:3) — worship that night outweighs 83+ years of it. Its exact date is hidden among the last ten odd nights of Ramadan, so devout Muslims pray through all of them.","src":"https://quran.com/97/3","id":"salvation-scales"},{"t":"The Kaaba gets a new $4-million dress yearly","d":"The kiswa — the Kaaba's black silk cover embroidered with gold Quranic calligraphy — is replaced every year during Hajj. The old one is cut into pieces and gifted to dignitaries, museums, and organizations; fragments are treasured heirlooms.","src":"https://www.islamiclandmarks.com/makkah-haram-sharief/kiswah-the-cover-of-the-kabah","id":"kaaba-black-stone-pagan-rites","img":{"src":"https://commons.wikimedia.org/wiki/Special:FilePath/Kiswah%2C%20Kaaba%20-%207%20May%202016%20(cropped-01).jpg?width=520","cap":"The kiswa — the Kaaba's embroidered cover"}},{"t":"One family has held the Kaaba's key since Muhammad","d":"The Bani Shaiba family has kept the key to the Kaaba since pre-Islamic times; Muhammad returned the key to them at the conquest of Mecca, and their descendants still open and clean the Kaaba today. Even Saudi kings must go through them to enter.","src":"https://www.arabnews.com/node/1711991/saudi-arabia","id":"kaaba-black-stone-pagan-rites","img":{"src":"https://commons.wikimedia.org/wiki/Special:FilePath/Unknown%2C%20Egypt%20-%20Ka'aba%20Door%20Curtain%20-%20Google%20Art%20Project.jpg?width=520","cap":"A Kaaba door curtain (Egypt)"}},{"t":"Zamzam: the well that hasn't run dry","d":"Muslims trace the Zamzam well in Mecca to God's provision for Hagar and Ishmael — the same figures Genesis 21 places in the wilderness of Beersheba. It still pumps up to 18.5 liters per second for millions of pilgrims, who carry bottles of it home worldwide.","src":"https://www.arabnews.com/node/1712901/saudi-arabia","img":{"src":"https://commons.wikimedia.org/wiki/Special:FilePath/Zamzam%20water.jpg?width=520","cap":"Zamzam water"}},{"t":"A winged steed and a night flight to Jerusalem","d":"On the Night Journey (Isra and Mi'raj), Muhammad rode the Buraq from Mecca to Jerusalem, ascended through the heavens, met earlier prophets, and negotiated the daily prayers down from fifty to five — with Moses coaching the reductions. This event is why Jerusalem is Islam's third-holiest city.","src":"https://en.wikipedia.org/wiki/Isra%27_and_Mi%27raj","img":{"src":"https://commons.wikimedia.org/wiki/Special:FilePath/Jerusalem-2013(2)-Temple%20Mount-Dome%20of%20the%20Rock%20(SE%20exposure).jpg?width=520","cap":"The Dome of the Rock — the Night Journey's destination"}},{"t":"The 99 names of Allah","d":"A hadith promises that whoever 'enumerates' Allah's ninety-nine names — the Merciful, the King, the Provider — will enter Paradise. Devout Muslims memorize them, count them on prayer beads, and name children with them (Abdul-Rahman = 'servant of the Merciful').","src":"https://sunnah.com/bukhari:2736","img":{"src":"https://commons.wikimedia.org/wiki/Special:FilePath/Tasbih1924.jpg?width=520","cap":"A misbaha — beads for counting the names"}},{"t":"The moon decides the holidays — and causes arguments","d":"Islamic months begin at the sighted crescent moon, so Ramadan and Eid can start on different days in different countries — even neighboring ones — and Saudi announcements are regularly disputed by astronomers. 'Moon wars' are an annual, good-natured (and sometimes not) drama in Muslim communities.","src":"https://theconversation.com/moon-sighting-is-a-key-part-of-muslim-life-how-the-lunar-cycle-determines-the-start-of-ramadan-and-eid-276195","img":{"src":"https://commons.wikimedia.org/wiki/Special:FilePath/New%20moon%20setting%202.jpg?width=520","cap":"The new crescent moon"}},{"t":"Praying together multiplies the reward 27 times","d":"Per hadith, congregational prayer is 'twenty-seven times superior' to praying alone — the engine behind mosque attendance. Worshippers also stand shoulder-to-shoulder in meticulously straight rows, because 'straightening the rows is part of the perfection of prayer.'","src":"https://sunnah.com/bukhari:649","id":"salvation-scales"},{"t":"The first sound a Muslim baby hears","d":"Following the practice of Muhammad with his grandson Hasan, the adhan (call to prayer) is whispered into a newborn's right ear so the first words the child hears are the declaration of God's oneness. Life begins and ends framed by the shahada.","src":"https://www.abuaminaelias.com/dailyhadithonline/2021/01/20/adhan-baby-newborn/"},{"t":"Right hand, left hand — and a prayer for the bathroom","d":"Islamic etiquette assigns the right hand to eating, drinking, and greeting, and the left to personal cleaning; there are prescribed supplications for entering the toilet (seeking refuge from devils) and leaving it ('Your forgiveness'). Daily life is scripted down to which foot enters a room first.","src":"https://hadeethenc.com/en/browse/hadith/3019"},{"t":"Prophetic medicine: the toothstick and the black seed","d":"Muhammad said he would have commanded the miswak (teeth-cleaning twig) before every prayer were it not a burden, and that black seed is 'a cure for every disease except death' (Bukhari 5688). Both remain everyday items in Muslim homes, sold in every Islamic bookstore.","src":"https://sunnah.com/bukhari:5688","id":"hadith-chain-of-custody","img":{"src":"https://commons.wikimedia.org/wiki/Special:FilePath/Mishwak.jpg?width=520","cap":"The miswak"}},{"t":"Why mosques are covered in writing, not pictures","d":"Hadith literature warns image-makers of living beings will be challenged on Judgment Day to 'breathe life' into what they made, so Islamic sacred art avoids figures entirely. The result: calligraphy became Islam's highest art form — the word of God as decoration.","src":"https://www.britannica.com/topic/Islam/Religion-and-the-arts","img":{"src":"https://commons.wikimedia.org/wiki/Special:FilePath/Istanbul%20Suleymaniye%20Mosque%20Interior%20Mihrab%202015%201283.jpg?width=520","cap":"Calligraphy in the Süleymaniye Mosque, Istanbul"}},{"t":"A trillion-dollar interest-free economy","d":"Because the Quran forbids riba (interest), a parallel global financial industry exists: Islamic banks, takaful insurance, and sukuk (sharia-compliant bonds) — a sukuk market now exceeding $1 trillion. Your Muslim neighbor may structure their mortgage, savings, and retirement around avoiding interest entirely.","src":"https://www.tradefinanceglobal.com/posts/global-sukuk-market-exceeds-1-trillion-as-islamic-funds-surge/"},{"t":"Millions know the whole Quran by heart","d":"A hafiz has memorized the entire Quran — roughly 600 pages of classical Arabic — and millions worldwide have done it, most of them non-Arabic speakers; Pakistan alone certifies tens of thousands of new huffaz every year. No comparable memorization culture exists for any other book.","src":"https://blog.alhannah.com/how-many-people-memorize-the-quran-a-deep-dive-into-global-hafiz-culture/","id":"hadith-chain-of-custody","img":{"src":"https://commons.wikimedia.org/wiki/Special:FilePath/Samarkand%20Kufic%20Quran%2C%201905%20(2022-07-05)%2003.jpg?width=520","cap":"The Samarkand Kufic Quran"}},{"id":"begets-consort-carnal-sonship","t":"Islam's oldest monument is an anti-Trinitarian argument","d":"The Dome of the Rock in Jerusalem (built 72 AH / 691-92 by caliph Abd al-Malik) carries the earliest monumental Islamic inscriptions in existence — and they are a direct polemic against Christian doctrine. The 240-meter mosaic band inside quotes and paraphrases Quran 4:171 and 19:35: 'Do not say Three... God is only one God; far be it from His glory that He should have a son.' Before Islam had minted its classic law books or collected its hadith, it was already defining itself against the Trinity — on Jerusalem's skyline, facing the Church of the Holy Sepulchre. The oldest physical Islamic proclamation is a denial of the Sonship of Christ.","src":"https://www.islamic-awareness.org/history/islam/inscriptions/dotr"},{"t":"The computer 'miracle' that ended in a murder","d":"In the 1970s-80s, Egyptian-American biochemist Rashad Khalifa announced a computer-discovered 'mathematical miracle': the Quran's structure was built on the number 19 (from Quran 74:30). The catch: his counts only worked after he removed two verses (9:128-129) from the Quran as 'satanic insertions.' He went on to declare himself God's 'Messenger of the Covenant.' Mainstream scholars condemned him as an apostate, and on January 31, 1990 he was stabbed to death in his Tucson mosque; his killer was convicted in 2013. The episode is a case study in what happens when a 'proof' of the Quran requires editing the Quran — and in how heresy is policed.","src":"https://en.wikipedia.org/wiki/Rashad_Khalifa"},{"t":"Ashura: the wound that defines the Sunni-Shia split","d":"Every year on 10 Muharram, Shia Muslims mourn the death of Husayn — Muhammad's grandson — killed with his family at Karbala (in modern Iraq) in 680 AD by the army of the caliph Yazid. Mourning processions include chest-beating, weeping majalis (lament gatherings), and in some communities self-flagellation with chains or blades (tatbir), though many Shia authorities now discourage blood rites and urge blood donation instead. Sunnis, by contrast, mark Ashura with an optional fast. That one day carries the whole Sunni-Shia divide in miniature: for Shia Islam, sacred history is a story of the Prophet's family betrayed by the Muslim community itself.","src":"https://www.britannica.com/event/Battle-of-Karbala"}],"week":[{"t":"Five prayers that move with the sun","d":"Salah happens at dawn, midday, afternoon, sunset, and night — times set by the sun's position, so fajr can mean a 4 a.m. alarm in summer and maghrib lands mid-commute in winter. Observant Muslims arrange work breaks, find quiet rooms, and sometimes combine prayers when traveling.","tip":"If a Muslim colleague or friend disappears for ten minutes in the afternoon, that's prayer — treating it as normal (or offering a quiet room) builds more trust than a hundred arguments."},{"t":"Wudu: washing before every prayer","d":"Prayer requires ritual purity — washing hands, mouth, nose, face, arms, head, and feet. It's why you may see someone washing their feet in an office restroom sink; certain things (sleep, using the toilet) break wudu and require redoing it.","tip":"Don't react awkwardly to the restroom ritual; knowing the word 'wudu' and why it matters signals real respect."},{"t":"Jummah: the week's anchor","d":"Friday midday prayer at the mosque — a sermon (khutbah) plus short congregational prayer — is obligatory for men and is the Muslim week's center of gravity, like Sunday morning for churchgoers. Muhammad called Friday the best day the sun rises on.","tip":"Never schedule something important with a Muslim friend for Friday early afternoon — and asking 'how was jummah?' lands like someone asking you about Sunday's sermon."},{"t":"Halal navigation is constant","d":"Beyond avoiding pork and alcohol, observant Muslims screen for hidden ingredients: pork gelatin in candy and marshmallows, wine in sauces, alcohol-based vanilla, animal rennet in cheese, and cross-contaminated fryers. Eating at a non-Muslim home is permitted — but only if they can trust what's in the food.","tip":"When hosting, name your ingredients unprompted and serve fish or vegetarian; never assume 'the wine cooks off' solves it — for many it doesn't."},{"t":"Ramadan: a month that rearranges life","d":"For one lunar month, no food or water from first light to sunset: a pre-dawn meal (suhoor, 'in which there is blessing' per Bukhari), the sunset fast-breaking (iftar, traditionally with dates), and long taraweeh prayers at the mosque each night. The last ten nights are the most intense, as Muslims seek Laylat al-Qadr; globally, dates sales and food markets surge around it.","tip":"During Ramadan, don't invite them to lunch — offer to join them for iftar instead; being asked to share that meal is an honor."},{"t":"The two Eids","d":"Eid al-Fitr celebrates Ramadan's end; Eid al-Adha commemorates Abraham's willingness to sacrifice his son (Muslims believe it was Ishmael) and coincides with Hajj — families gather, kids get gifts and new clothes, and it's the Muslim world's biggest shopping and feasting season. Muslims often take these days off work or pull kids from school.","tip":"Learn the dates and say 'Eid Mubarak' — silence on Eid feels to them like a friend ignoring your Christmas."},{"t":"Zakat: charity as a pillar, not a plate","d":"Once wealth passes a threshold (nisab, ~85g of gold), an observant Muslim gives 2.5% of accumulated savings annually — a calculated obligation, not spontaneous giving, often paid during Ramadan for extra reward. Many treat the calculation as seriously as taxes.","tip":"Generosity is deep common ground — comparing zakat and Christian giving is an easy, warm conversation that goes theological fast."},{"t":"Modesty runs on a spectrum","d":"Hijab practice ranges from none to headscarf to full covering, by conviction, family, and culture — and modesty rules also govern gender interaction: many observant Muslims avoid being alone with, or touching, unrelated members of the opposite sex.","tip":"Let the other person initiate a handshake across genders; a hand on the heart with a smile is a graceful, well-understood alternative."},{"t":"God-phrases woven into every sentence","d":"Inshallah ('if God wills') accompanies any future plan; alhamdulillah ('praise be to God') answers 'how are you?' and follows sneezes and meals; astaghfirullah ('I seek God's forgiveness') responds to sin or shock; mashallah wards envy off anything praised. These signal continuous God-consciousness, not empty filler.","tip":"Using inshallah and alhamdulillah sincerely (not performatively) is welcomed, and hearing them tells you where your friend's reflexes are — a Christian's 'Lord willing' (James 4:15) is a perfect bridge."},{"t":"The mosque and the imam","d":"Sunni Islam has no ordained clergy or hierarchy — an imam is simply a knowledgeable man who leads prayer, hired and fired by the mosque community; he hears no confessions and dispenses no sacraments. The mosque functions as prayer hall, weekend school, and community hub.","tip":"Don't map 'pastor' onto 'imam' — your friend's religious authority is diffuse (scholars, family, websites like IslamQA), so persuading one leader never moves a community."},{"t":"Hajj: the once-in-a-lifetime savings goal","d":"Every able Muslim must make pilgrimage to Mecca once; families save for decades, and completing it confers the honored title 'Hajji' and, per hadith, a clean slate of sins. It's a bucket-list obligation with real financial planning behind it — often thousands of dollars per person.","tip":"Asking 'have you been on Hajj — do you hope to go?' opens one of the most heartfelt conversations a Muslim can have, straight into what forgiveness costs."},{"t":"Quran school for the kids","d":"Most observant families send children to weekend or after-school madrasa/maktab classes to learn Arabic recitation, memorization, and basics of the faith — some aiming for full hifz (memorizing all ~600 pages). Quran recitation competitions are the Muslim world's spelling bees.","tip":"Ask parents what their kids are memorizing — pride in a child's Quran progress is universal, and it shows you why 'just read the Bible for yourself' lands differently in a memorization-first culture."},{"t":"Cultural Muslims outnumber devout ones in many places","d":"Practice varies enormously: 42% of U.S. Muslims say they pray all five daily prayers, while others observe only Ramadan and Eids — like Christmas-and-Easter Christians. Ethnic identity, family honor, and faith are braided together, so 'Muslim' may describe heritage more than conviction.","tip":"Ask, don't assume — 'what does your faith look like day to day?' respects the person in front of you instead of the stereotype, and many nominal Muslims have never been asked."}],"aboutyou":[{"t":"Your worship of Jesus looks like the one unforgivable sin","d":"Quran 4:48 teaches Allah may forgive anything except shirk — associating partners with God — and worshiping Jesus is the textbook example Muslims are taught. To your friend, the cross around your neck isn't neutral; it represents the sin that, if you die in it, God will not pardon.","tip":"Lead with your monotheism: 'I believe in one God — let me tell you what I actually mean' must come before any 'Son of God' language, or you'll be filed under polytheist before you finish the sentence."},{"t":"They think your Trinity includes Mary","d":"In Quran 5:116, God asks Jesus whether he told people to 'take me and my mother as two gods besides Allah' — so many Muslims grow up assuming the Trinity is Father, Jesus, and Mary, and that Christians worship three gods. Their objections often target this version, not what you believe.","tip":"Clarify immediately and without defensiveness: the Trinity is not three gods and never included Mary — one God, and you can often watch genuine surprise register."},{"t":"You are 'People of the Book' — honored and superseded","d":"The Quran grants Christians a special status (Ahl al-Kitab): Muslims may eat your food and marry your women, and Quran 5:82 calls Christians 'nearest in affection' to believers. But the frame is supersession — your revelation was true for its time and has been corrected and replaced by Islam, much as Christians view the Mosaic covenant.","tip":"Receive the respect and understand its shape: your friend honors you as holding an expired version of the truth, which is why 'we both follow Abraham's God' warms the room but never closes the distance by itself."},{"t":"They were taught your Bible is corrupted — before they could read","d":"The doctrine of tahrif holds that Jews and Christians altered their scriptures (citing Quran 2:79 and similar verses), so the Bible is unreliable except where the Quran confirms it. It's absorbed in childhood as background fact, though classical scholars actually disagreed on whether the corruption was of the text or only its interpretation.","tip":"Gently ask which verse says the text was corrupted, and note the Quran itself tells Christians to judge by the Gospel (5:47) and says none can change God's words (6:115) — a door the quran-affirms-torah-gospel case walks through."},{"t":"A verse warns against taking you as an intimate ally","d":"Quran 5:51 says 'do not take the Jews and the Christians as awliya' — a word meaning allies/protectors, which some communities absorb as a caution against close friendship, though mainstream scholars (following Ibn Kathir and al-Tabari) limit it to wartime political alliances, noting the Quran elsewhere permits marriage to Christian women. Teaching on it ranges from strict to warmly open.","tip":"Don't take initial guardedness personally; consistent, agenda-free friendship is precisely the evidence that dissolves the suspicious reading."},{"t":"They believe you were born Muslim","d":"Per hadith (Bukhari 1358), every child is born on the fitra — the natural disposition toward Islam — 'and his parents make him a Jew, a Christian, or a Magian.' This is why converts to Islam are called 'reverts': your Christianity is seen as a parental overlay on your true factory settings.","tip":"Knowing this reframes the conversation: to them you're not choosing between religions but returning home or staying estranged — so your testimony of actually meeting God in Christ confronts the theory with a person."},{"t":"Christian morality is judged by the culture's fruits","d":"Many Muslims are taught to read Western drinking, dating, immodesty, and family breakdown as Christianity's produce — since the West is assumed to be 'Christian,' Hollywood becomes your Sunday school. A devout Muslim may sincerely believe their moral standards exceed yours.","tip":"A visibly holy life — sexual integrity, sobriety, honored parents, generosity — dismantles this teaching more powerfully than any argument, and distinguishing 'Western' from 'Christian' out loud helps."},{"t":"Missionaries are pre-cast as colonial agents","d":"Christian missions arrived in much of the Muslim world alongside European empires — under British rule in Egypt, French rule in Algeria — and are remembered as imperialism's soft arm; many Muslim-majority states restricted missionaries at independence. 'Evangelism' can therefore register as geopolitical aggression, not good news.","tip":"Be transparently a friend, not a project with a timeline — Muslims can smell a target-based friendship, and the accusation collapses when your love visibly doesn't depend on their conversion."},{"t":"Questioning Islam carries costs you've never paid","d":"Leaving Islam is criminalized in some 23 countries (13 with capital statutes), and even in the West an ex-Muslim commonly risks family rupture, ostracism, and lost marriages — honor and religion are fused, so a child's doubt shames the whole family. Your friend's hesitancy to engage hard questions may be fear of the price, not lack of interest.","tip":"Never push for public declarations; offer private space, absolute discretion, and count the cost with them — Luke 14 realism honors what following Jesus would actually require of them."},{"t":"They already love Jesus — really","d":"Muslims revere Isa as a major prophet: virgin-born, sinless in most tellings, a miracle-worker who healed lepers and raised the dead by God's permission, the Messiah who will return — named 25 times in the Quran, more than Muhammad. Speaking ill of Jesus genuinely offends a Muslim.","tip":"Start where the love already is: 'tell me what you believe about Jesus' opens warmly, and 'why would God's Messiah matter this much?' lets his actual words in the Gospels do the rest."},{"t":"Sunni and Shia: a succession crisis at the very start","d":"Islam split within a generation of Muhammad's death (632 AD) over who should lead: Abu Bakr, chosen by the community (the Sunni position), or Ali, Muhammad's cousin and son-in-law, designated by divine right (the Shia position). Karbala (680) sealed the divide in blood. Today roughly 85-90% of Muslims are Sunni and 10-15% Shia, concentrated in Iran, Iraq, Bahrain, Azerbaijan, and Lebanon. Twelver Shia — the large majority of Shia — hold that the twelfth imam, Muhammad al-Mahdi, entered hiding ('occultation') in 874 AD, is still alive, and will return as the Mahdi to bring justice.","tip":"Never assume which tradition your friend belongs to — ask, and ask what it means to them; Shia friends especially may carry a strong sense of historical grievance and love for the Prophet's family. The split itself can open honest conversation: if God's final revelation left no clear successor and the community fractured immediately, what does that say about where authority really lies? Christians can point to a Shepherd who said his sheep hear his voice — and who never left."},{"t":"Sufism: the mystical hunger inside Islam","d":"Sufism is Islam's mystical stream — the whirling dervishes of the Mevlevi order (Rumi's heirs), dhikr chanting, saint veneration, and shrine pilgrimage. For centuries it was mainstream piety across much of the Muslim world, and it remains woven through South Asian, Turkish, and African Islam. Salafis and Wahhabis condemn shrine visitation and saint intercession as shirk (idolatry) — which is why jihadist and Salafi movements bulldoze Sufi shrines (Timbuktu 2012, ISIS across Iraq and Syria, the 2017 massacre of 300+ worshippers at a Sufi mosque in Sinai). The battle over Sufism is an intra-Islamic war about whether God can be intimately experienced.","tip":"A Sufi-inclined friend is telling you something precious: they hunger for closeness to God, not just rule-keeping — and their own tradition's hardliners call that hunger idolatry. Don't debate; resonate. Share what union with God looks like in Christ: 'Abide in me' (John 15), the indwelling Spirit, adoption as sons. The longing Sufism reaches for through techniques and saints, the gospel offers as a gift and a certainty."},{"t":"Hafiz culture: memorized sound vs. studied meaning","d":"A hafiz is someone who has memorized the entire Quran in Arabic — all 6,000+ verses — and Muslim communities worldwide produce millions of them, often children. But since roughly 80% of Muslims are not native Arabic speakers, many huffaz can recite the whole book flawlessly without understanding the language. This isn't seen as a deficiency: in Islam the Quran IS the Arabic recitation — the sound itself is the sacred object, and reward attaches to recitation per letter. Translations are officially only 'interpretations of the meanings.' Christians relate to scripture almost oppositely: the Bible is meaning meant to be translated, studied, and understood, in every language from the start (Acts 2).","tip":"Never belittle memorization — it reflects real devotion and discipline that puts most Christians' scripture engagement to shame; say so. Instead, ask meaning questions with genuine curiosity: 'That surah you recited — what is it saying? What does it mean to you?' Then offer to read a Gospel together in your friend's heart language. The experience of scripture that speaks directly, in their own tongue, about a God who wants to be understood, is often itself the door."}],"doctrine":[{"topic":"God","theirs":"Tawhid — the absolute oneness of Allah — is the heart of Islam: 'Say: He is Allah, the One; Allah, the Eternal Refuge; He neither begets nor is born, nor is there to Him any equivalent' (Quran 112:1-4). Associating partners with Allah (shirk) is the one sin Allah will not forgive if a person dies upon it (Quran 4:48). Allah is utterly unlike His creation — 'there is nothing like unto Him' (Quran 42:11) — and is known through His most beautiful names and attributes (Quran 7:180). The classic Sunni creed Aqidah al-Tahawiyyah opens here: Allah is one, without partner, and nothing is like Him.","bible":"Christianity equally confesses one God — 'Hear, O Israel: the LORD our God, the LORD is one' (Deuteronomy 6:4) — while holding that the one God eternally exists as Father, Son, and Holy Spirit: one Being, three persons (Matthew 28:19; 2 Corinthians 13:14). The Word who was 'with God' and 'was God' became flesh in Jesus (John 1:1, 14). This is not three gods; the Nicene Creed begins 'We believe in one God,' and historic Christianity has always condemned tritheism.","key":"Both faiths confess exactly one God; the divide is whether His oneness is an absolute singularity (tawhid) or an eternal tri-personal unity (Trinity)."},{"topic":"Jesus (Isa)","theirs":"Isa ibn Maryam is one of the greatest messengers of Allah, born of the virgin Maryam by Allah's creative command 'Be' (Quran 3:45-47; 19:19-21), honored as al-Masih (the Messiah), 'a word from Allah,' and 'a spirit from Him' (Quran 4:171) — yet a servant and prophet, not divine and not the son of God (Quran 5:75; 112:3). He performed miracles by Allah's permission, including healing the blind and the leper and raising the dead (Quran 3:49). He was neither killed nor crucified — 'it was made to appear so to them' — and Allah raised him alive to Himself (Quran 4:157-158). He will return before the Hour (Quran 43:61).","bible":"Jesus is fully God and fully man: 'the Word became flesh and dwelt among us' (John 1:14), and 'in him the whole fullness of deity dwells bodily' (Colossians 2:9). He was crucified for sins, buried, and raised on the third day (1 Corinthians 15:3-4), his death a voluntary ransom (Mark 10:45; Romans 5:8). The apostles confessed him as Lord and God (John 20:28), and his cross and resurrection are the center of the Christian gospel, not an embarrassment to be denied.","key":"The crux is whether Jesus is a revered human prophet who was never crucified, or the incarnate Son of God whose crucifixion and resurrection accomplish salvation."},{"topic":"The Holy Spirit","theirs":"Ruh al-Qudus ('the Holy Spirit') in the Quran is, in the majority Sunni tafsir, the angel Jibril (Gabriel): Allah strengthened Isa with Ruh al-Qudus (Quran 2:87; 5:110), and Ruh al-Qudus 'brought the Quran down from your Lord in truth' (Quran 16:102), where he is also called 'the Trustworthy Spirit' (Quran 26:193). Angels are honored servants created by Allah who never disobey Him (Quran 21:26-27; 66:6). The Spirit is therefore a creature and messenger of Allah, and directing worship to him would be shirk.","bible":"The Holy Spirit is a divine person, not an angel: he spoke through the prophets (2 Peter 1:21), lying to him is lying to God (Acts 5:3-4), and he is named alongside the Father and the Son in baptism (Matthew 28:19). Jesus promised him as 'another Helper' who teaches, convicts, and abides with believers forever (John 14:16-17, 26). He personally indwells every Christian (Romans 8:9-11), which is why Christians worship and pray in the Spirit rather than merely about him.","key":"The question is whether 'the Holy Spirit' names the created angel Gabriel who carries revelation, or the third divine person of the Trinity who indwells believers."},{"topic":"Scripture & authority","theirs":"The Quran is the literal, uncreated speech of Allah, revealed to Muhammad through Jibril over twenty-three years, inimitable (Quran 2:23) and divinely guaranteed against corruption: 'Indeed, We sent down the Reminder, and We will surely preserve it' (Quran 15:9). Earlier scriptures — the Tawrat, Zabur, and Injil — were genuine revelations, but Muslims hold their present texts suffered alteration (tahrif; cf. Quran 2:79), so the Quran confirms what is true in them and stands as the final criterion over them (Quran 5:48). The Prophet's sunnah, preserved in authenticated hadith (Sahih al-Bukhari, Sahih Muslim), is the second source of authority, for obeying the Messenger is obeying Allah (Quran 4:80; 59:7).","bible":"The Bible, Old and New Testaments, is God-breathed (2 Timothy 3:16), written by men 'carried along by the Holy Spirit' (2 Peter 1:21). Jesus taught that Scripture cannot be broken (John 10:35) and that heaven and earth will pass away before his words do (Matthew 24:35); 'the word of our God will stand forever' (Isaiah 40:8). Historic Christianity therefore denies that the biblical text was lost or corrupted, holding it to be the sufficient and final written authority, needing no superseding revelation.","key":"The crux is whether the Bible's text stands preserved and final, or was corrupted in transmission and superseded by the Quran as God's protected last word."},{"topic":"Salvation","theirs":"Salvation comes through iman (faith in Allah and His Messenger) joined with righteous deeds and, above all, Allah's mercy: on the Day of Judgment, those whose scales weigh heavy with good succeed (Quran 23:102-103; 101:6-9). The five pillars — shahada, salah, zakat, sawm, and hajj — form the framework of the faithful life (Sahih al-Bukhari 8). Sincere tawbah (repentance) erases sin (Quran 39:53; 25:70), and the Prophet taught that no one enters Paradise by deeds alone, but only when Allah covers him with mercy (Sahih al-Bukhari 5673; Sahih Muslim 2816). No atoning mediator is needed or possible — 'no bearer of burdens will bear the burden of another' (Quran 35:18) — for each soul answers to Allah directly.","bible":"Salvation is by grace through faith, 'not a result of works, so that no one may boast' (Ephesians 2:8-9): all have sinned, and all who believe are 'justified by his grace as a gift, through the redemption that is in Christ Jesus' (Romans 3:23-24). Christ bore sins in the sinner's place — 'he himself bore our sins in his body on the tree' (1 Peter 2:24; Isaiah 53:5-6). Good works necessarily follow as the fruit of salvation, not its ground (Ephesians 2:10; James 2:17).","key":"The crux is whether one is saved by faith, deeds, and mercy weighed at the final judgment, or by trusting an atonement Christ has already accomplished on one's behalf."},{"topic":"Sin & human nature","theirs":"Every child is born upon the fitra — an innate, pure disposition to recognize and worship Allah alone (Quran 30:30; Sahih al-Bukhari 1358) — and no one inherits Adam's sin: Adam repented, and Allah accepted his repentance completely (Quran 2:37; 20:122). Humans are created morally accountable but weak and forgetful (Quran 4:28), and sin consists of individual acts, not a corrupted nature; 'no bearer of burdens will bear the burden of another' (Quran 35:18). The remedy for sin is remembrance, obedience, and repentance — 'all the children of Adam are sinners, and the best of sinners are those who repent' (Jami at-Tirmidhi 2499).","bible":"Humanity is made in God's image (Genesis 1:27), yet 'sin came into the world through one man, and death through sin, and so death spread to all men' (Romans 5:12). David confesses, 'in sin did my mother conceive me' (Psalm 51:5), and 'the heart is deceitful above all things' (Jeremiah 17:9). Because the problem is a fallen nature and not only wrong acts, Jesus says one 'must be born again' (John 3:3) — humanity needs regeneration, not merely reminding.","key":"The crux is whether humans are born pure upon a God-ward fitra and merely commit sins, or are born with a fallen nature that requires new birth."},{"topic":"The afterlife","theirs":"At death the soul enters barzakh, the intervening realm lasting until the resurrection — 'behind them is a barrier until the day they are resurrected' (Quran 23:100) — where the grave brings questioning by the angels and either bliss or punishment; Aqidah al-Tahawiyyah affirms the punishment of the grave as orthodox belief. On the Day of Judgment all are raised, the scales of deeds are set (Quran 21:47), records are given, and souls pass to Jannah — gardens beneath which rivers flow (Quran 2:25; Surah 55-56) — or to Jahannam, the Fire (Quran 3:185; 67:6-11). Muslims who enter the Fire for their sins may later be brought out by Allah's mercy and the Prophet's intercession (shafa'a; Sahih al-Bukhari 7439), but one who dies upon shirk is barred from Paradise forever (Quran 4:48; 5:72).","bible":"At death the believer goes to be with Christ — 'away from the body and at home with the Lord' (2 Corinthians 5:8; Luke 23:43). All will be bodily raised, 'those who have done good to the resurrection of life, and those who have done evil to the resurrection of judgment' (John 5:28-29). The final states are everlasting: God dwelling with his redeemed in a renewed creation (Revelation 21:3-4), and eternal punishment for the lost (Matthew 25:46; Revelation 20:15), with destiny turning on one's standing in Christ (John 3:36).","key":"The crux is whether final destiny is settled by the weighing of deeds — with possible release from the Fire for believers — or fixed at death by one's relationship to Christ."},{"topic":"Assurance","theirs":"The believer lives between fear and hope (khawf and raja) — fearing Allah's justice while trusting His mercy, for 'do not despair of the mercy of Allah' (Quran 39:53) yet His punishment is real (Quran 15:49-50). Sunni orthodoxy holds that no one may declare his own final destiny, since one's ending (khatima) is known to Allah alone; even the Prophet said, 'None of you will enter Paradise by his deeds... not even me, unless Allah covers me with His mercy' (Sahih al-Bukhari 5673; Sahih Muslim 2816). Aqidah al-Tahawiyyah teaches that we do not testify of any specific member of the qiblah that he is in the Garden or the Fire. Claiming certainty of Paradise is presumption; despairing of mercy is itself a sin (Quran 12:87) — the exceptions are those, like the ten Companions, named by revelation itself.","bible":"Assurance of salvation is presented as normal Christian experience: 'I write these things to you who believe in the name of the Son of God, that you may know that you have eternal life' (1 John 5:13). Jesus promises his sheep 'will never perish, and no one will snatch them out of my hand' (John 10:28), and 'there is therefore now no condemnation for those who are in Christ Jesus' (Romans 8:1), from whose love nothing can separate the believer (Romans 8:38-39). This confidence rests on Christ's finished work rather than the believer's own merit.","key":"The crux is whether a believer can presently know his final salvation, or must rightly remain between fear and hope because the outcome is Allah's alone to know."},{"topic":"Muhammad & prophets","theirs":"Allah sent a messenger to every nation with the same message — 'worship Allah and shun false gods' (Quran 16:36) — from Adam through Nuh, Ibrahim, Musa, and Isa, all of whom submitted to Allah. Muhammad is the last of them, 'the Messenger of Allah and the Seal of the Prophets' (Quran 33:40), sent 'as a mercy to the worlds' (Quran 21:107), and his sunnah is the beautiful pattern for life (Quran 33:21). Sunni theology holds that prophets possess isma — protection from major sin and from error in delivering revelation. The Prophet is loved and obeyed as part of faith itself (Quran 3:31-32), yet he is a man and servant of Allah, never an object of worship.","bible":"God 'spoke to our fathers by the prophets' but 'in these last days he has spoken to us by his Son' (Hebrews 1:1-2) — Jesus is the one to whom all prophecy pointed (Luke 24:27), and the apostolic witness to him completes the foundation (Ephesians 2:20). Christians are commanded to test every later claim of revelation (1 John 4:1) and to receive no other gospel, 'even if we or an angel from heaven' should preach it (Galatians 1:8). Historic Christianity therefore recognizes no prophet after the apostles who revises the gospel of Christ.","key":"The crux is whether God's revelation culminates in Muhammad as the final prophet, or in Jesus as the Son beyond whom no further prophet can speak a new word."},{"topic":"Prayer & worship","theirs":"Salah — the five daily prescribed prayers (fajr, dhuhr, asr, maghrib, isha) — is the second pillar of Islam, performed in Arabic, facing the qibla toward the Ka'bah (Quran 2:144), after wudu, ritual purification (Quran 5:6), in fixed cycles (rak'at) of standing, bowing, and prostration with recitation of Surah al-Fatiha in every unit (Sahih al-Bukhari 756). It is commanded directly — 'establish prayer for My remembrance' (Quran 20:14) — and is the first deed a servant is questioned about on the Day of Judgment (Jami at-Tirmidhi 413). Alongside salah, the Muslim offers du'a — personal supplication in any language, at any time (Quran 40:60) — and dhikr, the remembrance of Allah.","bible":"Christian prayer is addressed to God as Father, in the name of the Son (Matthew 6:9-13; John 14:13-14), with no prescribed hours, direction, ritual washing, or sacred language. Believers are told to 'pray without ceasing' (1 Thessalonians 5:17) and to 'draw near with confidence to the throne of grace' through Christ the high priest (Hebrews 4:16). True worship is 'in spirit and truth' rather than tied to a place (John 4:23-24), though Christians have always also gathered for corporate, ordered worship (Acts 2:42).","key":"The crux is whether worship centers on divinely prescribed ritual prayer at set times in set form, or on continual, free access to God as Father through Christ."},{"topic":"Law & life","theirs":"Allah's guidance embraces all of life through the sharia, drawn from the Quran and sunnah and elaborated by the science of fiqh in the established madhhabs, classifying actions from obligatory (fard) to forbidden (haram). Daily practice includes eating only halal food and avoiding pork and intoxicants (Quran 2:173; 5:3, 90-91), shunning riba — interest (Quran 2:275) — and observing modesty in dress and conduct for both men and women (Quran 24:30-31). Living within the law is itself worship and the path of taqwa: 'This day I have perfected for you your religion' (Quran 5:3). The law is a mercy, not a burden — 'Allah intends for you ease, and does not intend hardship' (Quran 2:185).","bible":"The moral law is summed up in love for God and neighbor (Matthew 22:37-40), and 'Christ is the end of the law for righteousness to everyone who believes' (Romans 10:4). The ceremonial and dietary codes no longer bind: Jesus 'declared all foods clean' (Mark 7:18-19; Acts 10:15), and believers are told, 'for freedom Christ has set us free' — a freedom used to serve one another in love (Galatians 5:1, 13). In disputable matters, each is governed by conscience before the Lord (Romans 14:5-6).","key":"The crux is whether the godly life is walked inside a comprehensive revealed legal code, or in Spirit-led liberty of conscience under the law of love."},{"topic":"Marriage & family","theirs":"Marriage (nikah) is a solemn covenant (Quran 4:21) and a beloved sunnah of the Prophet (Sunan Ibn Majah 1846); spouses are 'garments for one another' (Quran 2:187), created so that hearts find tranquility, love, and mercy (Quran 30:21). The husband bears responsibility for provision and maintenance of the family (Quran 4:34), while the mahr (dower) is the wife's own inalienable right (Quran 4:4). A man may marry up to four wives on condition of just treatment — with the warning that justice is hard to achieve (Quran 4:3, 129) — and Muslim men may marry chaste women of the People of the Book (Quran 5:5). Divorce is lawful but regulated with waiting periods and due process (Quran 2:229-232), and children owe lifelong kindness to their parents (Quran 17:23-24).","bible":"Marriage was instituted by God at creation as one man and one woman becoming 'one flesh' (Genesis 2:24), a union Jesus declared permanent: 'what God has joined together, let not man separate' (Matthew 19:4-6). It is a living picture of Christ and the church, with husbands commanded to love their wives sacrificially 'as Christ loved the church' (Ephesians 5:25, 31-32), and spouses giving themselves mutually (1 Corinthians 7:3-4). Monogamy is the creational pattern and the New Testament norm (1 Timothy 3:2), and children are to be raised 'in the discipline and instruction of the Lord' (Ephesians 6:1-4).","key":"The crux is whether marriage is a contract within revealed law that permits conditional polygyny, or a lifelong one-flesh union of two that images Christ and the church."},{"topic":"Predestination (qadar) & free will","theirs":"Belief in qadar — Allah's decree of all things, the good of it and the bad of it — is the sixth article of iman, established in the hadith of Jibril (Sahih Muslim 8). 'Indeed, We created all things with qadar' (Quran 54:49), and everything that will occur was written in the Preserved Tablet (al-Lawh al-Mahfuz) before creation (Quran 57:22). Yet humans genuinely earn their deeds and are justly accountable — 'whoever wills, let him believe; and whoever wills, let him disbelieve' (Quran 18:29) — for Allah wrongs no one (Quran 4:40); Ash'ari theology names this human share kasb (acquisition). Sunni orthodoxy holds decree and responsibility together, rejecting both fatalism (Jabriyya) and denial of decree (Qadariyya), and Aqidah al-Tahawiyyah counsels that the depths of qadar are Allah's secret, not to be over-probed.","bible":"God 'works all things according to the counsel of his will' (Ephesians 1:11): 'the heart of man plans his way, but the LORD establishes his steps' (Proverbs 16:9), and those he foreknew he predestined, called, justified, and glorified (Romans 8:29-30). Yet Scripture equally issues real commands and real choices — 'choose this day whom you will serve' (Joshua 24:15) — and holds every person accountable (Acts 17:30-31). Historic Christianity affirms both truths, locating sovereignty in the Father's redemptive purpose in Christ, while its traditions (Augustinian/Reformed and Arminian among them) have long debated the balance.","key":"Both traditions hold divine sovereignty together with human accountability; the crux is that Islam rests this in an eternally written decree received as Allah's inscrutable secret, while Christian teaching anchors it in God's fatherly purpose worked out in Christ."},{"topic":"End times","theirs":"Sunni eschatology, drawn chiefly from hadith, expects the signs of the Hour to multiply until the Mahdi — a rightly-guided leader from the Prophet's family — appears and fills the earth with justice as it was filled with oppression (Sunan Abi Dawud 4282-4285). Then comes the Dajjal, the one-eyed false messiah and greatest trial ever to face mankind (Sahih Muslim 2934; Sahih al-Bukhari 7131), after which Isa ibn Maryam will descend — in the well-known narration, at the white minaret east of Damascus (Sahih Muslim 2937) — kill the Dajjal, break the cross, and rule justly by Islam (Sahih al-Bukhari 3448); the Quran calls Isa a sign of the Hour (Quran 43:61). Gog and Magog (Yajuj and Majuj) will then be released (Quran 21:96) before the trumpet, resurrection, and judgment. (Twelver Shia Islam diverges here, identifying the Mahdi as the Twelfth Imam, alive in occultation.)","bible":"Christ will return personally, visibly, and in glory — 'this Jesus... will come in the same way as you saw him go' (Acts 1:11; Matthew 24:30) — the dead will be raised and all judged (1 Thessalonians 4:16-17; Revelation 20:11-15). Before the end comes a great deception under the 'man of lawlessness' or antichrist (2 Thessalonians 2:3-8; 1 John 2:18), whom Christ destroys at his appearing. History ends not in another era of earthly rule but in new heavens and a new earth where God dwells with his people (Revelation 21:1-4); the day and hour no one knows (Matthew 24:36).","key":"Both faiths await Jesus's return and a final deceiver; the crux is what Jesus returns as — in Islam a Muslim prophet who vindicates tawhid and Islam, in Christianity the divine Lord who raises the dead and judges the world."}]};
/* ---------- know them ---------- */
function renderKnow(){
  const tabs=[["kt-facts","✨ Did you know?"],["kt-week","🗓 Inside their week"],["kt-you","👀 What they're taught about you"]];
  if(KNOW.doctrine)tabs.push(["kt-doct","📖 Side by side"]);
  const on=state.knowTab||"kt-facts";
  $("#main").innerHTML=`<div class="viewhead"><h2>Know your Muslim neighbor</h2>
  <p>Understanding before argument. Surprising true facts for conversational fluency, the rhythm of their religious life so you can love them practically, and how they've been taught to see you — so nothing they say catches you off guard.</p></div>
  <div class="tabs2">${tabs.map(([k,l])=>`<button class="tab2 ${on===k?"on":""}" data-pane="${k}">${l}</button>`).join("")}</div>
  <div class="tabpane2 ${on==="kt-facts"?"on":""}" id="kt-facts"><div class="kgrid">${KNOW.didyouknow.map(x=>`<div class="ptcard">${x.img?`<img class="ktop" src="${x.img.src}" loading="lazy" data-full="${x.img.src.replace("width=520","width=1400")}" data-cap="${esc(x.img.cap)}">`:""}<h3 class="ptv">${esc(x.t)}</h3><p class="pt">${rich(x.d)}</p><div class="refs">${x.src?`<a href="${esc(x.src)}" target="_blank" rel="noopener">Source</a>`:""}${x.id&&byId[x.id]?` · <button class="klink" data-open="${x.id}">Related case: ${esc(byId[x.id].title)}</button>`:""}</div></div>`).join("")}</div></div>
  <div class="tabpane2 ${on==="kt-week"?"on":""}" id="kt-week">${KNOW.week.map(x=>`<div class="ptcard"><h3 class="ptv">${esc(x.t)}</h3><p class="pt">${rich(x.d)}</p>${x.tip?`<div class="who you">For you as their friend</div><p class="pt">${rich(x.tip)}</p>`:""}</div>`).join("")}</div>
  <div class="tabpane2 ${on==="kt-you"?"on":""}" id="kt-you">${KNOW.aboutyou.map(x=>`<div class="ptcard"><h3 class="ptv">${esc(x.t)}</h3><p class="pt">${rich(x.d)}</p>${x.tip?`<div class="who you">How to navigate it</div><p class="pt">${rich(x.tip)}</p>`:""}</div>`).join("")}</div>${KNOW.doctrine?`<div class="tabpane2 ${on==="kt-doct"?"on":""}" id="kt-doct">${KNOW.doctrine.map(x=>`<div class="ptcard"><h3 class="ptv">${esc(x.topic)}</h3><div class="ddgrid"><div><div class="who them">They teach</div><p class="pt">${rich(x.theirs)}</p></div><div><div class="who you">The Bible teaches</div><p class="pt">${rich(x.bible)}</p></div></div>${x.key?`<div class="ddkey">${rich(x.key)}</div>`:""}</div>`).join("")}</div>`:""}`;
  document.querySelectorAll("#main .tab2").forEach(t=>t.addEventListener("click",()=>{state.knowTab=t.dataset.pane;}));
  document.querySelectorAll("#main [data-open]").forEach(b=>b.addEventListener("click",()=>openCase(b.dataset.open)));
}

/* ---------- router ---------- */
function render(){
  if(state.view!=="case"&&location.hash.indexOf("#case/")===0)try{history.replaceState(null,"",location.pathname+location.search)}catch(e){}
  document.querySelector(".app").classList.toggle("reading",state.view!=="overview");
  renderNav();
  if(state.view==="case")return renderCase();
  if(state.view==="paths")return renderPaths(),renderPreview();
  if(state.view==="timeline")return renderTimeline(),renderPreview();
  if(state.view==="glossary")return renderGlossary(),renderPreview();
  if(state.view==="share")return renderShare(),renderPreview();
  if(state.view==="proofs")return renderProofs(),renderPreview();
  if(state.view==="theysay")return renderTheySay(),renderPreview();
  if(state.view==="lessons")return renderLessons(),renderPreview();
  if(state.view==="know")return renderKnow(),renderPreview();
  if(state.view==="core")return renderCore(),renderPreview();
  renderOverview();renderPreview();
}

/* ---------- keyboard ---------- */
document.addEventListener("keydown",e=>{
  const inInput=/input|textarea/i.test(document.activeElement.tagName);
  if(inInput){if(e.key==="Escape")document.activeElement.blur();return;}
  const list=filtered();
  const move=dir=>{
    const idx=list.findIndex(x=>x.id===state.sel);
    const next=list[Math.min(list.length-1,Math.max(0,(idx<0?0:idx+dir)))];
    if(!next)return;
    state.sel=next.id;
    if(state.view==="case"){openCase(next.id);}
    else{renderPreview();
      const el=document.querySelector(`.vt[data-id="${next.id}"]`);
      document.querySelectorAll(".vt.sel").forEach(x=>x.classList.remove("sel"));
      document.querySelectorAll(`.vt[data-id="${next.id}"]`).forEach(x=>x.classList.add("sel"));
      if(el)el.scrollIntoView({block:"nearest"});}
  };
  switch(e.key==="ArrowRight"?"next":e.key==="ArrowLeft"?"prev":e.key.toLowerCase()){
    case "next":e.preventDefault();move(1);break;
    case "prev":e.preventDefault();move(-1);break;
    case "enter":if(state.sel&&state.view!=="case")openCase(state.sel);break;
    case "escape":if(state.view==="case"){state.view=state.pathId?"paths":"overview";state.caseId=null;render();}else{state.q="";const q=$("#q");if(q)q.value="";state.verdict=null;state.severity=null;render();}break;
    case "o":state.view="overview";state.section="all";state.caseId=null;render();break;
    case "p":state.view="paths";state.caseId=null;render();break;
    case "t":state.view="timeline";state.caseId=null;render();break;
    case "g":state.view="glossary";state.caseId=null;render();break;
    case "s":state.view="share";state.caseId=null;render();break;
    case "h":state.view="core";state.caseId=null;render();break;
  }
});

const TOURSTEPS=[{"icon":"⚖","title":"What this is","body":"<b>78 documented claims</b> about Islam, each weighed against the Bible. Nearly all of it is argued from Islam's own trusted books — Sahih al-Bukhari, Sahih Muslim, and the classical commentaries. Not from ours. That is the whole method."},{"icon":"📖","title":"Every case opens in plain English","body":"Short blocks. One idea per sentence. What Islam teaches, what the sources say, the strongest Muslim answer, how strong the case is, and one line to say out loud. The full sourced version sits underneath on the same page."},{"icon":"🏷","title":"Four verdicts, one glance","body":"Every claim lands in one of four columns:<div class=\"vrow2\"><div><span class=\"badge v-admitted\">Admitted</span><span>the facts sit in Islam's own sources</span></div><div><span class=\"badge v-unrefuted\">Unrefuted</span><span>no good Muslim answer has been published</span></div><div><span class=\"badge v-contested\">Contested</span><span>they have a real answer — say so</span></div><div><span class=\"badge v-answered\">Answered</span><span>their answer wins, and we say so</span></div></div>"},{"icon":"🤝","title":"Honour runs this conversation","body":"Never mock Muhammad or the Quran to a Muslim's face. It is heard as an attack on their family and it ends everything, permanently. Honest questions are always fine. Contempt never is. Six cases here exist only to tell Christians which arguments to drop."},{"icon":"🚀","title":"Where to start","body":"Read <b>The heart of it</b>. Islam's whole case against Christianity rests on one claim, and that claim runs into the Quran itself. Master that and every other door opens. Replay this tour any time from the sidebar.","cta":"Take me to the heart of it"}];
function startTour(){
  const old=document.querySelector(".tourwrap");if(old)old.remove();
  let ti=0;
  const wrap=document.createElement("div");wrap.className="tourwrap";
  function finish(go){localStorage.setItem(TOURKEY,"1");wrap.remove();if(go){state.view="core";state.caseId=null;render();}}
  function draw(){
    const s=TOURSTEPS[ti];
    wrap.innerHTML='<div class="tourcard"><div class="ticon">'+s.icon+'</div><h3>'+s.title+'</h3><div class="tbody">'+s.body+'</div>'+
      '<div class="tdots">'+TOURSTEPS.map((_,j)=>'<i class="'+(j===ti?"on":"")+'"></i>').join("")+'</div>'+
      '<div class="trow"><button class="tskip">Skip tour</button><div>'+(ti>0?'<button class="tback">Back</button>':'')+
      '<button class="tnext">'+(ti===TOURSTEPS.length-1?s.cta:'Next')+'</button></div></div></div>';
    wrap.querySelector(".tskip").addEventListener("click",()=>finish(false));
    const bk=wrap.querySelector(".tback");if(bk)bk.addEventListener("click",()=>{ti--;draw();});
    wrap.querySelector(".tnext").addEventListener("click",()=>{if(ti===TOURSTEPS.length-1){finish(ti===TOURSTEPS.length-1&&true);}else{ti++;draw();}});
  }
  document.body.appendChild(wrap);draw();
}
if(!localStorage.getItem(TOURKEY))setTimeout(startTour,500);

document.documentElement.dataset.theme=localStorage.getItem("wb_theme")||"dark";
$("#q").addEventListener("input",e=>{
  state.q=e.target.value.trim().toLowerCase();
  if(state.view!=="overview"){state.view="overview";state.caseId=null;}
  render();
});
window.addEventListener("hashchange",()=>{
  const m=location.hash.match(/^#case\/([A-Za-z0-9-]+)$/);
  if(m&&byId[m[1]]){if(state.caseId!==m[1])openCase(m[1]);}
  else if(!location.hash&&state.view==="case"){state.view="overview";state.caseId=null;render();}
});
