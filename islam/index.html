buttal video explains the qira'at, the numbers deflate on inspection, and the audience concludes that the critic did not understand the material — squandering a real issue. What to say instead: this site already holds the strong version, in uthman-burning-companion-codices, sanaa-palimpsest-qiraat and uthman-standardization-qiraat. Why did preservation by Allah require Uthman to burn rivals? Why did Ibn Mas'ud reject surahs that are in today's mushaf? Which of the readings — differing in actual words, not just accent, as at Quran 2:184 — is the preserved dictation? Precision here wins; the stack of books loses. Note the asymmetry honestly: Islam claims letter-perfect dictation, so even small variants cut deeper against the Quran than against a Bible whose textual history is openly critical.","severity":"low","plain":[{"t":"The performance","d":"A stack of printed Arabic Qurans is waved. <b>\"Here are 26 different Qurans with 93,000 differences, and Muslims cannot even tell you which one is preserved.\"</b> It comes from Speakers' Corner, associated with Jay Smith and Hatun Tash."},{"t":"Why it is wrong","d":"Those printed editions are the canonical <i>qira'at</i> — the recognised reading traditions. Hafs, Warsh, Qalun, al-Duri and others. They differ mostly in pronunciation and spelling, with a limited set of wording differences, and all descend from the Uthmanic consonantal skeleton. The 93,000 figure counts vowel and dialect differences."},{"t":"The comparison that shows it","d":"Calling them 26 different Qurans is roughly like calling the KJV, NIV and ESV three different Bibles. Christians reject that framing when Muslims use it. We should not use it in reverse."},{"t":"Why it backfires","d":"A Muslim who has watched one rebuttal video explains the <i>qira'at</i>. The numbers deflate on inspection. The audience concludes that the critic did not understand the material, and a real issue is squandered."},{"t":"What to say instead","d":"Ask the precise questions this site already carries. Why did preservation by Allah require Uthman to burn the rivals? Why did Ibn Mas'ud reject surahs that are in today's mushaf? Which reading is <i>the</i> preserved dictation, where they differ in actual words and not just vowels — as at Quran 2:184? Note the asymmetry honestly too. Islam claims letter-perfect dictation, so even small variants cut deeper against the Quran than against a Bible whose textual history is openly critical."},{"say":true,"t":"What to say","d":"\"There are not 26 Qurans. There are ten canonical readings, and my question is which one is the dictated text.\""}],"rewritten":true,"titleLong":"Don't use: 'There are 26 (or 31) different Qurans'"},
{"id":"avoid-taqiyya-overclaim","title":"Don't use: 'Muslims are commanded to lie' (taqiyya)","category":"practice","avoid":true,"claim":"The loud version says taqiyya is a broad order for Muslims to lie to unbelievers. So nothing a Muslim says can be trusted. Not in talk, not in public life, not at an interfaith event.","quran":["Quran 16:106","Quran 3:28"],"hadith":["Sahih al-Bukhari 3030"],"bible":[],"sources":[{"name":"Taqiyya — Wikipedia (doctrine overview and scope)","type":"institutional","url":"https://en.wikipedia.org/wiki/Taqiyya"},{"name":"Sahih al-Bukhari 3030 — 'War is deceit'","type":"primary","url":"https://sunnah.com/bukhari:3030"},{"name":"This site — taqiyya-deception (the honest version of the doctrine)","type":"institutional"}],"response":"The correction is that taqiyya in the old law books is leave, not an order. It lets a man hide his faith under force, or when his life is at risk (Quran 16:106; 3:28's 'unless you fear them'). It was worked out mainly in Shia law, under Sunni attack. The base rule in Islam is that lying is a grave sin. What is really there is smaller, and on the record. Deceit is allowed in war — 'war is deceit' (Sahih al-Bukhari 3030). And there are cases such as the false words used in the killing of Ka'b ibn al-Ashraf. That is what this site's taqiyya-deception case sets out.","responseSource":{"name":"Classical fiqh of taqiyya; this site's taqiyya-deception case","url":"https://en.wikipedia.org/wiki/Taqiyya"},"verdict":"answered","rationale":"Here is why it backfires. The big claim cannot be tested. If every denial is itself taqiyya, then no evidence can ever count against you. People hear that move and stop weighing the rest of what you say. It also gets the rule wrong, and a Muslim can show you that in seconds. What to say instead is the small version. Islam lets a man hide his faith under threat. It allows deceit in war. And Muhammad did allow false words in one killing. That is on the record, it is damaging, and you can hold it. Telling the man in front of you that he is lying is unfair, and it ends the talk.","severity":"low","plain":[{"t":"The claim","d":"That <i>taqiyya</i> is a broad order to lie to unbelievers. So nothing a Muslim says can be trusted. Not in talk. Not in public life. Not at an interfaith event."},{"t":"Why it is wrong","d":"The old law books treat it as leave, not as an order. It lets a man hide his faith under force. It also covers the case where his life is at risk. See Quran 16:106, and Quran 3:28, <b>\"unless you fear them.\"</b> It grew up mainly in Shia law, under Sunni attack. The base rule in Islam is that lying is a grave sin."},{"t":"What is really there","d":"Something much smaller, and on the record. Deceit is allowed in war — <b>\"war is deceit\"</b> (Sahih al-Bukhari 3030). And Muhammad allowed false words in the killing of Ka'b ibn al-Ashraf. That is the version this site's taqiyya case sets out."},{"t":"Why it backfires","d":"The big claim cannot be tested. If every denial is itself taqiyya, then nothing can ever count against you. People hear that move and stop trusting the rest of what you say. It also gets the rule wrong, and your friend can show you that in seconds."},{"t":"What to say instead","d":"The small version, which holds up. Islam lets a man hide his faith under threat. It allows deceit in war. And Muhammad did allow false words in one killing. Say that. Do not tell the man in front of you that he is lying. That is unfair, and it ends the talk."},{"say":true,"t":"What to say","d":"\"I am not going to accuse you of taqiyya. That would be unfair and it would end this.\""}],"rewritten":true,"refwhy":{"Quran 16:106":"Excuses one forced to deny the faith. That is leave under threat, not an order to lie.","Quran 3:28":"Allows care 'unless you fear them'. The fear clause is what the whole rule rests on.","Sahih al-Bukhari 3030":"'War is deceit', in Bukhari. The narrow, real thing: battle craft, not daily speech."},"titleLong":"Don't use: 'All Muslims are commanded to lie (taqiyya)'"},
{"id":"avoid-72-virgins-in-quran","title":"Don't use: '72 virgins' (the Quran gives no number)","category":"salvation","avoid":true,"claim":"The popular version says that the Quran promises martyrs 72 virgins in paradise.","quran":["Quran 56:22-24","Quran 44:54"],"hadith":["Jami at-Tirmidhi 1663"],"bible":[],"sources":[{"name":"Jami at-Tirmidhi 1663 — the six rewards of the martyr, including seventy-two wives","type":"primary","url":"https://sunnah.com/tirmidhi:1663"},{"name":"Abu Amina Elias — 'Seventy two virgins in Paradise?'","type":"muslim","url":"https://www.abuaminaelias.com/seventy-two-virgins-in-paradise/"},{"name":"WikiIslam — Authenticity of 72 Virgins Hadith","type":"institutional","url":"https://wikiislam.github.io/wiki/Authenticity_of_72_Virgins_Hadith.html"},{"name":"SeekersGuidance — '72 Virgins for Martyrs' (Muslim treatment)","type":"muslim","url":"https://seekersguidance.org/answers/general-counsel/72-virgins-for-martyrs-making-sense-of-one-of-the-rewards-of-paradise/"}],"response":"The correction is that the number 72 appears nowhere in the Quran. The Quran promises houris — created, wide-eyed, virginal companions (56:22-24; 44:54; 55:56; 78:33) — without a count. The 72 figure is hadith. Jami at-Tirmidhi 1663 lists among the martyr's six rewards marriage to 'seventy-two wives from al-hur al-'ayn' — wives, not 'virgins', in the wording. It is graded sahih or hasan in mainstream collections, but it remains a hadith claim and not a Quranic one.","responseSource":{"name":"Jami at-Tirmidhi 1663; Quranic houri passages","url":"https://sunnah.com/tirmidhi:1663"},"verdict":"answered","rationale":"Here is why it backfires. Say 'the Quran promises 72 virgins' and the Muslim truthfully replies 'no it doesn't'. You lose on a citation error, and the real point escapes with it. The substance survives precision. The Quran's paradise is explicitly material and sexual, which is this site's houris-material-paradise case, and the 72-wives detail for martyrs is in a sahih-graded hadith. Cite it as Tirmidhi 1663 and the technicality defence evaporates. Precision converts a losing slogan into an unanswerable citation.","severity":"low","plain":[{"t":"The claim","d":"That the Quran promises martyrs 72 virgins in paradise."},{"t":"Why it is wrong","d":"The number 72 appears nowhere in the Quran. The Quran promises <i>houris</i> — created, wide-eyed, virginal companions (Quran 56:22-24; 44:54; 55:56; 78:33) — with no count attached."},{"t":"Where the number is","d":"In a hadith. Jami at-Tirmidhi 1663 lists the martyr's six rewards, including marriage to <b>\"seventy-two wives from al-hur al-'ayn.\"</b> The word is wives, not virgins. It is graded sahih or hasan in the mainstream collections. But it is a hadith claim, not a Quranic one."},{"t":"Why it backfires","d":"Say the Quran promises 72 virgins and your friend truthfully replies that it does not. You lose on a citation error, and the real point escapes with it."},{"t":"What to say instead","d":"Be exact and the substance survives. The Quran's paradise is openly physical and sexual — that is this site's houris case. And the 72-wives detail for martyrs is in a graded hadith. Cite it as Tirmidhi 1663 and the technicality defence evaporates."},{"say":true,"t":"What to say","d":"\"You are right that it is not in the Quran. It is Tirmidhi 1663. May we look at that?\""}],"rewritten":true,"refwhy":{"Quran 56:22-24":"The houris in the Quran, with no number given. That absence is the whole point here.","Quran 44:54":"A second houri verse, again with no count. Check it before repeating the slogan.","Jami at-Tirmidhi 1663":"Where the number is. Tirmidhi, graded sahih or hasan, and the word is 'wives', not 'virgins'."},"titleLong":"Don't use: 'The Quran promises 72 virgins'"}

function splitSentences(raw){
  const tokens=raw.split(/(?<=[.!?])\s+(?=[A-Z0-9"'(‘“])/);
  const merged=[];
  tokens.forEach(t=>{
    if(merged.length){
      const prev=merged[merged.length-1];
      const m=prev.match(/([A-Za-z&.]+)\.$/);
      const w=m?m[1].replace(/\./g,""):null;
      if(w&&ABBR.includes(w)){merged[merged.length-1]=prev+" "+t;return;}
    }
    merged.push(t);
  });
  return merged;
}

nded to any statement about the future (James 4:15 is the biblical parallel). Can also function as a polite, non-committal 'maybe.'"},{"t":"IslamQA","d":"A large Salafi fatwa website run by Muhammad al-Munajjid — the most-consulted English-language source for ordinary Muslims looking up a ruling. It is quoted here because it states the traditional position plainly rather than diplomatically."},{"t":"isnad","d":"The chain of narrators by which a hadith is transmitted. Muslim scholarship accepts or rejects reports by grading the chain, not the content — which is why some well-attested early events (like the satanic verses) are rejected on chain grounds."},{"t":"the isnad","d":"The chain of narrators attached to a hadith: X heard from Y who heard from Z who heard the Prophet. Islamic scholarship grades a report by evaluating this chain, and the grading — sahih (sound), hasan (good), da'if (weak), mawdu' (fabricated) — is what determines whether a Muslim must accept it."},{"t":"jizya / dhimmi","d":"The tax and subordinate protected status imposed on Jews and Christians under Islamic rule (9:29)."},{"t":"Josephus","d":"Titus Flavius Josephus (c. 37–100 AD), a Jewish general who surrendered to Rome and became its most important historian of first-century Judea. Not a Christian, which is why his mentions of Jesus, James and John the Baptist carry so much weight."},{"t":"jummah","d":"Friday congregational prayer with sermon (khutbah) — the anchor of the week, obligatory for men. Muslim coworkers may need a long Friday lunch window."},{"t":"the Kaaba","d":"The cube-shaped building at the centre of the Grand Mosque in Mecca, toward which Muslims pray. It was a pagan shrine housing many idols before Muhammad cleansed it in 630, and several rites of the pilgrimage predate Islam."},{"t":"kafir","d":"'Unbeliever/one who covers the truth' — the term for non-Muslims. Ranges from neutral-descriptive to deeply pejorative depending on speaker and context."},{"t":"Khadija","d":"Muhammad's first wife, fifteen years his senior, a wealthy merchant who employed him. She was the first Muslim, and she is the one who reassures him after the first revelation terrifies him."},{"t":"the KJV","d":"The King James Version of 1611, the English Bible of the whole period covered by this site. Its wording matters constantly here: several movements examined on this site were born inside its cadence, and some of them treat it as the only legitimate Bible."},{"t":"madhhab","d":"One of the four Sunni schools of law (Hanafi, Maliki, Shafi'i, Hanbali) — why practice differs by region on details from prayer posture to food rules."},{"t":"the Masoretic Text","d":"The standard Hebrew Bible, preserved and vowel-pointed by Jewish scribes called the Masoretes between roughly 600 and 1000 AD. Almost every Old Testament translation is based on it; where it differs from the Septuagint or the Scrolls, that difference is what scholars argue about."},{"t":"the multi-Isaiah theory","d":"The mainstream critical view that the book of Isaiah had more than one author: chapters 1–39 from the eighth-century prophet, 40–55 from an anonymous writer during the Babylonian exile ('Deutero-Isaiah'), and sometimes 56–66 from a third. It is argued from style and from the fact that chapters 40+ address the exile as present. Conservatives dispute it; it matters here because it is the standard reply whenever Isaiah is said to predict something."},{"t":"naskh","d":"Abrogation — Allah replacing earlier verses with later ones (2:106), including 'abrogation of recitation,' the doctrine that explains verses Companions remembered as Quran that are not in today's text."},{"t":"papyrus","d":"Paper made from reed pith, the ordinary writing material of the ancient world. New Testament papyri are labelled with a P and a number — P52, a scrap of John, is the earliest known New Testament manuscript, copied around 125 AD."},{"t":"the People of the Book","d":"Ahl al-Kitab — the Quran's term for Jews and Christians, who hold a distinct legal and theological status in Islam as recipients of earlier revelation."},{"t":"the qira'at","d":"The canonical 'readings' of the Quran — variant recitations differing in vowels, dots and occasionally consonants. Ten are recognized; the Hafs reading dominates the printed Quran today, while Warsh persists in North and West Africa. Two different printed texts are in circulation now."},{"t":"Qumran","d":"The settlement beside the caves where the Dead Sea Scrolls were found, on the northwest shore of the Dead Sea. Usually associated with the Essenes, a strict Jewish sect of the Second Temple period."},{"t":"revert","d":"A convert to Islam — see fitra. Convert stories are celebrated in dawah exactly the way testimonies are in evangelicalism."},{"t":"sahih","d":"'Sound/authentic' — the highest grade of hadith reliability. When a fact sits in Sahih al-Bukhari or Sahih Muslim, mainstream Islam accepts it; that is why this site cites them constantly."},{"t":"Sahih al-Bukhari","d":"The most authoritative hadith collection in Sunni Islam, compiled by Muhammad al-Bukhari (d. 870) from a reported 600,000 traditions, of which he kept about 7,275. 'Sahih' means authentic. To a Sunni Muslim, a fact recorded here is not in dispute — which is why so much of this section is cited from it."},{"t":"Sahih Muslim","d":"The second most authoritative Sunni hadith collection, compiled by Muslim ibn al-Hajjaj (d. 875). Together Bukhari and Muslim are called the two Sahihs, and anything in both is regarded as beyond question."},{"t":"the Sanaa palimpsest","d":"Quran manuscripts found in the Great Mosque of Sanaa, Yemen, in 1972. The lower, erased layer — recovered by imaging — contains a text that differs from the standard Uthmanic text in word order and wording, making it the most significant Quranic manuscript find of the modern era."},{"t":"the Septuagint","d":"The Greek translation of the Hebrew Scriptures made by Jewish scholars in Alexandria beginning about 250 BC — abbreviated LXX. It matters constantly here because it is pre-Christian: when it renders a verse a certain way, no Christian could have influenced it."},{"t":"the shahada","d":"The Islamic creed — 'there is no god but Allah, and Muhammad is his messenger.' Reciting it sincerely makes a person a Muslim, which is why a street conversation is often steered toward it."},{"t":"shirk","d":"Associating partners with Allah — Islam's unforgivable sin (4:48). Worshiping Jesus is shirk if he is a creature; it is simple obedience if he is the eternal Creator (John 20:28)."},{"t":"the Smithsonian Institution","d":"The United States' national museum and research complex. It matters here because for decades a 'Smithsonian statement' was circulated claiming the institution used the Book of Mormon as an archaeological guide. The Smithsonian issued a formal statement denying it, and now sends a standard letter saying its archaeologists see no connection between the New World's archaeology and the book's contents."},{"t":"sunnah","d":"The Prophet's example — his practices, preferences, and habits, known through hadith. Doing something 'because it is sunnah' (beard, miswak, right hand first) earns reward."},{"t":"Sunni and Shia","d":"Islam's two main branches, divided since the seventh century over who should have succeeded Muhammad. Roughly 85–90% of Muslims are Sunni. They have different hadith collections, so an argument built on Bukhari may not land with a Shia Muslim."},{"t":"Tacitus","d":"Roman senator and historian (c. 56–120 AD). His hostile mention of 'Christus,' executed by the procurator Pontius Pilate under Tiberius, is the standard non-Christian confirmation of the crucifixion."},{"t":"tafsir","d":"Classical Quran commentary (al-Tabari, Ibn Kathir, al-Qurtubi). Where modern reinterpretations conflict with the unanimous early tafsir, this site notes it."},{"t":"tahrif","d":"'Corruption' — the Muslim doctrine that Jews and Christians altered their scriptures. The earliest Islam taught corruption of MEANING (misinterpretation); corruption of the TEXT is a doctrine that crystallized only with Ibn Hazm, four centuries after Muhammad."},{"t":"taqiyya","d":"Concealment of faith under persecution — chiefly a Shia doctrine (from 3:28; 16:106). Widely misused in polemics: mainstream Sunni Islam does NOT license routine lying to non-Muslims, and accusing your Muslim friend of taqiyya is both usually false and instantly conversation-ending."},{"t":"tawhid","d":"Islam's absolute oneness of God — the doctrine every sonship and Trinity denial defends. Christians also confess one God; the dispute is whether that one God is a solitary monad or eternally Father, Son, and Spirit."},{"t":"Tawrat","d":"The Quran's word for the Torah of Moses — which the Quran says was 'with' the Jews of Muhammad's day and contained Allah's judgment (5:43)."},{"t":"the Tawrat, Zabur and Injil","d":"The Quran's names for the Torah given to Moses, the Psalms given to David, and the Gospel given to Jesus. The Quran repeatedly affirms all three — which is the basis of the argument that runs through this whole section."},{"t":"textual criticism","d":"The scholarly discipline of comparing manuscripts to work out what the original wording was. It is not an attack on Scripture — it is the method that lets us say with confidence what the text said."},{"t":"Umar","d":"The second caliph (r. 634–644), and the figure who first pressed for the Quran to be collected after reciters died at the battle of Yamama."},{"t":"ummah","d":"The worldwide community of Muslims — a strong transnational identity: an insult to Islam anywhere is felt as an insult to the ummah everywhere."},{"t":"the ummah","d":"The worldwide community of Muslims. Leaving Islam means leaving the ummah, which is why apostasy is experienced as a social and familial rupture rather than a private change of mind."},{"t":"Uthman","d":"The third caliph (r. 644–656). He standardized the Quran into a single official text and ordered all variant copies burned — an act reported approvingly in Bukhari, and central to every question about the Quran's transmission."},{"t":"Uthmanic recension","d":"The standardized Quran text produced under Caliph Uthman (~650 AD), who ordered all other copies burned (Bukhari 4987). What is preserved today is this recension."},{"t":"Waraqa","d":"Waraqa ibn Nawfal, Khadija's cousin — a Christian who, in Bukhari's account, is brought the terrified Muhammad and identifies his experience as the same 'namus' that came to Moses. He is the first person to authenticate the revelation, and he dies shortly afterwards."},{"t":"wudu","d":"Ritual washing (hands, mouth, nose, face, arms, head, feet) required before prayer — broken by sleep or using the bathroom. Why Muslim colleagues wash in workplace restrooms at midday."},{"t":"Zabur","d":"The Psalms of David, affirmed as revelation in the Quran (4:163; 17:55) — which makes Psalm 22's crucifixion portrait shared ground a Muslim can read without betraying the Quran."}];

const esc=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function hl(text,phrases){let out=esc(text);(phrases||[]).forEach(p=>{const e=esc(p).replace(/[.*+?^${}()|[\]\\]/g,"\\$&");out=out.replace(new RegExp(e,"gi"),m=>"<mark>"+m+"</mark>");});return out;}
function glossify(escapedText){
  if(!glossify._re){
    const ts=GLOSSARY.slice().sort((a,b)=>esc(b.t).length-esc(a.t).length);
    const alts=ts.map(g=>esc(g.t).replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|");
    glossify._re=new RegExp("(?<![\\w-])("+alts+")(?![\\w-])","gi");
    glossify._map={};GLOSSARY.forEach(g=>{glossify._map[esc(g.t).toLowerCase()]=g;});
  }
  const used=glossify.seen||(glossify.seen=new Set());
  let inRef=0;
  return escapedText.replace(/(<[^>]*>)|([^<]+)/g,(m,tag,txt)=>{
    if(tag){
      if(/^<span class="ref-(lds|bib)"/.test(tag))inRef++;
      else if(inRef&&tag.indexOf("</span>")===0)inRef--;
      return tag;
    }
    if(inRef)return txt;
    return txt.replace(glossify._re,w=>{
      const g=glossify._map[w.toLowerCase()];
      if(!g||used.has(g.t))return w;
      used.add(g.t);
      return '<span class="g" tabindex="0">'+w+'<span class="gt"><b>'+esc(g.t)+'</b> — '+g.d+'</span></span>';
    });
  });
}


function findWhy(d,cite){
  const key=cite.replace(/–/g,"-").replace(/\s*\(.*\)\s*/g,"").trim();
  const m=key.match(/^([1-4]?\s?[A-Za-z&; ]+?)\s+(\d+)/);
  const frag=m?(m[1].trim()+" "+m[2]):key;
  const sentences=(d.claim+" "+d.rationale).replace(/–/g,"-").split(/(?<=[.!?])\s+/);
  const hit=sentences.find(s=>s.includes(frag));
  return hit?hit.replace(/-/g,"–"):null;
}

function extUrl(cite){
  const c=cite.replace(/–/g,"-").replace(/\s*\(.*\)\s*/g,"").trim();
  const qm=c.match(/^Quran\s+(\d+):(\d+)/i);
  if(qm)return "https://quran.com/"+qm[1]+"/"+qm[2];
  const qc=c.match(/^Quran\s+(\d+)/i);
  if(qc)return "https://quran.com/"+qc[1];

  if(mm)return "https://www.biblegateway.com/passage/?search="+encodeURIComponent(c)+"&version=KJV";
  return "https://quran.com/";
}
function hadithUrl(h){
  const m=h.replace(/\s*\(.*\)\s*/g,"").match(/^(Sahih al-Bukhari|Sahih Muslim|Sunan Abi Dawud|Sunan Ibn Majah|Jami at-Tirmidhi|Sunan an-Nasa'i)\s+(\d+[a-z]?)/i);
  if(!m)return null;

  const col=map[m[1].toLowerCase()];
  return col?"https://sunnah.com/"+col+":"+m[2].toLowerCase():null;
}

      <p class="methodfoot">Ranking is editorial: how startling the item is to someone outside the tradition, most to least. Verdicts still grade only the factual claim.</p>`;
    document.querySelectorAll(".vt").forEach(c=>{
      c.addEventListener("mouseenter",()=>{state.sel=c.dataset.id;renderPreview();});

  }
  $("#main").innerHTML=`
    <h4 class="bt">${state.section==="all"?DATA.length+" claims, sorted by where the argument stands · click any title to open its case":SECTIONS[state.section]+" — by verdict"}${anyF?` · <button id="clearf" style="background:none;border:0;color:var(--gold);cursor:pointer;text-decoration:underline;font-size:.72rem;letter-spacing:0;text-transform:none">${items.length} match filters — clear</button>`:""}</h4>
    <div class="vwall vstack">${col("unrefuted")}${col("admitted")}${col("contested")}${col("answered")}</div>
    <p class="methodfoot">How this page is built: every claim is shown with the strongest published Muslim answer to it first — that is called steelmanning, the opposite of a straw man. Weak criticisms are labelled so. And where a fact is admitted in the hadith collections Muslims themselves rate as sound (sahih), it is marked Admitted. Compiled July 2026 from published sources — verify citations at the links before quoting. Verdicts are editorial judgments about the public argument.</p>`;
  document.querySelectorAll(".vt").forEach(c=>{
    c.addEventListener("mouseenter",()=>{state.sel=c.dataset.id;renderPreview();});
    c.addEventListener("click",()=>openCase(c.dataset.id));
  });

    state.open=state.open||{}; state.open[b.dataset.v]=!state.open[b.dataset.v]; renderOverview();
  }));
  const cf=$("#clearf");if(cf)cf.addEventListener("click",()=>{state.verdict=null;state.severity=null;state.q="";state.section="all";render();});
}

function openCase(id,fromPath){
  state.caseId=id;state.sel=id;state.view="case";
  if(location.hash!=="#case/"+id)try{history.pushState(null,"","#case/"+id)}catch(e){}
  if(!fromPath)state.pathId=state.pathId; // keep path context if navigating within
  store.markRead(id);
  render();
  window.scrollTo({top:0});
}

ran-late-composition":[{"src":"https://commons.wikimedia.org/wiki/Special:FilePath/Qur'anic%20Manuscript%20-%203%20-%20Hijazi%20script.jpg?width=520","cap":"An early Hijazi Qur'an manuscript — physical evidence dating the written text to the first Islamic century","where":"claim"},{"src":"https://commons.wikimedia.org/wiki/Special:FilePath/Jerusalem-2013-Temple%20Mount-Dome%20of%20the%20Rock-Detail%2001.jpg?width=520","cap":"The Dome of the Rock, finished 691, whose mosaic band quotes the Qur'an in dated stone","where":"defense"}],"banu-qurayza-massacre":[{"src":"https://commons.wikimedia.org/wiki/Special:FilePath/Al%20Masjid%20an%20Nabawi%202.jpg?width=520","cap":"The Prophet's Mosque at Medina; the market where the execution trenches were dug lay in this city","where":"claim"},{"src":"https://commons.wikimedia.org/wiki/Special:FilePath/Ilkhanid%20Quran.jpg?width=520","cap":"An Ilkhanid Qur'an with a Persian translation between the lines; Surah al-Ahzab alludes to this episode","where":"defense"},{"src":"https://commons.wikimedia.org/wiki/Special:FilePath/Banu%20Qurayza.png?width=520","cap":"The execution of the Banu Qurayza, a detail from a nineteenth-century Persian miniature painting","where":"claim"},{"src":"https://commons.wikimedia.org/wiki/Special:FilePath/Depiction%20of%20the%20Prophet's%20Mosque%20in%20Medina%20(CBL%20Ar%204223%2C%20f.%204a).jpg?width=520","cap":"A 1638 depiction of Medina's Prophet's Mosque, a representative image, not the market where executions happened","where":"defense"}],"dhul-qarnayn-alexander":[{"src":"https://commons.wikimedia.org/wiki/Special:FilePath/Berlin%2C%20gr.2%22%20Zu%205956%20Samarkand%20Samarkand%20Kufic%20Quran%20facsimile%20fol%20259r%20Sura%2018%20Aya%2094.jpg?width=520","cap":"A Kufic Qur'an facsimile at Surah 18:94, the verse where Gog and Magog are named","where":"claim"},{"src":"https://commons.wikimedia.org/wiki/Special:FilePath/Solidus%20of%20byzantine%20emperor%20Heraclius.jpg?width=520","cap":"A gold solidus function figs(d,where){
  const a=(IMGS[d.id]||[]).filter(x=>x.where===where);
  if(!a.length)return "";
  return `<div class="figrow${a.length>1?" multi":""}">`+a.map(x=>
    `<figure class="cfig"><img src="${x.src}" alt="${esc(x.cap)}" loading="lazy">
      <button class="cimg-x" title="Expand" data-full="${x.src.replace("width=520","width=1400")}" data-cap="${esc(x.cap)}">⤢</button>
      <figcaption>${esc(x.cap)}</figcaption></figure>`).join("")+"</div>";
}
function plainHtml(d){
  const rt=t=>glossify(emphasize(esc(t).replace(/&lt;(\/?)(b|i)&gt;/g,"<$1$2>")));
  const KINDRE=t=>(/answer,? at full strength|^their answer|^the .{2,22} answer\b|^how (they|.*s) (answer|explain)|best (defense|answer)|at its strongest|^the (rabbinic|muslim|witness|sceptic|skeptic) (reply|answer)/.test(t)?"k-def"
      :/^how strong|^the rule\b|^where it lands|^the verdict|don't use|do not use/.test(t)?"k-strength"
      :/^why this|^why it|helps you|^what it cost|^what to do instead|^what to say instead|^the takeaway|^why that matters/.test(t)?"k-help"
      :/runs out|problem|^why that is|^where it breaks|^what that misses|^the gap|^why it is wrong|^the trouble|^what it does not/.test(t)?"k-gap"
      :/verse|text|chapter|\bsays\b|passage|record|scripture|evidence|the numbers|what survives|the hadith|manuscript|papyri|inscription/.test(t)?"k-text"
      :/^the claim|^what is taught|^what (they|the book|the movement|the church|the camps) |^what happened|^how it (usually|ended|came out)|objection|^what (you|your|people)|describes|^the story|^what is at stake/.test(t)?"k-claim"
      :"k-plain");
  const KINDOF=b=>{
    if(b.say)return "k-say";
    const t=b.t.toLowerCase();
    return KINDRE(t);
  };
  /* One fixed sequence for every case, so the colours mean the same thing on
     every page and a reader learns the shape once. "What to say" is last in all
     318 cases and always anchors the run in green. */
  const SEQ=["amber","gold","red","purp","teal","slate"];
  const blocks=(d.plain||[]);
  const kinds=blocks.map(KINDOF);
  let si=0;
  const hues=blocks.map(b=>b.say?"green":SEQ[si++%SEQ.length]);
  return blocks.map((b,bi)=>{
    const ss=splitSentences(b.d),ps=[];
    for(let i=0;i<ss.length;i+=2)ps.push("<p>"+rt(ss.slice(i,i+2).join(" "))+"</p>");
    const kind=kinds[bi], hue="h-"+hues[bi];
    const big=/(k-text|k-say)/.test(kind)?" k-big":"";
    return `<div class="pblk ${kind} ${hue}${b.say?" say":""}${big}"><div class="plab ${hue}">${esc(b.t)}</div>${ps.join("")}</div>`;
  }).join("");
}

    const cb=box.querySelector("[data-close]");if(cb)cb.addEventListener("click",clearVerse);
    /* the cited verse can sit below three verses of context — bring it into view */
    const inner=box.querySelector(".versebox"),hl=box.querySelector(".vs.hl");
    if(inner&&hl){
      const want=hl.offsetTop-inner.offsetTop-Math.max(0,(inner.clientHeight-hl.offsetHeight)/2);
      inner.scrollTop=Math.max(0,want);
    }
  };
  window.addEventListener("scroll",()=>{scrolling=true;clearTimeout(scrollT);clearTimeout(hoverTimer);
    scrollT=setTimeout(()=>{scrolling=false;},220);},{passive:true});
  /* LIVEREFS: references printed inside prose become openable, like the chips */
  document.querySelectorAll("#main .ref-bib, #main .ref-lds").forEach(r=>{
    const key=r.textContent.replace(/\s+/g," ").trim().replace(/[.,;:]$/,"");
    const hit=VERSES[key]?key:Object.keys(VERSES).find(k=>k.replace(/[\u2013\u2014]/g,"-")===key.replace(/[\u2013\u2014]/g,"-"));
    if(!hit)return;
    r.classList.add("live","chip");r.dataset.cite=hit;
  });
  const canHover=window.matchMedia("(hover:hover)").matches;
  document.querySelectorAll(".chip").forEach(ch=>{
    ch.addEventListener("click",()=>{
      if(ch.dataset.ext){window.open(ch.dataset.ext,"_blank");return;}
      if(pinnedCite===ch.dataset.cite){clearVerse();return;}
      openVerse(ch,true);
    });
    if(!ch.dataset.ext&&canHover){
      ch.addEventListener("mouseenter",()=>{clearTimeout(hoverTimer);
        if(pinnedCite||scrolling)return;
        hoverTimer=setTimeout(()=>{if(!scrolling&&!pinnedCite)openVerse(ch,false);},240);});
      ch.addEventListener("mouseleave",()=>{clearTimeout(hoverTimer);
        if(pinnedCite)return;
        hoverTimer=setTimeout(()=>{if(!pinnedCite)clearVerse();},160);});
    }
  });
  
});
  document.querySelectorAll(".cimg-x").forEach(b=>b.addEventListener("click",e=>{e.stopPropagation();showLightbox(b.dataset.full,b.dataset.cap);}));
  renderNav();renderPreview();
}

/* ---------- paths ---------- */
function renderPaths(){
  const read=store.read;
  $("#main").innerHTML=`<div class="viewhead"><h2>Guided paths</h2><p>Reading orders we put together for you — pick the one that fits what you need, and read the cases in order. Your place is saved on this device, and each case has a "Next in path" button to carry you along.</p></div><div class="pgrid">`+PATHS.map(p=>{
      const done=p.items.filter(i=>read.has(i)).length;
      return `<div class="pathcard">${PATHIMG[p.id]?`<img class="pathimg" src="${PATHIMG[p.id]}" loading="lazy">`:""}<h3>${esc(p.name)}</h3><p class="pd">${esc(p.desc)} · ${p.time} · ${done}/${p.items.length} read</p>
      <ol>${p.items.map(i=>`<li class="${read.has(i)?"done":""}">${esc(byId[i].title)}</li>`).join("")}</ol>
      <button class="start" data-path="${p.id}">${done===0?"Start path":done>=p.items.length?"Revisit path":"Continue path"} →</button></div>`;
    }).join("")+"</div>";
  document.querySelectorAll("[data-path]").forEach(b=>b.addEventListener("click",()=>{
    const p=PATHS.find(x=>x.id===b.dataset.path);state.pathId=p.id;
    const read=store.read;const next=p.items.find(i=>!read.has(i))||p.items[0];
    openCase(next,true);
  }));
}

function renderTimeline(){
  const read=store.read;
  $("#main").innerHTML=`<div class="viewhead"><h2>The record, in four acts</h2>
  <p>What was claimed on the left; what the manuscripts and canon show on the right. Red years mark the turning points. Click an act to open it — your reading progress fills each meter.</p></div>
  <div class="chs">${TLACTS.map((a,i)=>{
    const linked=a.events.filter(e=>e.id);
    const done=linked.filter(e=>read.has(e.id)).length;
    return `<button class="ch ${state.act===i?"on":""}" data-act="${i}"><span class="n">${a.num}</span><span class="range">${a.range}</span><h4>${a.name}</h4><p>${a.desc} · ${a.events.length} events</p><div class="meter"><i style="width:${linked.length?Math.round(done/linked.length*100):0}%"></i></div></button>`;
  }).join("")}</div>
  ${state.act!=null&&TLACTS[state.act]?actHtml(TLACTS[state.act]):`<p class="tlhint">Pick a period above to see what happened in it.</p>`}`;
  function actHtml(a){
    return `<div class="chopen"><h4>Act ${a.num} · ${a.name} (${a.range})</h4>
    <div class="cvr"><div class="hh claims">What was claimed</div><div></div><div class="hh record">What the record shows</div>
    ${a.events.map(e=>{
      const bubble=`<div class="bubble ${e.side==="claim"?"claim":"rec"}${e.crit?" crit":""}${e.id&&store.read.has(e.id)?" done":""}">${e.id&&IMGMAP[e.id]?`<img class="ebthumb" src="${IMGMAP[e.id].src}" loading="lazy">`:""}${e.crit?`<span class="tpx">★ turning point</span>`:""}${e.id&&store.read.has(e.id)?`<span class="donechip">✓ read</span>`:""}<h4>${esc(e.t)}</h4>${e.why?`<p class="tpwhy">${esc(e.why)}</p>`:""}<p class="${e.why?"tpsub":""}">${esc(e.p)} ${e.id&&byId[e.id]?`<button class="jump" data-open="${e.id}">→ open the case</button>`:""}</p></div>`;
      return `<div class="cell">${e.side==="claim"?bubble:""}</div><div class="mid"><div class="yr2 ${e.crit?"critY":""}">${e.y}</div></div><div class="cell">${e.side==="record"?bubble:""}</div>`;
    }).join("")}</div></div>`;
  }
  document.querySelectorAll(".ch").forEach(b=>b.addEventListener("click",()=>{const i=+b.dataset.act;state.act=state.act===i?null:i;renderTimeline();}));
  document.querySelectorAll(".jump").forEach(b=>b.addEventListener("click",()=>openCase(b.dataset.open)));
}

/* ---------- sharing the gospel ---------- */
function renderShare(){
  $("#main").innerHTML=`<div class="viewhead"><h2>Sharing Jesus with a Muslim friend</h2>
  <p>Not to win an argument. To help a real person meet the real Jesus, with gentleness (2 Timothy 2:24–25). Built from the largest study of Muslim conversions ever done, and from ministries with decades in this work.</p></div><div class="pb-h">The invitation to work toward</div>
<div class="saybox"><span class="who">You, once trust is real</span><p>"Would you read one Gospel with me? Luke. The Quran itself says to judge by the Injil."</p></div>
<p class="pd">Quran 5:47 commands it. Quran 10:94 sends doubters to the people who read the Scripture. You are asking your friend to do what their own book says.</p>

<div class="pb-h">What brought ex-Muslims to Christ: the Woodberry findings, ranked</div>
<div class="pb-grid">
<div class="pb"><span class="num">1</span><h4>The lifestyle and love of the Christians they knew</h4><p>The top-ranked factor, ahead of every argument. Love inside Christian marriages. Love for enemies. Plain honesty. A Christian who stayed. Nabeel Qureshi and David Wood argued for four years and stayed friends the whole way through: a friend both openly convinced and always there. Most Muslims never have one close Christian friend. Be the first.</p></div>
<div class="pb"><span class="num">2</span><h4>Reading the Bible, especially the Sermon on the Mount</h4><p>They are taught it is corrupt, so reading it is the shock. Mosab Hassan Yousef, son of a Hamas founder, put it this way: "When I read love your enemies and pray for those who persecute you, I was thunderstruck. This was the message I had been searching for all my life."</p></div>
<div class="pb"><span class="num">3</span><h4>The character of Jesus, next to their own sources</h4><p>Mark Gabriel had the whole Quran memorized and taught at Al-Azhar. His doubts began inside the texts, not outside them. What moved him was studying Jesus and Muhammad side by side.</p></div>
<div class="pb"><span class="num">4</span><h4>Dreams of Jesus, handled factually</h4><p>Surveys keep finding that 25 to 33 percent of Muslim-background believers report a dream of Jesus before they converted. The pattern is steady. The dream opens the door, and a Bible or a Christian walks through it. Ask gently: "Have you ever had a dream about Jesus?" Many have, and have told nobody.</p></div>
<div class="pb"><span class="num">5</span><h4>Assurance, against the scales</h4><p>Converts worn out by earning name this as the thing that decided it. A person can know they are forgiven (1 John 5:13). The scales never offer that.</p></div>
</div>

<div class="pb-h">The method</div>
<div class="pb-grid">
<div class="pb dont"><h4>Never mock Muhammad or the Quran</h4><p>Honor and shame are the frame here, not guilt. An insult to the Prophet attacks their family, their identity and their community. It triggers the honor-defense reflex and ends the conversation for good. In some settings it can put them in danger. Honest questions about Muhammad are fair. Contempt never is.</p></div>
<div class="pb do"><h4>Hospitality is the master key</h4><p>Eating together is the trust currency of Muslim culture. Accept invitations to iftar. Host them back, with no pork and no alcohol. Return the welcome at Christmas and Easter. Most real work with Muslims happens over meals in homes, not in debates.</p></div>
<div class="pb dont"><h4>Use the Quran as a door, never as an authority</h4><p>"Your own book says striking things about Isa. Have you seen them?" is a fair opener. Then get to the Bible quickly and stay there.</p></div>
<div class="pb do"><h4>Learn their vocabulary</h4><p>Isa al-Masih, Injil, Tawrat, Zabur. Using the words signals respect. But define sin, salvation and Son of God before you argue about them.</p></div>
<div class="pb do"><h4>Tell the gospel in honor and shame</h4><p>The sin of Adam brought shame, hiding and exile. Jesus bore our shame in public, <i>despising the shame</i> (Hebrews 12:2), so God could cover us, clean us and seat us as his children with honor. Luke 15:22 has the robe, the ring and the feast. This frame lands where courtroom language does not.</p></div>
<div class="pb do"><h4>Debate and friendship are different tools</h4><p>Debate videos reach doubters watching alone at two in the morning. They are not a script for the face of your neighbor. What breaks certainty rarely makes disciples on its own. Relationships do.</p></div>
<div class="pb dont"><h4>Never use the weak arguments</h4><p>This site marks the popular claims that are false or overclaimed. Repeating one hands the other side an easy win and discredits every true argument you made.</p></div>
<div class="pb do"><h4>Expect years, and pray</h4><p>Qureshi took four years. Abdu Murray took nine, from being persuaded to saying so out loud, because the cost is so high. This is farming, not harvesting.</p></div>
</div>

<div class="pb-h">How it actually goes</div>
<p class="sh-open">Of about 750 former Muslims surveyed, the top reason they followed Jesus was the lifestyle and love of the Christians they knew. Not arguments.</p>
<p class="sh-att">— Woodberry, Shubin and Marks, <i>Why Muslims Follow Jesus</i> (Fuller Seminary study, Christianity Today, 2007).</p>

<div class="sa"><h4 class="sat">The seven objections you will hear</h4>
<ol class="sh-list">
<li><b>The Bible is corrupted.</b> The flagship, and everything rests on it. The answer has two halves. The Quran endorses the Bible of the day of Muhammad (10:94; 5:47; 5:68; 6:115). The manuscripts prove that Bible is ours: the Dead Sea Scrolls, and Sinaiticus. Ask: "Corrupted before Muhammad? Then why does the Quran endorse it? Corrupted after? Then why do the pre-Islamic manuscripts match ours?"</li>
<li><b>Jesus never said he was God.</b> Show what he did claim. He forgave sins in his own person (Mark 2:5–7). At his trial he made the Daniel 7 claim that got him condemned for blasphemy (Mark 14:61–64). He accepted the worship of Thomas (John 20:28). He said <i>before Abraham was, I AM</i> (John 8:58). Ask why he was executed for blasphemy.</li>
<li><b>The Trinity is three gods.</b> Clear the ground first. What the Quran attacks is Allah, Jesus and Mary (5:116). That is tritheism, and Christians condemn it too. One God (Deuteronomy 6:4), three persons: one what, three whos. The Quran itself calls Jesus the Word of God and a Spirit from him (4:171). Were the Word and the Spirit of God ever separate from God?</li>
<li><b>Paul invented Christianity.</b> The resurrection creed Paul received (1 Corinthians 15:3–8) dates to within a few years of the cross. Peter, James and John endorsed his gospel (Galatians 2:9). If Paul hijacked it, why did the eyewitnesses die for the same message?</li>
<li><b>Muhammad is the Paraclete of John 14.</b> Read the passage together. The Comforter is the Spirit of truth, whom the world cannot see, who would be in the disciples then living (14:17), sent in the name of Jesus (14:26). Muhammad was a visible man born five hundred years later.</li>
<li><b>The Bible names Muhammad in Song of Songs 5:16.</b> The Hebrew word machmad means lovely, or desirable. It appears about thirteen times in the Old Testament, including of things plundered and destroyed. In context a bride is praising the kisses of her husband. A sound-alike is not a name.</li>
<li><b>The Gospel of Barnabas is the true gospel.</b> It is a demonstrated forgery from the fourteenth to the sixteenth century: a medieval Jubilee reference, wine casks, quotations from Dante. It also contradicts the Quran, because it denies that Jesus is the Messiah. Most Muslim scholars concede that it is not authentic.</li>
</ol></div>

<div class="sa"><h4 class="sat">Count the cost, and never out a seeker</h4>
<p class="pd">Leaving Islam is a crime in about seventeen countries and carries the death penalty in roughly a dozen. In the West the cost is disownment, expulsion, broken engagements, and in extreme cases violence. A convert may lose their family entirely. So never out a Muslim seeker. Not to their family, not on social media, not in a group prayer text. Let them control who knows. Do not run tests with pork or alcohol, because eating bacon proves nothing about faith in Christ (Romans 14). Respect gender lines: men witness to men, women to women. Time baptism wisely. It is the public act that triggers the consequences. And when someone does come to Christ, the church has to become their family in practice, with meals, holidays and help finding a home. Otherwise they drift back, not from doubt but from loneliness. Say it early and often: "I know what this could cost you. I am not going anywhere either way."</p></div>

<div class="sa"><h4 class="sat">Seven bridges, in words they already use</h4>
<ol class="sh-list">
<li><b>The resume of Isa, to the Word made flesh.</b> Word of Allah, Spirit from him, Messiah, born of a virgin, sinless, alive, returning (3:45–49; 4:171). Ask whose resume that is, and why not read everything this one said. Then John 1:1–14.</li>

function proofCombine(v,refs){
  const m=String(v).match(/^(.+?)\s+(\d+):(\d+)(?:\s*[-\u2013]\s*(\d+))?$/); if(!m)return null;
  const book=m[1].trim(), ch=m[2]; let lo=+m[3], hi=+(m[4]||m[3]), found=false;
  String(refs||"").replace(/<[^>]+>/g," ").split(/[\u00b7;,]/).forEach(part=>{
    const r=part.trim().match(/^(.+?)\s+(\d+):(\d+)(?:\s*[-\u2013]\s*(\d+))?$/); if(!r)return;
    if(r[1].trim().toLowerCase()!==book.toLowerCase()||r[2]!==ch)return;
    lo=Math.min(lo,+r[3]); hi=Math.max(hi,+(r[4]||r[3])); found=true;});
  return found?book+" "+ch+":"+lo+"-"+hi:null;
}
function proofVerse(ref,refs){
  const cb=refs?proofCombine(ref,refs):null;
  const v=(cb&&VERSES[cb])?VERSES[cb]:VERSES[ref]; if(!v||!v.verses)return "";
  const anyHl=v.verses.some(x=>x.hl), hasCtx=anyHl&&v.verses.some(x=>!x.hl);
  const body=v.verses.map(x=>{
    const lit=(x.hl||!anyHl);
    const txt=(x.hl&&hasCtx)?"<em>"+esc(x.t)+"</em>":esc(x.t);
    return '<span class="vs'+(lit?" hl":"")+'"><span class="vnum">'+x.v+'</span>'+txt+' </span>';
  }).join("");
  const head=hasCtx?esc(v.ref)+", with the verses either side":esc(v.ref);
  return '<div class="versebox proofbox"><div class="vr"><span>'+head+'</span></div><div class="vtext">'+body+'</div></div>';
}
