{"id":"allah-moon-god","category":"doctrine-of-god","severity":"low","verdict":"answered","title":"Drop the moon-god claim: 'Allah' means God","claim":"A popular claim in Christian counter-apologetics, popularised by Robert Morey's 'The Moon-God Allah' in 1994, holds that Allah was originally a pagan Arabian moon deity. It is often linked to the crescent symbol and to the South Arabian god Sin, or to Hubal. The conclusion drawn is that Muslims worship a repackaged idol. The argument circulates widely in tracts and online despite its evidentiary problems.","quran":["Quran 29:61-63","Quran 41:37"],"hadith":[],"bible":["Acts 17:23-28"],"sources":[{"name":"Rick Brown, 'Who Is \"Allah\"?' (International Journal of Frontier Missions, 2006)","type":"scholarly","url":"https://www.ijfm.org/PDFs_IJFM/23_2_PDFs/Brown_Allah.pdf"},{"name":"Islamic Awareness — reply to the 'Moon-God Allah' claim","type":"muslim","url":"https://www.islamic-awareness.org/quran/sources/allah/moongod"},{"name":"Answering Islam — assessments cautioning against the Morey thesis","type":"apologetics","url":"https://www.answering-islam.org/"}],"response":"The rebuttal here is not a Muslim response but the evidence itself, acknowledged across the scholarly spectrum, including by Christian missiologists. 'Allah' is the ordinary Arabic word for God — the cognate of Hebrew Elohim and Aramaic Alaha. It was used by Arabic-speaking Jews and Christians before Islam, and it appears in every Arabic Bible to this day; Genesis 1:1 in Arabic begins 'In the beginning Allah created'. The Quran explicitly condemns worship of the moon: 'Do not prostrate to the sun or the moon' (41:37). The crescent symbol entered Islamic use centuries later, through the Ottomans. And Morey's archaeological linkages, including Hubal and the Sin temple at Hazor, are rejected by the relevant specialists.","responseSource":{"name":"Rick Brown (IJFM); mainstream Semitics scholarship","url":"https://www.ijfm.org/PDFs_IJFM/23_2_PDFs/Brown_Allah.pdf"},"rationale":"Fairly weighed, this criticism fails. The linguistic evidence defeats the thesis — Allah is the standard Semitic word for God, used by pre-Islamic Christians and in Arabic Bibles today — as does the Quran's own prohibition of moon-worship. Rick Brown published the refutation in the International Journal of Frontier Missions in 2006, so Christian scholars of missions have themselves done this work. The real dispute with Islam is about God's character and triunity, not about the Arabic word for him. Christians who use the moon-god argument hand every informed Muslim an easy win and discredit their stronger arguments. It is marked answered so that you never make this mistake.","plain":[{"t":"The claim, and where it comes from","d":"Some Christian material says Allah was originally a pagan Arabian moon god. It was popularised by Robert Morey's book <i>The Moon-God Allah</i> in 1994. It is usually linked to the crescent symbol and to the South Arabian god Sin, or to Hubal. The conclusion drawn is that Muslims worship a repackaged idol."},{"t":"Why it is wrong","d":"<i>Allah</i> is simply the Arabic word for God. It is the cousin of Hebrew <i>Elohim</i> and Aramaic <i>Alaha</i>. Arabic-speaking Jews and Christians used it before Islam existed. Every Arabic Bible uses it today. Genesis 1:1 in Arabic begins: in the beginning Allah created."},{"t":"What the Quran itself says","d":"Quran 41:37 says <b>\"Do not prostrate to the sun or the moon.\"</b> The crescent came into Islamic use centuries later, through the Ottomans. Morey's archaeological links, including Hubal and the Sin temple at Hazor, are rejected by the specialists in that field."},{"t":"Who says so","d":"Not only Muslims. Rick Brown published the refutation in the International Journal of Frontier Missions in 2006. Christian scholars of mission have done this work themselves. This is our own house correcting itself."},{"t":"Do not use this one","d":"If you use it, any informed Muslim wins in one sentence, and your stronger arguments die with it. The real dispute is about God's character and his triunity, not about the Arabic word for him. Drop the argument, keep the question."},{"say":true,"t":"What to say","d":"\"I have heard Christians say Allah is a moon god. That is not true, and I will not say it.\""}],"rewritten":true,"refwhy":{"Acts 17:23-28":"Paul starts from a pagan altar to an unknown God. The model this case asks you to follow.","Quran 29:61-63":"Says that if you ask who made the sun and moon serve you, they answer: Allah. He is not one of them.","Quran 41:37":"'Do not prostrate to the sun or the moon.' The Quran forbids the very thing the claim alleges."},"titleLong":"'Allah is a moon god' — a Christian polemic that fails"},
{"id":"quran-late-composition","category":"quran-text","severity":"low","verdict":"answered","title":"Drop the late-Quran theory: Birmingham dates 568-645","claim":"In the 1970s some scholars argued that the Quran took shape long after Muhammad. John Wansbrough made the case. Patricia Crone and Michael Cook made a like case in 'Hagarism'. On that view the text was pieced together from shared lore across the Near East, one or two centuries later. It is still repeated in some sceptical and Christian writing as if it were settled.","quran":["Quran 15:9"],"hadith":[],"bible":[],"sources":[{"name":"University of Birmingham — Birmingham Quran manuscript radiocarbon dating (2015): 95.4% probability the parchment dates to 568–645 AD","type":"institutional","url":"https://www.birmingham.ac.uk/facilities/cadbury/birmingham-quran-mingana-collection/birmingham-quran/faqs"},{"name":"Behnam Sadeghi & Mohsen Goudarzi, 'Ṣan'ā' 1 and the Origins of the Qur'ān' (Der Islam, 2012)","type":"scholarly","url":"https://en.wikipedia.org/wiki/Sanaa_manuscript"},{"name":"Nicolai Sinai, 'When did the consonantal skeleton of the Quran reach closure?' (BSOAS, 2014)","type":"scholarly","url":"https://www.cambridge.org/core/journals/bulletin-of-the-school-of-oriental-and-african-studies/article/abs/when-did-the-consonantal-skeleton-of-the-quran-reach-closure-part-i/09404F16DF01B41BC4F6CA00A9C10A48"}],"response":"The evidence answered the theory. Carbon dating puts the Birmingham Quran leaf at 568 to 645 AD, with 95.4% confidence. That test dates the animal skin, not the ink. The range falls in or just after the life of Muhammad. The lower text of the Sanaa leaves is 7th century too. Behnam Sadeghi and Mohsen Goudarzi wrote on Sanaa in 2012. Nicolai Sinai asked in 2014 when the bare consonant text was closed. Scholars now hold that it was largely fixed by the middle of the 7th century. That includes Sinai, Sadeghi, and even those friendly to the revisionists. The late-date thesis is dead in the field.","responseSource":{"name":"Birmingham radiocarbon results; Sadeghi & Goudarzi; Sinai (BSOAS)","url":"https://www.birmingham.ac.uk/facilities/cadbury/birmingham-quran-mingana-collection/birmingham-quran/faqs"},"rationale":"Weighed fairly, this claim fails. The old copies date the text to the 7th century, and serious scholars across the field accept an early consonant text. Note what that does not give away. Early is not the same as kept whole. The Uthman case and the lost-verses case still stand, and both sit in Bukhari. Early is not the same as true, either. But a Christian who says the Quran was made up centuries later is fighting the evidence. He is also cutting his own rope, since the same tests support how the Bible came down to us. It is marked answered to keep the strong arguments clean.","plain":[{"t":"The claim","d":"Some said the Quran took shape long after Muhammad. John Wansbrough put it forward in the 1970s. Patricia Crone and Michael Cook made a like case in <i>Hagarism</i>. Some Christian books still repeat it as if it were fact."},{"t":"What the old copies show","d":"The Birmingham Quran leaf was carbon dated in 2015. The date came out at 568 to 645 AD. That is a 95.4% chance. It falls in or just after the life of Muhammad. The Sanaa lower text is 7th century too."},{"t":"Where scholars stand now","d":"Behnam Sadeghi and Mohsen Goudarzi wrote on Sanaa in 2012. Nicolai Sinai asked in 2014 when the bare text was closed. He judged it fixed by the middle of the 7th century. The late-date thesis is now dead in the field."},{"t":"What this does not give away","d":"Early is not the same as kept whole. The Uthman case and the lost-verses case still stand. Both come from Bukhari. Early is not the same as true, either."},{"t":"Do not use this one","d":"Say the Quran was made up long after, and you are fighting the facts. You are also cutting your own rope. The same tests that date these leaves are the ones that back our Bible. Drop it, and keep the strong cases clean."},{"say":true,"t":"What to say","d":"\"The manuscripts date your text to the seventh century. I am not going to pretend otherwise.\""}],"rewritten":true,"refwhy":{"Quran 15:9":"The Quran's own preservation claim. It marks what this case grants: an early text, not a guarded one."},"titleLong":"'The Quran was written centuries after Muhammad' — refuted by the manuscripts"},
{"id":"spread-only-by-sword","category":"practice","severity":"low","verdict":"answered","title":"Why 'spread by the sword' is wrong: Indonesia","claim":"A common line holds that Islam grew by force alone. On that account, people were made to convert wherever Muslim armies won. The claim is then set against the early church, which grew while under attack.","quran":["Quran 2:256","Quran 9:29"],"hadith":[],"bible":["Matthew 26:52"],"sources":[{"name":"Ira Lapidus, A History of Islamic Societies (Cambridge UP) — conversion followed conquest by centuries","type":"scholarly","url":"https://www.cambridge.org/core/books/history-of-islamic-societies/6B94F3E4F72D4C2E0E1F30E9414A34E2"},{"name":"Richard Bulliet, Conversion to Islam in the Medieval Period (Harvard UP)","type":"scholarly","url":"https://www.hup.harvard.edu/books/9780674331594"},{"name":"Spread of Islam (survey: trade and Sufi networks in Indonesia, West Africa)","type":"scholarly","url":"https://en.wikipedia.org/wiki/Spread_of_Islam"}],"response":"The record answers the caricature. The armies did conquer fast. But conversion was slow, and mostly by choice. Richard Bulliet studied conversion curves. He found that Egypt, Syria and Persia stayed mostly non-Muslim for two to three centuries under Muslim rule. Ira Lapidus records the same pattern. The reason lies in the tax. The jizya and dhimmi system assumed large non-Muslim populations, and you cannot tax converts you have forced. Indonesia is the largest Muslim country on earth, and no Arab army ever took it. Islam arrived there through traders and Sufi networks, as it did in much of West Africa. Forced conversions did happen, but they were rare, and jurists often condemned them citing 2:256, 'no compulsion in religion'.","responseSource":{"name":"Bulliet's conversion curves; Lapidus; the jizya system's own logic","url":"https://www.hup.harvard.edu/books/9780674331594"},"rationale":"Weighed fairly, the 'only by the sword' claim fails. Conquest and conversion were two different things, and the tax system proves it. What survives is the narrower point made elsewhere on this site. Islamic law does contain coercive rules, including death for apostasy and jizya paid 'while they are humbled'. The New Testament has no parallel to those. And the order Islam built favoured conversion in one direction only. Argue that documented gap, not the caricature. It is marked answered so the credible version of the argument stays credible.","plain":[{"t":"The claim","d":"A common line says Islam grew by force alone. People were made to convert wherever the armies won. It is then set against the early church, which grew while under attack."},{"t":"What actually happened","d":"The armies did conquer quickly. Conversion was slow and mostly voluntary. Richard Bulliet's conversion curves show Egypt, Syria and Persia stayed majority non-Muslim for two to three centuries under Muslim rule. Ira Lapidus documents the same pattern."},{"t":"The tax proves it","d":"The jizya and dhimmi system assumed large non-Muslim populations. You cannot tax converts you have forced to convert. So the system's own logic worked against forced conversion."},{"t":"Where Islam grew without armies","d":"Indonesia is the largest Muslim country on earth. No Arab army ever conquered it. Islam arrived through traders and Sufi networks. Much of West Africa is the same story. Forced conversions did happen, but they were exceptional, and jurists often condemned them citing Quran 2:256."},{"t":"Do not use this one","d":"The caricature fails, so drop it. What survives is narrower and documented, and it is on this site elsewhere. Islamic law does contain coercive provisions — apostasy, and jizya paid <b>\"while they are humbled\"</b> — with no New Testament parallel. Argue that documented asymmetry, not the slogan."},{"say":true,"t":"What to say","d":"\"Islam did not spread only by the sword, and I will not say it did. Can I ask about something narrower?\""}],"rewritten":true,"refwhy":{"Matthew 26:52":"'Put up again thy sword.' The contrast that makes the slogan tempting in the first place.","Quran 2:256":"'No compulsion in religion.' Jurists used it against forced conversion, which is why the slogan fails.","Quran 9:29":"The jizya verse. This is the narrower point that survives: a tax paid 'while they are humbled'."},"titleLong":"'Islam spread only by the sword' — the caricature versus the record"},
{"id":"inheritance-math-awl","title":"The Quran's inheritance shares add up to 27/24","category":"quran-text","claim":"Quran 4:11-12 and 4:176 assign fixed inheritance fractions, and in common cases they add up to more than the estate. A man leaving a wife, two daughters and both parents yields one eighth plus two thirds plus one third, which is 27/24. A man leaving a mother, a wife and two sisters yields one third plus one quarter plus two thirds, which is 15/12. Islamic jurisprudence itself acknowledges the oversubscription. The doctrine of awl, a proportional reduction of all shares, was devised to handle it. By IslamQA's own account, no case of awl arose under Muhammad or Abu Bakr; the caliph Umar was the first to rule on it. So the Quran's 'perfectly detailed' law (6:114) required a human patch within a decade of Muhammad's death. A book claiming divine authorship and precision in its most legally binding passages should not need companions to renormalise its fractions.","quran":["Quran 4:11","Quran 4:12","Quran 4:176","Quran 6:114"],"hadith":[],"bible":["Psalm 19:7"],"sources":[{"name":"Answering Islam — Contradictions in the Qur'an (inheritance)","type":"apologetics","url":"https://www.answering-islam.org/Quran/Contra/i001.d2.html"},{"name":"IslamQA 131556 — Objection to the 'awl process","type":"muslim","url":"https://islamqa.info/en/answers/131556"},{"name":"IslamOnline — Do Qur'anic inheritance rules involve mathematical errors?","type":"muslim","url":"https://fiqh.islamonline.net/en/quranic-rules-of-inheritance-do-they-involve-mathematical-errors/"},{"name":"Wikipedia — Islamic inheritance jurisprudence","type":"institutional","url":"https://en.wikipedia.org/wiki/Islamic_inheritance_jurisprudence"},{"name":"Quran 4:11 (text)","type":"primary","url":"https://quran.com/4/11"}],"response":"Muslim jurists respond that the verses assign shares, not a summed distribution formula. When shares oversubscribe, awl preserves each heir's proportion relative to the others, which they argue is the intended design — a ratio system, not an addition problem. IslamOnline argues that the internal proportions remain exactly as stated even when the denominators are scaled, so no mathematical error exists. IslamQA adds that the companions' consensus on awl demonstrates the system's flexibility rather than a defect, and that the Quran never promises the fractions will sum to one in every configuration.","responseSource":{"name":"IslamOnline (fiqh)","url":"https://fiqh.islamonline.net/en/quranic-rules-of-inheritance-do-they-involve-mathematical-errors/"},"verdict":"admitted","rationale":"The controlling facts are conceded on the Islamic side. The fractions do exceed the estate in ordinary cases, and awl was a post-Muhammad juristic invention first ruled on by Umar — IslamQA states this plainly. The dispute is only over characterisation, ratios rather than sums. But the verses read as direct commands about actual portions of actual estates, closing with 'an obligation from Allah' (4:11), and the ratio defence is nowhere in the text. It was reverse-engineered after real estates came up short. This is graded admitted rather than unrefuted because the substance — that shares oversubscribe, and that humans patched it — is affirmed by Islamic jurisprudence itself.","severity":"medium","plain":[{"t":"The rule","d":"Quran 4:11-12 and 4:176 assign fixed shares of an estate. The verses read as direct commands about real portions. Quran 4:11 closes by calling it an obligation from Allah."},{"t":"The arithmetic","d":"Sometimes the shares add up to more than the estate. A man leaves a wife, two daughters and both parents. That is 1/8 plus 2/3 plus 1/3, which is 27/24. Another leaves a mother, a wife and two sisters. That is 1/3 plus 1/4 plus 2/3, which is 15/12."},{"t":"The fix Islam devised","d":"Islamic law admits the problem. The doctrine of <i>awl</i> reduces all shares proportionally. By IslamQA's own account, no such case arose under Muhammad or Abu Bakr. Umar was the first caliph to rule on it. So the law described as perfectly detailed (Quran 6:114) needed a human patch within a decade."},{"t":"The Muslim answer, at full strength","d":"IslamOnline answers that the verses assign shares, not a total. When shares oversubscribe, <i>awl</i> keeps each heir's proportion relative to the others, which they say is the design. It is a ratio system, not an addition problem. IslamQA adds that the companions' agreement on <i>awl</i> shows flexibility, not a defect, and that the Quran never promises the fractions sum to one in every case."},{"t":"How strong is this argument?","d":"They admit the substance themselves. The shares do exceed the estate, and <i>awl</i> was a later human ruling — IslamQA says so plainly. Only the description is argued. But the ratio defence is nowhere in the text. It was worked out backwards, after real estates came up short."},{"say":true,"t":"What to say","d":"\"Why did Umar have to invent a rule to make the shares fit? I am curious how you see it.\""}],"rewritten":true,"refwhy":{"Psalm 19:7":"'The law of the LORD is perfect.' The standard being applied to a law that needed a patch.","Quran 4:11":"Sets the shares for children and parents. It calls them an obligation from Allah.","Quran 4:12":"Sets the shares for spouses and for brothers and sisters. The other half of the sum.","Quran 4:176":"The last verse of the surah, on a man who leaves no child. It adds the sisters' share.","Quran 6:114":"Says the Book is set out in detail. That claim is what the awl patch sits against."},"titleLong":"Inheritance shares that exceed the estate: Quran 4:11-12 and the 'awl fix"},
{"id":"banu-qurayza-massacre","title":"Banu Qurayza: 600 to 900 beheaded in Medina","category":"muhammad-test","claim":"In 627 AD, after the Battle of the Trench, the Jewish tribe Banu Qurayza surrendered to Muhammad. Sa'd ibn Mu'adh ruled that 'their warriors be killed and their children taken captive', and Muhammad endorsed the verdict as 'the judgment of Allah' (Sahih al-Bukhari 3043). Ibn Ishaq's sira records 600 to 900 males beheaded in trenches dug in Medina's market, with Muhammad present. The women and children were enslaved, and Muhammad took Rayhana from among the captives. Adulthood was determined by inspecting for pubic hair; the survivor Atiyya al-Qurazi testifies to this directly (Sunan Abi Dawud 4404). These are not enemy accusations. Every detail comes from Islam's own canonical hadith and earliest biography. The evangelistic contrast is stark, since 'by their fruits you will know them' (Matthew 7:15-20) is applied to the man Muslims must take as the perfect model (Quran 33:21).","quran":["Quran 33:26-27","Quran 33:21"],"hadith":["Sahih al-Bukhari 3043","Sahih al-Bukhari 4028","Sunan Abi Dawud 4404"],"bible":["Matthew 7:15-20","Matthew 5:44","Romans 12:19-21"],"sources":[{"name":"M. J. Kister — 'The Massacre of the Banu Qurayza' (Hebrew University)","type":"scholarly","url":"https://kister.huji.ac.il/sites/default/files/pdf/banu_qurayza.pdf"},{"name":"WikiIslam — The Massacre of the Banu Qurayzah","type":"apologetics","url":"https://wikiislam.net/wiki/The_Massacre_of_the_Banu_Qurayzah"},{"name":"Sahih al-Bukhari 3043 (Sa'd's judgment)","type":"primary","url":"https://sunnah.com/bukhari:3043"},{"name":"Sunan Abi Dawud 4404 (puberty inspection)","type":"primary","url":"https://sunnah.com/abudawud:4404"},{"name":"Wikipedia — Siege of Banu Qurayza","type":"institutional","url":"https://en.wikipedia.org/wiki/Siege_of_Banu_Qurayza"},{"name":"Guillaume, The Life of Muhammad (Ibn Ishaq translation)","type":"primary","url":"https://archive.org/details/GuillaumeATheLifeOfMuhammad"}],"response":"SeekersGuidance answers that Banu Qurayza committed high treason during an existential siege. They broke their defence pact by negotiating with the attacking confederates. The penalty was wartime justice for treachery, not religious persecution. The verdict was delivered by Sa'd, an arbitrator the tribe itself accepted. SeekersGuidance also argues that it matched the tribe's own law in Deuteronomy 20:10-14, for a besieged and treacherous city. Some modern academics, following W. N. Arafat, dispute the 600 to 900 figure as an exaggeration absorbed from Jewish narrators, and argue that only the guilty leaders were executed.","responseSource":{"name":"SeekersGuidance — A Balanced Explanation of the Banu Qurayza Controversy","url":"https://seekersguidance.org/answers/general-counsel/a-balanced-explanation-of-the-banu-qurayza-controversy/"},"verdict":"admitted","rationale":"The event itself is not denied by mainstream Islam; the defences justify it. Bukhari preserves the judgment and Muhammad's endorsement. Abu Dawud preserves the puberty inspections. The sira supplies the scale. The Deuteronomy 20 parallel fails on its own terms, since that law addressed distant cities in Israel's unique theocratic conquest, was never a standing model, and Muhammad claimed a universal, final revelation of mercy (21:107). The Arafat revisionist number is rejected by M. J. Kister's classic study, and it sits awkwardly with the sahih material. What remains conceded on all sides is the mass execution of surrendered prisoners, the enslavement of their families, and the claim that the man who presided is humanity's perfect example.","severity":"high","plain":[{"t":"What happened in 627","d":"After the Battle of the Trench, the Jewish tribe Banu Qurayza surrendered to Muhammad. Sa'd ibn Mu'adh gave the ruling. Their fighting men were to be killed. Their children were to be taken captive. Muhammad endorsed it as <b>\"the judgment of Allah\"</b> (Sahih al-Bukhari 3043)."},{"t":"The scale","d":"Ibn Ishaq's biography records 600 to 900 males beheaded. The trenches were dug in the market of Medina. Muhammad was present. The women and children were enslaved, and he took Rayhana from among the captives. Age was judged by inspecting for pubic hair. A survivor, Atiyya al-Qurazi, says so himself (Sunan Abi Dawud 4404)."},{"t":"Where these facts come from","d":"Not from enemies. Sahih al-Bukhari 3043 has the ruling and the endorsement. Sunan Abi Dawud 4404 has the inspections. Ibn Ishaq's <i>sira</i>, in Guillaume's translation, gives the numbers. M. J. Kister of the Hebrew University wrote the standard study."},{"t":"The Muslim answer, at full strength","d":"SeekersGuidance answers that this was treason in a siege. The tribe broke its defence pact by dealing with the attackers. The penalty was wartime justice, not religious persecution. The verdict came from Sa'd, an arbitrator the tribe itself chose. SeekersGuidance also argues it matched the tribe's own law in Deuteronomy 20:10-14. Some modern scholars, following W. N. Arafat, dispute the 600 to 900 figure and hold that only the guilty leaders died."},{"t":"How strong is this argument?","d":"They admit the event; the defences justify it. The Deuteronomy parallel does not hold: that law concerned distant cities in a one-time conquest, and it was never a standing model. Arafat's lower number is rejected by Kister's study. What remains agreed on all sides is the execution of surrendered prisoners, the enslaving of their families, and the claim that the man who presided is the perfect example (Quran 33:21)."},{"say":true,"t":"What to say","d":"\"Jesus said we would know a tree by its fruit. Can we look at this event together, from your books?\""}],"rewritten":true,"refwhy":{"Matthew 7:15-20":"'By their fruits ye shall know them.' The test this case applies, and it is quoted in the text.","Matthew 5:44":"'Love your enemies.' Set against what was done to an enemy who had already surrendered.","Romans 12:19-21":"Tells Christians to leave revenge to God and to overcome evil with good.","Quran 33:26-27":"The Quran's own account. Some were killed, some taken captive, and their land passed on.","Quran 33:21":"Calls him an excellent pattern. That is what turns this event into a question.","Sahih al-Bukhari 3043":"In Bukhari: Sa'd's ruling, and Muhammad calling it 'the judgment of Allah'. The core source.","Sahih al-Bukhari 4028":"A second account of the same siege in Bukhari. The event itself is not in doubt.","Sunan Abi Dawud 4404":"From Abu Dawud. A survivor says the boys were checked for hair to decide who would die."},"titleLong":"Banu Qurayza: the mass execution Muhammad presided over"},
{"id":"muhammad-in-the-bible","title":"The three proof-texts for Muhammad all fail","category":"muhammad-test","claim":"The Quran stakes its credibility on Muhammad being 'written in the Torah and the Gospel' (7:157), and on Jesus foretelling 'a messenger after me whose name is Ahmad' (61:6). The three standard proof-texts all fail on inspection. Deuteronomy 18:15-18 requires a prophet 'from among your brothers', meaning the Israelites, since Deuteronomy 18:2 uses 'brothers' of fellow tribes. Acts 3:22 identifies him as Jesus. Muhammad was not an Israelite, mediated no covenant, and by Islam's own account performed no confirming signs. The Paraclete of John 14-16 is 'the Spirit of truth', whom 'the world cannot see', who 'will be in you', and whom the disciples themselves would receive — impossible for a man born five centuries later. The periklytos conjecture has no manuscript support. And Song of Songs 5:16's machamaddim is a common noun, plural, meaning 'altogether desirable', used of the Shulamite's beloved, not a name. The dilemma bites both ways: if the Bible was corrupted, why does the Quran send Muslims to it to find Muhammad?","quran":["Quran 7:157","Quran 61:6"],"hadith":[],"bible":["Deuteronomy 18:15-18","Acts 3:22-26","John 14:16-17","John 16:7-14","Song of Solomon 5:16"],"sources":[{"name":"Answering Islam — Deuteronomy 18:18: a prophecy of Muhammad?","type":"apologetics","url":"https://www.answering-islam.org/BibleCom/deut18-18.html"},{"name":"Christian Research Institute — Muhammad and Deuteronomy 18","type":"apologetics","url":"https://www.equip.org/articles/muhammad-deuteronomy-18-prophet-like-moses/"},{"name":"Apologetics Press — Does Song of Solomon Mention Muhammad?","type":"apologetics","url":"https://apologeticspress.org/does-song-of-solomon-mention-muhammad-4749/"},{"name":"Thirdmill — Muhammad and Machmaddim (Song 5:16)","type":"scholarly","url":"https://thirdmill.org/answers/answer.asp/file/40471"},{"name":"Answering Muslims (David Wood) — Deuteronomy 18:18, reply to Zakir Naik","type":"apologetics","url":"http://www.answeringmuslims.com/2013/02/is-muhammad-prophet-like-moses-in.html"}],"response":"Dawah apologists, including Ahmed Deedat, Zakir Naik and Discover The Truth, argue as follows. 'Brothers' of the Israelites means their kin, the Ishmaelites. Muhammad parallels Moses more closely than Jesus does — natural birth, marriage, law-giving, migration, military leadership, and natural death — all points where Jesus, as divine Son, differs. The Paraclete passages were altered, or parakletos is a corruption of an original periklytos, 'the praised one', which is Ahmad. And machamaddim carries the very consonantal root of Muhammad's name, in a messianic love-song. They add that Quran 7:157 is corroborated precisely because traces survive despite centuries of transmission by hostile communities.","responseSource":{"name":"Discover The Truth — Song of Songs 5:16 prophesied Muhammad","url":"https://discover-the-truth.com/2015/12/12/song-of-songs-516-prophesied-prophet-muhammad-p-by-name/"},"verdict":"unrefuted","rationale":"The Christian rebuttal stands essentially unanswered on the textual level. Deuteronomy 18:2 and 17:15 fix 'brothers' as Israelites. Deuteronomy 34:10-12 defines 'like Moses' by signs, wonders, and knowing God face to face — the exact credentials Islam denies Muhammad (Quran 29:50-51). Every Greek manuscript of John reads parakletos, and the periklytos emendation is pure conjecture. Machamaddim is standard Hebrew vocabulary, used also in Song 2:3 and Hosea 9:16. Most decisively, the argument self-destructs. Quran 7:157 presupposes a readable, reliable Torah and Gospel in the 7th century, which feeds directly into this site's central tahrif dilemma. No Muslim response engages that circularity successfully.","severity":"high","plain":[{"t":"The claim Islam makes","d":"Quran 7:157 says Muhammad is <b>\"written with them in the Torah and the Gospel.\"</b> Quran 61:6 says Jesus foretold a messenger named Ahmad. Three passages are usually offered as proof."},{"t":"Deuteronomy 18","d":"It promises a prophet <b>\"from among your brothers\"</b> who is like Moses. Deuteronomy 18:2 uses <i>brothers</i> of fellow Israelites. Acts 3:22 identifies him as Jesus. Deuteronomy 34:10-12 defines <i>like Moses</i> by signs, wonders, and knowing God face to face. Quran 29:50-51 denies Muhammad those very signs."},{"t":"The Paraclete and Song of Songs","d":"In John 14-16 the Paraclete is <b>\"the Spirit of truth,\"</b> whom the world cannot see, who will be <i>in</i> the disciples, and whom they would receive themselves. None of that fits a man born five centuries later. The <i>periklytos</i> guess has no manuscript support at all. In Song of Songs 5:16, <i>machamaddim</i> is a plural common noun meaning altogether desirable. It is used elsewhere in Song 2:3 and Hosea 9:16."},{"t":"The Muslim answer, at full strength","d":"Ahmed Deedat, Zakir Naik and Discover The Truth answer this way. <i>Brothers</i> of the Israelites means their kin, the Ishmaelites. Muhammad matches Moses more closely than Jesus does — natural birth, marriage, law-giving, migration, military leadership, natural death. The Paraclete passages were altered, or <i>parakletos</i> is a corruption of <i>periklytos</i>, the praised one, which is Ahmad. And <i>machamaddim</i> carries the very consonants of his name."},{"t":"How strong is this argument?","d":"Strong for you, and the textual reply stands unanswered. Every Greek manuscript of John reads <i>parakletos</i>. But the sharpest point is the shape of the argument itself. Quran 7:157 sends Muslims to the Torah and Gospel to find Muhammad. That assumes those books can be read and trusted."},{"say":true,"t":"What to say","d":"\"If the Bible is corrupt, why does your book tell you to look for Muhammad in it?\""}],"rewritten":true,"refwhy":{"Deuteronomy 18:15-18":"The main proof-text. It promises a prophet 'from among your brothers', meaning Israelites.","Acts 3:22-26":"Peter quotes that promise and applies it to Jesus. The New Testament's own reading of it.","John 14:16-17":"The Paraclete is 'the Spirit of truth', whom the world cannot see and who will be in them.","John 16:7-14":"More on the Paraclete. He comes when Jesus goes, and takes what is Christ's to show them.","Song of Solomon 5:16":"The verse with machamaddim in it. The word is common Hebrew for 'altogether lovely'. It is not a name.","Quran 7:157":"Says he is written with them in the Torah and Gospel. It assumes those books can be read.","Quran 61:6":"Says Jesus foretold a messenger named Ahmad. The second claim being tested here."},"titleLong":"Is Muhammad in the Bible? Deuteronomy 18, the Paraclete, and Song of Songs 5:16"},
{"id":"ishmael-covenant-kaaba","title":"No source before Islam puts Abraham in Mecca","category":"torah-preservation","claim":"Islam's foundation story runs through Abraham. The covenant passes through Ishmael, Abraham and Ishmael built the Kaaba in Mecca (Quran 2:127; 3:96), and the near-sacrifice was of Ishmael. Genesis says the opposite. God establishes his everlasting covenant through Isaac, explicitly not Ishmael, though Ishmael is blessed (Genesis 17:19-21; 21:12), and the sacrifice is of 'your son, your only son Isaac' at Moriah (22:2). Strikingly, the Quran never names the sacrificed son (37:100-107), and early Muslim exegesis was split — al-Tabari, Islam's greatest classical commentator, concluded from the Quran's own sequence that it was Isaac. No pre-Islamic source of any kind places Abraham within a thousand miles of Mecca, and Genesis locates Ishmael's line in Paran and Shur, in north-west Arabia and Sinai, not the Hijaz. The Islamic claim requires the Torah to be textually corrupted at exactly these points, which lands in the tahrif trap: the Quran affirms the Torah in Muhammad's hands, and the manuscripts predate him.","quran":["Quran 2:125-127","Quran 3:96-97","Quran 37:100-107"],"hadith":["Sahih al-Bukhari 3364"],"bible":["Genesis 17:18-21","Genesis 21:12","Genesis 22:2","Genesis 25:18"],"sources":[{"name":"Answering Islam (Shamoun) — Abraham and the Child of Sacrifice","type":"apologetics","url":"https://www.answering-islam.org/Shamoun/sacrifice.htm"},{"name":"Answering Islam — Rebuttal on the sacrifice of Abraham (documents Tabari's view)","type":"apologetics","url":"https://www.answering-islam.org/Responses/Saifullah/sacrifice.htm"},{"name":"Islamic Awareness — The Sacrifice of Abraham: Isaac or Ishmael?","type":"muslim","url":"https://www.islamic-awareness.org/quran/contrad/mustrad/sacrifice.html"},{"name":"Genesis 17 (text)","type":"primary","url":"https://www.biblegateway.com/passage/?search=Genesis+17%3A18-21&version=ESV"},{"name":"Sahih al-Bukhari 3364 (Abraham, Hagar, and Mecca narrative)","type":"primary","url":"https://sunnah.com/bukhari:3364"}],"response":"Islamic Awareness and other Muslim apologists argue that the Torah's 'your only son Isaac' betrays later Israelite editing. Ishmael was Abraham's only son for about fourteen years, so 'only son' fits him alone, and a scribe allegedly inserted Isaac's name. They read Genesis 21:21's Paran as extending to the Hijaz. They connect Psalm 84:6's 'valley of Baca' with Bakkah, or Mecca, in Quran 3:96. They take Sahih al-Bukhari 3364's detailed Abraham-in-Mecca narrative as preserved true history. And Islamic Awareness contends that the Quran's silence on the son's name is deliberate universality, while the later consensus for Ishmael rests on sound reasoning from the sequence of events in Surah 37.","responseSource":{"name":"Islamic Awareness — The Sacrifice of Abraham","url":"https://www.islamic-awareness.org/quran/contrad/mustrad/sacrifice.html"},"verdict":"unrefuted","rationale":"Every leg of the Muslim case depends on assuming Genesis corruption without manuscript evidence. The Dead Sea Scrolls and the Septuagint carry Genesis 17 and 22 unchanged from centuries before Christ, let alone before Muhammad. The 'only son' argument concedes the method, which is to rewrite the text to fit the claim. Al-Tabari's verdict for Isaac shows that even Islam's classical scholarship could not read Ishmael out of Surah 37. Paran is fixed near Sinai by Genesis 14:6 and Numbers 10-13, and Baca is a valley on the road to Zion (Psalm 84:7). No pre-Islamic trace of an Abrahamic Kaaba exists. The claim survives only inside the tahrif assumption that this site's core dilemma already dismantles.","severity":"high","plain":[{"t":"Two accounts of Abraham","d":"Islam runs the story through Ishmael. Abraham and Ishmael built the Kaaba in Mecca (Quran 2:127; 3:96). The son nearly sacrificed was Ishmael. Genesis says otherwise. God sets his everlasting covenant with Isaac, and not with Ishmael, though Ishmael is blessed (Genesis 17:19-21; 21:12). The sacrifice is of <b>\"your son, your only son Isaac\"</b> at Moriah (Genesis 22:2)."},{"t":"Something the Quran does not say","d":"The Quran never names the son (Quran 37:100-107). Early Muslim scholars were split. Al-Tabari, Islam's greatest classical commentator, concluded from the Quran's own sequence that it was Isaac."},{"t":"The geography","d":"No source before Islam places Abraham anywhere near Mecca. Not biblical, Jewish, Greek, Roman, or archaeological. Genesis puts Ishmael's line in Paran and Shur, in north-west Arabia and Sinai, not the Hijaz."},{"t":"The Muslim answer, at full strength","d":"Islamic Awareness answers on several fronts. <b>\"Your only son Isaac\"</b> betrays later editing, since Ishmael was the only son for about fourteen years. Genesis 21:21's Paran can be stretched toward the Hijaz. Psalm 84:6's valley of Baca is linked to Bakkah in Quran 3:96. Sahih al-Bukhari 3364 gives a detailed account of Abraham in Mecca, taken as true history. And the Quran's silence about the son's name is deliberate."},{"t":"How strong is this argument?","d":"Strong for you, because every leg needs Genesis to be corrupt. But the Dead Sea Scrolls and the Septuagint carry Genesis 17 and 22 unchanged from centuries before Christ. Paran is fixed near Sinai by Genesis 14:6 and Numbers 10-13. Baca is a valley on the way to Zion (Psalm 84:7). And al-Tabari's verdict shows Islam's own scholarship could not read Ishmael out of Surah 37."},{"say":true,"t":"What to say","d":"\"Al-Tabari thought the son was Isaac. Have you ever read how he reached that?\""}],"rewritten":true,"refwhy":{"Genesis 17:18-21":"Abraham asks for Ishmael. God blesses Ishmael, but sets the lasting covenant with Isaac.","Genesis 21:12":"'In Isaac shall thy seed be called.' This is the line the Islamic account has to move.","Genesis 22:2":"'Thy son, thine only son Isaac', at Moriah. The verse both sides argue over.","Genesis 25:18":"Places Ishmael's line from Havilah to Shur, over against Egypt. That is not the Hijaz.","Quran 2:125-127":"Abraham and Ishmael raise the foundations of the House. The heart of the Islamic account.","Quran 3:96-97":"Names Bakkah as the first house set up for mankind. Muslims read Bakkah as Mecca.","Quran 37:100-107":"The near-sacrifice. The son is never named, which is why al-Tabari argued for Isaac.","Sahih al-Bukhari 3364":"In Bukhari: the long account of Hagar and Ishmael at Mecca. Islam's source for the link."},"titleLong":"Ishmael, Isaac, and the Kaaba: Islam's rewritten Abraham"},
{"id":"quran-borrowed-legends","title":"A rabbi's homily on Cain, in Allah's voice","category":"science-history","claim":"Several Quranic narratives track post-biblical Jewish and Christian legends rather than the Bible. Quran 5:32 — 'whoever kills a soul... it is as if he killed all mankind' — reproduces Mishnah Sanhedrin 4:5, a rabbinic homily on Cain composed centuries before Islam, and it even keeps the Israel-specific framing, 'We decreed upon the Children of Israel'. The preceding verse's raven, who shows Cain how to bury Abel (5:31), parallels the same midrashic cluster. Quran 18:9-26 retells the Seven Sleepers of Ephesus, a Christian legend attested in Jacob of Serugh, who died in 521, and in Gregory of Tours, complete with the dog and the disputed head-count, presented as revelation about real 'youths of the cave'. Quran 21:68-69 has Abraham thrown into a fire, a story that arose from Genesis Rabbah's wordplay, reading 'Ur' of the Chaldees as ur, 'fire'. A book delivering eternal truth should not canonise identifiable human commentary, folklore and a pun as history.","quran":["Quran 5:27-32","Quran 18:9-26","Quran 21:68-69"],"hadith":[],"bible":["Genesis 4:8-16","Genesis 11:31","Genesis 15:7"],"sources":[{"name":"Gilchrist — Other Qur'anic Origins and Sources","type":"apologetics","url":"https://answering-islam.org/Gilchrist/Vol1/5c.html"},{"name":"WikiIslam — Seven Sleepers of Ephesus in the Quran","type":"apologetics","url":"https://wikiislam.net/wiki/Seven_Sleepers_of_Ephesus_in_the_Quran"},{"name":"Mishnah Sanhedrin 4:5 (Sefaria)","type":"primary","url":"https://www.sefaria.org/Mishnah_Sanhedrin.4.5"},{"name":"Wikipedia — List of legends in the Quran","type":"institutional","url":"https://en.wikipedia.org/wiki/List_of_legends_in_the_Quran"},{"name":"Wikipedia — Seven Sleepers","type":"institutional","url":"https://en.wikipedia.org/wiki/Seven_Sleepers"}],"response":"Islamic Awareness and similar apologists respond on three fronts. A parallel does not prove borrowing, since a common divine source or a shared true history would explain the overlap. Some alleged sources, such as Pirke de-Rabbi Eliezer for the raven, may postdate Islam, which would reverse the direction of borrowing. And the Quran self-consciously corrects and reframes these accounts: on the Sleepers, 18:22 rebukes speculation about the number, which shows critical engagement rather than credulous copying. On 5:32, they argue that Allah confirming a truth he originally inspired to Israel's sages is no embarrassment, since the verse explicitly says the decree was given to the Children of Israel.","responseSource":{"name":"Islamic Awareness — Sources of the Qur'an (responses)","url":"https://www.islamic-awareness.org/quran/sources/"},"verdict":"unrefuted","rationale":"The dating defence fails where it matters most. Mishnah Sanhedrin was redacted about 200 AD, Genesis Rabbah by the 5th century, and the Seven Sleepers is firmly pre-Islamic in Jacob of Serugh. Those three are secure, whatever one says about Pirke de-Rabbi Eliezer. The 'divine confirmation' move cannot rescue 5:32, because what the Quran presents as Allah's decree is identifiably a rabbi's exegetical inference from Hebrew grammar, drawn from the plural 'bloods of your brother'. And the Sleepers is a legend about the reign of Decius, not scripture. The correction at 18:22 concedes that the story arrived as circulating folklore. No Muslim response explains why revelation reproduces commentary.","severity":"high","plain":[{"t":"Three passages, three sources","d":"Quran 5:32 says that whoever kills a soul, it is as if he killed all mankind. That is Mishnah Sanhedrin 4:5, a rabbi's homily on Cain, written centuries before Islam. The Quran even keeps its framing: <i>We decreed upon the Children of Israel</i>. The raven who shows Cain how to bury Abel (5:31) belongs to the same cluster of Jewish material."},{"t":"The other two","d":"Quran 18:9-26 retells the Seven Sleepers of Ephesus. That is a Christian legend, attested in Jacob of Serugh, who died in 521, and in Gregory of Tours. The dog and the disputed head-count are both there. Quran 21:68-69 has Abraham thrown into a fire. That story grew out of Genesis Rabbah, from a play on words: <i>Ur</i> of the Chaldees read as <i>ur</i>, fire."},{"t":"The Muslim answer, at full strength","d":"Islamic Awareness answers on three fronts. A parallel is not borrowing; a common divine source or a shared true history would explain it. Some claimed sources, such as Pirke de-Rabbi Eliezer, may be later than Islam, which would reverse the direction. And the Quran corrects as it retells: on the Sleepers, 18:22 rebukes idle guessing about the number, which shows judgment rather than copying. On 5:32, they note the verse itself says the decree was given to the Children of Israel."},{"t":"How strong is this argument?","d":"Strong for you, because the dating holds where it matters. Mishnah Sanhedrin was compiled about 200 AD. Genesis Rabbah is 5th century. The Seven Sleepers is firmly pre-Islamic in Jacob of Serugh. Those three are secure whatever one says about Pirke de-Rabbi Eliezer."},{"t":"Why that is hard to answer","d":"Quran 5:32 is presented as Allah's decree. But it is identifiably a rabbi's inference from Hebrew grammar, drawn from the plural <i>bloods of your brother</i>. And the Sleepers is a legend about the reign of Decius, not scripture. The correction in 18:22 concedes the story arrived as folklore."},{"say":true,"t":"What to say","d":"\"The line in Quran 5:32 is a rabbi's comment on Genesis. Would you like to see where it comes from?\""}],"rewritten":true,"refwhy":{"Genesis 4:8-16":"The Cain and Abel account. No raven, and no line about all mankind. Those come later.","Genesis 11:31":"Says Abraham came from Ur of the Chaldees. Ur is a place; the fire story grew out of that word.","Genesis 15:7":"God says he brought Abraham out of Ur. The second verse behind the rabbis' play on words.","Quran 5:27-32":"The Cain and Abel passage, with the raven and the line about killing all mankind.","Quran 18:9-26":"The People of the Cave. This is the Seven Sleepers legend, told as history.","Quran 21:68-69":"Abraham thrown into the fire, and the fire made cool. The third of the three stories."},"titleLong":"The rabbis' commentary in Allah's voice: Sanhedrin 4:5, the Seven Sleepers, and Abraham's furnace"},
{"id":"houris-material-paradise","title":"Seventy-two wives per martyr — Tirmidhi 1663","category":"salvation","claim":"The Quran's paradise is insistently sensual. There are wide-eyed maidens 'whom no man or jinn has touched' (55:56, 74), virgins made 'devoted, of equal age' for the companions of the right (56:35-38), 'full-breasted maidens of equal age' (78:33, kawa'ib atraban), along with wine, couches and served boys. The hadith intensify it. The martyr is 'married to seventy-two wives among the houris' (Jami at-Tirmidhi 1663, graded hasan sahih by Tirmidhi). Each man receives wives with marrow visible through their flesh, in a pearl tent sixty miles wide (Sahih al-Bukhari 3243). IslamQA 60188 affirms the houris as literal wives given for sexual enjoyment. Jesus taught the opposite: in the resurrection 'they neither marry nor are given in marriage' (Matthew 22:30), and heaven's centre is God himself dwelling with his people (Revelation 21:3; 22:4; Psalm 16:11). The contrast exposes what each faith holds as the ultimate good — reward, or God.","quran":["Quran 55:56-74","Quran 56:22-38","Quran 78:31-34","Quran 44:51-54"],"hadith":["Jami at-Tirmidhi 1663","Sahih al-Bukhari 3243"],"bible":["Matthew 22:30","Revelation 21:3-4","Revelation 22:3-5","Psalm 16:11"],"sources":[{"name":"Jami at-Tirmidhi 1663","type":"primary","url":"https://sunnah.com/tirmidhi:1663"},{"name":"Sahih al-Bukhari 3243","type":"primary","url":"https://sunnah.com/bukhari:3243"},{"name":"WikiIslam — Houri (Heavenly Virgin)","type":"apologetics","url":"https://wikiislam.net/wiki/Houri_(Heavenly_Virgin)"},{"name":"IslamQA 60188 — Description of al-hoor al-'iyn","type":"muslim","url":"https://islamqa.info/en/answers/60188"},{"name":"Mufti of Federal Territory (Malaysia) — status of the 72-wives hadith","type":"muslim","url":"https://www.muftiwp.gov.my/en/artikel/irsyad-al-hadith/946-irsyad-al-hadith-siri-ke-167-status-hadith-orang-syahid-dikahwinkan-dengan-72-bidadari"}],"response":"IslamQA 60188 replies that critics caricature paradise. The Quran itself says 'the pleasure of Allah is greater' than all of it (9:72), and sound hadith make the vision of Allah's face the supreme reward. Physical delights are real because humans are resurrected bodily, a point Christianity shares, with a wedding feast, a city and a renewed earth. They are also purified of sin, since there is 'no idle talk therein' (56:25). The number 72 comes from a single companion-chain that some scholars grade weaker, and renderings like 'full-breasted' for kawa'ib are contested. Believing wives, they note, are promised higher status than the houris.","responseSource":{"name":"IslamQA 60188","url":"https://islamqa.info/en/answers/60188"},"verdict":"admitted","rationale":"This is graded admitted because mainstream Islamic authority affirms the substance. IslamQA and classical tafsir teach literal houris as sexual companions, and Tirmidhi himself graded the 72-wives hadith hasan sahih. The 9:72 rejoinder is fair as far as it goes, since Islam does hold Allah's pleasure supreme. But it does not erase the fact that the Quran's dominant, repeated portrait of reward is virgins, couches and wine, while God's own presence with his people — the engine of biblical hope from Eden to Revelation — is structurally marginal. The evangelistic point stands on Islam's own affirmed doctrine, not on polemical exaggeration.","severity":"medium","plain":[{"t":"How the Quran describes paradise","d":"It is insistently physical. Wide-eyed maidens <b>\"whom no man or jinn has touched\"</b> (Quran 55:56, 74). Virgins made devoted and of equal age (56:35-38). <i>Kawa'ib atraban</i>, rendered full-breasted maidens of equal age (78:33). Wine, couches, and boys who serve."},{"t":"What the hadith add","d":"The martyr is <b>\"married to seventy-two wives among the houris\"</b> (Jami at-Tirmidhi 1663, which Tirmidhi graded hasan sahih). Sahih al-Bukhari 3243 describes wives whose marrow is visible through their flesh, in a pearl tent sixty miles wide. IslamQA 60188 affirms the houris as literal wives for sexual enjoyment."},{"t":"What Jesus said","d":"In the resurrection <b>\"they neither marry nor are given in marriage\"</b> (Matthew 22:30). Heaven's centre is God himself dwelling with his people (Revelation 21:3; 22:4). Psalm 16:11 says the fullness of joy is in his presence."},{"t":"The Muslim answer, at full strength","d":"IslamQA 60188 replies that critics caricature paradise. The Quran itself says <b>\"the pleasure of Allah is greater\"</b> than all of it (9:72), and sound hadith make seeing Allah's face the supreme reward. Physical delights are real because people are raised bodily — a point Christians share, with a wedding feast, a city and a renewed earth. The 72 number rests on a single chain some scholars grade lower. And <i>kawa'ib</i> is a contested translation. Believing wives are promised higher status than the houris."},{"t":"How strong is this argument?","d":"They admit the substance themselves. IslamQA and classical commentary teach literal houris, and Tirmidhi graded the 72 report hasan sahih. The 9:72 reply is fair as far as it goes. But the repeated picture of reward is virgins, couches and wine, while God's own presence with his people — the engine of hope from Eden to Revelation — sits at the edge. Compare the goals, not the caricature."},{"say":true,"t":"What to say","d":"\"What is the best thing about heaven, in your view? For me it is God himself.\""}],"rewritten":true,"refwhy":{"Matthew 22:30":"'In the resurrection they neither marry nor are given in marriage.' The sharpest contrast here.","Revelation 21:3-4":"God dwells with his people and wipes away every tear. The centre of the Christian hope.","Revelation 22:3-5":"'They shall see his face.' The reward stated as God himself, not as things given.","Psalm 16:11":"'In thy presence is fulness of joy.' The same hope, said long before.","Quran 55:56-74":"The maidens 'whom no man or jinn has touched'. The main paradise passage in this case.","Quran 56:22-38":"Wide-eyed companions. Virgins made of equal age. This is for the companions of the right hand.","Quran 78:31-34":"Kawa'ib atraban, rendered full-breasted maidens of equal age, with a full cup.","Quran 44:51-54":"Gardens, silk, and marriage to wide-eyed maidens. A fourth passage with the same picture.","Jami at-Tirmidhi 1663":"The seventy-two wives report. Tirmidhi ranks below Bukhari, but he graded this one hasan sahih.","Sahih al-Bukhari 3243":"In Bukhari: wives whose marrow shows through the flesh, in a pearl tent sixty miles wide."},"titleLong":"Seventy-two houris: the carnal paradise versus the presence of God"},
{"id":"women-testimony-inheritance","title":"Half a witness: 'the deficiency of a woman's mind'","category":"practice","claim":"Quran 2:282 requires two women to replace one male witness, 'so that if one errs, the other can remind her', and 4:11 fixes a daughter's inheritance at half a son's. Muhammad drew the theological conclusion himself: 'Is not the witness of a woman equal to half that of a man?... This is because of the deficiency of a woman's mind' (Sahih al-Bukhari 2658). In Sahih al-Bukhari 304 he declares women 'deficient in intelligence and religion' and 'the majority of the dwellers of Hell-fire'. These are not fringe readings. Classical fiqh built evidentiary and inheritance law on them, and they remain live in sharia codes today. Scripture's trajectory is different in kind. Male and female are jointly God's image (Genesis 1:27). The risen Christ's first commissioned witnesses were women (Luke 24:9-11), whose testimony was legally worthless in that culture and was preserved anyway. And in Christ 'there is no male and female' (Galatians 3:28).","quran":["Quran 2:282","Quran 4:11","Quran 4:34"],"hadith":["Sahih al-Bukhari 2658","Sahih al-Bukhari 304"],"bible":["Genesis 1:27","Luke 24:9-11","Galatians 3:28","Proverbs 31:10-31"],"sources":[{"name":"Sahih al-Bukhari 2658","type":"primary","url":"https://sunnah.com/bukhari:2658"},{"name":"Sahih al-Bukhari 304","type":"primary","url":"https://sunnah.com/bukhari:304"},{"name":"Wikipedia — Status of women's testimony in Islam","type":"institutional","url":"https://en.wikipedia.org/wiki/Status_of_women%27s_testimony_in_Islam"},{"name":"IslamQA 111867 — Meaning of the lack in reason and religion in women","type":"muslim","url":"https://islamqa.info/en/answers/111867"},{"name":"Quran 2:282 (text)","type":"primary","url":"https://quran.com/2/282"}],"response":"IslamQA 111867 and classical commentators explain the 'deficiency' as domain-specific rather than essential. The testimony rule concerns financial contracts that women then rarely handled, so a second woman guards against error born of inexperience. The 'religion' deficiency refers only to exemption from prayer and fasting during menstruation, which is an excused lack and not a culpable one. Inheritance halves reflect economics, not worth, since men bear mandatory financial responsibility for women through the mahr and full family maintenance; a sister's unencumbered half can exceed a brother's encumbered whole. Modern Muslim scholars add that 2:282 is context-bound commercial procedure, and note other testimony contexts where a woman's word stands alone (24:6-9).","responseSource":{"name":"IslamQA 111867","url":"https://islamqa.info/en/answers/111867"},"verdict":"admitted","rationale":"The texts and their operative legal force are undisputed; the defences reinterpret motive, not content. And the softening glosses collide with the sources themselves. Bukhari 2658 grounds the testimony rule in 'deficiency of mind', not in commercial inexperience, and the economics defence does not touch 'majority of the dwellers of Hell-fire'. Classical fiqh applied the half-witness rule far beyond finance, and states applying sharia apply it now. Because the substance is affirmed by Islam's most authentic hadith and by mainstream fatwa bodies, this is admitted. The honest debate is only over whether the arrangement is demeaning, which the texts' own stated rationale settles.","severity":"high","plain":[{"t":"The two rules","d":"Quran 2:282 asks for two male witnesses to a debt contract, or one man and two women, <b>\"so that if one errs, the other can remind her.\"</b> Quran 4:11 gives a daughter half a son's share of an inheritance."},{"t":"The stated reason","d":"The reason is given in the hadith, not by critics. <b>\"Is not the witness of a woman equal to half that of a man?... This is because of the deficiency of a woman's mind\"</b> (Sahih al-Bukhari 2658). Sahih al-Bukhari 304 calls women deficient in intelligence and religion, and the majority of the dwellers of Hell-fire."},{"t":"What Scripture does instead","d":"Male and female together are God's image (Genesis 1:27). The first commissioned witnesses of the risen Christ were women (Luke 24:9-11) — testimony that was legally worthless in that culture, and preserved anyway. In Christ <b>\"there is no male and female\"</b> (Galatians 3:28)."},{"t":"The Muslim answer, at full strength","d":"IslamQA 111867 explains the deficiency as limited in scope, not essential. The witness rule concerns money contracts that women then rarely handled, so a second woman guards against inexperience. The religion deficiency refers only to being excused from prayer and fasting during menstruation. Inheritance shares reflect duty, not worth: men must pay the <i>mahr</i> and maintain the family, so a sister's free half can be worth more than a brother's committed whole. Modern scholars add that Quran 24:6-9 lets a woman's word stand alone."},{"t":"How strong is this argument?","d":"They admit the texts, and the softer readings collide with the sources. Sahih al-Bukhari 2658 grounds the rule in deficiency of mind, not in commercial inexperience. The economics answer does not touch the line about Hell-fire. Classical law applied the half-witness rule far beyond finance, and states using sharia apply it now. The honest debate left is whether the arrangement demeans, and the stated reason settles that."},{"say":true,"t":"What to say","d":"\"The first people to see Jesus alive were women, and the Gospels kept their names. Does that surprise you?\""}],"rewritten":true,"refwhy":{"Genesis 1:27":"Male and female are both made in God's image. The starting point of the contrast.","Luke 24:9-11":"Women are first to report the rising, though such witness carried no legal weight then.","Galatians 3:28":"'There is neither male nor female' in Christ. Said of standing before God.","Proverbs 31:10-31":"Shows a woman buying a field and trading. Useful against the claim that women handled no business.","Quran 2:282":"The witness rule: two women for one man, 'so that if one errs, the other can remind her'.","Quran 4:11":"Gives a daughter half a son's share. The inheritance half of this case.","Quran 4:34":"Calls men the maintainers of women. The Muslim reply builds its answer on this.","Sahih al-Bukhari 2658":"The reason, in Bukhari. Her witness is half 'because of the deficiency of a woman's mind'.","Sahih al-Bukhari 304":"In Bukhari. Women are called lacking in mind and faith. They are also called most of the people of the Fire."},"titleLong":"Half a witness, half an heir: women's legal standing in Islam's own texts"},
{"id":"fatiha-daily-prayer-jews-christians","title":"'Those who earned anger' — Muhammad said the Jews","category":"practice","claim":"Every observant Muslim recites Surah al-Fatiha in each unit of the five daily prayers, which is at minimum seventeen times daily. It closes with a plea to be guided in the path of those God favoured, 'not of those who have earned anger, nor of those who go astray' (1:7). Muhammad himself identified the referents: 'Those who have earned the anger are the Jews, and those who are led astray are the Christians' (Jami at-Tirmidhi 2954, graded hasan, from Adi ibn Hatim). Ibn Kathir records that 'the scholars of tafsir' held this view, citing broad early consensus, and it stands in Tafsir al-Jalalayn and in mainstream Salafi teaching today. So the world's second-largest religion liturgically defines itself, dozens of times a day, against Jews and Christians by name. Contrast the New Testament's posture toward those outside: 'love your enemies and pray for them' (Matthew 5:44), and Paul's 'my heart's desire and prayer to God for them is that they may be saved' (Romans 10:1).","quran":["Quran 1:7"],"hadith":["Jami at-Tirmidhi 2954"],"bible":["Matthew 5:44","Romans 10:1"],"sources":[{"name":"Tafsir Ibn Kathir on al-Fatiha 1:7 (Quran.com)","type":"primary","url":"https://quran.com/en/al-fatihah/7/tafsirs/en-tafisr-ibn-kathir"},{"name":"Jami at-Tirmidhi 2954","type":"primary","url":"https://sunnah.com/tirmidhi:2954"},{"name":"Troid (Salafi) — Tafsir of al-Fatiha: the misguided and those who earned anger","type":"muslim","url":"https://www.troid.org/tafsir-surah-al-fatihah-the-misguided-and-those-who-have-earned-allahs-anger/"},{"name":"Reaching Muslim Peoples — Rethinking al-Maghdubi 'Alayhim","type":"apologetics","url":"https://www.reachingmuslimpeoples.com/post/rethinking-al-maghdoubi-alaihim-muslims-christians-jews-and-the-wrath-of-god"}],"response":"Many Muslim teachers argue that the verse names categories, not ethnicities. 'Those who earned anger' are all who know truth and abandon it; 'those astray' are all who strive without knowledge. Jews and Christians appear in the hadith as historical exemplars, not as exclusive targets, and Muslims who fit the descriptions are equally included. The prayer, they stress, is a positive petition for guidance and not a curse on anyone; nothing in it asks harm for Jews or Christians. Modern expositors, such as Najam Academy, note that the Quran elsewhere commends righteous People of the Book (3:113-115), so 1:7 cannot be a blanket condemnation.","responseSource":{"name":"Najam Academy — Who are 'those who have earned God's anger'?","url":"https://najamacademy.com/who-are-those-who-have-earned-gods-anger-in-surah-fatiha/"},"verdict":"admitted","rationale":"The identification is Islam's own, from Muhammad's mouth in a hasan hadith, and endorsed by Ibn Kathir as the view of 'the scholars of tafsir'. The categorical reading is the modern softening, not the classical mainstream. It is graded admitted because the substance — that the canonical exegesis names Jews and Christians — is affirmed within Islamic tradition itself. The defence that it is exemplary rather than exhaustive is genuine, but it does not remove Jews and Christians from the referent. It universalises the condemnation while keeping them as its archetypes. For evangelism the point is posture: daily self-definition against the biblical communities, versus daily intercession for the lost.","severity":"medium","plain":[{"t":"The prayer every Muslim prays","d":"Surah al-Fatiha is recited in every unit of the five daily prayers. That is at least seventeen times a day. It ends by asking for the path of those God favoured, <b>\"not of those who have earned anger, nor of those who go astray\"</b> (Quran 1:7)."},{"t":"Who those two groups are","d":"The identification comes from Muhammad. <b>\"Those who have earned the anger are the Jews, and those who are led astray are the Christians\"</b> (Jami at-Tirmidhi 2954, graded hasan, from Adi ibn Hatim). Ibn Kathir records that the scholars of tafsir held this view. It stands in Tafsir al-Jalalayn and in mainstream Salafi teaching today."},{"t":"The contrast","d":"The New Testament's posture toward outsiders runs the other way. <b>\"Love your enemies and pray for them\"</b> (Matthew 5:44). Paul writes that <b>\"my heart's desire and prayer to God for them is that they may be saved\"</b> (Romans 10:1)."},{"t":"The Muslim answer, at full strength","d":"Many teachers argue the verse names types, not peoples. Those who earned anger are all who know the truth and leave it. Those astray are all who strive without knowledge. Jews and Christians appear in the hadith as historical examples, not as the only targets, and Muslims who fit are included too. The prayer asks for guidance; it does not curse anyone. And the Quran elsewhere praises righteous People of the Book (3:113-115)."},{"t":"How strong is this argument?","d":"They admit it themselves, from Muhammad's own mouth. The categorical reading is the modern softening, not the classical mainstream. The defence is genuine, but it does not remove Jews and Christians from the meaning. It widens the condemnation while keeping them as its examples. For evangelism the point is posture, not scoring: daily self-definition against these communities, versus daily prayer for them."},{"say":true,"t":"What to say","d":"\"I pray for you most days. Would it surprise you to know that?\""}],"rewritten":true,"refwhy":{"Matthew 5:44":"'Love your enemies and pray for them.' The posture set against a line said every day.","Romans 10:1":"Paul prays that they may be saved. Said of the people he most disagreed with.","Quran 1:7":"The closing line of the prayer said seventeen times a day. This case is entirely about it.","Jami at-Tirmidhi 2954":"From Tirmidhi, graded hasan. Here Muhammad names the two groups as Jews and Christians."},"titleLong":"Seventeen times a day: the Fatiha and 'those who earned wrath... those astray'"},
{"id":"hadith-chain-of-custody","title":"600,000 hadith sifted, about 7,000 kept","category":"muhammad-test","claim":"Almost all that Islam knows of Muhammad comes from hadith. They were first written down long after his death in 632. That includes how to pray, the five pillars, the age of Aisha, the events of his life, and even the story of how the Quran was gathered. Al-Bukhari died in 870. He is said to have sifted some 600,000 reports in circulation and kept about 7,000, counting repeats. So the Muslim community itself made up false reports on a vast scale for two centuries. Western scholars pressed the point. Ignaz Goldziher, Joseph Schacht and G. H. A. Juynboll showed that chains were improved and pushed back in time, and that 'common links' point to chains made up whole. The trap for dawah is simple. If the hadith cannot be trusted, Islam cannot say its own prayers, fix its pillars, or tell its prophet's life, and the Quran floats free of context. If they can be trusted, then Bukhari's hard reports stand too: Aisha at nine, the spell, Banu Qurayza, and 'deficient in mind'. The Gospels, by contrast, were written while eyewitnesses lived, a fraction of that gap.","quran":["Quran 16:44","Quran 33:21"],"hadith":["Sahih al-Bukhari 1","Sahih Muslim 1"],"bible":["Luke 1:1-4","1 Corinthians 15:3-8","2 Peter 1:16"],"sources":[{"name":"Wikipedia — Criticism of hadith","type":"institutional","url":"https://en.wikipedia.org/wiki/Criticism_of_hadith"},{"name":"IlmGate — Analyzing Schacht's theory and two of his critiques (Azami, Motzki)","type":"muslim","url":"https://www.ilmgate.org/analyzing-schachts-theory-and-two-of-his-critiques-azami-and-motzki/"},{"name":"ResearchGate — Hadith, Law, and Orientalism: a critical study of Schacht","type":"scholarly","url":"https://www.researchgate.net/publication/393097039_HADITH_LAW_AND_ORIENTALISM_A_CRITICAL_STUDY_OF_JOSEPH_SCHACHT'S_THEORETICAL_CONTRIBUTIONS"},{"name":"Jonathan Brown on historical criticism of Islamic primary texts","type":"muslim","url":"https://yousuf.blog/2018/02/09/dr-jonathan-brown-on-historical-criticism-of-islamic-primary-texts/"},{"name":"Kerr — Comparing methods (hadith criticism)","type":"scholarly","url":"https://kerrs.blog/posts/comparing-methods/"}],"response":"Muslim scholars answer that this is the most careful checking system in history. Each narrator was weighed by his life story, in the science called ilm al-rijal. Chains were cross-checked. Reports carried by large numbers are held to be certain. Muhammad Mustafa al-Azami and Harald Motzki showed that Schacht's dating went too far. Early written notes, such as the sahifa of Hammam ibn Munabbih, push the paper trail back near the first generation. Motzki's method, which reads chain and text together, verifies material Schacht threw out. Jonathan Brown notes that the tradition catalogued false reports itself, with a care Western critics only later found. And the 600,000 figure counts chain-variants, not separate lies.","responseSource":{"name":"IlmGate — Azami and Motzki vs. Schacht","url":"https://www.ilmgate.org/analyzing-schachts-theory-and-two-of-his-critiques-azami-and-motzki/"},"verdict":"unrefuted","rationale":"The Muslim defence is serious work, but it sharpens the trap rather than escaping it. Every rescue of hadith reliability re-authenticates Bukhari's most damaging contents, which the same writers play down elsewhere. And every appeal to weak chains or context against those reports saws off the branch Islamic practice sits on. The gap with the New Testament is one of size and of kind. It is 25 to 60 years against 150 to 250. It is continuous writing against chains held in memory. And it is public events that hostile witnesses could check. As a structured dilemma, parallel to this site's tahrif centrepiece, it has no published Muslim answer that keeps both consistency and orthodoxy.","severity":"high","plain":[{"t":"How much rests on the hadith","d":"Almost all Islam knows of Muhammad comes from them. How to pray. The five pillars. Aisha's age. The events of his life. Even the story of how the Quran was gathered. They were written down long after his death in 632."},{"t":"What al-Bukhari faced","d":"Al-Bukhari died in 870. He is said to have sifted some 600,000 reports. He kept about 7,000, counting repeats. So the community itself made up false reports on a vast scale for two centuries. Ignaz Goldziher, Joseph Schacht and G. H. A. Juynboll then showed that chains were tidied up and pushed back in time."},{"t":"The trap","d":"Say the hadith cannot be trusted. Then Islam cannot say its own prayers, fix its pillars, or tell its prophet's life. Say they can be trusted. Then Bukhari's hard reports stand too. Aisha at nine. The spell. Banu Qurayza. Deficient in mind. Both doors cost something."},{"t":"The Muslim answer, at full strength","d":"This is serious work. Each narrator was weighed by his life story, in <i>ilm al-rijal</i>. Chains were cross-checked. Reports carried by many are held to be certain. Muhammad Mustafa al-Azami and Harald Motzki showed that Schacht went too far. Early written notes, such as the <i>sahifa</i> of Hammam ibn Munabbih, push the paper trail back near the first generation. Jonathan Brown notes that the tradition listed false reports itself. And the 600,000 figure counts chain-variants, not separate lies."},{"t":"How strong is this argument?","d":"Strong for you, because it is a trap with no exit. No published answer keeps both halves. Use it gently. Their care with the chains is real, and worth praising before you press."},{"say":true,"t":"What to say","d":"\"Your scholars built a careful science for this. Can I ask what you do with the reports it keeps?\""}],"rewritten":true,"refwhy":{"Luke 1:1-4":"Luke names eyewitnesses and earlier accounts, within a lifetime. One end of the comparison.","1 Corinthians 15:3-8":"A creed handed on within a few years, naming witnesses still alive to ask.","2 Peter 1:16":"'We have not followed cunningly devised fables.' A claim to have been there.","Quran 16:44":"Says the Reminder was sent down so he could make it clear. That is why his words had to be kept.","Quran 33:21":"Calls him the pattern to follow. It is why hadith reliability carries so much weight for Islam.","Sahih al-Bukhari 1":"The first hadith in Bukhari: deeds are judged by intentions. It points at the collection itself.","Sahih Muslim 1":"The opening of the other great collection. Both are named because this case is about them."},"titleLong":"The hadith dilemma: Islam's own chain-of-custody problem"},
{"id":"mariya-hafsa-surah-66","title":"A slave woman in Hafsa's room, then Surah 66","category":"muhammad-test","claim":"Surah 66 opens with Allah rebuking Muhammad: 'O Prophet, why do you prohibit what Allah has made lawful for you, seeking the approval of your wives?' (66:1). It then dissolves his oath (66:2) and warns his wives that if he divorces them Allah will give him better ones (66:5). Sunan an-Nasa'i 3959, graded sahih by al-Albani, supplies the occasion. Muhammad 'had intercourse with' his slave woman, identified in tafsir as Mariya the Copt, in Hafsa's quarters or on her day. Aisha and Hafsa pressed him until he swore Mariya forbidden to himself, whereupon revelation descended freeing him from the oath. An alternative sahih occasion, in Sahih al-Bukhari 4912, involves only honey. Either way the shape matches the Zaynab pattern this site already covers. Heaven steps in, promptly and exactly, to release Muhammad from a bind at home. That is precisely what Aisha noted dryly: 'your Lord hastens to fulfill your wishes'.","quran":["Quran 66:1-5"],"hadith":["Sunan an-Nasa'i 3959","Sahih al-Bukhari 4912"],"bible":["Numbers 30:2","Matthew 5:33-37"],"sources":[{"name":"Sunan an-Nasa'i 3959","type":"primary","url":"https://sunnah.com/nasai:3959"},{"name":"Sahih al-Bukhari 4912 (honey account)","type":"primary","url":"https://sunnah.com/bukhari:4912"},{"name":"Wikipedia — At-Tahrim","type":"institutional","url":"https://en.wikipedia.org/wiki/At-Tahrim"},{"name":"Ask Ghamidi — the Mariya narration discussed","type":"muslim","url":"https://ask.ghamidi.org/forums/discussion/85181/"}],"response":"Muslim scholars overwhelmingly prefer the honey account in Bukhari and Muslim as the surah's occasion, and Ask Ghamidi sets out the reasoning. Aisha herself narrates a jealous scheme about a honey drink at Zaynab's house, and the strongest-authenticated report should fix the context. The Mariya narrations, they argue, are aberrant, or shadhdh, or later conflated accounts. And even if some chain is technically sound, occasion-of-revelation reports are notoriously fluid. On the substance, the surah shows Muhammad's humanity and Allah's correction — he is rebuked, not indulged. And the principle established, that one may not make the lawful unlawful by oath, is sober jurisprudence, with expiation prescribed (66:2), matching Quran 5:89.","responseSource":{"name":"Ask Ghamidi — Narration on Mariya and Surah 66","url":"https://ask.ghamidi.org/forums/discussion/85181/"},"verdict":"contested","rationale":"This is graded contested honestly. The honey narration is the better-attested occasion, and Christians should not overclaim the Mariya version — though al-Albani's sahih grading of Nasa'i 3959 means Muslims cannot simply wave it away either. But even on the most favourable Muslim reading, the pattern stands on the Quran's face. A chapter of eternal scripture is devoted to friction in the household, dissolving his oath and threatening his wives with replacement (66:5). Combined with 33:37 and 33:50-51, already in this app, it exhibits revelation repeatedly bending toward the prophet's personal convenience. The cumulative case, not the single incident, carries the evangelistic weight.","severity":"medium","plain":[{"t":"How the surah opens","d":"Allah rebukes Muhammad: <b>\"O Prophet, why do you prohibit what Allah has made lawful for you, seeking the approval of your wives?\"</b> (Quran 66:1). The oath is then dissolved (66:2). His wives are warned that if he divorces them, Allah will give him better ones (66:5)."},{"t":"The reported occasion","d":"Sunan an-Nasa'i 3959, graded sahih by al-Albani, gives one account. Muhammad was with his slave woman, identified in tafsir as Mariya the Copt, in Hafsa's quarters or on her day. Aisha and Hafsa pressed him until he swore Mariya forbidden to himself. Then revelation came and freed him from the oath. Sahih al-Bukhari 4912 gives a different occasion, involving only honey."},{"t":"The Muslim answer, at full strength","d":"Most scholars prefer the honey account, and Ask Ghamidi sets out why. Aisha herself narrates a scheme about a honey drink at Zaynab's house, in Bukhari and Muslim, and the best-attested report should fix the context. The Mariya reports are treated as aberrant or as later reconstructions. Occasion-of-revelation reports are also fluid. On substance, the surah shows Muhammad's humanity and Allah's correction — he is rebuked, not indulged. And the rule it sets, that you may not make the lawful unlawful by oath, is sober law, with expiation prescribed (66:2; compare 5:89)."},{"t":"Where it stands","d":"Genuinely arguable, and do not overclaim. The honey account is better attested. But al-Albani's grading of Nasa'i 3959 means Muslims cannot simply wave the other away."},{"t":"How strong is this argument?","d":"Use the pattern, not the incident. Even on the friendliest reading, a chapter of eternal scripture handles friction in the household, dissolves an oath, and warns the wives they can be replaced (66:5). Put beside Quran 33:37 and 33:50-51, the cumulative shape is what carries weight."},{"say":true,"t":"What to say","d":"\"Surah 66 settles a quarrel at home. Does it strike you as odd that a scripture does that?\""}],"rewritten":true,"refwhy":{"Numbers 30:2":"Says a man who swears must not break his word. The rule an annulled oath is read against.","Matthew 5:33-37":"'Let your yea be yea.' Jesus on oaths, and why this is about more than one household.","Quran 66:1-5":"The whole passage. The rebuke, the oath dissolved, and the warning that wives can be replaced.","Sunan an-Nasa'i 3959":"From Nasa'i, not one of the two Sahih books. Al-Albani graded it sahih. It gives the Mariya occasion.","Sahih al-Bukhari 4912":"In Bukhari: the honey account. Most scholars prefer this, so do not overclaim the other."},"titleLong":"Mariya, Hafsa, and Surah 66: an oath annulled by revelation"},
{"id":"safiyya-khaybar-marriage","title":"Her husband killed at Khaybar, Safiyya married within days","category":"muhammad-test","claim":"At Khaybar in 628 AD the Muslims killed Kinana ibn al-Rabi. His wife was Safiyya bint Huyayy, a Jewish noblewoman of seventeen. Ibn Ishaq adds that Kinana was first burned to make him reveal treasure, then beheaded (Guillaume, page 515). Her father had already been killed with Banu Qurayza. Safiyya was taken captive and first given to Dihya al-Kalbi, then given to Muhammad (Sahih al-Bukhari 4200). Sahih al-Bukhari 371 records that he took her as wife on the journey home, at Sidd as-Sahba, days after her husband died. The companions asked aloud whether she was wife or slave. Islamic sources present this as honour. The plain sequence is that her husband and father were killed, and she was married within the week. There was no room for free consent, and the mourning rules were set aside. Set this against the test Jesus gave: 'by their fruits you will know them' (Matthew 7:16).","quran":["Quran 33:50"],"hadith":["Sahih al-Bukhari 371","Sahih al-Bukhari 4200"],"bible":["Matthew 7:15-20","2 Samuel 11:26-27; 12:9","1 Thessalonians 4:3-5"],"sources":[{"name":"Sahih al-Bukhari 371","type":"primary","url":"https://sunnah.com/bukhari:371"},{"name":"Sahih al-Bukhari 4200","type":"primary","url":"https://sunnah.com/bukhari:4200"},{"name":"Guillaume, The Life of Muhammad (Ibn Ishaq)","type":"primary","url":"https://archive.org/details/GuillaumeATheLifeOfMuhammad"},{"name":"WikiIslam — Safiyah","type":"apologetics","url":"https://wikiislam.net/wiki/Safiyah"},{"name":"Answering Islam — Muhammad and Safiyya: disregarding the idda","type":"apologetics","url":"https://www.answering-islam.org/Muhammad/Inconsistent/idda_safiyyah.html"}],"response":"Al Hakam and other Muslim writers reply that Safiyya was honoured, not wronged. Muhammad freed her and made her freedom her mahr, raising a captive to be a Mother of the Believers. Later reports show her ex
