<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>Challenging Beliefs — Islam, Examined Against the Bible</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --bg:#0f1116; --side:#0b0d11; --panel:#161a21; --panel2:#12151b; --line:#232833; --line2:#2b313d;
    --ink:#e7e9ec; --muted:#98a0ac; --dim:#565e6b; --gold:#82b1d8; --gold-ink:#0e1116;
    --red:#e0736a; --red-bg:#38221f; --red-cell:#5e2b27; --red-cell-hi:#8a3a32;
    --amber:#cf9a45; --amber-bg:#332a18; --amber-cell:#54431f; --amber-cell-hi:#7d6224;
    --green:#7fb08d; --green-bg:#1d2c26; --green-cell:#27443a;
    --purp:#b394e0; --purp-bg:#2c2440;
    --serif:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif;
    --sans:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  }
  :root[data-theme="light"]{
    --bg:#f3f4f6; --side:#e9ebee; --panel:#ffffff; --panel2:#f7f8fa; --line:#dfe2e7; --line2:#cfd4db;
    --ink:#1b1e23; --muted:#5c6470; --dim:#9aa1ab; --gold:#2f6b9e; --gold-ink:#ffffff;
    --red:#b03a31; --red-bg:#f6e4e2; --red-cell:#e7b6b1; --red-cell-hi:#cc766d;
    --amber:#8a5f0e; --amber-bg:#f3ecd9; --amber-cell:#e4d1a2; --amber-cell-hi:#c6a75e;
    --green:#3e7455; --green-bg:#e3ede6; --green-cell:#b7d1bf;
    --purp:#6b4fa1; --purp-bg:#ece5f6;
  }
  *{box-sizing:border-box}
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6}
  a{color:var(--gold)}
  button{font-family:inherit}
  mark{background:color-mix(in srgb,var(--amber) 30%,transparent);color:inherit;border-radius:2px;padding:0 2px}
  kbd{font-family:var(--mono);font-size:.72rem;background:var(--panel);border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;padding:1px 6px;color:var(--muted)}

  .app{display:grid;grid-template-columns:216px minmax(0,1fr) 280px;min-height:100vh}
  @media (max-width:1020px){.app{grid-template-columns:216px minmax(0,1fr)}.preview{display:none}}
  @media (max-width:720px){.app{grid-template-columns:1fr}.side{position:sticky;top:0;z-index:40;height:auto;border-right:0;border-bottom:1px solid var(--line)}
    .side .nav{display:flex;flex-wrap:wrap;gap:2px;padding:0 10px 10px}.side .nav h5{display:none}.side .sideprog{display:none}}

  /* sidebar */
  .side{background:var(--side);border-right:1px solid var(--line);padding:18px 0;position:sticky;top:0;height:100vh;overflow-y:auto}
  @media (max-width:720px){.side{height:auto;overflow:visible}}
  .logo{font-family:var(--serif);font-size:1rem;letter-spacing:.1em;padding:0 18px 14px;color:var(--ink)}
  .logo b{color:var(--gold)}
  .sidesearch{padding:0 14px 12px}
  .sidesearch input{width:100%;font-family:inherit;font-size:.82rem;padding:7px 12px;border-radius:8px;border:1px solid var(--line2);background:var(--panel);color:var(--ink)}
  .sidesearch input:focus{outline:2px solid var(--gold);outline-offset:1px}
  .info{display:inline-grid;place-items:center;width:14px;height:14px;border:1px solid currentColor;border-radius:50%;font-size:.58rem;font-style:normal;font-weight:700;opacity:.75;cursor:help;position:relative;flex:none}
  .info:hover,.info:focus{opacity:1}
  .info .tip{display:none;position:absolute;left:50%;transform:translateX(-50%);top:160%;width:250px;background:var(--side);color:var(--ink);border:1px solid var(--line2);font-family:var(--sans);font-size:.76rem;line-height:1.5;padding:9px 12px;border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.35);z-index:30;text-transform:none;letter-spacing:0;font-weight:400;text-align:left}
  .info:hover .tip,.info:focus .tip{display:block}
  .badge,.tag{display:inline-flex;align-items:center;gap:5px}
  .nav a{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 18px;font-size:.86rem;color:var(--muted);text-decoration:none;cursor:pointer;border-left:2px solid transparent}
  .nav a:hover{background:var(--panel2);color:var(--ink)}
  .nav a.on{background:var(--panel);color:var(--ink);border-left-color:var(--gold)}
  .nav .cnt{font-family:var(--mono);font-size:.68rem;color:var(--dim)}
  .nav h5{font-size:.64rem;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin:18px 18px 6px;font-weight:600}
  .sideprog{margin:22px 18px 8px;font-size:.72rem;color:var(--muted)}
  .pbar{height:4px;background:var(--line);border-radius:2px;margin-top:6px;overflow:hidden}
  .pbar i{display:block;height:100%;background:var(--gold);transition:width .4s ease}

  /* main */
  .main{padding:18px 26px 80px;min-width:0}
  .cmd{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line2);border-radius:8px;padding:4px 8px 4px 14px;margin-bottom:18px}
  .cmd input{flex:1;background:none;border:0;color:var(--ink);font-family:inherit;font-size:.9rem;padding:7px 0;outline:none}
  .cmd input::placeholder{color:var(--dim)}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:20px}
  .tile{background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:12px 14px;cursor:pointer;text-align:left;color:var(--ink)}
  .tile:hover{border-color:var(--gold)}
  .tile.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
  .tile .v{font-family:var(--serif);font-size:1.7rem;font-variant-numeric:tabular-nums;line-height:1.1}
  .tile .l{font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:2px}
  .tile.t-ad .v{color:var(--purp)}.tile.t-un .v{color:var(--red)}.tile.t-co .v{color:var(--amber)}.tile.t-an .v{color:var(--green)}
  h4.bt{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;font-weight:600}
  .vwall{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:10px;align-items:start}
  @media (max-width:1240px){.vwall{grid-template-columns:1fr 1fr}}
  @media (max-width:700px){.vwall{grid-template-columns:1fr}}
  .vcol{background:var(--panel2);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .vcol header{padding:14px 16px 12px;border-bottom:2px solid var(--line)}
  .vcol.ad header{border-bottom-color:var(--purp)}
  .vcol.ad .n,.vcol.ad .t{color:var(--purp)}
  .vcol.ad .vt:hover{border-left-color:var(--purp)}
  .vcol.un header{border-bottom-color:var(--red)}
  .vcol.co header{border-bottom-color:var(--amber)}
  .vcol.an header{border-bottom-color:var(--green)}
  .vcol header .n{font-family:var(--serif);font-size:1.9rem;line-height:1;font-variant-numeric:tabular-nums}
  .vcol.un .n{color:var(--red)}.vcol.co .n{color:var(--amber)}.vcol.an .n{color:var(--green)}
  .vcol header .t{font-size:.72rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;margin-left:8px}
  .vcol.un .t{color:var(--red)}.vcol.co .t{color:var(--amber)}.vcol.an .t{color:var(--green)}
  .vcol header .d{font-size:.74rem;color:var(--muted);margin-top:4px}
  .vgroup h6{font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:0;padding:10px 16px 4px;font-weight:600}
  .vt{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:9px 16px 9px 13px;cursor:pointer;color:var(--ink);border-left:3px solid transparent}
  .vt:hover,.vt.sel{background:var(--panel)}
  .vt.sel{border-left-color:var(--gold)}
  .vcol.un .vt:hover{border-left-color:var(--red)}
  .vcol.co .vt:hover{border-left-color:var(--amber)}
  .vcol.an .vt:hover{border-left-color:var(--green)}
  .vt.dimmed{opacity:.25}
  .vt h5{font-family:var(--serif);font-weight:500;font-size:.92rem;line-height:1.35;margin:0}
  .vt .m{font-size:.66rem;color:var(--dim);letter-spacing:.05em;text-transform:uppercase;margin-top:2px;display:flex;gap:8px;align-items:center}
  .vt .m .rd{color:var(--green)}
  .vt .m .star{color:var(--gold)}

  /* list */
  .rows{display:flex;flex-direction:column}
  .rowitem{display:grid;grid-template-columns:12px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:11px 6px;cursor:pointer;color:var(--ink)}
  .rowitem:hover,.rowitem.sel{background:var(--panel2)}
  .rowitem .stripe{width:4px;height:26px;border-radius:2px}
  .rowitem.v-unrefuted .stripe{background:var(--red)}
  .rowitem.v-contested .stripe{background:var(--amber)}
  .rowitem.v-answered .stripe{background:var(--green)}
  .rowitem h5{font-family:var(--serif);font-weight:500;font-size:1rem;margin:0;line-height:1.35}
  .rowitem .sub{font-size:.72rem;color:var(--muted)}
  .rowitem .meta{display:flex;gap:8px;align-items:center;font-size:.66rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;white-space:nowrap}
  .rowitem .meta .rd{color:var(--green)}

  .badge{font-size:.64rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:3px 9px;border-radius:999px;display:inline-block}
  .badge.v-admitted{background:var(--purp-bg);color:var(--purp)}
  .badge.v-unrefuted{background:var(--red-bg);color:var(--red)}
  .badge.v-contested{background:var(--amber-bg);color:var(--amber)}
  .badge.v-answered{background:var(--green-bg);color:var(--green)}
  .tag{font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line2);border-radius:999px;padding:2px 9px;display:inline-block}

  /* case view */
  .backbar{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
  .backbar button.bk{background:var(--panel);border:1px solid var(--line2);color:var(--muted);border-radius:8px;padding:6px 13px;font-size:.8rem;cursor:pointer}
  .backbar button.bk:hover{color:var(--ink);border-color:var(--gold)}
  .pathnext{margin-left:auto;background:var(--gold);color:var(--gold-ink);border:0;border-radius:8px;padding:7px 14px;font-size:.8rem;font-weight:700;cursor:pointer}
  .case h2{font-family:var(--serif);font-weight:500;font-size:1.6rem;line-height:1.25;margin:10px 0 14px;max-width:30ch;text-wrap:balance}
  .case .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
  .dlab{font-size:.7rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:26px 0 10px}
  .dlab.red{color:var(--red)}.dlab.blue{color:var(--gold)}
  .claimrow{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(270px,1fr);gap:28px;align-items:start}
  .claimrow.solo{grid-template-columns:1fr}
  @media (max-width:900px){.claimrow{grid-template-columns:1fr}}
  .claim p{font-size:.97rem;line-height:1.75;max-width:66ch;margin:0 0 12px}
  .claimside{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:16px 18px;position:sticky;top:16px}
  .claimside .passcols{grid-template-columns:1fr;gap:12px}
  .claimside .sidenote{font-size:.76rem;color:var(--dim);margin:-4px 0 12px}
  .defense p.lead{margin:0 0 4px}
  .defense p{line-height:1.7;margin:0 0 10px}
  .pts{margin:8px 0 0;padding:0;list-style:none;counter-reset:pt}
  .pts li{position:relative;padding:10px 0 10px 36px;border-top:1px dashed color-mix(in srgb,var(--green) 25%,var(--line));line-height:1.7}
  .pts li:first-child{border-top:0}
  .pts li::before{counter-increment:pt;content:counter(pt);position:absolute;left:0;top:10px;width:23px;height:23px;border-radius:50%;background:var(--green-bg);color:var(--green);display:grid;place-items:center;font-size:.72rem;font-weight:700}
  .vbox p{margin:0 0 8px;line-height:1.7}
  .vbox p:last-child{margin-bottom:0}
  .ref-lds{color:var(--red);font-weight:600}
  .ref-bib{color:var(--gold);font-weight:600}
  .qq{font-family:var(--serif);font-style:italic;background:color-mix(in srgb,var(--amber) 16%,transparent);border-radius:3px;padding:0 3px}
  .kw{font-weight:700;text-decoration:underline;text-underline-offset:2px}
  .talk{background:color-mix(in srgb,var(--green) 8%,var(--panel));border:1px solid color-mix(in srgb,var(--green) 30%,var(--line));border-radius:8px;padding:16px 18px;font-size:.93rem;max-width:80ch}
  .talk p{margin:0 0 8px;line-height:1.7}
  .talk p:last-child{margin-bottom:0}
  .dlg{display:flex;flex-direction:column;gap:10px;max-width:76ch}
  .dlg .msg{border-radius:12px;padding:12px 16px;max-width:88%}
  .dlg .msg p{margin:0;font-size:.9rem;line-height:1.65}
  .dlg .who{display:block;font-size:.64rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin-bottom:4px}
  .dlg .them{align-self:flex-start;background:var(--panel);border:1px solid var(--line2);border-bottom-left-radius:4px}
  .dlg .them .who{color:var(--red)}
  .dlg .you{align-self:flex-end;background:color-mix(in srgb,var(--green) 9%,var(--panel));border:1px solid color-mix(in srgb,var(--green) 30%,var(--line));border-bottom-right-radius:4px}
  .dlg .you .who{color:var(--green)}
  .corelinks{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .corelink{font-size:.78rem;background:var(--panel2);border:1px solid var(--line2);color:var(--gold);border-radius:999px;padding:5px 13px;cursor:pointer;text-align:left}
  .corelink:hover{border-color:var(--gold)}
  .gtab{width:100%;border-collapse:collapse;font-size:.86rem;margin:14px 0 6px}
  .gtab th{text-align:left;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:8px 12px;border-bottom:2px solid var(--line2)}
  .gtab th:nth-child(2){color:var(--red)}
  .gtab th:nth-child(3){color:var(--gold)}
  .gtab td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.55}
  .gtab td:first-child{font-weight:700;white-space:nowrap;color:var(--muted)}
  .dodont{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media (max-width:700px){.dodont{grid-template-columns:1fr}}
  .dodont ul{margin:8px 0 0;padding-left:18px;font-size:.86rem;color:var(--muted)}
  .dodont li{padding:3px 0;line-height:1.55}
  .why{background:color-mix(in srgb,var(--gold) 7%,var(--panel));border:1px solid color-mix(in srgb,var(--gold) 28%,var(--line));border-radius:8px;padding:16px 18px;font-size:.93rem;max-width:80ch}
  .why p{margin:0 0 10px;line-height:1.7}
  .why .wtail{color:var(--muted);font-style:italic;margin-bottom:0;border-top:1px dashed color-mix(in srgb,var(--gold) 30%,var(--line));padding-top:10px}
  .compare2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media (max-width:760px){.compare2{grid-template-columns:1fr}}
  .pane{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
  .pane .ref{font-size:.7rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
  .pane.bom .ref{color:var(--red)}.pane.bible .ref{color:var(--gold)}
  .pane .scripture{font-family:var(--serif);font-size:1rem;line-height:1.65}
  .cnote{font-size:.8rem;color:var(--muted);margin-top:8px;max-width:80ch}
  .passcols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media (max-width:760px){.passcols{grid-template-columns:1fr}}
  .passcols h6{font-size:.68rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin:0 0 8px}
  .passcols .h-bom{color:var(--red)}.passcols .h-bib{color:var(--gold)}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{font-size:.78rem;font-family:var(--serif);border:1px solid var(--line2);background:var(--panel);border-radius:6px;padding:4px 10px;cursor:pointer;color:var(--ink)}
  .chip:hover{border-color:var(--gold)}
  .chip.open{background:var(--amber-bg);border-color:var(--gold)}
  .chip.ext::after{content:" ↗";color:var(--muted);font-family:var(--sans);font-size:.68rem}
  .versebox{grid-column:1/-1;background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:8px;padding:14px 18px;margin-top:4px}
  .versebox .vr{font-size:.7rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-bottom:8px;display:flex;justify-content:space-between}
  .versebox .vr button{background:none;border:0;color:var(--muted);cursor:pointer;font-size:.8rem}
  .versebox .vtext{font-family:var(--serif);font-size:.98rem;line-height:1.7;max-width:72ch}
  .versebox .vnum{font-family:var(--sans);font-size:.62rem;color:var(--muted);vertical-align:super;margin-right:3px}
  .versebox .vwhy{margin-top:10px;font-size:.8rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px;max-width:76ch}
  .versebox .vwhy b{color:var(--gold)}
  .srcdet{margin-top:30px;border-top:1px solid var(--line);padding-top:14px}
  .srcdet summary{font-size:.74rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);cursor:pointer;list-style:none}
  .srcdet summary::before{content:"▸ ";color:var(--gold)}
  .srcdet[open] summary::before{content:"▾ "}
  .srcdet .srcs{margin-top:12px}
  .app.reading{grid-template-columns:216px minmax(0,1fr)}
  .app.reading .preview{display:none}
  body:has(.app.reading) .keysbar{right:0}
  .srcs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
  .srcs li{display:flex;gap:9px;align-items:baseline;font-size:.85rem}
  .sb{flex:none;font-size:.6rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;border-radius:4px;padding:2px 7px;position:relative;top:-1px}
  .sb-scholarly{background:var(--green-bg);color:var(--green)}
  .sb-apologetics{background:var(--amber-bg);color:var(--amber)}
  .sb-primary,.sb-institutional{background:color-mix(in srgb,var(--gold) 16%,transparent);color:var(--gold)}
  .sb-journalism{background:var(--panel);color:var(--muted);border:1px solid var(--line2)}
  .sb-testimony{background:var(--red-bg);color:var(--red)}
  .defense{background:color-mix(in srgb,var(--green) 7%,var(--panel));border:1px solid color-mix(in srgb,var(--green) 30%,var(--line));border-radius:8px;padding:16px 18px;font-size:.92rem;max-width:80ch}
  .defense .dsrc{font-size:.78rem;color:var(--muted);margin-top:10px}
  .vbox{display:flex;gap:12px;align-items:flex-start;border-radius:8px;padding:16px 18px;font-size:.92rem;max-width:80ch}
  .vbox.v-admitted{background:var(--purp-bg)}.vbox.v-unrefuted{background:var(--red-bg)}.vbox.v-contested{background:var(--amber-bg)}.vbox.v-answered{background:var(--green-bg)}
  .vbox b.vb{flex:none;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;padding-top:3px}
  .vbox.v-admitted b.vb{color:var(--purp)}.vbox.v-unrefuted b.vb{color:var(--red)}.vbox.v-contested b.vb{color:var(--amber)}.vbox.v-answered b.vb{color:var(--green)}
  .relrow{display:flex;gap:8px;flex-wrap:wrap}
  .relrow button{font-size:.78rem;background:var(--panel);border:1px solid var(--line2);color:var(--ink);border-radius:999px;padding:5px 13px;cursor:pointer}
  .relrow button:hover{border-color:var(--gold);color:var(--gold)}
  .pinbtn{background:none;border:1px dashed var(--line2);color:var(--muted);border-radius:8px;padding:7px 14px;font-size:.8rem;cursor:pointer}
  .pinbtn:hover{border-color:var(--gold);color:var(--gold)}
  .pinbtn.pinned{border-style:solid;border-color:var(--gold);color:var(--gold)}

  /* glossary tooltip */
  .g{border-bottom:2px dotted var(--gold);cursor:help;position:relative}
  .g .gt{display:none;position:absolute;left:0;top:140%;width:270px;background:var(--side);color:var(--ink);border:1px solid var(--line2);font-family:var(--sans);font-size:.78rem;line-height:1.5;padding:10px 13px;border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.35);z-index:20;font-style:normal;font-weight:400}
  .g:hover .gt,.g:focus .gt{display:block}
  .g .gt b{color:var(--gold)}

  /* preview */

{"id":"quran-affirms-torah-gospel","category":"torah-preservation","severity":"high","verdict":"unrefuted","featured":true,"title":"The cornerstone: the Quran affirms the Scriptures of Muhammad's day","claim":"The Quran repeatedly affirms the Torah and Gospel in circulation during Muhammad's lifetime as authentic, present, and authoritative revelation: it 'confirms what came before it' (Quran 3:3), asks why Jews seek Muhammad's judgment 'while they have the Torah, in which is the judgment of Allah' (5:43 — 'with them,' present tense), commands 'the People of the Gospel' to 'judge by what Allah has revealed therein' (5:46–47), tells Jews and Christians they are 'on nothing' until they uphold the Torah and Gospel (5:68), and instructs Muhammad himself, if in doubt, to 'ask those who have been reading the Scripture before you' (10:94) — while declaring 'none can alter His words' (6:115; 18:27). A corrupted, unreliable Bible cannot be the referent of any of these verses. The tahrif (corruption) doctrine therefore faces a dilemma: corruption BEFORE Muhammad contradicts the Quran; corruption AFTER Muhammad is refuted by surviving manuscripts.","quran":["Quran 3:3","Quran 5:43","Quran 5:46-47","Quran 5:68","Quran 10:94","Quran 6:115","Quran 18:27","Quran 15:9"],"hadith":[],"bible":["Isaiah 40:8","Matthew 24:35"],"sources":[{"name":"Quranic Arabic Corpus — Quran 5:47 (translations)","type":"primary","url":"https://corpus.quran.com/translation.jsp?chapter=5&verse=47"},{"name":"Quran.com — Surah Al-Ma'idah 5:43-68","type":"primary","url":"https://quran.com/en/al-maidah/47-57"},{"name":"Gordon Nickel, Narratives of Tampering in the Earliest Commentaries on the Qur'an (Brill, 2011)","type":"scholarly","url":"https://brill.com/view/title/19538"},{"name":"IslamicDilemma.com — the two-horned argument stated","type":"apologetics","url":"https://islamicdilemma.com/"}],"response":"The mainstream response (IslamQA) is that the Quran confirms the original revealed Torah and Injil, and that by Muhammad's time the circulating texts had already been partially altered — corrupted in places yet still containing truth, which is why the Quran can appeal to what remains without endorsing the whole. A second line argues the Injil is a distinct revelation given to Jesus, not the four Gospels Christians possess. Thus affirmation and corruption coexist: the Quran affirms what is genuinely from Allah within their books while correcting the rest.","responseSource":{"name":"IslamQA — 'Have the Torah and Gospel Been Changed?' (fatwa 2001)","url":"https://islamqa.info/en/answers/2001"},"rationale":"The 'already corrupted by Muhammad's day' response collides with the verses' plain sense: 5:43 says the Torah with them contains Allah's judgment NOW; 5:47 commands present-tense judgment by the Gospel; 10:94 makes prior scripture readers the check on Muhammad's own revelation — all incoherent if those texts were unreliable. The 'lost original Injil' response posits a book with zero historical or manuscript existence, and 5:47 addresses the actual 'People of the Gospel' and what they possess. Neither horn of the dilemma is escaped; the responses relocate the problem rather than resolve it."},
{"id":"tahrif-doctrine-late-development","category":"torah-preservation","severity":"high","verdict":"admitted","title":"Tahrif of the text is a late doctrine: early Islam taught corruption of meaning","claim":"The accusation that the Bible's text was falsified (tahrif al-nass) is not the Quran's teaching nor early Islam's. Gordon Nickel's study of the earliest Quran commentaries (Muqatil ibn Sulayman, 8th c.; al-Tabari, d. 923) shows they understood the tampering verses as misinterpretation, concealment, and mispronunciation by Jews and Christians (tahrif al-mana) — not textual change. Ibn Abbas, cited in Sahih al-Bukhari's Book of Tawhid, said no one can remove the words of Allah from His books; they distort meanings by misinterpretation. The full text-corruption doctrine crystallized only with Ibn Hazm of Cordoba (d. 1064) — four centuries after Muhammad — as a polemical necessity once the contradictions between Bible and Quran were pressed.","quran":["Quran 2:75","Quran 2:79","Quran 3:78","Quran 4:46","Quran 5:13"],"hadith":["Sahih al-Bukhari 7363"],"bible":[],"sources":[{"name":"Gordon Nickel, Narratives of Tampering (Brill, 2011) — review, CMCS Oxford","type":"scholarly","url":"https://www.cmcsoxford.org.uk/resources/book-reviews/nickel-2011-narratives-of-tampering"},{"name":"Nickel, 'Early Muslim Accusations of Tahrif: Muqatil ibn Sulayman's Commentary'","type":"scholarly","url":"https://www.researchgate.net/publication/302189519_Early_muslim_accusations_of_tahrif_Muqatil_ibn_sulayman's_commentary_on_key_qur'anic_verses"},{"name":"Answering Islam — 'Did Ibn Abbas Believe that the Holy Bible was Corrupt?'","type":"apologetics","url":"https://www.answering-islam.org/Quran/Bible/ibnabbas_bukhari.htm"},{"name":"Sunnah.com — Sahih al-Bukhari 7363","type":"primary","url":"https://sunnah.com/bukhari:7363"}],"response":"Muslim apologists reply that tahrif al-nass is not a medieval invention: the Quran itself says 'a party of them used to hear the words of Allah and then distort it' (2:75) and condemns 'those who write the Book with their own hands, then say: this is from Allah' (2:79) — physical writing, not mere misreading. They note the same Ibn Abbas, in Sahih al-Bukhari 7363, says the People of the Book 'changed and altered' their Book and wrote it with their own hands, so early testimony cuts both ways. Ibn Hazm, on this view, systematized rather than invented the doctrine.","responseSource":{"name":"Islamweb — fatwa on judging by the Torah and Gospel","url":"https://www.islamweb.net/en/fatwa/92519/the-quran-ordering-the-jews-and-christians-to-judge-according-to-the-torah-and-the-gospel"},"rationale":"The load-bearing facts are conceded within Islamic sources and academic scholarship: the earliest exegetes overwhelmingly read the tampering verses as distortion of meaning, Bukhari preserves Ibn Abbas denying anyone can change Allah's words in His books, and even Muslim-aware academic reviewers grant that only Ibn Hazm and al-Maqdisi held thoroughgoing textual corruption among classical authorities. Quran 2:79 addresses a party writing false material and selling it — it never claims the Torah's manuscript tradition itself was rewritten, and no early source identifies when, where, or by whom that global rewrite occurred. The doctrine every dawah presentation depends on is historically late."},
{"id":"manuscripts-predate-muhammad","category":"torah-preservation","severity":"high","verdict":"unrefuted","featured":true,"title":"The manuscripts close the trap: the Bible of 600 AD is the Bible of today","claim":"Whatever text the Quran affirmed in Muhammad's day (610–632 AD) is recoverable and identical in substance to today's Bible. The Dead Sea Scrolls (c. 250 BC–70 AD) — including the complete Great Isaiah Scroll, c. 125 BC, with Isaiah 53 intact — predate Muhammad by 700–900 years and substantially match the Masoretic text behind modern Old Testaments. The Septuagint translation dates to the 3rd–2nd c. BC. Codex Sinaiticus and Codex Vaticanus (mid-4th c. AD), each containing the complete New Testament or nearly so, predate Muhammad by ~250 years and are the base of modern critical editions. So the second horn of the dilemma is sealed: no post-Muhammad corruption is possible, because the pre-Muhammad text survives and it is our text.","quran":["Quran 5:48","Quran 10:94"],"hadith":[],"bible":["Isaiah 53:5-6","1 Peter 1:24-25"],"sources":[{"name":"Israel Museum — The Great Isaiah Scroll (digital, c. 125 BCE)","type":"institutional","url":"http://dss.collections.imj.org.il/isaiah"},{"name":"Codex Sinaiticus Project — dating (mid-4th century)","type":"institutional","url":"https://codexsinaiticus.org/en/codex/date.aspx"},{"name":"Leon Levy Dead Sea Scrolls Digital Library (Israel Antiquities Authority)","type":"institutional","url":"https://www.deadseascrolls.org.il/"},{"name":"Anthony Ferguson, 'How Much Can the Most Famous Dead Sea Scroll Prove?' (Text & Canon Institute)","type":"scholarly","url":"https://textandcanon.org/how-much-can-the-most-famous-dead-sea-scroll-prove/"}],"response":"The strongest Muslim reply concedes the manuscripts but redirects: textual stability since 600 AD is irrelevant because the corruption alleged is older than any of these witnesses — the originals of Moses and Jesus were lost or altered in the centuries before Qumran and Sinaiticus, so today's Bible faithfully transmits an already-deviant text. The Dead Sea Scrolls themselves show textual plurality (variant editions of Jeremiah, Samuel), and the NT critical apparatus records hundreds of thousands of variants, proving the transmission was human and fallible, not divinely guarded like the Quran's.","responseSource":{"name":"IslamQA — 'Have the Torah and Gospel Been Changed?'","url":"https://islamqa.info/en/answers/2001"},"rationale":"The redirect works only by impaling itself on the dilemma's first horn: if the Bible was already corrupt centuries before Muhammad, then the Quran's commands to judge by it, its claim that the Torah 'with them' contains Allah's judgment, and its instruction to resolve doubt by asking its readers are commendations of a corrupt book. The variant-plurality point is a category error — no Dead Sea Scroll or NT variant tradition removes the crucifixion, resurrection, or divine sonship the Quran needs absent; those are textually secure across every manuscript stream. The manuscripts leave no window in which the required wholesale corruption could have occurred."},
{"id":"crucifixion-denial-vs-history","category":"jesus-cross","severity":"high","verdict":"unrefuted","featured":true,"title":"Quran 4:157 denies the best-attested fact of Jesus's life","claim":"Quran 4:157 states of the Jews: 'they did not kill him, nor did they crucify him; but another was made to resemble him to them' — a single verse, composed ~600 years after the event and 1,000+ km away, denying an event attested by all four gospels, by pre-Pauline creeds datable to within a few years of the event (1 Corinthians 15:3–8), by the non-Christian historians Josephus (Antiquities 18.3.3) and Tacitus (Annals 15.44), and affirmed as bedrock by effectively the entire spectrum of critical historians. Bart Ehrman (agnostic): 'One of the most certain facts of history is that Jesus was crucified on orders of the Roman prefect of Judea, Pontius Pilate.' Gerd Lüdemann (atheist): 'Jesus' death as a consequence of crucifixion is indisputable.' No historical-method case for the denial exists; it rests solely on the Quran's authority.","quran":["Quran 4:157","Quran 4:158"],"hadith":[],"bible":["1 Corinthians 15:3-8","Mark 15:24-39","John 19:16-30","Luke 23:33-46"],"sources":[{"name":"Reformed Faith & Practice (RTS journal) — Islam's Denial of Jesus' Crucifixion","type":"scholarly","url":"https://journal.rts.edu/article/it-was-made-to-appear-like-that-to-them-islams-denial-of-jesus-crucifixion-in-the-quran-and-dogmatic-tradition/"},{"name":"Berkeley Institute for Islamic Studies — The Crucifixion of Christ in Islam","type":"scholarly","url":"https://bliis.org/essay/the-crucifixion-of-christ-in-islam/"},{"name":"Quran.com — Surah An-Nisa 4:157","type":"primary","url":"https://quran.com/4/157"},{"name":"Stand to Reason — The Quran Gets Crucifixion Wrong","type":"apologetics","url":"https://www.str.org/w/the-quran-gets-crucifixion-wrong"}],"response":"The classical Sunni answer is substitution: Allah cast Jesus's likeness onto another (Judas, Simon of Cyrene, or a volunteer disciple in various tafsir), who was crucified while Allah raised Jesus alive (4:158) — 'it was made to appear so to them' explains precisely why every observer, and thus every historical record, honestly reports a crucifixion; a miracle by definition escapes historical method. The Ahmadiyya instead hold Jesus survived the cross (apparent death), and a minority scholarly stream (documented by Todd Lawson; cf. Mahmoud Ayoub) reads 4:157 as denying only the Jews' boast of agency — 'they did not kill him; God's plan prevailed' — leaving the event itself unaffirmed but undenied.","responseSource":{"name":"About Islam — 'If Jesus Wasn't Crucified… Then Who Was?'","url":"https://aboutislam.net/counseling/ask-about-islam/jesus-between-crucifixion-and-who-was-crucified/"},"rationale":"Substitution is unfalsifiable by design — it concedes all evidence and overrides it with an unwitnessed miracle attested six centuries later, which is an abandonment of historical argument, not an answer to it; it also makes God the author of the deception that founded Christianity. The Lawson/Ayoub minority reading is the intellectually strongest move precisely because it stops denying the event — i.e., it rescues the Quran by surrendering the traditional Islamic claim. As a historical assertion, 4:157 traditionally read stands against the strongest evidence set in ancient history with no counter-evidence whatsoever."},
{"id":"quran-jesus-resume","category":"jesus-cross","severity":"medium","verdict":"contested","title":"Whose resume is that? What the Quran concedes about Jesus","claim":"The Quran itself grants Jesus a profile it gives no one else, including Muhammad: virgin-born (3:47), 'the Messiah, Jesus son of Mary, distinguished in this world and the Hereafter' (3:45), announced as 'a pure boy' — sinless (19:19), worker of miracles including healing the blind and leper and raising the dead (3:49; 5:110), never dead but 'Allah raised him to Himself' — alive in heaven now (4:158), and in Islamic eschatology returning at the end of the age. Muhammad, by contrast, is commanded in the Quran to 'ask forgiveness for your sin' (47:19; 48:2), performs no miracle in the Quran, and is dead in Medina. The Quran's own data points all point to Jesus's uniqueness — then forbid the conclusion they suggest.","quran":["Quran 3:45","Quran 3:47","Quran 3:49","Quran 5:110","Quran 19:19","Quran 4:158","Quran 47:19","Quran 48:2","Quran 3:59"],"hadith":["Sahih al-Bukhari 3448"],"bible":["Luke 1:34-35","John 11:43-44","Hebrews 4:15","Acts 1:9-11"],"sources":[{"name":"Quran.com — Surah Al-Imran 3:45-49","type":"primary","url":"https://quran.com/3/45-49"},{"name":"Catholic Answers — Exposing the 'Muslim Jesus'","type":"apologetics","url":"https://www.catholic.com/magazine/print-edition/exposing-the-muslim-jesus"},{"name":"John Gilchrist — 'The Virgin Birth' (Christ in Islam and Christianity)","type":"apologetics","url":"https://www.answering-islam.org/authors/gilchrist/jesus/chapter4.html"},{"name":"Sunnah.com — Sahih al-Bukhari 3448 (descent of the son of Mary)","type":"primary","url":"https://sunnah.com/bukhari:3448"}],"response":"The Quran pre-empts the inference explicitly: 'The example of Jesus with Allah is like that of Adam; He created him from dust, then said to him: Be, and he was' (3:59) — a fatherless origin proves creative sovereignty, not divinity, else Adam (no father or mother) would be more divine. Every miracle in 3:49 carries the refrain bi-idhnillah, 'by Allah's permission,' marking Jesus as empowered servant, not source; his sinlessness and ascension are honors Allah bestows on whom He wills, and prophets differ in gifts (2:253) without differing in nature. Jesus's greatness is affirmed precisely as the second-greatest of servants — never as God's son, which he himself will disown (5:116–117).","responseSource":{"name":"Omar Suleiman (Yaqeen Institute) — reflection on Quran 3:59","url":"https://quranreflect.com/posts/325"},"rationale":"The Adam analogy and bi-idhnillah refrain are genuine, internally coherent answers to the virgin birth and miracles taken one at a time — this is Islam's best-drilled ground. But the analogy covers only origin: Adam sinned; Jesus is the only figure the Quran calls pure, never depicts sinning, never records dying, titles al-Masih without ever defining it, and stations alive in heaven pending return — while the Quran's final prophet is told twice to seek forgiveness for his sin. The cumulative asymmetry is unanswered as a whole even though each part has a rehearsed reply; hence contested rather than unrefuted, and a door-opener rather than a defeater."},
{"id":"gospel-judgment-test","category":"torah-preservation","severity":"high","verdict":"unrefuted","title":"The test the Quran sets and fails: judge by the Gospel, ask its readers","claim":"The Quran creates a verification procedure and then fails it. Quran 10:94 tells Muhammad: 'If you are in doubt about what We have revealed to you, then ask those who have been reading the Scripture before you' — the Scripture-readers are the arbiter. 5:47 commands: 'Let the People of the Gospel judge by what Allah has revealed therein,' with the warning that whoever does not judge by it is 'defiantly disobedient.' Run the test: the Gospel possessed by every 'People of the Gospel' community in 632 AD — the fourfold Gospel, textually secured by Sinaiticus and Vaticanus two centuries earlier — judges that Jesus was crucified, rose, and is the divine Son. Judging by the Gospel, as commanded, returns a verdict against the Quran that commanded it.","quran":["Quran 10:94","Quran 5:47","Quran 5:46","Quran 29:46"],"hadith":[],"bible":["John 20:28-31","Mark 14:61-64","1 Corinthians 15:3-4","John 3:16"],"sources":[{"name":"Quranic Arabic Corpus — Quran 10:94","type":"primary","url":"https://corpus.quran.com/translation.jsp?chapter=10&verse=94"},{"name":"QuranX — classical tafsirs on 5:47","type":"primary","url":"https://quranx.com/tafsirs/5.47"},{"name":"The Islamic Dilemma (tract summarizing the argument)","type":"apologetics","url":"https://islamicdilemma.com/"},{"name":"Jesus to Muslims — Does the Qur'an refer to the Torah and the Gospel?","type":"apologetics","url":"https://jesustomuslims.org/reach-out/articles/does-quran-refer-torah-and-gospel"}],"response":"Classical tafsir (al-Tabari, Ibn Kathir) reads 10:94 as rhetorical: the address is formally to Muhammad but really to doubters — and the ones to ask are the honest scholars of the Book (like Abdullah ibn Salam) who recognized Muhammad foretold in their texts, not Christians at large on doctrine. On 5:47, the command is to judge by what Allah actually revealed in the Injil — the authentic core, including Muhammad's description and God's law — not by every doctrine the church later layered onto it; a command to use a book's genuine content is not an endorsement of its corruptions. The Injil of the Quran is the revelation given to Jesus, not the four biographical Gospels written by others.","responseSource":{"name":"Islamweb — fatwa 92519 on judging by the Torah and Gospel","url":"https://www.islamweb.net/en/fatwa/92519/the-quran-ordering-the-jews-and-christians-to-judge-according-to-the-torah-and-the-gospel"},"rationale":"Each escape is circular. 'Ask only those who converted' filters the arbiters by agreement with the conclusion, gutting 10:94 as a test; the verse itself specifies no such filter and presupposes the consulted Scripture is reliable. 'Judge by the authentic core' requires a criterion for which Gospel content is authentic, and the only criterion offered is agreement with the Quran — the book under test. And the 'real Injil' is historically empty: no 7th-century community called 'People of the Gospel' possessed any book but the fourfold Gospel, so 5:47's command has no possible referent except the text that refutes the Quran's Christology. The test stands as designed and the Quran fails it."},
{"id":"uthman-burning-companion-codices","category":"quran-text","severity":"medium","verdict":"admitted","title":"Uthman's bonfire: the Quran's own standardization crisis","claim":"The 'perfectly preserved Quran vs. corrupted Bible' contrast fails on Islam's own sources. Sahih al-Bukhari 4987 records that within ~20 years of Muhammad's death, Muslims were 'differing about the Quran as the Jews and Christians differed about their Scripture,' so Caliph Uthman had one recension copied and ordered all other Quranic materials, 'whether written in fragmentary manuscripts or whole copies, be burnt.' Companion codices differed: early Islamic sources report Ibn Masud's codex lacked Surahs 1, 113, and 114 (Bukhari 4977 preserves the dispute), while Ubayy ibn Ka'b's contained two extra surahs; Bukhari 4992 shows companions disputing recitations in Muhammad's lifetime, resolved by the 'seven ahruf' concession. A text preserved by destroying its variant witnesses cannot indict the Bible for having variant witnesses that survived.","quran":["Quran 15:9"],"hadith":["Sahih al-Bukhari 4987","Sahih al-Bukhari 4992","Sahih al-Bukhari 4977","Sahih al-Bukhari 5000"],"bible":[],"sources":[{"name":"Sunnah.com — Sahih al-Bukhari 4987 (Uthman's collection and burning order)","type":"primary","url":"https://sunnah.com/bukhari:4987"},{"name":"Sunnah.com — Sahih al-Bukhari 4977 (the mu'awwidhatayn questioned)","type":"primary","url":"https://sunnah.com/bukhari:4977"},{"name":"Keith E. Small, Textual Criticism and Qur'an Manuscripts (Lexington, 2011)","type":"scholarly","url":"https://en.wikipedia.org/wiki/Textual_Criticism_and_Qur%CA%BC%C4%81n_Manuscripts"},{"name":"Answering Islam — tahrif and preservation double standard","type":"apologetics","url":"https://www.answering-islam.org/Shamoun/tahrif.htm"}],"response":"The best Muslim scholarship (Al-Azami; Yaqeen Institute) argues this proves preservation, not corruption: the Quran was revealed in seven divinely-authorized ahruf (modes), so companion differences were sanctioned variation, not error; Uthman's standardization — done by a committee of memorizers cross-checking against Hafsa's master copy, with community consensus — eliminated only unauthorized or abrogated readings before drift could occur, the opposite of the Bible's uncontrolled copying. Living mass memorization (tawatur) transmitted the text alongside writing, and Yaqeen's analysis finds fewer than 4% of variant readings attributed to companions even have authentic chains.","responseSource":{"name":"Yaqeen Institute — 'The Uthmanic Codex: Understanding How the Quran was Preserved'","url":"https://yaqeeninstitute.org/read/paper/the-uthmanic-codex-understanding-how-the-quran-was-preserved"},"rationale":"Every fact in the claim — the differing recitations, the burning order, the companion codex disputes — sits in Sahih al-Bukhari itself, so the events are conceded; only their interpretation is defended. The ahruf framework is a theological explanation, not a historical control: the ahruf themselves are undefined in the sources, the burned material is unrecoverable by design, and 'the variants were all authorized' is unfalsifiable once the witnesses are ash. The narrow point survives every response: the Quran's uniformity is the product of a documented 7th-century editorial intervention, which forfeits the dawah contrast with a Bible whose variant manuscripts were preserved and can be openly compared."},
{"id":"sanaa-palimpsest-qiraat","category":"quran-text","severity":"medium","verdict":"contested","title":"Sanaa's lower text and the ten readings: one Quran, which one?","claim":"Physical and living evidence confirms the Quran's textual plurality. The Sanaa palimpsest (found 1972, Great Mosque of Sanaa; parchment radiocarbon-dated to the 7th century) has a lower, erased text that diverges from the Uthmanic standard in wording and surah order — the only surviving non-Uthmanic textual tradition, matching reports of companion codices. Today the Quran is printed in multiple canonical readings (qira'at): the Hafs text (most of the world) and Warsh text (North/West Africa) differ in hundreds of places, mostly minor but some changing meaning — e.g., Quran 3:146 qatala ('fought') vs. qutila ('was killed'). Keith Small's manuscript study concludes an early edited form of the consonantal text is recoverable, but the original forms of the text are not. 'Not one dot has changed' is a dawah slogan, not a manuscript finding.","quran":["Quran 15:9","Quran 3:146","Quran 2:132","Quran 19:19"],"hadith":["Sahih al-Bukhari 4992"],"bible":[],"sources":[{"name":"Sanaa manuscript (with Sadeghi & Goudarzi 2012 findings)","type":"scholarly","url":"https://en.wikipedia.org/wiki/Sanaa_manuscript"},{"name":"Keith E. Small, Textual Criticism and Qur'an Manuscripts","type":"scholarly","url":"https://en.wikipedia.org/wiki/Textual_Criticism_and_Qur%CA%BC%C4%81n_Manuscripts"},{"name":"Qira'at — canonical readings, Hafs/Warsh","type":"scholarly","url":"https://en.wikipedia.org/wiki/Qira'at"},{"name":"Sunnah.com — Sahih al-Bukhari 4992 (seven ahruf dispute)","type":"primary","url":"https://sunnah.com/bukhari:4992"}],"response":"Yaqeen Institute's treatment (Khatib & Khan) and Al-Azami's History of the Qur'anic Text answer that the qira'at are not variants in the Western text-critical sense but parallel divinely-revealed recitations within the ahruf, all mass-transmitted from the Prophet, all fitting the Uthmanic skeleton, and all doctrinally identical — differences like qatala/qutila enrich meaning without contradiction, unlike Bible variants that affect whole passages (Mark 16; John 7:53–8:11). The Sanaa lower text is explained as a companion's personal or pre-canonical copy which was properly washed and superseded, showing the community enforcing the standard exactly as the preservation promise (15:9) implies.","responseSource":{"name":"Yaqeen Institute — 'The Origins of the Variant Readings of the Qur'an'","url":"https://yaqeeninstitute.org/read/paper/the-origins-of-the-variant-readings-of-the-quran"},"rationale":"Honest grading cuts both ways. Against the dawah slogan, the claim wins: multiple printed texts with real wording differences exist today, the Sanaa lower text is a physically extant non-Uthmanic Quran, and academic study confirms early editing — so 'letter-perfect, unlike the Bible' is false as stated. But against academic standards, the Quran's transmission is genuinely tight — Sadeghi himself argues the Uthmanic text substantially reflects the Prophet's recitation, and qira'at differences are far smaller than the rhetoric can suggest. The double standard is exposed; wholesale corruption of the Quran is not shown — use this entry to level the playing field, not to mirror the dawah overclaim in reverse."},
{"id":"trinity-father-jesus-mary","category":"doctrine-of-god","severity":"high","verdict":"contested","title":"Does the Quran think the Trinity is Father, Jesus, and Mary?","claim":"Quran 5:116 has Allah interrogate Jesus: 'Did you say to people, take me and my mother as two gods besides Allah?' — the only place the Quran names the members of the alleged Christian godhead, and it names Mary, not the Holy Spirit. No orthodox Christian creed, East or West, ever included Mary in the Trinity. The critique: an omniscient author would refute what the Nicene church actually confessed (one Being, three Persons: Father, Son, Holy Spirit); refuting a Mary-including triad instead is evidence of a human author reflecting garbled or folk Christianity in 7th-century Arabia. Note 5:75 argues Jesus and Mary 'both ate food' — pairing them as the two venerated creatures.","quran":["Quran 5:116","Quran 5:75","Quran 4:171"],"hadith":[],"bible":["Matthew 28:19","2 Corinthians 13:14","John 1:1-3"],"sources":[{"name":"Gabriel Said Reynolds, The Quran and the Bible (2018 commentary on 5:116)","type":"scholarly","url":"https://en.wikipedia.org/wiki/Gabriel_Said_Reynolds"},{"name":"Sam Shamoun, 'The Quran and the Holy Trinity' (Answering Islam)","type":"apologetics","url":"https://answering-islam.org/Shamoun/quran_trinity.htm"},{"name":"WikiIslam — 'Parallelism: Quranic Version of Trinity' (surveys Reynolds, Griffith, Sirry)","type":"journalism","url":"https://wikiislam.net/wiki/Parallelism:_Quranic_Version_of_Trinity"},{"name":"Islamic Awareness — 'Mary, A Part Of Trinity?'","type":"muslim","url":"https://www.islamic-awareness.org/quran/contrad/external/marytrin"}],"response":"Two-tier steelman. (1) Popular: the verse addresses a real heresy — Epiphanius (d. 403) describes the Collyridians, Arabian women who offered cakes to Mary as a goddess; the Quran corrects them, not Nicaea. (2) Academic (stronger — used by Reynolds, Griffith, Sirry, and David Thomas): 5:116 is not a doctrinal report at all but eschatological rhetoric — a warning against the trajectory of excessive veneration of Jesus and Mary (Mariolatry was visibly practiced via icons and 'Theotokos' devotion), giving examples of shirk rather than defining the Trinity.","responseSource":{"name":"Islamic Awareness — 'Mary, A Part Of Trinity?'; David Thomas and Mun'im Sirry","url":"https://www.islamic-awareness.org/quran/contrad/external/marytrin"},"rationale":"The rhetorical-warning reading is a genuine steelman with mainstream academic backing, so 'strawman, full stop' overclaims. But the steelman has costs Muslims rarely price in: there is zero evidence Collyridians existed in 7th-century Hijaz (the sect is attested once, 250 years earlier); much of the classical tafsir tradition read 5:116 as what Christians actually believed, so the 'rhetoric only' reading is partly a modern retreat; and even granting rhetoric, the Quran nowhere states the actual Trinitarian formula (Father, Son, Spirit; one essence) in order to refute it. A book claiming divine omniscience, sent to correct Christians, never once describes correctly the doctrine it condemns. That silence is the enduring point."},
{"id":"trinity-third-of-three","category":"doctrine-of-god","severity":"medium","verdict":"contested","title":"'Allah is the third of three' — tritheism, not the Trinity","claim":"Quran 5:73 condemns those who say 'Allah is the third of three' (thalithu thalatha), and 4:171 commands 'do not say Three.' Orthodox Trinitarianism has never asserted that God is one of three gods — the Athanasian formula is explicitly 'not three Gods, but one God.' 'Third of three' describes tritheism, a position Christians condemn as heresy. The Quran thus anathematizes a numeric polytheism that the church also anathematizes, while never engaging the actual claim: one divine Being eternally existing as three Persons.","quran":["Quran 5:73","Quran 4:171"],"hadith":[],"bible":["Deuteronomy 6:4","Mark 12:29","1 Corinthians 8:6","Matthew 28:19"],"sources":[{"name":"Sidney Griffith, The Bible in Arabic (on 'thalith thalatha' as possibly a Syriac epithet)","type":"scholarly","url":"https://press.princeton.edu/books/paperback/9780691168081/the-bible-in-arabic"},{"name":"Sam Shamoun, 'The Quran and the Holy Trinity'","type":"apologetics","url":"https://answering-islam.org/Shamoun/quran_trinity.htm"},{"name":"IslamQA 243142 — the Trinity the Quran declares false","type":"muslim","url":"https://islamqa.info/en/answers/243142/"}],"response":"Best steelman: (1) 'Third of three' plausibly renders Syriac Christian usage — some Syriac texts call Christ 'thlithaya' (one of three), so the Quran may echo actual Arabic-Christian parlance rather than misdescribe doctrine. (2) Functionally, whatever the creeds say, worshiping three distinct persons is in practice indistinguishable from three gods; the Quran refuses the metaphysical fine print and rejects the arithmetic at its root. (3) Shabir Ally: the verse targets what ordinary Christians effectively believed, and the Trinity's 'one essence' defense is philosophically incoherent anyway, so refuting 'three' suffices.","responseSource":{"name":"IslamQA 243142; Shabir Ally (Let the Quran Speak) on 5:73","url":"https://islamqa.info/en/answers/243142/"},"rationale":"If 'third of three' echoes a Syriac title of Christ, the phrase has a defensible pedigree, and 'your math is still three' is a coherent (if blunt) polemical stance. But the Muslim defense concedes the core observation: the Quran refutes the Trinity only in a form ('three gods') that Christians themselves anathematize, and never once states the actual claim in order to answer it. The Christian can fairly say: my belief has never been addressed by the Quran, only a caricature adjacent to it. The 'deliberate simplification' defense is possible but unevidenced, and equally consistent with an author who knew Christianity only through popular report."},
{"id":"begets-consort-carnal-sonship","category":"doctrine-of-god","severity":"medium","verdict":"contested","title":"'He neither begets nor is born' — refuting a sonship Christians never taught","claim":"Surah 112:3 ('He neither begets nor is born') and 6:101 ('How can He have a son when He has no consort?') attack divine sonship as if it required a female consort and sexual procreation. But the Nicene Creed (325 AD, three centuries before the Quran) had already defined the Son as 'begotten, not made' — eternal generation within the one divine essence, explicitly non-carnal. Christians agree God has no consort and no physical offspring. The Quran's rhetorical question only lands against pagan carnal sonship — evidence its author knew the pagan Arab concept (Allah's 'daughters,' 53:19–21) but not the Christian doctrine it claims to refute.","quran":["Quran 112:1-4","Quran 6:101","Quran 19:88-92","Quran 2:116","Quran 53:19-21"],"hadith":["Sahih al-Bukhari 4974"],"bible":["John 1:14","John 1:18","Hebrews 1:3","Psalm 2:7","Colossians 1:15-17"],"sources":[{"name":"Gabriel Said Reynolds, The Quran and the Bible (on 6:101 and pagan 'daughters of Allah')","type":"scholarly","url":"https://en.wikipedia.org/wiki/Gabriel_Said_Reynolds"},{"name":"Answering Islam — 'The Son of God in the Bible and the Qur'an'","type":"apologetics","url":"https://www.answering-islam.org/Authors/Memsuah/son_of_god_bq.htm"},{"name":"FaithBrowser — 'Can God Have A Son?' (walad/ibn distinction)","type":"muslim","url":"https://www.faithbrowser.com/can-god-have-a-son/"}],"response":"Best steelman: (1) The Quran's polemic uses 'walad' (biological offspring) in most sonship denials — precisely the carnal notion; it targets pagan Arabs who assigned Allah daughters (the 6:100 context is Meccan polytheists), and any Christian who slid toward literalism. (2) Al-Tabari reads 6:101 as a reductio against pagan genealogy for God. (3) Even 'eternal generation' is, on Muslim analysis, an incoherent metaphysical evasion — 'begotten' either means dependency and origination (hence creaturehood) or is empty honorific language; either way tawhid stands and the denial covers every version of sonship (19:92).","responseSource":{"name":"FaithBrowser walad/ibn analysis; Tabari on 6:101","url":"https://www.faithbrowser.com/can-god-have-a-son/"},"rationale":"The context-is-pagans defense for 6:101 is textually respectable, and Christians do deny carnal begetting, so the verses may pass each other rather than collide. But Surah 112 and 2:116 are traditionally read against Christians too, and the Quran's only stated argument against divine sonship anywhere is the absence-of-consort argument plus 'unbefitting' — it never engages eternal generation, the actual 300-year-old Christian position. The criticism is not that the Quran affirms something false, but that it argues against the doctrine's crudest counterfeit and declares victory. Contested because the Muslim can claim the denial is intended exhaustively — but that reading makes the consort argument a non sequitur against the only Christians who existed."},
{"id":"god-is-love-monad","category":"doctrine-of-god","severity":"medium","verdict":"contested","title":"Can a monad be love? Al-Wadud vs. 'God IS love'","claim":"1 John 4:8 makes love God's essence ('God is love'), and love is inherently other-directed — lover, beloved, love. The Trinity grounds this eternally: the Father loves the Son 'before the foundation of the world' (John 17:24). A unitarian monad, by contrast, had no one to love before creation: either love is not essential to Allah (he became loving when he made creatures), or he was eternally self-focused. Corollary: 'Father' is not among the 99 names; Allah is never called Father in the Quran, and love in the Quran is predominantly conditional ('Allah loves those who…' / 'Allah loves not the transgressors' — 2:190; 3:32) — while 5:18 rebukes Jews and Christians for calling themselves children of Allah.","quran":["Quran 11:90","Quran 85:14","Quran 3:31-32","Quran 2:190","Quran 5:18"],"hadith":["Sahih Muslim 2751a"],"bible":["1 John 4:8-10","1 John 4:16","John 17:24","Matthew 6:9","Romans 5:8"],"sources":[{"name":"Haddad & Groothuis, 'Allah, The Trinity, and Divine Love' (Christian Research Institute)","type":"apologetics","url":"https://www.equip.org/articles/allah-the-trinity-and-divine-love/"},{"name":"Sam Shamoun, 'The Trinity and God's Attribute of Love'","type":"apologetics","url":"https://www.answeringislam.org/Responses/Osama/zawadi_trinity_love.htm"},{"name":"Abdullah al Andalusi — 'The fallacies of Dr William Lane Craig's argument for the Trinity'","type":"muslim","url":"https://abdullahalandalusi.com/2013/04/02/the-fallacies-of-dr-william-lane-craigs-argument-for-the-trinity/"}],"response":"Best steelman: (1) Al-Wadud ('The Most Loving') appears twice (11:90; 85:14) — divine love is a real Quranic attribute, and the hadith says His mercy prevails over His wrath; the claim that Islam's God lacks love is simply false. (2) Al Andalusi's rebuttal to Craig: an attribute can be eternal as a disposition without being eternally exercised — Allah is eternally al-Khaliq (Creator) without an eternal creation; likewise eternally loving without an eternal beloved. Demanding eternal actualization of love proves too much (it would require an eternal object of mercy and wrath too). (3) Craig's argument smuggles in a definition of perfect love (self-giving to another person) that begs the question in favor of Trinitarianism.","responseSource":{"name":"Abdullah al Andalusi vs. Craig; Bassam Zawadi","url":"https://abdullahalandalusi.com/2013/04/02/the-fallacies-of-dr-william-lane-craigs-argument-for-the-trinity/"},"rationale":"This is philosophical theology, not documentary fact, and both sides have live moves. The Christian argument has real force: in the Quran love is never predicated of God's essence ('Allah IS love' appears nowhere), is characteristically conditional on obedience (3:31), and 'Father' — the Bible's central relational name — is absent and its use denied (5:18). But the disposition/actualization distinction is a serious answer Craig's argument must work to defeat. Honest grade: the comparative textual claim (the Bible makes love essential and eternally actual in a way the Quran does not) holds; the philosophical claim (a monad cannot be perfectly loving) is contested."},
{"id":"best-of-deceivers","category":"doctrine-of-god","severity":"medium","verdict":"contested","title":"Allah as khayru al-makirin — 'best of deceivers'?","claim":"Quran 3:54 and 8:30 call Allah 'khayru al-makirin' — from the root m-k-r, which in classical Arabic lexicons (Lane, Lisan al-Arab) denotes scheming, guile, deception. 3:54 is precisely the crucifixion context: Allah's makr answers the Jews' makr, with 4:157's 'it was made to appear so to them' as the payoff — a mass deception that spawned what Islam calls Christianity's central error. The Bible by contrast asserts God 'cannot lie' (Titus 1:2; Numbers 23:19). If salvation history's biggest deception (a faked crucifixion) is Allah's own makr, the character of Islam's God differs fundamentally from the Bible's.","quran":["Quran 3:54","Quran 8:30","Quran 7:99","Quran 4:157","Quran 10:21"],"hadith":[],"bible":["Titus 1:2","Numbers 23:19","Hebrews 6:18","John 14:6"],"sources":[{"name":"WikiIslam — 'Allah, the Best Deceiver (Quran 3:54)' — lexical survey","type":"journalism","url":"https://wikiislam.net/wiki/Allah,_the_Best_Deceiver_(Qur%27an_3:54)"},{"name":"David Wood — 'Is Allah the Best of Deceivers?'","type":"apologetics","url":"http://www.answeringmuslims.com/2014/03/is-allah-best-of-deceivers.html"},{"name":"Islamweb Fatwa 295183 — 'Refuting the allegation that Allah deceives people'","type":"muslim","url":"https://www.islamweb.net/en/fatwa/295183/"}],"response":"Best steelman: (1) Makr means a hidden stratagem, morally neutral in itself — its value depends on its object. Allah's makr is always retributive: he out-plans plotters to protect the innocent (here, saving Jesus from murder). 'Best of planners' is thus not euphemism but ethics. (2) Quranic usage of makr for Allah is always responsive to human makr (3:54; 8:30; 10:21) — never initiated against the sincere. (3) Tu quoque with teeth: the Bible has God sending 'a lying spirit' (1 Kings 22:22–23), 'a strong delusion so they believe the lie' (2 Thessalonians 2:11), and deceiving prophets (Ezekiel 14:9) — if makr indicts Allah, these indict Yahweh.","responseSource":{"name":"Islamweb fatwa 295183; Discover The Truth response citing Badawi","url":"https://www.islamweb.net/en/fatwa/295183/"},"rationale":"Lexically the critics are on firm ground — makr is consistently negative of humans in the Quran itself (35:43 'evil makr'), and sanitized translations ('best of planners') are apologetically motivated. But the theological indictment is weaker than the lexical point: retributive counter-scheming is defensible divine behavior, and the biblical counter-texts show Christians must themselves distinguish judicial deception of the wicked from essential untruthfulness. Where the argument retains bite is 4:157: on mainstream tafsir, Allah's stratagem produced a false appearance that deceived Jesus's own sincere followers, founding six centuries of what Islam calls error — a judicial deception of the sincere, which the biblical parallels do not match. Strongest as a companion to the crucifixion-denial entry."},
{"id":"word-and-spirit-titles","category":"jesus-cross","severity":"medium","verdict":"contested","title":"'His Word and a Spirit from Him' — the Quran's uniquely exalted Jesus","claim":"Quran 4:171 calls Jesus 'the Messenger of Allah and His Word (kalimatuhu) which He cast to Mary, and a Spirit from Him (ruhun minhu)' — titles given to no other figure in the Quran, not even Muhammad. Bukhari 3286 adds that every newborn is touched by Satan except Mary and her son. The Quran's own Christology keeps gesturing above prophet-rank — Word, Spirit, sinless, virgin-born, alive in heaven, returning — while its theology forbids the conclusion, echoing John 1's 'the Word became flesh' in the very act of denying it.","quran":["Quran 4:171","Quran 3:45-49","Quran 19:19","Quran 21:91","Quran 3:55","Quran 43:61"],"hadith":["Sahih al-Bukhari 3435","Sahih al-Bukhari 3286"],"bible":["John 1:1-3","John 1:14","Hebrews 4:15","Luke 1:35"],"sources":[{"name":"Sam Shamoun — 'The Quran on Jesus as the Preexistent Spirit of Allah'","type":"apologetics","url":"https://answering-islam.org/Shamoun/jesus_spirit.htm"},{"name":"QuranX — classical tafsir on 4:171 (Ibn Kathir, Jalalayn, Maududi)","type":"muslim","url":"https://quranx.com/tafsirs/4.171"},{"name":"Gabriel Said Reynolds, The Quran and the Bible (on the Christian resonance of kalima)","type":"scholarly","url":"https://en.wikipedia.org/wiki/Gabriel_Said_Reynolds"}],"response":"Best steelman (from the tafsir tradition itself): 'His Word' means Jesus was created by Allah's word 'Be' (kun) — 3:59 makes this explicit and levels it with Adam, who had no father or mother; miraculous origin proves creaturehood, not divinity. 'A spirit from Him' parallels 'from Him' language used of everything (45:13); 'min' denotes origin, not consubstantiality. The titles are honorifics within 4:171's own explicit ceiling: 'the Messiah is only a messenger… do not say Three.' The verse deploys Christian vocabulary precisely to deflate it.","responseSource":{"name":"Ibn Kathir and Jalalayn on 4:171; Maududi, Tafhim","url":"https://quranx.com/tafsirs/4.171"},"rationale":"The Muslim reading is internally coherent — 3:59 gives the Quran's own gloss. But it under-explains the data: everything is created by 'Be' (2:117), yet only Jesus is CALLED 'His Word'; the Adam parallel actually cuts against 6:101's no-consort argument (miraculous fatherless origination is apparently fine when Allah wills it); and the cumulative profile is one the Quran never paints of Muhammad. The Quran inherits Johannine vocabulary (Logos) stripped of the theology that generated it — which is what borrowing from a Christian milieu without its doctrinal grammar looks like. No formal contradiction, but a standing internal tension resolved only by stipulation."},
{"id":"clay-birds-apocrypha","category":"quran-text","severity":"high","verdict":"unrefuted","featured":true,"title":"The cradle speech and the clay birds: apocrypha as history","claim":"The Quran's two signature Jesus miracles absent from the canonical gospels both have documented literary ancestors in Christian apocrypha. (1) The child Jesus forming birds from clay and breathing life into them (3:49; 5:110) parallels the Infancy Gospel of Thomas 2:1–5 (Greek, mid-2nd century — a legend cycle in which boy Jesus also strikes playmates dead). (2) Jesus speaking from the cradle (19:29–33; 3:46) parallels the Arabic Infancy Gospel ('Jesus spoke when he was in the cradle: I am the Son of God…'), a Syriac-derived compilation of the 5th–6th century. Both apocrypha predate the Quran by centuries and circulated in Syriac/Arabic Christian milieus. The Quran presents legendary material composed 100–500 years after Jesus as historical revelation — exactly what a 7th-century author absorbing local Christian folklore would produce.","quran":["Quran 3:46","Quran 3:49","Quran 5:110","Quran 19:29-33","Quran 25:4-5"],"hadith":[],"bible":["John 2:11","Luke 2:52","John 20:30-31"],"sources":[{"name":"Austin DeArmond — 'Jesus, the Clay Birds, and the Quran' (survey of the IGT dependence)","type":"scholarly","url":"https://austind90.org/wp-content/uploads/2011/05/infancy-gospel-of-thomas-and-the-quran.pdf"},{"name":"Gabriel Said Reynolds, The Quran and the Bible (concedes the apocryphal parallels)","type":"scholarly","url":"https://en.wikipedia.org/wiki/Gabriel_Said_Reynolds"},{"name":"Infancy Gospel of Thomas — dating and transmission","type":"scholarly","url":"https://en.wikipedia.org/wiki/Infancy_Gospel_of_Thomas"},{"name":"Islamweb Fatwa 367270 — 'Quran does not use stories from any past Books'","type":"muslim","url":"https://www.islamweb.net/en/fatwa/367270/"}],"response":"Best steelman: (1) Parallel is not dependence — a shared story can mean the apocryphon preserved a genuine historical event the canonical gospels omitted (John 21:25 admits Jesus did many unrecorded things); the Quran, as revelation, confirms the true kernel and corrects the legend's distortions (adding 'by Allah's leave' to guard tawhid, dropping the morally troubling elements). (2) The direction of correction is telling: random borrowing wouldn't sanitize. (3) Some Muslim writers embrace the parallel as vindication: an unlettered Meccan trader could not have accessed Greek/Syriac apocrypha, so agreement with ancient Christian tradition evidences revelation.","responseSource":{"name":"Islamweb fatwa 367270","url":"https://www.islamweb.net/en/fatwa/367270/"},"rationale":"The parallels are conceded by all parties — the debate is only over direction. The 'apocrypha preserved real events' defense is unfalsifiable and evidentially empty: no historian treats the IGT or the Arabic Infancy Gospel as history, and the cradle-speech carries its source's fingerprint — in the Arabic Infancy Gospel the infant says 'I am the Son of God'; in the Quran the same scene is repurposed to say the opposite. The 'unlettered trader' argument fails on the texts' known circulation in Syriac Christian Arabia and on oral transmission — the Quran itself records the accusation that Muhammad heard 'tales of the ancients dictated morning and evening' (25:4–5). Mainstream scholarship's sober conclusion stands: the Quran retells late Christian folklore as fact."},
{"id":"son-of-god-divine-claims","category":"jesus-cross","severity":"high","verdict":"contested","title":"What 'Son of God' meant — and the divine claims the Quran never addresses","claim":"The Quran attacks a 'Son of God' its interlocutors never held (physical offspring), while the actual biblical claim goes unaddressed: 'Son of God' is a royal-divine title (Psalm 2:7) that in Jesus's usage asserted equality with God — John 5:18: the Jews sought to kill him because 'he was even calling God his own Father, making himself equal with God.' Jesus's own claims: 'Before Abraham was, I am' (John 8:58, met with attempted stoning); Mark 14:61–64 — 'I am, and you will see the Son of Man seated at the right hand of Power and coming with the clouds of heaven' (Daniel 7), ruled capital blasphemy; John 20:28 — Thomas's 'My Lord and my God,' blessed, not rebuked. Every one of these texts exists in manuscripts predating Islam by 200–450 years (P66/P75 c. 200 AD; Sinaiticus/Vaticanus 4th c.) — whatever one thinks of their truth, the CLAIMS demonstrably predate the Quran's denial of them.","quran":["Quran 9:30","Quran 5:17","Quran 5:72","Quran 19:88-92","Quran 4:171"],"hadith":["Sahih al-Bukhari 3445"],"bible":["Psalm 2:7","John 5:18","John 8:58-59","John 10:30-33","Mark 14:61-64","John 20:28-29","Philippians 2:6-11","Daniel 7:13-14"],"sources":[{"name":"Answering Islam — 'The Son of God in the Bible and the Qur'an'","type":"apologetics","url":"https://www.answering-islam.org/Authors/Memsuah/son_of_god_bq.htm"},{"name":"Sam Shamoun — 'An Examination of John 1:1, 8:58 and Colossians 2:9'","type":"apologetics","url":"https://www.answering-islam.org/Shamoun/christology.htm"},{"name":"Islam Reigns — 'Refuting the Divinity of Jesus: Analysis of John 8:58'","type":"muslim","url":"https://islamreigns.wordpress.com/2017/04/05/refuting-the-divinity-of-jesus-analysis-of-john-858-before-abraham-was-i-am/"}],"response":"Best steelman (Shabir Ally / Zawadi-style): (1) 'Son of God' is demonstrably metaphorical throughout the Bible — Adam (Luke 3:38), Israel (Exodus 4:22), David (Psalm 2:7 at coronation), peacemakers (Matthew 5:9). (2) John 8:58's 'ego eimi' is not the divine name: Exodus 3:14 LXX renders the name as 'ho on,' and the healed blind man says 'ego eimi' in John 9:9. (3) The strongest claims cluster in John, the latest gospel, reflecting developed church theology — the Synoptic Jesus prays, calls the Father 'the only true God' (John 17:3), disclaims omniscience (Mark 13:32). (4) Mark 14:62's exaltation claim is one a Jewish agent of God could make; blasphemy verdicts were elastic. (5) Jesus never says 'I am God; worship me.'","responseSource":{"name":"Islam Reigns analysis of John 8:58; Shabir Ally debates","url":"https://islamreigns.wordpress.com/2017/04/05/refuting-the-divinity-of-jesus-analysis-of-john-858-before-abraham-was-i-am/"},"rationale":"The historical-critical retreat ('John is late theology') is a real argument with academic support — but it is Pyrrhic for a Muslim, conceding the gospels say what Christians say they say and rescuing Islam only by adopting a source-critical skepticism the Quran never licenses (it tells Christians to judge by their Gospel, 5:47). The narrower rebuttals are weak: the ego-eimi deflation ignores the immediate stoning attempt (8:59) and the absolute tenseless construction; the Mark 14 deflation must explain a capital blasphemy verdict; John 20:28 has no deflationary reading (vocative 'my Lord and my God' addressed TO Jesus, who blesses rather than corrects). And the manuscript point is untouched: the divine claims predate Islam in surviving physical copies. Contested, leaning heavily against the Muslim position on the documentary question."},
{"id":"quran-never-quotes-scriptures","category":"quran-text","severity":"high","verdict":"unrefuted","title":"Confirming scriptures it never quotes","claim":"The Quran claims to confirm (musaddiq) the Torah and Gospel (2:97; 3:3; 5:48; 46:12) — yet in 6,236 verses it contains essentially zero verbatim quotations of the texts it confirms. The single near-exception: 21:105, 'We wrote in the Zabur… My righteous servants shall inherit the earth' ≈ Psalm 37:29. Its biblical narratives arrive garbled through midrash and apocrypha (Cain's raven from Pirke de-Rabbi Eliezer, 5:31; the fiery-furnace Abraham from midrash, 21:68–69; Mary confused with Miriam sister of Aaron, 19:28). Contrast: the New Testament quotes the Old Testament ~300 times explicitly — that is what 'confirming previous scripture' looks like. Sidney Griffith's scholarship confirms no written Arabic Bible existed before Islam; the Quran's biblical knowledge is oral and homiletic — consistent with Muhammad's documented contacts (Waraqa ibn Nawfal, Khadija's Christian cousin who 'used to write the Gospel in Arabic' — Bukhari 3) and the accusation recorded in 25:4–5.","quran":["Quran 3:3","Quran 5:48","Quran 21:105","Quran 25:4-5","Quran 19:28","Quran 5:31","Quran 7:157"],"hadith":["Sahih al-Bukhari 3","Sahih al-Bukhari 7361"],"bible":["Psalm 37:29","Matthew 5:17","Luke 24:44","2 Timothy 3:16"],"sources":[{"name":"Sidney Griffith, The Bible in Arabic (Princeton, 2013)","type":"scholarly","url":"https://press.princeton.edu/books/paperback/9780691168081/the-bible-in-arabic"},{"name":"William Campbell — 'What the Qur'an Says About the Bible'","type":"apologetics","url":"https://www.answering-islam.org/Campbell/s2c1.html"},{"name":"Zabur — the 21:105/Psalm 37:29 correspondence","type":"scholarly","url":"https://en.wikipedia.org/wiki/Zabur"},{"name":"Islamweb Fatwa 367270","type":"muslim","url":"https://www.islamweb.net/en/fatwa/367270/"}],"response":"Best steelman: (1) The Quran is not a commentary but a fresh revelation from the same source — musaddiq means it confirms the previous revelations' divine origin and core message (tawhid, judgment, the prophets), not their surviving letter; quotation is neither promised nor needed. (2) It does engage biblical content: 21:105 quotes the Psalms by name and gets it right; 7:157 says Muhammad is 'written with them in the Torah and the Gospel'; 48:29 paraphrases the seed parable 'as its likeness in the Gospel.' (3) Arguing from silence is weak: the audience was largely pagan Meccans — extended quotation of texts unavailable in Arabic would have served no rhetorical purpose. (4) Retelling with variation is the Quran's stated method (12:3); divergence from midrash-contaminated tellings is correction, not error.","responseSource":{"name":"Islamweb fatwa 367270; Ibn Kathir on musaddiq (3:3)","url":"https://www.islamweb.net/en/fatwa/367270/"},"rationale":"The core datum is undisputed: zero verbatim quotations of Torah or Gospel text in the entire Quran, one loose Psalm citation. The responses explain why this might be acceptable; none disputes that it is so — and the explanations strain against the Quran's own posture: it stakes its authenticity on continuity with prior scripture (10:94; 5:47) yet demonstrates no direct acquaintance with either text, while showing detailed acquaintance with post-biblical legend. The 7:157 counter-example sharpens the problem: the Quran asserts Muhammad is 'written in' books it never quotes, and fourteen centuries of apologetics has not produced the passage. Griffith's finding is the naturalistic explanation sitting in plain sight."},
{"id":"injil-problem","category":"quran-text","severity":"high","verdict":"unrefuted","featured":true,"title":"The Injil problem: the book nobody has ever seen","claim":"The Quran speaks of 'the Injil' as a single book Allah gave TO Jesus (5:46; 57:27), which mainstream Islam claims was later lost or corrupted, the four gospels being unreliable human residue. The problems: (1) No trace of any such book exists — no manuscript, no fragment, no citation by any ancient author, friend or enemy, in the seven centuries between Jesus and Muhammad. From the earliest records, 'gospel' (euangelion) was the proclamation ABOUT Jesus, and the written gospels are biographies about him — a category the Quran appears to misunderstand. (2) The Quran itself forecloses the lost-book escape: 5:47 commands 'let the People of the Gospel judge by what Allah has revealed IN IT' — a present-tense command in 610–632 AD, presupposing the Injil then in Christian hands (demonstrably the four gospels, complete in 4th-century codices) was extant and authoritative. Either the gospels Christians possessed were trustworthy (then Islam's Christology is falsified by them) or they were corrupt (then Allah commanded people to judge by a corrupted book he was simultaneously confirming).","quran":["Quran 5:46-48","Quran 5:66","Quran 5:68","Quran 7:157","Quran 10:94","Quran 57:27","Quran 3:3"],"hadith":[],"bible":["Mark 1:1","Luke 1:1-4","Romans 1:1-4","1 Corinthians 15:1-8","Galatians 1:8-9"],"sources":[{"name":"Stand to Reason — 'Is the Quran's Injil the Same as the New Testament Gospels?'","type":"apologetics","url":"https://www.str.org/w/is-the-quran-s-injil-the-same-as-the-new-testament-gospels-"},{"name":"Gordon Nickel, Narratives of Tampering (early tafsir did not read tahrif as textual corruption)","type":"scholarly","url":"https://www.answering-islam.org/authors/shamoun/gordon_nickel.html"},{"name":"Gospel in Islam (overview of the Muslim doctrine)","type":"scholarly","url":"https://en.wikipedia.org/wiki/Gospel_in_Islam"},{"name":"V.A. Mohamad Ashrof — 'The Myth of the Lost Book of Injeel' (Muslim concession)","type":"muslim","url":"https://www.newageislam.com/interfaith-dialogue/myth-lost-book-injeel-quranic-canonical-gospels/d/138494"}],"response":"Best steelman, two incompatible lines: (1) Mainstream: the original Injil was Allah's verbal revelation to Jesus, transmitted in his preaching; it survives partially WITHIN the four gospels but entangled with human narrative — tahrif. 5:47 commands Christians to judge by what remains of the genuine revelation within their books, which Muslims argue vindicates Islam. The absence of a separate manuscript is expected: it was lost early, which is the whole point of sending the Quran. (2) Revisionist (Ashrof and other modernists): concede the lost-book thesis is a myth — the Quran's Injil simply IS the gospel possessed by 7th-century Christians, treated as containing genuine revelation; the corruption verses target misinterpretation and concealment, not textual loss — a reading with early-tafsir support per Nickel.","responseSource":{"name":"IslamQA on previous scriptures; Ashrof, 'The Myth of the Lost Book of Injeel'","url":"https://www.newageislam.com/interfaith-dialogue/myth-lost-book-injeel-quranic-canonical-gospels/d/138494"},"rationale":"The dilemma survives because the two Muslim steelmen refute each other. The 'lost original' view has literally zero historical evidence — no source in any century attests a revealed book given to Jesus; it is an anachronism projected backward from the Quran's assumption that every prophet gets a book. The revisionist view fits the Quranic data far better and has early-tafsir support — but at the price of authenticating the four gospels Christians actually held in 610 AD, whose text is fixed by 4th-century codices and which teach the incarnation, crucifixion, and resurrection the Quran denies. There is no third option. Fourteen centuries in, no Muslim can produce, describe, date, or quote the 'real Injil.' Arguably the sharpest internal-consistency problem in the Quran's engagement with Christianity."},
