ot judge by what Allah has revealed - then it is those who are the defiantly disobedient"},{"v":48,"t":"And We have revealed to you, [O Muhammad], the Book in truth, confirming that which preceded it of the Scripture and as a criterion over it. So judge between them by what Allah has revealed and do not follow their inclinations away from what has come to you of the truth. To each of you We prescribed a law and a method. Had Allah willed, He would have made you one nation [united in religion], but [He intended] to test you in what He has given you; so race to [all that is] good. To Allah is your return all together, and He will [then] inform you concerning that over which you used to differ"}]},"Quran 5:66":{"ref":"Surah Al-Ma'idah (5)","verses":[{"v":66,"t":"And if only they upheld [the law of] the Torah, the Gospel, and what has been revealed to them from their Lord, they would have consumed [provision] from above them and from beneath their feet. Among them are a moderate community, but many of them - evil is that which they do"}]},"Quran 57:27":{"ref":"Surah Al-Hadid (57)","verses":[{"v":27,"t":"Then We sent following their footsteps Our messengers and followed [them] with Jesus, the son of Mary, and gave him the Gospel. And We placed in the hearts of those who followed him compassion and mercy and monasticism, which they innovated; We did not prescribe it for them except [that they did so] seeking the approval of Allah. But they did not observe it with due observance. So We gave the ones who believed among them their reward, but many of them are defiantly disobedient"}]},"Mark 1:1":{"ref":"Mark 1","verses":[{"v":1,"t":"The beginning of the gospel of Jesus Christ, the Son of God;"}]},"Luke 1:1-4":{"ref":"Luke 1","verses":[{"v":1,"t":"Forasmuch as many have taken in hand to set forth in order a declaration of those things which are most surely believed among us,"},{"v":2,"t":"Even as they delivered them unto us, which from the beginning were eyewitnesses, and ministers of the word;"},{"v":3,"t":"It seemed good to me also, having had perfect understanding of all things from the very first, to write unto thee in order, most excellent Theophilus,"},{"v":4,"t":"That thou mightest know the certainty of those things, wherein thou hast been instructed."}]},"Romans 1:1-4":{"ref":"Romans 1","verses":[{"v":1,"t":"Paul, a servant of Jesus Christ, called to be an apostle, separated unto the gospel of God,"},{"v":2,"t":"(Which he had promised afore by his prophets in the holy scriptures,)"},{"v":3,"t":"Concerning his Son Jesus Christ our Lord, which was made of the seed of David according to the flesh;"},{"v":4,"t":"And declared to be the Son of God with power, according to the spirit of holiness, by the resurrection from the dead:"}]},"1 Corinthians 15:1-8":{"ref":"1 Corinthians 15","verses":[{"v":1,"t":"Moreover, brethren, I declare unto you the gospel which I preached unto you, which also ye have received, and wherein ye stand;"},{"v":2,"t":"By which also ye are saved, if ye keep in memory what I preached unto you, unless ye have believed in vain."},{"v":3,"t":"For I delivered unto you first of all that which I also received, how that Christ died for our sins according to the scriptures;"},{"v":4,"t":"And that he was buried, and that he rose again the third day according to the scriptures:"},{"v":5,"t":"And that he was seen of Cephas, then of the twelve:"},{"v":6,"t":"After that, he was seen of above five hundred brethren at once; of whom the greater part remain unto this present, but some are fallen asleep."},{"v":7,"t":"After that, he was seen of James; then of all the apostles."},{"v":8,"t":"And last of all he was seen of me also, as of one born out of due time."}]},"Galatians 1:8-9":{"ref":"Galatians 1","verses":[{"v":8,"t":"But though we, or an angel from heaven, preach any other gospel unto you than that which we have preached unto you, let him be accursed."},{"v":9,"t":"As we said before, so say I now again, If any man preach any other gospel unto you than that ye have received, let him be accursed."}]},"Quran 18:86":{"ref":"Surah Al-Kahf (18)","verses":[{"v":86,"t":"Until, when he reached the setting of the sun, he found it [as if] setting in a spring of dark mud, and he found near it a people. Allah said, \"O Dhul-Qarnayn, either you punish [them] or else adopt among them [a way of] goodness"}]},"Quran 18:90":{"ref":"Surah Al-Kahf (18)","verses":[{"v":90,"t":"Until, when he came to the rising of the sun, he found it rising on a people for whom We had not made against it any shield"}]},"Quran 36:38-40":{"ref":"Surah Ya-Sin (36)","verses":[{"v":38,"t":"And the sun runs [on course] toward its stopping point. That is the determination of the Exalted in Might, the Knowing"},{"v":39,"t":"And the moon - We have determined for it phases, until it returns [appearing] like the old date stalk"},{"v":40,"t":"It is not allowable for the sun to reach the moon, nor does the night overtake the day, but each, in an orbit, is swimming"}]},"Quran 86:5-7":{"ref":"Surah At-Tariq (86)","verses":[{"v":5,"t":"So let man observe from what he was created"},{"v":6,"t":"He was created from a fluid, ejected"},{"v":7,"t":"Emerging from between the backbone and the ribs"}]},"Quran 23:12-14":{"ref":"Surah Al-Mu'minun (23)","verses":[{"v":12,"t":"And certainly did We create man from an extract of clay"},{"v":13,"t":"Then We placed him as a sperm-drop in a firm lodging"},{"v":14,"t":"Then We made the sperm-drop into a clinging clot, and We made the clot into a lump [of flesh], and We made [from] the lump, bones, and We covered the bones with flesh; then We developed him into another creation. So blessed is Allah, the best of creators"}]},"Quran 22:5":{"ref":"Surah Al-Hajj (22)","verses":[{"v":5,"t":"O People, if you should be in doubt about the Resurrection, then [consider that] indeed, We created you from dust, then from a sperm-drop, then from a clinging clot, and then from a lump of flesh, formed and unformed - that We may show you. And We settle in the wombs whom We will for a specified term, then We bring you out as a child, and then [We develop you] that you may reach your [time of] maturity. And among you is he who is taken in [early] death, and among you is he who is returned to the most decrepit [old] age so that he knows, after [once having] knowledge, nothing. And you see the earth barren, but when We send down upon it rain, it quivers and swells and grows [something] of every beautiful kind"}]},"Quran 75:37-39":{"ref":"Surah Al-Qiyamah (75)","verses":[{"v":37,"t":"Had he not been a sperm from semen emitted"},{"v":38,"t":"Then he was a clinging clot, and [Allah] created [his form] and proportioned [him]"},{"v":39,"t":"And made of him two mates, the male and the female"}]},"Quran 66:12":{"ref":"Surah At-Tahrim (66)","verses":[{"v":12,"t":"And [the example of] Mary, the daughter of 'Imran, who guarded her chastity, so We blew into [her garment] through Our angel, and she believed in the words of her Lord and His scriptures and was of the devoutly obedient"}]},"Quran 3:35-36":{"ref":"Surah Ali 'Imran (3)","verses":[{"v":35,"t":"[Mention, O Muhammad], when the wife of 'Imran said, \"My Lord, indeed I have pledged to You what is in my womb, consecrated [for Your service], so accept this from me. Indeed, You are the Hearing, the Knowing"},{"v":36,"t":"But when she delivered her, she said, \"My Lord, I have delivered a female.\" And Allah was most knowing of what she delivered, \"And the male is not like the female. And I have named her Mary, and I seek refuge for her in You and [for] her descendants from Satan, the expelled [from the mercy of Allah]"}]},"Exodus 15:20":{"ref":"Exodus 15","verses":[{"v":20,"t":"And Miriam the prophetess, the sister of Aaron, took a timbrel in her hand; and all the women went out after her with timbrels and with dances."}]},"Numbers 26:59":{"ref":"Numbers 26","verses":[{"v":59,"t":"And the name of Amram's wife was Jochebed, the daughter of Levi, whom her mother bare to Levi in Egypt: and she bare unto Amram Aaron and Moses, and Miriam their sister."}]},"1 Chronicles 6:3":{"ref":"1 Chronicles 6","verses":[{"v":3,"t":"And the children of Amram; Aaron, and Moses, and Miriam. The sons also of Aaron; Nadab, and Abihu, Eleazar, and Ithamar."}]},"Quran 20:85-97":{"ref":"Surah Taha (20)","verses":[{"v":85,"t":"[Allah] said, \"But indeed, We have tried your people after you [departed], and the Samiri has led them astray"},{"v":86,"t":"So Moses returned to his people, angry and grieved. He said, \"O my people, did your Lord not make you a good promise? Then, was the time [of its fulfillment] too long for you, or did you wish that wrath from your Lord descend upon you, so you broke your promise [of obedience] to me"},{"v":87,"t":"They said, \"We did not break our promise to you by our will, but we were made to carry burdens from the ornaments of the people [of Pharaoh], so we threw them [into the fire], and thus did the Samiri throw"},{"v":88,"t":"And he extracted for them [the statue of] a calf which had a lowing sound, and they said, \"This is your god and the god of Moses, but he forgot"},{"v":89,"t":"Did they not see that it could not return to them any speech and that it did not possess for them any harm or benefit"},{"v":90,"t":"And Aaron had already told them before [the return of Moses], \"O my people, you are only being tested by it, and indeed, your Lord is the Most Merciful, so follow me and obey my order"},{"v":91,"t":"They said, \"We will never cease being devoted to the calf until Moses returns to us"},{"v":92,"t":"[Moses] said, \"O Aaron, what prevented you, when you saw them going astray"},{"v":93,"t":"From following me? Then have you disobeyed my order"},{"v":94,"t":"[Aaron] said, \"O son of my mother, do not seize [me] by my beard or by my head. Indeed, I feared that you would say, 'You caused division among the Children of Israel, and you did not observe [or await] my word"},{"v":95,"t":"[Moses] said, \"And what is your case, O Samiri"},{"v":96,"t":"He said, \"I saw what they did not see, so I took a handful [of dust] from the track of the messenger and threw it, and thus did my soul entice me"},{"v":97,"t":"[Moses] said, \"Then go. And indeed, it is [decreed] for you in [this] life to say, 'No contact.' And indeed, you have an appointment [in the Hereafter] you will not fail to keep. And look at your 'god' to which you remained devoted. We will surely burn it and blow it into the sea with a blast"}]},"Exodus 32:1-6":{"ref":"Exodus 32","verses":[{"v":1,"t":"And when the people saw that Moses delayed to come down out of the mount, the people gathered themselves together unto Aaron, and said unto him, Up, make us gods, which shall go before us; for as for this Moses, the man that brought us up out of the land of Egypt, we wot not what is become of him."},{"v":2,"t":"And Aaron said unto them, Break off the golden earrings, which are in the ears of your wives, of your sons, and of your daughters, and bring them unto me."},{"v":3,"t":"And all the people brake off the golden earrings which were in their ears, and brought them unto Aaron."},{"v":4,"t":"And he received them at their hand, and fashioned it with a graving tool, after he had made it a molten calf: and they said, These be thy gods, O Israel, which brought thee up out of the land of Egypt."},{"v":5,"t":"And when Aaron saw it, he built an altar before it; and Aaron made proclamation, and said, To morrow is a feast to the LORD."},{"v":6,"t":"And they rose up early on the morrow, and offered burnt offerings, and brought peace offerings; and the people sat down to eat and to drink, and rose up to play."}]},"Quran 21:96":{"ref":"Surah Al-Anbya (21)","verses":[{"v":96,"t":"Until when [the dam of] Gog and Magog has been opened and they, from every elevation, descend"}]},"Ezekiel 38:1-6":{"ref":"Ezekiel 38","verses":[{"v":1,"t":"And the word of the LORD came unto me, saying,"},{"v":2,"t":"Son of man, set thy face against Gog, the land of Magog, the chief prince of Meshech and Tubal, and prophesy against him,"},{"v":3,"t":"And say, Thus saith the Lord GOD; Behold, I am against thee, O Gog, the chief prince of Meshech and Tubal:"},{"v":4,"t":"And I will turn thee back, and put hooks into thy jaws, and I will bring thee forth, and all thine army, horses and horsemen, all of them clothed with all sorts of armour, even a great company with bucklers and shields, all of them handling swords:"},{"v":5,"t":"Persia, Ethiopia, and Libya with them; all of them with shield and helmet:"},{"v":6,"t":"Gomer, and all his bands; the house of Togarmah of the north quarters, and all his bands: and many people with thee."}]},"Quran 67:3-5":{"ref":"Surah Al-Mulk (67)","verses":[{"v":3,"t":"[And] who created seven heavens in layers. You do not see in the creation of the Most Merciful any inconsistency. So return [your] vision [to the sky]; do you see any breaks"},{"v":4,"t":"Then return [your] vision twice again. [Your] vision will return to you humbled while it is fatigued"},{"v":5,"t":"And We have certainly beautified the nearest heaven with stars and have made [from] them what is thrown at the devils and have prepared for them the punishment of the Blaze"}]},"Quran 37:6-10":{"ref":"Surah As-Saffat (37)","verses":[{"v":6,"t":"Indeed, We have adorned the nearest heaven with an adornment of stars"},{"v":7,"t":"And as protection against every rebellious devil"},{"v":8,"t":"[So] they may not listen to the exalted assembly [of angels] and are pelted from every side"},{"v":9,"t":"Repelled; and for them is a constant punishment"},{"v":10,"t":"Except one who snatches [some words] by theft, but they are pursued by a burning flame, piercing [in brightness]"}]},"Quran 72:8-9":{"ref":"Surah Al-Jinn (72)","verses":[{"v":8,"t":"And we have sought [to reach] the heaven but found it filled with powerful guards and burning flames"},{"v":9,"t":"And we used to sit therein in positions for hearing, but whoever listens now will find a burning flame lying in wait for him"}]},"Quran 15:16-18":{"ref":"Surah Al-Hijr (15)","verses":[{"v":16,"t":"And We have placed within the heaven great stars and have beautified it for the observers"},{"v":17,"t":"And We have protected it from every devil expelled [from the mercy of Allah]"},{"v":18,"t":"Except one who steals a hearing and is pursued by a clear burning flame"}]},"Quran 13:2":{"ref":"Surah Ar-Ra'd (13)","verses":[{"v":2,"t":"It is Allah who erected the heavens without pillars that you [can] see; then He established Himself above the Throne and made subject the sun and the moon, each running [its course] for a specified term. He arranges [each] matter; He details the signs that you may, of the meeting with your Lord, be certain"}]},"Quran 34:9":{"ref":"Surah Saba (34)","verses":[{"v":9,"t":"Then, do they not look at what is before them and what is behind them of the heaven and earth? If We should will, We could cause the earth to swallow them or [could] let fall upon them fragments from the sky. Indeed in that is a sign for every servant turning back [to Allah]"}]},"Quran 2:106":{"ref":"Surah Al-Baqarah (2)","verses":[{"v":106,"t":"We do not abrogate a verse or cause it to be forgotten except that We bring forth [one] better than it or similar to it. Do you not know that Allah is over all things competent"}]},"Quran 16:101":{"ref":"Surah An-Nahl (16)","verses":[{"v":101,"t":"And when We substitute a verse in place of a verse - and Allah is most knowing of what He sends down - they say, \"You, [O Muhammad], are but an inventor [of lies].\" But most of them do not know"}]},"Quran 22:52":{"ref":"Surah Al-Hajj (22)","verses":[{"v":52,"t":"And We did not send before you any messenger or prophet except that when he spoke [or recited], Satan threw into it [some misunderstanding]. But Allah abolishes that which Satan throws in; then Allah makes precise His verses. And Allah is Knowing and Wise"}]},"Quran 53:19-23":{"ref":"Surah An-Najm (53)","verses":[{"v":19,"t":"So have you considered al-Lat and al-'Uzza"},{"v":20,"t":"And Manat, the third - the other one"},{"v":21,"t":"Is the male for you and for Him the female"},{"v":22,"t":"That, then, is an unjust division"},{"v":23,"t":"They are not but [mere] names you have named them - you and your forefathers - for which Allah has sent down no authority. They follow not except assumption and what [their] souls desire, and there has already come to them from their Lord guidance"}]},"Quran 17:73-75":{"ref":"Surah Al-Isra (17)","verses":[{"v":73,"t":"And indeed, they were about to tempt you away from that which We revealed to you in order to [make] you invent about Us something else; and then they would have taken you as a friend"},{"v":74,"t":"And if We had not strengthened you, you would have almost inclined to them a little"},{"v":75,"t":"Then [if you had], We would have made you taste double [punishment in] life and double [after] death. Then you would not find for yourself against Us a helper"}]},"Deuteronomy 18:20-22":{"ref":"Deuteronomy 18","verses":[{"v":20,"t":"But the prophet, which shall presume to speak a word in my name, which I have not commanded him to speak, or that shall speak in the name of other gods, even that prophet shall die."},{"v":21,"t":"And if thou say in thine heart, How shall we know the word which the LORD hath not spoken?"},{"v":22,"t":"When a prophet speaketh in the name of the LORD, if the thing follow not, nor come to pass, that is the thing which the LORD hath not spoken, but the prophet hath spoken it presumptuously: thou shalt not be afraid of him."}]},"Malachi 3:6":{"ref":"Malachi 3","verses":[{"v":6,"t":"For I am the LORD, I change not; therefore ye sons of Jacob are not consumed."}]},"Quran 87:6-7":{"ref":"Surah Al-A'la (87)","verses":[{"v":6,"t":"We will make you recite, [O Muhammad], and you will not forget"},{"v":7,"t":"Except what Allah should will. Indeed, He knows what is declared and what is hidden"}]},"Quran 2:238":{"ref":"Surah Al-Baqarah (2)","verses":[{"v":238,"t":"Maintain with care the [obligatory] prayers and [in particular] the middle prayer and stand before Allah, devoutly obedient"}]},"Quran 33:21":{"ref":"Surah Al-Ahzab (33)","verses":[{"v":21,"t":"There has certainly been for you in the Messenger of Allah an excellent pattern for anyone whose hope is in Allah and the Last Day and [who] remembers Allah often"}]},"Quran 65:4":{"ref":"Surah At-Talaq (65)","verses":[{"v":4,"t":"And those who no longer expect menstruation among your women - if you doubt, then their period is three months, and [also for] those who have not menstruated. And for those who are pregnant, their term is until they give birth. And whoever fears Allah - He will make for him of his matter ease"}]},"Quran 4:34":{"ref":"Surah An-Nisa (4)","verses":[{"v":34,"t":"Men are in charge of women by [right of] what Allah has given one over the other and what they spend [for maintenance] from their wealth. So righteous women are devoutly obedient, guarding in [the husband's] absence what Allah would have them guard. But those [wives] from whom you fear arrogance - [first] advise them; [then if they persist], forsake them in bed; and [finally], strike them. But if they obey you [once more], seek no means against them. Indeed, Allah is ever Exalted and Grand"}]},"Quran 4:24":{"ref":"Surah An-Nisa (4)","verses":[{"v":24,"t":"And [also prohibited to you are all] married women except those your right hands possess. [This is] the decree of Allah upon you. And lawful to you are [all others] beyond these, [provided] that you seek them [in marriage] with [gifts from] your property, desiring chastity, not unlawful sexual intercourse. So for whatever you enjoy [of marriage] from them, give them their due compensation as an obligation. And there is no blame upon you for what you mutually agree to beyond the obligation. Indeed, Allah is ever Knowing and Wise"}]},"Quran 23:5-6":{"ref":"Surah Al-Mu'minun (23)","verses":[{"v":5,"t":"And they who guard their private parts"},{"v":6,"t":"Except from their wives or those their right hands possess, for indeed, they will not be blamed"}]},"Quran 33:50":{"ref":"Surah Al-Ahzab (33)","verses":[{"v":50,"t":"O Prophet, indeed We have made lawful to you your wives to whom you have given their due compensation and those your right hand possesses from what Allah has returned to you [of captives] and the daughters of your paternal uncles and the daughters of your paternal aunts and the daughters of your maternal uncles and the daughters of your maternal aunts who emigrated with you and a believing woman if she gives herself to the Prophet [and] if the Prophet wishes to marry her, [this is] only for you, excluding the [other] believers. We certainly know what We have made obligatory upon them concerning their wives and those their right hands possess, [but this is for you] in order that there will be upon you no discomfort. And ever is Allah Forgiving and Merciful"}]},"Ephesians 5:25-29":{"ref":"Ephesians 5","verses":[{"v":25,"t":"Husbands, love your wives, even as Christ also loved the church, and gave himself for it;"},{"v":26,"t":"That he might sanctify and cleanse it with the washing of water by the word,"},{"v":27,"t":"That he might present it to himself a glorious church, not having spot, or wrinkle, or any such thing; but that it should be holy and without blemish."},{"v":28,"t":"So ought men to love their wives as their own bodies. He that loveth his wife loveth himself."},{"v":29,"t":"For no man ever yet hated his own flesh; but nourisheth and cherisheth it, even as the Lord the church:"}]},"Colossians 3:19":{"ref":"Colossians 3","verses":[{"v":19,"t":"Husbands, love your wives, and be not bitter against them."}]},"1 Peter 3:7":{"ref":"1 Peter 3","verses":[{"v":7,"t":"Likewise, ye husbands, dwell with them according to knowledge, giving honour unto the wife, as unto the weaker vessel, and as being heirs together of the grace of life; that function splitSentences(raw){
  const tokens=raw.split(/(?<=[.!?])\s+(?=[A-Z0-9"'(‘“])/);
  const merged=[];
  tokens.forEach(t=>{
    if(merged.length){
      const prev=merged[merged.length-1];
      const m=prev.match(/([A-Za-z&.]+)\.$/);
      const w=m?m[1].replace(/\./g,""):null;
      if(w&&ABBR.includes(w)){merged[merged.length-1]=prev+" "+t;return;}
    }
    merged.push(t);
  });

}

function findWhy(d,cite){
  const key=cite.replace(/–/g,"-").replace(/\s*\(.*\)\s*/g,"").trim();
  const m=key.match(/^([1-4]?\s?[A-Za-z&; ]+?)\s+(\d+)/);
  const frag=m?(m[1].trim()+" "+m[2]):key;
  const sentences=(d.claim+" "+d.rationale).replace(/–/g,"-").split(/(?<=[.!?])\s+/);
  const hit=sentences.find(s=>s.includes(frag));
  return hit?hit.replace(/-/g,"–"):null;
}

  const views=[["core","The heart of it","3"],["share","Sharing the gospel","✝"],["paths","Guided paths",PATHS.length],["timeline","Timeline","4 acts"],["glossary","Terms explained",GLOSSARY.length]];
  const cur=state.view==="overview"&&state.section!=="all"?"sec:"+state.section:state.view;
  $("#nav").innerHTML=items.map(([k,l,c])=>`<a class="${cur===k?"on":""}" data-k="${k}">${l} <span class="cnt">${c}</span></a>`).join("")
    +`<h5>Views</h5>`+views.map(([k,l,c])=>`<a class="${cur===k?"on":""}" data-k="${k}">${l} <span class="cnt">${c}</span></a>`).join("");
  document.querySelectorAll("#nav a").forEach(a=>a.addEventListener("click",()=>{
    const k=a.dataset.k;
    if(k.startsWith("sec:")){state.view="overview";state.section=k.slice(4);state.caseId=null;}
    else if(k==="overview"){state.view="overview";state.section="all";state.caseId=null;}
    else{state.view=k;state.caseId=null;}
    render();
  }));
  const read=store.read.size;
  $("#sideprog").innerHTML=`
    <button id="themebtn" style="margin-top:14px;background:none;border:1px solid var(--line2);color:var(--muted);border-radius:8px;padding:5px 12px;font-size:.72rem;cursor:pointer">◐ ${document.documentElement.dataset.theme==="light"?"Dark":"Light"} mode</button> <button id="tourbtn" style="margin-top:8px;background:none;border:1px solid var(--line2);color:var(--muted);border-radius:8px;padding:5px 12px;font-size:.72rem;cursor:pointer">✦ Replay tour</button>`;
  $("#themebtn").addEventListener("click",()=>{
    const cur=document.documentElement.dataset.theme==="light"?"dark":"light";
    document.documentElement.dataset.theme=cur;
    localStorage.setItem("wb_theme",cur);
    renderNav();
  });
  const tb=$("#tourbtn");if(tb)tb.addEventListener("click",()=>startTour());
}

/* ---------- preview ---------- */
function renderPreview(){
  const el=$("#preview");
  const d=state.sel?byId[state.sel]:null;
  if(!d){el.innerHTML=`<div class="empty">Hover or select a case<br>to preview it here.<br><br><kbd>J</kbd>/<kbd>K</kbd> to move · <kbd>↵</kbd> to open</div>`;return;}
  const rel=(RELATED[d.id]||[]).filter(id=>byId[id]);
  el.innerHTML=`<span class="badge v-${d.verdict}">${VLABEL[d.verdict]}</span>
    <h5 class="pt">${esc(d.title)}</h5>
    <p>${esc(d.claim.split(/(?<=\.)\s/)[0])}</p>
    <button class="go" data-open="${d.id}">Open case →</button>
    <h6>Connected cases</h6>
    ${rel.map(id=>`<button class="rr" data-open="${id}">${esc(byId[id].title)}</button>`).join("")||'<p style="font-size:.75rem">—</p>'}`;
  el.querySelectorAll("[data-open]").forEach(b=>b.addEventListener("click",()=>openCase(b.dataset.open)));
}

/* ---------- overview ---------- */
function renderOverview(){
  const items=filtered();
  const anyF=state.verdict||state.severity||state.q||state.section!=="all";
  const visible=new Set(items.map(d=>d.id));
  const read=store.read;
  const VDESC={admitted:"The church's own publications concede these facts — cite them from their sources alone",unrefuted:"No adequate answer exists — or the best answers concede the point",contested:"A serious rebuttal exists; both sides shown",answered:"The defense holds — included so nothing is cherry-picked"};
  const counts={};DATA.forEach(d=>counts[d.verdict]=(counts[d.verdict]||0)+1);
  const col=v=>{
    const cls=v==="admitted"?"ad":v==="unrefuted"?"un":v==="contested"?"co":"an";
    const src=state.section==="all"?DATA:DATA.filter(d=>d.section===state.section);
    const groups=["high","medium","low"].map(s=>{
      const g=src.filter(d=>d.verdict===v&&d.severity===s).sort((a,b)=>(b.featured?1:0)-(a.featured?1:0));
      if(!g.length)return "";
      return `<div class="vgroup"><h6>${s==="high"?"Most serious":s==="medium"?"Moderate":"Minor"} · ${g.length}</h6>`+
        g.map(d=>`<button class="vt ${state.sel===d.id?"sel":""}${visible.has(d.id)?"":" dimmed"}" data-id="${d.id}">
          <h5>${esc(d.title)}</h5>
          <span class="m">${read.has(d.id)?'<span class="rd">✓ read</span>':""}${d.featured?'<span class="star">★ strongest evidence</span>':""}</span>
        </button>`).join("")+`</div>`;
    }).join("");
    const cnt=src.filter(d=>d.verdict===v).length;
    return `<div class="vcol ${cls}"><header><span class="n">${cnt}</span><span class="t">${VLABEL[v]}</span><div class="d">${VDESC[v]}</div></header>${groups}</div>`;
  };
  if(state.section==="peculiar"){
    const items2=filtered();
    $("#main").innerHTML=`
      <div class="tiles">
        <button class="tile on" data-v=""><div class="v">${DATA.filter(d=>d.section==="peculiar").length}</div><div class="l">Ranked entries</div></button>
        <button class="tile t-un" data-v=""><div class="v" style="font-size:1rem;padding-top:8px">Most jaw-dropping first</div><div class="l">how this list is sorted</div></button>
      </div>
      <h4 class="bt">Strange to outsiders — practices and institutional behavior, ranked by how surprising they are to a non-Mormon. Not core theology; each is documented and steelmanned like everything else.</h4>
      <div class="vcol" style="max-width:760px">${items2.map((d,i)=>`
        <button class="vt ${state.sel===d.id?"sel":""}" data-id="${d.id}">
          <h5><span style="font-family:var(--mono);color:var(--dim);font-size:.8rem;margin-right:8px">${String(i+1).padStart(2,"0")}</span>${esc(d.title)}</h5>
          <span class="m">${read.has(d.id)?'<span class="rd">✓ read</span>':""}<span class="badge v-${d.verdict}">${VLABEL[d.verdict]}</span><span>seriousness: ${SEVLABEL[d.severity]}</span></span>
        </button>`).join("")}</div>
      <p class="methodfoot">Ranking is editorial: how startling the item is to someone outside the tradition, most to least. Verdicts still grade only the factual claim.</p>`;
    document.querySelectorAll(".vt").forEach(c=>{
      c.addEventListener("mouseenter",()=>{state.sel=c.dataset.id;renderPreview();});
      c.addEventListener("click",()=>openCase(c.dataset.id));
    });
    return;
  }
  $("#main").innerHTML=`
    <h4 class="bt">${state.section==="all"?DATA.length+" claims, sorted by where the argument stands · click any title to open its case":SECTIONS[state.section]+" — by verdict"}${anyF?` · <button id="clearf" style="background:none;border:0;color:var(--gold);cursor:pointer;text-decoration:underline;font-size:.72rem;letter-spacing:0;text-transform:none">${items.length} match filters — clear</button>`:""}</h4>
    <div class="vwall">${col("admitted")}${col("unrefuted")}${col("contested")}${col("answered")}</div>
    <p class="methodfoot">Steelman rules: every claim carries the best published Muslim defense; weak criticisms are marked answered; facts conceded in sahih Islamic sources are marked admitted. Compiled July 2026 from published sources — verify citations at the links before quoting. Verdicts are editorial judgments about the public argument.</p>`;
  document.querySelectorAll(".vt").forEach(c=>{
    c.addEventListener("mouseenter",()=>{state.sel=c.dataset.id;renderPreview();});
    c.addEventListener("click",()=>openCase(c.dataset.id));
  });
  const cf=$("#clearf");if(cf)cf.addEventListener("click",()=>{state.verdict=null;state.severity=null;state.q="";state.section="all";render();});
}

/* ---------- case ---------- */
function openCase(id,fromPath){
  state.caseId=id;state.sel=id;state.view="case";
  if(!fromPath)state.pathId=state.pathId; // keep path context if navigating within
  store.markRead(id);
  render();
  window.scrollTo({top:0});
}
function renderCase(){
  const d=byId[state.caseId];if(!d){state.view="overview";return renderOverview();}
  const list=filtered();const idx=list.findIndex(x=>x.id===d.id);
  const path=state.pathId?PATHS.find(p=>p.id===state.pathId):null;
  let nextInPath=null;
  if(path){const i=path.items.indexOf(d.id);if(i>-1&&i<path.items.length-1)nextInPath=path.items[i+1];}
  const comp=d.comparison?`
    <div class="dlab">Side by side</div>
    <div class="compare2">
      <div class="pane bom"><div class="ref">${esc(d.comparison.left.ref)}</div><div class="scripture">${hl(d.comparison.left.text,d.comparison.hl)}</div></div>
      <div class="pane bible"><div class="ref">${esc(d.comparison.right.ref)}</div><div class="scripture">${hl(d.comparison.right.text,d.comparison.hl)}</div></div>
    </div>${d.comparison.note?`<p class="cnote">${esc(d.comparison.note)}</p>`:""}`:"";
  const chipHtml=(arr)=>arr.map(p=>{
    const v=VERSES[p];
    return `<button class="chip ${v?"":"ext"}" data-cite="${esc(p)}" ${v?"":`data-ext="${extUrl(p)}"`}>${esc(p)}</button>`;
  }).join("");
  const hadithChips=(d.hadith||[]).map(h=>{
    const u=hadithUrl(h);
    return u?`<a class="chip ext" href="${u}" target="_blank" rel="noopener">${esc(h)}</a>`:`<span class="chip" style="cursor:default">${esc(h)}</span>`;
  }).join("");
  const cimg=IMGMAP[d.id]?`<figure class="cimg"><img src="${IMGMAP[d.id].src}" alt="${esc(IMGMAP[d.id].cap)}" loading="lazy"><button class="cimg-x" title="Expand image" data-full="${IMGMAP[d.id].src.replace("width=520","width=1400")}" data-cap="${esc(IMGMAP[d.id].cap)}">⤢</button><figcaption>${esc(IMGMAP[d.id].cap)}</figcaption></figure>`:"";
  const passages=((d.quran||[]).length||(d.hadith||[]).length||(d.bible||[]).length||IMGMAP[d.id])?`
    <aside class="claimside">
      ${cimg}
      <details class="vdet"><summary>The texts behind this claim — ${(d.quran||[]).length+(d.hadith||[]).length+(d.bible||[]).length} refs</summary>
      <p class="sidenote">Every reference here is cited by this specific claim — click a Quran or Bible reference to read it in place; hadith open on sunnah.com.</p>
      <div class="passcols">
        ${(d.quran||[]).length?`<div><h6 class="h-bom">Quran</h6><div class="chips" data-side="quran">${chipHtml(d.quran)}</div></div>`:""}
        ${(d.hadith||[]).length?`<div><h6 class="h-bom" style="color:var(--amber)">Hadith</h6><div class="chips" data-side="hadith">${hadithChips}</div></div>`:""}
        ${(d.bible||[]).length?`<div><h6 class="h-bib">Bible</h6><div class="chips" data-side="bib">${chipHtml(d.bible)}</div></div>`:""}
        <div id="versebox"></div>
      </div></details>
    </aside>`:"";
  const rel=(RELATED[d.id]||[]).filter(x=>byId[x]);
  $("#main").innerHTML=`
    <div class="backbar">
      <button class="bk" id="back">← ${path?esc(path.name):"All cases"}</button>
      <span style="font-size:.72rem;color:var(--dim)">${idx+1>0?`Case ${idx+1} of ${list.length}`:""} · <kbd>←</kbd>/<kbd>→</kbd> to move</span>
      ${nextInPath?`<button class="pathnext" id="pathnext">Next in path →</button>`:""}
    </div>
    <div class="case">
      <div class="meta"><span class="badge v-${d.verdict}">${VLABEL[d.verdict]} ${info(TIPS.verdict[d.verdict])}</span><span class="tag">${CATS[d.category]} ${info(CATDESC[d.category])}</span><span class="tag">seriousness: ${SEVLABEL[d.severity]} ${info(TIPS.impact)}</span>${d.featured?`<span class="tag" style="border-color:var(--gold);color:var(--gold)">★ strongest evidence ${info(TIPS.strongest)}</span>`:""}</div>
      <h2>${esc(d.title)}</h2>
      <div class="ctop">
        <div><div class="dlab red" style="margin-top:0">The claim</div><div class="claim">${paras(d.claim)}</div></div>
        ${passages}
      </div>
      ${comp}
      <div class="tabs2">
        <button class="tab2 on" data-pane="pane-case">🛡 Defense & Verdict</button>
        <button class="tab2" data-pane="pane-talk">💬 Conversation</button>
        <button class="tab2" data-pane="pane-src">📚 Sources & connections</button>
      </div>
      <div class="tabpane2 on" id="pane-case">
        <div class="dlab blue" style="margin-top:0">The best defense, steelmanned</div>
        <div class="defense">${formatDefense(d.response)}${d.responseSource?`<div class="dsrc">Source: ${d.responseSource.url?`<a href="${esc(d.responseSource.url)}" target="_blank" rel="noopener">${esc(d.responseSource.name)}</a>`:esc(d.responseSource.name)}</div>`:""}</div>
        <div class="pair2">
          <div><div class="dlab">The verdict</div><div class="vbox v-${d.verdict}"><b class="vb">${VLABEL[d.verdict]}</b><span>${paras(d.rationale)}</span></div></div>
          <div><div class="dlab">Why this matters</div><div class="why">${paras(WHYMAP[d.category]||"")}<p class="wtail">${esc(WHYTAIL[d.verdict])}</p></div></div>
        </div>
      </div>
      <div class="tabpane2" id="pane-talk">${TALK[d.category]?`<div class="dlab" style="margin-top:0;color:var(--green)">Bringing it up in conversation</div><div class="talk">${paras(TALK[d.category])}</div>`:""}${DIALOG[d.category]?`<div class="dlab" style="color:var(--green)">How the conversation usually goes</div><div class="dlg">${DIALOG[d.category].map(m=>`<div class="msg ${m.w}"><span class="who">${m.w==="them"?"They may say":"You respond"}</span><p>${rich(m.t)}</p></div>`).join("")}</div>`:""}</div>
      <div class="tabpane2" id="pane-src">
        <div class="dlab" style="margin-top:0">Documented by — ${d.sources.length} source${d.sources.length>1?"s":""}</div>
        <ul class="srcs">${d.sources.map(s=>`<li><span class="sb sb-${s.type}">${s.type}</span><span>${s.url?`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.name)}</a>`:esc(s.name)}</span></li>`).join("")}</ul>
        <div class="dlab">Connected cases</div>
        <div class="relrow">${rel.map(id=>`<button data-open="${id}">${esc(byId[id].title)}</button>`).join("")||"—"}</div>
      </div>
    </div>`;
    document.querySelectorAll(".tab2").forEach(t=>t.addEventListener("click",()=>{
    document.querySelectorAll(".tab2").forEach(x=>x.classList.remove("on"));
    document.querySelectorAll(".tabpane2").forEach(x=>x.classList.remove("on"));
    t.classList.add("on");document.getElementById(t.dataset.pane).classList.add("on");
  }));
  $("#back").addEventListener("click",()=>{state.view=path?"paths":"overview";state.caseId=null;render();});
  if(nextInPath)$("#pathnext").addEventListener("click",()=>openCase(nextInPath));
  document.querySelectorAll(".relrow [data-open]").forEach(b=>b.addEventListener("click",()=>openCase(b.dataset.open)));
  document.querySelectorAll(".chip").forEach(ch=>ch.addEventListener("click",()=>{
    if(ch.dataset.ext){window.open(ch.dataset.ext,"_blank");return;}
    const cite=ch.dataset.cite;const v=VERSES[cite];
    const box=$("#versebox");
    const already=ch.classList.contains("open");
    document.querySelectorAll(".chip.open").forEach(x=>x.classList.remove("open"));
    if(already){box.innerHTML="";return;}
    ch.classList.add("open");
    const side=ch.closest("[data-side]")?ch.closest("[data-side]").dataset.side:"";
    const why=findWhy(d,cite);
    const whyHtml=why?`<b>Why it's cited:</b> ${esc(why)}`:(side==="quran"?"<b>Role:</b> this is the Quran passage the claim examines.":"<b>Role:</b> this is the biblical standard the claim measures against.");
    box.innerHTML=`<div class="versebox"><div class="vr"><span>${esc(cite)}</span><button data-close>✕ close</button></div><div class="vtext">${v.verses.map(x=>`<span class="vnum">${x.v}</span>${esc(x.t)} `).join("")}</div><div class="vwhy">${whyHtml}</div></div>`;
    box.querySelector("[data-close]").addEventListener("click",()=>{box.innerHTML="";document.querySelectorAll(".chip.open").forEach(x=>x.classList.remove("open"));});
  }));
  document.querySelectorAll(".cimg-x").forEach(b=>b.addEventListener("click",e=>{e.stopPropagation();showLightbox(b.dataset.full,b.dataset.cap);}));
  renderNav();renderPreview();
}

/* ---------- paths ---------- */
function renderPaths(){
  const read=store.read;
  $("#main").innerHTML=`<div class="viewhead"><h2>Guided paths</h2><p>Curated routes through the corpus. Progress is saved in your browser; inside a path, each case offers "Next in path."</p></div><div class="pgrid">`+PATHS.map(p=>{
      const done=p.items.filter(i=>read.has(i)).length;
      return `<div class="pathcard"><h3>${esc(p.name)}</h3><p class="pd">${esc(p.desc)} · ${p.time} · ${done}/${p.items.length} read</p>
      <ol>${p.items.map(i=>`<li class="${read.has(i)?"done":""}">${esc(byId[i].title)}</li>`).join("")}</ol>
      <button class="start" data-path="${p.id}">${done===0?"Start path":done>=p.items.length?"Revisit path":"Continue path"} →</button></div>`;
    }).join("")+"</div>";
  document.querySelectorAll("[data-path]").forEach(b=>b.addEventListener("click",()=>{
    const p=PATHS.find(x=>x.id===b.dataset.path);state.pathId=p.id;
    const read=store.read;const next=p.items.find(i=>!read.has(i))||p.items[0];
    openCase(next,true);
  }));
}

function renderTimeline(){
  const read=store.read;
  $("#main").innerHTML=`<div class="viewhead"><h2>The record, in four acts</h2>
  <p>What was claimed on the left; what the manuscripts and canon show on the right. Red years mark the turning points. Click an act to open it — your reading progress fills each meter.</p></div>
  <div class="chs">${TLACTS.map((a,i)=>{
    const linked=a.events.filter(e=>e.id);
    const done=linked.filter(e=>read.has(e.id)).length;
    return `<button class="ch ${state.act===i?"on":""}" data-act="${i}"><span class="n">${a.num}</span><span class="range">${a.range}</span><h4>${a.name}</h4><p>${a.desc} · ${a.events.length} events</p><div class="meter"><i style="width:${linked.length?Math.round(done/linked.length*100):0}%"></i></div></button>`;
  }).join("")}</div>
  ${state.act!=null&&TLACTS[state.act]?actHtml(TLACTS[state.act]):`<p class="tlhint">Select an act to open its record.</p>`}`;
  function actHtml(a){
    return `<div class="chopen"><h4>Act ${a.num} · ${a.name} (${a.range})</h4>
    <div class="cvr"><div class="hh claims">What was claimed</div><div></div><div class="hh record">What the record shows</div>
    ${a.events.map(e=>{
      const bubble=`<div class="bubble ${e.side==="claim"?"claim":"rec"}"><h4>${esc(e.t)}</h4><p>${esc(e.p)} ${e.id&&byId[e.id]?`<button class="jump" data-open="${e.id}">→ open the case</button>`:""}</p></div>`;
      return `<div class="cell">${e.side==="claim"?bubble:""}</div><div class="mid"><div class="yr2 ${e.crit?"critY":""}">${e.y}</div></div><div class="cell">${e.side==="record"?bubble:""}</div>`;
    }).join("")}</div></div>`;
  }
  document.querySelectorAll(".ch").forEach(b=>b.addEventListener("click",()=>{const i=+b.dataset.act;state.act=state.act===i?null:i;renderTimeline();}));
  document.querySelectorAll(".jump").forEach(b=>b.addEventListener("click",()=>openCase(b.dataset.open)));
}

/* ---------- keyboard ---------- */
document.addEventListener("keydown",e=>{
  const inInput=/input|textarea/i.test(document.activeElement.tagName);
  if(inInput){if(e.key==="Escape")document.activeElement.blur();return;}
  const list=filtered();
  const move=dir=>{
    const idx=list.findIndex(x=>x.id===state.sel);
    const next=list[Math.min(list.length-1,Math.max(0,(idx<0?0:idx+dir)))];
    if(!next)return;
    state.sel=next.id;
    if(state.view==="case"){openCase(next.id);}
    else{renderPreview();
      const el=document.querySelector(`.vt[data-id="${next.id}"]`);
      document.querySelectorAll(".vt.sel").forEach(x=>x.classList.remove("sel"));
      document.querySelectorAll(`.vt[data-id="${next.id}"]`).forEach(x=>x.classList.add("sel"));
      if(el)el.scrollIntoView({block:"nearest"});}
  };
  switch(e.key==="ArrowRight"?"next":e.key==="ArrowLeft"?"prev":e.key.toLowerCase()){
    case "next":e.preventDefault();move(1);break;
    case "prev":e.preventDefault();move(-1);break;
    case "enter":if(state.sel&&state.view!=="case")openCase(state.sel);break;
    case "escape":if(state.view==="case"){state.view=state.pathId?"paths":"overview";state.caseId=null;render();}else{state.q="";const q=$("#q");if(q)q.value="";state.verdict=null;state.severity=null;render();}break;
    case "o":state.view="overview";state.section="all";state.caseId=null;render();break;
    case "p":state.view="paths";state.caseId=null;render();break;
    case "t":state.view="timeline";state.caseId=null;render();break;
    case "g":state.view="glossary";state.caseId=null;render();break;
    case "s":state.view="share";state.caseId=null;render();break;
    case "h":state.view="core";state.caseId=null;render();break;
  }
});


const TOURKEY="wbi_tour";
const TOURSTEPS=[{"icon":"⚖","title":"Welcome to the examination","body":"<b>38 documented claims</b> about Islam, each weighed against the Bible — with Quran verses, Hadith, and Bible passages cited on every case. Every claim carries the <b>strongest Muslim defense</b> and an honest verdict; popular polemics that don't survive scrutiny are excluded."},{"icon":"🏷","title":"Four verdicts, one glance","body":"Every claim lands in one of four columns:<div class=\"vrow2\"><div><span class=\"badge v-admitted\">Admitted</span><span>their own sources concede the facts</span></div><div><span class=\"badge v-unrefuted\">Unrefuted</span><span>no adequate answer exists</span></div><div><span class=\"badge v-contested\">Contested</span><span>a real debate — both sides shown</span></div><div><span class=\"badge v-answered\">Answered</span><span>the defense wins, and we say so</span></div></div><p style='margin:10px 0 0'>For Islam, <b>Admitted</b> means the facts sit in Sahih al-Bukhari, Sahih Muslim, or mainstream tafsir — sources every observant Muslim accepts.</p>"},{"icon":"💬","title":"Every case scripts the conversation","body":"Each case ends with <b>“How the conversation usually goes”</b> — a back-and-forth: <i>they may say → you respond → they may counter → you respond</i>. You'll never be caught without the next move. Quran references expand in place; hadith link straight to sunnah.com so your friend can verify instantly."},{"icon":"🧭","title":"The sidebar is your map","body":"Start with <b>The heart of it</b> — the cornerstone dilemma every other conversation depends on. Then <b>Sharing the gospel</b> (honor-shame method, the 7 objections you'll hear, security cautions), <b>Guided paths</b>, <b>Timeline</b>, and <b>Terms explained</b> (tahrif, isnad, taqiyya…)."},{"icon":"🚀","title":"Where to start","body":"Take the <b>cornerstone path</b>: the Quran affirms the Bible of Muhammad's day — and the manuscripts prove that Bible is ours. Master that one argument and every other door opens. Replay this tour anytime from the sidebar.","cta":"Take me to the heart of it"}];
function startTour(){
  const old=document.querySelector(".tourwrap");if(old)old.remove();
  let ti=0;
  const wrap=document.createElement("div");wrap.className="tourwrap";
  function finish(go){localStorage.setItem(TOURKEY,"1");wrap.remove();if(go){state.view="core";state.caseId=null;render();}}
  function draw(){
    const s=TOURSTEPS[ti];
    wrap.innerHTML='<div class="tourcard"><div class="ticon">'+s.icon+'</div><h3>'+s.title+'</h3><div class="tbody">'+s.body+'</div>'+
      '<div class="tdots">'+TOURSTEPS.map((_,j)=>'<i class="'+(j===ti?"on":"")+'"></i>').join("")+'</div>'+
      '<div class="trow"><button class="tskip">Skip tour</button><div>'+(ti>0?'<button class="tback">Back</button>':'')+
      '<button class="tnext">'+(ti===TOURSTEPS.length-1?s.cta:'Next')+'</button></div></div></div>';
    wrap.querySelector(".tskip").addEventListener("click",()=>finish(false));
    const bk=wrap.querySelector(".tback");if(bk)bk.addEventListener("click",()=>{ti--;draw();});
    wrap.querySelector(".tnext").addEventListener("click",()=>{if(ti===TOURSTEPS.length-1){finish(ti===TOURSTEPS.length-1&&true);}else{ti++;draw();}});
  }
  document.body.appendChild(wrap);draw();
}
if(!localStorage.getItem(TOURKEY))setTimeout(startTour,500);

document.documentElement.dataset.theme=localStorage.getItem("wb_theme")||"dark";
$("#q").addEventListener("input",e=>{
  state.q=e.target.value.trim().toLowerCase();
  if(state.view!=="overview"){state.view="overview";state.caseId=null;}
  render();
});
render();
</script>
