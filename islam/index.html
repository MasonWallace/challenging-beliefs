{"id":"quran-grammar-irregularities","title":"Four case endings that break the Arabic rule","category":"quran-text","claim":"The Quran rests its great miracle on language nobody can match — 'produce a surah like it' (2:23) — in 'clear Arabic' (12:2). Yet classical scholars themselves listed odd forms. Arabic marks case by word endings. Quran 4:162 has al-muqimina, 'those who establish prayer', in one case while the nouns around it stand in another. Quran 5:69 has al-sabi'una in a form the particle inna should not allow, unlike 2:62 and 22:17, where the same word follows the rule. Quran 20:63 reads inna hadhani la-sahirani, where inna calls for hadhayni. Quran 2:177 does the same with al-sabirina. Early reports admit the problem. Uthman is said to have remarked of the compiled text, 'I see errors (lahn) in it, and the Arabs will correct them with their tongues.' And a report through Abu Ubayd's Fada'il al-Qur'an has Aisha judge that 4:162, 5:69 and 20:63 are 'the fault of the scribes'. Both reports are themselves disputed, since their chains are contested and Muslim scholars reject or reread them. Classical grammarians smoothed each verse by appeal to poetic licence, dialect and the praise form — which is itself a sign that the oddities were felt.","quran":["Quran 4:162","Quran 5:69","Quran 20:63","Quran 2:177","Quran 2:23","Quran 12:2"],"hadith":[],"bible":["Luke 1:1-4","2 Peter 1:21","2 Timothy 3:16"],"sources":[{"name":"M. Rafiqul-Haqq & P. Newton — The Qur'an: Grammatical Errors","type":"apologetics","url":"https://www.answering-islam.org/Authors/Newton/grammar.html"},{"name":"Islamic Awareness — Responses to grammatical errors in the Qur'an","type":"muslim","url":"https://www.islamic-awareness.org/quran/text/grammar/gramrefut"},{"name":"Tulayhah — al-Suyuti on alleged grammatical errors","type":"muslim","url":"https://tulayhah.wordpress.com/2022/09/12/alleged-grammatical-errors-in-the-quran-al-suyooti/"},{"name":"IslamQA 135752 — Reports attributing linguistic errors to the Qur'an","type":"muslim","url":"https://islamqa.info/en/answers/135752"},{"name":"The Islam Issue — Scribal mistakes and variants in the Quran","type":"apologetics","url":"https://theislamissue.wordpress.com/2021/10/30/scribal-mistakes-and-variants-in-the-quran/"}],"response":"Muslim grammarians and modern academics, including Islamic Awareness, answer that these are attested classical Arabic and not errors. The form in 4:162 and 2:177 is the well-known qat' construction, used for praise, meaning 'and especially those who...', and it appears in pre-Islamic poetry. The form in 5:69 can be a delayed topic. And 20:63's hadhani matches the speech of certain Arab tribes, said to be Banu al-Harith, who keep the same dual form in every case. The earliest word scholars knew that reading. The Uthman and Aisha reports, they argue, are unreliable. Their chains are contested. Lahn in early usage could mean a style of reciting rather than an error. And it is hard to believe Uthman would standardise a text he thought faulty, while companions who had memorised it raised no objection. Grammar books were written after the Quran, and partly from it.","responseSource":{"name":"Islamic Awareness — Responses to grammatical errors in the Qur'an","url":"https://www.islamic-awareness.org/quran/text/grammar/gramrefut"},"verdict":"contested","rationale":"This is graded contested because the Muslim defences have real substance. Several forms do have parallels in old poetry and tribal speech. Grammar books came after the Quran. And the Uthman and Aisha reports carry disputed chains, so this site will not lean on reports it would reject if they favoured Islam. What survives is narrower but still notable. A book whose signature miracle is perfect language holds a handful of forms that needed generations of repair, dialect appeals and case-by-case pleading. And the earliest Muslims passed on reports alleging scribal error, which is not what a community sure of perfect wording tends to keep. Use this only with someone who cares about the i'jaz argument. It carries no weight with an ordinary Muslim friend and can look like nit-picking. Note too that Christianity claims God-breathed meaning through human authors (Luke 1:1-4), not dictated perfection of wording. The comparison of claims is the real point.","severity":"medium","plain":[{"t":"The claim the Quran makes","d":"Its great miracle is its language. <b>\"Produce a surah like it\"</b> (Quran 2:23). It calls itself clear Arabic (12:2)."},{"t":"What grammarians noted","d":"Arabic marks case with word endings. In four places the endings do not follow the rule. Quran 4:162 has <i>al-muqimina</i> in one case while the nouns around it are in another. Quran 5:69 has <i>al-sabi'una</i> in a form the word <i>inna</i> should not allow. Compare 2:62 and 22:17, where the same word follows the rule. Quran 20:63 reads <i>inna hadhani la-sahirani</i>, where <i>inna</i> calls for <i>hadhayni</i>. Quran 2:177 does the same with <i>al-sabirina</i>."},{"t":"Two early reports, both disputed","d":"Uthman is said to have looked at the text and said: <b>\"I see errors (lahn) in it, and the Arabs will correct them with their tongues.\"</b> A report in Abu Ubayd's <i>Fada'il al-Qur'an</i> has Aisha say that 4:162, 5:69 and 20:63 are the fault of the scribes. Both reports have weak chains. Muslim scholars reject them or read them another way."},{"t":"The Muslim answer, at full strength","d":"Islamic Awareness says these are known forms, not errors. The odd ending in 4:162 and 2:177 is the <i>qat'</i> form, used for praise. It turns up in old Arab poetry. The one in 5:69 can be a late topic. The <i>hadhani</i> of 20:63 fits the speech of some tribes, said to be Banu al-Harith, who kept the same form in every case. Early word scholars knew that. As for the two reports, the chains are weak. <i>Lahn</i> may mean a way of reading, not a fault. And it is odd to think Uthman would fix a text he judged broken. Grammar books came after the Quran, and partly from it."},{"t":"How strong is this argument?","d":"Genuinely arguable, and use it rarely. Several of these forms do have real parallels. This site will not lean on reports it would reject if they helped Islam. What is left is smaller. A book whose miracle is perfect speech needed centuries of case-by-case repair. And the first Muslims passed on reports of scribal error. Note the difference in claims. We claim God-breathed meaning through human writers (Luke 1:1-4), not dictated perfect speech. Use this only with someone who cares about <i>i'jaz</i>. To anyone else it looks like nit-picking."},{"say":true,"t":"What to say","d":"\"The i'jaz argument matters to you. May I ask how you read Quran 5:69?\""}],"rewritten":true,"refwhy":{"Luke 1:1-4":"Luke says he looked into it and wrote. We claim God-breathed meaning through human writers.","2 Peter 1:21":"Says men spoke as they were moved by the Holy Ghost. The same claim, from the other side.","2 Timothy 3:16":"'All scripture is given by inspiration of God.' What is claimed, and what is not claimed.","Quran 4:162":"Has al-muqimina in one case while the words around it stand in another. The first example.","Quran 5:69":"Has al-sabi'una in a form inna should not allow. Compare 2:62, where the rule is kept.","Quran 20:63":"Reads inna hadhani, where the rule calls for hadhayni. The most discussed of the four.","Quran 2:177":"The praise form again, with al-sabirina. The fourth item on the list.","Quran 2:23":"The challenge: produce a surah like it. The claim these forms are measured against.","Quran 12:2":"Calls the Quran clear Arabic. The other half of the claim being tested."},"titleLong":"Grammatical Irregularities in a Book Claiming Perfect Eloquence"},
{"id":"quran-65-4-child-iddah","title":"Quran 65:4: divorce rules for wives before puberty","category":"practice","claim":"Quran 65:4 legislates the iddah, the waiting period after divorce, for three groups of wives, including those 'who have not menstruated'. The classical commentators — al-Tabari, Ibn Kathir and the standard tafsir tradition — uniformly read this as girls who have not yet reached puberty. Since Quran 33:49 says no iddah exists at all for an unconsummated marriage, the verse presupposes consummated marriages to prepubescent girls. That embeds child marriage in the Quran's own divorce legislation, independently of the Aisha biography.","quran":["Quran 65:4","Quran 33:49"],"hadith":["Sahih al-Bukhari 5134 (cross-reference: consummation at nine)"],"bible":[],"sources":[{"name":"Tafsir Ibn Kathir on 65:4","type":"muslim","url":"https://quranx.com/Tafsir/Kathir/65.4"},{"name":"Ma'arif al-Qur'an on 65:4","type":"muslim","url":"https://quran.com/en/65:4/tafsirs/en-tafsir-maarif-ul-quran"},{"name":"Discover The Truth — 'Quran 65:4 – The Child Marriage Claim' (Muslim response)","type":"muslim","url":"https://discover-the-truth.com/2016/03/12/quran-654-the-child-marriage-claim/"},{"name":"Sahih al-Bukhari 5134","type":"primary","url":"https://sunnah.com/bukhari:5134"}],"response":"Modern apologists, such as Discover The Truth, argue that 'those who have not menstruated' refers to adult women with delayed menarche or amenorrhea, not to children. They add that the verse addresses waiting periods generally without endorsing child marriage, and some note that a marriage contract does not imply consummation. This stands in contrast with the classical position in Ibn Kathir and in Ma'arif al-Qur'an, which state that the verse covers 'the young who have not reached the years of menstruation'.","responseSource":{"name":"Modern apologetic (e.g., Discover The Truth); contrast the classical position in Ibn Kathir and Ma'arif al-Qur'an, which state the verse covers 'the young who have not reached the years of menstruation'","url":"https://quranx.com/Tafsir/Kathir/65.4"},"verdict":"unrefuted","rationale":"The delayed-menarche reading is a modern retrofit held by no classical authority. The tafsir tradition is unanimous that the clause covers the not-yet-pubescent, and the fiqh manuals of all four schools drew the corresponding rule. The iddah logic is the trap. Quran 33:49 removes any waiting period for unconsummated marriages, so an iddah for the never-menstruated only has work to do if such marriages were consummated. This is the legislative twin of the Aisha case. Even if every biographical report were discarded, the law would remain in the text.","severity":"high","plain":[{"t":"What the verse legislates","d":"Quran 65:4 sets the <i>iddah</i> — the waiting period after divorce — for three groups of wives. One group is those <b>\"who have not yet menstruated.\"</b>"},{"t":"How the classical scholars read it","d":"Al-Tabari, Ibn Kathir and the standard tafsir tradition all read this as girls who have not yet reached puberty. <i>Ma'arif al-Qur'an</i> says the verse covers the young who have not reached the years of menstruation. The law manuals of all four schools drew the matching rule."},{"t":"The logic that closes it","d":"Quran 33:49 says there is no waiting period at all if a marriage was not consummated. So a waiting period for a girl who has never menstruated only has work to do if such marriages were consummated. That is the trap, and it is inside the law itself."},{"t":"The Muslim answer, at full strength","d":"Modern writers, such as Discover The Truth, argue that the phrase means adult women whose periods are late or absent. They add that the verse sets waiting periods in general and does not endorse child marriage. Some also note that a marriage contract does not imply consummation."},{"t":"How strong is this argument?","d":"Strong for you, and it does not depend on any biography. The late-periods reading is a modern retrofit, held by no classical authority. The tafsir tradition is unanimous the other way. So even if every report about Aisha were set aside, the law would still be in the text. Raise it quietly. This is painful ground, not a scoring opportunity."},{"say":true,"t":"What to say","d":"\"How do Ibn Kathir and al-Tabari explain the last group in Quran 65:4? That is what I keep coming back to.\""}],"rewritten":true,"refwhy":{"Quran 65:4":"The verse itself. It sets a waiting period for wives 'who have not yet menstruated'.","Quran 33:49":"Says there is no waiting period if the marriage was not consummated. That closes the logic.","Sahih al-Bukhari 5134 (cross-reference: consummation at nine)":"The Aisha report, here only as a cross-reference. This case holds without it, since the law is in the text."},"titleLong":"Quran 65:4: a divorce waiting period for wives 'who have not yet menstruated'"},
{"id":"four-witnesses-rape-standard","title":"Four witnesses to prove rape, or eighty lashes","category":"practice","claim":"Quran 24:4 requires four eyewitnesses to prove unlawful intercourse. An accuser who cannot produce them receives eighty lashes, and 24:13 applies the same test. Classical fiqh placed rape, zina-bil-jabr, under the rules of proof for zina. Pakistan wrote that into the 1979 Hudood Ordinance. The result is documented. Women who reported rape were prosecuted for zina, their complaint read as an admission of intercourse they could not prove was forced. It took secular law, the Women's Protection Act of 2006, to move rape out of that framework and back into the Penal Code.","quran":["Quran 24:4","Quran 24:13","Quran 24:2"],"hadith":[],"bible":["Deuteronomy 22:25-27"],"sources":[{"name":"Offence of Zina (Enforcement of Hudood) Ordinance 1979 — text and commentary, Harvard Islamic Law Blog","type":"scholarly","url":"https://islamiclaw.blog/2017/05/15/offence-of-zina-enforcement-of-hudood-ordinance-1979-pakistan/"},{"name":"'Twenty-Five Years of Hudood Ordinances — A Review', Washington & Lee Law Review","type":"scholarly","url":"https://scholarlycommons.law.wlu.edu/cgi/viewcontent.cgi?httpsredir=1&article=1207&context=wlulr"},{"name":"Women's Protection Bill (2006) — Wikipedia","type":"institutional","url":"https://en.wikipedia.org/wiki/Women's_Protection_Bill"},{"name":"Al Jazeera — 'Pakistan compromises on rape law' (2006)","type":"journalism","url":"https://www.aljazeera.com/news/2006/9/12/pakistan-compromises-on-rape-law"}],"response":"Muslims respond that the original purpose of 24:4 was protective, shielding women from casual accusations of adultery, since its occasion was the slander of Aisha. They add that rape could alternatively be prosecuted as hiraba, violent crime, without four witnesses. And they argue that the Hudood Ordinance was bad man-made legislation rather than true sharia — as shown by the Pakistani religious scholars who supported the 2006 reform. Both the reformist and traditional positions are surveyed in the Washington and Lee Law Review article on twenty-five years of the Hudood Ordinances and in the 2006 reform debate.","responseSource":{"name":"Reformist and traditional jurists as surveyed in the Washington & Lee Law Review article and the 2006 reform debate","url":"https://islamiclaw.blog/2017/05/15/offence-of-zina-enforcement-of-hudood-ordinance-1979-pakistan/"},"verdict":"unrefuted","rationale":"The protective-intent point about slander is genuine and should be conceded. But the case is about downstream application. The classical manuals did apply zina's evidentiary bar to rape claims. The hiraba route was the minority workaround rather than the operative rule. And when a modern state implemented the classical framework, the predicted injustice occurred at scale for 27 years. The instructive contrast is Deuteronomy 22:25-27, which explicitly declares the rape victim innocent — 'to the young woman you shall do nothing' — with no witness quota imposed on her. As a usage note, lead with the Pakistan history, which is documented, and acknowledge 24:4's anti-slander context up front. It makes the argument stronger, not weaker.","severity":"high","plain":[{"t":"What the verse requires","d":"Quran 24:4 requires four eyewitnesses to prove unlawful intercourse. An accuser who cannot produce them receives eighty lashes. Quran 24:13 applies the same test."},{"t":"Concede the purpose first","d":"The rule was there to protect. It came after the slander of Aisha. Its aim was to shield women from loose talk. Say that up front. It makes the argument stronger, not weaker."},{"t":"What happened in practice","d":"The old law books put rape, <i>zina-bil-jabr</i>, under the same rules of proof as <i>zina</i>. Pakistan wrote that into the 1979 Hudood Ordinance. The result is on record. Women who reported rape were charged instead. Their report was read as an admission of an act they could not prove was forced. It took the Women's Protection Act of 2006 to move rape back into the Penal Code."},{"t":"The Muslim answer, at full strength","d":"Muslims reply that 24:4 was meant to protect, not to trap. They add that rape could be prosecuted instead as <i>hiraba</i>, violent crime, with no four-witness bar. And they argue the Hudood Ordinance was bad human legislation rather than true sharia — as shown by the Pakistani religious scholars who supported the 2006 reform."},{"t":"How strong is this argument?","d":"Strong for you, but it is about application, not intent. The classical manuals did apply the <i>zina</i> bar to rape claims. The <i>hiraba</i> route was the minority workaround, not the working rule. And when a modern state implemented the classical framework, the predictable injustice happened at scale for 27 years. Compare Deuteronomy 22:25-27, which declares the victim innocent — <b>\"to the young woman you shall do nothing\"</b> — with no witness quota placed on her."},{"say":true,"t":"What to say","d":"\"I know the four-witness rule was meant to stop slander. Can we look at what happened in Pakistan?\""}],"rewritten":true,"refwhy":{"Deuteronomy 22:25-27":"Declares the victim innocent: 'to the young woman you shall do nothing'. Quoted in the case.","Quran 24:4":"The four-witness rule, with eighty lashes for an accuser who cannot meet it.","Quran 24:13":"Applies the same four-witness test again, in the passage about the slander of Aisha.","Quran 24:2":"Sets the hundred lashes for zina. That is the penalty the proof rule attaches to."},"titleLong":"Four witnesses: the evidence standard that turned rape victims into defendants"},
{"id":"iblis-angel-or-jinn","title":"Iblis: counted among angels, called a jinn","category":"quran-text","claim":"Five times the Quran says the angels were commanded to prostrate to Adam, 'and they prostrated, except Iblis' (2:34; 7:11; 15:30-31; 20:116; 38:73-74). That is grammar which counts Iblis among the angels. But 18:50 says 'he was of the jinn, so he rebelled'. The Quran also says angels never disobey Allah (66:6), yet on the angel reading Iblis did exactly that. And Iblis says he was created from fire (7:12), while the hadith says angels were created from light and jinn from smokeless fire (Sahih Muslim 2996).","quran":["Quran 2:34","Quran 7:11-12","Quran 15:30-31","Quran 18:50","Quran 66:6","Quran 38:73-74"],"hadith":["Sahih Muslim 2996 (angels created from light, jinn from smokeless fire)"],"bible":[],"sources":[{"name":"'Iblis is not an Angel…' — survey of classical tafsir on 2:34","type":"muslim","url":"https://daralnicosia.wordpress.com/2013/11/02/iblis-is-not-an-angel-tafsir-of-al-baqara-verse-34/"},{"name":"'The nature of Iblis in the Qur'an as interpreted by the commentators' — University of Malta","type":"scholarly","url":"https://www.um.edu.mt/library/oar/bitstream/123456789/32716/1/The_nature_of_Iblis_%20in_the_Quran_as_interpreted_by_the_commentators.pdf"},{"name":"Bilal Ali Ansari — 'The Question of Fallen Angels and the Nature of Iblis'","type":"muslim","url":"https://bilalaliansari.com/2015/07/10/the-question-of-fallen-angels-and-the-nature-of-iblis-was-satan-an-angel-or-of-the-jinn/"},{"name":"Answering Islam — 'Is Satan an Angel or a Jinn?'","type":"apologetics","url":"https://www.answering-islam.org/Quran/Contra/iblis.html"}],"response":"The tafsir literature offers three classical harmonisations. Al-Tabari, following reports from Ibn Abbas, holds that Iblis belonged to a tribe of angels called 'jinn', guardians of Paradise, created from fire. Al-Hasan al-Basri, cited approvingly by Ibn Kathir, holds that Iblis 'was not an angel for the twinkling of an eye', and that the exception in 2:34 is a disconnected exception, meaning he was merely among the angels when the command came. Al-Baydawi holds that he was created an angel and became jinn by his deed.","responseSource":{"name":"Al-Tabari, Ibn Kathir (via al-Hasan al-Basri), al-Baydawi — as surveyed in the tafsir literature above","url":"https://daralnicosia.wordpress.com/2013/11/02/iblis-is-not-an-angel-tafsir-of-al-baqara-verse-34/"},"verdict":"contested","rationale":"The tradition never settled it, and the rescues are mutually exclusive. Al-Tabari's 'angelic tribe called jinn' preserves the grammar of 2:34, but it collides with 66:6, since angels cannot disobey, and with the light-and-fire distinction. Al-Hasan al-Basri's 'never an angel' saves 18:50, but only by making the Quran's own repeated sentence structure misleading five times over. In conversation this is a clean, self-contained internal-consistency test that requires no external sources, only the Quran read carefully. Pick either horn and let the tafsir tradition supply the contradiction.","severity":"medium","plain":[{"t":"The sentence repeated five times","d":"The angels are told to bow to Adam, <b>\"and they prostrated, except Iblis\"</b> (Quran 2:34; 7:11; 15:30-31; 20:116; 38:73-74). That grammar counts Iblis among the angels."},{"t":"The verse that pulls the other way","d":"Quran 18:50 says <b>\"he was of the jinn, so he rebelled.\"</b> Two more details tighten it. Quran 66:6 says angels never disobey Allah. And Iblis says he was made from fire (7:12), while Sahih Muslim 2996 says angels were made from light and jinn from smokeless fire."},{"t":"The Muslim answer, at full strength","d":"The tafsir tradition offers three repairs. Al-Tabari, following reports from Ibn Abbas, says Iblis belonged to a tribe of angels called jinn, guardians of Paradise, made from fire. Al-Hasan al-Basri, cited approvingly by Ibn Kathir, says Iblis <b>\"was not an angel for the twinkling of an eye\"</b> — the exception in 2:34 is disconnected, meaning he was merely present when the command came. Al-Baydawi says he was created an angel and became jinn by his deed."},{"t":"Where that runs out","d":"The tradition never settled it, and the three repairs rule each other out. Al-Tabari's angel-tribe saves the grammar of 2:34 but collides with 66:6 and with the light-and-fire distinction. Al-Hasan al-Basri's answer saves 18:50, but only by making the Quran's own repeated sentence misleading five times over."},{"t":"How strong is this argument?","d":"Genuinely arguable, but unusually clean in conversation. It needs no outside sources at all, only the Quran read slowly. Pick either horn and let the tafsir tradition supply the other."},{"say":true,"t":"What to say","d":"\"Was Iblis an angel or a jinn? I have read three answers from your scholars and they disagree.\""}],"rewritten":true,"refwhy":{"Quran 2:34":"'They prostrated, except Iblis.' That sentence counts him among the angels.","Quran 7:11-12":"The same scene, plus his reason. He was made from fire, and Adam from clay.","Quran 15:30-31":"The same exception again. The repeating makes the grammar hard to wave away.","Quran 18:50":"'He was of the jinn, so he rebelled.' The verse that pulls the other way.","Quran 66:6":"Says the angels do not disobey Allah. That is what makes the angel reading costly.","Quran 38:73-74":"The fifth telling of the same exception. Same wording, same problem.","Sahih Muslim 2996 (angels created from light, jinn from smokeless fire)":"In Sahih Muslim: angels from light, jinn from fire. It sharpens the question of which one Iblis was."},"titleLong":"Satan: angel or jinn? The exception that breaks the sentence"},
{"id":"creation-six-or-eight-days","title":"Surah 41 adds up to eight days, not six","category":"science-history","claim":"Four passages say the heavens and earth were created in six days: 7:54, 10:3, 11:7 and 25:59. But 41:9-12 itemises the stages. The earth took two days. Then, thumma, mountains and provisions took four days. Then, thumma, the seven heavens took two days. Two plus four plus two is eight. There is a bonus tension as well. In 41:9-12 the earth is completed before the heavens, while 79:27-30 builds the heaven first and spreads the earth 'after that', ba'da dhalika.","quran":["Quran 41:9-12","Quran 7:54","Quran 10:3","Quran 79:27-30"],"hadith":[],"bible":["Genesis 1:1-31","Exodus 20:11"],"sources":[{"name":"IslamQA 31865 — 'Were the Heavens and Earth Created in 6 or 8 Days?'","type":"muslim","url":"https://islamqa.info/en/answers/31865"},{"name":"Answering Islam — 'Six or eight days of creation?'","type":"apologetics","url":"https://www.answering-islam.org/Quran/Contra/i010.html"},{"name":"The Dawah Script — Surah 41:9-12 dialogue treatment","type":"apologetics","url":"https://www.thedawahscript.com/en/Islamic-Dilemma/41/9-12"}],"response":"The standard answer comes from IslamQA 31865, following Tafsir Ibn Kathir on 41:9-12. The 'four days' of 41:10 are inclusive. The earth was created in two days and its mountains and provisions in two more, so 'four days' means four in total up to that point. Four plus two is six.","responseSource":{"name":"IslamQA 31865 / Tafsir Ibn Kathir on 41:9-12","url":"https://islamqa.info/en/answers/31865"},"verdict":"contested","rationale":"The inclusive reading has to fight the text's own conjunction. Each stage is introduced with thumma, 'then', which in Arabic marks sequence rather than overlap. Nobody reads 'I built the house in two days, then finished the roof in four days' as six days total, except by special pleading. Translators sympathetic to the harmonisation must insert parenthetical glosses, such as 'four days including the former two', that are not in the Arabic. Note honestly if it is raised that Christians read Genesis's days in more than one way too. But Genesis's numbers at least add up.","severity":"medium","plain":[{"t":"The stated total","d":"Four passages say the heavens and the earth were made in six days. They are Quran 7:54, 10:3, 11:7 and 25:59."},{"t":"The itemised list","d":"Quran 41:9-12 breaks it down. The earth in two days. Then, <i>thumma</i>, mountains and provisions in four days. Then, <i>thumma</i>, the seven heavens in two days. Two plus four plus two is eight."},{"t":"A second tension","d":"In 41:9-12 the earth is finished before the heavens. In Quran 79:27-30 the heaven is built first and the earth spread out <b>\"after that\"</b> — <i>ba'da dhalika</i>."},{"t":"The Muslim answer, at full strength","d":"IslamQA 31865, following Ibn Kathir, gives the standard reply. The four days of 41:10 are inclusive. The earth took two days, and its mountains and provisions took two more, so four means four in total up to that point. Four plus two is six."},{"t":"How strong is this argument?","d":"Genuinely arguable, and small. The inclusive reading has to fight the word <i>thumma</i>, which marks sequence in Arabic. Translators who favour the harmony insert glosses that are not in the Arabic. Be honest if it comes up: Christians read the days of Genesis in more than one way too. Genesis simply does not have this arithmetic problem."},{"say":true,"t":"What to say","d":"\"Two, then four, then two. How do you get six out of that? I would like to understand it.\""}],"rewritten":true,"refwhy":{"Genesis 1:1-31":"The six-day account. Christians read the days in more than one way, but the count is plain.","Exodus 20:11":"'In six days the LORD made heaven and earth.' The Bible's total, stated once and left alone.","Quran 41:9-12":"The itemised list. Two days, then four, then two. This is the arithmetic in question.","Quran 7:54":"One of the four verses that give the total as six days.","Quran 10:3":"A second six-day verse. Both are here so you can see the total is not a one-off.","Quran 79:27-30":"Builds the heaven first, then spreads the earth 'after that'. The second tension in the case."},"titleLong":"Six days or eight? The arithmetic of Surah 41"},
{"id":"qadar-created-for-hell","title":"'We have created for Hell many of mankind' (7:179)","category":"doctrine-of-god","claim":"The Quran teaches that Allah decrees everything, including belief and disbelief. 'We have created for Hell many of the jinn and mankind' (7:179). 'Whomever Allah leaves astray, none can guide' (7:178). 'Nothing will befall us except what Allah has decreed for us' (9:51). 'You do not will unless Allah wills' (76:30; 81:29). In Sahih al-Bukhari 6594 the angel writes each person's deeds, and whether he is 'doomed or blessed', before birth. Sahih al-Bukhari 6596 is titled 'The pen has dried'. So Allah creates people for Hell and then punishes them for what he decreed.","quran":["Quran 7:178-179","Quran 9:51","Quran 32:13","Quran 76:30","Quran 14:4","Quran 81:29"],"hadith":["Sahih al-Bukhari 6594","Sahih al-Bukhari 6596"],"bible":["Ezekiel 18:23","Ezekiel 33:11","1 Timothy 2:3-4","2 Peter 3:9","Deuteronomy 30:19"],"sources":[{"name":"Sahih al-Bukhari 6594 — the angel writes doomed or blessed","type":"primary","url":"https://sunnah.com/bukhari:6594"},{"name":"Sahih al-Bukhari 6596 — 'The pen has become dry'","type":"primary","url":"https://sunnah.com/bukhari:6596"},{"name":"IslamQA 264354 — 'Reconciling the Divine Decree and Free Will'","type":"muslim","url":"https://islamqa.info/en/answers/264354"},{"name":"Abu Amina Elias — 'Pens have dried upon Allah's decree'","type":"muslim","url":"https://www.abuaminaelias.com/dailyhadithonline/2017/04/05/pens-dried-qadr-allah/"}],"response":"Sunni orthodoxy answers with the Ash'ari doctrine of kasb, or acquisition. Allah creates every act, but the human 'acquires' it and so bears responsibility. Foreknowledge and the writing of it are not compulsion. And 32:13 — 'had We willed, We could have given every soul its guidance' — shows that guidance withheld is withheld justly. IslamQA 264354 frames this as a matter where reason must submit. Both the decree and human responsibility are affirmed, without full reconciliation.","responseSource":{"name":"Ash'ari kalam (kasb); IslamQA 264354","url":"https://sunnah.com/bukhari:6594"},"verdict":"contested","rationale":"Kasb re-labels the problem rather than solving it. Muslim scholars themselves proverbially listed al-Ash'ari's kasb among the famously unintelligible doctrines. And the Quran's language is stronger than mere foreknowledge: created for Hell (7:179), 'I will surely fill Hell' (32:13), and Allah 'sends astray whom He wills' (14:4). The biblical contrast is the point for conversation. The God of Scripture 'takes no pleasure in the death of the wicked' (Ezekiel 33:11; compare 18:23), 'desires all people to be saved' (1 Timothy 2:4; 2 Peter 3:9), and pleads 'choose life' (Deuteronomy 30:19). Christians who debate sovereignty and freedom do so inside those constraints; the Quran removes them. Handle with care, since a Muslim may quote Calvinist material back. The answer is that no Christian tradition teaches that God delights in damnation, or creates men in order to damn them.","severity":"high","plain":[{"t":"What qadar teaches","d":"<i>Qadar</i> is the Islamic doctrine of divine decree. Allah decrees everything, including who believes and who does not."},{"t":"The verses","d":"<b>\"We have created for Hell many of the jinn and mankind\"</b> (Quran 7:179). <b>\"Whomever Allah leaves astray, none can guide\"</b> (7:178). <b>\"Nothing will befall us except what Allah has decreed for us\"</b> (9:51). <b>\"You do not will unless Allah wills\"</b> (76:30; 81:29). Quran 14:4 says he sends astray whom he wills."},{"t":"What the hadith add","d":"In Sahih al-Bukhari 6594 an angel writes each person's deeds before birth, and whether he is doomed or blessed. Sahih al-Bukhari 6596 is headed <b>\"The pen has dried.\"</b> So people are made for Hell, and then punished for what was written."},{"t":"The Muslim answer, at full strength","d":"Sunni orthodoxy answers with <i>kasb</i>, acquisition, from the Ash'ari school. Allah creates every act, but the person acquires it, and so bears the blame. Knowing in advance is not forcing. Quran 32:13 says he could have given every soul its guidance, so guidance withheld is just. IslamQA 264354 says both decree and responsibility are affirmed, and that reason must submit where it cannot join them."},{"t":"How strong is this argument?","d":"Genuinely arguable, and handle it with care. <i>Kasb</i> renames the problem rather than solving it — Muslim scholars themselves listed it among the famously obscure doctrines. But your friend may quote Calvinist writers back at you, and fairly. Christians argue hard about sovereignty and freedom too. The answer is that no Christian tradition says God delights in damnation, or makes men in order to damn them."},{"say":true,"t":"What to say","d":"\"Our God says he takes no pleasure in the death of the wicked, and pleads with people to choose life. Ezekiel 33:11, Deuteronomy 30:19.\""}],"rewritten":true,"refwhy":{"Ezekiel 18:23":"Asks whether God has any pleasure in the death of the wicked. The answer given is no.","Ezekiel 33:11":"'I have no pleasure in the death of the wicked.' Quoted in the case as the contrast.","1 Timothy 2:3-4":"Says God would have all men saved. The New Testament half of the same point.","2 Peter 3:9":"Says he is not willing that any should perish. A second witness to that desire.","Deuteronomy 30:19":"'Choose life.' A real command implies a real choice. Quoted in the case.","Quran 7:178-179":"'We have created for Hell many of the jinn and mankind', and none can guide whom He leaves astray.","Quran 9:51":"Says nothing befalls us but what Allah has decreed. The decree stated broadly.","Quran 32:13":"Says He could have guided every soul, and that He will fill Hell. Both sides quote this one.","Quran 76:30":"'You do not will unless Allah wills.' The will itself is placed under the decree.","Quran 14:4":"Says He leaves astray whom He wills, and guides whom He wills.","Quran 81:29":"The same line as 76:30, in a short late surah. The repeating is the point.","Sahih al-Bukhari 6594":"In Bukhari: an angel writes the deeds, and whether he is doomed or blessed, before birth.","Sahih al-Bukhari 6596":"In Bukhari, under the heading 'the pen has dried'. The decree is treated as already closed."},"titleLong":"Qadar: 'We have created for Hell many jinn and men'"},
{"id":"triple-talaq-halala","title":"Halala: a one-night marriage so she can remarry","category":"practice","claim":"Quran 2:230 says that after a third divorce a woman is not lawful to her husband again 'until she has married another husband'. Muhammad applied it literally. When Rifa'a's thrice-divorced wife wanted to return to him, he answered, 'No — not until he tastes your sweetness and you taste his sweetness' (Sahih al-Bukhari 5260), meaning the intervening marriage must be consummated. The rule generated halala, or tahleel — arranged one-night marriages to re-legalise a wife — a practice still sold as a service today. And instant triple talaq remained live law until Muslim-majority jurisdictions legislated against it. In India it was struck down in Shayara Bano in 2017 and criminalised in 2019.","quran":["Quran 2:229-230"],"hadith":["Sahih al-Bukhari 5260","Sahih al-Bukhari 5261"],"bible":["Matthew 19:8-9","Malachi 2:16"],"sources":[{"name":"Sahih al-Bukhari 5260","type":"primary","url":"https://sunnah.com/bukhari:5260"},{"name":"IslamQA 159041 — reconciling the hadiths forbidding tahleel with the wife of Rifa'a","type":"muslim","url":"https://islamqa.info/en/answers/159041/"},{"name":"Shayara Bano v. Union of India (2017) — case summary","type":"scholarly","url":"https://www.drishtijudiciary.com/landmark-judgement/muslim-law/shayara-bano-v-union-of-india-and-ors-air-2017-sc-4609"},{"name":"Muslim Women (Protection of Rights on Marriage) Act, 2019 — Wikipedia","type":"scholarly","url":"https://en.wikipedia.org/wiki/Muslim_Women_(Protection_of_Rights_on_Marriage)_Act,_2019"}],"response":"Muslims respond on three fronts. First, a contracted halala — marrying with the prior intention of divorcing in order to re-legalise the woman — is itself cursed and invalid in the hadith, since the muhallil, 'the one who makes lawful', is condemned; see IslamQA 159041. Second, the rule in 2:230 is a deterrent, designed to make men take divorce seriously. Third, instant triple talaq in one sitting, talaq-e-biddat, is a condemned innovation and not original Islam.","responseSource":{"name":"IslamQA 159041; mainstream Sunni fiqh on tahleel","url":"https://sunnah.com/bukhari:5260"},"verdict":"admitted","rationale":"The curse on the muhallil only forbids the arrangement being explicit. The underlying rule stands on any reading. A thrice-divorced woman cannot return to her husband until another man has consummated a marriage with her, and Sahih al-Bukhari 5260 puts the consummation requirement in Muhammad's own mouth. The 'deterrent' framing concedes the mechanism, since the deterrent's payload is the wife's sexual union with another man. The clandestine halala-service market, documented by the BBC in the UK and litigated in India, is the rule's predictable equilibrium. And it took a secular constitutional court, over the opposition of the All India Muslim Personal Law Board, to kill the trigger practice. Contrast Jesus: divorce concessions exist 'because of your hardness of heart' (Matthew 19:8-9), with no ritual requiring the woman's body as the price of reconciliation.","severity":"high","plain":[{"t":"The rule","d":"A husband may divorce by pronouncement. After the third one it is final. Quran 2:230 then says the woman is not lawful to him again <b>\"until she has married another husband.\"</b>"},{"t":"How Muhammad applied it","d":"Rifa'a's thrice-divorced wife wanted to return to him. The answer was: <b>\"No — not until he tastes your sweetness and you taste his sweetness\"</b> (Sahih al-Bukhari 5260). That means the marriage in between must be consummated."},{"t":"What the rule produced","d":"<i>Halala</i>, also called <i>tahleel</i>. It is an arranged marriage for one night, so a couple can remarry. It is still sold as a service today, documented by the BBC in the UK. Instant triple talaq stayed live law until courts acted. India struck it down in <i>Shayara Bano</i> in 2017 and made it a crime in 2019."},{"t":"The Muslim answer, at full strength","d":"IslamQA 159041 answers on three fronts. An arranged <i>halala</i> is itself cursed and invalid, since the hadith condemn the <i>muhallil</i>, the man who makes her lawful. The rule in 2:230 is a deterrent, meant to make men take divorce seriously. And instant triple talaq in one sitting, <i>talaq-e-biddat</i>, is a condemned innovation rather than original Islam."},{"t":"How strong is this argument?","d":"They admit the rule itself. The curse only forbids saying the plan out loud. Underneath, a thrice-divorced woman still cannot return until another man has consummated a marriage with her, and Bukhari 5260 puts that in Muhammad's own mouth. The deterrent framing concedes the mechanism, since the deterrent's payload is her body. And it took a secular court, against the All India Muslim Personal Law Board, to end the trigger. Compare Jesus: divorce was allowed for hardness of heart, with no ritual requiring a woman's body as the price of reconciliation."},{"say":true,"t":"What to say","d":"\"Why should a woman have to sleep with another man before her husband can take her back?\""}],"rewritten":true,"refwhy":{"Matthew 19:8-9":"Jesus says divorce was allowed for hardness of heart. No ritual is set as the price of return.","Malachi 2:16":"God says he hates putting away. The older statement of the same view of marriage.","Quran 2:229-230":"The divorce rule. After the third time, she is not lawful to him again 'until she has married another husband'.","Sahih al-Bukhari 5260":"In Bukhari: 'not until he tastes your sweetness'. That puts the rule in his own mouth.","Sahih al-Bukhari 5261":"A second telling of the same case in Bukhari. It is why the ruling is not disputed."},"titleLong":"Triple talaq and halala: the divorce that requires another man first"},
{"id":"surah-9-missing-basmala","title":"Surah 9: the missing 'in the name of God'","category":"quran-text","claim":"Surah 9, al-Tawbah or Bara'ah, is the only one of 114 surahs lacking the bismillah heading. Asked why, Uthman explained in Jami at-Tirmidhi 3086 that al-Anfal came early in Medina and Bara'ah late, that its subject matter resembled al-Anfal's, and that the Prophet died without clarifying whether it was part of it. 'So I put them adjacent and did not write the basmala between them.' The caliph who standardised the Quran describes a surah boundary settled by his own inference, not by revelation.","quran":["Quran 9:1"],"hadith":["Jami at-Tirmidhi 3086"],"bible":[],"sources":[{"name":"Jami at-Tirmidhi 3086","type":"primary","url":"https://sunnah.com/tirmidhi:3086"},{"name":"IslamQA 173672 — 'Why There Is No Bismillah in Surah At-Tawbah'","type":"muslim","url":"https://islamqa.info/en/answers/173672"},{"name":"Abu Amina Elias — why bismillah is missing from Surat al-Tawbah","type":"muslim","url":"https://www.abuaminaelias.com/dailyhadithonline/2012/04/16/surah-anfal-tawbah-bismillah/"},{"name":"The House of Wisdom — 'Surah Tawbah - No Basmalah?'","type":"muslim","url":"https://www.thehouseofwisdom.co.uk/articles/surah-tawbah-no-basmalah"}],"response":"The common devotional answer, surveyed at IslamQA 173672, is that the basmala, which is the mercy formula, was deliberately omitted because al-Tawbah opens with a declaration of war and the repudiation of treaties. A surah of the sword needs no invocation of mercy, a view attributed to Ali. Others hold that the surah order and boundaries were fixed by the Prophet's instruction, tawqifi. And Uthman's account is graded variously, with Darussalam calling it hasan while some later critics weaken it.","responseSource":{"name":"IslamQA 173672 and classical opinions surveyed there","url":"https://sunnah.com/tirmidhi:3086"},"verdict":"contested","rationale":"The two traditional answers undercut each other. If the omission were a revealed judgment about mercy and war, Uthman would not have explained it as his own uncertainty about where one surah ends and another begins. State the weakness plainly: the grading of Tirmidhi 3086 is contested, so use this as corroboration inside the compilation story rather than as your lead. This site's uthman-burning and compilation cases carry the primary weight. The undisputed core is untouched by the grading dispute. The basmala is missing, the companion codices ordered surahs differently, and the arrangement of the mushaf passed through editorial decisions made after Muhammad.","severity":"medium","plain":[{"t":"The odd one out","d":"Each chapter of the Quran opens the same way. It begins with the <i>basmala</i>: in the name of God, the Merciful, the Kind. One chapter does not. Surah 9 has no such line."},{"t":"What Uthman said","d":"He was asked why. His answer is in Jami at-Tirmidhi 3086. Surah 8 came early in Medina. Surah 9 came late. The two were alike in theme. The Prophet died and never said if they were one chapter or two. <b>\"So I put them adjacent and did not write the basmala between them.\"</b> The man who fixed the text is telling us he made a call."},{"t":"The Muslim answer, at full strength","d":"IslamQA 173672 gives the common answer. The line was left out on purpose. Surah 9 opens with war and the ending of treaties. A chapter of the sword needs no call for mercy. That view is traced to Ali. Others say the order of the chapters was set by the Prophet himself, which they call <i>tawqifi</i>. And the grading of Tirmidhi 3086 is in dispute. Darussalam calls it <i>hasan</i>. Some later critics call it weak."},{"t":"How strong is this argument?","d":"Genuinely arguable, and do not lead with it. The two answers cut against each other. If God had left the line out to mark a book of war, Uthman would not have said he was unsure where one chapter ended. But the grading fight is real. So use this to back up the wider story, not to open. The core is safe either way. The line is missing. Other copies had the chapters in a different order. And a man set the shape of the book after the Prophet died."},{"say":true,"t":"What to say","d":"\"Uthman said he made the call himself. What do you make of that?\""}],"rewritten":true,"refwhy":{"Quran 9:1":"The opening of the one surah with no basmala. Its war footing is part of the Muslim answer.","Jami at-Tirmidhi 3086":"From Tirmidhi, not one of the two Sahih books, and its grade is disputed. It holds Uthman's own account."},"titleLong":"The missing basmala: Uthman's editorial guess at Surah 9"},
{"id":"haman-in-pharaohs-egypt","title":"Haman in Pharaoh's Egypt, a thousand years early","category":"science-history","claim":"The Quran places a figure named Haman in Egypt as Pharaoh's officer at the time of Moses (28:6; 28:8; 28:38; 29:39; 40:24; 40:36-37). Pharaoh even asks Haman to fire bricks and build a lofty tower, so as to look upon the God of Moses. But Haman is the vizier of the Persian king in the book of Esther (3:1), set roughly a millennium after Moses. And the tower-to-heaven motif belongs to Babel (Genesis 11:3-4), where baked bricks are likewise specified. The Quran reads like a fusion of Esther's villain with the Babel story, relocated to Egypt — exactly the blend already circulating in Jewish midrashic storytelling.","quran":["Quran 28:6","Quran 28:38","Quran 40:36-37","Quran 29:39"],"hadith":[],"bible":["Esther 3:1","Genesis 11:3-4"],"sources":[{"name":"Adam J. Silverstein, 'Haman' (Princeton University Press)","type":"scholarly","url":"https://press.princeton.edu/books/hardcover/9780691203607/haman"},{"name":"Silverstein, 'Haman in the Qur'an' — chapter in 'Veiling Esther, Unveiling Her Story' (Oxford)","type":"scholarly","url":"https://academic.oup.com/book/10288/chapter/158003986"},{"name":"Islamic Awareness — 'Biblical Haman, Qur'anic Haman' (the hmn-h defense)","type":"muslim","url":"https://www.islamic-awareness.org/quran/contrad/external/haman.html"},{"name":"Jewish Review of Books — 'Haman, Builder of Towers, Brother of Abraham?'","type":"journalism","url":"https://jewishreviewofbooks.com/articles/6757/haman-builder-of-towers-brother-of-abraham/"}],"response":"Two Muslim defences are offered. The first is that the Quranic Haman is simply a different Egyptian with a similar name. The second is the 'scientific miracle' version, popularised from Maurice Bucaille and developed by Islamic Awareness. The letters hmn-h appear in an Egyptian name catalogue, as a chief of stone-quarry workers, so on this reading the Quran preserves an authentic Egyptian name that history had lost.","responseSource":{"name":"Islamic Awareness, following Bucaille","url":"https://press.princeton.edu/books/hardcover/9780691203607/haman"},"verdict":"unrefuted","rationale":"The hmn-h argument dissolves on inspection. It rests on reading a German-transliterated entry in a name lexicon. The reconstructed vowels are conjectural. No Egyptologist endorses 'Haman' as an Egyptian name. And the alleged quarry chief has no connection to Moses's era, or to a vizier's role. Meanwhile the academic treatment, by Adam J. Silverstein and published by Princeton and Oxford, concludes that both Hamans are the same folkloric villain, migrating between the Persian and Pharaonic courts through the fluidity of Near Eastern narrative. Silverstein is no Christian apologist. That frame concedes precisely what the dictation-from-heaven model cannot afford: the Quran inherited a literary character, complete with Babel's bricks and tower, and set him in the wrong court. It pairs naturally with this site's Samaritan-anachronism and Dhul-Qarnayn cases, as a third independent instance of the same pattern.","severity":"high","plain":[{"t":"Where the Quran puts Haman","d":"In Egypt, as Pharaoh's officer, in the time of Moses (Quran 28:6, 28:8, 28:38; 29:39; 40:24, 40:36-37). Pharaoh asks Haman to fire bricks and build a lofty tower, so he can look upon the God of Moses."},{"t":"Where the Bible puts him","d":"Haman is the vizier of the Persian king in the book of Esther (Esther 3:1). That is roughly a thousand years after Moses. And the tower-to-heaven with baked bricks belongs to Babel (Genesis 11:3-4)."},{"t":"What that looks like","d":"It reads as Esther's villain joined to the Babel story and moved to Egypt. That blend was already told in Jewish story-telling."},{"t":"The Muslim answer, at full strength","d":"Two lines are offered. The first is that this was a different man in Egypt with a like name. The second comes from Maurice Bucaille and was built out by Islamic Awareness. The letters <i>hmn-h</i> turn up in a list of Egyptian names. They belong to a chief of quarry men. So the Quran, they say, kept a real name that the world had lost."},{"t":"How strong is this argument?","d":"Strong for you, and the second answer does not survive checking. It rests on reading a German transliteration in a name lexicon. The vowels are a guess. No Egyptologist accepts Haman as an Egyptian name. And the quarry chief has no link to Moses's era or to a vizier's role. Meanwhile Adam J. Silverstein, who is no Christian apologist, concludes in his Princeton and Oxford studies that both Hamans are the same folk villain, moving between the Persian and Egyptian courts. That concedes the decisive point: the Quran inherited a literary character, bricks and tower included, and set him in the wrong court."},{"say":true,"t":"What to say","d":"\"Haman is the villain of Esther, in Persia, a thousand years later. Would you read the two accounts with me?\""}],"rewritten":true,"refwhy":{"Esther 3:1":"Where Haman actually appears. The Persian court, about a thousand years after Moses.","Genesis 11:3-4":"Babel, with baked bricks and a tower to heaven. The other half of the blend.","Quran 28:6":"Names Haman beside Pharaoh in Egypt. That placing is what the case is about.","Quran 28:38":"Pharaoh tells Haman to fire bricks and build a tower, to look upon the God of Moses.","Quran 40:36-37":"The same order to build a tower, told again. Repeating it rules out a slip.","Quran 29:39":"Lists Pharaoh, Haman and Korah together, which fixes Haman in the time of Moses."},"titleLong":"Haman in Pharaoh's Egypt: the Esther villain a thousand years early"},
{"id":"prophetic-medicine-science-test","title":"Dip the fly in your drink — Bukhari 3320","category":"science-history","claim":"Dawah routinely claims that Muhammad's words anticipate modern science. The sahih medical corpus is the test. Dip the fly in your drink, because one wing carries the disease and the other its cure (Sahih al-Bukhari 3320). The tribesmen of Ukl and Urayna were prescribed camel milk and camel urine as medicine (Sahih al-Bukhari 233; 5686). And black seed is 'a healing for every disease except death' (Sahih al-Bukhari 5688). A source reliable enough to establish embryology miracles is reliable enough to own these.","quran":[],"hadith":["Sahih al-Bukhari 3320","Sahih al-Bukhari 233","Sahih al-Bukhari 5686","Sahih al-Bukhari 5688"],"bible":[],"sources":[{"name":"Sahih al-Bukhari 3320 — the fly hadith","type":"primary","url":"https://sunnah.com/bukhari:3320"},{"name":"Sahih al-Bukhari 5686 — camel urine as medicine","type":"primary","url":"https://sunnah.com/bukhari:5686"},{"name":"Sahih al-Bukhari 5688 — black seed heals every disease","type":"primary","url":"https://sunnah.com/bukhari:5688"},{"name":"ICRAA — 'The Hadith of the Fly: Muslim Perspectives on Scientific Assessment'","type":"muslim","url":"https://www.icraa.org/the-hadith-of-the-fly-muslim-perspectives-on-scientific-assessment/"},{"name":"Camel urine — Wikipedia (WHO advisory)","type":"institutional","url":"https://en.wikipedia.org/wiki/Camel_urine"}],"response":"Three defences circulate. The first is vindication by study, citing a small 2021 Saudi-affiliated study on fly-wing dipping and assorted camel-urine papers as confirmation. The second is reclassification: prophetic medical statements are worldly opinion rather than revelation, following the date-pollination hadith, 'you know better the affairs of your world' (Sahih Muslim 2363). The third is that black seed's 'every disease' is idiomatic hyperbole for broad benefit. ICRAA and mainstream dawah treatments of the fly hadith set these out.","responseSource":{"name":"ICRAA and mainstream dawah treatments of the fly hadith","url":"https://sunnah.com/bukhari:3320"},"verdict":"admitted","rationale":"The defences cannot all be held at once, and each costs something. The vindication studies are small, in fringe journals, and post hoc — and the WHO warns against consuming camel urine, which was a live issue during MERS. The worldly-opinion escape hatch contradicts how the statements are framed, as categorical claims about disease, delivered as authoritative teaching and preserved in the medicine chapters of the Sahih. And once 'every disease except death' is hyperbole, the method that finds precise embryology in equally loose language collapses. As a usage note, deploy this as a response when the scientific-miracles claim is made. As a cold-open attack it reads as mockery and closes the conversation.","severity":"medium","plain":[{"t":"Why this case exists","d":"Muslim outreach often argues that Muhammad's words anticipate modern science. That argument sets a standard. This case applies the same standard to the medical hadith. It is a reply, not an opening move."},{"t":"What the sahih books say","d":"If a fly falls in your drink, dip it in, because one wing carries the disease and the other the cure (Sahih al-Bukhari 3320). The men of Ukl and Urayna were told to drink camel milk and camel urine as medicine (Sahih al-Bukhari 233; 5686). Black seed is <b>\"a healing for every disease except death\"</b> (Sahih al-Bukhari 5688)."},{"t":"The Muslim answer, at full strength","d":"Three defences circulate. First, vindication: a small 2021 Saudi-linked study on fly-wing dipping is cited, along with assorted camel-urine papers. Second, reclassification: prophetic medical statements are worldly opinion, not revelation — the date-pollination hadith says <b>\"you know better the affairs of your world\"</b> (Sahih Muslim 2363). Third, the black seed line is a figure of speech for broad benefit, not a literal claim."},{"t":"Where those collide","d":"They cannot all be held at once. The vindication studies are small, in fringe journals, and written after the fact — and the WHO warns against drinking camel urine, which was a live issue during MERS. The worldly-opinion escape clashes with how the statements are framed, as flat claims about disease, preserved in the medicine chapters of the Sahih. And once <b>\"every disease except death\"</b> is hyperbole, the method that finds precise embryology in equally loose wording collapses."},{"t":"How strong is this argument?","d":"They admit the texts, and the grading is not in dispute. But keep it in its place. Used as an opening attack it reads as mockery and ends the conversation. Bring it out only when the scientific-miracles claim has been made to you."},{"say":true,"t":"What to say","d":"\"If the same books are our guide to science, may I ask about Bukhari 3320?\""}],"rewritten":true,"refwhy":{"Sahih al-Bukhari 3320":"In Bukhari: dip the fly in, since one wing carries disease and the other the cure.","Sahih al-Bukhari 233":"In Bukhari: the men of Ukl are told to drink camel milk and camel urine as medicine.","Sahih al-Bukhari 5686":"The same prescription again, in Bukhari's chapters on medicine. Not a stray report.","Sahih al-Bukhari 5688":"In Bukhari: black seed is 'a healing for every disease except death'."},"titleLong":"The fly's wing, camel urine, and black seed: prophetic medicine vs. the miracle-of-science claim"},
{"id":"adam-sixty-cubits","title":"Adam at ninety feet, shrinking ever since","category":"science-history","claim":"Sahih al-Bukhari 3326 says: 'Allah created Adam, making him 60 cubits tall', which is roughly 27 to 30 metres, or 90 feet. It ends: 'people have been decreasing in stature since Adam's creation'. Sahih al-Bukhari 6227 and Sahih Muslim 2841 carry the report as well. Both clauses are empirically testable and false. No giant human remains exist, and the skeletal record runs the other way, since average stature has increased in recent centuries and no ancient population approached even three metres.","quran":[],"hadith":["Sahih al-Bukhari 3326","Sahih al-Bukhari 6227","Sahih Muslim 2841"],"bible":[],"sources":[{"name":"Sahih al-Bukhari 3326","type":"primary","url":"https://sunnah.com/bukhari:3326"},{"name":"IslamQA 22058 — 'Man was created tall then he kept getting shorter'","type":"muslim","url":"https://islamqa.info/en/answers/22058"},{"name":"Let Me Turn The Tables — Muslim treatment of the height hadith","type":"muslim","url":"https://www.letmeturnthetables.com/2013/10/height-adam-60-cubits.html"},{"name":"FaithAlone.net — 'Scientific Errors in Islam: The Size of Adam'","type":"apologetics","url":"https://faithalone.net/topical-articles/articles/islam/size-of-adam.html"}],"response":"IslamQA 22058 affirms the hadith literally and treats the fossil and archaeological objection as inconclusive. Others follow a suggestion that the sixty-cubit height applies to Adam in Paradise, or to people in Paradise, since 'whoever enters Paradise will be in the form of Adam', rather than to earthly humans. Notably, Ibn Hajar al-Asqalani had already flagged the problem in Fath al-Bari in the 15th century. He observed that the dwellings and remains of ancient nations do not indicate such heights, and confessed difficulty resolving it.","responseSource":{"name":"IslamQA 22058; Ibn Hajar, Fath al-Bari on Bukhari 3326","url":"https://sunnah.com/bukhari:3326"},"verdict":"admitted","rationale":"The Paradise-only reading fails, because the hadith's closing line about mankind decreasing in stature 'until now' is explicitly about earthly history. And the greatest classical commentator on Bukhari conceded the empirical contradiction six centuries ago without answering it. The case's real payload is not the absurd image but the method. This is Bukhari, the collection billed as second only to the Quran, transmitting a checkable falsehood. That reframes every 'but it's sahih' appeal elsewhere, including on Aisha's age, the fly, and the sun's prostration. Keep it as a supporting case, not a lead.","severity":"medium","plain":[{"t":"The hadith","d":"<b>\"Allah created Adam, making him 60 cubits tall\"</b> (Sahih al-Bukhari 3326). That is about 27 to 30 metres, or 90 feet. The report ends by saying people have been decreasing in stature ever since Adam's creation. Sahih al-Bukhari 6227 and Sahih Muslim 2841 carry it too."},{"t":"Both halves can be checked","d":"No giant human remains exist anywhere. And the skeletal record runs the other way. Average height has risen in recent centuries, and no ancient population came near even three metres."},{"t":"The Muslim answer, at full strength","d":"IslamQA 22058 affirms the hadith as it stands and treats the archaeological objection as inconclusive. Others suggest the sixty cubits applies to Adam in Paradise, or to people in Paradise, since whoever enters Paradise will be in the form of Adam. Notably, Ibn Hajar al-Asqalani flagged the problem in <i>Fath al-Bari</i> in the 15th century. He observed that the dwellings and remains of ancient nations show no such heights, and admitted he could not resolve it."},{"t":"Where that runs out","d":"The Paradise-only reading fails on the report's own last line, which is about people shrinking on earth until now. And the greatest classical commentator on Bukhari conceded the problem six centuries ago without answering it."},{"t":"How strong is this argument?","d":"They admit the grading, and this is a supporting case, not a lead. Its real payload is not the picture but the method. This is Bukhari, the collection billed as second only to the Quran, carrying a checkable claim that is false. That reframes every appeal elsewhere that begins with <i>but it is sahih</i>."},{"say":true,"t":"What to say","d":"\"Ibn Hajar said the remains do not show such heights and left it unresolved. What do you do with that?\""}],"rewritten":true,"refwhy":{"Sahih al-Bukhari 3326":"The report itself. Adam sixty cubits tall, and people shrinking ever since.","Sahih al-Bukhari 6227":"The same report again in Bukhari. Its standing is not in doubt, which is the whole point.","Sahih Muslim 2841":"The same in Sahih Muslim. Both of the soundest collections carry it."},"titleLong":"Adam was sixty cubits tall — and people have been shrinking since"},
{"id":"aisha-was-19-revisionism","title":"Muslim scholars themselves defend the age-nine reports","category":"muhammad-test","claim":"A popular modern Muslim counter to the Aisha case runs as follows. The age-nine report comes from a single narrator, Hisham ibn Urwa, whose memory failed in Iraq. And calculations from his sister Asma's age — ten years older, and dead at 100 in 73 AH — put Aisha at 17 to 19 at consummation.","quran":[],"hadith":["Sahih al-Bukhari 5134","Sahih Muslim 1422"],"bible":[],"sources":[{"name":"Yaqeen Institute — 'The Age of Aisha: Rejecting Historical Revisionism and Modernist Presumptions'","type":"muslim","url":"https://yaqeeninstitute.org/read/paper/the-age-of-aisha-ra-rejecting-historical-revisionism-and-modernist-presumptions"},{"name":"ICRAA — 'The Age of Aisha: An Appraisal of the Traditional and Revisionist Perspectives'","type":"muslim","url":"https://icraa.org/aisha-age-review-traditional-revisionist-perspectives/"},{"name":"WikiIslam — Aisha's Age (chain-by-chain survey)","type":"institutional","url":"https://wikiislam.net/wiki/Aisha's_Age"},{"name":"Sahih Muslim 1422","type":"primary","url":"https://sunnah.com/muslim:1422"}],"response":"The factual correction is supplied by Muslim scholarship itself. The age reports are not solitary. They come from Aisha in the first person through multiple independent chains, including al-Aswad and other students of Aisha besides Hisham's line, in both Bukhari and Muslim. So impugning Hisham's late-life memory removes nothing. The Asma calculation rests on a report by Ibn Abi al-Zinad, who was born decades after Asma's death, which is evidentially far weaker than the sahih chains it is invoked to overturn. The Yaqeen Institute and ICRAA, both mainstream Muslim institutions, defend age nine and label the 19 thesis methodological revisionism.","responseSource":{"name":"Yaqeen Institute and ICRAA papers cited above","url":"https://yaqeeninstitute.org/read/paper/the-age-of-aisha-ra-rejecting-historical-revisionism-and-modernist-presumptions"},"verdict":"answered","rationale":"This entry exists because you will hear the claim. It circulates widely in dawah despite being rejected by Islam's own hadith scholarship. The decisive move in conversation is not to argue the chains yourself, but to hand the Muslim their own institutions: Yaqeen's paper is literally titled 'The Age of Aisha: Rejecting Historical Revisionism and Modernist Presumptions'. A defence that orthodoxy itself refuses is worth noticing, and the reason for the refusal matters. Accepting it would concede that sahih-graded, multiply attested reports can be discarded when they are uncomfortable, which dismantles the hadith canon it is trying to protect. Pair this with the aisha-age case; it is that case's rebuttal shield.","severity":"medium","plain":[{"t":"The claim you will hear","d":"Some modern Muslim writers argue that Aisha was really 17 to 19. Two arguments are given. The age-nine report comes through one narrator, Hisham ibn Urwa, whose memory is said to have failed in Iraq. And her sister Asma was ten years older and died at 100 in 73 AH, which allows a later calculation."},{"t":"Who answers it","d":"Muslim scholarship itself. The age reports are not solitary. They come from Aisha in the first person, through several independent chains — al-Aswad and other students of hers, besides Hisham's line, in both Bukhari and Muslim. So doubting Hisham's late-life memory removes nothing."},{"t":"The Asma calculation","d":"It rests on a report by Ibn Abi al-Zinad, who was born decades after Asma died. That is far weaker evidence than the sahih chains it is meant to overturn."},{"t":"Who says so","d":"The Yaqeen Institute and ICRAA, both mainstream Muslim bodies. Both defend age nine and call the 19 thesis revisionism. Yaqeen's paper is titled <i>The Age of Aisha: Rejecting Historical Revisionism and Modernist Presumptions</i>."},{"t":"How strong is this argument?","d":"Do not argue the chains yourself. Hand your friend his own institutions. A defence that orthodoxy refuses is worth noticing, and the reason it refuses matters. To accept it would mean sahih, multiply attested reports can be dropped when they are uncomfortable — which would take the whole hadith canon with them. Pair this with the Aisha case; it is that case's shield."},{"say":true,"t":"What to say","d":"\"Yaqeen Institute rejects that argument themselves. Have you read their paper on it?\""}],"rewritten":true,"refwhy":{"Sahih al-Bukhari 5134":"The report this claim tries to unseat. It is Aisha's own account, in Bukhari.","Sahih Muslim 1422":"The same account in Sahih Muslim, by other chains. That is why blaming one narrator fails."},"titleLong":"'Aisha was actually 19': the revisionist rescue that mainstream Islam rejects"},
{"id":"avoid-muhammad-never-existed","title":"Don't use: 'Muhammad never existed' (Crone disagrees)","category":"muhammad-test","avoid":true,"claim":"The loud version says Muhammad is a myth. On that story he was made up later, by Arabs building an empire, and there is no proof he ever lived. It was spread by Robert Spencer's book 'Did Muhammad Exist?' and by writers online.","quran":[],"hadith":[],"bible":[],"sources":[{"name":"Patricia Crone — 'What do we actually know about Mohammed?' (openDemocracy)","type":"scholarly","url":"https://www.opendemocracy.net/en/mohammed-3866jsp/"},{"name":"Institute for Advanced Study — Patricia Crone on Arabia","type":"scholarly","url":"https://www.ias.edu/ideas/talking-points-patricia-crone-arabia"},{"name":"Jihad Watch — the mythicist claim in the wild (example of the position)","type":"apologetics","url":"https://www.jihadwatch.org/2021/07/patricia-crone-there-is-no-doubt-that-mohammed-existed-heres-why-shes-wrong"}],"response":"The correction is that sources outside Islam name him within years of his death. The Doctrina Jacobi, from about 634 to 640, speaks of a prophet who has appeared among the Saracens. The Armenian chronicle put down to Sebeos, from the 660s, names him and tells of his preaching of one God. There are coins too, and inscriptions, and the Dome of the Rock. Then there is Patricia Crone. She was the best known of the doubters about Islam's origins, and the one critics love to quote. She said flatly that there is no doubt Muhammad lived, and called the early outside evidence irrefutable.","responseSource":{"name":"Crone, openDemocracy (2008); Doctrina Jacobi; ps.-Sebeos","url":"https://www.opendemocracy.net/en/mohammed-3866jsp/"},"verdict":"answered","rationale":"Here is why it backfires. Any Muslim who has read a little, or run one search, will hand you Crone's own words and the seventh-century sources. Then your standing on all the rest goes with it — Sanaa, the qira'at, the study of sources. You will have shown that you bend evidence to suit yourself. Say this instead. The man lived. The problem is his life story. The sira rests on sources put together 150 to 200 years later, and Ibn Ishaq only survives through Ibn Hisham's edition. That point is honest, and it does far more damage. This site's hadith-chain-of-custody case already makes it.","severity":"low","plain":[{"t":"The claim","d":"That Muhammad is a myth, invented later by Arab empire-builders, with no evidence he existed. It was popularised by Robert Spencer's <i>Did Muhammad Exist?</i> and by internet writers."},{"t":"Why it is wrong","d":"Non-Muslim sources name him within years of his death. The <i>Doctrina Jacobi</i>, from about 634 to 640, speaks of a prophet appearing among the Saracens. The Armenian chronicle attributed to Sebeos, from the 660s, names him and describes his preaching of one God. There are also coins, inscriptions and the Dome of the Rock."},{"t":"Who says so","d":"Patricia Crone. She was the most famous sceptical revisionist of Islamic origins, and the one critics love to quote. She concluded flatly that there is no doubt Muhammad existed, and called the early outside evidence irrefutable."},{"t":"Why it backfires","d":"Any informed Muslim can produce Crone's own words in a minute. So can a search engine. And your credibility on everything else — Sanaa, the <i>qira'at</i>, source criticism — dies with the overclaim. You will have shown that you handle evidence to suit yourself."},{"t":"What to say instead","d":"The man existed. The real problem is the detailed biography. The <i>sira</i> rests on sources compiled 150 to 200 years later, and Ibn Ishaq survives only through Ibn Hisham's edition. That is the honest and far more damaging point, and this site's hadith case already makes it."},{"say":true,"t":"What to say","d":"\"Of course Muhammad existed. My question is about where his biography comes from.\""}],"rewritten":true,"titleLong":"Don't use: 'Muhammad never existed'"},
{"id":"avoid-petra-qibla","title":"Don't use: the Petra qibla theory, refuted by King","category":"science-history","avoid":true,"claim":"The loud version comes from Dan Gibson's book 'Early Islamic Qiblas'. It holds that the first mosques face Petra and not Mecca. On that story Petra was the holy city, the tradition moved it later, and the whole account of Islam's beginnings is made up.","quran":["Quran 2:144"],"hadith":[],"bible":[],"sources":[{"name":"David A. King — 'From Petra back to Makka: From Pibla back to Qibla'","type":"scholarly","url":"https://muslimheritage.com/pibla-back-to-qibla/"},{"name":"David A. King — 'The Petra Fallacy: Early mosques do face the Sacred Kaaba in Mecca'","type":"scholarly","url":"https://www.researchgate.net/publication/330221815_King_The_Petra_fallacy_The_Petra_fallacy_-_Early_mosques_do_face_the_Sacred_Kaaba_in_Mecca_but_Dan_Gibson_doesn't_know_how_Comparing_historical_orientations_with_modern_directions_can_lead_to_false_re"},{"name":"Gibson's response to King (for the claim's own presentation)","type":"apologetics","url":"https://www.researchgate.net/publication/321708416_Response_to_David_King_with_attached_article_from_httpmuslimheritagecomarticlefrom-petra-back-to-makka_It_basically_argues_that_Dr_King_did_not_challenge_the_my_data_nor_my_research_but_simply_denies_"}],"response":"The correction comes from David A. King. He is the leading historian of how the qibla was worked out, and he wrote 'From Petra back to Makka' and 'The Petra Fallacy'. He showed that the method reads a modern skill into an old world. The first mosque builders had no way to take bearings across a curved earth. They lined up mosques by the sky as farmers see it — sunrise and sunset at the solstice, and the rising of stars. That is why the directions scatter. Take modern bearings and read them back into seventh-century building, and you will make a line to Petra appear. No academic historian of early Islam holds the thesis. That includes the doubters whom critics quote on other points.","responseSource":{"name":"David A. King, 'From Petra back to Makka' and 'The Petra Fallacy'","url":"https://muslimheritage.com/pibla-back-to-qibla/"},"verdict":"answered","rationale":"Here is why it backfires. The thesis is turned down not by Muslim apologists but by the very Western scholars this site leans on for Sanaa and the qira'at. Lean on Gibson and a ready friend answers with King. Your whole standard of evidence goes up in smoke. Say this instead: nothing is lost by dropping it. The problems on the record are stronger and undisputed. There is Uthman's burning, the companion codices, and how late the sira was written.","severity":"low","plain":[{"t":"The claim","d":"That the earliest mosques face Petra rather than Mecca. On that view Islam's holy city was originally Petra, the tradition moved it, and the whole origin story is invented. It comes from Dan Gibson's <i>Early Islamic Qiblas</i>."},{"t":"Why it is wrong","d":"David A. King is the leading historian of how the <i>qibla</i> was worked out. He showed the method is anachronistic. Early mosque builders had no way to take bearings across a curved earth. They lined up mosques by folk astronomy — sunrise and sunset at the solstice, the rising of stars. That is why the directions scatter. Reading modern bearings back into 7th-century building manufactures the Petra alignment."},{"t":"Who says so","d":"Not Muslim apologists. King's papers are titled <i>From Petra back to Makka</i> and <i>The Petra Fallacy</i>. No academic historian of early Islam has adopted the thesis, including the sceptical revisionists that critics quote elsewhere."},{"t":"Why it backfires","d":"Lean on Gibson and a prepared friend answers with King. Then your standards of evidence are gone. You will have used the Western academy for Sanaa and the <i>qira'at</i>, and ignored it here."},{"t":"What to say instead","d":"Nothing is lost by dropping it. The documented problems are stronger and undisputed: Uthman's burning, the companion codices, and the lateness of the <i>sira</i>."},{"say":true,"t":"What to say","d":"\"I used to hear the Petra claim. It does not hold up, so I do not use it.\""}],"rewritten":true,"refwhy":{"Quran 2:144":"The verse that turns the prayer direction to the Sacred Mosque. The text the claim disputes."},"titleLong":"Don't use: 'The qibla originally pointed to Petra'"},
{"id":"avoid-black-stone-worship-slogan","title":"Don't use the Black Stone slogan: Umar answers it","category":"practice","avoid":true,"claim":"The popular slogan says that Muslims claim to oppose idolatry but literally worship a black rock, bowing to it and kissing it.","quran":[],"hadith":["Sahih al-Bukhari 1597"],"bible":[],"sources":[{"name":"Sahih al-Bukhari 1597 — Umar's words at the Stone","type":"primary","url":"https://sunnah.com/bukhari:1597"},{"name":"Hadith Encyclopedia — the Umar narration with commentary","type":"muslim","url":"https://hadeethenc.com/en/browse/hadith/3024"},{"name":"Black Stone — Wikipedia","type":"institutional","url":"https://en.wikipedia.org/wiki/Black_Stone"}],"response":"The correction is that Islam's own canon pre-empts the charge. In Sahih al-Bukhari 1597, Umar kissed the Stone and said: 'I know that you are a stone and can neither benefit anyone nor harm anyone. Had I not seen Allah's Messenger kissing you, I would not have kissed you.' Muslims venerate the Stone in imitation of Muhammad while explicitly denying it any power. On their own definitions this is not worship, and prayer is directed toward the Kaaba as a direction, the qibla, not to it as an object.","responseSource":{"name":"Sahih al-Bukhari 1597","url":"https://sunnah.com/bukhari:1597"},"verdict":"answered","rationale":"Here is why it backfires. The Muslim answers with Umar's hadith in one sentence and wins the exchange. Worse, the charge invites a tu quoque about crosses, icons and relics, which drags the conversation into arguing about symmetry. What to say instead: this site's kaaba-black-stone-pagan-rites case asks the honest version of the question. Why did a religion founded on smashing paganism retain, unchanged, the pre-Islamic rites of circling a shrine and kissing a stone? Muslim sources document that continuity themselves, and Umar's own bewilderment underlines it. Origin, not worship, is the pressure point.","severity":"low","plain":[{"t":"The slogan","d":"That Muslims claim to oppose idols but worship a black rock, bowing to it and kissing it."},{"t":"Why it is wrong","d":"Islam's own canon answers it. Umar kissed the Stone and said: <b>\"I know that you are a stone and can neither benefit anyone nor harm anyone. Had I not seen Allah's Messenger kissing you, I would not have kissed you\"</b> (Sahih al-Bukhari 1597). Muslims honour the Stone in imitation of Muhammad, while denying it any power. Prayer is directed toward the Kaaba as a direction, not to it as an object."},{"t":"Why it backfires","d":"Your friend answers with Umar's hadith in one sentence and wins the exchange. Worse, the charge invites a fair comeback about crosses, icons and relics, and the conversation collapses into arguing about symmetry."},{"t":"What to say instead","d":"Ask the honest version. Why did a faith founded on smashing idols keep, unchanged, the pre-Islamic rites of circling a shrine and kissing a stone? Muslim sources document that continuity themselves, and Umar's own puzzlement underlines it."},{"t":"The point in one line","d":"Origin, not worship. That is the pressure point, and it is the one this site's Kaaba case works with."},{"say":true,"t":"What to say","d":"\"I do not think you worship the Stone. I am asking where the rite came from.\""}],"rewritten":true,"refwhy":{"Sahih al-Bukhari 1597":"Umar's words in Bukhari: 'I know that you are a stone'. It is why the slogan fails at once."},"titleLong":"Don't use: 'Muslims worship the Black Stone'"},
{"id":"avoid-26-different-qurans","title":"Don't use: '26 different Qurans' (they are qira'at)","category":"quran-text","avoid":true,"claim":"The popular version, performed at Speakers' Corner by Jay Smith and Hatun Tash, waves a stack of printed Arabic Qurans: 'here are 26 different Qurans with 93,000 differences, and Muslims can't even tell you which one is preserved.'","quran":[],"hadith":[],"bible":[],"sources":[{"name":"The claim as performed (Hatun Tash / Jay Smith, Speakers' Corner)","type":"apologetics","url":"https://archive.org/details/26-different-arabic-qurans-explained-and-unpacked-hatun-tash-and-jay-smith"},{"name":"Muslim rebuttal — 'Refuting the 26 Qurans Lie'","type":"muslim","url":"https://quranandbibleblog.com/2020/06/19/refuting-the-26-qurans-lie/"},{"name":"Yasir Qadhi on the textual history of the Quran (the honest scholarly frame)","type":"muslim","url":"https://apologeticsandagape.wordpress.com/2020/06/17/dr-yasir-qadhi-on-the-textual-history-of-the-quran/"}],"response":"The correction, conceded even in Muslim rebuttals of Smith, is that the printed editions are the canonical qira'at. These are transmitted reading traditions — Hafs, Warsh, Qalun, al-Duri and others — differing overwhelmingly in pronunciation and orthography, with a bounded set of wording variants, all descending from the Uthmanic consonantal skeleton. The 93,000 figure counts vowel and dialect differences. Calling them '26 different Qurans' is roughly like calling the KJV, NIV and ESV 'three different Bibles' — a framing Christians reject when Muslims use it, and should not use in reverse. Yasir Qadhi's treatment of the Quran's textual history gives the honest scholarly frame.","responseSource":{"name":"Standard qira'at scholarship; conceded even in Muslim rebuttals of Smith","url":"https://archive.org/details/26-different-arabic-qurans-explained-and-unpacked-hatun-tash-and-jay-smith"},"verdict":"answered","rationale":"Here is why it backfires. A Muslim who has watched one re
