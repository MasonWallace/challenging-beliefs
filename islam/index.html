{"id":"cosmology-stars-missiles","category":"science-history","severity":"medium","verdict":"unrefuted","title":"Stars as missiles thrown at eavesdropping devils","claim":"The Quran describes the sky as a solid structure: a ceiling held up without visible pillars (13:2; 31:10), which could fall on people in pieces (34:9), with seven stacked heavens (67:3). The lowest is adorned with 'lamps', that is stars, which Allah made 'missiles against the devils' (67:5; compare 37:6-10). Quran 72:8-9 has jinn who ascend to eavesdrop pelted with burning flames. This treats stars and meteors as the same class of object. Meteors are dust grains burning in the atmosphere; stars are distant suns. Mainstream tafsir confirms the reading. Qatada, quoted in Ibn Kathir on 67:5, says: 'These stars were only created for three purposes: adornment for the heaven, missiles for the devils, and signs for navigation.'","quran":["Quran 67:3-5","Quran 37:6-10","Quran 72:8-9","Quran 15:16-18","Quran 13:2","Quran 34:9"],"hadith":["Sahih Muslim 2229"],"bible":[],"sources":[{"name":"Tafsir Ibn Kathir on 67:5","type":"muslim","url":"https://quran.com/en/67:5/tafsirs/en-tafisr-ibn-kathir"},{"name":"WikiIslam — Shooting Stars in the Quran","type":"apologetics","url":"https://wikiislam.net/wiki/Shooting_Stars_in_the_Quran"},{"name":"WikiIslam — Cosmology of the Quran","type":"apologetics","url":"https://wikiislam.net/wiki/Cosmology_of_the_Quran"}],"response":"Ibn Kathir on 67:5, and IslamQA treatments, answer that in Arabic najm and kawkab can denote any luminous heavenly body, including meteors. So 67:5 speaks of luminous projectiles from the lower heaven, not literal suns being thrown. Ibn Kathir himself explains that 'a meteor of fire detaches itself from the star', with the star remaining in place. The seven heavens are unseen metaphysical realms, not physical shells, and canopy language is protective metaphor, since the atmosphere genuinely does shield the earth. These verses describe the unseen, which is a theological datum and not falsifiable by astronomy.","responseSource":{"name":"Tafsir Ibn Kathir on 67:5; IslamQA treatments","url":"https://quran.com/en/67:5/tafsirs/en-tafisr-ibn-kathir"},"rationale":"Quran 67:5 identifies the objects made into missiles as the same 'lamps' that adorn the lowest heaven, which are the visible stars, and Qatada's mainstream tafsir states exactly that. Ibn Kathir's detaching-meteor gloss is itself an attempted harmonisation, and it still ties meteors physically to stars, which is false. The reading fits precisely the 7th-century phenomenology of shooting stars. The metaphysical-realms defence is viable in isolation, but the missile verses anchor the cosmology to visible objects.","plain":[{"t":"The picture the text assumes","d":"The Quran describes the sky as a structure. It is a ceiling held up without visible pillars (Quran 13:2; 31:10). It could fall on people in pieces (34:9). There are seven stacked heavens (67:3), and the lowest is decorated with lamps."},{"t":"What the lamps are for","d":"Quran 67:5 says Allah made those lamps <b>\"missiles against the devils.\"</b> Quran 37:6-10 and 72:8-9 say jinn who climb up to eavesdrop are pelted with burning flames. That treats stars and meteors as the same kind of thing. Meteors are dust grains burning in our air. Stars are distant suns."},{"t":"What the commentators said","d":"This is not a modern reading. Qatada, quoted in Ibn Kathir on 67:5, says the stars were created for three purposes: to adorn the heaven, as missiles for the devils, and as signs for navigation."},{"t":"The Muslim answer, at full strength","d":"IslamQA and Ibn Kathir himself give a reply. In Arabic, <i>najm</i> and <i>kawkab</i> can mean any bright object in the sky, including meteors. So 67:5 speaks of glowing projectiles, not suns being thrown. Ibn Kathir explains that a meteor of fire detaches itself while the star stays in place. The seven heavens are unseen realms, not physical shells. And the canopy language is protective imagery, since the atmosphere really does shield the earth."},{"t":"How strong is this argument?","d":"Strong for you, but state it carefully. The unseen-realms reply works on its own. The problem is that 67:5 names the objects as the same lamps that decorate the lowest heaven — the visible stars. Ibn Kathir's detaching-meteor gloss is itself a repair, and it still ties meteors physically to stars, which is not true."},{"say":true,"t":"What to say","d":"\"What did Qatada think the stars were for? His answer is in Ibn Kathir.\""}],"rewritten":true,"refwhy":{"Quran 67:3-5":"The core text. Seven heavens, lamps in the lowest, and those lamps made 'missiles against the devils'.","Quran 37:6-10":"The same picture again. The near heaven is adorned, and listeners are chased by a piercing flame.","Quran 72:8-9":"The jinn's own account. They used to sit and listen, and now find flames waiting.","Quran 15:16-18":"A third telling. Whoever steals a hearing is followed by a flame you can see.","Quran 13:2":"Says the heavens were raised without pillars you can see. Part of the sky-as-structure picture.","Quran 34:9":"Says He could drop the sky on them in pieces. A sky that can fall is a solid thing.","Sahih Muslim 2229":"From Sahih Muslim, held to be sound. The hadith side of the same picture: jinn who listen in from above."},"titleLong":"Solid sky, seven heavens, and stars as missiles against devils (67:5)"},
{"id":"abrogation-satanic-verses","category":"quran-text","severity":"high","verdict":"admitted","title":"The satanic verses, recorded by al-Tabari and Ibn Sa'd","claim":"Quran 2:106 and 16:101 state that Allah replaces some revealed verses with others. Critics ask why an omniscient God's eternal speech needs cancelling and reissuing within 23 years, and 16:101 records that contemporaries concluded 'You are but a forger.' The sharpest test case is the satanic-verses incident. Early Islamic sources — al-Tabari, Ibn Sa'd and al-Waqidi — record that Muhammad, wishing for reconciliation with the Quraysh, recited praise of the goddesses al-Lat, al-Uzza and Manat after 53:19-20: 'these are the exalted cranes whose intercession is hoped for'. The words were later attributed to Satan and cancelled. Early exegetes read 22:52 — 'Satan threw something into the recitation of every prophet' — as the divine comment on the event. Shahab Ahmed of Harvard, in 'Before Orthodoxy', showed that the incident was a standard element of Muslim historical memory for Islam's first 150 years or so, and only later became universally rejected.","quran":["Quran 2:106","Quran 16:101","Quran 22:52","Quran 53:19-23","Quran 17:73-75"],"hadith":["Sahih al-Bukhari 4862"],"bible":["Deuteronomy 18:20-22","Malachi 3:6"],"sources":[{"name":"Shahab Ahmed — Before Orthodoxy: The Satanic Verses in Early Islam (Harvard UP)","type":"scholarly","url":"https://nes.princeton.edu/publications/orthodoxy-satanic-verses-early-islam"},{"name":"Answering Islam — The Story of the Cranes","type":"apologetics","url":"https://www.answering-islam.org/Green/satanic.htm"},{"name":"SeekersGuidance — What Is Abrogation (Naskh)?","type":"muslim","url":"https://seekersguidance.org/answers/quran/what-is-abrogation-naskh-in-the-quran/"}],"response":"On abrogation, SeekersGuidance answers that naskh is progressive legislation, not divine self-correction. It is staged pedagogy — alcohol was banned in three steps — and each ruling was perfect for its time. Jewish and Christian scripture also supersedes earlier law, in the sacrificial system and in Acts 10. On the satanic verses, al-Albani in 'Nasb al-Majaniq' and others answer on the chains. Every chain of the story is broken, with no Companion eyewitness. It is absent from Bukhari and Muslim. It contradicts the Quran's own guarantee at 53:3-4. And its many mutually contradictory versions mark it as storyteller material. Scholars from Ibn Khuzaymah, who called it 'a fabrication of the heretics', to al-Albani have rejected it on transmission grounds.","responseSource":{"name":"Al-Albani, 'Nasb al-Majaniq'; SeekersGuidance on naskh","url":"https://seekersguidance.org/answers/quran/what-is-abrogation-naskh-in-the-quran/"},"rationale":"Two components, two results. Abrogation as a phenomenon is conceded, since 2:106 is explicit and classical scholarship catalogued abrogated verses. Whether it is a defect is a theological judgment, and the progressive-legislation steelman is coherent. On the satanic-verses incident, Shahab Ahmed's demonstration of early universal acceptance is historically weighty, and 22:52 with 17:73-75 read most naturally as responses to a real event. But the chain criticism is genuine, since no single sound chain exists, so on this app's own evidence standard it cannot be graded admitted. The historical-critical case is stronger than most Muslims allow, and the chain case is stronger than most critics allow.","plain":[{"t":"What abrogation is","d":"Quran 2:106 says that when Allah abrogates a verse he brings a better one. Quran 16:101 says the same. That is <i>naskh</i>: later revelation cancels earlier revelation. Quran 16:101 also records the reaction of Muhammad's contemporaries. They said: you are but a forger."},{"t":"The sharpest test case","d":"Early Islamic historians record an incident. They are al-Tabari, Ibn Sa'd and al-Waqidi. Muhammad wanted peace with the Quraysh. After Quran 53:19-20 he praised the goddesses al-Lat, al-Uzza and Manat: <b>\"these are the exalted cranes whose intercession is hoped for.\"</b> The words were later traced to Satan and withdrawn. Early scholars read Quran 22:52 as the comment on it. Satan threw something into the recitation of every prophet."},{"t":"What a Harvard study found","d":"Shahab Ahmed wrote a book on this. It is <i>Before Orthodoxy: The Satanic Verses in Early Islam</i>, from Harvard University Press. He showed the story was a normal part of Muslim memory for about 150 years. Only later was it rejected by all."},{"t":"The Muslim answer, at full strength","d":"On abrogation, SeekersGuidance answers that <i>naskh</i> is staged teaching, not divine self-correction. Alcohol was banned in three steps. Each ruling was right for its moment, and Jewish and Christian scripture supersede earlier law too. On the incident, al-Albani and others answer on the chains. Every chain is broken, with no companion eyewitness. It is absent from Bukhari and Muslim. It contradicts Quran 53:3-4. Ibn Khuzaymah called it a fabrication of the heretics."},{"t":"How strong is this argument?","d":"Two parts, two answers. Abrogation itself is admitted, since 2:106 says it plainly. Whether it is a flaw is a judgment, and the staged-teaching reply is coherent. The incident is different. Ahmed's work is weighty and 22:52 reads naturally as a response to something real. But no single sound chain exists, so this site will not call it admitted."},{"say":true,"t":"What to say","d":"\"Have you read what al-Tabari records about Surah 53? I would rather ask than assume.\""}],"rewritten":true,"refwhy":{"Deuteronomy 18:20-22":"The Bible's own test for a prophet. What he says in God's name has to come true.","Malachi 3:6":"'I am the LORD, I change not.' This is the contrast the case draws with cancelled verses.","Quran 2:106":"Says that when a verse is set aside, a better one comes. Abrogation, in the Quran's own words.","Quran 16:101":"Says the same, and records the reply he got: 'you are but a forger'.","Quran 22:52":"Says Satan threw something into the recitation of every prophet. Early scholars tied it to this event.","Quran 53:19-23":"The passage on al-Lat, al-Uzza and Manat. The disputed words are said to have fallen here.","Quran 17:73-75":"Says they nearly lured him away from what was revealed. Read with 22:52 as the same episode.","Sahih al-Bukhari 4862":"In Bukhari: the pagans bowed down with the Muslims when Surah 53 was recited. Ask why they would."},"titleLong":"Abrogation (2:106) and the satanic verses incident"},
{"id":"compilation-lost-verses","category":"quran-text","severity":"high","verdict":"admitted","title":"Umar feared much of the Quran was lost","claim":"Against the perfect-preservation claim of 15:9, the Sahih sources record five things. Sahih al-Bukhari 4986 says no compiled Quran existed at Muhammad's death; after heavy reciter casualties at Yamama, Umar feared 'a large part of the Quran may be lost', and Zayd ibn Thabit collected it 'from palm-leaf stalks, thin white stones, and the hearts of men', with the ending of Surah at-Tawbah found with only one man. Sahih Muslim 1452a has Aisha state that the 'five sucklings' wording 'was recited as part of the Quran' when the Prophet died, yet it is in no mushaf. Umar in Sahih al-Bukhari 6829 affirms the stoning verse was revealed and recited; it too is absent. Sunan Ibn Majah 1944 has Aisha say the page with those verses was under her bedding and 'a tame sheep came in and ate it' — the report is graded hasan, though the sheep detail rides on a weak chain, and the loss it narrates is independently attested in Sahih Muslim. And Abu Musa in Sahih Muslim 1050 says: 'we used to recite a surah resembling Bara'ah... I have forgotten it.'","quran":["Quran 15:9","Quran 2:106","Quran 87:6-7"],"hadith":["Sahih al-Bukhari 4986","Sahih Muslim 1452a","Sahih al-Bukhari 6829","Sunan Ibn Majah 1944","Sahih Muslim 1050"],"bible":[],"sources":[{"name":"Sahih al-Bukhari 4986","type":"primary","url":"https://sunnah.com/bukhari:4986"},{"name":"Sahih Muslim 1452a","type":"primary","url":"https://sunnah.com/muslim:1452a"},{"name":"IslamQA 175355 — the sheep hadith is not sahih","type":"muslim","url":"https://islamqa.info/en/answers/175355"},{"name":"Al-Azami — The History of the Quranic Text","type":"muslim","url":"https://archive.org/details/history-quranic-text-azami-2nd"}],"response":"Al-Azami, IslamQA 175355 and ICRAA answer that preservation was primarily oral. Hundreds of memorisers carried the complete text, so Zayd's written collection was a verification exercise over an already-memorised whole; 'found with only one man' means only one written copy, not only one memory. The 'missing' verses fall under divinely intended abrogation of recitation, naskh al-tilawah. The stoning and suckling wordings had their recitation withdrawn while, for stoning, the ruling remained, and 2:106 explicitly includes verses 'caused to be forgotten'. The sheep story is weak and is contradicted by stronger chains without it. Al-Azami's monograph argues the compilation methodology was the most rigorous in the history of any scripture.","responseSource":{"name":"Al-Azami, The History of the Quranic Text; IslamQA 175355; ICRAA","url":"https://www.icraa.org/quran-lost-verse-five-suckling/"},"rationale":"The load-bearing facts are all in Sahih collections and are conceded by mainstream scholarship: no complete compiled codex at the Prophet's death, fear of loss at Yamama, wordings believed by Companions to be Quran that are not in today's Quran, and a whole forgotten surah reported. The naskh al-tilawah defence is the concession dressed in doctrine. It grants that recited Quranic material exited the text and explains it as intentional. That is unfalsifiable and circular. Any lost verse can be declared abrogated in recitation after the fact, on the authority of the very reports that show the loss. The guarantee of 15:9 is maintained only by definitional manoeuvre.","plain":[{"t":"The promise and the record","d":"Quran 15:9 promises that Allah guards the reminder. This case sets that promise beside what the Sahih collections themselves record. Every fact below is from Islam's own trusted books."},{"t":"How the Quran was gathered","d":"Sahih al-Bukhari 4986 says no compiled Quran existed when Muhammad died. After heavy losses among reciters at the battle of Yamama, Umar feared <b>\"a large part of the Quran may be lost.\"</b> Zayd ibn Thabit collected it from <b>\"palm-leaf stalks, thin white stones, and the hearts of men.\"</b> The ending of Surah at-Tawbah was found with only one man."},{"t":"Wordings that did not make it","d":"In Sahih Muslim 1452a, Aisha says the five sucklings wording was recited as Quran when the Prophet died. It is in no mushaf. In Sahih al-Bukhari 6829, Umar affirms the stoning verse was revealed and recited. It is absent too. In Sunan Ibn Majah 1944, Aisha says the page was under her bedding and a tame sheep ate it. In Sahih Muslim 1050, Abu Musa says: we used to recite a surah resembling Bara'ah, and I have forgotten it."},{"t":"The Muslim answer, at full strength","d":"Al-Azami and IslamQA 175355 answer seriously. Preservation was mainly oral, carried by hundreds of memorisers, so Zayd's work was verification of an already-memorised whole. \"Found with only one man\" means one written copy, not one memory. The missing wordings fall under <i>naskh al-tilawah</i>, abrogation of recitation, and 2:106 speaks of verses caused to be forgotten. The sheep detail rides on a weak chain. Al-Azami argues this was the most rigorous compilation in the history of any scripture."},{"t":"How strong is this argument?","d":"They admit the facts themselves. All of it is in the Sahih collections. The abrogation-of-recitation answer is the concession wearing a doctrine: it grants that recited material left the text. It also cannot be tested, since any loss can be declared intentional afterwards, on the authority of the very reports that show the loss."},{"say":true,"t":"What to say","d":"\"Umar said the stoning verse was revealed. Where is it in the Quran now?\""}],"rewritten":true,"refwhy":{"Quran 15:9":"The promise being tested. Allah sent down the reminder, and will guard it.","Quran 2:106":"Both sides use it. It speaks of verses caused to be forgotten, which is the Muslim answer here.","Quran 87:6-7":"Cuts against you. It says he will not forget, save what Allah wills — so loss can be intended.","Sahih al-Bukhari 4986":"The gathering story in Bukhari. From palm stalks, stones, and the hearts of men, after Yamama.","Sahih Muslim 1452a":"In Sahih Muslim. Aisha says the five sucklings words were still recited when the Prophet died.","Sahih al-Bukhari 6829":"In Bukhari. Umar says the stoning verse was revealed and recited. It is in no Quran today.","Sunan Ibn Majah 1944":"The weakest link here. Ibn Majah is a lesser collection, and the sheep detail rides on a weak chain.","Sahih Muslim 1050":"In Sahih Muslim. Abu Musa says they used to recite a surah like Bara'ah, and he has forgotten it."},"titleLong":"Compiled 'from palm stalks and the breasts of men' — and verses that never entered the mushaf"},
{"id":"uthman-standardization-qiraat","category":"quran-text","severity":"high","verdict":"admitted","title":"Hafs and Warsh differ in hundreds of places","claim":"Sahih al-Bukhari 4987 records that during Uthman's reign Muslims 'differed in their recitation' so sharply that Hudhayfa feared division 'as Jews and Christians differed'. Uthman had one recension copied and 'ordered that all the other Quranic materials, whether fragmentary manuscripts or whole copies, be burnt'. Companion codices were suppressed. Ibn Mas'ud's reportedly lacked Surahs 1, 113 and 114; Ubayy's contained two extra. Aisha and Hafsa both had 2:238 with the added words 'and the asr prayer' (Sahih Muslim 629; Sahih al-Bukhari 5005). Today the Quran is printed in materially different reading traditions. Hafs is used by most of the world, and Warsh across North and West Africa; they differ in hundreds of places, some of them semantic, such as 3:146. The Sanaa palimpsest's lower text shows a pre-Uthmanic text-form, and Daniel Brubaker has documented thousands of physical corrections in early manuscripts. A single letter-perfect text transmitted unchanged is not what the record shows.","quran":["Quran 15:9","Quran 2:238","Quran 3:146"],"hadith":["Sahih al-Bukhari 4987","Sahih Muslim 629","Sahih al-Bukhari 5005"],"bible":[],"sources":[{"name":"Sahih al-Bukhari 4987","type":"primary","url":"https://sunnah.com/bukhari:4987"},{"name":"Daniel Brubaker — Corrections in Early Quran Manuscripts","type":"scholarly","url":"https://www.amazon.com/Corrections-Early-Qur%CA%BE%C4%81n-Manuscripts-Manuscript/dp/1949123030"},{"name":"Answering Islam — The Different Arabic Versions of the Quran (Samuel Green)","type":"apologetics","url":"https://answering-islam.org/Green/seven.htm"},{"name":"IRCICA — refutation of Brubaker (Altikulac)","type":"muslim","url":"https://www.ircica.org/publications/studies-on-the-holy-quran/refutation-of-daniel-alan-brubakers-corrections-in-early-qur%CA%BEan-manuscripts"}],"response":"Al-Azami, Islamic Awareness and the IRCICA reply by Altikulac answer as follows. The Quran was revealed in seven ahruf, or modes, all divinely revealed. Uthman's standardisation eliminated no revelation; it unified the community on one mode to prevent schism, with the Companions' unanimous approval. The canonical readings, Hafs and Warsh among them, are parallel mass-transmitted recitations going back to the Prophet. They are dialect and permitted variation, not corruption, and virtually none affect doctrine. Companion codices were personal copies with explanatory notes, not rival Qurans. Brubaker's corrections are routine scribal fixes toward the standard text, which is a sign of careful control. And radiocarbon-dated early manuscripts, at Birmingham and Tübingen, match today's text extraordinarily closely. No other ancient book is this stable.","responseSource":{"name":"Al-Azami; Islamic Awareness qira'at pages; IRCICA refutation of Brubaker","url":"https://www.islamic-awareness.org/quran/text/qiraat/hafs.html"},"rationale":"The facts are not in dispute. There was a mass burning of variant codices by state order. Companion codices differed in wording, and in surah count per early sources. Wives of the Prophet attested different wording for 2:238. And two materially different texts are printed today. All of that comes from Sahih hadith, from classical qira'at literature, and from print editions anyone can buy. What is contested is only the interpretation: divinely sanctioned modes, or suppressed plurality. Fairness requires noting the steelman's genuine strength, since early Qurans after Uthman are remarkably stable. But 'perfect preservation of one exact text' is refuted by Islam's own canon. What was preserved is the Uthmanic recension, achieved by destroying the evidence of what else existed.","plain":[{"t":"What Bukhari says happened","d":"Sahih al-Bukhari 4987 records the crisis. Muslims differed in their recitation. Hudhayfa feared they would split <b>\"as Jews and Christians differed.\"</b> Uthman had one version copied. He then ordered every other Quranic text burnt, <b>\"whether fragmentary manuscripts or whole copies.\"</b>"},{"t":"What was suppressed","d":"Ibn Mas'ud's codex reportedly lacked Surahs 1, 113 and 114. Ubayy's held two extra. Aisha and Hafsa both had Quran 2:238 with the added words <b>\"and the asr prayer\"</b> (Sahih Muslim 629; Sahih al-Bukhari 5005)."},{"t":"What is still in print","d":"Two reading traditions are printed today. Hafs is used by most of the world. Warsh is used in North and West Africa. They differ in hundreds of places. Some differences change meaning, such as Quran 3:146. The Sanaa palimpsest shows a text form from before Uthman. Daniel Brubaker has documented thousands of physical corrections in early manuscripts."},{"t":"The Muslim answer, at full strength","d":"Al-Azami and Islamic Awareness answer this seriously. The Quran came in seven <i>ahruf</i>, all revealed. Uthman removed no revelation; he united the community on one mode to prevent a split, with the companions' agreement. The canonical readings go back to the Prophet by mass transmission. Companion codices were personal copies with notes, not rival Qurans. IRCICA's reply to Brubaker, by Altikulac, says the corrections are ordinary scribal fixes toward the standard. And the Birmingham and Tübingen manuscripts match today's text closely."},{"t":"How strong is this argument?","d":"They admit the facts themselves. The burning, the differing codices, the two printed texts — all of it comes from Sahih hadith, the <i>qira'at</i> literature and print editions you can buy. Be fair: early Qurans after Uthman are remarkably stable. But what was preserved is the Uthmanic version, reached by destroying the evidence of what else there was."},{"say":true,"t":"What to say","d":"\"Which of the ten readings is the one God sent down? I ask that honestly, not to score a point.\""}],"rewritten":true,"refwhy":{"Quran 15:9":"The preservation promise. This case sets it beside what Islam's own books record.","Quran 2:238":"The prayer verse that Aisha and Hafsa are reported to have recited with extra words.","Quran 3:146":"Where Hafs and Warsh part on meaning. One reads 'fought', the other 'was killed'.","Sahih al-Bukhari 4987":"The burning order, in Bukhari. Hudhayfa feared a split 'as Jews and Christians differed'.","Sahih Muslim 629":"In Sahih Muslim. Aisha's wording of 2:238 adds 'and the asr prayer'.","Sahih al-Bukhari 5005":"In Bukhari. The same longer wording again, from Hafsa. Two wives of the Prophet, in sound books."},"titleLong":"Uthman's burning of rival codices, companion variants, and Hafs vs. Warsh today"},
{"id":"aisha-age","category":"practice","severity":"high","verdict":"admitted","title":"Muhammad married a six-year-old — Bukhari 5134","claim":"Sahih al-Bukhari 5134, also at 3894, and Sahih Muslim 1422 record it from Aisha herself. The Prophet married her when she was six. He consummated the marriage when she was nine. Sahih al-Bukhari 6130 adds that she was playing with dolls at his house. These are among the most multiply attested facts in the hadith corpus. They were accepted by all classical scholars, and nine-year consummation became a benchmark in law. The issue binds Islam for two reasons. Muhammad is the 'excellent pattern' for all time (33:21). And 65:4 gives a divorce waiting-period for wives 'who have not yet menstruated', which classical tafsir applies to marriage before puberty.","quran":["Quran 33:21","Quran 65:4"],"hadith":["Sahih al-Bukhari 5134","Sahih al-Bukhari 3894","Sahih Muslim 1422","Sahih al-Bukhari 6130"],"bible":[],"sources":[{"name":"Sahih al-Bukhari 5134","type":"primary","url":"https://sunnah.com/bukhari:5134"},{"name":"Sahih Muslim 1422","type":"primary","url":"https://sunnah.com/muslim:1422"},{"name":"Yaqeen (Jonathan Brown) — The Age of Aisha: Rejecting Historical Revisionism","type":"muslim","url":"https://yaqeeninstitute.org/read/paper/the-age-of-aisha-ra-rejecting-historical-revisionism-and-modernist-presumptions"},{"name":"WikiIslam — Aisha's Age (revisionist arguments catalogued)","type":"apologetics","url":"https://wikiislam.net/wiki/Aisha's_Age"}],"response":"Two incompatible defences circulate. The revisionist one holds that Aisha was really about 15 to 19, arguing from her sister Asma's reported age and other inferences. The traditional-contextualist one is the scholarly mainstream, set out by Jonathan A. C. Brown in his Yaqeen Institute paper. On that view the ages are authentic and revisionism is bad hadith methodology. Instead the marriage must be judged in context. Betrothal of minors, with consummation at puberty, was normal across premodern societies. That included the Jewish and Christian law of the era. No contemporary or enemy of Muhammad ever criticised it. Aisha reports it without complaint and became Islam's greatest female scholar. And the marriage was commanded in a dream-revelation.","responseSource":{"name":"Jonathan A.C. Brown (Yaqeen) — 'The Age of Aisha'","url":"https://yaqeeninstitute.org/read/paper/the-age-of-aisha-ra-rejecting-historical-revisionism-and-modernist-presumptions"},"rationale":"The ages are conceded in the strongest possible Islamic sources — Aisha's own first-person narration in both Bukhari and Muslim, through multiple chains. The flagship traditionalist institution explicitly rejects the revisionist escape as methodologically indefensible, since no classical scholar in 1,300 years doubted the ages. So the live debate is only over the moral evaluation. That is a genuine argument, and it concedes every fact. For fairness, say plainly that such marriages were unremarkable in antiquity. The Christian critique properly targets the claim that this man is the timeless moral exemplar (33:21). It does not target 7th-century norms as such.","plain":[{"t":"What Islam's own books record","d":"Sahih al-Bukhari 5134 and 3894, and Sahih Muslim 1422, record it from Aisha herself. Muhammad married her when she was six. He consummated the marriage when she was nine. Sahih al-Bukhari 6130 adds that she was playing with dolls at his house."},{"t":"Where this comes from","d":"This is not an accusation from outside. It is Aisha's own first-person account, in the two most trusted Sunni collections, through several chains. Every classical scholar accepted it. Nine became a benchmark in Islamic law."},{"t":"Why it is not only about the past","d":"Quran 33:21 calls Muhammad an excellent pattern for all time. Quran 65:4 sets a waiting period after divorce for wives <b>\"who have not yet menstruated,\"</b> which classical commentators applied to marriage before puberty. So the question is not only what happened, but what it is a model for."},{"t":"The Muslim answers, at full strength","d":"Two answers circulate, and they contradict each other. One says Aisha was really about 15 to 19, reasoning from her sister Asma's age. The other is the scholarly mainstream, argued by Jonathan A. C. Brown for the Yaqeen Institute. The ages are authentic, and the revisionist route is bad hadith method. The marriage must be judged in context. Betrothal of minors, with consummation at puberty, was normal across premodern societies, including in Jewish and Christian law of the era. No contemporary or enemy of Muhammad criticised it. Aisha reports it without complaint and became Islam's greatest female scholar."},{"t":"How strong is this argument?","d":"They admit the facts themselves, in the strongest possible sources. Yaqeen rejects the 15-to-19 rescue as indefensible. So the live debate is only about how to judge it, and that debate concedes every fact. Be fair, and say this: such marriages were unremarkable in antiquity. The Christian question is narrower. It is about the claim that this man is the timeless model, not about 7th-century norms."},{"say":true,"t":"What to say","d":"\"I am not trying to insult anyone. May I ask how you understand Bukhari 5134?\""}],"rewritten":true,"refwhy":{"Quran 33:21":"Calls Muhammad an excellent pattern. That is why this is about a model, not only a past event.","Quran 65:4":"Sets a waiting time for wives 'who have not yet menstruated'. Classical tafsir applied it here.","Sahih al-Bukhari 5134":"Aisha's own words in Bukhari. Married at six, and the marriage consummated at nine.","Sahih al-Bukhari 3894":"The same report in Bukhari by another chain. Being told more than once is the point.","Sahih Muslim 1422":"The same account in Sahih Muslim. The two soundest Sunni books agree, so nobody disputes it.","Sahih al-Bukhari 6130":"In Bukhari. She was playing with dolls at his house. The detail that fixes how young she was."},"titleLong":"Aisha: married at six, consummated at nine (Bukhari 5134; Muslim 1422)"},
{"id":"women-and-captives","category":"practice","severity":"high","verdict":"admitted","title":"Quran 4:34: admonish her, leave her, strike her","claim":"Quran 4:34 instructs that wives whose rebellion is feared be admonished, then abandoned in bed, then struck. The verb is daraba, rendered 'beat' or 'strike' by the overwhelming majority of translators, and classical tafsir universally understood physical hitting, qualified as not severe. Sunan Abi Dawud 2146 records the trajectory: 'Do not beat Allah's handmaidens', then permission after Umar's complaint, then, when women complained, 'those men are not the best of you'. Separately, 4:24 permits intercourse with married captive women, their prior marriages annulled by capture. Sahih Muslim 1438 shows companions on the Banu Mustaliq raid asking about coitus interruptus with newly captured women, where the objection recorded concerns the futility of thwarting what is decreed, not the act itself.","quran":["Quran 4:34","Quran 4:24","Quran 23:5-6","Quran 33:50"],"hadith":["Sunan Abi Dawud 2146","Sahih Muslim 1438","Sunan Abi Dawud 2155"],"bible":["Ephesians 5:25-29","1 Peter 3:7"],"sources":[{"name":"Sahih Muslim 1438","type":"primary","url":"https://sunnah.com/muslim:1438"},{"name":"WikiIslam — Wife Beating in the Quran","type":"apologetics","url":"https://wikiislam.net/wiki/Wife_Beating_in_the_Qur'an"},{"name":"IslamQA 20802 — intercourse with a slave woman","type":"muslim","url":"https://islamqa.info/en/answers/20802"},{"name":"Ayesha Chaudhry — Domestic Violence and the Islamic Tradition (Oxford UP)","type":"scholarly","url":"https://global.oup.com/academic/product/domestic-violence-and-the-islamic-tradition-9780199640164"}],"response":"IslamQA 20802, classical fiqh and Jonathan Brown's Slavery and Islam answer as follows. On 4:34, the permission is a last resort and symbolic. Classical jurisprudence forbade injury, bruising, or striking the face. The Prophet never hit a wife or servant (Sahih Muslim 2328) and said 'the best of you are best to their wives'. Some modern scholars read daraba as 'separate from', and Ayesha Chaudhry's Oxford study traces the whole debate. The three steps are de-escalation in a context where unrestricted beating was normal, so the verse restricts violence rather than licensing it. On captives, concubinage was the universal law of war in antiquity, including in biblical law (Numbers 31:18; Deuteronomy 21:10-14). Islam regulated it with a waiting period before intercourse, forbade splitting captives from their children, and praised freeing and marrying a captive. It channelled captives into households rather than massacre, on a trajectory toward abolition.","responseSource":{"name":"IslamQA 20802; Jonathan Brown, Slavery and Islam; classical fiqh restrictions","url":"https://islamqa.info/en/answers/20802"},"rationale":"Both permissions are conceded textually and juristically. No classical authority denied that 4:34 authorises some physical striking; the dispute is over degree. Sexual access to captives is affirmed by the context of 4:24, by Sahih Muslim 1438, and by mainstream fatwa — IslamQA states it plainly today. The restriction-trajectory steelman is historically serious, and the comparison with Deuteronomy 21 must be honestly faced rather than dodged. But the Christian critique lands on the exemplar claim. These are presented not as regulated concessions of a hard era, but as the final revelation's permanent legislation, and they are defended as such by living mainstream authorities. The 'daraba means separate' reading is rejected by essentially all classical and most contemporary scholarship.","plain":[{"t":"The two texts","d":"Quran 4:34 gives three steps for a wife whose rebellion is feared. Admonish her, then leave her bed, then strike her. The verb is <i>daraba</i>. Most translators render it beat or strike, and classical commentary understood physical hitting, though not severe. Quran 4:24 permits relations with married women taken captive, their earlier marriages ended by capture."},{"t":"What the hadith add","d":"Sunan Abi Dawud 2146 shows the whole trajectory. First: <b>\"Do not beat Allah's handmaidens.\"</b> Then permission, after Umar complained. Then, when women complained, <b>\"those men are not the best of you.\"</b> Sahih Muslim 1438 records companions on the Banu Mustaliq raid asking about withdrawal with newly captured women. The objection recorded is about thwarting what is decreed, not about the act."},{"t":"The Muslim answer, at full strength","d":"IslamQA 20802 and classical law give a real answer. On 4:34, the permission is a last resort and symbolic. Jurists forbade injury, bruising and striking the face. Muhammad never hit a wife or servant (Sahih Muslim 2328) and said the best of you are best to their wives. Some modern scholars read <i>daraba</i> as separate from. Ayesha Chaudhry's Oxford study traces this whole debate. On captives, Jonathan Brown notes that concubinage was the universal law of war, including in Numbers 31:18 and Deuteronomy 21:10-14. Islam regulated it and pointed toward release."},{"t":"Where it still stands","d":"Both permissions are conceded by Islamic law itself. No classical authority denied that 4:34 allows some striking; they argued about degree. Access to captives is affirmed by 4:24, by Sahih Muslim 1438, and by mainstream fatwa today. The reading of <i>daraba</i> as separate from is rejected by nearly all classical and most modern scholars."},{"t":"How strong is this argument?","d":"They admit the texts, and this is heavy ground. Face Deuteronomy 21 honestly rather than dodging it. The Christian question is about status. These are not offered as concessions to a hard age. They are final and permanent law, and are defended as such now. Never use this to shame a person. Ask, listen, and go slowly."},{"say":true,"t":"What to say","d":"\"How do you and your teachers read Quran 4:34? I would rather hear it from you than assume.\""}],"rewritten":true,"refwhy":{"Ephesians 5:25-29":"Tells husbands to love their wives as Christ loved the church. The contrast being offered.","1 Peter 3:7":"Tells a husband to honour his wife, or his prayers are hindered. Not a rule about striking.","Quran 4:34":"The three steps for a wife feared to rebel, ending in striking. This case's main text.","Quran 4:24":"Permits relations with married women taken captive. The second text of this case.","Quran 23:5-6":"Names 'what their right hands possess' beside wives as lawful. The base for concubinage.","Quran 33:50":"Lists whom the Prophet may marry, captives among them. The same category, applied to him.","Sunan Abi Dawud 2146":"Not Bukhari or Muslim, but widely used. It traces the shift from 'do not beat' to leave, then regret.","Sahih Muslim 1438":"In Sahih Muslim. Men ask about withdrawal with newly taken women. The act itself is not questioned.","Sunan Abi Dawud 2155":"From Abu Dawud, outside the two Sahih books. It gives the waiting rule Muslims cite on captives."},"titleLong":"Wife-beating (4:34) and sexual access to female captives (4:24; Muslim 1438)"},
{"id":"zaynab-hastening-revelation","category":"muhammad-test","severity":"high","verdict":"admitted","title":"He married his adopted son's ex-wife, Zaynab","claim":"Quran 33:37 addresses Muhammad's marriage to Zaynab bint Jahsh, the former wife of his adopted son Zayd — a scandal under Arab adoption norms. The verse reveals that while Muhammad concealed his interest and feared people's talk, Allah married her to him 'so that there would be no blame on believers concerning the wives of their adopted sons'. The Quran simultaneously abolished adoption's legal force (33:4-5). Critics observe a recurring pattern of revelations authorising Muhammad's personal privileges: unlimited wives for him alone (33:50), freedom to reschedule his wives' turns (33:51), and a ban on other men marrying his widows (33:53). The pattern was visible in his own house. After 33:51 came down, Aisha said to him: 'I feel that your Lord hastens in fulfilling your wishes and desires' (Sahih al-Bukhari 4788).","quran":["Quran 33:37","Quran 33:4-5","Quran 33:50-53","Quran 66:1-5"],"hadith":["Sahih al-Bukhari 4788","Sahih al-Bukhari 7420","Sahih Muslim 1428"],"bible":["Deuteronomy 18:20-22","Jeremiah 23:16-32"],"sources":[{"name":"Sahih al-Bukhari 4788","type":"primary","url":"https://sunnah.com/bukhari:4788"},{"name":"ICRAA — Aisha's statement explained","type":"muslim","url":"https://icraa.org/aishahs-statement-lord-hastens-in-fulfilling-your-desires-explained/"},{"name":"Answering Islam — on Zaynab (Sam Shamoun)","type":"apologetics","url":"https://www.answering-islam.org/Shamoun/zaynab.htm"}],"response":"ICRAA, Ibn Kathir and Maududi answer that the marriage was a costly legal reform, not indulgence. Pre-Islamic adoption created fictive bloodlines with real inheritance and marriage consequences. Abolishing it required a public, unavoidable demonstration, and God chose the hardest case, the Prophet himself, because no one else's example would have broken the taboo. Muhammad resisted — 'you feared the people' — which is evidence against opportunism. Zaynab was his cousin, whom he could have married years earlier had desire driven him. Aisha's remark was spousal candour, and that Muslims faithfully preserved even this barb in their most authentic collection shows the tradition's honesty. His marriages overall skewed toward widows and political alliances.","responseSource":{"name":"ICRAA; Ibn Kathir and Maududi on 33:37","url":"https://icraa.org/aishahs-statement-lord-hastens-in-fulfilling-your-desires-explained/"},"rationale":"Every factual element is canonical. The desire-then-revelation sequence is in the Quran's own wording. The privileges of 33:50-53 are explicit. And the 'hastens to fulfil your desires' observation is Aisha's, in Bukhari. The legal-reform steelman is internally coherent for Zaynab taken alone, but it cannot explain the cumulative pattern. The 'preserved barb proves honesty' argument also cuts both ways. It proves the tradition is honest, and that what it honestly preserves is contemporaneous suspicion inside the Prophet's own house. Whether the pattern proves fabrication is a judgment call. That the pattern exists is admitted in Islam's canon.","plain":[{"t":"What happened","d":"Zaynab bint Jahsh was married to Zayd, Muhammad's adopted son. After they divorced, Quran 33:37 sanctioned Muhammad's marriage to her. Under Arab custom that was a scandal. The verse says he concealed his interest and feared people's talk, and that Allah married her to him so there would be no blame on believers about the wives of adopted sons. Quran 33:4-5 abolished adoption's legal force at the same time."},{"t":"The privileges around it","d":"Critics point to a pattern of verses. Quran 33:50 allows him unlimited wives, alone. Quran 33:51 lets him reschedule his wives' turns. Quran 33:53 bans other men from marrying his widows."},{"t":"What Aisha said","d":"The sharpest line is inside the household. After 33:51 came down, Aisha said to him: <b>\"I feel that your Lord hastens in fulfilling your wishes and desires\"</b> (Sahih al-Bukhari 4788). That is preserved in Islam's most authentic collection."},{"t":"The Muslim answer, at full strength","d":"ICRAA, Ibn Kathir and Maududi answer that this was costly reform, not indulgence. Arab adoption created false bloodlines with real inheritance and marriage effects. Ending it needed a public case nobody could ignore, so God chose the hardest one. Muhammad resisted — <i>you feared the people</i> — which argues against opportunism. Zaynab was his cousin, and he could have married her years earlier. Aisha's remark was spousal candour, and Muslims preserved it, which shows the tradition's honesty. His marriages overall were mostly to widows and for alliances."},{"t":"How strong is this argument?","d":"They admit every fact, which is why this one lands. The sequence is in the Quran's own wording. The privileges are explicit. The remark is Aisha's, in Bukhari. The reform answer works for Zaynab alone but not for the pattern. Whether the pattern proves anything is a judgment. That it exists is not in dispute."},{"say":true,"t":"What to say","d":"\"Aisha said that line herself, and your scholars kept it. What do you think she meant?\""}],"rewritten":true,"refwhy":{"Deuteronomy 18:20-22":"Warns about a prophet who speaks a word God has not commanded. The rule being applied.","Jeremiah 23:16-32":"God's charge against prophets who speak 'a vision of their own heart'. The nearest parallel.","Quran 33:37":"The Zaynab verse. It says Allah married her to him, and that he had feared people's talk.","Quran 33:4-5":"Ends the legal force of adoption. The Muslim reply says this reform is why the marriage happened.","Quran 33:50-53":"The privileges: more wives, freedom over their turns, and no remarriage of his widows.","Quran 66:1-5":"Another revelation settling a quarrel in his household. It is why critics speak of a pattern.","Sahih al-Bukhari 4788":"Aisha's line, in Bukhari: 'your Lord hastens in fulfilling your wishes'. The sharpest quote here.","Sahih al-Bukhari 7420":"The same remark, kept a second time in Bukhari. Islam's own books did not cut it out.","Sahih Muslim 1428":"In Sahih Muslim: the account of the wedding feast for Zaynab. The event in the second sound book."},"titleLong":"The Zaynab marriage (33:37) and Aisha's 'your Lord hastens to fulfill your desires'"},
{"id":"prophet-test-signs","category":"muhammad-test","severity":"medium","verdict":"contested","title":"'Signs are only with Allah' — Muhammad declined","claim":"The biblical test of a prophet is verifiable prediction (Deuteronomy 18:21-22; Isaiah 41:21-23) and God-given signs (John 10:37-38). The Quran repeatedly records Muhammad declining to produce signs: 'Why has a sign not been sent down to him? Say: signs are only with Allah, and I am only a clear warner' (29:50; also 13:7; 17:90-93; 6:37). Public miracles appear only in later hadith, which sits in tension with the Quran's own stance. The one claimed predictive prophecy is 30:2-4: 'The Romans have been defeated... but they will be victorious within three to nine years.' It is problematic on three counts. In the original undotted script the words could equally be read 'Rome has conquered... will be defeated'. The timespan is elastic. And on standard dating, from Jerusalem in 614 to final victory in 628, fulfilment falls outside nine years. A vague geopolitical reversal cannot meet Deuteronomy 18's standard of detailed, falsifiable prediction.","quran":["Quran 30:2-4","Quran 29:50-51","Quran 13:7","Quran 17:90-93","Quran 6:37"],"hadith":["Sahih al-Bukhari 3636","Sahih al-Bukhari 4981","Jami at-Tirmidhi 3194"],"bible":["Deuteronomy 18:21-22","Isaiah 41:21-23","John 10:37-38"],"sources":[{"name":"Answering Islam — Muhammad's False Prophecies","type":"apologetics","url":"https://www.answering-islam.org/Shamoun/false_prophecies.htm"},{"name":"About Islam — Fulfilled Prophecy of Surat Ar-Rum (Muslim case)","type":"muslim","url":"https://aboutislam.net/muslim-issues/science-muslim-issues/fulfilled-prophecy-surat-ar-rum/"},{"name":"Answering Islam — Muhammad and Miracles","type":"apologetics","url":"https://answering-islam.org/Responses/Azmy/mhd_miracles.htm"}],"response":"About Islam and Ibn Kathir answer on both points. The Rome prophecy was made when Byzantium lay prostrate, so predicting its victory was humanly absurd — and it happened, since Heraclius' improbable campaigns between 622 and 628 reversed the war. Abu Bakr's public wager (Jami at-Tirmidhi 3194) shows that 'Rome will win' was the reading from the start, and the recitation consensus fixes it. The same passage adds that the believers would rejoice at the same time, which was fulfilled at Badr. On signs, the Quran denies signs on demand to hostile testers, not miracles absolutely. The Quran's own inimitability, in the unanswered challenge of 2:23, is the standing miracle, and the splitting of the moon is referenced in 54:1-2 itself.","responseSource":{"name":"About Islam / Ibn Kathir on 30:2-4 and 54:1","url":"https://aboutislam.net/muslim-issues/science-muslim-issues/fulfilled-prophecy-surat-ar-rum/"},"rationale":"The Rome passage is a genuine pre-event prediction by any dating, so 'no prophecy at all' overstates the case, and Abu Bakr's wager is early evidence for the standard reading. But it survives as prophecy only in its vaguest form. The counter-reading in the defective script is real. The three-to-nine-year window fits only with favourable date choices. And one elastic reversal cannot bear the weight Deuteronomy 18 places on detailed, falsifiable prediction. Compare Isaiah naming Cyrus. The signs question is likewise split. The Quran's own posture, a warner without signs, is textually clear. It stands in real tension with the later hadith miracle corpus, which multiplies wonders the Quran never claims.","plain":[{"t":"The test in the Bible","d":"Deuteronomy 18:21-22 gives a public test for a prophet. What he predicts must happen. Isaiah 41:21-23 sets the same standard for God himself. Jesus points to his works as evidence (John 10:37-38)."},{"t":"What the Quran says about signs","d":"The Quran repeatedly has Muhammad decline to produce signs. <b>\"Why has a sign not been sent down to him? Say: signs are only with Allah, and I am only a clear warner\"</b> (Quran 29:50). Quran 13:7 and 17:90-93 say the same. Public miracles appear mainly in later hadith, which sits oddly beside this."},{"t":"The one predictive passage","d":"Quran 30:2-4 says the Romans have been defeated but will be victorious within three to nine years. Three problems are raised. In the early undotted script the words could be read the other way round. The window is elastic. And on standard dating — Jerusalem falls in 614, final victory in 628 — the fulfilment lands outside nine years."},{"t":"The Muslim answer, at full strength","d":"About Islam and Ibn Kathir answer well. When the verse came, Byzantium was flat on its back, so predicting its victory was humanly absurd. It happened: Heraclius turned the war around between 622 and 628. Abu Bakr publicly wagered on it (Jami at-Tirmidhi 3194), which shows the reading was fixed from the start. The passage also says believers would rejoice at the same time, fulfilled at Badr. On signs, the Quran refuses signs on demand to hostile testers, not miracles as such. Its own inimitability is the standing miracle (2:23), and the splitting of the moon is in 54:1-2."},{"t":"How strong is this argument?","d":"Genuinely arguable, so do not overstate. The Rome passage is a real prediction on any dating, and Abu Bakr's wager is early evidence. But it survives only in its vaguest form, and one elastic reversal cannot carry the weight Deuteronomy 18 places on detail — compare Isaiah naming Cyrus. The signs question is likewise split: the Quran's own posture and the later miracle hadith pull apart."},{"say":true,"t":"What to say","d":"\"The Quran says he was a warner, not a worker of signs. Why do the later books add so many?\""}],"rewritten":true,"refwhy":{"Deuteronomy 18:21-22":"The test: if what he says does not happen, God did not speak it. The measure used here.","Isaiah 41:21-23":"God dares the idols to say what will happen. Prediction offered as the proof.","John 10:37-38":"Jesus tells them to judge him by his works. That is the signs half of the test.","Quran 30:2-4":"The Rome passage. It is the one predictive claim, and the whole argument turns on it.","Quran 29:50-51":"'Signs are only with Allah, and I am only a clear warner.' The Quran's own stance.","Quran 13:7":"They ask for a sign, and he is told again that he is only a warner.","Quran 17:90-93":"A list of signs demanded and refused. It ends by calling him only a man and a messenger.","Quran 6:37":"Another demand for a sign. The answer is that Allah is able, not that a sign is given.","Sahih al-Bukhari 3636":"In Bukhari: the moon is split. One of the later sign reports the Quran itself does not press.","Sahih al-Bukhari 4981":"Cuts against you. In Bukhari he says what he was given is the revelation. That is the Muslim answer.","Jami at-Tirmidhi 3194":"From Tirmidhi, below Bukhari in rank. It records Abu Bakr's wager on the Rome verse."},"titleLong":"No predictive prophecy, no Quranic miracles: Muhammad and the biblical prophet test"},
{"id":"aorta-test","category":"muhammad-test","severity":"medium","verdict":"contested","title":"Quran 69:46 on the aorta, and the Khaybar poison","claim":"Quran 69:44-46 says: 'If he had invented false sayings concerning Us, We would have seized him by the right hand, then We would have cut from him the aorta.' In Sahih al-Bukhari 4428, during his fatal illness, Muhammad says: 'O Aisha! I still feel the pain caused by the food I ate at Khaybar, and at this time I feel as if my aorta is being cut from that poison.' The poisoned meat was served by a Jewish woman after Khaybar's conquest, reportedly to test his prophethood, since she reasoned that a true prophet would be informed. The internal-test argument runs like this. The Quran names a specific divine punishment for a false prophet, a severed aorta. Islam's most authentic source records Muhammad dying while describing exactly that sensation, from a poisoning administered as a test of prophethood. His companion Bishr died of the same meal.","quran":["Quran 69:44-47"],"hadith":["Sahih al-Bukhari 4428","Sahih al-Bukhari 2617","Sahih Muslim 2190","Sunan Abi Dawud 4512"],"bible":["Deuteronomy 18:20"],"sources":[{"name":"Sahih al-Bukhari 4428","type":"primary","url":"https://sunnah.com/bukhari:4428"},{"name":"Analyzing Islam — Poisoned at Khaybar; Aorta Severed (dossier)","type":"apologetics","url":"https://analyzingislam.com/arguments/bukhari/b17-prophets-poison-death.html"},{"name":"Jesus-Islam — How did Muhammad die?","type":"apologetics","url":"https://jesus-islam.org/questions/how-did-muhammad-die/"}],"response":"IslamQA and Islamweb answer on the text. Quran 69:44-46 describes an immediate, public divine execution for forgery — seizure 'by the right hand' and instant severing, as a demonstration. It does not describe death by illness more than three years after a poisoning, since Khaybar was in 628 and the death in 632. 'I feel as if my aorta is being cut' is an Arabic idiom for mortal agony, using a different anatomical word — abhar rather than watin — so it is a simile of pain, not a report of the punishment in 69:46. Far from disproving him, the episode is claimed as vindication. The meat itself 'spoke' to warn him, he stopped eating, and death from its lingering effect earned him a martyr's honour, after the religion was completed (5:3). No forger controls his dying words, and attributing his death to the poison shows guileless candour.","responseSource":{"name":"IslamQA and Islamweb treatments of Bukhari 4428 and 69:44-46","url":"https://islamqa.info/en/answers/"},"rationale":"The factual chain is fully canonical. The verse, the poisoning as a test of prophethood, and the deathbed aorta statement are all in Bukhari. But the argument's force depends on reading 69:44-46 as a general criterion rather than as a threat of immediate exemplary execution. The Arabic uses different anatomical terms, and 'as if' marks a simile. The Christian can fairly say it is at minimum an astonishing irony that Islam's own canon has its prophet dying while describing the false prophet's punishment, poisoned in a test whose stated logic the outcome appeared to vindicate. The Muslim can fairly say the verse does not state the general criterion the argument needs. Powerful rhetoric; not a strict internal contradiction.","plain":[{"t":"The verse","d":"Quran 69:44-46 says of the messenger: <b>\"If he had invented false sayings concerning Us, We would have seized him by the right hand, then We would have cut from him the aorta.\"</b>"},{"t":"The deathbed report","d":"Sahih al-Bukhari 4428 records his final illness. He says to Aisha: <b>\"O Aisha! I still feel the pain caused by the food I ate at Khaybar, and at this time I feel as if my aorta is being cut from that poison.\"</b> The poisoned meat was served by a Jewish woman after Khaybar fell. Reports say she did it to test his prophethood, reasoning that a true prophet would be warned. His companion Bishr died of the same meal."},{"t":"The Muslim answer, at full strength","d":"IslamQA and Islamweb answer on the text. Quran 69:44-46 describes an immediate, public execution for forgery — seizure by the right hand and instant severing, as a demonstration. It does not describe illness three years after a poisoning; Khaybar was 628 and he died in 632. The words are <i>as if</i>, a simile of mortal pain, and the anatomical terms differ — <i>abhar</i> in the hadith, <i>watin</i> in the verse. Muslims also read the episode as vindication: the meat warned him, he stopped eating, and dying from it earned him a martyr's honour after the religion was complete (5:3)."},{"t":"Where it lands","d":"Every fact is canonical: the verse, the poisoning as a test, and the deathbed words are all in Islam's own books. The argument's force depends on reading 69:44-46 as a general rule rather than a threat of instant public punishment. That is where a Muslim can fairly push back."},{"t":"How strong is this argument?","d":"Powerful rhetoric, not a strict contradiction. You can fairly call it an astonishing irony. You cannot fairly call it a proof. Say both halves, and let the other person weigh it."},{"say":true,"t":"What to say","d":"\"Do you know the report in Bukhari 4428, about what he said at the end? I found it striking.\""}],"rewritten":true,"refwhy":{"Deuteronomy 18:20":"Says a prophet who speaks in God's name without warrant shall die. The frame for this case.","Quran 69:44-47":"The verse itself. Had he invented sayings, 'We would have cut from him the aorta'.","Sahih al-Bukhari 4428":"The deathbed report in Bukhari. He feels as if his aorta is being cut, from the Khaybar poison.","Sahih al-Bukhari 2617":"In Bukhari: a Jewish woman brings the poisoned sheep. The event behind the deathbed words.","Sahih Muslim 2190":"The same poisoning in Sahih Muslim. Both of the soundest books carry it, so the facts hold.","Sunan Abi Dawud 4512":"From Abu Dawud, below Bukhari and Muslim in rank. It carries a further report of the poisoning."},"titleLong":"The aorta test: 'We would have cut his aorta' (69:44–46) and the Khaybar poison"},
{"id":"salvation-scales","category":"salvation","severity":"high","verdict":"admitted","featured":true,"title":"No assurance of salvation, even for Muhammad","claim":"Islamic salvation is a weighing: 'Those whose scales are heavy — they are the successful; those whose scales are light — they have lost their souls, in Hell abiding' (23:102-103; 101:6-9; 7:8-9). Allah's love is conditional: 'Allah loves not the disbelievers' (3:32). Assurance is absent by design, even for Muhammad. 'By Allah, though I am Allah's Messenger, I neither know what will happen to me, nor to you' (Sahih al-Bukhari 7018, echoing Quran 46:9). And: 'none of you will enter Paradise by his deeds... not even I, unless Allah covers me with mercy' (Sahih Muslim 2816). The contrast is structural. The God of the Bible demonstrates love for sinners while they are still sinners (Romans 5:8). Salvation is by grace through faith and not by works (Ephesians 2:8-9). Sins are borne by a substitute (Isaiah 53:5-6). And assurance is offered as knowledge: 'that you may know that you have eternal life' (1 John 5:13).","quran":["Quran 23:102-103","Quran 101:6-9","Quran 7:8-9","Quran 19:71","Quran 3:32","Quran 46:9"],"hadith":["Sahih al-Bukhari 7018","Sahih Muslim 2816","Sahih Muslim 2643"],"bible":["Romans 5:8","Ephesians 2:8-9","1 John 5:13","John 5:24","Isaiah 53:5-6","Luke 18:9-14","Hebrews 10:14"],"sources":[{"name":"Sahih al-Bukhari 7018","type":"primary","url":"https://sunnah.com/bukhari:7018"},{"name":"Sahih Muslim 2816","type":"primary","url":"https://sunnah.com/muslim:2816"},{"name":"Yaqeen Institute — salvation papers","type":"muslim","url":"https://yaqeeninstitute.org/read/paper/is-there-salvation-outside-of-islam"}],"response":"The Yaqeen Institute's papers on salvation, and Ibn Qayyim on fear and hope, answer that Islam's soteriology is saturated with mercy rather than cold bookkeeping. Allah's mercy 'prevails over His wrath'. One good deed counts tenfold to seven-hundredfold, while a sin counts once (Sahih al-Bukhari 6491). Sincere monotheism ultimately delivers from eternal Hell, and Sahih Muslim 2816 shows that entry to Paradise is itself by Allah's mercy and not earned — which is functionally a doctrine of grace. The absence of presumptuous assurance is a feature, holding the believer between fear and hope, producing humility and moral seriousness, whereas guaranteed salvation invites licence; Christians themselves debate eternal security. Quran 3:32 concerns Allah's love of approval for persistent rejecters, not the absence of universal compassion (7:156). And Bukhari 7018 predates the revelation of Muhammad's forgiveness (48:1-2).","responseSource":{"name":"Yaqeen soteriology papers; Ibn Qayyim on fear and hope","url":"https://yaqeeninstitute.org/read/paper/is-there-salvation-outside-of-islam"},"rationale":"This entry documents a structural contrast, and every element of the Islamic side is canonical and conceded: salvation weighed by scales, no textual offer of assurance, conditional divine love in the Quran's explicit wording, and Muhammad's own recorded uncertainty. Note that 48:1-2 rescues Muhammad specifically, which underlines that others lack the guarantee. The steelman honestly complicates the caricature, since Muslim 2816 does place final entry on mercy. But mercy applied through a merit-weighing frame, with no substitutionary atonement and no offered assurance, remains categorically different from Romans 5:8 and 1 John 5:13. This is the entry that leads most directly to the gospel.","plain":[{"t":"How Islam pictures judgment","d":"It is a weighing. <b>\"Those whose scales are heavy — they are the successful; those whose scales are light — they have lost their souls, in Hell abiding\"</b> (Quran 23:102-103; also 101:6-9; 7:8-9). Love is conditional: <b>\"Allah loves not the disbelievers\"</b> (3:32)."},{"t":"Assurance is absent by design","d":"Even for Muhammad. <b>\"By Allah, though I am Allah's Messenger, I neither know what will happen to me, nor to you\"</b> (Sahih al-Bukhari 7018, echoing Quran 46:9). And: <b>\"none of you will enter Paradise by his deeds... not even I, unless Allah covers me with mercy\"</b> (Sahih Muslim 2816)."},{"t":"What the Bible offers instead","d":"God shows love for sinners while they are still sinners (Romans 5:8). Salvation is by grace through faith, not by works (Ephesians 2:8-9). Sin is carried by a substitute (Isaiah 53:5-6). And assurance is offered as knowledge: <b>\"that you may know that you have eternal life\"</b> (1 John 5:13)."},{"t":"The Muslim answer, at full strength","d":"The Yaqeen Institute and Ibn Qayyim answer that this is not cold bookkeeping. Allah's mercy prevails over His wrath. One good deed counts ten to seven hundred times over, while a sin counts once (Sahih al-Bukhari 6491). Sincere monotheism finally delivers from eternal Hell. Sahih Muslim 2816 itself puts entry to Paradise on mercy, not on earning — which is close to a doctrine of grace. And the absence of guaranteed assurance is a feature: it keeps the believer between fear and hope. Quran 3:32 is about approval of those who persist in rejection, not about a lack of compassion (7:156). Bukhari 7018 also predates 48:1-2."},{"t":"How strong is this argument?","d":"They admit the structure themselves, and this is the case that leads most directly to the gospel. The reply is fair as far as it goes. But mercy given through a weighing frame, with no substitute and no offered assurance, is a different thing from Romans 5:8 and 1 John 5:13. Notice too that 48:1-2 rescues Muhammad specifically, which underlines that others have no such guarantee."},{"say":true,"t":"What to say","d":"\"If you died tonight, would you know? I can tell you why a Christian can.\""}],"rewritten":true,"refwhy":{"Romans 5:8":"God shows love while we are still sinners. The clearest contrast with love that waits on deeds.","Ephesians 2:8-9":"By grace through faith, not of works. The whole difference, in one sentence.","1 John 5:13":"'That ye may know that ye have eternal life.' Assurance offered as knowledge, not hope.","John 5:24":"Says the one who believes is 'passed from death unto life'. Already, before any weighing.","Isaiah 53:5-6":"The one who carries the sin of others. Islam has no place for a substitute, which is the deeper gap.","Luke 18:9-14":"The tax man goes home right with God. The man counting his deeds does not. A parable about scales.","Hebrews 10:14":"'By one offering he hath perfected for ever them that are sanctified.' Finished, not weighed.","Quran 23:102-103":"The scales. Heavy scales succeed, light scales are lost. The picture the case rests on.","Quran 101:6-9":"The same weighing at the last day, in one of the short surahs.","Quran 7:8-9":"The weighing again. Three passages, so this is the frame and not a stray image.","Quran 19:71":"Says every one of you will come to it. Often raised when assurance is discussed.","Quran 3:32":"'Allah loves not the disbelievers.' Love stated with a condition on it.","Quran 46:9":"'I know not what will be done with me or with you.' Said in the Quran, by the Prophet.","Sahih al-Bukhari 7018":"In Bukhari: though he is Allah's Messenger, he does not know what will happen to him.","Sahih Muslim 2816":"Cuts against you. In Sahih Muslim, no one enters Paradise by deeds, not even him, without mercy.","Sahih Muslim 2643":"From Sahih Muslim, on what is written before birth. Cited because it makes assurance harder still."},"titleLong":"Scales of deeds, no assurance — even for Muhammad — vs. the gospel"},
{"id":"taqiyya-deception","category":"practice","severity":"medium","verdict":"contested","title":"Lying allowed in three cases: Sahih Muslim 2605","claim":"Islamic sources do allow deceit in set cases. Quran 16:106 excuses one who denies the faith under force. Quran 3:28 allows one to hide it from hostile unbelievers. The word there is tuqah, the root of taqiyya, which grew mainly in Shia law under attack. Sunni sources allow lying in three cases: war, making peace between people, and between spouses. That list is in Sahih Muslim 2605, where it comes through the narrator Ibn Shihab, and in Jami at-Tirmidhi 1939. Muhammad said 'war is deceit' (Sahih al-Bukhari 3030). He also allowed false speech in the killing of Ka'b ibn al-Ashraf (Sahih al-Bukhari 3031). Scripture runs the other way: God 'cannot lie' (Titus 1:2), and truth under threat is the martyr's calling (Matthew 10:28; Revelation 2:10). But the loud claim, that Muslims are told to lie to us about their faith, goes far beyond the sources. Hiding faith under threat is not a general licence, and Sunni teaching treats lying as a grave sin outside those cases.","quran":["Quran 16:106","Quran 3:28"],"hadith":["Sahih Muslim 2605","Sahih al-Bukhari 3030","Jami at-Tirmidhi 1939"],"bible":["Titus 1:2","Matthew 10:28","Revelation 2:10","Ephesians 4:25"],"sources":[{"name":"Sahih Muslim 2605","type":"primary","url":"https://sunnah.com/muslim:2605"},{"name":"Sahih al-Bukhari 3030","type":"primary","url":"https://sunnah.com/bukhari:3030"},{"name":"Taqiyya (overview of the doctrine's Shia development and Sunni scope)","type":"scholarly","url":"https://en.wikipedia.org/wiki/Taqiyya"},{"name":"IslamQA — lying is permissible only in specific cases","type":"muslim","url":"https://islamqa.info/en/answers/27261"}],"response":"IslamQA 27261 replies that this is a narrow rule for survival, not a way of life. It is much like Peter's denial being forgiven. The three cases cover the sort of peace-making many would accept. 'War is deceit' describes battle craft, which every army uses. And the base rule is truth: 'truthfulness leads to righteousness' (Sahih al-Bukhari 6094). False witness is among the worst sins. The idea that Muslims lie to non-Muslims as a habit is, they note, a stereotype that no mainstream ruling supports.","responseSource":{"name":"IslamQA 27261; mainstream Sunni treatments of truthfulness","url":"https://islamqa.info/en/answers/27261"},"rationale":"Both halves of this entry matter. The facts are real. Deceit is allowed in set cases — war, force, peace-making, spouses — in sahih sources, and that differs from the call to truth unto death. But the loud claim, that you cannot trust a word a Muslim says, has no basis in Islamic law and poisons every talk. The rule is simple. Know the doctrine. Never aim it at the person in front of you. To accuse an ordinary Sunni of it is unfair, unprovable, and ends the conversation on the spot.","plain":[{"t":"What the word means","d":"<i>Taqiyya</i> means hiding your faith under threat. Quran 16:106 excuses one who denies the faith under force. Quran 3:28 allows care around hostile unbelievers. The word there is <i>tuqah</i>, the root of taqiyya. It grew mainly in Shia law, in a group under attack."},{"t":"What Sunni law allows","d":"Lying is allowed in three cases: war, making peace between people, and between husband and wife. That is Sahih Muslim 2605, where the three-case list comes through the narrator Ibn Shihab. Jami at-Tirmidhi 1939 has it too. Muhammad said <b>\"war is deceit\"</b> (Sahih al-Bukhari 3030). He also allowed false words in the killing of Ka'b ibn al-Ashraf (Sahih al-Bukhari 3031)."},{"t":"Where Christians go wrong","d":"Many say Muslims are told to lie to us about their faith. That is not true. The rule is about hiding faith under threat. It is not a free pass. Sunni teaching treats lying as a grave sin outside those three cases."},{"t":"The Muslim answer, at full strength","d":"IslamQA 27261 replies that this is a rule for survival. It is much like Peter's denial being forgiven. The three cases cover peace-making that many would accept. <b>\"War is deceit\"</b> is battle craft, which every army uses. And the base rule is truth: <b>\"truthfulness leads to righteousness\"</b> (Sahih al-Bukhari 6094). False witness is one of the worst sins. No mainstream ruling tells a Muslim to lie to you."},{"t":"How strong is this argument?","d":"Both halves matter. The narrow rule is real, and it differs from the call to truth unto death (Matthew 10:28; Revelation 2:10). But the loud version poisons talk. Know the rule. Never aim it at the person in front of you. To accuse a Sunni friend of it is unfair, unprovable, and ends the friendship."},{"say":true,"t":"What to say","d":"\"I know taqiyya is about persecution, not about lying to me. I am not going to use it that way.\""}],"rewritten":true,"refwhy":{"Titus 1:2":"God 'cannot lie'. The fixed point the Christian side starts from.","Matthew 10:28":"Fear not those who kill the body. Why a Christian is not told to hide his faith under threat.","Revelation 2:10":"'Be thou faithful unto death.' The martyr's calling, set beside permitted concealment.","Ephesians 4:25":"'Speak every man truth with his neighbour.' The everyday rule, not only the martyr's one.","Quran 16:106":"Excuses one forced to deny the faith while his heart is at rest. The real base of the doctrine.","Quran 3:28":"Allows guarding yourself among hostile unbelievers. The word here, tuqah, is the root of taqiyya.","Sahih Muslim 2605":"In Sahih Muslim: the three cases where lying is allowed. War, peace-making, and spouses.","Sahih al-Bukhari 3030":"'War is deceit', in Bukhari. Often stretched far past what it says, which is battle craft.","Jami at-Tirmidhi 1939":"From Tirmidhi, below Bukhari in rank. It carries the same three-case list, which is why both appear."},"titleLong":"Taqiyya: what Islamic deception doctrine actually is — and isn't"},
{"id":"sharia-apostasy-jizya","category":"practice","severity":"high","verdict":"admitted","title":"Death for leaving Islam, in all four schools","claim":"Classical Islamic law prescribes death for leaving Islam: 'Whoever changes his religion, kill him' (Sahih al-Bukhari 6922; compare 6878, which lists apostasy among the three grounds for lawful killing). All four Sunni schools carried the ruling, and it remains law in several states today. Quran 9:29 commands fighting the People of the Book 'until they pay the jizya willingly while they are humbled', establishing the dhimmi system of subordinated tolerance. Hudud punishments include amputation for theft (5:38) and stoning for adultery, from the sunnah (Sahih al-Bukhari 6829; Sahih Muslim 1690). The New Testament contrast is sharp. Faith is uncoerced — 'If anyone hears my words and does not keep them, I do not judge him' (John 12:47) — and the wheat and tares grow together till harvest (Matthew 13:29-30). The sword is renounced for the gospel's spread (Matthew 26:52; John 18:36). And apostates are to be won back, not executed (2 Timothy 2:24-26).","quran":["Quran 9:29","Quran 5:38","Quran 9:5"],"hadith":["Sahih al-Bukhari 6922","Sahih al-Bukhari 6878","Sahih Muslim 1690"],"bible":["John 12:47","John 18:36","Matthew 13:29-30","Matthew 26:52","2 Timothy 2:24-26"],"sources":[{"name":"Sahih al-Bukhari 6922","type":"primary","url":"https://sunnah.com/bukhari:6922"},{"name":"Sahih al-Bukhari 6878","type":"primary","url":"https://sunnah.com/bukhari:6878"},{"name":"Apostasy in Islam (survey of classical rulings and modern state law)","type":"scholarly","url":"https://en.wikipedia.org/wiki/Apostasy_in_Islam"},{"name":"IslamQA 20327 — the ruling on apostasy","type":"muslim","url":"https://islamqa.info/en/answers/20327"}],"response":"Reform-minded Muslim scholars argue from inside the tradition. 'No compulsion in religion' (2:256) is the Quran's own principle, and the Quran itself prescribes no worldly penalty for apostasy. The death penalty rests on hadith, and is best understood historically as punishing treason against the Muslim polity in wartime rather than private belief change — a view advanced by scholars such as Jonathan Brown and Taha Jabir Alalwani, and adopted by some modern states. Jizya was a tax in lieu of military service, often lighter than the zakat Muslims paid, and dhimmi status provided real protection that was unusual for its era. Hudud punishments carry near-impossible evidentiary standards, such as four eyewitnesses to the act, designed to make application rare — deterrence theatre more than practice.","responseSource":{"name":"Jonathan Brown and reformist treatments; IslamQA 20327 (traditional ruling stated plainly)","url":"https://islamqa.info/en/answers/20327"},"rationale":"The provisions themselves are admitted. The apostasy hadith is in Bukhari, all four classical schools carried the ruling, mainstream fatwa sites still affirm it, and roughly a dozen states criminalise apostasy today, several of them capitally. The reformist steelman is genuine scholarship, but it argues against the classical consensus rather than against the sources' existence, and 'no compulsion' must be harmonised by every reformer precisely because the coercive texts are there. The practical stake for evangelism is pastoral, not polemical. This is why your Muslim friend's hesitation is not stubbornness. It is why security and confidentiality for seekers are non-negotiable. And it is why counting the cost (Luke 14:28) is part of sharing the gospel with Muslims.","plain":[{"t":"What classical law says","d":"Leaving Islam carries the death penalty in classical law. <b>\"Whoever changes his religion, kill him\"</b> (Sahih al-Bukhari 6922). Sahih al-Bukhari 6878 lists apostasy among three grounds for lawful killing. All four Sunni schools carried the ruling. It is still law in several states."},{"t":"The other two provisions","d":"Quran 9:29 commands fighting the People of the Book <b>\"until they pay the jizya willingly while they are humbled.\"</b> That set up the <i>dhimmi</i> system, a protected but lowered status. Then there are the <i>hudud</i> penalties. Quran 5:38 sets cutting off the hand for theft. Stoning for adultery comes from the sunnah (Sahih al-Bukhari 6829; Sahih Muslim 1690)."},{"t":"What the New Testament does instead","d":"Faith is not coerced. <b>\"If anyone hears my words and does not keep them, I do not judge him\"</b> (John 12:47). Wheat and weeds grow together until harvest (Matthew 13:29-30). The sword is put away (Matthew 26:52; John 18:36). Those who leave are to be won back gently (2 Timothy 2:24-26)."},{"t":"The Muslim answer, at full strength","d":"Reform-minded scholars answer from inside the tradition. Quran 2:256 says there is no compulsion in religion. The Quran prescribes no worldly penalty for apostasy at all; the death penalty rests on hadith. Jonathan Brown and Taha Jabir Alalwani read it as history. It punished treason in wartime, not private belief. Jizya was a tax in place of army service. It was often lighter than the zakat Muslims paid, and dhimmi status gave real cover for its era. Hudud rules also carry near impossible proof standards, such as four eyewitnesses. That was meant to make them rare."},{"t":"How strong is this argument?","d":"They admit the provisions themselves. The reformist case is genuine scholarship, but it argues against the classical consensus rather than denying the texts. The point here is pastoral, not polemical. This is why your friend's hesitation is not stubbornness. It is why confidentiality for a seeker is not optional. And it is why counting the cost (Luke 14:28) belongs in the conversation."},{"say":true,"t":"What to say","d":"\"If you ever wanted to look into Jesus, what would it cost you? I want to know before we go further.\""}],"rewritten":true,"refwhy":{"John 12:47":"Jesus says he does not judge the one who rejects his words. No penalty in this life.","John 18:36":"'My kingdom is not of this world', so his servants do not fight. The reason there is no sword.","Matthew 13:29-30":"Wheat and weeds grow together till harvest. The sorting is left to God, not to a state.","Matthew 26:52":"'Put up again thy sword.' Said at the one moment force was to hand.","2 Timothy 2:24-26":"Tells God's servant to be gentle and patient with opponents, hoping they turn.","Quran 9:29":"The jizya verse. It commands fighting until the tax is paid, and the dhimmi system rests on it.","Quran 5:38":"Sets cutting off the hand for theft. One of the hudud penalties named in this case.","Quran 9:5":"The sword verse. Included because it is read as the high point of coercion.","Sahih al-Bukhari 6922":"'Whoever changes his religion, kill him.' In Bukhari. The apostasy ruling rests on this.","Sahih al-Bukhari 6878":"In Bukhari: apostasy is one of three grounds on which a Muslim's blood becomes lawful.","Sahih Muslim 1690":"In Sahih Muslim: the stoning penalty carried out. Stoning is not in the Quran, so it rests here."},"titleLong":"Sharia's coercive provisions: death for apostasy, jizya, and hudud punishments"},
