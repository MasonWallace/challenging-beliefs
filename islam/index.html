{"id":"begets-consort-carnal-sonship","category":"doctrine-of-god","severity":"medium","verdict":"contested","title":"Surah 112 denies a sonship Christians never taught","claim":"Surah 112:3 says God 'neither begets nor is born', and Quran 6:101 asks 'How can He have a son when He has no consort?' Both attack divine sonship as though it required a female partner and sexual procreation. But the Nicene Creed of 325 AD, three centuries before the Quran, had already defined the Son as 'begotten, not made' — eternal generation within the one divine essence, explicitly not carnal. Christians agree that God has no consort and no physical offspring. The Quran's rhetorical question therefore lands only against pagan carnal sonship. That is evidence its author knew the pagan Arab concept of Allah's 'daughters' (53:19-21) but not the Christian doctrine it claims to refute.","quran":["Quran 112:1-4","Quran 6:101","Quran 19:88-92","Quran 2:116","Quran 53:19-21"],"hadith":["Sahih al-Bukhari 4974"],"bible":["John 1:14","John 1:18","Hebrews 1:3","Psalm 2:7","Colossians 1:15-17"],"sources":[{"name":"Gabriel Said Reynolds, The Quran and the Bible (on 6:101 and pagan 'daughters of Allah')","type":"scholarly","url":"https://en.wikipedia.org/wiki/Gabriel_Said_Reynolds"},{"name":"Answering Islam — 'The Son of God in the Bible and the Qur'an'","type":"apologetics","url":"https://www.answering-islam.org/Authors/Memsuah/son_of_god_bq.htm"},{"name":"FaithBrowser — 'Can God Have A Son?' (walad/ibn distinction)","type":"muslim","url":"https://www.faithbrowser.com/can-god-have-a-son/"}],"response":"The strongest reply has three parts. First, most of the Quran's sonship denials use walad, meaning biological offspring — precisely the carnal notion. The target is pagan Arabs who gave Allah daughters. The context of 6:100 is Meccan polytheists. It also covers any Christian who slid toward literalism. Second, al-Tabari reads 6:101 as a reductio against pagan genealogy for God. Third, on Muslim analysis 'eternal generation' is itself an incoherent evasion: 'begotten' either means dependency and origination, and so creaturehood, or it is empty honorific language. Either way tawhid stands, and the denial in 19:92 covers every version of sonship.","responseSource":{"name":"FaithBrowser walad/ibn analysis; Tabari on 6:101","url":"https://www.faithbrowser.com/can-god-have-a-son/"},"rationale":"The context-is-pagans defence for 6:101 is textually respectable, and Christians do deny carnal begetting, so the verses may pass each other rather than collide. But Surah 112 and 2:116 are traditionally read against Christians too, and the Quran's only stated argument against divine sonship is the missing consort. It adds only that sonship is unbefitting. It never engages eternal generation, the Christian position for 300 years. The criticism is not that the Quran affirms something false. It is that it argues against the doctrine's crudest counterfeit and declares victory. This stays contested, because a Muslim can claim the denial was meant to cover everything. But that reading makes the consort argument a non sequitur. It would then answer no Christian who actually existed.","plain":[{"t":"What the verses say","d":"Surah 112:3 says God <b>\"neither begets nor is born.\"</b> Quran 6:101 asks how He can have a son when He has no consort. Quran 2:116 and Quran 19:88-92 press the same denial."},{"t":"What Christians actually teach","d":"Christians agree God has no wife and no physical offspring. The Nicene Creed of 325 AD, three centuries before the Quran, calls the Son <b>\"begotten, not made.\"</b> That means eternal generation within the one divine being. It is explicitly not physical."},{"t":"The Muslim answer, at full strength","d":"Most sonship denials use the word <i>walad</i>, which means biological offspring. The audience of Quran 6:100 is pagan Meccans who gave Allah daughters (Quran 53:19-21). Al-Tabari reads 6:101 as an argument against pagan family trees for God. Muslims also argue that eternal generation is empty language. Begotten means either origin, and so a creature, or it means nothing."},{"t":"Where it still bites","d":"Surah 112 and Quran 2:116 have always been read against Christians too. Yet the Quran's only stated argument against divine sonship is the missing consort, plus the claim that it is unbefitting. Eternal generation, the Christian position for 300 years, is never engaged."},{"t":"How strong is this argument?","d":"Genuinely arguable. The criticism is not that the Quran says something false. It is that it argues against the crudest version and stops there. Say it carefully. A Muslim can reply that the denial was meant to cover everything."},{"say":true,"t":"What to say","d":"\"We agree God has no wife. Has anyone ever explained what Christians mean by Son?\""}],"rewritten":true,"refwhy":{"John 1:14":"'The only begotten of the Father', said of the Word made flesh. No mother is in view.","John 1:18":"Calls him the only Son, who is at the Father's side. The sonship actually being denied.","Hebrews 1:3":"Describes the Son as the shining of God's glory and the stamp of His being.","Psalm 2:7":"'Thou art my Son; this day have I begotten thee.' The root of the begotten language.","Colossians 1:15-17":"Says all things were made by him and he is before all things. Not a later product.","Quran 112:1-4":"The short surah Muslims recite most. God 'neither begets nor is born'.","Quran 6:101":"Asks how He can have a son with no consort. That is the one argument this case targets.","Quran 19:88-92":"Says it does not befit the Most Merciful to take a son. The heavens almost split at it.","Quran 2:116":"'They say Allah has taken a son.' The same charge, made again at Medina.","Quran 53:19-21":"Names al-Lat, al-Uzza and Manat. The Muslim reply says these idols are the real target.","Sahih al-Bukhari 4974":"Bukhari's section on Surah 112. It is the sound-collection backing for how Muslims read it."},"titleLong":"'He neither begets nor is born' — refuting a sonship Christians never taught"},
{"id":"god-is-love-monad","category":"doctrine-of-god","severity":"medium","verdict":"contested","title":"'Allah loves those who...' versus 'God is love'","claim":"1 John 4:8 makes love God's essence: 'God is love'. Love is inherently other-directed — lover, beloved, love. The Trinity grounds that eternally, since the Father loves the Son 'before the foundation of the world' (John 17:24). A unitarian monad, by contrast, had no one to love before creation. So either love is not essential to Allah, and he became loving when he made creatures, or he was eternally self-focused. There is a corollary. 'Father' is not among the 99 names, and Allah is never called Father in the Quran. Love in the Quran is predominantly conditional — 'Allah loves those who...' and 'Allah loves not the transgressors' (2:190; 3:31-32) — while 5:18 rebukes Jews and Christians for calling themselves children of Allah.","quran":["Quran 11:90","Quran 85:14","Quran 3:31-32","Quran 2:190","Quran 5:18"],"hadith":["Sahih Muslim 2751a"],"bible":["1 John 4:8-10","John 17:24","Matthew 6:9","Romans 5:8"],"sources":[{"name":"Haddad & Groothuis, 'Allah, The Trinity, and Divine Love' (Christian Research Institute)","type":"apologetics","url":"https://www.equip.org/articles/allah-the-trinity-and-divine-love/"},{"name":"Sam Shamoun, 'The Trinity and God's Attribute of Love'","type":"apologetics","url":"https://www.answeringislam.org/Responses/Osama/zawadi_trinity_love.htm"},{"name":"Abdullah al Andalusi — 'The fallacies of Dr William Lane Craig's argument for the Trinity'","type":"muslim","url":"https://abdullahalandalusi.com/2013/04/02/the-fallacies-of-dr-william-lane-craigs-argument-for-the-trinity/"}],"response":"The reply has three parts. First, al-Wadud, 'the Most Loving', appears twice (11:90; 85:14), so divine love is a real Quranic attribute, and Sahih Muslim 2751a says His mercy prevails over His wrath; the claim that Islam's God lacks love is simply false. Second, Abdullah al Andalusi's rebuttal to William Lane Craig: an attribute can be eternal as a disposition without being eternally exercised. Allah is eternally al-Khaliq, Creator, without an eternal creation, so likewise eternally loving without an eternal beloved. Demanding eternal actualisation proves too much, since it would require an eternal object of mercy and wrath as well. Third, Bassam Zawadi and al Andalusi argue that Craig's definition of perfect love as self-giving to another person begs the question in favour of Trinitarianism.","responseSource":{"name":"Abdullah al Andalusi vs. Craig; Bassam Zawadi","url":"https://abdullahalandalusi.com/2013/04/02/the-fallacies-of-dr-william-lane-craigs-argument-for-the-trinity/"},"rationale":"This is philosophical theology, not documentary fact, and both sides have live moves. The Christian argument has real force. In the Quran love is never predicated of God's essence — 'Allah is love' appears nowhere — it is characteristically conditional on obedience (3:31), and 'Father', the Bible's central relational name, is absent and its use denied (5:18). But the disposition-versus-actualisation distinction is a serious answer that Craig's argument must work to defeat. The honest grade splits the claim. The comparative textual point holds: the Bible makes love essential and eternally actual in a way the Quran does not. The philosophical point, that a monad cannot be perfectly loving, is contested.","plain":[{"t":"The claim","d":"1 John 4:8 says God <i>is</i> love. Not only that He loves. Love is His nature. But love needs someone to love. The Trinity grounds that: the Father loved the Son <b>\"before the foundation of the world\"</b> (John 17:24)."},{"t":"The question it raises","d":"A solitary God had no one to love before creation. So either love is not part of His nature, or He was turned in on Himself. The Quran calls God <i>al-Wadud</i>, the Loving, twice (Quran 11:90; 85:14). It never says God is love. His love is mostly conditional — <b>\"Allah loves those who...\"</b> and <b>\"Allah loves not the transgressors\"</b> (2:190; 3:31-32). Quran 5:18 rebukes Jews and Christians for calling themselves children of Allah. Father is not among the 99 names."},{"t":"The Muslim answer, at full strength","d":"Abdullah al Andalusi answers William Lane Craig directly, and the answer is good. An attribute can be eternal as a disposition without being exercised. Allah is eternally <i>al-Khaliq</i>, the Creator, without an eternal creation. So He can be eternally loving without an eternal beloved. Otherwise you would need an eternal object of mercy and wrath too. Bassam Zawadi adds that Craig defines perfect love in a way that assumes his conclusion. Sahih Muslim 2751a says Allah's mercy prevails over His wrath."},{"t":"Where each side lands","d":"Two claims are tangled together here. One is about the texts, and it holds. The Bible makes love essential; the Quran does not. The other is philosophical, and it is genuinely open — whether a solitary God can be perfectly loving."},{"t":"How strong is this argument?","d":"Half strong, half arguable, and say which half. Lead with the texts, not the philosophy. Notice too that this is about the deepest thing a person wants to know. Ask it as a real question."},{"say":true,"t":"What to say","d":"\"Before God made anything at all, who was there for him to love?\""}],"rewritten":true,"refwhy":{"1 John 4:8-10":"'God is love.' The whole case rests on this, and on the Son being sent to show it.","John 17:24":"Jesus speaks of the Father loving him 'before the foundation of the world'. Love before creation.","Matthew 6:9":"'Our Father.' The name Jesus teaches, and the one not found among the 99 names.","Romans 5:8":"Says God showed love while we were still sinners. Love that waits on nothing we do.","Quran 11:90":"One of two places God is called al-Wadud, the Loving. The Muslim reply starts here.","Quran 85:14":"The other al-Wadud verse. Two is the entire count, which is the point being made.","Quran 3:31-32":"'Allah loves those who...' Love tied to following the Messenger. The pattern is conditional.","Quran 2:190":"Ends by saying Allah loves not those who go too far. The same pattern, stated the other way.","Quran 5:18":"Rebukes Jews and Christians for calling themselves children of Allah. It shuts the door on Father.","Sahih Muslim 2751a":"From Sahih Muslim, the other top collection. God's mercy runs ahead of His wrath."},"titleLong":"Can a monad be love? Al-Wadud vs. 'God IS love'"},
{"id":"best-of-deceivers","category":"doctrine-of-god","severity":"medium","verdict":"contested","title":"'Best of planners': the Arabic root means scheming","claim":"Quran 3:54 and 8:30 call Allah khayru al-makirin. The root m-k-r denotes scheming, guile and deception in the classical Arabic lexicons Lane and Lisan al-Arab. Quran 3:54 sits in exactly the crucifixion context: Allah's makr answers the makr of others, and 4:157's 'it was made to appear so to them' is the payoff — a mass deception that produced what Islam calls Christianity's central error. The Bible asserts the opposite of God: he 'cannot lie' (Titus 1:2; Numbers 23:19; Hebrews 6:18). If the biggest deception in salvation history, a faked crucifixion, is Allah's own makr, then the character of Islam's God differs fundamentally from the Bible's.","quran":["Quran 3:54","Quran 8:30","Quran 7:99","Quran 4:157","Quran 10:21"],"hadith":[],"bible":["Titus 1:2","Numbers 23:19","Hebrews 6:18"],"sources":[{"name":"WikiIslam — 'Allah, the Best Deceiver (Quran 3:54)' — lexical survey","type":"journalism","url":"https://wikiislam.net/wiki/Allah,_the_Best_Deceiver_(Qur%27an_3:54)"},{"name":"David Wood — 'Is Allah the Best of Deceivers?'","type":"apologetics","url":"http://www.answeringmuslims.com/2014/03/is-allah-best-of-deceivers.html"},{"name":"Islamweb Fatwa 295183 — 'Refuting the allegation that Allah deceives people'","type":"muslim","url":"https://www.islamweb.net/en/fatwa/295183/"}],"response":"Islamweb fatwa 295183, and treatments citing Jamal Badawi, answer on three fronts. First, makr means a hidden stratagem and is morally neutral in itself; its value depends on its object. Allah's makr is always retributive, out-planning plotters to protect the innocent — here, saving Jesus from murder. So 'best of planners' is ethics, not euphemism. Second, Quranic usage of makr for Allah is always responsive to human makr (3:54; 8:30; 10:21), never initiated against the sincere. Third, there is a tu quoque with teeth: the Bible has God sending 'a lying spirit' (1 Kings 22:22-23), 'a strong delusion so they believe the lie' (2 Thessalonians 2:11), and deceiving prophets (Ezekiel 14:9). If makr indicts Allah, those indict Yahweh.","responseSource":{"name":"Islamweb fatwa 295183; Discover The Truth response citing Badawi","url":"https://www.islamweb.net/en/fatwa/295183/"},"rationale":"Lexically the critics are on firm ground. Makr is consistently negative of humans in the Quran itself, including 'evil makr' in 35:43, and sanitised translations like 'best of planners' are apologetically motivated. But the theological indictment is weaker than the lexical point. Retributive counter-scheming is defensible divine behaviour, and the biblical counter-texts show that Christians must themselves distinguish judicial deception of the wicked from essential untruthfulness. Where the argument keeps its bite is 4:157. On mainstream tafsir, Allah's stratagem produced a false appearance that deceived Jesus's own sincere followers, founding six centuries of what Islam calls error. That is a judicial deception of the sincere, which the biblical parallels do not match. It is strongest as a companion to the crucifixion-denial entry.","plain":[{"t":"The phrase","d":"Quran 3:54 and Quran 8:30 call Allah <i>khayru al-makirin</i>. It is usually translated \"best of planners.\" The root <i>m-k-r</i> carries scheming and guile in the classical lexicons Lane and Lisan al-Arab."},{"t":"Why Christians raise it","d":"Quran 3:54 sits in the crucifixion passage. Allah's <i>makr</i> answers the plotting of others. Quran 4:157 gives the result: it was made to appear so to them. Scripture says the opposite of God — He <b>\"cannot lie\"</b> (Titus 1:2; Numbers 23:19; Hebrews 6:18)."},{"t":"The Muslim answer, at full strength","d":"Islamweb fatwa 295183 answers on three fronts. <i>Makr</i> means a hidden stratagem, neutral in itself, judged by its target. Allah's is always a response to human plotting (3:54; 8:30; 10:21) and never aimed at the sincere. And the Bible has hard parallels. A lying spirit is sent in 1 Kings 22:22-23. A strong delusion is sent in 2 Thessalonians 2:11. A prophet is deceived in Ezekiel 14:9."},{"t":"Where it lands","d":"On the word itself, critics are right. The Quran uses <i>makr</i> of humans negatively, including evil <i>makr</i> in 35:43. Softened translations do hide that. But counter-scheming against plotters is defensible, and the biblical texts show Christians must draw the same distinctions."},{"t":"How strong is this argument?","d":"Weak alone, useful beside the crucifixion case. Do not say \"Allah is a deceiver\" — that is unfair to how Arabic works. The narrow point is Quran 4:157. On the mainstream reading, the ones deceived were sincere disciples."},{"say":true,"t":"What to say","d":"\"May I ask how you read Quran 4:157 — who was it that the appearance deceived?\""}],"rewritten":true,"refwhy":{"Titus 1:2":"Says God 'cannot lie'. This is the contrast the case draws.","Numbers 23:19":"'God is not a man, that he should lie.' The older half of the same point.","Hebrews 6:18":"Calls it impossible for God to lie. The case names all three of these together.","Quran 3:54":"Where Allah is called khayru al-makirin. It sits in the passage about the plot on Jesus.","Quran 8:30":"The second place the phrase is used, about the plot on Muhammad.","Quran 7:99":"Warns that no one is safe from Allah's makr. The same word, aimed at people.","Quran 4:157":"The 'made to appear so to them' verse. This case only bites when joined to it.","Quran 10:21":"Cuts against you. The reply uses it: Allah's scheme answers the scheming of people."},"titleLong":"Allah as khayru al-makirin — 'best of deceivers'?"},
{"id":"word-and-spirit-titles","category":"jesus-cross","severity":"medium","verdict":"contested","title":"The Quran gives Jesus titles Muhammad never gets","claim":"Quran 4:171 calls Jesus 'the Messenger of Allah and His Word (kalimatuhu) which He cast to Mary, and a Spirit from Him (ruhun minhu).' These titles are given to no other figure in the Quran, not even to Muhammad. Sahih al-Bukhari 3286 adds that every newborn is touched by Satan except Mary and her son. So the Quran's own Christology keeps gesturing above prophet-rank. Word, Spirit, sinless, virgin-born, alive in heaven, returning. It echoes the language of John 1, where the Word became flesh, in the very act of denying what John says about him.","quran":["Quran 4:171","Quran 3:45-49","Quran 19:19","Quran 21:91","Quran 3:55","Quran 43:61"],"hadith":["Sahih al-Bukhari 3435","Sahih al-Bukhari 3286"],"bible":["John 1:1-3","John 1:14","Hebrews 4:15","Luke 1:35"],"sources":[{"name":"Sam Shamoun — 'The Quran on Jesus as the Preexistent Spirit of Allah'","type":"apologetics","url":"https://answering-islam.org/Shamoun/jesus_spirit.htm"},{"name":"QuranX — classical tafsir on 4:171 (Ibn Kathir, Jalalayn, Maududi)","type":"muslim","url":"https://quranx.com/tafsirs/4.171"},{"name":"Gabriel Said Reynolds, The Quran and the Bible (on the Christian resonance of kalima)","type":"scholarly","url":"https://en.wikipedia.org/wiki/Gabriel_Said_Reynolds"}],"response":"The strongest reply comes from the tafsir tradition itself, in Ibn Kathir, Jalalayn and Maududi. 'His Word' means that Jesus was created by Allah's word 'Be', kun. Quran 3:59 makes this explicit and levels him with Adam, who had neither father nor mother. A miraculous origin proves creaturehood, not divinity. 'A spirit from Him' uses the preposition min, which marks origin rather than shared being; Quran 45:13 uses 'from Him' of everything. The titles sit under the verse's own stated ceiling: 'the Messiah is only a messenger... do not say Three.' On this reading the verse borrows Christian vocabulary precisely in order to deflate it.","responseSource":{"name":"Ibn Kathir and Jalalayn on 4:171; Maududi, Tafhim","url":"https://quranx.com/tafsirs/4.171"},"rationale":"The Muslim reading is internally coherent, and Quran 3:59 supplies the Quran's own gloss. But it under-explains the data. Everything is created by 'Be' (2:117), yet only Jesus is called 'His Word'. The Adam parallel also cuts against the no-consort argument of 6:101, since a miraculous fatherless origin is apparently fine when Allah wills it. And the cumulative profile is one the Quran never paints of Muhammad. What the Quran inherits here is Johannine vocabulary, the Logos, stripped of the theology that produced it. That is what borrowing from a Christian setting without its doctrinal grammar looks like. There is no formal contradiction, but there is a standing tension resolved only by stipulation.","plain":[{"t":"The titles in one verse","d":"Quran 4:171 calls Jesus <b>\"the Messenger of Allah and His Word (kalimatuhu) which He cast to Mary, and a Spirit from Him (ruhun minhu).\"</b> No other figure in the Quran gets these titles. Not even Muhammad."},{"t":"What sits beside them","d":"Sahih al-Bukhari 3286 says every newborn is touched by Satan. It names two exceptions: Mary and her son. Add the rest — sinless, virgin-born, alive in heaven, returning at the end. The picture keeps rising above prophet-rank."},{"t":"The tension inside the verse","d":"The whole purpose of 4:171 is to deny that Jesus is divine. It ends: the Messiah is only a messenger, so do not say Three. Yet it uses the vocabulary of John 1, where the Word became flesh."},{"t":"The Muslim answer, at full strength","d":"This comes from the tafsir tradition itself. Ibn Kathir, Jalalayn and Maududi all explain it. <i>His Word</i> means Jesus was created by the word <i>kun</i>, Be. Quran 3:59 says exactly that and levels him with Adam. <i>A spirit from Him</i> uses <i>min</i>, which marks origin, not shared being. Quran 45:13 says everything is from Him. So the titles are honours inside the verse's own ceiling."},{"t":"How strong is this argument?","d":"Genuinely arguable, and better as a question than a claim. Everything is created by <i>Be</i> (Quran 2:117). Only Jesus is called His Word. There is no formal contradiction here. There is a real tension, and it is worth asking about."},{"say":true,"t":"What to say","d":"\"Everything was made by God saying Be. Why is only Jesus called God's Word?\""}],"rewritten":true,"refwhy":{"John 1:1-3":"The Word who was with God and was God. This is the language Quran 4:171 borrows.","John 1:14":"'The Word was made flesh.' What John means by the title the Quran also gives Jesus.","Hebrews 4:15":"Says he was tempted yet did not sin. Read it beside the hadith on Satan and the newborn.","Luke 1:35":"The Spirit comes on Mary and the child is called holy. The Gospel form of 'a Spirit from Him'.","Quran 4:171":"Holds both titles: His Word cast to Mary, and a Spirit from Him. The heart of this case.","Quran 3:45-49":"Adds the Messiah title and the miracles. More of the profile being collected here.","Quran 19:19":"'A pure boy.' The sinlessness that belongs in the same picture.","Quran 21:91":"Says God breathed into Mary of His Spirit. The second Spirit verse about Jesus.","Quran 3:55":"Says Allah will take Jesus and raise him, and set his followers above those who reject him.","Quran 43:61":"Calls him knowledge of the Hour. He is a sign that the last day is near.","Sahih al-Bukhari 3435":"A sound Bukhari hadith. It repeats the Word and Spirit titles inside a creed a Muslim holds.","Sahih al-Bukhari 3286":"In Bukhari: Satan touches every newborn but Mary and her son. Muslims accept it as sound."},"titleLong":"'His Word and a Spirit from Him' — the Quran's uniquely exalted Jesus"},
{"id":"clay-birds-apocrypha","category":"quran-text","severity":"high","verdict":"unrefuted","featured":true,"title":"Clay birds, from a gospel the church rejected","claim":"The Quran's two signature Jesus miracles are absent from the canonical gospels, and both have documented literary ancestors in Christian apocrypha. The child Jesus forming birds from clay and breathing life into them (3:49; 5:110) parallels the Infancy Gospel of Thomas 2:1-5, a Greek text of the mid-2nd century — a legend cycle in which the boy Jesus also strikes playmates dead. Jesus speaking from the cradle (19:29-33; 3:46) parallels the Arabic Infancy Gospel, a Syriac-derived compilation of the 5th or 6th century, where the infant says 'I am the Son of God'. Both texts predate the Quran by centuries and circulated in Syriac and Arabic Christian settings. So the Quran presents legendary material composed 100 to 500 years after Jesus as historical revelation. That is exactly what a 7th-century author absorbing local Christian folklore would produce.","quran":["Quran 3:46","Quran 3:49","Quran 5:110","Quran 19:29-33","Quran 25:4-5"],"hadith":[],"bible":["John 2:11","Luke 2:52","John 20:30-31"],"sources":[{"name":"Austin DeArmond — 'Jesus, the Clay Birds, and the Quran' (survey of the IGT dependence)","type":"scholarly","url":"https://austind90.org/wp-content/uploads/2011/05/infancy-gospel-of-thomas-and-the-quran.pdf"},{"name":"Gabriel Said Reynolds, The Quran and the Bible (concedes the apocryphal parallels)","type":"scholarly","url":"https://en.wikipedia.org/wiki/Gabriel_Said_Reynolds"},{"name":"Infancy Gospel of Thomas — dating and transmission","type":"scholarly","url":"https://en.wikipedia.org/wiki/Infancy_Gospel_of_Thomas"},{"name":"Islamweb Fatwa 367270 — 'Quran does not use stories from any past Books'","type":"muslim","url":"https://www.islamweb.net/en/fatwa/367270/"}],"response":"Islamweb fatwa 367270 answers on three fronts. First, a parallel is not dependence. A shared story may mean the apocryphon preserved a genuine event the canonical gospels omitted, since John 21:25 admits Jesus did many unrecorded things. The Quran, as revelation, confirms the true kernel and corrects the legend's distortions — adding 'by Allah's leave' to guard tawhid and dropping the morally troubling elements. Second, the direction of correction is telling, since random borrowing would not sanitise. Third, some Muslim writers embrace the parallel as vindication: an unlettered Meccan trader could not have accessed Greek or Syriac apocrypha, so agreement with ancient Christian tradition is evidence of revelation.","responseSource":{"name":"Islamweb fatwa 367270","url":"https://www.islamweb.net/en/fatwa/367270/"},"rationale":"All parties concede the parallels. Only the direction is debated. The 'apocrypha preserved real events' defence cannot be falsified and carries no evidence: no historian treats the Infancy Gospel of Thomas or the Arabic Infancy Gospel as history. The cradle speech even carries its source's fingerprint. In the Arabic Infancy Gospel the infant says 'I am the Son of God'; in the Quran the same scene is repurposed to say the opposite. The 'unlettered trader' argument fails on the texts' known circulation in Syriac Christian Arabia and on oral transmission. The Quran itself records the accusation that Muhammad heard 'tales of the ancients dictated morning and evening' (25:4-5). Mainstream scholarship's sober conclusion stands: the Quran retells late Christian folklore as fact.","plain":[{"t":"Two miracles that are not in the Gospels","d":"The Quran gives Jesus two famous miracles the Gospels never mention. As a child he forms birds from clay and breathes life into them (Quran 3:49; 5:110). As a baby he speaks from the cradle (Quran 19:29-33; 3:46)."},{"t":"Where those stories come from","d":"The clay birds appear in the Infancy Gospel of Thomas 2:1-5. That is a Greek text from the mid-2nd century. In the same book the boy Jesus also strikes playmates dead. The cradle speech appears in the Arabic Infancy Gospel, a Syriac-derived work of the 5th or 6th century. Both circulated in Christian Arabia. Both are centuries older than the Quran."},{"t":"What the church did with them","d":"The church rejected these books as legend. They are not Scripture and never were. So the question is not whether Christians accept them. It is why they appear in the Quran as history."},{"t":"The Muslim answer, at full strength","d":"Islamweb fatwa 367270 answers on three fronts. A parallel is not proof of borrowing. The apocryphon may preserve a real event the Gospels left out, since John 21:25 says much went unrecorded. Revelation then confirms the true kernel and strips the legend — adding <i>by Allah's leave</i>, dropping the ugly parts. Some Muslim writers go further. An unlettered Meccan trader could not read Greek or Syriac, so the agreement itself looks like revelation."},{"t":"How strong is this argument?","d":"Strong for you. Everyone agrees the parallels are real; only the direction is argued. No historian treats these books as history. And the cradle scene carries its source's fingerprint. In the Arabic Infancy Gospel the child says he is the Son of God. In the Quran the same scene says the opposite. The Quran itself records the charge that Muhammad heard <b>\"tales of the ancients dictated morning and evening\"</b> (25:4-5)."},{"say":true,"t":"What to say","d":"\"That story about the clay birds is in a book my church rejected as legend. Where do you think it came from?\""}],"rewritten":true,"refwhy":{"John 2:11":"Calls the wine at Cana the first of his signs. So the Gospels have no childhood miracle.","Luke 2:52":"Nearly all the Gospels say of his boyhood. He grew in wisdom and in stature.","John 20:30-31":"Says many signs were not written down. The Muslim reply opens here, so know it first.","Quran 3:46":"The cradle speech. He speaks to people while still an infant.","Quran 3:49":"The clay birds, given life by Allah's leave. This is the case's main example.","Quran 5:110":"Tells the clay bird story a second time, later in the Quran.","Quran 19:29-33":"The full cradle scene, where the infant calls himself a servant of Allah.","Quran 25:4-5":"The Quran's own record of the charge: he heard 'tales of the ancients'. Quoted in the case."},"titleLong":"The cradle speech and the clay birds: apocrypha as history"},
{"id":"son-of-god-divine-claims","category":"jesus-cross","severity":"high","verdict":"contested","title":"They sought to kill Jesus for calling God Father","claim":"The Quran attacks a 'Son of God' its opponents never held, meaning physical offspring, while the actual biblical claim goes unaddressed. 'Son of God' is a royal and divine title (Psalm 2:7), and in Jesus's usage it asserted equality with God. John 5:18 says the Jews sought to kill him because 'he was even calling God his own Father, making himself equal with God'. Consider his own claims. 'Before Abraham was, I am' (John 8:58), met with an attempted stoning. Mark 14:61-64: 'I am, and you will see the Son of Man seated at the right hand of Power and coming with the clouds of heaven' — the language of Daniel 7 — ruled capital blasphemy. John 20:28: Thomas says 'My Lord and my God', and is blessed, not rebuked. Every one of these texts exists in manuscripts predating Islam by 200 to 450 years — P66 and P75 from about 200 AD, Sinaiticus and Vaticanus from the 4th century. Whatever one thinks of their truth, the claims demonstrably predate the Quran's denial of them.","quran":["Quran 9:30","Quran 5:17","Quran 5:72","Quran 19:88-92","Quran 4:171"],"hadith":["Sahih al-Bukhari 3445"],"bible":["Psalm 2:7","John 5:18","John 8:58-59","John 10:30-33","Mark 14:61-64","John 20:28-29","Philippians 2:6-11","Daniel 7:13-14"],"sources":[{"name":"Answering Islam — 'The Son of God in the Bible and the Qur'an'","type":"apologetics","url":"https://www.answering-islam.org/Authors/Memsuah/son_of_god_bq.htm"},{"name":"Sam Shamoun — 'An Examination of John 1:1, 8:58 and Colossians 2:9'","type":"apologetics","url":"https://www.answering-islam.org/Shamoun/christology.htm"},{"name":"Islam Reigns — 'Refuting the Divinity of Jesus: Analysis of John 8:58'","type":"muslim","url":"https://islamreigns.wordpress.com/2017/04/05/refuting-the-divinity-of-jesus-analysis-of-john-858-before-abraham-was-i-am/"}],"response":"The strongest reply, argued by Shabir Ally and Bassam Zawadi, has five parts. First, 'Son of God' is demonstrably metaphorical throughout the Bible — Adam (Luke 3:38), Israel (Exodus 4:22), David at his coronation (Psalm 2:7), peacemakers (Matthew 5:9). Second, John 8:58's ego eimi is not the divine name: the Greek Exodus 3:14 renders the name as ho on, and the healed blind man says ego eimi in John 9:9. Third, the strongest claims cluster in John, the latest gospel, reflecting developed church theology — the Synoptic Jesus prays, calls the Father 'the only true God' (John 17:3), and disclaims omniscience (Mark 13:32). Fourth, Mark 14:62's exaltation claim is one a Jewish agent of God could make, and blasphemy verdicts were elastic. Fifth, Jesus never says 'I am God; worship me.'","responseSource":{"name":"Islam Reigns analysis of John 8:58; Shabir Ally debates","url":"https://islamreigns.wordpress.com/2017/04/05/refuting-the-divinity-of-jesus-analysis-of-john-858-before-abraham-was-i-am/"},"rationale":"The historical-critical retreat, that John is late theology, is a real argument with academic support. But it is Pyrrhic for a Muslim. It concedes that the gospels say what Christians say they say, and it rescues Islam only by adopting a source-critical scepticism the Quran never licenses — since the Quran tells Christians to judge by their Gospel (5:47). The narrower rebuttals are weak. The ego-eimi deflation ignores the immediate stoning attempt (8:59) and the absolute construction. The Mark 14 deflation must explain a capital blasphemy verdict. John 20:28 has no deflationary reading, since 'my Lord and my God' is addressed to Jesus, who blesses rather than corrects. And the manuscript point is untouched: the divine claims predate Islam in surviving physical copies. Contested, but leaning heavily against the Muslim position on the documentary question.","plain":[{"t":"What the Quran argues against","d":"The Quran rejects a Son of God who is physical offspring (Quran 9:30; 5:17; 5:72; 19:88-92; 4:171). No Christian has ever taught that. So the actual claim is left standing, unaddressed."},{"t":"What the claim actually is","d":"<b>\"Son of God\"</b> is a royal and divine title (Psalm 2:7). In Jesus's mouth it meant equality with God. John 5:18 says the Jews sought to kill him because <b>\"he was even calling God his own Father, making himself equal with God.\"</b>"},{"t":"The words that got him killed","d":"John 8:58: <b>\"Before Abraham was, I am.\"</b> They picked up stones. Mark 14:61-64: he says he is, and that they will see the Son of Man <b>\"seated at the right hand of Power and coming with the clouds of heaven\"</b> — the language of Daniel 7. That was ruled blasphemy worth death. John 20:28: Thomas says <b>\"My Lord and my God,\"</b> and Jesus blesses him rather than correcting him."},{"t":"The Muslim answer, at full strength","d":"Shabir Ally and Bassam Zawadi answer well. Son of God is used loosely all through the Bible — of Adam (Luke 3:38), Israel (Exodus 4:22), David (Psalm 2:7), peacemakers (Matthew 5:9). John 8:58's <i>ego eimi</i> is not the divine name. The Greek Exodus 3:14 has <i>ho on</i>. And the healed blind man says <i>ego eimi</i> in John 9:9. The strongest claims cluster in John, the latest gospel. And Jesus never says: I am God, worship me."},{"t":"How strong is this argument?","d":"Strong for you on the documents, and honest about the rest. The \"John is late\" move is real scholarship, but it costs a Muslim dearly. It concedes that the Gospels say what Christians say they say. And every one of these texts survives in copies from 200 to 450 years before Islam — P66 and P75 from about 200 AD, Sinaiticus and Vaticanus from the 4th century."},{"say":true,"t":"What to say","d":"\"Why was Jesus charged with blasphemy, if he never claimed anything more than being a prophet?\""}],"rewritten":true,"refwhy":{"Psalm 2:7":"'Thou art my Son', said to a king. Both sides use it. It shows the title is royal, not physical.","John 5:18":"Gives John's own reason they wanted him dead. He was 'making himself equal with God'.","John 8:58-59":"'Before Abraham was, I am.' They pick up stones at once. The reaction is the evidence.","John 10:30-33":"'I and my Father are one.' They charge him with making himself God. The same pattern.","Mark 14:61-64":"The trial. He takes the title and uses the words of Daniel 7. It is judged worth death.","John 20:28-29":"Thomas says 'My Lord and my God'. Jesus blesses him. No correction is offered.","Philippians 2:6-11":"An early hymn Paul quotes. He was in the form of God, and took a servant's place.","Daniel 7:13-14":"The son of man comes with clouds and is given rule over all. The words used at the trial.","Quran 9:30":"Says Christians call the Messiah the son of Allah. The charge, in the Quran's own words.","Quran 5:17":"Says those who call the Messiah God have rejected faith. One verse the case answers.","Quran 5:72":"The same charge, with the warning of the Fire. It shows how much rests on the point.","Quran 19:88-92":"Says the Most Merciful takes no son, and the claim nearly tears the heavens.","Quran 4:171":"Sets the ceiling: the Messiah is only a messenger, and do not say Three.","Sahih al-Bukhari 3445":"In Bukhari: do not praise me as the Christians praised the son of Mary. Muhammad calls himself a slave."},"titleLong":"What 'Son of God' meant — and the divine claims the Quran never addresses"},
{"id":"quran-never-quotes-scriptures","category":"quran-text","severity":"high","verdict":"unrefuted","title":"6,236 verses, one loose quotation of the Bible","claim":"The Quran claims to confirm, musaddiq, the Torah and Gospel (2:97; 3:3; 5:48; 46:12). Yet in 6,236 verses it contains essentially no verbatim quotation of the texts it confirms. The single near-exception is 21:105: 'We wrote in the Zabur... My righteous servants shall inherit the earth', which corresponds to Psalm 37:29. Its biblical narratives arrive garbled through midrash and apocrypha — Cain's raven from Pirke de-Rabbi Eliezer (5:31), Abraham in the fiery furnace from midrash (21:68-69), Mary confused with Miriam sister of Aaron (19:28). Contrast the New Testament, which quotes the Old Testament about 300 times, explicitly. That is what confirming previous scripture looks like. Sidney Griffith's scholarship confirms that no written Arabic Bible existed before Islam. The Quran's biblical knowledge is oral and homiletic, which fits Muhammad's documented contacts — Waraqa ibn Nawfal, Khadija's Christian cousin, who 'used to write the Gospel in Arabic' (Sahih al-Bukhari 3) — and the accusation recorded in 25:4-5.","quran":["Quran 3:3","Quran 5:48","Quran 21:105","Quran 25:4-5","Quran 19:28","Quran 5:31","Quran 7:157"],"hadith":["Sahih al-Bukhari 3"],"bible":["Psalm 37:29","Matthew 5:17","Luke 24:44"],"sources":[{"name":"Sidney Griffith, The Bible in Arabic (Princeton, 2013)","type":"scholarly","url":"https://press.princeton.edu/books/paperback/9780691168081/the-bible-in-arabic"},{"name":"William Campbell — 'What the Qur'an Says About the Bible'","type":"apologetics","url":"https://www.answering-islam.org/Campbell/s2c1.html"},{"name":"Zabur — the 21:105/Psalm 37:29 correspondence","type":"scholarly","url":"https://en.wikipedia.org/wiki/Zabur"},{"name":"Islamweb Fatwa 367270","type":"muslim","url":"https://www.islamweb.net/en/fatwa/367270/"}],"response":"Islamweb fatwa 367270 and Ibn Kathir on 3:3 answer in four parts. First, the Quran is not a commentary but a fresh revelation from the same source. Musaddiq means it confirms the previous revelations' divine origin and core message — tawhid, judgment, the prophets — not their surviving letter, so quotation is neither promised nor needed. Second, it does engage biblical content: 21:105 quotes the Psalms by name and gets it right, 7:157 says Muhammad is 'written with them in the Torah and the Gospel', and 48:29 paraphrases the seed parable as 'its likeness in the Gospel'. Third, arguing from silence is weak, since the audience was largely pagan Meccans and extended quotation of texts unavailable in Arabic would serve no purpose. Fourth, retelling with variation is the Quran's stated method (12:3), so divergence from midrash-contaminated tellings is correction, not error.","responseSource":{"name":"Islamweb fatwa 367270; Ibn Kathir on musaddiq (3:3)","url":"https://www.islamweb.net/en/fatwa/367270/"},"rationale":"The core datum is undisputed. There are no verbatim quotations of Torah or Gospel text in the entire Quran, and one loose Psalm citation. The responses explain why that might be acceptable; none disputes that it is so. And the explanations strain against the Quran's own posture. It stakes its authenticity on continuity with prior scripture (10:94; 5:47), yet shows no direct acquaintance with either text, while showing detailed acquaintance with post-biblical legend. The 7:157 counter-example sharpens the problem: the Quran asserts that Muhammad is written in books it never quotes, and fourteen centuries of apologetics has not produced the passage. Griffith's finding is the naturalistic explanation sitting in plain sight.","plain":[{"t":"The claim and the gap","d":"The Quran says it confirms the Torah and the Gospel (Quran 2:97; 3:3; 5:48; 46:12). Across 6,236 verses, it never quotes them. There is no place where it cites a line of Isaiah or Matthew and says: this is what I confirm."},{"t":"The one near-exception","d":"Quran 21:105 says <b>\"We wrote in the Zabur... My righteous servants shall inherit the earth.\"</b> That matches Psalm 37:29. It is one loose citation, and it is the only one."},{"t":"What it does contain instead","d":"Biblical stories arrive through later Jewish and Christian retellings. Cain's raven comes from Pirke de-Rabbi Eliezer (Quran 5:31). Abraham in the furnace comes from midrash (21:68-69). Mary is given Miriam's family (19:28). Compare the New Testament, which quotes the Old Testament about 300 times, by name."},{"t":"The Muslim answer, at full strength","d":"Islamweb fatwa 367270 and Ibn Kathir on 3:3 answer this. The Quran is fresh revelation, not a commentary. <i>Musaddiq</i> means it confirms the divine origin and core message of the earlier books, not their surviving letter. It does engage them. Quran 21:105 names the Psalms and gets it right. Quran 7:157 says Muhammad is written in the Torah and Gospel. Quran 48:29 points to a parable in the Gospel. The audience was largely pagan Meccans, and no written Arabic Bible existed to quote."},{"t":"How strong is this argument?","d":"Strong for you. Nobody disputes the fact; the replies only explain it. Sidney Griffith's work confirms there was no Arabic Bible before Islam, so the knowledge was oral and preached. Sahih al-Bukhari 3 names Waraqa ibn Nawfal, Khadija's Christian cousin, who <b>\"used to write the Gospel in Arabic.\"</b> And Quran 7:157 sharpens it: fourteen centuries on, nobody has produced the passage."},{"say":true,"t":"What to say","d":"\"Your book says it confirms mine. Could you show me one line of mine that it quotes?\""}],"rewritten":true,"refwhy":{"Psalm 37:29":"The one place the Quran comes close to quoting the Bible. Quran 21:105 matches this line.","Matthew 5:17":"Jesus names the law and the prophets and says he came to fulfil them. Direct engagement.","Luke 24:44":"Jesus points to Moses, the prophets and the psalms about himself. Again, he uses the text.","Quran 3:3":"Says the Quran confirms the Torah and Gospel. This is the claim being tested.","Quran 5:48":"A second confirming verse. It calls the Quran a watcher over the books before it.","Quran 21:105":"'My righteous servants shall inherit the earth', said to be in the Zabur. The one near-quotation.","Quran 25:4-5":"Records the charge made against Muhammad: old tales, dictated to him morning and evening.","Quran 19:28":"Calls Mary 'sister of Aaron'. Offered as a sign the stories came by ear, not from a text.","Quran 5:31":"The raven that teaches Cain to bury his brother. That comes from later Jewish tales, not Genesis.","Quran 7:157":"Says the Prophet is written with them in the Torah and Gospel. No one has found that line.","Sahih al-Bukhari 3":"In Bukhari. Waraqa was the Christian cousin of Khadija. He 'used to write the Gospel in Arabic'."},"titleLong":"Confirming scriptures it never quotes"},
{"id":"injil-problem","category":"quran-text","severity":"high","verdict":"unrefuted","featured":true,"title":"The Injil: no manuscript, no fragment, no quotation","claim":"The Quran speaks of 'the Injil' as a single book Allah gave to Jesus (5:46; 57:27), which mainstream Islam says was later lost or corrupted, leaving the four gospels as unreliable human residue. There are two problems. First, no trace of any such book exists — no manuscript, no fragment, no citation by any ancient author, friend or enemy, in the seven centuries between Jesus and Muhammad. From the earliest records 'gospel', euangelion, was the proclamation about Jesus, and the written gospels are biographies about him. That is a category the Quran appears to misunderstand. Second, the Quran forecloses the lost-book escape itself. Quran 5:47 commands 'let the People of the Gospel judge by what Allah has revealed in it' — a present-tense command in 610 to 632 AD, presupposing an Injil then in Christian hands. Demonstrably that was the four gospels, complete in 4th-century codices. Either those gospels were trustworthy, and Islam's Christology is falsified by them, or they were corrupt, and Allah commanded people to judge by a corrupted book he was simultaneously confirming.","quran":["Quran 5:46-48","Quran 5:66","Quran 5:68","Quran 7:157","Quran 10:94","Quran 57:27","Quran 3:3"],"hadith":[],"bible":["Mark 1:1","Luke 1:1-4","Romans 1:1-4","1 Corinthians 15:1-8","Galatians 1:8-9"],"sources":[{"name":"Stand to Reason — 'Is the Quran's Injil the Same as the New Testament Gospels?'","type":"apologetics","url":"https://www.str.org/w/is-the-quran-s-injil-the-same-as-the-new-testament-gospels-"},{"name":"Gordon Nickel, Narratives of Tampering (early tafsir did not read tahrif as textual corruption)","type":"scholarly","url":"https://www.answering-islam.org/authors/shamoun/gordon_nickel.html"},{"name":"Gospel in Islam (overview of the Muslim doctrine)","type":"scholarly","url":"https://en.wikipedia.org/wiki/Gospel_in_Islam"},{"name":"V.A. Mohamad Ashrof — 'The Myth of the Lost Book of Injeel' (Muslim concession)","type":"muslim","url":"https://www.newageislam.com/interfaith-dialogue/myth-lost-book-injeel-quranic-canonical-gospels/d/138494"}],"response":"There are two lines, and they are incompatible with each other. The mainstream one, from IslamQA, holds that the original Injil was Allah's verbal revelation to Jesus, transmitted in his preaching. It survives partly within the four gospels but entangled with human narrative, which is tahrif. Quran 5:47 then commands Christians to judge by what remains of the genuine revelation inside their books. The absence of a separate manuscript is expected, since it was lost early, and that is the whole reason the Quran was sent. The revisionist line, argued by V. A. Mohamad Ashrof and other modernists, concedes that the lost-book thesis is a myth. On that view the Quran's Injil simply is the gospel possessed by 7th-century Christians, treated as containing genuine revelation. The corruption verses then target misinterpretation and concealment rather than textual loss. Gordon Nickel's work on the early tafsir supports that reading.","responseSource":{"name":"IslamQA on previous scriptures; Ashrof, 'The Myth of the Lost Book of Injeel'","url":"https://www.newageislam.com/interfaith-dialogue/myth-lost-book-injeel-quranic-canonical-gospels/d/138494"},"rationale":"The dilemma survives because the two Muslim answers refute each other. The 'lost original' view has literally no historical evidence. No source in any century attests a revealed book given to Jesus; it is an anachronism projected backward from the Quran's assumption that every prophet receives a book. The revisionist view fits the Quranic data far better and has early-tafsir support. But it pays for that by authenticating the four gospels Christians actually held in 610 AD, whose text is fixed by 4th-century codices, and which teach the incarnation, crucifixion and resurrection the Quran denies. There is no third option. Fourteen centuries in, no Muslim can produce, describe, date or quote the 'real Injil'. This is arguably the sharpest internal-consistency problem in the Quran's engagement with Christianity.","plain":[{"t":"What Islam says the Injil is","d":"The Quran speaks of the <i>Injil</i> as one book Allah gave to Jesus (Quran 5:46; 57:27). Mainstream Islam says it was later lost or corrupted. On that account the four Gospels are unreliable human leftovers."},{"t":"The first problem","d":"No trace of such a book exists. No manuscript. No fragment. No quotation by any ancient writer, friendly or hostile, in the seven centuries between Jesus and Muhammad. From the earliest records, <i>gospel</i> meant the message about Jesus, and the written gospels are accounts about him."},{"t":"The second problem","d":"The Quran closes the exit itself. Quran 5:47 commands the People of the Gospel to judge by what Allah revealed <i>in it</i>. That is a present-tense order given between 610 and 632 AD. It assumes a book then in Christian hands — and that book was the fourfold Gospel, complete in 4th-century codices."},{"t":"The Muslim answer, at full strength","d":"Two lines are given, and they do not agree with each other. IslamQA holds that the original Injil was Allah's spoken revelation to Jesus, surviving partly inside the four Gospels but tangled with human narrative. Quran 5:47 then means: judge by what remains genuine. The other line is revisionist. V. A. Mohamad Ashrof, a Muslim writer, calls the lost book a myth. On his reading the Quran's Injil simply is the Gospel Christians held, and the corruption verses concern misreading — which Gordon Nickel's work on early tafsir supports."},{"t":"How strong is this argument?","d":"Strong for you, because the two answers cancel each other. The lost-book view has no historical evidence at all. The revisionist view fits the text better, but it authenticates the very Gospels the Quran contradicts. There is no third option, and no one has ever produced, dated or quoted the real Injil."},{"say":true,"t":"What to say","d":"\"Has anyone ever shown you a page of the Injil? I would genuinely like to see it.\""}],"rewritten":true,"refwhy":{"Mark 1:1":"'The beginning of the gospel of Jesus Christ.' Gospel is a message about him, not a book given to him.","Luke 1:1-4":"Luke says he checked with eyewitnesses and set it in order. That is a report, not a dictation.","Romans 1:1-4":"Paul spells out the gospel as the news about God's Son. The word meant that from the start.","1 Corinthians 15:1-8":"Gives the gospel as a short list of events. Again a message, not a revealed book.","Galatians 1:8-9":"Warns against any other gospel, even from an angel. There was one, and it was guarded.","Quran 5:46-48":"Says Allah gave Jesus the Injil, with guidance and light. This is the book being looked for.","Quran 5:66":"Says that if they kept the Torah and Gospel they would be fed. It assumes both are in hand.","Quran 5:68":"Says they stand on nothing until they uphold both books. The same problem of tense.","Quran 7:157":"Says the Prophet is written with them in the Torah and the Gospel.","Quran 10:94":"Sends the doubter to those who read the earlier Scripture. It assumes a book they can read.","Quran 57:27":"Says We gave Jesus the Gospel, and put mercy in the hearts of those who followed him.","Quran 3:3":"Names the Torah and Gospel as sent down before. This is where the question starts."},"titleLong":"The Injil problem: the book nobody has ever seen"},
{"id":"sun-muddy-spring","category":"science-history","severity":"medium","verdict":"contested","title":"'He found the sun setting in a muddy spring'","claim":"Quran 18:86 says Dhul-Qarnayn travelled until 'he reached the setting-place of the sun; he found it setting in a muddy spring'. The parallel at 18:90 gives a literal rising-place, where the sun rises on a people with no shelter from it. Early tafsir shows this was understood literally. Al-Tabari preserves narrations taking the sun as actually setting in the spring, and Ibn Kathir describes 'a blackened, muddy and stinking spring'. A supporting hadith exists in Sunan Abi Dawud 4002: 'It sets in a spring of warm water.' Albani graded its chain sahih, though some scholars argue the 'spring' wording is the narrator's description rather than the Prophet's. Either way, the tafsir record independently evidences a literal cosmology.","quran":["Quran 18:86","Quran 18:90","Quran 36:38-40"],"hadith":["Sunan Abi Dawud 4002"],"bible":[],"sources":[{"name":"Sunan Abi Dawud 4002 (Albani: sahih chain; wording disputed)","type":"primary","url":"https://sunnah.com/abudawud:4002"},{"name":"Tafsir al-Tabari on 18:86 (translated survey)","type":"apologetics","url":"https://theislamissue.wordpress.com/2022/03/23/tafsir-al-tabari-for-q1886/"},{"name":"Answering Islam — Muhammad on the Setting Place of the Sun","type":"apologetics","url":"https://www.answering-islam.org/authors/shamoun/mhmd_on_sunset.html"},{"name":"IslamQA 176375 — the correct way to describe the sun","type":"muslim","url":"https://islamqa.info/en/answers/176375"}],"response":"IslamQA 176375 answers that the verse describes what Dhul-Qarnayn perceived from his vantage point. 'He found it' means it appeared to him, just as English speakers say 'sunset' without meaning the sun moves. He simply reached the westernmost point of his journey, a shoreline where the sun appeared to sink into dark water. That is phenomenological language, not cosmology. The Abu Dawud hadith's wording is disputed, since some hold the 'spring' phrase belongs to the narrator and not the Prophet, so it cannot establish doctrine. The authentic description, they add, is that the sun 'prostrates beneath the Throne' (Sahih al-Bukhari 3199) — a metaphysical statement rather than a physical one.","responseSource":{"name":"IslamQA 176375","url":"https://islamqa.info/en/answers/176375"},"rationale":"The Arabic can grammatically bear a phenomenological reading, and the supporting hadith's import is disputed, so this is not admitted. But the phenomenological defence is anachronistic. The parallel rising-place at 18:90, the mirrored structure of the journey, and the earliest tafsir record all show that the first Muslim generations read it as real cosmology, consistent with late-antique Near Eastern belief. The defence requires the earliest interpreters to have misread their own book.","plain":[{"t":"What the verse says","d":"Quran 18:86 says Dhul-Qarnayn travelled until <b>\"he reached the setting-place of the sun; he found it setting in a muddy spring.\"</b> Quran 18:90 gives the mirror image, a rising-place where the sun comes up on people with no shelter."},{"t":"How the earliest readers took it","d":"Al-Tabari preserves narrations that read it literally: the sun really sets in the spring. Ibn Kathir describes <b>\"a blackened, muddy and stinking spring.\"</b> A hadith in Sunan Abi Dawud 4002 says it sets in a spring of warm water. Albani graded that chain sahih, though some scholars say the spring wording belongs to the narrator, not to Muhammad."},{"t":"The Muslim answer, at full strength","d":"IslamQA 176375 gives a fair reply. The verse says <i>he found it</i> — this is what Dhul-Qarnayn saw from where he stood. English speakers say sunset without meaning the sun moves. He simply reached the westernmost point of his journey, a shore where the sun seemed to sink into dark water. The authentic description of the sun, they add, is that it prostrates beneath the Throne (Sahih al-Bukhari 3199), which is not physical."},{"t":"Where that runs out","d":"The Arabic can carry that reading, so this is not a settled case. But the defence is modern. Quran 18:90 gives a matching rising-place, and the journey is built as a mirror. The earliest commentators read real cosmology. The defence needs them to have misread their own book."},{"t":"How strong is this argument?","d":"Genuinely arguable, so do not push it hard. Raise the tafsir, not the ridicule. The useful question is simply why the first Muslim generations understood it the way they did."},{"say":true,"t":"What to say","d":"\"How did al-Tabari and Ibn Kathir understand this verse? That is the part I find interesting.\""}],"rewritten":true,"refwhy":{"Quran 18:86":"The verse itself. He finds the sun setting in a muddy spring.","Quran 18:90":"The matching rising-place, where the sun comes up on people with no cover. The mirror is the point.","Quran 36:38-40":"Cuts against you. It says the sun runs to a resting place and each body swims on its course.","Sunan Abi Dawud 4002":"Not from Bukhari or Muslim. Albani called the chain sound. Some say the 'spring' words are the narrator's."},"titleLong":"The sun sets in a muddy spring (18:86)"},
{"id":"reproductive-science-galen","category":"science-history","severity":"high","verdict":"unrefuted","title":"Semen from the backbone: the Quran keeps Galen's error","claim":"Quran 86:5-7 says man is created from 'a gushing fluid, proceeding from between the backbone and the ribs'. Semen is produced in the testes, not the torso. The verse echoes the Greek view that semen descends from the region of the back, and classical tafsir took it anatomically. Separately, Quran 23:14 gives the embryonic sequence: drop, then clinging clot, then chewed lump, then bones, then bones clothed with flesh. That tracks Galen's four stages, including Galen's error — bone forming first and then being clothed with flesh, whereas muscle and bone develop concurrently. Medieval Arabic medicine itself mapped the Quranic terms onto Galen's stages. And the embryo is never a 'clot of blood'.","quran":["Quran 86:5-7","Quran 23:12-14","Quran 22:5","Quran 75:37-39"],"hadith":["Sahih Muslim 2645"],"bible":[],"sources":[{"name":"WikiIslam — Embryology in the Quran","type":"apologetics","url":"https://wikiislam.net/wiki/Embryology_in_the_Quran"},{"name":"Answering Islam — 'Alaqa and other embryological stages","type":"apologetics","url":"https://www.answering-islam.org/Quran/Science/alaqa.html"},{"name":"IslamQA 118879 — commentary on 86:6-7","type":"muslim","url":"https://islamqa.info/en/answers/118879"}],"response":"IslamQA 118879, Maurice Bucaille and the iERA embryology paper answer both passages. On 86:5-7, sulb and tara'ib may be a merism for the whole torso, or may refer to the man's loins and the woman's chest, meaning the fluid of both parents. Some modern writers argue the terms denote the embryological origin-sites of the gonads, which do form near the kidneys before descending. On 23:14, the stages are broad visual descriptions accessible to a 7th-century audience. Alaqah means 'clinging thing', which is accurate for implantation, and 'then' need not be strictly sequential. Keith Moore endorsed the compatibility of these terms with modern embryology.","responseSource":{"name":"IslamQA 118879; Bucaille; iERA embryology paper (later revised)","url":"https://islamqa.info/en/answers/118879"},"rationale":"The reinterpretations are post hoc. Classical exegetes read 86:7 anatomically, and no reading rescues fluid physically gushing from between backbone and ribs. On embryology, the sequence matches Galen down to sharing Galen's specific bones-then-flesh error, and Muslim physicians for centuries used the Quranic terms as translations of Galen's stages. Keith Moore's endorsement came in a Saudi-sponsored context and is not accepted by the scientific community, and the iERA paper was withdrawn and revised after criticism. A 'broad visual description' that reproduces the precise erroneous schema of the era's dominant Greek medicine is evidence of human sourcing.","plain":[{"t":"The two passages","d":"Quran 86:5-7 says man is made from <b>\"a gushing fluid, proceeding from between the backbone and the ribs.\"</b> Quran 23:14 gives a sequence: drop, then clinging clot, then chewed lump, then bones, then bones clothed with flesh."},{"t":"What was believed at the time","d":"Semen is made in the testes, not the torso. The Greek view was that it descends from the region of the back, and classical tafsir read 86:7 anatomically. The stage list tracks Galen, the Greek physician whose medicine dominated the region. It even keeps Galen's mistake: bone forming first, then being clothed with flesh. In reality bone and muscle develop together."},{"t":"What Muslim doctors did with it","d":"Medieval Arabic medicine mapped the Quran's terms onto Galen's stages directly. That is not a Christian claim. It is what the physicians themselves wrote."},{"t":"The Muslim answer, at full strength","d":"IslamQA 118879 and Maurice Bucaille answer on both verses. <i>Sulb</i> and <i>tara'ib</i> may be a figure of speech for the whole torso, or the man's loins and the woman's chest. Some argue they mark where the reproductive organs first form, near the kidneys, before they descend. On 23:14, the stages are broad visual descriptions for a 7th-century audience. <i>Alaqah</i> means clinging thing, which fits implantation, and <i>then</i> need not be strictly sequential. Keith Moore endorsed the fit with modern embryology."},{"t":"How strong is this argument?","d":"Strong for you, but keep it precise. No reading rescues fluid coming from between backbone and ribs. Keith Moore's endorsement came in a Saudi-funded setting and is not accepted by scientists generally. The iERA paper on this was withdrawn and revised after criticism. A broad description that repeats the exact errors of the era's medicine looks like the era's medicine."},{"say":true,"t":"What to say","d":"\"If the Quran is ahead of its time here, why does it match Galen exactly, mistakes and all?\""}],"rewritten":true,"refwhy":{"Quran 86:5-7":"The gushing fluid 'from between the backbone and the ribs'. The first of the two passages.","Quran 23:12-14":"The stage list: drop, clinging thing, lump, then bones, then flesh on the bones.","Quran 22:5":"Repeats the same stages in another surah. It shows the order is fixed, not a passing image.","Quran 75:37-39":"A shorter account of how a human is made. The third telling of the same sequence.","Sahih Muslim 2645":"From Sahih Muslim, held to be sound. It adds hadith detail on the stages of the unborn child."},"titleLong":"Semen from between backbone and ribs (86:5–7) and Galenic embryology (23:14)"},
{"id":"mary-sister-of-aaron","category":"science-history","severity":"high","verdict":"unrefuted","title":"Mary given Miriam's family, 1,400 years apart","claim":"The Quran calls Mary the mother of Jesus 'sister of Aaron' (19:28), calls her mother 'the wife of Imran' (3:35), and calls Mary 'daughter of Imran' (66:12). That is exactly the family of Miriam in the Bible: Miriam, daughter of Amram, which is Imran, and sister of Aaron and Moses (Exodus 15:20; Numbers 26:59). She lived about 1,400 years before Mary. The triple match — father Imran, brother Aaron, and the identical name Maryam and Miriam — indicates the two women were conflated. Crucially, this objection is as old as Islam. In Sahih Muslim 2135, the Christians of Najran put precisely this problem to Mughira ibn Shu'ba, and Muhammad's answer was that people 'used to give names after the names of Apostles and pious persons before them'.","quran":["Quran 19:28","Quran 66:12","Quran 3:35-36"],"hadith":["Sahih Muslim 2135"],"bible":["Exodus 15:20","Numbers 26:59","1 Chronicles 6:3"],"sources":[{"name":"Sahih Muslim 2135","type":"primary","url":"https://sunnah.com/muslim:2135"},{"name":"Answering Islam — Is Mary the Sister of Aaron?","type":"apologetics","url":"https://www.answering-islam.org/Silas/mary.htm"},{"name":"Abu Amina Elias — Why Mary is called sister of Aaron","type":"muslim","url":"https://www.abuaminaelias.com/dailyhadithonline/2012/10/05/sister-harun-quran/"}],"response":"The Prophet himself answered this in Sahih Muslim 2135, and Abu Amina Elias develops the answer. Semitic naming convention attached people to revered ancestors. 'Sister of Aaron' means a woman of the Aaronic or priestly line — compare Luke 1:5, which calls Elizabeth one 'of the daughters of Aaron', and Mary was her kinswoman. 'Daughter of Imran' likewise denotes descent from the house of Imran, or Amram, and Surah 3 is named 'the Family of Imran', which signals lineage language. So there is no confusion here, only idiom.","responseSource":{"name":"Sahih Muslim 2135 (Muhammad's own recorded answer); Abu Amina Elias","url":"https://www.abuaminaelias.com/dailyhadithonline/2012/10/05/sister-harun-quran/"},"rationale":"The steelman is real, since Luke 1:5 shows that tribal-descent idiom exists. But it does not cover the evidence. The Quran never uses 'sister of X' as a lineage idiom anywhere else. It does not merely link Mary to Aaron; it gives her the full Exodus family — father Imran, brother Aaron, and the identical name. And 3:35-36 narrates Imran's wife giving birth to Mary as one continuous story. A lineage idiom explains one datum, not three converging ones. That the difficulty was spotted by 7th-century Christians, and required a recorded answer, confirms that the natural reading was and is the problem.","plain":[{"t":"What the Quran calls Mary","d":"Quran 19:28 calls Mary, the mother of Jesus, <b>\"sister of Aaron.\"</b> Quran 3:35 calls her mother the wife of Imran. Quran 66:12 calls Mary the daughter of Imran."},{"t":"Whose family that is","d":"That is Miriam's family in the Bible. Miriam was the daughter of Amram, which is Imran in Arabic, and the sister of Aaron and Moses (Exodus 15:20; Numbers 26:59). She lived about 1,400 years before Mary. The two women share a name as well: Maryam and Miriam."},{"t":"The objection is as old as Islam","d":"This is not a modern complaint. In Sahih Muslim 2135, Christians of Najran put it to Mughira ibn Shu'ba. He had no answer and asked Muhammad. The reply was that people <b>\"used to give names after the names of Apostles and pious persons before them.\"</b>"},{"t":"The Muslim answer, at full strength","d":"Muhammad's own recorded answer is the defence, and it is a real one. Semitic speech ties people to revered ancestors. Sister of Aaron can mean a woman of the priestly line. Luke 1:5 calls Elizabeth one <b>\"of the daughters of Aaron,\"</b> and Mary was her kinswoman. Daughter of Imran can mean descent from that house, and Surah 3 is named the Family of Imran."},{"t":"How strong is this argument?","d":"Strong for you, but concede the idiom first. Luke 1:5 shows the idiom exists. The trouble is that three things converge, not one: the father Imran, the brother Aaron and the same name. Quran 3:35-36 also tells the birth of Mary to Imran's wife as one continuous story."},{"say":true,"t":"What to say","d":"\"The Christians of Najran asked Muhammad about this verse. May we look at what they asked?\""}],"rewritten":true,"refwhy":{"Exodus 15:20":"Names Miriam the prophetess, sister of Aaron. That is the phrase the Quran gives Mary.","Numbers 26:59":"Names Amram's three children: Aaron, Moses and Miriam. All the family links in one verse.","1 Chronicles 6:3":"Lists the same three as children of Amram. A second witness to the same family.","Quran 19:28":"Calls Mary 'sister of Aaron'. This is the verse the case is about.","Quran 66:12":"Calls Mary the daughter of Imran. Imran is the Arabic form of Amram.","Quran 3:35-36":"Tells of Imran's wife giving birth to Mary in one flowing story. The third link in the chain.","Sahih Muslim 2135":"Both sides use it. In Sahih Muslim the Christians of Najran raise this, and Muhammad answers."},"titleLong":"Mary called 'sister of Aaron' and 'daughter of Imran' (19:28; 66:12; 3:35)"},
{"id":"samaritan-anachronism","category":"science-history","severity":"medium","verdict":"contested","title":"A 'Samaritan' at the golden calf, centuries early","claim":"Quran 20:85-97 says the golden calf at Sinai was made not by Aaron, as in Exodus 32, but by 'al-Samiri' — the Samaritan. The Samaritans as a people emerged after the Assyrian conquest of the northern kingdom, from 722 BC at the earliest, roughly seven centuries after the Exodus period. Scholars note the story likely reflects later anti-Samaritan polemic, since Samaritans were associated with calf-worship at Bethel and Dan, retrojected into the Exodus narrative. The Quran also transfers blame away from Aaron, whom the Bible explicitly names as the calf's maker.","quran":["Quran 20:85-97"],"hadith":[],"bible":["Exodus 32:1-6","2 Kings 17:24-41"],"sources":[{"name":"Answering Islam — Samaritans in the time of Moses?","type":"apologetics","url":"https://www.answering-islam.org/Quran/Contra/h002.html"},{"name":"Islamic Awareness — The 'Samaritan' Error In The Qur'an?","type":"muslim","url":"https://www.islamic-awareness.org/quran/contrad/external/samaritan.html"},{"name":"Answering Islam — response to Islamic Awareness","type":"apologetics","url":"https://www.answering-islam.org/Responses/Saifullah/samaritan.htm"}],"response":"Islamic Awareness argues that 'al-Samiri' is an attributive name for one individual, not necessarily 'the Samaritan'. It could derive from a clan or place name; 1 Kings 16:24 shows 'Shemer' as a personal name predating the city of Samaria. Alternatively, Samaritan tradition itself claims pre-exilic Israelite origins, so the name's referent may be older than critics allow. And the Quran corrects rather than copies the biblical account, by clearing a prophet, Aaron, of idol-making.","responseSource":{"name":"Islamic Awareness — 'The Samaritan Error In The Quran?'","url":"https://www.islamic-awareness.org/quran/contrad/external/samaritan.html"},"rationale":"The etymological escape route is linguistically possible. 'Al-Samiri' need not be an ethnonym, and 'Shemer' as a name is attested early. But it is special pleading against the most natural Arabic reading, in which al-Samiri is exactly the ethnic term as classical usage renders it, and the narrative fits known post-biblical polemical motifs. Neither side can strictly prove the referent, though the critic's reading is the more probable one. And the exoneration of Aaron against Exodus 32 remains a separate, unanswered divergence.","plain":[{"t":"What the Quran says","d":"Quran 20:85-97 says the golden calf at Sinai was made by <i>al-Samiri</i>. The word means the Samaritan. Exodus 32 says Aaron made it. So two things differ. Who made the calf, and what he is called."},{"t":"Why the name is a problem","d":"The Samaritans came from the region of Samaria. That region was named long after the Exodus. Its people were resettled after the Assyrian conquest in 722 BC. That is about seven centuries too late. Scholars think the story reflects later feeling against Samaritans, who were linked with calf-worship at Bethel and Dan."},{"t":"The Muslim answer, at full strength","d":"Islamic Awareness gives a serious reply. <i>Al-Samiri</i> names one man. It need not be an ethnic word at all. It could come from a clan or a place. 1 Kings 16:24 shows Shemer as a man's name, older than the city. Samaritans also claim older roots than critics allow. And the Quran, they say, clears a prophet of making an idol."},{"t":"How strong is this argument?","d":"Genuinely arguable. Neither side can prove the name. But the escape works against the plainest Arabic reading, where the word is the ethnic one. The critic's reading is the more likely one."},{"t":"What is left either way","d":"Exodus 32 names Aaron. The Quran moves the blame. That difference stands whatever the name means. Nobody has answered it."},{"say":true,"t":"What to say","d":"\"Exodus 32 names Aaron. Have you ever read that chapter for yourself?\""}],"rewritten":true,"refwhy":{"Exodus 32:1-6":"Names Aaron as the man who made the calf. The Quran moves that blame to someone else.","2 Kings 17:24-41":"Records the resettling of Samaria after 722 BC. That is where Samaritans come from.","Quran 20:85-97":"The Quran's account, in which al-Samiri makes the calf. The case turns on this passage."},"titleLong":"A 'Samaritan' at the golden calf (20:85–97)"},
{"id":"dhul-qarnayn-alexander","category":"science-history","severity":"high","verdict":"unrefuted","title":"Alexander the Great, retold as Dhul-Qarnayn","claim":"The Quran tells of Dhul-Qarnayn, the Two-Horned One. He journeys to the setting-place and the rising-place of the sun. He builds a wall of iron and brass that imprisons Gog and Magog until the end times. That story closely parallels the Syriac Alexander Legend. It is a Christian propaganda text. Its final form dates to about 629-630 AD, with a 6th-century core. Kevin van Bladel published on this in 2008. Tommaso Tesei followed in 2023, with Oxford University Press. Both argue that the Quranic account depends on the legend. The sequence is the same. So is the two-horned motif, since Alexander is horned on his coins. So is the fetid water at the sunset place, and so is the wall. A Greek pagan king, remembered through Christian legend, appears in the Quran as a monotheist hero. And the geography belongs to legend, not to history.","quran":["Quran 18:83-102","Quran 21:96"],"hadith":[],"bible":["Ezekiel 38:1-6"],"sources":[{"name":"Kevin van Bladel — 'The Alexander Legend in the Quran 18:83-102' (2008)","type":"scholarly","url":"https://www.academia.edu/33727330/van_Bladel_2008_The_Alexander_Legend_in_the_Quran_18_83_102"},{"name":"Tommaso Tesei — The Syriac Legend of Alexander's Gate (Oxford UP, 2023)","type":"scholarly","url":"https://global.oup.com/academic/product/the-syriac-legend-of-alexanders-gate-9780197646878"},{"name":"'Did the Quran borrow from the Syriac Legend of Alexander?' (dissenting analysis)","type":"muslim","url":"https://ponderingislam.com/2020/02/15/did-the-qur%CA%BEan-borrow-from-the-syriac-legend-of-alexander/"}],"response":"Three lines are offered in reply. On identity, Maududi and others hold that Dhul-Qarnayn is not Alexander but Cyrus the Great. Cyrus was friendly to monotheists, and he is the two-horned ram of Daniel 8:20. Others say he is an unknown ancient king. On chronology, the Syriac Legend reached its final form about 629-630 AD. That may be too late to be a source for a Meccan surah. So both may draw on a common older oral tradition. On theology, the Quran retells a story its audience already knew. The questions came through Jews, and the Quran corrects the story toward monotheism. A shared narrative frame is not an error. And the Quran omits the legend's explicitly Christian elements.","responseSource":{"name":"Islamic Awareness / Pondering Islam response papers; Maududi (Cyrus identification)","url":"https://ponderingislam.com/2020/02/15/did-the-qur%CA%BEan-borrow-from-the-syriac-legend-of-alexander/"},"rationale":"In academic scholarship the dependence thesis, or at minimum shared legend-matter, is the mainstream view. Tesei dates the core of the legend to the mid-6th century, which dissolves the chronology objection. The Cyrus identification is a 20th-century apologetic with no early tafsir support. Classical exegetes themselves commonly identified Dhul-Qarnayn with Alexander. Even the common-source concession still grants the decisive point. The Quran presents legendary material as factual history — a literal setting-place of the sun, and an eschatological wall no one has found.","plain":[{"t":"The story in the Quran","d":"Quran 18:83-102 tells of Dhul-Qarnayn, the two-horned one. He travels to the place where the sun sets and the place where it rises. He builds a wall of iron and brass that shuts in Gog and Magog until the end of the age."},{"t":"The story beside it","d":"The Syriac Alexander Legend is a Christian text. Its final form dates to about 629-630 AD, with a core from the 6th century. It has the same sequence, the same two-horned hero, the same foul water at the sunset place, and the same wall. Alexander is shown horned on his coins."},{"t":"What the scholars say","d":"Kevin van Bladel published on this in 2008. Tommaso Tesei followed with a book from Oxford University Press in 2023. Both argue the Quranic account depends on the legend. A Greek pagan king, remembered through Christian storytelling, arrives in the Quran as a monotheist hero."},{"t":"The Muslim answer, at full strength","d":"Three lines are offered. On identity, Maududi and others say Dhul-Qarnayn is Cyrus the Great, the two-horned ram of Daniel 8:20, or an unknown king. On dating, the legend reached its final form in 629-630. That may be too late to be a source for a Meccan surah. So both may draw on older oral material. On purpose, the Quran retells a story its audience already knew and corrects it toward monotheism, dropping the Christian elements."},{"t":"How strong is this argument?","d":"Strong for you, and the academy agrees. Tesei dates the legend's core to the mid-6th century, which removes the timing objection. The Cyrus identification is a 20th-century idea with no early tafsir support — classical commentators themselves often said Alexander. Even the common-source answer grants the point. Legendary material is presented as history."},{"say":true,"t":"What to say","d":"\"A Christian legend tells this same story first. Would you be willing to read them side by side?\""}],"rewritten":true,"refwhy":{"Ezekiel 38:1-6":"Where Gog and Magog come from. Listed so you can see the figures before the legend used them.","Quran 18:83-102":"The whole story: the two journeys, the wall of iron, and Gog and Magog shut in.","Quran 21:96":"Says Gog and Magog will be let loose at the end. It ties the wall to the last day."},"titleLong":"Dhul-Qarnayn and the Syriac Alexander Legend (18:83–102)"},
