pressing love for him and defending him. Kinana died, they argue, for breaking the surrender terms by hiding treasure, which was a treaty violation. The burning detail rests on Ibn Ishaq's chainless report rather than on sahih hadith. Her marriage protected her, in a world where a defeated noblewoman had no better outcome. The consummation followed her purification, or istibra, which satisfied the waiting rule for captives. And Al Hakam argues that her consent is recorded.","responseSource":{"name":"Al Hakam — Did Muhammad force Safiyya into marriage?","url":"https://www.alhakam.org/islam-today-did-prophet-muhammad-force-safiyya-bint-huyayy-into-marriage-after-killing-her-father"},"verdict":"admitted","rationale":"The core sequence is Bukhari, not polemic. The husband was killed at Khaybar. Safiyya was taken from the captives. The marriage was consummated on the return journey. Only the burning detail depends on the sira alone. The defences concede every load-bearing fact and recast them as generosity. But her husband and father were killed by the same force, and she was offered marriage or captivity. That is not consent in any meaningful sense. And 'honour' assumes the captivity system itself is legitimate (Quran 33:50). This is graded admitted, since Islamic sources affirm the substance. The dispute is only over whether it was praiseworthy — which is exactly the question about character that this category exists to pose.","severity":"high","plain":[{"t":"The sequence","d":"At Khaybar in 628, the Muslims killed Kinana ibn al-Rabi. His wife was Safiyya bint Huyayy. She was a Jewish noblewoman of seventeen. Ibn Ishaq adds that Kinana was first burned to reveal treasure, then beheaded (Guillaume, page 515). Her father had been killed with Banu Qurayza."},{"t":"What happened next","d":"Safiyya was taken captive. She was first given to Dihya al-Kalbi. She was then given to Muhammad (Sahih al-Bukhari 4200). Sahih al-Bukhari 371 says he took her as wife on the journey home, at Sidd as-Sahba. That was days after her husband died. The companions asked aloud whether she was a wife or a slave."},{"t":"The Muslim answer, at full strength","d":"Al Hakam replies that she was honoured, not wronged. Muhammad freed her. Her freedom was her <i>mahr</i>, her bridal gift. A captive became a Mother of the Believers. Later reports show her love for him. Kinana died for breaking the surrender terms by hiding treasure. The burning detail rests on Ibn Ishaq's chainless report, not on sahih hadith. Marriage shielded her, when a beaten noblewoman had no better path. The waiting rule for captives was kept. Al Hakam argues her consent is recorded."},{"t":"Where it stands","d":"They admit the core themselves. The husband killed at Khaybar. Safiyya taken from the captives. The wedding night on the road home. That is Bukhari, not polemic. Only the burning detail rests on the <i>sira</i> alone."},{"t":"How strong is this argument?","d":"The defences grant every fact and recast them as kindness. But her husband and father were killed by the same men. She was offered marriage or slavery. That is not consent in any real sense. And honour here assumes the whole captive system is right (Quran 33:50). Ask it as a question about character."},{"say":true,"t":"What to say","d":"\"Would you read Bukhari 371 with me? I want to understand how you see it.\""}],"rewritten":true,"refwhy":{"Matthew 7:15-20":"'By their fruits ye shall know them.' The test this whole part of the site applies.","2 Samuel 11:26-27; 12:9":"David takes a dead man's wife and God condemns him for it. The Bible judges its own king.","1 Thessalonians 4:3-5":"Tells Christians to keep from lust and to hold their own bodies in honour.","Quran 33:50":"Makes captives lawful to the Prophet. The rule the whole episode rests on.","Sahih al-Bukhari 371":"In Bukhari: the marriage consummated on the journey home. The key report in this case.","Sahih al-Bukhari 4200":"In Bukhari: Safiyya first given to Dihya, then given to Muhammad. The captive half of it."},"titleLong":"Safiyya of Khaybar: bride of the man who killed her husband — that week"},
{"id":"mutah-temporary-marriage","title":"Mut'ah: marriage for a term, even for a garment","category":"practice","claim":"Sahih hadith establish that Muhammad permitted mut'ah, a marriage contracted for a fixed term and payment that dissolves automatically. Companions on campaign were allowed to marry women 'for a fixed time', even for a garment (Sahih Muslim 1404), and Jabir reports that the practice continued through Abu Bakr's reign until Umar banned it (Sahih Muslim 1405). Sunni Islam holds that Muhammad finally prohibited it (Sahih al-Bukhari 5115; Sahih Muslim 1406, 'Allah has forbidden it until the Day of Resurrection'), though the abrogation is variously dated to Khaybar, to the conquest of Mecca, or to Umar's caliphate. Shia Islam rejects the abrogation, grounds the practice in Quran 4:24 — 'give them their due compensation for what you have enjoyed' — and practises mut'ah today, where in documented cases it functions as religiously laundered prostitution. Either Muhammad sanctioned term-limited sexual contracts, or the community that transmitted his religion cannot agree on what he finally commanded. Both horns matter against 'a marriage covenant witnessed by God' (Malachi 2:14).","quran":["Quran 4:24"],"hadith":["Sahih Muslim 1404","Sahih Muslim 1405","Sahih Muslim 1406","Sahih al-Bukhari 5115"],"bible":["Malachi 2:14-15","Matthew 19:4-6"],"sources":[{"name":"Sahih al-Bukhari 5115","type":"primary","url":"https://sunnah.com/bukhari:5115"},{"name":"Sahih Muslim — Book of Marriage (mut'ah reports)","type":"primary","url":"https://sunnah.com/muslim:1404a"},{"name":"Wikipedia — Nikah mut'ah","type":"institutional","url":"https://en.wikipedia.org/wiki/Nikah_mut%27ah"},{"name":"Al-Islam.org (Shia) — Temporary marriage: evidences from Sunni hadith collections","type":"muslim","url":"https://al-islam.org/shiite-encyclopedia/temporary-marriage-islam-part-2-evidences-sunni-hadith-collections"},{"name":"IslamQA 20738 — Is mut'ah marriage allowed?","type":"muslim","url":"https://islamqa.info/en/answers/20738"}],"response":"IslamQA 20738 gives the Sunni answer. Mut'ah belongs to Islam's gradualist pedagogy, like the phased prohibition of alcohol. It was permitted briefly under wartime hardship, then abrogated by the Prophet himself 'until the Day of Resurrection' (Sahih Muslim 1406), with the four Sunni schools unanimous on its prohibition. So Islam cannot be charged with what it abolished, and Umar's ban merely enforced the Prophet's ruling. Shia scholars answer the opposite. Quran 4:24 sanctions it, no abrogating verse exists, and Umar had no authority to forbid what Muhammad allowed. Regulated mut'ah, with dower, term and idda, is a lawful institution and not prostitution.","responseSource":{"name":"IslamQA 20738","url":"https://islamqa.info/en/answers/20738"},"verdict":"contested","rationale":"This is graded contested because the Sunni abrogation defence is a genuine, well-sourced internal answer. Bukhari and Muslim do record prohibition, and it would be unfair to charge Sunni Islam with a practice it anathematises. But the challenge is not fully answered. Muhammad undeniably permitted term-limited sexual contracts for some period, which both sects agree on, and that is itself the moral datum against the biblical vision of marriage. The abrogation chronology is internally tangled. And a quarter of the Muslim world's second-largest branch practises mut'ah now, on Quranic grounds Sunnis cannot conclusively rebut without appealing to Umar's authority. The disagreement also feeds the hadith-epistemology entry, since the two communities' canons yield opposite final rulings.","severity":"medium","plain":[{"t":"What mut'ah is","d":"It is a marriage contracted for a fixed term and a fixed payment. It dissolves on its own when the term ends."},{"t":"What the sahih hadith record","d":"Muhammad permitted it. Companions on campaign were allowed to marry women for a fixed time, even for a garment (Sahih Muslim 1404). Jabir reports that the practice continued through Abu Bakr's reign until Umar banned it (Sahih Muslim 1405)."},{"t":"What Sunnis and Shias say now","d":"Sunni Islam holds that Muhammad finally forbade it (Sahih al-Bukhari 5115; Sahih Muslim 1406, <b>\"Allah has forbidden it until the Day of Resurrection\"</b>). The date of that ban is variously given as Khaybar, the conquest of Mecca, or Umar's caliphate. Shia Islam rejects the ban. It grounds mut'ah in Quran 4:24 and practises it today, where in documented cases it works as paid sex with a religious wrapper."},{"t":"The Muslim answer, at full strength","d":"IslamQA 20738 gives the Sunni case. Mut'ah belongs to Islam's staged teaching, like the phased ban on alcohol. It was allowed briefly under wartime hardship, then abrogated by the Prophet himself, with all four Sunni schools agreed. Umar only enforced the Prophet's ruling. Shia scholars answer the opposite. Quran 4:24 sanctions it, no abrogating verse exists, and Umar had no authority to forbid what Muhammad allowed. Regulated mut'ah, with dower, term and waiting period, is a lawful institution."},{"t":"How strong is this argument?","d":"Genuinely arguable, and be fair to Sunnis. Bukhari and Muslim do record a prohibition, so it is unjust to charge Sunni Islam with what it forbids. But both sects agree Muhammad permitted fixed-term sexual contracts for some period. The chronology of the ban is tangled. And a large part of the Muslim world practises it now on Quranic grounds. Compare that with a covenant witnessed by God (Malachi 2:14)."},{"say":true,"t":"What to say","d":"\"Sunnis and Shias disagree about mut'ah. How do you decide which report is final?\""}],"rewritten":true,"refwhy":{"Malachi 2:14-15":"Calls marriage a covenant with God as witness. The standard a fixed-term deal is measured by.","Matthew 19:4-6":"'What God hath joined together, let not man put asunder.' Marriage as lasting by design.","Quran 4:24":"The verse Shia Islam builds mut'ah on: give them their due for what you have enjoyed.","Sahih Muslim 1404":"In Sahih Muslim: men on campaign allowed to marry for a set time, even for a garment.","Sahih Muslim 1405":"In Sahih Muslim: Jabir says it went on into Abu Bakr's reign, until Umar banned it.","Sahih Muslim 1406":"Cuts against you. In Sahih Muslim it is forbidden 'until the Day of Resurrection'.","Sahih al-Bukhari 5115":"In Bukhari: the ban again. Both sound books record it, so be fair to Sunnis here."},"titleLong":"Mut'ah: the temporary marriage Muhammad permitted"},
{"id":"kaaba-black-stone-pagan-rites","title":"The Kaaba's 360 idols, and the rites Islam kept","category":"practice","claim":"Islam's central rites predate Islam. The Kaaba was a functioning pagan shrine housing 360 idols until Muhammad cleansed it in 630 (Sahih al-Bukhari 4287). Pre-Islamic Arabs already performed tawaf, venerated the Black Stone, and ran between Safa and Marwa — a rite associated with the idols Isaf and Na'ila, which the Quran had to expressly re-authorise (2:158). Muslims still kiss or salute the embedded Black Stone. Umar's unease is canonical: 'I know that you are a stone and can neither benefit nor harm. Had I not seen the Prophet kissing you, I would not have kissed you' (Sahih al-Bukhari 1597). Other hadith give the stone unusual powers. It came down from paradise whiter than milk. Sins turned it black. It will testify on judgment day (Jami at-Tirmidhi 877, 961). So there is a question for a faith that defines itself against idols. Why does its holiest act keep a pagan shrine's stone-kissing circuit, unchanged in form?","quran":["Quran 2:125","Quran 2:158","Quran 3:96-97","Quran 22:26-29"],"hadith":["Sahih al-Bukhari 1597","Sahih al-Bukhari 4287","Jami at-Tirmidhi 877"],"bible":["John 4:21-24","Acts 17:24-25","Isaiah 44:9-20"],"sources":[{"name":"Sahih al-Bukhari 1597 (Umar and the stone)","type":"primary","url":"https://sunnah.com/bukhari:1597"},{"name":"Sahih al-Bukhari 4287 (360 idols)","type":"primary","url":"https://sunnah.com/bukhari:4287"},{"name":"Jami at-Tirmidhi 877 (stone from paradise)","type":"primary","url":"https://sunnah.com/tirmidhi:877"},{"name":"WikiIslam — Pre-Islamic Arab religion in Islam","type":"apologetics","url":"https://wikiislam.net/wiki/Pre-Islamic_Arab_Religion_in_Islam"},{"name":"Wikipedia — Black Stone","type":"institutional","url":"https://en.wikipedia.org/wiki/Black_Stone"},{"name":"Answering Islam — Stone kissing and idolatry","type":"apologetics","url":"https://www.answering-islam.org/Muhammad/Inconsistent/stone_kissing.html"}],"response":"IslamQA 118085 answers that the direction of history is reversed. Abraham and Ishmael built the Kaaba for pure monotheism (Quran 2:127), and the pagan rites were later corruptions of an originally Abrahamic pilgrimage. So Islam did not adopt paganism; it stripped paganism off an ancient monotheist sanctuary and restored the original. Kissing the stone, IslamQA explains, is pure ittiba', following the Prophet's example, and explicitly not worship. Umar's statement is cited by Muslims themselves as proof that the act carries no belief in the stone's power. Tawaf and Safa-Marwa commemorate Abrahamic history, including Hagar's search for water, re-sanctified by revelation.","responseSource":{"name":"IslamQA 118085 — Why do Muslims kiss the Black Stone?","url":"https://islamqa.info/en/answers/118085"},"verdict":"contested","rationale":"This is graded contested, conservatively. The link between the rites and pre-Islamic paganism is a matter of Islamic record. Bukhari 4287 supplies the idols, and the fresh permission at 2:158 assumes the pagan tie. And the 'Abrahamic original' has no support from before Islam. It depends wholly on the Quran's assertion, while the Ishmael entry shows Genesis places Abraham nowhere near Mecca. But the Muslim intent-distinction is real. Mainstream Islam explicitly denies the stone any power, and Umar's canonical statement functions as an internal anti-idolatry guardrail. So the strong claim, that Muslims worship a stone, fails. The fair claim stands: Islam's central rite is a retained pagan circuit resting on an unevidenced origin story.","severity":"medium","plain":[{"t":"What was there before Islam","d":"The Kaaba was a working pagan shrine. It held 360 idols until Muhammad cleansed it in 630 (Sahih al-Bukhari 4287). Arabs already walked round it. They already kissed the Black Stone. They already ran between Safa and Marwa. That run was tied to the idols Isaf and Na'ila. Quran 2:158 had to allow it again."},{"t":"What Umar said","d":"Muslims still kiss or salute the Black Stone. Umar's unease is in the canon. <b>\"I know that you are a stone and can neither benefit nor harm. Had I not seen the Prophet kissing you, I would not have kissed you\"</b> (Sahih al-Bukhari 1597). Other hadith go further. The stone came down from paradise whiter than milk. Sins made it black. It will speak on judgment day (Jami at-Tirmidhi 877, 961)."},{"t":"The Muslim answer, at full strength","d":"IslamQA 118085 turns the story round. Abraham and Ishmael built the Kaaba for one God (Quran 2:127). The pagan rites came later and spoiled it. So Islam did not take up paganism. It scraped paganism off an old shrine. Kissing the stone is <i>ittiba'</i>, doing as the Prophet did. It is not worship. Muslims cite Umar's own words to prove that. The walk and the run recall Hagar's search for water."},{"t":"Where it lands","d":"The link with the older rites is in Islam's own record. Bukhari 4287 gives the idols. Quran 2:158 had to allow the run again, which assumes the pagan tie. But there is no trace of an Abrahamic Kaaba before Islam. It rests on the Quran alone. And the point about intent is real. Umar's words work as a guard inside Islam."},{"t":"How strong is this argument?","d":"Genuinely arguable, so be exact. The loud claim, that Muslims worship a stone, fails. The fair claim stands. The central rite of Islam was kept from before Islam, and its back story has no evidence."},{"say":true,"t":"What to say","d":"\"Where does the evidence for an Abrahamic Kaaba come from, outside the Quran? I would like to read it.\""}],"rewritten":true,"refwhy":{"John 4:21-24":"Jesus says the place stops mattering. Worship in spirit and truth. The contrast with a fixed rite.","Acts 17:24-25":"God does not live in temples made with hands. The second half of that contrast.","Isaiah 44:9-20":"The mockery of idol-making. Use it with care: this case says Muslims do not worship the stone.","Quran 2:125":"Makes the House a place of return and names the station of Abraham. The Muslim origin story.","Quran 2:158":"Allows the run between Safa and Marwa again. That it had to assumes the older pagan tie.","Quran 3:96-97":"Names Bakkah as the first house set up, and makes the pilgrimage a duty.","Quran 22:26-29":"Gives the site to Abraham and orders the circling of the ancient House.","Sahih al-Bukhari 1597":"Umar in Bukhari: 'I know that you are a stone'. Muslims cite it to show the kiss is not worship.","Sahih al-Bukhari 4287":"In Bukhari: the 360 idols cleared out in 630. The shrine's pagan use, from Islam's own record.","Jami at-Tirmidhi 877":"From Tirmidhi, below Bukhari in rank. It has the stone coming from paradise and speaking at judgment."},"titleLong":"The Black Stone and the Kaaba: pre-Islamic rites retained"},
{"id":"sword-verses-final-command","title":"'Kill the polytheists wherever you find them' (9:5)","category":"practice","claim":"Surah 9, by Muslim consensus among the last revealed, commands 'kill the polytheists wherever you find them' after the sacred months (9:5), and 'fight those who do not believe in Allah... from the People of the Book until they pay the jizya with willing submission, and feel themselves subdued' (9:29). Under Islam's own abrogation doctrine, later revelation governs earlier. Ibn Kathir's tafsir records Ad-Dahhak's judgment that the Verse of the Sword 'abrogated every agreement of peace between the Prophet and any idolator, every treaty, and every term'. Classical jurists across the schools built offensive-jihad doctrine on exactly this chronology, and Muhammad's own summary is canonical: 'I have been ordered to fight the people until they say: none has the right to be worshipped but Allah' (Sahih al-Bukhari 25). The frequently quoted 'no compulsion in religion' (2:256) is Medinan but earlier, which is why the classical tradition, not Islamophobes, treated the sword verses as operative. Jesus's final commands run the other direction: 'put your sword back' (Matthew 26:52), and 'make disciples... teaching them' (Matthew 28:19-20).","quran":["Quran 9:5","Quran 9:29","Quran 2:256","Quran 8:39"],"hadith":["Sahih al-Bukhari 25"],"bible":["Matthew 26:52","Matthew 28:18-20","2 Corinthians 10:3-4"],"sources":[{"name":"Tafsir Ibn Kathir on 9:5","type":"primary","url":"https://quranx.com/Tafsir/Kathir/9.5"},{"name":"Sahih al-Bukhari 25","type":"primary","url":"https://sunnah.com/bukhari:25"},{"name":"Wikipedia — Sword Verse","type":"institutional","url":"https://en.wikipedia.org/wiki/Sword_Verse"},{"name":"Discover The Truth — An historical examination of the Sword Verse (Muslim rebuttal)","type":"muslim","url":"https://discover-the-truth.com/2016/04/22/an-historical-examination-of-the-sword-verse-surah-95/"}],"response":"Discover The Truth and other Muslim scholars answer that context confines both verses. Quran 9:1-4 addresses pagan tribes who violated their treaties; 9:4 explicitly exempts those who kept terms, and 9:6 commands escorting an enemy who seeks protection to safety. Quran 9:29 concerns hostile Byzantine-aligned powers ahead of Tabuk, not all Christians everywhere. The sweeping abrogation claims are attributed to individual exegetes rather than to consensus. Many classical scholars, and nearly all modern ones, hold 2:256 and 60:8 un-abrogated, making jihad defensive or state-conducted and never vigilante. And Bukhari 25's 'the people' is read as the specific treaty-breaking Arab polytheists, in line with the parallel narrations.","responseSource":{"name":"Discover The Truth — Sword Verse examination","url":"https://discover-the-truth.com/2016/04/22/an-historical-examination-of-the-sword-verse-surah-95/"},"verdict":"contested","rationale":"Contested is the honest grade. The contextual defence has genuine textual anchors in 9:4 and 9:6, and painting all Islam with Ad-Dahhak's maximalism would be the mirror error of Muslim apologists' minimalism. What the defence cannot dissolve is 9:29. It targets People of the Book as such, prescribing fighting until tribute and subjugation — a command that classical fiqh of every school operationalised for a millennium of expansionist jurisprudence. The contextual reading is historically the reformist position, not the classical one. The evangelistic use is precise, not polemical: ask which trajectory each founder's final commands set. This entry deliberately complements, without duplicating, the sharia and spread-by-sword entries.","severity":"high","plain":[{"t":"Why chronology decides everything","d":"The Quran is not arranged in the order it was revealed. Under <i>naskh</i>, later revelation governs earlier. So the question of which verses came last decides how the whole book reads."},{"t":"What Surah 9 says","d":"By Muslim consensus it is among the last revealed. Quran 9:5 commands: kill the polytheists wherever you find them, after the sacred months. Quran 9:29 commands fighting the People of the Book <b>\"until they pay the jizya with willing submission, and feel themselves subdued.\"</b> Muhammad's own summary is canonical: <b>\"I have been ordered to fight the people until they say: none has the right to be worshipped but Allah\"</b> (Sahih al-Bukhari 25)."},{"t":"How classical scholars read it","d":"Ibn Kathir records Ad-Dahhak's judgment. The Verse of the Sword cancelled every peace deal, treaty and term. Jurists across the schools built the doctrine of offensive jihad on that order. Quran 2:256, <i>no compulsion in religion</i>, is Medinan but earlier. That is why the classical tradition treated the sword verses as the live ones. Modern critics did not invent that."},{"t":"The Muslim answer, at full strength","d":"Discover The Truth answers that context limits both verses. Quran 9:1-4 speaks to pagan tribes who broke their treaties. Quran 9:4 exempts those who kept terms. Quran 9:6 orders that an enemy seeking safety be escorted to it. Quran 9:29 concerns hostile powers before Tabuk, not all Christians. The sweeping cancellation claims come from single scholars, not consensus. Many classical and nearly all modern scholars hold 2:256 and 60:8 to stand. That makes jihad defensive and state-run. And <i>the people</i> in Bukhari 25 means the treaty-breaking Arab tribes."},{"t":"How strong is this argument?","d":"Genuinely arguable. To paint all Islam with Ad-Dahhak would be the mirror error. What the defence cannot dissolve is 9:29. It names the People of the Book as such. It orders fighting until tribute and subjection. Every school ran on that for a thousand years. The context reading is the reformer's, not the classical one. So ask which way each founder's last words point. Matthew 26:52 and Matthew 28:18-20 point the other way."},{"say":true,"t":"What to say","d":"\"What were the last commands your prophet gave? Ours were to teach and to put the sword away.\""}],"rewritten":true,"refwhy":{"Matthew 26:52":"'Put up again thy sword', said when force was in reach. One of Jesus's last commands.","Matthew 28:18-20":"The last command: go and teach. This is the other path the case asks you to compare.","2 Corinthians 10:3-4":"Says our weapons are not carnal. How the early church read its own mission.","Quran 9:5":"The sword verse. Kill the idolaters after the sacred months. Late, which is why it counts.","Quran 9:29":"Fight the People of the Book until they pay the jizya. The part the context answer cannot dissolve.","Quran 2:256":"'No compulsion in religion.' Medinan, but earlier, which is why the order decides the reading.","Quran 8:39":"Fight until there is no strife and religion is all for Allah. The same theme in another surah.","Sahih al-Bukhari 25":"In Bukhari: 'I have been ordered to fight the people until they say' the confession. His own summary."},"titleLong":"Surah 9 and the chronology problem: which verses are Islam's last word?"},
{"id":"muhammad-bewitched","title":"A spell made Muhammad imagine what never happened","category":"muhammad-test","claim":"Sahih al-Bukhari 3268, narrated by Aisha, reports that a Jewish sorcerer, Labid ibn al-A'sam, worked magic on Muhammad using his hair and a comb, 'so that he began to imagine that he had done a thing which he had not really done'. By some accounts the state lasted months. Sahih Muslim 2189 carries the same account, so it is as authenticated as hadith get. The problem is double. Internally, the Quran indignantly denies the charge that Muhammad was 'a bewitched man' (17:47; 25:8), yet Islam's most authentic hadith affirm exactly that. And there is a deeper problem about knowledge. A prophet whose mind could be made to experience things that never happened, by a hostile magician, for an extended period during his revelatory career, has no way to certify which of his experiences were genuine. The biblical test excludes this outright, since God's true prophet is not overpowered by sorcery — 'there is no enchantment against Jacob' (Numbers 23:23) — and God's word does not come through a compromised channel (Deuteronomy 18:21-22).","quran":["Quran 25:8","Quran 17:47","Quran 113:1-5"],"hadith":["Sahih al-Bukhari 3268","Sahih Muslim 2189"],"bible":["Numbers 23:23","Deuteronomy 18:21-22","1 John 5:18"],"sources":[{"name":"Sahih al-Bukhari 3268","type":"primary","url":"https://sunnah.com/bukhari:3268"},{"name":"Answering Islam — Muhammad's bewitchment examined","type":"apologetics","url":"https://www.answering-islam.org/Responses/Menj/bewitchment.htm"},{"name":"IslamQA 68814 — The story of the magic and its meaning","type":"muslim","url":"https://islamqa.info/en/answers/68814"},{"name":"SeekersGuidance — Was the Prophet affected by magic?","type":"muslim","url":"https://islamqa.org/hanafi/seekersguidance-hanafi/224578/was-the-prophet-allah-bless-him-and-give-him-peace-affected-by-magic/"}],"response":"IslamQA 68814, SeekersGuidance and mainstream commentators respond that the magic affected only Muhammad's worldly, domestic life. The classical example is his imagining he had approached his wives when he had not. It never touched revelation, whose integrity Allah guarantees (5:67; 15:9). It was an illness like any bodily ailment prophets suffer. It ended in a miracle, since Allah revealed the spell's location and cure, as the hadith itself reports, with Surahs 113 and 114 linked to the deliverance. And 25:8's denial concerns the pagans' charge that the Quran itself was the product of sorcery, which is a different claim from the prophet suffering a temporary spell. Some early scholars and modernists simply rejected the report as contradicting the Quran.","responseSource":{"name":"IslamQA 68814","url":"https://islamqa.info/en/answers/68814"},"verdict":"unrefuted","rationale":"The 'worldly matters only' firewall is asserted, never demonstrated. The hadith's own description — believing he had done what he had not done — is a defect of perception and memory, the exact faculties revelation depends on. No criterion is offered by which Muhammad or anyone else could separate bewitched experiences from genuine ones. And the minority who reject the report to save the Quran, which is a live Muslim position, impale themselves on the hadith-epistemology dilemma. Bukhari's most rigorously authenticated Aisha material would fall, and Islamic method would fall with it. The internal tension with 25:8 is answered only by redescribing the pagans' charge. No resolution holds all three: sahih hadith, Quranic denial, and prophetic reliability.","severity":"medium","plain":[{"t":"What Bukhari reports","d":"Sahih al-Bukhari 3268 carries a report from Aisha. A Jewish man named Labid ibn al-A'sam worked magic on Muhammad, using his hair and a comb. The effect was that <b>\"he began to imagine that he had done a thing which he had not really done.\"</b> Some accounts say it lasted months. Sahih Muslim 2189 has the same account."},{"t":"The first problem is internal","d":"The Quran rejects the charge with heat. Quran 17:47 and 25:8 say the wrongdoers call him a bewitched man. Yet Islam's most trusted hadith say a spell was cast on him."},{"t":"The second problem is deeper","d":"A mind can be made to hold things that never happened. That is what the report says was done to him. If it can happen for months, during the years of revelation, how would he know which experiences were real? The Bible rules this out for a prophet. <b>\"There is no enchantment against Jacob\"</b> (Numbers 23:23)."},{"t":"The Muslim answer, at full strength","d":"IslamQA 68814 and SeekersGuidance answer that the magic touched only daily life. The classic example is thinking he had gone to his wives when he had not. It never touched revelation, which Allah guards (Quran 5:67; 15:9). It was an illness, and prophets fall ill. It ended in a miracle, since Allah showed him where the spell was and how to undo it. Surahs 113 and 114 are linked to that rescue. And 25:8 answers a different charge: that the Quran itself was the work of magic. Some early scholars and some modern ones simply reject the report."},{"t":"How strong is this argument?","d":"Strong for you, because no answer holds all three pieces. The wall between worldly and prophetic is asserted, never shown. The very faculties described are the ones revelation needs. And those who reject the report to save the Quran fall into the hadith problem instead. Bukhari's best Aisha material would go, and the method with it."},{"say":true,"t":"What to say","d":"\"How would he have known which experiences were real, during those months?\""}],"rewritten":true,"refwhy":{"Numbers 23:23":"'There is no enchantment against Jacob.' The rule this report is measured against.","Deuteronomy 18:21-22":"The prophet test again. It assumes the channel itself can be trusted.","1 John 5:18":"Says the wicked one does not touch the one born of God. The third piece of the contrast.","Quran 25:8":"The Quran hotly denies he is 'a bewitched man'. That denial is the internal tension.","Quran 17:47":"The same charge raised and rejected. Two verses, so it is not a passing remark.","Quran 113:1-5":"Surah al-Falaq, seeking refuge from those who blow on knots. Muslims tie it to the cure.","Sahih al-Bukhari 3268":"Aisha's report in Bukhari. He imagined he had done a thing he had not done. The core text.","Sahih Muslim 2189":"The same account in Sahih Muslim. It is as well attested as hadith get, which is the point."},"titleLong":"The bewitched prophet: Bukhari's magic spell and the reliability of revelation"},
{"id":"sins-cast-on-jews-christians","title":"Every Muslim's sins cast on a Jew or Christian","category":"salvation","claim":"Sahih Muslim preserves a startling soteriology. 'When it is the Day of Resurrection, Allah will deliver to every Muslim a Jew or a Christian and say: That is your rescue from Hell-Fire' (Sahih Muslim 2767a). The companion narrations are stronger still. Muslims will arrive 'with sins like mountains', and Allah will forgive the Muslims 'and place them on the Jews and Christians' instead. And: 'No Muslim dies but Allah admits in his stead a Jew or a Christian in Hell-Fire' (Sahih Muslim 2767b). This is substitutionary atonement inverted. The one innocent of those sins is damned in place of the guilty, by religious category, without consent, justice or love. The gospel's substitution is its precise mirror, since the sinless one voluntarily bears sin for the guilty — 'He himself bore our sins in his body on the tree' (1 Peter 2:24), 'the Lamb of God who takes away the sin of the world' (John 1:29). Every human heart senses that guilt must go somewhere. The two religions answer with opposite substitutes.","quran":["Quran 53:38","Quran 6:164"],"hadith":["Sahih Muslim 2767a","Sahih Muslim 2767b"],"bible":["1 Peter 2:24","John 1:29","Isaiah 53:5-6","2 Corinthians 5:21"],"sources":[{"name":"Sahih Muslim 2767b","type":"primary","url":"https://sunnah.com/muslim:2767b"},{"name":"Sahih Muslim 2767a (in context)","type":"primary","url":"https://sunnah.com/muslim/50/57-60"},{"name":"IslamQA 9488 — Meaning of the hadith about sins placed on the People of the Book","type":"muslim","url":"https://islamqa.info/en/answers/9488"},{"name":"Answering Islam (Shamoun) — How will a Muslim be saved according to the hadiths?","type":"apologetics","url":"https://www.answering-islam.org/authors/shamoun/saved_in_hadith.html"},{"name":"Street Theologian — Christians: a Muslim's ransom from hell?","type":"apologetics","url":"https://streettheologian.substack.com/p/christians-a-muslims-ransom-from"}],"response":"IslamQA 9488 explains that the unbelievers are not punished for the Muslims' sins, since that would contradict 'no bearer of burdens bears the burden of another' (6:164). Rather, the Jew or Christian enters Hell for his own disbelief. 'Ransom', or fida', is figurative. Each person has a place in Paradise and a place in Hell. When a Muslim is forgiven, the unbeliever inherits the vacated place in Hell that his own sins already earned, just as the Muslim inherits his place in Paradise, per the parallel in Muslim's collection. Al-Nawawi's commentary takes the wording as a metaphor for the fixed populations of the two abodes, so no injustice occurs.","responseSource":{"name":"IslamQA 9488","url":"https://islamqa.info/en/answers/9488"},"verdict":"admitted","rationale":"The hadith are sahih Muslim material, and IslamQA's harmonisation concedes that the wording needs rescuing. The 'inherited places' reading must flatly re-explain the sentence in which Allah forgives the Muslims and places their sins on the Jews and Christians, which states transfer, not vacancy. Even granting Al-Nawawi's metaphor, the admitted picture remains. Muslims with mountain-sized sins are forgiven, not through any atonement, but by category membership, while Jews and Christians serve as their counterweight. That is mercy without a ground, at the expense of justice, which is precisely the problem the cross answers (Romans 3:26). It is graded admitted since the texts and their canonical status are affirmed, and only the mechanics are debated. This is a powerful and underused bridge to substitution rightly understood.","severity":"medium","plain":[{"t":"The hadith","d":"Sahih Muslim 2767a describes the Day of Resurrection. Allah will give every Muslim a Jew or a Christian, and say: <b>\"That is your rescue from Hell-Fire.\"</b> The parallel reports go further. Muslims arrive with sins like mountains, and Allah forgives them and places those sins on the Jews and Christians. Sahih Muslim 2767b says: <b>\"No Muslim dies but Allah admits in his stead a Jew or a Christian in Hell-Fire.\"</b>"},{"t":"Why this is striking","d":"It is substitution turned upside down. Someone who did not commit those sins is damned in place of the one who did. It goes by group, not by choice. There is no consent, and no love in it."},{"t":"The gospel is its mirror","d":"The sinless one carries sin for the guilty, and does it willingly. <b>\"He himself bore our sins in his body on the tree\"</b> (1 Peter 2:24). <b>\"The Lamb of God who takes away the sin of the world\"</b> (John 1:29). Every heart senses that guilt has to go somewhere. The two faiths answer with opposite substitutes."},{"t":"The Muslim answer, at full strength","d":"IslamQA 9488 explains that no one is punished for another's sins, since Quran 6:164 forbids it. The unbeliever enters Hell for his own unbelief. Ransom, <i>fida'</i>, is figurative. Each person has a place in Paradise and a place in Hell. When a Muslim is forgiven, the unbeliever inherits the empty place in Hell. His own sins had already earned it. The Muslim inherits the place in Paradise. Al-Nawawi's commentary reads the wording as a picture of the fixed populations of the two homes."},{"t":"How strong is this argument?","d":"They admit the texts, and only the mechanics are argued. But the harmonisation has to re-explain a sentence that says transfer, not vacancy. Even granting Al-Nawawi, the picture that remains is stark. Mountain-sized sins are forgiven with no atonement at all, by group membership, with Jews and Christians as the counterweight. That is mercy without a ground, which is exactly what the cross answers (Romans 3:26)."},{"say":true,"t":"What to say","d":"\"Where do you think your sins go? Mine went somewhere, and someone agreed to take them.\""}],"rewritten":true,"refwhy":{"1 Peter 2:24":"'He himself bore our sins in his body on the tree.' The mirror image this case is built on.","John 1:29":"'The Lamb of God, which taketh away the sin of the world.' Substitution offered, not imposed.","Isaiah 53:5-6":"'The LORD hath laid on him the iniquity of us all.' The oldest form of the same idea.","2 Corinthians 5:21":"Says the sinless one was made sin for us. The exchange, stated most sharply.","Quran 53:38":"'No bearer of burdens bears the burden of another.' The verse the Muslim reply must square this with.","Quran 6:164":"The same rule again. It cuts both ways: Islam does reject transferred guilt, in the Quran.","Sahih Muslim 2767a":"In Sahih Muslim: a Jew or a Christian given to each Muslim as 'your rescue from Hell-Fire'.","Sahih Muslim 2767b":"In Sahih Muslim: no Muslim dies but another is put in his place. The sharper wording of the two."},"titleLong":"Islam's substitute: 'your ransom from the Fire — a Jew or a Christian'"},
{"id":"uzair-son-of-god","title":"Ezra as God's son: no Jew ever said it","category":"science-history","claim":"Quran 9:30 asserts as fact: 'The Jews say: Ezra (Uzair) is the son of Allah.' It is set in parallel with the Christian confession of Christ, and Allah's curse is pronounced on both groups for it. But no Jewish text, sect or tradition in the entire historical record calls Ezra the son of God. Not the Tanakh, the Talmud, the Mishnah, Philo, Josephus, Qumran, or any rabbinic source. Judaism's defining confession is the Shema (Deuteronomy 6:4), and deifying a scribe would be its ultimate blasphemy. Historians call the verse enigmatic precisely because the belief is unattested. The error matters doubly for dawah. An omniscient author does not misreport the theology of a community living in Medina alongside Muhammad. And the verse's symmetry — 'and the Christians say the Messiah is the son of Allah' — shows the Quran treating both sonship claims as parallel human inventions, misunderstanding the Christian claim it means to refute.","quran":["Quran 9:30"],"hadith":[],"bible":["Deuteronomy 6:4","Ezra 7:6-10","Nehemiah 8:1-8"],"sources":[{"name":"Answering Islam — Was Uzayr (Ezra) called the Son of God?","type":"apologetics","url":"https://www.answering-islam.org/Responses/Saifullah/ezra.htm"},{"name":"Wikipedia — Uzair","type":"institutional","url":"https://en.wikipedia.org/wiki/Uzair"},{"name":"Tafsir Ibn Kathir on 9:30","type":"primary","url":"https://quran.com/en/9:30/tafsirs/en-tafisr-ibn-kathir"},{"name":"IslamQA 164633 — A Jewish person rejecting what the Qur'an says about Uzayr","type":"muslim","url":"https://islamqa.info/en/answers/164633"}],"response":"Muslim commentators from al-Tabari onward answer that the verse reports a claim of some Jews, not all. Classical tafsir names individual Medinan Jews, such as Finhas. Others name a Yemeni or Arabian Jewish faction who honoured Ezra as restorer of the Torah, to the point of calling him Allah's son. Arabic, they say, permits attributing a subgroup's saying to the group. IslamQA 164633 adds that the absence from surviving Jewish literature proves little, since a small Arabian sect would leave no rabbinic paper trail. And some modern Muslim writers point to the exalted Ezra of 4 Ezra, or to the deified-scribe traditions around Enoch and Metatron, as the kind of setting the Quran could be indicting.","responseSource":{"name":"IslamQA 164633","url":"https://islamqa.info/en/answers/164633"},"verdict":"unrefuted","rationale":"The defence is an argument from silence about a sect for which the only evidence is the verse needing rescue. That is circular. The classical commentators also conflict with each other — one man, one delegation, a Yemeni sect. That shows they possessed no actual historical referent. 4 Ezra and the Metatron traditions never call Ezra God's son, and they belong to different figures and genres. The verse generalises, 'the Jews say', exactly as it does for Christians, where the Quran means the mainstream confession, so the subgroup reading is special pleading. As with the Mary-in-the-Trinity entry already in this app, the pattern is a polemicist misreporting his neighbours' beliefs, not omniscience.","severity":"medium","plain":[{"t":"What the verse states","d":"Quran 9:30 says as a fact: <b>\"The Jews say: Ezra (Uzair) is the son of Allah.\"</b> It is set in parallel with the Christian confession about Christ, and Allah's curse is pronounced on both groups for it."},{"t":"The problem","d":"No Jewish text or group in the record ever says this. Not the Tanakh. Not the Talmud or Mishnah. Not Philo, not Josephus, not Qumran, not any rabbinic source. The heart of Judaism is the Shema (Deuteronomy 6:4). Calling a scribe the son of God would be its worst blasphemy. Historians call the verse puzzling for exactly that reason."},{"t":"The Muslim answer, at full strength","d":"From al-Tabari onward, commentators say the verse reports some Jews, not all. Classical tafsir names individuals in Medina, such as Finhas, or a faction in Yemen or Arabia who honoured Ezra for restoring the Torah. Arabic can attribute a subgroup's saying to the group. IslamQA 164633 adds that absence from Jewish books proves little. A small Arabian sect would leave no paper trail. Some modern writers point to the exalted Ezra of 4 Ezra. Others point to the traditions about Enoch and Metatron, as the kind of setting the verse indicts."},{"t":"Where that runs out","d":"The defence rests on a sect whose only evidence is the verse needing rescue. That is circular. The classical commentators also disagree with each other. One man, one delegation, a Yemeni sect. That shows they had no real referent. And 4 Ezra and Metatron never call Ezra God's son."},{"t":"How strong is this argument?","d":"Strong for you, and pair it with the Mary case. The verse says <i>the Jews say</i>, exactly as it says <i>the Christians say</i>, where it means the mainstream confession. So the subgroup reading is special pleading. The pattern is a writer misreporting his neighbours' beliefs."},{"say":true,"t":"What to say","d":"\"I have never met a Jew who believes that. Have you?\""}],"rewritten":true,"refwhy":{"Deuteronomy 6:4":"The Shema. It is Judaism's core confession, and the reported belief would destroy it.","Ezra 7:6-10":"Who Ezra was: a scribe skilled in the law of Moses. Nothing in the account hints at more.","Nehemiah 8:1-8":"Ezra reading the law aloud to the people. The Bible's picture of him is a teacher.","Quran 9:30":"The verse itself: 'The Jews say Ezra is the son of Allah'. The case is this one line."},"titleLong":"'The Jews say Ezra is the son of Allah' — a claim no Jew ever made"},
{"id":"allah-name-polemic","title":"Drop it: Arab Christians said 'Allah' before Islam","category":"doctrine-of-god","claim":"A popular evangelical polemic claims that 'Allah' is intrinsically the name of a false deity, so Muslims linguistically worship someone other than the biblical God, and Christians must never use the word. The evidence is against the linguistic claim. 'Allah' is simply Arabic for God, from al-ilah, 'the God', and it is cognate with Hebrew Eloah and Elohim and with Aramaic Alaha — likely close to what Jesus's own Aramaic-speaking circle called God. Arab Christians used it before Muhammad existed. The trilingual Zabad inscription of 512 AD, on a church of St Sergius, opens its Arabic line invoking al-ilah. Pre-Islamic Christian Arab tribes prayed to Allah, and every Arabic Bible from the earliest translations to today renders 'God' as 'Allah'. Millions of Arab Christians confess Allah as Father, Son and Holy Spirit every Sunday. The real issue is conceptual, not lexical.","quran":["Quran 29:46","Quran 112:1-4"],"hadith":[],"bible":["Genesis 1:1","Mark 15:34","Acts 17:23-31"],"sources":[{"name":"Islamic Awareness — The Zebed inscription (512 CE)","type":"muslim","url":"https://www.islamic-awareness.org/history/islam/inscriptions/zebed"},{"name":"Wikipedia — Allah (etymology and pre-Islamic usage)","type":"institutional","url":"https://en.wikipedia.org/wiki/Allah"},{"name":"ResearchGate — Allah, Al-Ilah, and Allahumma: Arabic usage before the 9th century","type":"scholarly","url":"https://www.researchgate.net/publication/380923390_Allah_Al-Ilah_and_Allahumma_The_Arabic_Language_Usage_before_the_9th_century_AD_in_the_Christian-Muslim_Middle_Eastern"},{"name":"Sidney Griffith — The Church in the Shadow of the Mosque (Princeton UP)","type":"scholarly","url":"https://press.princeton.edu/books/paperback/9780691146287/the-church-in-the-shadow-of-the-mosque"}],"response":"Muslim apologists happily agree with the linguistic facts and press them further. Since Allah is the God of Abraham by name and heritage, and Quran 29:46 instructs Muslims to tell the People of the Book 'our God and your God is one', Christians who concede the shared name should concede a shared God, differing only in later corruptions such as the Trinity. On this footing Islam presents itself as the purification of Abrahamic monotheism rather than a rival deity's cult. Dawah regularly cites Arab Christian usage of 'Allah' as evidence that Islam worships the same God Christians do, merely more consistently.","responseSource":{"name":"Islamic Awareness — Zebed inscription","url":"https://www.islamic-awareness.org/history/islam/inscriptions/zebed"},"verdict":"answered","rationale":"This is graded answered. The polemic's factual core is simply wrong, and Muslim and Arab Christian sources answer it decisively, since 'Allah' predates Islam as the Arabic word for God and is used in Christian inscriptions and in every Arabic Bible. Christians who lead with it lose credibility with any Arabic-speaking hearer in the first minute. The entry's value is triage: drop the lexical argument, keep the conceptual one. Whether the Quran's Allah — a non-triune monad who is not Father, has no Son, and saves without atonement — accurately describes the God of Abraham is the real question, and this app's doctrine-of-god and tahrif entries prosecute it on ground that actually holds.","severity":"low","plain":[{"t":"The claim","d":"Some Christian material says <i>Allah</i> is the name of a false god. On that view Muslims worship someone else by the very word they use, and Christians must never say it."},{"t":"Why the claim fails","d":"<i>Allah</i> is simply Arabic for God. It comes from <i>al-ilah</i>, the God. It is the cousin of Hebrew <i>Eloah</i> and Aramaic <i>Alaha</i>. That is likely close to the word Jesus and his friends used for God."},{"t":"Arab Christians got there first","d":"They used it before Muhammad was born. The trilingual Zabad inscription of 512 AD, on a church of Saint Sergius, opens its Arabic line by calling on <i>al-ilah</i>. Pre-Islamic Christian Arab tribes prayed to Allah. Every Arabic Bible renders God as Allah. Millions of Arab Christians confess Allah as Father, Son and Holy Spirit every Sunday."},{"t":"How Muslims use this","d":"They agree with the facts and press them further. Quran 29:46 tells Muslims to say <b>\"our God and your God is one.\"</b> So if Christians grant the shared name, they should grant a shared God, differing only in what Islam calls our later corruptions. Islam then presents itself as Abrahamic faith purified, not a rival god's cult."},{"t":"Do not use this one","d":"Lead with it and you lose any Arabic speaker in the first minute. The real question is not what God is called. It is whether the Quran describes him truly — a God who is not Father, has no Son, and saves without atonement. Drop the word argument. Keep that one."},{"say":true,"t":"What to say","d":"\"Arab Christians have always called God Allah. The question is not the word. It is who he is.\""}],"rewritten":true,"refwhy":{"Genesis 1:1":"In every Arabic Bible this verse opens 'In the beginning Allah created'. That settles the word.","Mark 15:34":"Jesus cries 'Eloi, Eloi' from the cross. That is Aramaic for God, from the same root.","Acts 17:23-31":"Paul uses a pagan altar's own wording as a bridge. The method this case recommends.","Quran 29:46":"'Our God and your God is one.' Muslims press this once you grant the shared word.","Quran 112:1-4":"The real dispute, and not the word: a God who neither begets nor is born. Argue there."},"titleLong":"'Allah is a foreign god's name' — a polemic Christians should drop"},
{"id":"first-revelation-terror","title":"Terror in the cave: 'a poet or possessed'","category":"muhammad-test","claim":"By Islam's own most trusted sources, Muhammad's first encounter with revelation left him terrified and unable to identify its source. In Aisha's long narration (Sahih al-Bukhari 3, repeated at 6982), the being in the cave of Hira seized and squeezed him three times. He fled to Khadijah trembling, crying 'Cover me! Cover me!' and confessing 'I fear that something may happen to me.' Ibn Ishaq's sirah, Islam's earliest biography, records his own first hypotheses as the worst available: 'ecstatic poet or a man possessed... Woe is me' (Guillaume, Life of Muhammad, page 106). It took Khadijah and her cousin Waraqah bin Naufal — a Christian conversant with prior scripture — to pronounce the visitor divine. Sahih al-Bukhari 6982 then describes the fatra, the pause in revelation, during which, 'as we have heard', he grieved so deeply that he repeatedly 'intended to throw himself from the tops of high mountains'. Contrast Isaiah 6, Jeremiah 1 and Luke 1: fear is present, but God self-identifies, and the angel's first word is 'Fear not.'","quran":["Quran 96:1-5","Quran 74:1-2","Quran 73:1"],"hadith":["Sahih al-Bukhari 3","Sahih al-Bukhari 6982","Sahih Muslim 160"],"bible":["Isaiah 6:1-8","Jeremiah 1:4-10","Luke 1:13","Luke 1:26-38","Galatians 1:8"],"sources":[{"name":"Sahih al-Bukhari 6982 (sunnah.com)","type":"primary","url":"https://sunnah.com/bukhari:6982"},{"name":"Sahih al-Bukhari 3 (sunnah.com)","type":"primary","url":"https://sunnah.com/bukhari:3"},{"name":"Ibn Ishaq, Sirat Rasul Allah (A. Guillaume translation)","type":"primary","url":"https://archive.org/details/GuillaumeATheLifeOfMuhammad"},{"name":"Mahajjah — analysis of the mountain-peaks report","type":"muslim","url":"https://mahajjah.com/nabi-salla-llahu-alayhi-wa-sallam-was-so-grieved-by-the-intermission-of-revelation-that-he-almost-jumped-off-the-mountain-peaks/"},{"name":"Islam365 — Did the Prophet contemplate suicide?","type":"muslim","url":"https://islam365.io/topics/suicide.html"}],"response":"Mahajjah, a traditional Sunni scholarship portal, answers that terror is precisely what a genuine encounter with the transcendent produces. Moses fled from the sign at the bush (Quran 28:31). Fear also argues for sincerity, since an impostor invents a flattering commissioning, not one that leaves him suspecting madness. The mountain-tops line, they stress, is not Aisha's testimony at all. Ibn Hajar, in Fath al-Bari, identifies it as a balagh of al-Zuhri, introduced by fima balaghana, 'as we have heard', transmitted only in Ma'mar's recension and absent from those of 'Uqayl and Yunus. It is a disconnected report carrying no sahih weight. Waraqah's role is read as providence: a scholar of previous revelation recognising the same Namus, or angel, who came to Moses, which confirms continuity rather than supplying legitimacy Muhammad lacked.","responseSource":{"name":"Mahajjah (traditional Sunni scholarship portal)","url":"https://mahajjah.com/nabi-salla-llahu-alayhi-wa-sallam-was-so-grieved-by-the-intermission-of-revelation-that-he-almost-jumped-off-the-mountain-peaks/"},"verdict":"admitted","rationale":"This is graded admitted because every load-bearing fact sits in Islam's own canon and is undisputed: the terror, 'Cover me', 'I fear for myself', and the need for Waraqah, a Christian, to certify the encounter as divine (Bukhari 3 and 6982; Muslim 160). Honesty requires conceding the strongest Muslim point, and this site does. The suicidal-despair line is weak by Islam's own hadith science, resting on al-Zuhri's unattributed addendum via Ma'mar alone, so do not build the argument on it. Build it on what no one disputes. The recipient of the revelation could not himself identify its source, and the identification came from a human being. Biblical commissioning scenes carry divine self-identification, and Paul's warning about 'an angel from heaven' preaching another gospel frames the stakes (Galatians 1:8). The severity is high, because 'how do you know it was Gabriel?' touches the foundation of everything downstream.","severity":"high","plain":[{"t":"The account in Bukhari","d":"Sahih al-Bukhari 3, repeated at 6982, gives Aisha's long narration. In the cave of Hira a being seized and squeezed him three times. He fled to Khadijah shaking and cried <b>\"Cover me! Cover me!\"</b> He said: <b>\"I fear that something may happen to me.\"</b>"},{"t":"His own first guesses","d":"Ibn Ishaq's biography, Islam's earliest, records what he first thought it might be. The worst options available: <b>\"ecstatic poet or a man possessed... Woe is me\"</b> (Guillaume, page 106)."},{"t":"Who settled it","d":"Khadijah and her cousin Waraqah bin Naufal. Waraqah was a Christian who knew the earlier scriptures. He pronounced the visitor divine. Sahih Muslim 160 carries the account too."},{"t":"The Muslim answer, at full strength","d":"Mahajjah answers that terror is what meeting the transcendent produces. Moses fled from the sign at the bush (Quran 28:31). Fear also argues for sincerity, since an impostor invents a flattering call, not one that leaves him fearing madness. On the line about throwing himself from mountain tops in Bukhari 6982, they are right, and this site says so. Ibn Hajar, in <i>Fath al-Bari</i>, identifies it as a <i>balagh</i> of al-Zuhri — introduced by <i>fima balaghana</i>, as we have heard — carried only in Ma'mar's recension and absent from those of 'Uqayl and Yunus. It is not Aisha's testimony, and it carries no sahih weight. Waraqah's role, they say, is providence: a scholar of earlier revelation recognising the same angel who came to Moses."},{"t":"How strong is this argument?","d":"They admit the facts, and honesty means dropping the weakest part. Do not build on the suicide line; by Islam's own hadith science it is weak. Build on what nobody disputes. The one receiving the revelation could not identify its source, and the identification came from a man. Biblical callings run the other way, with God naming himself (Isaiah 6; Jeremiah 1; Luke 1). Galatians 1:8 warns about even an angel from heaven."},{"say":true,"t":"What to say","d":"\"How do you know the visitor in the cave was Gabriel? That is a real question, not a trap.\""}],"rewritten":true,"refwhy":{"Isaiah 6:1-8":"A call scene where God names himself, so the prophet knows who is speaking.","Jeremiah 1:4-10":"'The word of the LORD came unto me.' The source is stated, not worked out afterwards.","Luke 1:13":"The angel's first word to Zacharias is 'Fear not'. That is how these scenes open.","Luke 1:26-38":"Gabriel names himself to Mary and says who sent him. That is what the cave account lacks.","Galatians 1:8":"Warns that even an angel from heaven might preach another gospel. Why the question matters.","Quran 96:1-5":"The first words revealed: Read, in the name of your Lord. The cave passage itself.","Quran 74:1-2":"'O you who are wrapped up', told to rise and warn. Read as coming after the terror.","Quran 73:1":"The other 'wrapped in garments' opening. Both belong to the same early period.","Sahih al-Bukhari 3":"Aisha's long account in Bukhari. The squeezing, 'Cover me', and Waraqah settling what it was.","Sahih al-Bukhari 6982":"The same narration again in Bukhari. It also holds the weak line about the mountain tops.","Sahih Muslim 160":"The account is in Sahih Muslim too. So the terror and the doubt are in both sound books."},"titleLong":"The First Revelation: Terror, Doubt, and a Christian Referee"},
{"id":"quran-262-vs-385","title":"Quran 2:62 promises reward, 3:85 accepts only Islam","category":"salvation","claim":"Quran 2:62 promises that 'those who believed, and those who were Jews, and the Christians, and the Sabians — whoever believed in Allah and the Last Day and did righteousness — will have their reward with their Lord, and no fear will there be concerning them'. Quran 5:69 repeats the promise nearly verbatim. Yet Quran 3:85 declares: 'Whoever desires other than Islam as religion — never will it be accepted from him, and he, in the Hereafter, will be among the losers' (compare 3:19). The classical resolution concedes the tension. Al-Tabari's tafsir on 2:62 records Ibn Abbas saying the verse was abrogated by 3:85, though Mujahid and al-Dahhak held 2:62 muhkama, still standing, and al-Tabari himself preferred a restricted reading. Sahih Muslim 153 seals the exclusivist position, since any Jew or Christian who hears of Muhammad and dies without believing his message 'will be among the inhabitants of the Fire'. Modern scholars split between abrogation and restriction. Either way the two texts pull in opposite directions, and the abrogation solution is itself an admission of it.","quran":["Quran 2:62","Quran 5:69","Quran 3:19","Quran 3:85"],"hadith":["Sahih Muslim 153"],"bible":["John 14:6","Acts 4:12","Hebrews 13:8","James 1:17"],"sources":[{"name":"Quran 2:62 (quran.com)","type":"primary","url":"https://quran.com/2/62"},{"name":"Quran 3:85 (quran.com)","type":"primary","url":"https://quran.com/3/85"},{"name":"Sahih Muslim 153 (sunnah.com)","type":"primary","url":"https://sunnah.com/muslim:153"},{"name":"Yaqeen Institute — Abrogated Rulings in the Qur'an","type":"muslim","url":"https://yaqeeninstitute.org/read/paper/abrogated-rulings-in-the-quran-discerning-their-divine-wisdom"},{"name":"Answering Islam — Abrogated Verses of the Quran","type":"apologetics","url":"https://answering-islam.net/Quran/abrogatedverses.html"}],"response":"Most Muslim exegetes deny any contradiction, and the Yaqeen Institute sets out the case. On the majority reading, 2:62 addresses Jews, Christians and Sabians who lived faithfully before Muhammad, or who accept him once his message reaches them. 'Whoever believed in Allah and the Last Day' is read as belief on Islam's own terms, which after 610 AD includes Muhammad's prophethood. Others note that when Ibn Abbas said naskh he frequently meant takhsis, specification, rather than repeal, so 3:85 clarifies the scope of 2:62 rather than cancelling a salvation once offered. On this view the verses teach one consistent doctrine across time: every era's believers must follow the prophet sent to them, and after Muhammad that means Islam. The Quran, they argue, elsewhere criticises Jews and Christians precisely for failing their own covenants, so 2:62 was never a blanket pluralism.","responseSource":{"name":"Yaqeen Institute — Abrogated Rulings in the Qur'an","url":"https://yaqeeninstitute.org/read/paper/abrogated-rulings-in-the-quran-discerning-their-divine-wisdom"},"verdict":"contested","rationale":"This is graded contested, not unrefuted, because the restriction reading is a coherent harmonisation the Arabic can bear, and it was held by classical authorities including Mujahid, al-Dahhak and arguably al-Tabari himself. This site does not overclaim. But the argument retains real force. The harmonisation must be imported, since nothing in 2:62's wording limits it to a past era. The abrogation report preserved in Islam's own premier tafsir concedes that the earliest readers felt the collision. And Sahih Muslim 153 makes the operative doctrine unambiguous. The evangelistic use is not a gotcha but clarity. A Muslim friend citing 2:62 as proof that Islam honours Christians should know that their own tradition denies that Christians who remain Christians are saved. Contrast the New Testament's single consistent claim (John 14:6; Acts 4:12) with a God 'with whom there is no variation' (James 1:17).","severity":"high","plain":[{"t":"The two verses","d":"Quran 2:62 promises that those who believed, and the Jews, and the Christians, and the Sabians — <b>\"whoever believed in Allah and the Last Day and did righteousness\"</b> — will have their reward, with no fear upon them. Quran 5:69 repeats it almost word for word. Quran 3:85 says: <b>\"Whoever desires other than Islam as religion — never will it be accepted from him.\"</b> Quran 3:19 says the same."},{"t":"How the classical scholars handled it","d":"They felt the collision. Al-Tabari's tafsir on 2:62 records Ibn Abbas saying the verse was abrogated by 3:85. Mujahid and al-Dahhak held that 2:62 still stands. Al-Tabari himself preferred a narrowed reading."},{"t":"What settles it in practice","d":"Sahih Muslim 153 is unambiguous. Any Jew or Christian who hears of Muhammad and dies without believing his message <b>\"will be among the inhabitants of the Fire.\"</b>"},{"t":"The Muslim answer, at full strength","d":"The Yaqeen Institute argues there is no contradiction. On the majority reading, 2:62 addresses Jews, Christians and Sabians who lived faithfully before Muhammad, or who accept him once his message reaches them. <b>\"Whoever believed in Allah and the Last Day\"</b> means belief on Islam's terms, which after 610 AD includes Muhammad's prophethood. Others note that when Ibn Abbas said <i>naskh</i> he often meant <i>takhsis</i>, specification, not repeal. So 3:85 clarifies the scope rather than cancelling a promise. On that view one doctrine holds across time: each era's believers follow the prophet sent to them."},{"t":"How strong is this argument?","d":"Genuinely arguable, so do not overclaim. The narrowing reading is coherent, and classical authorities held it. But nothing in 2:62's wording limits it to a past era, so the limit has to be imported. And the abrogation report in Islam's own premier tafsir shows the earliest readers felt the clash. Use it for clarity, not for a win: a friend who quotes 2:62 to show Islam honours Christians should know what his own tradition says next."},{"say":true,"t":"What to say","d":"\"You quoted 2:62 to me. May I show you what Sahih Muslim 153 says beside it?\""}],"rewritten":true,"refwhy":{"John 14:6":"'No man cometh unto the Father, but by me.' One claim, held steadily. That is the contrast.","Acts 4:12":"'No other name under heaven' by which we must be saved. The same claim, said by Peter.","Hebrews 13:8":"Jesus Christ the same yesterday, today and for ever. Cited because this case is about a shifting rule.","James 1:17":"God has no 'variableness, neither shadow of turning'. Quoted in the case for the same reason.","Quran 2:62":"The open promise to Jews, Christians and Sabians. This is the verse a Muslim friend may quote you.","Quran 5:69":"The same promise, almost word for word. The repeat is why it is hard to set aside.","Quran 3:19":"Says the religion with Allah is Islam. The narrowing half of the pair.","Quran 3:85":"'Whoever desires other than Islam' will not have it accepted. The verse said to cancel 2:62.","Sahih Muslim 153":"In Sahih Muslim: a Jew or Christian who hears of him and dies without believing is of the Fire."},"titleLong":"Are Jews and Christians Saved? Quran 2:62 vs 3:85"},
{"id":"slavery-never-abolished","title":"Slavery regulated, never abolished: Saudi 1962, Mauritania 1981","category":"practice","claim":"Islamic law softened slavery but never ended it. The Quran makes captive women lawful to their captors — 'and prohibited to you are married women, except those your right hands possess' (4:24; compare 33:50). Freeing a slave earns reward (Sahih al-Bukhari 2517), and papers of release are urged (24:33). Yet owning a slave stayed lawful in every classical school. By the sahih sources, Muhammad owned, bought, sold and freed slaves. He bought a slave for two black slaves (Sahih Muslim 1602). He took captives from Banu Mustaliq (Sahih al-Bukhari 2541). He held Mariyah the Copt as a concubine. No Muslim state ended slavery from within sharia. The end came under Western and colonial pressure. Saudi Arabia in 1962. Oman in 1970. Mauritania in 1981, the last country on earth, and a crime there only from 2007, with campaign groups still finding cases. In 2014 ISIS brought back sex slavery of Yazidi women, announced in Dabiq issue 4 as 'The Revival of Slavery Before the Hour', citing classical fiqh directly. The law of Moses, by contrast, set rules with release built in. There was release in the seventh year (Exodus 21:2), death for stealing a man (Exodus 21:16), and shelter rather than return for an escaped slave (Deuteronomy 23:15-16). And the movement that ended the trade was led mostly by Christians, through Wilberforce and the Quakers.","quran":["Quran 4:24","Quran 33:50","Quran 24:33","Quran 16:71"],"hadith":["Sahih Muslim 1602","Sahih al-Bukhari 2541","Sahih al-Bukhari 2517"],"bible":["Exodus 21:2","Exodus 21:16","Deuteronomy 23:15-16","Philemon 1:15-16","Galatians 3:28"],"sources":[{"name":"Quran 4:24 (quran.com)","type":"primary","url":"https://quran.com/4/24"},{"name":"Sahih Muslim 1602 (sunnah.com)","type":"primary","url":"https://sunnah.com/muslim:1602"},{"name":"IslamQA 94840 — Slavery in Islam","type":"muslim","url":"https://islamqa.info/en/answers/94840"},{"name":"Brandeis University — Islam and Slavery (Feminist Sexual Ethics Project)","type":"scholarly","url":"https://www.brandeis.edu/projects/fse/muslim/slavery.html"},{"name":"CNN — Slavery's Last Stronghold (Mauritania)","type":"journalism","url":"https://www.cnn.com/interactive/2012/03/world/mauritania.slaverys.last.stronghold/index.html"}],"response":"IslamQA 94840 defends slow release and direction of travel. Islam inherited a world economy built on slaves and turned it toward freedom. Freeing a slave pays for a broken oath and other sins. It is one of the set uses of zakat (9:60), and among the most praised acts of piety. Masters must feed and clothe slaves as themselves. The mukataba contract (24:33) let slaves buy their freedom. Muhammad freed slaves, and raised one, Zayd, to be his adopted son and an army commander. Modern scholars add that treaty duties bind under sharia. So the treaties that ended slavery bind Muslim states too, and the slave-raiding of groups like ISIS breaks that consensus. On this account the method was freedom by attrition, and abolition fulfils the intent rather than opposing it.","responseSource":{"name":"IslamQA 94840 — Slavery in Islam","url":"https://islamqa.info/en/answers/94840"},"verdict":"admitted","rationale":"This is graded admitted because the core facts are conceded on all sides. IslamQA affirms today that slavery was never forbidden by sharia. The direction-of-travel defence explains the softening. It does not explain the thirteen centuries in which no school and no state took the last step. Nor why the end arrived only under outside pressure. Nor why ISIS could cite mainstream classical fiqh rather than fringe texts. Be honest about the Bible. The law of Moses also set rules for slavery rather than ending it, and Christians long misused Scripture to defend it. The difference is direction. There are release rules, the death penalty for man-stealing, Deuteronomy's shelter for those who run, and Philemon's 'no longer as a slave but as a beloved brother'. And the movement that ended it was driven by Christian conviction. Use this comparison carefully, and concede Christian failures first. The argument is strongest when it stays about texts and legal systems, not about whose ancestors behaved better.","severity":"high","plain":[{"t":"What the law says","d":"Islamic law set rules for slavery. It never ended it. Quran 4:24 makes captive women lawful to their captors, with 33:50 beside it. Freeing a slave is praised (Sahih al-Bukhari 2517). Papers of release are urged (Quran 24:33). But owning a slave stayed lawful in every school. Muhammad owned, bought, sold and freed slaves. He bought one for two black slaves (Sahih Muslim 1602). He took captives from Banu Mustaliq (Sahih al-Bukhari 2541). He held Mariyah the Copt as a concubine."},{"t":"How it ended","d":"Not from within. Saudi Arabia ended it in 1962. Oman in 1970. Mauritania in 1981, the last land on earth. It was made a crime there only in 2007, and groups still find it. In 2014 ISIS brought back sex slavery of Yazidi women. Its own magazine <i>Dabiq</i> cited the old law books to defend it."},{"t":"Be honest about the Bible first","d":"The law of Moses also set rules for slavery. It did not end it. And Christians long twisted Scripture to defend it. Say that first. The difference is which way each road runs. Release in the seventh year (Exodus 21:2). Death for stealing a man (Exodus 21:16). Shelter, not return, for one who runs (Deuteronomy 23:15-16). Paul asks Philemon to take Onesimus back <b>\"no longer as a slave but as a beloved brother.\"</b> And the men who ended the trade were mostly Christians — Wilberforce, and the Quakers."},{"t":"The Muslim answer, at full strength","d":"IslamQA 94840 argues for slow release. Islam took up a world built on slaves and bent it toward freedom. Freeing a slave pays for a broken oath and other sins. It is one of the uses of zakat (Quran 9:60). Masters must feed and clothe slaves as themselves. The <i>mukataba</i> paper let a slave buy his freedom (24:33). Muhammad freed slaves, and raised Zayd to be his adopted son and a commander. Modern scholars add that treaties bind under sharia. So the treaties that ended slavery bind too, and groups like ISIS break that consensus."},{"t":"How strong is this argument?","d":"They admit the core, IslamQA included. The slow-release answer explains the kindness. It does not explain the thirteen centuries in which no school and no state took the last step. Nor why the end came from outside. Nor why ISIS could quote the mainstream law books, not fringe ones. Use it gently, and own our failures first."},{"say":true,"t":"What to say","d":"\"Both our books set rules for slavery, and Christians got this badly wrong. May I show you where the two roads part?\""}],"rewritten":true,"refwhy":{"Exodus 21:2":"Release in the seventh year. One of the release rules built into the law of Moses.","Exodus 21:16":"Death for stealing a man. It outlaws the slave trade at its source.","Deuteronomy 23:15-16":"A slave who runs is to be sheltered, not sent back. The sharpest break with the ancient world.","Philemon 1:15-16":"Paul asks for Onesimus back 'no longer as a slave but as a beloved brother'. Quoted in the case.","Galatians 3:28":"'Neither bond nor free' in Christ. The line the abolitionists came back to again and again.","Quran 4:24":"Makes captive women lawful to their captors. The base of concubinage in the law.","Quran 33:50":"Applies the same rule inside the Prophet's own household.","Quran 24:33":"The mukataba paper, by which a slave could buy his freedom. The Muslim reply's best verse.","Quran 16:71":"Speaks of masters and those their right hands possess. It regulates the system rather than ending it.","Sahih Muslim 1602":"In Sahih Muslim: he buys a slave for two black slaves. Owning and trading, in a sound book.","Sahih al-Bukhari 2541":"In Bukhari: captives taken from Banu Mustaliq. It shows where slaves came from.","Sahih al-Bukhari 2517":"Cuts the other way, and the case says so. In Bukhari, freeing a slave is highly praised."},"titleLong":"Slavery: Regulated Forever, Abolished from Outside"},
{"id":"fgm-classical-fiqh","title":"Female circumcision, obligatory in one Sunni school","category":"practice","claim":"Classical Islamic law addresses female circumcision, and one school mandated it. The Shafi'i manual Umdat al-Salik, or Reliance of the Traveller, rules at e4.3 that circumcision is obligatory, wajib, for both sexes, and its English edition was certified by al-Azhar. It describes the female form as cutting the prepuce of the clitoris, with translation disputes over whether the Arabic bazr means the prepuce or the clitoris itself. Hanbalis were split between obligatory and honourable. Hanafis and Malikis called it recommended or noble, a makrumah, and not required. IslamQA's current answer 60314 still defends the practice as part of the fitrah. The main supporting hadith is Umm Atiyyah's, in which Muhammad says 'do not cut severely, as that is better for a woman and more desirable for a husband' (Sunan Abi Dawud 5271). Abu Dawud himself declared it weak, 'not strong', and mursal, as did al-Iraqi and al-Azimabadi, though al-Albani later authenticated it via corroborating chains. Practice tracks madhhab geography — Shafi'i Southeast Asia, Egypt, the Horn of Africa — but the custom predates Islam and exists among non-Muslims in those regions. The 2006 al-Azhar conference condemned FGM as criminal aggression, and Grand Mufti Ali Gomaa's 2007 fatwa forbade it.","quran":[],"hadith":["Sunan Abi Dawud 5271","Sahih Muslim 349"],"bible":["Genesis 1:27","1 Corinthians 7:3-5"],"sources":[{"name":"Reliance of the Traveller (Umdat al-Salik), e4.3","type":"primary","url":"https://archive.org/details/sharia-reliance-of-the-traveller"},{"name":"Sunan Abi Dawud 5271 (sunnah.com)","type":"primary","url":"https://sunnah.com/abudawud:5271"},{"name":"IslamQA 60314 — Circumcision of girls","type":"muslim","url":"https://islamqa.info/en/answers/60314"},{"name":"Stop FGM Middle East — Fatwas against FGM","type":"institutional","url":"http://www.stopfgmmideast.org/fatwas-against-fgm/"},{"name":"UNICEF Egypt — FGM summary","type":"institutional","url":"https://www.unicef.org/egypt/media/3576/file/FGM%20Summary.pdf"}],"response":"Muslim scholars opposing the practice argue the case from inside the tradition. The Umm Atiyyah hadith is weak by Abu Dawud's own assessment, so no obligation can be built on it. Nothing in the Quran addresses the practice at all. And the sharia's governing principle of la darar, no harm, forbids any procedure that medicine shows to be injurious. The Fiqh Council of North America and Grand Mufti Ali Gomaa have ruled FGM prohibited outright, and the 2006 al-Azhar conference called it punishable aggression. Defenders of the classical position, meanwhile, insist the fiqh only ever sanctioned a minimal symbolic cut — the 'do not cut severely' wording itself — and that severe forms such as infibulation are pre-Islamic African custom the jurists never endorsed, practised by Christians and animists in the same regions.","responseSource":{"name":"Fiqh Council of North America — Fatwa on female genital cutting","url":"https://fiqhcouncil.org/fatwa-on-female-circumcision/"},"verdict":"contested","rationale":"This is graded contested because the honest picture cuts both ways. The textual basis is weak, by Abu Dawud's own grading, and there is no Quranic support. Major Muslim authorities now prohibit the practice, and the custom is regional and pre-Islamic. Yet it remains true that classical fiqh canonised rather than abolished it, that one school made it obligatory, and that IslamQA defends it today. State every one of those clauses or state none. The pastoral guidance is emphatic. This topic is explosive and almost always counterproductive in personal evangelism. It exists in this database for completeness, and for the rare context where a Muslim friend has raised comparative arguments about women's status and expects candour in return. Never open with it. Never use it as a weapon. Lead with listening. A Muslim friend likely finds FGM as abhorrent as you do, and treating him as its defender is both unjust and conversation-ending.","severity":"medium","plain":[{"t":"Handle this one with great care","d":"This topic is explosive and almost always unhelpful in a friendship. It is here for completeness. Never open with it. Your friend very likely finds the practice as terrible as you do. Treating him as its defender is unjust and ends the conversation."},{"t":"What classical law says","d":"The schools differ. The Shafi'i manual <i>Umdat al-Salik</i>, known as <i>Reliance of the Traveller</i>, rules circumcision obligatory for both sexes at e4.3. Its English edition was certified by al-Azhar. It describes the female form as cutting the prepuce of the clitoris, though translators dispute whether the Arabic <i>bazr</i> means the prepuce or the clitoris itself. Hanbalis were split between obligatory and honourable. Hanafis and Malikis called it recommended, a <i>makrumah</i>, not required. IslamQA 60314 still defends it as part of the <i>fitrah</i>."},{"t":"The hadith it rests on","d":"Umm Atiyyah reports that Muhammad said <b>\"do not cut severely, as that is better for a woman and more desirable for a husband\"</b> (Sunan Abi Dawud 5271). Abu Dawud himself called it not strong, and <i>mursal</i>. Al-Iraqi and al-Azimabadi agreed. Al-Albani later graded it authentic through supporting chains."},{"t":"What Muslims themselves have done","d":"Practice follows school geography. It is found in Shafi'i Southeast Asia, in Egypt, and in the Horn of Africa. But the custom is older than Islam, and non-Muslims there do it too. The 2006 al-Azhar conference condemned it as criminal aggression. Grand Mufti Ali Gomaa forbade it by fatwa in 2007. The Fiqh Council of North America ruled it prohibited outright."},{"t":"How strong is this argument?","d":"Genuinely arguable, and state every clause or none. The textual basis is weak, by Abu Dawud's own grading, and the Quran says nothing about it. Major authorities now forbid it, citing <i>la darar</i>, no harm. The custom is regional and older than Islam. Yet classical <i>fiqh</i> canonised rather than abolished it, one school made it obligatory, and IslamQA defends it today."},{"say":true,"t":"What to say","d":"\"You raised women's status, so I will be straight with you. May I ask what you make of Reliance of the Traveller here?\""}],"rewritten":true,"refwhy":{"Genesis 1:27":"Male and female made in God's image. The ground the Christian objection stands on.","1 Corinthians 7:3-5":"Paul gives husband and wife an equal claim on each other. Set against a cut made for a husband.","Sunan Abi Dawud 5271":"The whole textual basis. Abu Dawud himself called it weak and mursal; al-Albani later graded it sound.","Sahih Muslim 349":"In Sahih Muslim: the bath is due 'when the two circumcised parts meet'. Cited as proof the practice existed."},"titleLong":"Female Circumcision in Classical Fiqh: A Weak Hadith with a Long Shadow"},
