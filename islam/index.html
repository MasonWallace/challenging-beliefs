 yet have believed."}]},"Philippians 2:6-11":{"ref":"Philippians 2","verses":[{"v":6,"t":"Who, being in the form of God, thought it not robbery to be equal with God:"},{"v":7,"t":"But made himself of no reputation, and took upon him the form of a servant, and was made in the likeness of men:"},{"v":8,"t":"And being found in fashion as a man, he humbled himself, and became obedient unto death, even the death of the cross."},{"v":9,"t":"Wherefore God also hath highly exalted him, and given him a name which is above every name:"},{"v":10,"t":"That at the name of Jesus every knee should bow, of things in heaven, and things in earth, and things under the earth;"},{"v":11,"t":"And that every tongue should confess that Jesus Christ is Lord, to the glory of God the Father."}]},"Daniel 7:13-14":{"ref":"Daniel 7","verses":[{"v":13,"t":"I saw in the night visions, and, behold, one like the Son of man came with the clouds of heaven, and came to the Ancient of days, and they brought him near before him."},{"v":14,"t":"And there was given him dominion, and glory, and a kingdom, that all people, nations, and languages, should serve him: his dominion is an everlasting dominion, which shall not pass away, and his kingdom that which shall not be destroyed."}]},"Quran 21:105":{"ref":"Surah Al-Anbya (21)","verses":[{"v":105,"t":"And verily we have written in the Scripture, after the Reminder: My righteous slaves will inherit the earth:"}]},"Quran 19:28":{"ref":"Surah Maryam (19)","verses":[{"v":28,"t":"O sister of Aaron! Thy father was not a wicked man nor was thy mother a harlot."}]},"Quran 5:31":{"ref":"Surah Al-Ma'idah (5)","verses":[{"v":31,"t":"Then Allah sent a raven scratching up the ground, to show him how to hide his brother's naked corpse. He said: Woe unto me! Am I not able to be as this raven and so hide my brother's naked corpse? And he became repentant."}]},"Quran 7:157":{"ref":"Surah Al-A'raf (7)","verses":[{"v":157,"t":"Those who follow the messenger, the Prophet who can neither read nor write, whom they will find described in the Torah and the Gospel (which are) with them. He will enjoin on them that which is right and forbid them that which is wrong. He will make lawful for them all good things and prohibit for them only the foul; and he will relieve them of their burden and the fetters that they used to wear. Then those who believe in him, and honour him, and help him, and follow the light which is sent down with him: they are the successful."}]},"Psalm 37:29":{"ref":"Psalms 37","verses":[{"v":29,"t":"The righteous shall inherit the land, and dwell therein for ever."}]},"Matthew 5:17":{"ref":"Matthew 5","verses":[{"v":17,"t":"Think not that I am come to destroy the law, or the prophets: I am not come to destroy, but to fulfil."}]},"Luke 24:44":{"ref":"Luke 24","verses":[{"v":44,"t":"And he said unto them, These are the words which I spake unto you, while I was yet with you, that all things must be fulfilled, which were written in the law of Moses, and in the prophets, and in the psalms, concerning me."}]},"2 Timothy 3:16":{"ref":"2 Timothy 3","verses":[{"v":16,"t":"All scripture is given by inspiration of God, and is profitable for doctrine, for reproof, for correction, for instruction in righteousness:"}]},"Quran 5:46-48":{"ref":"Surah Al-Ma'idah (5)","verses":[{"v":46,"t":"And We caused Jesus, son of Mary, to follow in their footsteps, confirming that which was (revealed) before him in the Torah, and We bestowed on him the Gospel wherein is guidance and a light, confirming that which was (revealed) before it in the Torah - a guidance and an admonition unto those who ward off (evil)."},{"v":47,"t":"Let the People of the Gospel judge by that which Allah hath revealed therein. Whoso judgeth not by that which Allah hath revealed: such are evil-livers."},{"v":48,"t":"And unto thee have We revealed the Scripture with the truth, confirming whatever Scripture was before it, and a watcher over it. So judge between them by that which Allah hath revealed, and follow not their desires away from the truth which hath come unto thee. For each We have appointed a divine law and a traced-out way. Had Allah willed He could have made you one community. But that He may try you by that which He hath given you (He hath made you as ye are). So vie one with another in good works. Unto Allah ye will all return, and He will then inform you of that wherein ye differ."}]},"Quran 5:66":{"ref":"Surah Al-Ma'idah (5)","verses":[{"v":66,"t":"If they had observed the Torah and the Gospel and that which was revealed unto them from their Lord, they would surely have been nourished from above them and from beneath their feet. Among them there are people who are moderate, but many of them are of evil conduct."}]},"Quran 57:27":{"ref":"Surah Al-Hadid (57)","verses":[{"v":27,"t":"Then We caused Our messengers to follow in their footsteps; and We caused Jesus, son of Mary, to follow, and gave him the Gospel, and placed compassion and mercy in the hearts of those who followed him. But monasticism they invented - We ordained it not for them - only seeking Allah's pleasure, and they observed it not with right observance. So We give those of them who believe their reward, but many of them are evil-livers."}]},"Mark 1:1":{"ref":"Mark 1","verses":[{"v":1,"t":"The beginning of the gospel of Jesus Christ, the Son of God;"}]},"Luke 1:1-4":{"ref":"Luke 1","verses":[{"v":1,"t":"Forasmuch as many have taken in hand to set forth in order a declaration of those things which are most surely believed among us,"},{"v":2,"t":"Even as they delivered them unto us, which from the beginning were eyewitnesses, and ministers of the word;"},{"v":3,"t":"It seemed good to me also, having had perfect understanding of all things from the very first, to write unto thee in order, most excellent Theophilus,"},{"v":4,"t":"That thou mightest know the certainty of those things, wherein thou hast been instructed."}]},"Romans 1:1-4":{"ref":"Romans 1","verses":[{"v":1,"t":"Paul, a servant of Jesus Christ, called to be an apostle, separated unto the gospel of God,"},{"v":2,"t":"(Which he had promised afore by his prophets in the holy scriptures,)"},{"v":3,"t":"Concerning his Son Jesus Christ our Lord, which was made of the seed of David according to the flesh;"},{"v":4,"t":"And declared to be the Son of God with power, according to the spirit of holiness, by the resurrection from the dead:"}]},"1 Corinthians 15:1-8":{"ref":"1 Corinthians 15","verses":[{"v":1,"t":"Moreover, brethren, I declare unto you the gospel which I preached unto you, which also ye have received, and wherein ye stand;"},{"v":2,"t":"By which also ye are saved, if ye keep in memory what I preached unto you, unless ye have believed in vain."},{"v":3,"t":"For I delivered unto you first of all that which I also received, how that Christ died for our sins according to the scriptures;"},{"v":4,"t":"And that he was buried, and that he rose again the third day according to the scriptures:"},{"v":5,"t":"And that he was seen of Cephas, then of the twelve:"},{"v":6,"t":"After that, he was seen of above five hundred brethren at once; of whom the greater part remain unto this present, but some are fallen asleep."},{"v":7,"t":"After that, he was seen of James; then of all the apostles."},{"v":8,"t":"And last of all he was seen of me also, as of one born out of due time."}]},"Galatians 1:8-9":{"ref":"Galatians 1","verses":[{"v":8,"t":"But though we, or an angel from heaven, preach any other gospel unto you than that which we have preached unto you, let him be accursed."},{"v":9,"t":"As we said before, so say I now again, If any man preach any other gospel unto you than that ye have received, let him be accursed."}]},"Quran 18:86":{"ref":"Surah Al-Kahf (18)","verses":[{"v":86,"t":"Till, when he reached the setting-place of the sun, he found it setting in a muddy spring, and found a people thereabout. We said: O Dhu'l-Qarneyn! Either punish or show them kindness."}]},"Quran 18:90":{"ref":"Surah Al-Kahf (18)","verses":[{"v":90,"t":"Till, when he reached the rising-place of the sun, he found it rising on a people for whom We had appointed no shelter therefrom."}]},"Quran 36:38-40":{"ref":"Surah Ya-Sin (36)","verses":[{"v":38,"t":"And the sun runneth on unto a resting-place for him. That is the measuring of the Mighty, the Wise."},{"v":39,"t":"And for the moon We have appointed mansions till she return like an old shrivelled palm-leaf."},{"v":40,"t":"It is not for the sun to overtake the moon, nor doth the night outstrip the day. They float each in an orbit."}]},"Quran 86:5-7":{"ref":"Surah At-Tariq (86)","verses":[{"v":5,"t":"So let man consider from what he is created."},{"v":6,"t":"He is created from a gushing fluid"},{"v":7,"t":"That issued from between the loins and ribs."}]},"Quran 23:12-14":{"ref":"Surah Al-Mu'minun (23)","verses":[{"v":12,"t":"Verily We created man from a product of wet earth;"},{"v":13,"t":"Then placed him as a drop (of seed) in a safe lodging;"},{"v":14,"t":"Then fashioned We the drop a clot, then fashioned We the clot a little lump, then fashioned We the little lump bones, then clothed the bones with flesh, and then produced it as another creation. So blessed be Allah, the Best of creators!"}]},"Quran 22:5":{"ref":"Surah Al-Hajj (22)","verses":[{"v":5,"t":"O mankind! if ye are in doubt concerning the Resurrection, then lo! We have created you from dust, then from a drop of seed, then from a clot, then from a little lump of flesh shapely and shapeless, that We may make (it) clear for you. And We cause what We will to remain in the wombs for an appointed time, and afterward We bring you forth as infants, then (give you growth) that ye attain your full strength. And among you there is he who dieth (young), and among you there is he who is brought back to the most abject time of life, so that, after knowledge, he knoweth naught. And thou (Muhammad) seest the earth barren, but when We send down water thereon, it doth thrill and swell and put forth every lovely kind (of growth)."}]},"Quran 75:37-39":{"ref":"Surah Al-Qiyamah (75)","verses":[{"v":37,"t":"Was he not a drop of fluid which gushed forth?"},{"v":38,"t":"Then he became a clot; then (Allah) shaped and fashioned"},{"v":39,"t":"And made of him a pair, the male and female."}]},"Quran 66:12":{"ref":"Surah At-Tahrim (66)","verses":[{"v":12,"t":"And Mary, daughter of 'Imran, whose body was chaste, therefor We breathed therein something of Our Spirit. And she put faith in the words of her Lord and His scriptures, and was of the obedient."}]},"Quran 3:35-36":{"ref":"Surah Ali 'Imran (3)","verses":[{"v":35,"t":"(Remember) when the wife of 'Imran said: My Lord! I have vowed unto Thee that which is in my belly as a consecrated (offering). Accept it from me. Lo! Thou, only Thou, art the Hearer, the Knower!"},{"v":36,"t":"And when she was delivered she said: My Lord! Lo! I am delivered of a female - Allah knew best of what she was delivered - the male is not as the female; and lo! I have named her Mary, and lo! I crave Thy protection for her and for her offspring from Satan the outcast."}]},"Exodus 15:20":{"ref":"Exodus 15","verses":[{"v":20,"t":"And Miriam the prophetess, the sister of Aaron, took a timbrel in her hand; and all the women went out after her with timbrels and with dances."}]},"Numbers 26:59":{"ref":"Numbers 26","verses":[{"v":59,"t":"And the name of Amram's wife was Jochebed, the daughter of Levi, whom her mother bare to Levi in Egypt: and she bare unto Amram Aaron and Moses, and Miriam their sister."}]},"1 Chronicles 6:3":{"ref":"1 Chronicles 6","verses":[{"v":3,"t":"And the children of Amram; Aaron, and Moses, and Miriam. The sons also of Aaron; Nadab, and Abihu, Eleazar, and Ithamar."}]},"Quran 20:85-97":{"ref":"Surah Taha (20)","verses":[{"v":85,"t":"He said: Lo! We have tried thy folk in thine absence, and As-Samiri hath misled them."},{"v":86,"t":"Then Moses went back unto his folk, angry and sad. He said: O my people! Hath not your Lord promised you a fair promise? Did the time appointed then appear too long for you, or did ye wish that wrath from your Lord should come upon you, that ye broke tryst with me?"},{"v":87,"t":"They said: We broke not tryst with thee of our own will, but we were laden with burdens of ornaments of the folk, then cast them (in the fire), for thus As-Samiri proposed."},{"v":88,"t":"Then he produced for them a calf, of saffron hue, which gave forth a lowing sound. And they cried: This is your god and the god of Moses, but he hath forgotten."},{"v":89,"t":"See they not, then, that it returneth no saying unto them and possesseth for them neither hurt nor use?"},{"v":90,"t":"And Aaron indeed had told them beforehand: O my people! Ye are but being seduced therewith, for lo! your Lord is the Beneficent, so follow me and obey my order."},{"v":91,"t":"They said: We shall by no means cease to be its votaries till Moses return unto us."},{"v":92,"t":"He (Moses) said: O Aaron! What held thee back when thou didst see them gone astray,"},{"v":93,"t":"That thou followedst me not? Hast thou then disobeyed my order?"},{"v":94,"t":"He said: O son of my mother! Clutch not my beard nor my head! I feared lest thou shouldst say: Thou hast caused division among the Children of Israel, and hast not waited for my word."},{"v":95,"t":"(Moses) said: And what hast thou to say, O Samiri?"},{"v":96,"t":"He said: I perceived what they perceive not, so I seized a handful from the footsteps of the messenger, and then threw it in. Thus my soul commended to me."},{"v":97,"t":"(Moses) said: Then go! and lo! in this life it is for thee to say: Touch me not! and lo! there is for thee a tryst thou canst not break. Now look upon thy god of which thou hast remained a votary. Verily we will burn it and will scatter its dust over the sea."}]},"Exodus 32:1-6":{"ref":"Exodus 32","verses":[{"v":1,"t":"And when the people saw that Moses delayed to come down out of the mount, the people gathered themselves together unto Aaron, and said unto him, Up, make us gods, which shall go before us; for as for this Moses, the man that brought us up out of the land of Egypt, we wot not what is become of him."},{"v":2,"t":"And Aaron said unto them, Break off the golden earrings, which are in the ears of your wives, of your sons, and of your daughters, and bring them unto me."},{"v":3,"t":"And all the people brake off the golden earrings which were in their ears, and brought them unto Aaron."},{"v":4,"t":"And he received them at their hand, and fashioned it with a graving tool, after he had made it a molten calf: and they said, These be thy gods, O Israel, which brought thee up out of the land of Egypt."},{"v":5,"t":"And when Aaron saw it, he built an altar before it; and Aaron made proclamation, and said, To morrow is a feast to the LORD."},{"v":6,"t":"And they rose up early on the morrow, and offered burnt offerings, and brought peace offerings; and the people sat down to eat and to drink, and rose up to play."}]},"Quran 21:96":{"ref":"Surah Al-Anbya (21)","verses":[{"v":96,"t":"Until, when Gog and Magog are let loose, and they hasten out of every mound,"}]},"Ezekiel 38:1-6":{"ref":"Ezekiel 38","verses":[{"v":1,"t":"And the word of the LORD came unto me, saying,"},{"v":2,"t":"Son of man, set thy face against Gog, the land of Magog, the chief prince of Meshech and Tubal, and prophesy against him,"},{"v":3,"t":"And say, Thus saith the Lord GOD; Behold, I am against thee, O Gog, the chief prince of Meshech and Tubal:"},{"v":4,"t":"And I will turn thee back, and put hooks into thy jaws, and I will bring thee forth, and all thine army, horses and horsemen, all of them clothed with all sorts of armour, even a great company with bucklers and shields, all of them handling swords:"},{"v":5,"t":"Persia, Ethiopia, and Libya with them; all of them with shield and helmet:"},{"v":6,"t":"Gomer, and all his bands; the house of Togarmah of the north quarters, and all his bands: and many people with thee."}]},"Quran 67:3-5":{"ref":"Surah Al-Mulk (67)","verses":[{"v":3,"t":"Who hath created seven heavens in harmony. Thou (Muhammad) canst see no fault in the Beneficent One's creation; then look again: Canst thou see any rifts?"},{"v":4,"t":"Then look again and yet again, thy sight will return unto thee weakened and made dim."},{"v":5,"t":"And verily We have beautified the world's heaven with lamps, and We have made them missiles for the devils, and for them We have prepared the doom of flame."}]},"Quran 37:6-10":{"ref":"Surah As-Saffat (37)","verses":[{"v":6,"t":"Lo! We have adorned the lowest heaven with an ornament, the planets;"},{"v":7,"t":"With security from every froward devil."},{"v":8,"t":"They cannot listen to the Highest Chiefs for they are pelted from every side,"},{"v":9,"t":"Outcast, and theirs is a perpetual torment;"},{"v":10,"t":"Save him who snatcheth a fragment, and there pursueth him a piercing flame."}]},"Quran 72:8-9":{"ref":"Surah Al-Jinn (72)","verses":[{"v":8,"t":"And (the Jinn who had listened to the Qur'an said): We had sought the heaven but had found it filled with strong warders and meteors."},{"v":9,"t":"And we used to sit on places (high) therein to listen. But he who listeneth now findeth a flame in wait for him;"}]},"Quran 15:16-18":{"ref":"Surah Al-Hijr (15)","verses":[{"v":16,"t":"And verily in the heaven we have set mansions of the stars, and We have beautified it for beholders."},{"v":17,"t":"And We have guarded it from every outcast devil,"},{"v":18,"t":"Save him who stealeth the hearing, and them doth a clear flame pursue."}]},"Quran 13:2":{"ref":"Surah Ar-Ra'd (13)","verses":[{"v":2,"t":"Allah it is Who raised up the heavens without visible supports, then mounted the Throne, and compelled the sun and the moon to be of service, each runneth unto an appointed term; He ordereth the course; He detaileth the revelations, that haply ye may be certain of the meeting with your Lord."}]},"Quran 34:9":{"ref":"Surah Saba (34)","verses":[{"v":9,"t":"Have they not observed what is before them and what is behind them of the sky and the earth? If We will, We can make the earth swallow them, or cause obliteration from the sky to fall on them. Lo! herein surely is a portent for every slave who turneth (to Allah) repentant."}]},"Quran 2:106":{"ref":"Surah Al-Baqarah (2)","verses":[{"v":106,"t":"Nothing of our revelation (even a single verse) do we abrogate or cause be forgotten, but we bring (in place) one better or the like thereof. Knowest thou not that Allah is Able to do all things?"}]},"Quran 16:101":{"ref":"Surah An-Nahl (16)","verses":[{"v":101,"t":"And when We put a revelation in place of (another) revelation, - and Allah knoweth best what He revealeth - they say: Lo! thou art but inventing. Most of them know not."}]},"Quran 22:52":{"ref":"Surah Al-Hajj (22)","verses":[{"v":52,"t":"Never sent We a messenger or a prophet before thee but when He recited (the message) Satan proposed (opposition) in respect of that which he recited thereof. But Allah abolisheth that which Satan proposeth. Then Allah establisheth His revelations. Allah is Knower, Wise;"}]},"Quran 53:19-23":{"ref":"Surah An-Najm (53)","verses":[{"v":19,"t":"Have ye thought upon Al-Lat and Al-'Uzza"},{"v":20,"t":"And Manat, the third, the other?"},{"v":21,"t":"Are yours the males and His the females?"},{"v":22,"t":"That indeed were an unfair division!"},{"v":23,"t":"They are but names which ye have named, ye and your fathers, for which Allah hath revealed no warrant. They follow but a guess and that which (they) themselves desire. And now the guidance from their Lord hath come unto them."}]},"Quran 17:73-75":{"ref":"Surah Al-Isra (17)","verses":[{"v":73,"t":"And they indeed strove hard to beguile thee (Muhammad) away from that wherewith We have inspired thee, that thou shouldst invent other than it against Us; and then would they have accepted thee as a friend."},{"v":74,"t":"And if We had not made thee wholly firm thou mightest almost have inclined unto them a little."},{"v":75,"t":"Then had we made thee taste a double (punishment) of living and a double (punishment) of dying, then hadst thou found no helper against Us."}]},"Deuteronomy 18:20-22":{"ref":"Deuteronomy 18","verses":[{"v":20,"t":"But the prophet, which shall presume to speak a word in my name, which I have not commanded him to speak, or that shall speak in the name of other gods, even that prophet shall die."},{"v":21,"t":"And if thou say in thine heart, How shall we know the word which the LORD hath not spoken?"},{"v":22,"t":"When a prophet speaketh in the name of the LORD, if the thing follow not, nor come to pass, that is the thing which the LORD hath not spoken, but the prophet hath spoken it presumptuously: thou shalt not be afraid of him."}]},"Malachi 3:6":{"ref":"Malachi 3","verses":[{"v":6,"t":"For I am the LORD, I change not; therefore ye sons of Jacob are not consumed."}]},"Quran 87:6-7":{"ref":"Surah Al-A'la (87)","verses":[{"v":6,"t":"We shall make thee read (O Muhammad) so that thou shalt not forget"},{"v":7,"t":"Save that which Allah willeth. Lo! He knoweth the disclosed and that which still is hidden;"}]},"Quran 2:238":{"ref":"Surah Al-Baqarah (2)","verses":[{"v":238,"t":"Be guardians of your prayers, and of the midmost prayer, and stand up with devotion to Allah."}]},"Quran 33:21":{"ref":"Surah Al-Ahzab (33)","verses":[{"v":21,"t":"Verily in the messenger of Allah ye have a good example for him who looketh unto Allah and the Last Day, and remembereth Allah much."}]},"Quran 65:4":{"ref":"Surah At-Talaq (65)","verses":[{"v":4,"t":"And for such of your women as despair of menstruation, if ye doubt, their period (of waiting) shall be three months, along with those who have it not. And for those with child, their period shall be till they bring forth their burden. And whosoever keepeth his duty to Allah, He maketh his course easy for him."}]},"Quran 4:34":{"ref":"Surah An-Nisa (4)","verses":[{"v":34,"t":"Men are in charge of women, because Allah hath made the one of them to excel the other, and because they spend of their property (for the support of women). So good women are the obedient, guarding in secret that which Allah hath guarded. As for those from whom ye fear rebellion, admonish them and banish them to beds apart, and scourge them. Then if they obey you, seek not a way against them. Lo! Allah is ever High, Exalted, Great."}]},"Quran 4:24":{"ref":"Surah An-Nisa (4)","verses":[{"v":24,"t":"And all married women (are forbidden unto you) save those (captives) whom your right hands possess. It is a decree of Allah for you. Lawful unto you are all beyond those mentioned, so that ye seek them with your wealth in honest wedlock, not debauchery. And those of whom ye seek content (by marrying them), give unto them their portions as a duty. And there is no sin for you in what ye do by mutual agreement after the duty (hath been done). Lo! Allah is ever Knower, Wise."}]},"Quran 23:5-6":{"ref":"Surah Al-Mu'minun (23)","verses":[{"v":5,"t":"And who guard their modesty -"},{"v":6,"t":"Save from their wives or the (slaves) that their right hands possess, for then they are not blameworthy,"}]},"Quran 33:50":{"ref":"Surah Al-Ahzab (33)","verses":[{"v":50,"t":"O Prophet! Lo! We have made lawful unto thee thy wives unto whom thou hast paid their dowries, and those whom thy right hand possesseth of those whom Allah hath given thee as spoils of war, and the daughters of thine uncle on the father's side and the daughters of thine aunts on the father's side, and the daughters of thine uncle on the mother's side and the daughters of thine aunts on the mother's side who emigrated with thee, and a believing woman if she give herself unto the Prophet and the Prophet desire to ask her in marriage - a privilege for thee only, not for the (rest of) believers - We are Aware of that which We enjoined upon them concerning their wives and those whom their right hands possess - that thou mayst be free from blame, for Allah is ever Forgiving, Merciful."}]},"Ephesians 5:25-29":{"ref":"Ephesians 5","verses":[{"v":25,"t":"Husbands, love your wives, even as Christ also loved the church, and gave himself for it;"},{"v":26,"t":"That he might sanctify and cleanse it with the washing of water by the word,"},{"v":27,"t":"That he might present it to himself a glorious church, not having spot, or wrinkle, or any such thing; but that it should be holy and without blemish."},{"v":28,"t":"So ought men to love their wives as their own bodies. He that loveth his wife loveth himself."},{"v":29,"t":"For no man ever yet hated his own flesh; but nourisheth and cherisheth it, even as the Lord the church:"}]},"Colossians 3:19":{"ref":"Colossians 3","verses":[{"v":19,"t":"Husbands, love your wives, and be not bitter against them."}]},"1 Peter 3:7":{"ref":"1 Peter 3","verses":[{"v":7,"t":"Likewise, ye husbands, dwell with them according to knowledge, giving honour unto the wife, as unto the weaker vessel, and as being heirs together of the grace of life; that your prayers be not hindered."}]},"Quran 33:37":{"ref":"Surah Al-Ahzab (33)","verses":[{"v":37,"t":"And when thou saidst unto him on whom Allah hath conferred favour and thou hast conferred favour: Keep thy wife to thyself, and fear Allah. And thou didst hide in thy mind that which Allah was to bring to light, and thou didst fear mankind whereas Allah hath a better right that thou shouldst fear Him. So when Zeyd had performed that necessary formality (of divorce) from her, We gave her unto thee in marriage, so that (henceforth) there may be no sin for believers in respect of wives of their adopted sons, when the latter have performed the necessary formality (of release) from them. The commandment of Allah must be fulfilled."}]},"Quran 33:4-5":{"ref":"Surah Al-Ahzab (33)","verses":[{"v":4,"t":"Allah hath not assigned unto any man two hearts within his body, nor hath He made your wives whom ye declare (to be your mothers) your mothers, nor hath He made those whom ye claim (to be your sons) your sons. This is but a saying of your mouths. But Allah saith the truth and He showeth the way."},{"v":5,"t":"Proclaim their real parentage. That will be more equitable in the sight of Allah. And if ye know not their fathers, then (they are) your brethren in the faith, and your clients. And there is no sin for you in the mistakes that ye make unintentionally, but what your hearts purpose (that will be a sin for you). Allah is ever Forgiving, Merciful."}]},"Quran 33:50-53":{"ref":"Surah Al-Ahzab (33)","verses":[{"v":50,"t":"O Prophet! Lo! We have made lawful unto thee thy wives unto whom thou hast paid their dowries, and those whom thy right hand possesseth of those whom Allah hath given thee as spoils of war, and the daughters of thine uncle on the father's side and the daughters of thine aunts on the father's side, and the daughters of thine uncle on the mother's side and the daughters of thine aunts on the mother's side who emigrated with thee, and a believing woman if she give herself unto the Prophet and the Prophet desire to ask her in marriage - a privilege for thee only, not for the (rest of) believers - We are Aware of that which We enjoined upon them concerning their wives and those whom their right hands possess - that thou mayst be free from blame, for Allah is ever Forgiving, Merciful."},{"v":51,"t":"Thou canst defer whom thou wilt of them and receive unto thee whom thou wilt, and whomsoever thou desirest of those whom thou hast set aside (temporarily), it is no sin for thee (to receive her again); that is better; that they may be comforted and not grieve, and may all be pleased with what thou givest them. Allah knoweth what is in your hearts (O men), and Allah is ever Forgiving, Clement."},{"v":52,"t":"It is not allowed thee to take (other) women henceforth, nor that thou shouldst change them for other wives even though their beauty pleased thee, save those whom thy right hand possesseth. And Allah is ever Watcher over all things."},{"v":53,"t":"O Ye who believe! Enter not the dwellings of the Prophet for a meal without waiting for the proper time, unless permission be granted you. But if ye are invited, enter, and, when your meal is ended, then disperse. Linger not for conversation. Lo! that would cause annoyance to the Prophet, and he would be shy of (asking) you (to go); but Allah is not shy of the truth. And when ye ask of them (the wives of the Prophet) anything, ask it of them from behind a curtain. That is purer for your hearts and for their hearts. And it is not for you to cause annoyance to the messenger of Allah, nor that ye should ever marry his wives after him. Lo! that in Allah's sight would be an enormity."}]},"Quran 66:1-5":{"ref":"Surah At-Tahrim (66)","verses":[{"v":1,"t":"O Prophet! Why bannest thou that which Allah hath made lawful for thee, seeking to please thy wives? And Allah is Forgiving, Merciful."},{"v":2,"t":"Allah hath made lawful for you (Muslims) absolution from your oaths (of such a kind), and Allah is your Protector. He is the Knower, the Wise."},{"v":3,"t":"When the Prophet confided a fact unto one of his wives and when she afterward divulged it and Allah apprised him thereof, he made known (to her) part thereof and passed over part. And when he told it her she said: Who hath told thee? He said: The Knower, the Aware hath told me."},{"v":4,"t":"If ye twain turn unto Allah repentant, (ye have cause to do so) for your hearts desired (the ban); and if ye aid one another against him (Muhammad) then lo! Allah, even He, is his Protecting Friend, and Gabriel and the righteous among the believers; and furthermore the angels are his helpers."},{"v":5,"t":"It may happen that his Lord, if he divorce you, will give him in your stead wives better than you, submissive (to Allah), believing, pious, penitent, devout, inclined to fasting, widows and maids."}]},"Quran 30:2-4":{"ref":"Surah Ar-Rum (30)","verses":[{"v":2,"t":"The Romans have been defeated"},{"v":3,"t":"In the nearer land, and they, after their defeat will be victorious"},{"v":4,"t":"Within ten years - Allah's is the command in the former case and in the latter - and in that day believers will rejoice"}]},"Quran 29:50-51":{"ref":"Surah Al-'Ankabut (29)","verses":[{"v":50,"t":"And they say: Why are not portents sent down upon him from his Lord? Say: Portents are with Allah only, and I am but a plain warner."},{"v":51,"t":"Is it not enough for them that We have sent down unto thee the Scripture which is read unto them? Lo! herein verily is mercy, and a reminder for folk who believe."}]},"Quran 13:7":{"ref":"Surah Ar-Ra'd (13)","verses":[{"v":7,"t":"Those who disbelieve say: If only some portent were sent down upon him from his Lord! Thou art a warner only, and for every folk a guide."}]},"Quran 17:90-93":{"ref":"Surah Al-Isra (17)","verses":[{"v":90,"t":"And they say: We will not put faith in thee till thou cause a spring to gush forth from the earth for us;"},{"v":91,"t":"Or thou have a garden of date-palms and grapes, and cause rivers to gush forth therein abundantly;"},{"v":92,"t":"Or thou cause the heaven to fall upon us piecemeal, as thou hast pretended, or bring Allah and the angels as a warrant;"},{"v":93,"t":"Or thou have a house of gold; or thou ascend up into heaven, and even then we will put no faith in thine ascension till thou bring down for us a book that we can read. Say (O Muhammad): My Lord be Glorified! Am I aught save a mortal messenger?"}]},"Quran 6:37":{"ref":"Surah Al-An'am (6)","verses":[{"v":37,"t":"They say: Why hath no portent been sent down upon him from his Lord? Say: Lo! Allah is Able to send down a portent. But most of them know not."}]},"Deuteronomy 18:21-22":{"ref":"Deuteronomy 18","verses":[{"v":21,"t":"And if thou say in thine heart, How shall we know the word which the LORD hath not spoken?"},{"v":22,"t":"When a prophet speaketh in the name of the LORD, if the thing follow not, nor come to pass, that is the thing which the LORD hath not spoken, but the prophet hath spoken it presumptuously: thou shalt not be afraid of him."}]},"Isaiah 41:21-23":{"ref":"Isaiah 41","verses":[{"v":21,"t":"Produce your cause, saith the LORD; bring forth your strong reasons, saith the King of Jacob."},{"v":22,"t":"Let them bring them forth, and shew us what shall happen: let them shew the former things, what they be, that we may consider them, and know the latter end of them; or declare us things for to come."},{"v":23,"t":"Shew the things that are to come hereafter, that we may know that ye are gods: yea, do good, or do evil, that we may be dismayed, and behold it together."}]},"John 10:37-38":{"ref":"John 10","verses":[{"v":37,"t":"If I do not the works of my Father, believe me not."},{"v":38,"t":"But if I do, though ye believe not me, believe the works: that ye may know, and believe, that the Father is in me, and I in him."}]},"Quran 69:44-47":{"ref":"Surah Al-Haqqah (69)","verses":[{"v":44,"t":"And if he had invented false sayings concerning Us,"},{"v":45,"t":"We assuredly had taken him by the right hand"},{"v":46,"t":"And then severed his life-artery,"},{"v":47,"t":"And not one of you could have held Us off from him."}]},"Deuteronomy 18:20":{"ref":"Deuteronomy 18","verses":[{"v":20,"t":"But the prophet, which shall presume to speak a word in my name, which I have not commanded him to speak, or that shall speak in the name of other gods, even that prophet shall die."}]},"Quran 23:102-103":{"ref":"Surah Al-Mu'minun (23)","verses":[{"v":102,"t":"Then those whose scales are heavy, they are the successful."},{"v":103,"t":"And those whose scales are light are those who lose their souls, in hell abiding."}]},"Quran 101:6-9":{"ref":"Surah Al-Qari'ah (101)","verses":[{"v":6,"t":"Then, as for him whose scales are heavy (with good works),"},{"v":7,"t":"He will live a pleasant life."},{"v":8,"t":"But as for him whose scales are light,"},{"v":9,"t":"A bereft and Hungry One will be his mother,"}]},"Quran 7:8-9":{"ref":"Surah Al-A'raf (7)","verses":[{"v":8,"t":"The weighing on that day is the true (weighing). As for those whose scale is heavy, they are the successful."},{"v":9,"t":"And as for those whose scale is light: those are they who lose their souls because they used to wrong Our revelations."}]},"Quran 19:71":{"ref":"Surah Maryam (19)","verses":[{"v":71,"t":"There is not one of you but shall approach it. That is a fixed ordinance of thy Lord."}]},"Quran 3:32":{"ref":"Surah Ali 'Imran (3)","verses":[{"v":32,"t":"Say: Obey Allah and the messenger. But if they turn away, lo! Allah loveth not the disbelievers (in His guidance)."}]},"Quran 46:9":{"ref":"Surah Al-Ahqaf (46)","verses":[{"v":9,"t":"Say: I am no new thing among the messengers (of Allah), nor know I what will be done with me or with you. I do but follow that which is inspired in me, and I am but a plain warner."}]},"Ephesians 2:8-9":{"ref":"Ephesians 2","verses":[{"v":8,"t":"For by grace are ye saved through faith; and that not of yourselves: it is the gift of God:"},{"v":9,"t":"Not of works, lest any man should boast."}]},"1 John 5:13":{"ref":"1 John 5","verses":[{"v":13,"t":"These things have I written unto you that believe on the name of the Son of God; that ye may know that ye have eternal life, and that ye may believe on the name of the Son of God."}]},"John 5:24":{"ref":"John 5","verses":[{"v":24,"t":"Verily, verily, I say unto you, He that heareth my word, and believeth on him that sent me, hath everlasting life, and shall not come into condemnation; but is passed from death unto life."}]},"Luke 18:9-14":{"ref":"Luke 18","verses":[{"v":9,"t":"And he spake this parable unto certain which trusted in themselves that they were righteous, and despised others:"},{"v":10,"t":"Two men went up into the temple to pray; the one a Pharisee, and the other a publican."},{"v":11,"t":"The Pharisee stood and prayed thus with himself, God, I thank thee, that I am not as other men are, extortioners, unjust, adulterers, or even as this publican."},{"v":12,"t":"I fast twice in the week, I give tithes of all that I possess."},{"v":13,"t":"And the publican, standing afar off, would not lift up so much as his eyes unto heaven, but smote upon his breast, saying, God be merciful to me a sinner."},{"v":14,"t":"I tell you, this man went down to his house justified rather than the other: for every one that exalteth himself shall be abased; and he that humbleth himself shall be exalted."}]},"Hebrews 10:14":{"ref":"Hebrews 10","verses":[{"v":14,"t":"For by one offering he hath perfected for ever them that are sanctified."}]},"Quran 16:106":{"ref":"Surah An-Nahl (16)","verses":[{"v":106,"t":"Whoso disbelieveth in Allah after his belief - save him who is forced thereto and whose heart is still content with the Faith - but whoso findeth ease in disbelief: On them is wrath from Allah. Theirs will be an awful doom."}]},"Quran 3:28":{"ref":"Surah Ali 'Imran (3)","verses":[{"v":28,"t":"Let not the believers take disbelievers for their friends in preference to believers. Whoso doeth that hath no connection with Allah unless (it be) that ye but guard yourselves against them, taking (as it were) security. Allah biddeth you beware (only) of Himself. Unto Allah is the journeying."}]},"Matthew 10:28":{"ref":"Matthew 10","verses":[{"v":28,"t":"And fear not them which kill the body, but are not able to kill the soul: but rather fear him which is able to destroy both soul and body in hell."}]},"Revelation 2:10":{"ref":"Revelation 2","verses":[{"v":10,"t":"Fear none of those things which thou shalt suffer: behold, the devil shall cast some of you into prison, that ye may be tried; and ye shall have tribulation ten days: be thou faithful unto death, and I will give thee a crown of life."}]},"Ephesians 4:25":{"ref":"Ephesians 4","verses":[{"v":25,"t":"Wherefore putting away lying, speak every man truth with his neighbour: for we are members one of another."}]},"Quran 9:29":{"ref":"Surah At-Tawbah (9)","verses":[{"v":29,"t":"Fight against such of those who have been given the Scripture as believe not in Allah nor the Last Day, and forbid not that which Allah hath forbidden by His messenger, and follow not the Religion of Truth, until they pay the tribute readily, being brought low."}]},"Quran 5:38":{"ref":"Surah Al-Ma'idah (5)","verses":[{"v":38,"t":"As for the thief, both male and female, cut off their hands. It is the reward of their own deeds, an exemplary punishment from Allah. Allah is Mighty, Wise."}]},"Quran 9:5":{"ref":"Surah At-Tawbah (9)","verses":[{"v":5,"t":"Then, when the sacred months have passed, slay the idolaters wherever ye find them, and take them (captive), and besiege them, and prepare for them each ambush. But if they repent and establish worship and pay the poor-due, then leave their way free. Lo! Allah is Forgiving, Merciful."}]},"John 12:47":{"ref":"John 12","verses":[{"v":47,"t":"And if any man hear my words, and believe not, I judge him not: for I came not to judge the world, but to save the world."}]},"John 18:36":{"ref":"John 18","verses":[{"v":36,"t":"Jesus answered, My kingdom is not of this world: if my kingdom were of this world, then would my servants fight, that I should not be delivered to the Jews: but now is my kingdom not from hence."}]},"Matthew 13:29-30":{"ref":"Matthew 13","verses":[{"v":29,"t":"But he said, Nay; lest while ye gather up the tares, ye root up also the wheat with them."},{"v":30,"t":"Let both grow together until the harvest: and in the time of harvest I will say to the reapers, Gather ye together first the tares, and bind them in bundles to burn them: but gather the wheat into my barn."}]},"Matthew 26:52":{"ref":"Matthew 26","verses":[{"v":52,"t":"Then said Jesus unto him, Put up again thy sword into his place: for all they that take the sword shall perish with the sword."}]},"2 Timothy 2:24-26":{"ref":"2 Timothy 2","verses":[{"v":24,"t":"And the servant of the Lord must not strive; but be gentle unto all men, apt to teach, patient,"},{"v":25,"t":"In meekness instructing those that oppose themselves; if God peradventure will give them repentance to the acknowledging of the truth;"},{"v":26,"t":"And that they may recover themselves out of the snare of the devil, who are taken captive by him at his will."}]},"Quran 29:61-63":{"ref":"Surah Al-'Ankabut (29)","verses":[{"v":61,"t":"And if thou wert to ask them: Who created the heavens and the earth, and constrained the sun and the moon (to their appointed work)? they would say: Allah. How then are they turned away?"},{"v":62,"t":"Allah maketh the provision wide for whom He will of His bondmen, and straiteneth it for whom (He will). Lo! Allah is Aware of all things."},{"v":63,"t":"And if thou wert to ask them: Who causeth water to come down from the sky, and therewith reviveth the earth after its death? they verily would say: Allah. Say: Praise be to Allah! But most of them have no sense."}]},"Quran 41:37":{"ref":"Surah Fussilat (41)","verses":[{"v":37,"t":"And of His portents are the night and the day and the sun and the moon. Do not prostrate to the sun or the moon; but prostrate to Allah Who created them, if it is in truth Him Whom ye worship."}]},"Acts 17:23-28":{"ref":"Acts 17","verses":[{"v":23,"t":"For as I passed by, and beheld your devotions, I found an altar with this inscription, TO THE UNKNOWN GOD. Whom therefore ye ignorantly worship, him declare I unto you."},{"v":24,"t":"God that made the world and all things therein, seeing that he is Lord of heaven and earth, dwelleth not in temples made with hands;"},{"v":25,"t":"Neither is worshipped with men's hands, as though he needed any thing, seeing he giveth to all life, and breath, and all things;"},{"v":26,"t":"And hath made of one blood all nations of men for to dwell on all the face of the earth, and hath determined the times before appointed, and the bounds of their habitation;"},{"v":27,"t":"That they should seek the Lord, if haply they might feel after him, and find him, though he be not far from every one of us:"},{"v":28,"t":"For in him we live, and move, and have our being; as certain also of your own poets have said, For we are also his offspring."}]},"Quran 2:256":{"ref":"Surah Al-Baqarah (2)","verses":[{"v":256,"t":"There is no compulsion in religion. The right direction is henceforth distinct from error. And he who rejecteth false deities and believeth in Allah hath grasped a firm handhold which will never break. Allah is Hearer, Knower."}]},"Quran 4:11":{"ref":"Surah An-Nisa (4)","verses":[{"v":11,"t":"Allah chargeth you concerning (the provision for) your children: to the male the equivalent of the portion of two females, and if there be women more than two, then theirs is two-thirds of the inheritance, and if there be one (only) then the half. And to each of his parents a sixth of the inheritance, if he have a son; and if he have no son and his parents are his heirs, then to his mother appertaineth the third; and if he have brethren, then to his mother appertaineth the sixth, after any legacy he may have bequeathed, or debt (hath been paid). Your parents and your children: Ye know not which of them is nearer unto you in usefulness. It is an injunction from Allah. Lo! Allah is Knower, Wise."}]},"Quran 4:12":{"ref":"Surah An-Nisa (4)","verses":[{"v":12,"t":"And unto you belongeth a half of that which your wives leave, if they have no child; but if they have a child then unto you the fourth of that which they leave, after any legacy they may have bequeathed, or debt (they may have contracted, hath been paid). And unto them belongeth the fourth of that which ye leave if ye have no child, but if ye have a child then the eighth of that which ye leave, after any legacy ye may have bequeathed, or debt (ye may have contracted, hath been paid). And if a man or a woman have a distant heir (having left neither parent nor child), and he (or she) have a brother or a sister (only on the mother's side) then to each of them twain (the brother and the sister) the sixth, and if they be more than two, then they shall be sharers in the third, after any legacy that may have been bequeathed or debt (contracted) not injuring (the heirs by willing away more than a third of the heritage) hath been paid. A commandment from Allah. Allah is Knower, Indulgent."}]},"Quran 4:176":{"ref":"Surah An-Nisa (4)","verses":[{"v":176,"t":"They ask thee for a pronouncement. Say: Allah hath pronounced for you concerning distant kindred. If a man die childless and he have a sister, hers is half the heritage, and he would have inherited from her had she died childless. And if there be two sisters, then theirs are two-thirds of the heritage, and if they be brethren, men and women, unto the male is the equivalent of the share of two females. Allah expoundeth unto you, so that ye err not. Allah is Knower of all things."}]},"Quran 6:114":{"ref":"Surah Al-An'am (6)","verses":[{"v":114,"t":"Shall I seek other than Allah for judge, when He it is Who hath revealed unto you (this) Scripture, fully explained? Those unto whom We gave the Scripture (aforetime) know that it is revealed from thy Lord in truth. So be not thou (O Muhammad) of the waverers."}]},"Psalm 19:7":{"ref":"Psalms 19","verses":[{"v":7,"t":"The law of the LORD is perfect, converting the soul: the testimony of the LORD is sure, making wise the simple."}]},"1 Corinthians 14:33":{"ref":"1 Corinthians 14","verses":[{"v":33,"t":"For God is not the author of confusion, but of peace, as in all churches of the saints."}]},"Quran 33:26-27":{"ref":"Surah Al-Ahzab (33)","verses":[{"v":26,"t":"And He brought those of the People of the Scripture who supported them down from their strongholds, and cast panic into their hearts. Some ye slew, and ye made captive some."},{"v":27,"t":"And He caused you to inherit their land and their houses and their wealth, and land ye have not trodden. Allah is ever Able to do all things."}]},"Matthew 7:15-20":{"ref":"Matthew 7","verses":[{"v":15,"t":"Beware of false prophets, which come to you in sheep's clothing, but inwardly they are ravening wolves."},{"v":16,"t":"Ye shall know them by their fruits. Do men gather grapes of thorns, or figs of thistles?"},{"v":17,"t":"Even so every good tree bringeth forth good fruit; but a corrupt tree bringeth forth evil fruit."},{"v":18,"t":"A good tree cannot bring forth evil fruit, neither can a corrupt tree bring forth good fruit."},{"v":19,"t":"Every tree that bringeth not forth good fruit is hewn down, and cast into the fire."},{"v":20,"t":"Wherefore by their fruits ye shall know them."}]},"Matthew 5:44":{"ref":"Matthew 5","verses":[{"v":44,"t":"But I say unto you, Love your enemies, bless them that curse you, do good to them that hate you, and pray for them which despitefully use you, and persecute you;"}]},"Romans 12:19-21":{"ref":"Romans 12","verses":[{"v":19,"t":"Dearly beloved, avenge not yourselves, but rather give place unto wrath: for it is written, Vengeance is mine; I will repay, saith the Lord."},{"v":20,"t":"Therefore if thine enemy hunger, feed him; if he thirst, give him drink: for in so doing thou shalt heap coals of fire on his head."},{"v":21,"t":"Be not overcome of evil, but overcome evil with good."}]},"Quran 61:6":{"ref":"Surah As-Saf (61)","verses":[{"v":6,"t":"And when Jesus son of Mary said: O Children of Israel! Lo! I am the messenger of Allah unto you, confirming that which was (revealed) before me in the Torah, and bringing good tidings of a messenger who cometh after me, whose name is the Praised One. Yet when he hath come unto them with clear proofs, they say: This is mere magic."}]},"Deuteronomy 18:15-18":{"ref":"Deuteronomy 18","verses":[{"v":15,"t":"The LORD thy God will raise up unto thee a Prophet from the midst of thee, of thy brethren, like unto me; unto him ye shall hearken;"},{"v":16,"t":"According to all that thou desiredst of the LORD thy God in Horeb in the day of the assembly, saying, Let me not hear again the voice of the LORD my God, neither let me see this great fire any more, that I die not."},{"v":17,"t":"And the LORD said unto me, They have well spoken that which they have spoken."},{"v":18,"t":"I will raise them up a Prophet from among their brethren, like unto thee, and will put my words in his mouth; and he shall speak unto them all that I shall command him."}]},"Acts 3:22-26":{"ref":"Acts 3","verses":[{"v":22,"t":"For Moses truly said unto the fathers, A prophet shall the Lord your God raise up unto you of your brethren, like unto me; him shall ye hear in all things whatsoever he shall say unto you."},{"v":23,"t":"And it shall come to pass, that every soul, which will not hear that prophet, shall be destroyed from among the people."},{"v":24,"t":"Yea, and all the prophets from Samuel and those that follow after, as many as have spoken, have likewise foretold of these days."},{"v":25,"t":"Ye are the children of the prophets, and of the covenant which God made with our fathers, saying unto Abraham, And in thy seed shall all the kindreds of the earth be blessed."},{"v":26,"t":"Unto you first God, having raised up his Son Jesus, sent him to bless you, in turning away every one of you from his iniquities."}]},"John 14:16-17":{"ref":"John 14","verses":[{"v":16,"t":"And I will pray the Father, and he shall give you another Comforter, that he may abide with you for ever;"},{"v":17,"t":"Even the Spirit of truth; whom the world cannot receive, because it seeth him not, neither knoweth him: but ye know him; for he dwelleth with you, and shall be in you."}]},"John 16:7-14":{"ref":"John 16","verses":[{"v":7,"t":"Nevertheless I tell you the truth; It is expedient for you that I go away: for if I go not away, the Comforter will not come unto you; but if I depart, I will send him unto you."},{"v":8,"t":"And when he is come, he will reprove the world of sin, and of righteousness, and of judgment:"},{"v":9,"t":"Of sin, because they believe not on me;"},{"v":10,"t":"Of righteousness, because I go to my Father, and ye see me no more;"},{"v":11,"t":"Of judgment, because the prince of this world is judged."},{"v":12,"t":"I have yet many things to say unto you, but ye cannot bear them now."},{"v":13,"t":"Howbeit when he, the Spirit of truth, is come, he will guide you into all truth: for he shall not speak of himself; but whatsoever he shall hear, that shall he speak: and he will shew you things to come."},{"v":14,"t":"He shall glorify me: for he shall receive of mine, and shall shew it unto you."}]},"Quran 2:125-127":{"ref":"Surah Al-Baqarah (2)","verses":[{"v":125,"t":"And when We made the House (at Makka) a resort for mankind and sanctuary, (saying): Take as your place of worship the place where Abraham stood (to pray). And We imposed a duty upon Abraham and Ishmael, (saying): Purify My house for those who go around and those who meditate therein and those who bow down and prostrate themselves (in worship)."},{"v":126,"t":"And when Abraham prayed: My Lord! Make this a region of security and bestow upon its people fruits, such of them as believe in Allah and the Last Day, He answered: As for him who disbelieveth, I shall leave him in contentment for a while, then I shall compel him to the doom of Fire - a hapless journey's end!"},{"v":127,"t":"And when Abraham and Ishmael were raising the foundations of the House, (Abraham prayed): Our Lord! Accept from us (this duty). Lo! Thou, only Thou, art the Hearer, the Knower."}]},"Quran 3:96-97":{"ref":"Surah Ali 'Imran (3)","verses":[{"v":96,"t":"Lo! the first Sanctuary appointed for mankind was that at Becca, a blessed place, a guidance to the peoples;"},{"v":97,"t":"Wherein are plain memorials (of Allah's guidance); the place where Abraham stood up to pray; and whosoever entereth it is safe. And pilgrimage to the House is a duty unto Allah for mankind, for him who can find a way thither. As for him who disbelieveth, (let him know that) lo! Allah is Independent of (all) creatures."}]},"Quran 37:100-107":{"ref":"Surah As-Saffat (37)","verses":[{"v":100,"t":"My Lord! Vouchsafe me of the righteous."},{"v":101,"t":"So We gave him tidings of a gentle son."},{"v":102,"t":"And when (his son) was old enough to walk with him, (Abraham) said: O my dear son, I have seen in a dream that I must sacrifice thee. So look, what thinkest thou? He said: O my father! Do that which thou art commanded. Allah willing, thou shalt find me of the steadfast."},{"v":103,"t":"Then, when they had both surrendered (to Allah), and he had flung him down upon his face,"},{"v":104,"t":"We called unto him: O Abraham!"},{"v":105,"t":"Thou hast already fulfilled the vision. Lo! thus do We reward the good."},{"v":106,"t":"Lo! that verily was a clear test."},{"v":107,"t":"Then We ransomed him with a tremendous victim."}]},"Genesis 17:18-21":{"ref":"Genesis 17","verses":[{"v":18,"t":"And Abraham said unto God, O that Ishmael might live before thee!"},{"v":19,"t":"And God said, Sarah thy wife shall bear thee a son indeed; and thou shalt call his name Isaac: and I will establish my covenant with him for an everlasting covenant, and with his seed after him."},{"v":20,"t":"And as for Ishmael, I have heard thee: Behold, I have blessed him, and will make him fruitful, and will multiply him exceedingly; twelve princes shall he beget, and I will make him a great nation."},{"v":21,"t":"But my covenant will I establish with Isaac, which Sarah shall bear unto thee at this set time in the next year."}]},"Genesis 21:12":{"ref":"Genesis 21","verses":[{"v":12,"t":"And God said unto Abraham, Let it not be grievous in thy sight because of the lad, and because of thy bondwoman; in all that Sarah hath said unto thee, hearken unto her voice; for in Isaac shall thy seed be called."}]},"Genesis 22:2":{"ref":"Genesis 22","verses":[{"v":2,"t":"And he said, Take now thy son, thine only son Isaac, whom thou lovest, and get thee into the land of Moriah; and offer him there for a burnt offering upon one of the mountains which I will tell thee of."}]},"Genesis 25:18":{"ref":"Genesis 25","verses":[{"v":18,"t":"And they dwelt from Havilah unto Shur, that is before Egypt, as thou goest toward Assyria: and he died in the presence of all his brethren."}]},"Quran 5:27-32":{"ref":"Surah Al-Ma'idah (5)","verses":[{"v":27,"t":"But recite unto them with truth the tale of the two sons of Adam, how they offered each a sacrifice, and it was accepted from the one of them and it was not accepted from the other. (The one) said: I will surely kill thee. (The other) answered: Allah accepteth only from those who ward off (evil)."},{"v":28,"t":"Even if thou stretch out thy hand against me to kill me, I shall not stretch out my hand against thee to kill thee, lo! I fear Allah, the Lord of the Worlds."},{"v":29,"t":"Lo! I would rather thou shouldst bear the punishment of the sin against me and thine own sin and become one of the owners of the fire. That is the reward of evil-doers."},{"v":30,"t":"But (the other's) mind imposed on him the killing of his brother, so he slew him and became one of the losers."},{"v":31,"t":"Then Allah sent a raven scratching up the ground, to show him how to hide his brother's naked corpse. He said: Woe unto me! Am I not able to be as this raven and so hide my brother's naked corpse? And he became repentant."},{"v":32,"t":"For that cause We decreed for the Children of Israel that whosoever killeth a human being for other than manslaughter or corruption in the earth, it shall be as if he had killed all mankind, and whoso saveth the life of one, it shall be as if he had saved the life of all mankind. Our messengers came unto them of old with clear proofs (of Allah's Sovereignty), but afterwards lo! many of them became prodigals in the earth."}]},"Quran 21:68-69":{"ref":"Surah Al-Anbya (21)","verses":[{"v":68,"t":"They cried: Burn him and stand by your gods, if ye will be doing."},{"v":69,"t":"We said: O fire, be coolness and peace for Abraham,"}]},"Genesis 4:8-16":{"ref":"Genesis 4","verses":[{"v":8,"t":"And Cain talked with Abel his brother: and it came to pass, when they were in the field, that Cain rose up against Abel his brother, and slew him."},{"v":9,"t":"And the LORD said unto Cain, Where is Abel thy brother? And he said, I know not: Am I my brother's keeper?"},{"v":10,"t":"And he said, What hast thou done? the voice of thy brother's blood crieth unto me from the ground."},{"v":11,"t":"And now art thou cursed from the earth, which hath opened her mouth to receive thy brother's blood from thy hand;"},{"v":12,"t":"When thou tillest the ground, it shall not henceforth yield unto thee her strength; a fugitive and a vagabond shalt thou be in the earth."},{"v":13,"t":"And Cain said unto the LORD, My punishment is greater than I can bear."},{"v":14,"t":"Behold, thou hast driven me out this day from the face of the earth; and from thy face shall I be hid; and I shall be a fugitive and a vagabond in the earth; and it shall come to pass, that every one that findeth me shall slay me."},{"v":15,"t":"And the LORD said unto him, Therefore whosoever slayeth Cain, vengeance shall be taken on him sevenfold. And the LORD set a mark upon Cain, lest any finding him should kill him."},{"v":16,"t":"And Cain went out from the presence of the LORD, and dwelt in the land of Nod, on the east of Eden."}]},"Genesis 11:31":{"ref":"Genesis 11","verses":[{"v":31,"t":"And Terah took Abram his son, and Lot the son of Haran his son's son, and Sarai his daughter in law, his son Abram's wife; and they went forth with them from Ur of the Chaldees, to go into the land of Canaan; and they came unto Haran, and dwelt there."}]},"Genesis 15:7":{"ref":"Genesis 15","verses":[{"v":7,"t":"And he said unto him, I am the LORD that brought thee out of Ur of the Chaldees, to give thee this land to inherit it."}]},"Quran 78:31-34":{"ref":"Surah An-Naba (78)","verses":[{"v":31,"t":"Lo! for the duteous is achievement -"},{"v":32,"t":"Gardens enclosed and vineyards,"},{"v":33,"t":"And voluptuous women of equal age;"},{"v":34,"t":"And a full cup."}]},"Quran 44:51-54":{"ref":"Surah Ad-Dukhan (44)","verses":[{"v":51,"t":"Lo! those who kept their duty will be in a place secured."},{"v":52,"t":"Amid gardens and watersprings,"},{"v":53,"t":"Attired in silk and silk embroidery, facing one another."},{"v":54,"t":"Even so (it will be). And We shall wed them unto fair ones with wide, lovely eyes."}]},"Matthew 22:30":{"ref":"Matthew 22","verses":[{"v":30,"t":"For in the resurrection they neither marry, nor are given in marriage, but are as the angels of God in heaven."}]},"Revelation 21:3-4":{"ref":"Revelation 21","verses":[{"v":3,"t":"And I heard a great voice out of heaven saying, Behold, the tabernacle of God is with men, and he will dwell with them, and they shall be his people, and God himself shall be with them, and be their God."},{"v":4,"t":"And God shall wipe away all tears from their eyes; and there shall be no more death, neither sorrow, nor crying, neither shall there be any more pain: for the former things are passed away."}]},"Revelation 22:3-5":{"ref":"Revelation 22","verses":[{"v":3,"t":"And there shall be no more curse: but the throne of God and of the Lamb shall be in it; and his servants shall serve him:"},{"v":4,"t":"And they shall see his face; and his name shall be in their foreheads."},{"v":5,"t":"And there shall be no night there; and they need no candle, neither light of the sun; for the Lord God giveth them light: and they shall reign for ever and ever."}]},"Psalm 16:11":{"ref":"Psalms 16","verses":[{"v":11,"t":"Thou wilt shew me the path of life: in thy presence is fulness of joy; at thy right hand there are pleasures for evermore."}]},"Quran 2:282":{"ref":"Surah Al-Baqarah (2)","verses":[{"v":282,"t":"O ye who believe! When ye contract a debt for a fixed term, record it in writing. Let a scribe record it in writing between you in (terms of) equity. No scribe should refuse to write as Allah hath taught him, so let him write, and let him who incurreth the debt dictate, and let him observe his duty to Allah his Lord, and diminish naught thereof. But if he who oweth the debt is of low understanding, or weak, or unable himself to dictate, then let the guardian of his interests dictate in (terms of) equity. And call to witness, from among your men, two witnesses. And if two men be not (at hand) then a man and two women, of such as ye approve as witnesses, so that if the one erreth (through forgetfulness) the other will remember. And the witnesses must not refuse when they are summoned. Be not averse to writing down (the contract) whether it be small or great, with (record of) the term thereof. That is more equitable in the sight of Allah and more sure for testimony, and the best way of avoiding doubt between you; save only in the case when it is actual merchandise which ye transfer among yourselves from hand to hand. In that case it is no sin for you if ye write it not. And have witnesses when ye sell one to another, and let no harm be done to scribe or witness. If ye do (harm to them) lo! it is a sin in you. Observe your duty to Allah. Allah is teaching you. And Allah is knower of all things."}]},"Genesis 1:27":{"ref":"Genesis 1","verses":[{"v":27,"t":"So God created man in his own image, in the image of God created he him; male and female created he them."}]},"Luke 24:9-11":{"ref":"Luke 24","verses":[{"v":9,"t":"And returned from the sepulchre, and told all these things unto the eleven, and to all the rest."},{"v":10,"t":"It was Mary Magdalene, and Joanna, and Mary the mother of James, and other women that were with them, which told these things unto the apostles."},{"v":11,"t":"And their words seemed to them as idle tales, and they believed them not."}]},"Galatians 3:28":{"ref":"Galatians 3","verses":[{"v":28,"t":"There is neither Jew nor Greek, there is neither bond nor free, there is neither male nor female: for ye are all one in Christ Jesus."}]},"Quran 1:7":{"ref":"Surah Al-Fatihah (1 function splitSentences(raw){

  tokens.forEach(t=>{

      const prev=merged[merged.length-1];
      const m=prev.match(/([A-Za-z&.]+)\.$/);
      const w=m?m[1].replace(/\./g,""):null;

function findWhy(d,cite){

  const m=key.match(/^([1-4]?\s?[A-Za-z&; ]+?)\s+(\d+)/);
  const frag=m?(m[1].trim()+" "+m[2]):key;
  const sentences=(d.claim+" "+d.rationale).replace(/–/g,"-").split(/(?<=[.!?])\s+/);
  const hit=sentences.find(s=>s.includes(frag));

}

  if(state.section==="peculiar")return arr.sort((a,b)=>PORDER.indexOf(a.id)-PORDER.indexOf(b.id));
  return arr.sort((a,b)=>(b.featured?1:0)-(a.featured?1:0)||SEVRANK[a.severity]-SEVRANK[b.severity]||VRANK[a.verdict]-VRANK[b.verdict]);
}

/* ---------- sidebar ---------- */
function renderNav(){
  const items=[["overview","All claims",DATA.length]];
  const views=[["core","The heart of it","3"],["share","Sharing the gospel","✝"],["proofs","Their proof-texts","6"],["theysay","They just said…",THEYSAY.length],["lessons","The da'wah script",LESSONS.length],["arsenal","Verse arsenal","🎯"],["paths","Guided paths",PATHS.length],["timeline","Timeline","4 acts"],["glossary","Terms explained",GLOSSARY.length]];
  const cur=state.view==="overview"&&state.section!=="all"?"sec:"+state.section:state.view;
  $("#nav").innerHTML=items.map(([k,l,c])=>`<a class="${cur===k?"on":""}" data-k="${k}">${l} <span class="cnt">${c}</span></a>`).join("")
    +`<h5>Views</h5>`+views.map(([k,l,c])=>`<a class="${cur===k?"on":""}" data-k="${k}">${l} <span class="cnt">${c}</span></a>`).join("");
  document.querySelectorAll("#nav a").forEach(a=>a.addEventListener("click",()=>{
    const k=a.dataset.k;
    if(k.startsWith("sec:")){state.view="overview";state.section=k.slice(4);state.caseId=null;}
    else if(k==="overview"){state.view="overview";state.section="all";state.caseId=null;}
    else{state.view=k;state.caseId=null;}
    render();
  }));
  const read=store.read.size;
  $("#sideprog").innerHTML=`
    <button id="themebtn" style="margin-top:14px;background:none;border:1px solid var(--line2);color:var(--muted);border-radius:8px;padding:5px 12px;font-size:.72rem;cursor:pointer">◐ ${document.documentElement.dataset.theme==="light"?"Dark":"Light"} mode</button> <button id="tourbtn" style="margin-top:8px;background:none;border:1px solid var(--line2);color:var(--muted);border-radius:8px;padding:5px 12px;font-size:.72rem;cursor:pointer">✦ Replay tour</button>`;
  $("#themebtn").addEventListener("click",()=>{
    const cur=document.documentElement.dataset.theme==="light"?"dark":"light";

    localStorage.setItem("wb_theme",cur);

/* ---------- preview ---------- */
function renderPreview(){

  const rel=(RELATED[d.id]||[]).filter(id=>byId[id]);

    <h5 class="pt">${esc(d.title)}</h5>

/* ---------- overview ---------- */
function renderOverview(){
  const items=filtered();
  const anyF=state.verdict||state.severity||state.q||state.section!=="all";
  const visible=new Set(items.map(d=>d.id));
  const read=store.read;
  const VDESC={admitted:"The church's own publications concede these facts — cite them from their sources alone",unrefuted:"No adequate answer exists — or the best answers concede the point",contested:"A serious rebuttal exists; both sides shown",answered:"The defense holds — included so nothing is cherry-picked"};
  const counts={};DATA.forEach(d=>counts[d.verdict]=(counts[d.verdict]||0)+1);
  const col=v=>{
    const cls=v==="admitted"?"ad":v==="unrefuted"?"un":v==="contested"?"co":"an";
    const src=state.section==="all"?DATA:DATA.filter(d=>d.section===state.section);
    const groups=["high","medium","low"].map(s=>{
      const g=src.filter(d=>d.verdict===v&&d.severity===s).sort((a,b)=>(b.featured?1:0)-(a.featured?1:0));
      if(!g.length)return "";
      return `<div class="vgroup">`+
        g.map(d=>`<button class="vt ${state.sel===d.id?"sel":""}${visible.has(d.id)?"":" dimmed"}" data-id="${d.id}">
          <h5>${esc(d.title)}</h5>
          <span class="m">${read.has(d.id)?'<span class="rd">✓ read</span>':""}${d.featured?'<span class="star">★ strongest evidence</span>':""}</span>
        </button>`).join("")+`</div>`;
    }).join("");
    const cnt=src.filter(d=>d.verdict===v).length;
    return `<div class="vcol ${cls}"><header><span class="n">${cnt}</span><span class="t">${VLABEL[v]}</span><div class="d">${VDESC[v]}</div></header>${groups}</div>`;
  };
  if(state.section==="peculiar"){
    const items2=filtered();
    $("#main").innerHTML=`
      <div class="tiles">
        <button class="tile on" data-v=""><div class="v">${DATA.filter(d=>d.section==="peculiar").length}</div><div class="l">Ranked entries</div></button>
        <button class="tile t-un" data-v=""><div class="v" style="font-size:1rem;padding-top:8px">Most jaw-dropping first</div><div class="l">how this list is sorted</div></button>
      </div>
      <h4 class="bt">Strange to outsiders — practices and institutional behavior, ranked by how surprising they are to a non-Mormon. Not core theology; each is documented and steelmanned like everything else.</h4>
      <div class="vcol" style="max-width:760px">${items2.map((d,i)=>`
        <button class="vt ${state.sel===d.id?"sel":""}" data-id="${d.id}">
          <h5><span style="font-family:var(--mono);color:var(--dim);font-size:.8rem;margin-right:8px">${String(i+1).padStart(2,"0")}</span>${esc(d.title)}</h5>
          <span class="m">${read.has(d.id)?'<span class="rd">✓ read</span>':""}<span class="badge v-${d.verdict}">${VLABEL[d.verdict]}</span><span>seriousness: ${SEVLABEL[d.severity]}</span></span>
        </button>`).join("")}</div>
      <p class="methodfoot">Ranking is editorial: how startling the item is to someone outside the tradition, most to least. Verdicts still grade only the factual claim.</p>`;
    document.querySelectorAll(".vt").forEach(c=>{
      c.addEventListener("mouseenter",()=>{state.sel=c.dataset.id;renderPreview();});
      c.addEventListener("click",()=>openCase(c.dataset.id));
    });
    return;
  }
  $("#main").innerHTML=`
    <h4 class="bt">${state.section==="all"?DATA.length+" claims, sorted by where the argument stands · click any title to open its case":SECTIONS[state.section]+" — by verdict"}${anyF?` · <button id="clearf" style="background:none;border:0;color:var(--gold);cursor:pointer;text-decoration:underline;font-size:.72rem;letter-spacing:0;text-transform:none">${items.length} match filters — clear</button>`:""}</h4>
    <div class="vwall">${col("admitted")}${col("unrefuted")}${col("contested")}${col("answered")}</div>
    <p class="methodfoot">Steelman rules: every claim carries the best published Muslim defense; weak criticisms are marked answered; facts conceded in sahih Islamic sources are marked admitted. Compiled July 2026 from published sources — verify citations at the links before quoting. Verdicts are editorial judgments about the public argument.</p>`;
  document.querySelectorAll(".vt").forEach(c=>{
    c.addEventListener("mouseenter",()=>{state.sel=c.dataset.id;renderPreview();});
    c.addEventListener("click",()=>openCase(c.dataset.id));
  });
  const cf=$("#clearf");if(cf)cf.addEventListener("click",()=>{state.verdict=null;state.severity=null;state.q="";state.section="all";render();});
}

/* ---------- case ---------- */
function openCase(id,fromPath){
  state.caseId=id;state.sel=id;state.view="case";
  if(!fromPath)state.pathId=state.pathId; // keep path context if navigating within
  store.markRead(id);
  render();
  window.scrollTo({top:0});
}
function renderCase(){
  const d=byId[state.caseId];if(!d){state.view="overview";return renderOverview();}
  const list=filtered();const idx=list.findIndex(x=>x.id===d.id);
  const path=state.pathId?PATHS.find(p=>p.id===state.pathId):null;
  let nextInPath=null;
  if(path){const i=path.items.indexOf(d.id);if(i>-1&&i<path.items.length-1)nextInPath=path.items[i+1];}
  const comp=d.comparison?`
    <div class="dlab">Side by side</div>
    <div class="compare2">
      <div class="pane bom"><div class="ref">${esc(d.comparison.left.ref)}</div><div class="scripture">${hl(d.comparison.left.text,d.comparison.hl)}</div></div>
      <div class="pane bible"><div class="ref">${esc(d.comparison.right.ref)}</div><div class="scripture">${hl(d.comparison.right.text,d.comparison.hl)}</div></div>
    </div>${d.comparison.note?`<p class="cnote">${esc(d.comparison.note)}</p>`:""}`:"";
  const chipHtml=(arr)=>arr.map(p=>{
    const v=VERSES[p];
    return `<button class="chip ${v?"":"ext"}" data-cite="${esc(p)}" ${v?"":`data-ext="${extUrl(p)}"`}>${esc(p)}</button>`;
  }).join("");
  const hadithChips=(d.hadith||[]).map(h=>{
    const u=hadithUrl(h);
    return u?`<a class="chip ext" href="${u}" target="_blank" rel="noopener">${esc(h)}</a>`:`<span class="chip" style="cursor:default">${esc(h)}</span>`;
  }).join("");
  const cimg=IMGMAP[d.id]?`<figure class="cimg"><img src="${IMGMAP[d.id].src}" alt="${esc(IMGMAP[d.id].cap)}" loading="lazy"><button class="cimg-x" title="Expand image" data-full="${IMGMAP[d.id].src.replace("width=520","width=1400")}" data-cap="${esc(IMGMAP[d.id].cap)}">⤢</button><figcaption>${esc(IMGMAP[d.id].cap)}</figcaption></figure>`:"";
  const passages=((d.quran||[]).length||(d.hadith||[]).length||(d.bible||[]).length||IMGMAP[d.id])?`
    <aside class="claimside">
      ${cimg}
      <details class="vdet"><summary>The texts behind this claim — ${(d.quran||[]).length+(d.hadith||[]).length+(d.bible||[]).length} refs</summary>
      <p class="sidenote">Every reference here is cited by this specific claim — click a Quran or Bible reference to read it in place (Quran: Pickthall; Bible: KJV); hadith open on sunnah.com.</p>
      <div class="passcols">
        ${(d.quran||[]).length?`<div><h6 class="h-bom">Quran</h6><div class="chips" data-side="quran">${chipHtml(d.quran)}</div></div>`:""}
        ${(d.hadith||[]).length?`<div><h6 class="h-bom" style="color:var(--amber)">Hadith</h6><div class="chips" data-side="hadith">${hadithChips}</div></div>`:""}
        ${(d.bible||[]).length?`<div><h6 class="h-bib">Bible</h6><div class="chips" data-side="bib">${chipHtml(d.bible)}</div></div>`:""}
        <div id="versebox"></div>
      </div></details>
    </aside>`:"";
  const rel=(RELATED[d.id]||[]).filter(x=>byId[x]);
  $("#main").innerHTML=`
    <div class="backbar">
      <button class="bk" id="back">← ${path?esc(path.name):"All cases"}</button>
      <span style="font-size:.72rem;color:var(--dim)">${idx+1>0?`Case ${idx+1} of ${list.length}`:""} · <kbd>←</kbd>/<kbd>→</kbd> to move</span>
      ${nextInPath?`<button class="pathnext" id="pathnext">Next in path →</button>`:""}
    </div>
    <div class="case">
      <div class="meta"><span class="badge v-${d.verdict}">${VLABEL[d.verdict]} ${info(TIPS.verdict[d.verdict])}</span><span class="tag">${CATS[d.category]} ${info(CATDESC[d.category])}</span><span class="tag">seriousness: ${SEVLABEL[d.severity]} ${info(TIPS.impact)}</span>${d.featured?`<span class="tag" style="border-color:var(--gold);color:var(--gold)">★ strongest evidence ${info(TIPS.strongest)}</span>`:""}</div>
      <h2>${esc(d.title)}</h2>
      <div class="ctop">
        <div><div class="dlab red" style="margin-top:0">The claim</div><div class="claim">${paras(d.claim)}</div></div>
        ${passages}
      </div>
      ${comp}
      <div class="tabs2">
        <button class="tab2 on" data-pane="pane-case">🛡 Defense & Verdict</button>
        <button class="tab2" data-pane="pane-talk">💬 Conversation</button>
        <button class="tab2" data-pane="pane-src">📚 Sources & connections</button>
      </div>
      <div class="tabpane2 on" id="pane-case">
        <div class="dlab blue" style="margin-top:0">The best defense, steelmanned</div>
        <div class="defense">${formatDefense(d.response)}${d.responseSource?`<div class="dsrc">Source: ${d.responseSource.url?`<a href="${esc(d.responseSource.url)}" target="_blank" rel="noopener">${esc(d.responseSource.name)}</a>`:esc(d.responseSource.name)}</div>`:""}</div>
        <div class="pair2">
          <div><div class="dlab">The verdict</div><div class="vbox v-${d.verdict}"><b class="vb">${VLABEL[d.verdict]}</b><span>${paras(d.rationale)}</span></div></div>
          <div><div class="dlab">Why this matters</div><div class="why">${paras(WHYMAP[d.category]||"")}<p class="wtail">${esc(WHYTAIL[d.verdict])}</p></div></div>
        </div>
      </div>
      <div class="tabpane2" id="pane-talk">${TALK[d.category]?`<div class="dlab" style="margin-top:0;color:var(--green)">Bringing it up in conversation</div><div class="talk">${paras(TALK[d.category])}</div>`:""}${DIALOG[d.category]?`<div class="dlab" style="color:var(--green)">How the conversation usually goes</div><div class="dlg">${DIALOG[d.category].map(m=>`<div class="msg ${m.w}"><span class="who">${m.w==="them"?"They may say":"You respond"}</span><p>${rich(m.t)}</p></div>`).join("")}</div>`:""}</div>
      <div class="tabpane2" id="pane-src">
        <div class="dlab" style="margin-top:0">Documented by — ${d.sources.length} source${d.sources.length>1?"s":""}</div>
        <ul class="srcs">${d.sources.map(s=>`<li><span class="sb sb-${s.type}">${s.type}</span><span>${s.url?`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.name)}</a>`:esc(s.name)}</span></li>`).join("")}</ul>
        <div class="dlab">Connected cases</div>
        <div class="relrow">${rel.map(id=>`<button data-open="${id}">${esc(byId[id].title)}</button>`).join("")||"—"}</div>
      </div>
    </div>`;
    $("#back").addEventListener("click",()=>{state.view=path?"paths":"overview";state.caseId=null;render();});
  if(nextInPath)$("#pathnext").addEventListener("click",()=>openCase(nextInPath));
  document.querySelectorAll(".relrow [data-open]").forEach(b=>b.addEventListener("click",()=>openCase(b.dataset.open)));
  document.querySelectorAll(".chip").forEach(ch=>ch.addEventListener("click",()=>{
    if(ch.dataset.ext){window.open(ch.dataset.ext,"_blank");return;}
    const cite=ch.dataset.cite;const v=VERSES[cite];
    const box=$("#versebox");
    const already=ch.classList.contains("open");
    document.querySelectorAll(".chip.open").forEach(x=>x.classList.remove("open"));
    if(already){box.innerHTML="";return;}
    ch.classList.add("open");
    const side=ch.closest("[data-side]")?ch.closest("[data-side]").dataset.side:"";
    const why=findWhy(d,cite);
    const whyHtml=why?`<b>Why it's cited:</b> ${esc(why)}`:(side==="quran"?"<b>Role:</b> this is the Quran passage the claim examines.":"<b>Role:</b> this is the biblical standard the claim measures against.");
    box.innerHTML=`<div class="versebox"><div class="vr"><span>${esc(cite)}</span><button data-close>✕ close</button></div><div class="vtext">${v.verses.map(x=>`<span class="vnum">${x.v}</span>${esc(x.t)} `).join("")}</div><div class="vwhy">${whyHtml}</div></div>`;
    box.querySelector("[data-close]").addEventListener("click",()=>{box.innerHTML="";document.querySelectorAll(".chip.open").forEach(x=>x.classList.remove("open"));});
  }));
  document.querySelectorAll(".cimg-x").forEach(b=>b.addEventListener("click",e=>{e.stopPropagation();showLightbox(b.dataset.full,b.dataset.cap);}));
  renderNav();renderPreview();
}

/* ---------- paths ---------- */
function renderPaths(){
  const read=store.read;
  $("#main").innerHTML=`<div class="viewhead"><h2>Guided paths</h2><p>Curated routes through the corpus. Progress is saved in your browser; inside a path, each case offers "Next in path."</p></div><div class="pgrid">`+PATHS.map(p=>{
      const done=p.items.filter(i=>read.has(i)).length;
      return `<div class="pathcard"><h3>${esc(p.name)}</h3><p class="pd">${esc(p.desc)} · ${p.time} · ${done}/${p.items.length} read</p>
      <ol>${p.items.map(i=>`<li class="${read.has(i)?"done":""}">${esc(byId[i].title)}</li>`).join("")}</ol>
      <button class="start" data-path="${p.id}">${done===0?"Start path":done>=p.items.length?"Revisit path":"Continue path"} →</button></div>`;
    }).join("")+"</div>";
  document.querySelectorAll("[data-path]").forEach(b=>b.addEventListener("click",()=>{
    const p=PATHS.find(x=>x.id===b.dataset.path);state.pathId=p.id;
    const read=store.read;const next=p.items.find(i=>!read.has(i))||p.items[0];
    openCase(next,true);
  }));
}
