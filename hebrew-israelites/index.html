const THEYSAY=[{"say":"So-called Black man — you're not African, you're an Israelite. Wake up.","quick":"Receive the compliment inside it: they're saying you matter to God's story. You do — but Scripture locates your place in that story by faith in the Messiah, not by decoding your skin (Gal 3:26-29). Ask: 'Show me the verse that identifies me by my appearance.'","id":"twelve-tribes-chart"},{"say":"Deuteronomy 28:68 — slave ships! The Most High said you'd go back into bondage in ships. Prove me wrong.","quick":"Read the whole chapter, not the one verse. Verse 68's ships sail to Egypt ('again'), and it ends 'no man shall buy you' — the Atlantic trade's horror was that millions WERE bought. Josephus records Rome literally shipping Jewish captives to Egypt after AD 70.","id":"deut-28-68-slave-ships"},{"say":"The people over in Israel today are Khazars — converts, impostors sitting in your seat.","quick":"A 2013 genome-wide study by more than twenty geneticists found no evidence of Khazar origin — Ashkenazi Jews cluster with Middle Eastern populations and other Jewish communities. And Paul still calls unbelieving Israel 'beloved for the sake of the fathers' (Rom 11:28).","id":"khazar-impostor-theory"},{"say":"Christianity is the slave master's religion. They gave you that white Jesus to keep you docile.","quick":"The wound here is real — slaveholder religion existed and it was wicked. But Ethiopia and Egypt had thriving churches 1,400 years before the first slave ship. Slaveholders printed a 'Slave Bible' with Exodus cut out — because the real Bible sets people free.","id":"movement-1896-origin"},{"say":"Revelation 1 — hair like wool, feet like burnt brass. Jesus was a Black man like you.","quick":"Keep reading the verse: hair 'white like wool, white as snow,' feet like bronze 'glowing in a furnace,' face 'like the sun.' It's a vision of blazing glory echoing Daniel 7 — John fell down as though dead. Jesus was a brown-skinned Judean, and no one at the throne is checking complexions.","id":"revelation-wool-hair"},{"say":"The Bible is a book about Black people, by Black people. It's your history book.","quick":"The Bible is Israel's story opened to every nation — that's its own claim: 'a light for the Gentiles… to the ends of the earth' (Isa 49:6). If it's only one race's family record, Revelation 7:9 becomes an error.","id":"twelve-tribes-chart"},{"say":"You have to keep the laws, statutes and commandments to be saved. Grace is a Gentile fairy tale.","quick":"Their own proof-text convicts them: 'Cursed is everyone who does not abide by ALL things written in the law' (Deut 27:26, quoted in Gal 3:10). Nobody at the podium keeps all of it. That's why Christ 'redeemed us from the curse of the law' (Gal 3:13).","id":"law-keeping-salvation"},{"say":"Paul is a false apostle. He changed the Messiah's teaching for the Gentiles.","quick":"Only some fringe strands say this — IUIC itself preaches from Paul. Peter calls Paul's letters Scripture (2 Pet 3:15-16), and Paul was examined by the Jerusalem apostles who gave him the right hand of fellowship (Gal 2:9).","id":"one-west-camps"},{"say":"The white man is Esau. Edom is the devil of this world.","quick":"Edom was Israel's literal brother-nation just south of Judea — Semitic kin, absorbed into Judea a century before Christ (Herod was an Idumean). Obadiah condemns Edom for hating a brother. Reviving that hatred with the colors switched repeats Edom's sin, not Jacob's faith.","id":"esau-white-doctrine"},{"say":"Where in the Bible does it say church on Sunday? Where does it say Christmas? Precept upon precept, line upon line.","quick":"Notice the method: chained fragments with the chapters removed. Even 'precept upon precept' (Isa 28:9-13) is, in context, drunken scoffers mocking Isaiah — and God warning that fragment-hearing leads to falling backward. Offer to read any WHOLE chapter together.","id":"precepts-method"},{"say":"That DNA test saying you're Nigerian? That's Esau's science. They control the labs.","quick":"When evidence can only ever confirm the doctrine — and all contrary evidence is a plot — that's not faith, it's a closed loop. Ask gently: 'What evidence, even in principle, could show the chart is wrong?' Truth isn't afraid of testing (1 Thess 5:21).","id":"african-american-genetics"},{"say":"The tribes fled into West Africa after 70 AD. That's who the slave traders caught.","quick":"First-century Jews knew where the diaspora lived — Acts 2 lists the nations, and none of the historical record places the twelve tribes in the Bight of Benin. Genetic ancestry of African Americans traces to the exact West and Central African regions the slave-trade ledgers name.","id":"african-american-genetics"},{"say":"Christmas, Easter, Sunday — that's Babylon. You're keeping pagan days and calling it worship.","quick":"Christians have honest internal debates about holidays, and Colossians 2:16-17 gives the principle: festivals are shadows; the substance is Christ. Notice what's revealing — the camps' answer to 'Babylon' is more calendar-keeping, not the Lamb.","id":"law-keeping-salvation"},{"say":"The church got you asleep, brother. Pastor's got a Bentley and you've got a burden.","quick":"Some churches have failed people — concede it without flinching; Jesus reserved his hottest words for religious exploiters (Matt 23). Then ask: does a bad shepherd disprove the Shepherd? Ezekiel 34 says God's answer to false shepherds is to come shepherd his flock himself.","id":"one-west-camps"},{"say":"Jacob have I loved, Esau have I hated. That's talking about YOU, Edomite.","quick":"If you're the white listener: stand there with grace — you're being handed a lifetime of real grievances in one sentence. Malachi 1 and Romans 9 are about God's electing purpose, not melanin. Romans 9-11 ends with 'God has consigned ALL to disobedience, that he may have mercy on ALL.'","id":"esau-white-doctrine"},{"say":"We been teaching this since 1896 — before your grandaddy's grandaddy. This ain't new.","quick":"True — Crowdy's church was founded in 1896, and it's worth knowing the history. But age doesn't settle truth (Mormonism is older). And the street camps' 1West doctrine only dates to 1960s Harlem — younger than most of the churches it condemns.","id":"movement-1896-origin"}];
const LESSONS=[{"n":0,"t":"Before you engage: the megaphone is not the mission field","what":["Street camps preach for the crowd, not the interlocutor. The podium, the poster, the amplifier and the circle of officers are a performance space, and 'winning' an exchange there feeds the show — clips of flustered Christians are recruitment content. The people most likely to actually hear you are the newer members at the edge of the circle, and the conversation that matters happens one-on-one, after, quietly. If the crowd is hostile or you have children with you, a warm word and a departure is not defeat."],"ask":"Ask yourself first: am I trying to win this crowd, or love this man? Then ask him: 'Can we talk after you're done — just us? I'll buy the coffee.'","ids":["one-west-camps"]},{"n":1,"t":"Stage one: the callout","what":["It starts with an identity provocation aimed at whoever is walking past: 'So-called Black man!' — designed to stop feet and enroll the crowd. The hook is real and you should respect it: it offers a chosen people identity, an explanation for centuries of suffering, and dignity to people the world has often denied it. Don't sneer at the longing; answer the doctrine."],"ask":"'What's your name, brother? I'm ___.' Names first — it converts a performance into a conversation, and it's surprisingly disarming.","ids":["twelve-tribes-chart"]},{"n":2,"t":"Stage two: the Deuteronomy 28 proof","what":["The anchor text: verse 68's 'ships' equals the Middle Passage, so the curses prove Black Americans are Israel. It's emotionally powerful because Deuteronomy 28's horrors genuinely echo slavery's horrors. But the argument only works with the chapter closed: the ships sail to Egypt ('again'), the curse falls on the covenant nation for breaking the covenant (v.15), and the final clause — 'no man shall buy you' — inverts the Atlantic trade, where buyers were the engine of the whole evil."],"ask":"'Can we read the whole chapter together — verse 15, verse 68, then chapter 30? Who is being addressed, where do the ships land, and what does God promise after the curse?'","ids":["deut-28-68-slave-ships"]},{"n":3,"t":"Stage three: the chart","what":["Next comes the poster: twelve tribes mapped to modern peoples — African Americans as Judah, with Haitians, West Indians, Puerto Ricans, Mexicans, Native Americans and others assigned to the remaining tribes (mappings vary by camp). The chart is the movement's real creed, and its weakness is simple: no verse produces it. It is asserted, then verses are decorated around it."],"ask":"'Which scripture puts each nation under its tribe? Take any single line of the chart — where does the Bible itself say that?' (There is no such verse; watch the pivot back to Deut 28.)","ids":["twelve-tribes-chart","precepts-method"]},{"n":4,"t":"Stage four: 'Christianity was given to you by slave masters'","what":["The emotional core, and the place to concede real history honestly: slaveholder religion existed, whitewashed art existed, churches were complicit. Say so plainly — flinching here costs you everything. Then the counter-history: the Ethiopian eunuch (Acts 8), the church in Egypt and North Africa within the first centuries, Ethiopia Christian by the 300s — 1,400 years before 1619. And the tell: the 1807 'Slave Bible' cut Exodus out, because masters knew the full Bible is an emancipation document. Enslaved believers read Exodus and knew whose side God was on."],"ask":"'If Christianity is the slave master's religion, why did the slave masters have to cut the Bible apart before they'd hand it to the enslaved?'","ids":["movement-1896-origin"]},{"n":5,"t":"Stage five: the law invitation","what":["The close: join the camp, keep the laws, statutes and commandments, take a Hebrew name, wake up. This is where the gospel contrast is sharpest, because their own canon supplies the verdict: Deuteronomy 27:26 curses everyone who fails to keep all of it — a standard no one at the podium meets. Galatians 3 quotes exactly that verse and answers it: Christ became a curse for us. Salvation by bloodline plus law-keeping is the one gospel Paul anathematized — and the one burden Jesus never put on anyone he called."],"ask":"'On your doctrine, how many commandments can you break and still be saved? Read Deuteronomy 27:26 and Galatians 3:10-13 with me — who has ever survived that standard except One?'","ids":["law-keeping-salvation"]}];
const WHYVERSE={};
function bindOpens(){document.querySelectorAll("#main [data-open]").forEach(b=>b.addEventListener("click",()=>openCase(b.dataset.open)));}
function renderTheySay(){
  $("#main").innerHTML=`<div class="viewhead"><h2>They just said…</h2>
  <p>Real conversations start with a line, not a topic. Find the line you just heard, answer in two sentences, then open the full case together. Use the search box to jump (Ctrl+F works too).</p></div>`+
  THEYSAY.map(t=>`<div class="ptcard"><h3 class="ptv">“${esc(t.say)}”</h3>
    <div class="who you">Your two sentences</div><p class="pt">${rich(t.quick)}</p>
    <div class="relrow"><button data-open="${t.id}">Open the full case: ${esc((byId[t.id]||{}).title||t.id)}</button></div></div>`).join("");
  bindOpens();
}
function renderLessons(){
  $("#main").innerHTML=`<div class="viewhead"><h2>The street teaching</h2>
  <p>A street teaching follows a practised sequence — draw the crowd, establish the grievance, produce the chart, deliver the curses, then the call to wake up. Here is each stage, the one question to ask right then, and the cases behind it. Knowing the sequence lets you stay warm and unhurried.</p></div>`+
  LESSONS.map(L=>`<div class="sa"><span class="tpx">${esc(L.n)}</span><h4 class="sat">${esc(L.t)}</h4><div class="who them">What happens</div><p class="pt">${(Array.isArray(L.what)?L.what:[L.what]).map(w=>"• "+esc(w)).join("<br>")}</p>
    <div class="saybox" style="margin-top:12px"><span class="who">The question to ask</span><p>${rich(L.ask)}</p></div>
    <div class="relrow">${L.ids.map(id=>byId[id]?`<button data-open="${id}">${esc(byId[id].title)}</button>`:"").join("")}</div></div>`).join("");
  bindOpens();
}
const KNOW={"didyouknow":[{"t":"The movement really does date to 1896","d":"William Saunders Crowdy — born enslaved in Maryland in 1847, a Union Army veteran — founded the Church of God and Saints of Christ in Kansas in 1896 after visions that Black Americans descended from the twelve tribes. It's the earliest institutional Hebrew Israelite congregation, and it still exists — observing Saturday Sabbath while honoring Jesus.","src":"Wikipedia; cogasoc.net","id":"movement-1896-origin"},{"t":"There is a Hebrew Israelite village in Israel right now","d":"Ben Ammi Ben-Israel (born Ben Carter, Chicago) led followers out in 1967 via Liberia to Israel. Today roughly 2,700-3,000 African Hebrew Israelites live mainly in Dimona — strict vegans who shun synthetic fabrics; their youth have served in the IDF since 2004. Ben Ammi received Israeli citizenship in 2013 and died in 2014.","src":"Times of Israel; My Jewish Learning"},{"t":"Israel nearly deported them — then relented","d":"In 2021 about 130 Dimona community members without status received deportation orders. After years in limbo, the community won a legal victory in May 2025 securing their ability to stay. Israeli officials attend their memorials; the mayor of Dimona has championed a neighborhood named for Ben Ammi. The state's posture is complicated — but it is not the 'impostors expelling the real Israel' story the street camps tell.","src":"Religion News Service, May 2025; Times of Israel"},{"t":"'1West' is an address, not a doctrine","d":"The militant street lineage began when Abba Bivens left Harlem's Commandment Keepers congregation in the 1960s to found the 'Israeli School' at 1 West 125th Street — hence '1West.' Nearly every shouting camp you'll meet — IUIC, ISUPK, GMS (Great Millstone), the Sicarii — descends from it by splinter after splinter, each often denouncing the others as false Israel.","src":"ADL backgrounder; SPLC","id":"one-west-camps"},{"t":"IUIC is younger than Google","d":"Israel United in Christ — the suits-and-gold-fringes camp with the polished YouTube presence — was founded in 2003 by Bishop Nathanyel in New York. Its structure is quasi-military: bishops, deacons, captains, officers, soldiers, with the 'soldier' framing justified from 2 Timothy. The matching uniforms are deliberate street theology: impossible to ignore, and a recruitment aesthetic of discipline and dignity.","src":"Forward; New Religious Movements; Jamaica Gleaner","id":"one-west-camps"},{"t":"The fringes are Numbers 15, and they keep a real calendar","d":"The tassels with a blue thread on camp members' garments come straight from Numbers 15:38-39. Camps keep Sabbath from Friday sunset to Saturday sunset, and IUIC keeps Passover with lamb or goat, bitter herbs, unleavened bread and wine, plus Unleavened Bread, Firstfruits, Tabernacles and New Moons. Whatever else is wrong, the practice is serious — treat it with respect.","src":"israelunite.org (their own holy-day pages)"},{"t":"Rabbinic Judaism says no — but one Israelite rabbi built a bridge","d":"Jewish authorities do not recognize Hebrew Israelites as Jews absent conversion. But Rabbi Capers Funnye of Chicago — raised AME, ordained in the Israelite tradition — underwent formal conversion with an Orthodox-Conservative rabbinic court, sits on the Chicago Board of Rabbis, and in 2015 became Chief Rabbi of the International Israelite Board of Rabbis. The peaceful wing of this movement talks with Judaism; the street camps shout at it.","src":"JTA; Forward"},{"t":"The Nation of Yahweh is the movement's darkest chapter — and a different organization","d":"Hulon Mitchell Jr., 'Yahweh ben Yahweh,' built a Miami empire from 1979 — and in 1992 was convicted of conspiracy in a murder campaign (14 killings, including initiation murders of white victims). He served 11 years of an 18-year sentence. Be precise here: this group is organizationally distinct from the street camps and from peaceful Israelites; use it to show where racial theology can go, never as a smear of every fringe-wearer.","src":"Encyclopedia.com (trial record); Wikipedia"},{"t":"The SPLC designation is camp-specific, on purpose","d":"The SPLC lists over a hundred 'Radical Hebrew Israelite' groups as hate groups for antisemitic and anti-white teaching — and states in the same breath that most Hebrew Israelites are neither racist nor violent. The ADL draws the same line. The watchdogs distinguish street camps from the wider movement; a Christian talking to a neighbor should be at least as careful.","src":"SPLC 'Radical Hebrew Israelites' file; ADL backgrounder"},{"t":"The DNA evidence points across the Atlantic, not to the Levant","d":"A 2014-15 study in the American Journal of Human Genetics (5,269 self-identified African Americans) found ancestry averaging roughly 75% African and 24% European — with the African component tracing to West and Central Africa, the very regions the slave-trade records name. Handle with care: genetics answers the historical claim, but no chromosome makes anyone more or less an heir of Abraham (Gal 3:29).","src":"Bryc et al., AJHG 2015","id":"african-american-genetics"},{"t":"The Khazar theory failed its genetic test","d":"The claim that Ashkenazi Jews descend from medieval Turkic converts was tested genome-wide by more than twenty geneticists (Behar et al., Human Biology 2013): no evidence of Khazar origin; Ashkenazi Jews cluster with other Jewish communities and Middle Eastern populations. The one contrary study used modern Armenians and Georgians as stand-ins for Khazars — and was refuted on exactly that point.","src":"Behar et al. 2013","id":"khazar-impostor-theory"},{"t":"Kendrick Lamar put camp doctrine on a Pulitzer-adjacent album","d":"On DAMN. (2017), Kendrick raps 'I'm an Israelite, don't call me Black no more' ('YAH.') and closes 'FEAR.' with a voicemail from his cousin Carl Duckworth — an IUIC member — telling him Black people suffer under Deuteronomy 28's curses. Millions of listeners met 'precepts' language through those tracks. Kendrick later said he wasn't committed to the group; the doctrine still rode the album.","src":"Forward, 2017"},{"t":"October 2022 mainstreamed the talking points","d":"Kanye West defended his antisemitic outbursts by claiming 'Black people are actually Jew also,' and days later Kyrie Irving shared the film 'Hebrews to Negroes' — which calls modern Jews impostors — to millions of followers; the Nets suspended him when he wouldn't apologize. If someone in your life started using this vocabulary around then, that's likely the on-ramp.","src":"ADL; Rolling Stone; AJC"},{"t":"The violent edge is real, and the movement's critics aren't inventing it","d":"The December 2019 Jersey City kosher-market attackers, who murdered four people, had links to radical Hebrew Israelite ideology. Earlier that year, the Lincoln Memorial confrontation that went viral began with a 1West camp taunting a crowd. These are the acts of a radicalized fringe — but they're why calm, non-defensive engagement (not megaphone-vs-megaphone) matters.","src":"ADL; SPLC"}],"week":[{"t":"Sabbath, Friday sunset to Saturday sunset","d":"The seventh day is kept strictly — rest, assembly, teaching. Some strands (Dimona) even fast on it. It structures the entire week.","tip":"Never schedule your coffee or invite anything for Friday night or Saturday. Honoring their Sabbath without being asked communicates respect no argument can."},{"t":"The holy-day calendar","d":"Passover (with lamb or goat, bitter herbs, unleavened bread, wine), Unleavened Bread, Firstfruits, Tabernacles, New Moons — kept on a biblical-lunar calendar, not the church year.","tip":"Ask what Passover was like this year, genuinely. Then, when trust exists: 'Paul calls Christ our Passover lamb (1 Cor 5:7) — can I show you why?'"},{"t":"The holidays they refuse","d":"Christmas, Easter, birthdays and Halloween are rejected as pagan Babylon. Expect December to be a point of friction — and of loud certainty.","tip":"Don't die on the Christmas hill. Concede its date isn't biblical, then move to what matters: not the calendar of the celebration but the identity of the Child."},{"t":"Dietary law, with variations","d":"No pork or shellfish across the movement; Leviticus 11 is the baseline. The Dimona community goes further — full veganism as a return to Eden's diet.","tip":"Eat what they eat when you share a table; Paul's flexibility (1 Cor 9:20) applies. A shared clean-food meal is worth ten street debates."},{"t":"Fringes and garments","d":"Tassels with a blue cord on the borders of clothing (Numbers 15:38), worn to be seen and asked about. Camp uniforms add insignia and titles; some strands add head coverings for women.","tip":"Ask about the fringes — they wear them hoping someone will. It opens Numbers 15; note the tassels were to remind Israel of ALL the commandments, which leads honestly to Deut 27:26 and Gal 3."},{"t":"'Class' — the school model","d":"Camps run weekly 'classes,' not services: instructor at a podium, students with notebooks, Scripture drilled by call-and-response ('Precept!'), plus scheduled street sessions that function as both evangelism and training.","tip":"Understand that your friend isn't just attending church — he's enrolled. Counter a school with a table: unhurried whole-chapter reading, questions welcome, no podium."},{"t":"Hierarchy and discipline","d":"IUIC runs bishops → deacons → captains → officers → soldiers; other camps use their own ranks. Advancement, uniform standards and public correction create strong belonging — and strong pressure.","tip":"The structure meets a real hunger, especially for men: order, brotherhood, rank, purpose. Your church's answer can't be a handshake at the door. Invite him into actual responsibility-bearing brotherhood."},{"t":"Family and marriage teaching","d":"Strong male headship; modesty codes for women; children raised in the school. Some strands historically practiced polygamy (Dimona); street camps teach wifely submission in hard-edged terms.","tip":"If a wife or mother in your life is navigating a husband's conversion, she needs Ephesians 5 modeled, not quoted — the head who gives himself up. That contrast preaches."},{"t":"New names and a new language","d":"Members often take Hebrew names, greet with 'Shalom,' call God 'Yahawah' and Christ 'Yahawashi' (camp-specific renderings), and prize Paleo-Hebrew lettering. Language is the badge of waking up.","tip":"Use their name if they've changed it — it costs you nothing and removes a wall. The gospel question isn't the pronunciation of the Name but whether one has the Son (1 John 5:12)."}],"aboutyou":[{"t":"Your faith is 'the slave master's religion'","d":"Every conversation runs through this frame: Christianity was issued with the whip, so your gospel is the oppressor's sedative and your church a plantation artifact.","tip":"Concede the true part fast — slaveholder religion was real, and God hates it (Rev 18:13 lists slave-trading among Babylon's cargo). Then the history: Ethiopia and Egypt were Christian over a millennium before 1619, and the 'Slave Bible' had to cut Exodus out. The enslaved met the real Bible and heard freedom."},{"t":"Your Jesus is a painting","d":"They assume your mental Jesus is the blond of Sunday-school art, and that exposing the painting exposes the faith.","tip":"Agree about the art without blinking: Jesus was a brown-skinned Judean, and Europeanized portraits deserve critique. Then note the Bible itself gives no physical description except Isaiah 53:2 — 'no beauty that we should desire him.' The Word became flesh to be trusted, not color-matched."},{"t":"Your church is 'Babylon'","d":"Organized Christianity — Catholic, Protestant, Black church especially — is cast as the confusion system, its pastors as hirelings keeping Israel asleep.","tip":"Don't defend every church; defend Christ. Jesus scorched religious exploiters harder than any camp does (Matt 23), and Ezekiel 34 promises God himself will shepherd where shepherds failed. Ask: 'If some shepherds are false, who is the true one, and how would you recognize him?'"},{"t":"If you're white: you are Esau","d":"In street camps you may be addressed as 'Edomite' — cursed lineage, future slave, possibly told salvation isn't available to you at all. It's designed to make you either explode or leave.","tip":"Do neither. You're being handed centuries of real grievance in a single word — absorb it with unoffended calm (1 Pet 2:23). One honest question carries far: 'If Revelation 7:9 has every nation before the throne, who removed me?' And remember which listeners are watching how you take it."},{"t":"If you're a Black Christian: you are the target audience","d":"The camps aren't really preaching at white passersby — they're preaching at you. Expect 'asleep,' 'brainwashed,' and uglier words. Your existence as a joyful, Scripture-fluent Black Christian is the counter-argument they most need to neutralize.","tip":"You don't have to carry the whole race-and-faith debate on a sidewalk. Your unhurried confidence — 'I know exactly whose I am' (Gal 3:26-29) — plus a standing invitation is more destabilizing to the doctrine than any rebuttal."},{"t":"They expect you not to know your Bible","d":"The method is calibrated for Christians who can't locate Deuteronomy. Rapid-fire references overwhelm; your fumbling becomes the crowd's proof that the church teaches nothing.","tip":"Being able to open to the text, gently, changes the whole encounter. You don't need their speed — you need the contexts of five chapters: Deuteronomy 28-30, Galatians 3, Romans 9-11, Revelation 1, Acts 2. Depth beats velocity."},{"t":"The precept method is the engine — and the vulnerability","d":"'Precepts' chain half-verses across the canon so fast that no single text is ever read whole. The chain feels overwhelming; each link is fragile.","tip":"Never chase the chain. Pick ONE link and say: 'Let's read that entire chapter — I'll read it with you right now.' Whole-context reading is the single most disruptive thing you can do, because the method cannot survive it. (Even 'precept upon precept,' Isa 28, is scoffers being judged.)"},{"t":"They expect contempt or fear — warmth is the anomaly","d":"Camp preachers are used to two responses: mockery or a wide berth. A Christian who is unafraid, unmocking, learns names, and comes back next week does not fit the script — and the script is what holds the crowd.","tip":"Many members joined because the camp was the first place that took their questions about Black suffering seriously. Take those questions MORE seriously — the theodicy longing under the doctrine deserves a better answer than the chart, and you have one: the cross, where God entered the suffering."},{"t":"Their Scripture memory is real — honor it","d":"Whatever's wrong with the hermeneutic, many members have memorized more verses than most churchgoers, wear obedience on their clothing, and reordered their diets and weeks around the Bible. Dismissing them as ignorant is both false and fatal to the conversation.","tip":"Say it out loud: 'You take this Book more seriously than most people I know.' Then the one question that honors and probes at once: 'So let's read it in whole chapters — if it's true, it can survive its own context.'"}],"doctrine":[{"topic":"Who Israel is","theirs":"The twelve tribes are today's Black Americans, Hispanics and Native Americans, each nation mapped to a tribe on the chart; 'Israelite' is a bloodline identity recovered by waking up.","bible":"Israel is the covenant people descended from Jacob — and Scripture itself says descent was never the deepest thing: 'not all who are descended from Israel belong to Israel' (Rom 9:6). In Christ, everyone baptized into him is 'Abraham's seed, heirs according to promise.'","key":"Rom 9:6-8; Gal 3:26-29"},{"topic":"The curses of Deuteronomy 28","theirs":"The curses are a fingerprint identifying the true tribes: whoever suffered slavery in ships is Israel. The curses remain in force on Black people until they return to the laws.","bible":"The curses were covenant sanctions on the nation that stood at Sinai, historically executed in the Assyrian, Babylonian and Roman catastrophes. The chapter's sequel is Deut 30's promised restoration and heart-circumcision — accomplished in the New Covenant, where Christ 'became a curse for us.'","key":"Deut 28:15; 30:1-6; Gal 3:13"},{"topic":"The Messiah","theirs":"Most 1West camps do preach Christ — as 'Yahawashi,' a Black Israelite who came only for Israel's lost sheep, i.e. the chart's nations; his death avails for Israelites who keep the law.","bible":"Jesus is Israel's Messiah for the world: sent first to Israel's lost sheep, then commissioning disciples to all nations; the Lamb purchased people 'from every tribe and language and people and nation.' A Messiah who saves one bloodline is a different Messiah.","key":"Matt 15:24 with 28:19; John 3:16; Rev 5:9"},{"topic":"Salvation","theirs":"Nationality plus obedience: be of the tribes and keep the laws, statutes and commandments. Grace-alone is dismissed as a Gentile corruption.","bible":"'By works of the law no flesh shall be justified' — the law's own verdict (Deut 27:26) curses every non-perfect keeper. Salvation is by grace through faith in the crucified and risen Christ, for Jew first and also Greek, producing obedience rather than being purchased by it.","key":"Gal 3:10-13; Eph 2:8-10; Rom 3:19-26"},{"topic":"Paul","theirs":"Mainstream camps use Paul heavily (IUIC preaches from his letters); some fringe strands reject him as a false apostle who invented grace for Gentiles.","bible":"Paul was confronted by the risen Christ, examined by the Jerusalem apostles who added nothing to his gospel and gave him fellowship's right hand; Peter ranks his letters with 'the other scriptures.' Reject Paul and you must also explain Luke, Acts, and Peter.","key":"Gal 1:11-2:10; Acts 9; 2 Pet 3:15-16"},{"topic":"The resurrection hope","theirs":"Emphasis falls on a coming earthly reversal — Israel's national vindication, enemies subdued — more than on resurrection; teaching varies by camp and is often thin on the world to come.","bible":"The hope is bodily resurrection because Christ is bodily risen — 'the firstfruits of those who have fallen asleep' — then a renewed creation where death itself is destroyed. Vindication is real, but it's Christ's, shared with all who are his.","key":"1 Cor 15:20-26; Rom 8:18-25; Rev 21:1-4"},{"topic":"The Gentiles' place","theirs":"In extremist camps, non-tribe nations ('heathens,' Edomites) are excluded from the Kingdom or admitted only as servants of Israel; some teach whites cannot be saved at all.","bible":"The promise to Abraham was 'in you all the families of the earth shall be blessed'; Israel's calling was to be a light to the nations; the throne-room census is 'a great multitude no one could number, from every nation.' Gentiles enter as sons, not staff.","key":"Gen 12:3; Isa 49:6; Eph 2:11-22; Rev 7:9"},{"topic":"The modern Jewish people","theirs":"Khazar converts and Edomite impostors occupying Israel's name and land — a counterfeit to be exposed.","bible":"Genome-wide studies find no Khazar origin; more importantly, Paul — writing about Jews who rejected Christ — still calls them 'Israelites, to whom belong the adoption… beloved for the sake of the fathers,' and warns Gentile believers against arrogance toward the natural branches. Contempt for Jews is a disqualified posture, whoever holds it.","key":"Rom 9:3-5; 11:17-29"},{"topic":"Race and Esau","theirs":"Esau/Edom is the white race — hairy, red, cursed to servitude; 'Jacob I loved, Esau I hated' is a racial verdict on white people.","bible":"Edom was a specific brother-nation southeast of Judea, judged for violence against Jacob (Obadiah) and later absorbed into Judea — Herod was an Idumean. Malachi/Romans 9 concern God's electing purpose in redemptive history, not melanin. 'God shows no partiality' is apostolic bedrock.","key":"Obad 10-12; Rom 9:10-13 with Acts 10:34-35; 17:26"},{"topic":"The end times","theirs":"A coming reversal: the tribes awakened, regathered and ruling, with other races destroyed or serving them — extremist camps teach Edomites become slaves, reading texts like Isaiah 14:2 as a race-swap of masters and slaves.","bible":"Isaiah 14 in context is a taunt over fallen Babylon; the prophets' finale is not slavery inverted but slavery abolished — nations streaming to Zion to learn peace, a feast for all peoples, every knee bowing to the Lamb. A heaven with slave quarters is not the Bible's heaven.","key":"Isa 2:2-4; 25:6-8; Rev 21:24-26; 22:3"},{"topic":"The church","theirs":"'Babylon' — a slave-master construct; pastors are hirelings; leaving the church is the first step of waking up.","bible":"The church is Messiah's own assembly, which he loved and bought with his blood — a body where Jew and Gentile are one new man. Corrupt shepherds are real and judged (Ezek 34), but Christ builds his church and claims it as his bride, not Babylon's.","key":"Matt 16:18; Acts 20:28; Eph 2:14-16; 5:25"},{"topic":"The Name","theirs":"God is 'Yahawah' and Christ 'Yahawashi' (renderings vary by camp, derived from camp-specific Hebrew systems); using 'Jesus' or 'God' marks you as deceived.","bible":"Scripture itself moves between Hebrew, Aramaic and Greek — the apostles wrote 'Iesous' under inspiration, and 'everyone who calls on the name of the LORD will be saved' is applied to Jesus in Greek. Salvation hangs on whose name it is, not its transliteration.","key":"Acts 4:12; Rom 10:9-13; Phil 2:9-11"}]};

function renderKnow(){
  const tabs=[["kt-facts","✨ Did you know?"],["kt-week","🗓 Inside their week"],["kt-you","👀 What they're taught about you"]];
  if(KNOW.doctrine)tabs.push(["kt-doct","📖 Side by side"]);
  const on=state.knowTab||"kt-facts";
  $("#main").innerHTML=`<div class="viewhead"><h2>Know the movement</h2>
  <p>Understanding before argument. Surprising true facts for conversational fluency, the rhythm of their religious life so you can love them practically, and how they've been taught to see you — so nothing they say catches you off guard.</p></div>
  <div class="tabs2">${tabs.map(([k,l])=>`<button class="tab2 ${on===k?"on":""}" data-pane="${k}">${l}</button>`).join("")}</div>
  <div class="tabpane2 ${on==="kt-facts"?"on":""}" id="kt-facts"><div class="kgrid">${KNOW.didyouknow.map(x=>`<div class="ptcard">${x.img?`<img class="ktop" src="${x.img.src}" loading="lazy" data-full="${x.img.src.replace("width=520","width=1400")}" data-cap="${esc(x.img.cap)}">`:""}<h3 class="ptv">${esc(x.t)}</h3><p class="pt">${rich(x.d)}</p><div class="refs">${x.src?`<a href="${esc(x.src)}" target="_blank" rel="noopener">Source</a>`:""}${x.id&&byId[x.id]?` · <button class="klink" data-open="${x.id}">Related case: ${esc(byId[x.id].title)}</button>`:""}</div></div>`).join("")}</div></div>
  <div class="tabpane2 ${on==="kt-week"?"on":""}" id="kt-week">${KNOW.week.map(x=>`<div class="ptcard"><h3 class="ptv">${esc(x.t)}</h3><p class="pt">${rich(x.d)}</p>${x.tip?`<div class="who you">For you as their friend</div><p class="pt">${rich(x.tip)}</p>`:""}</div>`).join("")}</div>
  <div class="tabpane2 ${on==="kt-you"?"on":""}" id="kt-you">${KNOW.aboutyou.map(x=>`<div class="ptcard"><h3 class="ptv">${esc(x.t)}</h3><p class="pt">${rich(x.d)}</p>${x.tip?`<div class="who you">How to navigate it</div><p class="pt">${rich(x.tip)}</p>`:""}</div>`).join("")}</div>${KNOW.doctrine?`<div class="tabpane2 ${on==="kt-doct"?"on":""}" id="kt-doct">${KNOW.doctrine.map(x=>`<div class="ptcard"><h3 class="ptv">${esc(x.topic)}</h3><div class="ddgrid"><div><div class="who them">They teach</div><p class="pt">${rich(x.theirs)}</p></div><div><div class="who you">The Bible teaches</div><p class="pt">${rich(x.bible)}</p></div></div>${x.key?`<div class="ddkey">${rich(x.key)}</div>`:""}</div>`).join("")}</div>`:""}`;
  document.querySelectorAll("#main .tab2").forEach(t=>t.addEventListener("click",()=>{state.knowTab=t.dataset.pane;}));
  document.querySelectorAll("#main [data-open]").forEach(b=>b.addEventListener("click",()=>openCase(b.dataset.open)));
}

/* ---------- router ---------- */
function render(){
  if(state.view!=="case"&&location.hash.indexOf("#case/")===0)try{history.replaceState(null,"",location.pathname+location.search)}catch(e){}
  document.querySelector(".app").classList.toggle("reading",state.view!=="overview");
  renderNav();
  if(state.view==="case")return renderCase();
  if(state.view==="paths")return renderPaths(),renderPreview();
  if(state.view==="timeline")return renderTimeline(),renderPreview();
  if(state.view==="glossary")return renderGlossary(),renderPreview();
  if(state.view==="share")return renderShare(),renderPreview();
  if(state.view==="proofs")return renderProofs(),renderPreview();
  if(state.view==="theysay")return renderTheySay(),renderPreview();
  if(state.view==="lessons")return renderLessons(),renderPreview();
  if(state.view==="know")return renderKnow(),renderPreview();
  if(state.view==="core")return renderCore(),renderPreview();
  renderOverview();renderPreview();
}

/* ---------- keyboard ---------- */
document.addEventListener("keydown",e=>{
  const inInput=/input|textarea/i.test(document.activeElement.tagName);
  if(inInput){if(e.key==="Escape")document.activeElement.blur();return;}
  const list=filtered();
  const move=dir=>{
    const idx=list.findIndex(x=>x.id===state.sel);
    const next=list[Math.min(list.length-1,Math.max(0,(idx<0?0:idx+dir)))];
    if(!next)return;
    state.sel=next.id;
    if(state.view==="case"){openCase(next.id);}
    else{renderPreview();
      const el=document.querySelector(`.vt[data-id="${next.id}"]`);
      document.querySelectorAll(".vt.sel").forEach(x=>x.classList.remove("sel"));
      document.querySelectorAll(`.vt[data-id="${next.id}"]`).forEach(x=>x.classList.add("sel"));
      if(el)el.scrollIntoView({block:"nearest"});}
  };
  switch(e.key==="ArrowRight"?"next":e.key==="ArrowLeft"?"prev":e.key.toLowerCase()){
    case "next":e.preventDefault();move(1);break;
    case "prev":e.preventDefault();move(-1);break;
    case "enter":if(state.sel&&state.view!=="case")openCase(state.sel);break;
    case "escape":if(state.view==="case"){state.view=state.pathId?"paths":"overview";state.caseId=null;render();}else{state.q="";const q=$("#q");if(q)q.value="";state.verdict=null;state.severity=null;render();}break;
    case "o":state.view="overview";state.section="all";state.caseId=null;render();break;
    case "p":state.view="paths";state.caseId=null;render();break;
    case "t":state.view="timeline";state.caseId=null;render();break;
    case "g":state.view="glossary";state.caseId=null;render();break;
    case "s":state.view="share";state.caseId=null;render();break;
    case "h":state.view="core";state.caseId=null;render();break;
  }
});


const TOURKEY="wbb_tour";
const TOURSTEPS=[{"icon":"🦁","title":"Welcome to the examination","body":"<b>23 documented claims</b> taught in the Hebrew Israelite camps, each weighed against the Bible — with the biblical text cited on every case. Every claim carries the <b>strongest camp defense</b>, and where the camps are right, we say so. Popular Christian responses that fail are marked <b>do not use</b>."},{"icon":"⚖","title":"One movement, or many?","body":"The first thing to get right: <b>this is not one organization.</b> It runs from a 130-year-old denomination founded by a formerly enslaved Union veteran, through a vegan farming community in Israel, to the confrontational street camps in the viral clips. They disagree with each other bitterly. Arguments that treat them as one thing fail immediately — and deserve to."},{"icon":"🏷","title":"Four verdicts, one glance","body":"Every claim lands in one of four columns:<div class=\"vrow2\"><div><span class=\"badge v-admitted\">Admitted</span><span>the camps state it openly themselves</span></div><div><span class=\"badge v-unrefuted\">Unanswered</span><span>the objection is never engaged</span></div><div><span class=\"badge v-contested\">Contested</span><span>both sides hold something true</span></div><div><span class=\"badge v-answered\">Answered</span><span>the text settles it — after the concession</span></div></div>"},{"icon":"💬","title":"Concede before you answer","body":"Nearly every case on this site opens by granting what is true inside the claim — the church's long silence about slavery, the reality of the curses, the failure of cheap grace. That is not a rhetorical trick; it is the only order in which any of this can be heard. Each case ends with <b>“How the conversation usually goes”</b>, a scripted back-and-forth so you're never without the next move."},{"icon":"🚀","title":"Where to start","body":"Take the <b>identity path</b>: read Deuteronomy 28 verse 1 — <i>who is being addressed?</i> — then verse 68 in context, then chapter 30, where the same covenant promises the return. One chapter, read whole, is the entire argument. Replay this tour anytime from the sidebar.","cta":"Take me to the heart of it"}];
function startTour(){
  const old=document.querySelector(".tourwrap");if(old)old.remove();
  let ti=0;
  const wrap=document.createElement("div");wrap.className="tourwrap";
  function finish(go){localStorage.setItem(TOURKEY,"1");wrap.remove();if(go){state.view="core";state.caseId=null;render();}}
  function draw(){
    const s=TOURSTEPS[ti];
    wrap.innerHTML='<div class="tourcard"><div class="ticon">'+s.icon+'</div><h3>'+s.title+'</h3><div class="tbody">'+s.body+'</div>'+
      '<div class="tdots">'+TOURSTEPS.map((_,j)=>'<i class="'+(j===ti?"on":"")+'"></i>').join("")+'</div>'+
      '<div class="trow"><button class="tskip">Skip tour</button><div>'+(ti>0?'<button class="tback">Back</button>':'')+
      '<button class="tnext">'+(ti===TOURSTEPS.length-1?s.cta:'Next')+'</button></div></div></div>';
    wrap.querySelector(".tskip").addEventListener("click",()=>finish(false));
    const bk=wrap.querySelector(".tback");if(bk)bk.addEventListener("click",()=>{ti--;draw();});
    wrap.querySelector(".tnext").addEventListener("click",()=>{if(ti===TOURSTEPS.length-1){finish(ti===TOURSTEPS.length-1&&true);}else{ti++;draw();}});
  }
  document.body.appendChild(wrap);draw();
}
if(!localStorage.getItem(TOURKEY))setTimeout(startTour,500);

document.documentElement.dataset.theme=localStorage.getItem("wb_theme")||"dark";
$("#q").addEventListener("input",e=>{
  state.q=e.target.value.trim().toLowerCase();
  if(state.view!=="overview"){state.view="overview";state.caseId=null;}
  render();
});
window.addEventListener("hashchange",()=>{
  const m=location.hash.match(/^#case\/([A-Za-z0-9-]+)$/);
  if(m&&byId[m[1]]){if(state.caseId!==m[1])openCase(m[1]);}
  else if(!location.hash&&state.view==="case"){state.view="overview";state.caseId=null;render();}
});
