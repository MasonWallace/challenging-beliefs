 Knowledge","type":"primary","url":"https://isupk.com/about.html"},{"name":"Overview of the Black Hebrew Israelites (Jude 3 Project)","type":"apologetics","url":"https://jude3project.org/blog/2016/2/3/overview-of-the-black-hebrew-israelites"}],"response":"The camps argue that the promises of Scripture are overwhelmingly national and particular, made to a named people, and that universalising them is a later theft. Christ says He was not sent but to the lost sheep of the house of Israel. The new covenant in Jeremiah 31:31 is made 'with the house of Israel, and with the house of Judah,' not with the nations. The disciples are told at first not to go into the way of the Gentiles (Matthew 10:5-6). They read prophecies of the nations serving Israel (Isaiah 60:12; Isaiah 61:5-6) as describing the coming order rather than as metaphor. Their moral claim is that a God who watched four hundred years of atrocity without a reckoning would not be just, and that the promised judgment on oppressors is what makes Him just.","responseSource":{"name":"ISUPK and IUIC eschatological teaching; 1West-lineage exposition of Matthew 15:24 and Isaiah 60-61","url":"https://www.splcenter.org/resources/extremist-files/radical-hebrew-israelites/"},"verdict":"answered","rationale":"Honour the demand for justice inside the claim rather than mocking it. God does judge oppressors, and Scripture says so without embarrassment. The church that stayed quiet through slavery is in no position to be impatient here. But the particularity argument dies on its own proof text. Matthew 15:24 is spoken four verses before Jesus heals a Canaanite woman's daughter and praises her faith. Matthew 10:5-6 describes one limited mission, and Matthew 28:19 explicitly supersedes it. Acts 10 is a set-piece written to settle this exact question, and Peter has to be corrected by God to reach it. Isaiah 49:6 calls it 'a light thing' to raise up the tribes of Jacob, and gives the servant the greater commission of being a light to the Gentiles. The doctrine also has a documented harm record, which the ADL and SPLC files set out.","severity":"high","plain":[{"t":"What the strongest camps teach","d":"That salvation belongs to the twelve tribes alone — Black, Hispanic and Native Americans. And that at Christ's return the Edomites will be killed or enslaved. The anchor text is Matthew 15:24: <b>\"I am not sent but unto the lost sheep of the house of Israel.\"</b>"},{"t":"What happens next in that chapter","d":"Read on. The Canaanite woman answers him, and he says <b>\"O woman, great is thy faith: be it unto thee even as thou wilt.\"</b> The verse they quote is in a story that ends the other way."},{"t":"Their answer, at full strength","d":"That the promises of Scripture are national and particular, made to a named people, and that universalising them is a later theft. Jeremiah 31:31 makes the new covenant \"with the house of Israel.\" That is a real observation, and much of the church has been careless about it."},{"t":"Where it dies","d":"On its own texts. Isaiah 49:6 makes the servant \"a light to the Gentiles.\" Genesis 12:3 promises that in Abraham all families of the earth will be blessed. The particularity was always aimed at the nations."},{"t":"How strong is this argument?","d":"The text answers this one decisively. But honour the demand for justice inside it rather than mocking it."},{"say":true,"t":"What to say","d":"\"Read me the rest of Matthew 15. What does he say to the woman?\""}],"rewritten":true,"refwhy":{"Matthew 15:21-28":"Their anchor text and its ending together. Jesus says he was sent only to Israel, then heals a Canaanite woman and praises her faith.","Acts 10:34-35":"'God is no respecter of persons: but in every nation he that feareth him is accepted.' Peter says it after God has corrected him.","Acts 10:44-48":"The Spirit falls on a Roman household before anyone can baptise them. The decision is taken out of the church's hands.","Acts 15:7-11":"The Jerusalem council rules that gentiles are saved the same way Jews are. The question was raised, argued and settled in writing.","Ephesians 2:11-19":"The 'middle wall of partition' is broken down, and strangers become fellow citizens. The clearest statement that the boundary is gone.","Revelation 7:9":"The redeemed are 'of all nations, and kindreds, and people, and tongues.' From the book the camps quote most often.","Isaiah 49:6":"Raising up the tribes of Jacob is called 'a light thing.' The servant is also 'a light to the Gentiles.' The Hebrew Bible says it first.","Matthew 28:19":"'Go ye therefore, and teach all nations.' The limited mission of Matthew 10 is replaced by this, at the end of the same book."},"titleLong":"Salvation limited to the tribes, and judgment by race at Christ's return","quran":[],"hadith":[]},
{"id":"law-keeping-salvation","title":"Salvation by Sabbath, fringes and feast-keeping","category":"law-and-salvation","claim":"Camps teach that salvation requires keeping the commandments as given at Sinai. That means the seventh-day Sabbath, the feasts, the dietary restrictions, and fringes on the garment (Numbers 15:38-40). It also means rejecting Christmas and Easter as pagan. Paul addresses this arrangement directly and at length. 'By the deeds of the law there shall no flesh be justified in his sight' (Romans 3:20). 'A man is not justified by the works of the law, but by the faith of Jesus Christ' (Galatians 2:16). Galatians 3:10 states the terms starkly: 'as many as are of the works of the law are under the curse: for it is written, Cursed is every one that continueth not in all things which are written in the book of the law to do them.' Paul is quoting Deuteronomy 27:26, the introduction to the very curse chapter the movement uses as its identity document. Acts 15:10 calls the requirement a yoke 'which neither our fathers nor we were able to bear.' Galatians 5:4 warns that those seeking justification by law are fallen from grace.","bible":["Romans 3:20-28","Galatians 2:16","Galatians 3:10-13","Galatians 5:4","Acts 15:10-11","Ephesians 2:8-9","Deuteronomy 27:26","Colossians 2:16-17"],"sources":[{"name":"About IUIC - Israel United in Christ","type":"primary","url":"https://israelunite.org/about-iuic-2/"},{"name":"The Israelite School of Universal Practical Knowledge","type":"primary","url":"https://isupk.com/about.html"},{"name":"Refuting the Black Hebrew Israelites (IUIC)","type":"apologetics","url":"https://medium.com/@whatsoeverthingsaretrue/refuting-the-black-hebrew-israelites-iuic-3d966163292a"},{"name":"Black Hebrew Israelism: A Refutation Guide for Christians","type":"apologetics","url":"https://thegoodnewsapologetics.wordpress.com/2018/01/04/black-hebrew-israelism-a-refutation-guide-for-christians/"},{"name":"Zihiri, Comparing the Preaching Strategies of Black Hebrew Israelite Camps (UCLA)","type":"scholarly","url":"https://religion.ucla.edu/wp-content/uploads/2020/07/Saifeldeen-Zihiri-Ambassadors-of-Christ-and-Israel-United-in-Christ_-Comparing-the-Preaching-Strategies-of-Black-Hebrew-Israelite-Camps.pdf"}],"response":"Their argument is that mainstream Christianity has used grace to abolish obedience, and that Scripture will not permit it. Jesus said 'Think not that I am come to destroy the law,' and that not one jot or tittle would pass till all be fulfilled (Matthew 5:17-18). He said 'If ye love me, keep my commandments' (John 14:15). James says faith without works is dead (James 2:17-26), and that whoever keeps the whole law yet offends in one point is guilty of all (James 2:10). John defines love of God as keeping His commandments, and adds that they are not grievous (1 John 5:3). Revelation twice describes the saints as those who keep the commandments of God and the faith of Jesus (Revelation 12:17; 14:12). A gospel that produces no obedience, they argue, is the innovation here, not their position.","responseSource":{"name":"IUIC and ISUPK doctrinal teaching on law observance; standard camp use of Matthew 5:17 and James 2","url":"https://israelunite.org/about-iuic-2/"},"verdict":"answered","rationale":"This is where the site should be most careful, because half the critique lands. Cheap grace is a real distortion, and the texts they cite are real texts. Concede that obedience is not optional and that James means what he says. Then draw the line the New Testament draws. The question is not whether the redeemed obey. It is whether obedience is the ground of acceptance. Paul answers that in Galatians 3:10 by quoting Deuteronomy 27:26, the doorway to the curse chapter itself, and the logic bites hard in this specific case. The movement uses Deuteronomy 28 to prove it is under the curse, then proposes law-keeping as the remedy. Paul says law-keeping is the very system that administers the curse. James 2 addresses the evidence of living faith, not its basis, and Ephesians 2:8-10 holds both together in three verses.","severity":"high","plain":[{"t":"What they teach","d":"That you are saved by keeping the rules given at Sinai. The seventh-day Sabbath. The feasts. The food laws. Fringes on your clothes. And no Christmas or Easter, which they treat as pagan."},{"t":"Concede the half that lands","d":"Their real complaint is that mainstream Christianity has used grace to abolish obedience. That complaint is fair, and the church earned it. Jesus said <b>\"If ye love me, keep my commandments.\"</b> James says faith without works is dead. Those are real texts and they mean what they say."},{"t":"Where the disagreement actually is","d":"Not whether obedience matters. Whether it saves. Galatians 3:10 — <b>\"as many as are of the works of the law are under the curse\"</b> — and Galatians 5:3, where anyone taking on the law is bound to keep <i>all</i> of it. Paul's argument is not that the law is bad. It is that it cannot do this job."},{"t":"The question with no answer inside the system","d":"If salvation comes by keeping the law, what is the atonement when you fail? There has been no altar since AD 70."},{"t":"How strong is this argument?","d":"This one has a clear answer from the text. But go slowly here. Half of what they are saying is right."},{"say":true,"t":"What to say","d":"\"When you break it — and we all do — what covers that?\""}],"rewritten":true,"refwhy":{"Romans 3:20-28":"'By the deeds of the law there shall no flesh be justified.' Paul's clearest line that law-keeping is not the ground of acceptance.","Galatians 2:16":"'A man is not justified by the works of the law, but by the faith of Jesus Christ.' The same point made three times in one verse.","Galatians 3:10-13":"The heart of this case. Those under the law are 'under the curse,' and Christ redeemed them from it. Curse language, to a movement built on curses.","Galatians 5:4":"Whoever seeks to be justified by the law is 'fallen from grace.' Blunt, and it names what this case is actually about.","Acts 15:10-11":"The apostles call the requirement a yoke 'which neither our fathers nor we were able to bear.' A Jewish council saying it about itself.","Ephesians 2:8-9":"Saved by grace through faith, 'not of works.' Read verse 10 as well, which puts good works after salvation rather than under it.","Deuteronomy 27:26":"The verse Galatians 3:10 quotes. It opens the very curse chapter the movement uses as its identity document. Read both together.","Colossians 2:16-17":"Names the exact practices at issue: food, drink, feast days and sabbaths. Paul calls them a shadow of what has come."},"titleLong":"Salvation by keeping the law","quran":[],"hadith":[]},
{"id":"bloodline-versus-abrahams-offspring-by-faith","title":"Abraham's children by faith, not by blood","category":"law-and-salvation","claim":"The movement makes descent the gate: you must be of the tribes to be saved. Paul takes up precisely this question and answers it. 'Know ye therefore that they which are of faith, the same are the children of Abraham' (Galatians 3:7). 'There is neither Jew nor Greek... for ye are all one in Christ Jesus. And if ye be Christ's, then are ye Abraham's seed, and heirs according to the promise' (Galatians 3:28-29). 'He is not a Jew, which is one outwardly... but he is a Jew, which is one inwardly; and circumcision is that of the heart, in the spirit, and not in the letter' (Romans 2:28-29). 'They are not all Israel, which are of Israel: neither, because they are the seed of Abraham, are they all children' (Romans 9:6-7). John the Baptist forecloses the appeal to descent: 'God is able of these stones to raise up children unto Abraham' (Matthew 3:9). And Jesus tells men who claimed Abraham as father that descent without Abraham's works proves nothing (John 8:37-44).","bible":["Galatians 3:7-9","Galatians 3:26-29","Romans 2:28-29","Romans 9:6-8","Romans 8:15-17","Matthew 3:9","John 8:37-44","Romans 11:1","Jeremiah 31:35-37","Galatians 4:4-7"],"sources":[{"name":"Who Are the Hebrew Israelites and What Do They Believe? (Jude 3 Project)","type":"apologetics","url":"https://jude3project.org/blog/2016/4/29/kzqeier0z8b1u1uk5lf186jhu5s8r5"},{"name":"About IUIC - Israel United in Christ","type":"primary","url":"https://israelunite.org/about-iuic-2/"},{"name":"Refuting the Black Hebrew Israelites (IUIC)","type":"apologetics","url":"https://medium.com/@whatsoeverthingsaretrue/refuting-the-black-hebrew-israelites-iuic-3d966163292a"},{"name":"Zihiri, Comparing the Preaching Strategies of Black Hebrew Israelite Camps (UCLA)","type":"scholarly","url":"https://religion.ucla.edu/wp-content/uploads/2020/07/Saifeldeen-Zihiri-Ambassadors-of-Christ-and-Israel-United-in-Christ_-Comparing-the-Preaching-Strategies-of-Black-Hebrew-Israelite-Camps.pdf"},{"name":"Who Are the Black Hebrew Israelites? (American Jewish Committee)","type":"institutional","url":"https://www.ajc.org/news/who-are-the-black-hebrew-israelites"}],"response":"This is their strongest theological ground, and it should be stated at full strength. Romans 11:1 asks 'Hath God then cast away his people?' and answers 'God forbid.' Jeremiah 31:35-37 stakes Israel's permanence on the fixed order of sun, moon and stars. Only if those ordinances depart shall the seed of Israel cease from being a nation. Paul spends Romans 9 through 11 insisting that God's gifts and calling to Israel are without repentance (Romans 11:29). So Galatians 3:28 addresses standing before God in Christ, they argue, not the abolition of national Israel. Reading it as erasure produces the replacement theology that let the church tell Jews for centuries that they were nobody. If God has not cast off Israel, then who Israel is remains a live and urgent question, not a settled irrelevance.","responseSource":{"name":"IUIC teaching on Romans 11 and the irrevocability of Israel's election; camp critiques of replacement theology","url":"https://jude3project.org/blog/2016/4/29/kzqeier0z8b1u1uk5lf186jhu5s8r5"},"verdict":"answered","rationale":"Answered, but only if the steelman is granted first, because on the anti-replacement point they are right and much of the church has been wrong. God has not cast away His people. Israel's election is irrevocable, and any answer that requires the church to have replaced Israel should be refused. Grant all of it, and the argument still fails at the joint. That God preserves Israel establishes that Israel continues. It says nothing about which modern population Israel is, and Romans 11:1 grounds the answer in a Benjamite named Paul. More decisively, nothing in Romans 9 through 11 makes ancestry the condition of salvation. Paul's own summary is that whosoever calls on the name of the Lord shall be saved, for there is no difference between Jew and Greek (Romans 10:12-13). This is also where the pastoral answer lands. Adoption (Romans 8:15-17; Galatians 4:4-7) offers by grace the belonging the movement is trying to prove by genealogy.","severity":"high","plain":[{"t":"The real dividing line","d":"Not race. This. The movement makes descent the gate: you must be of the tribes to be saved. Everything else is downstream of that."},{"t":"How Paul answers it","d":"He takes up exactly this question. Galatians 3:7 — <b>\"they which are of faith, the same are the children of Abraham.\"</b> Galatians 3:28-29 — <b>\"there is neither Jew nor Greek… and if ye be Christ's, then are ye Abraham's seed, and heirs according to the promise.\"</b>"},{"t":"Grant their strongest ground first","d":"They are right about something the church has often got wrong. Romans 11:1 asks whether God has cast away his people and answers <b>\"God forbid.\"</b> Jeremiah 31:35-37 stakes Israel's permanence on the sun and moon. God has not finished with Israel, and any Christian who says otherwise is contradicting his own book."},{"t":"Why that does not get them there","d":"Paul was arguing against the same mistake running the other way. In his day it was Jewish believers wanting Gentiles kept out. He wrote a whole letter to stop it."},{"t":"How strong is this argument?","d":"The text answers this one — but only if you grant the anti-replacement point first and mean it."},{"say":true,"t":"What to say","d":"\"God hasn't cast off Israel — I agree with you there. So why does Galatians 3 say what it says?\""}],"rewritten":true,"refwhy":{"Galatians 3:7-9":"'They which are of faith, the same are the children of Abraham.' Paul answering the exact question the movement asks.","Galatians 3:26-29":"'If ye be Christ's, then are ye Abraham's seed, and heirs according to the promise.' Faith is the gate here, not descent.","Romans 2:28-29":"Circumcision 'of the heart, in the spirit, and not in the letter.' Paul reopens who counts, without saying anyone is thrown out.","Romans 9:6-8":"'They are not all Israel, which are of Israel.' Written by a Jew about his own people, which is why it can be said at all.","Romans 8:15-17":"The Spirit of adoption, crying 'Abba, Father,' making believers joint-heirs. This is what the case is finally offering instead of a chart.","Matthew 3:9":"'God is able of these stones to raise up children unto Abraham.' John shuts the door on any argument resting on ancestry alone.","John 8:37-44":"Jesus tells men claiming Abraham as father that descent without Abraham's works proves nothing. Handle with care: this text has an ugly history of misuse.","Romans 11:1":"'Hath God cast away his people? God forbid.' Their strongest ground, and they are right about it. Grant it before you say anything else.","Jeremiah 31:35-37":"Israel's permanence tied to the sun and moon. The anti-replacement text. Any Christian answer that erases Israel is contradicting this.","Galatians 4:4-7":"Sonship comes by adoption, not by descent. This is the verse the bloodline argument has to answer."},"titleLong":"Bloodline versus Abraham's offspring by faith","quran":[],"hadith":[]},
{"id":"movement-origins-1886-1969","title":"The first Hebrew Israelite church opened in 1886","category":"movement-history","claim":"The movement's institutional history is documented, recent and American. Frank S. Cherry founded the Church of the Living God, the Pillar Ground of Truth for All Nations. That was in Chattanooga in 1886. He taught that Adam, Eve and Jesus were Black, and that African Americans lost their Hebrew identity in slavery. William Saunders Crowdy was born enslaved in Maryland in 1847, and later served in the Union Army. After visions that Blacks descended from the lost tribes, he founded the Church of God and Saints of Christ. That was in Lawrence, Kansas, in 1896. It is still the oldest surviving Hebrew Israelite body in the United States. Wentworth Arthur Matthew was born in St Kitts. He founded the Commandment Keepers in Harlem in 1919. He identified with the Beta Israel of Ethiopia, and set up a rabbinical academy. Abba Bivens was born Edward Meredith Bibbins. He left the Commandment Keepers in 1969, over the status of the New Testament. He founded a school at 1 West 125th Street in Harlem, and died in 1973. His successors then codified the KJV-only stance, the 12 Tribes Chart and Lashawan Qadash. The One West line later split into ISUPK, the Israelite Church of God in Jesus Christ, IUIC, GOCC, Great Millstone and others.","bible":["Jeremiah 23:16","Jude 1:3","Acts 17:11"],"sources":[{"name":"History of Hebrew Israelism (SPLC Intelligence Report)","type":"institutional","url":"https://www.splcenter.org/resources/reports/history-hebrew-israelism/"},{"name":"One West Camp","type":"scholarly","url":"https://en.wikipedia.org/wiki/One_West_Camp"},{"name":"Church of God and Saints of Christ (founded by W. S. Crowdy, 1896)","type":"scholarly","url":"https://en.wikipedia.org/wiki/Church_of_God_and_Saints_of_Christ"},{"name":"Biography of Rabbi Wentworth Arthur Matthew (blackjews.org)","type":"institutional","url":"https://www.blackjews.org/biography-of-rabbi-wentworth-arthur-matthew/"},{"name":"Vocab Malone, A Brief History on Hebrew Israelism","type":"apologetics","url":"https://www.patreon.com/vocab/posts/brief-history-on-57295726"}],"response":"Adherents draw a sharp line between the age of an identity and the age of an organisation. Israel did not begin in 1896. The gospel did not begin with the Reformation. Crowdy, Cherry and Matthew were not founding a people. They were recovering knowledge of one. That is what a restoration looks like after a curse took away name and memory. They point to Josiah, who rediscovered the book of the law after generations of ignorance (2 Kings 22:8-13). They point to Ezra, reading the law to a people who wept because they had not known it (Nehemiah 8:9). They also note that some strands are older, and not American. They cite the Beta Israel of Ethiopia, and West African communities with Jewish practice. A movement of the dispossessed will always look organisationally recent, they argue. The dispossessed had no institutions to preserve.","responseSource":{"name":"Standard Hebrew Israelite framing of the founders as restorers; AHIJ and 1West-lineage historical self-presentation","url":"https://www.splcenter.org/resources/reports/history-hebrew-israelism/"},"verdict":"admitted","rationale":"Graded admitted, because the facts are not in dispute. The movement's own histories name these founders and these dates. The restoration framing concedes them rather than contests them. The Josiah analogy is fair as far as it goes. But it breaks at a specific point. Josiah rediscovered a document. Ezra read from a text that already existed. The One West additions have no recovered source. The 12 Tribes Chart, the Lashawan Qadash sounds and the tribal assignments appear first in 1970s Harlem. There is no manuscript, no earlier community, and nothing attested outside the movement. The Beta Israel appeal also cuts the wrong way. That is a genuinely ancient community, with a continuous tradition, documented practice and its own texts. That is exactly the kind of evidence the camps cannot produce for themselves.","severity":"high","plain":[{"t":"What the record shows","d":"The movement's history is documented, recent and American. Frank Cherry founded a church in Chattanooga in 1886. William Saunders Crowdy was born enslaved in Maryland in 1847 and served in the Union Army. In 1896 he founded the Church of God and Saints of Christ in Kansas. Wentworth Matthew founded the Commandment Keepers in Harlem in 1919. Ben Ammi led his group to Israel in 1969."},{"t":"Their answer, at full strength","d":"That the age of an identity is not the age of an organisation. Israel did not begin in 1896 any more than the gospel began with the Reformation. Crowdy and Matthew were recovering knowledge of a people, not founding one. That is exactly what a restoration looks like from the inside."},{"t":"What that concedes","d":"The facts. Nobody disputes the names or the dates — they are in the movement's own histories. The disagreement is only about what they mean."},{"t":"How strong is this argument?","d":"They admit this themselves. That means you can make this point entirely from their own sources, which is the only way it will be heard."},{"t":"Why this helps you","d":"A recovered ancient identity with a documented founder in living memory is worth thinking about slowly. Ask about it with curiosity, not as a gotcha."},{"say":true,"t":"What to say","d":"\"When did the movement start teaching this, and who taught it first? I'd like to read them.\""}],"rewritten":true,"refwhy":{"Jeremiah 23:16":"Warns of prophets who 'speak a vision of their own heart, and not out of the mouth of the LORD.' The founders' claims rest on visions.","Jude 1:3":"'The faith which was once delivered unto the saints.' Something once delivered has a source you can name. That is the question here.","Acts 17:11":"The Bereans 'searched the scriptures daily, whether those things were so.' They are commended for checking. A chart deserves the same check."},"titleLong":"A nineteenth-century American origin for a claimed ancient identity","quran":[],"hadith":[]},
{"id":"year-2000-failed-prophecy","title":"They preached Christ's return in 2000, then rebranded","category":"movement-history","claim":"During the 1990s the Israelite Church taught publicly that Christ would return in the year 2000. It stood in the One West lineage. He would destroy or enslave the Edomites. The prophecy is associated with the teacher Ahrayah. The year came and went. The organisation then rebranded as the Israelite Church of God in Jesus Christ, the name it still uses. In late 2000 Jermaine Grant took it over. He assumed the title Chief High Priest Tazadaqyah, and declared himself the Comforter and the Holy Spirit. Scripture supplies its own test here. Deuteronomy 18:20-22 says a prophet may speak in the name of the LORD and the thing may not follow. Then the LORD has not spoken it, and the people need not fear him. Jesus is equally direct: 'But of that day and hour knoweth no man, no, not the angels of heaven, but my Father only' (Matthew 24:36). A movement that stakes its authority on reading prophecy correctly invited this measurement.","bible":["Deuteronomy 18:20-22","Matthew 24:36","Jeremiah 28:15-17","Matthew 24:23-26"],"sources":[{"name":"Racist Black Hebrew Israelites Becoming More Militant (SPLC Intelligence Report)","type":"institutional","url":"https://www.splcenter.org/resources/reports/racist-black-hebrew-israelites-becoming-more-militant/"},{"name":"Israelite Church of God in Jesus Christ","type":"scholarly","url":"https://en.wikipedia.org/wiki/Israelite_Church_of_God_in_Jesus_Christ"},{"name":"History of Hebrew Israelism (SPLC Intelligence Report)","type":"institutional","url":"https://www.splcenter.org/resources/reports/history-hebrew-israelism/"},{"name":"Extremist Sects Within the Black Hebrew Israelite Movement (ADL)","type":"institutional","url":"https://www.adl.org/resources/backgrounder/extremist-sects-within-black-hebrew-israelite-movement"},{"name":"Black Hebrew Israelism: A Refutation Guide for Christians","type":"apologetics","url":"https://thegoodnewsapologetics.wordpress.com/2018/01/04/black-hebrew-israelism-a-refutation-guide-for-christians/"}],"response":"Present-day camps mostly answer by disowning the man, not defending the prediction. ISUPK and IUIC are separate organisations from the Israelite Church of God in Jesus Christ. A teacher in one camp does not bind another. The movement has no central authority. So pinning one camp's failure on all of them is like indicting all Protestants for one denomination's date-setting. Some add that Christians have no standing here. They point to William Miller in 1844, and a long line of Christian date-setters since. A failed prediction does not falsify the identity claim underneath, they argue, any more than Miller falsified the resurrection. Others reframe the date. It marked a spiritual transition, or a sharpening of judgment, rather than a visible return.","responseSource":{"name":"Contemporary ISUPK and IUIC distancing from the ICGJC lineage; general camp responses to the date-setting charge","url":"https://www.splcenter.org/resources/reports/racist-black-hebrew-israelites-becoming-more-militant/"},"verdict":"admitted","rationale":"Graded admitted, because it is all in the movement's own institutional record. The prediction, the failure, the rebrand and the succession are documented. But grade the scope conservatively, and say so on the page. This binds the ICGJC lineage. Today's ISUPK or IUIC member can fairly say it was not his camp. The comparison with Miller is fair too. Christians should own their own date-setters rather than dodge. What remains after both concessions is still substantial. Deuteronomy 18:22 is a standard the movement applies to others. The answer to failure was not repentance. It was a rebrand, and a leader claiming to be the Holy Spirit. And the same lineage produced the doctrinal apparatus the street camps still teach.","severity":"high","plain":[{"t":"What was predicted","d":"In the 1990s the Israelite Church taught in public that Christ would return in the year 2000. He would destroy or enslave the Edomites. The teaching is tied to a teacher named Ahrayah."},{"t":"What happened","d":"The year came and went. The organisation rebranded, and the leadership changed hands. All of that sits in the movement's own record, not in a critic's account."},{"t":"Their answer, at full strength","d":"Most present-day camps disown the man rather than defend the prediction. ISUPK and IUIC are separate groups. The movement has no central authority. So one camp's failure does not bind another. That is a fair point about scope, and you should grant it."},{"t":"The test that applies","d":"Deuteronomy 18:22 gives one rule for a voice claiming to speak for God: if the thing does not happen, God did not say it. That is the same test this site applies to every other movement it examines."},{"t":"How strong is this argument?","d":"They admit this themselves: the prediction, the failure and the rebrand are all documented. But keep the scope narrow. This binds one lineage, not the whole movement."},{"say":true,"t":"What to say","d":"\"What happened in 2000? And what does Deuteronomy 18:22 say about that?\""}],"rewritten":true,"refwhy":{"Deuteronomy 18:20-22":"The Torah's own test. If a prophet speaks and the thing does not happen, God did not say it. The movement applies this test to others.","Matthew 24:36":"'Of that day and hour knoweth no man.' Jesus rules out the whole business of naming a year.","Jeremiah 28:15-17":"Hananiah predicts a date. Jeremiah tells him he will die that year, and he does. Scripture showing the test being used.","Matthew 24:23-26":"Warns about people saying 'lo, here is Christ.' It matters because the leader who followed the failed date claimed to be the Holy Spirit."},"titleLong":"The year 2000 prophecy and what happened when it failed","quran":[],"hadith":[]},
{"id":"ben-ammi-dimona-community","title":"Ben Ammi taught immortality; he died in 2014","category":"movement-history","claim":"Say this clearly before anything else. The African Hebrew Israelites of Jerusalem are not a street camp, and must never be called one. Ben Ammi Carter was a metalworker in Chicago. He reported a vision in 1966, calling him to lead African Americans to the promised land. Families arrived in Liberia from July 1967. They endured roughly two and a half years of hardship, disease and loss. The first of them reached Israel at the end of 1969. By 1970 forty-eight families had entered, claiming the Law of Return. Israel recognised them as non-Jews, and many faced deportation. The community settled in Dimona. They were granted permanent residency in 1990, and later a path to citizenship. Ben Ammi himself became a citizen in 2013. Today roughly two to three thousand live in Dimona, Arad and Mitzpe Ramon. They keep a vegan diet, a shared economy and a Hebrew calendar. Members serve in the IDF, and one represented Israel at Eurovision. Ben Ammi taught that physical immortality was the state God intended for us. He died in December 2014, at seventy-five. He was survived by four wives and more than twenty children.","bible":["Genesis 3:19","Hebrews 9:27","1 Corinthians 15:20-26","1 Corinthians 15:53-57","Deuteronomy 18:22"],"sources":[{"name":"African Hebrew Israelites of Jerusalem (Critical Dictionary of Apocalyptic and Millenarian Movements)","type":"scholarly","url":"https://www.cdamm.org/articles/ahij"},{"name":"African Hebrew Israelites of Jerusalem (World Religions and Spirituality Project)","type":"scholarly","url":"https://wrldrels.org/2023/01/06/african-hebrew-israelites-of-jerusalem/"},{"name":"African Hebrew Israelites of Jerusalem, official site","type":"primary","url":"https://africanhebrewisraelitesofjerusalem.com/"},{"name":"Spiritual Leader of the African Hebrew Israelites Dies (JTA)","type":"journalism","url":"https://www.jta.org/2014/12/29/israel/spiritual-leader-of-the-african-hebrew-israelites-dies-1"},{"name":"At Memorial for African Hebrew Leader, Signs of Integration and Respect (Times of Israel)","type":"journalism","url":"https://www.timesofisrael.com/at-memorial-for-african-hebrew-leader-signs-of-integration-and-respect/"}],"response":"The community frames its history as vindication by endurance. They left everything. They survived Liberia. They arrived with no status, and were threatened with deportation. And they built a working society that Israel came to recognise, and that now sends its sons to the army. That is not the path of a hate group, and not the path of a fraud. Since Ben Ammi's death, members have adjusted rather than given up. Immortality is the end goal of a people being made new. It arrives slowly, as lifespans extend in the messianic age. It was never a promise to any one person now. They point to their own health outcomes. They point to a vegan practice traced to Genesis 1:29, and to decades of settled communal life. The way of life delivers what it promises, they say, whatever timeline the founder's own body kept.","responseSource":{"name":"AHIJ official teaching and post-2014 community statements; Ben Ammi's published writings on regeneration and immortality","url":"https://www.cdamm.org/articles/ahij"},"verdict":"answered","rationale":"The historical facts here are agreed on all sides. What is examined is the teaching. Ben Ammi taught something testable about the natural state of a people made new. Its author died at seventy-five. The softening to an end goal is a real theological move. It is also a retreat. Scripture already teaches that death is an enemy destroyed by resurrection, not by diet (1 Corinthians 15:20-26, 53-57). Two things must be said alongside that. First, the identity claim underneath rests on the same thin foundation as the street camps', and fails the same way. Second, and just as important here, nothing about this community earns the tone you would use with a street camp. They are peaceable neighbours. Treating Dimona and One West as one thing is false, and a good way to lose every hearing worth having.","severity":"medium","plain":[{"t":"Say this before anything else","d":"The African Hebrew Israelites of Jerusalem are not a street camp. Never call them one. Ben Ammi Carter was a metalworker in Chicago. He said he had a vision in 1966. Families went to Liberia in 1967, then to Dimona in Israel in 1969. They built a vegan town where property is shared and violence is refused. It still stands. Its sons now serve in the Israeli army."},{"t":"Why this case matters","d":"Because it is the clearest proof that this movement is not one thing. Any claim that puts Dimona and a street camp in the same box is false about both of them."},{"t":"What is actually examined here","d":"Not the town. The teaching. Ben Ammi taught that a people made new would not die. That is a claim you can check."},{"t":"What happened to it","d":"He died in 2014, at seventy-five."},{"t":"How strong is this argument?","d":"This one has a clear answer on the teaching. The history is agreed by everyone, and what they built is genuinely impressive. Say so."},{"say":true,"t":"What to say","d":"\"I've read about Dimona and I respect what they built. Can I ask about one of Ben Ammi's teachings?\""}],"rewritten":true,"refwhy":{"Genesis 3:19":"'Dust thou art, and unto dust shalt thou return.' The plainest answer to a teaching that a renewed people would not die.","Hebrews 9:27":"'It is appointed unto men once to die.' One sentence, and it is the whole of what this case examines.","1 Corinthians 15:20-26":"Death is 'the last enemy,' destroyed by resurrection. Scripture does promise the end of death, but not through diet or discipline.","1 Corinthians 15:53-57":"The mortal 'must put on immortality.' The hope itself is real. It arrives by resurrection, and not before.","Deuteronomy 18:22":"The test again. Ben Ammi made a claim you can check. Say what this community built before you check it."},"titleLong":"Ben Ammi, Dimona, and the peaceful strand","quran":[],"hadith":[]},
{"id":"splc-hate-designation","title":"The SPLC lists three camps as extremist","category":"movement-history","claim":"The Southern Poverty Law Center keeps an extremist file on Radical Hebrew Israelites. It names three groups as the largest and most active listed: Great Millstone, the Israelite School of Universal Practical Knowledge, and Israel United in Christ. Read the caveats, because SPLC states them itself. It no longer calls these groups simply Black Hebrew Israelites. One reason is that the camps include Latino and Indigenous members. Another is that Hebrew Israelite bodies exist which it does not list at all. The ADL likewise names extremist sects, not the movement as a whole. On specific incidents, be precise. In December 2019 two shooters attacked a kosher market in Jersey City. The New Jersey Attorney General cited their hatred of Jewish people and of police, and their interest in Black Hebrew Israelite ideology. Authorities did not establish that they belonged to any group. The ADL's 2022 audit put eight antisemitic harassment or propaganda incidents down to extremist Hebrew Israelite groups. One was an IUIC demonstration outside Barclays Center.","bible":["James 3:5-10","Proverbs 18:17","1 Peter 3:15-16"],"sources":[{"name":"Radical Hebrew Israelites (SPLC Extremist Files)","type":"institutional","url":"https://www.splcenter.org/resources/extremist-files/radical-hebrew-israelites/"},{"name":"Extremist Sects Within the Black Hebrew Israelite Movement (ADL)","type":"institutional","url":"https://www.adl.org/resources/backgrounder/extremist-sects-within-black-hebrew-israelite-movement"},{"name":"2019 Jersey City shooting","type":"journalism","url":"https://en.wikipedia.org/wiki/2019_Jersey_City_shooting"},{"name":"Jersey City Shooters Fueled by Hatred of Jewish People and Law Enforcement (CNN)","type":"journalism","url":"https://www.cnn.com/2019/12/12/us/jersey-city-new-jersey-shooting-thursday"},{"name":"ADL Audit of Antisemitic Incidents 2022","type":"institutional","url":"https://www.adl.org/resources/report/audit-antisemitic-incidents-2022"}],"response":"The camps reject the listing as a political weapon. SPLC has its own funding incentives, they argue, and a record of listings people fought over. Using the hate-group label on Black religious movements is one thing. Treating much the same talk elsewhere as ordinary politics is another. That is exactly the double standard they preach about. They note that their members are overwhelmingly non-violent. They note that the camps run drug-recovery, marriage and money-discipline programmes where nobody else does. And street preaching that offends is still speech. On Jersey City they point out, correctly, that no group link was ever shown. Being loud and being disliked is not the same as being a threat. The label, they argue, keeps people from ever hearing what is actually said.","responseSource":{"name":"ISUPK and IUIC public responses to the SPLC listing; camp statements on community programs and speech","url":"https://www.splcenter.org/resources/extremist-files/radical-hebrew-israelites/"},"verdict":"contested","rationale":"Graded contested on purpose. Both sides hold something true, and the site should show that. The camps are right on four points. A listing is not a refutation. Most members are not violent. The Jersey City attackers were never shown to belong to any group. And the community work is real. Critics are right that the talk the ADL and SPLC quote is real, and taken from public teaching, and that it has consequences. The method matters more than the verdict here. A hate-group listing cannot settle whether Deuteronomy 28 predicts the Middle Passage. Citing it as though it could is a way of avoiding the argument. Equally, calling SPLC biased does not unsay what was said on camera. Argue the claims. Cite incidents precisely. Never let a label do the work of an answer.","severity":"medium","plain":[{"t":"What the listing is","d":"The Southern Poverty Law Center keeps a file on Radical Hebrew Israelites. It names Great Millstone, ISUPK and IUIC as the biggest listed groups. Read their own notes on it: they no longer list the movement as a whole."},{"t":"Where the camps are right","d":"A listing is not an answer to a doctrine. Most members are not violent. The SPLC has its own money to raise and a record of listings people fought over. And using the label on Black religious groups, while calling much the same talk elsewhere ordinary politics, is a fair thing to object to."},{"t":"Where the critics are right","d":"The teaching that is listed is real, published, and on video. Nobody had to invent it. Some individuals citing the identity have committed violence, and the movement's own moderates say so."},{"t":"How strong is this argument?","d":"Genuinely arguable, both ways — on purpose. Both sides hold something true here, and this site should show that rather than pick a team."},{"t":"Why this helps you","d":"Knowing the difference between the listing and the doctrine means you can talk about the doctrine without handing anyone an easy escape."},{"say":true,"t":"What to say","d":"\"I'm not interested in the hate-group label. I'm interested in what this specific teaching says.\""}],"rewritten":true,"refwhy":{"James 3:5-10":"How much a small fire can burn. This is the point the critics have: what gets said on a street corner does not stay there.","Proverbs 18:17":"'He that is first in his own cause seemeth just; but his neighbour cometh and searcheth him.' Read the listing and the reply to it.","1 Peter 3:15-16":"Give your reason 'with meekness and fear.' The posture that stops a label doing the work an argument should do."},"titleLong":"The hate-group designation, handled honestly","quran":[],"hadith":[]},
{"id":"women-in-the-camps","title":"Women in skirts, silent, calling men sir","category":"practice","claim":"Street camps teach a strict order between men and women, openly and on video. Women are covered, in skirts, and address men as sir. They stay silent in the assembly. Talking back is taught as a covenant offence. Shaming women in trousers, and interracial couples, is a documented street tactic. The ADL records that extremist camps preach retribution against women of colour judged adulterous or insubordinate. It also records attacks on Black churches for giving women too much authority. Scripture is far less compliant than the practice assumes. Deborah judged Israel and led it into battle (Judges 4-5). Huldah the prophetess authenticated the rediscovered book of the law, while Jeremiah was alive (2 Kings 22:14-20). Priscilla, named first, took Apollos aside and explained the way of God more perfectly (Acts 18:26). Phoebe is a deacon and a patron (Romans 16:1-2). Women were the first witnesses of the resurrection, in a culture that did not credit their word. Ephesians 5:25-29 makes headship self-giving sacrifice. And 1 Peter 3:7 calls husband and wife heirs together of the grace of life.","bible":["Judges 4:4-9","2 Kings 22:14-20","Acts 18:26","Romans 16:1-2","Luke 24:1-11","Ephesians 5:25-29","1 Peter 3:7"],"sources":[{"name":"Extremist Sects Within the Black Hebrew Israelite Movement (ADL)","type":"institutional","url":"https://www.adl.org/resources/backgrounder/extremist-sects-within-black-hebrew-israelite-movement"},{"name":"Radical Hebrew Israelites (SPLC Extremist Files)","type":"institutional","url":"https://www.splcenter.org/resources/extremist-files/radical-hebrew-israelites/"},{"name":"Do Israelite Men Hate Femininity? (The Hebrew Housewife)","type":"primary","url":"https://www.thehebrewhousewife.com/do-israelite-men-hate-femininity/"},{"name":"Zihiri, Comparing the Preaching Strategies of Black Hebrew Israelite Camps (UCLA)","type":"scholarly","url":"https://religion.ucla.edu/wp-content/uploads/2020/07/Saifeldeen-Zihiri-Ambassadors-of-Christ-and-Israel-United-in-Christ_-Comparing-the-Preaching-Strategies-of-Black-Hebrew-Israelite-Camps.pdf"},{"name":"About IUIC - Israel United in Christ","type":"primary","url":"https://israelunite.org/about-iuic-2/"}],"response":"Their defence is repair, not control, in its own telling. Slavery took the man out of the Black family, they argue, and later welfare rules kept him out. The camps are rebuilding what was broken. Men accountable, providing, and present. Women honoured and protected, not left to carry a household alone. They cite Deuteronomy 22:5 on distinct dress. They cite 1 Corinthians 11:3-10 on headship and covering. They cite 1 Timothy 2:11-12 on women learning in silence, and Titus 2:4-5 on keepers at home. These are the plain words of the same Bible their critics claim. Women in the movement write publicly about it too. They describe the structure as relief rather than oppression. They point to marriage rates and family stability in the camps, against the numbers all around them.","responseSource":{"name":"IUIC and ISUPK teaching on family order; women writing from inside the movement, e.g. The Hebrew Housewife","url":"https://www.adl.org/resources/backgrounder/extremist-sects-within-black-hebrew-israelite-movement"},"verdict":"admitted","rationale":"Graded admitted, because the teaching is not alleged by opponents. The camps publish it themselves. Concede the diagnosis underneath, because it is partly right. The tearing apart of Black family life is real history. The church largely watched it happen. And wanting to rebuild is not contemptible. The proof texts are real texts that Christians disagree about, so do not pretend complementarian readings are absurd on their face. What cannot be defended is the gap between the texts cited and the practice seen. Nothing in 1 Corinthians 11 or Titus 2 authorises shouting obscenities at a woman on a sidewalk. And the movement's own standard makes this measurable. Ephesians 5 makes headship cruciform: self-giving to the point of death. That is the exact inversion of dominance. A structure that publicly humiliates women has failed the text it invokes.","severity":"medium","plain":[{"t":"What is taught","d":"The street camps teach a strict order between men and women, openly and on video. Women are covered, in skirts, and call men sir. They stay quiet in the assembly. Talking back is treated as a covenant offence. Shaming women in trousers on the street is a known tactic."},{"t":"Their answer, at full strength","d":"They say it is repair, not control. Slavery took the man out of the Black family, they argue. Later welfare rules kept him out. So the camps are putting back what was broken. Men who show up, provide, and answer for it. Women honoured, instead of left to carry it all alone."},{"t":"What is true in that","d":"Half of that is right. Black family life really was torn apart, and that is history, not a talking point. The ache under the teaching is real."},{"t":"How strong is this argument?","d":"They admit this openly: the teaching is published by the camps themselves, not alleged by opponents. The question is whether the remedy matches Scripture, not whether the wound is real."},{"t":"Why this helps you","d":"You can agree about the wound and still ask about the cure. Those are two conversations. Run them together and you lose both."},{"say":true,"t":"What to say","d":"\"The damage to the family is real. Is this what Scripture says the repair looks like?\""}],"rewritten":true,"refwhy":{"Judges 4:4-9":"Deborah judges Israel and leads it into battle, with Barak refusing to go unless she comes. Scripture, not a modern reading.","2 Kings 22:14-20":"Huldah the prophetess is asked to verify the rediscovered law book, while Jeremiah was alive. The king's own men went to her.","Acts 18:26":"Priscilla is named before her husband. Together they take Apollos aside and teach him the way of God more exactly.","Romans 16:1-2":"Phoebe is called a deacon and a patron, and Paul asks a whole church to help her. A woman carrying the letter and its weight.","Luke 24:1-11":"Women are the first witnesses of the resurrection, in a world that did not accept a woman's testimony. God chose them anyway.","Ephesians 5:25-29":"Headship defined as a husband giving himself up, to the point of death. That is the opposite of dominance, and it is the measure here.","1 Peter 3:7":"Husband and wife are 'heirs together of the grace of life.' Equal standing, in a text the camps otherwise read closely."},"titleLong":"The subordination of women in the street camps","quran":[],"hadith":[]},
{"id":"polygamy-in-the-movement","title":"Ben Ammi left four wives and over twenty children","category":"practice","claim":"Polygyny is practised in parts of the movement. Ben Ammi, who led the Dimona community, was survived by four wives and more than twenty children. The practice is settled there. Some street camps also teach it as allowed, or good, pointing back to the patriarchs. The biblical case is thinner than the citations suggest. Scripture tells of polygamy without commending it. Every such household it describes at length is a study in damage. Abraham, Sarah and Hagar (Genesis 16, 21). Jacob's warring wives (Genesis 29-30). Elkanah's two wives, with Hannah provoked year after year (1 Samuel 1:6-7). Solomon, whose many wives turned away his heart (1 Kings 11:1-4). Deuteronomy 17:17 forbids the king to multiply wives. Jesus grounds marriage in creation, quoting Genesis 2:24: the two, <i>not</i> the several, shall be one flesh (Matthew 19:4-6). Paul assumes one wife per husband (1 Corinthians 7:2). He requires overseers and deacons to be the husband of one wife (1 Timothy 3:2; 3:12; Titus 1:6).","bible":["Genesis 2:24","Matthew 19:4-6","Genesis 16:1-6","Genesis 29:30-31","1 Samuel 1:6-7","1 Kings 11:1-4","Deuteronomy 17:17","1 Corinthians 7:2-4","1 Timothy 3:2","Titus 1:6"],"sources":[{"name":"Ben Ammi Ben-Israel (survived by four wives and over twenty children)","type":"scholarly","url":"https://en.wikipedia.org/wiki/Ben_Ammi_Ben-Israel"},{"name":"African Hebrew Israelites of Jerusalem (World Religions and Spirituality Project)","type":"scholarly","url":"https://wrldrels.org/2023/01/06/african-hebrew-israelites-of-jerusalem/"},{"name":"African Hebrew Israelites of Jerusalem (Critical Dictionary of Apocalyptic and Millenarian Movements)","type":"scholarly","url":"https://www.cdamm.org/articles/ahij"},{"name":"Leader of African Hebrew Israelites Dies at 75 (Jerusalem Post)","type":"journalism","url":"https://www.jpost.com/israel-news/leader-of-african-hebrew-israelites-of-jerusalem-dies-385978"},{"name":"African Hebrew Israelites of Jerusalem, official site","type":"primary","url":"https://africanhebrewisraelitesofjerusalem.com/"}],"response":"The argument is that God never forbade polygyny. He regulated it, and that is not how Scripture treats sin. Exodus 21:10 and Deuteronomy 21:15-17 set out the rights of multiple wives and their children. In 2 Samuel 12:8 the prophet Nathan tells David that God <i>gave</i> him his master's wives, and would have given more. Abraham, Jacob, Gideon, David and Solomon are patriarchs and kings, not villains. The messianic line runs straight through their households. They argue that the one-wife rule is a Roman and European import, read back into the text later. And where marriageable men are scarce, they add, it leaves women unprotected and children without fathers. That is the practical evil the arrangement exists to prevent.","responseSource":{"name":"AHIJ teaching and practice in Dimona; patriarchal-precedent arguments used in street camps","url":"https://en.wikipedia.org/wiki/Ben_Ammi_Ben-Israel"},"verdict":"admitted","rationale":"Graded admitted, because the practice is openly acknowledged, not alleged. The regulation argument is genuinely their best. It deserves an answer rather than a scoff, since Scripture does legislate for these households. But regulating a fallen practice is not endorsing it. That is exactly how Jesus handles the parallel case. Moses permitted divorce for hardness of heart, but from the beginning it was not so (Matthew 19:8). He then goes behind all later law to Genesis 2:24, and the two becoming one flesh. Deuteronomy 17:17 already restrains the practice in the one office where power made it easiest. The narratives show it as corrosive every time. And the New Testament's rule of one wife for leaders would make no sense as a test if plurality were simply good.","severity":"medium","plain":[{"t":"What is practised","d":"Polygyny — one man, several wives — is practised in parts of the movement. Ben Ammi left four wives and more than twenty children. It is settled practice at Dimona. Some street camps teach it as allowed, or even good. They point back to the patriarchs."},{"t":"Their argument, and it is a good one","d":"God never forbade it. He regulated it. That is not how Scripture treats sin. Exodus 21:10 legislates the rights of multiple wives. Deuteronomy 21:15-17 sets out their children's inheritance. And in 2 Samuel 12:8 the prophet Nathan says God <i>gave</i> David his master's wives."},{"t":"Where the answer is","d":"Jesus is asked about marriage directly in Matthew 19 and goes back past Moses to the beginning: <b>\"they twain shall be one flesh.\"</b> Two. Paul then requires an elder to be the husband of one wife. Regulation is not approval. The same Torah regulates slavery and divorce."},{"t":"How strong is this argument?","d":"They admit this themselves: the practice is openly acknowledged. The regulation argument is genuinely their best and deserves an answer rather than a scoff."},{"say":true,"t":"What to say","d":"\"When Jesus was asked about marriage, where did he go back to?\""}],"rewritten":true,"refwhy":{"Genesis 2:24":"'They shall be one flesh.' Two, not several. The verse Jesus goes back to when he is asked about marriage.","Matthew 19:4-6":"Jesus is asked about marriage and answers from the beginning, quoting Genesis 2:24. He goes behind Moses, not around him.","Genesis 16:1-6":"Abraham, Sarah and Hagar. The first plural household in Scripture, and it ends in contempt, harshness, and a woman fleeing into the desert.","Genesis 29:30-31":"Jacob loves Rachel more than Leah, and God sees that Leah is hated. The rivalry runs through the rest of Genesis.","1 Samuel 1:6-7":"Peninnah provokes Hannah year after year until she cannot eat. What the arrangement looked like from inside one home.","1 Kings 11:1-4":"Solomon's many wives 'turned away his heart.' The one clear verdict Scripture passes on a household like this.","Deuteronomy 17:17":"The king is told not to multiply wives. The Torah restraining the practice in the one office where power made it easy.","1 Corinthians 7:2-4":"'Let every man have his own wife, and every woman her own husband.' Paul writes as though the singular is simply assumed.","1 Timothy 3:2":"An overseer must be 'the husband of one wife.' A pointless requirement if having several were simply good.","Titus 1:6":"Paul requires an elder to be the husband of one wife — the New Testament line the case turns on."},"titleLong":"Polygamy","quran":[],"hadith":[]},
{"id":"precepts-method-epistemology","title":"Isaiah 28:10 is mockery, not instruction","category":"practice","claim":"The movement's method of reading is chain-referencing. Verses from across the canon are strung together by shared words, whatever surrounds them. The method is justified from Isaiah 28:10: 'For precept must be upon precept, precept upon precept; line upon line, line upon line; here a little, and there a little.' Read the passage. Isaiah 28:7-13 describes drunken priests and prophets. They mock the prophet's preaching as baby-talk. Verse 10 is very plausibly their taunt, quoted back at them. In Hebrew it is a nonsense jingle: <i>tsav latsav qav laqav</i>. Verse 13 then turns the mockery into sentence. The word of the LORD will be to them exactly that, 'that they might go, and fall backward, and be broken, and snared, and taken.' A method that treats a mocker's taunt as a licence to read atomistically has taken up the practice the passage condemns. The apparatus around it makes things worse. There is KJV-only insistence, in a movement whose case depends on Hebrew. There are invented pronunciations with no manuscript basis. And there is selective appeal to 2 Esdras, a book outside the canon the movement otherwise defends.","bible":["Isaiah 28:7-13","2 Peter 1:20-21","2 Peter 3:16","Acts 17:11","Nehemiah 8:8","Luke 24:27"],"sources":[{"name":"Precept Upon Precept, Line Upon Line: the interpretive debate on Isaiah 28:10","type":"scholarly","url":"https://rsc.byu.edu/prophets-prophecies-old-testament/precept-upon-precept-line-upon-line"},{"name":"Isaiah 28:10 verse-by-verse commentary compilation","type":"apologetics","url":"https://www.studylight.org/commentary/isaiah/28-10.html"},{"name":"One West Camp (KJV-only, Lashawan Qadash, 12 Tribes Chart)","type":"scholarly","url":"https://en.wikipedia.org/wiki/One_West_Camp"},{"name":"The Israelite School of Universal Practical Knowledge","type":"primary","url":"https://isupk.com/about.html"},{"name":"Black Hebrew Israelism: A Refutation Guide for Christians","type":"apologetics","url":"https://thegoodnewsapologetics.wordpress.com/2018/01/04/black-hebrew-israelism-a-refutation-guide-for-christians/"}],"response":"Their defence is that Scripture interprets Scripture. The objection, they say, is a guild protecting itself. Comparing spiritual things with spiritual is Paul's own instruction (1 Corinthians 2:13). The Bereans searched the scriptures daily (Acts 17:11). Jesus expounded Himself from Moses and all the prophets, across the whole canon (Luke 24:27). And prophecy is not of any private interpretation (2 Peter 1:20). Before a man may read his own Bible, he is asked for seminary training, Greek and Hebrew, and approved commentaries. That is exactly the gatekeeping that kept enslaved people from the text in the first place. It is being used again, they argue, the moment ordinary people reach conclusions the institution dislikes. They also note, with some justice, that their opponents chain verses too. They just call it systematic theology.","responseSource":{"name":"1West-lineage teaching on precepts; ISUPK and IUIC lecture method and defenses of lay reading","url":"https://rsc.byu.edu/prophets-prophecies-old-testament/precept-upon-precept-line-upon-line"},"verdict":"unrefuted","rationale":"Graded unrefuted, because the specific objection is not addressed in camp materials at all. That objection is simple. Isaiah 28:10 is a mocker's taunt, turned into judgment in verse 13. Concede the class argument first, and mean it. Keeping Scripture from ordinary readers is a real historical sin, and no one needs Greek to be saved. But the translation debate over <i>tsav latsav qav laqav</i> is a mainstream scholarly one, not an elite invention. Some readings do take verse 10 as ordinary teaching. Even those make it a picture of patient instruction, not a warrant for cutting the text into pieces. The internal inconsistencies are the sharpest point. A movement that stakes everything on Hebrew identity binds itself to a seventeenth-century English translation. It invents pronunciations with no manuscript support. And it quotes a book it does not accept as canon.","severity":"high","plain":[{"t":"How the camps read","d":"By chaining verses. Lines from all over the Bible are strung together by shared words, regardless of what surrounds them. The method is justified from Isaiah 28:10 — <b>\"precept must be upon precept… line upon line… here a little, and there a little.\"</b>"},{"t":"Why the method matters more than any verse","d":"Because it can produce conclusions no chapter states on its own. And it is close to unanswerable if you argue verse by verse, which is why the response is to read whole chapters instead."},{"t":"Read three verses further","d":"Isaiah 28:10 is not instruction. It is mockery — drunken priests imitating the prophet's speech as baby-talk. Then verse 13 turns their own words into the judgment. The word of the LORD becomes to them <i>precept upon precept</i>. They go, and fall backward, and are broken."},{"t":"Their answer, at full strength","d":"That Scripture interprets Scripture, and the objection is a guild protecting itself. Paul compares spiritual things with spiritual. The Bereans searched daily. Jesus expounded himself from Moses and all the prophets. Concede the class argument, and mean it — gatekeeping who may read the Bible is a real sin with a long history."},{"t":"How strong is this argument?","d":"Strong for you: camp materials do not address what Isaiah 28:13 does with the phrase."},{"say":true,"t":"What to say","d":"\"Read me Isaiah 28 verses 9 through 13. Who is talking in verse 10?\""}],"rewritten":true,"refwhy":{"Isaiah 28:7-13":"Read the whole run, not verse 10. Drunken priests mock the prophet as baby-talk, and verse 13 turns their own taunt into the judgment.","2 Peter 1:20-21":"'No prophecy of the scripture is of any private interpretation.' Both sides quote it, so read it with them rather than at them.","2 Peter 3:16":"Warns that the unlearned 'wrest' hard passages to their own hurt. A New Testament name for the risk this case is about.","Acts 17:11":"The Bereans searched daily to check what they were told. Their defence uses this verse, and it is a fair use of it.","Nehemiah 8:8":"The Levites read the book 'distinctly, and gave the sense.' Scripture's own picture of good reading: meaning, not word-chains.","Luke 24:27":"Jesus expounds himself 'from Moses and all the prophets.' They cite this for chain-reading. He was giving the sense, not matching words."},"titleLong":"The 'precept upon precept' method as a way of reading","quran":[],"hadith":[]},
{"id":"avoid-jesus-skin-color-hill","title":"Don't fight over Jesus's skin color","category":"identity-claims","claim":"Do not build a case around disputing that Jesus was dark-skinned. Do not let the conversation become a debate about his complexion. The temptation is to treat Revelation 1:14-15 as a claim to be crushed, and then to overcorrect into defending a Christ who looks like a European painting. Concede immediately and without qualification. Jesus was a first-century Judean, brown-skinned and Middle Eastern. The blond, blue-eyed Jesus of Western art is a cultural artifact with no scriptural warrant. That image was preached to enslaved people by their enslavers, and it was not neutral. Isaiah 53:2 says there was no beauty in him that we should desire him. Give all of this away in the first sentence, because it is true, and because it is not the disputed question. The disputed question is whether any modern population is Israel, and what makes a person a child of God. No fact about complexion answers either.","bible":["Isaiah 53:2","1 Samuel 16:7","Revelation 1:14-16","Acts 10:34-35","2 Corinthians 5:16"],"sources":[{"name":"Who Are the Hebrew Israelites and What Do They Believe? (Jude 3 Project)","type":"apologetics","url":"https://jude3project.org/blog/2016/4/29/kzqeier0z8b1u1uk5lf186jhu5s8r5"},{"name":"Michael Brown, Was Esau-Edom White? (Religion Unplugged)","type":"apologetics","url":"https://religionunplugged.com/news/2023/3/28/was-esau-edom-white-demolishing-hebrew-israelite-lies-part-1"},{"name":"Two Hebrew Israelite Biblical Verses Examined (Times of Israel blogs)","type":"journalism","url":"https://blogs.timesofisrael.com/two-hebrew-israelite-biblical-verses-examined/"}],"response":"Not applicable. This entry marks an argument to avoid, not a claim to answer.","responseSource":{"name":"Editorial guidance","url":"https://jude3project.org/blog/2016/4/29/kzqeier0z8b1u1uk5lf186jhu5s8r5"},"verdict":"answered","rationale":"Avoid it because the argument is unwinnable in the only sense that matters. Defending a light-skinned Jesus makes the Christian look exactly like the caricature the movement preaches about. Disputing a dark-skinned Jesus means defending a position with no evidence and nothing at stake. Meanwhile the concession is free and disarming. Agreeing enthusiastically that Western art lied costs nothing, and it buys a hearing. Be generous here about the person as well as blunt about the error. Someone raised on those paintings has good reason to distrust them. The substantive case is elsewhere entirely, in what the New Testament says makes someone Abraham's offspring. Handle the exegesis of Revelation 1 in its own case, where the Daniel 7 and 10 background can be laid out calmly, and never let it become the headline.","severity":"medium","avoid":true,"plain":[{"t":"The trap","d":"At some point the conversation will turn to what Jesus looked like. Do not build anything there, and do not let it become the argument."},{"t":"Why you cannot win it","d":"Defend a light-skinned Jesus and you become the exact picture the movement preaches about. Dispute a dark-skinned Jesus and you are arguing against something probably true. He was a first-century Judean."},{"t":"What to do instead","d":"Concede it at once, and fully. The European paintings are wrong. Then move to the question that decides anything. Not what he looked like. Who he is."},{"say":true,"t":"What to say","d":"\"You're right about the paintings, and I'm not going to defend them. Can I ask you something else?\""}],"rewritten":true,"refwhy":{"Isaiah 53:2":"'No beauty that we should desire him.' The only thing Scripture says about how he looked, and it is not a description.","1 Samuel 16:7":"'Man looketh on the outward appearance, but the LORD looketh on the heart.' Said while choosing David. This verse ends the argument.","Revelation 1:14-16":"The passage the fight is about. Handle it in its own case, calmly, beside Daniel 7. Never let it become the headline.","Acts 10:34-35":"'God is no respecter of persons.' The real question is who God accepts, and this answers it without mentioning anyone's looks.","2 Corinthians 5:16":"'Henceforth know we no man after the flesh.' Paul refusing to sort people by outward standing. Read it before this subject comes up."},"titleLong":"DON'T USE: making Jesus's skin color the argument","quran":[],"hadith":[]},
{"id":"avoid-blanket-hate-group-label","title":"Don't call the whole movement a hate group","category":"movement-history","claim":"Do not treat Hebrew Israelite identity as another word for the street camps. The spectrum is real, and it is on record. The Church of God and Saints of Christ has run since 1896 as an ordinary church body. The Commandment Keepers in Harlem ran as a synagogue with an ordained rabbi. The African Hebrew Israelites in Dimona are a peaceable village of two to three thousand. Their sons serve in the IDF. SPLC lists named groups. It expressly declines to list the faith as such. It notes that the camps it lists include Latino and Indigenous members. And it grants that other Hebrew Israelite bodies are not radical. Most people who hold these beliefs have never shouted at anyone on a sidewalk. Many met the teaching through a relative or a video, and are working through it quietly. A page that opens by calling them a hate group has ended the talk with everyone it most wanted to reach. It has also said something false.","bible":["Proverbs 18:13","James 1:19","Titus 3:2","1 Peter 3:15-16"],"sources":[{"name":"Radical Hebrew Israelites (SPLC Extremist Files, including its own scope caveats)","type":"institutional","url":"https://www.splcenter.org/resources/extremist-files/radical-hebrew-israelites/"},{"name":"African Hebrew Israelites of Jerusalem (Critical Dictionary of Apocalyptic and Millenarian Movements)","type":"scholarly","url":"https://www.cdamm.org/articles/ahij"},{"name":"Commandment Keepers Ethiopian Hebrew Congregation","type":"institutional","url":"https://www.commandmentkeepersehc.com/about-us"}],"response":"Not applicable. This entry marks an argument to avoid, not a claim to answer.","responseSource":{"name":"Editorial guidance","url":"https://www.splcenter.org/resources/extremist-files/radical-hebrew-israelites/"},"verdict":"answered","rationale":"Avoid it because it is wrong on the facts and fatal in the room at the same time. That is a rare combination. The movement spans a peaceable Israeli village, church bodies a century old, quiet believers on their own, and a set of street camps that really do preach what the ADL and SPLC document. Collapse that range and you hand every reader an easy exit. Anyone who knows a Hebrew Israelite will see the description is false, and stop reading. So name the group. Quote the teaching. Say plainly where the criticism does not apply. Precision here is not softness. It is the only thing that makes the criticism credible where it is deserved.","severity":"high","avoid":true,"plain":[{"t":"The mistake","d":"Treating \"Hebrew Israelite\" as if it meant the street camps in the videos. It does not. The range is wide, and it is on record."},{"t":"What the movement actually spans","d":"The Church of God and Saints of Christ, an ordinary church body since 1896. The Commandment Keepers in Harlem, who ran as a synagogue with an ordained rabbi. A vegan farming town in Israel. Quiet believers on their own. And the street camps in the videos. They argue with each other, bitterly."},{"t":"Why the label fails","d":"It is wrong about most of the movement. It also ends the talk on the spot. Being both false and useless at once is a rare thing to manage."},{"t":"What to do instead","d":"Name one teaching if you must name something. Never the whole movement."},{"say":true,"t":"What to say","d":"\"I know the movement isn't one thing. Which camp are you with, and what do they teach?\""}],"rewritten":true,"refwhy":{"Proverbs 18:13":"'He that answereth a matter before he heareth it, it is folly and shame unto him.' That is what the blanket label does.","James 1:19":"'Swift to hear, slow to speak, slow to wrath.' The order matters. Ask which camp someone is in before deciding what they teach.","Titus 3:2":"'Speak evil of no man.' A false description of most of a movement is speaking evil, whatever the worst part of it does.","1 Peter 3:15-16":"Answer 'with meekness and fear,' keeping a good conscience. The instruction assumes you have earned a hearing first."},"titleLong":"DON'T USE: 'they are all violent hate groups'","quran":[],"hadith":[]},
{"id":"avoid-viral-media-frames","title":"Don't argue from the 2019 Lincoln Memorial clip","category":"movement-history","claim":"Do not build the section on viral video moments. That rules out the 2019 Lincoln Memorial confrontation and its media cycle. It also rules out culture-war flashpoints where Hebrew Israelites turned up as characters in someone else's story. The details of those episodes are still fought over. They were reported and re-reported through partisan frames. They produced lawsuits and retractions. And most readers remember them as a fight about media bias, not a question about Scripture. Using them signals that this is an entry in a culture war, rather than a look at what the Bible says. It invites the reader to sort the page by team before reading a word. Where an incident genuinely bears on the topic, cite it soberly, from primary or police sources. The December 2019 Jersey City attack is the model. The New Jersey Attorney General described the shooters' hatred of Jews and of police, and their interest in the ideology. Authorities did not establish that they belonged to any group.","bible":["Proverbs 18:17","Exodus 23:1-2","Proverbs 14:15"],"sources":[{"name":"2019 Jersey City shooting (for the sober-citation contrast)","type":"journalism","url":"https://en.wikipedia.org/wiki/2019_Jersey_City_shooting"},{"name":"Jersey City Shooters Fueled by Hatred of Jewish People and Law Enforcement (CNN)","type":"journalism","url":"https://www.cnn.com/2019/12/12/us/jersey-city-new-jersey-shooting-thursday"},{"name":"Radical Hebrew Israelites (SPLC Extremist Files)","type":"institutional","url":"https://www.splcenter.org/resources/extremist-files/radical-hebrew-israelites/"}],"response":"Not applicable. This entry marks an argument to avoid, not a claim to answer.","responseSource":{"name":"Editorial guidance","url":"https://en.wikipedia.org/wiki/2019_Jersey_City_shooting"},"verdict":"answered","rationale":"Avoid it because it trades a durable argument for a perishable one. Viral incidents age badly. Their details get revised. And half of any audience has already assigned blame, based on where they read about it. The whole premise here is that the Bible both sides accept is the standard. That premise is gone the moment the argument runs through a news cycle. Every claim in this section can be tested from Scripture, from published movement teaching, and from research. None of that expires. When an incident is genuinely needed, cite it with the care used everywhere else, including the details that cut the other way. That care is what makes the citation trustworthy.","severity":"medium","avoid":true,"plain":[{"t":"The mistake","d":"Building your case on viral video moments — the 2019 Lincoln Memorial confrontation, or whichever clip is circulating this year."},{"t":"Why it costs you","d":"The details of those clips get fought over. They are reported and re-reported by outlets with a side. And they get revised weeks later. Half of any room has already decided who was wrong, based on where they read about it."},{"t":"And the deeper problem","d":"It trades a durable argument for a perishable one. Deuteronomy 28 will still be there in ten years. The clip will not, and the person in front of you probably knows details about it that you do not."},{"say":true,"t":"What to say","d":"\"I'm not here about a video. I want to ask about what the chapter actually says.\""}],"rewritten":true,"refwhy":{"Proverbs 18:17":"The first account always sounds right until the other side speaks. A viral clip is a first account, cut by someone with a side.","Exodus 23:1-2":"'Thou shalt not raise a false report,' nor follow a crowd into wrong. Written for exactly this, three thousand years early.","Proverbs 14:15":"'The simple believeth every word: but the prudent man looketh well to his going.' The test to run on any clip before you use it."},"titleLong":"DON'T USE: viral confrontation clips and culture-war media frames","quran":[],"hadith":[]},
{"id":"avoid-dismissing-the-longing","title":"Don't dismiss the longing, answer it","category":"identity-claims","claim":"Do not treat the movement as merely a set of bad arguments to be dismantled, while ignoring what drove people to it. The questions underneath are serious, and Christian preaching has too often failed to answer them. Who am I? Where did my name and my language go? Why did God permit four hundred years of this? Does the God of the Bible see my people at all? Those are the questions of Psalm 44, of Habakkuk 1, and of half the Psalter, and Scripture never rebukes anyone for asking them. A page that refutes seventeen claims and never addresses the ache has won every exchange and lost the person. The Christian answer is not that identity does not matter. It is that the identity offered is greater than the one being claimed. Adoption as sons and daughters, with the Spirit of adoption crying Abba, Father. Joint-heirs with Christ. A chosen generation. A people who were not a people, but are now the people of God.","bible":["Romans 8:15-17","1 Peter 2:9-10","Hosea 1:10","Psalm 44:9-26","Habakkuk 1:2-4","Isaiah 43:1","John 1:12","Isaiah 56:3-8"],"sources":[{"name":"Who Are the Hebrew Israelites and What Do They Believe? (Jude 3 Project)","type":"apologetics","url":"https://jude3project.org/blog/2016/4/29/kzqeier0z8b1u1uk5lf186jhu5s8r5"},{"name":"Overview of the Black Hebrew Israelites (Jude 3 Project)","type":"apologetics","url":"https://jude3project.org/blog/2016/2/3/overview-of-the-black-hebrew-israelites"},{"name":"History of Hebrew Israelism (SPLC Intelligence Report)","type":"institutional","url":"https://www.splcenter.org/resources/reports/history-hebrew-israelism/"}],"response":"Not applicable. This entry marks an argument to avoid, not a claim to answer.","responseSource":{"name":"Editorial guidance","url":"https://jude3project.org/blog/2016/4/29/kzqeier0z8b1u1uk5lf186jhu5s8r5"},"verdict":"answered","rationale":"Avoid dismissal, because the longing is legitimate and the movement grew precisely where the church left a vacuum. American churches were silent about slavery when they should have spoken, and many of them blessed it outright. People did not join because they found the 12 Tribes Chart academically compelling. They joined because someone finally told them their suffering had a place in God's story, and that they were somebody. That is a real need, and the gospel meets it more fully than the chart does. So affirm the question. Name the historical failure honestly, including the churches that blessed slavery. Then show that adoption in Christ grants by grace what the genealogy cannot deliver even if it were true: a name given by God, an inheritance, and a Father. End the section here rather than on a refutation, because this is the only place the section is actually trying to get to.","severity":"high","avoid":true,"plain":[{"t":"The mistake that matters most","d":"Treating this as a pile of bad arguments to dismantle, while ignoring what drove people to it in the first place."},{"t":"The questions underneath","d":"Who am I? Where did my name and my language go? Why did God permit four hundred years of this? Those are serious questions, and Christian preaching has too often had nothing to say about them."},{"t":"Why people actually joined","d":"Not because the 12 Tribes Chart is academically compelling. Because someone finally told them their history was in the Bible, and that God had not forgotten what was done to their families. The movement grew precisely where the church left a vacuum."},{"t":"What that means for you","d":"The longing is legitimate. Answer it rather than mocking it — and be honest that the church owes an apology it has mostly not made."},{"say":true,"t":"What to say","d":"\"The church was silent about slavery when it should have spoken. I'm not going to pretend otherwise.\""}],"rewritten":true,"refwhy":{"Romans 8:15-17":"The Spirit of adoption, crying 'Abba, Father.' Heirs, not applic
