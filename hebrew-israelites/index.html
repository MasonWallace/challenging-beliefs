rg/2014/12/29/israel/spiritual-leader-of-the-african-hebrew-israelites-dies-1"},{"name":"At Memorial for African Hebrew Leader, Signs of Integration and Respect (Times of Israel)","type":"journalism","url":"https://www.timesofisrael.com/at-memorial-for-african-hebrew-leader-signs-of-integration-and-respect/"}],"response":"The community frames its history as vindication by endurance. They left everything, survived Liberia, arrived without status, were threatened with deportation, and built a functioning society that Israel eventually recognized and that now sends its sons to the army. That is not the trajectory of a hate group and not the trajectory of a fraud. On Ben Ammi's death, members have adjusted rather than abandoned: immortality is the end goal of a regenerating people, reached progressively as lifespans extend in the messianic age, not a guarantee for any individual in the present generation. They point to their own health outcomes, their vegan practice traced to Genesis 1:29, and to decades of communal stability as evidence that the way of life produces what it promises, whatever timeline the founder's own body kept.","responseSource":{"name":"AHIJ official teaching and post-2014 community statements; Ben Ammi's published writings on regeneration and immortality"},"verdict":"answered","rationale":"The historical facts here are admitted on all sides; what is examined is the doctrine. Ben Ammi's immortality teaching was a falsifiable claim about the natural state of a regenerated humanity, and its author died at seventy-five. The softening to an end goal is a real theological move but it is a retreat, and Scripture already teaches that death is an enemy destroyed by resurrection rather than by diet (1 Cor 15:20-26, 53-57). Two things must be said alongside this. First, the underlying identity claim rests on the same unsupported foundation as the street camps' and fails for the same reasons. Second, and just as important for this section, nothing about this community warrants the tone appropriate to a confrontational camp. They are peaceable neighbors, and conflating them with 1West rhetoric is both false and a good way to lose every hearing worth having.","severity":"medium","quran":[],"hadith":[]},
{"id":"splc-hate-designation","title":"The hate-group designation, handled honestly","category":"movement-history","claim":"The Southern Poverty Law Center maintains an extremist file on Radical Hebrew Israelites, naming Great Millstone, the Israelite School of Universal Practical Knowledge and Israel United in Christ as the largest and most active listed groups. Read the caveats, because SPLC states them itself: it no longer refers to these groups simply as Black Hebrew Israelites, both because the camps include Latino and Indigenous members and because non-radical Hebrew Israelite sects exist that it does not designate. The ADL similarly names extremist sects rather than the movement as a whole. On specific incidents, be precise. In the December 2019 Jersey City attack on a kosher market, the New Jersey Attorney General cited the shooters' hatred of Jewish people and law enforcement and their interest in Black Hebrew Israelite ideology, while authorities did not establish formal membership in any organization. The ADL's 2022 audit attributed eight antisemitic harassment or propaganda incidents to extremist BHI groups, including an IUIC demonstration outside Barclays Center.","bible":["Ephesians 4:29-32","James 3:5-10","Proverbs 18:17","Matthew 7:1-5","Romans 12:17-21","1 Peter 3:15-16","Titus 3:2","Colossians 4:6"],"sources":[{"name":"Radical Hebrew Israelites (SPLC Extremist Files)","type":"institutional","url":"https://www.splcenter.org/resources/extremist-files/radical-hebrew-israelites/"},{"name":"Extremist Sects Within the Black Hebrew Israelite Movement (ADL)","type":"institutional","url":"https://www.adl.org/resources/backgrounder/extremist-sects-within-black-hebrew-israelite-movement"},{"name":"2019 Jersey City shooting","type":"journalism","url":"https://en.wikipedia.org/wiki/2019_Jersey_City_shooting"},{"name":"Jersey City Shooters Fueled by Hatred of Jewish People and Law Enforcement (CNN)","type":"journalism","url":"https://www.cnn.com/2019/12/12/us/jersey-city-new-jersey-shooting-thursday"},{"name":"ADL Audit of Antisemitic Incidents 2022","type":"institutional","url":"https://www.adl.org/resources/report/audit-antisemitic-incidents-2022"}],"response":"The camps reject the designation as a political weapon. SPLC, they argue, is an organization with its own funding incentives and a record of contested listings, and applying the hate-group label to Black religious movements while treating comparable rhetoric elsewhere as ordinary politics is exactly the double standard they preach about. They note that their members are overwhelmingly non-violent, that the camps run drug-recovery, marriage and financial-discipline programs in neighborhoods nobody else serves, and that street preaching that offends is still speech. On Jersey City they point out, correctly, that no organizational link was established. Being loud and being unpopular, they argue, is not the same as being a threat, and the label is used to keep people from ever hearing what is actually said.","responseSource":{"name":"ISUPK and IUIC public responses to the SPLC listing; camp statements on community programs and speech"},"verdict":"contested","rationale":"Graded contested on purpose, because both sides hold something true and the site should model that. The camps are right that a listing is not a refutation, that most members are not violent, that the Jersey City attackers were not shown to belong to any organization, and that community work happens. Critics are right that the rhetoric ADL and SPLC document is real, quoted from public teaching, and that it has consequences. The methodological point matters more than the verdict: a hate-group designation cannot settle whether Deuteronomy 28 predicts the Middle Passage, and citing it as though it could is a way of avoiding the argument. Equally, calling SPLC biased does not unsay what was said on camera. Argue the claims, cite incidents precisely, and never let a label do the work of an answer.","severity":"medium","quran":[],"hadith":[]},
{"id":"women-in-the-camps","title":"The subordination of women in the street camps","category":"practice","claim":"Street camps teach a strict gender hierarchy openly and on video: women covered, in skirts, addressing men as sir, silent in the assembly, and taught that insubordination is a covenant offense. Public shaming of women in trousers and of interracial couples is a documented street tactic, and the ADL records that extremist camps preach retribution against women of color deemed adulterous or insubordinate, alongside attacks on Black churches for giving women too much authority. Scripture is far less compliant than the practice assumes. Deborah judged Israel and led it into battle (Judg 4-5). Huldah the prophetess authenticated the rediscovered book of the law while Jeremiah was alive (2 Kgs 22:14-20). Priscilla, named first, took Apollos aside and expounded the way of God more perfectly (Acts 18:26). Phoebe is a deacon and patron (Rom 16:1-2). Women were the first witnesses of the resurrection in a culture that did not credit their testimony. Ephesians 5:25-29 defines headship as self-giving sacrifice, and 1 Peter 3:7 calls husband and wife heirs together of the grace of life.","bible":["Judges 4:4-9","2 Kings 22:14-20","Acts 18:26","Romans 16:1-2","Romans 16:3-7","Luke 24:1-11","Ephesians 5:25-29","1 Peter 3:7","Galatians 3:28","Proverbs 31:10-31","John 4:39"],"sources":[{"name":"Extremist Sects Within the Black Hebrew Israelite Movement (ADL)","type":"institutional","url":"https://www.adl.org/resources/backgrounder/extremist-sects-within-black-hebrew-israelite-movement"},{"name":"Radical Hebrew Israelites (SPLC Extremist Files)","type":"institutional","url":"https://www.splcenter.org/resources/extremist-files/radical-hebrew-israelites/"},{"name":"Do Israelite Men Hate Femininity? (The Hebrew Housewife)","type":"primary","url":"https://www.thehebrewhousewife.com/do-israelite-men-hate-femininity/"},{"name":"Zihiri, Comparing the Preaching Strategies of Black Hebrew Israelite Camps (UCLA)","type":"scholarly","url":"https://religion.ucla.edu/wp-content/uploads/2020/07/Saifeldeen-Zihiri-Ambassadors-of-Christ-and-Israel-United-in-Christ_-Comparing-the-Preaching-Strategies-of-Black-Hebrew-Israelite-Camps.pdf"},{"name":"About IUIC - Israel United in Christ","type":"primary","url":"https://israelunite.org/about-iuic-2/"}],"response":"Their defense is restorative rather than repressive in its own telling. Slavery and welfare policy, they argue, destroyed the Black family by removing the man from it, and the camps are rebuilding what was broken: men accountable, providing, and present; women honored and protected rather than left to carry a household alone. They cite Deuteronomy 22:5 on distinct dress, 1 Corinthians 11:3-10 on headship and covering, 1 Timothy 2:11-12 on women learning in silence, and Titus 2:4-5 on keepers at home, and note these are the plain words of the same Bible their critics claim. Women in the movement, some of whom write publicly, describe the structure as relief rather than oppression, and point to marriage rates and family stability in the camps against the surrounding statistics.","responseSource":{"name":"IUIC and ISUPK teaching on family order; women writing from inside the movement, e.g. The Hebrew Housewife"},"verdict":"admitted","rationale":"Graded admitted because the teaching is not alleged by opponents but published by the camps themselves, and because the diagnosis underneath it is partly correct: the destruction of Black family structure is real history and the desire to rebuild it is not contemptible. The proof texts are also real texts that Christians disagree about, so avoid pretending complementarian readings are self-evidently absurd. What cannot be defended is the distance between the texts cited and the practice observed. Nothing in 1 Corinthians 11 or Titus 2 authorizes shouting obscenities at women on a sidewalk, and the movement's own standard makes this measurable. Ephesians 5 makes headship cruciform, self-giving to the point of death, which is the exact inversion of dominance, and a structure that produces public humiliation of women has failed the text it invokes.","severity":"medium","quran":[],"hadith":[]},
{"id":"polygamy-in-the-movement","title":"Polygamy","category":"practice","claim":"Polygyny is practiced in parts of the movement. Ben Ammi, leader of the Dimona community, was survived by four wives and more than twenty children, and the practice is established there; some street camps also teach it as permissible or desirable, appealing to the patriarchs. The biblical case for it is thinner than the citations suggest. Scripture narrates polygamy without commending it, and every polygamous household it describes at length is a study in damage: Abraham, Sarah and Hagar (Gen 16, 21), Jacob's warring households (Gen 29-30), Elkanah's two wives with Hannah provoked year after year (1 Sam 1:6-7), and Solomon, whose many wives turned away his heart (1 Kgs 11:1-4). Deuteronomy 17:17 forbids the king to multiply wives. Jesus grounds marriage in creation, quoting Genesis 2:24 that the two, not the several, shall be one flesh (Matt 19:4-6). Paul assumes one wife per husband (1 Cor 7:2) and requires overseers and deacons to be the husband of one wife (1 Tim 3:2, 3:12, Titus 1:6).","bible":["Genesis 2:24","Matthew 19:4-6","Genesis 16:1-6","Genesis 29:30-31","1 Samuel 1:6-7","1 Kings 11:1-4","Deuteronomy 17:17","1 Corinthians 7:2-4","1 Timothy 3:2","1 Timothy 3:12","Titus 1:6","Malachi 2:14-15"],"sources":[{"name":"Ben Ammi Ben-Israel (survived by four wives and over twenty children)","type":"scholarly","url":"https://en.wikipedia.org/wiki/Ben_Ammi_Ben-Israel"},{"name":"African Hebrew Israelites of Jerusalem (World Religions and Spirituality Project)","type":"scholarly","url":"https://wrldrels.org/2023/01/06/african-hebrew-israelites-of-jerusalem/"},{"name":"African Hebrew Israelites of Jerusalem (Critical Dictionary of Apocalyptic and Millenarian Movements)","type":"scholarly","url":"https://www.cdamm.org/articles/ahij"},{"name":"Leader of African Hebrew Israelites Dies at 75 (Jerusalem Post)","type":"journalism","url":"https://www.jpost.com/israel-news/leader-of-african-hebrew-israelites-of-jerusalem-dies-385978"},{"name":"African Hebrew Israelites of Jerusalem, official site","type":"primary","url":"https://africanhebrewisraelitesofjerusalem.com/"}],"response":"The argument is that God never prohibited polygyny and in fact regulated it, which is not how Scripture treats sin. Exodus 21:10 and Deuteronomy 21:15-17 legislate the rights of multiple wives and their children, and 2 Samuel 12:8 has the prophet Nathan tell David that God gave him his master's wives and would have given more. Abraham, Jacob, Gideon, David and Solomon are patriarchs and kings, not villains, and the Messianic line runs directly through polygamous households. They argue that the one-wife norm is a Roman and European import that the church later read back into the text, and that in communities with a shortage of marriageable men it leaves women unprotected and children unfathered, which is the practical evil the arrangement exists to prevent.","responseSource":{"name":"AHIJ teaching and practice in Dimona; patriarchal-precedent arguments used in street camps"},"verdict":"admitted","rationale":"Graded admitted because the practice is openly acknowledged rather than alleged. The regulation argument is genuinely their best and deserves an answer rather than a scoff, since Scripture does legislate for polygamous households. But regulation of a fallen practice is not endorsement, which is exactly how Jesus handles the parallel case: Moses permitted divorce for hardness of heart, but from the beginning it was not so (Matt 19:8). He then goes behind all subsequent legislation to Genesis 2:24 and the two becoming one flesh. Deuteronomy 17:17 already restrains the practice in the one office where power made it easiest, the narratives portray it as uniformly corrosive, and the New Testament's leadership requirement of one wife would be incoherent as a qualification if plurality were simply good.","severity":"medium","quran":[],"hadith":[]},
{"id":"precepts-method-epistemology","title":"The 'precept upon precept' method as a way of reading","category":"practice","claim":"The movement's hermeneutic is chain-referencing: verses from across the canon are strung together by shared words regardless of context, and the method is justified by Isaiah 28:10, 'For precept must be upon precept, precept upon precept; line upon line, line upon line; here a little, and there a little.' Read the passage. Isaiah 28:7-13 describes drunken priests and prophets who mock the prophet's preaching as baby-talk, and verse 10 is very plausibly their taunt quoted back, a nonsense jingle of Hebrew syllables, tsav latsav qav laqav. Verse 13 then turns the mockery into sentence: the word of the LORD will be to them exactly that, 'that they might go, and fall backward, and be broken, and snared, and taken.' A method that treats a mocker's taunt as a licence to read atomistically has adopted the practice the passage condemns. The apparatus around it compounds the problem: KJV-only insistence in a movement whose case depends on Hebrew, invented pronunciations without manuscript basis, and selective appeal to 2 Esdras, a book outside the canon they otherwise defend.","bible":["Isaiah 28:7-13","2 Peter 1:20-21","2 Peter 3:16","2 Timothy 2:15","Acts 17:11","Nehemiah 8:8","Luke 24:27","2 Corinthians 4:2"],"sources":[{"name":"Precept Upon Precept, Line Upon Line: the interpretive debate on Isaiah 28:10","type":"scholarly","url":"https://rsc.byu.edu/prophets-prophecies-old-testament/precept-upon-precept-line-upon-line"},{"name":"Isaiah 28:10 verse-by-verse commentary compilation","type":"apologetics","url":"https://www.studylight.org/commentary/isaiah/28-10.html"},{"name":"One West Camp (KJV-only, Lashawan Qadash, 12 Tribes Chart)","type":"scholarly","url":"https://en.wikipedia.org/wiki/One_West_Camp"},{"name":"The Israelite School of Universal Practical Knowledge","type":"primary","url":"https://isupk.com/about.html"},{"name":"Black Hebrew Israelism: A Refutation Guide for Christians","type":"apologetics","url":"https://thegoodnewsapologetics.wordpress.com/2018/01/04/black-hebrew-israelism-a-refutation-guide-for-christians/"}],"response":"Their defense is that Scripture interprets Scripture and that the objection is really a guild protecting itself. Comparing spiritual things with spiritual is Paul's own instruction (1 Cor 2:13); the Bereans searched the scriptures daily (Acts 17:11); Jesus expounded Himself from Moses and all the prophets across the whole canon (Luke 24:27); and prophecy is not of any private interpretation (2 Pet 1:20). Demanding seminary training, Greek and Hebrew and approved commentaries before a man may read his own Bible is, they argue, exactly the gatekeeping that kept enslaved people from the text in the first place, and it is being deployed again the moment ordinary people reach conclusions the institution dislikes. They also note, with some justice, that their opponents chain verses too and only call it systematic theology.","responseSource":{"name":"1West-lineage teaching on precepts; ISUPK and IUIC lecture method and defenses of lay reading"},"verdict":"unrefuted","rationale":"Graded unrefuted because the specific objection, that Isaiah 28:10 is a mocker's taunt turned into judgment in verse 13, is not addressed in camp materials at all. Concede the class argument first and mean it: gatekeeping Scripture from ordinary readers is a real historical sin, and no one needs Greek to be saved. But the translation debate over tsav latsav qav laqav is a mainstream scholarly discussion, not an elite invention, and even readings that take verse 10 as ordinary teaching make it a description of patient instruction rather than a warrant for atomizing the text. The internal inconsistencies are the sharpest point: a movement that stakes everything on Hebrew identity binds itself to a seventeenth-century English translation, invents pronunciations with no manuscript support, and quotes a book it does not accept as canon.","severity":"high","quran":[],"hadith":[]},
{"id":"avoid-jesus-skin-color-hill","title":"DON'T USE: making Jesus's skin color the argument","category":"identity-claims","claim":"Do not build a case around disputing that Jesus was dark-skinned, and do not let the conversation become a debate about his complexion. The temptation is to treat Revelation 1:14-15 as a claim to be crushed and then to overcorrect into defending a Christ who looks like a European painting. Concede immediately and without qualification: Jesus was a first-century Judean, brown-skinned and Middle Eastern; the blond, blue-eyed Jesus of Western art is a cultural artifact with no scriptural warrant; and that image was preached to enslaved people by their enslavers, which was not neutral. Isaiah 53:2 says there was no beauty in him that we should desire him. Give all of this away in the first sentence, because it is true and because it is not the disputed question. The disputed question is whether any modern population is Israel and what makes a person a child of God, and no fact about complexion answers either.","bible":["Isaiah 53:2","1 Samuel 16:7","Revelation 1:14-16","Daniel 7:9","John 4:22","Galatians 3:28","Acts 10:34-35","2 Corinthians 5:16"],"sources":[{"name":"Who Are the Hebrew Israelites and What Do They Believe? (Jude 3 Project)","type":"apologetics","url":"https://jude3project.org/blog/2016/4/29/kzqeier0z8b1u1uk5lf186jhu5s8r5"},{"name":"Michael Brown, Was Esau-Edom White? (Religion Unplugged)","type":"apologetics","url":"https://religionunplugged.com/news/2023/3/28/was-esau-edom-white-demolishing-hebrew-israelite-lies-part-1"},{"name":"Two Hebrew Israelite Biblical Verses Examined (Times of Israel blogs)","type":"journalism","url":"https://blogs.timesofisrael.com/two-hebrew-israelite-biblical-verses-examined/"}],"response":"Not applicable. This entry marks an argument to avoid rather than a claim to answer.","responseSource":{"name":"Editorial guidance"},"verdict":"answered","rationale":"Avoid because the argument is unwinnable in the only sense that matters. Defending a light-skinned Jesus makes the Christian look exactly like the caricature the movement preaches about, and disputing a dark-skinned Jesus means defending a position with no evidence and no stake. Meanwhile the concession is free and disarming: agreeing enthusiastically that Western art lied costs nothing and buys a hearing. The substantive case is elsewhere entirely, in what the New Testament says makes someone Abraham's offspring. Handle the exegesis of Revelation 1 in its own case, where the Daniel 7 and 10 background can be laid out calmly, and never let it become the headline.","severity":"medium","avoid":true,"quran":[],"hadith":[]},
{"id":"avoid-blanket-hate-group-label","title":"DON'T USE: 'they are all violent hate groups'","category":"movement-history","claim":"Do not treat Hebrew Israelite identity as synonymous with the confrontational street camps. The spectrum is real and documented. The Church of God and Saints of Christ has existed since 1896 as an ordinary congregational body. The Commandment Keepers in Harlem operated as a synagogue with an ordained rabbinate. The African Hebrew Israelites in Dimona are a peaceable community of two to three thousand whose members serve in the IDF. SPLC itself designates specific organizations, explicitly declines to designate the faith as such, notes that listed camps include Latino and Indigenous members, and acknowledges non-radical sects. Most people who hold Hebrew Israelite beliefs have never shouted at anyone on a sidewalk; many encountered the teaching through a relative or a video and are working through it privately. A page that opens by calling them a hate group has ended the conversation with everyone it most wanted to reach, and has also said something false.","bible":["Proverbs 18:13","Proverbs 18:17","James 1:19","Titus 3:2","1 Peter 3:15-16","Colossians 4:6","Matthew 7:1-5","Ephesians 4:15"],"sources":[{"name":"Radical Hebrew Israelites (SPLC Extremist Files, including its own scope caveats)","type":"institutional","url":"https://www.splcenter.org/resources/extremist-files/radical-hebrew-israelites/"},{"name":"African Hebrew Israelites of Jerusalem (Critical Dictionary of Apocalyptic and Millenarian Movements)","type":"scholarly","url":"https://www.cdamm.org/articles/ahij"},{"name":"Commandment Keepers Ethiopian Hebrew Congregation","type":"institutional","url":"https://www.commandmentkeepersehc.com/about-us"}],"response":"Not applicable. This entry marks an argument to avoid rather than a claim to answer.","responseSource":{"name":"Editorial guidance"},"verdict":"answered","rationale":"Avoid because it is factually wrong and rhetorically fatal at the same time, which is a rare combination. The movement spans a peaceable Israeli farming community, century-old congregations, quiet individual believers, and a set of confrontational camps that genuinely do preach what the ADL and SPLC document. Collapsing that range hands every reader an easy dismissal, since anyone who knows a Hebrew Israitelite personally will recognize the description as false and stop reading. Name specific organizations and quote specific teaching where the criticism applies, and say plainly that it does not apply to others. Precision here is not softness; it is the only thing that makes the criticism credible where it is deserved.","severity":"high","avoid":true,"quran":[],"hadith":[]},
{"id":"avoid-viral-media-frames","title":"DON'T USE: viral confrontation clips and culture-war media frames","category":"movement-history","claim":"Do not build the section on viral video moments, the 2019 Lincoln Memorial confrontation and its media cycle, or adjacent culture-war flashpoints where Hebrew Israelites appeared as characters in someone else's story. Those episodes are contested in their details, were reported and re-reported through partisan frames, generated litigation and retractions, and are remembered by most readers as a fight about media bias rather than a question about Scripture. Using them signals that the section is an entry in a culture war rather than an examination of biblical claims, and it invites the reader to sort the page by tribe before reading a word. Where an incident genuinely bears on the topic, cite it soberly and precisely from primary or law-enforcement sources, as with the December 2019 Jersey City attack, where the New Jersey Attorney General described the shooters' hatred of Jews and police and their interest in the ideology, and authorities did not establish membership in any organization.","bible":["Proverbs 18:17","Exodus 23:1-2","Proverbs 14:15","1 Thessalonians 5:21","Philippians 4:8","Zechariah 8:16","Ephesians 4:25","2 Corinthians 4:2"],"sources":[{"name":"2019 Jersey City shooting (for the sober-citation contrast)","type":"journalism","url":"https://en.wikipedia.org/wiki/2019_Jersey_City_shooting"},{"name":"Jersey City Shooters Fueled by Hatred of Jewish People and Law Enforcement (CNN)","type":"journalism","url":"https://www.cnn.com/2019/12/12/us/jersey-city-new-jersey-shooting-thursday"},{"name":"Radical Hebrew Israelites (SPLC Extremist Files)","type":"institutional","url":"https://www.splcenter.org/resources/extremist-files/radical-hebrew-israelites/"}],"response":"Not applicable. This entry marks an argument to avoid rather than a claim to answer.","responseSource":{"name":"Editorial guidance"},"verdict":"answered","rationale":"Avoid because it trades a durable argument for a perishable one. Viral incidents age badly, their details get revised, and half of any audience has already assigned blame based on which outlet they read. The section's whole premise is that the Bible both sides accept is the standard, and that premise is abandoned the moment the argument runs through a news cycle. Every claim in this section can be examined from Scripture, from documented movement teaching, and from published research, none of which expires. When an incident is genuinely necessary, cite it with the same care used everywhere else, including the exculpatory details, which is exactly what makes the citation trustworthy.","severity":"medium","avoid":true,"quran":[],"hadith":[]},
{"id":"avoid-dismissing-the-longing","title":"DON'T USE: dismissing the longing instead of answering it","category":"identity-claims","claim":"Do not treat the movement as merely a set of bad arguments to be dismantled while ignoring what drove people to it. The questions underneath are serious and Christian preaching has too often failed to answer them: who am I, where did my name and language go, why did God permit four hundred years of this, and does the God of the Bible see my people at all. Those are the questions of Psalm 44, Habakkuk 1 and half the Psalter, and Scripture never rebukes anyone for asking them. A page that refutes seventeen claims and never addresses the ache has won every exchange and lost the person. The Christian answer is not that identity does not matter. It is that the identity offered is greater than the one being claimed: adoption as sons and daughters, with the Spirit of adoption crying Abba Father, joint-heirs with Christ, a chosen generation, a people who were not a people but are now the people of God.","bible":["Romans 8:15-17","Galatians 4:4-7","Ephesians 1:4-6","1 Peter 2:9-10","Hosea 1:10","Hosea 2:23","Psalm 44:9-26","Habakkuk 1:2-4","Isaiah 43:1","Revelation 2:17","John 1:12","Isaiah 56:3-8"],"sources":[{"name":"Who Are the Hebrew Israelites and What Do They Believe? (Jude 3 Project)","type":"apologetics","url":"https://jude3project.org/blog/2016/4/29/kzqeier0z8b1u1uk5lf186jhu5s8r5"},{"name":"Overview of the Black Hebrew Israelites (Jude 3 Project)","type":"apologetics","url":"https://jude3project.org/blog/2016/2/3/overview-of-the-black-hebrew-israelites"},{"name":"History of Hebrew Israelism (SPLC Intelligence Report)","type":"institutional","url":"https://www.splcenter.org/resources/reports/history-hebrew-israelism/"}],"response":"Not applicable. This entry marks an argument to avoid rather than a claim to answer.","responseSource":{"name":"Editorial guidance"},"verdict":"answered","rationale":"Avoid dismissal because the longing is legitimate and the movement grew precisely where the church left a vacuum. People did not join because they found the 12 Tribes Chart academically compelling; they joined because someone finally told them their suffering had a place in God's story and that they were somebody. That is a real need and the gospel meets it more fully than the chart does. The pastoral move is to affirm the question, name the historical failure honestly, including churches that blessed slavery, and then show that adoption in Christ grants by grace what the genealogy cannot deliver even if it were true: a name given by God, an inheritance, and a Father. End the section here rather than on a refutation, because this is the only place the section is actually trying to get to.","severity":"high","avoid":true,"quran":[],"hadith":[]}
];

against Israel, saying,"}]},"Romans 3:1-4":{"ref":"Romans 3","verses":[{"v":1,"t":"What advantage then hath the Jew? or what profit is there of circumcision?"},{"v":2,"t":"Much every way: chiefly, because that unto them were committed the oracles of God."},{"v":3,"t":"For what if some did not believe? shall their unbelief make the faith of God without effect?"},{"v":4,"t":"God forbid: yea, let God be true, but every man a liar; as it is written, That thou mightest be justified in thy sayings, and mightest overcome when thou art judged."}]},"Jeremiah 31:35-37":{"ref":"Jeremiah 31","verses":[{"v":35,"t":"Thus saith the LORD, which giveth the sun for a light by day, and the ordinances of the moon and of the stars for a light by night, which divideth the sea when the waves thereof roar; The LORD of hosts is his name:"},{"v":36,"t":"If those ordinances depart from before me, saith the LORD, then the seed of Israel also shall cease from being a nation before me for ever."},{"v":37,"t":"Thus saith the LORD; If heaven above can be measured, and the foundations of the earth searched out beneath, I will also cast off all the seed of Israel for all that they have done, saith the LORD."}]},"Romans 9:4-5":{"ref":"Romans 9","verses":[{"v":4,"t":"Who are Israelites; to whom pertaineth the adoption, and the glory, and the covenants, and the giving of the law, and the service of God, and the promises;"},{"v":5,"t":"Whose are the fathers, and of whom as concerning the flesh Christ came, who is over all, God blessed for ever. Amen."}]},"John 4:22":{"ref":"John 4","verses":[{"v":22,"t":"Ye worship ye know not what: we know what we worship: for salvation is of the Jews."}]},"Acts 17:26":{"ref":"Acts 17","verses":[{"v":26,"t":"And hath made of one blood all nations of men for to dwell on all the face of the earth, and hath determined the times before appointed, and the bounds of their habitation;"}]},"Exodus 12:38":{"ref":"Exodus 12","verses":[{"v":38,"t":"And a mixed multitude went up also with them; and flocks, and herds, even very much cattle."}]},"Ruth 1:16":{"ref":"Ruth 1","verses":[{"v":16,"t":"And Ruth said, Entreat me not to leave thee, or to return from following after thee: for whither thou goest, I will go; and where thou lodgest, I will lodge: thy people shall be my people, and thy God my God:"}]},"Ruth 4:13-22":{"ref":"Ruth 4","verses":[{"v":13,"t":"So Boaz took Ruth, and she was his wife: and when he went in unto her, the LORD gave her conception, and she bare a son."},{"v":14,"t":"And the women said unto Naomi, Blessed be the LORD, which hath not left thee this day without a kinsman, that his name may be famous in Israel."},{"v":15,"t":"And he shall be unto thee a restorer of thy life, and a nourisher of thine old age: for thy daughter in law, which loveth thee, which is better to thee than seven sons, hath born him."},{"v":16,"t":"And Naomi took the child, and laid it in her bosom, and became nurse unto it."},{"v":17,"t":"And the women her neighbours gave it a name, saying, There is a son born to Naomi; and they called his name Obed: he is the father of Jesse, the father of David."},{"v":18,"t":"Now these are the generations of Pharez: Pharez begat Hezron,"},{"v":19,"t":"And Hezron begat Ram, and Ram begat Amminadab,"},{"v":20,"t":"And Amminadab begat Nahshon, and Nahshon begat Salmon,"},{"v":21,"t":"And Salmon begat Boaz, and Boaz begat Obed,"},{"v":22,"t":"And Obed begat Jesse, and Jesse begat David."}]},"Matthew 1:5":{"ref":"Matthew 1","verses":[{"v":5,"t":"And Salmon begat Booz of Rachab; and Booz begat Obed of Ruth; and Obed begat Jesse;"}]},"Isaiah 56:3-8":{"ref":"Isaiah 56","verses":[{"v":3,"t":"Neither let the son of the stranger, that hath joined himself to the LORD, speak, saying, The LORD hath utterly separated me from his people: neither let the eunuch say, Behold, I am a dry tree."},{"v":4,"t":"For thus saith the LORD unto the eunuchs that keep my sabbaths, and choose the things that please me, and take hold of my covenant;"},{"v":5,"t":"Even unto them will I give in mine house and within my walls a place and a name better than of sons and of daughters: I will give them an everlasting name, that shall not be cut off."},{"v":6,"t":"Also the sons of the stranger, that join themselves to the LORD, to serve him, and to love the name of the LORD, to be his servants, every one that keepeth the sabbath from polluting it, and taketh hold of my covenant;"},{"v":7,"t":"Even them will I bring to my holy mountain, and make them joyful in my house of prayer: their burnt offerings and their sacrifices shall be accepted upon mine altar; for mine house shall be called an house of prayer for all people."},{"v":8,"t":"The Lord GOD which gathereth the outcasts of Israel saith, Yet will I gather others to him, beside those that are gathered unto him."}]},"Galatians 3:28":{"ref":"Galatians 3","verses":[{"v":28,"t":"There is neither Jew nor Greek, there is neither bond nor free, there is neither male nor female: for ye are all one in Christ Jesus."}]},"Genesis 25:25":{"ref":"Genesis 25","verses":[{"v":25,"t":"And the first came out red, all over like an hairy garment; and they called his name Esau."}]},"Genesis 25:30":{"ref":"Genesis 25","verses":[{"v":30,"t":"And Esau said to Jacob, Feed me, I pray thee, with that same red pottage; for I am faint: therefore was his name called Edom."}]},"1 Samuel 16:12":{"ref":"1 Samuel 16","verses":[{"v":12,"t":"And he sent, and brought him in. Now he was ruddy, and withal of a beautiful countenance, and goodly to look to. And the LORD said, Arise, anoint him: for this is he."}]},"1 Samuel 17:42":{"ref":"1 Samuel 17","verses":[{"v":42,"t":"And when the Philistine looked about, and saw David, he disdained him: for he was but a youth, and ruddy, and of a fair countenance."}]},"Deuteronomy 23:7":{"ref":"Deuteronomy 23","verses":[{"v":7,"t":"Thou shalt not abhor an Edomite; for he is thy brother: thou shalt not abhor an Egyptian; because thou wast a stranger in his land."}]},"Obadiah 1:10-14":{"ref":"Obadiah 1","verses":[{"v":10,"t":"For thy violence against thy brother Jacob shame shall cover thee, and thou shalt be cut off for ever."},{"v":11,"t":"In the day that thou stoodest on the other side, in the day that the strangers carried away captive his forces, and foreigners entered into his gates, and cast lots upon Jerusalem, even thou wast as one of them."},{"v":12,"t":"But thou shouldest not have looked on the day of thy brother in the day that he became a stranger; neither shouldest thou have rejoiced over the children of Judah in the day of their destruction; neither shouldest thou have spoken proudly in the day of distress."},{"v":13,"t":"Thou shouldest not have entered into the gate of my people in the day of their calamity; yea, thou shouldest not have looked on their affliction in the day of their calamity, nor have laid hands on their substance in the day of their calamity;"},{"v":14,"t":"Neither shouldest thou have stood in the crossway, to cut off those of his that did escape; neither shouldest thou have delivered up those of his that did remain in the day of distress."}]},"Obadiah 1:18":{"ref":"Obadiah 1","verses":[{"v":18,"t":"And the house of Jacob shall be a fire, and the house of Joseph a flame, and the house of Esau for stubble, and they shall kindle in them, and devour them; and there shall not be any remaining of the house of Esau; for the LORD hath spoken it."}]},"Malachi 1:2-3":{"ref":"Malachi 1","verses":[{"v":2,"t":"I have loved you, saith the LORD. Yet ye say, Wherein hast thou loved us? Was not Esau Jacob's brother? saith the LORD: yet I loved Jacob,"},{"v":3,"t":"And I hated Esau, and laid his mountains and his heritage waste for the dragons of the wilderness."}]},"Romans 9:13":{"ref":"Romans 9","verses":[{"v":13,"t":"As it is written, Jacob have I loved, but Esau have I hated."}]},"Amos 9:12":{"ref":"Amos 9","verses":[{"v":12,"t":"That they may possess the remnant of Edom, and of all the heathen, which are called by my name, saith the LORD that doeth this."}]},"Numbers 20:14-21":{"ref":"Numbers 20","verses":[{"v":14,"t":"And Moses sent messengers from Kadesh unto the king of Edom, Thus saith thy brother Israel, Thou knowest all the travail that hath befallen us:"},{"v":15,"t":"How our fathers went down into Egypt, and we have dwelt in Egypt a long time; and the Egyptians vexed us, and our fathers:"},{"v":16,"t":"And when we cried unto the LORD, he heard our voice, and sent an angel, and hath brought us forth out of Egypt: and, behold, we are in Kadesh, a city in the uttermost of thy border:"},{"v":17,"t":"Let us pass, I pray thee, through thy country: we will not pass through the fields, or through the vineyards, neither will we drink of the water of the wells: we will go by the king's high way, we will not turn to the right hand nor to the left, until we have passed thy borders."},{"v":18,"t":"And Edom said unto him, Thou shalt not pass by me, lest I come out against thee with the sword."},{"v":19,"t":"And the children of Israel said unto him, We will go by the high way: and if I and my cattle drink of thy water, then I will pay for it: I will only, without doing any thing else, go through on my feet."},{"v":20,"t":"And he said, Thou shalt not go through. And Edom came out against him with much people, and with a strong hand."},{"v":21,"t":"Thus Edom refused to give Israel passage through his border: wherefore Israel turned away from him."}]},"Matthew 15:21-28":{"ref":"Matthew 15","verses":[{"v":21,"t":"Then Jesus went thence, and departed into the coasts of Tyre and Sidon."},{"v":22,"t":"And, behold, a woman of Canaan came out of the same coasts, and cried unto him, saying, Have mercy on me, O Lord, thou Son of David; my daughter is grievously vexed with a devil."},{"v":23,"t":"But he answered her not a word. And his disciples came and besought him, saying, Send her away; for she crieth after us."},{"v":24,"t":"But he answered and said, I am not sent but unto the lost sheep of the house of Israel."},{"v":25,"t":"Then came she and worshipped him, saying, Lord, help me."},{"v":26,"t":"But he answered and said, It is not meet to take the children's bread, and to cast it to dogs."},{"v":27,"t":"And she said, Truth, Lord: yet the dogs eat of the crumbs which fall from their masters' table."},{"v":28,"t":"Then Jesus answered and said unto her, O woman, great is thy faith: be it unto thee even as thou wilt. And her daughter was made whole from that very hour."}]},"Acts 10:34-35":{"ref":"Acts 10","verses":[{"v":34,"t":"Then Peter opened his mouth, and said, Of a truth I perceive that God is no respecter of persons:"},{"v":35,"t":"But in every nation he that feareth him, and worketh righteousness, is accepted with him."}]},"Acts 10:44-48":{"ref":"Acts 10","verses":[{"v":44,"t":"While Peter yet spake these words, the Holy Ghost fell on all them which heard the word."},{"v":45,"t":"And they of the circumcision which believed were astonished, as many as came with Peter, because that on the Gentiles also was poured out the gift of the Holy Ghost."},{"v":46,"t":"For they heard them speak with tongues, and magnify God. Then answered Peter,"},{"v":47,"t":"Can any man forbid water, that these should not be baptized, which have received the Holy Ghost as well as we?"},{"v":48,"t":"And he commanded them to be baptized in the name of the Lord. Then prayed they him to tarry certain days."}]},"Acts 15:7-11":{"ref":"Acts 15","verses":[{"v":7,"t":"And when there had been much disputing, Peter rose up, and said unto them, Men and brethren, ye know how that a good while ago God made choice among us, that the Gentiles by my mouth should hear the word of the gospel, and believe."},{"v":8,"t":"And God, which knoweth the hearts, bare them witness, giving them the Holy Ghost, even as he did unto us;"},{"v":9,"t":"And put no difference between us and them, purifying their hearts by faith."},{"v":10,"t":"Now therefore why tempt ye God, to put a yoke upon the neck of the disciples, which neither our fathers nor we were able to bear?"},{"v":11,"t":"But we believe that through the grace of the Lord Jesus Christ we shall be saved, even as they."}]},"Ephesians 2:11-19":{"ref":"Ephesians 2","verses":[{"v":11,"t":"Wherefore remember, that ye being in time past Gentiles in the flesh, who are called Uncircumcision by that which is called the Circumcision in the flesh made by hands;"},{"v":12,"t":"That at that time ye were without Christ, being aliens from the commonwealth of Israel, and strangers from the covenants of promise, having no hope, and without God in the world:"},{"v":13,"t":"But now in Christ Jesus ye who sometimes were far off are made nigh by the blood of Christ."},{"v":14,"t":"For he is our peace, who hath made both one, and hath broken down the middle wall of partition between us;"},{"v":15,"t":"Having abolished in his flesh the enmity, even the law of commandments contained in ordinances; for to make in himself of twain one new man, so making peace;"},{"v":16,"t":"And that he might reconcile both unto God in one body by the cross, having slain the enmity thereby:"},{"v":17,"t":"And came and preached peace to you which were afar off, and to them that were nigh."},{"v":18,"t":"For through him we both have access by one Spirit unto the Father."},{"v":19,"t":"Now therefore ye are no more strangers and foreigners, but fellowcitizens with the saints, and of the household of God;"}]},"Revelation 5:9":{"ref":"Revelation 5","verses":[{"v":9,"t":"And they sung a new song, saying, Thou art worthy to take the book, and to open the seals thereof: for thou wast slain, and hast redeemed us to God by thy blood out of every kindred, and tongue, and people, and nation;"}]},"Revelation 7:9":{"ref":"Revelation 7","verses":[{"v":9,"t":"After this I beheld, and, lo, a great multitude, which no man could number, of all nations, and kindreds, and people, and tongues, stood before the throne, and before the Lamb, clothed with white robes, and palms in their hands;"}]},"Romans 11:11-25":{"ref":"Romans 11","verses":[{"v":11,"t":"I say then, Have they stumbled that they should fall? God forbid: but rather through their fall salvation is come unto the Gentiles, for to provoke them to jealousy."},{"v":12,"t":"Now if the fall of them be the riches of the world, and the diminishing of them the riches of the Gentiles; how much more their fulness?"},{"v":13,"t":"For I speak to you Gentiles, inasmuch as I am the apostle of the Gentiles, I magnify mine office:"},{"v":14,"t":"If by any means I may provoke to emulation them which are my flesh, and might save some of them."},{"v":15,"t":"For if the casting away of them be the reconciling of the world, what shall the receiving of them be, but life from the dead?"},{"v":16,"t":"For if the firstfruit be holy, the lump is also holy: and if the root be holy, so are the branches."},{"v":17,"t":"And if some of the branches be broken off, and thou, being a wild olive tree, wert grafted in among them, and with them partakest of the root and fatness of the olive tree;"},{"v":18,"t":"Boast not against the branches. But if thou boast, thou bearest not the root, but the root thee."},{"v":19,"t":"Thou wilt say then, The branches were broken off, that I might be grafted in."},{"v":20,"t":"Well; because of unbelief they were broken off, and thou standest by faith. Be not highminded, but fear:"},{"v":21,"t":"For if God spared not the natural branches, take heed lest he also spare not thee."},{"v":22,"t":"Behold therefore the goodness and severity of God: on them which fell, severity; but toward thee, goodness, if thou continue in his goodness: otherwise thou also shalt be cut off."},{"v":23,"t":"And they also, if they abide not still in unbelief, shall be grafted in: for God is able to graft them in again."},{"v":24,"t":"For if thou wert cut out of the olive tree which is wild by nature, and wert grafted contrary to nature into a good olive tree: how much more shall these, which be the natural branches, be grafted into their own olive tree?"},{"v":25,"t":"For I would not, brethren, that ye should be ignorant of this mystery, lest ye should be wise in your own conceits; that blindness in part is happened to Israel, until the fulness of the Gentiles be come in."}]},"Isaiah 49:6":{"ref":"Isaiah 49","verses":[{"v":6,"t":"And he said, It is a light thing that thou shouldest be my servant to raise up the tribes of Jacob, and to restore the preserved of Israel: I will also give thee for a light to the Gentiles, that thou mayest be my salvation unto the end of the earth."}]},"Matthew 28:19":{"ref":"Matthew 28","verses":[{"v":19,"t":"Go ye therefore, and teach all nations, baptizing them in the name of the Father, and of the Son, and of the Holy Ghost:"}]},"Luke 4:25-27":{"ref":"Luke 4","verses":[{"v":25,"t":"But I tell you of a truth, many widows were in Israel in the days of Elias, when the heaven was shut up three years and six months, when great famine was throughout all the land;"},{"v":26,"t":"But unto none of them was Elias sent, save unto Sarepta, a city of Sidon, unto a woman that was a widow."},{"v":27,"t":"And many lepers were in Israel in the time of Eliseus the prophet; and none of them was cleansed, saving Naaman the Syrian."}]},"Jonah 4:11":{"ref":"Jonah 4","verses":[{"v":11,"t":"And should not I spare Nineveh, that great city, wherein are more than sixscore thousand persons that cannot discern between their right hand and their left hand; and also much cattle?"}]},"Romans 3:20-28":{"ref":"Romans 3","verses":[{"v":20,"t":"Therefore by the deeds of the law there shall no flesh be justified in his sight: for by the law is the knowledge of sin."},{"v":21,"t":"But now the righteousness of God without the law is manifested, being witnessed by the law and the prophets;"},{"v":22,"t":"Even the righteousness of God which is by faith of Jesus Christ unto all and upon all them that believe: for there is no difference:"},{"v":23,"t":"For all have sinned, and come short of the glory of God;"},{"v":24,"t":"Being justified freely by his grace through the redemption that is in Christ Jesus:"},{"v":25,"t":"Whom God hath set forth to be a propitiation through faith in his blood, to declare his righteousness for the remission of sins that are past, through the forbearance of God;"},{"v":26,"t":"To declare, I say, at this time his righteousness: that he might be just, and the justifier of him which believeth in Jesus."},{"v":27,"t":"Where is boasting then? It is excluded. By what law? of works? Nay: but by the law of faith."},{"v":28,"t":"Therefore we conclude that a man is justified by faith without the deeds of the law."}]},"Galatians 2:16":{"ref":"Galatians 2","verses":[{"v":16,"t":"Knowing that a man is not justified by the works of the law, but by the faith of Jesus Christ, even we have believed in Jesus Christ, that we might be justified by the faith of Christ, and not by the works of the law: for by the works of the law shall no flesh be justified."}]},"Galatians 3:10-13":{"ref":"Galatians 3","verses":[{"v":10,"t":"For as many as are of the works of the law are under the curse: for it is written, Cursed is every one that continueth not in all things which are written in the book of the law to do them."},{"v":11,"t":"But that no man is justified by the law in the sight of God, it is evident: for, The just shall live by faith."},{"v":12,"t":"And the law is not of faith: but, The man that doeth them shall live in them."},{"v":13,"t":"Christ hath redeemed us from the curse of the law, being made a curse for us: for it is written, Cursed is every one that hangeth on a tree:"}]},"Galatians 5:4":{"ref":"Galatians 5","verses":[{"v":4,"t":"Christ is become of no effect unto you, whosoever of you are justified by the law; ye are fallen from grace."}]},"Acts 15:10-11":{"ref":"Acts 15","verses":[{"v":10,"t":"Now therefore why tempt ye God, to put a yoke upon the neck of the disciples, which neither our fathers nor we were able to bear?"},{"v":11,"t":"But we believe that through the grace of the Lord Jesus Christ we shall be saved, even as they."}]},"Ephesians 2:8-9":{"ref":"Ephesians 2","verses":[{"v":8,"t":"For by grace are ye saved through faith; and that not of yourselves: it is the gift of God:"},{"v":9,"t":"Not of works, lest any man should boast."}]},"Hebrews 8:6-13":{"ref":"Hebrews 8","verses":[{"v":6,"t":"But now hath he obtained a more excellent ministry, by how much also he is the mediator of a better covenant, which was established upon better promises."},{"v":7,"t":"For if that first covenant had been faultless, then should no place have been sought for the second."},{"v":8,"t":"For finding fault with them, he saith, Behold, the days come, saith the Lord, when I will make a new covenant with the house of Israel and with the house of Judah:"},{"v":9,"t":"Not according to the covenant that I made with their fathers in the day when I took them by the hand to lead them out of the land of Egypt; because they continued not in my covenant, and I regarded them not, saith the Lord."},{"v":10,"t":"For this is the covenant that I will make with the house of Israel after those days, saith the Lord; I will put my laws into their mind, and write them in their hearts: and I will be to them a God, and they shall be to me a people:"},{"v":11,"t":"And they shall not teach every man his neighbour, and every man his brother, saying, Know the Lord: for all shall know me, from the least to the greatest."},{"v":12,"t":"For I will be merciful to their unrighteousness, and their sins and their iniquities will I remember no more."},{"v":13,"t":"In that he saith, A new covenant, he hath made the first old. Now that which decayeth and waxeth old is ready to vanish away."}]},"Deuteronomy 27:26":{"ref":"Deuteronomy 27","verses":[{"v":26,"t":"Cursed be he that confirmeth not all the words of this law to do them. And all the people shall say, Amen."}]},"Colossians 2:16-17":{"ref":"Colossians 2","verses":[{"v":16,"t":"Let no man therefore judge you in meat, or in drink, or in respect of an holyday, or of the new moon, or of the sabbath days:"},{"v":17,"t":"Which are a shadow of things to come; but the body is of Christ."}]},"Titus 3:5":{"ref":"Titus 3","verses":[{"v":5,"t":"Not by works of righteousness which we have done, but according to his mercy he saved us, by the washing of regeneration, and renewing of the Holy Ghost;"}]},"Galatians 3:7-9":{"ref":"Galatians 3","verses":[{"v":7,"t":"Know ye therefore that they which are of faith, the same are the children of Abraham."},{"v":8,"t":"And the scripture, foreseeing that God would justify the heathen through faith, preached before the gospel unto Abraham, saying, In thee shall all nations be blessed."},{"v":9,"t":"So then they which be of faith are blessed with faithful Abraham."}]},"Galatians 3:26-29":{"ref":"Galatians 3","verses":[{"v":26,"t":"For ye are all the children of God by faith in Christ Jesus."},{"v":27,"t":"For as many of you as have been baptized into Christ have put on Christ."},{"v":28,"t":"There is neither Jew nor Greek, there is neither bond nor free, there is neither male nor female: for ye are all one in Christ Jesus."},{"v":29,"t":"And if ye be Christ's, then are ye Abraham's seed, and heirs according to the promise."}]},"Galatians 4:4-7":{"ref":"Galatians 4","verses":[{"v":4,"t":"But when the fulness of the time was come, God sent forth his Son, made of a woman, made under the law,"},{"v":5,"t":"To redeem them that were under the law, that we might receive the adoption of sons."},{"v":6,"t":"And because ye are sons, God hath sent forth the Spirit of his Son into your hearts, crying, Abba, Father."},{"v":7,"t":"Wherefore thou art no more a servant, but a son; and if a son, then an heir of God through Christ."}]},"Romans 2:28-29":{"ref":"Romans 2","verses":[{"v":28,"t":"For he is not a Jew, which is one outwardly; neither is that circumcision, which is outward in the flesh:"},{"v":29,"t":"But he is a Jew, which is one inwardly; and circumcision is that of the heart, in the spirit, and not in the letter; whose praise is not of men, but of God."}]},"Romans 9:6-8":{"ref":"Romans 9","verses":[{"v":6,"t":"Not as though the word of God hath taken none effect. For they are not all Israel, which are of Israel:"},{"v":7,"t":"Neither, because they are the seed of Abraham, are they all children: but, In Isaac shall thy seed be called."},{"v":8,"t":"That is, They which are the children of the flesh, these are not the children of God: but the children of the promise are counted for the seed."}]},"Romans 8:15-17":{"ref":"Romans 8","verses":[{"v":15,"t":"For ye have not received the spirit of bondage again to fear; but ye have received the Spirit of adoption, whereby we cry, Abba, Father."},{"v":16,"t":"The Spirit itself beareth witness with our spirit, that we are the children of God:"},{"v":17,"t":"And if children, then heirs; heirs of God, and joint-heirs with Christ; if so be that we suffer with him, that we may be also glorified together."}]},"Matthew 3:9":{"ref":"Matthew 3","verses":[{"v":9,"t":"And think not to say within yourselves, We have Abraham to our father: for I say unto you, that God is able of these stones to raise up children unto Abraham."}]},"John 8:37-44":{"ref":"John 8","verses":[{"v":37,"t":"I know that ye are Abraham's seed; but ye seek to kill me, because my word hath no place in you."},{"v":38,"t":"I speak that which I have seen with my Father: and ye do that which ye have seen with your father."},{"v":39,"t":"They answered and said unto him, Abraham is our father. Jesus saith unto them, If ye were Abraham's children, ye would do the works of Abraham."},{"v":40,"t":"But now ye seek to kill me, a man that hath told you the truth, which I have heard of God: this did not Abraham."},{"v":41,"t":"Ye do the deeds of your father. Then said they to him, We be not born of fornication; we have one Father, even God."},{"v":42,"t":"Jesus said unto them, If God were your Father, ye would love me: for I proceeded forth and came from God; neither came I of myself, but he sent me."},{"v":43,"t":"Why do ye not understand my speech? even because ye cannot hear my word."},{"v":44,"t":"Ye are of your father the devil, and the lusts of your father ye will do. He was a murderer from the beginning, and abode not in the truth, because there is no truth in him. When he speaketh a lie, he speaketh of his own: for he is a liar, and the father of it."}]},"Ephesians 1:5":{"ref":"Ephesians 1","verses":[{"v":5,"t":"Having predestinated us unto the adoption of children by Jesus Christ to himself, according to the good pleasure of his will,"}]},"1 Peter 2:9-10":{"ref":"1 Peter 2","verses":[{"v":9,"t":"But ye are a chosen generation, a royal priesthood, an holy nation, a peculiar people; that ye should shew forth the praises of him who hath called you out of darkness into his marvellous light:"},{"v":10,"t":"Which in time past were not a people, but are now the people of God: which had not obtained mercy, but now have obtained mercy."}]},"Romans 11:1":{"ref":"Romans 11","verses":[{"v":1,"t":"I say then, Hath God cast away his people? God forbid. For I also am an Israelite, of the seed of Abraham, of the tribe of Benjamin."}]},"Deuteronomy 13:1-5":{"ref":"Deuteronomy 13","verses":[{"v":1,"t":"If there arise among you a prophet, or a dreamer of dreams, and giveth thee a sign or a wonder,"},{"v":2,"t":"And the sign or the wonder come to pass, whereof he spake unto thee, saying, Let us go after other gods, which thou hast not known, and let us serve them;"},{"v":3,"t":"Thou shalt not hearken unto the words of that prophet, or that dreamer of dreams: for the LORD your God proveth you, to know whether ye love the LORD your God with all your heart and with all your soul."},{"v":4,"t":"Ye shall walk after the LORD your God, and fear him, and keep his commandments, and obey his voice, and ye shall serve him, and cleave unto him."},{"v":5,"t":"And that prophet, or that dreamer of dreams, shall be put to death; because he hath spoken to turn you away from the LORD your God, which brought you out of the land of Egypt, and redeemed you out of the house of bondage, to thrust thee out of the way which the LORD thy God commanded thee to walk in. So shalt thou put the evil away from the midst of thee."}]},"Jeremiah 23:16":{"ref":"Jeremiah 23","verses":[{"v":16,"t":"Thus saith the LORD of hosts, Hearken not unto the words of the prophets that prophesy unto you: they make you vain: they speak a vision of their own heart, and not out of the mouth of the LORD."}]},"Galatians 1:8-9":{"ref":"Galatians 1","verses":[{"v":8,"t":"But though we, or an angel from heaven, preach any other gospel unto you than that which we have preached unto you, let him be accursed."},{"v":9,"t":"As we said before, so say I now again, If any man preach any other gospel unto you than that ye have received, let him be accursed."}]},"2 Timothy 4:3-4":{"ref":"2 Timothy 4","verses":[{"v":3,"t":"For the time will come when they will not endure sound doctrine; but after their own lusts shall they heap to themselves teachers, having itching ears;"},{"v":4,"t":"And they shall turn away their ears from the truth, and shall be turned unto fables."}]},"1 John 4:1":{"ref":"1 John 4","verses":[{"v":1,"t":"Beloved, believe not every spirit, but try the spirits whether they are of God: because many false prophets are gone out into the world."}]},"Jude 1:3":{"ref":"Jude 1","verses":[{"v":3,"t":"Beloved, when I gave all diligence to write unto you of the common salvation, it was needful for me to write unto you, and exhort you that ye should earnestly contend for the faith which was once delivered unto the saints."}]},"Acts 17:11":{"ref":"Acts 17","verses":[{"v":11,"t":"These were more noble than those in Thessalonica, in that they received the word with all readiness of mind, and searched the scriptures daily, whether those things were so."}]},"Ephesians 4:14":{"ref":"Ephesians 4","verses":[{"v":14,"t":"That we henceforth be no more children, tossed to and fro, and carried about with every wind of doctrine, by the sleight of men, and cunning craftiness, whereby they lie in wait to deceive;"}]},"Deuteronomy 18:20-22":{"ref":"Deuteronomy 18","verses":[{"v":20,"t":"But the prophet, which shall presume to speak a word in my name, which I have not commanded him to speak, or that shall speak in the name of other gods, even that prophet shall die."},{"v":21,"t":"And if thou say in thine heart, How shall we know the word which the LORD hath not spoken?"},{"v":22,"t":"When a prophet speaketh in the name of the LORD, if the thing follow not, nor come to pass, that is the thing which the LORD hath not spoken, but the prophet hath spoken it presumptuously: thou shalt not be afraid of him."}]},"Matthew 24:36":{"ref":"Matthew 24","verses":[{"v":36,"t":"But of that day and hour knoweth no man, no, not the angels of heaven, but my Father only."}]},"Acts 1:7":{"ref":"Acts 1","verses":[{"v":7,"t":"And he said unto them, It is not for you to know the times or the seasons, which the Father hath put in his own power."}]},"2 Peter 3:3-4":{"ref":"2 Peter 3","verses":[{"v":3,"t":"Knowing this first, that there shall come in the last days scoffers, walking after their own lusts,"},{"v":4,"t":"And saying, Where is the promise of his coming? for since the fathers fell asleep, all things continue as they were from the beginning of the creation."}]},"Jeremiah 28:15-17":{"ref":"Jeremiah 28","verses":[{"v":15,"t":"Then said the prophet Jeremiah unto Hananiah the prophet, Hear now, Hananiah; The LORD hath not sent thee; but thou makest this people to trust in a lie."},{"v":16,"t":"Therefore thus saith the LORD; Behold, I will cast thee from off the face of the earth: this year thou shalt die, because thou hast taught rebellion against the LORD."},{"v":17,"t":"So Hananiah the prophet died the same year in the seventh month."}]},"Matthew 24:23-26":{"ref":"Matthew 24","verses":[{"v":23,"t":"Then if any man shall say unto you, Lo, here is Christ, or there; believe it not."},{"v":24,"t":"For there shall arise false Christs, and false prophets, and shall shew great signs and wonders; insomuch that, if it were possible, they shall deceive the very elect."},{"v":25,"t":"Behold, I have told you before."},{"v":26,"t":"Wherefore if they shall say unto you, Behold, he is in the desert; go not forth: behold, he is in the secret chambers; believe it not."}]},"1 Thessalonians 5:1-2":{"ref":"1 Thessalonians 5","verses":[{"v":1,"t":"But of the times and the seasons, brethren, ye have no need that I write unto you."},{"v":2,"t":"For yourselves know perfectly that the day of the Lord so cometh as a thief in the night."}]},"Mark 13:32":{"ref":"Mark 13","verses":[{"v":32,"t":"But of that day and that hour knoweth no man, no, not the angels which are in heaven, neither the Son, but the Father."}]},"Genesis 2:17":{"ref":"Genesis 2","verses":[{"v":17,"t":"But of the tree of the knowledge of good and evil, thou shalt not eat of it: for in the day that thou eatest thereof thou shalt surely die."}]},"Genesis 3:19":{"ref":"Genesis 3","verses":[{"v":19,"t":"In the sweat of thy face shalt thou eat bread, till thou return unto the ground; for out of it wast thou taken: for dust thou art, and unto dust shalt thou return."}]},"Romans 5:12":{"ref":"Romans 5","verses":[{"v":12,"t":"Wherefore, as by one man sin entered into the world, and death by sin; and so death passed upon all men, for that all have sinned:"}]},"Hebrews 9:27":{"ref":"Hebrews 9","verses":[{"v":27,"t":"And as it is appointed unto men once to die, but after this the judgment:"}]},"1 Corinthians 15:20-26":{"ref":"1 Corinthians 15","verses":[{"v":20,"t":"But now is Christ risen from the dead, and become the firstfruits of them that slept."},{"v":21,"t":"For since by man came death, by man came also the resurrection of the dead."},{"v":22,"t":"For as in Adam all die, even so in Christ shall all be made alive."},{"v":23,"t":"But every man in his own order: Christ the firstfruits; afterward they that are Christ's at his coming."},{"v":24,"t":"Then cometh the end, when he shall have delivered up the kingdom to God, even the Father; when he shall have put down all rule and all authority and power."},{"v":25,"t":"For he must reign, till he hath put all enemies under his feet."},{"v":26,"t":"The last enemy that shall be destroyed is death."}]},"1 Corinthians 15:53-57":{"ref":"1 Corinthians 15","verses":[{"v":53,"t":"For this corruptible must put on incorruption, and this mortal must put on immortality."},{"v":54,"t":"So when this corruptible shall have put on incorruption, and this mortal shall have put on immortality, then shall be brought to pass the saying that is written, Death is swallowed up in victory."},{"v":55,"t":"O death, where is thy sting? O grave, where is thy victory?"},{"v":56,"t":"The sting of death is sin; and the strength of sin is the law."},{"v":57,"t":"But thanks be to God, which giveth us the victory through our Lord Jesus Christ."}]},"Deuteronomy 18:22":{"ref":"Deuteronomy 18","verses":[{"v":22,"t":"When a prophet speaketh in the name of the LORD, if the thing follow not, nor come to pass, that is the thing which the LORD hath not spoken, but the prophet hath spoken it presumptuously: thou shalt not be afraid of him."}]},"2 Timothy 1:10":{"ref":"2 Timothy 1","verses":[{"v":10,"t":"But is now made manifest by the appearing of our Saviour Jesus Christ, who hath abolished death, and hath brought life and immortality to light through the gospel:"}]},"Revelation 21:4":{"ref":"Revelation 21","verses":[{"v":4,"t":"And God shall wipe away all tears from their eyes; and there shall be no more death, neither sorrow, nor crying, neither shall there be any more pain: for the former things are passed away."}]},"Ephesians 4:29-32":{"ref":"Ephesians 4","verses":[{"v":29,"t":"Let no corrupt communication proceed out of your mouth, but that which is good to the use of edifying, that it may minister grace unto the hearers."},{"v":30,"t":"And grieve not the holy Spirit of God, whereby ye are sealed unto the day of redemption."},{"v":31,"t":"Let all bitterness, and wrath, and anger, and clamour, and evil speaking, be put away from you, with all malice:"},{"v":32,"t":"And be ye kind one to another, tenderhearted, forgiving one another, even as God for Christ's sake hath forgiven you."}]},"James 3:5-10":{"ref":"James 3","verses":[{"v":5,"t":"Even so the tongue is a little member, and boasteth great things. Behold, how great a matter a little fire kindleth!"},{"v":6,"t":"And the tongue is a fire, a world of iniquity: so is the tongue among our members, that it defileth the whole body, and setteth on fire the course of nature; and it is set on fire of hell."},{"v":7,"t":"For every kind of beasts, and of birds, and of serpents, and of things in the sea, is tamed, and hath been tamed of mankind:"},{"v":8,"t":"But the tongue can no man tame; it is an unruly evil, full of deadly poison."},{"v":9,"t":"Therewith bless we God, even the Father; and therewith curse we men, which are made after the similitude of God."},{"v":10,"t":"Out of the same mouth proceedeth blessing and cursing. My brethren, these things ought not so to be."}]},"Proverbs 18:17":{"ref":"Proverbs 18","verses":[{"v":17,"t":"He that is first in his own cause seemeth just; but his neighbour cometh and searcheth him."}]},"Matthew 7:1-5":{"ref":"Matthew 7","verses":[{"v":1,"t":"Judge not, that ye be not judged."},{"v":2,"t":"For with what judgment ye judge, ye shall be judged: and with what measure ye mete, it shall be measured to you again."},{"v":3,"t":"And why beholdest thou the mote that is in thy brother's eye, but considerest not the beam that is in thine own eye?"},{"v":4,"t":"Or how wilt thou say to thy brother, Let me pull out the mote out of thine eye; and, behold, a beam is in thine own eye?"},{"v":5,"t":"Thou hypocrite, first cast out the beam out of thine own eye; and then shalt thou see clearly to cast out the mote out of thy brother's eye."}]},"Romans 12:17-21":{"ref":"Romans 12","verses":[{"v":17,"t":"Recompense to no man evil for evil. Provide things honest in the sight of all men."},{"v":18,"t":"If it be possible, as much as lieth in you, live peaceably with all men."},{"v":19,"t":"Dearly beloved, avenge not yourselves, but rather give place unto wrath: for it is written, Vengeance is mine; I will repay, saith the Lord."},{"v":20,"t":"Therefore if thine enemy hunger, feed him; if he thirst, give him drink: for in so doing thou shalt heap coals of fire on his head."},{"v":21,"t":"Be not overcome of evil, but overcome evil with good."}]},"1 Peter 3:15-16":{"ref":"1 Peter 3","verses":[{"v":15,"t":"But sanctify the Lord God in your hearts: and be ready always to give an answer to every man that asketh you a reason of the hope that is in you with meekness and fear:"},{"v":16,"t":"Having a good conscience; that, whereas they speak evil of you, as of evildoers, they may be ashamed that falsely accuse your good conversation in Christ."}]},"Titus 3:2":{"ref":"Titus 3","verses":[{"v":2,"t":"To speak evil of no man, to be no brawlers, but gentle, shewing all meekness unto all men."}]},"Colossians 4:6":{"ref":"Colossians 4","verses":[{"v":6,"t":"Let your speech be alway with grace, seasoned with salt, that ye may know how ye ought to answer every man."}]},"Judges 4:4-9":{"ref":"Judges 4","verses":[{"v":4,"t":"And Deborah, a prophetess, the wife of Lapidoth, she judged Israel at that time."},{"v":5,"t":"And she dwelt under the palm tree of Deborah between Ramah and Beth-el in mount Ephraim: and the children of Israel came up to her for judgment."},{"v":6,"t":"And she sent and called Barak the son of Abinoam out of Kedesh-naphtali, and said unto him, Hath not the LORD God of Israel commanded, saying, Go and draw toward mount Tabor, and take with thee ten thousand men of the children of Naphtali and of the children of Zebulun?"},{"v":7,"t":"And I will draw unto thee to the river Kishon Sisera, the captain of Jabin's army, with his chariots and his multitude; and I will deliver him into thine hand."},{"v":8,"t":"And Barak said unto her, If thou wilt go with me, then I will go: but if thou wilt not go with me, then I will not go."},{"v":9,"t":"And she said, I will surely go with thee: notwithstanding the journey that thou takest shall not be for thine honour; for the LORD shall sell Sisera into the hand of a woman. And Deborah arose, and went with Barak to Kedesh."}]},"2 Kings 22:14-20":{"ref":"2 Kings 22","verses":[{"v":14,"t":"So Hilkiah the priest, and Ahikam, and Achbor, and Shaphan, and Asahiah, went unto Huldah the prophetess, the wife of Shallum the son of Tikvah, the son of Harhas, keeper of the wardrobe; (now she dwelt in Jerusalem in the college;) and they communed with her."},{"v":15,"t":"And she said unto them, Thus saith the LORD God of Israel, Tell the man that sent you to me,"},{"v":16,"t":"Thus saith the LORD, Behold, I will bring evil upon this place, and upon the inhabitants thereof, even all the words of the book which the king of Judah hath read:"},{"v":17,"t":"Because they have forsaken me, and have burned incense unto other gods, that they might provoke me to anger with all the works of their hands; therefore my wrath shall be kindled against this place, and shall not be quenched."},{"v":18,"t":"But to the king of Judah which sent you to inquire of the LORD, thus shall ye say to him, Thus saith the LORD God of Israel, As touching the words which thou hast heard;"},{"v":19,"t":"Because thine heart was tender, and thou hast humbled thyself before the LORD, when thou heardest what I spake against this place, and against the inhabitants thereof, that they should become a desolation and a curse, and hast rent thy clothes, and wept before me; I also have heard thee, saith the LORD."},{"v":20,"t":"Behold therefore, I will gather thee unto thy fathers, and thou shalt be gathered into thy grave in peace; and thine eyes shall not see all the evil which I will bring upon this place. And they brought the king word again."}]},"Acts 18:26":{"ref":"Acts 18","verses":[{"v":26,"t":"And he began to speak boldly in the synagogue: whom when Aquila and Priscilla had heard, they took him unto them, and expounded unto him the way of God more perfectly."}]},"Romans 16:1-2":{"ref":"Romans 16","verses":[{"v":1,"t":"I commend unto you Phebe our sister, which is a servant of the church which is at Cenchrea:"},{"v":2,"t":"That ye receive her in the Lord, as becometh saints, and that ye assist her in whatsoever business she hath need of you: for she hath been a succourer of many, and of myself also."}]},"Romans 16:3-7":{"ref":"Romans 16","verses":[{"v":3,"t":"Greet Priscilla and Aquila my helpers in Christ Jesus:"},{"v":4,"t":"Who have for my life laid down their own necks: unto whom not only I give thanks, but also all the churches of the Gentiles."},{"v":5,"t":"Likewise greet the church that is in their house. Salute my wellbeloved Epænetus, who is the firstfruits of Achaia unto Christ."},{"v":6,"t":"Greet Mary, who bestowed much labour on us."},{"v":7,"t":"Salute Andronicus and Junia, my kinsmen, and my fellowprisoners, who are of note among the apostles, who also were in Christ before me."}]},"Luke 24:1-11":{"ref":"Luke 24","verses":[{"v":1,"t":"Now upon the first day of the week, very early in the morning, they came unto the sepulchre, bringing the spices which they had prepared, and certain others with them."},{"v":2,"t":"And they found the stone rolled away from the sepulchre."},{"v":3,"t":"And they entered in, and found not the body of the Lord Jesus."},{"v":4,"t":"And it came to pass, as they were much perplexed thereabout, behold, two men stood by them in shining garments:"},{"v":5,"t":"And as they were afraid, and bowed down their faces to the earth, they said unto them, Why seek ye the living among the dead?"},{"v":6,"t":"He is not here, but is risen: remember how he spake unto you when he was yet in Galilee,"},{"v":7,"t":"Saying, The Son of man must be delivered into the hands of sinful men, and be crucified, and the third day rise again."},{"v":8,"t":"And they remembered his words,"},{"v":9,"t":"And returned from the sepulchre, and told all these things unto the eleven, and to all the rest."},{"v":10,"t":"It was Mary Magdalene, and Joanna, and Mary the mother of James, and other women that were with them, which told these things unto the apostles."},{"v":11,"t":"And their words seemed to them as idle tales, and they believed them not."}]},"Ephesians 5:25-29":{"ref":"Ephesians 5","verses":[{"v":25,"t":"Husbands, love your wives, even as Christ also loved the church, and gave himself for it;"},{"v":26,"t":"That he might sanctify and cleanse it with the washing of water by the word,"},{"v":27,"t":"That he might present it to himself a glorious church, not having spot, or wrinkle, or any such thing; but that it should be holy and without blemish."},{"v":28,"t":"So ought men to love their wives as their own bodies. He that loveth his wife loveth himself."},{"v":29,"t":"For no man ever yet hated his own flesh; but nourisheth and cherisheth it, even as the Lord the church:"}]},"1 Peter 3:7":{"ref":"1 Peter 3","verses":[{"v":7,"t":"Likewise, ye husbands, dwell with them according to knowledge, giving honour unto the wife, as unto the weaker vessel, and as being heirs together of the grace of life; that your prayers be not hindered."}]},"John 4:39":{"ref":"John 4","verses":[{"v":39,"t":"And many of the Samaritans of that city believed on him for the saying of the woman, which testified, He told me all that ever I did."}]},"Genesis 2:24":{"ref":"Genesis 2","verses":[{"v":24,"t":"Therefore shall a man leave his father and his mother, and shall cleave unto his wife: and they shall be one flesh."}]},"Matthew 19:4-6":{"ref":"Matthew 19","verses":[{"v":4,"t":"And he answered and said unto them, Hav
