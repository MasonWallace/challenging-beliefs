{"id":"year-2000-failed-prophecy","title":"The year 2000 prophecy and what happened when it failed","category":"movement-history","claim":"During the 1990s the Israelite Church, in the One West lineage, taught publicly that Christ would return in the year 2000 to destroy or enslave the Edomites, a prophecy associated with the teacher Ahrayah. The year came and went. The organization then rebranded as the Israelite Church of God in Jesus Christ, the name it still uses, and in late 2000 was taken over by Jermaine Grant, who assumed the title Chief High Priest Tazadaqyah and declared himself the Comforter and the Holy Spirit. Scripture supplies its own test for this situation. Deuteronomy 18:20-22 says that when a prophet speaks in the name of the LORD and the thing does not follow, the LORD has not spoken it, and the people need not fear him. Jesus is equally direct: 'But of that day and hour knoweth no man, no, not the angels of heaven, but my Father only' (Matt 24:36). A movement that stakes its authority on reading prophecy correctly invited this measurement.","bible":["Deuteronomy 18:20-22","Matthew 24:36","Acts 1:7","2 Peter 3:3-4","Jeremiah 28:15-17","Matthew 24:23-26","1 Thessalonians 5:1-2","Mark 13:32"],"sources":[{"name":"Racist Black Hebrew Israelites Becoming More Militant (SPLC Intelligence Report)","type":"institutional","url":"https://www.splcenter.org/resources/reports/racist-black-hebrew-israelites-becoming-more-militant/"},{"name":"Israelite Church of God in Jesus Christ","type":"scholarly","url":"https://en.wikipedia.org/wiki/Israelite_Church_of_God_in_Jesus_Christ"},{"name":"History of Hebrew Israelism (SPLC Intelligence Report)","type":"institutional","url":"https://www.splcenter.org/resources/reports/history-hebrew-israelism/"},{"name":"Extremist Sects Within the Black Hebrew Israelite Movement (ADL)","type":"institutional","url":"https://www.adl.org/resources/backgrounder/extremist-sects-within-black-hebrew-israelite-movement"},{"name":"Black Hebrew Israelism: A Refutation Guide for Christians","type":"apologetics","url":"https://thegoodnewsapologetics.wordpress.com/2018/01/04/black-hebrew-israelism-a-refutation-guide-for-christians/"}],"response":"Present-day camps mostly answer by disowning the man rather than defending the prediction. ISUPK and IUIC are separate organizations from the Israelite Church of God in Jesus Christ, and a teacher in one camp does not bind another; the movement has no central authority, so pinning one camp's failure on all is like indicting all Protestants for one denomination's date-setting. Some add that Christians have no standing here, given William Miller in 1844 and a long line of Christian date-setters since, and that a failed prediction by a teacher does not falsify the underlying identity claim any more than Miller falsified the resurrection. Others reframe the date as marking a spiritual transition or an intensification of judgment rather than a visible return.","responseSource":{"name":"Contemporary ISUPK and IUIC distancing from the ICGJC lineage; general camp responses to the date-setting charge"},"verdict":"admitted","rationale":"Graded admitted because the prediction, the failure, the rebrand and the succession are all documented in the movement's own institutional record. But grade the scope conservatively and say so on the page: this binds the ICGJC lineage, and today's ISUPK or IUIC member can fairly say it was not his camp. The tu quoque about Miller is also fair, and Christians should own their own date-setters rather than dodge. What remains after both concessions is still substantial. Deuteronomy 18:22 is a standard the movement applies to others, the response to failure was not repentance but a rebrand and a leader claiming to be the Holy Spirit, and the same lineage produced the doctrinal apparatus the street camps still teach.","severity":"high","context":"Movements that predict dates leave a public record, and this one did. A specific prediction attached to the year 2000 was taught, published, and then did not happen — followed by a rebranding and a leadership succession. All of it sits in the movement's own institutional record rather than in a critic's account, which is why this case can be argued entirely from their side of the table. Deuteronomy 18:22 supplies the test, and it is the same test applied to every other movement on this site.","quran":[],"hadith":[]},
{"id":"ben-ammi-dimona-community","title":"Ben Ammi, Dimona, and the peaceful strand","category":"movement-history","claim":"Say this clearly before anything else: the African Hebrew Israelites of Jerusalem are not a street camp and must never be described as one. Ben Ammi Carter, a Chicago metallurgist, reported a vision in 1966 calling him to lead African Americans to the promised land. Families arrived in Liberia from July 1967 and endured roughly two and a half years of hardship, disease and attrition. In 1970 forty-eight families entered Israel claiming the Law of Return; recognized as non-Jews by Israeli authorities, many faced deportation, and the community settled in Dimona. They received permanent residency in 1990, later a path to citizenship, and Ben Ammi himself became a citizen in 2013. Today roughly two to three thousand live in Dimona, Arad and Mitzpe Ramon, practicing veganism, communal economics and a Hebrew calendar, with members serving in the IDF and one representing Israel at Eurovision. Ben Ammi taught that physical immortality was humanity's intended state. He died in December 2014 at seventy-five, survived by four wives and more than twenty children.","bible":["Genesis 2:17","Genesis 3:19","Romans 5:12","Hebrews 9:27","1 Corinthians 15:20-26","1 Corinthians 15:53-57","Deuteronomy 18:22","2 Timothy 1:10","Revelation 21:4"],"sources":[{"name":"African Hebrew Israelites of Jerusalem (Critical Dictionary of Apocalyptic and Millenarian Movements)","type":"scholarly","url":"https://www.cdamm.org/articles/ahij"},{"name":"African Hebrew Israelites of Jerusalem (World Religions and Spirituality Project)","type":"scholarly","url":"https://wrldrels.org/2023/01/06/african-hebrew-israelites-of-jerusalem/"},{"name":"African Hebrew Israelites of Jerusalem, official site","type":"primary","url":"https://africanhebrewisraelitesofjerusalem.com/"},{"name":"Spiritual Leader of the African Hebrew Israelites Dies (JTA)","type":"journalism","url":"https://www.jta.org/2014/12/29/israel/spiritual-leader-of-the-african-hebrew-israelites-dies-1"},{"name":"At Memorial for African Hebrew Leader, Signs of Integration and Respect (Times of Israel)","type":"journalism","url":"https://www.timesofisrael.com/at-memorial-for-african-hebrew-leader-signs-of-integration-and-respect/"}],"response":"The community frames its history as vindication by endurance. They left everything, survived Liberia, arrived without status, were threatened with deportation, and built a functioning society that Israel eventually recognized and that now sends its sons to the army. That is not the trajectory of a hate group and not the trajectory of a fraud. On Ben Ammi's death, members have adjusted rather than abandoned: immortality is the end goal of a regenerating people, reached progressively as lifespans extend in the messianic age, not a guarantee for any individual in the present generation. They point to their own health outcomes, their vegan practice traced to Genesis 1:29, and to decades of communal stability as evidence that the way of life produces what it promises, whatever timeline the founder's own body kept.","responseSource":{"name":"AHIJ official teaching and post-2014 community statements; Ben Ammi's published writings on regeneration and immortality"},"verdict":"answered","rationale":"The historical facts here are admitted on all sides; what is examined is the doctrine. Ben Ammi's immortality teaching was a falsifiable claim about the natural state of a regenerated humanity, and its author died at seventy-five. The softening to an end goal is a real theological move but it is a retreat, and Scripture already teaches that death is an enemy destroyed by resurrection rather than by diet (1 Cor 15:20-26, 53-57). Two things must be said alongside this. First, the underlying identity claim rests on the same unsupported foundation as the street camps' and fails for the same reasons. Second, and just as important for this section, nothing about this community warrants the tone appropriate to a confrontational camp. They are peaceable neighbors, and conflating them with 1West rhetoric is both false and a good way to lose every hearing worth having.","severity":"medium","context":"In 1966 a Chicago metalworker named Ben Carter said he received a vision instructing him to lead Black Americans back to Israel. He took the name Ben Ammi, led a group first to Liberia in 1967 and then to Dimona in Israel's Negev desert in 1969, and built a communal, vegan, deliberately peaceable settlement that still exists. It is nothing like the street camps in the viral videos. It also carried a falsifiable teaching — that a regenerated humanity would not die — and Ben Ammi died in 2014.","quran":[],"hadith":[]},
{"id":"splc-hate-designation","title":"The hate-group designation, handled honestly","category":"movement-history","claim":"The Southern Poverty Law Center maintains an extremist file on Radical Hebrew Israelites, naming Great Millstone, the Israelite School of Universal Practical Knowledge and Israel United in Christ as the largest and most active listed groups. Read the caveats, because SPLC states them itself: it no longer refers to these groups simply as Black Hebrew Israelites, both because the camps include Latino and Indigenous members and because non-radical Hebrew Israelite sects exist that it does not designate. The ADL similarly names extremist sects rather than the movement as a whole. On specific incidents, be precise. In the December 2019 Jersey City attack on a kosher market, the New Jersey Attorney General cited the shooters' hatred of Jewish people and law enforcement and their interest in Black Hebrew Israelite ideology, while authorities did not establish formal membership in any organization. The ADL's 2022 audit attributed eight antisemitic harassment or propaganda incidents to extremist BHI groups, including an IUIC demonstration outside Barclays Center.","bible":["Ephesians 4:29-32","James 3:5-10","Proverbs 18:17","Matthew 7:1-5","Romans 12:17-21","1 Peter 3:15-16","Titus 3:2","Colossians 4:6"],"sources":[{"name":"Radical Hebrew Israelites (SPLC Extremist Files)","type":"institutional","url":"https://www.splcenter.org/resources/extremist-files/radical-hebrew-israelites/"},{"name":"Extremist Sects Within the Black Hebrew Israelite Movement (ADL)","type":"institutional","url":"https://www.adl.org/resources/backgrounder/extremist-sects-within-black-hebrew-israelite-movement"},{"name":"2019 Jersey City shooting","type":"journalism","url":"https://en.wikipedia.org/wiki/2019_Jersey_City_shooting"},{"name":"Jersey City Shooters Fueled by Hatred of Jewish People and Law Enforcement (CNN)","type":"journalism","url":"https://www.cnn.com/2019/12/12/us/jersey-city-new-jersey-shooting-thursday"},{"name":"ADL Audit of Antisemitic Incidents 2022","type":"institutional","url":"https://www.adl.org/resources/report/audit-antisemitic-incidents-2022"}],"response":"The camps reject the designation as a political weapon. SPLC, they argue, is an organization with its own funding incentives and a record of contested listings, and applying the hate-group label to Black religious movements while treating comparable rhetoric elsewhere as ordinary politics is exactly the double standard they preach about. They note that their members are overwhelmingly non-violent, that the camps run drug-recovery, marriage and financial-discipline programs in neighborhoods nobody else serves, and that street preaching that offends is still speech. On Jersey City they point out, correctly, that no organizational link was established. Being loud and being unpopular, they argue, is not the same as being a threat, and the label is used to keep people from ever hearing what is actually said.","responseSource":{"name":"ISUPK and IUIC public responses to the SPLC listing; camp statements on community programs and speech"},"verdict":"contested","rationale":"Graded contested on purpose, because both sides hold something true and the site should model that. The camps are right that a listing is not a refutation, that most members are not violent, that the Jersey City attackers were not shown to belong to any organization, and that community work happens. Critics are right that the rhetoric ADL and SPLC document is real, quoted from public teaching, and that it has consequences. The methodological point matters more than the verdict: a hate-group designation cannot settle whether Deuteronomy 28 predicts the Middle Passage, and citing it as though it could is a way of avoiding the argument. Equally, calling SPLC biased does not unsay what was said on camera. Argue the claims, cite incidents precisely, and never let a label do the work of an answer.","severity":"medium","context":"The Southern Poverty Law Center is an American legal advocacy organization that publishes an annual list of hate groups. It lists several of the radical Israelite camps, and that listing is quoted constantly in arguments about the movement — in both directions. This case is graded contested on purpose, because both sides hold something true: an advocacy group's listing is not a refutation of a doctrine, and the doctrines it lists are nonetheless real and published.","quran":[],"hadith":[]},
{"id":"women-in-the-camps","title":"The subordination of women in the street camps","category":"practice","claim":"Street camps teach a strict gender hierarchy openly and on video: women covered, in skirts, addressing men as sir, silent in the assembly, and taught that insubordination is a covenant offense. Public shaming of women in trousers and of interracial couples is a documented street tactic, and the ADL records that extremist camps preach retribution against women of color deemed adulterous or insubordinate, alongside attacks on Black churches for giving women too much authority. Scripture is far less compliant than the practice assumes. Deborah judged Israel and led it into battle (Judg 4-5). Huldah the prophetess authenticated the rediscovered book of the law while Jeremiah was alive (2 Kgs 22:14-20). Priscilla, named first, took Apollos aside and expounded the way of God more perfectly (Acts 18:26). Phoebe is a deacon and patron (Rom 16:1-2). Women were the first witnesses of the resurrection in a culture that did not credit their testimony. Ephesians 5:25-29 defines headship as self-giving sacrifice, and 1 Peter 3:7 calls husband and wife heirs together of the grace of life.","bible":["Judges 4:4-9","2 Kings 22:14-20","Acts 18:26","Romans 16:1-2","Romans 16:3-7","Luke 24:1-11","Ephesians 5:25-29","1 Peter 3:7","Galatians 3:28","Proverbs 31:10-31","John 4:39"],"sources":[{"name":"Extremist Sects Within the Black Hebrew Israelite Movement (ADL)","type":"institutional","url":"https://www.adl.org/resources/backgrounder/extremist-sects-within-black-hebrew-israelite-movement"},{"name":"Radical Hebrew Israelites (SPLC Extremist Files)","type":"institutional","url":"https://www.splcenter.org/resources/extremist-files/radical-hebrew-israelites/"},{"name":"Do Israelite Men Hate Femininity? (The Hebrew Housewife)","type":"primary","url":"https://www.thehebrewhousewife.com/do-israelite-men-hate-femininity/"},{"name":"Zihiri, Comparing the Preaching Strategies of Black Hebrew Israelite Camps (UCLA)","type":"scholarly","url":"https://religion.ucla.edu/wp-content/uploads/2020/07/Saifeldeen-Zihiri-Ambassadors-of-Christ-and-Israel-United-in-Christ_-Comparing-the-Preaching-Strategies-of-Black-Hebrew-Israelite-Camps.pdf"},{"name":"About IUIC - Israel United in Christ","type":"primary","url":"https://israelunite.org/about-iuic-2/"}],"response":"Their defense is restorative rather than repressive in its own telling. Slavery and welfare policy, they argue, destroyed the Black family by removing the man from it, and the camps are rebuilding what was broken: men accountable, providing, and present; women honored and protected rather than left to carry a household alone. They cite Deuteronomy 22:5 on distinct dress, 1 Corinthians 11:3-10 on headship and covering, 1 Timothy 2:11-12 on women learning in silence, and Titus 2:4-5 on keepers at home, and note these are the plain words of the same Bible their critics claim. Women in the movement, some of whom write publicly, describe the structure as relief rather than oppression, and point to marriage rates and family stability in the camps against the surrounding statistics.","responseSource":{"name":"IUIC and ISUPK teaching on family order; women writing from inside the movement, e.g. The Hebrew Housewife"},"verdict":"admitted","rationale":"Graded admitted because the teaching is not alleged by opponents but published by the camps themselves, and because the diagnosis underneath it is partly correct: the destruction of Black family structure is real history and the desire to rebuild it is not contemptible. The proof texts are also real texts that Christians disagree about, so avoid pretending complementarian readings are self-evidently absurd. What cannot be defended is the distance between the texts cited and the practice observed. Nothing in 1 Corinthians 11 or Titus 2 authorizes shouting obscenities at women on a sidewalk, and the movement's own standard makes this measurable. Ephesians 5 makes headship cruciform, self-giving to the point of death, which is the exact inversion of dominance, and a structure that produces public humiliation of women has failed the text it invokes.","severity":"medium","context":"How a movement treats its women tells you a great deal about it, and the camps do not hide their teaching here — it is published rather than alleged. Women are subordinate, are covered, do not teach men, and in the stricter camps do not speak publicly at all. Underneath it is a diagnosis that is partly correct: the destruction of Black family structure under slavery and after it was real, and much of the movement's appeal is that it offers men a role. The question is whether the remedy matches Scripture.","quran":[],"hadith":[]},
{"id":"polygamy-in-the-movement","title":"Polygamy","category":"practice","claim":"Polygyny is practiced in parts of the movement. Ben Ammi, leader of the Dimona community, was survived by four wives and more than twenty children, and the practice is established there; some street camps also teach it as permissible or desirable, appealing to the patriarchs. The biblical case for it is thinner than the citations suggest. Scripture narrates polygamy without commending it, and every polygamous household it describes at length is a study in damage: Abraham, Sarah and Hagar (Gen 16, 21), Jacob's warring households (Gen 29-30), Elkanah's two wives with Hannah provoked year after year (1 Sam 1:6-7), and Solomon, whose many wives turned away his heart (1 Kgs 11:1-4). Deuteronomy 17:17 forbids the king to multiply wives. Jesus grounds marriage in creation, quoting Genesis 2:24 that the two, not the several, shall be one flesh (Matt 19:4-6). Paul assumes one wife per husband (1 Cor 7:2) and requires overseers and deacons to be the husband of one wife (1 Tim 3:2, 3:12, Titus 1:6).","bible":["Genesis 2:24","Matthew 19:4-6","Genesis 16:1-6","Genesis 29:30-31","1 Samuel 1:6-7","1 Kings 11:1-4","Deuteronomy 17:17","1 Corinthians 7:2-4","1 Timothy 3:2","1 Timothy 3:12","Titus 1:6","Malachi 2:14-15"],"sources":[{"name":"Ben Ammi Ben-Israel (survived by four wives and over twenty children)","type":"scholarly","url":"https://en.wikipedia.org/wiki/Ben_Ammi_Ben-Israel"},{"name":"African Hebrew Israelites of Jerusalem (World Religions and Spirituality Project)","type":"scholarly","url":"https://wrldrels.org/2023/01/06/african-hebrew-israelites-of-jerusalem/"},{"name":"African Hebrew Israelites of Jerusalem (Critical Dictionary of Apocalyptic and Millenarian Movements)","type":"scholarly","url":"https://www.cdamm.org/articles/ahij"},{"name":"Leader of African Hebrew Israelites Dies at 75 (Jerusalem Post)","type":"journalism","url":"https://www.jpost.com/israel-news/leader-of-african-hebrew-israelites-of-jerusalem-dies-385978"},{"name":"African Hebrew Israelites of Jerusalem, official site","type":"primary","url":"https://africanhebrewisraelitesofjerusalem.com/"}],"response":"The argument is that God never prohibited polygyny and in fact regulated it, which is not how Scripture treats sin. Exodus 21:10 and Deuteronomy 21:15-17 legislate the rights of multiple wives and their children, and 2 Samuel 12:8 has the prophet Nathan tell David that God gave him his master's wives and would have given more. Abraham, Jacob, Gideon, David and Solomon are patriarchs and kings, not villains, and the Messianic line runs directly through polygamous households. They argue that the one-wife norm is a Roman and European import that the church later read back into the text, and that in communities with a shortage of marriageable men it leaves women unprotected and children unfathered, which is the practical evil the arrangement exists to prevent.","responseSource":{"name":"AHIJ teaching and practice in Dimona; patriarchal-precedent arguments used in street camps"},"verdict":"admitted","rationale":"Graded admitted because the practice is openly acknowledged rather than alleged. The regulation argument is genuinely their best and deserves an answer rather than a scoff, since Scripture does legislate for polygamous households. But regulation of a fallen practice is not endorsement, which is exactly how Jesus handles the parallel case: Moses permitted divorce for hardness of heart, but from the beginning it was not so (Matt 19:8). He then goes behind all subsequent legislation to Genesis 2:24 and the two becoming one flesh. Deuteronomy 17:17 already restrains the practice in the one office where power made it easiest, the narratives portray it as uniformly corrosive, and the New Testament's leadership requirement of one wife would be incoherent as a qualification if plurality were simply good.","severity":"medium","context":"Several of the camps teach and practise polygamy, openly. Their argument is a serious one and deserves an answer rather than a scoff: the Hebrew Scriptures do legislate for multiple wives rather than forbidding them outright, and figures like Abraham, Jacob and David had them. So the disagreement is not about whether the Old Testament regulates the practice — it plainly does — but about what regulation means, and about what Jesus says when he is asked directly about marriage.","quran":[],"hadith":[]},
{"id":"precepts-method-epistemology","title":"The 'precept upon precept' method as a way of reading","category":"practice","claim":"The movement's hermeneutic is chain-referencing: verses from across the canon are strung together by shared words regardless of context, and the method is justified by Isaiah 28:10, 'For precept must be upon precept, precept upon precept; line upon line, line upon line; here a little, and there a little.' Read the passage. Isaiah 28:7-13 describes drunken priests and prophets who mock the prophet's preaching as baby-talk, and verse 10 is very plausibly their taunt quoted back, a nonsense jingle of Hebrew syllables, tsav latsav qav laqav. Verse 13 then turns the mockery into sentence: the word of the LORD will be to them exactly that, 'that they might go, and fall backward, and be broken, and snared, and taken.' A method that treats a mocker's taunt as a licence to read atomistically has adopted the practice the passage condemns. The apparatus around it compounds the problem: KJV-only insistence in a movement whose case depends on Hebrew, invented pronunciations without manuscript basis, and selective appeal to 2 Esdras, a book outside the canon they otherwise defend.","bible":["Isaiah 28:7-13","2 Peter 1:20-21","2 Peter 3:16","2 Timothy 2:15","Acts 17:11","Nehemiah 8:8","Luke 24:27","2 Corinthians 4:2"],"sources":[{"name":"Precept Upon Precept, Line Upon Line: the interpretive debate on Isaiah 28:10","type":"scholarly","url":"https://rsc.byu.edu/prophets-prophecies-old-testament/precept-upon-precept-line-upon-line"},{"name":"Isaiah 28:10 verse-by-verse commentary compilation","type":"apologetics","url":"https://www.studylight.org/commentary/isaiah/28-10.html"},{"name":"One West Camp (KJV-only, Lashawan Qadash, 12 Tribes Chart)","type":"scholarly","url":"https://en.wikipedia.org/wiki/One_West_Camp"},{"name":"The Israelite School of Universal Practical Knowledge","type":"primary","url":"https://isupk.com/about.html"},{"name":"Black Hebrew Israelism: A Refutation Guide for Christians","type":"apologetics","url":"https://thegoodnewsapologetics.wordpress.com/2018/01/04/black-hebrew-israelism-a-refutation-guide-for-christians/"}],"response":"Their defense is that Scripture interprets Scripture and that the objection is really a guild protecting itself. Comparing spiritual things with spiritual is Paul's own instruction (1 Cor 2:13); the Bereans searched the scriptures daily (Acts 17:11); Jesus expounded Himself from Moses and all the prophets across the whole canon (Luke 24:27); and prophecy is not of any private interpretation (2 Pet 1:20). Demanding seminary training, Greek and Hebrew and approved commentaries before a man may read his own Bible is, they argue, exactly the gatekeeping that kept enslaved people from the text in the first place, and it is being deployed again the moment ordinary people reach conclusions the institution dislikes. They also note, with some justice, that their opponents chain verses too and only call it systematic theology.","responseSource":{"name":"1West-lineage teaching on precepts; ISUPK and IUIC lecture method and defenses of lay reading"},"verdict":"unrefuted","rationale":"Graded unrefuted because the specific objection, that Isaiah 28:10 is a mocker's taunt turned into judgment in verse 13, is not addressed in camp materials at all. Concede the class argument first and mean it: gatekeeping Scripture from ordinary readers is a real historical sin, and no one needs Greek to be saved. But the translation debate over tsav latsav qav laqav is a mainstream scholarly discussion, not an elite invention, and even readings that take verse 10 as ordinary teaching make it a description of patient instruction rather than a warrant for atomizing the text. The internal inconsistencies are the sharpest point: a movement that stakes everything on Hebrew identity binds itself to a seventeenth-century English translation, invents pronunciations with no manuscript support, and quotes a book it does not accept as canon.","severity":"high","context":"This case is about *how* the camps read, which matters more than any single verse they read. The method is called 'precept upon precept,' taken from Isaiah 28:10, and it means building a teaching by chaining together single lines from all over the Bible. It produces conclusions no chapter says on its own, and it is close to unanswerable if you argue verse by verse — which is why the response here is to read whole chapters instead. Isaiah 28 itself repays that treatment: read three verses further and the phrase turns out to be doing the opposite of what it is used for.","quran":[],"hadith":[]},
{"id":"avoid-jesus-skin-color-hill","title":"DON'T USE: making Jesus's skin color the argument","category":"identity-claims","claim":"Do not build a case around disputing that Jesus was dark-skinned, and do not let the conversation become a debate about his complexion. The temptation is to treat Revelation 1:14-15 as a claim to be crushed and then to overcorrect into defending a Christ who looks like a European painting. Concede immediately and without qualification: Jesus was a first-century Judean, brown-skinned and Middle Eastern; the blond, blue-eyed Jesus of Western art is a cultural artifact with no scriptural warrant; and that image was preached to enslaved people by their enslavers, which was not neutral. Isaiah 53:2 says there was no beauty in him that we should desire him. Give all of this away in the first sentence, because it is true and because it is not the disputed question. The disputed question is whether any modern population is Israel and what makes a person a child of God, and no fact about complexion answers either.","bible":["Isaiah 53:2","1 Samuel 16:7","Revelation 1:14-16","Daniel 7:9","John 4:22","Galatians 3:28","Acts 10:34-35","2 Corinthians 5:16"],"sources":[{"name":"Who Are the Hebrew Israelites and What Do They Believe? (Jude 3 Project)","type":"apologetics","url":"https://jude3project.org/blog/2016/4/29/kzqeier0z8b1u1uk5lf186jhu5s8r5"},{"name":"Michael Brown, Was Esau-Edom White? (Religion Unplugged)","type":"apologetics","url":"https://religionunplugged.com/news/2023/3/28/was-esau-edom-white-demolishing-hebrew-israelite-lies-part-1"},{"name":"Two Hebrew Israelite Biblical Verses Examined (Times of Israel blogs)","type":"journalism","url":"https://blogs.timesofisrael.com/two-hebrew-israelite-biblical-verses-examined/"}],"response":"Not applicable. This entry marks an argument to avoid rather than a claim to answer.","responseSource":{"name":"Editorial guidance"},"verdict":"answered","rationale":"Avoid because the argument is unwinnable in the only sense that matters. Defending a light-skinned Jesus makes the Christian look exactly like the caricature the movement preaches about, and disputing a dark-skinned Jesus means defending a position with no evidence and no stake. Meanwhile the concession is free and disarming: agreeing enthusiastically that Western art lied costs nothing and buys a hearing. The substantive case is elsewhere entirely, in what the New Testament says makes someone Abraham's offspring. Handle the exegesis of Revelation 1 in its own case, where the Daniel 7 and 10 background can be laid out calmly, and never let it become the headline.","severity":"medium","avoid":true,"context":"At some point in almost every street exchange, the subject turns to what Jesus looked like. It is a trap for the Christian in both directions. The historical Jesus was a first-century Judean and did not look like a northern European painting — that much is simply true, and defending the painting makes you into exactly the caricature the movement preaches about. It is also not the question that decides anything.","quran":[],"hadith":[]},
{"id":"avoid-blanket-hate-group-label","title":"DON'T USE: 'they are all violent hate groups'","category":"movement-history","claim":"Do not treat Hebrew Israelite identity as synonymous with the confrontational street camps. The spectrum is real and documented. The Church of God and Saints of Christ has existed since 1896 as an ordinary congregational body. The Commandment Keepers in Harlem operated as a synagogue with an ordained rabbinate. The African Hebrew Israelites in Dimona are a peaceable community of two to three thousand whose members serve in the IDF. SPLC itself designates specific organizations, explicitly declines to designate the faith as such, notes that listed camps include Latino and Indigenous members, and acknowledges non-radical sects. Most people who hold Hebrew Israelite beliefs have never shouted at anyone on a sidewalk; many encountered the teaching through a relative or a video and are working through it privately. A page that opens by calling them a hate group has ended the conversation with everyone it most wanted to reach, and has also said something false.","bible":["Proverbs 18:13","Proverbs 18:17","James 1:19","Titus 3:2","1 Peter 3:15-16","Colossians 4:6","Matthew 7:1-5","Ephesians 4:15"],"sources":[{"name":"Radical Hebrew Israelites (SPLC Extremist Files, including its own scope caveats)","type":"institutional","url":"https://www.splcenter.org/resources/extremist-files/radical-hebrew-israelites/"},{"name":"African Hebrew Israelites of Jerusalem (Critical Dictionary of Apocalyptic and Millenarian Movements)","type":"scholarly","url":"https://www.cdamm.org/articles/ahij"},{"name":"Commandment Keepers Ethiopian Hebrew Congregation","type":"institutional","url":"https://www.commandmentkeepersehc.com/about-us"}],"response":"Not applicable. This entry marks an argument to avoid rather than a claim to answer.","responseSource":{"name":"Editorial guidance"},"verdict":"answered","rationale":"Avoid because it is factually wrong and rhetorically fatal at the same time, which is a rare combination. The movement spans a peaceable Israeli farming community, century-old congregations, quiet individual believers, and a set of confrontational camps that genuinely do preach what the ADL and SPLC document. Collapsing that range hands every reader an easy dismissal, since anyone who knows a Hebrew Israitelite personally will recognize the description as false and stop reading. Name specific organizations and quote specific teaching where the criticism applies, and say plainly that it does not apply to others. Precision here is not softness; it is the only thing that makes the criticism credible where it is deserved.","severity":"high","avoid":true,"context":"The most common Christian response to this movement is to reach for the phrase 'hate group' and stop there. This case is about why that fails — not as a matter of politeness, but as a matter of fact. The movement spans a 130-year-old denomination, a peaceable farming community in Israel, quiet independent congregations, and the confrontational street camps, and they are frequently at war with each other. A claim that covers all of them at once is false about most of them.","quran":[],"hadith":[]},
{"id":"avoid-viral-media-frames","title":"DON'T USE: viral confrontation clips and culture-war media frames","category":"movement-history","claim":"Do not build the section on viral video moments, the 2019 Lincoln Memorial confrontation and its media cycle, or adjacent culture-war flashpoints where Hebrew Israelites appeared as characters in someone else's story. Those episodes are contested in their details, were reported and re-reported through partisan frames, generated litigation and retractions, and are remembered by most readers as a fight about media bias rather than a question about Scripture. Using them signals that the section is an entry in a culture war rather than an examination of biblical claims, and it invites the reader to sort the page by tribe before reading a word. Where an incident genuinely bears on the topic, cite it soberly and precisely from primary or law-enforcement sources, as with the December 2019 Jersey City attack, where the New Jersey Attorney General described the shooters' hatred of Jews and police and their interest in the ideology, and authorities did not establish membership in any organization.","bible":["Proverbs 18:17","Exodus 23:1-2","Proverbs 14:15","1 Thessalonians 5:21","Philippians 4:8","Zechariah 8:16","Ephesians 4:25","2 Corinthians 4:2"],"sources":[{"name":"2019 Jersey City shooting (for the sober-citation contrast)","type":"journalism","url":"https://en.wikipedia.org/wiki/2019_Jersey_City_shooting"},{"name":"Jersey City Shooters Fueled by Hatred of Jewish People and Law Enforcement (CNN)","type":"journalism","url":"https://www.cnn.com/2019/12/12/us/jersey-city-new-jersey-shooting-thursday"},{"name":"Radical Hebrew Israelites (SPLC Extremist Files)","type":"institutional","url":"https://www.splcenter.org/resources/extremist-files/radical-hebrew-israelites/"}],"response":"Not applicable. This entry marks an argument to avoid rather than a claim to answer.","responseSource":{"name":"Editorial guidance"},"verdict":"answered","rationale":"Avoid because it trades a durable argument for a perishable one. Viral incidents age badly, their details get revised, and half of any audience has already assigned blame based on which outlet they read. The section's whole premise is that the Bible both sides accept is the standard, and that premise is abandoned the moment the argument runs through a news cycle. Every claim in this section can be examined from Scripture, from documented movement teaching, and from published research, none of which expires. When an incident is genuinely necessary, cite it with the same care used everywhere else, including the exculpatory details, which is exactly what makes the citation trustworthy.","severity":"medium","avoid":true,"context":"Most people's entire knowledge of Hebrew Israelites comes from a viral clip — a street confrontation, or a news cycle in which a violent incident was attributed to the identity. This case is about why building your argument on that material costs you. Viral incidents get re-cut and revised, half of any audience has already decided what to think based on which outlet they watch, and the person in front of you almost certainly knows details about the incident that you do not.","quran":[],"hadith":[]},
{"id":"avoid-dismissing-the-longing","title":"DON'T USE: dismissing the longing instead of answering it","category":"identity-claims","claim":"Do not treat the movement as merely a set of bad arguments to be dismantled while ignoring what drove people to it. The questions underneath are serious and Christian preaching has too often failed to answer them: who am I, where did my name and language go, why did God permit four hundred years of this, and does the God of the Bible see my people at all. Those are the questions of Psalm 44, Habakkuk 1 and half the Psalter, and Scripture never rebukes anyone for asking them. A page that refutes seventeen claims and never addresses the ache has won every exchange and lost the person. The Christian answer is not that identity does not matter. It is that the identity offered is greater than the one being claimed: adoption as sons and daughters, with the Spirit of adoption crying Abba Father, joint-heirs with Christ, a chosen generation, a people who were not a people but are now the people of God.","bible":["Romans 8:15-17","Galatians 4:4-7","Ephesians 1:4-6","1 Peter 2:9-10","Hosea 1:10","Hosea 2:23","Psalm 44:9-26","Habakkuk 1:2-4","Isaiah 43:1","Revelation 2:17","John 1:12","Isaiah 56:3-8"],"sources":[{"name":"Who Are the Hebrew Israelites and What Do They Believe? (Jude 3 Project)","type":"apologetics","url":"https://jude3project.org/blog/2016/4/29/kzqeier0z8b1u1uk5lf186jhu5s8r5"},{"name":"Overview of the Black Hebrew Israelites (Jude 3 Project)","type":"apologetics","url":"https://jude3project.org/blog/2016/2/3/overview-of-the-black-hebrew-israelites"},{"name":"History of Hebrew Israelism (SPLC Intelligence Report)","type":"institutional","url":"https://www.splcenter.org/resources/reports/history-hebrew-israelism/"}],"response":"Not applicable. This entry marks an argument to avoid rather than a claim to answer.","responseSource":{"name":"Editorial guidance"},"verdict":"answered","rationale":"Avoid dismissal because the longing is legitimate and the movement grew precisely where the church left a vacuum. People did not join because they found the 12 Tribes Chart academically compelling; they joined because someone finally told them their suffering had a place in God's story and that they were somebody. That is a real need and the gospel meets it more fully than the chart does. The pastoral move is to affirm the question, name the historical failure honestly, including churches that blessed slavery, and then show that adoption in Christ grants by grace what the genealogy cannot deliver even if it were true: a name given by God, an inheritance, and a Father. End the section here rather than on a refutation, because this is the only place the section is actually trying to get to.","severity":"high","avoid":true,"context":"This last one is not about a factual error but about a posture. People did not join this movement because a chart persuaded them academically. They joined because someone told them, often for the first time, that their history was in the Bible and that God had not forgotten what was done to their families — and because the church that could have said that was largely silent about slavery and in many cases blessed it. Whatever else is said, that hunger is legitimate, and treating it as ridiculous ends the conversation before it starts.","quran":[],"hadith":[]}
];
const VERSES={"Deuteronomy 28:68":{"ref":"Deuteronomy 28","cited":"68","verses":[{"v":65,"t":"And among these nations shalt thou find no ease, neither shall the sole of thy foot have rest: but the LORD shall give thee there a trembling heart, and failing of eyes, and sorrow of mind:"},{"v":66,"t":"And thy life shall hang in doubt before thee; and thou shalt fear day and night, and shalt have none assurance of thy life:"},{"v":67,"t":"In the morning thou shalt say, Would God it were even! and at even thou shalt say, Would God it were morning! for the fear of thine heart wherewith thou shalt fear, and for the sight of thine eyes which thou shalt see."},{"v":68,"t":"And the LORD shall bring thee into Egypt again with ships, by the way whereof I spake unto thee, Thou shalt see it no more again: and there ye shall be sold unto your enemies for bondmen and bondwomen, and no man shall buy you.","hl":1}]},"Deuteronomy 17:16":{"ref":"Deuteronomy 17","cited":"16","verses":[{"v":13,"t":"And all the people shall hear, and fear, and do no more presumptuously."},{"v":14,"t":"When thou art come unto the land which the LORD thy God giveth thee, and shalt possess it, and shalt dwell therein, and shalt say, I will set a king over me, like as all the nations that are about me;"},{"v":15,"t":"Thou shalt in any wise set him king over thee, whom the LORD thy God shall choose: one from among thy brethren shalt thou set king over thee: thou mayest not set a stranger over thee, which is not thy brother."},{"v":16,"t":"But he shall not multiply horses to himself, nor cause the people to return to Egypt, to the end that he should multiply horses: forasmuch as the LORD hath said unto you, Ye shall henceforth return no more that way.","hl":1},{"v":17,"t":"Neither shall he multiply wives to himself, that his heart turn not away: neither shall he greatly multiply to himself silver and gold."},{"v":18,"t":"And it shall be, when he sitteth upon the throne of his kingdom, that he shall write him a copy of this law in a book out of that which is before the priests the Levites:"},{"v":19,"t":"And it shall be with him, and he shall read therein all the days of his life: that he may learn to fear the LORD his God, to keep all the words of this law and these statutes, to do them:"}]},"Deuteronomy 29:1":{"ref":"Deuteronomy 29","cited":"1","verses":[{"v":1,"t":"These are the words of the covenant, which the LORD commanded Moses to make with the children of Israel in the land of Moab, beside the covenant which he made with them in Horeb.","hl":1},{"v":2,"t":"And Moses called unto all Israel, and said unto them, Ye have seen all that the LORD did before your eyes in the land of Egypt unto Pharaoh, and unto all his servants, and unto all his land;"},{"v":3,"t":"The great temptations which thine eyes have seen, the signs, and those great miracles:"},{"v":4,"t":"Yet the LORD hath not given you an heart to perceive, and eyes to see, and ears to hear, unto this day."}]},"Deuteronomy 30:1-10":{"ref":"Deuteronomy 30","cited":"1-10","verses":[{"v":1,"t":"And it shall come to pass, when all these things are come upon thee, the blessing and the curse, which I have set before thee, and thou shalt call them to mind among all the nations, whither the LORD thy God hath driven thee,","hl":1},{"v":2,"t":"And shalt return unto the LORD thy God, and shalt obey his voice according to all that I command thee this day, thou and thy children, with all thine heart, and with all thy soul;","hl":1},{"v":3,"t":"That then the LORD thy God will turn thy captivity, and have compassion upon thee, and will return and gather thee from all the nations, whither the LORD thy God hath scattered thee.","hl":1},{"v":4,"t":"If any of thine be driven out unto the outmost parts of heaven, from thence will the LORD thy God gather thee, and from thence will he fetch thee:","hl":1},{"v":5,"t":"And the LORD thy God will bring thee into the land which thy fathers possessed, and thou shalt possess it; and he will do thee good, and multiply thee above thy fathers.","hl":1},{"v":6,"t":"And the LORD thy God will circumcise thine heart, and the heart of thy seed, to love the LORD thy God with all thine heart, and with all thy soul, that thou mayest live.","hl":1},{"v":7,"t":"And the LORD thy God will put all these curses upon thine enemies, and on them that hate thee, which persecuted thee.","hl":1},{"v":8,"t":"And thou shalt return and obey the voice of the LORD, and do all his commandments which I command thee this day.","hl":1},{"v":9,"t":"And the LORD thy God will make thee plenteous in every work of thine hand, in the fruit of thy body, and in the fruit of thy cattle, and in the fruit of thy land, for good: for the LORD will again rejoice over thee for good, as he rejoiced over thy fathers:","hl":1},{"v":10,"t":"If thou shalt hearken unto the voice of the LORD thy God, to keep his commandments and his statutes which are written in this book of the law, and if thou turn unto the LORD thy God with all thine heart, and with all thy soul.","hl":1},{"v":11,"t":"For this commandment which I command thee this day, it is not hidden from thee, neither is it far off."},{"v":12,"t":"It is not in heaven, that thou shouldest say, Who shall go up for us to heaven, and bring it unto us, that we may hear it, and do it?"},{"v":13,"t":"Neither is it beyond the sea, that thou shouldest say, Who shall go over the sea for us, and bring it unto us, that we may hear it, and do it?"}]},"Jeremiah 43:5-7":{"ref":"Jeremiah 43","cited":"5-7","verses":[{"v":2,"t":"Then spake Azariah the son of Hoshaiah, and Johanan the son of Kareah, and all the proud men, saying unto Jeremiah, Thou speakest falsely: the LORD our God hath not sent thee to say, Go not into Egypt to sojourn there:"},{"v":3,"t":"But Baruch the son of Neriah setteth thee on against us, for to deliver us into the hand of the Chaldeans, that they might put us to death, and carry us away captives into Babylon."},{"v":4,"t":"So Johanan the son nced cities: but I will send a fire upon his cities, and it shall devour the palaces thereof."}]},"Hosea 9:3":{"ref":"Hosea 9","cited":"3","verses":[{"v":1,"t":"Rejoice not, O Israel, for joy, as other people: for thou hast gone a whoring from thy God, thou hast loved a reward upon every cornfloor."},{"v":2,"t":"The floor and the winepress shall not feed them, and the new wine shall fail in her."},{"v":3,"t":"They shall not dwell in the LORD's land; but Ephraim shall return to Egypt, and they shall eat unclean things in Assyria.","hl":1},{"v":4,"t":"They shall not offer wine offerings to the LORD, neither shall they be pleasing unto him: their sacrifices shall be unto them as the bread of mourners; all that eat thereof shall be polluted: for their bread for their soul shall not come into the house of the LORD."},{"v":5,"t":"What will ye do in the solemn day, and in the day of the feast of the LORD?"},{"v":6,"t":"For, lo, they are gone because of destruction: Egypt shall gather them up, Memphis shall bury them: the pleasant places for their silver, nettles shall possess them: thorns shall be in their tabernacles."}]},"Nehemiah 1:8-9":{"ref":"Nehemiah 1","cited":"8-9","verses":[{"v":5,"t":"And said, I beseech thee, O LORD God of heaven, the great and terrible God, that keepeth covenant and mercy for them that love him and observe his commandments:"},{"v":6,"t":"Let thine ear now be attentive, and thine eyes open, that thou mayest hear the prayer of thy servant, which I pray before thee now, day and night, for the children of Israel thy servants, and confess the sins of the children of Israel, which we have sinned against thee: both I and my father's house have sinned."},{"v":7,"t":"We have dealt very corruptly against thee, and have not kept the commandments, nor the statutes, nor the judgments, which thou commandedst thy servant Moses."},{"v":8,"t":"Remember, I beseech thee, the word that thou commandedst thy servant Moses, saying, If ye transgress, I will scatter you abroad among the nations:","hl":1},{"v":9,"t":"But if ye turn unto me, and keep my commandments, and do them; though there were of you cast out unto the uttermost part of the heaven, yet will I gather them from thence, and will bring them unto the place that I have chosen to set my name there.","hl":1},{"v":10,"t":"Now these are thy servants and thy people, whom thou hast redeemed by thy great power, and by thy strong hand."},{"v":11,"t":"O Lord, I beseech thee, let now thine ear be attentive to the prayer of thy servant, and to the prayer of thy servants, who desire to fear thy name: and prosper, I pray thee, thy servant this day, and grant him mercy in the sight of this man. For I was the king's cupbearer."}]},"Daniel 9:11-13":{"ref":"Daniel 9","cited":"11-13","verses":[{"v":8,"t":"O Lord, to us belongeth confusion of face, to our kings, to our princes, and to our fathers, because we have sinned against thee."},{"v":9,"t":"To the Lord our God belong mercies and forgivenesses, though we have rebelled against him;"},{"v":10,"t":"Neither have we obeyed the voice of the LORD our God, to walk in his laws, which he set before us by his servants the prophets."},{"v":11,"t":"Yea, all Israel have transgressed thy law, even by departing, that they might not obey thy voice; therefore the curse is poured upon us, and the oath that is written in the law of Moses the servant of God, because we have sinned against him.","hl":1},{"v":12,"t":"And he hath confirmed his words, which he spake against us, and against our judges that judged us, by bringing upon us a great evil: for under the whole heaven hath not been done as hath been done upon Jerusalem.","hl":1},{"v":13,"t":"As it is written in the law of Moses, all this evil is come upon us: yet made we not our prayer before the LORD our God, that we might turn from our iniquities, and understand thy truth.","hl":1},{"v":14,"t":"Therefore hath the LORD watched upon the evil, and brought it upon us: for the LORD our God is righteous in all his works which he doeth: for we obeyed not his voice."},{"v":15,"t":"And now, O Lord our God, that hast brought thy people forth out of the land of Egypt with a mighty hand, and hast gotten thee renown, as at this day; we have sinned, we have done wickedly."},{"v":16,"t":"O Lord, according to all thy righteousness, I beseech thee, let thine anger and thy fury be turned away from thy city Jerusalem, thy holy mountain: because for our sins, and for the iniquities of our fathers, Jerusalem and thy people are become a reproach to all that are about us."}]},"Galatians 3:13":{"ref":"Galatians 3","cited":"13","verses":[{"v":10,"t":"For as many as are of the works of the law are under the curse: for it is written, Cursed is every one that continueth not in all things which are written in the book of the law to do them."},{"v":11,"t":"But that no man is justified by the law in the sight of God, it is evident: for, The just shall live by faith."},{"v":12,"t":"And the law is not of faith: but, The man that doeth them shall live in them."},{"v":13,"t":"Christ hath redeemed us from the curse of the law, being made a curse for us: for it is written, Cursed is every one that hangeth on a tree:","hl":1},{"v":14,"t":"That the blessing of Abraham might come on the Gentiles through Jesus Christ; that we might receive the promise of the Spirit through faith."},{"v":15,"t":"Brethren, I speak after the manner of men; Though it be but a man's covenant, yet if it be confirmed, no man disannulleth, or addeth thereto."},{"v":16,"t":"Now to Abraham and his seed were the promises made. He saith not, And to seeds, as of many; but as of one, And to thy seed, which is Christ."}]},"2 Chronicles 36:15-21":{"ref":"2 Chronicles 36","cited":"15-21","verses":[{"v":12,"t":"And he did that which was evil in the sight of the LORD his God, and humbled not himself before Jeremiah the prophet speaking from the mouth of the LORD."},{"v":13,"t":"And he also rebelled against king Nebuchadnezzar, who had made him swear by God: but he stiffened his neck, and hardened his heart from turning unto the LORD God of Israel."},{"v":14,"t":"Moreover all the chief of the priests, and the people, transgressed very much after all the abominations of the heathen; and polluted the house of the LORD which he had hallowed in Jerusalem."},{"v":15,"t":"And the LORD God of their fathers sent to them by his messengers, rising up betimes, and sending; because he had compassion on his people, and on his dwelling place:","hl":1},{"v":16,"t":"But they mocked the messengers of God, and despised his words, and misused his prophets, until the wrath of the LORD arose against his people, till there was no remedy.","hl":1},{"v":17,"t":"Therefore he brought upon them the king of the Chaldees, who slew their young men with the sword in the house of their sanctuary, and had no compassion upon young man or maiden, old man, or him that stooped for age: he gave them all into his hand.","hl":1},{"v":18,"t":"And all the vessels of the house of God, great and small, and the treasures of the house of the LORD, and the treasures of the king, and of his princes; all these he brought to Babylon.","hl":1},{"v":19,"t":"And they burnt the house of God, and brake down the wall of Jerusalem, and burnt all the palaces thereof with fire, and destroyed all the goodly vessels thereof.","hl":1},{"v":20,"t":"And them that had escaped from the sword carried he away to Babylon; where they were servants to him and his sons until the reign of the kingdom of Persia:","hl":1},{"v":21,"t":"To fulfil the word of the LORD by the mouth of Jeremiah, until the land had enjoyed her sabbaths: for as long as she lay desolate she kept sabbath, to fulfil threescore and ten years.","hl":1},{"v":22,"t":"Now in the first year of Cyrus king of Persia, that the word of the LORD spoken by the mouth of Jeremiah might be accomplished, the LORD stirred up the spirit of Cyrus king of Persia, that he made a proclamation throughout all his kingdom, and put it also in writing, saying,"},{"v":23,"t":"Thus saith Cyrus king of Persia, All the kingdoms of the earth hath the LORD God of heaven given me; and he hath charged me to build him an house in Jerusalem, which is in Judah. Who is there among you of all his people? The LORD his God be with him, and let him go up."}]},"Nehemiah 9:32-37":{"ref":"Nehemiah 9","cited":"32-37","verses":[{"v":29,"t":"And testifiedst against them, that thou mightest bring them again unto thy law: yet they dealt proudly, and hearkened not unto thy commandments, but sinned against thy judgments, (which if a man do, he shall live in them;) and withdrew the shoulder, and hardened their neck, and would not hear."},{"v":30,"t":"Yet many years didst thou forbear them, and testifiedst against them by thy spirit in thy prophets: yet would they not give ear: therefore gavest thou them into the hand of the people of the lands."},{"v":31,"t":"Nevertheless for thy great mercies' sake thou didst not utterly consume them, nor forsake them; for thou art a gracious and merciful God."},{"v":32,"t":"Now therefore, our God, the great, the mighty, and the terrible God, who keepest covenant and mercy, let not all the trouble seem little before thee, that hath come upon us, on our kings, on our princes, and on our priests, and on our prophets, and on our fathers, and on all thy people, since the time of the kings of Assyria unto this day.","hl":1},{"v":33,"t":"Howbeit thou art just in all that is brought upon us; for thou hast done right, but we have done wickedly:","hl":1},{"v":34,"t":"Neither have our kings, our princes, our priests, nor our fathers, kept thy law, nor hearkened unto thy commandments and thy testimonies, wherewith thou didst testify against them.","hl":1},{"v":35,"t":"For they have not served thee in their kingdom, and in thy great goodness that thou gavest them, and in the large and fat land which thou gavest before them, neither turned they from their wicked works.","hl":1},{"v":36,"t":"Behold, we are servants this day, and for the land that thou gavest unto our fathers to eat the fruit thereof and the good thereof, behold, we are servants in it:","hl":1},{"v":37,"t":"And it yieldeth much increase unto the kings whom thou hast set over us because of our sins: also they have dominion over our bodies, and over our cattle, at their pleasure, and we are in great distress.","hl":1},{"v":38,"t":"And because of all this we make a sure covenant, and write it; and our princes, Levites, and priests, seal unto it."}]},"Ezra 2:1-2":{"ref":"Ezra 2","cited":"1-2","verses":[{"v":1,"t":"Now these are the children of the province that went up out of the captivity, of those which had been carried away, whom Nebuchadnezzar the king of Babylon had carried away unto Babylon, and came again unto Jerusalem and Judah, every one unto his city;","hl":1},{"v":2,"t":"Which came with Zerubbabel: Jeshua, Nehemiah, Seraiah, Reelaiah, Mordecai, Bilshan, Mispar, Bigvai, Rehum, Baanah. The number of the men of the people of Israel:","hl":1},{"v":3,"t":"The children of Parosh, two thousand an hundred seventy and two."},{"v":4,"t":"The children of Shephatiah, three hundred seventy and two."},{"v":5,"t":"The children of Arah, seven hundred seventy and five."}]},"Ezra 9:6-9":{"ref":"Ezra 9","cited":"6-9","verses":[{"v":3,"t":"And when I heard this thing, I rent my garment and my mantle, and plucked off the hair of my head and of my beard, and sat down astonied."},{"v":4,"t":"Then were assembled unto me every one that trembled at the words of the God of Israel, because of the transgression of those that had been carried away; and I sat astonied until the evening sacrifice."},{"v":5,"t":"And at the evening sacrifice I arose up from my heaviness; and having rent my garment and my mantle, I fell upon my knees, and spread out my hands unto the LORD my God,"},{"v":6,"t":"And said, O my God, I am ashamed and blush to lift up my face to thee, my God: for our iniquities are increased over our head, and our trespass is grown up unto the heavens.","hl":1},{"v":7,"t":"Since the days of our fathers have we been in a great trespass unto this day; and for our iniquities have we, our kings, and our priests, been delivered into the hand of the kings of the lands, to the sword, to captivity, and to a spoil, and to confusion of face, as it is this day.","hl":1},{"v":8,"t":"And now for a little space grace hath been shewed from the LORD our God, to leave us a remnant to escape, and to give us a nail in his holy place, that our God may lighten our eyes, and give us a little reviving in our bondage.","hl":1},{"v":9,"t":"For we were bondmen; yet our God hath not forsaken us in our bondage, but hath extended mercy unto us in the sight of the kings of Persia, to give us a reviving, to set up the house of our God, and to repair the desolations thereof, and to give us a wall in Judah and in Jerusalem.","hl":1},{"v":10,"t":"And now, O our God, what shall we say after this? for we have forsaken thy commandments,"},{"v":11,"t":"Which thou hast commanded by thy servants the prophets, saying, The land, unto which ye go to possess it, is an unclean land with the filthiness of the people of the lands, with their abominations, which have filled it from one end to another with their uncleanness."},{"v":12,"t":"Now therefore give not your daughters unto their sons, neither take their daughters unto your sons, nor seek their peace or their wealth for ever: that ye may be strong, and eat the good of the land, and leave it for an inheritance to your children for ever."}]},"Lamentations 4:10":{"ref":"Lamentations 4","cited":"10","verses":[{"v":7,"t":"Her Nazarites were purer than snow, they were whiter than milk, they were more ruddy in body than rubies, their polishing was of sapphire:"},{"v":8,"t":"Their visage is blacker than a coal; they are not known in the streets: their skin cleaveth to their bones; it is withered, it is become like a stick."},{"v":9,"t":"They that be slain with the sword are better than they that be slain with hunger: for these pine away, stricken through for want of the fruits of the field."},{"v":10,"t":"The hands of the pitiful women have sodden their own children: they were their meat in the destruction of the daughter of my people.","hl":1},{"v":11,"t":"The LORD hath accomplished his fury; he hath poured out his fierce anger, and hath kindled a fire in Zion, and it hath devoured the foundations thereof."},{"v":12,"t":"The kings of the earth, and all the inhabitants of the world, would not have believed that the adversary and the enemy should have entered into the gates of Jerusalem."},{"v":13,"t":"For the sins of her prophets, and the iniquities of her priests, that have shed the blood of the just in the midst of her,"}]},"Leviticus 26:40-45":{"ref":"Leviticus 26","cited":"40-45","verses":[{"v":37,"t":"And they shall fall one upon another, as it were before a sword, when none pursueth: and ye shall have no power to stand before your enemies."},{"v":38,"t":"And ye shall perish among the heathen, and the land of your enemies shall eat you up."},{"v":39,"t":"And they that are left of you shall pine away in their iniquity in your enemies' lands; and also in the iniquities of their fathers shall they pine away with them."},{"v":40,"t":"If they shall confess their iniquity, and the iniquity of their fathers, with their trespass which they trespassed against me, and that also they have walked contrary unto me;","hl":1},{"v":41,"t":"And that I also have walked contrary unto them, and have brought them into the land of their enemies; if then their uncircumcised hearts be humbled, and they then accept of the punishment of their iniquity:","hl":1},{"v":42,"t":"Then will I remember my covenant with Jacob, and also my covenant with Isaac, and also my covenant with Abraham will I remember; and I will remember the land.","hl":1},{"v":43,"t":"The land also shall be left of them, and shall enjoy her sabbaths, while she lieth des iverance, and there shall be holiness; and the house of Jacob shall possess their possessions."}]},"Obadiah 1:18":{"ref":"Obadiah 1","cited":"18","verses":[{"v":15,"t":"For the day of the LORD is near upon all the heathen: as thou hast done, it shall be done unto thee: thy reward shall return upon thine own head."},{"v":16,"t":"For as ye have drunk upon my holy mountain, so shall all the heathen drink continually, yea, they shall drink, and they shall swallow down, and they shall be as though they had not been."},{"v":17,"t":"But upon mount Zion shall be deliverance, and there shall be holiness; and the house of Jacob shall possess their possessions."},{"v":18,"t":"And the house of Jacob shall be a fire, and the house of Joseph a flame, and the house of Esau for stubble, and they shall kindle in them, and devour them; and there shall not be any remaining of the house of Esau; for the LORD hath spoken it.","hl":1},{"v":19,"t":"And they of the south shall possess the mount of Esau; and they of the plain the Philistines: and they shall possess the fields of Ephraim, and the fields of Samaria: and Benjamin shall possess Gilead."},{"v":20,"t":"And the captivity of this host of the children of Israel shall possess that of the Canaanites, even unto Zarephath; and the captivity of Jerusalem, which is in Sepharad, shall possess the cities of the south."},{"v":21,"t":"And saviours shall come up on mount Zion to judge the mount of Esau; and the kingdom shall be the LORD's."}]},"Malachi 1:2-3":{"ref":"Malachi 1","cited":"2-3","verses":[{"v":1,"t":"The burden of the word of the LORD to Israel by Malachi."},{"v":2,"t":"I have loved you, saith the LORD. Yet ye say, Wherein hast thou loved us? Was not Esau Jacob's brother? saith the LORD: yet I loved Jacob,","hl":1},{"v":3,"t":"And I hated Esau, and laid his mountains and his heritage waste for the dragons of the wilderness.","hl":1},{"v":4,"t":"Whereas Edom saith, We are impoverished, but we will return and build the desolate plac y; for she crieth after us.","hl":1},{"v":24,"t":"But he answered and said, I am not sent but unto the lost sheep of the house of Israel.","hl":1},{"v":25,"t":"Then came she and worshipped him, saying, Lord, help me.","hl":1},{"v":26,"t":"But he answered and said, It is not meet to take the children's bread, and to cast it to dogs.","hl":1},{"v":27,"t":"And she said, Truth, Lord: yet the dogs eat of the crumbs which fall from their masters' table.","hl":1},{"v":28,"t":"Then Jesus answered and said unto her, O woman, great is thy faith: be it unto thee even as thou wilt. And her daughter was made whole from that very hour.","hl":1},{"v":29,"t":"And Jesus departed from thence, and came nigh unto the sea of Galilee; and went up into a mountain, and sat down there."},{"v":30,"t":"And great multitudes came unto him, having with them those that were lame, blind, dumb, maimed, and many others, and cast them down at Jesus' feet; and he healed them:"},{"v":31,"t":"Insomuch that the multitude wondered, when they saw the dumb to speak, the maimed to be whole, the lame to walk, and the blind to see: and they glorified the God of Israel."}]},"Acts 10:34-35":{"ref":"Acts 10","cited":"34-35","verses":[{"v":31,"t":"And said, Cornelius, thy prayer is heard, and thine alms are had in remembrance in the sight of God."},{"v":32,"t":"Send therefore to Joppa, and call hither Simon, whose surname is Peter; he is lodged in the house of one Simon a tanner by the sea side: who, when he cometh, shall speak unto thee."},{"v":33,"t":"Immediately therefore I sent to thee; and thou hast well done that thou art come. Now therefore are we all here present before God, to hear all things that are commanded thee of God."},{"v":34,"t":"Then Peter opened his mouth, and said, Of a truth I perceive that God is no respecter of persons:","hl":1},{"v":35,"t":"But in every nation he that feareth him, and worketh righteousness, is accepted with him.","hl":1},{"v":36,"t":"The word which God sent unto the childr les and elders came together for to consider of this matter."},{"v":7,"t":"And when there had been much disputing, Peter rose up, and said unto them, Men and brethren, ye know how that a good while ago God made choice among us, that the Gentiles by my mouth should hear the word of the gospel, and believe.","hl":1},{"v":8,"t":"And God, which knoweth the hearts, bare them witness, giving them the Holy Ghost, even as he did unto us;","hl":1},{"v":9,"t":"And put no difference between us and them, purifying their hearts by faith.","hl":1},{"v":10,"t":"Now therefore why tempt ye God, to put a yoke upon the neck of the disciples, which neither our fathers nor we were able to bear?","hl":1},{"v":11,"t":"But we believe that through the grace of the Lord Jesus Christ we shall be saved, even as they.","hl":1},{"v":12,"t":"Then all the multitude kept silence, and gave audience to Barnabas and Paul, declaring what miracles and wonders God had wrought among the Gentiles by them."},{"v":13,"t":"And after they had held their peace, James answered, saying, Men and brethren, hearken unto me:"},{"v":14,"t":"Simeon hath declared how God at the first did visit the Gentiles, to take out of them a people for his name."}]},"Ephesians 2:11-19":{"ref":"Ephesians 2","cited":"11-19","verses":[{"v":8,"t":"For by grace are ye saved through faith; and that not of yourselves: it is the gift of God:"},{"v":9,"t":"Not of works, lest any man should boast."},{"v":10,"t":"For we are his workmanship, created in Christ Jesus unto good works, which God hath before ordained that we should walk in them."},{"v":11,"t":"Wherefore remember, that ye being in time past Gentiles in the flesh, who are called Uncircumcision by that which is called the Circumcision in the flesh made by hands;","hl":1},{"v":12,"t":"That at that time ye were without Christ, being aliens from the commonwealth of Israel, and strangers from the covenants of promise, having no hope, and without God in the world:","hl":1},{"v":13,"t":"But s by faith of Jesus Christ unto all and upon all them that believe: for there is no difference:","hl":1},{"v":23,"t":"For all have sinned, and come short of the glory of God;","hl":1},{"v":24,"t":"Being justified freely by his grace through the redemption that is in Christ Jesus:","hl":1},{"v":25,"t":"Whom God hath set forth to be a propitiation through faith in his blood, to declare his righteousness for the remission of sins that are past, through the forbearance of God;","hl":1},{"v":26,"t":"To declare, I say, at this time his righteousness: that he might be just, and the justifier of him which believeth in Jesus.","hl":1},{"v":27,"t":"Where is boasting then? It is excluded. By what law? of works? Nay: but by the law of faith.","hl":1},{"v":28,"t":"Therefore we conclude that a man is justified by faith without the deeds of the law.","hl":1},{"v":29,"t":"Is he the God of the Jews only? is he not also of the Gentiles? Yes, of the Gentiles also:"},{"v":30,"t":"Seeing it is one God, which shall justify the circumcision by faith, and uncircumcision through faith."},{"v":31,"t":"Do we then make void the law through faith? God forbid: yea, we establish the law."}]},"Galatians 2:16":{"ref":"Galatians 2","cited":"16","verses":[{"v":13,"t":"And the other Jews dissembled likewise with him; insomuch that Barnabas also was carried away with their dissimulation."},{"v":14,"t":"But when I saw that they walked not uprightly according to the truth of the gospel, I said unto Peter before them all, If thou, being a Jew, livest after the manner of Gentiles, and not as do the Jews, why compellest thou the Gentiles to live as do the Jews?"},{"v":15,"t":"We who are Jews by nature, and not sinners of the Gentiles,"},{"v":16,"t":"Knowing that a man is not justified by the works of the law, but by the faith of Jesus Christ, even we have believed in Jesus Christ, that we might be justified by the faith of Christ, and not by the works of the law: for by the works of the law shall no flesh be justified.","hl":1},{"v":17,"t":"But if, while we seek to be justified by Christ, we ourselves also are found sinners, is therefore Christ the minister of sin? God forbid."},{"v":18,"t":"For if I build again the things which I destroyed, I make myself a transgressor."},{"v":19,"t":"For I through the law am dead to the law, that I might live unto God."}]},"Galatians 3:10-13":{"ref":"Galatians 3","cited":"10-13","verses":[{"v":7,"t":"Know ye therefore that they which are of faith, the same are the children of Abraham."},{"v":8,"t":"And the scripture, foreseeing that God would justify the heathen through faith, preached before the gospel unto Abraham, saying, In thee shall all nations be blessed."},{"v":9,"t":"So then they which be of faith are blessed with faithful Abraham."},{"v":10,"t":"For as many as are of the works of the law are under the curse: for it is written, Cursed is every one that continueth not in all things which are written in the book of the law to do them.","hl":1},{"v":11,"t":"But that no man is justified by the law in the sight of God, it is evident: for, The just shall live by faith.","hl":1},{"v":12,"t":"And the law is not of faith: but, The man that doeth them shall live in them.","hl":1},{"v":13,"t":"Christ hath redeemed us from the curse of the law, being made a curse for us: for it is written, Cursed is every one that hangeth on a tree:","hl":1},{"v":14,"t":"That the blessing of Abraham might come on the Gentiles through Jesus Christ; that we might receive the promise of the Spirit through faith."},{"v":15,"t":"Brethren, I speak after the manner of men; Though it be but a man's covenant, yet if it be confirmed, no man disannulleth, or addeth thereto."},{"v":16,"t":"Now to Abraham and his seed were the promises made. He saith not, And to seeds, as of many; but as of one, And to thy seed, which is Christ."}]},"Galatians 5:4":{"ref":"Galatians 5","cited":"4","verses":[{"v":1,"t":"Stand fast therefore in the liberty wherewith Christ hath made  will make a new covenant with the house of Israel and with the house of Judah:","hl":1},{"v":9,"t":"Not according to the covenant that I made with their fathers in the day when I took them by the hand to lead them out of the land of Egypt; because they continued not in my covenant, and I regarded them not, saith the Lord.","hl":1},{"v":10,"t":"For this is the covenant that I will make with the house of Israel after those days, saith the Lord; I will put my laws into their mind, and write them in their hearts: and I will be to them a God, and they shall be to me a people:","hl":1},{"v":11,"t":"And they shall not teach every man his neighbour, and every man his brother, saying, Know the Lord: for all shall know me, from the least to the greatest.","hl":1},{"v":12,"t":"For I will be merciful to their unrighteousness, and their sins and their iniquities will I remember no more.","hl":1},{"v":13,"t":"In that he saith, A new covenant, he hath made the first old. Now that which decayeth and waxeth old is ready to vanish away.","hl":1}]},"Deuteronomy 27:26":{"ref":"Deuteronomy 27","cited":"26","verses":[{"v":23,"t":"Cursed be he that lieth with his mother in law. And all the people shall say, Amen."},{"v":24,"t":"Cursed be he that smiteth his neighbour secretly. And all the people shall say, Amen."},{"v":25,"t":"Cursed be he that taketh reward to slay an innocent person. And all the people shall say, Amen."},{"v":26,"t":"Cursed be he that confirmeth not all the words of this law to do them. And all the people shall say, Amen.","hl":1}]},"Colossians 2:16-17":{"ref":"Colossians 2","cited":"16-17","verses":[{"v":13,"t":"And you, being dead in your sins and the uncircumcision of your flesh, hath he quickened together with him, having forgiven you all trespasses;"},{"v":14,"t":"Blotting out the handwriting of ordinances that was against us, which was contrary to us, and took it out of the way, nailing it to his cross;"},{"v":15,"t":"And having spoiled principalities and powers, nistereth to you the Spirit, and worketh miracles among you, doeth he it by the works of the law, or by the hearing of faith?"},{"v":6,"t":"Even as Abraham believed God, and it was accounted to him for righteousness."},{"v":7,"t":"Know ye therefore that they which are of faith, the same are the children of Abraham.","hl":1},{"v":8,"t":"And the scripture, foreseeing that God would justify the heathen through faith, preached before the gospel unto Abraham, saying, In thee shall all nations be blessed.","hl":1},{"v":9,"t":"So then they which be of faith are blessed with faithful Abraham.","hl":1},{"v":10,"t":"For as many as are of the works of the law are under the curse: for it is written, Cursed is every one that continueth not in all things which are written in the book of the law to do them."},{"v":11,"t":"But that no man is justified by the law in the sight of God, it is evident: for, The just shall live by faith."},{"v":12,"t":"And the law is not of faith: but, The man that doeth them shall live in them."}]},"Galatians 3:26-29":{"ref":"Galatians 3","cited":"26-29","verses":[{"v":23,"t":"But before faith came, we were kept under the law, shut up unto the faith which should afterwards be revealed."},{"v":24,"t":"Wherefore the law was our schoolmaster to bring us unto Christ, that we might be justified by faith."},{"v":25,"t":"But after that faith is come, we are no longer under a schoolmaster."},{"v":26,"t":"For ye are all the children of God by faith in Christ Jesus.","hl":1},{"v":27,"t":"For as many of you as have been baptized into Christ have put on Christ.","hl":1},{"v":28,"t":"There is neither Jew nor Greek, there is neither bond nor free, there is neither male nor female: for ye are all one in Christ Jesus.","hl":1},{"v":29,"t":"And if ye be Christ's, then are ye Abraham's seed, and heirs according to the promise.","hl":1}]},"Galatians 4:4-7":{"ref":"Galatians 4","cited":"4-7","verses":[{"v":1,"t":"Now I say, That the heir, as long as he is a child, differeth nothing from a servant, though he be lord of all;"},{"v":2,"t":"But is under tutors and governors until the time appointed of the father."},{"v":3,"t":"Even so we, when we were children, were in bondage under the elements of the world:"},{"v":4,"t":"But when the fulness of the time was come, God sent forth his Son, made of a woman, made under the law,","hl":1},{"v":5,"t":"To redeem them that were under the law, that we might receive the adoption of sons.","hl":1},{"v":6,"t":"And because ye are sons, God hath sent forth the Spirit of his Son into your hearts, crying, Abba, Father.","hl":1},{"v":7,"t":"Wherefore thou art no more a servant, but a son; and if a son, then an heir of God through Christ.","hl":1},{"v":8,"t":"Howbeit then, when ye knew not God, ye did service unto them which by nature are no gods."},{"v":9,"t":"But now, after that ye have known God, or rather are known of God, how turn ye again to the weak and beggarly elements, whereunto ye desire again to be in bondage?"},{"v":10,"t":"Ye observe days, and months, and times, and years."}]},"Romans 2:28-29":{"ref":"Romans 2","cited":"28-29","verses":[{"v":25,"t":"For circumcision verily profiteth, if thou keep the law: but if thou be a breaker of the law, thy circumcision is made uncircumcision."},{"v":26,"t":"Therefore if the uncircumcision keep the righteousness of the law, shall not his uncircumcision be counted for circumcision?"},{"v":27,"t":"And shall not uncircumcision which is by nature, if it fulfil the law, judge thee, who by the letter and circumcision dost transgress the law?"},{"v":28,"t":"For he is not a Jew, which is one outwardly; neither is that circumcision, which is outward in the flesh:","hl":1},{"v":29,"t":"But he is a Jew, which is one inwardly; and circumcision is that of the heart, in the spirit, and not in the letter; whose praise is not of men, but of God.","hl":1}]},"Romans 9:6-8":{"ref":"Romans 9","cited":"6-8","verses":[{"v":3,"t":"For I could wish that myself were accursed fr
