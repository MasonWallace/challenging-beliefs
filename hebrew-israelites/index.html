ants. This is what the whole section is trying to get to.","1 Peter 2:9-10":"'Which in time past were not a people, but are now the people of God.' The exact ache, answered without a genealogy.","Hosea 1:10":"Where it was said 'ye are not my people,' they shall be called 'the sons of the living God.' Belonging given, not proved.","Psalm 44:9-26":"A whole psalm asking God why he has scattered and shamed his people. Scripture never rebukes the question. Neither should you.","Habakkuk 1:2-4":"'How long shall I cry, and thou wilt not hear?' A prophet asking why God allows the violence he can see. The same question, in the Bible.","Isaiah 43:1":"'I have called thee by thy name; thou art mine.' Speaks straight to the wound: a people whose names were taken from them.","John 1:12":"'To them gave he power to become the sons of God.' Sonship as a gift received, not a lineage you have to prove.","Isaiah 56:3-8":"God promises the outsider 'an everlasting name, better than of sons and daughters.' A name given by God, offered in the Hebrew Bible."},"titleLong":"DON'T USE: dismissing the longing instead of answering it","quran":[],"hadith":[]}

const WHYMAP={"identity-claims":"Everything else follows from this. If the identity claim is a reading error rather than a recovered truth, the whole system rests on nothing — and if it is true, the church owes them an apology.","curses-reading":"This is the emotional engine of the movement: a people who suffered enormously find their suffering named in Scripture. Answer how the chapter is being read, without ever making light of the suffering behind the reading.","history-genetics":"Because the claim is historical, it can be checked — and because the history involved is real atrocity, it must be checked carefully and without triumph.","race-doctrine":"A gospel with a racial door on it is a different gospel. Galatians was written against exactly this, in the other direction.","law-and-salvation":"This is the actual dividing line. Half of their critique of the modern church is fair; their remedy is the one Paul spent his life opposing.","movement-history":"A movement claiming a recovered ancient identity has a documented American origin with names and dates. That gap is worth a conversation.","practice":"How a group treats its women, its dissenters and its texts tells you what it is — and the answer here is uneven enough that fairness matters."};
const TALK={"identity-claims":"Never start with *“you're not Israel.”* Start with the part that's true: **“You're right that the church has been silent about what was done to your people, and right that God's word takes your suffering seriously.”** Then one question, not a lecture: *“Who is Deuteronomy 28 addressed to in verse 1?”* Let them read it out loud.","curses-reading":"The chapter is their whole case, so go to the chapter — in their Bible, at their pace. **“Read me verse 1. Who is Moses speaking to?”** Then verse 68 in context, then Deuteronomy 30:1-5, where the same covenant promises the return. Never rush this; it's the only argument that matters and it must be theirs to find.","history-genetics":"Genetics is the worst door in the building. If it comes up, be honest and brief: **“The record shows what it shows, and it can't tell you whether God loves you.”** Then move: *“Even if every genetic claim were granted, would that change how a person is saved?”* That question is where the conversation actually lives.","race-doctrine":"Do not argue about who Esau was. Ask instead: **“If a white man repents and believes, is he saved?”** The answers you get will differ camp to camp, and the disagreement inside the movement is more persuasive than anything you could say. Then Galatians 3:28 — a book written against exactly this, in the other direction.","law-and-salvation":"Concede first, and mean it: **“You're right that a lot of churches preach a grace with no obedience in it. That's a real problem.”** Then Galatians 3:10 and 5:3 — *“if you're keeping the law to be saved, are you keeping all of it? What's the atonement when you fail?”* That question has no answer inside the system.","movement-history":"Ask, with curiosity rather than gotcha: **“When did the movement start teaching this, and who first taught it?”** The names — Crowdy 1896, Matthew 1919, One West in the seventies — are in the movement's own histories. A recovered ancient identity with a documented modern founder is worth thinking about slowly.","practice":"The method is the door. **“Isaiah 28:10 — read me the next three verses.”** Verse 13 turns 'precept upon precept' into judgment on people who wouldn't listen. That's not a gotcha; it's an invitation to read chapters instead of chains of single lines — and the whole edifice depends on the chains."};
const DIALOG={"identity-claims":[{"w":"them","t":"So-called Black man! You're not African, you're not 'Black' — that's a color the slave master gave you. You're a Hebrew, tribe of Judah. That's why nothing in this country works for you."},{"w":"you","t":"I'll tell you my name if you tell me yours — I'm ___. And listen, I'm not going to mock the question, because it's the right question: who am I, and why has my people suffered? I just want to check the answer against the whole Book."},{"w":"them","t":"The Book already answered. Deuteronomy 28:68 — bondage, ships. Precept: Joel 3, they sold the children of Judah. Precept: Revelation 2:9, them over in Israel are liars. It's all there if you wasn't asleep."},{"w":"you","t":"That's four half-verses in ten seconds, brother. Pick one — your best one — and let's read the whole chapter together right now. Deuteronomy 28: who's being addressed in verse 15? Where do the ships go in verse 68? It says Egypt, and it ends 'no man shall buy you.' Millions of our ancestors were bought. The verse describes a different tragedy."},{"w":"them","t":"Egypt means bondage, everybody knows that. And even if you was right about one verse, you still can't tell me who you are. DNA? That's Esau's paperwork."},{"w":"you","t":"Here's what I can tell you, and no one can revoke it: 'You are all sons of God through faith in Christ Jesus… if you are Christ's, then you are Abraham's seed, heirs according to the promise' — Galatians 3. An identity older than 1619 and stronger than any chart, and it's offered to you by name, not by lineage. Come read that chapter with me after you're done here — I'm buying the coffee."}],"curses-reading":[{"w":"them","t":"Deuteronomy 28 is our fingerprint. Slavery, ships, scattered, ruled over by strangers — you're living the curses right now. That's how you KNOW who you are."},{"w":"you","t":"I won't pretend the resonance isn't real — reading that chapter next to the Middle Passage is chilling, and the suffering it echoes was genuinely evil. But a fingerprint has to match everywhere, not just where it's held up. Can we read verse 15? The curses fall on the nation that received THIS covenant and broke it — the people standing at Moab."},{"w":"them","t":"Right — Israel broke the covenant, Israel got the curses, and the curses lasted 400 years. Acts 7:6! A nation would enslave them four hundred years. America, 1619. Do the math."},{"w":"you","t":"Read Acts 7:7 — the next verse. Stephen says that prophecy is about EGYPT, and it was already fulfilled at the Exodus; he's retelling Genesis 15. You can't reissue a receipt for a debt the text says was paid. And here's what the camps never read: Deuteronomy 30. After the curse, God promises to gather, restore and circumcise hearts. The chapter isn't a fingerprint kit — it's a story with an ending."},{"w":"them","t":"The ending is Israel keeping the laws again. That's the regathering — us, waking up, back under the commandments."},{"w":"you","t":"The ending is better than that. Jeremiah 31: 'I will make a NEW covenant with the house of Israel… I will write my law on their hearts… I will remember their sin no more.' And Jesus, a son of Judah, lifted the cup and said 'this cup is the new covenant in my blood.' The curse of the law landed on him — Galatians 3:13 — so it doesn't have to land on you. That's not the slave master's doctrine; that's Israel's own prophets, kept."}],"history-genetics":[{"w":"them","t":"Them people in Tel Aviv are Khazars — converts from the Caucasus. The real Jews got shipped to the Americas. That's why they hid your history from you."},{"w":"you","t":"That theory's been tested, though — genome-wide, by more than twenty geneticists in 2013. Result: no Khazar signal; Ashkenazi Jews cluster with Middle Eastern populations and with other Jewish communities from Iraq to Morocco. The one study claiming otherwise used modern Armenians as stand-ins for Khazars, and got taken apart for it."},{"w":"them","t":"And who funded them studies? Come on. Meanwhile your 23andMe says 'Nigeria' because Esau's scientists programmed it to say Nigeria."},{"w":"you","t":"Brother, hear what just happened: every possible test result confirms the chart, and every contrary result is a conspiracy. That's a lock, not a key. The ancestry studies trace African American roots to Senegambia down through Angola — matching the slave ships' own ledgers, kept by men who had no reason to hide Israelites. But let me tell you what I actually think matters more."},{"w":"them","t":"Here it comes — 'race don't matter.' Easy to say when they didn't take YOUR name and YOUR God."},{"w":"you","t":"No — they took the names and gods of my ancestors too, further back; every family tree has chains in it somewhere, and yours has them close and brutal. I'm not waving that away. I'm saying the Bible itself refuses to hang salvation on ancestry: 'not all who are descended from Israel belong to Israel' — Romans 9. John the Baptist told actual, verified sons of Abraham that God could raise up sons from stones. If bloodline couldn't save THEM, the chart can't save anyone. But faith in the Messiah made a eunuch from Africa an heir the same afternoon — Acts 8. That inheritance no lab and no lie can take."}],"law-and-salvation":[{"w":"them","t":"Christ said if you love me, KEEP my commandments. Not 'believe and do nothing.' You have to keep the laws, statutes and commandments — Sabbath, feast days, dietary law. That grace stuff is how Rome put you to sleep."},{"w":"you","t":"I actually respect the seriousness — you've reordered your week, your plate, your clothes around this Book, and most people I know haven't reordered a lunch. So let me ask the question the Book itself asks: how much of the law? Deuteronomy 27:26 — 'Cursed be he that confirmeth not ALL the words of this law to do them.'"},{"w":"them","t":"All of it. We keep it all. That's what the school is for — you learn precept by precept until you're walking in it."},{"w":"you","t":"All 613, every day, from the heart — no lust, no anger, no idol of the mind? Your own bishop can't clear that bar; neither can I. James 2:10 — stumble in one point, guilty of all. That's not me lowering the standard; that's the standard refusing to be graded on a curve. So the law's own math leaves everyone under the curse. Then Galatians 3:13: 'Christ redeemed us from the curse of the law, being made a curse for us.' He kept it all, and then took the sentence."},{"w":"them","t":"Paul. Always Paul. Convenient how the 'curse' got cancelled right when the Gentiles wanted in."},{"w":"you","t":"Then leave Paul aside for a second — take Jesus at Passover: 'this is my blood of the covenant, poured out for MANY for the remission of sins.' Take David: 'Blessed is the man to whom the LORD imputes no iniquity' — Psalm 32, a man under the law throwing himself on mercy. Grace isn't a Gentile invention; it's the oldest song Israel knows. And here's the part nobody at the podium tells you: grace doesn't abolish obedience, it finally makes it possible — the new covenant writes the law on the heart instead of over your head. Come read Hebrews 8 with me and check whether that sounds like Rome or like Jeremiah."}],"race-doctrine":[{"w":"them","t":"Esau is the white man — hairy, red, born fighting Jacob in the womb. Edomites run this world system, and Malachi said it plain: Esau have I HATED."},{"w":"you","t":"Let's find Edom on a map first. Esau's people settled Seir — modern southern Jordan. They were Israel's literal brothers, Semitic like Jacob's line, and by a century before Christ they'd been absorbed into Judea; Herod himself was an Idumean. History knows exactly where Edom went, and it isn't Norway."},{"w":"them","t":"That's the cover story. Obadiah says Esau stood by while his brother was carried off, and handed him over. Who stood on the shore while YOUR people got carried off? Who did the handing over?"},{"w":"you","t":"And there it is — that's the real charge, and I won't dodge it: people who called themselves Christians shipped, sold and whipped image-bearers of God, and painted Jesus white while they did it. That happened. God's word for it is in the Book — Revelation 18 lists trading in 'slaves, that is, souls of men' among Babylon's damning cargo. But notice what Obadiah actually condemns Edom FOR: hating a brother. A doctrine that teaches me to hate a race back doesn't reverse Edom's sin — it re-enlists in it, jersey swapped."},{"w":"them","t":"Easy for you to preach 'no hate' from the winning side. God's got a day coming when the last go first — Isaiah 14, Israel's gonna rule over their oppressors, take THEM captive for a change."},{"w":"you","t":"Read all of Isaiah's ending, though — not just chapter 14's taunt over Babylon. Isaiah 25: a feast on the mountain 'for ALL peoples,' death swallowed up forever. Isaiah 2: nations streaming to Zion to beat swords into plows. The Bible's last picture isn't the plantation with new management — it's the auction block burned down and every nation at one table with the Lamb. I'd rather invite you to that table than win this sidewalk. And Revelation 7:9 says there's a seat there with your name on it — your real one."}],"movement-history":[{"w":"them","t":"This truth ain't new. 1896 — Crowdy was teaching Israelite identity while your church was still segregating its own pews. We PRESERVED this. The church buried it."},{"w":"you","t":"You know your history, and I won't cheapen it — Crowdy founded the Church of God and Saints of Christ in 1896, born enslaved, a Union veteran, and the pew segregation he faced was a scandal against the gospel. Both things can be true: the wound was real, and the medicine still has to be tested against Scripture, not against seniority. Islam is older than 1896; Hinduism's older than both. Old isn't the same as true."},{"w":"them","t":"It ain't just old, it's unbroken. Crowdy to the schools to us. One line, one truth, while y'all split into thirty thousand denominations."},{"w":"you","t":"Gently — that's not the history. The street camps come from Abba Bivens leaving a Harlem congregation in the 1960s to start the school at 1 West 125th. And 1West didn't stay one: IUIC, ISUPK, Great Millstone, Sicarii — camps that excommunicate each other on YouTube weekly. Meanwhile Ben Ammi's people went to Dimona and live peacefully; Rabbi Funnye's congregation talks WITH the Jewish community. So when you invite me to 'Israel,' I have to ask: which one? The invitation splinters exactly like the thing it condemns."},{"w":"them","t":"Camps disagree on doctrine, not identity. Every camp knows WHO we are. Y'all can't even agree on baptism."},{"w":"you","t":"Fair hit on Christian division — it grieves God, and Jesus prayed against it in John 17. But here's the difference I'd stake everything on: Christian unity rests on a Person all the fragments confess — 'Jesus is Lord, raised from the dead.' The camps' unity rests on a chart no verse produces. When Crowdy's own 1896 church still honors Jesus, and Dimona doesn't, and 1West preaches Yahawashi for Israelites only — 'who we are' is exactly what's unresolved. 'Who HE is' is the question that settles identity. Come test that one with me — whole chapters, my kitchen table, any Sabbath evening after sundown."}],"practice":[{"w":"them","t":"You keep Sunday, Christmas and Easter — Babylon, Babylon, Babylon. We keep the Sabbath, the feasts, the dietary laws, the fringes — like the Book says. Who's really following the Bible, me or you?"},{"w":"you","t":"I'll give you this straight: your practice is serious, and I won't pretend Christmas's date came off Moses' desk — it didn't, and Christians honestly debate the holidays among ourselves. So I won't defend a calendar. But can I ask the question underneath the calendar? What are the feasts FOR? What was Passover pointing at, all those centuries?"},{"w":"them","t":"Remembrance and obedience. The Most High said keep it FOREVER — Exodus 12. Forever ain't 'until Rome changes it.'"},{"w":"you","t":"Then follow the lamb through the Book with me. Exodus 12: blood on the doorposts, death passes over. Isaiah 53: a man led 'like a lamb to the slaughter,' wounded for our transgressions. Then John the Baptist sees Jesus: 'Behold the Lamb of God who takes away the sin of the world.' And Paul — a Pharisee who kept more Passovers than both of us combined — writes 'Christ, our Passover, is sacrificed for us.' Colossians 2 calls the feasts 'a shadow of things to come; the substance is Christ.' A shadow is honored, not insulted, when you turn to face what casts it."},{"w":"them","t":"Shadows. That's how y'all delete every commandment you don't feel like keeping. Next you'll tell me the swine is clean."},{"w":"you","t":"No — I'll tell you what Mark 7 says Jesus taught about what defiles, and what the voice told Peter in Acts 10, and you can weigh those texts yourself; you take texts seriously, so take those. But here's my honest bottom line, brother: if you kept every feast, every fringe, every Sabbath perfectly from tonight on, Deuteronomy 27:26 would still be waiting at the end with a curse for the years you didn't. The feasts were never the door — they were the hallway. Hebrews 7 through 10 walks that whole hallway to the door himself. Read those four chapters with me — Friday night, after your sundown, your table or mine. I'll bring food you can eat."}]};
const ABBR=["c","cf","vs","e.g","i.e","etc","Dr","St","Mr","Mrs","ch","pp","v","vv","no","approx","Jr","Sr"];
function splitSentences(raw){
  const tokens=raw.split(/(?<=[.!?])\s+(?=[A-Z0-9"'(‘“])/);
  const merged=[];
  tokens.forEach(t=>{
    if(merged.length){
      const prev=merged[merged.length-1];
      const m=prev.match(/([A-Za-z&.]+)\.$/);
      const w=m?m[1].replace(/\./g,""):null;
      if(w&&ABBR.includes(w)){merged[merged.length-1]=prev+" "+t;return;}
    }
    merged.push(t);
  });
  return merged;
}

const BIBBOOKS="(?:[1-3]\\s)?(?:Genesis|Exodus|Leviticus|Numbers|Deuteronomy|Joshua|Judges|Ruth|Samuel|Kings|Chronicles|Ezra|Nehemiah|Esther|Job|Psalms?|Proverbs|Ecclesiastes|Isaiah|Jeremiah|Lamentations|Ezekiel|Daniel|Hosea|Joel|Amos|Obadiah|Jonah|Micah|Nahum|Habakkuk|Zephaniah|Haggai|Zechariah|Malachi|Matthew|Mark|Luke|John|Acts|Romans|Corinthians|Galatians|Ephesians|Philippians|Colossians|Thessalonians|Timothy|Titus|Philemon|Hebrews|James|Peter|Jude|Revelation)";
const REFNUM="";
const KEYWORDS=/\b(concedes?d?|conceded|disavow(?:s|ed|al)?|undisputed|unfalsifiable|no ancient manuscript|zero ancient witnesses|never recanted|does not match|do not match|no adequate answer|contradict(?:s|ing|ion)?|impossible|no record|officially disavowed)\b/gi;
function emphasize(t){
  t=t.replace(new RegExp("\\b("+LDSBOOKS+REFNUM+")","g"),'<span class="ref-lds">$1</span>');
  t=t.replace(new RegExp("\\b("+BIBBOOKS+"\\s\\d+(?::\\d+(?:[\\-–]\\d+)?(?:,\\s?\\d+(?:[\\-–]\\d+)?)*)?)","g"),m=>m.includes("ref-lds")?m:'<span class="ref-bib">'+m+'</span>');
  t=t.replace(/(^|[\s(—–])'([^'<>]{3,200}?)'(?=$|[\s.,;:)!?—–])/g,'$1<span class="qq">‘$2’</span>');
  t=t.replace(KEYWORDS,'<b class="kw">$1</b>');
  t=t.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/==(.+?)==/g,'<mark>$1</mark>');
  return t;
}
function rich(raw){return glossify(emphasize(esc(raw).replace(/&lt;(\/?)(b|i|em|strong)&gt;/g,"<$1$2>")));}
function paras(raw,per){
  per=per||2;
  const s=splitSentences(raw),ps=[];
  for(let i=0;i<s.length;i+=per)ps.push(s.slice(i,i+per).join(" "));
  return ps.map(p=>`<p>${rich(p)}</p>`).join("");
}
function formatDefense(raw){
  if(/\(\d+\)/.test(raw)){
    const parts=raw.split(/\(\d+\)\s*/);
    const intro=parts.shift().trim();
    return (intro?`<p class="lead">${rich(intro)}</p>`:"")+
      `<ol class="pts">${parts.map(p=>`<li>${rich(p.trim())}</li>`).join("")}</ol>`;
  }
  return paras(raw,2);
}

const GLOSSARY=[{"t":"the 12 Tribes Chart","d":"A chart mapping the twelve tribes onto modern nationalities — Judah to Black Americans, Benjamin to West Indians, and so on. It has no ancient source; it was assembled in the twentieth century."},{"t":"1WT / 'One West'","d":"The One West Camp lineage (from a Harlem address), the doctrinal root of most of the confrontational street camps, including their race eschatology."},{"t":"2 Esdras","d":"An apocryphal apocalypse (also called 4 Ezra) whose chapter 13 describes the ten tribes travelling to a far country called Arzareth. The camps cite it as evidence of a migration; it is not in the Hebrew or Protestant canon, and it is a first-century-AD text, not a historical record."},{"t":"a chiasm","d":"A mirror-image literary structure (A-B-C-B-A) common in Hebrew writing. It appears in these arguments because its presence in a text is sometimes offered as evidence of ancient Semitic authorship."},{"t":"a codex","d":"A book with bound pages, as opposed to a scroll. Christians adopted the codex format remarkably early, which is part of why so many early Christian manuscripts survive."},{"t":"a palimpsest","d":"A manuscript whose original writing was scraped off so the expensive material could be reused. Modern imaging can often recover the erased text underneath — which is how the Sanaa Quran's earlier layer was read."},{"t":"a proof-text","d":"A verse quoted on its own to establish a point, usually detached from what surrounds it. Proof-texting is the single most common way both sides of every argument on this site go wrong."},{"t":"a stele","d":"An upright inscribed stone slab set up to record a victory, a law, or a treaty — one of archaeology's most valuable finds, because it is a dated, deliberate, public record."},{"t":"a textual variant","d":"Any difference between two manuscripts, including a misspelling or a change in word order. The famous 'hundreds of thousands of variants' figure is real and almost entirely trivial; the meaningful and viable ones are well under 1%, and every modern Bible footnotes them."},{"t":"an anachronism","d":"Something appearing in a story before it existed in real life — a horse in a place with no horses, a stirrup centuries too early. Anachronisms are one of the main tools for dating a text, because a writer can only mention the world he lives in."},{"t":"an apologist","d":"Someone who defends a faith's claims — from the Greek <i>apologia</i>, a legal defense. Not an insult, and not the same as an apologizer. This site quotes apologists deliberately: a claim is only worth making if it survives the best defense of it."},{"t":"an ossuary","d":"A limestone box for bones, used in Judea for about a century around the time of Jesus: a body was left to decompose for a year, then the bones were collected into the box. Names carved on ossuaries are how we have physical traces of individuals like the high priest Caiaphas."},{"t":"the apocrypha","d":"Books written between the Testaments (Tobit, Judith, Maccabees and others), included in Catholic and Orthodox Bibles and in the original 1611 KJV, but not in the Hebrew canon or in Protestant Bibles today."},{"t":"Ashkenazi","d":"Jews of central and eastern European descent, as distinct from Sephardi (Iberian) and Mizrahi (Middle Eastern) Jews. Genetic studies consistently show Ashkenazi populations clustering with Middle Eastern rather than Caucasus groups."},{"t":"Ben Ammi & Dimona","d":"Ben Ammi Ben-Israel led a group from Chicago to Liberia in 1967 and then to Dimona, Israel, in 1969. That community — the African Hebrew Israelites of Jerusalem — is vegan, peaceable, and nothing like the street camps."},{"t":"the camps","d":"Street-preaching schools — IUIC, ISUPK, GMS, and others — that teach in public with a podium, uniforms and an amplifier. They are not one organization; they disagree sharply and often bitterly with each other."},{"t":"the canon","d":"The list of books a community accepts as Scripture. The New Testament canon was recognized gradually by usage over the first three centuries rather than voted on at a council — Athanasius's list of 367 AD matches ours exactly."},{"t":"Church of God and Saints of Christ","d":"Founded 1896 by William Saunders Crowdy, a formerly enslaved Union Army veteran — the oldest documented Black Hebrew Israelite body, and still a functioning denomination."},{"t":"Codex Sinaiticus","d":"A complete Greek Bible hand-copied around 330–360 AD, found at St Catherine's Monastery on Mount Sinai in the 1840s. Along with Vaticanus it is one of the two oldest complete Bibles in existence, and its text is essentially the text you read today."},{"t":"Codex Vaticanus","d":"A Greek Bible copied around 300–325 AD, held in the Vatican Library — slightly older than Sinaiticus and, with it, the backbone of modern New Testament textual scholarship."},{"t":"Commandment Keepers","d":"Wentworth Arthur Matthew's Harlem congregation (1919), the strand that moved closest to rabbinic Judaism."},{"t":"the Dead Sea Scrolls","d":"About 900 manuscripts found in caves at Qumran near the Dead Sea between 1947 and 1956, copied roughly 250 BC–70 AD. They pushed our oldest Hebrew Bible manuscripts back a thousand years — and the text matched what had been copied ever since. The single most important manuscript discovery ever made."},{"t":"Deutero-Isaiah","d":"The name critical scholars give to the proposed anonymous author of Isaiah 40–55, writing during the Babylonian exile. See the multi-Isaiah theory."},{"t":"Deuteronomy 28","d":"The covenant curses chapter, and the movement's cornerstone text — especially verse 68, 'the LORD shall bring thee into Egypt again with ships.'"},{"t":"Dimona","d":"A town in Israel's Negev desert, home since 1969 to the African Hebrew Israelites of Jerusalem — a vegan, communal, peaceable group founded by Ben Ammi. They are the clearest proof that this movement is not one thing, and blanket claims about it die here."},{"t":"the Documentary Hypothesis","d":"The critical theory that the first five books of the Bible were woven together from several earlier sources (labelled J, E, D and P) rather than written by Moses. The classic form is now heavily revised even among critical scholars, but some version of it is the mainstream academic position."},{"t":"Edom","d":"In the Hebrew Bible, the nation descended from Esau, Jacob's brother, living south-east of the Dead Sea. In camp teaching Edom is identified with white people — the doctrine that carries the movement's judgment language. The identification has no basis in the text's own geography or in any ancient source."},{"t":"Edomite","d":"In camp teaching, white people — identified as the descendants of Esau. This is the doctrine that carries the movement's judgment language."},{"t":"Esau","d":"Jacob's older twin, who sold his birthright for a meal (Genesis 25). The camps read him as the ancestor of Europeans, partly from the word <i>admoni</i> ('ruddy') used of him — a word the same Scriptures also use of David, whom the camps identify as Black."},{"t":"exegesis","d":"Drawing out what a text actually says, in its own context. Its opposite is eisegesis — reading your conclusion into the text."},{"t":"the Great Isaiah Scroll","d":"The star of the Dead Sea Scrolls: a complete copy of Isaiah, all 66 chapters, copied around 125 BC. It proves Isaiah 53 and its portrait of a pierced, suffering servant existed more than a century before Jesus — nobody added it afterwards."},{"t":"the heathen / the gentile","d":"Everyone outside the twelve tribes. In the strongest camp teaching, the heathen are excluded from salvation or admitted only as servants in the kingdom."},{"t":"ISUPK","d":"Israelite School of Universal Practical Knowledge — the camp behind most viral street-confrontation footage. Its rhetoric on other races is the harshest in the movement."},{"t":"IUIC","d":"Israel United in Christ — the largest and most media-visible camp, founded 2003. Comparatively less confrontational in style than ISUPK, and it does teach Christ."},{"t":"Josephus","d":"Titus Flavius Josephus (c. 37–100 AD), a Jewish general who surrendered to Rome and became its most important historian of first-century Judea. Not a Christian, which is why his mentions of Jesus, James and John the Baptist carry so much weight."},{"t":"the Khazars","d":"A Turkic people of the Caucasus whose elite converted to Judaism around the eighth century. The claim that modern Ashkenazi Jews descend from them, and are therefore 'impostors,' is a twentieth-century theory that population genetics has examined and rejected — Behar's studies specifically sampled the Khazar region."},{"t":"the KJV","d":"The King James Version of 1611, the English Bible of the whole period covered by this site. Its wording matters constantly here: several movements examined on this site were born inside its cadence, and some of them treat it as the only legitimate Bible."},{"t":"Levantine","d":"Of the eastern Mediterranean — Israel, Lebanon, Syria, Jordan. In genetic studies, 'Levantine ancestry' is the marker relevant to any claim of descent from ancient Israel."},{"t":"the Masoretic Text","d":"The standard Hebrew Bible, preserved and vowel-pointed by Jewish scribes called the Masoretes between roughly 600 and 1000 AD. Almost every Old Testament translation is based on it; where it differs from the Septuagint or the Scrolls, that difference is what scholars argue about."},{"t":"the Middle Passage","d":"The ocean crossing of the transatlantic slave trade, in which roughly 12.5 million Africans were shipped and around 1.8 million died at sea. It is the historical reality behind Deuteronomy 28:68 in camp preaching, and it should never be spoken of lightly in these conversations."},{"t":"the Most High / Ahayah","d":"Their preferred name for God, from a reading of the Hebrew of Exodus 3:14. Many camps regard 'God' and 'Lord' as pagan titles."},{"t":"the multi-Isaiah theory","d":"The mainstream critical view that the book of Isaiah had more than one author: chapters 1–39 from the eighth-century prophet, 40–55 from an anonymous writer during the Babylonian exile ('Deutero-Isaiah'), and sometimes 56–66 from a third. It is argued from style and from the fact that chapters 40+ address the exile as present. Conservatives dispute it; it matters here because it is the standard reply whenever Isaiah is said to predict something."},{"t":"officers","d":"Uniformed camp members who manage the crowd, the equipment and the confrontations around a street teaching. The setup is deliberately theatrical."},{"t":"papyrus","d":"Paper made from reed pith, the ordinary writing material of the ancient world. New Testament papyri are labelled with a P and a number — P52, a scrap of John, is the earliest known New Testament manuscript, copied around 125 AD."},{"t":"precept upon precept","d":"Their method, taken from Isaiah 28:10 — chaining verses from across Scripture to build a teaching. In context, Isaiah 28:10 is a mocker's imitation of a prophet, which verse 13 turns into judgment."},{"t":"Qumran","d":"The settlement beside the caves where the Dead Sea Scrolls were found, on the northwest shore of the Dead Sea. Usually associated with the Essenes, a strict Jewish sect of the Second Temple period."},{"t":"replacement theology","d":"The teaching that the church has replaced Israel in God's purposes — also called supersessionism. Romans 11 explicitly denies it, and the camps are right that much of the church has held it. Conceding this is the fastest way to be heard on anything else."},{"t":"the Septuagint","d":"The Greek translation of the Hebrew Scriptures made by Jewish scholars in Alexandria beginning about 250 BC — abbreviated LXX. It matters constantly here because it is pre-Christian: when it renders a verse a certain way, no Christian could have influenced it."},{"t":"the Smithsonian Institution","d":"The United States' national museum and research complex. It matters here because for decades a 'Smithsonian statement' was circulated claiming the institution used the Book of Mormon as an archaeological guide. The Smithsonian issued a formal statement denying it, and now sends a standard letter saying its archaeologists see no connection between the New World's archaeology and the book's contents."},{"t":"so-called Negro / so-called Black","d":"Their standard phrase for Black Americans — the point being that 'Black' is a slave-master label imposed over a stolen national identity."},{"t":"the SPLC","d":"The Southern Poverty Law Center, an American legal advocacy organization that publishes a list of hate groups. It lists specific radical Israelite camps. The camps are right that a listing is not a refutation of a doctrine; critics are right that the teaching listed is real."},{"t":"Tacitus","d":"Roman senator and historian (c. 56–120 AD). His hostile mention of 'Christus,' executed by the procurator Pontius Pilate under Tiberius, is the standard non-Christian confirmation of the crucifixion."},{"t":"textual criticism","d":"The scholarly discipline of comparing manuscripts to work out what the original wording was. It is not an attack on Scripture — it is the method that lets us say with confidence what the text said."},{"t":"the transgression","d":"The reason for the curses: Israel's disobedience. In camp preaching, everything that has happened to Black America since 1619 is read as this chapter running its course."},{"t":"waking up","d":"Conversion language: realising you are an Israelite. The opposite is 'sleep' — accepting the identity the slave trade assigned you."},{"t":"Yashaya / Yahawashi","d":"Sacred-name renderings of 'Jesus.' Camps differ; some treat the English name Jesus as a deliberate corruption."}];

const esc=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function hl(text,phrases){let out=esc(text);(phrases||[]).forEach(p=>{const e=esc(p).replace(/[.*+?^${}()|[\]\\]/g,"\\$&");out=out.replace(new RegExp(e,"gi"),m=>"<mark>"+m+"</mark>");});return out;}
function glossify(escapedText){
  if(!glossify._re){
    const ts=GLOSSARY.slice().sort((a,b)=>esc(b.t).length-esc(a.t).length);
    const alts=ts.map(g=>esc(g.t).replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|");
    glossify._re=new RegExp("(?<![\\w-])("+alts+")(?![\\w-])","gi");
    glossify._map={};GLOSSARY.forEach(g=>{glossify._map[esc(g.t).toLowerCase()]=g;});
  }
  const used=glossify.seen||(glossify.seen=new Set());
  let inRef=0;
  return escapedText.replace(/(<[^>]*>)|([^<]+)/g,(m,tag,txt)=>{
    if(tag){
      if(/^<span class="ref-(lds|bib)"/.test(tag))inRef++;
      else if(inRef&&tag.indexOf("</span>")===0)inRef--;
      return tag;
    }
    if(inRef)return txt;
    return txt.replace(glossify._re,w=>{
      const g=glossify._map[w.toLowerCase()];
      if(!g||used.has(g.t))return w;
      used.add(g.t);
      return '<span class="g" tabindex="0">'+w+'<span class="gt"><b>'+esc(g.t)+'</b> — '+g.d+'</span></span>';
    });
  });
}


function findWhy(d,cite){
  const key=cite.replace(/–/g,"-").replace(/\s*\(.*\)\s*/g,"").trim();
  const m=key.match(/^([1-4]?\s?[A-Za-z&; ]+?)\s+(\d+)/);
  const frag=m?(m[1].trim()+" "+m[2]):key;
  const sentences=(d.claim+" "+d.rationale).replace(/–/g,"-").split(/(?<=[.!?])\s+/);
  const hit=sentences.find(s=>s.includes(frag));
  return hit?hit.replace(/-/g,"–"):null;
}

function extUrl(cite){
  const c=cite.replace(/–/g,"-").replace(/\s*\(.*\)\s*/g,"").trim();
  const qm=c.match(/^Quran\s+(\d+):(\d+)/i);
  if(qm)return "https://quran.com/"+qm[1]+"/"+qm[2];

  if(mm)return "https://www.biblegateway.com/passage/?search="+encodeURIComponent(c)+"&version=KJV";
  return "https://quran.com/";
}

  document.querySelectorAll(".vt").forEach(c=>{

}

function plainHtml(d){
  const rt=t=>glossify(emphasize(esc(t).replace(/&lt;(\/?)(b|i)&gt;/g,"<$1$2>")));
  const KINDRE=t=>(/answer,? at full strength|^their answer|^the .{2,22} answer\b|^how (they|.*s) (answer|explain)|best (defense|answer)|at its strongest|^the (rabbinic|muslim|witness|sceptic|skeptic) (reply|answer)/.test(t)?"k-def"
      :/^how strong|^the rule\b|^where it lands|^the verdict|don't use|do not use/.test(t)?"k-strength"
      :/^why this|^why it|helps you|^what it cost|^what to do instead|^what to say instead|^the takeaway|^why that matters/.test(t)?"k-help"
      :/runs out|problem|^why that is|^where it breaks|^what that misses|^the gap|^why it is wrong|^the trouble|^what it does not/.test(t)?"k-gap"
      :/verse|text|chapter|\bsays\b|passage|record|scripture|evidence|the numbers|what survives|the hadith|manuscript|papyri|inscription/.test(t)?"k-text"
      :/^the claim|^what is taught|^what (they|the book|the movement|the church|the camps) |^what happened|^how it (usually|ended|came out)|objection|^what (you|your|people)|describes|^the story|^what is at stake/.test(t)?"k-claim"
      :"k-plain");
  const KINDOF=b=>{
    if(b.say)return "k-say";
    const t=b.t.toLowerCase();
    return KINDRE(t);
  };
  /* One fixed sequence for every case, so the colours mean the same thing on
     every page and a reader learns the shape once. "What to say" is last in all
     318 cases and always anchors the run in green. */
  const SEQ=["amber","gold","red","purp","teal","slate"];
  const blocks=(d.plain||[]);
  const kinds=blocks.map(KINDOF);
  let si=0;
  const hues=blocks.map(b=>b.say?"green":SEQ[si++%SEQ.length]);
  return blocks.map((b,bi)=>{
    const ss=splitSentences(b.d),ps=[];
    for(let i=0;i<ss.length;i+=2)ps.push("<p>"+rt(ss.slice(i,i+2).join(" "))+"</p>");
    const kind=kinds[bi], hue="h-"+hues[bi];
    const big=/(k-text|k-say)/.test(kind)?" k-big":"";
    return `<div class="pblk ${kind} ${hue}${b.say?" say":""}${big}"><div class="plab ${hue}">${esc(b.t)}</div>${ps.join("")}</div>`;
  }).join("");
}

  let pinnedCite=null,hoverTimer=null,scrolling=false,scrollT=null;
  const vbox=()=>$("#versebox");
  const clearVerse=()=>{pinnedCite=null;const b=vbox();if(b)b.innerHTML="";
    document.querySelectorAll(".chip.open,.chip.peek").forEach(x=>x.classList.remove("open","peek"));};
  const sideOf=ch=>ch.closest("[data-side]")?ch.closest("[data-side]").dataset.side:"";
  const buildHtml=(cite,v,side)=>{
    if(!v||!v.verses)
      return '<div class="versebox vmiss"><div class="vr"><span>'+esc(cite)+'</span><button data-close>✕ close</button></div><div class="vwhy">This reference is cited by the claim but isn\'t in the built-in reader — open it in your own Bible.</div></div>';
    const why=findWhy(d,cite);
    const whyHtml=why?"<b>Why it's cited:</b> "+esc(why):ROLENOTE(side);
    const anyHl=v.verses.some(x=>x.hl);
    const hasCtx=anyHl&&v.verses.some(x=>!x.hl);
    const ctx=hasCtx?' <span class="vcited">— '+esc(v.ref)+', with the verses either side</span>'
      :(!anyHl?' <span class="vcited">— '+esc(v.ref)+'</span>':'');
    const body=v.verses.map(x=>{
      const lit=(x.hl||!anyHl);
      const txt=(x.hl&&hasCtx)?"<em>"+esc(x.t)+"</em>":esc(x.t);
      return '<span class="vs'+(lit?" hl":"")+'"><span class="vnum">'+x.v+'</span>'+txt+' </span>';
    }).join("");
    return '<div class="versebox"><div class="vr"><span>'+esc(cite)+ctx+'</span><button data-close>✕ close</button></div><div class="vtext">'+body+'</div><div class="vwhy">'+whyHtml+'</div></div>';
  };
  /* The box opens in place, beside what you pointed at. The old glitch came from it
     opening while the page was scrolling, so the page kept resizing under the cursor.
     Fix: a hover delay, and nothing opens while a scroll is in progress. */
  const openVerse=(ch,pin)=>{
    const box=vbox(); if(!box)return;
    const cite=ch.dataset.cite;
    const host=ch.closest(".pblk, .claim, .defense, .talk, .vbox, .why, .saybox, li, p")
      ||ch.closest(".chips") && ch.closest(".claimside");
    if(host&&host.parentNode&&box.previousElementSibling!==host)host.parentNode.insertBefore(box,host.nextSibling);
    document.querySelectorAll(".chip.open,.chip.peek").forEach(x=>x.classList.remove("open","peek"));
    ch.classList.add(pin?"open":"peek");
    if(pin)pinnedCite=cite;
    box.innerHTML=buildHtml(cite,VERSES[cite],sideOf(ch));
    const cb=box.querySelector("[data-close]");if(cb)cb.addEventListener("click",clearVerse);
    /* the cited verse can sit below three verses of context — bring it into view */
    const inner=box.querySelector(".versebox"),hl=box.querySelector(".vs.hl");
    if(inner&&hl){
      const want=hl.offsetTop-inner.offsetTop-Math.max(0,(inner.clientHeight-hl.offsetHeight)/2);
      inner.scrollTop=Math.max(0,want);
    }
  };
  window.addEventListener("scroll",()=>{scrolling=true;clearTimeout(scrollT);clearTimeout(hoverTimer);
    scrollT=setTimeout(()=>{scrolling=false;},220);},{passive:true});
  /* LIVEREFS: references printed inside prose become openable, like the chips */
  document.querySelectorAll("#main .ref-bib, #main .ref-lds").forEach(r=>{
    const key=r.textContent.replace(/\s+/g," ").trim().replace(/[.,;:]$/,"");
    const hit=VERSES[key]?key:Object.keys(VERSES).find(k=>k.replace(/[\u2013\u2014]/g,"-")===key.replace(/[\u2013\u2014]/g,"-"));
    if(!hit)return;
    r.classList.add("live","chip");r.dataset.cite=hit;
  });
  const canHover=window.matchMedia("(hover:hover)").matches;
  document.querySelectorAll(".chip").forEach(ch=>{
    ch.addEventListener("click",()=>{
      if(ch.dataset.ext){window.open(ch.dataset.ext,"_blank");return;}
      if(pinnedCite===ch.dataset.cite){clearVerse();return;}
      openVerse(ch,true);
    });
    if(!ch.dataset.ext&&canHover){
      ch.addEventListener("mouseenter",()=>{clearTimeout(hoverTimer);
        if(pinnedCite||scrolling)return;
        hoverTimer=setTimeout(()=>{if(!scrolling&&!pinnedCite)openVerse(ch,false);},240);});
      ch.addEventListener("mouseleave",()=>{clearTimeout(hoverTimer);
        if(pinnedCite)return;
        hoverTimer=setTimeout(()=>{if(!pinnedCite)clearVerse();},160);});
    }
  });
  
});
  document.querySelectorAll(".cimg-x").forEach(b=>b.addEventListener("click",e=>{e.stopPropagation();showLightbox(b.dataset.full,b.dataset.cap);}));
  renderNav();renderPreview();
}

  $("#main").innerHTML=`<div class="viewhead"><h2>The heart of it: read the whole chapter</h2>
  <p>If you read nothing else on this site, read this page. The Hebrew Israelite case is built almost entirely on one chapter of Deuteronomy — and it is answered by that same chapter, read from verse 1 to the end and on into chapter 30. But it cannot be answered until something else is said first.</p></div><figure class="corehero"><img src="https://commons.wikimedia.org/wiki/Special:FilePath/Brookes%20slave%20ship%2C%20British%20Library%20(cropped).jpg?width=900" loading="lazy" alt=""><figcaption>The Brookes, 1788. This is the history Deuteronomy 28:68 is read against — and the reason the chapter has the force it has.</figcaption></figure>
  <div class="corebox"><h3>1 · Say the true thing first, and mean it</h3>
  <p>People did not join this movement because a chart persuaded them. They joined because they were told, for the first time, that their history was in the Bible and that God had not forgotten what was done to their families — and because the church that could have said that was largely silent about slavery, and in many cases blessed it.</p>
  <p>That grievance is real, and it is <b>not</b> the part to argue with. Say so out loud, early, without a "but": the church owes an apology it has mostly not made. Nothing further you say will be heard until that is on the table.</p>
  <details class="srcdet"><summary>Open the cases behind this</summary><div class="corelinks" style="margin-top:12px">${link("avoid-dismissing-the-longing")}${link("suffering-as-identity-proof")}</div></details></div>

  <div class="corebox"><h3>2 · Deuteronomy 28, from verse 1</h3>
  <p>The chapter is quoted from the middle. Read it from the top and it names its own audience: Moses, at Moab, addressing the covenant nation about the consequences of covenant disobedience. Verse 68 — <i>"the LORD shall bring thee into Egypt again with ships"</i> — is the last of a long list, and "Egypt" is literal Egypt everywhere else in the book.</p>
  <p>Then keep reading. <b>Deuteronomy 30:1–5</b> is the same covenant's own resolution: when the curses come, and you return, God gathers you back. The curses were never a permanent identity — the chapter that pronounces them also ends them.</p>
  <details class="srcdet"><summary>Open the cases behind this</summary><div class="corelinks" style="margin-top:12px">${link("deut-28-68-ships-to-egypt")}${link("deut-28-curses-already-fulfilled")}</div></details></div>

  <div class="corebox"><h3>3 · Suffering is not a genealogy</h3>
  <p>The engine of the movement is an argument that looks like this: <i>the curses describe us, therefore we are the cursed people</i>. But suffering the described consequences does not establish descent. The Armenians, the Irish, the Cambodians and the Rwandans could each read Deuteronomy 28 and find their own century in it — the chapter's power is precisely that it describes what happens to human beings under judgment, not a fingerprint.</p>
  <p>And the chart that assigns tribes to modern nationalities has no ancient source at all. It was assembled in the twentieth century, and when that is pointed out the reply is that the records were destroyed — which is true of the records, and also makes the claim impossible to test in either direction.</p>
  <details class="srcdet"><summary>Open the cases behind this</summary><div class="corelinks" style="margin-top:12px">${link("suffering-as-identity-proof")}${link("twelve-tribes-chart")}</div></details></div>

  <div class="corebox"><h3>4 · The real dividing line is not race — it is the gospel</h3>
  <p>You could concede every genealogical claim on the site and the central question would be untouched: <b>how is a person saved?</b> The camps answer with bloodline and law-keeping. Paul spent his life answering that question the other way — and Galatians was written against exactly this error, running in the opposite direction, when Jewish believers wanted Gentiles kept out.</p>
  <p class="pullq">"If ye be Christ's, then are ye Abraham's seed, and heirs according to the promise." — Galatians 3:29</p>
  <p>Ask the question that has no answer inside the system: <i>if salvation is by keeping the law, are you keeping all of it — and what is the atonement when you fail?</i> There has been no altar since AD 70.</p>
  <details class="srcdet"><summary>Open the cases behind this</summary><div class="corelinks" style="margin-top:12px">${link("law-keeping-salvation")}${link("bloodline-versus-abrahams-offspring-by-faith")}${link("gentile-exclusion-and-race-eschatology")}</div></details></div>

  <div class="corebox"><h3>5 · The dignity they are looking for is already theirs</h3>
  <p>Underneath the chart and the megaphone is a true and God-given hunger: <i>I want to matter in God's story.</i> The answer is not that they don't — it is that in Christ they are not a footnote to Israel but a co-heir with the Messiah, adopted, named, and seated. That is a larger dignity than the chart offers, and it does not depend on a genealogy nobody can produce.</p>
  <p><button class="corelink" data-goto="share">How to actually have this conversation →</button></p></div>`;
  $("#main").querySelectorAll(".corelink").forEach(b=>{if(b.dataset.open)b.addEventListener("click",()=>openCase(b.dataset.open));});
  const g=$("#main").querySelector("[data-goto]");
  if(g)g.addEventListener("click",()=>{state.view="share";render();});
}
function renderShare(){
  $("#main").innerHTML=`<div class="viewhead"><h2>Sharing Jesus with a Hebrew Israelite</h2>
  <p>Not to win a street exchange — those are built to be unwinnable. To reach one person whose grievance is real and whose remedy is not.</p></div>
<div class="pb-h">Say this before anything else</div>
<div class="saybox"><span class="who">You, first</span><p>"The American church was mostly silent about slavery, and in many places it was worse than silent. That was our failure. I am not going to explain it away."</p></div>
<p>Say that out loud before you say anything else. Do not soften it. Do not follow it with a defence of the church.</p>
<p>Pulpits defended slavery from the text. Preachers owned people. Whole denominations split rather than call it sin. The silence went on long after the auction blocks closed.</p>
<p>The person in front of you has been told that Christians deny this. Most of the Christians they have met did deny it. When you do not, you become something they have no box for.</p>
<p>This is not a tactic and it is not a warm-up. It is true. It has to be said before you have earned a single other sentence.</p>
<p>Say it in your own words rather than as a formula. If you do not know the history, go and read it before you speak.</p>
<p>The next move will often be that this proves Christianity is a slave master religion. Answer that slowly. The answer is not that the church was fine.</p>
<p>It is that the same book was read in secret in the quarters, by people the preachers were trying to keep quiet, and it is what they sang.</p>

<div class="pb-h">The invitation to work toward</div>
<div class="saybox"><span class="who">You, off camera</span><p>"Would you read Deuteronomy 28 and 30 with me, start to finish, and then Galatians? Just us. No podium and no camera."</p></div>
<p>Everything on this site is built for that conversation. None of it is built for the street.</p>
<p>The camps teach precept upon precept. That means chains of single lines pulled from all over the Bible. The method is also the weak spot.</p>
<p>Read Deuteronomy 28 from verse 1. Read Isaiah 28 down to verse 13. The chain comes apart on its own. You are not arguing against their verses. You are reading around them.</p>
<p>That is why whole chapters matter more than clever answers. A chapter read together does the work, and nobody has to lose.</p>
<p>Ask for a chapter, not a debate. A chapter has a beginning and an end, and both of you can see them coming.</p>
<p>If they want to trade single verses instead, treat that as a signal. It usually means the exchange is a performance rather than a conversation.</p>

<div class="pb-h">What actually reaches someone in the camps</div><div class="pb-grid">
<div class="pb"><span class="num">1</span><h4>Concede the true half out loud</h4><p>Cheap grace is a real distortion. The silence on slavery is a real failure. Replacement theology is a real error, and Romans 11:1 forbids it by name. God has not cast off his people. Grant all three before you contest anything.</p></div>
<div class="pb"><span class="num">2</span><h4>Read whole chapters, never single lines</h4><p>Ask them to read the chapter aloud. Let the text do the work while you stay quiet. You never have to attack the method, because the method breaks itself.</p></div>
<div class="pb"><span class="num">3</span><h4>One question, then real silence</h4><p>Ask who verse 1 is addressed to. Ask what the atonement is when you break the law. These are not gotchas. Each is a real question with no prepared camp answer.</p></div>
<div class="pb"><span class="num">4</span><h4>Be the Christian still here next month</h4><p>Street teaching is a stage. Friendship is not. Almost nobody leaves this movement because of an argument. Almost everyone who leaves had one patient person nearby.</p></div>
</div>

<div class="pb-h">The method</div><div class="pb-grid">
<div class="pb do"><h4>Know the strands apart</h4><p>The 1896 church, the Dimona community, IUIC and ISUPK are not one thing. They disagree, and they do not like each other. The Church of God and Saints of Christ was founded in 1896 by William Saunders Crowdy, a formerly enslaved Union Army veteran. It is still a working denomination.</p></div>
<div class="pb do"><h4>Move it off the street</h4><p>A podium, an amplifier, officers and a ring of phones make a stage. Every exchange there is scored by the crowd. Ask for coffee instead. If the answer is no, the exchange was never about the question.</p></div>
<div class="pb do"><h4>Stay on the one dividing line</h4><p>The real question is not skin. It is whether a person is put right with God by bloodline and law keeping, or by trusting the Messiah. Keep returning there, gently, however far the talk wanders.</p></div>
<div class="pb dont"><h4>Not the skin colour fight</h4><p>Jesus was a first-century Judean. He did not look like a European painting. That much is simply true. Defending the painting turns you into the caricature they preach about. Concede it and go to whether he is the Messiah.</p></div>
<div class="pb dont"><h4>Not the hate group label</h4><p>As a blanket claim it is false. It sweeps in a 130-year-old denomination and a quiet farming village in Israel. It also ends the conversation on the spot. Name a specific teaching if you must name something. Never the whole movement.</p></div>
<div class="pb dont"><h4>Never confuse Dimona with a street camp</h4><p>Ben Ammi Ben-Israel led a group from Chicago to Liberia in 1967, then to Dimona in Israel in 1969. What grew there is a settled village with schools, farms and its own vegan food industry. The people are peaceable. Lumping them in with a megaphone on a corner tells your friend you learned the movement from a video.</p></div>
<div class="pb dont"><h4>Not the viral clip</h4><p>Confrontation footage ages badly and gets re-cut. All it tells your listener is which outlet you watch. You trade a durable argument from the text for a throwaway one from the news cycle.</p></div>
</div>

<div class="pb-h">When it turns into theatre</div>
<div class="saybox"><span class="who">You, calmly</span><p>"I am not doing this in front of a camera. I will read the chapter with you any day this week, just the two of us."</p></div>
<p>Say it once, mean it, and leave the offer open.</p>
<p>A crowd changes what a person can afford to admit. Nobody concedes a point while five men in tunics and a dozen phones are watching. Taking the audience away is not a trick. It is the only condition under which either of you can think.</p>
<p>If the offer is refused, you have still learned something. You have also lost nothing worth keeping.</p>
<p>And if they mock you for leaving, let them. The exchange you walked away from was never the one that changes anybody.</p>
<p>The same rule applies to the phone in your own pocket. Filming your reply for an audience puts you back on the stage you just asked them to leave.</p>

<div class="pb-h">The part that takes years</div>
<div class="saybox"><span class="who">You, later</span><p>"You do not have to agree with me for us to be friends. I am not keeping score, and I am not going anywhere."</p></div>
<p>People do not walk out of a camp in an afternoon. Leaving costs them a teacher, a schedule, a set of brothers and a story about who they are.</p>
<p>Almost everyone who does leave describes the same thing. One Christian stayed steady, kept turning up, and never treated them as a project.</p>
<p>So plan for a long time. Answer the text when it comes up. Otherwise be a friend, and let the questions arrive on their own schedule.</p>
<p>The camps also make hard predictions. One taught that the year 2000 would bring the reckoning, and it did not come.</p>
<p>Do not crow about that. File it and wait until they raise it themselves, which they eventually will.</p>
<p>When a person starts asking quietly, the last thing they need is an audience or a told-you-so. Give them a kitchen table and an hour.</p>
<p>Expect the questions to come in the wrong order and at the wrong time. Answer the one you are asked rather than the one you prepared.</p>
<p>Learn the history of the movement well enough to be useful. It runs from a church founded in 1896, through a Harlem congregation in 1919, to the camps on the corner today.</p>
<p>Knowing that story is not ammunition. It is how you show a person that you took their world seriously enough to study it.</p>

<div class="pb-h">How it actually goes</div>
<p class="sh-open">People do not join because the chart is convincing. They join because someone finally told them their history was in the Bible.</p>
<p class="sh-att">— the thing to answer, and the thing never to mock</p>

<div class="sa"><h4 class="sat">The five questions that do the most work</h4>
<ol class="sh-list">
<li><b>"Who is Deuteronomy 28:1 addressed to?"</b> Ask them to read it out loud. The chapter names its own audience in the very first line. The whole structure depends on quoting the chapter from the middle. This is the gentlest question here and the one that unsettles most.</li>
<li><b>"What does Deuteronomy 30 say happens after the curses?"</b> The same covenant that pronounces the curses also promises the gathering back. Read it together rather than summarising it. The curses were never meant to be a permanent identity, and the chapter says so in its own words.</li>
<li><b>"If salvation is by keeping the law, what is the atonement when you fail?"</b> There has been no altar since AD 70. The system has no answer inside itself. This is the question that reaches people, so ask it once and then stop talking. The silence afterwards is doing more than anything you could add.</li>
<li><b>"If a white man repents and believes, is he saved?"</b> Ask it gently, with no trap in your voice. The answer shifts from camp to camp. The disagreement inside the movement makes the point far better than you can, and it makes it without you.</li>
<li><b>"Which teacher do you follow, and where did he learn this?"</b> The movement is young and it splits often. A recovered ancient identity that cannot agree with itself about what it is raises the question quietly. Ask because you want the answer, not because you want the point.</li>
</ol></div>

<div class="sa"><h4 class="sat">Start here</h4>
<p class="pd">The identity path walks the one chapter that everything else rests on. Every case page ends with a suggested question and a scripted back-and-forth, so you meet the counter-moves before they meet you.</p>

const PROOFS=[{"v":"Deuteronomy 28:68","they":"'The LORD shall bring thee into Egypt again with ships… and there ye shall be sold… and no man shall buy you.' Egypt means bondage generally; ships mean the Middle Passage; this is the prophecy of the trans-Atlantic slave trade, so Black Americans are the Israel of this chapter.","you":"Read verses 15 and 58 first: these curses fall on the covenant nation for breaking the covenant God made at Sinai — the chapter's 'you' is the people who stood at Moab. The destination is Egypt, and 'again' points back to the exodus. And the last clause runs opposite to the Atlantic trade: 'no man shall buy you' describes a slave market with no buyers — utter worthlessness — while the Middle Passage ran on buyers. Josephus records a literal fulfillment: after Jerusalem fell in AD 70, Rome shipped captives to the Egyptian mines (Wars 6.9.2). Most of all: the chapter is not the end of the story. Deuteronomy 30 promises restoration when hearts return to the LORD — the very heart-circumcision the New Covenant delivers (Deut 30:6; Jer 31:31-34).","refs":"Deut 28:15, 58, 68 · Deut 30:1-6 · Josephus, Wars 6.9.2 · Jer 31:31-34 · Gal 3:13"},{"v":"Revelation 1:14-15","they":"Hair like wool, feet like burnt brass 'as if they burned in a furnace' — that's an Afro and dark skin. The white Jesus is a Renaissance forgery; John saw a Black Messiah.","you":"On the forgery point, agree: European portraiture made Jesus look Dutch, and that deserves the critique. But read the verse whole: the hair is 'WHITE like wool, white as snow' — wool supplies the whiteness, exactly as in Daniel 7:9 where the Ancient of Days has hair 'like pure wool.' The feet are like bronze glowing in a furnace — molten, radiant metal — and two verses on, his face is 'like the sun shining in full strength.' No complexion glows like a furnace. This is theophany-glory, and John's response settles the genre: 'I fell at his feet as though dead.' The historical Jesus was a brown-skinned Judean of Middle Eastern appearance — neither the blond of the paintings nor a proof-text for anyone's chart.","refs":"Rev 1:12-17 · Dan 7:9 · Dan 10:5-6 · Ezek 1:26-28"},{"v":"Daniel 7:9","they":"The Ancient of Days has hair 'like the pure wool' — the heavenly court is Black; wool hair is African hair.","you":"Follow the logic where it goes: the Ancient of Days here is God the Father figure enthroned — so on this reading the text is assigning ethnicity to the eternal God, whom 'no one has ever seen' (John 1:18) and who is spirit (John 4:24). The vision's own accents are whiteness and fire: garment 'white as snow,' hair like pure wool, throne of flames. Wool in both testaments is the Bible's standard image for whiteness — 'though your sins be as scarlet… they shall be as wool' (Isa 1:18). Apocalyptic visions communicate holiness, purity and unapproachable glory, not demographics.","refs":"Dan 7:9-10 · Isa 1:18 · John 4:24 · 1 Tim 6:16"},{"v":"Song of Solomon 1:5","they":"'I am black, but comely, O ye daughters of Jerusalem' — the Bible's own voice declaring Israelites are Black people.","you":"Read verse 6, where she explains herself: 'Look not upon me, because I am black, because the SUN hath looked upon me… they made me the keeper of the vineyards.' She is describing a field-worker's deep tan, and asking the pale city women not to look down on her for it — a class contrast inside the same people, in a love poem. If anything, the exchange assumes the daughters of Jerusalem were lighter-skinned than a sunburned vineyard girl. Ancient Israelites were Levantine people with the range of brown skin that region still has; this verse is neither embarrassed by dark skin nor a racial census.","refs":"Song 1:5-6 · Lam 4:7-8 (complexion as poetry, not ethnology)"},{"v":"Zephaniah 3:10","they":"'From beyond the rivers of Ethiopia my suppliants, even the daughter of my dispersed, shall bring mine offering' — the scattered Israelites are in Africa, beyond Cush. That's the trans-Atlantic diaspora.","you":"The verse before it gives the frame: 'then will I turn to the PEOPLES a pure language, that they may all call upon the name of the LORD' (3:9) — this is the great ingathering, worship streaming to God from the farthest horizon a Judean could name. 'Beyond the rivers of Cush' is the idiom for the ends of the earth (cf. Isa 18:1). And notice how the New Testament shows it beginning: an Ethiopian official reading Isaiah on the Gaza road, baptized by Philip (Acts 8) — Africa was in the story from the church's first decade, by grace, not by chart. The verse promises distant worshipers brought near, which is exactly what the gospel does for every nation (Eph 2:13).","refs":"Zeph 3:9-10 · Isa 18:1, 7 · Acts 8:26-39 · Eph 2:13"},{"v":"James 1:1","they":"'To the twelve tribes which are scattered abroad' — the tribes were still scattered in bondage, and James is writing to us, the tribes lost in the Americas.","you":"James wrote in the mid-first century to Jewish believers dispersed across the Greco-Roman world — a diaspora everyone could locate: Acts 2:5-11 lists its nations ('Parthians, Medes, Elamites… Egypt… Rome'), and Paul found its synagogues in every city he entered. Sixteen centuries separate this letter from 1619; you cannot re-address someone else's mail. And note the letter's first identification: James, 'a servant of God and of the Lord Jesus Christ,' writing to those who 'hold the faith of our Lord Jesus Christ, the Lord of glory' (2:1) — the scattered tribes he greets are defined by faith in Jesus, which is precisely the identity offered to everyone.","refs":"James 1:1; 2:1 · Acts 2:5-11 · 1 Pet 1:1 · Gal 3:26-29"},{"v":"Acts 21:38","they":"The Roman captain mistook Paul for an Egyptian — you can't mistake a white man for an Egyptian. The apostles looked African.","you":"Read the next verse: the confusion ends the moment Paul speaks — 'I am a Jew from Tarsus' (21:39). The tribune wasn't studying Paul's complexion; he assumed this riot-center must be a known fugitive, the Egyptian insurrectionist Josephus also mentions. First-century Egyptians and Judeans were both eastern-Mediterranean peoples — brown-skinned neighbors, plausibly confusable, which actually agrees with the mainstream picture: Jesus and the apostles were Middle Eastern men, not northern Europeans. That's a fair correction of the paintings; it isn't a twelve-tribes chart.","refs":"Acts 21:37-39 · Josephus, Wars 2.13.5 · Antiquities 20.8.6"}];

function proofCombine(v,refs){
  const m=String(v).match(/^(.+?)\s+(\d+):(\d+)(?:\s*[-\u2013]\s*(\d+))?$/); if(!m)return null;
  const book=m[1].trim(), ch=m[2]; let lo=+m[3], hi=+(m[4]||m[3]), found=false;
  String(refs||"").replace(/<[^>]+>/g," ").split(/[\u00b7;,]/).forEach(part=>{
    const r=part.trim().match(/^(.+?)\s+(\d+):(\d+)(?:\s*[-\u2013]\s*(\d+))?$/); if(!r)return;
    if(r[1].trim().toLowerCase()!==book.toLowerCase()||r[2]!==ch)return;
    lo=Math.min(lo,+r[3]); hi=Math.max(hi,+(r[4]||r[3])); found=true;});
  return found?book+" "+ch+":"+lo+"-"+hi:null;
}
function proofVerse(ref,refs){
  const cb=refs?proofCombine(ref,refs):null;
  const v=(cb&&VERSES[cb])?VERSES[cb]:VERSES[ref]; if(!v||!v.verses)return "";
  const anyHl=v.verses.some(x=>x.hl), hasCtx=anyHl&&v.verses.some(x=>!x.hl);
  const body=v.verses.map(x=>{
    const lit=(x.hl||!anyHl);
    const txt=(x.hl&&hasCtx)?"<em>"+esc(x.t)+"</em>":esc(x.t);
    return '<span class="vs'+(lit?" hl":"")+'"><span class="vnum">'+x.v+'</span>'+txt+' </span>';
  }).join("");
  const head=hasCtx?esc(v.ref)+", with the verses either side":esc(v.ref);
  return '<div class="versebox proofbox"><div class="vr"><span>'+head+'</span></div><div class="vtext">'+body+'</div></div>';
}
