function renderCore(){
  const link=id=>byId[id]?`<button class="corelink" data-open="${id}">${esc(byId[id].title)} →</button>`:"";
  $("#main").innerHTML=`<div class="viewhead"><h2>The heart of it: the two portraits, and the clock</h2>
  <p>If you read nothing else on this section, read this page. The case that Jesus is Israel's Messiah does not require the New Testament — it can be made from the Tanakh, the Targum, and the Talmud. But it cannot be made at all until something else is said first.</p></div><figure class="corehero"><img src="https://commons.wikimedia.org/wiki/Special:FilePath/The%20Great%20Isaiah%20Scroll%20MS%20A%20(1QIsa)%20-%20Google%20Art%20Project.jpg?width=900" loading="lazy" alt=""><figcaption>The Great Isaiah Scroll, copied about 125 BC. Chapter 53 was already there, more than a century before Jesus was born.</figcaption></figure>
  <div class="corebox"><h3>0 · Before any text — name the history</h3>
  <p>The Rhineland massacres of 1096. The blood libel born at Norwich in 1144. Expulsion from England in 1290 and Spain in 1492. Forced disputations, Talmud burnings, Luther's <i>On the Jews and Their Lies</i> — quoted approvingly by the Nazi party four centuries later. Then Christian Europe, 1941–1945.</p>
  <p>Say this <b>unprompted</b>, before you open a single verse. Not as a preamble to get past, but because it is true, and because your friend has spent their life waiting for a Christian who will say it without being pushed. Romans 11 forbade every bit of it: <i>"Hath God cast away his people? God forbid."</i></p>
  <details class="srcdet"><summary>Open the cases behind this</summary><div class="corelinks" style="margin-top:12px">${link("hosea-blindness-restoration-romans-11")}${link("avoid-jews-killed-jesus")}</div></details></div>

  <div class="corebox"><h3>1 · Two portraits, conceded inside the tradition</h3>
  <p>The Tanakh gives two pictures of the coming one that appear impossible to reconcile: a conquering king of David's line, and a servant who is despised, pierced, and killed. This is not a Christian observation. The rabbis saw it, and Sukkah 52a resolves it with <b>two Messiahs</b> — Messiah ben Joseph, who suffers and is slain, and Messiah ben David, who reigns.</p>
  <p>The Christian claim is smaller than it sounds: not two figures, but one, twice. He came the first time as the servant; he comes again as the king. Every element of the rabbinic solution is preserved — only the arithmetic changes.</p>
  <details class="srcdet"><summary>Open the cases behind this</summary><div class="corelinks" style="margin-top:12px">${link("sukkah-52a-two-messiahs")}${link("isaiah-53-servant-distinct-from-israel")}</div></details></div>

  <div class="corebox"><h3>2 · Isaiah 53 was read of the Messiah before the argument started</h3>
  <p>Targum Jonathan — the ancient Aramaic rendering read in synagogues — opens the passage: <i>"Behold, my servant <b>the Messiah</b> shall prosper."</i> The national reading, that the servant is Israel, became standard only after Rashi in the eleventh century, when there was a very good reason for it to.</p>
  <p>And the chapter itself distinguishes the servant from the nation: he is stricken <i>"for the transgression of <b>my people</b>"</i> (53:8). A people cannot be stricken for the transgression of that same people. He is also sinless — <i>"he had done no violence, neither was any deceit in his mouth"</i> — which the prophets never say about Israel.</p>
  <p>The Great Isaiah Scroll settles the other objection permanently: the text was copied at Qumran more than a century before Jesus. Nobody edited it.</p>
  <details class="srcdet"><summary>Open the cases behind this</summary><div class="corelinks" style="margin-top:12px">${link("isaiah-53-rabbinic-messianic-reading")}${link("isaiah-53-servant-distinct-from-israel")}</div></details></div>

  <div class="corebox"><h3>3 · The one prophecy with a deadline</h3>
  <p>Almost any prophecy can be placed anywhere in history. Daniel 9 cannot: an anointed one is <b>cut off</b>, and only <i>afterwards</i> do the people of a coming prince destroy "the city and the sanctuary." The sanctuary fell in AD 70. Whatever the exact arithmetic of the seventy weeks — and the arithmetic is genuinely argued — the sequence has a terminus, and it has passed.</p>
  <p>Alongside it sits a record from the Talmud itself. <b>Yoma 39b</b> reports that for the <b>forty years before the destruction</b> the Yom Kippur lot ceased coming up in the right hand, the crimson thread stopped turning white, and the western lamp went out. Forty years before 70 is AD 30. That is not a Christian source; it is theirs.</p>
  <details class="srcdet"><summary>Open the cases behind this</summary><div class="corelinks" style="margin-top:12px">${link("daniel-9-cut-off-before-destruction")}${link("yoma-39b-forty-years")}</div></details></div>

  <div class="corebox"><h3>4 · The question the Torah leaves open</h3>
  <p>Leviticus 17:11 grounds atonement in blood on the altar. There has been no altar for nineteen centuries. The modern answer — prayer, repentance, and good deeds — is a serious and ancient adaptation, but it is not what the Torah says, and Judaism after 70 has had to build it.</p>
  <p>Ask it as a genuine question, once: <b>what grounds atonement now?</b> Then stop talking. And note that Jeremiah 31 — the promise of a <i>new covenant</i>, written on the heart, with sins remembered no more — is not a Christian invention at all. It is made, by name, with the house of Israel and the house of Judah.</p>
  <p class="pullq">"Behold, the days come, saith the LORD, that I will make a new covenant with the house of Israel, and with the house of Judah." — Jeremiah 31:31</p>
  <details class="srcdet"><summary>Open the cases behind this</summary><div class="corelinks" style="margin-top:12px">${link("atonement-after-the-temple")}${link("jeremiah-31-new-covenant")}</div></details></div>

  <div class="corebox"><h3>5 · You are not asking them to stop being Jewish</h3>
  <p>This is the sentence that reframes everything, and it should be said plainly: the first generation of Jesus-followers was entirely Jewish, arguing from the Tanakh in synagogues, keeping the feasts. The New Testament is a Jewish library — and modern Jewish scholars, Amy-Jill Levine and Daniel Boyarin among them, read it that way.</p>
  <p>The claim is not that a Gentile religion replaced Israel. Romans 11 says the opposite, explicitly, and calls Gentile believers the branch grafted in — warned, in the same breath, not to boast against the root. Whatever you say, do not repeat the error that produced a millennium of blood.</p>
  <p><button class="corelink" data-goto="share">How to actually have this conversation →</button></p></div>`;
  $("#main").querySelectorAll(".corelink").forEach(b=>{if(b.dataset.open)b.addEventListener("click",()=>openCase(b.dataset.open));});
  const g=$("#main").querySelector("[data-goto]");
  if(g)g.addEventListener("click",()=>{state.view="share";render();});
}
function renderShare(){
  $("#main").innerHTML=`<div class="viewhead"><h2>Sharing Jesus with a Jewish friend</h2>
  <p>The hardest conversation on this site, and the one that most demands humility. Not a campaign, not a technique — a friendship in which a real history is named honestly and a real question is eventually asked.</p></div>
  <div class="pb-h">The invitation to work toward</div>
  <div class="saybox"><span class="who">You, after real trust exists</span><p>"Would you read Isaiah 53 with me — and would you show me how the Targum and Sukkah 52a read it? I'd rather hear it from your sources than mine."</p></div>
  <p class="pd" style="font-size:.78rem;margin:0 0 4px">The whole posture is in that sentence: their library, their reading first, and you asking rather than telling. This is the one section of the site where you should expect to learn more than you teach.</p>

  <div class="pb-h">What actually reaches a Jewish friend</div><div class="pb-grid">
  <div class="pb"><span class="num">1</span><h4>Naming the history before you are asked</h4><p>Crusades, blood libel, expulsions, disputations, Luther, the Shoah. Say it unprompted and without a "but." Almost every Jewish person has met Christians who deflect this; being the one who doesn't is not a tactic, it is the minimum price of admission — and it is simply true.</p></div>
  <div class="pb"><span class="num">2</span><h4>Arguing from their sources, not yours</h4><p>The Targum on Isaiah 53. Sukkah 52a on the two Messiahs. Yoma 39b on the forty years. 4Q521 from the Dead Sea Scrolls. Every one of these is Jewish, most are pre-Christian or rabbinic, and none of them can be dismissed as a Christian gloss. This is the entire strategic difference between this section and the others.</p></div>
  <div class="pb"><span class="num">3</span><h4>One text at a time, with genuine listening</h4><p>Stacking prophecies feels powerful and lands as a pitch. Take one, ask how they read it, and actually consider the answer. Counter-missionary responses are serious and well-prepared; a Christian who engages the strongest form is rarer than one who has memorized twelve verses.</p></div>
  <div class="pb"><span class="num">4</span><h4>Friendship measured in years</h4><p>There is no version of this that works quickly, and pressure reads as exactly the coercion their ancestors experienced. The realistic aim of any single conversation is that they would be willing to have another one.</p></div>
  </div>

  <div class="pb-h">The method</div><div class="pb-grid">
  <div class="pb do"><h4>Say "Tanakh," not "Old Testament"</h4><p>"Old" implies superseded, and supersession is the theology behind the history. Small vocabulary choices — Tanakh, Yeshua if it's natural, "the Hebrew Scriptures" — signal that you know whose book you are holding.</p></div>
  <div class="pb do"><h4>Concede what is genuinely contested</h4><p>Isaiah 7:14 is weaker than most Christians are taught. Psalm 22:16 has a real textual question. Daniel's seventy weeks have several defensible arithmetics. Saying so, unprompted, is what buys credibility for Isaiah 53, Daniel's terminus, and Yoma 39b — the arguments that actually hold.</p></div>
  <div class="pb do"><h4>Let Romans 11 govern your posture</h4><p>Not a courtesy — a command. God has not cast away his people; the Gentile branch is grafted in and told explicitly not to boast against the root. A Christian who holds that verse cannot patronize a Jewish friend, and one who doesn't will eventually do so.</p></div>
  <div class="pb dont"><h4>Never say "the Jews killed Jesus"</h4><p>The deicide charge is the theological engine of a thousand years of massacre. It is also bad theology — a Roman prefect ordered the execution, and the New Testament's own account puts the responsibility on all of us. If it is in your vocabulary, take it out permanently.</p></div>
  <div class="pb dont"><h4>Don't quote-mine the Talmud</h4><p>Most viral "the Talmud says…" quotations are fabricated, mistranslated, or stripped of a context that reverses them — and they descend directly from medieval disputation propaganda. If you cannot read the passage in context on Sefaria, do not use it.</p></div>
  <div class="pb dont"><h4>Don't caricature Judaism as works-righteousness</h4><p>Second-Temple Judaism was a religion of covenant grace with obligations, not a merit ledger — and saying otherwise tells your friend you have never actually asked them what they believe. Ask instead. You will learn something, and you will be trusted with the answer.</p></div>
  </div>

  <div class="pb-h" style="margin-top:34px">How it actually goes — the deeper craft</div>
  <p class="sh-open">Targum Jonathan opens Isaiah 52:13: <span class="hl">"Behold, my servant the Messiah shall prosper."</span></p>
  <p class="sh-att">— an ancient Jewish rendering, read in synagogues, long before there was an argument to win</p>

  <div class="sa"><h4 class="sat">The four questions that do the most work</h4>
  <ol class="sh-list">
    <li><b style="color:var(--ink)">"How do you read Sukkah 52a?"</b> The two-Messiah doctrine concedes the two portraits. You are not disputing their tradition — you are asking why one figure twice is harder than two figures once.</li>
    <li><b style="color:var(--ink)">"Daniel says an anointed one is cut off before the sanctuary is destroyed. Who?"</b> The sequence has a terminus and the terminus has passed. Skip the arithmetic of the weeks; the order of events is the argument.</li>
    <li><b style="color:var(--ink)">"Leviticus 17:11 grounds atonement in blood on an altar. What grounds it now?"</b> Ask once, gently, and stop. It is the question Judaism has had to answer for nineteen centuries without the text that names the answer.</li>
    <li><b style="color:var(--ink)">"Who is Jeremiah's new covenant made with?"</b> Israel and Judah, by name. The phrase is not a Christian import; it is a Jewish prophet's promise, and it dissolves the "you invented a new religion" frame before it forms.</li>
  </ol></div>

  <div class="sa"><h4 class="sat">Start here</h4>
  <p class="pd">The <b>servant path</b> walks Isaiah 53 through the Targum and the Talmud — the one argument made entirely from their own library. Every case page ends with a suggested question and a scripted back-and-forth ("How the conversation usually goes") with the counter-missionary reply included.</p>
  <button class="start" data-goto-path="servant">Open the servant path →</button></div>${DATA.some(d=>d.avoid)?`<div class="pb-h" style="margin-top:30px">Arguments that will embarrass you — do not use these</div><p class="pd" style="font-size:.8rem;margin:0 0 10px">Popular claims that are false or overclaimed. Each links to the correction — repeating them hands the other side an easy win and discredits your true arguments.</p><div class="relrow">${DATA.filter(d=>d.avoid).map(d=>`<button data-open="${d.id}">⚠ ${esc(d.title)}</button>`).join("")}</div>`:""}`;
  const b=$("#main").querySelector("[data-goto-path]");
  if(b)b.addEventListener("click",()=>{const p=PATHS.find(x=>x.id===b.dataset.gotoPath);if(!p)return;state.pathId=p.id;const read=store.read;const next=p.items.find(i=>!read.has(i))||p.items[0];openCase(next,true);});
  bindOpens();
}

const PROOFS=[{"v":"Numbers 23:19 / Hosea 11:9","they":"'God is not a man, that he should lie' — 'I am God and not a man, the Holy One in your midst.' The incarnation is flatly excluded: whatever God is, he is not a man, and no Jew may believe otherwise.","you":"Both verses are about God's character — he doesn't lie, waver, or rage like men do — not about what God is unable to do. The Tanakh itself shows YHWH appearing as a man: he eats with Abraham at Mamre (Gen 18), wrestles Jacob who says 'I have seen God face to face' (Gen 32), and sends the angel in whom 'my Name is' (Ex 23:21). The claim was never that a man became God — it's that the God of Israel entered his own creation, which Hosea's 'in your midst' sits closer to than you'd expect.","refs":"Genesis 18:1-15 · Genesis 32:24-30 · Exodus 23:20-21 · Zechariah 12:10"},{"v":"Deuteronomy 6:4","they":"'Hear, O Israel: the LORD our God, the LORD is one.' The Shema is Judaism's heartbeat, and the Trinity breaks it. Three persons is three gods with extra steps — Maimonides made absolute, indivisible unity a principle of the faith.","you":"Christians affirm the Shema — Yeshua himself quoted it verbatim as the greatest commandment (Mark 12:29). Echad can name a composite unity ('one flesh,' Gen 2:24; 'one cluster,' Num 13:23), though that alone proves nothing. What the Tanakh does carry are unresolved seams — 'let us make man' (Gen 1:26), 'the Lord GOD has sent me, and his Spirit' (Isa 48:16), 'what is his name, and what is his son's name?' (Prov 30:4). Not proofs — concede that — but cracks in the claim that the text is unitarian by definition. Trinity is a claim about the inner life of the one YHWH, not a roster of gods.","refs":"Genesis 1:26 · Genesis 2:24 · Isaiah 48:16 · Proverbs 30:4"},{"v":"Ezekiel 18:20 / Deuteronomy 24:16","they":"'The soul who sins shall die. The son shall not bear the iniquity of the father.' 'Each shall be put to death for his own sin.' Vicarious atonement — an innocent dying for the guilty — is anti-Torah on its face.","you":"Ezekiel 18 answers a proverb about inherited guilt ('the fathers ate sour grapes...'), and Deut 24:16 governs human courts — neither repeals the sacrificial system, which is voluntary substitution from end to end: hands pressed on the scapegoat's head, 'and the goat shall bear all their iniquities' (Lev 16:22); blood given by God 'to make atonement for your souls' (Lev 17:11). The line the Torah draws is between punishing an unwilling bystander and accepting a willing offering. Isaiah 53:10 puts the servant on the offering side: his soul is made an asham — a guilt offering — and he 'poured out his soul to death' himself.","refs":"Leviticus 16:21-22 · Leviticus 17:11 · Isaiah 53:10-12 · Ezekiel 18:2-4"},{"v":"Isaiah 43:11","they":"'I, I am the LORD, and besides me there is no savior.' Salvation belongs to God alone. Trusting a man named Jesus for salvation is, by this verse, idolatry by definition.","you":"Total agreement: no one but YHWH saves. That is precisely the Christian claim — Yeshua's name means 'YHWH saves,' and the NT applies Isaiah's own exclusive language ('to me every knee shall bow,' Isa 45:23) to him not as a second deity but as YHWH's own arm revealed (Isa 53:1). Either that identification is true, or Christianity is idolatry — this verse doesn't settle the question; it frames it exactly right. The dispute was never whether God alone saves, but whether God did it himself, in person.","refs":"Isaiah 45:21-23 · Isaiah 53:1 · Joel 2:32 · Zechariah 14:9"},{"v":"Deuteronomy 13:1-5","they":"The prophet who works real signs and then says 'let us go after other gods' must be rejected — miracles included. This is the Torah's standing verdict on Jesus: whatever he did, worship of him leads Israel after a god our fathers did not know.","you":"Honor the test — it's the right one. But its hinge is 'gods your fathers have not known,' and that's the entire dispute: Yeshua's first followers were Shema-praying, temple-attending Jews who claimed he was the God of Abraham's own arm, not a new god. Deut 13 rightly condemns every paganized Christ Christendom ever built; what it can't do is adjudicate the identity question by itself. Deut 18:15-19's true-prophet test — the prophet like Moses whom Israel must hear — has to be run alongside it.","refs":"Deuteronomy 18:15-19 · Isaiah 53:1 · Exodus 3:15"},{"v":"Psalm 146:3","they":"'Put not your trust in princes, in a son of man, in whom there is no salvation.' The psalmist could not be clearer: staking your soul on any human being — any son of man — is exactly what our scriptures forbid.","you":"Read the next verse: 'his breath departs, he returns to the earth; on that very day his plans perish.' The warning is against trusting what dies and stays dead — mortal power. The Christian claim is resurrection: a Messiah whose death did not hold him (Ps 16:10, 'you will not abandon my soul to Sheol'). And the Tanakh itself presents one 'like a son of man' coming with the clouds who receives everlasting dominion and the service of all peoples (Dan 7:13-14) — and a king in Psalm 2 whom the nations are told to serve, though the 'kiss the son' reading there is text-critically contested and shouldn't be leaned on alone.","refs":"Psalm 146:4 · Daniel 7:13-14 · Psalm 16:10 · Psalm 2:6-12"}];

const THEYSAY=[{"say":"Jews don't believe in Jesus — that's basically the one thing all Jews agree on.","quick":"Modern consensus, yes — but the first generation of Jesus-followers was entirely Jewish, arguing from Tanakh in synagogues. The question was born inside Judaism, not imported into it.","id":"nt-jewishness"},{"say":"The Messiah brings world peace. Look around — did he come?","quick":"That's one of the Tanakh's two portraits. The other is a king 'lowly, riding on a donkey' who is 'pierced' and mourned. The rabbis felt the tension so sharply they posited two Messiahs.","id":"two-messiahs-rabbinic"},{"say":"Isaiah 53 is about Israel, not Jesus. Read chapter 41 — the servant is named Israel.","quick":"The national reading is real — but Targum Jonathan opens the passage 'my servant the Messiah,' Sanhedrin 98b names Messiah from 53:4, and 53:8 says the servant is stricken 'for the transgression of my people' — someone distinct from the people.","id":"isaiah-53-servant"},{"say":"Christians mistranslate our scriptures. Almah means young woman, not virgin.","quick":"Concede it: almah is 'young woman'; betulah is the technical term. But the pre-Christian Jewish translators of the Septuagint chose parthenos — 'virgin' — centuries before Matthew was born.","id":"isaiah-7-14-almah"},{"say":"God is not a man — Numbers 23:19. That ends the conversation.","quick":"In context it means God doesn't lie or waver. The Tanakh itself shows YHWH appearing in human form — eating with Abraham (Gen 18), wrestling Jacob (Gen 32) — and in Zechariah 12:10 YHWH says 'they will look on ME whom they pierced.'","id":"zechariah-pierced"},{"say":"We don't need a middleman. We repent directly to God.","quick":"The Torah's own system was all mediation — priests, altar, blood, Yom Kippur. Leviticus 17:11 says God gave blood to make atonement. The real question is what replaced that in 70 CE, and on whose authority.","id":"temple-atonement-problem"},{"say":"For a Jew, Christianity is idolatry. Worshiping a man is the one unforgivable line.","quick":"If Yeshua is merely a man, agreed — full stop. The dispute isn't whether idolatry is evil; it's whether the pierced one of Zechariah 12:10, whom YHWH calls 'me,' is a second god or the God of Israel come near.","id":"nt-jewishness"},{"say":"After the Holocaust, how can you possibly ask Jews to convert?","quick":"No glib answer exists. Own the history first, unprompted. Then gently separate baptized Europe's crimes from a first-century Jewish claim made by Jews, from Jewish scripture, before Christendom existed to sin.","id":"nt-jewishness"},{"say":"My family would sit shiva for me. You're asking me to die to my people.","quick":"Take it at face value — the cost is real, even where the practice has softened. Never minimize it. The counter-claim isn't 'leave your people'; it's that following Israel's Messiah is the most Jewish thing a Jew can do.","id":"nt-jewishness"},{"say":"Jesus didn't fulfill the prophecies — no third temple, no ingathering, no peace.","quick":"Those belong to the reigning-king portrait, still outstanding — Christians agree. But the suffering portrait (Zech 9:9, 12:10; Isa 53; Ps 22) plus Daniel 9's timestamp had a deadline before 70 CE. Two portraits, one Messiah, two acts.","id":"second-temple-expectation"},{"say":"The virgin birth is recycled paganism — gods impregnating women.","quick":"The pagan stories are lust narratives with demigod offspring. Isaiah's sign and Matthew's account have no divine consort and arise in the most anti-pagan milieu in antiquity. And the LXX's parthenos is a Jewish reading, pre-Christian.","id":"isaiah-7-14-almah"},{"say":"You can't use the New Testament to prove the New Testament.","quick":"Agreed — so don't. The case runs on Tanakh alone: Isaiah 53, Daniel 9, Zechariah 9 and 12, Psalm 22, Genesis 49. The NT then enters as first-century Jewish testimony to be tested against those texts, not as the premise.","id":"daniel-9-seventy-weeks"},{"say":"You quote our Talmud when it suits you — Yoma 39b is aggadah, not history.","quick":"Fair hit. Hold it loosely: not proof, but the tradition's own memory that the Yom Kippur signs went dark for the final forty years before the destruction — starting, on its own math, around 30 CE.","id":"yoma-39b-crimson-thread"},{"say":"Genesis 49:10 is deathbed poetry, not a messianic countdown.","quick":"Targum Onkelos didn't think so — it renders 'until Shiloh comes' as 'until Messiah comes, to whom the kingdom belongs.' The question isn't a stopwatch; it's where Judah's scepter-story was heading, and when it bent.","id":"genesis-49-scepter"},{"say":"Jeremiah's new covenant is the same Torah with a new heart — nothing about a new mediator.","quick":"Torah internalized, yes — but Jeremiah says 'NOT like the covenant I made with their fathers' (31:32), and it ends in forgiveness so final that sin is 'remembered no more.' New in kind, and the mechanism question hangs over verse 34.","id":"jeremiah-new-covenant"},{"say":"Psalm 22 says 'like a lion,' not 'they pierced' — Christians doctored the text.","quick":"The Masoretic Text reads ka'ari ('like a lion' — which leaves the clause verbless). The Nahal Hever scroll appears to read ka'aru ('they dug/pierced') and the pre-Christian Septuagint already read a verb. Genuinely contested — say so — and the psalm's crucifixion-shaped picture stands on far more than one word.","id":"psalm-22-pierced"}];
const LESSONS=[{"n":1,"t":"Earn the right to speak","what":["Before any verse, name what 'Christian' has meant to Jewish families — unprompted: the Rhineland massacres of 1096, the blood libel born at Norwich in 1144, expulsions from England (1290) and Spain (1492), forced disputations and Talmud burnings, Luther's 1543 'On the Jews and Their Lies,' and a Holocaust incubated in baptized Europe. Carry this history so they never have to explain it to you. Nothing else you say will land until this is on the table honestly."],"ask":"What has the word 'Christian' meant in your family's story?","ids":["nt-jewishness"]},{"n":2,"t":"Find the shared text","what":["Move the conversation onto ground you both accept: the Tanakh, in their canon and their categories — Torah, Nevi'im, Ketuvim; Mashiach ben David; teshuvah; olam haba. No New Testament on the table yet, no proof-texting — whole chapters, read together. A Christian who has actually read Torah (even the weekly parashah) changes the entire register of the conversation."],"ask":"Would you study the Prophets with me — just the Tanakh, nothing of mine on the table?","ids":["isaiah-53-servant","genesis-49-scepter"]},{"n":3,"t":"The two portraits problem","what":["The Tanakh draws the Messiah twice: a reigning son of David with the nations at peace (Isa 2, 11; Dan 7) — and a figure lowly on a donkey (Zech 9:9), pierced and mourned like an only son (Zech 12:10), despised, rejected, and crushed (Isa 53; Ps 22). The rabbis saw both portraits too: their solution was two Messiahs — ben Joseph who dies in battle (Sukkah 52a, citing Zech 12:10) and ben David who reigns. The Christian claim is simpler arithmetic: one Messiah, two acts."],"ask":"What in the text forced the rabbis to invent a Messiah who dies?","ids":["two-messiahs-rabbinic","zechariah-pierced"]},{"n":4,"t":"The timing problem","what":["Daniel 9:26 puts an anointed one 'cut off' BEFORE the people of a coming prince destroy the city and the sanctuary — before 70 CE. Genesis 49:10 keeps the scepter in Judah 'until Shiloh comes,' which Targum Onkelos reads as Messiah. And Yoma 39b preserves the tradition's own memory that for the final forty years before the destruction — from about 30 CE — the Yom Kippur lot stopped coming up in the right hand and the crimson thread stopped turning white. Whoever the Messiah is, the window the shared text draws is behind us."],"ask":"If an anointed one had to be cut off before the Second Temple fell — who was it?","ids":["daniel-9-seventy-weeks","yoma-39b-crimson-thread","genesis-49-scepter","second-temple-expectation"]},{"n":5,"t":"The atonement question","what":["Leviticus 17:11 is God's own stated mechanism: 'the life of the flesh is in the blood, and I have given it to you on the altar to make atonement for your souls.' Yom Kippur was the system's heart. Since 70 CE, rabbinic Judaism has substituted repentance, prayer, and tzedakah (Hosea 14:2; Yohanan ben Zakkai in Avot d'Rabbi Natan 4) — a pastoral answer given in catastrophe, but one the Torah itself is never recorded giving. Ask it as an honest question, not a gotcha; this is the ache Yom Kippur itself carries."],"ask":"On Yom Kippur, what carries your sins now — and where does the Torah say that suffices?","ids":["temple-atonement-problem","jeremiah-new-covenant"]},{"n":6,"t":"The invitation","what":["The famous move: read Isaiah 52:13–53:12 aloud together without saying where it's from, and let them tell you it sounds like the New Testament — then show them it's Isaiah, from their own scroll, centuries before Yeshua. Then one invitation, transparent about what you're asking: read the Gospel of Matthew — the most Jewish of the four, opening with a toledot from Abraham, structured around Torah, fluent in fulfillment. Not a scalp. An open book, one chapter a week, and they hold you accountable to their text."],"ask":"Read Matthew with me as a Jewish book — one chapter a week, and you keep me honest?","ids":["isaiah-53-servant","nt-jewishness"]}];

function bindOpens(){document.querySelectorAll("#main [data-open]").forEach(b=>b.addEventListener("click",()=>openCase(b.dataset.open)));}
function renderTheySay(){
  $("#main").innerHTML=`<div class="viewhead"><h2>They just said…</h2>
  <p>Real conversations start with a line, not a topic. Find the line you just heard, answer in two sentences, then open the full case together. Use the search box to jump (Ctrl+F works too).</p></div>`+
  THEYSAY.map(t=>`<div class="ptcard"><h3 class="ptv">“${esc(t.say)}”</h3>
    <div class="who you">Your two sentences</div><p class="pt">${rich(t.quick)}</p>
    <div class="relrow"><button data-open="${t.id}">Open the full case: ${esc((byId[t.id]||{}).title||t.id)}</button></div></div>`).join("");
  bindOpens();
}
function renderLessons(){
  $("#main").innerHTML=`<div class="viewhead"><h2>Earning the conversation</h2>
  <p>There is no script to counter here — this is the other direction. These are the stages of a real friendship in which this conversation becomes possible: earning the right to speak, listening first, asking rather than telling, and knowing when to stop. Each stage carries the one thing to do right then, and the cases behind it.</p></div>`+
  LESSONS.map(L=>`<div class="sa"><span class="tpx">${esc(L.n)}</span><h4 class="sat">${esc(L.t)}</h4><div class="who them">What happens</div><p class="pt">${(Array.isArray(L.what)?L.what:[L.what]).map(w=>"• "+esc(w)).join("<br>")}</p>
    <div class="saybox" style="margin-top:12px"><span class="who">The question to ask</span><p>${rich(L.ask)}</p></div>
    <div class="relrow">${L.ids.map(id=>byId[id]?`<button data-open="${id}">${esc(byId[id].title)}</button>`:"").join("")}</div></div>`).join("");
  bindOpens();
}
const KNOW={"didyouknow":[{"t":"The Targum calls Isaiah's servant 'the Messiah'","d":"Targum Jonathan (the ancient Aramaic rendering of the Prophets) opens the passage: 'Behold, my servant the Messiah shall prosper.' But it then reroutes all the suffering onto Israel and the nations, leaving the Messiah only triumph — evidence both that the messianic reading is ancient and that the suffering made its readers flinch.","src":"Targum Jonathan on Isaiah 52:13–53:12","id":"isaiah-53-servant"},{"t":"The Talmud's Messiah sits among the lepers","d":"In Sanhedrin 98a, Elijah tells Rabbi Joshua ben Levi that the Messiah is already here — sitting among the suffering poor at the gates of Rome, untying and retying his bandages one at a time so that he's ready the instant he is summoned.","src":"b. Sanhedrin 98a","id":"two-messiahs-rabbinic"},{"t":"One rabbinic name for Messiah: 'the leper scholar'","d":"Sanhedrin 98b records sages deriving the Messiah's name from Isaiah 53:4 — 'surely he has borne our sicknesses... yet we esteemed him stricken' — applying the suffering-servant text directly to the Messiah.","src":"b. Sanhedrin 98b","id":"isaiah-53-servant"},{"t":"Yoma 39b: forty dark years","d":"The Talmud reports that for the last forty years before the Temple's destruction in 70 CE — that is, from about 30 CE — the Yom Kippur lot stopped coming up in the right hand, the crimson thread stopped turning white, the westernmost lamp went out, and the Temple doors opened by themselves.","src":"b. Yoma 39b","id":"yoma-39b-crimson-thread"},{"t":"The rabbis' own two-Messiah doctrine","d":"Facing texts where Messiah both dies and reigns, the Talmud posits Messiah ben Joseph, who is killed in battle — with Zechariah 12:10's mourning for the pierced one applied to him — followed by Messiah ben David, who reigns. Two Messiahs, or one Messiah in two acts: that's the whole debate in miniature.","src":"b. Sukkah 52a","id":"two-messiahs-rabbinic"},{"t":"Daily messianic expectation is a Jewish principle of faith","d":"Maimonides' twelfth principle: 'I believe with perfect faith in the coming of the Messiah; and though he tarry, I will wait daily for his coming.' Awaiting a personal Messiah is not a Christian import — it's codified rabbinic doctrine sung in the Ani Ma'amin.","src":"Rambam, commentary on Mishnah Sanhedrin ch. 10 (Perek Chelek)","id":"second-temple-expectation"},{"t":"Barcelona, 1263: why 'let's study together' can sound like a trap","d":"Nachmanides (Ramban) was compelled to debate the convert Pablo Christiani before King James I of Aragon. He argued brilliantly — including that aggadic passages aren't binding — was rewarded by the king, and still had to leave Aragon under church pressure. Coerced disputations are part of why Jewish friends may hear a Bible-study invitation as an ambush.","src":"Vikuach ha-Ramban; records of the Disputation of Barcelona, 1263"},{"t":"The Aleppo Codex is a shared treasure","d":"The crown jewel of the Masoretic text (~930 CE, vocalized by Aaron ben Asher's tradition) was damaged in the 1947 Aleppo riots — most of its Torah is still missing. Together with the Leningrad Codex (1008 CE) it anchors the Hebrew Bible that Jews and Christians both read.","src":"Ben-Zvi Institute / Israel Museum documentation"},{"t":"Isaiah 53 was in the ground before the debate began","d":"The Great Isaiah Scroll from Qumran (1QIsaᵃ, ~125 BCE) contains the whole book, a millennium older than the medieval codices — and substantially the same text, chapter 53 included. Nobody edited the servant in later.","src":"1QIsaᵃ, Shrine of the Book, Israel Museum"},{"t":"The Messianic Jewish movement is small but real","d":"Commonly cited estimates — all contested — run roughly 175,000–250,000 Messianic Jews in the US across ~350–400 congregations, and about 15,000 (claims range to 30,000) in Israel in 130+ congregations. Counter-missionary organizations dispute the definitions and the counts; treat every figure as an estimate.","src":"Israel Today / One for Israel surveys; disputed by Jews for Judaism"},{"t":"Israelis reading Isaiah 53 cold","d":"A persistent (and admittedly anecdotal) street-interview phenomenon: Hebrew speakers handed Isaiah 53 without a citation routinely guess it comes from the New Testament. No translation argument needed — the chapter does its own work in the original.","src":"e.g. One for Israel street-interview projects (anecdotal)","id":"isaiah-53-servant"},{"t":"Jewish believers you may already be quoting","d":"Alfred Edersheim, the Vienna-born Jewish convert, wrote the classic 'Life and Times of Jesus the Messiah.' Joseph Rabinowitz founded the 'Israelites of the New Covenant' in 1880s Kishinev — widely counted the first modern Messianic congregation, decades before 'Jews for Jesus' existed.","src":"Edersheim biographies; Kai Kjær-Hansen's research on Rabinowitz"},{"t":"Sitting shiva for converts — real, and softening","d":"Mourning a family member who accepted Jesus as though they had died was genuine traditional practice. In much of the modern community it has softened into grief, anger, and distance rather than formal shiva — but the fear your friend voices is not rhetorical.","src":"Responsa literature; contemporary Jewish communal discussion"},{"t":"Chabad has its own Messiah debate","d":"Many Lubavitcher Hasidim regarded the Rebbe, Menachem Mendel Schneerson, as the presumptive Messiah; after his death in 1994 a meshichist wing continued — some still do. Orthodox critic David Berger wrote a whole book protesting that a posthumous Messiah candidacy had become tolerable inside Orthodoxy. Relevant, gently: the concept of a Messiah whose career death doesn't terminate is not unthinkable in Jewish terms.","src":"David Berger, 'The Rebbe, the Messiah, and the Scandal of Orthodox Indifference' (2001)"},{"t":"Two obsessive scribal traditions","d":"The Masoretes counted letters and marked the exact middle of books to keep the Hebrew Bible stable; the Greek New Testament survives in roughly 5,800 catalogued manuscripts — the two best-attested textual traditions of antiquity. Both faiths stand on scribes who counted.","src":"Masoretic apparatus; INTF (Münster) Greek NT manuscript catalogue"}],"week":[{"t":"Shabbat","d":"Friday sundown to Saturday nightfall: candles, kiddush, family table; for the observant, no 'work' across 39 defined categories — driving, writing, and phones included at the Orthodox end.","tip":"Never schedule anything for Friday night or Saturday without asking. 'Shabbat shalom' on a Friday is always right."},{"t":"Kosher","d":"No pork or shellfish, meat and dairy separated, certification symbols on packaging — with observance ranging from strict to 'kosher-style' to none at all.","tip":"Ask 'do you keep kosher, and how strictly?' before hosting. A certified restaurant or sealed kosher food honors them more than your best home cooking."},{"t":"The High Holy Days","d":"Rosh Hashanah opens ten Days of Awe that close with Yom Kippur: a 25-hour fast, confession, and the liturgy's raw question of who will live and who will die — atonement sought, since 70 CE, without a temple or blood.","tip":"Yom Kippur's ache is the open door — but never exploit it in the moment. Be a friend during the fast; have the conversation another day."},{"t":"Passover","d":"The seder is the year's great table liturgy — exodus retold, questions scripted, matzah for a week. Being invited to a seder is an honor, not a courtesy.","tip":"Accept the invitation and read the Haggadah beforehand. Watch the afikoman: matzah broken, wrapped, hidden, and brought back — and ask your host what it means."},{"t":"The denominational spectrum","d":"Orthodox (Haredi to Modern), Conservative, Reform, Reconstructionist — and a large secular/cultural majority among American Jews for whom Jewishness is peoplehood more than belief.","tip":"Never assume observance or theology. Many proudly Jewish friends are functionally agnostic. ASK what Judaism means to them — the answer is the map."},{"t":"Bar and bat mitzvah","d":"At 13 (12 for girls in many communities) a child becomes accountable to the commandments, marked by reading Torah publicly — years of preparation for one morning.","tip":"If invited, go. Wear the kippah offered at the door. Gifts traditionally come in multiples of 18 — chai, 'life.'"},{"t":"Mezuzah and tefillin","d":"Deuteronomy 6:4-9 taken literally: the Shema handwritten on parchment fixed to the doorpost, and bound in boxes on arm and forehead in prayer.","tip":"These are Scripture enacted. Asking respectfully about the mezuzah on their door is already a Bible conversation."},{"t":"Israel","d":"For most Jews an emotional center regardless of their politics — the never-again insurance policy after the Holocaust. Criticism from outsiders lands differently than criticism from inside.","tip":"Don't lead with your politics in either direction. Ask about family there before you ever offer an opinion."},{"t":"The rest of the calendar","d":"Hanukkah (Maccabean rededication — not 'Jewish Christmas'), Purim (Esther, costumes, noise), Sukkot (booths, harvest joy). The year breathes through these.","tip":"Two fun reversals: the Maccabee story survives in books Christians preserved (1–2 Maccabees), and John 10:22 has Yeshua at the temple for Hanukkah."}],"aboutyou":[{"t":"What 'Christian' has meant to their family","d":"Crusader massacres of Rhineland Jewish communities (1096), the blood libel born in Norwich (1144) and repeated for centuries, Easter pogroms, expulsions (England 1290, Spain 1492), forced conversions and disputations, ghettos, Luther's 1543 'On the Jews and Their Lies' — later reprinted by the Nazis — and a Holocaust that grew in baptized Europe's soil.","tip":"Carry this history yourself and name it first, unprompted — so they never have to explain it to you."},{"t":"'Messianic Jews' read as deception","d":"Mainstream Judaism across denominations regards Messianic Judaism as Christianity in Jewish costume — a missionary tactic targeting the vulnerable — and Israel's establishment largely treats Messianic Jews as converts to another religion.","tip":"Don't open by litigating the label. Be ruthlessly transparent about what you believe and what you're hoping for; hidden agendas confirm the charge."},{"t":"Missionary suspicion is earned","d":"Organized evangelism of Jews reads as the old coercion by softer means; 'Jews for Jesus' is, for many, a byword for bait-and-switch. The word 'mission' itself carries freight.","tip":"Never disguise the invitation. A 'no agenda' Bible study that turns out to have one validates every fear for a decade."},{"t":"Intermarriage is the existential fear","d":"American Jewry's deepest anxiety is disappearance by assimilation — every child lost to another faith is subtraction from a people that six million were already taken from.","tip":"Honor Jewish continuity concretely: support their kids' Jewish education, celebrate the holidays with them, never frame Jewishness as something to leave."},{"t":"'Judeo-Christian' lands differently than you think","d":"Christians say it as kinship; many Jews hear their living tradition absorbed as a prologue to someone else's religion — flattened into a hyphen.","tip":"Say 'Jewish and Christian' and let the real differences stand. Respect reads as respect only when difference is allowed to exist."},{"t":"Replacement theology fed the crimes","d":"Supersessionism — the church replacing Israel — is the theological root system under most of the history above. Paul warned the first Gentile generation against exactly this arrogance (Romans 11:17-24), and Romans 1:16 keeps the gospel 'to the Jew first.'","tip":"Be able to say plainly, and mean it: 'God has not rejected his people' (Rom 11:1). If your theology can't say that, fix the theology before the friendship."},{"t":"They assume you've never read Torah","d":"Most Christians they've met know less Tanakh than a bar mitzvah kid — quoting Isaiah 53 without ever having read Leviticus. The assumption is usually correct.","tip":"Read Torah seriously — even follow the weekly parashah. A Christian who knows Vayikra changes the entire conversation."},{"t":"You're asking for more than a belief change","d":"For your friend, saying yes to Yeshua risks family, community, identity, possibly a cemetery plot — some families still sit shiva. It is experienced as betrayal of a persecuted people, not as a private opinion swap.","tip":"Never minimize the cost — Yeshua didn't (Luke 14:26-33). Offer belonging alongside the argument, and patience measured in years."},{"t":"The memory is in living tissue, not textbooks","d":"The stories above aren't ancient history to them — they're grandparents' accounts, a family tree with burned branches. Your friendly invitation arrives inside that inheritance whether you intend it or not.","tip":"You are one page in a very long story between your faith and their family. Act like it: slow, honest, and there next year."}],"doctrine":[{"topic":"God's oneness","theirs":"Absolute, indivisible unity — Maimonides' second principle. God is one in a way that admits no persons, parts, or incarnation; for a Jew, compromising this is the definition of avodah zarah.","bible":"The same Shema, affirmed — Yeshua quotes Deut 6:4 verbatim as the greatest commandment (Mark 12:29). The claim is tri-unity within the one YHWH — whose Word, Spirit, and Presence already act as God in the Tanakh and Targums (Memra, Shekhinah) — never three gods.","key":"Deuteronomy 6:4; Genesis 1:26; Isaiah 48:16"},{"topic":"The Messiah's job description","theirs":"A human king of David's line who gathers the exiles, rebuilds the Temple, brings world peace and universal knowledge of God (Rambam, Hilchot Melachim 11). Accomplish the list or you are not he — no second chances, no second comings.","bible":"The same résumé in two acts: first the lowly, pierced, rejected figure (Zech 9:9; 12:10; Isa 53), then the reigning Son of David (Isa 9:6-7; Dan 7:13-14). The rabbis' own ben Joseph/ben David doctrine concedes the texts demand both portraits.","key":"Zechariah 9:9; Isaiah 9:6-7; Daniel 7:13-14"},{"topic":"Atonement after the Temple","theirs":"Repentance, prayer, and charity stand in for sacrifice (Hos 14:2; Yohanan ben Zakkai in Avot d'Rabbi Natan 4: deeds of lovingkindness atone); the day of Yom Kippur itself atones for those who repent.","bible":"Lev 17:11 makes blood God's stated means of atonement, and the Torah never records its repeal. Isaiah 53:10 presents a final asham — a willing guilt offering — after which the new covenant's verdict is 'their sin I will remember no more' (Jer 31:34).","key":"Leviticus 17:11; Isaiah 53:10; Jeremiah 31:34"},{"topic":"The afterlife","theirs":"Genuinely varied: olam haba, resurrection of the dead (Rambam's thirteenth principle, the Amidah's second blessing), Gehinnom as mostly a temporary purgation (traditionally capped near twelve months), and broad modern agnosticism about all of it.","bible":"Resurrection and final judgment (Dan 12:2), eternal life through the Messiah, new creation. More continuity here than either side assumes — resurrection is a shared inheritance, not a Christian invention.","key":"Daniel 12:2; Isaiah 26:19; Job 19:25-27"},{"topic":"Torah and covenant","theirs":"The Sinai covenant is eternal; the 613 commandments bind Jews forever; the Oral Torah is Sinai's authorized interpretation. Any 'new covenant' that loosens Torah self-refutes.","bible":"Torah is holy and unrevoked — 'I did not come to abolish' (Matt 5:17). Jeremiah's new covenant writes Torah on hearts rather than erasing it (31:33), and Acts 15 brings Gentiles in as Gentiles without converting them into Jews — Isaiah's nations streaming to Zion, not Sinai repealed.","key":"Jeremiah 31:33; Matthew 5:17-18; Isaiah 2:2-3"},{"topic":"The election of Israel","theirs":"Israel's chosenness is irrevocable — am segulah, covenant people forever. Christian supersessionism is the oldest and deadliest move against them.","bible":"Unqualified agreement, and non-negotiable for the Christian side: 'the gifts and the calling of God are irrevocable' (Rom 11:29); 'has God rejected his people? By no means!' (11:1). The church is grafted into Israel's olive tree — it never replaces it. No replacementism, full stop.","key":"Romans 11:1, 17-29; Genesis 12:3; Jeremiah 31:35-37"},{"topic":"Sin and repentance","theirs":"Every person has a yetzer hara and yetzer hatov — an evil and a good inclination — and teshuvah is always available, directly, no mediator required. No original sin; the soul arrives pure.","bible":"Teshuvah is affirmed and commanded (Ezek 18:30-32) — but the Tanakh's own diagnosis runs darker: 'every intent of the thoughts of his heart only evil continually' (Gen 6:5), 'the heart is deceitful above all things' (Jer 17:9), 'there is no one righteous' (Eccl 7:20). The question is never whether God forgives, but on what basis a holy God does.","key":"Jeremiah 17:9; Psalm 51; Ecclesiastes 7:20"},{"topic":"The servant of Isaiah","theirs":"Israel personified — the servant is explicitly named Israel (Isa 41:8; 44:1; 49:3), and chapter 53 is the astonished nations confessing what they did to the Jewish people in exile. Rashi, Ibn Ezra, and Radak all read it nationally.","bible":"Within the Servant Songs the servant is also distinguished from Israel — commissioned to bring Jacob back (49:5-6), innocent of violence and deceit (53:9), stricken 'for the transgression of my people' (53:8). Targum Jonathan calls him Messiah; Sanhedrin 98b names Messiah from 53:4. Both readings are Jewish; only one explains every line.","key":"Isaiah 49:5-6; Isaiah 53:4-9"},{"topic":"The new covenant","theirs":"Jeremiah 31 promises a renewed Sinai in the messianic age — Torah internalized, Israel regathered, everyone knowing God. Nothing in the chapter about a new mediator or a dying Messiah; and the world's condition proves it hasn't arrived.","bible":"'Not like the covenant I made with their fathers' (31:32) — new in kind, not merely refreshed — and made with Israel and Judah first. Covenants are cut in blood (Ex 24:8); a Jewish Messiah at a Passover table announcing 'the new covenant in my blood' is quoting Jeremiah and Exodus at once. The universal-knowledge clause awaits act two.","key":"Jeremiah 31:31-34; Exodus 24:8; Ezekiel 36:26-27"},{"topic":"Resurrection","theirs":"Core doctrine — 'who revives the dead' stands in the Amidah's second blessing, and bodily resurrection at the end of days is Rambam's thirteenth principle. But it is collective and eschatological, not one man mid-history.","bible":"The same hope (Dan 12:2; Isa 26:19), with one claim added: it began early, in one man, as firstfruits — a debate the NT conducts entirely inside Jewish categories, with Paul splitting the Sanhedrin along the Pharisee/Sadducee resurrection line (Acts 23:6).","key":"Daniel 12:2; Isaiah 26:19; Psalm 16:10"},{"topic":"Worship of a man (avodah zarah / shituf)","theirs":"Worshiping a human being is the cardinal sin — one of the three a Jew must die rather than commit. Some authorities permit Gentiles 'shituf' (association of another with God); for a Jew, never. This is the bright line under every other objection.","bible":"Agreement on the standard — the dispute is identity, not the seriousness of idolatry. If Yeshua is YHWH's own arm revealed (Isa 53:1), the one YHWH calls 'me... whom they have pierced' (Zech 12:10), then worshiping him keeps the Shema rather than breaking it. If he is not, the objection stands. Everything hangs on who he is.","key":"Zechariah 12:10; Isaiah 45:22-23; Isaiah 53:1"}]};

function renderKnow(){
  const tabs=[["kt-facts","✨ Did you know?"],["kt-week","🗓 Inside their week"],["kt-you","👀 What they're taught about you"]];
  if(KNOW.doctrine)tabs.push(["kt-doct","📖 Side by side"]);
  const on=state.knowTab||"kt-facts";
  $("#main").innerHTML=`<div class="viewhead"><h2>Know your Jewish friend</h2>
  <p>Understanding before argument. Surprising true facts for conversational fluency, the rhythm of their religious life so you can love them practically, and how they've been taught to see you — so nothing they say catches you off guard.</p></div>
  <div class="tabs2">${tabs.map(([k,l])=>`<button class="tab2 ${on===k?"on":""}" data-pane="${k}">${l}</button>`).join("")}</div>
  <div class="tabpane2 ${on==="kt-facts"?"on":""}" id="kt-facts"><div class="kgrid">${KNOW.didyouknow.map(x=>`<div class="ptcard">${x.img?`<img class="ktop" src="${x.img.src}" loading="lazy" data-full="${x.img.src.replace("width=520","width=1400")}" data-cap="${esc(x.img.cap)}">`:""}<h3 class="ptv">${esc(x.t)}</h3><p class="pt">${rich(x.d)}</p><div class="refs">${x.src?`<a href="${esc(x.src)}" target="_blank" rel="noopener">Source</a>`:""}${x.id&&byId[x.id]?` · <button class="klink" data-open="${x.id}">Related case: ${esc(byId[x.id].title)}</button>`:""}</div></div>`).join("")}</div></div>
  <div class="tabpane2 ${on==="kt-week"?"on":""}" id="kt-week">${KNOW.week.map(x=>`<div class="ptcard"><h3 class="ptv">${esc(x.t)}</h3><p class="pt">${rich(x.d)}</p>${x.tip?`<div class="who you">For you as their friend</div><p class="pt">${rich(x.tip)}</p>`:""}</div>`).join("")}</div>
  <div class="tabpane2 ${on==="kt-you"?"on":""}" id="kt-you">${KNOW.aboutyou.map(x=>`<div class="ptcard"><h3 class="ptv">${esc(x.t)}</h3><p class="pt">${rich(x.d)}</p>${x.tip?`<div class="who you">How to navigate it</div><p class="pt">${rich(x.tip)}</p>`:""}</div>`).join("")}</div>${KNOW.doctrine?`<div class="tabpane2 ${on==="kt-doct"?"on":""}" id="kt-doct">${KNOW.doctrine.map(x=>`<div class="ptcard"><h3 class="ptv">${esc(x.topic)}</h3><div class="ddgrid"><div><div class="who them">They teach</div><p class="pt">${rich(x.theirs)}</p></div><div><div class="who you">The Bible teaches</div><p class="pt">${rich(x.bible)}</p></div></div>${x.key?`<div class="ddkey">${rich(x.key)}</div>`:""}</div>`).join("")}</div>`:""}`;
  document.querySelectorAll("#main .tab2").forEach(t=>t.addEventListener("click",()=>{state.knowTab=t.dataset.pane;}));
  document.querySelectorAll("#main [data-open]").forEach(b=>b.addEventListener("click",()=>openCase(b.dataset.open)));
}

/* ---------- router ---------- */
function render(){
  if(state.view!=="case"&&location.hash.indexOf("#case/")===0)try{history.replaceState(null,"",location.pathname+location.search)}catch(e){}
  document.querySelector(".app").classList.toggle("reading",state.view!=="overview");
  renderNav();
  if(state.view==="case")return renderCase();
  if(state.view==="paths")return renderPaths(),renderPreview();
  if(state.view==="timeline")return renderTimeline(),renderPreview();
  if(state.view==="glossary")return renderGlossary(),renderPreview();
  if(state.view==="share")return renderShare(),renderPreview();
  if(state.view==="proofs")return renderProofs(),renderPreview();
  if(state.view==="theysay")return renderTheySay(),renderPreview();
  if(state.view==="lessons")return renderLessons(),renderPreview();
  if(state.view==="know")return renderKnow(),renderPreview();
  if(state.view==="core")return renderCore(),renderPreview();
  renderOverview();renderPreview();
}

/* ---------- keyboard ---------- */
document.addEventListener("keydown",e=>{
  const inInput=/input|textarea/i.test(document.activeElement.tagName);
  if(inInput){if(e.key==="Escape")document.activeElement.blur();return;}
  const list=filtered();
  const move=dir=>{
    const idx=list.findIndex(x=>x.id===state.sel);
    const next=list[Math.min(list.length-1,Math.max(0,(idx<0?0:idx+dir)))];
    if(!next)return;
    state.sel=next.id;
    if(state.view==="case"){openCase(next.id);}
    else{renderPreview();
      const el=document.querySelector(`.vt[data-id="${next.id}"]`);
      document.querySelectorAll(".vt.sel").forEach(x=>x.classList.remove("sel"));
      document.querySelectorAll(`.vt[data-id="${next.id}"]`).forEach(x=>x.classList.add("sel"));
      if(el)el.scrollIntoView({block:"nearest"});}
  };
  switch(e.key==="ArrowRight"?"next":e.key==="ArrowLeft"?"prev":e.key.toLowerCase()){
    case "next":e.preventDefault();move(1);break;
    case "prev":e.preventDefault();move(-1);break;
    case "enter":if(state.sel&&state.view!=="case")openCase(state.sel);break;
    case "escape":if(state.view==="case"){state.view=state.pathId?"paths":"overview";state.caseId=null;render();}else{state.q="";const q=$("#q");if(q)q.value="";state.verdict=null;state.severity=null;render();}break;
    case "o":state.view="overview";state.section="all";state.caseId=null;render();break;
    case "p":state.view="paths";state.caseId=null;render();break;
    case "t":state.view="timeline";state.caseId=null;render();break;
    case "g":state.view="glossary";state.caseId=null;render();break;
    case "s":state.view="share";state.caseId=null;render();break;
    case "h":state.view="core";state.caseId=null;render();break;
  }
});

const TOURSTEPS=[{"icon":"🕎","title":"This section runs in reverse","body":"The rest of this site examines a religion's claims against the Bible. Here the Bible is <b>not</b> a shared standard yet — so this section does the opposite: it makes the case, from the <b>Tanakh alone</b>, that Jesus is Israel's Messiah, using sources a Jewish friend already holds. <b>19 cases</b>, each carrying the strongest counter-missionary reply."},{"icon":"🕯","title":"First, the room you're standing in","body":"The Crusades, the blood libel, the expulsions, forced disputations, Luther's <i>On the Jews and Their Lies</i>, and then Christian Europe in 1941. That history is not background to this conversation — it <b>is</b> the conversation until you name it yourself, unprompted. Romans 11 forbids everything that was done. Say so before you open a single text."},{"icon":"🏷","title":"Four verdicts, one glance","body":"Every case lands in one of four columns:<div class=\"vrow2\"><div><span class=\"badge v-admitted\">Conceded</span><span>Jewish sources grant the core fact</span></div><div><span class=\"badge v-unrefuted\">Strong</span><span>no adequate reply exists</span></div><div><span class=\"badge v-contested\">Contested</span><span>genuinely argued both ways</span></div><div><span class=\"badge v-answered\">Don't use</span><span>a Christian argument that fails</span></div></div><p style='margin:10px 0 0'><b>Conceded</b> is the strongest kind of argument here: made entirely from the Targum, the Talmud, and Jewish scholarship.</p>"},{"icon":"💬","title":"One text, then listen","body":"Never stack twelve prophecies — it reads as a sales pitch and invites twelve rebuttals. Take one, ask <i>“how do you read this?”</i>, and mean it. Every case ends with <b>“How the conversation usually goes”</b>: a real back-and-forth with the counter-missionary reply included, because your friend will have it."},{"icon":"🚀","title":"Where to start","body":"Take the <b>servant path</b>: Isaiah 53, and what the Targum and the Talmud said about it long before there was anything to argue about. It is the only argument on this site that is made entirely out of their own tradition. Replay this tour anytime from the sidebar.","cta":"Take me to the heart of it"}];
function startTour(){
  const old=document.querySelector(".tourwrap");if(old)old.remove();
  let ti=0;
  const wrap=document.createElement("div");wrap.className="tourwrap";
  function finish(go){localStorage.setItem(TOURKEY,"1");wrap.remove();if(go){state.view="core";state.caseId=null;render();}}
  function draw(){
    const s=TOURSTEPS[ti];
    wrap.innerHTML='<div class="tourcard"><div class="ticon">'+s.icon+'</div><h3>'+s.title+'</h3><div class="tbody">'+s.body+'</div>'+
      '<div class="tdots">'+TOURSTEPS.map((_,j)=>'<i class="'+(j===ti?"on":"")+'"></i>').join("")+'</div>'+
      '<div class="trow"><button class="tskip">Skip tour</button><div>'+(ti>0?'<button class="tback">Back</button>':'')+
      '<button class="tnext">'+(ti===TOURSTEPS.length-1?s.cta:'Next')+'</button></div></div></div>';
    wrap.querySelector(".tskip").addEventListener("click",()=>finish(false));
    const bk=wrap.querySelector(".tback");if(bk)bk.addEventListener("click",()=>{ti--;draw();});
    wrap.querySelector(".tnext").addEventListener("click",()=>{if(ti===TOURSTEPS.length-1){finish(ti===TOURSTEPS.length-1&&true);}else{ti++;draw();}});
  }
  document.body.appendChild(wrap);draw();
}
if(!localStorage.getItem(TOURKEY))setTimeout(startTour,500);

document.documentElement.dataset.theme=localStorage.getItem("wb_theme")||"dark";

});

  else if(!location.hash&&state.view==="case"){state.view="overview";state.caseId=null;render();}
});
