<script>
const DATA=[
{"id":"isaiah-53-rabbinic-messianic-reading","title":"Isaiah 53 was read messianically in the rabbis' own literature","category":"suffering-servant","claim":"The claim that only Christians read Isaiah 52:13–53:12 of an individual Messiah is contradicted by classical Jewish sources. Targum Jonathan — the official Aramaic paraphrase — opens the passage 'Behold, my servant the Messiah shall prosper' (on Isa 52:13). The Talmud, asking the Messiah's name, answers 'the leper scholar of the house of Rabbi,' citing Isaiah 53:4 — 'surely he has borne our griefs' (Sanhedrin 98b). Ruth Rabbah 5:6 applies Isaiah 53:5 to the Messiah's sufferings. A Yom Kippur Musaf piyyut ('Az milifnei bereshit,' preserved in old Ashkenazi machzorim) speaks of 'our righteous anointed' who 'carries our sins.' The 16th-century commentator Moshe Alshich wrote that 'our rabbis with one voice' applied the passage to King Messiah. None of this proves Jesus is that Messiah — but it establishes that an individual, even suffering, messianic reading of Isaiah 53 is native to Jewish tradition, not a Christian import.","tanakh":["Isaiah 52:13-53:12","Isaiah 53:4-5"],"nt":["Acts 8:32-35","1 Peter 2:24-25","Mark 10:45"],"rabbinic":["Targum Jonathan on Isaiah 52:13","Sanhedrin 98b","Ruth Rabbah 5:6","Zohar II:212a","Alshich on Isaiah 52:13","Yom Kippur Musaf piyyut 'Az milifnei bereshit'"],"sources":[{"name":"Targum Jonathan on Isaiah (Sefaria)","type":"primary","url":"https://www.sefaria.org/Targum_Jonathan_on_Isaiah.52.13"},{"name":"Sanhedrin 98b (Sefaria)","type":"primary","url":"https://www.sefaria.org/Sanhedrin.98b"},{"name":"Michael Brown, Answering Jewish Objections to Jesus, vol. 3","type":"apologetics","url":"https://askdrbrown.org"},{"name":"Tovia Singer, 'Who is God's Suffering Servant?'","type":"rabbinic","url":"https://outreachjudaism.org/gods-suffering-servant-isaiah-53/"}],"response":"Rabbi Tovia Singer and Jews for Judaism respond that citing these texts is selective. The Targum applies the servant's EXALTATION to Messiah but systematically reroutes the suffering onto Israel and the nations — it is evidence against, not for, a suffering Messiah. Aggadic passages like Sanhedrin 98b are homiletical wordplay, not exegesis; midrash routinely applies verses to many figures without fixing their plain meaning (peshat). The dominant medieval exegetical tradition — Rashi, Ibn Ezra, Radak — reads the servant as Israel, consistent with Isaiah's repeated 'Israel, my servant' (41:8; 44:1; 49:3). A tradition's homiletics do not overturn its exegesis.","responseSource":{"name":"Tovia Singer, Outreach Judaism; Jews for Judaism counter-missionary materials"},"verdict":"admitted","rationale":"The narrow fact is conceded on all sides: messianic (including suffering-messianic) readings of Isaiah 53 exist inside pre-modern Jewish literature — the debate is over their weight, not their existence. Use it exactly that way: not 'the rabbis agree with us,' but 'an individual-Messiah reading of this chapter is a Jewish option, attested in Jewish sources, so considering it is not conversion to a foreign idea.' Concede the Targum's rerouting of the suffering honestly — overclaiming it will be caught instantly by anyone who has read Singer. This entry opens the door; the textual case lives in the companion entry.","severity":"high","quran":[],"hadith":["Targum Jonathan on Isaiah 52:13","Sanhedrin 98b","Ruth Rabbah 5:6","Zohar II:212a","Alshich on Isaiah 52:13","Yom Kippur Musaf piyyut 'Az milifnei bereshit'"],"bible":["Isaiah 52:13-53:12","Isaiah 53:4-5","Acts 8:32-35","1 Peter 2:24-25","Mark 10:45"]},
{"id":"isaiah-53-servant-distinct-from-israel","title":"In Isaiah 53 the servant suffers for 'my people' — he is distinguished from Israel","category":"suffering-servant","claim":"Within the fourth Servant Song itself, the servant cannot simply be the nation. He suffers 'for the transgression of my people' (53:8) — the servant and the people are two parties, not one. He is innocent: 'he had done no violence, neither was any deceit in his mouth' (53:9), while Isaiah's Israel is confessedly sinful (1:4; 42:24-25; 53:6 'all we like sheep have gone astray'). He is silent under affliction (53:7), while Israel's laments are anything but silent. He dies — 'cut off out of the land of the living,' assigned a grave (53:8-9) — yet afterward 'prolongs his days,' while the Tanakh promises Israel never dies as a people (Jer 31:35-37). And his suffering is vicarious and effective: 'by his knowledge shall my righteous servant justify many; he shall bear their iniquities' (53:11). Earlier songs already distinguish a servant with a mission TO Israel (49:5-6). The portrait is an innocent individual who dies for the sins of others and is exalted.","tanakh":["Isaiah 52:13-53:12","Isaiah 49:5-6","Isaiah 42:24-25","Jeremiah 31:35-37"],"nt":["Luke 22:37","Acts 8:32-35","Romans 4:25","1 Peter 2:22-25"],"rabbinic":["Rashi on Isaiah 53","Ibn Ezra on Isaiah 53","Origen, Contra Celsum 1.55 (attesting the collective reading in the 3rd c.)"],"sources":[{"name":"Isaiah 53 with Rashi (Chabad.org)","type":"rabbinic","url":"https://www.chabad.org/library/bible_cdo/aid/15984/jewish/Chapter-53.htm"},{"name":"Origen, Contra Celsum, Book I","type":"primary","url":"https://www.newadvent.org/fathers/04161.htm"},{"name":"Jews for Judaism, 'Isaiah 53 and the Suffering Servant'","type":"rabbinic","url":"https://jewsforjudaism.org/knowledge/articles/isaiah-53-and-the-suffering-servant"},{"name":"Michael Brown, Answering Jewish Objections to Jesus, vol. 3","type":"apologetics","url":"https://askdrbrown.org"}],"response":"The strongest counter (Rashi, Ibn Ezra, Singer): Isaiah has already named the servant — 'Israel, my servant' (41:8; 44:1; 49:3) — so the burden is on the individual reading. The speakers of chapter 53 are the gentile KINGS of 52:15, astonished at Israel's vindication; each king's 'my people' (53:8) is his own nation, dissolving the servant/people distinction. 'Because of (מִן) our transgressions' (53:5) means Israel suffered from the nations' sins, not vicariously for them. National Israel 'dies' and revives in exile imagery (Ezekiel 37's dry bones), and the innocent-sufferer language fits the righteous remnant. This reading is not a medieval invention — Origen's Jewish interlocutors argued it c. 248 AD.","responseSource":{"name":"Rashi on Isaiah 53; Tovia Singer, 'The Suffering Servant of Isaiah 53' (Outreach Judaism)"},"verdict":"unrefuted","rationale":"Graded unrefuted on the narrow textual claim: the collective reading must make the kings the penitent confessors and 'my people' distributive — readings that strain 53:8-9 (an individual grave with 'a rich man in his death') and reverse the passage's grammar of substitution ('HE was wounded for OUR transgressions... the LORD laid on him the iniquity of us all'). Note honestly: critical scholars remain divided on the servant's identity, and Origen proves the collective reading predates Rashi — never claim Rashi invented it in the 1100s. Use as a slow shared reading of the Hebrew, verse by verse, asking only: who is the 'he,' who is the 'we'? Let the text do the work.","severity":"high","quran":[],"hadith":["Rashi on Isaiah 53","Ibn Ezra on Isaiah 53","Origen, Contra Celsum 1.55 (attesting the collective reading in the 3rd c.)"],"bible":["Isaiah 52:13-53:12","Isaiah 49:5-6","Isaiah 42:24-25","Jeremiah 31:35-37","Luke 22:37","Acts 8:32-35","Romans 4:25","1 Peter 2:22-25"]},
{"id":"sukkah-52a-two-messiahs","title":"The rabbis' own two-Messiah doctrine concedes the two portraits","category":"rabbinic-objections","claim":"The Tanakh contains two messianic portraits that resist merging: a reigning Davidic king (Isa 9:6-7; 11; Jer 23:5-6; Zech 9:9-10) and a suffering, pierced, dying figure (Isa 53; Zech 12:10; Ps 22; Dan 9:26). Rabbinic Judaism itself saw both and answered with TWO Messiahs: Messiah ben Joseph, who fights and is slain — the Talmud applies the mourning of Zechariah 12:10-12 to his death (Sukkah 52a) — and Messiah ben David, who then reigns. Later midrash goes further: Pesikta Rabbati 36-37 portrays a Messiah ('Ephraim, our righteous Messiah') who accepts crushing sufferings for the sins of Israel. The two-Messiah scheme is the tradition's own admission that the sources present both a slain sufferer and a triumphant king. Christianity's claim is structurally parallel and more economical: one Messiah, two comings — suffering servant first, returning king second (Luke 24:26; Heb 9:28).","tanakh":["Zechariah 12:10-12","Isaiah 53:12","Isaiah 9:6-7","Daniel 7:13-14","Zechariah 9:9"],"nt":["Luke 24:25-27","Hebrews 9:28","Acts 3:19-21","John 19:37"],"rabbinic":["Sukkah 52a","Pesikta Rabbati 36-37","Targum Jonathan on Zechariah 12:10 (some recensions)"],"sources":[{"name":"Sukkah 52a (Sefaria)","type":"primary","url":"https://www.sefaria.org/Sukkah.52a"},{"name":"Pesikta Rabbati (Sefaria)","type":"primary","url":"https://www.sefaria.org/Pesikta_Rabbati.36"},{"name":"Daniel Boyarin, The Jewish Gospels","type":"scholarly","url":"https://thenewpress.com/books/jewish-gospels"},{"name":"Michael Brown, Answering Jewish Objections to Jesus, vol. 2","type":"apologetics","url":"https://askdrbrown.org"}],"response":"The rabbinic response: Messiah ben Joseph is a WARRIOR who dies in the eschatological battle against Gog — he is not an atoning sacrifice, his death accomplishes nothing redemptive, and he dies at the END of history, not centuries before the redemption. The concept is post-biblical, marginal, and possibly a response to Bar Kokhba's death (132-135 AD), not ancient doctrine. Above all, Maimonides' test stands (Mishneh Torah, Melachim 11): the Messiah is identified by what he accomplishes — rebuilt temple, ingathered exiles, world peace, universal knowledge of God. A candidate who dies without accomplishing these is thereby disqualified; positing a second coming is an unfalsifiable patch, and the rabbis' two Messiahs at least both act within the one redemption.","responseSource":{"name":"Maimonides, Mishneh Torah, Melachim uMilchamot 11:3-4; Tovia Singer, Outreach Judaism"},"verdict":"admitted","rationale":"The admitted core: the tradition itself found a slain messianic figure in the texts — Sukkah 52a hangs his death on Zechariah 12:10, the same verse John 19:37 cites. Boyarin (a Talmud professor, no Christian) argues suffering-Messiah ideas are Jewish to the bone. Use it to reframe the whole conversation: the question was never 'does the Tanakh have a suffering Messiah?' — Jewish sources answered yes — but 'is it one Messiah twice, or two Messiahs once?' Engage Rambam's test respectfully and head-on: the unfinished tasks are exactly what the NT assigns to the return (Acts 3:21). Never deploy this as 'gotcha, your own Talmud' — it is common ground, not a trap.","severity":"high","quran":[],"hadith":["Sukkah 52a","Pesikta Rabbati 36-37","Targum Jonathan on Zechariah 12:10 (some recensions)"],"bible":["Zechariah 12:10-12","Isaiah 53:12","Isaiah 9:6-7","Daniel 7:13-14","Zechariah 9:9","Luke 24:25-27","Hebrews 9:28","Acts 3:19-21","John 19:37"]},
{"id":"daniel-9-cut-off-before-destruction","title":"Daniel 9: an anointed one is cut off before the Second Temple's destruction","category":"daniel-timeline","claim":"Daniel 9:24-27 sets seventy 'weeks' for Israel and Jerusalem 'to finish transgression... to atone for iniquity, to bring in everlasting righteousness.' The load-bearing anchor needs no precise chronology: 'an anointed one shall be cut off and have nothing; and the people of the prince who is to come shall destroy the city and the sanctuary' (9:26). Whatever the counting scheme, the mashiach is cut off BEFORE the destruction — which occurred in 70 AD. So the window closed in 70 AD. Strikingly, the traditional Jewish chronology agrees on the terminus: Seder Olam Rabbah runs the 490 years to the Second Temple's destruction, and Rashi identifies the cut-off anointed one with Agrippa at the destruction. Jesus of Nazareth was cut off c. 30-33 AD, within the final generation of the standing temple, followed by the destruction — matching the sequence. Josephus (War 6.312-313) attests that an 'ambiguous oracle' in the scriptures fueled first-century expectation that the time had come.","tanakh":["Daniel 9:24-27","Daniel 9:26"],"nt":["Luke 19:41-44","Matthew 24:1-2","Galatians 4:4","Mark 1:15"],"rabbinic":["Seder Olam Rabbah 28-30","Rashi on Daniel 9:26","Sanhedrin 97b","Nazir 32b"],"sources":[{"name":"Sanhedrin 97b (Sefaria)","type":"primary","url":"https://www.sefaria.org/Sanhedrin.97b"},{"name":"Rashi on Daniel 9 (Chabad.org Tanakh)","type":"rabbinic","url":"https://www.chabad.org/library/bible_cdo/aid/16492/jewish/Chapter-9.htm"},{"name":"John J. Collins, Daniel (Hermeneia commentary)","type":"scholarly","url":"https://www.fortresspress.com"},{"name":"Michael Brown, Answering Jewish Objections to Jesus, vol. 1","type":"apologetics","url":"https://askdrbrown.org"}],"response":"Two-layer counter. Rabbinic: 'mashiach' means any anointed one — Rashi reads v.25's anointed as Cyrus and v.26's as King Agrippa; the passage concerns the temple era, not a dying redeemer, and the Talmud curses end-date calculators ('blasted be the bones of those who calculate the end,' Sanhedrin 97b) precisely because such reckonings breed false messiahs. Critical-scholarly (the stronger form): Daniel 9 was composed in the 160s BC; the anointed one 'cut off' is the high priest Onias III, murdered in 171 BC, and the desolator is Antiochus IV — the seventy weeks end in the Maccabean crisis, and the Christian count requires cherry-picking a start decree and treating symbolic sabbatical numbers as exact solar arithmetic.","responseSource":{"name":"Rashi on Daniel 9; Sanhedrin 97b; John J. Collins, Daniel (Hermeneia)"},"verdict":"contested","rationale":"Graded contested because the Maccabean reading is the critical consensus and deserves the respect of being named. But the usable core survives every reading a Jewish interlocutor is likely to hold: on the TRADITIONAL chronology (Seder Olam, Rashi), the seventy weeks terminate at 70 AD — so by the tradition's own math, whatever the passage promised ('atone for iniquity, everlasting righteousness') belongs to the era that ended with the destruction. Use it as a question, not an equation: 'On your own sources' timeline, what happened in that window?' Avoid decree-arithmetic showdowns (458 vs 444 BC) — the anchor 'cut off before the destruction' is the whole argument. Never mock the Sanhedrin 97b curse; acknowledge its pastoral wisdom about false messiahs.","severity":"high","quran":[],"hadith":["Seder Olam Rabbah 28-30","Rashi on Daniel 9:26","Sanhedrin 97b","Nazir 32b"],"bible":["Daniel 9:24-27","Daniel 9:26","Luke 19:41-44","Matthew 24:1-2","Galatians 4:4","Mark 1:15"]},
{"id":"micah-5-2-bethlehem","title":"Micah 5:2 — the ruler from Bethlehem whose origins are from of old","category":"messianic-prophecy","claim":"Micah 5:2 (5:1 in Hebrew editions): 'You, Bethlehem Ephrathah, little among the clans of Judah — from you shall come forth for me one who is to be ruler in Israel, whose origins are from of old, from ancient days.' The messianic identification is not contested ground between Judaism and Christianity: Targum Jonathan renders 'from you shall come forth before Me the Messiah,' and Rashi on the verse writes 'from you shall emerge for Me Messiah son of David.' The Gospels record that this was the standing Jewish answer to where Messiah would be born (Matt 2:4-6; John 7:42). Jesus's birth in Bethlehem is attested by both independent birth narratives (Matthew 2; Luke 2). The phrase 'origins from of old, from ancient days' (motza'otav mikedem, mimei olam) points beyond mere ancestry for Christian readers, cohering with the child called 'mighty God' in Isaiah 9:6 and the pre-existent son of Psalm 110:1.","tanakh":["Micah 5:2 (5:1 Heb)","Isaiah 9:6-7","Psalm 110:1"],"nt":["Matthew 2:1-6","Luke 2:1-7","John 7:41-42"],"rabbinic":["Targum Jonathan on Micah 5:1","Rashi on Micah 5:1","Jerusalem Talmud Berakhot 2:4 (Messiah and Bethlehem legend)"],"sources":[{"name":"Micah 5 with Rashi (Chabad.org)","type":"rabbinic","url":"https://www.chabad.org/library/bible_cdo/aid/16192/jewish/Chapter-5.htm"},{"name":"Micah 5 (Sefaria)","type":"primary","url":"https://www.sefaria.org/Micah.5.1"},{"name":"Raymond Brown, The Birth of the Messiah","type":"scholarly","url":"https://www.penguinrandomhouse.com/books/47576/the-birth-of-the-messiah-by-raymond-e-brown/"},{"name":"Tovia Singer, Outreach Judaism","type":"rabbinic","url":"https://outreachjudaism.org"}],"response":"The counter-missionary reading: Micah names Bethlehem as the CLAN SEAT of David's line — 'from you' addresses the family stock (Ephrathah, cf. Ruth 4:11; 1 Sam 17:12), so the verse predicts a ruler of Davidic descent, not a birthplace requirement; 'origins from of old' means precisely that his lineage reaches back to David's ancient house, not pre-existence. Moreover, the application to Jesus is unverifiable: the two birth narratives diverge (a Herod-era flight to Egypt vs. a Quirinius census a decade later), the census mechanism is historically doubtful, and skeptics argue Bethlehem was written in BECAUSE the prophecy was known. Davidic genealogy through Joseph is moot if Joseph is not the father.","responseSource":{"name":"Tovia Singer, Outreach Judaism; critical discussion in Raymond Brown, The Birth of the Messiah"},"verdict":"contested","rationale":"The identification (this verse = Messiah) is admitted by the classical Jewish sources themselves — that part is solid and worth establishing, since it means messianic prophecy with checkable content exists and both traditions know it. What is genuinely contested is the application to Jesus, which rests on the historicity of the infancy narratives — a real debate; do not wave it away. Use the verse to establish the shared framework ('your sources and mine agree what this predicts'), present the double attestation of Matthew and Luke honestly alongside their tensions, and let 'origins from of old' be suggestive rather than a proof of deity. Overclaiming here costs credibility needed elsewhere.","severity":"medium","quran":[],"hadith":["Targum Jonathan on Micah 5:1","Rashi on Micah 5:1","Jerusalem Talmud Berakhot 2:4 (Messiah and Bethlehem legend)"],"bible":["Micah 5:2 (5:1 Heb)","Isaiah 9:6-7","Psalm 110:1","Matthew 2:1-6","Luke 2:1-7","John 7:41-42"]},
{"id":"zechariah-12-10-pierced","title":"Zechariah 12:10 — Jerusalem mourns one who was pierced; the Talmud says it is a slain Messiah","category":"messianic-prophecy","claim":"Zechariah 12:10 in the Masoretic Text: 'They shall look to me whom they have pierced (daqaru), and they shall mourn for him as one mourns for an only son, and grieve bitterly for him as one grieves for a firstborn.' The oscillation 'look to ME... mourn for HIM' sits in the Hebrew itself. The decisive datum comes from the Talmud: Sukkah 52a asks what the great mourning of Zechariah 12:11-12 is for, and the accepted answer applies it to Messiah ben Joseph WHO IS SLAIN, citing this very verse — 'and they shall look upon me because they have thrust him through.' So the classical Jewish reading closest to the text's plain force already saw here a pierced, slain, mourned messianic figure. John 19:37 applies the verse to the crucifixion; Revelation 1:7 to the return. The prophecy's setting — the house of David and Jerusalem's inhabitants looking in repentant grief on one they pierced, with a fountain 'opened for sin and impurity' in the next verse (13:1) — matches the Christian claim with uncanny economy.","tanakh":["Zechariah 12:10-14","Zechariah 13:1","Zechariah 13:7"],"nt":["John 19:34-37","Revelation 1:7","Matthew 26:31"],"rabbinic":["Sukkah 52a","Rashi on Zechariah 12:10","Ibn Ezra on Zechariah 12:10"],"sources":[{"name":"Sukkah 52a (Sefaria)","type":"primary","url":"https://www.sefaria.org/Sukkah.52a"},{"name":"Zechariah 12 (Sefaria, MT with translations)","type":"primary","url":"https://www.sefaria.org/Zechariah.12.10"},{"name":"Michael Brown, Answering Jewish Objections to Jesus, vol. 3","type":"apologetics","url":"https://askdrbrown.org"},{"name":"Jews for Judaism","type":"rabbinic","url":"https://jewsforjudaism.org"}],"response":"The steelmanned counter (Singer, Rashi, and the NJPS translation): the speaker is God ('they shall look to Me'), who cannot be pierced; daqar here means slain in battle, and the verse describes end-time national mourning over those who fell in the war of Gog and Magog — NJPS renders 'they shall lament to Me about those who are slain.' The grammar 'et asher' can mean 'concerning him whom,' so no God-pierced paradox exists. Rashi's second comment does cite the Messiah ben Joseph tradition, but as aggadah about a warrior slain at history's end — not an atoning death in the Roman era. Some Hebrew manuscripts even read 'look to him (elav),' removing the Christian pivot entirely.","responseSource":{"name":"Rashi on Zechariah 12:10; NJPS translation; Tovia Singer, Outreach Judaism"},"verdict":"admitted","rationale":"Graded admitted on the key fact: the Talmud itself connects this verse's mourning to a slain Messiah (Sukkah 52a) — the same connection John 19:37 makes. That convergence, from sources with no motive to help Christians, is the entry's entire force. Handle the me/him text question with full honesty: the MT's elai is the harder and better-attested reading, but the argument does not need it — 'mourn for HIM as for an only son' carries the individual regardless. Pair with 13:7 ('strike the shepherd') and 13:1 (the fountain for sin). Best used after the two-Messiah entry, as its sharpest concrete instance.","severity":"high","quran":[],"hadith":["Sukkah 52a","Rashi on Zechariah 12:10","Ibn Ezra on Zechariah 12:10"],"bible":["Zechariah 12:10-14","Zechariah 13:1","Zechariah 13:7","John 19:34-37","Revelation 1:7","Matthew 26:31"]},
{"id":"psalm-22-pierced-hands-feet","title":"Psalm 22 — the crucifixion psalm and the kaari/kaaru textual question","category":"messianic-prophecy","claim":"Psalm 22 reads like a crucifixion account written from inside: 'My God, my God, why have you forsaken me?' (v.1, quoted by Jesus, Matt 27:46); mockers who 'shake the head' saying 'he trusted in the LORD, let him deliver him' (vv.7-8; cf. Matt 27:39-43); 'they divide my garments among them, and for my clothing they cast lots' (v.18; John 19:24); ending not in death but in worldwide praise — 'all the ends of the earth shall remember and turn to the LORD' (v.27). Verse 16(17) is the famous crux: the Masoretic Text reads ka'ari ('like a lion my hands and my feet' — no verb); the pre-Christian Septuagint reads 'they dug/pierced (ōryxan) my hands and feet'; and the Nahal Hever Psalms scroll (5/6HevPs, 1st century AD, a Jewish manuscript) reads the verb form ka'aru. So the 'pierced' reading is ancient and Jewish, not a Christian corruption — though its meaning is debated.","tanakh":["Psalm 22:1-31","Psalm 22:16(17)","Psalm 22:18"],"nt":["Matthew 27:35-46","John 19:23-24","Mark 15:29-34","Hebrews 2:12"],"rabbinic":["Rashi on Psalm 22","Midrash Tehillim 22 (applied to Esther)","Pesikta Rabbati 36 (Messiah and Psalm 22 imagery)"],"sources":[{"name":"Psalm 22 (Sefaria, MT)","type":"primary","url":"https://www.sefaria.org/Psalms.22"},{"name":"NETS Septuagint translation (Psalm 21 LXX)","type":"scholarly","url":"http://ccat.sas.upenn.edu/nets/edition/"},{"name":"Leon Levy Dead Sea Scrolls Digital Library","type":"primary","url":"https://www.deadseascrolls.org.il"},{"name":"Tovia Singer on Psalm 22 (Outreach Judaism)","type":"rabbinic","url":"https://outreachjudaism.org"}],"response":"The counter: ka'aru is not a known Hebrew verb for 'pierce' — the root krh means 'dig,' and 'dig my hands and feet' is strained; the MT's 'like a lion [at] my hands and feet' fits the psalm's animal imagery (bulls v.12, dogs v.16, lions vv.13,21). The psalm is David's own lament, in the past tense, with no messianic label; Midrash Tehillim applies it to Esther. The Gospel writers patterned the passion narrative ON the psalm (prophecy historicized), which explains the fit. And a telling detail: the New Testament itself NEVER quotes verse 16 — if 'they pierced my hands and feet' were the slam-dunk, the evangelists missed it. Vicarious atonement appears nowhere in the psalm.","responseSource":{"name":"Tovia Singer, Outreach Judaism; Jews for Judaism materials on Psalm 22"},"verdict":"contested","rationale":"Graded contested with total honesty as instructed: the textual evidence (LXX, Nahal Hever) genuinely favors an ancient verb reading and refutes the 'Christian mistranslation' charge — but 'pierced' as the verb's sense is uncertain, and the NT's silence on v.16 is a real datum an informed interlocutor will raise; concede it before they do. The psalm's power is cumulative, not lexical: mockery, the taunt quoted almost verbatim in Matthew 27:43, divided garments, and the pivot to the nations' worship. Use v.16 only to neutralize the corruption charge, never as the centerpiece. Lead with the verses the Gospels actually quote.","severity":"medium","quran":[],"hadith":["Rashi on Psalm 22","Midrash Tehillim 22 (applied to Esther)","Pesikta Rabbati 36 (Messiah and Psalm 22 imagery)"],"bible":["Psalm 22:1-31","Psalm 22:16(17)","Psalm 22:18","Matthew 27:35-46","John 19:23-24","Mark 15:29-34","Hebrews 2:12"]},
{"id":"genesis-49-10-shiloh","title":"Genesis 49:10 — the scepter of Judah and the one to whom obedience belongs","category":"messianic-prophecy","claim":"Jacob's blessing: 'The scepter shall not depart from Judah, nor the ruler's staff from between his feet, until Shiloh comes (ad ki yavo Shiloh), and to him shall be the obedience of the peoples' (Gen 49:10). The messianic identification is again native to Jewish tradition: Targum Onkelos renders 'until the Messiah comes, whose is the kingdom'; Sanhedrin 98b lists 'Shiloh' among the Messiah's names; Rashi glosses 'Shiloh — the King Messiah, to whom the kingdom belongs.' The verse thus establishes, from the Torah itself and by rabbinic consent, that Judah's line culminates in a specific individual who commands the obedience not of Israel only but of 'the peoples' (amim, plural). Christians observe that Judah's residual self-governance — the Sanhedrin's capital jurisdiction — lapsed under Rome in the generation before 70 AD (Avodah Zarah 8b records capital cases ceasing 'forty years before the destruction'), and that a son of Judah's line has in fact, uniquely in history, won the obedience of the gentile peoples.","tanakh":["Genesis 49:10","Isaiah 11:10","Psalm 2:8"],"nt":["Matthew 1:1-3","Hebrews 7:14","Revelation 5:5","Romans 1:5"],"rabbinic":["Targum Onkelos on Genesis 49:10","Sanhedrin 98b","Rashi on Genesis 49:10","Avodah Zarah 8b","Bereishit Rabbah 98:8"],"sources":[{"name":"Onkelos on Genesis 49:10 (Sefaria)","type":"primary","url":"https://www.sefaria.org/Onkelos_Genesis.49.10"},{"name":"Genesis 49 with Rashi (Chabad.org)","type":"rabbinic","url":"https://www.chabad.org/library/bible_cdo/aid/8244/jewish/Chapter-49.htm"},{"name":"Avodah Zarah 8b (Sefaria)","type":"primary","url":"https://www.sefaria.org/Avodah_Zarah.8b"},{"name":"Michael Brown, Answering Jewish Objections to Jesus, vol. 1","type":"apologetics","url":"https://askdrbrown.org"}],"response":"The counter has real teeth: if 'scepter' means political sovereignty, it departed from Judah at the Babylonian exile (586 BC) and through Persian, Greek, and Hasmonean (Levite!) rule — centuries before Jesus — so the 'departed in AD 6' clock is arbitrary. Rabbinic exegesis reads shevet as tribal identity and internal authority (exilarchs, patriarchs, courts), which persisted long after 70 AD; 'ad ki' can mean 'even when,' not a terminus. And 'Shiloh' itself is obscure — possibly the place-name (cf. 1 Sam 4), possibly 'tribute to him' (shai lo) — so building chronology on an uncertain word is unsound. The messianic gloss in Onkelos identifies the ultimate referent without conceding any first-century deadline.","responseSource":{"name":"Rashi and Ramban on Genesis 49:10; Tovia Singer, Outreach Judaism"},"verdict":"contested","rationale":"Split verdict in practice: the messianic identification of Shiloh is admitted (Onkelos, Sanhedrin 98b, Rashi — cite them, they are common ground), but the popular Christian TIMING argument ('the scepter departed when the Sanhedrin lost capital cases, therefore Messiah had already come') is genuinely contested and half-broken — the Babylonian exile objection has no clean answer. Use the verse for what it firmly gives: Torah-level testimony, rabbinically confirmed, that Judah's line ends in one man who wins 'the obedience of the peoples' — then ask soberly which son of Judah the peoples of the earth actually obey. Drop the courtroom chronology entirely.","severity":"medium","quran":[],"hadith":["Targum Onkelos on Genesis 49:10","Sanhedrin 98b","Rashi on Genesis 49:10","Avodah Zarah 8b","Bereishit Rabbah 98:8"],"bible":["Genesis 49:10","Isaiah 11:10","Psalm 2:8","Matthew 1:1-3","Hebrews 7:14","Revelation 5:5","Romans 1:5"]},
{"id":"isaiah-7-14-almah","title":"Isaiah 7:14 — almah, the Septuagint, and Matthew's typology (handle with care)","category":"messianic-prophecy","claim":"Isaiah 7:14: 'The almah shall conceive and bear a son, and shall call his name Immanuel.' Matthew 1:23 cites it of the virgin birth via the Septuagint's parthenos. The honest facts: almah means a young woman of marriageable age (cf. Gen 24:43; Ex 2:8), not technically 'virgin' (betulah — though even betulah needs a qualifier in Gen 24:16); the sign is given to Ahaz with a near-term horizon — before the child knows good from evil, the two kings will be gone (7:15-16). What Christians CAN say: the choice of parthenos was made by Jewish translators in Alexandria two centuries before Jesus, so a virginal reading trajectory predates Christianity; the Immanuel child threads forward into 8:8-10 and the divine child of 9:6-7, suggesting a figure larger than the 8th-century sign; and Matthew's 'fulfill' (plēroō) regularly means typological filling-full of a pattern (Hos 11:1 in Matt 2:15 — Israel's exodus story recapitulated), not bare prediction.","tanakh":["Isaiah 7:14-16","Isaiah 8:8-10","Isaiah 9:6-7","Genesis 24:43"],"nt":["Matthew 1:22-23","Matthew 2:15","Luke 1:34-35"],"rabbinic":["Rashi on Isaiah 7:14","Justin Martyr, Dialogue with Trypho 67 (Trypho's almah argument, 2nd c.)"],"sources":[{"name":"Isaiah 7 with Rashi (Chabad.org)","type":"rabbinic","url":"https://www.chabad.org/library/bible_cdo/aid/15938/jewish/Chapter-7.htm"},{"name":"Justin Martyr, Dialogue with Trypho","type":"primary","url":"https://www.newadvent.org/fathers/01286.htm"},{"name":"NETS Septuagint (Isaiah)","type":"scholarly","url":"http://ccat.sas.upenn.edu/nets/edition/"},{"name":"Tovia Singer on Isaiah 7:14 (Outreach Judaism)","type":"rabbinic","url":"https://outreachjudaism.org"}],"response":"The counter is ancient and strong — Trypho was already making it to Justin c. 160 AD: the Hebrew says almah, 'young woman'; the sign addresses Ahaz's crisis in 734 BC and is useless to him if fulfilled seven centuries later; verse 16 ties the child's early years to the fall of Rezin and Pekah; the child is plausibly Isaiah's or Ahaz's own son (cf. 8:3-4, where Maher-shalal-hash-baz carries the identical timetable). Parthenos in the LXX need not mean virgin technically (the violated Dinah is parthenos in Gen 34:3 LXX). Matthew, reading Greek, built doctrine on a translation choice. Later Jewish translators (Aquila, Symmachus, Theodotion) rendered neanis, 'young woman' — correcting, not conspiring.","responseSource":{"name":"Rashi on Isaiah 7:14; Justin Martyr, Dialogue with Trypho 67-71; Tovia Singer, Outreach Judaism"},"verdict":"contested","rationale":"Graded contested, and the site should SAY Christians overclaim this verse — that honesty is the entry's main job. Isaiah 7:14 is not evidence FOR the virgin birth; it is Matthew's meditation ON a virgin birth he already believed on other grounds, using the accepted Jewish technique of pattern-fulfillment. Never open with it; never present it as a knockdown; if it comes up, concede the near-term fulfillment cheerfully and explain typology with Matthew 2:15 (Hosea 11:1), which no one can read as prediction. The defensible remainder: the LXX's parthenos shows the reading is pre-Christian, and the Immanuel-to-9:6 arc invites a larger horizon. Low weight, honestly held.","severity":"low","quran":[],"hadith":["Rashi on Isaiah 7:14","Justin Martyr, Dialogue with Trypho 67 (Trypho's almah argument, 2nd c.)"],"bible":["Isaiah 7:14-16","Isaiah 8:8-10","Isaiah 9:6-7","Genesis 24:43","Matthew 1:22-23","Matthew 2:15","Luke 1:34-35"]},
{"id":"second-temple-messianic-expectation","title":"Messianic expectation was alive, specific, and datable before Jesus — 4Q521 and Psalms of Solomon","category":"messianic-prophecy","claim":"The charge that Christians retrofitted a 'messiah concept' onto neutral texts fails on pre-Christian evidence. The Dead Sea Scroll 4Q521 (1st c. BC) says of the messianic age: 'the heavens and the earth will obey His Messiah... he will heal the badly wounded, he will revive the dead, he will proclaim good news to the poor' — strikingly close to Jesus's self-description to John the Baptist (Luke 7:22), including 'raises the dead,' which is NOT in the underlying Isaiah 35/61 texts. Psalms of Solomon 17 (mid-1st c. BC) prays for the 'son of David' who will reign as 'Lord Messiah.' Qumran expected priestly and royal anointed figures; Josephus records that an 'ambiguous oracle' in the scriptures convinced many the world ruler would arise from Judea in that era (War 6.312-313). Expectation was live, textual, and clustered exactly in Jesus's generation — the Gospels answer questions Second Temple Jews were already asking.","tanakh":["Isaiah 61:1-2","Isaiah 35:5-6","Isaiah 11:1-4","Daniel 2:44"],"nt":["Luke 7:18-23","Matthew 11:2-6","Luke 3:15","John 1:41-45"],"rabbinic":["4Q521 (Messianic Apocalypse)","Psalms of Solomon 17:21-32","Josephus, War 6.312-313","Sanhedrin 97a (two thousand years of Messiah)"],"sources":[{"name":"Leon Levy Dead Sea Scrolls Digital Library","type":"primary","url":"https://www.deadseascrolls.org.il"},{"name":"John J. Collins, The Scepter and the Star","type":"scholarly","url":"https://www.eerdmans.com"},{"name":"Sanhedrin 97a (Sefaria)","type":"primary","url":"https://www.sefaria.org/Sanhedrin.97a"},{"name":"Craig Evans, Jesus and His Contemporaries","type":"scholarly","url":"https://brill.com"}],"response":"The response concedes the expectation but turns it: yes, first-century Judea was thick with messianic hope — which is precisely why there were MANY claimants (Theudas, the Egyptian, Bar Kokhba), all failed by the same test. The dominant expectation was a royal-national deliverer (Psalms of Solomon 17 is explicitly a conquering king who purges Jerusalem of gentiles); 4Q521's wonder-working figure is fragmentary and possibly describes God's own deeds, not the Messiah's. Jesus matched the marginal motifs and failed the central ones: no throne, no ingathering, no peace, no rebuilt temple — and the era's expectation itself, per Sanhedrin 97b, generated the very false-messiah problem the rabbis warned against.","responseSource":{"name":"John J. Collins, The Scepter and the Star (on diversity of expectation); Maimonides, Melachim 11"},"verdict":"admitted","rationale":"The admitted fact — datable, pre-Christian, Jewish texts expecting an anointed one who heals, raises the dead, and preaches good news to the poor — is genuinely powerful, because Luke 7:22 shows Jesus answering John's 'are you the one?' in exactly that idiom. Use 4Q521 as the centerpiece: it cannot be a Christian forgery (it was sealed in a cave before the church existed). Concede the diversity of expectation and the failed-claimant field honestly; the argument is not 'expectation proves Jesus' but 'the messianic job description Christians cite was already posted.' Pairs naturally with the two-Messiah and Daniel 9 entries.","severity":"medium","quran":[],"hadith":["4Q521 (Messianic Apocalypse)","Psalms of Solomon 17:21-32","Josephus, War 6.312-313","Sanhedrin 97a (two thousand years of Messiah)"],"bible":["Isaiah 61:1-2","Isaiah 35:5-6","Isaiah 11:1-4","Daniel 2:44","Luke 7:18-23","Matthew 11:2-6","Luke 3:15","John 1:41-45"]},
{"id":"jeremiah-31-new-covenant","title":"Jeremiah 31: the 'new covenant' is the Tanakh's own promise — made to Israel","category":"new-covenant","claim":"The phrase 'new covenant' (brit chadashah) is not a Christian coinage — it appears once in the Tanakh, at Jeremiah 31:31-34 (31:30-33 in Hebrew editions): 'Behold, days are coming, declares the LORD, when I will make a new covenant with the house of Israel and the house of Judah — not like the covenant I made with their fathers... which they broke.' Its content: Torah written on hearts, everyone knowing the LORD, and — the climax — 'I will forgive their iniquity, and remember their sin no more.' The promise presupposes the Sinai covenant was breakable and was broken, and announces a covenant grounded in definitive forgiveness. The New Testament's entire self-understanding is a claim on this text: 'this cup is the new covenant in my blood' (Luke 22:20; 1 Cor 11:25), argued at length in Hebrews 8-10. Ezekiel parallels it (36:25-27, the new heart and Spirit). Whatever one concludes about Jesus, the category 'new covenant with Israel, centered on forgiveness' is Jeremiah's, not Paul's.","tanakh":["Jeremiah 31:31-37","Ezekiel 36:25-27","Deuteronomy 30:6","Isaiah 59:20-21"],"nt":["Luke 22:20","1 Corinthians 11:25","Hebrews 8:6-13","2 Corinthians 3:3-6"],"rabbinic":["Rashi on Jeremiah 31:30","Radak on Jeremiah 31:30"],"sources":[{"name":"Jeremiah 31 (Sefaria)","type":"primary","url":"https://www.sefaria.org/Jeremiah.31.31"},{"name":"Jeremiah 31 with Rashi (Chabad.org)","type":"rabbinic","url":"https://www.chabad.org/library/bible_cdo/aid/16028/jewish/Chapter-31.htm"},{"name":"Michael Brown, Answering Jewish Objections to Jesus, vol. 2","type":"apologetics","url":"https://askdrbrown.org"},{"name":"Jews for Judaism","type":"rabbinic","url":"https://jewsforjudaism.org"}],"response":"The rabbinic counter: read the CONTENT. The new covenant is the same Torah — 'I will put MY TORAH within them' — internalized so perfectly that it can no longer be broken; nothing here abolishes commandments, replaces Israel, or mentions a dying mediator. 'Chadashah' can mean renewed, as the moon is 'renewed.' Its timeframe is the messianic age, when 'they shall all know Me' — manifestly not the present era of a divided, largely unbelieving world. And the immediately following verses (31:35-37) stake God's own reliability on Israel's permanence as a nation 'forever' — the strongest anti-supersessionist text in the Bible, sitting inside the very passage Christians claim. If the church reads vv.31-34 literally, it must read vv.35-37 literally too.","responseSource":{"name":"Rashi and Radak on Jeremiah 31; Tovia Singer, Outreach Judaism"},"verdict":"unrefuted","rationale":"Unrefuted on the narrow claim: the Tanakh itself anticipates a new covenant whose ground is final forgiveness, promised to Israel — Christians did not invent the category, they claim it. The counter succeeds only against the overreach (Torah abolished, Israel replaced) — which faithful use of this entry must also renounce. Deploy it double-edged, on purpose: yes, Jeremiah promised a new covenant (so considering the NT's claim is not apostasy from the Tanakh); and yes, vv.35-37 guarantee Israel forever (so any Christianity that despises Israel has broken with its own charter — cf. Romans 11). That symmetry is what makes this entry trustworthy to a Jewish reader.","severity":"high","quran":[],"hadith":["Rashi on Jeremiah 31:30","Radak on Jeremiah 31:30"],"bible":["Jeremiah 31:31-37","Ezekiel 36:25-27","Deuteronomy 30:6","Isaiah 59:20-21","Luke 22:20","1 Corinthians 11:25","Hebrews 8:6-13","2 Corinthians 3:3-6"]},
{"id":"yoma-39b-forty-years","title":"Yoma 39b: the Temple's signs failed for the forty years before the destruction","category":"temple-atonement","claim":"The Talmud itself records: 'Forty years before the destruction of the Temple, the lot [\"For the LORD\"] did not come up in the right hand; nor did the crimson-colored strap become white; nor did the westernmost lamp burn; and the doors of the Sanctuary opened by themselves' (Yoma 39b; parallel in Jerusalem Talmud Yoma 6:3). The crimson thread turning white was the visible sign that Yom Kippur's atonement had been accepted (per Isaiah 1:18, 'though your sins be as scarlet, they shall be white as snow'). The Temple fell in 70 AD; forty years earlier is approximately 30 AD — the era of the crucifixion. On the Christian reading, the rabbis' own tradition remembers that from roughly the moment Jesus died, the sacrificial system's acceptance-signs went dark, until the system itself ended. The same sugya frames the failures as divine displeasure, and Yochanan ben Zakkai reads the self-opening doors through Zechariah 11:1 as the Temple's doom.","tanakh":["Isaiah 1:18","Leviticus 16:7-10","Zechariah 11:1"],"nt":["Matthew 27:50-51","Hebrews 9:11-12","Hebrews 10:11-14","John 19:30"],"rabbinic":["Yoma 39b","Jerusalem Talmud Yoma 6:3","Rosh Hashanah 31b"],"sources":[{"name":"Yoma 39b (Sefaria)","type":"primary","url":"https://www.sefaria.org/Yoma.39b"},{"name":"Michael Brown, Answering Jewish Objections to Jesus, vol. 1","type":"apologetics","url":"https://askdrbrown.org"},{"name":"Jacob Neusner, translations and studies of the Talmudic aggadah","type":"scholarly","url":"https://www.brill.com"},{"name":"Outreach Judaism","type":"rabbinic","url":"https://outreachjudaism.org"}],"response":"The response: this is aggadah — homiletic memory, redacted centuries after the events, and 'forty years' is the Bible's and the Talmud's stock number for a generation (the wilderness, Eli, David); the same tractate says the thread's whitening had already become intermittent generations earlier, after Shimon HaTzaddik. The rabbis' own explanation for the withdrawal of favor is explicit and internal: the era's sins — notably baseless hatred (Yoma 9b) and the corruption of the late priesthood — not the rejection of a messianic claimant, which the sugya never mentions. Building chronology-dependent theology on a symbolic aggadic number, against its own stated context, is precisely the proof-texting Jews find in missionary literature.","responseSource":{"name":"Standard rabbinic reading of Yoma 39b with Yoma 9b; counter-missionary treatments (Outreach Judaism)"},"verdict":"admitted","rationale":"Admitted, in the strict sense defined for this section: the text exists, is Jewish, and says what it says — divine acceptance-signs failed for the Temple's final forty years, a span that lands at ~30 AD. But the rationale must carry the honesty: this is suggestive convergence, not proof; the number is schematic; and the sugya's own theology blames communal sin, not Golgotha. Present it as a question the tradition leaves open — 'what happened around 30 AD that your own sources remember as the turning point?' — never as a checkmate. Overplaying Yoma 39b is a known missionary tic that Jewish readers are primed to distrust; underplay it and it lands harder.","severity":"medium","quran":[],"hadith":["Yoma 39b","Jerusalem Talmud Yoma 6:3","Rosh Hashanah 31b"],"bible":["Isaiah 1:18","Leviticus 16:7-10","Zechariah 11:1","Matthew 27:50-51","Hebrews 9:11-12","Hebrews 10:11-14","John 19:30"]},
{"id":"atonement-after-the-temple","title":"Leviticus 17:11 and the vanished altar: what grounds atonement since 70 AD?","category":"temple-atonement","claim":"Leviticus grounds atonement in substitutionary blood: 'the life of the flesh is in the blood, and I have given it to you on the altar to make atonement for your souls; for it is the blood that makes atonement by the life' (17:11). Yom Kippur's machinery is blood carried into the holy place (Lev 16). In 70 AD the altar vanished, and with it the entire biblically mandated apparatus of sacrificial atonement — nineteen centuries and counting. Rabbinic Judaism answered with substitutes: repentance, prayer, and charity. The Christian claim is that the timing is not accident but design: within one generation of Jesus's death — which the NT presents as the sacrifice the system prefigured (Heb 9-10; Isa 53:10, where the servant's life is an asham, a guilt offering) — God let the shadow-system end because the substance had come. Hosea's prophecy fits the shape of the age: 'many days without king... without sacrifice' before Israel returns and seeks 'David their king' (Hos 3:4-5).","tanakh":["Leviticus 17:11","Leviticus 16:29-34","Isaiah 53:10","Hosea 3:4-5","Daniel 9:24"],"nt":["Hebrews 9:22-28","Hebrews 10:1-14","Romans 3:25-26","Matthew 26:28"],"rabbinic":["Mishnah Yoma 8:8-9","Avot deRabbi Natan 4","Berakhot 26b (prayers instituted in place of sacrifices)","Rosh Hashanah 18a"],"sources":[{"name":"Avot DeRabbi Natan 4 (Sefaria)","type":"primary","url":"https://www.sefaria.org/Avot_DeRabbi_Natan.4"},{"name":"Mishnah Yoma 8 (Sefaria)","type":"primary","url":"https://www.sefaria.org/Mishnah_Yoma.8.9"},{"name":"Michael Brown, Answering Jewish Objections to Jesus, vol. 2","type":"apologetics","url":"https://askdrbrown.org"},{"name":"Jews for Judaism on atonement without sacrifice","type":"rabbinic","url":"https://jewsforjudaism.org"}],"response":"The rabbinic counter is substantial and biblical: the Tanakh itself repeatedly shows atonement without blood. The poor bring a FLOUR sin-offering (Lev 5:11-13) — bloodless, yet 'the priest shall make atonement.' Hosea prescribes exile-piety: 'we will render the bulls of our lips' (14:2). Solomon's dedication prayer anticipates temple-less forgiveness through repentant prayer toward Jerusalem (1 Kings 8:46-50); Daniel prayed without a temple; Nineveh was forgiven by repentance alone (Jonah 3:10); 'the sacrifices of God are a broken spirit' (Ps 51:17); 'I desire mercy, not sacrifice' (Hos 6:6, cited by Yochanan ben Zakkai in ARN 4 — and by Jesus, Matt 9:13). Lev 17:11 addresses eating blood, not a universal atonement monopoly. God was never trapped in one mechanism.","responseSource":{"name":"Avot deRabbi Natan 4; Tovia Singer, Outreach Judaism; Jews for Judaism"},"verdict":"contested","rationale":"Graded contested because the rabbinic counter-case is real Bible, not evasion — flour offerings, Nineveh, and Psalm 51 must be conceded, and 'Judaism has no answer for sin' is a falsehood this site should kill. The genuine live question is narrower and worth posing with care: the Torah's own center of gravity for atonement — Yom Kippur, the altar, 'I have GIVEN it to you' — was blood and mediation; the substitutes were exilic accommodations the sources themselves frame as replacements (ARN 4 is a post-catastrophe consolation). Is a nineteen-century suspension of the Torah's central rite a footnote — or a signpost? Ask it as a question, in grief rather than triumph; this is the deepest disagreement, and the entry should feel its weight.","severity":"high","quran":[],"hadith":["Mishnah Yoma 8:8-9","Avot deRabbi Natan 4","Berakhot 26b (prayers instituted in place of sacrifices)","Rosh Hashanah 18a"],"bible":["Leviticus 17:11","Leviticus 16:29-34","Isaiah 53:10","Hosea 3:4-5","Daniel 9:24","Hebrews 9:22-28","Hebrews 10:1-14","Romans 3:25-26","Matthew 26:28"]},
{"id":"hosea-blindness-restoration-romans-11","title":"Israel's partial blindness and certain restoration — the frame that forbids contempt","category":"nt-jewishness","claim":"The Tanakh itself narrates a pattern for Israel: a long season without king or sacrifice, then wholehearted return — 'afterward the children of Israel shall return and seek the LORD their God and David their king in the latter days' (Hos 3:4-5); a spirit of deep sleep and sealed vision (Isa 29:10-14) that is lifted; scattering and regathering (Deut 30:1-6); the house of David looking on the pierced one and mourning, with a fountain opened for sin (Zech 12:10-13:1). Paul builds Romans 9-11 on exactly this pattern: Israel's present non-recognition of Jesus is 'partial and temporary' (Rom 11:25), engineered to bring the nations in, and it ends with 'all Israel will be saved' (11:26, citing Isa 59:20). The same chapter issues binding commands to gentile Christians: 'do not boast over the branches' (11:18), Israel remains 'beloved for the sake of the fathers,' and 'the gifts and the calling of God are irrevocable' (11:28-29). Christian contempt for Jews is not a regrettable excess of the system — it is disobedience to the system's own charter.","tanakh":["Hosea 3:4-5","Deuteronomy 30:1-6","Isaiah 29:10-14","Isaiah 59:20-21","Zechariah 12:10-13:1"],"nt":["Romans 11:1-2","Romans 11:17-29","Romans 9:1-5","Romans 3:1-2"],"rabbinic":["Sanhedrin 97b-98a (redemption through repentance in the latter days)"],"sources":[{"name":"Romans 11 in context (NETS/NA28 via Bible Gateway)","type":"primary","url":"https://www.biblegateway.com/passage/?search=Romans+11"},{"name":"Nostra Aetate (Vatican II, 1965)","type":"primary","url":"https://www.vatican.va/archive/hist_councils/ii_vatican_council/documents/vat-ii_decl_19651028_nostra-aetate_en.html"},{"name":"Kendall Soulen, The God of Israel and Christian Theology","type":"scholarly","url":"https://www.fortresspress.com"},{"name":"Michael Brown, Our Hands Are Stained with Blood","type":"apologetics","url":"https://askdrbrown.org"}],"response":"The Jewish response is not exegetical but historical, and it deserves full weight: whatever Romans 11 says, nineteen centuries of Christendom said otherwise — Justin claimed Israel's inheritance, Chrysostom preached against the synagogue, crusaders massacred Rhineland communities while Romans 11 sat in their Bibles, Luther's 'On the Jews and Their Lies' fed directly into 20th-century catastrophe. A charter that failed to restrain its own civilization for most of its history is fairly judged by its fruit (a test Jesus himself endorsed, Matt 7:16). Furthermore, 'all Israel will be saved' has itself been read supersessionistically ('Israel' = the church). A Jewish reader may reasonably conclude the text is at best ambiguous and at worst window-dressing.","responseSource":{"name":"Jules Isaac, The Teaching of Contempt; standard Jewish historical critique of Christendom"},"verdict":"unrefuted","rationale":"Unrefuted at the textual level — Romans 11's plain sense condemns replacement contempt, and the history of its violation is a history of Christians breaking their own scripture, which the entry must say in those words. This is the posture-defining entry of the section: it goes FIRST in any real conversation. Practical use: open with confession, not citation — name the crusades, the blood libels, the Holy Week pogroms, the Shoah's Christian antecedents — and only then show that the NT's own charter (Rom 3:2's 'oracles of God were entrusted' to Israel; Rom 9:4-5; Rom 11) sides with the Jewish people against their persecutors. A Christian who will not grieve the history has no standing to open the texts.","severity":"high","quran":[],"hadith":["Sanhedrin 97b-98a (redemption through repentance in the latter days)"],"bible":["Hosea 3:4-5","Deuteronomy 30:1-6","Isaiah 29:10-14","Isaiah 59:20-21","Zechariah 12:10-13:1","Romans 11:1-2","Romans 11:17-29","Romans 9:1-5","Romans 3:1-2"]},
{"id":"nt-jewish-library","title":"The New Testament is a Jewish library — and modern Jewish scholarship reads it that way","category":"nt-jewishness","claim":"Every NT author except (probably) Luke was a Jew; its earliest community was a Torah-observant Jerusalem congregation of 'many thousands of Jews... all zealous for the law' (Acts 21:20). Matthew structures his Gospel in five great discourses echoing the Chumash and presents Jesus as the greater Moses who came 'not to abolish the Torah or the Prophets... but to fulfill' (Matt 5:17). Jesus's disputes — divorce, Sabbath healing, hand-washing — run along recognized Pharisaic fault lines (Hillel vs. Shammai). Paul calls himself a Pharisee in the present tense decades after Damascus (Acts 23:6; Phil 3:5) and argues halakhically from the Tanakh. This is now the mainstream of critical scholarship, much of it Jewish: Geza Vermes ('Jesus the Jew'), E.P. Sanders, Amy-Jill Levine and Marc Brettler's Jewish Annotated New Testament (Oxford), and Daniel Boyarin, who argues even the divine 'Son of Man' Messiah is a Jewish idea (Dan 7) before it is a Christian one. Reading the NT is reading an intra-Jewish argument of the first century.","tanakh":["Daniel 7:13-14","Deuteronomy 18:15-19","Psalm 110:1"],"nt":["Matthew 5:17-20","Acts 21:20","Acts 23:6","Philippians 3:4-6","Romans 9:4-5"],"rabbinic":["Mishnah Gittin 9:10 (the Hillel/Shammai divorce dispute behind Matthew 19)","Shabbat 31a"],"sources":[{"name":"The Jewish Annotated New Testament (Levine & Brettler, Oxford)","type":"scholarly","url":"https://global.oup.com/academic/product/the-jewish-annotated-new-testament-9780190461850"},{"name":"Daniel Boyarin, The Jewish Gospels","type":"scholarly","url":"https://thenewpress.com/books/jewish-gospels"},{"name":"E.P. Sanders, Jesus and Judaism","type":"scholarly","url":"https://www.fortresspress.com"},{"name":"Geza Vermes, Jesus the Jew","type":"scholarly","url":"https://www.fortresspress.com"}],"response":"The response: Jewish authorship does not make a Jewish book — Spinoza was a Jew too. The NT as CANONIZED contains the seeds of the contempt: 'his blood be on us and on our children' (Matt 27:25), 'you are of your father the devil' (John 8:44), 1 Thess 2:14-16 — texts a Jewish reader encounters not as intra-Jewish rhetoric but as the proof-texts of pogroms. The 'parting of the ways' was real: whatever the first generation was, the church that transmitted these texts read them against the Jews for eighteen centuries. And theologically, the NT's claims — incarnation, a divine-human atoning mediator — cross lines (Deut 6:4; Num 23:19) that no amount of first-century Jewish context erases for rabbinic Judaism.","responseSource":{"name":"Amy-Jill Levine (on hearing NT polemic with Jewish ears); standard rabbinic objections to incarnation"},"verdict":"admitted","rationale":"Admitted: the Jewishness of Jesus and the NT is now the consensus of critical scholarship, led substantially by Jewish scholars — cite Vermes, Levine, Boyarin, not apologists. Use this entry to change what the conversation IS: not 'convert to a gentile religion' but 'consider a first-century Jewish claim about a Jewish figure, made by Jews, from the Jewish scriptures.' Handle the response's charge without flinching: acknowledge that Matthew 27:25 and John 8:44 were weaponized, explain their first-century setting honestly, and grant that context does not undo centuries of hearing. Boyarin's Daniel 7 argument is the advanced move: divine-Messiah categories predate Christianity within Judaism itself.","severity":"medium","quran":[],"hadith":["Mishnah Gittin 9:10 (the Hillel/Shammai divorce dispute behind Matthew 19)","Shabbat 31a"],"bible":["Daniel 7:13-14","Deuteronomy 18:15-19","Psalm 110:1","Matthew 5:17-20","Acts 21:20","Acts 23:6","Philippians 3:4-6","Romans 9:4-5"]},
{"id":"avoid-talmud-quote-mining","title":"DON'T USE: 'The Talmud says…' quote-mining and fabricated citations","category":"rabbinic-objections","claim":"A body of fabricated or butchered 'Talmud quotes' has circulated for three centuries — Eisenmenger's Entdecktes Judentum (1700), August Rohling's Der Talmudjude (1871), Pranaitis's The Talmud Unmasked (1892), Elizabeth Dilling's The Plot Against Christianity (1964) — and now recycles endlessly online: invented references, mistranslations, censored-context passages alleging the Talmud blesses deceiving gentiles or blasphemes Jesus and Mary. At the 1913 Beilis blood-libel trial, Pranaitis was destroyed on cross-examination, unable to answer elementary Talmud questions. The genuine scholarly question of the few disputed 'Yeshu' passages is treated soberly in Peter Schäfer's Jesus in the Talmud (Princeton) — late, polemical-era texts of contested referent, censored under Christian pressure, telling us about medieval Jewish-Christian conflict, not first-century facts. Christians who traffic in Talmud memes are laundering antisemitic forgeries into an evangelistic conversation.","tanakh":["Exodus 20:16","Proverbs 19:5"],"nt":["Ephesians 4:25","Romans 9:1-5"],"rabbinic":["Peter Schäfer, Jesus in the Talmud (on the disputed Yeshu passages)","Sanhedrin 43a (censored text, contested referent)"],"sources":[{"name":"Peter Schäfer, Jesus in the Talmud (Princeton UP)","type":"scholarly","url":"https://press.princeton.edu/books/paperback/9780691143187/jesus-in-the-talmud"},{"name":"ADL, resources on the Talmud in antisemitic polemics","type":"journalism","url":"https://www.adl.org"},{"name":"Sefaria (read the actual texts in context)","type":"primary","url":"https://www.sefaria.org"}],"response":"No steelman exists for fabrication. The only honest residue: a handful of genuine Talmudic passages may polemicize against a figure some manuscripts call Yeshu; scholars dispute whether he is Jesus of Nazareth (chronological details conflict by a century). Even at maximum, they attest that late-antique Jews rejected Christian claims — which everyone already knew — and they were composed under persecution by the church, a context Christians created. Quoting them as ammunition is citing a community's wounded polemic while ignoring who wounded it.","responseSource":{"name":"Peter Schäfer, Jesus in the Talmud; ADL documentation of fabricated quotes"},"verdict":"answered","rationale":"Do not use — kill the practice by name. The eighth commandment applies to citations: a Christian who forwards a fabricated Talmud quote bears false witness against a neighbor, in Christ's name, in a genre with a body count (the Beilis trial, Nazi propaganda reprints of Rohling). If a Talmud passage matters to an argument, the rule is: read it on Sefaria, in context, with the standard commentaries, or do not cite it. This entry exists so the site can say plainly: the counter-missionary rabbis are RIGHT about this practice, and Christians should thank them for policing it.","severity":"high","avoid":true,"quran":[],"hadith":["Peter Schäfer, Jesus in the Talmud (on the disputed Yeshu passages)","Sanhedrin 43a (censored text, contested referent)"],"bible":["Exodus 20:16","Proverbs 19:5","Ephesians 4:25","Romans 9:1-5"]},
{"id":"avoid-jews-killed-jesus","title":"DON'T USE: the 'Jews killed Jesus' framing (deicide)","category":"rabbinic-objections","claim":"The deicide charge is both theologically false by the NT's own account and historically the deadliest sentence in Christian rhetoric. The NT's account: crucifixion was a ROMAN penalty, executed by Roman soldiers under a Roman prefect's verdict; the Jewish participants were a narrow temple faction, not a people; Peter tells Jews in Jerusalem 'you acted in ignorance, as did your rulers' (Acts 3:17); the theological cause is the sin of all humanity within God's set plan — Acts 4:27-28 indicts Herod, Pilate, the gentiles AND Israel together, 'to do whatever your hand and your plan had predestined'; Isaiah 53:10 says 'it pleased the LORD to crush him'; Jesus says 'no one takes my life from me — I lay it down of my own accord' (John 10:18). Historically, Matthew 27:25 read as a blood-curse underwrote Holy Week pogroms, expulsions, and blood libels for centuries — a legacy formally repudiated in Nostra Aetate §4 (1965): Christ's passion 'cannot be charged against all the Jews then alive, nor against the Jews of today.'","tanakh":["Isaiah 53:10","Ezekiel 18:20","Deuteronomy 24:16"],"nt":["Acts 4:27-28","Acts 3:17","John 10:17-18","1 Corinthians 2:8","Luke 23:34"],"rabbinic":["Nostra Aetate 4 (church document repudiating the charge)"],"sources":[{"name":"Nostra Aetate (Vatican II, 1965)","type":"primary","url":"https://www.vatican.va/archive/hist_councils/ii_vatican_council/documents/vat-ii_decl_19651028_nostra-aetate_en.html"},{"name":"USHMM Holocaust Encyclopedia, antisemitism background","type":"journalism","url":"https://encyclopedia.ushmm.org/content/en/article/antisemitism"},{"name":"Jeremy Cohen, Christ Killers: The Jews and the Passion","type":"scholarly","url":"https://global.oup.com"},{"name":"Michael Brown, Our Hands Are Stained with Blood","type":"apologetics","url":"https://askdrbrown.org"}],"response":"There is no counter-argument to steelman — only the observation, which Jewish readers will rightly press, that the Gospels' passion narratives themselves (especially Matthew 27:25 and John's usage of 'the Jews') gave the charge its raw material, and that Christian theology cannot fully outsource the problem to 'misreaders.' A Christian using this framing has not merely erred tactically; he has contradicted his own scriptures and joined the persecutors' lineage.","responseSource":{"name":"Jules Isaac, The Teaching of Contempt; Nostra Aetate"},"verdict":"answered","rationale":"Do not use, ever, in any form — including softened versions ('your ancestors rejected him'). Theologically, the Christian confession is that MY sin required the cross; every communion liturgy says so. If the topic arises, the Christian's move is confession of the church's guilt for the deicide libel and its harvest of blood, followed if appropriate by Acts 4:27-28's actual theology of shared, predestined human responsibility. This entry exists to give the site's readers the exact language of repudiation and to mark the line: any 'Messiah case' that leans on collective Jewish guilt has already lost — biblically, historically, and morally.","severity":"high","avoid":true,"quran":[],"hadith":["Nostra Aetate 4 (church document repudiating the charge)"],"bible":["Isaiah 53:10","Ezekiel 18:20","Deuteronomy 24:16","Acts 4:27-28","Acts 3:17","John 10:17-18","1 Corinthians 2:8","Luke 23:34"]},
{"id":"avoid-legalism-caricature","title":"DON'T USE: 'Judaism is legalistic works-righteousness'","category":"rabbinic-objections","claim":"The caricature — Judaism as joyless rule-keeping to earn salvation, foil to Christian grace — is false on the sources and fatal to credibility. Rabbinic Judaism is saturated with grace: election precedes obligation ('All Israel has a share in the world to come,' Mishnah Sanhedrin 10:1); the liturgy pleads 'Avinu Malkeinu, be gracious to us and answer us, for we have no deeds' (chonneinu va'aneinu ki ein banu ma'asim); the Thirteen Attributes of Mercy (Ex 34:6-7) anchor the High Holy Days; chesed (covenant love) is arguably the Tanakh's central divine attribute. E.P. Sanders's Paul and Palestinian Judaism (1977) demolished the caricature academically, coining 'covenantal nomism': Jews keep Torah as covenant response to a gracious God, not as wage labor for salvation — a structure formally like Christian obedience. The REAL disagreement, which this site should state precisely, is not grace vs. works but the GROUND of atonement: whether repentance suffices, or whether God has provided a mediating sacrifice (Lev 17:11; Isa 53) in the Messiah.","tanakh":["Exodus 34:6-7","Micah 7:18-19","Psalm 103:8-14","Deuteronomy 7:7-8"],"nt":["Romans 9:31-10:4 (Paul's actual, narrower argument)","Philippians 3:4-9"],"rabbinic":["Mishnah Sanhedrin 10:1","Avinu Malkeinu (liturgy)","Berakhot 28b"],"sources":[{"name":"E.P. Sanders, Paul and Palestinian Judaism","type":"scholarly","url":"https://www.fortresspress.com"},{"name":"Mishnah Sanhedrin 10:1 (Sefaria)","type":"primary","url":"https://www.sefaria.org/Mishnah_Sanhedrin.10.1"},{"name":"The Jewish Annotated New Testament (essays on Paul and Judaism)","type":"scholarly","url":"https://global.oup.com/academic/product/the-jewish-annotated-new-testament-9780190461850"}],"response":"The only pushback worth noting runs the other way: some scholars (the 'new perspective' debate) argue Sanders overcorrected and that Second Temple sources do contain merit-weighing strands (e.g., 4 Ezra). True but irrelevant to the practice this entry bans: whatever the academic balance, telling a Jewish friend her religion is loveless legalism is false about the Judaism she actually lives — her Shabbat table, her liturgy of mercy, her grandmother's chesed — and instantly identifies the speaker as someone who has never read a page of the siddur.","responseSource":{"name":"E.P. Sanders, Paul and Palestinian Judaism; new-perspective literature (Dunn, Wright) and critics"},"verdict":"answered","rationale":"Do not use. It fails academically (Sanders), liturgically (Avinu Malkeinu), and relationally (it insults the hearer's lived experience). It also misreads Paul, whose argument in Romans 9-10 is about Israel's relationship to the Messiah, not about Jews lacking grace. Replace it with the honest fault line this section is built on: both traditions know grace and repentance; they divide over whether atonement finally requires the mediating sacrifice the Torah's own cult embodied — which is a real, respectful, biblical conversation instead of a slander.","severity":"medium","avoid":true,"quran":[],"hadith":["Mishnah Sanhedrin 10:1","Avinu Malkeinu (liturgy)","Berakhot 28b"],"bible":["Exodus 34:6-7","Micah 7:18-19","Psalm 103:8-14","Deuteronomy 7:7-8","Romans 9:31-10:4 (Paul's actual, narrower argument)","Philippians 3:4-9"]},
{"id":"avoid-gematria-bible-codes","title":"DON'T USE: gematria proofs and Bible codes","category":"rabbinic-objections","claim":"Arguments from equidistant letter sequences ('Yeshua encoded in Isaiah 53'), gematria equivalences, and Torah-code 'discoveries' should be banned from the Messiah case. The flagship academic claim (Witztum, Rips & Rosenberg, Statistical Science 1994) was formally answered by McKay, Bar-Natan, Bar-Hillel & Kalai, 'Solving the Bible Code Puzzle' (Statistical Science 14.2, 1999, 150-173), which showed the result 'fatally defective' — an artifact of flexible data selection. Answering journalist Michael Drosnin's challenge, McKay 'found' the Rabin assassination and other encoded prophecies in Moby-Dick. The method proves anything, therefore nothing: with enough freedom in spelling, skip distance, and appellation choice, any text of sufficient length yields any message. Christian use of codes borrows the least defensible fringe of Jewish mysticism to prop up a case that — as the rest of this section shows — can stand on the plain text, the Targums, and the Talmud read in context.","tanakh":["Deuteronomy 29:29","Isaiah 8:19-20"],"nt":["Luke 24:27 (Jesus argues from the plain scriptures, 'in all the scriptures')","Acts 17:2-3 ('reasoned from the scriptures')"],"rabbinic":["Witztum-Rips-Rosenberg, Statistical Science 1994 (the original ELS claim)"],"sources":[{"name":"McKay et al., 'Solving the Bible Code Puzzle,' Statistical Science 14.2 (1999)","type":"scholarly","url":"https://projecteuclid.org/journals/statistical-science/volume-14/issue-2/Solving-the-Bible-Code-Puzzle/10.1214/ss/1009212243.full"},{"name":"Brendan McKay's Torah codes refutation pages (incl. Moby-Dick 'codes')","type":"scholarly","url":"https://users.cecs.anu.edu.au/~bdm/dilugim/torah.html"},{"name":"Semantic Scholar record of the debate","type":"scholarly","url":"https://www.semanticscholar.org/paper/Solving-the-Bible-Code-Puzzle-McKay-Bar-Natan/a3a98b44e77d6d2aed61d390530094e25a9fe121"}],"response":"Defenders (Witztum's replies, the Meru Foundation) argue McKay's counter-experiments used looser rules than the original and that some ELS phenomena survive. But the methodological point is conceded even by sympathetic statisticians: results are exquisitely sensitive to researcher degrees of freedom, unfalsifiable in practice, and reproducible in secular control texts. No rabbinic authority rests doctrine on codes, and classical gematria (e.g., in Baal HaTurim) is homiletic ornament, never proof — a distinction the tradition itself maintains.","responseSource":{"name":"McKay, Bar-Natan, Bar-Hillel & Kalai, Statistical Science 1999; Witztum's rejoinders"},"verdict":"answered","rationale":"Do not use. Codes and gematria invert this section's whole epistemology: the Messiah case claims the PLAIN sense of public texts — the same verses the Targums and Talmud discuss — read the way Jesus himself argued 'from Moses and all the prophets' (Luke 24:27). Hidden-message arguments concede that the plain text is insufficient, collapse under statistics, and associate the gospel with Drosnin-grade sensationalism. If a reader arrives via a codes video, this entry redirects: the interesting question was never letter-skips in Isaiah 53 — it is what Isaiah 53 says.","severity":"low","avoid":true,"quran":[],"hadith":["Witztum-Rips-Rosenberg, Statistical Science 1994 (the original ELS claim)"],"bible":["Deuteronomy 29:29","Isaiah 8:19-20","Luke 24:27 (Jesus argues from the plain scriptures, 'in all the scriptures')","Acts 17:2-3 ('reasoned from the scriptures')"]}
];
