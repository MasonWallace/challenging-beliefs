{"id":"atonement-after-the-temple","title":"Leviticus 17:11 and the vanished altar: what grounds atonement since 70 AD?","category":"temple-atonement","claim":"Leviticus grounds forgiveness in blood offered in place of the sinner: 'the life of the flesh is in the blood, and I have given it to you on the altar to make atonement for your souls' (Leviticus 17:11). The Day of Atonement worked by blood carried into the holy place (Leviticus 16). In AD 70 the altar vanished, and with it the entire system the Torah lays out — for nineteen centuries and counting. Rabbinic Judaism answered with repentance, prayer and charity. The Christian claim is that the timing is not an accident. Within one generation of Jesus's death — which the New Testament presents as the sacrifice the whole system pointed to, and which Isaiah 53:10 calls a guilt offering — God let the shadow end because the substance had come. Hosea 3:4-5 describes the shape of the age: many days without king and without sacrifice, before Israel returns and seeks 'David their king.'","tanakh":["Leviticus 17:11","Leviticus 16:29-34","Isaiah 53:10","Hosea 3:4-5","Daniel 9:24"],"nt":["Hebrews 9:22-28","Hebrews 10:1-14","Romans 3:25-26","Matthew 26:28"],"rabbinic":["Mishnah Yoma 8:8-9","Avot deRabbi Natan 4","Berakhot 26b (prayers instituted in place of sacrifices)","Rosh Hashanah 18a"],"sources":[{"name":"Avot DeRabbi Natan 4 (Sefaria)","type":"primary","url":"https://www.sefaria.org/Avot_DeRabbi_Natan.4"},{"name":"Mishnah Yoma 8 (Sefaria)","type":"primary","url":"https://www.sefaria.org/Mishnah_Yoma.8.9"},{"name":"Michael Brown, Answering Jewish Objections to Jesus, vol. 2","type":"apologetics","url":"https://askdrbrown.org"},{"name":"Jews for Judaism on atonement without sacrifice","type":"rabbinic","url":"https://jewsforjudaism.org"}],"response":"This answer is substantial, and it is made from the Bible rather than around it. The Hebrew Bible repeatedly shows atonement without blood. A poor Israelite brings a <i>flour</i> sin-offering in Leviticus 5:11-13 — no blood at all — and 'the priest shall make atonement.' Hosea 14:2 prescribes the words of repentant lips instead of bulls. Solomon's dedication prayer in 1 Kings 8:46-50 anticipates forgiveness with no Temple, through repentant prayer. Daniel prayed without a Temple. Nineveh was forgiven for repentance alone in Jonah 3:10. Psalm 51:17 says the sacrifices of God are a broken spirit. And Hosea 6:6 — 'I desire mercy, not sacrifice' — was quoted by Rabbi Yochanan ben Zakkai after the Temple fell, and by Jesus in Matthew 9:13. Leviticus 17:11, they add, is about eating blood, not a monopoly on forgiveness.","responseSource":{"name":"Leviticus 5:11-13 and Hosea 6:6 on Sefaria; Avot de-Rabbi Natan 4","url":"https://www.sefaria.org/Avot_D'Rabbi_Natan.4"},"verdict":"contested","rationale":"Graded <b>Contested</b> — this counter-case is real Bible, not evasion. Flour offerings, Nineveh and Psalm 51 have to be conceded, and the claim that 'Judaism has no answer for sin' is simply false — this site should say so plainly. The genuinely open question is narrower, and worth asking carefully rather than triumphantly. The Torah's own centre of gravity for atonement is Yom Kippur, the altar and the blood. Judaism after 70 AD had to build a system without them. Asking where the Torah authorises that is a fair question. Claiming Judaism has nothing to say is not.","severity":"high","rewritten":true,"plain":[{"t":"What the law of Moses says","d":"Leviticus 17:11 is direct: <b>\"it is the blood that maketh an atonement for the soul.\"</b> Atonement happens through blood placed on an altar. That altar stood in the Temple in Jerusalem, and nowhere else."},{"t":"What happened to the altar","d":"Rome destroyed the Temple in AD 70. It has never been rebuilt. So the one thing Leviticus names as the means of atonement has been gone for nineteen centuries."},{"t":"How Judaism answered","d":"With prayer, repentance and acts of kindness. This is a serious answer, worked out by people facing a catastrophe, and it has carried Judaism for a very long time. Treat it with respect or the conversation is over."},{"t":"The question worth asking once","d":"The Torah names blood on an altar. The rabbinic answer names something else. So: where does the Torah authorise the replacement? Ask it gently, once, and then stop talking."},{"t":"How strong is this argument?","d":"Contested. The question is real and hard. The Jewish answer is not stupid, and treating it as stupid will end the conversation on the spot."},{"say":true,"t":"What to say","d":"\"Leviticus 17:11 grounds atonement in blood on an altar. What grounds it now?\""}],"quran":[],"hadith":["Mishnah Yoma 8:8-9","Avot deRabbi Natan 4","Berakhot 26b (prayers instituted in place of sacrifices)","Rosh Hashanah 18a"],"bible":["Leviticus 17:11","Leviticus 16:29-34","Isaiah 53:10","Hosea 3:4-5","Daniel 9:24","Hebrews 9:22-28","Hebrews 10:1-14","Romans 3:25-26","Matthew 26:28"]},
{"id":"hosea-blindness-restoration-romans-11","title":"Israel's partial blindness and certain restoration — the frame that forbids contempt","category":"nt-jewishness","claim":"The Hebrew Bible itself describes a pattern for Israel. A long season without king or sacrifice, then a wholehearted return — 'afterward the children of Israel shall return and seek the LORD their God and David their king' (Hosea 3:4-5). A spirit of deep sleep and sealed vision that is later lifted (Isaiah 29:10-14). Scattering and regathering (Deuteronomy 30:1-6). The house of David looking on the pierced one and mourning, with a fountain opened for sin (Zechariah 12:10-13:1). Paul builds Romans 9-11 on exactly that pattern. Israel's present non-recognition of Jesus is 'partial and temporary' (Romans 11:25), and it ends with 'all Israel will be saved' (Romans 11:26). The same chapter gives binding orders to gentile Christians: 'do not boast over the branches' (Romans 11:18). Israel remains 'beloved for the sake of the fathers,' and 'the gifts and the calling of God are irrevocable.' Christian contempt for Jews is not an excess of the system. It is disobedience to the system's own charter.","tanakh":["Hosea 3:4-5","Deuteronomy 30:1-6","Isaiah 29:10-14","Isaiah 59:20-21","Zechariah 12:10-13:1"],"nt":["Romans 11:1-2","Romans 11:17-29","Romans 9:1-5","Romans 3:1-2"],"rabbinic":["Sanhedrin 97b-98a (redemption through repentance in the latter days)"],"sources":[{"name":"Romans 11 in context (NETS/NA28 via Bible Gateway)","type":"primary","url":"https://www.biblegateway.com/passage/?search=Romans+11"},{"name":"Nostra Aetate (Vatican II, 1965)","type":"primary","url":"https://www.vatican.va/archive/hist_councils/ii_vatican_council/documents/vat-ii_decl_19651028_nostra-aetate_en.html"},{"name":"Kendall Soulen, The God of Israel and Christian Theology","type":"scholarly","url":"https://www.fortresspress.com"},{"name":"Michael Brown, Our Hands Are Stained with Blood","type":"apologetics","url":"https://askdrbrown.org"}],"response":"This objection is not about interpretation at all. It is historical, and it deserves full weight. Whatever Romans 11 says, nineteen centuries of Christendom said otherwise. Justin Martyr claimed Israel's inheritance for the church. Chrysostom preached against the synagogue. Crusaders massacred the Rhineland communities with Romans 11 sitting in their Bibles. Luther's <i>On the Jews and Their Lies</i> fed directly into the twentieth century. A charter that failed to restrain its own civilisation for most of its history can fairly be judged by its fruit — a test Jesus endorsed in Matthew 7:16. They add that even 'all Israel will be saved' has been read as meaning the church. A Jewish reader may reasonably conclude the text is ambiguous at best, and decoration at worst.","responseSource":{"name":"Nostra Aetate §4 (1965), Holy See","url":"https://www.vatican.va/archive/hist_councils/ii_vatican_council/documents/vat-ii_decl_19651028_nostra-aetate_en.html"},"verdict":"unrefuted","rationale":"Graded <b>Strong</b> at the level of the text. The plain sense of Romans 11 condemns replacement theology and the contempt that grew from it. But the history of its violation is a history of Christians breaking their own scripture, and this entry has to say that in exactly those words. This is the entry that sets the posture for the whole section, and it goes first in any real conversation. In practice: open with confession, not with argument.","severity":"high","rewritten":true,"plain":[{"t":"Before you open any verse","d":"A Christian has to deal with what Christians have done. The Crusades. The blood libel — the lie that Jews murdered Christian children. The expulsions from England and Spain. Luther's writings. Then Christian Europe between 1941 and 1945."},{"t":"The New Testament forbids it","d":"Paul asks in Romans 11:1 whether God has cast away his people. He answers <b>\"God forbid.\"</b> In Romans 11:29 he says God's calling of Israel <b>\"cannot be revoked.\"</b> He describes the blindness as partial, and temporary, and ending."},{"t":"And the warning to Christians","d":"Paul tells non-Jewish believers they are a branch grafted into someone else's tree. Then in Romans 11:18 he warns them directly: <b>\"boast not against the branches.\"</b> The arrogance behind a thousand years of violence is condemned inside the New Testament itself."},{"t":"How strong is this argument?","d":"Strong. There is no honest reading of Romans 11 that supports contempt. Christians who held one were reading against their own book."},{"t":"Why this helps you","d":"Say this first, unprompted, before you open anything else. Your friend has probably spent their whole life waiting for a Christian who says it without being pushed into it."},{"say":true,"t":"What to say","d":"\"I know what the word Christian has meant to Jewish families. I'm not going to pretend otherwise.\""}],"quran":[],"hadith":["Sanhedrin 97b-98a (redemption through repentance in the latter days)"],"bible":["Hosea 3:4-5","Deuteronomy 30:1-6","Isaiah 29:10-14","Isaiah 59:20-21","Zechariah 12:10-13:1","Romans 11:1-2","Romans 11:17-29","Romans 9:1-5","Romans 3:1-2"]},
{"id":"nt-jewish-library","title":"The New Testament is a Jewish library — and modern Jewish scholarship reads it that way","category":"nt-jewishness","claim":"Every New Testament author except probably Luke was a Jew. Its earliest community was a Torah-keeping Jerusalem congregation of 'many thousands of Jews… all zealous for the law' (Acts 21:20). Matthew builds his Gospel around five great discourses, echoing the five books of Moses, and presents Jesus as the greater Moses who came 'not to abolish the Torah or the Prophets… but to fulfil' (Matthew 5:17). Jesus's arguments — over divorce, Sabbath healing, hand-washing — run along recognised Pharisaic fault lines of his day. Paul calls himself a Pharisee in the present tense, decades after Damascus (Acts 23:6). This is now the mainstream of critical scholarship, and much of it is Jewish work: Geza Vermes's <i>Jesus the Jew</i>, E. P. Sanders, the Jewish Annotated New Testament edited by Amy-Jill Levine and Marc Brettler, and Daniel Boyarin, who argues that even the divine 'Son of Man' Messiah is a Jewish idea before it is a Christian one.","tanakh":["Daniel 7:13-14","Deuteronomy 18:15-19","Psalm 110:1"],"nt":["Matthew 5:17-20","Acts 21:20","Acts 23:6","Philippians 3:4-6","Romans 9:4-5"],"rabbinic":["Mishnah Gittin 9:10 (the Hillel/Shammai divorce dispute behind Matthew 19)","Shabbat 31a"],"sources":[{"name":"The Jewish Annotated New Testament (Levine & Brettler, Oxford)","type":"scholarly","url":"https://global.oup.com/academic/product/the-jewish-annotated-new-testament-9780190461850"},{"name":"Daniel Boyarin, The Jewish Gospels","type":"scholarly","url":"https://thenewpress.com/books/jewish-gospels"},{"name":"E.P. Sanders, Jesus and Judaism","type":"scholarly","url":"https://www.fortresspress.com"},{"name":"Geza Vermes, Jesus the Jew","type":"scholarly","url":"https://www.fortresspress.com"}],"response":"They answer that Jewish authorship does not make a book Jewish — Spinoza was a Jew too. The New Testament as it was finally canonised contains the seeds of the contempt. 'His blood be on us and on our children' in Matthew 27:25. 'You are of your father the devil' in John 8:44. 1 Thessalonians 2:14-16. A Jewish reader does not meet these as arguments inside a Jewish family. They meet them as the proof-texts of pogroms. The parting of the ways was real: whatever the first generation was, the church that carried these texts read them against Jews for eighteen centuries. And theologically, the New Testament's claims — incarnation, and a divine-human mediator who atones — cross lines drawn at Deuteronomy 6:4 and Numbers 23:19 that no amount of first-century context erases.","responseSource":{"name":"Levine & Brettler, The Jewish Annotated New Testament (Oxford)","url":"https://global.oup.com/academic/product/the-jewish-annotated-new-testament-9780190461850"},"verdict":"admitted","rationale":"Conceded. The Jewishness of Jesus and of the New Testament is now the mainstream view in critical scholarship, and Jewish scholars have led much of that work. Cite Geza Vermes, Amy-Jill Levine and Daniel Boyarin rather than Christian apologists — the point only works if the sources have no stake in it. Use this entry to change what the conversation <i>is</i>. You are not asking someone to convert to a gentile religion. You are asking them to consider a first-century Jewish claim about a Jewish figure, made by Jews.","severity":"medium","rewritten":true,"plain":[{"t":"How it usually looks","d":"Many Jewish people meet the New Testament one way. It is the book of the religion that hurt their families. That makes it almost impossible to read as anything else. The reaction is earned."},{"t":"What the documents actually are","d":"Set the history aside for a moment and look at the books themselves. They were written almost entirely by Jews. They argue from the Hebrew Bible. They are about a Jewish teacher. They were written within a few decades, largely for Jewish readers."},{"t":"Who is saying this","d":"Not Christian apologists. Amy-Jill Levine is a Jewish New Testament scholar. She helped edit the Jewish Annotated New Testament. Daniel Boyarin is another Jewish scholar. He argues that a divine, suffering Messiah was already a Jewish idea before Christianity."},{"t":"How strong is this argument?","d":"Very strong. Jewish scholars are saying it, and they have no reason to want the Christian conclusion."},{"t":"Why this helps you","d":"You are not asking anyone to stop being Jewish. The first followers of Jesus kept the feasts and argued from the Hebrew Bible in synagogues. That is a very different request from the one your friend is expecting."},{"say":true,"t":"What to say","d":"\"Have you seen Levine's Jewish Annotated New Testament? I'd be interested what you think of it.\""}],"quran":[],"hadith":["Mishnah Gittin 9:10 (the Hillel/Shammai divorce dispute behind Matthew 19)","Shabbat 31a"],"bible":["Daniel 7:13-14","Deuteronomy 18:15-19","Psalm 110:1","Matthew 5:17-20","Acts 21:20","Acts 23:6","Philippians 3:4-6","Romans 9:4-5"]},
{"id":"avoid-talmud-quote-mining","title":"DON'T USE: 'The Talmud says…' quote-mining and fabricated citations","category":"rabbinic-objections","claim":"A body of fake and mangled 'Talmud quotes' has been circulating for three centuries. It runs from Eisenmenger in 1700, through August Rohling's <i>Der Talmudjude</i> in 1871 and Pranaitis's <i>The Talmud Unmasked</i> in 1892, to Elizabeth Dilling in 1964 — and now recycles endlessly online. Invented references. Mistranslations. Passages stripped of the context that reverses them, alleging the Talmud blesses deceiving gentiles or blasphemes Jesus and Mary. At the 1913 Beilis blood-libel trial, Pranaitis was destroyed under cross-examination, unable to answer basic questions about the Talmud. The genuine scholarly question about the few disputed 'Yeshu' passages is handled soberly in Peter Schäfer's <i>Jesus in the Talmud</i>: late texts, of contested reference, censored under Christian pressure, telling us about medieval conflict rather than first-century fact. Christians who pass on Talmud memes are laundering antisemitic forgeries into an evangelistic conversation.","tanakh":["Exodus 20:16","Proverbs 19:5"],"nt":["Ephesians 4:25","Romans 9:1-5"],"rabbinic":["Peter Schäfer, Jesus in the Talmud (on the disputed Yeshu passages)","Sanhedrin 43a (censored text, contested referent)"],"sources":[{"name":"Peter Schäfer, Jesus in the Talmud (Princeton UP)","type":"scholarly","url":"https://press.princeton.edu/books/paperback/9780691143187/jesus-in-the-talmud"},{"name":"ADL, resources on the Talmud in antisemitic polemics","type":"journalism","url":"https://www.adl.org"},{"name":"Sefaria (read the actual texts in context)","type":"primary","url":"https://www.sefaria.org"}],"response":"There is no steelman for fabrication. Here is the only honest residue. A few genuine Talmudic passages may argue against a figure some manuscripts call Yeshu. Scholars dispute whether that is Jesus of Nazareth at all — the chronological details are off by about a century. At most they show that Jews in late antiquity rejected Christian claims, which everybody already knew. And they were written under persecution by the church. Quoting them as ammunition means citing a wounded community's polemic while ignoring who wounded it.","responseSource":{"name":"Peter Schäfer, Jesus in the Talmud (Princeton)","url":"https://press.princeton.edu/books/paperback/9780691143187/jesus-in-the-talmud"},"verdict":"answered","rationale":"Do not use this, and name the practice when you see it. The commandment against false witness applies to citations. A Christian who forwards a fabricated Talmud quote is bearing false witness against a neighbour, in Christ's name, in a genre with a body count — the Beilis trial, and Nazi reprints of Rohling. If a Talmud passage genuinely matters to your argument, the rule is simple: read it in context on Sefaria first, or do not use it.","severity":"high","avoid":true,"rewritten":true,"plain":[{"t":"What you'll find online","d":"Lists of shocking quotations said to come from the Talmud. They are easy to find and they look damning. Do not use them."},{"t":"Why they fail","d":"Most are made up, mistranslated, or cut away from the words around them. The Talmud is a huge record of debate. It writes down the losing side of an argument next to the winning side. So a quotation can be the exact opposite of the ruling."},{"t":"Where they come from","d":"Most of these lists trace back to the Middle Ages. They were assembled for forced public debates, to justify what was done next. That is the company you keep when you repeat them."},{"t":"The rule","d":"If you cannot read the passage in context on Sefaria, do not use it. That check takes thirty seconds, and your friend can do it faster than you can."},{"say":true,"t":"What to say","d":"If you have used one: \"I repeated something about the Talmud once that turned out to be fake. I stopped doing that.\""}],"quran":[],"hadith":["Peter Schäfer, Jesus in the Talmud (on the disputed Yeshu passages)","Sanhedrin 43a (censored text, contested referent)"],"bible":["Exodus 20:16","Proverbs 19:5","Ephesians 4:25","Romans 9:1-5"]},
{"id":"avoid-jews-killed-jesus","title":"DON'T USE: the 'Jews killed Jesus' framing (deicide)","category":"rabbinic-objections","claim":"The deicide charge is false by the New Testament's own account, and historically it is the deadliest sentence in Christian rhetoric. Start with the account. Crucifixion was a Roman penalty, carried out by Roman soldiers on a Roman prefect's verdict. The Jewish participants were a narrow Temple faction, not a people. Peter tells Jews in Jerusalem 'you acted in ignorance, as did your rulers' (Acts 3:17). Acts 4:27-28 names Herod, Pilate, the gentiles <i>and</i> Israel together. Isaiah 53:10 says 'it pleased the LORD to crush him.' And Jesus says 'no one takes my life from me — I lay it down of my own accord' (John 10:18). Now the history. Matthew 27:25, read as a blood-curse, underwrote Holy Week pogroms, expulsions and blood libels for centuries. The Catholic Church formally repudiated it in 1965: Christ's passion 'cannot be charged against all the Jews then alive, nor against the Jews of today.'","tanakh":["Isaiah 53:10","Ezekiel 18:20","Deuteronomy 24:16"],"nt":["Acts 4:27-28","Acts 3:17","John 10:17-18","1 Corinthians 2:8","Luke 23:34"],"rabbinic":["Nostra Aetate 4 (church document repudiating the charge)"],"sources":[{"name":"Nostra Aetate (Vatican II, 1965)","type":"primary","url":"https://www.vatican.va/archive/hist_councils/ii_vatican_council/documents/vat-ii_decl_19651028_nostra-aetate_en.html"},{"name":"USHMM Holocaust Encyclopedia, antisemitism background","type":"journalism","url":"https://encyclopedia.ushmm.org/content/en/article/antisemitism"},{"name":"Jeremy Cohen, Christ Killers: The Jews and the Passion","type":"scholarly","url":"https://global.oup.com"},{"name":"Michael Brown, Our Hands Are Stained with Blood","type":"apologetics","url":"https://askdrbrown.org"}],"response":"There is no counter-argument to put at its strongest here. There is only an observation your Jewish friend will rightly press. The passion narratives themselves supplied the raw material — especially Matthew 27:25, and John's repeated use of 'the Jews.' Christian theology cannot fully hand the problem off to misreaders. A Christian who uses this framing has not merely made a tactical mistake. He has contradicted his own scriptures and stepped into the persecutors' line.","responseSource":{"name":"Nostra Aetate §4 (1965), Holy See","url":"https://www.vatican.va/archive/hist_councils/ii_vatican_council/documents/vat-ii_decl_19651028_nostra-aetate_en.html"},"verdict":"answered","rationale":"Do not use it, ever, in any form — including the softened versions, like 'your ancestors rejected him.' Theologically the Christian confession is that <i>my</i> sin required the cross. Every communion service says so. If the subject comes up, the Christian move is confession: the church's guilt for the deicide charge and everything it harvested. Then, only if invited, the history of who actually ordered the execution.","severity":"high","avoid":true,"rewritten":true,"plain":[{"t":"Why this one is different","d":"Most entries on this list are about losing an argument. This one is not. This is the specific claim that sat underneath a thousand years of killing."},{"t":"What it caused","d":"The Rhineland massacres of 1096. The blood libel invented at Norwich in 1144 and repeated for centuries. Easter pogroms. Expulsions. And a vocabulary that was still in use in the twentieth century."},{"t":"It is also bad reading","d":"A Roman governor ordered the execution and Roman soldiers carried it out. The New Testament spreads the responsibility very differently — and in John 10:18 Jesus says plainly that nobody takes his life from him."},{"t":"The rule","d":"If any version of this phrase is in your vocabulary, take it out. Not softened. Out."},{"say":true,"t":"What to say","d":"Nothing. This is one to never say — not one to say better."}],"quran":[],"hadith":["Nostra Aetate 4 (church document repudiating the charge)"],"bible":["Isaiah 53:10","Ezekiel 18:20","Deuteronomy 24:16","Acts 4:27-28","Acts 3:17","John 10:17-18","1 Corinthians 2:8","Luke 23:34"]},
{"id":"avoid-legalism-caricature","title":"DON'T USE: 'Judaism is legalistic works-righteousness'","category":"rabbinic-objections","claim":"The caricature — Judaism as joyless rule-keeping to earn salvation, set against Christian grace — is false on the sources, and it destroys your credibility. Rabbinic Judaism is soaked in grace. Election comes before obligation: 'All Israel has a share in the world to come' (Mishnah Sanhedrin 10:1). The High Holy Day liturgy pleads <i>Avinu Malkeinu</i> — 'be gracious to us and answer us, for we have no deeds.' The Thirteen Attributes of Mercy from Exodus 34:6-7 anchor those days. And <i>chesed</i>, covenant love, is arguably the central divine attribute in the whole Hebrew Bible. E. P. Sanders demolished the caricature academically in 1977, coining the phrase 'covenantal nomism': Jews keep Torah as a response to a gracious God, not as wages earned. The real disagreement is narrower and worth stating precisely. It is not grace versus works. It is the ground of atonement — whether repentance is enough, or whether God has provided a sacrifice.","tanakh":["Exodus 34:6-7","Micah 7:18-19","Psalm 103:8-14","Deuteronomy 7:7-8"],"nt":["Romans 9:31-10:4 (Paul's actual, narrower argument)","Philippians 3:4-9"],"rabbinic":["Mishnah Sanhedrin 10:1","Avinu Malkeinu (liturgy)","Berakhot 28b"],"sources":[{"name":"E.P. Sanders, Paul and Palestinian Judaism","type":"scholarly","url":"https://www.fortresspress.com"},{"name":"Mishnah Sanhedrin 10:1 (Sefaria)","type":"primary","url":"https://www.sefaria.org/Mishnah_Sanhedrin.10.1"},{"name":"The Jewish Annotated New Testament (essays on Paul and Judaism)","type":"scholarly","url":"https://global.oup.com/academic/product/the-jewish-annotated-new-testament-9780190461850"}],"response":"The only real pushback runs the other way. Some scholars in the 'new perspective' debate argue that E. P. Sanders overcorrected, and that Second Temple sources do contain strands where merit is weighed — 4 Ezra, for instance. That is true, and irrelevant to the practice this entry bans. Whatever the academic balance turns out to be, telling a Jewish friend her religion is loveless rule-keeping is false about the Judaism she actually lives — her Shabbat table, her liturgy of mercy, her grandmother's kindness. It also identifies the speaker instantly as someone who has never read a page of the prayer book.","responseSource":{"name":"E. P. Sanders, Paul and Palestinian Judaism (Fortress Press)","url":"https://www.fortresspress.com/store/product/9780800618995/Paul-and-Palestinian-Judaism"},"verdict":"answered","rationale":"Do not use it. It fails academically, after Sanders. It fails liturgically — read Avinu Malkeinu, which is a prayer for undeserved mercy. And it fails relationally, because it insults the hearer's own life. It also misreads Paul, whose argument in Romans 9-10 is about Israel and the Messiah, not about Jews lacking grace. Replace it with the honest dividing line this whole section is built on: both traditions believe in grace, and disagree about who the Messiah is.","severity":"medium","avoid":true,"rewritten":true,"plain":[{"t":"What most Christians were taught","d":"That Judaism is about earning God's favour by keeping rules, and that Jesus and Paul replaced that with grace. It is a tidy story. It is also wrong."},{"t":"What scholarship showed","d":"E. P. Sanders took this apart in 1977 and the field moved. Judaism in Jesus's day was a religion of <b>covenant grace with obligations</b>. You are in because God chose you, and you live accordingly. That is closer to the New Testament than the caricature is."},{"t":"Why it costs you","d":"Repeating it tells your Jewish friend you have never actually asked them what they believe. You are arguing with a cartoon, and they can hear it immediately."},{"t":"What to do instead","d":"Ask. You will learn something true, and you will be trusted with the answer."},{"say":true,"t":"What to say","d":"\"What do you actually believe about how a person stands right with God?\""}],"quran":[],"hadith":["Mishnah Sanhedrin 10:1","Avinu Malkeinu (liturgy)","Berakhot 28b"],"bible":["Exodus 34:6-7","Micah 7:18-19","Psalm 103:8-14","Deuteronomy 7:7-8","Romans 9:31-10:4 (Paul's actual, narrower argument)","Philippians 3:4-9"]},
{"id":"avoid-gematria-bible-codes","title":"DON'T USE: gematria proofs and Bible codes","category":"rabbinic-objections","claim":"Arguments from letter-skipping codes, gematria sums and Torah-code 'discoveries' should be banned from this case entirely. The flagship academic claim was published by Witztum, Rips and Rosenberg in <i>Statistical Science</i> in 1994. It was formally answered in the same journal in 1999 by McKay, Bar-Natan, Bar-Hillel and Kalai, who showed the result was 'fatally defective' — an artifact of flexible data selection. Answering a challenge from the journalist Michael Drosnin, McKay then 'found' the Rabin assassination and other encoded prophecies in <i>Moby-Dick</i>. The method proves anything, and therefore nothing. Given enough freedom in spelling, skip distance and name choice, any long text yields any message. Christian use of codes borrows the least defensible fringe of Jewish mysticism to prop up a case that — as the rest of this section shows — stands perfectly well on the plain text, the Targums and the Talmud read in context.","tanakh":["Deuteronomy 29:29","Isaiah 8:19-20"],"nt":["Luke 24:27 (Jesus argues from the plain scriptures, 'in all the scriptures')","Acts 17:2-3 ('reasoned from the scriptures')"],"rabbinic":["Witztum-Rips-Rosenberg, Statistical Science 1994 (the original ELS claim)"],"sources":[{"name":"McKay et al., 'Solving the Bible Code Puzzle,' Statistical Science 14.2 (1999)","type":"scholarly","url":"https://projecteuclid.org/journals/statistical-science/volume-14/issue-2/Solving-the-Bible-Code-Puzzle/10.1214/ss/1009212243.full"},{"name":"Brendan McKay's Torah codes refutation pages (incl. Moby-Dick 'codes')","type":"scholarly","url":"https://users.cecs.anu.edu.au/~bdm/dilugim/torah.html"},{"name":"Semantic Scholar record of the debate","type":"scholarly","url":"https://www.semanticscholar.org/paper/Solving-the-Bible-Code-Puzzle-McKay-Bar-Natan/a3a98b44e77d6d2aed61d390530094e25a9fe121"}],"response":"Defenders — Witztum's replies, and the Meru Foundation — argue that Brendan McKay's counter-experiments used looser rules than the original study, and that some equidistant-letter phenomena survive scrutiny. But the methodological point is conceded even by sympathetic statisticians. The results are extremely sensitive to the choices the researcher makes, they cannot be falsified in practice, and the same effects reproduce in ordinary secular books. No rabbinic authority rests doctrine on codes. Classical gematria, as in the Baal HaTurim, is homiletic ornament and never proof — a distinction the tradition itself is careful about.","responseSource":{"name":"McKay, Bar-Natan, Bar-Hillel & Kalai, \"Solving the Bible Code Puzzle\", Statistical Science 14:2 (1999)","url":"https://projecteuclid.org/journals/statistical-science/volume-14/issue-2/Solving-the-Bible-Code-Puzzle/10.1214/ss/1009212243.full"},"verdict":"answered","rationale":"Do not use it. Codes and gematria invert this section's entire method. The Messiah case rests on the plain sense of public texts — the same verses the Targums and the Talmud discuss — read the way Jesus himself argued on the Emmaus road, 'from Moses and all the prophets' in Luke 24:27. A hidden-message argument concedes that the plain text is not enough. It also cannot be checked, which is the one thing every argument on this site is supposed to be.","severity":"low","avoid":true,"rewritten":true,"plain":[{"t":"What these are","d":"Gematria gives Hebrew letters number values and adds them up. Bible codes claim that skipping letters at fixed intervals spells out hidden messages. Both get used in Christian outreach as if they were evidence."},{"t":"Why they fail","d":"Researchers ran the same methods on <i>Moby-Dick</i> and <i>War and Peace</i>. They produced equally striking \"predictions,\" including assassinations. Any long book will do this, because the method finds patterns instead of testing them."},{"t":"What it signals","d":"Using them tells a thoughtful person that you cannot tell a pattern from a proof. Every real argument you make afterwards gets quietly discounted."},{"t":"The rule","d":"Drop them. The case from Isaiah 53, Daniel 9 and Yoma 39b does not need help from number games, and is weakened by standing next to them."},{"say":true,"t":"What to say","d":"\"I don't use the Bible-codes material. I don't think it holds up, and it isn't needed.\""}],"quran":[],"hadith":["Witztum-Rips-Rosenberg, Statistical Science 1994 (the original ELS claim)"],"bible":["Deuteronomy 29:29","Isaiah 8:19-20","Luke 24:27 (Jesus argues from the plain scriptures, 'in all the scriptures')","Acts 17:2-3 ('reasoned from the scriptures')"]}
];

e, and worshipped Daniel, and commanded that they should offer an oblation and sweet odours unto him."},{"v":47,"t":"The king answered unto Daniel, and said, Of a truth it is, that your God is a God of gods, and a Lord of kings, and a revealer of secrets, seeing thou couldest reveal this secret."}]},"Luke 7:18-23":{"ref":"Luke 7","cited":"18-23","verses":[{"v":15,"t":"And he that was dead sat up, and began to speak. And he delivered him to his mother."},{"v":16,"t":"And there came a fear on all: and they glorified God, saying, That a great prophet is risen up among us; and, That God hath visited his people."},{"v":17,"t":"And this rumour of him went forth throughout all Judæa, and throughout all the region round about."},{"v":18,"t":"And the disciples of John shewed him of all these things.","hl":1},{"v":19,"t":"And John calling unto him two of his disciples sent them to Jesus, saying, Art thou he that should come? or look we for another?","hl":1},{"v":20,"t":"When the men were come unto him, they said, John Baptist hath sent us unto thee, saying, Art thou he that should come? or look we for another?","hl":1},{"v":21,"t":"And in that same hour he cured many of their infirmities and plagues, and of evil spirits; and unto many that were blind he gave sight.","hl":1},{"v":22,"t":"Then Jesus answering said unto them, Go your way, and tell John what things ye have seen and heard; how that the blind see, the lame walk, the lepers are cleansed, the deaf hear, the dead are raised, to the poor the gospel is preached.","hl":1},{"v":23,"t":"And blessed is he, whosoever shall not be offended in me.","hl":1},{"v":24,"t":"And when the messengers of John were departed, he began to speak unto the people concerning John, What went ye out into the wilderness for to see? A reed shaken with the wind?"},{"v":25,"t":"But what went ye out for to see? A man clothed in soft raiment? Behold, they which are gorgeously apparelled, and live delicately, are in kings' courts."},{"v":26,"t":"But w son and from judgment: and who shall declare his generation? for he was cut off out of the land of the living: for the transgression of my people was he stricken."},{"v":9,"t":"And he made his grave with the wicked, and with the rich in his death; because he had done no violence, neither was any deceit in his mouth."},{"v":10,"t":"Yet it pleased the LORD to bruise him; he hath put him to grief: when thou shalt make his soul an offering for sin, he shall see his seed, he shall prolong his days, and the pleasure of the LORD shall prosper in his hand.","hl":1},{"v":11,"t":"He shall see of the travail of his soul, and shall be satisfied: by his knowledge shall my righteous servant justify many; for he shall bear their iniquities."},{"v":12,"t":"Therefore will I divide him a portion with the great, and he shall divide the spoil with the strong; because he hath poured out his soul unto death: and he was numbered with the transgressors; and he bare the sin of many, and made intercession for the transgressors."}]},"Hosea 3:4-5":{"ref":"Hosea 3","cited":"4-5","verses":[{"v":1,"t":"Then said the LORD unto me, Go yet, love a woman beloved of her friend, yet an adulteress, according to the love of the LORD toward the children of Israel, who look to other gods, and love flagons of wine."},{"v":2,"t":"So I bought her to me for fifteen pieces of silver, and for an homer of barley, and an half homer of barley:"},{"v":3,"t":"And I said unto her, Thou shalt abide for me many days; thou shalt not play the harlot, and thou shalt not be for another man: so will I also be for thee."},{"v":4,"t":"For the children of Israel shall abide many days without a king, and without a prince, and without a sacrifice, and without an image, and without an ephod, and without teraphim:","hl":1},{"v":5,"t":"Afterward shall the children of Israel return, and seek the LORD their God, and David their king; and shall fear the LORD and his goodness in the latter days.","hl":1}]},"Daniel 9:24":{"ref":"Daniel 9  hath called me from the womb; from the bowels of my mother hath he made mention of my name."},{"v":2,"t":"And he hath made my mouth like a sharp sword; in the shadow of his hand hath he hid me, and made me a polished shaft; in his quiver hath he hid me;"},{"v":3,"t":"And said unto me, Thou art my servant, O Israel, in whom I will be glorified.","hl":1},{"v":4,"t":"Then I said, I have laboured in vain, I have spent my strength for nought, and in vain: yet surely my judgment is with the LORD, and my work with my God."},{"v":5,"t":"And now, saith the LORD that formed me from the womb to be his servant, to bring Jacob again to him, Though Israel be not gathered, yet shall I be glorious in the eyes of the LORD, and my God shall be my strength."},{"v":6,"t":"And he said, It is a light thing that thou shouldest be my servant to raise up the tribes of Jacob, and to restore the preserved of Israel: I will also give thee for a light to the Gentiles, that thou mayest be my salvation unto the end of the earth."}]},"Isaiah 53":{"ref":"Isaiah 53","cited":"","verses":[{"v":1,"t":"Who hath believed our report? and to whom is the arm of the LORD revealed?"},{"v":2,"t":"For he shall grow up before him as a tender plant, and as a root out of a dry ground: he hath no form nor comeliness; and when we shall see him, there is no beauty that we should desire him."},{"v":3,"t":"He is despised and rejected of men; a man of sorrows, and acquainted with grief: and we hid as it were our faces from him; he was despised, and we esteemed him not."},{"v":4,"t":"Surely he hath borne our griefs, and carried our sorrows: yet we did esteem him stricken, smitten of God, and afflicted."},{"v":5,"t":"But he was wounded for our transgressions, he was bruised for our iniquities: the chastisement of our peace was upon him; and with his stripes we are healed."},{"v":6,"t":"All we like sheep have gone astray; we have turned every one to his own way; and the LORD hath laid on him the iniquity of us all."},{"v":7,"t":"He was oppressed, and he was afflicted, yet he opened not his mouth: he is brought as a lamb to the slaughter, and as a sheep before her shearers is dumb, so he openeth not his mouth."},{"v":8,"t":"He was taken from prison and from judgment: and who shall declare his generation? for he was cut off out of the land of the living: for the transgression of my people was he stricken."},{"v":9,"t":"And he made his grave with the wicked, and with the rich in his death; because he had done no violence, neither was any deceit in his mouth."},{"v":10,"t":"Yet it pleased the LORD to bruise him; he hath put him to grief: when thou shalt make his soul an offering for sin, he shall see his seed, he shall prolong his days, and the pleasure of the LORD shall prosper in his hand."},{"v":11,"t":"He shall see of the travail of his soul, and shall be satisfied: by his knowledge shall my righteous servant justify many; for he shall bear their iniquities."},{"v":12,"t":"Therefore will I divide him a portion with the great, and he shall divide the spoil with the strong; because he hath poured out his soul unto death: and he was numbered with the transgressors; and he bare the sin of many, and made intercession for the transgressors."}]},"Isaiah 53:8":{"ref":"Isaiah 53","cited":"8","verses":[{"v":5,"t":"But he was wounded for our transgressions, he was bruised for our iniquities: the chastisement of our peace was upon him; and with his stripes we are healed."},{"v":6,"t":"All we like sheep have gone astray; we have turned every one to his own way; and the LORD hath laid on him the iniquity of us all."},{"v":7,"t":"He was oppressed, and he was afflicted, yet he opened not his mouth: he is brought as a lamb to the slaughter, and as a sheep before her shearers is dumb, so he openeth not his mouth."},{"v":8,"t":"He was taken from prison and from judgment: and who shall declare his generation? for he was cut off out of the land of the living: for the transgression of my people was he st RD."},{"v":7,"t":"So I prophesied as I was commanded: and as I prophesied, there was a noise, and behold a shaking, and the bones came together, bone to his bone."},{"v":8,"t":"And when I beheld, lo, the sinews and the flesh came up upon them, and the skin covered them above: but there was no breath in them."},{"v":9,"t":"Then said he unto me, Prophesy unto the wind, prophesy, son of man, and say to the wind, Thus saith the Lord GOD; Come from the four winds, O breath, and breathe upon these slain, that they may live."},{"v":10,"t":"So I prophesied as he commanded me, and the breath came into them, and they lived, and stood up upon their feet, an exceeding great army."},{"v":11,"t":"Then he said unto me, Son of man, these bones are the whole house of Israel: behold, they say, Our bones are dried, and our hope is lost: we are cut off for our parts."},{"v":12,"t":"Therefore prophesy and say unto them, Thus saith the Lord GOD; Behold, O my people, I will open your graves, and cause you to come up out of your graves, and bring you into the land of Israel."},{"v":13,"t":"And ye shall know that I am the LORD, when I have opened your graves, O my people, and brought you up out of your graves,"},{"v":14,"t":"And shall put my spirit in you, and ye shall live, and I shall place you in your own land: then shall ye know that I the LORD have spoken it, and performed it, saith the LORD."},{"v":15,"t":"The word of the LORD came again unto me, saying,"},{"v":16,"t":"Moreover, thou son of man, take thee one stick, and write upon it, For Judah, and for the children of Israel his companions: then take another stick, and write upon it, For Joseph, the stick of Ephraim, and for all the house of Israel his companions:"},{"v":17,"t":"And join them one to another into one stick; and they shall become one in thine hand."},{"v":18,"t":"And when the children of thy people shall speak unto thee, saying, Wilt thou not shew us what thou meanest by these?"},{"v":19,"t":"Say unto them, Thus saith the Lord GOD; Behold, I will take the stick of Joseph, which is in the hand of Ephraim, and the tribes of Israel his fellows, and will put them with him, even with the stick of Judah, and make them one stick, and they shall be one in mine hand."},{"v":20,"t":"And the sticks whereon thou writest shall be in thine hand before their eyes."},{"v":21,"t":"And say unto them, Thus saith the Lord GOD; Behold, I will take the children of Israel from among the heathen, whither they be gone, and will gather them on every side, and bring them into their own land:"},{"v":22,"t":"And I will make them one nation in the land upon the mountains of Israel; and one king shall be king to them all: and they shall be no more two nations, neither shall they be divided into two kingdoms any more at all:"},{"v":23,"t":"Neither shall they defile themselves any more with their idols, nor with their detestable things, nor with any of their transgressions: but I will save them out of all their dwellingplaces, wherein they have sinned, and will cleanse them: so shall they be my people, and I will be their God."},{"v":24,"t":"And David my servant shall be king over them; and they all shall have one shepherd: they shall also walk in my judgments, and observe my statutes, and do them."},{"v":25,"t":"And they shall dwell in the land that I have given unto Jacob my servant, wherein your fathers have dwelt; and they shall dwell therein, even they, and their children, and their children's children for ever: and my servant David shall be their prince for ever."},{"v":26,"t":"Moreover I will make a covenant of peace with them; it shall be an everlasting covenant with them: and I will place them, and multiply them, and will set my sanctuary in the midst of them for evermore."},{"v":27,"t":"My tabernacle also shall be with them: yea, I will be their God, and they shall be my people."},{"v":28,"t":"And the heathen shall know that I the LORD do sanctify Israel, when my sanctuary shall be in the midst of them for evermore."}]},"Isaiah 41":{"ref":"Isaiah 41","cited":"","verses":[{"v":1,"t":"Keep silence before me, O islands; and let the people renew their strength: let them come near; then let them speak: let us come near together to judgment."},{"v":2,"t":"Who raised up the righteous man from the east, called him to his foot, gave the nations before him, and made him rule over kings? he gave them as the dust to his sword, and as driven stubble to his bow."},{"v":3,"t":"He pursued them, and passed safely; even by the way that he had not gone with his feet."},{"v":4,"t":"Who hath wrought and done it, calling the generations from the beginning? I the LORD, the first, and with the last; I am he."},{"v":5,"t":"The isles saw it, and feared; the ends of the earth were afraid, drew near, and came."},{"v":6,"t":"They helped every one his neighbour; and every one said to his brother, Be of good courage."},{"v":7,"t":"So the carpenter encouraged the goldsmith, and he that smootheth with the hammer him that smote the anvil, saying, It is ready for the sodering: and he fastened it with nails, that it should not be moved."},{"v":8,"t":"But thou, Israel, art my servant, Jacob whom I have chosen, the seed of Abraham my friend."},{"v":9,"t":"Thou whom I have taken from the ends of the earth, and called thee from the chief men thereof, and said unto thee, Thou art my servant; I have chosen thee, and not cast thee away."},{"v":10,"t":"Fear thou not; for I am with thee: be not dismayed; for I am thy God: I will strengthen thee; yea, I will help thee; yea, I will uphold thee with the right hand of my righteousness."},{"v":11,"t":"Behold, all they that were incensed against thee shall be ashamed and confounded: they shall be as nothing; and they that strive with thee shall perish."},{"v":12,"t":"Thou shalt seek them, and shalt not find them, even them that contended with thee: they that war against thee shall be as nothing, and as a thing of nought."},{"v":13,"t":"For I the LORD thy God will hold thy right hand, saying unto thee, Fear not; I will help thee."},{"v":14,"t":"Fear not, thou worm Jacob, and ye men of Israel; I will help thee, saith the LORD, and thy redeemer, the Holy One of Israel."},{"v":15,"t":"Behold, I will make thee a new sharp threshing instrument having teeth: thou shalt thresh the mountains, and beat them small, and shalt make the hills as chaff."},{"v":16,"t":"Thou shalt fan them, and the wind shall carry them away, and the whirlwind shall scatter them: and thou shalt rejoice in the LORD, and shalt glory in the Holy One of Israel."},{"v":17,"t":"When the poor and needy seek water, and there is none, and their tongue faileth for thirst, I the LORD will hear them, I the God of Israel will not forsake them."},{"v":18,"t":"I will open rivers in high places, and fountains in the midst of the valleys: I will make the wilderness a pool of water, and the dry land springs of water."},{"v":19,"t":"I will plant in the wilderness the cedar, the shittah tree, and the myrtle, and the oil tree; I will set in the desert the fir tree, and the pine, and the box tree together:"},{"v":20,"t":"That they may see, and know, and consider, and understand together, that the hand of the LORD hath done this, and the Holy One of Israel hath created it."},{"v":21,"t":"Produce your cause, saith the LORD; bring forth your strong reasons, saith the King of Jacob."},{"v":22,"t":"Let them bring them forth, and shew us what shall happen: let them shew the former things, what they be, that we may consider them, and know the latter end of them; or declare us things for to come."},{"v":23,"t":"Shew the things that are to come hereafter, that we may know that ye are gods: yea, do good, or do evil, that we may be dismayed, and behold it together."},{"v":24,"t":"Behold, ye are of nothing, and your work of nought: an abomination is he that chooseth you."},{"v":25,"t":"I have raised up one from the north, and he shall come: from the rising of the sun shall he call upon my name: and he shall come upon princes as upon mortar, and as the potter treadeth clay."},{"v":26,"t":"Who hath declared from the beginning, that we may know? and beforetime, that we may say, He is righteous? yea, there is none that sheweth, yea, there is none that declareth, yea, there is none that heareth your words."},{"v":27,"t":"The first shall say to Zion, Behold, behold them: and I will give to Jerusalem one that bringeth good tidings."},{"v":28,"t":"For I beheld, and there was no man; even among them, and there was no counsellor, that, when I asked of them, could answer a word."},{"v":29,"t":"Behold, they are all vanity; their works are nothing: their molten images are wind and confusion."}]},"Isaiah 44":{"ref":"Isaiah 44","cited":"","verses":[{"v":1,"t":"Yet now hear, O Jacob my servant; and Israel, whom I have chosen:"},{"v":2,"t":"Thus saith the LORD that made thee, and formed thee from the womb, which will help thee; Fear not, O Jacob, my servant; and thou, Jesurun, whom I have chosen."},{"v":3,"t":"For I will pour water upon him that is thirsty, and floods upon the dry ground: I will pour my spirit upon thy seed, and my blessing upon thine offspring:"},{"v":4,"t":"And they shall spring up as among the grass, as willows by the water courses."},{"v":5,"t":"One shall say, I am the LORD's; and another shall call himself by the name of Jacob; and another shall subscribe with his hand unto the LORD, and surname himself by the name of Israel."},{"v":6,"t":"Thus saith the LORD the King of Israel, and his redeemer the LORD of hosts; I am the first, and I am the last; and beside me there is no God."},{"v":7,"t":"And who, as I, shall call, and shall declare it, and set it in order for me, since I appointed the ancient people? and the things that are coming, and shall come, let them shew unto them."},{"v":8,"t":"Fear ye not, neither be afraid: have not I told thee from that time, and have declared it? ye are even my witnesses. Is there a God beside me? yea, there is no God; I know not any."},{"v":9,"t":"They that make a graven image are all of them vanity; and their delectable things shall not profit; and they are their own witnesses; they see not, nor know; that they may be ashamed."},{"v":10,"t":"Who hath formed a god, or molten a graven image that is profitable for nothing?"},{"v":11,"t":"Behold, all his fellows shall be ashamed: and the workmen, they are of men: let them all be gathered together, let them stand up; yet they shall fear, and they shall be ashamed together."},{"v":12,"t":"The smith with the tongs both worketh in the coals, and fashioneth it with hammers, and worketh it with the strength of his arms: yea, he is hungry, and his strength faileth: he drinketh no water, and is faint."},{"v":13,"t":"The carpenter stretcheth out his rule; he marketh it out with a line; he fitteth it with planes, and he marketh it out with the compass, and maketh it after the figure of a man, according to the beauty of a man; that it may remain in the house."},{"v":14,"t":"He heweth him down cedars, and taketh the cypress and the oak, which he strengtheneth for himself among the trees of the forest: he planteth an ash, and the rain doth nourish it."},{"v":15,"t":"Then shall it be for a man to burn: for he will take thereof, and warm himself; yea, he kindleth it, and baketh bread; yea, he maketh a god, and worshippeth it; he maketh it a graven image, and falleth down thereto."},{"v":16,"t":"He burneth part thereof in the fire; with part thereof he eateth flesh; he roasteth roast, and is satisfied: yea, he warmeth himself, and saith, Aha, I am warm, I have seen the fire:"},{"v":17,"t":"And the residue thereof he maketh a god, even his graven image: he falleth down unto it, and worshippeth it, and prayeth unto it, and saith, Deliver me; for thou art my god."},{"v":18,"t":"They have not known nor understood: for he hath shut their eyes, that they cannot see; and their hearts, that they cannot understand."},{"v":19,"t":"And none considereth in his heart, neither is there knowledge nor understanding to say, I have burned part of it in the fire; yea, also I have baked bread upon the coals thereof; I have roasted flesh, and eaten it: and shall I make the residue thereof an abomination? shall I fall down to the stock of a tree?"},{"v":20,"t":"He feedeth on ashes: a deceived heart hath turned him aside, that he cannot deliver his soul, nor say, Is there not a lie in my right hand?"},{"v":21,"t":"Remember these, O Jacob and Israel; for thou art my servant: I have formed thee; thou art my servant: O Israel, thou shalt not be forgotten of me."},{"v":22,"t":"I have blotted out, as a thick cloud, thy transgressions, and, as a cloud, thy sins: return unto me; for I have redeemed thee."},{"v":23,"t":"Sing, O ye heavens; for the LORD hath done it: shout, ye lower parts of the earth: break forth into singing, ye mountains, O forest, and every tree therein: for the LORD hath redeemed Jacob, and glorified himself in Israel."},{"v":24,"t":"Thus saith the LORD, thy redeemer, and he that formed thee from the womb, I am the LORD that maketh all things; that stretcheth forth the heavens alone; that spreadeth abroad the earth by myself;"},{"v":25,"t":"That frustrateth the tokens of the liars, and maketh diviners mad; that turneth wise men backward, and maketh their knowledge foolish;"},{"v":26,"t":"That confirmeth the word of his servant, and performeth the counsel of his messengers; that saith to Jerusalem, Thou shalt be inhabited; and to the cities of Judah, Ye shall be built, and I will raise up the decayed places thereof:"},{"v":27,"t":"That saith to the deep, Be dry, and I will dry up thy rivers:"},{"v":28,"t":"That saith of Cyrus, He is my shepherd, and shall perform all my pleasure: even saying to Jerusalem, Thou shalt be built; and to the temple, Thy foundation shall be laid."}]},"Jeremiah 23:5-6":{"ref":"Jeremiah 23","cited":"5-6","verses":[{"v":2,"t":"Therefore thus saith the LORD God of Israel against the pastors that feed my people; Ye have scattered my flock, and driven them away, and have not visited them: behold, I will visit upon you the evil of your doings, saith the LORD."},{"v":3,"t":"And I will gather the remnant of my flock out of all countries whither I have driven them, and will bring them again to their folds; and they shall be fruitful and increase."},{"v":4,"t":"And I will set up shepherds over them which shall feed them: and they shall fear no more, nor be dismayed, neither shall they be lacking, saith the LORD."},{"v":5,"t":"Behold, the days come, saith the LORD, that I will raise unto David a righteous Branch, and a King shall reign and prosper, and shall execute judgment and justice in the earth.","hl":1},{"v":6,"t":"In his days Judah shall be saved, and Israel shall dwell safely: and this is his name whereby he shall be called, THE LORD OUR RIGHTEOUSNESS.","hl":1},{"v":7,"t":"Therefore, behold, the days come, saith the LORD, that they shall no more say, The LORD liveth, which brought up the children of Israel out of the land of Egypt;"},{"v":8,"t":"But, The LORD liveth, which brought up and which led the seed of the house of Israel out of the north country, and from all countries whither I had driven them; and they shall dwell in their own land."},{"v":9,"t":"Mine heart within me is broken because of the prophets; all my bones shake; I am like a drunken man, and like a man whom wine hath overcome, because of the LORD, and because of the words of his holiness."}]},"Zechariah 9:9-10":{"ref":"Zechariah 9","cited":"9-10","verses":[{"v":6,"t":"And a bastard shall dwell in Ashdod, and I will cut off the pride of the Philistines."},{"v":7,"t":"And I will take away his blood out of his mouth, and his abominations from between his teeth: but he that remaineth, even he, shall be for our God, and he shall be as a governor in Judah, and Ekron as a Jebusite."},{"v":8,"t":"And I will encamp about mine house because of the army, because of him that passeth by, and because of him that returneth: and no oppressor shall pass through them any more: for now have I seen with mine eyes."},{"v":9,"t":"Rejoice greatly, O daughter of Zion; shout, O daughter of Jerusalem: behold, thy King cometh unto thee: he is just, and having salvation; lowly, and riding upon an ass, and upon a colt the foal of an ass.","hl":1},{"v":10,"t":"And I will cut off the chariot from Ephraim, and the horse from Jerusalem, and the battle bow shall be cut off: and he shall speak peace unto the heathen: and his dominion shall be from sea even to sea, and from the river even to the ends of the earth.","hl":1},{"v":11,"t":"As for thee also, by the blood of thy covenant I have sent forth thy prisoners out of the pit wherein is no water."},{"v":12,"t":"Turn you to the strong hold, ye prisoners of hope: even to day do I declare that I will render double unto thee;"},{"v":13,"t":"When I have bent Judah for me, filled the bow with Ephraim, and raised up thy sons, O Zion, against thy sons, O Greece, and made thee as the sword of a mighty man."}]},"Zechariah 12:10":{"ref":"Zechariah 12","cited":"10","verses":[{"v":7,"t":"The LORD also shall save the tents of Judah first, that the glory of the house of David and the glory of the inhabitants of Jerusalem do not magnify themselves against Judah."},{"v":8,"t":"In that day shall the LORD defend the inhabitants of Jerusalem; and he that is feeble among them at that day shall be as David; and the house of David shall be as God, as the angel of the LORD before them."},{"v":9,"t":"And it shall come to pass in that day, that I will seek to destroy all the nations that come against Jerusalem."},{"v":10,"t":"And I will pour upon the house of David, and upon the inhabitants of Jerusalem, the spirit of grace and of supplications: and they shall look upon me whom they have pierced, and they shall mourn for him, as one mourneth for his only son, and shall be in bitterness for him, as one that is in bitterness for his firstborn.","hl":1},{"v":11,"t":"In that day shall there be a great mourning in Jerusalem, as the mourning of Hadadrimmon in the valley of Megiddon."},{"v":12,"t":"And the land shall mourn, every family apart; the family of the house of David apart, and their wives apart; the family of the house of Nathan apart, and their wives apart;"},{"v":13,"t":"The family of the house of Levi apart, and their wives apart; the family of Shimei apart, and their wives apart;"}]},"Luke 24:26":{"ref":"Luke 24","cited":"26","verses":[{"v":23,"t":"And when they found not his body, they came, saying, that they had also seen a vision of angels, which said that he was alive."},{"v":24,"t":"And certain of them which were with us went to the sepulchre, and found it even so as the women had said: but him they saw not."},{"v":25,"t":"Then he said unto them, O fools, and slow of heart to believe all that the prophets have spoken:"},{"v":26,"t":"Ought not Christ to have suffered these things, and to enter into his glory?","hl":1},{"v":27,"t":"And beginning at Moses and all the prophets, he expounded unto them in all the scriptures the things concerning himself."},{"v":28,"t":"And they drew nigh unto the village, whither they went: and he made as though he would have gone further."},{"v":29,"t":"But they constrained him, saying, Abide with us: for it is toward evening, and the day is far spent. And he went in to tarry with them."}]},"Psalm 22":{"ref":"Psalms 22","cited":"","verses":[{"v":1,"t":"My God, my God, why hast thou forsaken me? why art thou so far from helping me, and from the words of my roaring?"},{"v":2,"t":"O my God, I cry in the daytime, but thou hearest not; and in the night season, and am not silent."},{"v":3,"t":"But thou art holy, O thou that inhabitest the praises of Israel."},{"v":4,"t":"Our fathers trusted in thee: they trusted, and thou didst deliver them."},{"v":5,"t":"They cried unto thee, and were delivered: they trusted in thee, and were not confounded."},{"v":6,"t":"But I am a worm, and no man; a reproach of men, and despised of the people."},{"v":7,"t":"All they that see me laugh me to scorn: they shoot out the lip, they shake the head, saying,"},{"v":8,"t":"He trusted on the LORD that he would deliver him: let him deliver him, seeing he delighted in him."},{"v":9,"t":"But thou art he that took me out of the womb: thou didst make me hope when I was upon my mother's breasts."},{"v":10,"t":"I was cast upon thee from the womb: thou art my God from my mother's belly."},{"v":11,"t":"Be not far from me; for trouble is near; for there is none to help."},{"v":12,"t":"Many bulls have compassed me: strong bulls of Bashan have beset me round."},{"v":13,"t":"They gaped upon me with their mouths, as a ravening and a roaring lion."},{"v":14,"t":"I am poured out like water, and all my bones are out of joint: my heart is like wax; it is melted in the midst of my bowels."},{"v":15,"t":"My strength is dried up like a potsherd; and my tongue cleaveth to my jaws; and thou hast brought me into the dust of death."},{"v":16,"t":"For dogs have compassed me: the assembly of the wicked have inclosed me: they pierced my hands and my feet."},{"v":17,"t":"I may tell all my bones: they look and stare upon me."},{"v":18,"t":"They part my garments among them, and cast lots upon my vesture."},{"v":19,"t":"But be not thou far from me, O LORD: O my strength, haste thee to help me."},{"v":20,"t":"Deliver my soul from the sword; my darling from the power of the dog."},{"v":21,"t":"Save me from the lion's mouth: for thou hast heard me from the horns of the unicorns."},{"v":22,"t":"I will declare thy name unto my brethren: in the midst of the congregation will I praise thee."},{"v":23,"t":"Ye that fear the LORD, praise him; all ye the seed of Jacob, glorify him; and fear him, all ye the seed of Israel."},{"v":24,"t":"For he hath not despised nor abhorred the affliction of the afflicted; neither hath he hid his face from him; but when he cried unto him, he heard."},{"v":25,"t":"My praise shall be of thee in the great congregation: I will pay my vows before them that fear him."},{"v":26,"t":"The meek shall eat and be satisfied: they shall praise the LORD that seek him: your heart shall live for ever."},{"v":27,"t":"All the ends of the world shall remember and turn unto the LORD: and all the kindreds of the nations shall worship before thee."},{"v":28,"t":"For the kingdom is the LORD's: and he is the governor among the nations."},{"v":29,"t":"All they that be fat upon earth shall eat and worship: all they that go down to the dust shall bow before him: and none can keep alive his own soul."},{"v":30,"t":"A seed shall serve him; it shall be accounted to the Lord for a generation."},{"v":31,"t":"They shall come, and shall declare his righteousness unto a people that shall be born, that he hath done this."}]},"Zechariah 12":{"ref":"Zechariah 12","cited":"","verses":[{"v":1,"t":"The burden of the word of the LORD for Israel, saith the LORD, which stretcheth forth the heavens, and layeth the foundation of the earth, and formeth the spirit of man within him."},{"v":2,"t":"Behold, I will make Jerusalem a cup of trembling unto all the people round about, when they shall be in the siege both against Judah and against Jerusalem."},{"v":3,"t":"And in that day will I make Jerusalem a burdensome stone for all people: all that burden themselves with it shall be cut in pieces, though all the people of the earth be gathered together against it."},{"v":4,"t":"In that day, saith the LORD, I will smite every horse with astonishment, and his rider with madness: and I will open mine eyes upon the house of Judah, and will smite every horse of the people with blindness."},{"v":5,"t":"And the governors of Judah shall say in their heart, The inhabitants of Jerusalem shall be my strength in the LORD of hosts their God."},{"v":6,"t":"In that day will I make the governors of Judah like an hearth of fire among the wood, and like a torch of fire in a sheaf; and they shall devour all the people round about, on the right hand and on the left: and Jerusalem shall be inhabited again in her own place, even in Jerusalem."},{"v":7,"t":"The LORD also shall save the tents of Judah first, that the glory of the house of David and the glory of the inhabitants of Jerusalem do not magnify themselves against Judah."},{"v":8,"t":"In that day shall the LORD defend the inhabitants of Jerusalem; and he that is feeble among them at that day shall be as David; and the house of David shall be as God, as the angel of the LORD before them."},{"v":9,"t":"And it shall come to pass in that day, that I will seek to destroy all the nations that come against Jerusalem."},{"v":10,"t":"And I will pour upon the house of David, and upon the inhabitants of Jerusalem, the spirit of grace and of supplications: and they shall look upon me whom they have pierced, and they shall mourn for him, as one mourneth for his only son, and shall be in bitterness for him, as one that is in bitterness for his firstborn."},{"v":11,"t":"In that day shall there be a great mourning in Jerusalem, as the mourning of Hadadrimmon in the valley of Megiddon."},{"v":12,"t":"And the land shall mourn, every family apart; the family of the house of David apart, and their wives apart; the family of the house of Nathan apart, and their wives apart;"},{"v":13,"t":"The family of the house of Levi apart, and their wives apart; the family of Shimei apart, and their wives apart;"},{"v":14,"t":"All the families that remain, every family apart, and their wives apart."}]},"Daniel 9":{"ref":"Daniel 9","cited":"","verses":[{"v":1,"t":"In the first year of Darius the son of Ahasuerus, of the seed of the Medes, which was made king over the realm of the Chaldeans;"},{"v":2,"t":"In the first year of his reign I Daniel understood by books the number of the years, whereof the word of the LORD came to Jeremiah the prophet, that he would accomplish seventy years in the desolations of Jerusalem."},{"v":3,"t":"And I set my face unto the Lord God, to seek by prayer and supplications, with fasting, and sackcloth, and ashes:"},{"v":4,"t":"And I prayed unto the LORD my God, and made my confession, and said, O Lord, the great and dreadful God, keeping the covenant and mercy to them that love him, and to them that keep his commandments;"},{"v":5,"t":"We have sinned, and have committed iniquity, and have done wickedly, and have rebelled, even by departing from thy precepts and from thy judgments:"},{"v":6,"t":"Neither have we hearkened unto thy servants the prophets, which spake in thy name to our kings, our princes, and our fathers, and to all the people of the land."},{"v":7,"t":"O Lord, righteousness belongeth unto thee, but unto us confusion of faces, as at this day; to the men of Judah, and to the inhabitants of Jerusalem, and unto all Israel, that are near, and that are far off, through all the countries whither thou hast driven them, because of their trespass that they have trespassed against thee."},{"v":8,"t":"O Lord, to us belongeth confusion of face, to our kings, to our princes, and to our fathers, because we have sinned against thee."},{"v":9,"t":"To the Lord our God belong mercies and forgivenesses, though we have rebelled against him;"},{"v":10,"t":"Neither have we obeyed the voice of the LORD our God, to walk in his laws, which he set before us by his servants the prophets."},{"v":11,"t":"Yea, all Israel have transgressed thy law, even by departing, that they might not obey thy voice; therefore the curse is poured upon us, and the oath that is written in the law of Moses the servant of God, because we have sinned against him."},{"v":12,"t":"And he hath confirmed his words, which he spake against us, and against our judges that judged us, by bringing upon us a great evil: for under the whole heaven hath not been done as hath been done upon Jerusalem."},{"v":13,"t":"As it is written in the law of Moses, all this evil is come upon us: yet made we not our prayer before the LORD our God, that we might turn from our iniquities, and understand thy truth."},{"v":14,"t":"Therefore hath the LORD watched upon the evil, and brought it upon us: for the LORD our God is righteous in all his works which he doeth: for we obeyed not his voice."},{"v":15,"t":"And now, O Lord our God, that hast brought thy people forth out of the land of Egypt with a mighty hand, and hast gotten thee renown, as at this day; we have sinned, we have done wickedly."},{"v":16,"t":"O Lord, according to all thy righteousness, I beseech thee, let thine anger and thy fury be turned away from thy city Jerusalem, thy holy mountain: because for our sins, and for the iniquities of our fathers, Jerusalem and thy people are become a reproach to all that are about us."},{"v":17,"t":"Now therefore, O our God, hear the prayer of thy servant, and his supplications, and cause thy face to shine upon thy sanctuary that is desolate, for the Lord's sake."},{"v":18,"t":"O my God, incline thine ear, and hear; open thine eyes, and behold our desolations, and the city which is called by thy name: for we do not present our supplications before thee for our righteousnesses, but for thy great mercies."},{"v":19,"t":"O Lord, hear; O Lord, forgive; O Lord, hearken and do; defer not, for thine own sake, O my God: for thy city and thy people are called by thy name."},{"v":20,"t":"And whiles I was speaking, and praying, and confessing my sin and the sin of my people Israel, and presenting my supplication before the LORD my God for the holy mountain of my God;"},{"v":21,"t":"Yea, whiles I was speaking in prayer, even the man Gabriel, whom I had seen in the vision at the beginning, being caused to fly swiftly, touched me about the time of the evening oblation."},{"v":22,"t":"And he informed me, and talked with me, and said, O Daniel, I am now come forth to give thee skill and understanding."},{"v":23,"t":"At the beginning of thy supplications the commandment came forth, and I am come to shew thee; for thou art greatly beloved: therefore understand the matter, and consider the vision."},{"v":24,"t":"Seventy weeks are determined upon thy people and upon thy holy city, to finish the transgression, and to make an end of sins, and to make reconciliation for iniquity, and to bring in everlasting righteousness, and to seal up the vision and prophecy, and to anoint the most Holy."},{"v":25,"t":"Know therefore and understand, that from the going forth of the commandment to restore and to build Jerusalem unto the Messiah the Prince shall be seven weeks, and threescore and two weeks: the street shall be built again, and the wall, even in troublous times."},{"v":26,"t":"And after threescore and two weeks shall Messiah be cut off, but not for himself: and the people of the prince that shall come shall destroy the city and the sanctuary; and the end thereof shall be with a flood, and unto the end of the war desolations are determined."},{"v":27,"t":"And he shall confirm the covenant with many for one week: and in the midst of the week he shall cause the sacrifice and the oblation to cease, and for the overspreading of abominations he shall make it desolate, even until the consummation, and that determined shall be poured upon the desolate."}]},"Micah 5:2":{"ref":"Micah 5","cited":"2","verses":[{"v":1,"t":"Now gather thyself in troops, O daughter of troops: he hath laid siege against us: they shall smite the judge of Israel with a rod upon the cheek."},{"v":2,"t":"But thou, Beth-lehem Ephratah, though thou be little among the thousands of Judah, yet out of thee shall he come forth unto me that is to be ruler in Israel; whose goings forth have been from of old, from everlasting.","hl":1},{"v":3,"t":"Therefore will he give them up, until the time that she which travaileth hath brought forth: then the remnant of his brethren shall return unto the children of Israel."},{"v":4,"t":"And he shall stand and feed in the strength of the LORD, in the majesty of the name of the LORD his God; and they shall abide: for now shall he be great unto the ends of the earth."},{"v":5,"t":"And this man shall be the peace, when the Assyrian shall come into our land: and when he shall tread in our palaces, then shall we raise against him seven shepherds, and eight principal men."}]},"Matthew 2:4-6":{"ref":"Matthew 2","cited":"4-6","verses":[{"v":1,"t":"Now when Jesus was born in Bethlehem of Judæa in the days of Herod the king, behold, there came wise men from the east to Jerusalem,"},{"v":2,"t":"Saying, Where is he that is born King of the Jews? for we have seen his star in the east, and are come to worship him."},{"v":3,"t":"When Herod the king had heard these things, he was troubled, and all Jerusalem with him."},{"v":4,"t":"And when he had gathered all the chief priests and scribes of the people together, he demanded of them where Christ should be born.","hl":1},{"v":5,"t":"And they said unto him, In Bethlehem of Judæa: for thus it is written by the prophet,","hl":1},{"v":6,"t":"And thou Bethlehem, in the land of Juda, art not the least among the princes of Juda: for out of thee shall come a Governor, that shall rule my people Israel.","hl":1},{"v":7,"t":"Then Herod, when he had privily called the wise men, inquired of them diligently what time the star appeared."},{"v":8,"t":"And he sent them to Bethlehem, and said, Go and search diligently for the young child; and when ye have found him, bring me word again, that I may come and worship him also."},{"v":9,"t":"When they had heard the king, they departed; and, lo, the star, which they saw in the east, went before them, till it came and stood over where the young child was."}]},"John 7:42":{"ref":"John 7","cited":"42","verses":[{"v":39,"t":"(But this spake he of the Spirit, which they that believe on him should receive: for the Holy Ghost was not yet given; because that Jesus was not yet glorified.)"},{"v":40,"t":"Many of the people therefore, when they heard this saying, said, Of a truth this is the Prophet."},{"v":41,"t":"Others said, This is the Christ. But some said, Shall Christ come out of Galilee?"},{"v":42,"t":"Hath not the scripture said, That Christ cometh of the seed of David, and out of the town of Bethlehem, where David was?","hl":1},{"v":43,"t":"So there was a division among the people because of him."},{"v":44,"t":"And some of them would have taken him; but no man laid hands on him."},{"v":45,"t":"Then came the officers to the chief priests and Pharisees; and they said unto them, Why have ye not brought him?"}]},"Isaiah 9:6":{"ref":"Isaiah 9","cited":"6","verses":[{"v":3,"t":"Thou hast multiplied the nation, and not increased the joy: they joy before thee according to the joy in harvest, and as men rejoice when they divide the spoil."},{"v":4,"t":"For thou hast broken the yoke of his burden, and the staff of his shoulder, the rod of his oppressor, as in the day of Midian."},{"v":5,"t":"For every battle of the warrior is with confused noise, and garments rolled in blood; but this shall be with burning and fuel of fire."},{"v":6,"t":"For unto us a child is born, unto us a son is given: and the government shall be upon his shoulder: and his name shall be called Wonderful, Counsellor, The mighty God, The everlasting Father, The Prince of Peace.","hl":1},{"v":7,"t":"Of the increase of his government and peace there shall be no end, upon the throne of David, and upon his kingdom, to order it, and to establish it with judgment and with justice from henceforth even for ever. The zeal of the LORD of hosts will perform this."},{"v":8,"t":"The Lord sent a word into Jacob, and it hath lighted upon Israel."},{"v":9,"t":"And all the people shall know, even Ephraim and the inhabitant of Samaria, that say in the pride and stoutness of heart,"}]},"Ruth 4:11":{"ref":"Ruth 4","cited":"11","verses":[{"v":8,"t":"Therefore the kinsman said unto Boaz, Buy it for thee. So he drew off his shoe."},{"v":9,"t":"And Boaz said unto the elders, and unto all the people, Ye are witnesses this day, ook for him."},{"v":18,"t":"Behold, I and the children whom the LORD hath given me are for signs and for wonders in Israel from the LORD of hosts, which dwelleth in mount Zion."},{"v":19,"t":"And when they shall say unto you, Seek unto them that have familiar spirits, and unto wizards that peep, and that mutter: should not a people seek unto their God? for the living to the dead?"},{"v":20,"t":"To the law and to the testimony: if they speak not according to this word, it is because there is no light in them."},{"v":21,"t":"And they shall pass through it, hardly bestead and hungry: and it shall come to pass, that when they shall be hungry, they shall fret themselves, and curse their king and their God, and look upward."},{"v":22,"t":"And they shall look unto the earth; and behold trouble and darkness, dimness of anguish; and they shall be driven to darkness."}]},"Luke 7:22":{"ref":"Luke 7","cited":"22","verses":[{"v":19,"t":"And John calling unto him two of his disciples sent them to Jesus, saying, Art thou he that should come? or look we for another?"},{"v":20,"t":"When the men were come unto him, they said, John Baptist hath sent us unto thee, saying, Art thou he that should come? or look we for another?"},{"v":21,"t":"And in that same hour he cured many of their infirmities and plagues, and of evil spirits; and unto many that were blind he gave sight."},{"v":22,"t":"Then Jesus answering said unto them, Go your way, and tell John what things ye have seen and heard; how that the blind see, the lame walk, the lepers are cleansed, the deaf hear, the dead are raised, to the poor the gospel is preached.","hl":1},{"v":23,"t":"And blessed is he, whosoever shall not be offended in me."},{"v":24,"t":"And when the messengers of John were departed, he began to speak unto the people concerning John, What went ye out into the wilderness for to see? A reed shaken with the wind?"},{"v":25,"t":"But what went ye out for to see? A man clothed in soft raiment? Behold, they which are
