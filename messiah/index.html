ts and sacrifices: wherefore it is of necessity that this man have somewhat also to offer."},{"v":4,"t":"For if he were on earth, he should not be a priest, seeing that there are priests that offer gifts according to the law:"},{"v":5,"t":"Who serve unto the example and shadow of heavenly things, as Moses was admonished of God when he was about to make the tabernacle: for, See, saith he, that thou make all things according to the pattern shewed to thee in the mount."},{"v":6,"t":"But now hath he obtained a more excellent ministry, by how much also he is the mediator of a better covenant, which was established upon better promises."},{"v":7,"t":"For if that first covenant had been faultless, then should no place have been sought for the second."},{"v":8,"t":"For finding fault with them, he saith, Behold, the days come, saith the Lord, when I will make a new covenant with the house of Israel and with the house of Judah:"},{"v":9,"t":"Not according to the covenant that I made with their fathers in the day when I took them by the hand to lead them out of the land of Egypt; because they continued not in my covenant, and I regarded them not, saith the Lord."},{"v":10,"t":"For this is the covenant that I will make with the house of Israel after those days, saith the Lord; I will put my laws into their mind, and write them in their hearts: and I will be to them a God, and they shall be to me a people:"},{"v":11,"t":"And they shall not teach every man his neighbour, and every man his brother, saying, Know the Lord: for all shall know me, from the least to the greatest."},{"v":12,"t":"For I will be merciful to their unrighteousness, and their sins and their iniquities will I remember no more."},{"v":13,"t":"In that he saith, A new covenant, he hath made the first old. Now that which decayeth and waxeth old is ready to vanish away."}]},"Leviticus 5:11-13":{"ref":"Leviticus 5","cited":"11-13","verses":[{"v":8,"t":"And he shall bring them unto the priest, who shall offer that which is for the sin offering first, and wring off his head from his neck, but shall not divide it asunder:"},{"v":9,"t":"And he shall sprinkle of the blood of the sin offering upon the side of the altar; and the rest of the blood shall be wrung out at the bottom of the altar: it is a sin offering."},{"v":10,"t":"And he shall offer the second for a burnt offering, according to the manner: and the priest shall make an atonement for him for his sin which he hath sinned, and it shall be forgiven him."},{"v":11,"t":"But if he be not able to bring two turtledoves, or two young pigeons, then he that sinned shall bring for his offering the tenth part of an ephah of fine flour for a sin offering; he shall put no oil upon it, neither shall he put any frankincense thereon: for it is a sin offering.","hl":1},{"v":12,"t":"Then shall he bring it to the priest, and the priest shall take his handful of it, even a memorial thereof, and burn it on the altar, according to the offerings made by fire unto the LORD: it is a sin offering.","hl":1},{"v":13,"t":"And the priest shall make an atonement for him as touching his sin that he hath sinned in one of these, and it shall be forgiven him: and the remnant shall be the priest's, as a meat offering.","hl":1},{"v":14,"t":"And the LORD spake unto Moses, saying,"},{"v":15,"t":"If a soul commit a trespass, and sin through ignorance, in the holy things of the LORD; then he shall bring for his trespass unto the LORD a ram without blemish out of the flocks, with thy estimation by shekels of silver, after the shekel of the sanctuary, for a trespass offering:"},{"v":16,"t":"And he shall make amends for the harm that he hath done in the holy thing, and shall add the fifth part thereto, and give it unto the priest: and the priest shall make an atonement for him with the ram of the trespass offering, and it shall be forgiven him."}]},"Hosea 14:2":{"ref":"Hosea 14","cited":"2","verses":[{"v":1,"t":"O Israel, return unto the LORD thy God; for thou hast fallen by thine iniquity."},{"v":2,"t":"Take with you words, and turn to the LORD: say unto him, Take away all iniquity, and receive us graciously: so will we render the calves of our lips.","hl":1},{"v":3,"t":"Asshur shall not save us; we will not ride upon horses: neither will we say any more to the work of our hands, Ye are our gods: for in thee the fatherless findeth mercy."},{"v":4,"t":"I will heal their backsliding, I will love them freely: for mine anger is turned away from him."},{"v":5,"t":"I will be as the dew unto Israel: he shall grow as the lily, and cast forth his roots as Lebanon."}]},"1 Kings 8:46-50":{"ref":"1 Kings 8","cited":"46-50","verses":[{"v":43,"t":"Hear thou in heaven thy dwelling place, and do according to all that the stranger calleth to thee for: that all people of the earth may know thy name, to fear thee, as do thy people Israel; and that they may know that this house, which I have builded, is called by thy name."},{"v":44,"t":"If thy people go out to battle against their enemy, whithersoever thou shalt send them, and shall pray unto the LORD toward the city which thou hast chosen, and toward the house that I have built for thy name:"},{"v":45,"t":"Then hear thou in heaven their prayer and their supplication, and maintain their cause."},{"v":46,"t":"If they sin against thee, (for there is no man that sinneth not,) and thou be angry with them, and deliver them to the enemy, so that they carry them away captives unto the land of the enemy, far or near;","hl":1},{"v":47,"t":"Yet if they shall bethink themselves in the land whither they were carried captives, and repent, and make supplication unto thee in the land of them that carried them captives, saying, We have sinned, and have done perversely, we have committed wickedness;","hl":1},{"v":48,"t":"And so return unto thee with all their heart, and with all their soul, in the land of their enemies, which led them away captive, and pray unto thee toward their land, which thou gavest unto their fathers, the city which thou hast chosen, and the house which I have built for thy name:","hl":1},{"v":49,"t":"Then hear thou their prayer and their supplication in heaven thy dwelling place, and maintain their cause,","hl":1},{"v":50,"t":"And forgive thy people that have sinned against thee, and all their transgressions wherein they have transgressed against thee, and give them compassion before them who carried them captive, that they may have compassion on them:","hl":1},{"v":51,"t":"For they be thy people, and thine inheritance, which thou broughtest forth out of Egypt, from the midst of the furnace of iron:"},{"v":52,"t":"That thine eyes may be open unto the supplication of thy servant, and unto the supplication of thy people Israel, to hearken unto them in all that they call for unto thee."},{"v":53,"t":"For thou didst separate them from among all the people of the earth, to be thine inheritance, as thou spakest by the hand of Moses thy servant, when thou broughtest our fathers out of Egypt, O Lord GOD."}]},"Jonah 3:10":{"ref":"Jonah 3","cited":"10","verses":[{"v":7,"t":"And he caused it to be proclaimed and published through Nineveh by the decree of the king and his nobles, saying, Let neither man nor beast, herd nor flock, taste any thing: let them not feed, nor drink water:"},{"v":8,"t":"But let man and beast be covered with sackcloth, and cry mightily unto God: yea, let them turn every one from his evil way, and from the violence that is in their hands."},{"v":9,"t":"Who can tell if God will turn and repent, and turn away from his fierce anger, that we perish not?"},{"v":10,"t":"And God saw their works, that they turned from their evil way; and God repented of the evil, that he had said that he would do unto them; and he did it not.","hl":1}]},"Psalm 51:17":{"ref":"Psalms 51","cited":"17","verses":[{"v":14,"t":"Deliver me from bloodguiltiness, O God, thou God of my salvation: and my tongue shall sing aloud of thy righteousness."},{"v":15,"t":"O Lord, open thou my lips; and my mouth shall shew forth thy praise."},{"v":16,"t":"For thou desirest not sacrifice; else would I give it: thou delightest not in burnt offering."},{"v":17,"t":"The sacrifices of God are a broken spirit: a broken and a contrite heart, O God, thou wilt not despise.","hl":1},{"v":18,"t":"Do good in thy good pleasure unto Zion: build thou the walls of Jerusalem."},{"v":19,"t":"Then shalt thou be pleased with the sacrifices of righteousness, with burnt offering and whole burnt offering: then shall they offer bullocks upon thine altar."}]},"Hosea 6:6":{"ref":"Hosea 6","cited":"6","verses":[{"v":3,"t":"Then shall we know, if we follow on to know the LORD: his going forth is prepared as the morning; and he shall come unto us as the rain, as the latter and former rain unto the earth."},{"v":4,"t":"O Ephraim, what shall I do unto thee? O Judah, what shall I do unto thee? for your goodness is as a morning cloud, and as the early dew it goeth away."},{"v":5,"t":"Therefore have I hewed them by the prophets; I have slain them by the words of my mouth: and thy judgments are as the light that goeth forth."},{"v":6,"t":"For I desired mercy, and not sacrifice; and the knowledge of God more than burnt offerings.","hl":1},{"v":7,"t":"But they like men have transgressed the covenant: there have they dealt treacherously against me."},{"v":8,"t":"Gilead is a city of them that work iniquity, and is polluted with blood."},{"v":9,"t":"And as troops of robbers wait for a man, so the company of priests murder in the way by consent: for they commit lewdness."}]},"Matthew 9:13":{"ref":"Matthew 9","cited":"13","verses":[{"v":10,"t":"And it came to pass, as Jesus sat at meat in the house, behold, many publicans and sinners came and sat down with him and his disciples."},{"v":11,"t":"And when the Pharisees saw it, they said unto his disciples, Why eateth your Master with publicans and sinners?"},{"v":12,"t":"But when Jesus heard that, he said unto them, They that be whole need not a physician, but they that are sick."},{"v":13,"t":"But go ye and learn what that meaneth, I will have mercy, and not sacrifice: for I am not come to call the righteous, but sinners to repentance.","hl":1},{"v":14,"t":"Then came to him the disciples of John, saying, Why do we and the Pharisees fast oft, but thy disciples fast not?"},{"v":15,"t":"And Jesus said unto them, Can the children of the bridechamber mourn, as long as the bridegroom is with them? but the days will come, when the bridegroom shall be taken from them, and then shall they fast."},{"v":16,"t":"No man putteth a piece of new cloth unto an old garment, for that which is put in to fill it up taketh from the garment, and the rent is made worse."}]},"Leviticus 16":{"ref":"Leviticus 16","cited":"","verses":[{"v":1,"t":"And the LORD spake unto Moses after the death of the two sons of Aaron, when they offered before the LORD, and died;"},{"v":2,"t":"And the LORD said unto Moses, Speak unto Aaron thy brother, that he come not at all times into the holy place within the veil before the mercy seat, which is upon the ark; that he die not: for I will appear in the cloud upon the mercy seat."},{"v":3,"t":"Thus shall Aaron come into the holy place: with a young bullock for a sin offering, and a ram for a burnt offering."},{"v":4,"t":"He shall put on the holy linen coat, and he shall have the linen breeches upon his flesh, and shall be girded with a linen girdle, and with the linen mitre shall he be attired: these are holy garments; therefore shall he wash his flesh in water, and so put them on."},{"v":5,"t":"And he shall take of the congregation of the children of Israel two kids of the goats for a sin offering, and one ram for a burnt offering."},{"v":6,"t":"And Aaron shall offer his bullock of the sin offering, which is for himself, and make an atonement for himself, and for his house."},{"v":7,"t":"And he shall take the two goats, and present them before the LORD at the door of the tabernacle of the congregation."},{"v":8,"t":"And Aaron shall cast lots upon the two goats; one lot for the LORD, and the other lot for the scapegoat."},{"v":9,"t":"And Aaron shall bring the goat upon which the LORD's lot fell, and offer him for a sin offering."},{"v":10,"t":"But the goat, on which the lot fell to be the scapegoat, shall be presented alive before the LORD, to make an atonement with him, and to let him go for a scapegoat into the wilderness."},{"v":11,"t":"And Aaron shall bring the bullock of the sin offering, which is for himself, and shall make an atonement for himself, and for his house, and shall kill the bullock of the sin offering which is for himself:"},{"v":12,"t":"And he shall take a censer full of burning coals of fire from off the altar before the LORD, and his hands full of sweet incense beaten small, and bring it within the veil:"},{"v":13,"t":"And he shall put the incense upon the fire before the LORD, that the cloud of the incense may cover the mercy seat that is upon the testimony, that he die not:"},{"v":14,"t":"And he shall take of the blood of the bullock, and sprinkle it with his finger upon the mercy seat eastward; and before the mercy seat shall he sprinkle of the blood with his finger seven times."},{"v":15,"t":"Then shall he kill the goat of the sin offering, that is for the people, and bring his blood within the veil, and do with that blood as he did with the blood of the bullock, and sprinkle it upon the mercy seat, and before the mercy seat:"},{"v":16,"t":"And he shall make an atonement for the holy place, because of the uncleanness of the children of Israel, and because of their transgressions in all their sins: and so shall he do for the tabernacle of the congregation, that remaineth among them in the midst of their uncleanness."},{"v":17,"t":"And there shall be no man in the tabernacle of the congregation when he goeth in to make an atonement in the holy place, until he come out, and have made an atonement for himself, and for his household, and for all the congregation of Israel."},{"v":18,"t":"And he shall go out unto the altar that is before the LORD, and make an atonement for it; and shall take of the blood of the bullock, and of the blood of the goat, and put it upon the horns of the altar round about."},{"v":19,"t":"And he shall sprinkle of the blood upon it with his finger seven times, and cleanse it, and hallow it from the uncleanness of the children of Israel."},{"v":20,"t":"And when he hath made an end of reconciling the holy place, and the tabernacle of the congregation, and the altar, he shall bring the live goat:"},{"v":21,"t":"And Aaron shall lay both his hands upon the head of the live goat, and confess over him all the iniquities of the children of Israel, and all their transgressions in all their sins, putting them upon the head of the goat, and shall send him away by the hand of a fit man into the wilderness:"},{"v":22,"t":"And the goat shall bear upon him all their iniquities unto a land not inhabited: and he shall let go the goat in the wilderness."},{"v":23,"t":"And Aaron shall come into the tabernacle of the congregation, and shall put off the linen garments, which he put on when he went into the holy place, and shall leave them there:"},{"v":24,"t":"And he shall wash his flesh with water in the holy place, and put on his garments, and come forth, and offer his burnt offering, and the burnt offering of the people, and make an atonement for himself, and for the people."},{"v":25,"t":"And the fat of the sin offering shall he burn upon the altar."},{"v":26,"t":"And he that let go the goat for the scapegoat shall wash his clothes, and bathe his flesh in water, and afterward come into the camp."},{"v":27,"t":"And the bullock for the sin offering, and the goat for the sin offering, whose blood was brought in to make atonement in the holy place, shall one carry forth without the camp; and they shall burn in the fire their skins, and their flesh, and their dung."},{"v":28,"t":"And he that burneth them shall wash his clothes, and bathe his flesh in water, and afterward he shall come into the camp."},{"v":29,"t":"And this shall be a statute for ever unto you: that in the seventh month, on the tenth day of the month, ye shall afflict your souls, and do no work at all, whether it be one of your own country, or a stranger that sojourneth among you:"},{"v":30,"t":"For on that day shall the priest make an atonement for you, to cleanse you, that ye may be clean from all your sins before the LORD."},{"v":31,"t":"It shall be a sabbath of rest unto you, and ye shall afflict your souls, by a statute for ever."},{"v":32,"t":"And the priest, whom he shall anoint, and whom he shall consecrate to minister in the priest's office in his father's stead, shall make the atonement, and shall put on the linen clothes, even the holy garments:"},{"v":33,"t":"And he shall make an atonement for the holy sanctuary, and he shall make an atonement for the tabernacle of the congregation, and for the altar, and he shall make an atonement for the priests, and for all the people of the congregation."},{"v":34,"t":"And this shall be an everlasting statute unto you, to make an atonement for the children of Israel for all their sins once a year. And he did as the LORD commanded Moses."}]},"Psalm 51":{"ref":"Psalms 51","cited":"","verses":[{"v":1,"t":"Have mercy upon me, O God, according to thy lovingkindness: according unto the multitude of thy tender mercies blot out my transgressions."},{"v":2,"t":"Wash me throughly from mine iniquity, and cleanse me from my sin."},{"v":3,"t":"For I acknowledge my transgressions: and my sin is ever before me."},{"v":4,"t":"Against thee, thee only, have I sinned, and done this evil in thy sight: that thou mightest be justified when thou speakest, and be clear when thou judgest."},{"v":5,"t":"Behold, I was shapen in iniquity; and in sin did my mother conceive me."},{"v":6,"t":"Behold, thou desirest truth in the inward parts: and in the hidden part thou shalt make me to know wisdom."},{"v":7,"t":"Purge me with hyssop, and I shall be clean: wash me, and I shall be whiter than snow."},{"v":8,"t":"Make me to hear joy and gladness; that the bones which thou hast broken may rejoice."},{"v":9,"t":"Hide thy face from my sins, and blot out all mine iniquities."},{"v":10,"t":"Create in me a clean heart, O God; and renew a right spirit within me."},{"v":11,"t":"Cast me not away from thy presence; and take not thy holy spirit from me."},{"v":12,"t":"Restore unto me the joy of thy salvation; and uphold me with thy free spirit."},{"v":13,"t":"Then will I teach transgressors thy ways; and sinners shall be converted unto thee."},{"v":14,"t":"Deliver me from bloodguiltiness, O God, thou God of my salvation: and my tongue shall sing aloud of thy righteousness."},{"v":15,"t":"O Lord, open thou my lips; and my mouth shall shew forth thy praise."},{"v":16,"t":"For thou desirest not sacrifice; else would I give it: thou delightest not in burnt offering."},{"v":17,"t":"The sacrifices of God are a broken spirit: a broken and a contrite heart, O God, thou wilt not despise."},{"v":18,"t":"Do good in thy good pleasure unto Zion: build thou the walls of Jerusalem."},{"v":19,"t":"Then shalt thou be pleased with the sacrifices of righteousness, with burnt offering and whole burnt offering: then shall they offer bullocks upon thine altar."}]},"Romans 11:25":{"ref":"Romans 11","cited":"25","verses":[{"v":22,"t":"Behold therefore the goodness and severity of God: on them which fell, severity; but toward thee, goodness, if thou continue in his goodness: otherwise thou also shalt be cut off."},{"v":23,"t":"And they also, if they abide not still in unbelief, shall be grafted in: for God is able to graft them in again."},{"v":24,"t":"For if thou wert cut out of the olive tree which is wild by nature, and wert grafted contrary to nature into a good olive tree: how much more shall these, which be the natural branches, be grafted into their own olive tree?"},{"v":25,"t":"For I would not, brethren, that ye should be ignorant of this mystery, lest ye should be wise in your own conceits; that blindness in part is happened to Israel, until the fulness of the Gentiles be come in.","hl":1},{"v":26,"t":"And so all Israel shall be saved: as it is written, There shall come out of Sion the Deliverer, and shall turn away ungodliness from Jacob:"},{"v":27,"t":"For this is my covenant unto them, when I shall take away their sins."},{"v":28,"t":"As concerning the gospel, they are enemies for your sakes: but as touching the election, they are beloved for the fathers' sakes."}]},"Romans 11:26":{"ref":"Romans 11","cited":"26","verses":[{"v":23,"t":"And they also, if they abide not still in unbelief, shall be grafted in: for God is able to graft them in again."},{"v":24,"t":"For if thou wert cut out of the olive tree which is wild by nature, and wert grafted contrary to nature into a good olive tree: how much more shall these, which be the natural branches, be grafted into their own olive tree?"},{"v":25,"t":"For I would not, brethren, that ye should be ignorant of this mystery, lest ye should be wise in your own conceits; that blindness in part is happened to Israel, until the fulness of the Gentiles be come in."},{"v":26,"t":"And so all Israel shall be saved: as it is written, There shall come out of Sion the Deliverer, and shall turn away ungodliness from Jacob:","hl":1},{"v":27,"t":"For this is my covenant unto them, when I shall take away their sins."},{"v":28,"t":"As concerning the gospel, they are enemies for your sakes: but as touching the election, they are beloved for the fathers' sakes."},{"v":29,"t":"For the gifts and calling of God are without repentance."}]},"Romans 11:18":{"ref":"Romans 11","cited":"18","verses":[{"v":15,"t":"For if the casting away of them be the reconciling of the world, what shall the receiving of them be, but life from the dead?"},{"v":16,"t":"For if the firstfruit be holy, the lump is also holy: and if the root be holy, so are the branches."},{"v":17,"t":"And if some of the branches be broken off, and thou, being a wild olive tree, wert grafted in among them, and with them partakest of the root and fatness of the olive tree;"},{"v":18,"t":"Boast not against the branches. But if thou boast, thou bearest not the root, but the root thee.","hl":1},{"v":19,"t":"Thou wilt say then, The branches were broken off, that I might be grafted in."},{"v":20,"t":"Well; because of unbelief they were broken off, and thou standest by faith. Be not highminded, but fear:"},{"v":21,"t":"For if God spared not the natural branches, take heed lest he also spare not thee."}]},"Matthew 7:16":{"ref":"Matthew 7","cited":"16","verses":[{"v":13,"t":"Enter ye in at the strait gate: for wide is the gate, and broad is the way, that leadeth to destruction, and many there be which go in thereat:"},{"v":14,"t":"Because strait is the gate, and narrow is the way, which leadeth unto life, and few there be that find it."},{"v":15,"t":"Beware of false prophets, which come to you in sheep's clothing, but inwardly they are ravening wolves."},{"v":16,"t":"Ye shall know them by their fruits. Do men gather grapes of thorns, or figs of thistles?","hl":1},{"v":17,"t":"Even so every good tree bringeth forth good fruit; but a corrupt tree bringeth forth evil fruit."},{"v":18,"t":"A good tree cannot bring forth evil fruit, neither can a corrupt tree bring forth good fruit."},{"v":19,"t":"Every tree that bringeth not forth good fruit is hewn down, and cast into the fire."}]},"Romans 11:1":{"ref":"Romans 11","cited":"1","verses":[{"v":1,"t":"I say then, Hath God cast away his people? God forbid. For I also am an Israelite, of the seed of Abraham, of the tribe of Benjamin.","hl":1},{"v":2,"t":"God hath not cast away his people which he foreknew. Wot ye not what the scripture saith of Elias? how he maketh intercession to God against Israel, saying,"},{"v":3,"t":"Lord, they have killed thy prophets, and digged const WHYMAP={"suffering-servant":"Isaiah 53 is the chapter this conversation usually lands on. Getting it right — including what Jewish sources themselves said about it before the argument started — is what separates a real conversation from a shouting match. **Therefore:** make the argument out of their library, not yours, and it cannot be waved away as a Christian reading.","messianic-prophecy":"Any single prophecy can be argued about. What asks to be explained is the whole picture together: a specific portrait, written centuries early, in books your friend already accepts as Scripture. **Therefore:** take one text at a time and let them add up, rather than firing twelve at once.","daniel-timeline":"Every other prophecy can be slid around in history. This one cannot — it has an order of events, and the last one already happened in AD 70. **Therefore:** this is the one place where you can point at a date instead of arguing about a word.","temple-atonement":"The law of Moses grounds forgiveness in blood on an altar. That altar has been gone for nineteen centuries. **Therefore:** the question is not whether Judaism has an answer — it does — but whether the Torah itself authorises that answer.","new-covenant":"If your friend believes Christians invented a second covenant to justify a new religion, nothing else you say will get a hearing. Jeremiah closes that door from inside the Hebrew Bible. **Therefore:** the disagreement is no longer whether a new covenant was promised — only who brought it.","rabbinic-objections":"These are serious arguments made by prepared people, and answering the weak version of them convinces nobody. **Therefore:** learn their strongest form, drop the Christian arguments that fail, and you will be one of the very few Christians worth talking to.","nt-jewishness":"The biggest obstacle here is not an argument. It is a history — what the word Christian has meant to Jewish families for a thousand years. **Therefore:** name that history yourself, unprompted, before you open a single verse. Nothing lands until you do."};
const TALK={"suffering-servant":"Never open with *“read Isaiah 53.”* They have read it, and they have an answer. Open with the history instead: **“Did you know the Targum on this chapter calls the servant the Messiah?”** Then Sukkah 52a. You are not telling them what their book says — you are asking about their own tradition, and that is a completely different conversation.","messianic-prophecy":"Never stack twelve prophecies in a row; it reads as a sales pitch and each one invites a rebuttal. Take **one** — Micah 5:2 or Zechariah 12:10 — and ask, *“How do you read this one?”* Then genuinely listen. The cumulative case only works if each piece was actually examined.","daniel-timeline":"This is the one prophecy with a deadline, so let the deadline do the work: **“Daniel says an anointed one is cut off before the city and sanctuary are destroyed. The Temple fell in 70. Who was that?”** Don't argue about the exact arithmetic of the weeks — the terminus is the argument.","temple-atonement":"Ask it as a real question, because it is one: **“Leviticus 17:11 says atonement is by blood on the altar. There has been no altar since 70 — what grounds atonement now?”** The answers are prayer, repentance and good deeds. Then, gently: *where does the Torah say that?* Ask once and stop.","new-covenant":"The word 'new covenant' is not a Christian import — it is Jeremiah's. **“Who is the new covenant of Jeremiah 31 made with?”** Read the verse: with the house of Israel and the house of Judah. That single verse dissolves the 'you made up a new religion' frame before it forms.","rabbinic-objections":"Counter-missionary arguments are serious, prepared, and often better than what you have. Say so: **“That's a real argument — let me think about it.”** Then answer the strongest form of it or admit you can't yet. Bluffing here is fatal; they have heard every bluff.","nt-jewishness":"Before any text, name the history: **“I know what the word Christian has meant to Jewish families — the Crusades, the expulsions, Luther, and then Europe in 1941.”** Say it unprompted. Then Romans 11:1: *“has God cast away his people? God forbid.”* Nothing else you say will be heard until that is on the table."};
const DIALOG={"suffering-servant":[{"w":"them","t":"Isaiah 53 is our chapter, and you're reading it out of context. Go back to Isaiah 41: 'You, Israel, my servant.' The servant is named Israel again and again — 44, 45, 48, 49. Chapter 53 is the kings of the nations, stunned in the last days, confessing what they did to the Jewish people in exile. Rashi, Ibn Ezra, Radak — that's the Jewish reading."},{"w":"you","t":"You're right that the servant is named Israel in those passages — I won't pretend otherwise. But inside the Servant Songs the servant also has a mission TO Israel: 49:5-6 says he's formed from the womb to bring Jacob back and raise up the tribes. Can Israel restore Israel? And in 53:8 the speaker says he was stricken 'for the transgression of my people' — if the speakers are the nations' kings, since when do Gentile kings call Israel 'my people'?"},{"w":"them","t":"The righteous remnant suffers for the guilty nation — a servant within the servant. And be honest about your history: the national reading became standard partly because Christians turned this chapter into a weapon. Rashi wrote while Crusaders were butchering the communities of the Rhineland."},{"w":"you","t":"Then let me say it before you have to: Christians quoted Isaiah while killing Jews, and Rashi's move was partly self-defense — I believe that, and the shame of it belongs to my house. But the messianic reading is older than the church's crimes. Targum Jonathan opens the passage 'Behold, my servant the Messiah.' Sanhedrin 98b derives Messiah's name from 53:4. That reading is Jewish property; the crimes don't erase it."},{"w":"them","t":"The Targum gives the Messiah the victory and leaves the suffering to Israel — it's not your crucified Messiah. And 53:10 says the servant will 'see offspring and prolong days.' Your Jesus died childless at thirty-three. The verse disqualifies him on its face."},{"w":"you","t":"The Targum reroutes the pain, yes — which itself tells you the plain text made messianic readers flinch. Now stay in 53:10: the same verse says his soul is made an asham — a guilt offering — and THEN he sees offspring and prolongs days. A guilt offering dies; that's what an asham is. A figure whose life is a completed guilt offering and who afterward prolongs his days is either a contradiction — or a resurrection. Read the chapter cold with me, no commentaries on either side, and tell me who you see."}],"messianic-prophecy":[{"w":"them","t":"The Tanakh gives a checklist. Messiah rebuilds the Temple (Ezekiel 37), gathers the exiles (Isaiah 43), brings world peace (Isaiah 2:4 — swords into plowshares), and fills the earth with the knowledge of God (Isaiah 11:9). Jesus went zero for four. That's not interpretation; that's arithmetic."},{"w":"you","t":"I affirm every item on that list — it's the reigning-king portrait and it stands. But the same prophets drew a second portrait: a king who arrives 'lowly, riding on a donkey' (Zech 9:9), one who is pierced and mourned like an only son (Zech 12:10), a servant despised, rejected, cut off from the land of the living (Isa 53). Your own tradition felt the collision so hard it split the Messiah in two — ben Joseph, who dies, before ben David, who reigns."},{"w":"them","t":"Ben Joseph is late aggadah, not Torah — a minor figure to absorb a few awkward verses. And 'he'll do the rest at a second coming' is an unfalsifiable IOU. Anyone who failed can promise a round two."},{"w":"you","t":"It would be unfalsifiable — except round one is checkable. A ruler from Bethlehem of Judah 'whose origins are from of old' (Micah 5:2). The donkey-king hailed in Jerusalem (Zech 9:9). And a timestamp: Daniel 9:26's anointed one cut off before the city and sanctuary are destroyed — before 70 CE. The IOU has a date and a signature. A deferred second act only matters because the first act happened on schedule."},{"w":"them","t":"Every one of those is contested and you know it. Bethlehem Ephrathah may name the clan, not the birthplace; Zechariah's pierced one may be a fallen warrior in the Gog war; Daniel's anointed one is Agrippa or the priesthood in our commentators, Onias or Antiochus-era figures in the academy."},{"w":"you","t":"Contested — conceded, every one, and I won't sell you certainty I don't have. So my only ask is this: don't take my reading or Rashi's on authority. They're your books. Put the two portraits side by side — the pierced one and the enthroned one — and ask which figure in history has any serious claim on the first portrait while the whole world, yours and mine, still waits on the second. That's the question; the rest is commentary."}],"daniel-timeline":[{"w":"them","t":"Daniel 9? The Talmud itself says 'blasted be the bones of those who calculate the end' (Sanhedrin 97b). Generations of date-setters wrecked communities with that chapter. And our commentators read the 'anointed one cut off' as Agrippa, or the anointed priesthood ending at the destruction — not your Messiah."},{"w":"you","t":"I'm not calculating an end — that curse can stand. I'm reading a boundary the text already drew: 9:26 says an anointed one is cut off, and AFTER that, 'the people of the prince who is to come shall destroy the city and the sanctuary.' Whatever the seventy weeks mean precisely, that verse puts a mashiach dying before 70 CE. Not my math — Daniel's sequence."},{"w":"them","t":"Mashiach there just means 'an anointed one' — every king and high priest was anointed. The academy reads the chapter around Onias III and the Antiochus crisis. You're capitalizing a common noun and calling it Jesus."},{"w":"you","t":"Granted — 'anointed' is a broad word, and I'll hold the identification loosely. But set that verse next to your own tradition's memory. Yoma 39b: for the last forty years before the destruction, the lot for the LORD stopped coming up in the right hand and the crimson thread stopped turning white. Count back from 70. On the Talmud's own telling, Yom Kippur's signs went dark starting around 30 CE."},{"w":"them","t":"Aggadah is not a lab report. The same page says the Temple doors swung open by themselves. You can't dismiss the Oral Torah all year and then wave one folio as forensic evidence when it points your way."},{"w":"you","t":"That's a fair hit, and I'll take it: not proof — your tradition's own memory that something changed in that generation, held loosely. But now stack the loose pieces. Daniel: an anointed one cut off before the destruction. Genesis 49:10: the scepter stays with Judah 'until Shiloh comes' — which Targum Onkelos renders 'until the Messiah comes, to whom the kingdom belongs.' Yoma 39b: forty dark years from about 30 CE. If the window the texts draw is behind us, then the honest question stops being whether Messiah came. It becomes: who came?"}],"temple-atonement":[{"w":"them","t":"This 'no temple, no atonement' argument misreads us completely. Hosea 14: 'Take words with you and return to the LORD... we will offer the bulls of our lips.' When the Temple fell, Rabban Yohanan ben Zakkai stood in the ruins and said we have an atonement as effective: deeds of lovingkindness. Teshuvah, tefillah, tzedakah. We never needed blood the way you need us to have needed it."},{"w":"you","t":"Ben Zakkai's answer was pastoral genius in a catastrophe, and I honor it — Yavneh saved your people's ability to survive the ruins. But notice what it is: an answer the Torah itself is never recorded giving. Leviticus 17:11 is God's own stated mechanism — 'the life of the flesh is in the blood, and I have given it to you on the altar to make atonement for your souls.' Where does the Torah say that mechanism was provisional, waiting to be swapped out?"},{"w":"them","t":"The prophets say it constantly. 'I desire mercy, not sacrifice' (Hosea 6:6). 'You do not delight in sacrifice... the sacrifices of God are a broken and contrite heart' (Psalm 51). Samuel: obedience is better than sacrifice. God always wanted the heart. The altar was scaffolding."},{"w":"you","t":"Read Psalm 51 one verse further: 'THEN you will delight in right sacrifices, and bulls will be offered on your altar.' David's broken heart doesn't replace the offering — it makes the offering honest. The prophets attack sacrifice without repentance; not one of them repeals Yom Kippur. And if repentance alone had always sufficed, the Day of Atonement was redundant the day it was given."},{"w":"them","t":"So your alternative is what — human sacrifice? The Torah calls that an abomination; we don't even eat blood, let alone atone by a man's execution. Nothing could be less Jewish than what you're proposing."},{"w":"you","t":"The Torah abominates a life SEIZED — Molech's fire, a victim with no say. Isaiah 53:10 describes the opposite: a servant whose own soul is set as an asham, a guilt offering, who 'poured out his soul to death' willingly and 'bore the sin of many.' Offered, not taken. Your calendar still aches once a year for atonement it has no altar to carry. My claim is that inside the window Daniel drew, that ache was answered — one final Yom Kippur — which is exactly why Jeremiah's new covenant can end, 'I will remember their sin no more.'"}],"new-covenant":[{"w":"them","t":"Read all of Jeremiah 31, not just your verse. The new covenant is with 'the house of Israel and the house of Judah' — not a church. It's Torah written on hearts — the same Torah, kept at last, not replaced. And it describes a world where no one needs to say 'know the LORD' because everyone knows him. Look out the window. Has your covenant produced that world?"},{"w":"you","t":"I agree with nearly all of that — including the indictment at the end. It names Israel and Judah first, and it's Torah internalized, not Torah abolished; any Christian reading that erases Israel from Israel's own promise has failed before it starts. Where we part: 31:32 says this covenant is 'NOT like the covenant I made with their fathers... my covenant which they broke.' Not-like means new in kind — not Sinai refreshed."},{"w":"them","t":"New in kind how? Show me the mediator in the chapter. Show me a dying Messiah, a cross, a Eucharist. They're not there. You're importing your ending into our book and calling it exegesis."},{"w":"you","t":"The chapter itself ends on the hinge: 'I will forgive their iniquity, and their sin I will remember no more' (31:34). Forgiveness that final carries a mechanism question — the same Leviticus 17:11 question we keep circling. And covenants in the Tanakh are cut in blood; Sinai's was — 'behold the blood of the covenant' (Exodus 24:8). So when a Jewish teacher at a Passover table lifts the cup and says 'this is the blood of the new covenant,' he's quoting Jeremiah and Exodus in one breath — to Jews, about the covenant promised to Jews. That's not an import; that's an address."},{"w":"them","t":"And twenty centuries later the earth is still not full of the knowledge of the LORD. So at best you're holding a deposit slip and calling it the deposit. Why should I accept a covenant that visibly hasn't done what its own text promises?"},{"w":"you","t":"'Deposit' is exactly the word I'd choose — the forgiveness now, the universal knowledge when the King finishes the reigning portrait. You're waiting for both acts to arrive together; I'm claiming the first is behind us and staking everything on the second. That's the entire disagreement — and notice where we're having it: inside Jeremiah, verse by verse. That's the only place I want to have it."}],"rabbinic-objections":[{"w":"them","t":"Before you quote a single verse, be honest about what you're asking me. The last time the church wanted Jewish souls it came with disputations we were forced to attend and stakes for the losers. My grandmother's town in Poland had a church at one end and a pit at the other. And now you'd like to study Tanakh with me?"},{"w":"you","t":"Then let me say it before you have to, and without softening: the Rhineland massacres of 1096 were carried out under a cross. The blood libel was invented in Christian England. Spain expelled your people in 1492 with clergy applauding. Luther's 1543 tract reads like a pogrom manual and the Nazis reprinted it. The Holocaust grew in baptized Europe's soil. I don't ask you to forget or forgive any of it on my schedule. I ask a different question: is Yeshua of Nazareth — a Torah-keeping Jew who never met Christendom — guilty of what was done wearing his name?"},{"w":"them","t":"'By their fruits you will know them' — your own teacher's test. Twenty centuries of this fruit. At some point the tree is answerable."},{"w":"you","t":"And the same teacher said many will cry 'Lord, Lord' and hear 'I never knew you; depart from me, you workers of lawlessness.' I won't defend Christendom, and I'm not recruiting you into its history. The claim I care about predates every crime you named: a first-century claim made by Jews, to Jews, from your scriptures, in your land, before there was a Christendom to sin. Judge that claim by Moses and the Prophets — the very test your tradition would demand."},{"w":"them","t":"Even granting all that — Maimonides ruled a Jew must die rather than worship a man. This is not a book-club disagreement for me. It's avodah zarah, the one line with no exceptions, the line my ancestors died rather than cross."},{"w":"you","t":"I respect that line more than you might expect — the Shema is not negotiable, and if Yeshua is merely a man, then Rambam is right and I'm the idolater; I accept those stakes. Which means the real question between us can't be settled by my church or your posek — only in the text we share. Zechariah 12:10, YHWH speaking: 'they will look on ME, whom they have pierced, and mourn for him as one mourns an only son.' Start there with me. Not with my history, and not with my institutions — with your prophet."}],"nt-jewishness":[{"w":"them","t":"The New Testament is a Greek book written for Gentiles that curses my people. 'His blood be on us and on our children' — that one sentence armed a thousand pogroms. Don't stand there and tell me it's a Jewish book."},{"w":"you","t":"That verse was wielded exactly as you say, for centuries, and the church that wielded it will answer to God for every pogrom it blessed — I won't dilute that. But open Matthew cold. It begins 'the book of the toledot of Yeshua the Messiah, son of David, son of Abraham' — a genealogy formula straight out of Genesis. Nearly every author is a Jew. And every fight inside it is an intra-Jewish fight — Sabbath halakhah, purity, temple, resurrection — Pharisee-Sadducee territory, not Greek philosophy."},{"w":"them","t":"The gospels, maybe. Paul is the problem. He abolished the Torah, invented a religion for Gentiles that Jesus of Nazareth never taught, and you people dress it back up in a tallit and market it to us as Judaism."},{"w":"you","t":"The same Paul wrote 'Has God rejected his people? By no means! I myself am an Israelite' (Romans 11:1), warned Gentiles never to boast over the branches, took a vow and paid for temple sacrifices in Acts 21, and circumcised Timothy. The Gentile question was settled at a Jerusalem council (Acts 15) that reasoned from Amos 9 like a beit din: the nations come in AS nations — which is Isaiah's own vision of Gentiles streaming to Israel's God. That's Jewish universalism doing what the prophets said it would, not a new religion."},{"w":"them","t":"Then explain the churches. If the book is so Jewish, why has every church I've ever walked past scrubbed the Torah, forgotten Israel, and hung up a blond Jesus? Two thousand years of readers didn't notice what you claim is on every page?"},{"w":"you","t":"They didn't notice — and that amnesia is close to the church's original sin. Romans 11 warned the very first Gentile generation against it, and they did it anyway, and my tradition is still repenting of it. Which is why my invitation runs opposite to the old one. Not 'leave your people and enter my church' — but read Matthew with me as what it actually is, a Jewish book making a Jewish claim, and hold me accountable to your text every single time my religion forgot it."}]};
const ABBR=["c","cf","vs","e.g","i.e","etc","Dr","St","Mr","Mrs","ch","pp","v","vv","no","approx","Jr","Sr"];
function splitSentences(raw){
  const tokens=raw.split(/(?<=[.!?])\s+(?=[A-Z0-9"'(‘“])/);
  const merged=[];
  tokens.forEach(t=>{
    if(merged.length){
      const prev=merged[merged.length-1];
      const m=prev.match(/([A-Za-z&.]+)\.$/);
      const w=m?m[1].replace(/\./g,""):null;
      if(w&&ABBR.includes(w)){merged[merged.length-1]=prev+" "+t;return;}
    }
    merged.push(t);
  });
  return merged;
}
const LDSBOOKS="(?:Targum(?:\\\\sJonathan)?|Sukkah\\\\s\\\\d+[ab]|Yoma\\\\s\\\\d+[ab]|Sanhedrin\\\\s\\\\d+[ab]|Midrash\\\\s[A-Za-z]+|Rashi|Ibn\\\\sEzra|Maimonides|Mishnah|Talmud|4Q\\\\d+)";
const BIBBOOKS="(?:[1-3]\\s)?(?:Genesis|Exodus|Leviticus|Numbers|Deuteronomy|Joshua|Judges|Ruth|Samuel|Kings|Chronicles|Ezra|Nehemiah|Esther|Job|Psalms?|Proverbs|Ecclesiastes|Isaiah|Jeremiah|Lamentations|Ezekiel|Daniel|Hosea|Joel|Amos|Obadiah|Jonah|Micah|Nahum|Habakkuk|Zephaniah|Haggai|Zechariah|Malachi|Matthew|Mark|Luke|John|Acts|Romans|Corinthians|Galatians|Ephesians|Philippians|Colossians|Thessalonians|Timothy|Titus|Philemon|Hebrews|James|Peter|Jude|Revelation)";
const REFNUM="";
const KEYWORDS=/\b(concedes?d?|conceded|disavow(?:s|ed|al)?|undisputed|unfalsifiable|no ancient manuscript|zero ancient witnesses|never recanted|does not match|do not match|no adequate answer|contradict(?:s|ing|ion)?|impossible|no record|officially disavowed)\b/gi;
function emphasize(t){
  t=t.replace(new RegExp("\\b("+LDSBOOKS+REFNUM+")","g"),'<span class="ref-lds">$1</span>');
  t=t.replace(new RegExp("\\b("+BIBBOOKS+"\\s\\d+(?::\\d+(?:[\\-–]\\d+)?(?:,\\s?\\d+(?:[\\-–]\\d+)?)*)?)","g"),m=>m.includes("ref-lds")?m:'<span class="ref-bib">'+m+'</span>');
  t=t.replace(/(^|[\s(—–])'([^'<>]{3,200}?)'(?=$|[\s.,;:)!?—–])/g,'$1<span class="qq">‘$2’</span>');
  t=t.replace(KEYWORDS,'<b class="kw">$1</b>');
  t=t.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/==(.+?)==/g,'<mark>$1</mark>');
  return t;
}
function rich(raw){return glossify(emphasize(esc(raw).replace(/&lt;(\/?)(b|i|em|strong)&gt;/g,"<$1$2>")));}
function paras(raw,per){
  per=per||2;
  const s=splitSentences(raw),ps=[];
  for(let i=0;i<s.length;i+=per)ps.push(s.slice(i,i+per).join(" "));
  return ps.map(p=>`<p>${rich(p)}</p>`).join("");
}
function formatDefense(raw){
  if(/\(\d+\)/.test(raw)){
    const parts=raw.split(/\(\d+\)\s*/);
    const intro=parts.shift().trim();
    return (intro?`<p class="lead">${rich(intro)}</p>`:"")+
      `<ol class="pts">${parts.map(p=>`<li>${rich(p.trim())}</li>`).join("")}</ol>`;
  }
  return paras(raw,2);
}

const RELATED={"isaiah-53-rabbinic-messianic-reading":["isaiah-53-servant-distinct-from-israel"],"isaiah-53-servant-distinct-from-israel":["isaiah-53-rabbinic-messianic-reading"],"sukkah-52a-two-messiahs":[],"daniel-9-cut-off-before-destruction":[],"micah-5-2-bethlehem":["zechariah-12-10-pierced","psalm-22-pierced-hands-feet","genesis-49-10-shiloh"],"zechariah-12-10-pierced":["micah-5-2-bethlehem","psalm-22-pierced-hands-feet","genesis-49-10-shiloh"],"psalm-22-pierced-hands-feet":["micah-5-2-bethlehem","zechariah-12-10-pierced","genesis-49-10-shiloh"],"genesis-49-10-shiloh":["micah-5-2-bethlehem","zechariah-12-10-pierced","psalm-22-pierced-hands-feet"],"isaiah-7-14-almah":["micah-5-2-bethlehem","zechariah-12-10-pierced","psalm-22-pierced-hands-feet"],"second-temple-messianic-expectation":["micah-5-2-bethlehem","zechariah-12-10-pierced","psalm-22-pierced-hands-feet"],"jeremiah-31-new-covenant":[],"yoma-39b-forty-years":["atonement-after-the-temple"],"atonement-after-the-temple":["yoma-39b-forty-years"],"hosea-blindness-restoration-romans-11":["nt-jewish-library"],"nt-jewish-library":["hosea-blindness-restoration-romans-11"],"avoid-talmud-quote-mining":["sukkah-52a-two-messiahs"],"avoid-jews-killed-jesus":["sukkah-52a-two-messiahs"],"avoid-legalism-caricature":["sukkah-52a-two-messiahs"],"avoid-gematria-bible-codes":["sukkah-52a-two-messiahs"]};

const GLOSSARY=[{"t":"4Q521","d":"A Dead Sea Scroll fragment describing a Messiah who heals the blind and raises the dead — pre-Christian, and almost word for word what Jesus sends back to John the Baptist in Matthew 11."},{"t":"a chiasm","d":"A mirror-image literary structure (A-B-C-B-A) common in Hebrew writing. It appears in these arguments because its presence in a text is sometimes offered as evidence of ancient Semitic authorship."},{"t":"a codex","d":"A book with bound pages, as opposed to a scroll. Christians adopted the codex format remarkably early, which is part of why so many early Christian manuscripts survive."},{"t":"a palimpsest","d":"A manuscript whose original writing was scraped off so the expensive material could be reused. Modern imaging can often recover the erased text underneath — which is how the Sanaa Quran's earlier layer was read."},{"t":"a proof-text","d":"A verse quoted on its own to establish a point, usually detached from what surrounds it. Proof-texting is the single most common way both sides of every argument on this site go wrong."},{"t":"a stele","d":"An upright inscribed stone slab set up to record a victory, a law, or a treaty — one of archaeology's most valuable finds, because it is a dated, deliberate, public record."},{"t":"a textual variant","d":"Any difference between two manuscripts, including a misspelling or a change in word order. The famous 'hundreds of thousands of variants' figure is real and almost entirely trivial; the meaningful and viable ones are well under 1%, and every modern Bible footnotes them."},{"t":"almah / betulah","d":"The two Hebrew words at the centre of the Isaiah 7:14 argument — 'young woman' and 'virgin'. Handle this one carefully; the Christian case here is weaker than it is usually presented."},{"t":"an anachronism","d":"Something appearing in a story before it existed in real life — a horse in a place with no horses, a stirrup centuries too early. Anachronisms are one of the main tools for dating a text, because a writer can only mention the world he lives in."},{"t":"an apologist","d":"Someone who defends a faith's claims — from the Greek <i>apologia</i>, a legal defense. Not an insult, and not the same as an apologizer. This site quotes apologists deliberately: a claim is only worth making if it survives the best defense of it."},{"t":"an ossuary","d":"A limestone box for bones, used in Judea for about a century around the time of Jesus: a body was left to decompose for a year, then the bones were collected into the box. Names carved on ossuaries are how we have physical traces of individuals like the high priest Caiaphas."},{"t":"the apocrypha","d":"Books written between the Testaments (Tobit, Judith, Maccabees and others), included in Catholic and Orthodox Bibles and in the original 1611 KJV, but not in the Hebrew canon or in Protestant Bibles today."},{"t":"avodah zarah","d":"'Foreign worship' — idolatry. To an observant Jew, worshipping a man is not a doctrinal disagreement but the gravest possible sin, which is why the incarnation is the real wall."},{"t":"brit chadashah","d":"Hebrew for <i>new covenant</i> — <i>brit</i> is covenant, <i>chadashah</i> is new. It is the exact phrase Jeremiah uses in Jeremiah 31:31, which is the whole point: the words are Hebrew and Jewish, not a Christian translation choice."},{"t":"the canon","d":"The list of books a community accepts as Scripture. The New Testament canon was recognized gradually by usage over the first three centuries rather than voted on at a council — Athanasius's list of 367 AD matches ours exactly."},{"t":"Codex Sinaiticus","d":"A complete Greek Bible hand-copied around 330–360 AD, found at St Catherine's Monastery on Mount Sinai in the 1840s. Along with Vaticanus it is one of the two oldest complete Bibles in existence, and its text is essentially the text you read today."},{"t":"Codex Vaticanus","d":"A Greek Bible copied around 300–325 AD, held in the Vatican Library — slightly older than Sinaiticus and, with it, the backbone of modern New Testament textual scholarship."},{"t":"counter-missionary","d":"The organized Jewish response to Christian outreach — Outreach Judaism (Tovia Singer), Jews for Judaism. Well-prepared, well-funded, and worth reading before you speak."},{"t":"Daniel Boyarin","d":"A prominent Jewish scholar of religion who argues that ideas of a divine, suffering Messiah were already present within Second Temple Judaism rather than imported into it. He is not a Christian; his work is why 'that idea is not Jewish' is harder to say than it used to be."},{"t":"the Dead Sea Scrolls","d":"About 900 manuscripts found in caves at Qumran near the Dead Sea between 1947 and 1956, copied roughly 250 BC–70 AD. They pushed our oldest Hebrew Bible manuscripts back a thousand years — and the text matched what had been copied ever since. The single most important manuscript discovery ever made."},{"t":"Deutero-Isaiah","d":"The name critical scholars give to the proposed anonymous author of Isaiah 40–55, writing during the Babylonian exile. See the multi-Isaiah theory."},{"t":"the Documentary Hypothesis","d":"The critical theory that the first five books of the Bible were woven together from several earlier sources (labelled J, E, D and P) rather than written by Moses. The classic form is now heavily revised even among critical scholars, but some version of it is the mainstream academic position."},{"t":"E. P. Sanders","d":"The scholar whose <i>Paul and Palestinian Judaism</i> (1977) dismantled the caricature of Second Temple Judaism as works-righteousness, showing it as a religion of covenant grace with obligations. His work is the reason that caricature should never be repeated."},{"t":"exegesis","d":"Drawing out what a text actually says, in its own context. Its opposite is eisegesis — reading your conclusion into the text."},{"t":"the Great Isaiah Scroll","d":"The star of the Dead Sea Scrolls: a complete copy of Isaiah, all 66 chapters, copied around 125 BC. It proves Isaiah 53 and its portrait of a pierced, suffering servant existed more than a century before Jesus — nobody added it afterwards."},{"t":"Ibn Ezra","d":"Abraham ibn Ezra (1089–1167), a major medieval Jewish commentator, known for close grammatical attention to the Hebrew — often cited on Isaiah 53 and Isaiah 7:14."},{"t":"Josephus","d":"Titus Flavius Josephus (c. 37–100 AD), a Jewish general who surrendered to Rome and became its most important historian of first-century Judea. Not a Christian, which is why his mentions of Jesus, James and John the Baptist carry so much weight."},{"t":"kaari / kaaru","d":"The disputed word in Psalm 22:16 — 'like a lion' in the Masoretic text, 'they pierced' in the Septuagint and in a Dead Sea Scroll fragment from Nahal Hever."},{"t":"the KJV","d":"The King James Version of 1611, the English Bible of the whole period covered by this site. Its wording matters constantly here: several movements examined on this site were born inside its cadence, and some of them treat it as the only legitimate Bible."},{"t":"the Maccabean period","d":"The second century BC, when Judea revolted against the Greek Seleucid king Antiochus IV. It matters here because critical scholars date the book of Daniel to this period, which is the standard reply to any argument from Daniel's timeline."},{"t":"Mashiach","d":"'Anointed one' — Messiah. In mainstream Jewish expectation a human king of David's line who gathers the exiles, rebuilds the Temple, and brings world peace — which is precisely why a crucified Messiah reads as a contradiction in terms."},{"t":"the Masoretic Text","d":"The standard Hebrew Bible, preserved and vowel-pointed by Jewish scribes called the Masoretes between roughly 600 and 1000 AD. Almost every Old Testament translation is based on it; where it differs from the Septuagint or the Scrolls, that difference is what scholars argue about."},{"t":"Messiah ben Joseph / ben David","d":"The rabbinic two-Messiah doctrine (Sukkah 52a): one who suffers and is killed, one who reigns. It exists because the texts genuinely present two portraits."},{"t":"Messianic Jew","d":"A Jewish person who believes Jesus is the Messiah. Most of the Jewish community regards the category as illegitimate — expect the term itself to be contested."},{"t":"the multi-Isaiah theory","d":"The mainstream critical view that the book of Isaiah had more than one author: chapters 1–39 from the eighth-century prophet, 40–55 from an anonymous writer during the Babylonian exile ('Deutero-Isaiah'), and sometimes 56–66 from a third. It is argued from style and from the fact that chapters 40+ address the exile as present. Conservatives dispute it; it matters here because it is the standard reply whenever Isaiah is said to predict something."},{"t":"Nahal Hever","d":"A ravine near the Dead Sea where scroll fragments were found in the 1950s. One of them carries the reading 'they pierced' at Psalm 22:16, about a thousand years older than the standard Hebrew text."},{"t":"papyrus","d":"Paper made from reed pith, the ordinary writing material of the ancient world. New Testament papyri are labelled with a P and a number — P52, a scrap of John, is the earliest known New Testament manuscript, copied around 125 AD."},{"t":"Qumran","d":"The settlement beside the caves where the Dead Sea Scrolls were found, on the northwest shore of the Dead Sea. Usually associated with the Essenes, a strict Jewish sect of the Second Temple period."},{"t":"Rabbinic Judaism","d":"The form of Judaism that developed after the Temple's destruction in AD 70, centred on Torah study, the synagogue and the authority of the rabbis rather than on sacrifice and priesthood. Essentially all Judaism today descends from it."},{"t":"Rashi","d":"Rabbi Shlomo Yitzchaki (1040–1105), the most influential Jewish commentator. He read Isaiah 53 as national Israel — a reading that became standard after him, and was not standard before."},{"t":"the Sanhedrin","d":"The Jewish high court of the Second Temple period, and also the name of a Talmudic tractate. When a case cites 'Sanhedrin 98a,' it is citing the tractate, not the court."},{"t":"the Septuagint","d":"The Greek translation of the Hebrew Scriptures made by Jewish scholars in Alexandria beginning about 250 BC — abbreviated LXX. It matters constantly here because it is pre-Christian: when it renders a verse a certain way, no Christian could have influenced it."},{"t":"Septuagint","d":"The Greek translation of the Hebrew Bible, made by Jewish scholars starting around 250 BC — often shortened to LXX. It matters constantly here because it is pre-Christian: when it renders a verse a certain way, no Christian could have influenced it."},{"t":"Shema","d":"'Hear, O Israel: the LORD our God, the LORD is one' (Deuteronomy 6:4) — recited twice daily, and the reason God's oneness is non-negotiable in any conversation."},{"t":"Shiloh","d":"The mysterious word in Genesis 49:10 — 'the sceptre shall not depart from Judah… until Shiloh come.' Ancient Jewish sources including the Targum read it messianically; its exact meaning is genuinely disputed, and that dispute is worth conceding."},{"t":"Shoah","d":"The Holocaust. Christian Europe is where it happened, and Christian theology supplied centuries of its vocabulary. This is not background to the conversation — it is the room the conversation happens in."},{"t":"the Shoah","d":"The Holocaust. Six million Jewish people murdered in Christian Europe, with centuries of Christian theological vocabulary behind the machinery. This is not background to the conversation — it is the room the conversation happens in."},{"t":"the Smithsonian Institution","d":"The United States' national museum and research complex. It matters here because for decades a 'Smithsonian statement' was circulated claiming the institution used the Book of Mormon as an archaeological guide. The Smithsonian issued a formal statement denying it, and now sends a standard letter saying its archaeologists see no connection between the New World's archaeology and the book's contents."},{"t":"Sukkah 52a","d":"The Talmudic passage that introduces two Messiahs — Messiah ben Joseph, who is killed, and Messiah ben David, who reigns. It exists because the Hebrew Scriptures genuinely present two portraits, which is the whole hinge of this section."},{"t":"supersessionism / replacement theology","d":"The teaching that the church has replaced Israel. Romans 11 explicitly denies it, and the historic Christian versions of it are behind much of what was done to Jewish communities."},{"t":"Tacitus","d":"Roman senator and historian (c. 56–120 AD). His hostile mention of 'Christus,' executed by the procurator Pontius Pilate under Tiberius, is the standard non-Christian confirmation of the crucifixion."},{"t":"Talmud","d":"The vast rabbinic compilation (Mishnah plus Gemara, completed c. 500 AD). Two tractates matter most here: Sukkah 52a on two Messiahs, and Yoma 39b on the Temple's failed signs."},{"t":"Tanakh","d":"The Hebrew Bible, from the initials T-N-K: Torah (law), Nevi'im (prophets), Ketuvim (writings). The same books as the Christian Old Testament, in a different order — never call it 'the Old Testament' in conversation."},{"t":"Targum","d":"Ancient Aramaic renderings of the Hebrew Scriptures, read alongside the text in the synagogue. Targum Jonathan on Isaiah 52:13 opens: 'Behold, my servant the Messiah.'"},{"t":"textual criticism","d":"The scholarly discipline of comparing manuscripts to work out what the original wording was. It is not an attack on Scripture — it is the method that lets us say with confidence what the text said."},{"t":"Tovia Singer","d":"An Orthodox rabbi and the best-known counter-missionary — founder of Outreach Judaism. If your Jewish friend has prepared for this conversation, it is very likely his material they have prepared with, and it is worth reading before you speak."},{"t":"Yoma 39b","d":"The Talmudic passage recording that for the forty years before the Temple's destruction the Yom Kippur lot came up wrong, the crimson thread stopped turning white, and the western lamp went out."}];

const esc=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function hl(text,phrases){let out=esc(text);(phrases||[]).forEach(p=>{const e=esc(p).replace(/[.*+?^${}()|[\]\\]/g,"\\$&");out=out.replace(new RegExp(e,"gi"),m=>"<mark>"+m+"</mark>");});return out;}
function glossify(escapedText){
  if(!glossify._re){
    const ts=GLOSSARY.slice().sort((a,b)=>esc(b.t).length-esc(a.t).length);
    const alts=ts.map(g=>esc(g.t).replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|");
    glossify._re=new RegExp("(?<![\\w-])("+alts+")(?![\\w-])","gi");
    glossify._map={};GLOSSARY.forEach(g=>{glossify._map[esc(g.t).toLowerCase()]=g;});
  }
  const used=glossify.seen||(glossify.seen=new Set());
  return escapedText.replace(/(<[^>]*>)|([^<]+)/g,(m,tag,txt)=>{
    if(tag)return tag;
    return txt.replace(glossify._re,w=>{
      const g=glossify._map[w.toLowerCase()];
      if(!g||used.has(g.t))return w;
      used.add(g.t);
      return '<span class="g" tabindex="0">'+w+'<span class="gt"><b>'+esc(g.t)+'</b> — '+g.d+'</span></span>';
    });
  });
}


function findWhy(d,cite){
  const key=cite.replace(/–/g,"-").replace(/\s*\(.*\)\s*/g,"").trim();
  const m=key.match(/^([1-4]?\s?[A-Za-z&; ]+?)\s+(\d+)/);
  const frag=m?(m[1].trim()+" "+m[2]):key;
  const sentences=(d.claim+" "+d.rationale).replace(/–/g,"-").split(/(?<=[.!?])\s+/);
  const hit=sentences.find(s=>s.includes(frag));
  return hit?hit.replace(/-/g,"–"):null;
}

function extUrl(cite){
  const c=cite.replace(/–/g,"-").replace(/\s*\(.*\)\s*/g,"").trim();
  const qm=c.match(/^Quran\s+(\d+):(\d+)/i);
  if(qm)return "https://quran.com/"+qm[1]+"/"+qm[2];
  const qc=c.match(/^Quran\s+(\d+)/i);
  if(qc)return "https://quran.com/"+qc[1];
  const mm=c.match(/^([1-3]?\s?[A-Za-z ]+?)\s+(\d+)/);
  if(mm)return "https://www.biblegateway.com/passage/?search="+encodeURIComponent(c)+"&version=KJV";
  return "https://quran.com/";
}

    (!state.q||(d.title+" "+d.claim+" "+(d.response||"")+" "+(d.rationale||"")+" "+(CATS[d.category]||"")).toLowerCase().includes(state.q))

function plainHtml(d){
  const rt=t=>glossify(emphasize(esc(t).replace(/&lt;(\/?)(b|i)&gt;/g,"<$1$2>")));
  return (d.plain||[]).map(b=>{

    for(let i=0;i<ss.length;i+=2)ps.push("<p>"+rt(ss.slice(i,i+2).join(" "))+"</p>");
    const t=b.t.toLowerCase();
    const kind=b.say?"k-say":/^(the objection|what (you|your|people|they)|how it usually)/.test(t)?"k-them":/(verse|text|chapter|says|passage|record|promise|covenant does)/.test(t)?"k-text":/^how strong|^the rule|don't|do not use/.test(t)?"k-strength":/^why this|^why it|helps you/.test(t)?"k-help":"k-plain";
    const big=/(k-text|k-say)/.test(kind)?" k-big":"";
    return `<div class="pblk${b.say?" say":""}${big}"><div class="plab ${kind}">${esc(b.t)}</div>${ps.join("")}</div>`;
  }).join("");
}

/* ---------- glossary ---------- */
function renderGlossary(){
  $("#main").innerHTML=`<div class="viewhead"><h2>Word guide</h2><p>${GLOSSARY.length} terms this subject runs on, in plain English — names, books, sources and technical vocabulary. Every one of them is underlined with a dotted line wherever it appears in a case; hover or tap it there for the definition without leaving the page.</p></div><details class="primer" open><summary>New here? What this section is actually arguing</summary><div class="primerbody"><p><b>This section runs in the opposite direction from the rest of the site.</b> Everywhere else, the Bible is the shared standard and a movement's claims are weighed against it. Here the New Testament is not shared ground — so the case is made from the <b>Tanakh</b> (the Hebrew Bible), from the <b>Targum</b>, and from the <b>Talmud</b>: sources a Jewish friend already holds.</p>
    <p><b>The central problem is that the Hebrew Scriptures give two portraits</b> of the one to come: a conquering king of David's line, and a servant who is despised, pierced and killed (Isaiah 53). These look irreconcilable — and the rabbis saw it too. <b>Sukkah 52a</b> resolves it with two Messiahs: Messiah ben Joseph, who is slain, and Messiah ben David, who reigns. The Christian claim is smaller than it sounds: not two figures, but one, twice.</p>
    <p>Alongside that sit two datable arguments. <b>Daniel 9</b> has an anointed one cut off <i>before</i> the Temple is destroyed — and the Temple fell in AD 70. And <b>Yoma 39b</b>, in the Talmud itself, records that for the forty years before that destruction the Yom Kippur signs failed. Forty years before 70 is AD 30.</p>
    <p><b>None of it can be said until something else is.</b> The Crusades, the blood libel, the expulsions, forced disputations, Luther, and the <b>Shoah</b> — that history is the room this conversation happens in, and it must be named first and unprompted. Terms in dotted underline can be hovered anywhere for a definition.</p></div></details>
  <div class="gaccord">${GLOSSARY.map(g=>`<div class="gitem"><b>${esc(g.t)}</b><p>${g.d}</p></div>`).join("")}</div>`;
}
