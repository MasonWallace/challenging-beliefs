ian conclusion."},{"t":"Why this helps you","d":"It removes the \"you invented it later\" objection before it can be raised, using evidence that came out of a cave in 1947."},{"say":true,"t":"What to say","d":"\"Have you read 4Q521? It sounds a lot like Matthew 11, and it's older than Jesus.\""}],"refwhy":{"Isaiah 61:1-2":"'Good tidings unto the meek.' The Isaiah text underneath both the scroll and Jesus's answer to John. Read it to see what was expected.","Isaiah 35:5-6":"Blind eyes opened, lame men leaping. The other Isaiah passage behind that list. Note what is missing from both: raising the dead.","Luke 7:18-23":"John the Baptist asks 'art thou he?' Jesus answers with the scroll's own list, dead raised included. That extra item is the point.","Matthew 11:2-6":"The same exchange in Matthew. Cite whichever your friend has open. The wording that matters is the same in both.","4Q521 (Messianic Apocalypse)":"A Dead Sea Scroll fragment older than Jesus. It says God's Messiah will heal, raise the dead and preach to the poor. Sealed in a cave.","Psalms of Solomon 17:21-32":"A Jewish poem from about 50 BC praying for the 'son of David' who will reign. Shows the royal hope was specific and datable.","Josephus, War 6.312-313":"The Jewish historian says an 'ambiguous oracle' in scripture made many expect a world ruler from Judea. A witness from the first century."},"titleLong":"Messianic expectation was alive, specific, and datable before Jesus — 4Q521 and Psalms of Solomon","quran":[],"hadith":["4Q521 (Messianic Apocalypse)","Psalms of Solomon 17:21-32","Josephus, War 6.312-313"],"bible":["Isaiah 61:1-2","Isaiah 35:5-6","Luke 7:18-23","Matthew 11:2-6"]},
{"id":"jeremiah-31-new-covenant","title":"Jeremiah 31 promised a new covenant to Israel","category":"new-covenant","claim":"The phrase 'new covenant' — in Hebrew <i>brit chadashah</i> — is not a Christian invention. It appears in the Hebrew Bible, at Jeremiah 31:31-34. \"Behold, days are coming, declares the LORD, when I will make a new covenant with the house of Israel and the house of Judah — not like the covenant I made with their fathers, which they broke.\" Its content is spelled out: the Torah written on hearts, everyone knowing the LORD directly, and at the climax, 'I will forgive their iniquity, and remember their sin no more.' The promise assumes the covenant at Sinai could be broken, and was. It then announces a covenant built on final forgiveness. The New Testament stakes its whole self-understanding on this text: 'this cup is the new covenant in my blood' (Luke 22:20), argued at length in Hebrews 8-10. Ezekiel 36:25-27 promises something parallel. Whatever you conclude about Jesus, the category belongs to Jeremiah, not to Paul.","tanakh":["Jeremiah 31:31-37","Ezekiel 36:25-27"],"nt":["Luke 22:20","Hebrews 8:6-13"],"rabbinic":["Rashi on Jeremiah 31:30","Radak on Jeremiah 31:30"],"sources":[{"name":"Jeremiah 31 (Sefaria)","type":"primary","url":"https://www.sefaria.org/Jeremiah.31.31"},{"name":"Jeremiah 31 with Rashi (Chabad.org)","type":"rabbinic","url":"https://www.chabad.org/library/bible_cdo/aid/16028/jewish/Chapter-31.htm"},{"name":"Michael Brown, Answering Jewish Objections to Jesus, vol. 2","type":"apologetics","url":"https://askdrbrown.org"},{"name":"Jews for Judaism","type":"rabbinic","url":"https://jewsforjudaism.org"}],"response":"Read the content of the promise, they say. The new covenant is the same Torah — God says 'I will put <i>my Torah</i> within them' — written so deeply inside people that it can no longer be broken. Nothing here abolishes the commandments, replaces Israel, or mentions a mediator who dies. They also note that <i>chadashah</i> can mean renewed, the way the moon is renewed each month. And the timeframe is the messianic age, when 'they shall all know me' — which is plainly not the present world. Then comes their strongest move. The very next verses, Jeremiah 31:35-37, stake God's own reliability on Israel remaining a nation forever. That is the most powerful anti-replacement passage in the Bible, and it sits inside the passage Christians are quoting. If the church reads verses 31 to 34 literally, it must read 35 to 37 the same way.","responseSource":{"name":"Jeremiah 31 with Rashi and Radak, Sefaria","url":"https://www.sefaria.org/Jeremiah.31.31"},"verdict":"unrefuted","rationale":"Graded <b>Strong</b> — no Jewish answer deals with the narrow claim. The Hebrew Bible itself expects a new covenant, grounded in final forgiveness, promised to Israel. Christians did not invent the category — they claim it. But notice what the reply actually defeats. It defeats the overreach: that the Torah was abolished, or that Israel was replaced. Anyone using this entry has to renounce that overreach too, because Jeremiah 31:35-37 is in the same passage and says the opposite. So use it in both directions. It answers the charge that Christians made up a second covenant, and it rebukes any Christian who thinks God is finished with Israel.","severity":"high","rewritten":true,"plain":[{"t":"The objection you'll hear","d":"That Christianity invented a \"new covenant\" to replace the one God made with Israel. It gets said as though a new covenant were obviously a Christian idea, bolted on later to justify a new religion."},{"t":"Whose phrase it actually is","d":"It is Jeremiah's. Jeremiah was a prophet in Jerusalem around 600 BC. He was writing to Jewish people. His book is part of the Hebrew Bible — what Christians call the Old Testament. So the phrase is not an import. It is already there."},{"t":"What the verse says, word for word","d":"Jeremiah 31:31 — <b>\"Behold, the days come, saith the LORD, that I will make a new covenant with the house of Israel, and with the house of Judah.\"</b> He names the two parties out loud: Israel and Judah. Not a replacement people. The same people God had made the first covenant with."},{"t":"And what this new covenant does","d":"Jeremiah 31:33 says God will <b>\"put my law in their inward parts, and write it in their hearts.\"</b> That means obedience from the inside, not rules imposed from outside. Jeremiah 31:34 says everyone will know God directly, <b>\"from the least of them unto the greatest.\"</b> No middlemen. Then the last line, and the biggest one: God will <b>\"remember their sin no more.\"</b> Not sin covered over. Sin forgotten."},{"t":"How strong is this argument?","d":"Strong for the Christian side. There is nothing here for a Jewish friend to dispute, because the words are in their own Bible and they name their own people. The disagreement starts later, over who brought the covenant — not over whether one was promised."},{"t":"Why this helps you","d":"It stops an argument before it starts. Say your friend claims Christians invented a second covenant. You are not defending a Christian idea. You are asking about a promise their own prophet made. He made it in their Scriptures. He made it to their people. The question is no longer whether a new covenant was coming. It is only who brought it."},{"say":true,"t":"What to say","d":"\"Who is Jeremiah's new covenant made with? Read me Jeremiah 31:31.\""}],"refwhy":{"Jeremiah 31:31-37":"Read all seven verses, not the first four. Verses 31 to 34 promise a new covenant. Verses 35 to 37 promise Israel will never cease.","Ezekiel 36:25-27":"A parallel promise: clean water, a new heart, God's spirit within. Same idea, another prophet, also spoken to Israel.","Luke 22:20":"'This cup is the new testament in my blood.' The moment Christianity claims Jeremiah's promise. That is a claim, not evidence.","Hebrews 8:6-13":"Quotes Jeremiah at length and says the first covenant is 'ready to vanish.' This is the overreach the Jewish reply rightly attacks.","Rashi on Jeremiah 31:30":"Hebrew Bibles number this verse 31:30. Rashi reads the promise as the same Torah, finally kept. No new law, and no new people.","Radak on Jeremiah 31:30":"Radak is David Kimhi, a commentator in Provence around 1200. He also reads renewal rather than replacement. Strong for the Jewish side."},"titleLong":"Jeremiah 31: the 'new covenant' is the Tanakh's own promise — made to Israel","quran":[],"hadith":["Rashi on Jeremiah 31:30","Radak on Jeremiah 31:30"],"bible":["Jeremiah 31:31-37","Ezekiel 36:25-27","Luke 22:20","Hebrews 8:6-13"]},
{"id":"yoma-39b-forty-years","title":"The Temple's signs failed for its last forty years","category":"temple-atonement","claim":"The Talmud records this: 'Forty years before the destruction of the Temple, the lot did not come up in the right hand; nor did the crimson-colored strap become white; nor did the westernmost lamp burn; and the doors of the Sanctuary opened by themselves' (Yoma 39b). The crimson thread turning white was the visible sign that the Day of Atonement had been accepted — the image comes from Isaiah 1:18, 'though your sins be as scarlet, they shall be white as snow.' The Temple fell in AD 70. Forty years earlier is about AD 30, the era of the crucifixion. On the Christian reading, the rabbis' own tradition remembers that from roughly the moment Jesus died, the signs of acceptance went dark, and stayed dark until the whole system ended. The same passage treats the failures as a mark of divine displeasure.","tanakh":["Isaiah 1:18","Leviticus 16:7-10","Zechariah 11:1"],"nt":["Matthew 27:50-51","Hebrews 9:11-12"],"rabbinic":["Yoma 39b","Jerusalem Talmud Yoma 6:3"],"sources":[{"name":"Yoma 39b (Sefaria)","type":"primary","url":"https://www.sefaria.org/Yoma.39b"},{"name":"Michael Brown, Answering Jewish Objections to Jesus, vol. 1","type":"apologetics","url":"https://askdrbrown.org"},{"name":"Jacob Neusner, translations and studies of the Talmudic aggadah","type":"scholarly","url":"https://www.brill.com"},{"name":"Outreach Judaism","type":"rabbinic","url":"https://outreachjudaism.org"}],"response":"They answer that this is aggadah — remembered homily, written down centuries after the events. 'Forty years' is the stock biblical and rabbinic number for a generation: the wilderness, Eli, David. The same tractate says the crimson thread had already been failing intermittently generations earlier, after Shimon HaTzaddik. And the rabbis give their own reason for God's favour being withdrawn, plainly and internally: the sins of that era, especially baseless hatred (Yoma 9b) and the corruption of the later priesthood. The passage never mentions the rejection of a messianic claimant. Building date-dependent theology on a symbolic number, against the text's own stated explanation, is exactly the proof-texting Jewish readers recognise in missionary material.","responseSource":{"name":"Yoma 39b on Sefaria","url":"https://www.sefaria.org/Yoma.39b"},"verdict":"admitted","rationale":"Graded <b>Conceded</b>, in the strict sense this section uses. The passage exists, it is Jewish, and it says what it says: the signs of divine acceptance failed for the Temple's last forty years, a span that lands around 30 AD. But carry the honesty with it. This is a suggestive convergence, not a proof. The number is schematic. And the passage supplies its own explanation, which is not the one Christians want. Present it as something striking worth explaining, and let your friend do the explaining.","severity":"medium","rewritten":true,"plain":[{"t":"How the Day of Atonement worked","d":"Once a year the high priest drew lots between two goats. A crimson thread was said to turn white when the sacrifice was accepted. And a lamp in the Temple stayed lit as a sign that God was present. Everyone watched for those three signs."},{"t":"What the Talmud records","d":"A passage called Yoma 39b says that for the <b>forty years before the Temple was destroyed</b>, the signs stopped working. The lot no longer came up in the right hand. The thread stopped turning white. The westernmost lamp went out."},{"t":"Do the arithmetic","d":"Rome destroyed the Temple in AD 70. Forty years before that is AD 30. That is the traditional date of the crucifixion."},{"t":"How strong is this argument?","d":"Very strong, and you never have to argue for it. This is not a Christian source. It is one of Judaism's own central books, describing its own Temple, and nobody disputes that the passage says this."},{"t":"Why this helps you","d":"You do not have to make a case at all. You only have to ask someone to read it and tell you what they think happened in AD 30."},{"say":true,"t":"What to say","d":"\"Would you look up Yoma 39b with me? I'd genuinely like to know how you read it.\""}],"refwhy":{"Isaiah 1:18":"'Though your sins be as scarlet, they shall be as white as snow.' The image behind the crimson thread the Talmud says stopped turning white.","Leviticus 16:7-10":"The Day of Atonement ritual: two goats, and lots drawn between them. Read it first, or the Talmud passage will not make sense.","Zechariah 11:1":"'Open thy doors, O Lebanon.' The Talmud itself quotes this line about the Temple doors that opened by themselves.","Matthew 27:50-51":"The Temple veil torn at the death of Jesus. A Christian source, and the reason the forty-year detail interests Christians at all.","Hebrews 9:11-12":"Argues Christ entered the holy place once, with his own blood. The claim the Talmud passage is being used to support.","Yoma 39b":"The Talmud tractate on the Day of Atonement. It records that for forty years before the Temple fell, the signs of acceptance all failed.","Jerusalem Talmud Yoma 6:3":"The Jerusalem Talmud version of the same memory. A second Jewish record of the forty years, which is why it is worth citing."},"titleLong":"Yoma 39b: the Temple's signs failed for the forty years before the destruction","quran":[],"hadith":["Yoma 39b","Jerusalem Talmud Yoma 6:3"],"bible":["Isaiah 1:18","Leviticus 16:7-10","Zechariah 11:1","Matthew 27:50-51","Hebrews 9:11-12"]},
{"id":"atonement-after-the-temple","title":"Leviticus ties atonement to blood; the altar is gone","category":"temple-atonement","claim":"Leviticus grounds forgiveness in blood offered in place of the sinner: 'the life of the flesh is in the blood, and I have given it to you on the altar to make atonement for your souls' (Leviticus 17:11). The Day of Atonement worked by blood carried into the holy place (Leviticus 16). In AD 70 the altar vanished, and with it the entire system the Torah lays out — for nineteen centuries and counting. Rabbinic Judaism answered with repentance, prayer and charity. The Christian claim is that the timing is not an accident. Within one generation of Jesus's death — which the New Testament presents as the sacrifice the whole system pointed to, and which Isaiah 53:10 calls a guilt offering — God let the shadow end because the substance had come. Hosea 3:4-5 describes the shape of the age: many days without king and without sacrifice, before Israel returns and seeks 'David their king.'","tanakh":["Leviticus 17:11","Leviticus 16:29-34","Isaiah 53:10","Hosea 3:4-5"],"nt":["Hebrews 9:22-28","Matthew 26:28"],"rabbinic":["Mishnah Yoma 8:8-9","Avot deRabbi Natan 4","Berakhot 26b (prayers instituted in place of sacrifices)"],"sources":[{"name":"Avot DeRabbi Natan 4 (Sefaria)","type":"primary","url":"https://www.sefaria.org/Avot_DeRabbi_Natan.4"},{"name":"Mishnah Yoma 8 (Sefaria)","type":"primary","url":"https://www.sefaria.org/Mishnah_Yoma.8.9"},{"name":"Michael Brown, Answering Jewish Objections to Jesus, vol. 2","type":"apologetics","url":"https://askdrbrown.org"},{"name":"Jews for Judaism on atonement without sacrifice","type":"rabbinic","url":"https://jewsforjudaism.org"}],"response":"This answer is substantial, and it is made from the Bible rather than around it. The Hebrew Bible repeatedly shows atonement without blood. A poor Israelite brings a <i>flour</i> sin-offering in Leviticus 5:11-13 — no blood at all — and 'the priest shall make atonement.' Hosea 14:2 prescribes the words of repentant lips instead of bulls. Solomon's dedication prayer in 1 Kings 8:46-50 anticipates forgiveness with no Temple, through repentant prayer. Daniel prayed without a Temple. Nineveh was forgiven for repentance alone in Jonah 3:10. Psalm 51:17 says the sacrifices of God are a broken spirit. And Hosea 6:6 — 'I desire mercy, not sacrifice' — was quoted by Rabbi Yochanan ben Zakkai after the Temple fell, and by Jesus in Matthew 9:13. Leviticus 17:11, they add, is about eating blood, not a monopoly on forgiveness.","responseSource":{"name":"Leviticus 5:11-13 and Hosea 6:6 on Sefaria; Avot de-Rabbi Natan 4","url":"https://www.sefaria.org/Avot_D'Rabbi_Natan.4"},"verdict":"contested","rationale":"Graded <b>Contested</b> — this counter-case is real Bible, not evasion. Flour offerings, Nineveh and Psalm 51 have to be conceded, and the claim that 'Judaism has no answer for sin' is simply false — this site should say so plainly. The genuinely open question is narrower, and worth asking carefully rather than triumphantly. The Torah's own centre of gravity for atonement is Yom Kippur, the altar and the blood. Judaism after 70 AD had to build a system without them. Asking where the Torah authorises that is a fair question. Claiming Judaism has nothing to say is not.","severity":"high","rewritten":true,"plain":[{"t":"What the law of Moses says","d":"Leviticus 17:11 is direct: <b>\"it is the blood that maketh an atonement for the soul.\"</b> Atonement happens through blood placed on an altar. That altar stood in the Temple in Jerusalem, and nowhere else."},{"t":"What happened to the altar","d":"Rome destroyed the Temple in AD 70. It has never been rebuilt. So the one thing Leviticus names as the means of atonement has been gone for nineteen centuries."},{"t":"How Judaism answered","d":"With prayer, repentance and acts of kindness. This is a serious answer, worked out by people facing a catastrophe, and it has carried Judaism for a very long time. Treat it with respect or the conversation is over."},{"t":"The question worth asking once","d":"The Torah names blood on an altar. The rabbinic answer names something else. So: where does the Torah authorise the replacement? Ask it gently, once, and then stop talking."},{"t":"How strong is this argument?","d":"Contested. The question is real and hard. The Jewish answer is not stupid, and treating it as stupid will end the conversation on the spot."},{"say":true,"t":"What to say","d":"\"Leviticus 17:11 grounds atonement in blood on an altar. What grounds it now?\""}],"refwhy":{"Leviticus 17:11":"'It is the blood that maketh an atonement.' The verse this case turns on. Note the Jewish reply: its subject is eating blood.","Leviticus 16:29-34":"The law fixing the Day of Atonement as a yearly statute for ever. Shows how central the altar was, which is what makes the question fair.","Isaiah 53:10":"Calls the servant's life 'an offering for sin.' The one Tanakh text that puts a person where the sacrifice stood.","Hosea 3:4-5":"Israel will go many days 'without a sacrifice,' then seek David their king. A Hebrew Bible text describing an age with no altar.","Hebrews 9:22-28":"'Without shedding of blood is no remission.' The Christian argument stated, and also where it overreaches. Read it carefully before quoting it.","Matthew 26:28":"'My blood of the new testament, shed for many for the remission of sins.' The claim in Jesus's own words.","Mishnah Yoma 8:8-9":"The Mishnah is the oldest rabbinic law code, from about 200 AD. It already teaches that repentance atones. Strong for the Jewish side.","Avot deRabbi Natan 4":"The passage where Yochanan ben Zakkai tells a student that acts of kindness now atone, quoting Hosea 6:6. The Jewish answer at its source.","Berakhot 26b (prayers instituted in place of sacrifices)":"The Talmud says the daily prayers were set up to stand in for the daily sacrifices. The replacement, stated openly by the tradition."},"titleLong":"Leviticus 17:11 and the vanished altar: what grounds atonement since 70 AD?","quran":[],"hadith":["Mishnah Yoma 8:8-9","Avot deRabbi Natan 4","Berakhot 26b (prayers instituted in place of sacrifices)"],"bible":["Leviticus 17:11","Leviticus 16:29-34","Isaiah 53:10","Hosea 3:4-5","Hebrews 9:22-28","Matthew 26:28"]},
{"id":"hosea-blindness-restoration-romans-11","title":"Israel's calling cannot be revoked, Paul wrote","category":"nt-jewishness","claim":"The Hebrew Bible itself describes a pattern for Israel. A long season without king or sacrifice, then a wholehearted return — 'afterward the children of Israel shall return and seek the LORD their God and David their king' (Hosea 3:4-5). A spirit of deep sleep and sealed vision that is later lifted (Isaiah 29:10-14). Scattering and regathering (Deuteronomy 30:1-6). The house of David looking on the pierced one and mourning, with a fountain opened for sin (Zechariah 12:10-13:1). Paul builds Romans 9-11 on exactly that pattern. Israel's present non-recognition of Jesus is 'partial and temporary' (Romans 11:25), and it ends with 'all Israel will be saved' (Romans 11:26). The same chapter gives binding orders to gentile Christians: 'do not boast over the branches' (Romans 11:18). Israel remains 'beloved for the sake of the fathers,' and 'the gifts and the calling of God are irrevocable.' Christian contempt for Jews is not an excess of the system. It is disobedience to the system's own charter.","tanakh":["Hosea 3:4-5","Deuteronomy 30:1-6","Isaiah 29:10-14","Isaiah 59:20-21","Zechariah 12:10-13:1"],"nt":["Romans 11:1-2","Romans 11:17-29","Romans 9:1-5"],"rabbinic":["Sanhedrin 97b-98a (redemption through repentance in the latter days)"],"sources":[{"name":"Romans 11 in context (NETS/NA28 via Bible Gateway)","type":"primary","url":"https://www.biblegateway.com/passage/?search=Romans+11"},{"name":"Nostra Aetate (Vatican II, 1965)","type":"primary","url":"https://www.vatican.va/archive/hist_councils/ii_vatican_council/documents/vat-ii_decl_19651028_nostra-aetate_en.html"},{"name":"Kendall Soulen, The God of Israel and Christian Theology","type":"scholarly","url":"https://www.fortresspress.com"},{"name":"Michael Brown, Our Hands Are Stained with Blood","type":"apologetics","url":"https://askdrbrown.org"}],"response":"This objection is not about interpretation at all. It is historical, and it deserves full weight. Whatever Romans 11 says, nineteen centuries of Christendom said otherwise. Justin Martyr claimed Israel's inheritance for the church. Chrysostom preached against the synagogue. Crusaders massacred the Rhineland communities with Romans 11 sitting in their Bibles. Luther's <i>On the Jews and Their Lies</i> fed directly into the twentieth century. A charter that failed to restrain its own civilisation for most of its history can fairly be judged by its fruit — a test Jesus endorsed in Matthew 7:16. They add that even 'all Israel will be saved' has been read as meaning the church. A Jewish reader may reasonably conclude the text is ambiguous at best, and decoration at worst.","responseSource":{"name":"Nostra Aetate §4 (1965), Holy See","url":"https://www.vatican.va/archive/hist_councils/ii_vatican_council/documents/vat-ii_decl_19651028_nostra-aetate_en.html"},"verdict":"unrefuted","rationale":"Graded <b>Strong</b> at the level of the text. The plain sense of Romans 11 condemns replacement theology and the contempt that grew from it. But the history of its violation is a history of Christians breaking their own scripture, and this entry has to say that in exactly those words. This is the entry that sets the posture for the whole section, and it goes first in any real conversation. In practice: open with confession, not with argument.","severity":"high","rewritten":true,"plain":[{"t":"Before you open any verse","d":"A Christian has to deal with what Christians have done. The Crusades. The blood libel — the lie that Jews murdered Christian children. The expulsions from England and Spain. Luther's writings. Then Christian Europe between 1941 and 1945."},{"t":"The New Testament forbids it","d":"Paul asks in Romans 11:1 whether God has cast away his people. He answers <b>\"God forbid.\"</b> In Romans 11:29 he says God's calling of Israel <b>\"cannot be revoked.\"</b> He describes the blindness as partial, and temporary, and ending."},{"t":"And the warning to Christians","d":"Paul tells non-Jewish believers they are a branch grafted into someone else's tree. Then in Romans 11:18 he warns them directly: <b>\"boast not against the branches.\"</b> The arrogance behind a thousand years of violence is condemned inside the New Testament itself."},{"t":"How strong is this argument?","d":"Strong. There is no honest reading of Romans 11 that supports contempt. Christians who held one were reading against their own book."},{"t":"Why this helps you","d":"Say this first, unprompted, before you open anything else. Your friend has probably spent their whole life waiting for a Christian who says it without being pushed into it."},{"say":true,"t":"What to say","d":"\"I know what the word Christian has meant to Jewish families. I'm not going to pretend otherwise.\""}],"refwhy":{"Hosea 3:4-5":"Many days without king or sacrifice, then a return to 'David their king.' The pattern Paul builds on, taken from the Hebrew Bible.","Deuteronomy 30:1-6":"Scattering, then regathering, then hearts circumcised. The Torah's own promise that the story ends with Israel restored, not replaced.","Isaiah 29:10-14":"A 'spirit of deep sleep' and a sealed book. Paul reads it as partial and passing. Isaiah was speaking first to his own generation.","Isaiah 59:20-21":"'The Redeemer shall come to Zion.' Paul quotes this in Romans 11:26 as his ground for saying all Israel will be saved.","Zechariah 12:10-13:1":"The house of David mourns one pierced, then a fountain opens for sin. The same shape: grief, then cleansing, then restoration.","Romans 11:1-2":"'Hath God cast away his people? God forbid.' The verse that makes replacement theology a misreading of the New Testament, not a development of it.","Romans 11:17-29":"The grafted branch, the order 'boast not,' and 'the gifts and calling of God are without repentance.' The charter Christians broke for centuries.","Romans 9:1-5":"Paul's grief for his own people, with all their standing privileges listed. This is the tone the whole conversation should be held in.","Sanhedrin 97b-98a (redemption through repentance in the latter days)":"Talmud pages debating whether redemption comes by repentance or on a fixed date. Worth reading: Judaism has its own version of this waiting."},"titleLong":"Israel's partial blindness and certain restoration — the frame that forbids contempt","quran":[],"hadith":["Sanhedrin 97b-98a (redemption through repentance in the latter days)"],"bible":["Hosea 3:4-5","Deuteronomy 30:1-6","Isaiah 29:10-14","Isaiah 59:20-21","Zechariah 12:10-13:1","Romans 11:1-2","Romans 11:17-29","Romans 9:1-5"]},
{"id":"nt-jewish-library","title":"Jewish scholars call the New Testament a Jewish book","category":"nt-jewishness","claim":"Every New Testament author except probably Luke was a Jew. Its earliest community was a Torah-keeping Jerusalem congregation of 'many thousands of Jews… all zealous for the law' (Acts 21:20). Matthew builds his Gospel around five great discourses, echoing the five books of Moses, and presents Jesus as the greater Moses who came 'not to abolish the Torah or the Prophets… but to fulfil' (Matthew 5:17). Jesus's arguments — over divorce, Sabbath healing, hand-washing — run along recognised Pharisaic fault lines of his day. Paul calls himself a Pharisee in the present tense, decades after Damascus (Acts 23:6). This is now the mainstream of critical scholarship, and much of it is Jewish work: Geza Vermes's <i>Jesus the Jew</i>, E. P. Sanders, the Jewish Annotated New Testament edited by Amy-Jill Levine and Marc Brettler, and Daniel Boyarin, who argues that even the divine 'Son of Man' Messiah is a Jewish idea before it is a Christian one.","tanakh":["Daniel 7:13-14","Deuteronomy 18:15-19"],"nt":["Matthew 5:17-20","Acts 21:20","Acts 23:6"],"rabbinic":["Mishnah Gittin 9:10 (the Hillel/Shammai divorce dispute behind Matthew 19)","Shabbat 31a"],"sources":[{"name":"The Jewish Annotated New Testament (Levine & Brettler, Oxford)","type":"scholarly","url":"https://global.oup.com/academic/product/the-jewish-annotated-new-testament-9780190461850"},{"name":"Daniel Boyarin, The Jewish Gospels","type":"scholarly","url":"https://thenewpress.com/books/jewish-gospels"},{"name":"E.P. Sanders, Jesus and Judaism","type":"scholarly","url":"https://www.fortresspress.com"},{"name":"Geza Vermes, Jesus the Jew","type":"scholarly","url":"https://www.fortresspress.com"}],"response":"They answer that Jewish authorship does not make a book Jewish — Spinoza was a Jew too. The New Testament as it was finally canonised contains the seeds of the contempt. 'His blood be on us and on our children' in Matthew 27:25. 'You are of your father the devil' in John 8:44. 1 Thessalonians 2:14-16. A Jewish reader does not meet these as arguments inside a Jewish family. They meet them as the proof-texts of pogroms. The parting of the ways was real: whatever the first generation was, the church that carried these texts read them against Jews for eighteen centuries. And theologically, the New Testament's claims — incarnation, and a divine-human mediator who atones — cross lines drawn at Deuteronomy 6:4 and Numbers 23:19 that no amount of first-century context erases.","responseSource":{"name":"Levine & Brettler, The Jewish Annotated New Testament (Oxford)","url":"https://global.oup.com/academic/product/the-jewish-annotated-new-testament-9780190461850"},"verdict":"admitted","rationale":"Conceded. The Jewishness of Jesus and of the New Testament is now the mainstream view in critical scholarship, and Jewish scholars have led much of that work. Cite Geza Vermes, Amy-Jill Levine and Daniel Boyarin rather than Christian apologists — the point only works if the sources have no stake in it. Use this entry to change what the conversation <i>is</i>. You are not asking someone to convert to a gentile religion. You are asking them to consider a first-century Jewish claim about a Jewish figure, made by Jews.","severity":"medium","rewritten":true,"plain":[{"t":"How it usually looks","d":"Many Jewish people meet the New Testament one way. It is the book of the religion that hurt their families. That makes it almost impossible to read as anything else. The reaction is earned."},{"t":"What the documents actually are","d":"Set the history aside for a moment and look at the books themselves. They were written almost entirely by Jews. They argue from the Hebrew Bible. They are about a Jewish teacher. They were written within a few decades, largely for Jewish readers."},{"t":"Who is saying this","d":"Not Christian apologists. Amy-Jill Levine is a Jewish New Testament scholar. She helped edit the Jewish Annotated New Testament. Daniel Boyarin is another Jewish scholar. He argues that a divine, suffering Messiah was already a Jewish idea before Christianity."},{"t":"How strong is this argument?","d":"Very strong. Jewish scholars are saying it, and they have no reason to want the Christian conclusion."},{"t":"Why this helps you","d":"You are not asking anyone to stop being Jewish. The first followers of Jesus kept the feasts and argued from the Hebrew Bible in synagogues. That is a very different request from the one your friend is expecting."},{"say":true,"t":"What to say","d":"\"Have you seen Levine's Jewish Annotated New Testament? I'd be interested what you think of it.\""}],"refwhy":{"Daniel 7:13-14":"The 'son of man' who comes with clouds and is given dominion. Daniel Boyarin, a Jewish Talmud scholar, argues this figure is already divine.","Deuteronomy 18:15-19":"God promises a prophet like Moses. Matthew's five-part structure is built on it. Jewish readers have long taken it of a line of prophets.","Matthew 5:17-20":"'I am not come to destroy the law, but to fulfil.' Read this first if the charge is that Jesus set out to abolish Torah.","Acts 21:20":"'Many thousands of Jews... all zealous of the law.' The earliest church, described by its own book as Torah-keeping.","Acts 23:6":"Paul says 'I am a Pharisee' in the present tense, decades after his conversion. He never describes himself as having left Judaism.","Mishnah Gittin 9:10 (the Hillel/Shammai divorce dispute behind Matthew 19)":"The Mishnah records Hillel and Shammai arguing over grounds for divorce. Jesus is answering that live Jewish debate, not attacking Judaism.","Shabbat 31a":"The Talmud story where Hillel sums up the Torah as 'what is hateful to you, do not do to others.' The same move Jesus makes."},"titleLong":"The New Testament is a Jewish library — and modern Jewish scholarship reads it that way","quran":[],"hadith":["Mishnah Gittin 9:10 (the Hillel/Shammai divorce dispute behind Matthew 19)","Shabbat 31a"],"bible":["Daniel 7:13-14","Deuteronomy 18:15-19","Matthew 5:17-20","Acts 21:20","Acts 23:6"]},
{"id":"avoid-talmud-quote-mining","title":"Those shocking Talmud quotes are mostly invented","category":"rabbinic-objections","claim":"A body of fake and mangled 'Talmud quotes' has been circulating for three centuries. It runs from Eisenmenger in 1700, through August Rohling's <i>Der Talmudjude</i> in 1871 and Pranaitis's <i>The Talmud Unmasked</i> in 1892, to Elizabeth Dilling in 1964 — and now recycles endlessly online. Invented references. Mistranslations. Passages stripped of the context that reverses them, alleging the Talmud blesses deceiving gentiles or blasphemes Jesus and Mary. At the 1913 Beilis blood-libel trial, Pranaitis was destroyed under cross-examination, unable to answer basic questions about the Talmud. The genuine scholarly question about the few disputed 'Yeshu' passages is handled soberly in Peter Schäfer's <i>Jesus in the Talmud</i>: late texts, of contested reference, censored under Christian pressure, telling us about medieval conflict rather than first-century fact. Christians who pass on Talmud memes are laundering antisemitic forgeries into an evangelistic conversation.","tanakh":["Exodus 20:16","Proverbs 19:5"],"nt":["Ephesians 4:25"],"rabbinic":["Peter Schäfer, Jesus in the Talmud (on the disputed Yeshu passages)","Sanhedrin 43a (censored text, contested referent)"],"sources":[{"name":"Peter Schäfer, Jesus in the Talmud (Princeton UP)","type":"scholarly","url":"https://press.princeton.edu/books/paperback/9780691143187/jesus-in-the-talmud"},{"name":"ADL, resources on the Talmud in antisemitic polemics","type":"journalism","url":"https://www.adl.org"},{"name":"Sefaria (read the actual texts in context)","type":"primary","url":"https://www.sefaria.org"}],"response":"There is no steelman for fabrication. Here is the only honest residue. A few genuine Talmudic passages may argue against a figure some manuscripts call Yeshu. Scholars dispute whether that is Jesus of Nazareth at all — the chronological details are off by about a century. At most they show that Jews in late antiquity rejected Christian claims, which everybody already knew. And they were written under persecution by the church. Quoting them as ammunition means citing a wounded community's polemic while ignoring who wounded it.","responseSource":{"name":"Peter Schäfer, Jesus in the Talmud (Princeton)","url":"https://press.princeton.edu/books/paperback/9780691143187/jesus-in-the-talmud"},"verdict":"answered","rationale":"Do not use this, and name the practice when you see it. The commandment against false witness applies to citations. A Christian who forwards a fabricated Talmud quote is bearing false witness against a neighbour, in Christ's name, in a genre with a body count — the Beilis trial, and Nazi reprints of Rohling. If a Talmud passage genuinely matters to your argument, the rule is simple: read it in context on Sefaria first, or do not use it.","severity":"high","avoid":true,"rewritten":true,"plain":[{"t":"What you'll find online","d":"Lists of shocking quotations said to come from the Talmud. They are easy to find and they look damning. Do not use them."},{"t":"Why they fail","d":"Most are made up, mistranslated, or cut away from the words around them. The Talmud is a huge record of debate. It writes down the losing side of an argument next to the winning side. So a quotation can be the exact opposite of the ruling."},{"t":"Where they come from","d":"Most of these lists trace back to the Middle Ages. They were assembled for forced public debates, to justify what was done next. That is the company you keep when you repeat them."},{"t":"The rule","d":"If you cannot read the passage in context on Sefaria, do not use it. That check takes thirty seconds, and your friend can do it faster than you can."},{"say":true,"t":"What to say","d":"If you have used one: \"I repeated something about the Talmud once that turned out to be fake. I stopped doing that.\""}],"refwhy":{"Exodus 20:16":"'Thou shalt not bear false witness against thy neighbour.' This covers citations. A fake Talmud quote breaks a commandment, not just an argument.","Proverbs 19:5":"'A false witness shall not be unpunished.' Blunt, and worth sitting with before you forward anything you have not read in full.","Ephesians 4:25":"'Speak every man truth with his neighbour.' The rule a Christian passing on unchecked quotations has already broken.","Peter Schäfer, Jesus in the Talmud (on the disputed Yeshu passages)":"A Princeton scholar's calm book on the few Talmud passages that may mention Jesus. Where to go if this genuinely matters to you.","Sanhedrin 43a (censored text, contested referent)":"The most quoted of those passages. It was censored under Christian pressure, its dates are a century off, and scholars dispute who it means."},"titleLong":"DON'T USE: 'The Talmud says…' quote-mining and fabricated citations","quran":[],"hadith":["Peter Schäfer, Jesus in the Talmud (on the disputed Yeshu passages)","Sanhedrin 43a (censored text, contested referent)"],"bible":["Exodus 20:16","Proverbs 19:5","Ephesians 4:25"]},
{"id":"avoid-jews-killed-jesus","title":"Why 'the Jews killed Jesus' must never be said","category":"rabbinic-objections","claim":"The deicide charge is false by the New Testament's own account, and historically it is the deadliest sentence in Christian rhetoric. Start with the account. Crucifixion was a Roman penalty, carried out by Roman soldiers on a Roman prefect's verdict. The Jewish participants were a narrow Temple faction, not a people. Peter tells Jews in Jerusalem 'you acted in ignorance, as did your rulers' (Acts 3:17). Acts 4:27-28 names Herod, Pilate, the gentiles <i>and</i> Israel together. Isaiah 53:10 says 'it pleased the LORD to crush him.' And Jesus says 'no one takes my life from me — I lay it down of my own accord' (John 10:18). Now the history. Matthew 27:25, read as a blood-curse, underwrote Holy Week pogroms, expulsions and blood libels for centuries. The Catholic Church formally repudiated it in 1965: Christ's passion 'cannot be charged against all the Jews then alive, nor against the Jews of today.'","tanakh":["Isaiah 53:10","Ezekiel 18:20"],"nt":["Acts 4:27-28","Acts 3:17","John 10:17-18","Luke 23:34"],"rabbinic":["Nostra Aetate 4 (church document repudiating the charge)"],"sources":[{"name":"Nostra Aetate (Vatican II, 1965)","type":"primary","url":"https://www.vatican.va/archive/hist_councils/ii_vatican_council/documents/vat-ii_decl_19651028_nostra-aetate_en.html"},{"name":"USHMM Holocaust Encyclopedia, antisemitism background","type":"journalism","url":"https://encyclopedia.ushmm.org/content/en/article/antisemitism"},{"name":"Jeremy Cohen, Christ Killers: The Jews and the Passion","type":"scholarly","url":"https://global.oup.com"},{"name":"Michael Brown, Our Hands Are Stained with Blood","type":"apologetics","url":"https://askdrbrown.org"}],"response":"There is no counter-argument to put at its strongest here. There is only an observation your Jewish friend will rightly press. The passion narratives themselves supplied the raw material — especially Matthew 27:25, and John's repeated use of 'the Jews.' Christian theology cannot fully hand the problem off to misreaders. A Christian who uses this framing has not merely made a tactical mistake. He has contradicted his own scriptures and stepped into the persecutors' line.","responseSource":{"name":"Nostra Aetate §4 (1965), Holy See","url":"https://www.vatican.va/archive/hist_councils/ii_vatican_council/documents/vat-ii_decl_19651028_nostra-aetate_en.html"},"verdict":"answered","rationale":"Do not use it, ever, in any form — including the softened versions, like 'your ancestors rejected him.' Theologically the Christian confession is that <i>my</i> sin required the cross. Every communion service says so. If the subject comes up, the Christian move is confession: the church's guilt for the deicide charge and everything it harvested. Then, only if invited, the history of who actually ordered the execution.","severity":"high","avoid":true,"rewritten":true,"plain":[{"t":"Why this one is different","d":"Most entries on this list are about losing an argument. This one is not. This is the specific claim that sat underneath a thousand years of killing."},{"t":"What it caused","d":"The Rhineland massacres of 1096. The blood libel invented at Norwich in 1144 and repeated for centuries. Easter pogroms. Expulsions. And a vocabulary that was still in use in the twentieth century."},{"t":"It is also bad reading","d":"A Roman governor ordered the execution and Roman soldiers carried it out. The New Testament spreads the responsibility very differently — and in John 10:18 Jesus says plainly that nobody takes his life from him."},{"t":"The rule","d":"If any version of this phrase is in your vocabulary, take it out. Not softened. Out."},{"say":true,"t":"What to say","d":"Nothing. This is one to never say — not one to say better."}],"refwhy":{"Isaiah 53:10":"'It pleased the LORD to bruise him.' On the Christian account the cross was God's own doing, which leaves no room for a blood charge.","Ezekiel 18:20":"'The son shall not bear the iniquity of the father.' Inherited guilt is ruled out by the Hebrew Bible itself.","Acts 4:27-28":"Names Herod, Pilate, the gentiles and Israel together. All of them did what God's hand had 'determined before.' The blame is shared, and Rome is in it.","Acts 3:17":"Peter tells a Jerusalem crowd 'ye did it in ignorance, as did also your rulers.' The apostle closest to the events refuses the charge.","John 10:17-18":"'No man taketh it from me, but I lay it down of myself.' Jesus denies in advance that anyone took his life.","Luke 23:34":"'Father, forgive them; for they know not what they do.' Spoken from the cross. Whatever else it settles, it rules out revenge.","Nostra Aetate 4 (church document repudiating the charge)":"Not a rabbinic text. It is the 1965 Catholic declaration saying the passion 'cannot be charged against all the Jews' then or now."},"titleLong":"DON'T USE: the 'Jews killed Jesus' framing (deicide)","quran":[],"hadith":["Nostra Aetate 4 (church document repudiating the charge)"],"bible":["Isaiah 53:10","Ezekiel 18:20","Acts 4:27-28","Acts 3:17","John 10:17-18","Luke 23:34"]},
{"id":"avoid-legalism-caricature","title":"Why 'Judaism is all rules' backfires","category":"rabbinic-objections","claim":"The caricature — Judaism as joyless rule-keeping to earn salvation, set against Christian grace — is false on the sources, and it destroys your credibility. Rabbinic Judaism is soaked in grace. Election comes before obligation: 'All Israel has a share in the world to come' (Mishnah Sanhedrin 10:1). The High Holy Day liturgy pleads <i>Avinu Malkeinu</i> — 'be gracious to us and answer us, for we have no deeds.' The Thirteen Attributes of Mercy from Exodus 34:6-7 anchor those days. And <i>chesed</i>, covenant love, is arguably the central divine attribute in the whole Hebrew Bible. E. P. Sanders demolished the caricature academically in 1977, coining the phrase 'covenantal nomism': Jews keep Torah as a response to a gracious God, not as wages earned. The real disagreement is narrower and worth stating precisely. It is not grace versus works. It is the ground of atonement — whether repentance is enough, or whether God has provided a sacrifice.","tanakh":["Exodus 34:6-7","Micah 7:18-19","Deuteronomy 7:7-8"],"nt":["Romans 9:31-10:4 (Paul's actual, narrower argument)"],"rabbinic":["Mishnah Sanhedrin 10:1","Avinu Malkeinu (liturgy)"],"sources":[{"name":"E.P. Sanders, Paul and Palestinian Judaism","type":"scholarly","url":"https://www.fortresspress.com"},{"name":"Mishnah Sanhedrin 10:1 (Sefaria)","type":"primary","url":"https://www.sefaria.org/Mishnah_Sanhedrin.10.1"},{"name":"The Jewish Annotated New Testament (essays on Paul and Judaism)","type":"scholarly","url":"https://global.oup.com/academic/product/the-jewish-annotated-new-testament-9780190461850"}],"response":"The only real pushback runs the other way. Some scholars in the 'new perspective' debate argue that E. P. Sanders overcorrected, and that Second Temple sources do contain strands where merit is weighed — 4 Ezra, for instance. That is true, and irrelevant to the practice this entry bans. Whatever the academic balance turns out to be, telling a Jewish friend her religion is loveless rule-keeping is false about the Judaism she actually lives — her Shabbat table, her liturgy of mercy, her grandmother's kindness. It also identifies the speaker instantly as someone who has never read a page of the prayer book.","responseSource":{"name":"E. P. Sanders, Paul and Palestinian Judaism (Fortress Press)","url":"https://www.fortresspress.com/store/product/9780800618995/Paul-and-Palestinian-Judaism"},"verdict":"answered","rationale":"Do not use it. It fails academically, after Sanders. It fails liturgically — read Avinu Malkeinu, which is a prayer for undeserved mercy. And it fails relationally, because it insults the hearer's own life. It also misreads Paul, whose argument in Romans 9-10 is about Israel and the Messiah, not about Jews lacking grace. Replace it with the honest dividing line this whole section is built on: both traditions believe in grace, and disagree about who the Messiah is.","severity":"medium","avoid":true,"rewritten":true,"plain":[{"t":"What most Christians were taught","d":"That Judaism is about earning God's favour by keeping rules, and that Jesus and Paul replaced that with grace. It is a tidy story. It is also wrong."},{"t":"What scholarship showed","d":"E. P. Sanders took this apart in 1977 and the field moved. Judaism in Jesus's day was a religion of <b>covenant grace with obligations</b>. You are in because God chose you, and you live accordingly. That is closer to the New Testament than the caricature is."},{"t":"Why it costs you","d":"Repeating it tells your Jewish friend you have never actually asked them what they believe. You are arguing with a cartoon, and they can hear it immediately."},{"t":"What to do instead","d":"Ask. You will learn something true, and you will be trusted with the answer."},{"say":true,"t":"What to say","d":"\"What do you actually believe about how a person stands right with God?\""}],"refwhy":{"Exodus 34:6-7":"God describes himself as 'merciful and gracious, longsuffering.' These verses are recited on the High Holy Days. Mercy is the centre, not an add-on.","Micah 7:18-19":"'Who is a God like unto thee, that pardoneth iniquity?' Read at the New Year. The prayer book is full of lines like this one.","Deuteronomy 7:7-8":"God says he chose Israel not for its size or merit, but because he loved them. Election comes before obligation, in the Torah itself.","Romans 9:31-10:4 (Paul's actual, narrower argument)":"Paul's actual argument is about Israel and the Messiah. He never says Jews lacked grace. The caricature misreads him as well.","Mishnah Sanhedrin 10:1":"'All Israel has a share in the world to come.' The rabbis' own starting point is that you are in already. That is not works-righteousness.","Avinu Malkeinu (liturgy)":"The High Holy Day prayer that pleads 'be gracious to us, for we have no deeds.' Read it once and the caricature dies."},"titleLong":"DON'T USE: 'Judaism is legalistic works-righteousness'","quran":[],"hadith":["Mishnah Sanhedrin 10:1","Avinu Malkeinu (liturgy)"],"bible":["Exodus 34:6-7","Micah 7:18-19","Deuteronomy 7:7-8","Romans 9:31-10:4 (Paul's actual, narrower argument)"]},
{"id":"avoid-gematria-bible-codes","title":"Why Bible codes also work on Moby-Dick","category":"rabbinic-objections","claim":"Arguments from letter-skipping codes, gematria sums and Torah-code 'discoveries' should be banned from this case entirely. The flagship academic claim was published by Witztum, Rips and Rosenberg in <i>Statistical Science</i> in 1994. It was formally answered in the same journal in 1999 by McKay, Bar-Natan, Bar-Hillel and Kalai, who showed the result was 'fatally defective' — an artifact of flexible data selection. Answering a challenge from the journalist Michael Drosnin, McKay then 'found' the Rabin assassination and other encoded prophecies in <i>Moby-Dick</i>. The method proves anything, and therefore nothing. Given enough freedom in spelling, skip distance and name choice, any long text yields any message. Christian use of codes borrows the least defensible fringe of Jewish mysticism to prop up a case that — as the rest of this section shows — stands perfectly well on the plain text, the Targums and the Talmud read in context.","tanakh":["Deuteronomy 29:29","Isaiah 8:19-20"],"nt":["Luke 24:27 (Jesus argues from the plain scriptures, 'in all the scriptures')","Acts 17:2-3 ('reasoned from the scriptures')"],"rabbinic":["Witztum-Rips-Rosenberg, Statistical Science 1994 (the original ELS claim)"],"sources":[{"name":"McKay et al., 'Solving the Bible Code Puzzle,' Statistical Science 14.2 (1999)","type":"scholarly","url":"https://projecteuclid.org/journals/statistical-science/volume-14/issue-2/Solving-the-Bible-Code-Puzzle/10.1214/ss/1009212243.full"},{"name":"Brendan McKay's Torah codes refutation pages (incl. Moby-Dick 'codes')","type":"scholarly","url":"https://users.cecs.anu.edu.au/~bdm/dilugim/torah.html"},{"name":"Semantic Scholar record of the debate","type":"scholarly","url":"https://www.semanticscholar.org/paper/Solving-the-Bible-Code-Puzzle-McKay-Bar-Natan/a3a98b44e77d6d2aed61d390530094e25a9fe121"}],"response":"Defenders — Witztum's replies, and the Meru Foundation — argue that Brendan McKay's counter-experiments used looser rules than the original study, and that some equidistant-letter phenomena survive scrutiny. But the methodological point is conceded even by sympathetic statisticians. The results are extremely sensitive to the choices the researcher makes, they cannot be falsified in practice, and the same effects reproduce in ordinary secular books. No rabbinic authority rests doctrine on codes. Classical gematria, as in the Baal HaTurim, is homiletic ornament and never proof — a distinction the tradition itself is careful about.","responseSource":{"name":"McKay, Bar-Natan, Bar-Hillel & Kalai, \"Solving the Bible Code Puzzle\", Statistical Science 14:2 (1999)","url":"https://projecteuclid.org/journals/statistical-science/volume-14/issue-2/Solving-the-Bible-Code-Puzzle/10.1214/ss/1009212243.full"},"verdict":"answered","rationale":"Do not use it. Codes and gematria invert this section's entire method. The Messiah case rests on the plain sense of public texts — the same verses the Targums and the Talmud discuss — read the way Jesus himself argued on the Emmaus road, 'from Moses and all the prophets' in Luke 24:27. A hidden-message argument concedes that the plain text is not enough. It also cannot be checked, which is the one thing every argument on this site is supposed to be.","severity":"low","avoid":true,"rewritten":true,"plain":[{"t":"What these are","d":"Gematria gives Hebrew letters number values and adds them up. Bible codes claim that skipping letters at fixed intervals spells out hidden messages. Both get used in Christian outreach as if they were evidence."},{"t":"Why they fail","d":"Researchers ran the same methods on <i>Moby-Dick</i> and <i>War and Peace</i>. They produced equally striking \"predictions,\" including assassinations. Any long book will do this, because the method finds patterns instead of testing them."},{"t":"What it signals","d":"Using them tells a thoughtful person that you cannot tell a pattern from a proof. Every real argument you make afterwards gets quietly discounted."},{"t":"The rule","d":"Drop them. The case from Isaiah 53, Daniel 9 and Yoma 39b does not need help from number games, and is weakened by standing next to them."},{"say":true,"t":"What to say","d":"\"I don't use the Bible-codes material. I don't think it holds up, and it isn't needed.\""}],"refwhy":{"Deuteronomy 29:29":"'The secret things belong unto the LORD; but those which are revealed belong unto us.' The Torah's own line against hunting hidden messages.","Isaiah 8:19-20":"Sends people to 'the law and to the testimony' rather than to those who 'peep and mutter.' The test is the plain public text.","Luke 24:27 (Jesus argues from the plain scriptures, 'in all the scriptures')":"Jesus explains himself from Moses and the prophets on the Emmaus road. No codes. This is the model the section follows.","Acts 17:2-3 ('reasoned from the scriptures')":"Paul argues in the synagogue by reasoning from open texts. What the earliest Christian case actually looked like.","Witztum-Rips-Rosenberg, Statistical Science 1994 (the original ELS claim)":"The 1994 paper that started the Bible-code craze. The same journal published its refutation in 1999. Cite both or neither."},"titleLong":"DON'T USE: gematria proofs and Bible codes","quran":[],"hadith":["Witztum-Rips-Rosenberg, Statistical Science 1994 (the original ELS claim)"],"bible":["Deuteronomy 29:29","Isaiah 8:19-20","Luke 24:27 (Jesus argues from the plain scriptures, 'in all the scriptures')","Acts 17:2-3 ('reasoned from the scriptures')"]}

const WHYMAP={"suffering-servant":"Isaiah 53 is the chapter this conversation usually lands on. Getting it right — including what Jewish sources themselves said about it before the argument started — is what separates a real conversation from a shouting match. **Therefore:** make the argument out of their library, not yours, and it cannot be waved away as a Christian reading.","messianic-prophecy":"Any single prophecy can be argued about. What asks to be explained is the whole picture together: a specific portrait, written centuries early, in books your friend already accepts as Scripture. **Therefore:** take one text at a time and let them add up, rather than firing twelve at once.","daniel-timeline":"Every other prophecy can be slid around in history. This one cannot — it has an order of events, and the last one already happened in AD 70. **Therefore:** this is the one place where you can point at a date instead of arguing about a word.","temple-atonement":"The law of Moses grounds forgiveness in blood on an altar. That altar has been gone for nineteen centuries. **Therefore:** the question is not whether Judaism has an answer — it does — but whether the Torah itself authorises that answer.","new-covenant":"If your friend believes Christians invented a second covenant to justify a new religion, nothing else you say will get a hearing. Jeremiah closes that door from inside the Hebrew Bible. **Therefore:** the disagreement is no longer whether a new covenant was promised — only who brought it.","rabbinic-objections":"These are serious arguments made by prepared people, and answering the weak version of them convinces nobody. **Therefore:** learn their strongest form, drop the Christian arguments that fail, and you will be one of the very few Christians worth talking to.","nt-jewishness":"The biggest obstacle here is not an argument. It is a history — what the word Christian has meant to Jewish families for a thousand years. **Therefore:** name that history yourself, unprompted, before you open a single verse. Nothing lands until you do."};
const TALK={"suffering-servant":"Never open with *“read Isaiah 53.”* They have read it, and they have an answer. Open with the history instead: **“Did you know the Targum on this chapter calls the servant the Messiah?”** Then Sukkah 52a. You are not telling them what their book says — you are asking about their own tradition, and that is a completely different conversation.","messianic-prophecy":"Never stack twelve prophecies in a row; it reads as a sales pitch and each one invites a rebuttal. Take **one** — Micah 5:2 or Zechariah 12:10 — and ask, *“How do you read this one?”* Then genuinely listen. The cumulative case only works if each piece was actually examined.","daniel-timeline":"This is the one prophecy with a deadline, so let the deadline do the work: **“Daniel says an anointed one is cut off before the city and sanctuary are destroyed. The Temple fell in 70. Who was that?”** Don't argue about the exact arithmetic of the weeks — the terminus is the argument.","temple-atonement":"Ask it as a real question, because it is one: **“Leviticus 17:11 says atonement is by blood on the altar. There has been no altar since 70 — what grounds atonement now?”** The answers are prayer, repentance and good deeds. Then, gently: *where does the Torah say that?* Ask once and stop.","new-covenant":"The word 'new covenant' is not a Christian import — it is Jeremiah's. **“Who is the new covenant of Jeremiah 31 made with?”** Read the verse: with the house of Israel and the house of Judah. That single verse dissolves the 'you made up a new religion' frame before it forms.","rabbinic-objections":"Counter-missionary arguments are serious, prepared, and often better than what you have. Say so: **“That's a real argument — let me think about it.”** Then answer the strongest form of it or admit you can't yet. Bluffing here is fatal; they have heard every bluff.","nt-jewishness":"Before any text, name the history: **“I know what the word Christian has meant to Jewish families — the Crusades, the expulsions, Luther, and then Europe in 1941.”** Say it unprompted. Then Romans 11:1: *“has God cast away his people? God forbid.”* Nothing else you say will be heard until that is on the table."};
const DIALOG={"suffering-servant":[{"w":"them","t":"Isaiah 53 is our chapter, and you're reading it out of context. Go back to Isaiah 41: 'You, Israel, my servant.' The servant is named Israel again and again — 44, 45, 48, 49. Chapter 53 is the kings of the nations, stunned in the last days, confessing what they did to the Jewish people in exile. Rashi, Ibn Ezra, Radak — that's the Jewish reading."},{"w":"you","t":"You're right that the servant is named Israel in those passages — I won't pretend otherwise. But inside the Servant Songs the servant also has a mission TO Israel: 49:5-6 says he's formed from the womb to bring Jacob back and raise up the tribes. Can Israel restore Israel? And in 53:8 the speaker says he was stricken 'for the transgression of my people' — if the speakers are the nations' kings, since when do Gentile kings call Israel 'my people'?"},{"w":"them","t":"The righteous remnant suffers for the guilty nation — a servant within the servant. And be honest about your history: the national reading became standard partly because Christians turned this chapter into a weapon. Rashi wrote while Crusaders were butchering the communities of the Rhineland."},{"w":"you","t":"Then let me say it before you have to: Christians quoted Isaiah while killing Jews, and Rashi's move was partly self-defense — I believe that, and the shame of it belongs to my house. But the messianic reading is older than the church's crimes. Targum Jonathan opens the passage 'Behold, my servant the Messiah.' Sanhedrin 98b derives Messiah's name from 53:4. That reading is Jewish property; the crimes don't erase it."},{"w":"them","t":"The Targum gives the Messiah the victory and leaves the suffering to Israel — it's not your crucified Messiah. And 53:10 says the servant will 'see offspring and prolong days.' Your Jesus died childless at thirty-three. The verse disqualifies him on its face."},{"w":"you","t":"The Targum reroutes the pain, yes — which itself tells you the plain text made messianic readers flinch. Now stay in 53:10: the same verse says his soul is made an asham — a guilt offering — and THEN he sees offspring and prolongs days. A guilt offering dies; that's what an asham is. A figure whose life is a completed guilt offering and who afterward prolongs his days is either a contradiction — or a resurrection. Read the chapter cold with me, no commentaries on either side, and tell me who you see."}],"messianic-prophecy":[{"w":"them","t":"The Tanakh gives a checklist. Messiah rebuilds the Temple (Ezekiel 37), gathers the exiles (Isaiah 43), brings world peace (Isaiah 2:4 — swords into plowshares), and fills the earth with the knowledge of God (Isaiah 11:9). Jesus went zero for four. That's not interpretation; that's arithmetic."},{"w":"you","t":"I affirm every item on that list — it's the reigning-king portrait and it stands. But the same prophets drew a second portrait: a king who arrives 'lowly, riding on a donkey' (Zech 9:9), one who is pierced and mourned like an only son (Zech 12:10), a servant despised, rejected, cut off from the land of the living (Isa 53). Your own tradition felt the collision so hard it split the Messiah in two — ben Joseph, who dies, before ben David, who reigns."},{"w":"them","t":"Ben Joseph is late aggadah, not Torah — a minor figure to absorb a few awkward verses. And 'he'll do the rest at a second coming' is an unfalsifiable IOU. Anyone who failed can promise a round two."},{"w":"you","t":"It would be unfalsifiable — except round one is checkable. A ruler from Bethlehem of Judah 'whose origins are from of old' (Micah 5:2). The donkey-king hailed in Jerusalem (Zech 9:9). And a timestamp: Daniel 9:26's anointed one cut off before the city and sanctuary are destroyed — before 70 CE. The IOU has a date and a signature. A deferred second act only matters because the first act happened on schedule."},{"w":"them","t":"Every one of those is contested and you know it. Bethlehem Ephrathah may name the clan, not the birthplace; Zechariah's pierced one may be a fallen warrior in the Gog war; Daniel's anointed one is Agrippa or the priesthood in our commentators, Onias or Antiochus-era figures in the academy."},{"w":"you","t":"Contested — conceded, every one, and I won't sell you certainty I don't have. So my only ask is this: don't take my reading or Rashi's on authority. They're your books. Put the two portraits side by side — the pierced one and the enthroned one — and ask which figure in history has any serious claim on the first portrait while the whole world, yours and mine, still waits on the second. That's the question; the rest is commentary."}],"daniel-timeline":[{"w":"them","t":"Daniel 9? The Talmud itself says 'blasted be the bones of those who calculate the end' (Sanhedrin 97b). Generations of date-setters wrecked communities with that chapter. And our commentators read the 'anointed one cut off' as Agrippa, or the anointed priesthood ending at the destruction — not your Messiah."},{"w":"you","t":"I'm not calculating an end — that curse can stand. I'm reading a boundary the text already drew: 9:26 says an anointed one is cut off, and AFTER that, 'the people of the prince who is to come shall destroy the city and the sanctuary.' Whatever the seventy weeks mean precisely, that verse puts a mashiach dying before 70 CE. Not my math — Daniel's sequence."},{"w":"them","t":"Mashiach there just means 'an anointed one' — every king and high priest was anointed. The academy reads the chapter around Onias III and the Antiochus crisis. You're capitalizing a common noun and calling it Jesus."},{"w":"you","t":"Granted — 'anointed' is a broad word, and I'll hold the identification loosely. But set that verse next to your own tradition's memory. Yoma 39b: for the last forty years before the destruction, the lot for the LORD stopped coming up in the right hand and the crimson thread stopped turning white. Count back from 70. On the Talmud's own telling, Yom Kippur's signs went dark starting around 30 CE."},{"w":"them","t":"Aggadah is not a lab report. The same page says the Temple doors swung open by themselves. You can't dismiss the Oral Torah all year and then wave one folio as forensic evidence when it points your way."},{"w":"you","t":"That's a fair hit, and I'll take it: not proof — your tradition's own memory that something changed in that generation, held loosely. But now stack the loose pieces. Daniel: an anointed one cut off before the destruction. Genesis 49:10: the scepter stays with Judah 'until Shiloh comes' — which Targum Onkelos renders 'until the Messiah comes, to whom the kingdom belongs.' Yoma 39b: forty dark years from about 30 CE. If the window the texts draw is behind us, then the honest question stops being whether Messiah came. It becomes: who came?"}],"temple-atonement":[{"w":"them","t":"This 'no temple, no atonement' argument misreads us completely. Hosea 14: 'Take words with you and return to the LORD... we will offer the bulls of our lips.' When the Temple fell, Rabban Yohanan ben Zakkai stood in the ruins and said we have an atonement as effective: deeds of lovingkindness. Teshuvah, tefillah, tzedakah. We never needed blood the way you need us to have needed it."},{"w":"you","t":"Ben Zakkai's answer was pastoral genius in a catastrophe, and I honor it — Yavneh saved your people's ability to survive the ruins. But notice what it is: an answer the Torah itself is never recorded giving. Leviticus 17:11 is God's own stated mechanism — 'the life of the flesh is in the blood, and I have given it to you on the altar to make atonement for your souls.' Where does the Torah say that mechanism was provisional, waiting to be swapped out?"},{"w":"them","t":"The prophets say it constantly. 'I desire mercy, not sacrifice' (Hosea 6:6). 'You do not delight in sacrifice... the sacrifices of God are a broken and contrite heart' (Psalm 51). Samuel: obedience is better than sacrifice. God always wanted the heart. The altar was scaffolding."},{"w":"you","t":"Read Psalm 51 one verse further: 'THEN you will delight in right sacrifices, and bulls will be offered on your altar.' David's broken heart doesn't replace the offering — it makes the offering honest. The prophets attack sacrifice without repentance; not one of them repeals Yom Kippur. And if repentance alone had always sufficed, the Day of Atonement was redundant the day it was given."},{"w":"them","t":"So your alternative is what — human sacrifice? The Torah calls that an abomination; we don't even eat blood, let alone atone by a man's execution. Nothing could be less Jewish than what you're proposing."},{"w":"you","t":"The Torah abominates a life SEIZED — Molech's fire, a victim with no say. Isaiah 53:10 describes the opposite: a servant whose own soul is set as an asham, a guilt offering, who 'poured out his soul to death' willingly and 'bore the sin of many.' Offered, not taken. Your calendar still aches once a year for atonement it has no altar to carry. My claim is that inside the window Daniel drew, that ache was answered — one final Yom Kippur — which is exactly why Jeremiah's new covenant can end, 'I will remember their sin no more.'"}],"new-covenant":[{"w":"them","t":"Read all of Jeremiah 31, not just your verse. The new covenant is with 'the house of Israel and the house of Judah' — not a church. It's Torah written on hearts — the same Torah, kept at last, not replaced. And it describes a world where no one needs to say 'know the LORD' because everyone knows him. Look out the window. Has your covenant produced that world?"},{"w":"you","t":"I agree with nearly all of that — including the indictment at the end. It names Israel and Judah first, and it's Torah internalized, not Torah abolished; any Christian reading that erases Israel from Israel's own promise has failed before it starts. Where we part: 31:32 says this covenant is 'NOT like the covenant I made with their fathers... my covenant which they broke.' Not-like means new in kind — not Sinai refreshed."},{"w":"them","t":"New in kind how? Show me the mediator in the chapter. Show me a dying Messiah, a cross, a Eucharist. They're not there. You're importing your ending into our book and calling it exegesis."},{"w":"you","t":"The chapter itself ends on the hinge: 'I will forgive their iniquity, and their sin I will remember no more' (31:34). Forgiveness that final carries a mechanism question — the same Leviticus 17:11 question we keep circling. And covenants in the Tanakh are cut in blood; Sinai's was — 'behold the blood of the covenant' (Exodus 24:8). So when a Jewish teacher at a Passover table lifts the cup and says 'this is the blood of the new covenant,' he's quoting Jeremiah and Exodus in one breath — to Jews, about the covenant promised to Jews. That's not an import; that's an address."},{"w":"them","t":"And twenty centuries later the earth is still not full of the knowledge of the LORD. So at best you're holding a deposit slip and calling it the deposit. Why should I accept a covenant that visibly hasn't done what its own text promises?"},{"w":"you","t":"'Deposit' is exactly the word I'd choose — the forgiveness now, the universal knowledge when the King finishes the reigning portrait. You're waiting for both acts to arrive together; I'm claiming the first is behind us and staking everything on the second. That's the entire disagreement — and notice where we're having it: inside Jeremiah, verse by verse. That's the only place I want to have it."}],"rabbinic-objections":[{"w":"them","t":"Before you quote a single verse, be honest about what you're asking me. The last time the church wanted Jewish souls it came with disputations we were forced to attend and stakes for the losers. My grandmother's town in Poland had a church at one end and a pit at the other. And now you'd like to study Tanakh with me?"},{"w":"you","t":"Then let me say it before you have to, and without softening: the Rhineland massacres of 1096 were carried out under a cross. The blood libel was invented in Christian England. Spain expelled your people in 1492 with clergy applauding. Luther's 1543 tract reads like a pogrom manual and the Nazis reprinted it. The Holocaust grew in baptized Europe's soil. I don't ask you to forget or forgive any of it on my schedule. I ask a different question: is Yeshua of Nazareth — a Torah-keeping Jew who never met Christendom — guilty of what was done wearing his name?"},{"w":"them","t":"'By their fruits you will know them' — your own teacher's test. Twenty centuries of this fruit. At some point the tree is answerable."},{"w":"you","t":"And the same teacher said many will cry 'Lord, Lord' and hear 'I never knew you; depart from me, you workers of lawlessness.' I won't defend Christendom, and I'm not recruiting you into its history. The claim I care about predates every crime you named: a first-century claim made by Jews, to Jews, from your scriptures, in your land, before there was a Christendom to sin. Judge that claim by Moses and the Prophets — the very test your tradition would demand."},{"w":"them","t":"Even granting all that — Maimonides ruled a Jew must die rather than worship a man. This is not a book-club disagreement for me. It's avodah zarah, the one line with no exceptions, the line my ancestors died rather than cross."},{"w":"you","t":"I respect that line more than you might expect — the Shema is not negotiable, and if Yeshua is merely a man, then Rambam is right and I'm the idolater; I accept those stakes. Which means the real question between us can't be settled by my church or your posek — only in the text we share. Zechariah 12:10, YHWH speaking: 'they will look on ME, whom they have pierced, and mourn for him as one mourns an only son.' Start there with me. Not with my history, and not with my institutions — with your prophet."}],"nt-jewishness":[{"w":"them","t":"The New Testament is a Greek book written for Gentiles that curses my people. 'His blood be on us and on our children' — that one sentence armed a thousand pogroms. Don't stand there and tell me it's a Jewish book."},{"w":"you","t":"That verse was wielded exactly as you say, for centuries, and the church that wielded it will answer to God for every pogrom it blessed — I won't dilute that. But open Matthew cold. It begins 'the book of the toledot of Yeshua the Messiah, son of David, son of Abraham' — a genealogy formula straight out of Genesis. Nearly every author is a Jew. And every fight inside it is an intra-Jewish fight — Sabbath halakhah, purity, temple, resurrection — Pharisee-Sadducee territory, not Greek philosophy."},{"w":"them","t":"The gospels, maybe. Paul is the problem. He abolished the Torah, invented a religion for Gentiles that Jesus of Nazareth never taught, and you people dress it back up in a tallit and market it to us as Judaism."},{"w":"you","t":"The same Paul wrote 'Has God rejected his people? By no means! I myself am an Israelite' (Romans 11:1), warned Gentiles never to boast over the branches, took a vow and paid for temple sacrifices in Acts 21, and circumcised Timothy. The Gentile question was settled at a Jerusalem council (Acts 15) that reasoned from Amos 9 like a beit din: the nations come in AS nations — which is Isaiah's own vision of Gentiles streaming to Israel's God. That's Jewish universalism doing what the prophets said it would, not a new religion."},{"w":"them","t":"Then explain the churches. If the book is so Jewish, why has every church I've ever walked past scrubbed the Torah, forgotten Israel, and hung up a blond Jesus? Two thousand years of readers didn't notice what you claim is on every page?"},{"w":"you","t":"They didn't notice — and that amnesia is close to the church's original sin. Romans 11 warned the very first Gentile generation against it, and they did it anyway, and my tradition is still repenting of it. Which is why my invitation runs opposite to the old one. Not 'leave your people and enter my church' — but read Matthew with me as what it actually is, a Jewish book making a Jewish claim, and hold me accountable to your text every single time my religion forgot it."}]};
const ABBR=["c","cf","vs","e.g","i.e","etc","Dr","St","Mr","Mrs","ch","pp","v","vv","no","approx","Jr","Sr"];
function splitSentences(raw){
  const tokens=raw.split(/(?<=[.!?])\s+(?=[A-Z0-9"'(‘“])/);
  const merged=[];
  tokens.forEach(t=>{
    if(merged.length){
      const prev=merged[merged.length-1];
      const m=prev.match(/([A-Za-z&.]+)\.$/);
      const w=m?m[1].replace(/\./g,""):null;
      if(w&&ABBR.includes(w)){merged[merged.length-1]=prev+" "+t;return;}
    }
    merged.push(t);
  });
  return merged;
}
