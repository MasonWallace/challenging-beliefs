he earth."}]},"Isaiah 42:24-25":{"ref":"Isaiah 42","verses":[{"v":24,"t":"Who gave Jacob for a spoil, and Israel to the robbers? did not the LORD, he against whom we have sinned? for they would not walk in his ways, neither were they obedient unto his law."},{"v":25,"t":"Therefore he hath poured upon him the fury of his anger, and the strength of battle: and it hath set him on fire round about, yet he knew not; and it burned him, yet he laid it not to heart."}]},"Jeremiah 31:35-37":{"ref":"Jeremiah 31","verses":[{"v":35,"t":"Thus saith the LORD, which giveth the sun for a light by day, and the ordinances of the moon and of the stars for a light by night, which divideth the sea when the waves thereof roar; The LORD of hosts is his name:"},{"v":36,"t":"If those ordinances depart from before me, saith the LORD, then the seed of Israel also shall cease from being a nation before me for ever."},{"v":37,"t":"Thus saith the LORD; If heaven above can be measured, and the foundations of the earth searched out beneath, I will also cast off all the seed of Israel for all that they have done, saith the LORD."}]},"Luke 22:37":{"ref":"Luke 22","verses":[{"v":37,"t":"For I say unto you, that this that is written must yet be accomplished in me, And he was reckoned among the transgressors: for the things concerning me have an end."}]},"Romans 4:25":{"ref":"Romans 4","verses":[{"v":25,"t":"Who was delivered for our offences, and was raised again for our justification."}]},"1 Peter 2:22-25":{"ref":"1 Peter 2","verses":[{"v":22,"t":"Who did no sin, neither was guile found in his mouth:"},{"v":23,"t":"Who, when he was reviled, reviled not again; when he suffered, he threatened not; but committed himself to him that judgeth righteously:"},{"v":24,"t":"Who his own self bare our sins in his own body on the tree, that we, being dead to sins, should live unto righteousness: by whose stripes ye were healed."},{"v":25,"t":"For ye were as sheep going astray; but are now returned unto the Shepherd and Bishop of your souls."}]},"Zechariah 12:10-12":{"ref":"Zechariah 12","verses":[{"v":10,"t":"And I will pour upon the house of David, and upon the inhabitants of Jerusalem, the spirit of grace and of supplications: and they shall look upon me whom they have pierced, and they shall mourn for him, as one mourneth for his only son, and shall be in bitterness for him, as one that is in bitterness for his firstborn."},{"v":11,"t":"In that day shall there be a great mourning in Jerusalem, as the mourning of Hadadrimmon in the valley of Megiddon."},{"v":12,"t":"And the land shall mourn, every family apart; the family of the house of David apart, and their wives apart; the family of the house of Nathan apart, and their wives apart;"}]},"Isaiah 53:12":{"ref":"Isaiah 53","verses":[{"v":12,"t":"Therefore will I divide him a portion with the great, and he shall divide the spoil with the strong; because he hath poured out his soul unto death: and he was numbered with the transgressors; and he bare the sin of many, and made intercession for the transgressors."}]},"Isaiah 9:6-7":{"ref":"Isaiah 9","verses":[{"v":6,"t":"For unto us a child is born, unto us a son is given: and the government shall be upon his shoulder: and his name shall be called Wonderful, Counsellor, The mighty God, The everlasting Father, The Prince of Peace."},{"v":7,"t":"Of the increase of his government and peace there shall be no end, upon the throne of David, and upon his kingdom, to order it, and to establish it with judgment and with justice from henceforth even for ever. The zeal of the LORD of hosts will perform this."}]},"Daniel 7:13-14":{"ref":"Daniel 7","verses":[{"v":13,"t":"I saw in the night visions, and, behold, one like the Son of man came with the clouds of heaven, and came to the Ancient of days, and they brought him near before him."},{"v":14,"t":"And there was given him dominion, and glory, and a kingdom, that all people, nations, and languages, should serve him: his dominion is an everlasting dominion, which shall not pass away, and his kingdom that which shall not be destroyed."}]},"Zechariah 9:9":{"ref":"Zechariah 9","verses":[{"v":9,"t":"Rejoice greatly, O daughter of Zion; shout, O daughter of Jerusalem: behold, thy King cometh unto thee: he is just, and having salvation; lowly, and riding upon an ass, and upon a colt the foal of an ass."}]},"Luke 24:25-27":{"ref":"Luke 24","verses":[{"v":25,"t":"Then he said unto them, O fools, and slow of heart to believe all that the prophets have spoken:"},{"v":26,"t":"Ought not Christ to have suffered these things, and to enter into his glory?"},{"v":27,"t":"And beginning at Moses and all the prophets, he expounded unto them in all the scriptures the things concerning himself."}]},"Hebrews 9:28":{"ref":"Hebrews 9","verses":[{"v":28,"t":"So Christ was once offered to bear the sins of many; and unto them that look for him shall he appear the second time without sin unto salvation."}]},"Acts 3:19-21":{"ref":"Acts 3","verses":[{"v":19,"t":"Repent ye therefore, and be converted, that your sins may be blotted out, when the times of refreshing shall come from the presence of the Lord;"},{"v":20,"t":"And he shall send Jesus Christ, which before was preached unto you:"},{"v":21,"t":"Whom the heaven must receive until the times of restitution of all things, which God hath spoken by the mouth of all his holy prophets since the world began."}]},"John 19:37":{"ref":"John 19","verses":[{"v":37,"t":"And again another scripture saith, They shall look on him whom they pierced."}]},"Daniel 9:24-27":{"ref":"Daniel 9","verses":[{"v":24,"t":"Seventy weeks are determined upon thy people and upon thy holy city, to finish the transgression, and to make an end of sins, and to make reconciliation for iniquity, and to bring in everlasting righteousness, and to seal up the vision and prophecy, and to anoint the most Holy."},{"v":25,"t":"Know therefore and understand, that from the going forth of the commandment to restore and to build Jerusalem unto the Messiah the Prince shall be seven weeks, and threescore and two weeks: the street shall be built again, and the wall, even in troublous times."},{"v":26,"t":"And after threescore and two weeks shall Messiah be cut off, but not for himself: and the people of the prince that shall come shall destroy the city and the sanctuary; and the end thereof shall be with a flood, and unto the end of the war desolations are determined."},{"v":27,"t":"And he shall confirm the covenant with many for one week: and in the midst of the week he shall cause the sacrifice and the oblation to cease, and for the overspreading of abominations he shall make it desolate, even until the consummation, and that determined shall be poured upon the desolate."}]},"Daniel 9:26":{"ref":"Daniel 9","verses":[{"v":26,"t":"And after threescore and two weeks shall Messiah be cut off, but not for himself: and the people of the prince that shall come shall destroy the city and the sanctuary; and the end thereof shall be with a flood, and unto the end of the war desolations are determined."}]},"Luke 19:41-44":{"ref":"Luke 19","verses":[{"v":41,"t":"And when he was come near, he beheld the city, and wept over it,"},{"v":42,"t":"Saying, If thou hadst known, even thou, at least in this thy day, the things which belong unto thy peace! but now they are hid from thine eyes."},{"v":43,"t":"For the days shall come upon thee, that thine enemies shall cast a trench about thee, and compass thee round, and keep thee in on every side,"},{"v":44,"t":"And shall lay thee even with the ground, and thy children within thee; and they shall not leave in thee one stone upon another; because thou knewest not the time of thy visitation."}]},"Matthew 24:1-2":{"ref":"Matthew 24","verses":[{"v":1,"t":"And Jesus went out, and departed from the temple: and his disciples came to him for to shew him the buildings of the temple."},{"v":2,"t":"And Jesus said unto them, See ye not all these things? verily I say unto you, There shall not be left here one stone upon another, that shall not be thrown down."}]},"Galatians 4:4":{"ref":"Galatians 4","verses":[{"v":4,"t":"But when the fulness of the time was come, God sent forth his Son, made of a woman, made under the law,"}]},"Mark 1:15":{"ref":"Mark 1","verses":[{"v":15,"t":"And saying, The time is fulfilled, and the kingdom of God is at hand: repent ye, and believe the gospel."}]},"Micah 5:2 (5:1 Heb)":{"ref":"Micah 5","verses":[{"v":2,"t":"But thou, Beth-lehem Ephratah, though thou be little among the thousands of Judah, yet out of thee shall he come forth unto me that is to be ruler in Israel; whose goings forth have been from of old, from everlasting."}]},"Psalm 110:1":{"ref":"Psalms 110","verses":[{"v":1,"t":"The LORD said unto my Lord, Sit thou at my right hand, until I make thine enemies thy footstool."}]},"Matthew 2:1-6":{"ref":"Matthew 2","verses":[{"v":1,"t":"Now when Jesus was born in Bethlehem of Judæa in the days of Herod the king, behold, there came wise men from the east to Jerusalem,"},{"v":2,"t":"Saying, Where is he that is born King of the Jews? for we have seen his star in the east, and are come to worship him."},{"v":3,"t":"When Herod the king had heard these things, he was troubled, and all Jerusalem with him."},{"v":4,"t":"And when he had gathered all the chief priests and scribes of the people together, he demanded of them where Christ should be born."},{"v":5,"t":"And they said unto him, In Bethlehem of Judæa: for thus it is written by the prophet,"},{"v":6,"t":"And thou Bethlehem, in the land of Juda, art not the least among the princes of Juda: for out of thee shall come a Governor, that shall rule my people Israel."}]},"Luke 2:1-7":{"ref":"Luke 2","verses":[{"v":1,"t":"And it came to pass in those days, that there went out a decree from Cæsar Augustus, that all the world should be taxed."},{"v":2,"t":"(And this taxing was first made when Cyrenius was governor of Syria.)"},{"v":3,"t":"And all went to be taxed, every one into his own city."},{"v":4,"t":"And Joseph also went up from Galilee, out of the city of Nazareth, into Judæa, unto the city of David, which is called Bethlehem; (because he was of the house and lineage of David:)"},{"v":5,"t":"To be taxed with Mary his espoused wife, being great with child."},{"v":6,"t":"And so it was, that, while they were there, the days were accomplished that she should be delivered."},{"v":7,"t":"And she brought forth her firstborn son, and wrapped him in swaddling clothes, and laid him in a manger; because there was no room for them in the inn."}]},"John 7:41-42":{"ref":"John 7","verses":[{"v":41,"t":"Others said, This is the Christ. But some said, Shall Christ come out of Galilee?"},{"v":42,"t":"Hath not the scripture said, That Christ cometh of the seed of David, and out of the town of Bethlehem, where David was?"}]},"Zechariah 12:10-14":{"ref":"Zechariah 12","verses":[{"v":10,"t":"And I will pour upon the house of David, and upon the inhabitants of Jerusalem, the spirit of grace and of supplications: and they shall look upon me whom they have pierced, and they shall mourn for him, as one mourneth for his only son, and shall be in bitterness for him, as one that is in bitterness for his firstborn."},{"v":11,"t":"In that day shall there be a great mourning in Jerusalem, as the mourning of Hadadrimmon in the valley of Megiddon."},{"v":12,"t":"And the land shall mourn, every family apart; the family of the house of David apart, and their wives apart; the family of the house of Nathan apart, and their wives apart;"},{"v":13,"t":"The family of the house of Levi apart, and their wives apart; the family of Shimei apart, and their wives apart;"},{"v":14,"t":"All the families that remain, every family apart, and their wives apart."}]},"Zechariah 13:1":{"ref":"Zechariah 13","verses":[{"v":1,"t":"In that day there shall be a fountain opened to the house of David and to the inhabitants of Jerusalem for sin and for uncleanness."}]},"Zechariah 13:7":{"ref":"Zechariah 13","verses":[{"v":7,"t":"Awake, O sword, against my shepherd, and against the man that is my fellow, saith the LORD of hosts: smite the shepherd, and the sheep shall be scattered: and I will turn mine hand upon the little ones."}]},"John 19:34-37":{"ref":"John 19","verses":[{"v":34,"t":"But one of the soldiers with a spear pierced his side, and forthwith came there out blood and water."},{"v":35,"t":"And he that saw it bare record, and his record is true: and he knoweth that he saith true, that ye might believe."},{"v":36,"t":"For these things were done, that the scripture should be fulfilled, A bone of him shall not be broken."},{"v":37,"t":"And again another scripture saith, They shall look on him whom they pierced."}]},"Revelation 1:7":{"ref":"Revelation 1","verses":[{"v":7,"t":"Behold, he cometh with clouds; and every eye shall see him, and they also which pierced him: and all kindreds of the earth shall wail because of him. Even so, Amen."}]},"Matthew 26:31":{"ref":"Matthew 26","verses":[{"v":31,"t":"Then saith Jesus unto them, All ye shall be offended because of me this night: for it is written, I will smite the shepherd, and the sheep of the flock shall be scattered abroad."}]},"Psalm 22:16(17)":{"ref":"Psalms 22","verses":[{"v":16,"t":"For dogs have compassed me: the assembly of the wicked have inclosed me: they pierced my hands and my feet."}]},"Psalm 22:18":{"ref":"Psalms 22","verses":[{"v":18,"t":"They part my garments among them, and cast lots upon my vesture."}]},"Matthew 27:35-46":{"ref":"Matthew 27","verses":[{"v":35,"t":"And they crucified him, and parted his garments, casting lots: that it might be fulfilled which was spoken by the prophet, They parted my garments among them, and upon my vesture did they cast lots."},{"v":36,"t":"And sitting down they watched him there;"},{"v":37,"t":"And set up over his head his accusation written, THIS IS JESUS THE KING OF THE JEWS."},{"v":38,"t":"Then were there two thieves crucified with him, one on the right hand, and another on the left."},{"v":39,"t":"And they that passed by reviled him, wagging their heads,"},{"v":40,"t":"And saying, Thou that destroyest the temple, and buildest it in three days, save thyself. If thou be the Son of God, come down from the cross."},{"v":41,"t":"Likewise also the chief priests mocking him, with the scribes and elders, said,"},{"v":42,"t":"He saved others; himself he cannot save. If he be the King of Israel, let him now come down from the cross, and we will believe him."},{"v":43,"t":"He trusted in God; let him deliver him now, if he will have him: for he said, I am the Son of God."},{"v":44,"t":"The thieves also, which were crucified with him, cast the same in his teeth."},{"v":45,"t":"Now from the sixth hour there was darkness over all the land unto the ninth hour."},{"v":46,"t":"And about the ninth hour Jesus cried with a loud voice, saying, Eli, Eli, lama sabachthani? that is to say, My God, my God, why hast thou forsaken me?"}]},"John 19:23-24":{"ref":"John 19","verses":[{"v":23,"t":"Then the soldiers, when they had crucified Jesus, took his garments, and made four parts, to every soldier a part; and also his coat: now the coat was without seam, woven from the top throughout."},{"v":24,"t":"They said therefore among themselves, Let us not rend it, but cast lots for it, whose it shall be: that the scripture might be fulfilled, which saith, They parted my raiment among them, and for my vesture they did cast lots. These things therefore the soldiers did."}]},"Mark 15:29-34":{"ref":"Mark 15","verses":[{"v":29,"t":"And they that passed by railed on him, wagging their heads, and saying, Ah, thou that destroyest the temple, and buildest it in three days,"},{"v":30,"t":"Save thyself, and come down from the cross."},{"v":31,"t":"Likewise also the chief priests mocking said among themselves with the scribes, He saved others; himself he cannot save."},{"v":32,"t":"Let Christ the King of Israel descend now from the cross, that we may see and believe. And they that were crucified with him reviled him."},{"v":33,"t":"And when the sixth hour was come, there was darkness over the whole land until the ninth hour."},{"v":34,"t":"And at the ninth hour Jesus cried with a loud voice, saying, Eloi, Eloi, lama sabachthani? which is, being interpreted, My God, my God, why hast thou forsaken me?"}]},"Hebrews 2:12":{"ref":"Hebrews 2","verses":[{"v":12,"t":"Saying, I will declare thy name unto my brethren, in the midst of the church will I sing praise unto thee."}]},"Genesis 49:10":{"ref":"Genesis 49","verses":[{"v":10,"t":"The sceptre shall not depart from Judah, nor a lawgiver from between his feet, until Shiloh come; and unto him shall the gathering of the people be."}]},"Isaiah 11:10":{"ref":"Isaiah 11","verses":[{"v":10,"t":"And in that day there shall be a root of Jesse, which shall stand for an ensign of the people; to it shall the Gentiles seek: and his rest shall be glorious."}]},"Psalm 2:8":{"ref":"Psalms 2","verses":[{"v":8,"t":"Ask of me, and I shall give thee the heathen for thine inheritance, and the uttermost parts of the earth for thy possession."}]},"Matthew 1:1-3":{"ref":"Matthew 1","verses":[{"v":1,"t":"The book of the generation of Jesus Christ, the son of David, the son of Abraham."},{"v":2,"t":"Abraham begat Isaac; and Isaac begat Jacob; and Jacob begat Judas and his brethren;"},{"v":3,"t":"And Judas begat Phares and Zara of Thamar; and Phares begat Esrom; and Esrom begat Aram;"}]},"Hebrews 7:14":{"ref":"Hebrews 7","verses":[{"v":14,"t":"For it is evident that our Lord sprang out of Juda; of which tribe Moses spake nothing concerning priesthood."}]},"Revelation 5:5":{"ref":"Revelation 5","verses":[{"v":5,"t":"And one of the elders saith unto me, Weep not: behold, the Lion of the tribe of Juda, the Root of David, hath prevailed to open the book, and to loose the seven seals thereof."}]},"Romans 1:5":{"ref":"Romans 1","verses":[{"v":5,"t":"By whom we have received grace and apostleship, for obedience to the faith among all nations, for his name:"}]},"Isaiah 7:14-16":{"ref":"Isaiah 7","verses":[{"v":14,"t":"Therefore the Lord himself shall give you a sign; Behold, a virgin shall conceive, and bear a son, and shall call his name Immanuel."},{"v":15,"t":"Butter and honey shall he eat, that he may know to refuse the evil, and choose the good."},{"v":16,"t":"For before the child shall know to refuse the evil, and choose the good, the land that thou abhorrest shall be forsaken of both her kings."}]},"Isaiah 8:8-10":{"ref":"Isaiah 8","verses":[{"v":8,"t":"And he shall pass through Judah; he shall overflow and go over, he shall reach even to the neck; and the stretching out of his wings shall fill the breadth of thy land, O Immanuel."},{"v":9,"t":"Associate yourselves, O ye people, and ye shall be broken in pieces; and give ear, all ye of far countries: gird yourselves, and ye shall be broken in pieces; gird yourselves, and ye shall be broken in pieces."},{"v":10,"t":"Take counsel together, and it shall come to nought; speak the word, and it shall not stand: for God is with us."}]},"Genesis 24:43":{"ref":"Genesis 24","verses":[{"v":43,"t":"Behold, I stand by the well of water; and it shall come to pass, that when the virgin cometh forth to draw water, and I say to her, Give me, I pray thee, a little water of thy pitcher to drink;"}]},"Matthew 1:22-23":{"ref":"Matthew 1","verses":[{"v":22,"t":"Now all this was done, that it might be fulfilled which was spoken of the Lord by the prophet, saying,"},{"v":23,"t":"Behold, a virgin shall be with child, and shall bring forth a son, and they shall call his name Emmanuel, which being interpreted is, God with us."}]},"Matthew 2:15":{"ref":"Matthew 2","verses":[{"v":15,"t":"And was there until the death of Herod: that it might be fulfilled which was spoken of the Lord by the prophet, saying, Out of Egypt have I called my son."}]},"Luke 1:34-35":{"ref":"Luke 1","verses":[{"v":34,"t":"Then said Mary unto eople, but it shall break in pieces and consume all these kingdoms, and it shall stand for ever."}]},"Luke 7:18-23":{"ref":"Luke 7","verses":[{"v":18,"t":"And the disciples of John shewed him of all these things."},{"v":19,"t":"And John calling unto him two of his disciples sent them to Jesus, saying, Art thou he that should come? or look we for another?"},{"v":20,"t":"When the men were come unto him, they said, John Baptist hath sent us unto thee, saying, Art thou he that should come? or look we for another?"},{"v":21,"t":"And in that same hour he cured many of their infirmities and plagues, and of evil spirits; and unto many that were blind he gave sight."},{"v":22,"t":"Then Jesus answering said unto them, Go your way, and tell John what things ye have seen and heard; how that the blind see, the lame walk, the lepers are cleansed, the deaf hear, the dead are raised, to the poor the gospel is preached."},{"v":23,"t":"And blessed is he, whosoever shall not be offended in me."}]},"Matthew 11:2-6":{"ref":"Matthew 11","verses":[{"v":2,"t":"Now when John had heard in the prison the works of Christ, he sent two of his disciples,"},{"v":3,"t":"And said unto him, Art thou he that should come, or do we look for another?"},{"v":4,"t":"Jesus answered and said unto them, Go and shew John again those things which ye do hear and see:"},{"v":5,"t":"The blind receive their sight, and the lame walk, the lepers are cleansed, and the deaf hear, the dead are raised up, and the poor have the gospel preached to them."},{"v":6,"t":"And blessed is he, whosoever shall not be offended in me."}]},"Luke 3:15":{"ref":"Luke 3","verses":[{"v":15,"t":"And as the people were in expectation, and all men mused in their hearts of John, whether he were the Christ, or not;"}]},"John 1:41-45":{"ref":"John 1","verses":[{"v":41,"t":"He first findeth his own brother Simon, and saith unto him, We have found the Messias, which is, being interpreted, the Christ."},{"v":42,"t":"And he brought him to Jesus. And const WHYMAP={"suffering-servant":"This is the chapter the conversation is usually about. Getting it right — including what the rabbis themselves wrote about it — is the difference between a real conversation and a shouting match.","messianic-prophecy":"Any one of these can be argued about. The cumulative case is what asks to be explained: a specific portrait, written centuries early, in texts your friend already holds as Scripture.","daniel-timeline":"Every other prophecy can be placed anywhere in history. This one cannot — it has a terminus, and the Temple it names is gone.","temple-atonement":"The Torah itself grounds atonement in blood on an altar. There has been no altar for nineteen centuries; something has to answer that.","new-covenant":"The idea that a new covenant is a Christian invention is answered by a Jewish prophet, in the Jewish Scriptures, addressed to Israel by name.","rabbinic-objections":"These are serious arguments made by serious people. Answering the strongest form of them is the only kind of answering that counts — and dropping the bad Christian arguments is part of the same discipline.","nt-jewishness":"The single biggest obstacle is not an argument but a history: 'Christian' has meant something terrible to Jewish families. Romans 11 is the frame that forbids what was done."};
const TALK={"suffering-servant":"Never open with *“read Isaiah 53.”* They have read it, and they have an answer. Open with the history instead: **“Did you know the Targum on this chapter calls the servant the Messiah?”** Then Sukkah 52a. You are not telling them what their book says — you are asking about their own tradition, and that is a completely different conversation.","messianic-prophecy":"Never stack twelve prophecies in a row; it reads as a sales pitch and each one invites a rebuttal. Take **one** — Micah 5:2 or Zechariah 12:10 — and ask, *“How do you read this one?”* Then genuinely listen. The cumulative case only works if each piece was actually examined.","daniel-timeline":"This is the one prophecy with a deadline, so let the deadline do the work: **“Daniel says an anointed one is cut off before the city and sanctuary are destroyed. The Temple fell in 70. Who was that?”** Don't argue about the exact arithmetic of the weeks — the terminus is the argument.","temple-atonement":"Ask it as a real question, because it is one: **“Leviticus 17:11 says atonement is by blood on the altar. There has been no altar since 70 — what grounds atonement now?”** The answers are prayer, repentance and good deeds. Then, gently: *where does the Torah say that?* Ask once and stop.","new-covenant":"The word 'new covenant' is not a Christian import — it is Jeremiah's. **“Who is the new covenant of Jeremiah 31 made with?”** Read the verse: with the house of Israel and the house of Judah. That single verse dissolves the 'you made up a new religion' frame before it forms.","rabbinic-objections":"Counter-missionary arguments are serious, prepared, and often better than what you have. Say so: **“That's a real argument — let me think about it.”** Then answer the strongest form of it or admit you can't yet. Bluffing here is fatal; they have heard every bluff.","nt-jewishness":"Before any text, name the history: **“I know what the word Christian has meant to Jewish families — the Crusades, the expulsions, Luther, and then Europe in 1941.”** Say it unprompted. Then Romans 11:1: *“has God cast away his people? God forbid.”* Nothing else you say will be heard until that is on the table."};
const DIALOG={"suffering-servant":[{"w":"them","t":"Isaiah 53 is our chapter, and you're reading it out of context. Go back to Isaiah 41: 'You, Israel, my servant.' The servant is named Israel again and again — 44, 45, 48, 49. Chapter 53 is the kings of the nations, stunned in the last days, confessing what they did to the Jewish people in exile. Rashi, Ibn Ezra, Radak — that's the Jewish reading."},{"w":"you","t":"You're right that the servant is named Israel in those passages — I won't pretend otherwise. But inside the Servant Songs the servant also has a mission TO Israel: 49:5-6 says he's formed from the womb to bring Jacob back and raise up the tribes. Can Israel restore Israel? And in 53:8 the speaker says he was stricken 'for the transgression of my people' — if the speakers are the nations' kings, since when do Gentile kings call Israel 'my people'?"},{"w":"them","t":"The righteous remnant suffers for the guilty nation — a servant within the servant. And be honest about your history: the national reading became standard partly because Christians turned this chapter into a weapon. Rashi wrote while Crusaders were butchering the communities of the Rhineland."},{"w":"you","t":"Then let me say it before you have to: Christians quoted Isaiah while killing Jews, and Rashi's move was partly self-defense — I believe that, and the shame of it belongs to my house. But the messianic reading is older than the church's crimes. Targum Jonathan opens the passage 'Behold, my servant the Messiah.' Sanhedrin 98b derives Messiah's name from 53:4. That reading is Jewish property; the crimes don't erase it."},{"w":"them","t":"The Targum gives the Messiah the victory and leaves the suffering to Israel — it's not your crucified Messiah. And 53:10 says the servant will 'see offspring and prolong days.' Your Jesus died childless at thirty-three. The verse disqualifies him on its face."},{"w":"you","t":"The Targum reroutes the pain, yes — which itself tells you the plain text made messianic readers flinch. Now stay in 53:10: the same verse says his soul is made an asham — a guilt offering — and THEN he sees offspring and prolongs days. A guilt offering dies; that's what an asham is. A figure whose life is a completed guilt offering and who afterward prolongs his days is either a contradiction — or a resurrection. Read the chapter cold with me, no commentaries on either side, and tell me who you see."}],"messianic-prophecy":[{"w":"them","t":"The Tanakh gives a checklist. Messiah rebuilds the Temple (Ezekiel 37), gathers the exiles (Isaiah 43), brings world peace (Isaiah 2:4 — swords into plowshares), and fills the earth with the knowledge of God (Isaiah 11:9). Jesus went zero for four. That's not interpretation; that's arithmetic."},{"w":"you","t":"I affirm every item on that list — it's the reigning-king portrait and it stands. But the same prophets drew a second portrait: a king who arrives 'lowly, riding on a donkey' (Zech 9:9), one who is pierced and mourned like an only son (Zech 12:10), a servant despised, rejected, cut off from the land of the living (Isa 53). Your own tradition felt the collision so hard it split the Messiah in two — ben Joseph, who dies, before ben David, who reigns."},{"w":"them","t":"Ben Joseph is late aggadah, not Torah — a minor figure to absorb a few awkward verses. And 'he'll do the rest at a second coming' is an unfalsifiable IOU. Anyone who failed can promise a round two."},{"w":"you","t":"It would be unfalsifiable — except round one is checkable. A ruler from Bethlehem of Judah 'whose origins are from of old' (Micah 5:2). The donkey-king hailed in Jerusalem (Zech 9:9). And a timestamp: Daniel 9:26's anointed one cut off before the city and sanctuary are destroyed — before 70 CE. The IOU has a date and a signature. A deferred second act only matters because the first act happened on schedule."},{"w":"them","t":"Every one of those is contested and you know it. Bethlehem Ephrathah may name the clan, not the birthplace; Zechariah's pierced one may be a fallen warrior in the Gog war; Daniel's anointed one is Agrippa or the priesthood in our commentators, Onias or Antiochus-era figures in the academy."},{"w":"you","t":"Contested — conceded, every one, and I won't sell you certainty I don't have. So my only ask is this: don't take my reading or Rashi's on authority. They're your books. Put the two portraits side by side — the pierced one and the enthroned one — and ask which figure in history has any serious claim on the first portrait while the whole world, yours and mine, still waits on the second. That's the question; the rest is commentary."}],"daniel-timeline":[{"w":"them","t":"Daniel 9? The Talmud itself says 'blasted be the bones of those who calculate the end' (Sanhedrin 97b). Generations of date-setters wrecked communities with that chapter. And our commentators read the 'anointed one cut off' as Agrippa, or the anointed priesthood ending at the destruction — not your Messiah."},{"w":"you","t":"I'm not calculating an end — that curse can stand. I'm reading a boundary the text already drew: 9:26 says an anointed one is cut off, and AFTER that, 'the people of the prince who is to come shall destroy the city and the sanctuary.' Whatever the seventy weeks mean precisely, that verse puts a mashiach dying before 70 CE. Not my math — Daniel's sequence."},{"w":"them","t":"Mashiach there just means 'an anointed one' — every king and high priest was anointed. The academy reads the chapter around Onias III and the Antiochus crisis. You're capitalizing a common noun and calling it Jesus."},{"w":"you","t":"Granted — 'anointed' is a broad word, and I'll hold the identification loosely. But set that verse next to your own tradition's memory. Yoma 39b: for the last forty years before the destruction, the lot for the LORD stopped coming up in the right hand and the crimson thread stopped turning white. Count back from 70. On the Talmud's own telling, Yom Kippur's signs went dark starting around 30 CE."},{"w":"them","t":"Aggadah is not a lab report. The same page says the Temple doors swung open by themselves. You can't dismiss the Oral Torah all year and then wave one folio as forensic evidence when it points your way."},{"w":"you","t":"That's a fair hit, and I'll take it: not proof — your tradition's own memory that something changed in that generation, held loosely. But now stack the loose pieces. Daniel: an anointed one cut off before the destruction. Genesis 49:10: the scepter stays with Judah 'until Shiloh comes' — which Targum Onkelos renders 'until the Messiah comes, to whom the kingdom belongs.' Yoma 39b: forty dark years from about 30 CE. If the window the texts draw is behind us, then the honest question stops being whether Messiah came. It becomes: who came?"}],"temple-atonement":[{"w":"them","t":"This 'no temple, no atonement' argument misreads us completely. Hosea 14: 'Take words with you and return to the LORD... we will offer the bulls of our lips.' When the Temple fell, Rabban Yohanan ben Zakkai stood in the ruins and said we have an atonement as effective: deeds of lovingkindness. Teshuvah, tefillah, tzedakah. We never needed blood the way you need us to have needed it."},{"w":"you","t":"Ben Zakkai's answer was pastoral genius in a catastrophe, and I honor it — Yavneh saved your people's ability to survive the ruins. But notice what it is: an answer the Torah itself is never recorded giving. Leviticus 17:11 is God's own stated mechanism — 'the life of the flesh is in the blood, and I have given it to you on the altar to make atonement for your souls.' Where does the Torah say that mechanism was provisional, waiting to be swapped out?"},{"w":"them","t":"The prophets say it constantly. 'I desire mercy, not sacrifice' (Hosea 6:6). 'You do not delight in sacrifice... the sacrifices of God are a broken and contrite heart' (Psalm 51). Samuel: obedience is better than sacrifice. God always wanted the heart. The altar was scaffolding."},{"w":"you","t":"Read Psalm 51 one verse further: 'THEN you will delight in right sacrifices, and bulls will be offered on your altar.' David's broken heart doesn't replace the offering — it makes the offering honest. The prophets attack sacrifice without repentance; not one of them repeals Yom Kippur. And if repentance alone had always sufficed, the Day of Atonement was redundant the day it was given."},{"w":"them","t":"So your alternative is what — human sacrifice? The Torah calls that an abomination; we don't even eat blood, let alone atone by a man's execution. Nothing could be less Jewish than what you're proposing."},{"w":"you","t":"The Torah abominates a life SEIZED — Molech's fire, a victim with no say. Isaiah 53:10 describes the opposite: a servant whose own soul is set as an asham, a guilt offering, who 'poured out his soul to death' willingly and 'bore the sin of many.' Offered, not taken. Your calendar still aches once a year for atonement it has no altar to carry. My claim is that inside the window Daniel drew, that ache was answered — one final Yom Kippur — which is exactly why Jeremiah's new covenant can end, 'I will remember their sin no more.'"}],"new-covenant":[{"w":"them","t":"Read all of Jeremiah 31, not just your verse. The new covenant is with 'the house of Israel and the house of Judah' — not a church. It's Torah written on hearts — the same Torah, kept at last, not replaced. And it describes a world where no one needs to say 'know the LORD' because everyone knows him. Look out the window. Has your covenant produced that world?"},{"w":"you","t":"I agree with nearly all of that — including the indictment at the end. It names Israel and Judah first, and it's Torah internalized, not Torah abolished; any Christian reading that erases Israel from Israel's own promise has failed before it starts. Where we part: 31:32 says this covenant is 'NOT like the covenant I made with their fathers... my covenant which they broke.' Not-like means new in kind — not Sinai refreshed."},{"w":"them","t":"New in kind how? Show me the mediator in the chapter. Show me a dying Messiah, a cross, a Eucharist. They're not there. You're importing your ending into our book and calling it exegesis."},{"w":"you","t":"The chapter itself ends on the hinge: 'I will forgive their iniquity, and their sin I will remember no more' (31:34). Forgiveness that final carries a mechanism question — the same Leviticus 17:11 question we keep circling. And covenants in the Tanakh are cut in blood; Sinai's was — 'behold the blood of the covenant' (Exodus 24:8). So when a Jewish teacher at a Passover table lifts the cup and says 'this is the blood of the new covenant,' he's quoting Jeremiah and Exodus in one breath — to Jews, about the covenant promised to Jews. That's not an import; that's an address."},{"w":"them","t":"And twenty centuries later the earth is still not full of the knowledge of the LORD. So at best you're holding a deposit slip and calling it the deposit. Why should I accept a covenant that visibly hasn't done what its own text promises?"},{"w":"you","t":"'Deposit' is exactly the word I'd choose — the forgiveness now, the universal knowledge when the King finishes the reigning portrait. You're waiting for both acts to arrive together; I'm claiming the first is behind us and staking everything on the second. That's the entire disagreement — and notice where we're having it: inside Jeremiah, verse by verse. That's the only place I want to have it."}],"rabbinic-objections":[{"w":"them","t":"Before you quote a single verse, be honest about what you're asking me. The last time the church wanted Jewish souls it came with disputations we were forced to attend and stakes for the losers. My grandmother's town in Poland had a church at one end and a pit at the other. And now you'd like to study Tanakh with me?"},{"w":"you","t":"Then let me say it before you have to, and without softening: the Rhineland massacres of 1096 were carried out under a cross. The blood libel was invented in Christian England. Spain expelled your people in 1492 with clergy applauding. Luther's 1543 tract reads like a pogrom manual and the Nazis reprinted it. The Holocaust grew in baptized Europe's soil. I don't ask you to forget or forgive any of it on my schedule. I ask a different question: is Yeshua of Nazareth — a Torah-keeping Jew who never met Christendom — guilty of what was done wearing his name?"},{"w":"them","t":"'By their fruits you will know them' — your own teacher's test. Twenty centuries of this fruit. At some point the tree is answerable."},{"w":"you","t":"And the same teacher said many will cry 'Lord, Lord' and hear 'I never knew you; depart from me, you workers of lawlessness.' I won't defend Christendom, and I'm not recruiting you into its history. The claim I care about predates every crime you named: a first-century claim made by Jews, to Jews, from your scriptures, in your land, before there was a Christendom to sin. Judge that claim by Moses and the Prophets — the very test your tradition would demand."},{"w":"them","t":"Even granting all that — Maimonides ruled a Jew must die rather than worship a man. This is not a book-club disagreement for me. It's avodah zarah, the one line with no exceptions, the line my ancestors died rather than cross."},{"w":"you","t":"I respect that line more than you might expect — the Shema is not negotiable, and if Yeshua is merely a man, then Rambam is right and I'm the idolater; I accept those stakes. Which means the real question between us can't be settled by my church or your posek — only in the text we share. Zechariah 12:10, YHWH speaking: 'they will look on ME, whom they have pierced, and mourn for him as one mourns an only son.' Start there with me. Not with my history, and not with my institutions — with your prophet."}],"nt-jewishness":[{"w":"them","t":"The New Testament is a Greek book written for Gentiles that curses my people. 'His blood be on us and on our children' — that one sentence armed a thousand pogroms. Don't stand there and tell me it's a Jewish book."},{"w":"you","t":"That verse was wielded exactly as you say, for centuries, and the church that wielded it will answer to God for every pogrom it blessed — I won't dilute that. But open Matthew cold. It begins 'the book of the toledot of Yeshua the Messiah, son of David, son of Abraham' — a genealogy formula straight out of Genesis. Nearly every author is a Jew. And every fight inside it is an intra-Jewish fight — Sabbath halakhah, purity, temple, resurrection — Pharisee-Sadducee territory, not Greek philosophy."},{"w":"them","t":"The gospels, maybe. Paul is the problem. He abolished the Torah, invented a religion for Gentiles that Jesus of Nazareth never taught, and you people dress it back up in a tallit and market it to us as Judaism."},{"w":"you","t":"The same Paul wrote 'Has God rejected his people? By no means! I myself am an Israelite' (Romans 11:1), warned Gentiles never to boast over the branches, took a vow and paid for temple sacrifices in Acts 21, and circumcised Timothy. The Gentile question was settled at a Jerusalem council (Acts 15) that reasoned from Amos 9 like a beit din: the nations come in AS nations — which is Isaiah's own vision of Gentiles streaming to Israel's God. That's Jewish universalism doing what the prophets said it would, not a new religion."},{"w":"them","t":"Then explain the churches. If the book is so Jewish, why has every church I've ever walked past scrubbed the Torah, forgotten Israel, and hung up a blond Jesus? Two thousand years of readers didn't notice what you claim is on every page?"},{"w":"you","t":"They didn't notice — and that amnesia is close to the church's original sin. Romans 11 warned the very first Gentile generation against it, and they did it anyway, and my tradition is still repenting of it. Which is why my invitation runs opposite to the old one. Not 'leave your people and enter my church' — but read Matthew with me as what it actually is, a Jewish book making a Jewish claim, and hold me accountable to your text every single time my religion forgot it."}]};
const ABBR=["c","cf","vs","e.g","i.e","etc","Dr","St","Mr","Mrs","ch","pp","v","vv","no","approx","Jr","Sr"];
function splitSentences(raw){
  const tokens=raw.split(/(?<=[.!?])\s+(?=[A-Z0-9"'(‘“])/);
  const merged=[];
  tokens.forEach(t=>{
    if(merged.length){
      const prev=merged[merged.length-1];
      const m=prev.match(/([A-Za-z&.]+)\.$/);
      const w=m?m[1].replace(/\./g,""):null;
      if(w&&ABBR.includes(w)){merged[merged.length-1]=prev+" "+t;return;}
    }
    merged.push(t);
  });
  return merged;
}
const LDSBOOKS="(?:Targum(?:\\\\sJonathan)?|Sukkah\\\\s\\\\d+[ab]|Yoma\\\\s\\\\d+[ab]|Sanhedrin\\\\s\\\\d+[ab]|Midrash\\\\s[A-Za-z]+|Rashi|Ibn\\\\sEzra|Maimonides|Mishnah|Talmud|4Q\\\\d+)";
const BIBBOOKS="(?:[1-3]\\s)?(?:Genesis|Exodus|Leviticus|Numbers|Deuteronomy|Joshua|Judges|Ruth|Samuel|Kings|Chronicles|Ezra|Nehemiah|Esther|Job|Psalms?|Proverbs|Ecclesiastes|Isaiah|Jeremiah|Lamentations|Ezekiel|Daniel|Hosea|Joel|Amos|Obadiah|Jonah|Micah|Nahum|Habakkuk|Zephaniah|Haggai|Zechariah|Malachi|Matthew|Mark|Luke|John|Acts|Romans|Corinthians|Galatians|Ephesians|Philippians|Colossians|Thessalonians|Timothy|Titus|Philemon|Hebrews|James|Peter|Jude|Revelation)";
const REFNUM="";
const KEYWORDS=/\b(concedes?d?|conceded|disavow(?:s|ed|al)?|undisputed|unfalsifiable|no ancient manuscript|zero ancient witnesses|never recanted|does not match|do not match|no adequate answer|contradict(?:s|ing|ion)?|impossible|no record|officially disavowed)\b/gi;
function emphasize(t){
  t=t.replace(new RegExp("\\b("+LDSBOOKS+REFNUM+")","g"),'<span class="ref-lds">$1</span>');
  t=t.replace(new RegExp("\\b("+BIBBOOKS+"\\s\\d+(?::\\d+(?:[\\-–]\\d+)?(?:,\\s?\\d+(?:[\\-–]\\d+)?)*)?)","g"),m=>m.includes("ref-lds")?m:'<span class="ref-bib">'+m+'</span>');
  t=t.replace(/(^|[\s(—–])'([^'<>]{3,200}?)'(?=$|[\s.,;:)!?—–])/g,'$1<span class="qq">‘$2’</span>');
  t=t.replace(KEYWORDS,'<b class="kw">$1</b>');
  t=t.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/==(.+?)==/g,'<mark>$1</mark>');
  return t;
}
function rich(raw){return glossify(emphasize(esc(raw)));}
function paras(raw,per){
  per=per||2;
  const s=splitSentences(raw),ps=[];
  for(let i=0;i<s.length;i+=per)ps.push(s.slice(i,i+per).join(" "));
  return ps.map(p=>`<p>${rich(p)}</p>`).join("");
}
function formatDefense(raw){
  if(/\(\d+\)/.test(raw)){
    const parts=raw.split(/\(\d+\)\s*/);
    const intro=parts.shift().trim();
    return (intro?`<p class="lead">${rich(intro)}</p>`:"")+
      `<ol class="pts">${parts.map(p=>`<li>${rich(p.trim())}</li>`).join("")}</ol>`;
  }
  return paras(raw,2);
}

const GLOSSARY=[{"t":"Tanakh","d":"The Hebrew Bible, from the initials T-N-K: Torah (law), Nevi'im (prophets), Ketuvim (writings). The same books as the Christian Old Testament, in a different order — never call it 'the Old Testament' in conversation."},{"t":"Mashiach","d":"'Anointed one' — Messiah. In mainstream Jewish expectation a human king of David's line who gathers the exiles, rebuilds the Temple, and brings world peace — which is precisely why a crucified Messiah reads as a contradiction in terms."},{"t":"counter-missionary","d":"The organized Jewish response to Christian outreach — Outreach Judaism (Tovia Singer), Jews for Judaism. Well-prepared, well-funded, and worth reading before you speak."},{"t":"Targum","d":"Ancient Aramaic renderings of the Hebrew Scriptures, read alongside the text in the synagogue. Targum Jonathan on Isaiah 52:13 opens: 'Behold, my servant the Messiah.'"},{"t":"Talmud","d":"The vast rabbinic compilation (Mishnah plus Gemara, completed c. 500 AD). Two tractates matter most here: Sukkah 52a on two Messiahs, and Yoma 39b on the Temple's failed signs."},{"t":"Rashi","d":"Rabbi Shlomo Yitzchaki (1040–1105), the most influential Jewish commentator. He read Isaiah 53 as national Israel — a reading that became standard after him, and was not standard before."},{"t":"Messiah ben Joseph / ben David","d":"The rabbinic two-Messiah doctrine (Sukkah 52a): one who suffers and is killed, one who reigns. It exists because the texts genuinely present two portraits."},{"t":"almah / betulah","d":"The two Hebrew words at the centre of the Isaiah 7:14 argument — 'young woman' and 'virgin'. Handle this one carefully; the Christian case here is weaker than it is usually presented."},{"t":"kaari / kaaru","d":"The disputed word in Psalm 22:16 — 'like a lion' in the Masoretic text, 'they pierced' in the Septuagint and in a Dead Sea Scroll fragment from Nahal Hever."},{"t":"avodah zarah","d":"'Foreign worship' — idolatry. To an observant Jew, worshipping a m const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function hl(text,phrases){let out=esc(text);(phrases||[]).forEach(p=>{const e=esc(p).replace(/[.*+?^${}()|[\]\\]/g,"\\$&");out=out.replace(new RegExp(e,"gi"),m=>"<mark>"+m+"</mark>");});return out;}
function glossify(escapedText){
  let out=escapedText;
  GLOSSARY.forEach(g=>{
    const e=esc(g.t).replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
    let done=false;
    out=out.replace(new RegExp("\\b("+e+")\\b","i"),(m,w)=>{if(done)return m;done=true;
      return '<span class="g" tabindex="0">'+w+'<span class="gt"><b>'+esc(g.t)+'</b> — '+esc(g.d)+'</span></span>';});
  });
  return out;
}
function findWhy(d,cite){
  const key=cite.replace(/–/g,"-").replace(/\s*\(.*\)\s*/g,"").trim();
  const m=key.match(/^([1-4]?\s?[A-Za-z&; ]+?)\s+(\d+)/);
  const frag=m?(m[1].trim()+" "+m[2]):key;
  const sentences=(d.claim+" "+d.rationale).replace(/–/g,"-").split(/(?<=[.!?])\s+/);
  const hit=sentences.find(s=>s.includes(frag));
  return hit?hit.replace(/-/g,"–"):null;
}

function showLightbox(src,cap){
  const lb=document.createElement("div");lb.className="lightbox";
  lb.innerHTML='<figure style="margin:0;text-align:center"><img src="'+src+'" alt=""><figcaption>'+cap+'</figcaption></figure><button class="lx-close">✕ Close</button>';
  lb.addEventListener("click",()=>lb.remove());
  document.body.appendChild(lb);
}
function extUrl(cite){
  const c=cite.replace(/–/g,"-").replace(/\s*\(.*\)\s*/g,"").trim();
  const qm=c.match(/^Quran\s+(\d+):(\d+)/i);
  if(qm)return "https://quran.com/"+qm[1]+"/"+qm[2];
  const qc=c.match(/^Quran\s+(\d+)/i);
  if(qc)return "https://quran.com/"+qc[1];
  const mm=c.match(/^([1-3]?\s?[A-Za-z ]+?)\s+(\d+)/);
  if(mm)return "https://www.biblegateway.com/passage/?search="+encodeURIComponent(c)+"&version=KJV";
  return "https://quran.com/";
}
function hadithUrl(h){
  const m=String(h).match(/^([A-Za-z' ]+?)\s+(\d+[ab]?)(?::(\d+))?/);
  if(!m)return null;
  const t=m[1].trim().replace(/\s+/g,"_");
  return "https://www.sefaria.org/search?q="+encodeURIComponent(String(h));
}

function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),1800);}

/* ---------- filtered list (ordered) ---------- */
function filtered(){
  const arr=DATA.filter(d=>
    (state.section==="all"||d.section===state.section)&&
    (!state.verdict||d.verdict===state.verdict)&&
    (!state.severity||d.severity===state.severity)&&
    (!state.q||(d.title+" "+d.claim+" "+(d.response||"")+" "+(d.rationale||"")+" "+(CATS[d.category]||"")).toLowerCase().includes(state.q))
  );
  if(state.section==="peculiar")return arr.sort((a,b)=>PORDER.indexOf(a.id)-PORDER.indexOf(b.id));
  return arr.sort((a,b)=>(b.featured?1:0)-(a.featured?1:0)||SEVRANK[a.severity]-SEVRANK[b.severity]||VRANK[a.verdict]-VRANK[b.verdict]);
}

  store.markRead(id);
  render();
  window.scrollTo({top:0});
}

function renderCore(){
  const link=id=>byId[id]?`<button class="corelink" data-open="${id}">${esc(byId[id].title)} →</button>`:"";
  $("#main").innerHTML=`<div class="viewhead"><h2>The heart of it: the two portraits, and the clock</h2>
  <p>If you read nothing else on this section, read this page. The case that Jesus is Israel's Messiah does not require the New Testament — it can be made from the Tanakh, the Targum, and the Talmud. But it cannot be made at all until something else is said first.</p></div>
  <div class="corebox"><h3>0 · Before any text — name the history</h3>
  <p>The Rhineland massacres of 1096. The blood libel born at Norwich in 1144. Expulsion from England in 1290 and Spain in 1492. Forced disputations, Talmud burnings, Luther's <i>On the Jews and Their Lies</i> — quoted approvingly by the Nazi party four centuries later. Then Christian Europe, 1941–1945.</p>
  <p>Say this <b>unprompted</b>, before you open a single verse. Not as a preamble to get past, but because it is true, and because your friend has spent their life waiting for a Christian who will say it without being pushed. Romans 11 forbade every bit of it: <i>"Hath God cast away his people? God forbid."</i></p>
  <details class="srcdet"><summary>Open the cases behind this</summary><div class="corelinks" style="margin-top:12px">${link("hosea-blindness-restoration-romans-11")}${link("avoid-jews-killed-jesus")}</div></details></div>

  <div class="corebox"><h3>1 · Two portraits, conceded inside the tradition</h3>
  <p>The Tanakh gives two pictures of the coming one that appear impossible to reconcile: a conquering king of David's line, and a servant who is despised, pierced, and killed. This is not a Christian observation. The rabbis saw it, and Sukkah 52a resolves it with <b>two Messiahs</b> — Messiah ben Joseph, who suffers and is slain, and Messiah ben David, who reigns.</p>
  <p>The Christian claim is smaller than it sounds: not two figures, but one, twice. He came the first time as the servant; he comes again as the king. Every element of the rabbinic solution is preserved — only the arithmetic changes.</p>
  <details class="srcdet"><summary>Open the cases behind this</summary><div class="corelinks" style="margin-top:12px">${link("sukkah-52a-two-messiahs")}${link("isaiah-53-servant-distinct-from-israel")}</div></details></div>

  <div class="corebox"><h3>2 · Isaiah 53 was read of the Messiah before the argument started</h3>
  <p>Targum Jonathan — the ancient Aramaic rendering read in synagogues — opens the passage: <i>"Behold, my servant <b>the Messiah</b> shall prosper."</i> The national reading, that the servant is Israel, became standard only after Rashi in the eleventh century, when there was a very good reason for it to.</p>
  <p>And the chapter itself distinguishes the servant from the nation: he is stricken <i>"for the transgression of <b>my people</b>"</i> (53:8). A people cannot be stricken for the transgression of that same people. He is also sinless — <i>"he had done no violence, neither was any deceit in his mouth"</i> — which the prophets never say about Israel.</p>
  <p>The Great Isaiah Scroll settles the other objection permanently: the text was copied at Qumran more than a century before Jesus. Nobody edited it.</p>
  <details class="srcdet"><summary>Open the cases behind this</summary><div class="corelinks" style="margin-top:12px">${link("isaiah-53-rabbinic-messianic-reading")}${link("isaiah-53-servant-distinct-from-israel")}</div></details></div>

  <div class="corebox"><h3>3 · The one prophecy with a deadline</h3>
  <p>Almost any prophecy can be placed anywhere in history. Daniel 9 cannot: an anointed one is <b>cut off</b>, and only <i>afterwards</i> do the people of a coming prince destroy "the city and the sanctuary." The sanctuary fell in AD 70. Whatever the exact arithmetic of the seventy weeks — and the arithmetic is genuinely argued — the sequence has a terminus, and it has passed.</p>
  <p>Alongside it sits a record from the Talmud itself. <b>Yoma 39b</b> reports that for the <b>forty years before the destruction</b> the Yom Kippur lot ceased coming up in the right hand, the crimson thread stopped turning white, and the western lamp went out. Forty years before 70 is AD 30. That is not a Christian source; it is theirs.</p>
  <details class="srcdet"><summary>Open the cases behind this</summary><div class="corelinks" style="margin-top:12px">${link("daniel-9-cut-off-before-destruction")}${link("yoma-39b-forty-years")}</div></details></div>

  <div class="corebox"><h3>4 · The question the Torah leaves open</h3>
  <p>Leviticus 17:11 grounds atonement in blood on the altar. There has been no altar for nineteen centuries. The modern answer — prayer, repentance, and good deeds — is a serious and ancient adaptation, but it is not what the Torah says, and Judaism after 70 has had to build it.</p>
  <p>Ask it as a genuine question, once: <b>what grounds atonement now?</b> Then stop talking. And note that Jeremiah 31 — the promise of a <i>new covenant</i>, written on the heart, with sins remembered no more — is not a Christian invention at all. It is made, by name, with the house of Israel and the house of Judah.</p>
  <p class="pullq">"Behold, the days come, saith the LORD, that I will make a new covenant with the house of Israel, and with the house of Judah." — Jeremiah 31:31</p>
  <details class="srcdet"><summary>Open the cases behind this</summary><div class="corelinks" style="margin-top:12px">${link("atonement-after-the-temple")}${link("jeremiah-31-new-covenant")}</div></details></div>

  <div class="corebox"><h3>5 · You are not asking them to stop being Jewish</h3>
  <p>This is the sentence that reframes everything, and it should be said plainly: the first generation of Jesus-followers was entirely Jewish, arguing from the Tanakh in synagogues, keeping the feasts. The New Testament is a Jewish library — and modern Jewish scholars, Amy-Jill Levine and Daniel Boyarin among them, read it that way.</p>
  <p>The claim is not that a Gentile religion replaced Israel. Romans 11 says the opposite, explicitly, and calls Gentile believers the branch grafted in — warned, in the same breath, not to boast against the root. Whatever you say, do not repeat the error that produced a millennium of blood.</p>
  <p><button class="corelink" data-goto="share">How to actually have this conversation →</button></p></div>`;
  $("#main").querySelectorAll(".corelink").forEach(b=>{if(b.dataset.open)b.addEventListener("click",()=>openCase(b.dataset.open));});
  const g=$("#main").querySelector("[data-goto]");
  if(g)g.addEventListener("click",()=>{state.view="share";render();});
}
function renderShare(){
  $("#main").innerHTML=`<div class="viewhead"><h2>Sharing Jesus with a Jewish friend</h2>
  <p>The hardest conversation on this site, and the one that most demands humility. Not a campaign, not a technique — a friendship in which a real history is named honestly and a real question is eventually asked.</p></div>
  <div class="pb-h">The invitation to work toward</div>
  <div class="saybox"><span class="who">You, after real trust exists</span><p>"Would you read Isaiah 53 with me — and would you show me how the Targum and Sukkah 52a read it? I'd rather hear it from your sources than mine."</p></div>
  <p class="pd" style="font-size:.78rem;margin:0 0 4px">The whole posture is in that sentence: their library, their reading first, and you asking rather than telling. This is the one section of the site where you should expect to learn more than you teach.</p>

  <div class="pb-h">What actually reaches a Jewish friend</div><div class="pb-grid">
  <div class="pb"><span class="num">1</span><h4>Naming the history before you are asked</h4><p>Crusades, blood libel, expulsions, disputations, Luther, the Shoah. Say it unprompted and without a "but." Almost every Jewish person has met Christians who deflect this; being the one who doesn't is not a tactic, it is the minimum price of admission — and it is simply true.</p></div>
  <div class="pb"><span class="num">2</span><h4>Arguing from their sources, not yours</h4><p>The Targum on Isaiah 53. Sukkah 52a on the two Messiahs. Yoma 39b on the forty years. 4Q521 from the Dead Sea Scrolls. Every one of these is Jewish, most are pre-Christian or rabbinic, and none of them can be dismissed as a Christian gloss. This is the entire strategic difference between this section and the others.</p></div>
  <div class="pb"><span class="num">3</span><h4>One text at a time, with genuine listening</h4><p>Stacking prophecies feels powerful and lands as a pitch. Take one, ask how they read it, and actually consider the answer. Counter-missionary responses are serious and well-prepared; a Christian who engages the strongest form is rarer than one who has memorized twelve verses.</p></div>
  <div class="pb"><span class="num">4</span><h4>Friendship measured in years</h4><p>There is no version of this that works quickly, and pressure reads as exactly the coercion their ancestors experienced. The realistic aim of any single conversation is that they would be willing to have another one.</p></div>
  </div>

  <div class="pb-h">The method</div><div class="pb-grid">
  <div class="pb do"><h4>Say "Tanakh," not "Old Testament"</h4><p>"Old" implies superseded, and supersession is the theology behind the history. Small vocabulary choices — Tanakh, Yeshua if it's natural, "the Hebrew Scriptures" — signal that you know whose book you are holding.</p></div>
  <div class="pb do"><h4>Concede what is genuinely contested</h4><p>Isaiah 7:14 is weaker than most Christians are taught. Psalm 22:16 has a real textual question. Daniel's seventy weeks have several defensible arithmetics. Saying so, unprompted, is what buys credibility for Isaiah 53, Daniel's terminus, and Yoma 39b — the arguments that actually hold.</p></div>
  <div class="pb do"><h4>Let Romans 11 govern your posture</h4><p>Not a courtesy — a command. God has not cast away his people; the Gentile branch is grafted in and told explicitly not to boast against the root. A Christian who holds that verse cannot patronize a Jewish friend, and one who doesn't will eventually do so.</p></div>
  <div class="pb dont"><h4>Never say "the Jews killed Jesus"</h4><p>The deicide charge is the theological engine of a thousand years of massacre. It is also bad theology — a Roman prefect ordered the execution, and the New Testament's own account puts the responsibility on all of us. If it is in your vocabulary, take it out permanently.</p></div>
  <div class="pb dont"><h4>Don't quote-mine the Talmud</h4><p>Most viral "the Talmud says…" quotations are fabricated, mistranslated, or stripped of a context that reverses them — and they descend directly from medieval disputation propaganda. If you cannot read the passage in context on Sefaria, do not use it.</p></div>
  <div class="pb dont"><h4>Don't caricature Judaism as works-righteousness</h4><p>Second-Temple Judaism was a religion of covenant grace with obligations, not a merit ledger — and saying otherwise tells your friend you have never actually asked them what they believe. Ask instead. You will learn something, and you will be trusted with the answer.</p></div>
  </div>

  <div class="pb-h" style="margin-top:34px">How it actually goes — the deeper craft</div>
  <p class="sh-open">Targum Jonathan opens Isaiah 52:13: <span class="hl">"Behold, my servant the Messiah shall prosper."</span></p>
  <p class="sh-att">— an ancient Jewish rendering, read in synagogues, long before there was an argument to win</p>

  <div class="sa"><h4 class="sat">The four questions that do the most work</h4>

  <div class="sa"><h4 class="sat">Start here</h4>
  <p class="pd">The <b>servant path</b> walks Isaiah 53 through the Targum and the Talmud — the one argument made entirely from their own library. Every case page ends with a suggested question and a scripted back-and-forth ("How the conversation usually goes") with the counter-missionary reply included.</p>

const PROOFS=[{"v":"Numbers 23:19 / Hosea 11:9","they":"'God is not a man, that he should lie' — 'I am God and not a man, the Holy One in your midst.' The incarnation is flatly excluded: whatever God is, he is not a man, and no Jew may believe otherwise.","you":"Both verses are about God's character — he doesn't lie, waver, or rage like men do — not about what God is unable to do. The Tanakh itself shows YHWH appearing as a man: he eats with Abraham at Mamre (Gen 18), wrestles Jacob who says 'I have seen God face to face' (Gen 32), and sends the angel in whom 'my Name is' (Ex 23:21). The claim was never that a man became God — it's that the God of Israel entered his own creation, which Hosea's 'in your midst' sits closer to than you'd expect.","refs":"Genesis 18:1-15 · Genesis 32:24-30 · Exodus 23:20-21 · Zechariah 12:10"},{"v":"Deuteronomy 6:4","they":"'Hear, O Israel: the LORD our God, the LORD is one.' The Shema is Judaism's heartbeat, and the Trinity breaks it. Three persons is three gods with extra steps — Maimonides made absolute, indivisible unity a principle of the faith.","you":"Christians affirm the Shema — Yeshua himself quoted it verbatim as the greatest commandment (Mark 12:29). Echad can name a composite unity ('one flesh,' Gen 2:24; 'one cluster,' Num 13:23), though that alone proves nothing. What the Tanakh does carry are unresolved seams — 'let us make man' (Gen 1:26), 'the Lord GOD has sent me, and his Spirit' (Isa 48:16), 'what is his name, and what is his son's name?' (Prov 30:4). Not proofs — concede that — but cracks in the claim that the text is unitarian by definition. Trinity is a claim about the inner life of the one YHWH, not a roster of gods.","refs":"Genesis 1:26 · Genesis 2:24 · Isaiah 48:16 · Proverbs 30:4"},{"v":"Ezekiel 18:20 / Deuteronomy 24:16","they":"'The soul who sins shall die. The son shall not bear the iniquity of the father.' 'Each shall be put to death for his own sin.' Vicarious atonement — an innocent dying for the guilty — is anti-Torah on its face.","you":"Ezekiel 18 answers a proverb about inherited guilt ('the fathers ate sour grapes...'), and Deut 24:16 governs human courts — neither repeals the sacrificial system, which is voluntary substitution from end to end: hands pressed on the scapegoat's head, 'and the goat shall bear all their iniquities' (Lev 16:22); blood given by God 'to make atonement for your souls' (Lev 17:11). The line the Torah draws is between punishing an unwilling bystander and accepting a willing offering. Isaiah 53:10 puts the servant on the offering side: his soul is made an asham — a guilt offering — and he 'poured out his soul to death' himself.","refs":"Leviticus 16:21-22 · Leviticus 17:11 · Isaiah 53:10-12 · Ezekiel 18:2-4"},{"v":"Isaiah 43:11","they":"'I, I am the LORD, and besides me there is no savior.' Salvation belongs to God alone. Trusting a man named Jesus for salvation is, by this verse, idolatry by definition.","you":"Total agreement: no one but YHWH saves. That is precisely the Christian claim — Yeshua's name means 'YHWH saves,' and the NT applies Isaiah's own exclusive language ('to me every knee shall bow,' Isa 45:23) to him not as a second deity but as YHWH's own arm revealed (Isa 53:1). Either that identification is true, or Christianity is idolatry — this verse doesn't settle the question; it frames it exactly right. The dispute was never whether God alone saves, but whether God did it himself, in person.","refs":"Isaiah 45:21-23 · Isaiah 53:1 · Joel 2:32 · Zechariah 14:9"},{"v":"Deuteronomy 13:1-5","they":"The prophet who works real signs and then says 'let us go after other gods' must be rejected — miracles included. This is the Torah's standing verdict on Jesus: whatever he did, worship of him leads Israel after a god our fathers did not know.","you":"Honor the test — it's the right one. But its hinge is 'gods your fathers have not known,' and that's the entire dispute: Yeshua's first followers were Shema-praying, temple-attending Jews who claimed he was the God of Abraham's own arm, not a new god. Deut 13 rightly condemns every paganized Christ Christendom ever built; what it can't do is adjudicate the identity question by itself. Deut 18:15-19's true-prophet test — the prophet like Moses whom Israel must hear — has to be run alongside it.","refs":"Deuteronomy 18:15-19 · Isaiah 53:1 · Exodus 3:15"},{"v":"Psalm 146:3","they":"'Put not your trust in princes, in a son of man, in whom there is no salvation.' The psalmist could not be clearer: staking your soul on any human being — any son of man — is exactly what our scriptures forbid.","you":"Read the next verse: 'his breath departs, he returns to the earth; on that very day his plans perish.' The warning is against trusting what dies and stays dead — mortal power. The Christian claim is resurrection: a Messiah whose death did not hold him (Ps 16:10, 'you will not abandon my soul to Sheol'). And the Tanakh itself presents one 'like a son of man' coming with the clouds who receives everlasting dominion and the service of all peoples (Dan 7:13-14) — and a king in Psalm 2 whom the nations are told to serve, though the 'kiss the son' reading there is text-critically contested and shouldn't be leaned on alone.","refs":"Psalm 146:4 · Daniel 7:13-14 · Psalm 16:10 · Psalm 2:6-12"}];

  <p>The verses a Jewish friend will bring to you, and the two-minute responses — context first, then the question that reopens the conversation. Read the passage together whenever you can; the text itself does most of the work.</p></div>`+

    <div class="refs">Read together: ${p.refs}</div></div>`).join("");
}

const THEYSAY=[{"say":"Jews don't believe in Jesus — that's basically the one thing all Jews agree on.","quick":"Modern consensus, yes — but the first generation of Jesus-followers was entirely Jewish, arguing from Tanakh in synagogues. The question was born inside Judaism, not imported into it.","id":"nt-jewishness"},{"say":"The Messiah brings world peace. Look around — did he come?","quick":"That's one of the Tanakh's two portraits. The other is a king 'lowly, riding on a donkey' who is 'pierced' and mourned. The rabbis felt the tension so sharply they posited two Messiahs.","id":"two-messiahs-rabbinic"},{"say":"Isaiah 53 is about Israel, not Jesus. Read chapter 41 — the servant is named Israel.","quick":"The national reading is real — but Targum Jonathan opens the passage 'my servant the Messiah,' Sanhedrin 98b names Messiah from 53:4, and 53:8 says the servant is stricken 'for the transgression of my people' — someone distinct from the people.","id":"isaiah-53-servant"},{"say":"Christians mistranslate our scriptures. Almah means young woman, not virgin.","quick":"Concede it: almah is 'young woman'; betulah is the technical term. But the pre-Christian Jewish translators of the Septuagint chose parthenos — 'virgin' — centuries before Matthew was born.","id":"isaiah-7-14-almah"},{"say":"God is not a man — Numbers 23:19. That ends the conversation.","quick":"In context it means God doesn't lie or waver. The Tanakh itself shows YHWH appearing in human form — eating with Abraham (Gen 18), wrestling Jacob (Gen 32) — and in Zechariah 12:10 YHWH says 'they will look on ME whom they pierced.'","id":"zechariah-pierced"},{"say":"We don't need a middleman. We repent directly to God.","quick":"The Torah's own system was all mediation — priests, altar, blood, Yom Kippur. Leviticus 17:11 says God gave blood to make atonement. The real question is what replaced that in 70 CE, and on whose authority.","id":"temple-atonement-problem"},{"say":"For a Jew, Christianity is idolatry. Worshiping a man is the one unforgivable line.","quick":"If Yeshua is merely a man, agreed — full stop. The dispute isn't whether idolatry is evil; it's whether the pierced one of Zechariah 12:10, whom YHWH calls 'me,' is a second god or the God of Israel come near.","id":"nt-jewishness"},{"say":"After the Holocaust, how can you possibly ask Jews to convert?","quick":"No glib answer exists. Own the history first, unprompted. Then gently separate baptized Europe's crimes from a first-century Jewish claim made by Jews, from Jewish scripture, before Christendom existed to sin.","id":"nt-jewishness"},{"say":"My family would sit shiva for me. You're asking me to die to my people.","quick":"Take it at face value — the cost is real, even where the practice has softened. Never minimize it. The counter-claim isn't 'leave your people'; it's that following Israel's Messiah is the most Jewish thing a Jew can do.","id":"nt-jewishness"},{"say":"Jesus didn't fulfill the prophecies — no third temple, no ingathering, no peace.","quick":"Those belong to the reigning-king portrait, still outstanding — Christians agree. But the suffering portrait (Zech 9:9, 12:10; Isa 53; Ps 22) plus Daniel 9's timestamp had a deadline before 70 CE. Two portraits, one Messiah, two acts.","id":"second-temple-expectation"},{"say":"The virgin birth is recycled paganism — gods impregnating women.","quick":"The pagan stories are lust narratives with demigod offspring. Isaiah's sign and Matthew's account have no divine consort and arise in the most anti-pagan milieu in antiquity. And the LXX's parthenos is a Jewish reading, pre-Christian.","id":"isaiah-7-14-almah"},{"say":"You can't use the New Testament to prove the New Testament.","quick":"Agreed — so don't. The case runs on Tanakh alone: Isaiah 53, Daniel 9, Zechariah 9 and 12, Psalm 22, Genesis 49. The NT then enters as first-century Jewish testimony to be tested against those texts, not as the premise.","id":"daniel-9-seventy-weeks"},{"say":"You quote our Talmud when it suits you — Yoma 39b is aggadah, not history.","quick":"Fair hit. Hold it loosely: not proof, but the tradition's own memory that the Yom Kippur signs went dark for the final forty years before the destruction — starting, on its own math, around 30 CE.","id":"yoma-39b-crimson-thread"},{"say":"Genesis 49:10 is deathbed poetry, not a messianic countdown.","quick":"Targum Onkelos didn't think so — it renders 'until Shiloh comes' as 'until Messiah comes, to whom the kingdom belongs.' The question isn't a stopwatch; it's where Judah's scepter-story was heading, and when it bent.","id":"genesis-49-scepter"},{"say":"Jeremiah's new covenant is the same Torah with a new heart — nothing about a new mediator.","quick":"Torah internalized, yes — but Jeremiah says 'NOT like the covenant I made with their fathers' (31:32), and it ends in forgiveness so final that sin is 'remembered no more.' New in kind, and the mechanism question hangs over verse 34.","id":"jeremiah-new-covenant"},{"say":"Psalm 22 says 'like a lion,' not 'they pierced' — Christians doctored the text.","quick":"The Masoretic Text reads ka'ari ('like a lion' — which leaves the clause verbless). The Nahal Hever scroll appears to read ka'aru ('they dug/pierced') and the pre-Christian Septuagint already read a verb. Genuinely contested — say so — and the psalm's crucifixion-shaped picture stands on far more than one word.","id":"psalm-22-pierced"}];
const LESSONS=[{"n":1,"t":"Earn the right to speak","what":["Before any verse, name what 'Christian' has meant to Jewish families — unprompted: the Rhineland massacres of 1096, the blood libel born at Norwich in 1144, expulsions from England (1290) and Spain (1492), forced disputations and Talmud burnings, Luther's 1543 'On the Jews and Their Lies,' and a Holocaust incubated in baptized Europe. Carry this history so they never have to explain it to you. Nothing else you say will land until this is on the table honestly."],"ask":"What has the word 'Christian' meant in your family's story?","ids":["nt-jewishness"]},{"n":2,"t":"Find the shared text","what":["Move the conversation onto ground you both accept: the Tanakh, in their canon and their categories — Torah, Nevi'im, Ketuvim; Mashiach ben David; teshuvah; olam haba. No New Testament on the table yet, no proof-texting — whole chapters, read together. A Christian who has actually read Torah (even the weekly parashah) changes the entire register of the conversation."],"ask":"Would you study the Prophets with me — just the Tanakh, nothing of mine on the table?","ids":["isaiah-53-servant","genesis-49-scepter"]},{"n":3,"t":"The two portraits problem","what":["The Tanakh draws the Messiah twice: a reigning son of David with the nations at peace (Isa 2, 11; Dan 7) — and a figure lowly on a donkey (Zech 9:9), pierced and mourned like an only son (Zech 12:10), despised, rejected, and crushed (Isa 53; Ps 22). The rabbis saw both portraits too: their solution was two Messiahs — ben Joseph who dies in battle (Sukkah 52a, citing Zech 12:10) and ben David who reigns. The Christian claim is simpler arithmetic: one Messiah, two acts."],"ask":"What in the text forced the rabbis to invent a Messiah who dies?","ids":["two-messiahs-rabbinic","zechariah-pierced"]},{"n":4,"t":"The timing problem","what":["Daniel 9:26 puts an anointed one 'cut off' BEFORE the people of a coming prince destroy the city and the sanctuary — before 70 CE. Genesis 49:10 keeps the scepter in Judah 'until Shiloh comes,' which Targum Onkelos reads as Messiah. And Yoma 39b preserves the tradition's own memory that for the final forty years before the destruction — from about 30 CE — the Yom Kippur lot stopped coming up in the right hand and the crimson thread stopped turning white. Whoever the Messiah is, the window the shared text draws is behind us."],"ask":"If an anointed one had to be cut off before the Second Temple fell — who was it?","ids":["daniel-9-seventy-weeks","yoma-39b-crimson-thread","genesis-49-scepter","second-temple-expectation"]},{"n":5,"t":"The atonement question","what":["Leviticus 17:11 is God's own stated mechanism: 'the life of the flesh is in the blood, and I have given it to you on the altar to make atonement for your souls.' Yom Kippur was the system's heart. Since 70 CE, rabbinic Judaism has substituted repentance, prayer, and tzedakah (Hosea 14:2; Yohanan ben Zakkai in Avot d'Rabbi Natan 4) — a pastoral answer given in catastrophe, but one the Torah itself is never recorded giving. Ask it as an honest question, not a gotcha; this is the ache Yom Kippur itself carries."],"ask":"On Yom Kippur, what carries your sins now — and where does the Torah say that suffices?","ids":["temple-atonement-problem","jeremiah-new-covenant"]},{"n":6,"t":"The invitation","what":["The famous move: read Isaiah 52:13–53:12 aloud together without saying where it's from, and let them tell you it sounds like the New Testament — then show them it's Isaiah, from their own scroll, centuries before Yeshua. Then one invitation, transparent about what you're asking: read the Gospel of Matthew — the most Jewish of the four, opening with a toledot from Abraham, structured around Torah, fluent in fulfillment. Not a scalp. An open book, one chapter a week, and they hold you accountable to their text."],"ask":"Read Matthew with me as a Jewish book — one chapter a week, and you keep me honest?","ids":["isaiah-53-servant","nt-jewishness"]}];

  <p>Real conversations start with a line, not a topic. Find the line you just heard, answer in two sentences, then open the full case together. Use the search box to jump (Ctrl+F works too).</p></div>`+
  THEYSAY.map(t=>`<div class="ptcard"><h3 class="ptv">“${esc(t.say)}”</h3>
