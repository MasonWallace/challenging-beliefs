}
function renderLessons(){
  $("#main").innerHTML=`<div class="viewhead"><h2>Earning the conversation</h2>
  <p>There is no script to counter here — this is the other direction. These are the stages of a real friendship in which this conversation becomes possible: earning the right to speak, listening first, asking rather than telling, and knowing when to stop. Each stage carries the one thing to do right then, and the cases behind it.</p></div>`+
  LESSONS.map(L=>`<div class="sa"><span class="tpx">${esc(L.n)}</span><h4 class="sat">${esc(L.t)}</h4><div class="who them">What happens</div><p class="pt">${(Array.isArray(L.what)?L.what:[L.what]).map(w=>"• "+esc(w)).join("<br>")}</p>
    <div class="saybox" style="margin-top:12px"><span class="who">The question to ask</span><p>${rich(L.ask)}</p></div>
    <div class="relrow">${L.ids.map(id=>byId[id]?`<button data-open="${id}">${esc(byId[id].title)}</button>`:"").join("")}</div></div>`).join("");
  bindOpens();
}
const KNOW={"didyouknow":[{"t":"The Targum calls Isaiah's servant 'the Messiah'","d":"Targum Jonathan (the ancient Aramaic rendering of the Prophets) opens the passage: 'Behold, my servant the Messiah shall prosper.' But it then reroutes all the suffering onto Israel and the nations, leaving the Messiah only triumph — evidence both that the messianic reading is ancient and that the suffering made its readers flinch.","src":"Targum Jonathan on Isaiah 52:13–53:12","id":"isaiah-53-servant"},{"t":"The Talmud's Messiah sits among the lepers","d":"In Sanhedrin 98a, Elijah tells Rabbi Joshua ben Levi that the Messiah is already here — sitting among the suffering poor at the gates of Rome, untying and retying his bandages one at a time so that he's ready the instant he is summoned.","src":"b. Sanhedrin 98a","id":"two-messiahs-rabbinic"},{"t":"One rabbinic name for Messiah: 'the leper scholar'","d":"Sanhedrin 98b records sages deriving the Messiah's name from Isaiah 53:4 — 'surely he has borne our sicknesses... yet we esteemed him stricken' — applying the suffering-servant text directly to the Messiah.","src":"b. Sanhedrin 98b","id":"isaiah-53-servant"},{"t":"Yoma 39b: forty dark years","d":"The Talmud reports that for the last forty years before the Temple's destruction in 70 CE — that is, from about 30 CE — the Yom Kippur lot stopped coming up in the right hand, the crimson thread stopped turning white, the westernmost lamp went out, and the Temple doors opened by themselves.","src":"b. Yoma 39b","id":"yoma-39b-crimson-thread"},{"t":"The rabbis' own two-Messiah doctrine","d":"Facing texts where Messiah both dies and reigns, the Talmud posits Messiah ben Joseph, who is killed in battle — with Zechariah 12:10's mourning for the pierced one applied to him — followed by Messiah ben David, who reigns. Two Messiahs, or one Messiah in two acts: that's the whole debate in miniature.","src":"b. Sukkah 52a","id":"two-messiahs-rabbinic"},{"t":"Daily messianic expectation is a Jewish principle of faith","d":"Maimonides' twelfth principle: 'I believe with perfect faith in the coming of the Messiah; and though he tarry, I will wait daily for his coming.' Awaiting a personal Messiah is not a Christian import — it's codified rabbinic doctrine sung in the Ani Ma'amin.","src":"Rambam, commentary on Mishnah Sanhedrin ch. 10 (Perek Chelek)","id":"second-temple-expectation"},{"t":"Barcelona, 1263: why 'let's study together' can sound like a trap","d":"Nachmanides (Ramban) was compelled to debate the convert Pablo Christiani before King James I of Aragon. He argued brilliantly — including that aggadic passages aren't binding — was rewarded by the king, and still had to leave Aragon under church pressure. Coerced disputations are part of why Jewish friends may hear a Bible-study invitation as an ambush.","src":"Vikuach ha-Ramban; records of the Disputation of Barcelona, 1263"},{"t":"The Aleppo Codex is a shared treasure","d":"The crown jewel of the Masoretic text (~930 CE, vocalized by Aaron ben Asher's tradition) was damaged in the 1947 Aleppo riots — most of its Torah is still missing. Together with the Leningrad Codex (1008 CE) it anchors the Hebrew Bible that Jews and Christians both read.","src":"Ben-Zvi Institute / Israel Museum documentation"},{"t":"Isaiah 53 was in the ground before the debate began","d":"The Great Isaiah Scroll from Qumran (1QIsaᵃ, ~125 BCE) contains the whole book, a millennium older than the medieval codices — and substantially the same text, chapter 53 included. Nobody edited the servant in later.","src":"1QIsaᵃ, Shrine of the Book, Israel Museum"},{"t":"The Messianic Jewish movement is small but real","d":"Commonly cited estimates — all contested — run roughly 175,000–250,000 Messianic Jews in the US across ~350–400 congregations, and about 15,000 (claims range to 30,000) in Israel in 130+ congregations. Counter-missionary organizations dispute the definitions and the counts; treat every figure as an estimate.","src":"Israel Today / One for Israel surveys; disputed by Jews for Judaism"},{"t":"Israelis reading Isaiah 53 cold","d":"A persistent (and admittedly anecdotal) street-interview phenomenon: Hebrew speakers handed Isaiah 53 without a citation routinely guess it comes from the New Testament. No translation argument needed — the chapter does its own work in the original.","src":"e.g. One for Israel street-interview projects (anecdotal)","id":"isaiah-53-servant"},{"t":"Jewish believers you may already be quoting","d":"Alfred Edersheim, the Vienna-born Jewish convert, wrote the classic 'Life and Times of Jesus the Messiah.' Joseph Rabinowitz founded the 'Israelites of the New Covenant' in 1880s Kishinev — widely counted the first modern Messianic congregation, decades before 'Jews for Jesus' existed.","src":"Edersheim biographies; Kai Kjær-Hansen's research on Rabinowitz"},{"t":"Sitting shiva for converts — real, and softening","d":"Mourning a family member who accepted Jesus as though they had died was genuine traditional practice. In much of the modern community it has softened into grief, anger, and distance rather than formal shiva — but the fear your friend voices is not rhetorical.","src":"Responsa literature; contemporary Jewish communal discussion"},{"t":"Chabad has its own Messiah debate","d":"Many Lubavitcher Hasidim regarded the Rebbe, Menachem Mendel Schneerson, as the presumptive Messiah; after his death in 1994 a meshichist wing continued — some still do. Orthodox critic David Berger wrote a whole book protesting that a posthumous Messiah candidacy had become tolerable inside Orthodoxy. Relevant, gently: the concept of a Messiah whose career death doesn't terminate is not unthinkable in Jewish terms.","src":"David Berger, 'The Rebbe, the Messiah, and the Scandal of Orthodox Indifference' (2001)"},{"t":"Two obsessive scribal traditions","d":"The Masoretes counted letters and marked the exact middle of books to keep the Hebrew Bible stable; the Greek New Testament survives in roughly 5,800 catalogued manuscripts — the two best-attested textual traditions of antiquity. Both faiths stand on scribes who counted.","src":"Masoretic apparatus; INTF (Münster) Greek NT manuscript catalogue"}],"week":[{"t":"Shabbat","d":"Friday sundown to Saturday nightfall: candles, kiddush, family table; for the observant, no 'work' across 39 defined categories — driving, writing, and phones included at the Orthodox end.","tip":"Never schedule anything for Friday night or Saturday without asking. 'Shabbat shalom' on a Friday is always right."},{"t":"Kosher","d":"No pork or shellfish, meat and dairy separated, certification symbols on packaging — with observance ranging from strict to 'kosher-style' to none at all.","tip":"Ask 'do you keep kosher, and how strictly?' before hosting. A certified restaurant or sealed kosher food honors them more than your best home cooking."},{"t":"The High Holy Days","d":"Rosh Hashanah opens ten Days of Awe that close with Yom Kippur: a 25-hour fast, confession, and the liturgy's raw question of who will live and who will die — atonement sought, since 70 CE, without a temple or blood.","tip":"Yom Kippur's ache is the open door — but never exploit it in the moment. Be a friend during the fast; have the conversation another day."},{"t":"Passover","d":"The seder is the year's great table liturgy — exodus retold, questions scripted, matzah for a week. Being invited to a seder is an honor, not a courtesy.","tip":"Accept the invitation and read the Haggadah beforehand. Watch the afikoman: matzah broken, wrapped, hidden, and brought back — and ask your host what it means."},{"t":"The denominational spectrum","d":"Orthodox (Haredi to Modern), Conservative, Reform, Reconstructionist — and a large secular/cultural majority among American Jews for whom Jewishness is peoplehood more than belief.","tip":"Never assume observance or theology. Many proudly Jewish friends are functionally agnostic. ASK what Judaism means to them — the answer is the map."},{"t":"Bar and bat mitzvah","d":"At 13 (12 for girls in many communities) a child becomes accountable to the commandments, marked by reading Torah publicly — years of preparation for one morning.","tip":"If invited, go. Wear the kippah offered at the door. Gifts traditionally come in multiples of 18 — chai, 'life.'"},{"t":"Mezuzah and tefillin","d":"Deuteronomy 6:4-9 taken literally: the Shema handwritten on parchment fixed to the doorpost, and bound in boxes on arm and forehead in prayer.","tip":"These are Scripture enacted. Asking respectfully about the mezuzah on their door is already a Bible conversation."},{"t":"Israel","d":"For most Jews an emotional center regardless of their politics — the never-again insurance policy after the Holocaust. Criticism from outsiders lands differently than criticism from inside.","tip":"Don't lead with your politics in either direction. Ask about family there before you ever offer an opinion."},{"t":"The rest of the calendar","d":"Hanukkah (Maccabean rededication — not 'Jewish Christmas'), Purim (Esther, costumes, noise), Sukkot (booths, harvest joy). The year breathes through these.","tip":"Two fun reversals: the Maccabee story survives in books Christians preserved (1–2 Maccabees), and John 10:22 has Yeshua at the temple for Hanukkah."}],"aboutyou":[{"t":"What 'Christian' has meant to their family","d":"Crusader massacres of Rhineland Jewish communities (1096), the blood libel born in Norwich (1144) and repeated for centuries, Easter pogroms, expulsions (England 1290, Spain 1492), forced conversions and disputations, ghettos, Luther's 1543 'On the Jews and Their Lies' — later reprinted by the Nazis — and a Holocaust that grew in baptized Europe's soil.","tip":"Carry this history yourself and name it first, unprompted — so they never have to explain it to you."},{"t":"'Messianic Jews' read as deception","d":"Mainstream Judaism across denominations regards Messianic Judaism as Christianity in Jewish costume — a missionary tactic targeting the vulnerable — and Israel's establishment largely treats Messianic Jews as converts to another religion.","tip":"Don't open by litigating the label. Be ruthlessly transparent about what you believe and what you're hoping for; hidden agendas confirm the charge."},{"t":"Missionary suspicion is earned","d":"Organized evangelism of Jews reads as the old coercion by softer means; 'Jews for Jesus' is, for many, a byword for bait-and-switch. The word 'mission' itself carries freight.","tip":"Never disguise the invitation. A 'no agenda' Bible study that turns out to have one validates every fear for a decade."},{"t":"Intermarriage is the existential fear","d":"American Jewry's deepest anxiety is disappearance by assimilation — every child lost to another faith is subtraction from a people that six million were already taken from.","tip":"Honor Jewish continuity concretely: support their kids' Jewish education, celebrate the holidays with them, never frame Jewishness as something to leave."},{"t":"'Judeo-Christian' lands differently than you think","d":"Christians say it as kinship; many Jews hear their living tradition absorbed as a prologue to someone else's religion — flattened into a hyphen.","tip":"Say 'Jewish and Christian' and let the real differences stand. Respect reads as respect only when difference is allowed to exist."},{"t":"Replacement theology fed the crimes","d":"Supersessionism — the church replacing Israel — is the theological root system under most of the history above. Paul warned the first Gentile generation against exactly this arrogance (Romans 11:17-24), and Romans 1:16 keeps the gospel 'to the Jew first.'","tip":"Be able to say plainly, and mean it: 'God has not rejected his people' (Rom 11:1). If your theology can't say that, fix the theology before the friendship."},{"t":"They assume you've never read Torah","d":"Most Christians they've met know less Tanakh than a bar mitzvah kid — quoting Isaiah 53 without ever having read Leviticus. The assumption is usually correct.","tip":"Read Torah seriously — even follow the weekly parashah. A Christian who knows Vayikra changes the entire conversation."},{"t":"You're asking for more than a belief change","d":"For your friend, saying yes to Yeshua risks family, community, identity, possibly a cemetery plot — some families still sit shiva. It is experienced as betrayal of a persecuted people, not as a private opinion swap.","tip":"Never minimize the cost — Yeshua didn't (Luke 14:26-33). Offer belonging alongside the argument, and patience measured in years."},{"t":"The memory is in living tissue, not textbooks","d":"The stories above aren't ancient history to them — they're grandparents' accounts, a family tree with burned branches. Your friendly invitation arrives inside that inheritance whether you intend it or not.","tip":"You are one page in a very long story between your faith and their family. Act like it: slow, honest, and there next year."}],"doctrine":[{"topic":"God's oneness","theirs":"Absolute, indivisible unity — Maimonides' second principle. God is one in a way that admits no persons, parts, or incarnation; for a Jew, compromising this is the definition of avodah zarah.","bible":"The same Shema, affirmed — Yeshua quotes Deut 6:4 verbatim as the greatest commandment (Mark 12:29). The claim is tri-unity within the one YHWH — whose Word, Spirit, and Presence already act as God in the Tanakh and Targums (Memra, Shekhinah) — never three gods.","key":"Deuteronomy 6:4; Genesis 1:26; Isaiah 48:16"},{"topic":"The Messiah's job description","theirs":"A human king of David's line who gathers the exiles, rebuilds the Temple, brings world peace and universal knowledge of God (Rambam, Hilchot Melachim 11). Accomplish the list or you are not he — no second chances, no second comings.","bible":"The same résumé in two acts: first the lowly, pierced, rejected figure (Zech 9:9; 12:10; Isa 53), then the reigning Son of David (Isa 9:6-7; Dan 7:13-14). The rabbis' own ben Joseph/ben David doctrine concedes the texts demand both portraits.","key":"Zechariah 9:9; Isaiah 9:6-7; Daniel 7:13-14"},{"topic":"Atonement after the Temple","theirs":"Repentance, prayer, and charity stand in for sacrifice (Hos 14:2; Yohanan ben Zakkai in Avot d'Rabbi Natan 4: deeds of lovingkindness atone); the day of Yom Kippur itself atones for those who repent.","bible":"Lev 17:11 makes blood God's stated means of atonement, and the Torah never records its repeal. Isaiah 53:10 presents a final asham — a willing guilt offering — after which the new covenant's verdict is 'their sin I will remember no more' (Jer 31:34).","key":"Leviticus 17:11; Isaiah 53:10; Jeremiah 31:34"},{"topic":"The afterlife","theirs":"Genuinely varied: olam haba, resurrection of the dead (Rambam's thirteenth principle, the Amidah's second blessing), Gehinnom as mostly a temporary purgation (traditionally capped near twelve months), and broad modern agnosticism about all of it.","bible":"Resurrection and final judgment (Dan 12:2), eternal life through the Messiah, new creation. More continuity here than either side assumes — resurrection is a shared inheritance, not a Christian invention.","key":"Daniel 12:2; Isaiah 26:19; Job 19:25-27"},{"topic":"Torah and covenant","theirs":"The Sinai covenant is eternal; the 613 commandments bind Jews forever; the Oral Torah is Sinai's authorized interpretation. Any 'new covenant' that loosens Torah self-refutes.","bible":"Torah is holy and unrevoked — 'I did not come to abolish' (Matt 5:17). Jeremiah's new covenant writes Torah on hearts rather than erasing it (31:33), and Acts 15 brings Gentiles in as Gentiles without converting them into Jews — Isaiah's nations streaming to Zion, not Sinai repealed.","key":"Jeremiah 31:33; Matthew 5:17-18; Isaiah 2:2-3"},{"topic":"The election of Israel","theirs":"Israel's chosenness is irrevocable — am segulah, covenant people forever. Christian supersessionism is the oldest and deadliest move against them.","bible":"Unqualified agreement, and non-negotiable for the Christian side: 'the gifts and the calling of God are irrevocable' (Rom 11:29); 'has God rejected his people? By no means!' (11:1). The church is grafted into Israel's olive tree — it never replaces it. No replacementism, full stop.","key":"Romans 11:1, 17-29; Genesis 12:3; Jeremiah 31:35-37"},{"topic":"Sin and repentance","theirs":"Every person has a yetzer hara and yetzer hatov — an evil and a good inclination — and teshuvah is always available, directly, no mediator required. No original sin; the soul arrives pure.","bible":"Teshuvah is affirmed and commanded (Ezek 18:30-32) — but the Tanakh's own diagnosis runs darker: 'every intent of the thoughts of his heart only evil continually' (Gen 6:5), 'the heart is deceitful above all things' (Jer 17:9), 'there is no one righteous' (Eccl 7:20). The question is never whether God forgives, but on what basis a holy God does.","key":"Jeremiah 17:9; Psalm 51; Ecclesiastes 7:20"},{"topic":"The servant of Isaiah","theirs":"Israel personified — the servant is explicitly named Israel (Isa 41:8; 44:1; 49:3), and chapter 53 is the astonished nations confessing what they did to the Jewish people in exile. Rashi, Ibn Ezra, and Radak all read it nationally.","bible":"Within the Servant Songs the servant is also distinguished from Israel — commissioned to bring Jacob back (49:5-6), innocent of violence and deceit (53:9), stricken 'for the transgression of my people' (53:8). Targum Jonathan calls him Messiah; Sanhedrin 98b names Messiah from 53:4. Both readings are Jewish; only one explains every line.","key":"Isaiah 49:5-6; Isaiah 53:4-9"},{"topic":"The new covenant","theirs":"Jeremiah 31 promises a renewed Sinai in the messianic age — Torah internalized, Israel regathered, everyone knowing God. Nothing in the chapter about a new mediator or a dying Messiah; and the world's condition proves it hasn't arrived.","bible":"'Not like the covenant I made with their fathers' (31:32) — new in kind, not merely refreshed — and made with Israel and Judah first. Covenants are cut in blood (Ex 24:8); a Jewish Messiah at a Passover table announcing 'the new covenant in my blood' is quoting Jeremiah and Exodus at once. The universal-knowledge clause awaits act two.","key":"Jeremiah 31:31-34; Exodus 24:8; Ezekiel 36:26-27"},{"topic":"Resurrection","theirs":"Core doctrine — 'who revives the dead' stands in the Amidah's second blessing, and bodily resurrection at the end of days is Rambam's thirteenth principle. But it is collective and eschatological, not one man mid-history.","bible":"The same hope (Dan 12:2; Isa 26:19), with one claim added: it began early, in one man, as firstfruits — a debate the NT conducts entirely inside Jewish categories, with Paul splitting the Sanhedrin along the Pharisee/Sadducee resurrection line (Acts 23:6).","key":"Daniel 12:2; Isaiah 26:19; Psalm 16:10"},{"topic":"Worship of a man (avodah zarah / shituf)","theirs":"Worshiping a human being is the cardinal sin — one of the three a Jew must die rather than commit. Some authorities permit Gentiles 'shituf' (association of another with God); for a Jew, never. This is the bright line under every other objection.","bible":"Agreement on the standard — the dispute is identity, not the seriousness of idolatry. If Yeshua is YHWH's own arm revealed (Isa 53:1), the one YHWH calls 'me... whom they have pierced' (Zech 12:10), then worshiping him keeps the Shema rather than breaking it. If he is not, the objection stands. Everything hangs on who he is.","key":"Zechariah 12:10; Isaiah 45:22-23; Isaiah 53:1"}]};

function renderKnow(){
  const tabs=[["kt-facts","✨ Did you know?"],["kt-week","🗓 Inside their week"],["kt-you","👀 What they're taught about you"]];
  if(KNOW.doctrine)tabs.push(["kt-doct","📖 Side by side"]);
  const on=state.knowTab||"kt-facts";
  $("#main").innerHTML=`<div class="viewhead"><h2>Know your Jewish friend</h2>
  <p>Understanding before argument. Surprising true facts for conversational fluency, the rhythm of their religious life so you can love them practically, and how they've been taught to see you — so nothing they say catches you off guard.</p></div>
  <div class="tabs2">${tabs.map(([k,l])=>`<button class="tab2 ${on===k?"on":""}" data-pane="${k}">${l}</button>`).join("")}</div>
  <div class="tabpane2 ${on==="kt-facts"?"on":""}" id="kt-facts"><div class="kgrid">${KNOW.didyouknow.map(x=>`<div class="ptcard">${x.img?`<img class="ktop" src="${x.img.src}" loading="lazy" data-full="${x.img.src.replace("width=520","width=1400")}" data-cap="${esc(x.img.cap)}">`:""}<h3 class="ptv">${esc(x.t)}</h3><p class="pt">${rich(x.d)}</p><div class="refs">${x.src?`<a href="${esc(x.src)}" target="_blank" rel="noopener">Source</a>`:""}${x.id&&byId[x.id]?` · <button class="klink" data-open="${x.id}">Related case: ${esc(byId[x.id].title)}</button>`:""}</div></div>`).join("")}</div></div>
  <div class="tabpane2 ${on==="kt-week"?"on":""}" id="kt-week">${KNOW.week.map(x=>`<div class="ptcard"><h3 class="ptv">${esc(x.t)}</h3><p class="pt">${rich(x.d)}</p>${x.tip?`<div class="who you">For you as their friend</div><p class="pt">${rich(x.tip)}</p>`:""}</div>`).join("")}</div>
  <div class="tabpane2 ${on==="kt-you"?"on":""}" id="kt-you">${KNOW.aboutyou.map(x=>`<div class="ptcard"><h3 class="ptv">${esc(x.t)}</h3><p class="pt">${rich(x.d)}</p>${x.tip?`<div class="who you">How to navigate it</div><p class="pt">${rich(x.tip)}</p>`:""}</div>`).join("")}</div>${KNOW.doctrine?`<div class="tabpane2 ${on==="kt-doct"?"on":""}" id="kt-doct">${KNOW.doctrine.map(x=>`<div class="ptcard"><h3 class="ptv">${esc(x.topic)}</h3><div class="ddgrid"><div><div class="who them">They teach</div><p class="pt">${rich(x.theirs)}</p></div><div><div class="who you">The Bible teaches</div><p class="pt">${rich(x.bible)}</p></div></div>${x.key?`<div class="ddkey">${rich(x.key)}</div>`:""}</div>`).join("")}</div>`:""}`;
  document.querySelectorAll("#main .tab2").forEach(t=>t.addEventListener("click",()=>{state.knowTab=t.dataset.pane;}));
  document.querySelectorAll("#main [data-open]").forEach(b=>b.addEventListener("click",()=>openCase(b.dataset.open)));
}

/* ---------- router ---------- */
function render(){
  if(state.view!=="case"&&location.hash.indexOf("#case/")===0)try{history.replaceState(null,"",location.pathname+location.search)}catch(e){}
  document.querySelector(".app").classList.toggle("reading",state.view!=="overview");
  renderNav();
  if(state.view==="case")return renderCase();
  if(state.view==="paths")return renderPaths(),renderPreview();
  if(state.view==="timeline")return renderTimeline(),renderPreview();
  if(state.view==="glossary")return renderGlossary(),renderPreview();
  if(state.view==="share")return renderShare(),renderPreview();
  if(state.view==="proofs")return renderProofs(),renderPreview();
  if(state.view==="theysay")return renderTheySay(),renderPreview();
  if(state.view==="lessons")return renderLessons(),renderPreview();
  if(state.view==="know")return renderKnow(),renderPreview();
  if(state.view==="core")return renderCore(),renderPreview();
  renderOverview();renderPreview();
}

/* ---------- keyboard ---------- */
document.addEventListener("keydown",e=>{
  const inInput=/input|textarea/i.test(document.activeElement.tagName);
  if(inInput){if(e.key==="Escape")document.activeElement.blur();return;}
  const list=filtered();
  const move=dir=>{
    const idx=list.findIndex(x=>x.id===state.sel);
    const next=list[Math.min(list.length-1,Math.max(0,(idx<0?0:idx+dir)))];
    if(!next)return;
    state.sel=next.id;
    if(state.view==="case"){openCase(next.id);}
    else{renderPreview();
      const el=document.querySelector(`.vt[data-id="${next.id}"]`);
      document.querySelectorAll(".vt.sel").forEach(x=>x.classList.remove("sel"));
      document.querySelectorAll(`.vt[data-id="${next.id}"]`).forEach(x=>x.classList.add("sel"));
      if(el)el.scrollIntoView({block:"nearest"});}
  };
  switch(e.key==="ArrowRight"?"next":e.key==="ArrowLeft"?"prev":e.key.toLowerCase()){
    case "next":e.preventDefault();move(1);break;
    case "prev":e.preventDefault();move(-1);break;
    case "enter":if(state.sel&&state.view!=="case")openCase(state.sel);break;
    case "escape":if(state.view==="case"){state.view=state.pathId?"paths":"overview";state.caseId=null;render();}else{state.q="";const q=$("#q");if(q)q.value="";state.verdict=null;state.severity=null;render();}break;
    case "o":state.view="overview";state.section="all";state.caseId=null;render();break;
    case "p":state.view="paths";state.caseId=null;render();break;
    case "t":state.view="timeline";state.caseId=null;render();break;
    case "g":state.view="glossary";state.caseId=null;render();break;
    case "s":state.view="share";state.caseId=null;render();break;
    case "h":state.view="core";state.caseId=null;render();break;
  }
});

const TOURSTEPS=[{"icon":"🕎","title":"This section runs in reverse","body":"The rest of this site examines a religion's claims against the Bible. Here the Bible is <b>not</b> a shared standard yet — so this section does the opposite: it makes the case, from the <b>Tanakh alone</b>, that Jesus is Israel's Messiah, using sources a Jewish friend already holds. <b>19 cases</b>, each carrying the strongest counter-missionary reply."},{"icon":"🕯","title":"First, the room you're standing in","body":"The Crusades, the blood libel, the expulsions, forced disputations, Luther's <i>On the Jews and Their Lies</i>, and then Christian Europe in 1941. That history is not background to this conversation — it <b>is</b> the conversation until you name it yourself, unprompted. Romans 11 forbids everything that was done. Say so before you open a single text."},{"icon":"🏷","title":"Four verdicts, one glance","body":"Every case lands in one of four columns:<div class=\"vrow2\"><div><span class=\"badge v-admitted\">Conceded</span><span>Jewish sources grant the core fact</span></div><div><span class=\"badge v-unrefuted\">Strong</span><span>no adequate reply exists</span></div><div><span class=\"badge v-contested\">Contested</span><span>genuinely argued both ways</span></div><div><span class=\"badge v-answered\">Don't use</span><span>a Christian argument that fails</span></div></div><p style='margin:10px 0 0'><b>Conceded</b> is the strongest kind of argument here: made entirely from the Targum, the Talmud, and Jewish scholarship.</p>"},{"icon":"💬","title":"One text, then listen","body":"Never stack twelve prophecies — it reads as a sales pitch and invites twelve rebuttals. Take one, ask <i>“how do you read this?”</i>, and mean it. Every case ends with <b>“How the conversation usually goes”</b>: a real back-and-forth with the counter-missionary reply included, because your friend will have it."},{"icon":"🚀","title":"Where to start","body":"Take the <b>servant path</b>: Isaiah 53, and what the Targum and the Talmud said about it long before there was anything to argue about. It is the only argument on this site that is made entirely out of their own tradition. Replay this tour anytime from the sidebar.","cta":"Take me to the heart of it"}];
function startTour(){
  const old=document.querySelector(".tourwrap");if(old)old.remove();
  let ti=0;
  const wrap=document.createElement("div");wrap.className="tourwrap";
  function finish(go){localStorage.setItem(TOURKEY,"1");wrap.remove();if(go){state.view="core";state.caseId=null;render();}}
  function draw(){
    const s=TOURSTEPS[ti];
    wrap.innerHTML='<div class="tourcard"><div class="ticon">'+s.icon+'</div><h3>'+s.title+'</h3><div class="tbody">'+s.body+'</div>'+
      '<div class="tdots">'+TOURSTEPS.map((_,j)=>'<i class="'+(j===ti?"on":"")+'"></i>').join("")+'</div>'+
      '<div class="trow"><button class="tskip">Skip tour</button><div>'+(ti>0?'<button class="tback">Back</button>':'')+
      '<button class="tnext">'+(ti===TOURSTEPS.length-1?s.cta:'Next')+'</button></div></div></div>';
    wrap.querySelector(".tskip").addEventListener("click",()=>finish(false));
    const bk=wrap.querySelector(".tback");if(bk)bk.addEventListener("click",()=>{ti--;draw();});
    wrap.querySelector(".tnext").addEventListener("click",()=>{if(ti===TOURSTEPS.length-1){finish(ti===TOURSTEPS.length-1&&true);}else{ti++;draw();}});
  }
  document.body.appendChild(wrap);draw();
}
if(!localStorage.getItem(TOURKEY))setTimeout(startTour,500);
