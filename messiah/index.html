const GLOSSARY=[{"t":"4Q521","d":"A Dead Sea Scroll fragment describing a Messiah who heals the blind and raises the dead — pre-Christian, and almost word for word what Jesus sends back to John the Baptist in Matthew 11."},{"t":"a chiasm","d":"A mirror-image literary structure (A-B-C-B-A) common in Hebrew writing. It appears in these arguments because its presence in a text is sometimes offered as evidence of ancient Semitic authorship."},{"t":"a codex","d":"A book with bound pages, as opposed to a scroll. Christians adopted the codex format remarkably early, which is part of why so many early Christian manuscripts survive."},{"t":"a palimpsest","d":"A manuscript whose original writing was scraped off so the expensive material could be reused. Modern imaging can often recover the erased text underneath — which is how the Sanaa Quran's earlier layer was read."},{"t":"a proof-text","d":"A verse quoted on its own to establish a point, usually detached from what surrounds it. Proof-texting is the single most common way both sides of every argument on this site go wrong."},{"t":"a stele","d":"An upright inscribed stone slab set up to record a victory, a law, or a treaty — one of archaeology's most valuable finds, because it is a dated, deliberate, public record."},{"t":"a textual variant","d":"Any difference between two manuscripts, including a misspelling or a change in word order. The famous 'hundreds of thousands of variants' figure is real and almost entirely trivial; the meaningful and viable ones are well under 1%, and every modern Bible footnotes them."},{"t":"almah / betulah","d":"The two Hebrew words at the centre of the Isaiah 7:14 argument — 'young woman' and 'virgin'. Handle this one carefully; the Christian case here is weaker than it is usually presented."},{"t":"an anachronism","d":"Something appearing in a story before it existed in real life — a horse in a place with no horses, a stirrup centuries too early. Anachronisms are one of the main tools for dating a text, because a writer can only mention the world he lives in."},{"t":"an apologist","d":"Someone who defends a faith's claims — from the Greek <i>apologia</i>, a legal defense. Not an insult, and not the same as an apologizer. This site quotes apologists deliberately: a claim is only worth making if it survives the best defense of it."},{"t":"an ossuary","d":"A limestone box for bones, used in Judea for about a century around the time of Jesus: a body was left to decompose for a year, then the bones were collected into the box. Names carved on ossuaries are how we have physical traces of individuals like the high priest Caiaphas."},{"t":"the apocrypha","d":"Books written between the Testaments (Tobit, Judith, Maccabees and others), included in Catholic and Orthodox Bibles and in the original 1611 KJV, but not in the Hebrew canon or in Protestant Bibles today."},{"t":"avodah zarah","d":"'Foreign worship' — idolatry. To an observant Jew, worshipping a man is not a doctrinal disagreement but the gravest possible sin, which is why the incarnation is the real wall."},{"t":"brit chadashah","d":"Hebrew for <i>new covenant</i> — <i>brit</i> is covenant, <i>chadashah</i> is new. It is the exact phrase Jeremiah uses in Jeremiah 31:31, which is the whole point: the words are Hebrew and Jewish, not a Christian translation choice."},{"t":"the canon","d":"The list of books a community accepts as Scripture. The New Testament canon was recognized gradually by usage over the first three centuries rather than voted on at a council — Athanasius's list of 367 AD matches ours exactly."},{"t":"Codex Sinaiticus","d":"A complete Greek Bible hand-copied around 330–360 AD, found at St Catherine's Monastery on Mount Sinai in the 1840s. Along with Vaticanus it is one of the two oldest complete Bibles in existence, and its text is essentially the text you read today."},{"t":"Codex Vaticanus","d":"A Greek Bible copied around 300–325 AD, held in the Vatican Library — slightly older than Sinaiticus and, with it, the backbone of modern New Testament textual scholarship."},{"t":"counter-missionary","d":"The organized Jewish response to Christian outreach — Outreach Judaism (Tovia Singer), Jews for Judaism. Well-prepared, well-funded, and worth reading before you speak."},{"t":"Daniel Boyarin","d":"A prominent Jewish scholar of religion who argues that ideas of a divine, suffering Messiah were already present within Second Temple Judaism rather than imported into it. He is not a Christian; his work is why 'that idea is not Jewish' is harder to say than it used to be."},{"t":"the Dead Sea Scrolls","d":"About 900 manuscripts found in caves at Qumran near the Dead Sea between 1947 and 1956, copied roughly 250 BC–70 AD. They pushed our oldest Hebrew Bible manuscripts back a thousand years — and the text matched what had been copied ever since. The single most important manuscript discovery ever made."},{"t":"Deutero-Isaiah","d":"The name critical scholars give to the proposed anonymous author of Isaiah 40–55, writing during the Babylonian exile. See the multi-Isaiah theory."},{"t":"the Documentary Hypothesis","d":"The critical theory that the first five books of the Bible were woven together from several earlier sources (labelled J, E, D and P) rather than written by Moses. The classic form is now heavily revised even among critical scholars, but some version of it is the mainstream academic position."},{"t":"E. P. Sanders","d":"The scholar whose <i>Paul and Palestinian Judaism</i> (1977) dismantled the caricature of Second Temple Judaism as works-righteousness, showing it as a religion of covenant grace with obligations. His work is the reason that caricature should never be repeated."},{"t":"exegesis","d":"Drawing out what a text actually says, in its own context. Its opposite is eisegesis — reading your conclusion into the text."},{"t":"the Great Isaiah Scroll","d":"The star of the Dead Sea Scrolls: a complete copy of Isaiah, all 66 chapters, copied around 125 BC. It proves Isaiah 53 and its portrait of a pierced, suffering servant existed more than a century before Jesus — nobody added it afterwards."},{"t":"Ibn Ezra","d":"Abraham ibn Ezra (1089–1167), a major medieval Jewish commentator, known for close grammatical attention to the Hebrew — often cited on Isaiah 53 and Isaiah 7:14."},{"t":"Josephus","d":"Titus Flavius Josephus (c. 37–100 AD), a Jewish general who surrendered to Rome and became its most important historian of first-century Judea. Not a Christian, which is why his mentions of Jesus, James and John the Baptist carry so much weight."},{"t":"kaari / kaaru","d":"The disputed word in Psalm 22:16 — 'like a lion' in the Masoretic text, 'they pierced' in the Septuagint and in a Dead Sea Scroll fragment from Nahal Hever."},{"t":"the KJV","d":"The King James Version of 1611, the English Bible of the whole period covered by this site. Its wording matters constantly here: several movements examined on this site were born inside its cadence, and some of them treat it as the only legitimate Bible."},{"t":"the Maccabean period","d":"The second century BC, when Judea revolted against the Greek Seleucid king Antiochus IV. It matters here because critical scholars date the book of Daniel to this period, which is the standard reply to any argument from Daniel's timeline."},{"t":"Mashiach","d":"'Anointed one' — Messiah. In mainstream Jewish expectation a human king of David's line who gathers the exiles, rebuilds the Temple, and brings world peace — which is precisely why a crucified Messiah reads as a contradiction in terms."},{"t":"the Masoretic Text","d":"The standard Hebrew Bible, preserved and vowel-pointed by Jewish scribes called the Masoretes between roughly 600 and 1000 AD. Almost every Old Testament translation is based on it; where it differs from the Septuagint or the Scrolls, that difference is what scholars argue about."},{"t":"Messiah ben Joseph / ben David","d":"The rabbinic two-Messiah doctrine (Sukkah 52a): one who suffers and is killed, one who reigns. It exists because the texts genuinely present two portraits."},{"t":"Messianic Jew","d":"A Jewish person who believes Jesus is the Messiah. Most of the Jewish community regards the category as illegitimate — expect the term itself to be contested."},{"t":"the multi-Isaiah theory","d":"The mainstream critical view that the book of Isaiah had more than one author: chapters 1–39 from the eighth-century prophet, 40–55 from an anonymous writer during the Babylonian exile ('Deutero-Isaiah'), and sometimes 56–66 from a third. It is argued from style and from the fact that chapters 40+ address the exile as present. Conservatives dispute it; it matters here because it is the standard reply whenever Isaiah is said to predict something."},{"t":"Nahal Hever","d":"A ravine near the Dead Sea where scroll fragments were found in the 1950s. One of them carries the reading 'they pierced' at Psalm 22:16, about a thousand years older than the standard Hebrew text."},{"t":"papyrus","d":"Paper made from reed pith, the ordinary writing material of the ancient world. New Testament papyri are labelled with a P and a number — P52, a scrap of John, is the earliest known New Testament manuscript, copied around 125 AD."},{"t":"Qumran","d":"The settlement beside the caves where the Dead Sea Scrolls were found, on the northwest shore of the Dead Sea. Usually associated with the Essenes, a strict Jewish sect of the Second Temple period."},{"t":"Rabbinic Judaism","d":"The form of Judaism that developed after the Temple's destruction in AD 70, centred on Torah study, the synagogue and the authority of the rabbis rather than on sacrifice and priesthood. Essentially all Judaism today descends from it."},{"t":"Rashi","d":"Rabbi Shlomo Yitzchaki (1040–1105), the most influential Jewish commentator. He read Isaiah 53 as national Israel — a reading that became standard after him, and was not standard before."},{"t":"the Sanhedrin","d":"The Jewish high court of the Second Temple period, and also the name of a Talmudic tractate. When a case cites 'Sanhedrin 98a,' it is citing the tractate, not the court."},{"t":"the Septuagint","d":"The Greek translation of the Hebrew Scriptures made by Jewish scholars in Alexandria beginning about 250 BC — abbreviated LXX. It matters constantly here because it is pre-Christian: when it renders a verse a certain way, no Christian could have influenced it."},{"t":"Septuagint","d":"The Greek translation of the Hebrew Bible, made by Jewish scholars starting around 250 BC — often shortened to LXX. It matters constantly here because it is pre-Christian: when it renders a verse a certain way, no Christian could have influenced it."},{"t":"Shema","d":"'Hear, O Israel: the LORD our God, the LORD is one' (Deuteronomy 6:4) — recited twice daily, and the reason God's oneness is non-negotiable in any conversation."},{"t":"Shiloh","d":"The mysterious word in Genesis 49:10 — 'the sceptre shall not depart from Judah… until Shiloh come.' Ancient Jewish sources including the Targum read it messianically; its exact meaning is genuinely disputed, and that dispute is worth conceding."},{"t":"Shoah","d":"The Holocaust. Christian Europe is where it happened, and Christian theology supplied centuries of its vocabulary. This is not background to the conversation — it is the room the conversation happens in."},{"t":"the Shoah","d":"The Holocaust. Six million Jewish people murdered in Christian Europe, with centuries of Christian theological vocabulary behind the machinery. This is not background to the conversation — it is the room the conversation happens in."},{"t":"the Smithsonian Institution","d":"The United States' national museum and research complex. It matters here because for decades a 'Smithsonian statement' was circulated claiming the institution used the Book of Mormon as an archaeological guide. The Smithsonian issued a formal statement denying it, and now sends a standard letter saying its archaeologists see no connection between the New World's archaeology and the book's contents."},{"t":"Sukkah 52a","d":"The Talmudic passage that introduces two Messiahs — Messiah ben Joseph, who is killed, and Messiah ben David, who reigns. It exists because the Hebrew Scriptures genuinely present two portraits, which is the whole hinge of this section."},{"t":"supersessionism / replacement theology","d":"The teaching that the church has replaced Israel. Romans 11 explicitly denies it, and the historic Christian versions of it are behind much of what was done to Jewish communities."},{"t":"Tacitus","d":"Roman senator and historian (c. 56–120 AD). His hostile mention of 'Christus,' executed by the procurator Pontius Pilate under Tiberius, is the standard non-Christian confirmation of the crucifixion."},{"t":"Talmud","d":"The vast rabbinic compilation (Mishnah plus Gemara, completed c. 500 AD). Two tractates matter most here: Sukkah 52a on two Messiahs, and Yoma 39b on the Temple's failed signs."},{"t":"Tanakh","d":"The Hebrew Bible, from the initials T-N-K: Torah (law), Nevi'im (prophets), Ketuvim (writings). The same books as the Christian Old Testament, in a different order — never call it 'the Old Testament' in conversation."},{"t":"Targum","d":"Ancient Aramaic renderings of the Hebrew Scriptures, read alongside the text in the synagogue. Targum Jonathan on Isaiah 52:13 opens: 'Behold, my servant the Messiah.'"},{"t":"textual criticism","d":"The scholarly discipline of comparing manuscripts to work out what the original wording was. It is not an attack on Scripture — it is the method that lets us say with confidence what the text said."},{"t":"Tovia Singer","d":"An Orthodox rabbi and the best-known counter-missionary — founder of Outreach Judaism. If your Jewish friend has prepared for this conversation, it is very likely his material they have prepared with, and it is worth reading before you speak."},{"t":"Yoma 39b","d":"The Talmudic passage recording that for the forty years before the Temple's destruction the Yom Kippur lot came up wrong, the crimson thread stopped turning white, and the western lamp went out."}];

function glossify(escapedText){
  if(!glossify._re){
    const ts=GLOSSARY.slice().sort((a,b)=>esc(b.t).length-esc(a.t).length);
    const alts=ts.map(g=>esc(g.t).replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|");
    glossify._re=new RegExp("(?<![\\w-])("+alts+")(?![\\w-])","gi");
    glossify._map={};GLOSSARY.forEach(g=>{glossify._map[esc(g.t).toLowerCase()]=g;});
  }
  const used=glossify.seen||(glossify.seen=new Set());
  let inRef=0;
  return escapedText.replace(/(<[^>]*>)|([^<]+)/g,(m,tag,txt)=>{
    if(tag){
      if(/^<span class="ref-(lds|bib)"/.test(tag))inRef++;
      else if(inRef&&tag.indexOf("</span>")===0)inRef--;
      return tag;
    }
    if(inRef)return txt;
    return txt.replace(glossify._re,w=>{
      const g=glossify._map[w.toLowerCase()];
      if(!g||used.has(g.t))return w;
      used.add(g.t);
      return '<span class="g" tabindex="0">'+w+'<span class="gt"><b>'+esc(g.t)+'</b> — '+g.d+'</span></span>';
    });
  });
}


function findWhy(d,cite){
  const key=cite.replace(/–/g,"-").replace(/\s*\(.*\)\s*/g,"").trim();
  const m=key.match(/^([1-4]?\s?[A-Za-z&; ]+?)\s+(\d+)/);
  const frag=m?(m[1].trim()+" "+m[2]):key;
  const sentences=(d.claim+" "+d.rationale).replace(/–/g,"-").split(/(?<=[.!?])\s+/);
  const hit=sentences.find(s=>s.includes(frag));
  return hit?hit.replace(/-/g,"–"):null;
}

/* ---------- overview ---------- */
const WOW=new Set(["yoma-39b-forty-years","sukkah-52a-two-messiahs"]);
const RANKED=["yoma-39b-forty-years","sukkah-52a-two-messiahs","second-temple-messianic-expectation","isaiah-53-rabbinic-messianic-reading","zechariah-12-10-pierced","jeremiah-31-new-covenant","nt-jewish-library","isaiah-53-servant-distinct-from-israel","hosea-blindness-restoration-romans-11","avoid-gematria-bible-codes","psalm-22-pierced-hands-feet","daniel-9-cut-off-before-destruction","avoid-jews-killed-jesus","atonement-after-the-temple","micah-5-2-bethlehem","genesis-49-10-shiloh","avoid-legalism-caricature","avoid-talmud-quote-mining","isaiah-7-14-almah"];
function renderOverview(){
  const items=filtered();
  const anyF=state.verdict||state.severity||state.q||state.section!=="all";
  const visible=new Set(items.map(d=>d.id));
  const read=store.read;
  
  const counts={};DATA.forEach(d=>counts[d.verdict]=(counts[d.verdict]||0)+1);
  const col=v=>{
    const cls=v==="admitted"?"ad":v==="unrefuted"?"un":v==="contested"?"co":"an";
    const src=state.section==="all"?DATA:DATA.filter(d=>d.section===state.section);
    /* one ordered list per verdict: most serious first, strongest evidence at the top of each */
    /* the five on show are the ones a reader should meet first: flagged evidence
       outranks severity, so a band never opens on its dullest case */
    /* RANKED is the editorial most-striking-first order; fall back to the flags */
    const rank=d=>{const i=RANKED.indexOf(d.id); if(i>=0)return 10000-i;
      return (d.featured?6:isStrong(d)?4:0)+(d.severity==="high"?2:d.severity==="medium"?1:0);};
    const all=src.filter(d=>d.verdict===v).sort((a,b)=>rank(b)-rank(a));
    if(!all.length)return "";
    /* a filter or a search means the reader has already narrowed it — show everything */
    const open=state.open&&state.open[v], narrowed=!!(state.q||state.verdict||state.severity);
    const shown=(open||narrowed)?all:all.slice(0,5);
    const rows=shown.map(d=>{
      const im=IMGMAP[d.id];
      const thumb=im?`<img class="vth" src="${im.src.replace("width=520","width=160")}" alt="" loading="lazy">`
        :`<span class="vth ph">${esc((d.title.match(/[A-Za-z]/)||["·"])[0])}</span>`;
      return `<button class="vt ${state.sel===d.id?"sel":""}${visible.has(d.id)?"":" dimmed"}${WOW.has(d.id)?" wow":""}" data-id="${d.id}">
          ${thumb}<span class="vtx"><span class="h5">${esc(d.title)}</span>
          <span class="m">${d.avoid?'<span class="star avd">⚠ do not use</span>':d.featured?'<span class="star">★ strongest evidence</span>':isStrong(d)?'<span class="star s2">☆ strong evidence</span>':""}${read.has(d.id)?'<span class="rd">✓ read</span>':""}</span></span>
        </button>`;}).join("");
    const more=(!narrowed&&all.length>5)
      ? `<button class="showall" data-v="${v}">${open?"Show fewer &uarr;":"Show all "+all.length+" &rarr;"}</button>` : "";
    return `<div class="vcol ${cls}"><header><span class="n">${all.length}</span><span class="t">${VLABEL[v]}</span><div class="d">${VDESC[v]}</div></header><div class="vgroup">${rows}</div>${more}</div>`;
  };
  if(state.section==="peculiar"){
    const items2=filtered();
    $("#main").innerHTML=`
      <div class="tiles">
        <button class="tile on" data-v=""><div class="v">${DATA.filter(d=>d.section==="peculiar").length}</div><div class="l">Ranked entries</div></button>
        <button class="tile t-un" data-v=""><div class="v" style="font-size:1rem;padding-top:8px">Most jaw-dropping first</div><div class="l">how this list is sorted</div></button>
      </div>
      <h4 class="bt">Strange to outsiders — practices and institutional behavior, ranked by how surprising they are to a non-Mormon. Not core theology; each is documented and steelmanned like everything else.</h4>
      <div class="vcol" style="max-width:760px">${items2.map((d,i)=>`
        <button class="vt ${state.sel===d.id?"sel":""}" data-id="${d.id}">
          <h5><span style="font-family:var(--mono);color:var(--dim);font-size:.8rem;margin-right:8px">${String(i+1).padStart(2,"0")}</span>${esc(d.title)}</h5>
          <span class="m">${read.has(d.id)?'<span class="rd">✓ read</span>':""}<span class="badge v-${d.verdict}">${VLABEL[d.verdict]}</span><span>seriousness: ${SEVLABEL[d.severity]}</span></span>
        </button>`).join("")}</div>
      <p class="methodfoot">Ranking is editorial: how startling the item is to someone outside the tradition, most to least. Verdicts still grade only the factual claim.</p>`;
    document.querySelectorAll(".vt").forEach(c=>{
      c.addEventListener("mouseenter",()=>{state.sel=c.dataset.id;renderPreview();});
      c.addEventListener("click",()=>openCase(c.dataset.id));
    });
    return;
  }
  $("#main").innerHTML=`
    <h4 class="bt">${state.section==="all"?DATA.length+" claims, sorted by where the argument stands · click any title to open its case":SECTIONS[state.section]+" — by verdict"}${anyF?` · <button id="clearf" style="background:none;border:0;color:var(--gold);cursor:pointer;text-decoration:underline;font-size:.72rem;letter-spacing:0;text-transform:none">${items.length} match filters — clear</button>`:""}</h4>
    <div class="vwall vstack">${col("unrefuted")}${col("admitted")}${col("contested")}${col("answered")}</div>
    <p class="methodfoot">Method: every case carries the strongest published counter-missionary reply; arguments that fail are marked don't use; the strongest cases are the ones made from Jewish sources alone. Compiled July 2026 from published sources — verify citations at the links before quoting. Verdicts are editorial judgments about the public argument.</p>`;
  document.querySelectorAll(".vt").forEach(c=>{
    c.addEventListener("mouseenter",()=>{state.sel=c.dataset.id;renderPreview();});
    c.addEventListener("click",()=>openCase(c.dataset.id));
  });
  document.querySelectorAll(".showall").forEach(b=>b.addEventListener("click",()=>{
    state.open=state.open||{}; state.open[b.dataset.v]=!state.open[b.dataset.v]; renderOverview();
  }));
  const cf=$("#clearf");if(cf)cf.addEventListener("click",()=>{state.verdict=null;state.severity=null;state.q="";state.section="all";render();});
}

/* ---------- case ---------- */
function openCase(id,fromPath){
  state.caseId=id;state.sel=id;state.view="case";
  if(location.hash!=="#case/"+id)try{history.pushState(null,"","#case/"+id)}catch(e){}
  if(!fromPath)state.pathId=state.pathId; // keep path context if navigating within
  store.markRead(id);
  render();
  window.scrollTo({top:0});
}
function ROLENOTE(side){return side==="quran"?"<b>Role:</b> this is the passage the argument rests on.":"<b>Role:</b> this is the biblical standard the claim measures against.";}
const DEFLABEL="The strongest Jewish reply — the counter-missionary answer";
const VDESC={"admitted":"Jewish sources grant this themselves. You can make the point from their own books.","unrefuted":"No good counter-argument has been published by Jewish counter-missionary teachers.","contested":"Serious people argue this both ways. Say so before your friend does.","answered":"This Christian argument does not hold up. Drop it."};
function plainHtml(d){
  const rt=t=>glossify(emphasize(esc(t).replace(/&lt;(\/?)(b|i)&gt;/g,"<$1$2>")));
  const KINDRE=t=>(/answer,? at full strength|^their answer|^the .{2,22} answer\b|^how (they|.*s) (answer|explain)|best (defense|answer)|at its strongest|^the (rabbinic|muslim|witness|sceptic|skeptic) (reply|answer)/.test(t)?"k-def"
      :/^how strong|^the rule\b|^where it lands|^the verdict|don't use|do not use/.test(t)?"k-strength"
      :/^why this|^why it|helps you|^what it cost|^what to do instead|^what to say instead|^the takeaway|^why that matters/.test(t)?"k-help"
      :/runs out|problem|^why that is|^where it breaks|^what that misses|^the gap|^why it is wrong|^the trouble|^what it does not/.test(t)?"k-gap"
      :/verse|text|chapter|\bsays\b|passage|record|scripture|evidence|the numbers|what survives|the hadith|manuscript|papyri|inscription/.test(t)?"k-text"
      :/^the claim|^what is taught|^what (they|the book|the movement|the church|the camps) |^what happened|^how it (usually|ended|came out)|objection|^what (you|your|people)|describes|^the story|^what is at stake/.test(t)?"k-claim"
      :"k-plain");
  const KINDOF=b=>{
    if(b.say)return "k-say";
    const t=b.t.toLowerCase();
    return KINDRE(t);
  };
  /* One fixed sequence for every case, so the colours mean the same thing on
     every page and a reader learns the shape once. "What to say" is last in all
     318 cases and always anchors the run in green. */
  const SEQ=["amber","gold","red","purp","teal","slate"];
  const blocks=(d.plain||[]);
  const kinds=blocks.map(KINDOF);
  let si=0;
  const hues=blocks.map(b=>b.say?"green":SEQ[si++%SEQ.length]);
  return blocks.map((b,bi)=>{
    const ss=splitSentences(b.d),ps=[];
    for(let i=0;i<ss.length;i+=2)ps.push("<p>"+rt(ss.slice(i,i+2).join(" "))+"</p>");
    const kind=kinds[bi], hue="h-"+hues[bi];
    const big=/(k-text|k-say)/.test(kind)?" k-big":"";
    return `<div class="pblk ${kind} ${hue}${b.say?" say":""}${big}"><div class="plab ${hue}">${esc(b.t)}</div>${ps.join("")}</div>`;
  }).join("");
}
function renderCase(){
  const d=byId[state.caseId];if(!d){state.view="overview";return renderOverview();}
  const list=filtered();const idx=list.findIndex(x=>x.id===d.id);
  const path=state.pathId?PATHS.find(p=>p.id===state.pathId):null;
  let nextInPath=null;
  if(path){const i=path.items.indexOf(d.id);if(i>-1&&i<path.items.length-1)nextInPath=path.items[i+1];}
  const comp=d.comparison?`
    <div class="dlab">Side by side</div>
    <div class="compare2">
      <div class="pane bom"><div class="ref">${esc(d.comparison.left.ref)}</div><div class="scripture">${hl(d.comparison.left.text,d.comparison.hl)}</div></div>
      <div class="pane bible"><div class="ref">${esc(d.comparison.right.ref)}</div><div class="scripture">${hl(d.comparison.right.text,d.comparison.hl)}</div></div>
    </div>${d.comparison.note?`<p class="cnote">${esc(d.comparison.note)}</p>`:""}`:"";
  const rwhyTxt=t=>esc(t).replace(/&lt;(\/?)(b|i)&gt;/g,"<$1$2>");
  const chipHtml=(arr)=>arr.map(p=>{
    const v=VERSES[p],why=(d.refwhy||{})[p];
    const btn=`<button class="chip ${v?"":"ext"}" data-cite="${esc(p)}" ${v?"":`data-ext="${extUrl(p)}"`}>${esc(p)}</button>`;
    if(!d.refwhy)return btn;
    return `<div class="rrow">${btn}${why?`<span class="rwhy">${rwhyTxt(why)}</span>`:""}</div>`;
  }).join("");
  const hadithChips=(d.hadith||[]).map(h=>{
    const u=hadithUrl(h),why=(d.refwhy||{})[h];
    const chip=u?`<a class="chip ext" href="${u}" target="_blank" rel="noopener">${esc(h)}</a>`:`<span class="chip" style="cursor:default">${esc(h)}</span>`;
    if(!d.refwhy)return chip;
    return `<div class="rrow">${chip}${why?`<span class="rwhy">${rwhyTxt(why)}</span>`:""}</div>`;
  }).join("");
  const cimg=IMGMAP[d.id]?`<figure class="cimg"><img src="${IMGMAP[d.id].src}" alt="${esc(IMGMAP[d.id].cap)}" loading="lazy"><button class="cimg-x" title="Expand image" data-full="${IMGMAP[d.id].src.replace("width=520","width=1400")}" data-cap="${esc(IMGMAP[d.id].cap)}">⤢</button><figcaption>${esc(IMGMAP[d.id].cap)}</figcaption></figure>`:"";
  const passages=((d.quran||[]).length||(d.hadith||[]).length||(d.bible||[]).length||IMGMAP[d.id])?`
    <aside class="claimside">
      ${cimg}
      <details class="vdet"><summary>The texts behind this claim — ${(d.quran||[]).length+(d.hadith||[]).length+(d.bible||[]).length} refs</summary>
      <p class="sidenote">Every reference here is cited by this specific claim — Every reference here is cited by this specific claim — click a Scripture reference to read it in place (KJV); rabbinic citations open on Sefaria so your friend can check them in the original.</p>
      <div class="passcols">
        ${(d.quran||[]).length?`<div><h6 class="h-bom">Cited</h6><div class="chips" data-side="quran">${chipHtml(d.quran)}</div></div>`:""}
        ${(d.hadith||[]).length?`<div><h6 class="h-bom" style="color:var(--amber)">Rabbinic sources</h6><div class="chips" data-side="hadith">${hadithChips}</div></div>`:""}
        ${(d.bible||[]).length?`<div><h6 class="h-bib">Tanakh & New Testament</h6><div class="chips" data-side="bib">${chipHtml(d.bible)}</div></div>`:""}
        </div></details>
    </aside>`:"";
  const rel=(RELATED[d.id]||[]).filter(x=>byId[x]);
  $("#main").innerHTML=`
    <div class="backbar">
      <button class="bk" id="back">← ${path?esc(path.name):"All cases"}</button>
      <span style="font-size:.72rem;color:var(--dim)">${idx+1>0?`Case ${idx+1} of ${list.length}`:""} · <kbd>←</kbd>/<kbd>→</kbd> to move</span>
      ${nextInPath?`<button class="pathnext" id="pathnext">Next in path →</button>`:""}
    </div>
    <div class="case">
      <div class="meta"><span class="badge v-${d.verdict}">${VLABEL[d.verdict]} ${info(TIPS.verdict[d.verdict])}</span><span class="tag">${CATS[d.category]} ${info(CATDESC[d.category])}</span><span class="tag">seriousness: ${SEVLABEL[d.severity]} ${info(TIPS.impact)}</span>${d.avoid?`<span class="tag" style="border-color:var(--red);color:var(--red)">⚠ popular claim — do not use it</span>`:d.featured?`<span class="tag" style="border-color:var(--gold);color:var(--gold)">★ strongest evidence ${info(TIPS.strongest)}</span>`:isStrong(d)?`<span class="tag" style="border-color:var(--amber);color:var(--amber)">☆ strong evidence</span>`:""}</div>
      <h2>${esc(d.title)}</h2>
      
      <div class="ctop">
        <div class="claimcol">${(d.plain&&d.plain.length)?`${plainHtml(d)}<details class="claimfull"><summary>The claim, stated in full</summary><div class="claim">${paras(d.claim)}</div></details>`:`<div class="dlab red" style="margin-top:0">The claim</div><div class="claim">${paras(d.claim)}</div>`}<div id="versebox"></div></div>
        ${passages}
      </div>
      ${comp}
      <div class="tabs2">
        <button class="tab2 on" data-pane="pane-case">🛡 Defense & Verdict</button>
        <button class="tab2" data-pane="pane-talk">💬 Conversation</button>
        <button class="tab2" data-pane="pane-src">📚 Sources & connections</button>
      </div>
      <div class="tabpane2 on" id="pane-case">
        <div class="dlab blue" style="margin-top:0">${DEFLABEL}</div>
        <div class="defense">${formatDefense(d.response)}${d.responseSource?`<div class="dsrc">Source: ${d.responseSource.url?`<a href="${esc(d.responseSource.url)}" target="_blank" rel="noopener">${esc(d.responseSource.name)}</a>`:esc(d.responseSource.name)}</div>`:""}</div>
        <div class="pair2">
          <div><div class="dlab">The verdict</div><div class="vbox v-${d.verdict}"><div class="verdictline"><b class="vb">${VLABEL[d.verdict]}</b><span class="vmeaning">${esc(VDESC[d.verdict]||"")}</span></div><span>${paras(d.rationale)}</span></div></div>
          <div><div class="dlab">Why this matters</div><div class="why">${paras(WHYMAP[d.category]||"")}<p class="wtail">${esc(WHYTAIL[d.verdict])}</p></div></div>
        </div>
      </div>
      <div class="tabpane2" id="pane-talk">${TALK[d.category]?`<div class="dlab" style="margin-top:0;color:var(--green)">Bringing it up in conversation</div><div class="talk">${paras(TALK[d.category])}</div>`:""}${DIALOG[d.category]?`<div class="dlab" style="color:var(--green)">How the conversation usually goes</div><div class="dlg">${DIALOG[d.category].map(m=>`<div class="msg ${m.w}"><span class="who">${m.w==="them"?"They may say":"You respond"}</span><p>${rich(m.t)}</p></div>`).join("")}</div>`:""}</div>
      <div class="tabpane2" id="pane-src">
        <div class="dlab" style="margin-top:0">Documented by — ${d.sources.length} source${d.sources.length>1?"s":""}</div>
        <ul class="srcs">${d.sources.map(s=>`<li><span class="sb sb-${s.type}">${s.type}</span><span>${s.url?`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.name)}</a>`:esc(s.name)}</span></li>`).join("")}</ul>
        <div class="dlab">Connected cases</div>
        <div class="relrow">${rel.map(id=>`<button data-open="${id}">${esc(byId[id].title)}</button>`).join("")||"—"}</div>
      </div>
    </div>`;
    $("#back").addEventListener("click",()=>{state.view=path?"paths":"overview";state.caseId=null;render();});
  if(nextInPath)$("#pathnext").addEventListener("click",()=>openCase(nextInPath));
  document.querySelectorAll(".relrow [data-open]").forEach(b=>b.addEventListener("click",()=>openCase(b.dataset.open)));
  versesReady.then(()=>{
  let pinnedCite=null,hoverTimer=null,scrolling=false,scrollT=null;
  const vbox=()=>$("#versebox");
  const clearVerse=()=>{pinnedCite=null;const b=vbox();if(b)b.innerHTML="";
    document.querySelectorAll(".chip.open,.chip.peek").forEach(x=>x.classList.remove("open","peek"));};
  const sideOf=ch=>ch.closest("[data-side]")?ch.closest("[data-side]").dataset.side:"";
  const buildHtml=(cite,v,side)=>{
    if(!v||!v.verses)
      return '<div class="versebox vmiss"><div class="vr"><span>'+esc(cite)+'</span><button data-close>✕ close</button></div><div class="vwhy">This reference is cited by the claim but isn\'t in the built-in reader — open it in your own Bible.</div></div>';
    const why=findWhy(d,cite);
    const whyHtml=why?"<b>Why it's cited:</b> "+esc(why):ROLENOTE(side);
    const anyHl=v.verses.some(x=>x.hl);
    const hasCtx=anyHl&&v.verses.some(x=>!x.hl);
    const ctx=hasCtx?' <span class="vcited">— '+esc(v.ref)+', with the verses either side</span>'
      :(!anyHl?' <span class="vcited">— '+esc(v.ref)+'</span>':'');
    const body=v.verses.map(x=>{
      const lit=(x.hl||!anyHl);
      const txt=(x.hl&&hasCtx)?"<em>"+esc(x.t)+"</em>":esc(x.t);
      return '<span class="vs'+(lit?" hl":"")+'"><span class="vnum">'+x.v+'</span>'+txt+' </span>';
    }).join("");
    return '<div class="versebox"><div class="vr"><span>'+esc(cite)+ctx+'</span><button data-close>✕ close</button></div><div class="vtext">'+body+'</div><div class="vwhy">'+whyHtml+'</div></div>';
  };
  /* The box opens in place, beside what you pointed at. The old glitch came from it
     opening while the page was scrolling, so the page kept resizing under the cursor.
     Fix: a hover delay, and nothing opens while a scroll is in progress. */
  const openVerse=(ch,pin)=>{
    const box=vbox(); if(!box)return;
    const cite=ch.dataset.cite;
    const host=ch.closest(".pblk, .claim, .defense, .talk, .vbox, .why, .saybox, li, p")
      ||ch.closest(".chips") && ch.closest(".claimside");
    if(host&&host.parentNode&&box.previousElementSibling!==host)host.parentNode.insertBefore(box,host.nextSibling);
    document.querySelectorAll(".chip.open,.chip.peek").forEach(x=>x.classList.remove("open","peek"));
    ch.classList.add(pin?"open":"peek");
    if(pin)pinnedCite=cite;
    box.innerHTML=buildHtml(cite,VERSES[cite],sideOf(ch));
    const cb=box.querySelector("[data-close]");if(cb)cb.addEventListener("click",clearVerse);
    /* the cited verse can sit below three verses of context — bring it into view */
    const inner=box.querySelector(".versebox"),hl=box.querySelector(".vs.hl");
    if(inner&&hl){
      const want=hl.offsetTop-inner.offsetTop-Math.max(0,(inner.clientHeight-hl.offsetHeight)/2);
      inner.scrollTop=Math.max(0,want);
    }
  };
  window.addEventListener("scroll",()=>{scrolling=true;clearTimeout(scrollT);clearTimeout(hoverTimer);
    scrollT=setTimeout(()=>{scrolling=false;},220);},{passive:true});
  /* LIVEREFS: references printed inside prose become openable, like the chips */
  document.querySelectorAll("#main .ref-bib, #main .ref-lds").forEach(r=>{
    const key=r.textContent.replace(/\s+/g," ").trim().replace(/[.,;:]$/,"");
    const hit=VERSES[key]?key:Object.keys(VERSES).find(k=>k.replace(/[\u2013\u2014]/g,"-")===key.replace(/[\u2013\u2014]/g,"-"));
    if(!hit)return;
    r.classList.add("live","chip");r.dataset.cite=hit;
  });
  const canHover=window.matchMedia("(hover:hover)").matches;
  document.querySelectorAll(".chip").forEach(ch=>{
    ch.addEventListener("click",()=>{
      if(ch.dataset.ext){window.open(ch.dataset.ext,"_blank");return;}
      if(pinnedCite===ch.dataset.cite){clearVerse();return;}
      openVerse(ch,true);
    });
    if(!ch.dataset.ext&&canHover){
      ch.addEventListener("mouseenter",()=>{clearTimeout(hoverTimer);
        if(pinnedCite||scrolling)return;
        hoverTimer=setTimeout(()=>{if(!scrolling&&!pinnedCite)openVerse(ch,false);},240);});
      ch.addEventListener("mouseleave",()=>{clearTimeout(hoverTimer);
        if(pinnedCite)return;
        hoverTimer=setTimeout(()=>{if(!pinnedCite)clearVerse();},160);});
    }

/* ---------- glossary ---------- */
function renderGlossary(){
  $("#main").innerHTML=`<div class="viewhead"><h2>Word guide</h2><p>${GLOSSARY.length} terms this subject runs on, in plain English — names, books, sources and technical vocabulary. Every one of them is underlined with a dotted line wherever it appears in a case; hover or tap it there for the definition without leaving the page.</p></div><details class="primer" open><summary>New here? What this section is actually arguing</summary><div class="primerbody"><p><b>This section runs in the opposite direction from the rest of the site.</b> Everywhere else, the Bible is the shared standard and a movement's claims are weighed against it. Here the New Testament is not shared ground — so the case is made from the <b>Tanakh</b> (the Hebrew Bible), from the <b>Targum</b>, and from the <b>Talmud</b>: sources a Jewish friend already holds.</p>
    <p><b>The central problem is that the Hebrew Scriptures give two portraits</b> of the one to come: a conquering king of David's line, and a servant who is despised, pierced and killed (Isaiah 53). These look irreconcilable — and the rabbis saw it too. <b>Sukkah 52a</b> resolves it with two Messiahs: Messiah ben Joseph, who is slain, and Messiah ben David, who reigns. The Christian claim is smaller than it sounds: not two figures, but one, twice.</p>
    <p>Alongside that sit two datable arguments. <b>Daniel 9</b> has an anointed one cut off <i>before</i> the Temple is destroyed — and the Temple fell in AD 70. And <b>Yoma 39b</b>, in the Talmud itself, records that for the forty years before that destruction the Yom Kippur signs failed. Forty years before 70 is AD 30.</p>
    <p><b>None of it can be said until something else is.</b> The Crusades, the blood libel, the expulsions, forced disputations, Luther, and the <b>Shoah</b> — that history is the room this conversation happens in, and it must be named first and unprompted. Terms in dotted underline can be hovered anywhere for a definition.</p></div></details>
  <div class="gaccord">${GLOSSARY.map(g=>`<div class="gitem"><b>${esc(g.t)}</b><p>${g.d}</p></div>`).join("")}</div>`;
}

/* ---------- the heart of it ---------- */
function renderCore(){
  const link=id=>byId[id]?`<button class="corelink" data-open="${id}">${esc(byId[id].title)} →</button>`:"";
  $("#main").innerHTML=`<div class="viewhead"><h2>The heart of it: the two portraits, and the clock</h2>
  <p>If you read nothing else on this section, read this page. The case that Jesus is Israel's Messiah does not require the New Testament — it can be made from the Tanakh, the Targum, and the Talmud. But it cannot be made at all until something else is said first.</p></div><figure class="corehero"><img src="https://commons.wikimedia.org/wiki/Special:FilePath/The%20Great%20Isaiah%20Scroll%20MS%20A%20(1QIsa)%20-%20Google%20Art%20Project.jpg?width=900" loading="lazy" alt=""><figcaption>The Great Isaiah Scroll, copied about 125 BC. Chapter 53 was already there, more than a century before Jesus was born.</figcaption></figure>
  <div class="corebox"><h3>0 · Before any text — name the history</h3>
  <p>The Rhineland massacres of 1096. The blood libel born at Norwich in 1144. Expulsion from England in 1290 and Spain in 1492. Forced disputations, Talmud burnings, Luther's <i>On the Jews and Their Lies</i> — quoted approvingly by the Nazi party four centuries later. Then Christian Europe, 1941–1945.</p>
  <p>Say this <b>unprompted</b>, before you open a single verse. Not as a preamble to get past, but because it is true, and because your friend has spent their life waiting for a Christian who will say it without being pushed. Romans 11 forbade every bit of it: <i>"Hath God cast away his people? God forbid."</i></p>
  <details class="srcdet"><summary>Open the cases behind this</summary><div class="corelinks" style="margin-top:12px">${link("hosea-blindness-restoration-romans-11")}${link("avoid-jews-killed-jesus")}</div></details></div>

  <div class="corebox"><h3>1 · Two portraits, conceded inside the tradition</h3>
  <p>The Tanakh gives two pictures of the coming one that appear impossible to reconcile: a conquering king of David's line, and a servant who is despised, pierced, and killed. This is not a Christian observation. The rabbis saw it, and Sukkah 52a resolves it with <b>two Messiahs</b> — Messiah ben Joseph, who suffers and is slain, and Messiah ben David, who reigns.</p>
  <p>The Christian claim is smaller than it sounds: not two figures, but one, twice. He came the first time as the servant; he comes again as the king. Every element of the rabbinic solution is preserved — only the arithmetic changes.</p>
  <details class="srcdet"><summary>Open the cases behind this</summary><div class="corelinks" style="margin-top:12px">${link("sukkah-52a-two-messiahs")}${link("isaiah-53-servant-distinct-from-israel")}</div></details></div>

  <div class="corebox"><h3>2 · Isaiah 53 was read of the Messiah before the argument started</h3>
  <p>Targum Jonathan — the ancient Aramaic rendering read in synagogues — opens the passage: <i>"Behold, my servant <b>the Messiah</b> shall prosper."</i> The national reading, that the servant is Israel, became standard only after Rashi in the eleventh century, when there was a very good reason for it to.</p>
  <p>And the chapter itself distinguishes the servant from the nation: he is stricken <i>"for the transgression of <b>my people</b>"</i> (53:8). A people cannot be stricken for the transgression of that same people. He is also sinless — <i>"he had done no violence, neither was any deceit in his mouth"</i> — which the prophets never say about Israel.</p>
  <p>The Great Isaiah Scroll settles the other objection permanently: the text was copied at Qumran more than a century before Jesus. Nobody edited it.</p>
  <details class="srcdet"><summary>Open the cases behind this</summary><div class="corelinks" style="margin-top:12px">${link("isaiah-53-rabbinic-messianic-reading")}${link("isaiah-53-servant-distinct-from-israel")}</div></details></div>

  <div class="corebox"><h3>3 · The one prophecy with a deadline</h3>
  <p>Almost any prophecy can be placed anywhere in history. Daniel 9 cannot: an anointed one is <b>cut off</b>, and only <i>afterwards</i> do the people of a coming prince destroy "the city and the sanctuary." The sanctuary fell in AD 70. Whatever the exact arithmetic of the seventy weeks — and the arithmetic is genuinely argued — the sequence has a terminus, and it has passed.</p>
  <p>Alongside it sits a record from the Talmud itself. <b>Yoma 39b</b> reports that for the <b>forty years before the destruction</b> the Yom Kippur lot ceased coming up in the right hand, the crimson thread stopped turning white, and the western lamp went out. Forty years before 70 is AD 30. That is not a Christian source; it is theirs.</p>
  <details class="srcdet"><summary>Open the cases behind this</summary><div class="corelinks" style="margin-top:12px">${link("daniel-9-cut-off-before-destruction")}${link("yoma-39b-forty-years")}</div></details></div>

  <div class="corebox"><h3>4 · The question the Torah leaves open</h3>
  <p>Leviticus 17:11 grounds atonement in blood on the altar. There has been no altar for nineteen centuries. The modern answer — prayer, repentance, and good deeds — is a serious and ancient adaptation, but it is not what the Torah says, and Judaism after 70 has had to build it.</p>
  <p>Ask it as a genuine question, once: <b>what grounds atonement now?</b> Then stop talking. And note that Jeremiah 31 — the promise of a <i>new covenant</i>, written on the heart, with sins remembered no more — is not a Christian invention at all. It is made, by name, with the house of Israel and the house of Judah.</p>
  <p class="pullq">"Behold, the days come, saith the LORD, that I will make a new covenant with the house of Israel, and with the house of Judah." — Jeremiah 31:31</p>
  <details class="srcdet"><summary>Open the cases behind this</summary><div class="corelinks" style="margin-top:12px">${link("atonement-after-the-temple")}${link("jeremiah-31-new-covenant")}</div></details></div>

  <div class="corebox"><h3>5 · You are not asking them to stop being Jewish</h3>
  <p>This is the sentence that reframes everything, and it should be said plainly: the first generation of Jesus-followers was entirely Jewish, arguing from the Tanakh in synagogues, keeping the feasts. The New Testament is a Jewish library — and modern Jewish scholars, Amy-Jill Levine and Daniel Boyarin among them, read it that way.</p>
  <p>The claim is not that a Gentile religion replaced Israel. Romans 11 says the opposite, explicitly, and calls Gentile believers the branch grafted in — warned, in the same breath, not to boast against the root. Whatever you say, do not repeat the error that produced a millennium of blood.</p>
  <p><button class="corelink" data-goto="share">How to actually have this conversation →</button></p></div>`;
  $("#main").querySelectorAll(".corelink").forEach(b=>{if(b.dataset.open)b.addEventListener("click",()=>openCase(b.dataset.open));});
  const g=$("#main").querySelector("[data-goto]");
  if(g)g.addEventListener("click",()=>{state.view="share";render();});
}
function renderShare(){
  $("#main").innerHTML=`<div class="viewhead"><h2>Sharing Jesus with a Jewish friend</h2>
  <p>The hardest conversation on this site, and the one that most demands humility. Not a campaign and not a technique. A friendship in which a real history is named honestly and a real question is eventually asked.</p></div>
<div class="pb-h">Name the history first</div>
<div class="saybox"><span class="who">You, unprompted</span><p>"Before I say anything about Jesus, I want to name what Christians have done to Jewish people. The Crusades, the blood libels, the expulsions, the Shoah. That was ours."</p></div>
<p>Say it before you are asked. Say it without adding a defence of the church.</p>
<p>The list is long and it is not ancient history. Forced disputations. Expulsion from England, France and Spain. Luther in his old age. Pogroms across eastern Europe. Then Europe in the 1940s, in countries that had been Christian for a thousand years.</p>
<p>Nearly every Jewish person has met Christians who deflect this. Being the one who does not is not a technique. It is the price of admission, and it is simply true.</p>
<p>Whatever you say about Jesus will be heard through that history. You do not get to skip it, and you do not get to be wounded that it is there.</p>
<p>Do not rush the sentence either. Let it sit. If your friend says nothing for a while, that is the right response and not a failure.</p>
<p>It also matters that you know the specifics. Vague regret sounds like a script. Naming a year, a decree or a town sounds like someone who went and looked.</p>

<div class="pb-h">Two habits to drop before you start</div>
<div class="saybox"><span class="who">You, plainly</span><p>"I am not asking you to stop being Jewish. I believe Yeshua is the Messiah of Israel, and I would love to talk about that with you sometime."</p></div>
<p>The first habit is a single word. Never use the word convert at a Jewish person. It belongs to the disputation, the forced sermon and the baptism at sword point. Say what you actually mean instead.</p>
<p>The second habit you may not notice you have. Do not explain the Hebrew Bible to a Jewish friend. It is their book. Many have read it in a language you cannot read, with commentators you have never opened.</p>
<p>Ask how they read a passage. Do not tell them what it means. That one change alters the whole temperature of the conversation.</p>
<p>A third habit is worth dropping too. Stop treating the first Christians as a new religion that arrived from outside.</p>
<p>The first generation of people who followed Yeshua were Jewish. They argued from the Tanakh in synagogues and kept the feasts.</p>

<div class="pb-h">The invitation to work toward</div>
<div class="saybox"><span class="who">You, in time</span><p>"Would you read Isaiah 53 with me, and show me how the Targum and Sukkah 52a read it? I would rather hear it from your sources than mine."</p></div>
<p>The whole posture sits in that sentence. Their library. Their reading first. You asking rather than telling.</p>
<p>This is the one section of the site where you should expect to learn more than you teach. That is not false modesty. Counter-missionary replies are serious, old and well prepared.</p>
<p>Take one text at a time. Stacking prophecies feels strong and lands as a sales pitch.</p>
<p>Read the counter-missionary answer before you need it. Meeting a good one cold, in a kitchen, is not the moment to hear it for the first time.</p>
<p>4Q521 is worth knowing early. It is a Dead Sea Scroll, older than the church, and it describes a Messiah who heals the blind and raises the dead.</p>
<p>Nobody can call that a Christian invention. That is the kind of source this section is built on.</p>

<div class="pb-h">What actually reaches a Jewish friend</div><div class="pb-grid">
<div class="pb"><span class="num">1</span><h4>Naming the history before you are asked</h4><p>Say it first and unprompted, every time. Do not wait to be challenged into it. A Jewish friend who hears a Christian name it without being pushed is hearing something rare.</p></div>
<div class="pb"><span class="num">2</span><h4>Arguing from their sources, not yours</h4><p>The Targum on Isaiah 53. Sukkah 52a on the two Messiahs. Yoma 39b on the forty years. 4Q521 from the Dead Sea Scrolls. Every one of these is Jewish. Most are rabbinic or older than the church. None can be waved off as a Christian gloss.</p></div>
<div class="pb"><span class="num">3</span><h4>One text at a time, with real listening</h4><p>Take one passage. Ask how they read it. Then actually weigh the answer. A Christian who engages the strongest form of a reply is rarer than one who has memorised twelve verses.</p></div>
<div class="pb"><span class="num">4</span><h4>Friendship measured in years</h4><p>There is no fast version of this. Pressure reads as the coercion their ancestors lived through. The realistic aim of any single conversation is that they would be willing to have another one.</p></div>
</div>

<div class="pb-h">The method</div><div class="pb-grid">
<div class="pb do"><h4>Say Tanakh, not Old Testament</h4><p>Old implies replaced, and supersession is the theology behind the history. Small words carry weight here. Tanakh. Yeshua, if it comes naturally. The Hebrew Scriptures. They signal that you know whose book you are holding.</p></div>
<div class="pb do"><h4>Concede what is genuinely contested</h4><p>Isaiah 7:14 is weaker than most Christians are taught. Psalm 22:16 has a real textual question. The seventy weeks of Daniel have several defensible arithmetics. Say so before anyone pushes you. That is what buys credit for Isaiah 53, for the terminus in Daniel and for Yoma 39b.</p></div>
<div class="pb do"><h4>Let Romans 11 set your posture</h4><p>It is not a courtesy. It is a command. God has not cast away his people. The Gentile branch is grafted in and told plainly not to boast against the root. A Christian who holds that verse cannot patronise a Jewish friend.</p></div>
<div class="pb dont"><h4>Never say the Jews killed Jesus</h4><p>The deicide charge is the engine behind a thousand years of massacre. It is also bad theology. A Roman prefect ordered the execution, and the New Testament puts the responsibility on all of us. If that phrase is in your vocabulary, take it out for good.</p></div>
<div class="pb dont"><h4>Never quote-mine the Talmud</h4><p>Most viral Talmud quotations are invented, mistranslated, or stripped of a context that reverses them. They come straight down from medieval disputation propaganda. If you cannot read the passage in context on Sefaria, do not use it.</p></div>
<div class="pb dont"><h4>Not the works-righteousness caricature</h4><p>Second Temple Judaism was a covenant religion with obligations. It was not a merit ledger. Saying otherwise tells your friend you have never asked them what they believe. So ask. You will learn something, and you will be trusted with the answer.</p></div>
</div>

<div class="pb-h">The part that takes years</div>
<div class="saybox"><span class="who">You, later</span><p>"You are not a project to me. If you never agree with me about this, we are still going to be friends in twenty years."</p></div>
<p>Mean it, because they will test it. Pressure here does not read as urgency. It reads as the thing their grandparents fled.</p>
<p>There is also a cost you should understand before you speak. For many Jewish families, a child who follows Yeshua is felt as a loss to the family and to the people. That is not stubbornness. It is grief, earned by history.</p>
<p>So go slowly and stay. The aim of any one conversation is only that another one would be welcome.</p>
<p>Ask about their family, their festivals and what they actually keep. Most Christians never do, and the asking is not a strategy. It is friendship.</p>
<p>Romans 11 is the check on all of this. The branch grafted in is warned in the same breath not to boast against the root.</p>
<p>Read that verse often enough and the tone looks after itself.</p>
<p>One more thing is worth saying out loud at some point. You are not asking anyone to leave their people.</p>
<p>Say that you know what it would cost, and that you would not think less of them for never agreeing with you.</p>
<p>Then drop it and talk about something else. The mark of a friendship is that it has other subjects.</p>
<p>If a conversation ever ends badly, go back and apologise for the tone rather than the content. It is almost always the tone that did the damage.</p>
<p>None of this is a method for producing a result. It is how you behave when you believe something and you also love the person you are talking to.</p>
<p>If that sounds slow, it is. It is also the only version of this that has ever been worth anything.</p>

<div class="pb-h">How it actually goes</div>
<p class="sh-open">Targum Jonathan opens Isaiah 52:13 like this. <i>Behold, my servant the Messiah shall prosper.</i></p>
<p class="sh-att">— an ancient Jewish rendering, read aloud in synagogues, long before there was an argument to win</p>

<div class="sa"><h4 class="sat">The five questions that do the most work</h4>
<ol class="sh-list">
<li><b>"How do you read Sukkah 52a on the two Messiahs?"</b> The two-Messiah teaching already concedes the two portraits, the suffering one and the reigning one. You are not disputing their tradition. You are asking why one figure coming twice is harder to believe than two figures coming once.</li>
<li><b>"Daniel says an anointed one is cut off before the sanctuary is destroyed. Who was that?"</b> The sequence has a terminus and the terminus has passed. Skip the arithmetic of the weeks, which can be argued several ways. The order of the events is the whole argument.</li>
<li><b>"Leviticus 17:11 grounds atonement in blood on an altar. What grounds it now?"</b> Ask it once, gently, and then stop. Judaism has had to answer that for nineteen centuries without the altar the verse names. Yoma 39b records forty years of failed signs before the temple fell.</li>
<li><b>"Who is the new covenant of Jeremiah 31 made with?"</b> Israel and Judah, by name. The phrase is not a Christian import. It is the promise of a Jewish prophet, and it dissolves the idea that you invented a new religion before that idea can form.</li>
<li><b>"What would the Messiah have to be for you to look again?"</b> Ask it because you want the answer. It also invites the same question back at you, which is fair, and answering it honestly is worth more than any verse you could produce.</li>
</ol></div>

<div class="sa"><h4 class="sat">Start here</h4>
<p class="pd">The servant path walks Isaiah 53 through the Targum and the Talmud. It is the one argument built entirely from their own library. Every case page ends with a suggested question and a scripted back-and-forth, with the counter-missionary reply included.</p>
<button class="start" data-goto-path="servant">Open the servant path →</button></div>${DATA.some(d=>d.avoid)?`<div class="pb-h" style="margin-top:30px">Arguments that will embarrass you — do not use these</div><p class="pd" style="font-size:.8rem;margin:0 0 10px">Popular claims that are false or overclaimed. Each links to the correction — repeating them hands the other side an easy win and discredits your true arguments.</p><div class="relrow">${DATA.filter(d=>d.avoid).map(d=>`<button data-open="${d.id}">⚠ ${esc(d.title)}</button>`).join("")}</div>`:""}`;

}

const PROOFS=[{"v":"Numbers 23:19 / Hosea 11:9","they":"'God is not a man, that he should lie' — 'I am God and not a man, the Holy One in your midst.' The incarnation is flatly excluded: whatever God is, he is not a man, and no Jew may believe otherwise.","you":"Both verses are about God's character — he doesn't lie, waver, or rage like men do — not about what God is unable to do. The Tanakh itself shows YHWH appearing as a man: he eats with Abraham at Mamre (Gen 18), wrestles Jacob who says 'I have seen God face to face' (Gen 32), and sends the angel in whom 'my Name is' (Ex 23:21). The claim was never that a man became God — it's that the God of Israel entered his own creation, which Hosea's 'in your midst' sits closer to than you'd expect.","refs":"Genesis 18:1-15 · Genesis 32:24-30 · Exodus 23:20-21 · Zechariah 12:10"},{"v":"Deuteronomy 6:4","they":"'Hear, O Israel: the LORD our God, the LORD is one.' The Shema is Judaism's heartbeat, and the Trinity breaks it. Three persons is three gods with extra steps — Maimonides made absolute, indivisible unity a principle of the faith.","you":"Christians affirm the Shema — Yeshua himself quoted it verbatim as the greatest commandment (Mark 12:29). Echad can name a composite unity ('one flesh,' Gen 2:24; 'one cluster,' Num 13:23), though that alone proves nothing. What the Tanakh does carry are unresolved seams — 'let us make man' (Gen 1:26), 'the Lord GOD has sent me, and his Spirit' (Isa 48:16), 'what is his name, and what is his son's name?' (Prov 30:4). Not proofs — concede that — but cracks in the claim that the text is unitarian by definition. Trinity is a claim about the inner life of the one YHWH, not a roster of gods.","refs":"Genesis 1:26 · Genesis 2:24 · Isaiah 48:16 · Proverbs 30:4"},{"v":"Ezekiel 18:20 / Deuteronomy 24:16","they":"'The soul who sins shall die. The son shall not bear the iniquity of the father.' 'Each shall be put to death for his own sin.' Vicarious atonement — an innocent dying for the guilty — is anti-Torah on its face.","you":"Ezekiel 18 answers a proverb about inherited guilt ('the fathers ate sour grapes...'), and Deut 24:16 governs human courts — neither repeals the sacrificial system, which is voluntary substitution from end to end: hands pressed on the scapegoat's head, 'and the goat shall bear all their iniquities' (Lev 16:22); blood given by God 'to make atonement for your souls' (Lev 17:11). The line the Torah draws is between punishing an unwilling bystander and accepting a willing offering. Isaiah 53:10 puts the servant on the offering side: his soul is made an asham — a guilt offering — and he 'poured out his soul to death' himself.","refs":"Leviticus 16:21-22 · Leviticus 17:11 · Isaiah 53:10-12 · Ezekiel 18:2-4"},{"v":"Isaiah 43:11","they":"'I, I am the LORD, and besides me there is no savior.' Salvation belongs to God alone. Trusting a man named Jesus for salvation is, by this verse, idolatry by definition.","you":"Total agreement: no one but YHWH saves. That is precisely the Christian claim — Yeshua's name means 'YHWH saves,' and the NT applies Isaiah's own exclusive language ('to me every knee shall bow,' Isa 45:23) to him not as a second deity but as YHWH's own arm revealed (Isa 53:1). Either that identification is true, or Christianity is idolatry — this verse doesn't settle the question; it frames it exactly right. The dispute was never whether God alone saves, but whether God did it himself, in person.","refs":"Isaiah 45:21-23 · Isaiah 53:1 · Joel 2:32 · Zechariah 14:9"},{"v":"Deuteronomy 13:1-5","they":"The prophet who works real signs and then says 'let us go after other gods' must be rejected — miracles included. This is the Torah's standing verdict on Jesus: whatever he did, worship of him leads Israel after a god our fathers did not know.","you":"Honor the test — it's the right one. But its hinge is 'gods your fathers have not known,' and that's the entire dispute: Yeshua's first followers were Shema-praying, temple-attending Jews who claimed he was the God of Abraham's own arm, not a new god. Deut 13 rightly condemns every paganized Christ Christendom ever built; what it can't do is adjudicate the identity question by itself. Deut 18:15-19's true-prophet test — the prophet like Moses whom Israel must hear — has to be run alongside it.","refs":"Deuteronomy 18:15-19 · Isaiah 53:1 · Exodus 3:15"},{"v":"Psalm 146:3","they":"'Put not your trust in princes, in a son of man, in whom there is no salvation.' The psalmist could not be clearer: staking your soul on any human being — any son of man — is exactly what our scriptures forbid.","you":"Read the next verse: 'his breath departs, he returns to the earth; on that very day his plans perish.' The warning is against trusting what dies and stays dead — mortal power. The Christian claim is resurrection: a Messiah whose death did not hold him (Ps 16:10, 'you will not abandon my soul to Sheol'). And the Tanakh itself presents one 'like a son of man' coming with the clouds who receives everlasting dominion and the service of all peoples (Dan 7:13-14) — and a king in Psalm 2 whom the nations are told to serve, though the 'kiss the son' reading there is text-critically contested and shouldn't be leaned on alone.","refs":"Psalm 146:4 · Daniel 7:13-14 · Psalm 16:10 · Psalm 2:6-12"}];

const THEYSAY=[{"say":"Jews don't believe in Jesus — that's basically the one thing all Jews agree on.","quick":"Modern consensus, yes — but the first generation of Jesus-followers was entirely Jewish, arguing from Tanakh in synagogues. The question was born inside Judaism, not imported into it.","id":"nt-jewishness"},{"say":"The Messiah brings world peace. Look around — did he come?","quick":"That's one of the Tanakh's two portraits. The other is a king 'lowly, riding on a donkey' who is 'pierced' and mourned. The rabbis felt the tension so sharply they posited two Messiahs.","id":"two-messiahs-rabbinic"},{"say":"Isaiah 53 is about Israel, not Jesus. Read chapter 41 — the servant is named Israel.","quick":"The national reading is real — but Targum Jonathan opens the passage 'my servant the Messiah,' Sanhedrin 98b names Messiah from 53:4, and 53:8 says the servant is stricken 'for the transgression of my people' — someone distinct from the people.","id":"isaiah-53-servant"},{"say":"Christians mistranslate our scriptures. Almah means young woman, not virgin.","quick":"Concede it: almah is 'young woman'; betulah is the technical term. But the pre-Christian Jewish translators of the Septuagint chose parthenos — 'virgin' — centuries before Matthew was born.","id":"isaiah-7-14-almah"},{"say":"God is not a man — Numbers 23:19. That ends the conversation.","quick":"In context it means God doesn't lie or waver. The Tanakh itself shows YHWH appearing in human form — eating with Abraham (Gen 18), wrestling Jacob (Gen 32) — and in Zechariah 12:10 YHWH says 'they will look on ME whom they pierced.'","id":"zechariah-pierced"},{"say":"We don't need a middleman. We repent directly to God.","quick":"The Torah's own system was all mediation — priests, altar, blood, Yom Kippur. Leviticus 17:11 says God gave blood to make atonement. The real question is what replaced that in 70 CE, and on whose authority.","id":"temple-atonement-problem"},{"say":"For a Jew, Christianity is idolatry. Worshiping a man is the one unforgivable line.","quick":"If Yeshua is merely a man, agreed — full stop. The dispute isn't whether idolatry is evil; it's whether the pierced one of Zechariah 12:10, whom YHWH calls 'me,' is a second god or the God of Israel come near.","id":"nt-jewishness"},{"say":"After the Holocaust, how can you possibly ask Jews to convert?","quick":"No glib answer exists. Own the history first, unprompted. Then gently separate baptized Europe's crimes from a first-century Jewish claim made by Jews, from Jewish scripture, before Christendom existed to sin.","id":"nt-jewishness"},{"say":"My family would sit shiva for me. You're asking me to die to my people.","quick":"Take it at face value — the cost is real, even where the practice has softened. Never minimize it. The counter-claim isn't 'leave your people'; it's that following Israel's Messiah is the most Jewish thing a Jew can do.","id":"nt-jewishness"},{"say":"Jesus didn't fulfill the prophecies — no third temple, no ingathering, no peace.","quick":"Those belong to the reigning-king portrait, still outstanding — Christians agree. But the suffering portrait (Zech 9:9, 12:10; Isa 53; Ps 22) plus Daniel 9's timestamp had a deadline before 70 CE. Two portraits, one Messiah, two acts.","id":"second-temple-expectation"},{"say":"The virgin birth is recycled paganism — gods impregnating women.","quick":"The pagan stories are lust narratives with demigod offspring. Isaiah's sign and Matthew's account have no divine consort and arise in the most anti-pagan milieu in antiquity. And the LXX's parthenos is a Jewish reading, pre-Christian.","id":"isaiah-7-14-almah"},{"say":"You can't use the New Testament to prove the New Testament.","quick":"Agreed — so don't. The case runs on Tanakh alone: Isaiah 53, Daniel 9, Zechariah 9 and 12, Psalm 22, Genesis 49. The NT then enters as first-century Jewish testimony to be tested against those texts, not as the premise.","id":"daniel-9-seventy-weeks"},{"say":"You quote our Talmud when it suits you — Yoma 39b is aggadah, not history.","quick":"Fair hit. Hold it loosely: not proof, but the tradition's own memory that the Yom Kippur signs went dark for the final forty years before the destruction — starting, on its own math, around 30 CE.","id":"yoma-39b-crimson-thread"},{"say":"Genesis 49:10 is deathbed poetry, not a messianic countdown.","quick":"Targum Onkelos didn't think so — it renders 'until Shiloh comes' as 'until Messiah comes, to whom the kingdom belongs.' The question isn't a stopwatch; it's where Judah's scepter-story was heading, and when it bent.","id":"genesis-49-scepter"},{"say":"Jeremiah's new covenant is the same Torah with a new heart — nothing about a new mediator.","quick":"Torah internalized, yes — but Jeremiah says 'NOT like the covenant I made with their fathers' (31:32), and it ends in forgiveness so final that sin is 'remembered no more.' New in kind, and the mechanism question hangs over verse 34.","id":"jeremiah-new-covenant"},{"say":"Psalm 22 says 'like a lion,' not 'they pierced' — Christians doctored the text.","quick":"The Masoretic Text reads ka'ari ('like a lion' — which leaves the clause verbless). The Nahal Hever scroll appears to read ka'aru ('they dug/pierced') and the pre-Christian Septuagint already read a verb. Genuinely contested — say so — and the psalm's crucifixion-shaped picture stands on far more than one word.","id":"psalm-22-pierced"}];
const LESSONS=[{"n":1,"t":"Earn the right to speak","what":["Before any verse, name what 'Christian' has meant to Jewish families — unprompted: the Rhineland massacres of 1096, the blood libel born at Norwich in 1144, expulsions from England (1290) and Spain (1492), forced disputations and Talmud burnings, Luther's 1543 'On the Jews and Their Lies,' and a Holocaust incubated in baptized Europe. Carry this history so they never have to explain it to you. Nothing else you say will land until this is on the table honestly."],"ask":"What has the word 'Christian' meant in your family's story?","ids":["nt-jewishness"]},{"n":2,"t":"Find the shared text","what":["Move the conversation onto ground you both accept: the Tanakh, in their canon and their categories — Torah, Nevi'im, Ketuvim; Mashiach ben David; teshuvah; olam haba. No New Testament on the table yet, no proof-texting — whole chapters, read together. A Christian who has actually read Torah (even the weekly parashah) changes the entire register of the conversation."],"ask":"Would you study the Prophets with me — just the Tanakh, nothing of mine on the table?","ids":["isaiah-53-servant","genesis-49-scepter"]},{"n":3,"t":"The two portraits problem","what":["The Tanakh draws the Messiah twice: a reigning son of David with the nations at peace (Isa 2, 11; Dan 7) — and a figure lowly on a donkey (Zech 9:9), pierced and mourned like an only son (Zech 12:10), despised, rejected, and crushed (Isa 53; Ps 22). The rabbis saw both portraits too: their solution was two Messiahs — ben Joseph who dies in battle (Sukkah 52a, citing Zech 12:10) and ben David who reigns. The Christian claim is simpler arithmetic: one Messiah, two acts."],"ask":"What in the text forced the rabbis to invent a Messiah who dies?","ids":["two-messiahs-rabbinic","zechariah-pierced"]},{"n":4,"t":"The timing problem","what":["Daniel 9:26 puts an anointed one 'cut off' BEFORE the people of a coming prince destroy the city and the sanctuary — before 70 CE. Genesis 49:10 keeps the scepter in Judah 'until Shiloh comes,' which Targum Onkelos reads as Messiah. And Yoma 39b preserves the tradition's own memory that for the final forty years before the destruction — from about 30 CE — the Yom Kippur lot stopped coming up in the right hand and the crimson thread stopped turning white. Whoever the Messiah is, the window the shared text draws is behind us."],"ask":"If an anointed one had to be cut off before the Second Temple fell — who was it?","ids":["daniel-9-seventy-weeks","yoma-39b-crimson-thread","genesis-49-scepter","second-temple-expectation"]},{"n":5,"t":"The atonement question","what":["Leviticus 17:11 is God's own stated mechanism: 'the life of the flesh is in the blood, and I have given it to you on the altar to make atonement for your souls.' Yom Kippur was the system's heart. Since 70 CE, rabbinic Judaism has substituted repentance, prayer, and tzedakah (Hosea 14:2; Yohanan ben Zakkai in Avot d'Rabbi Natan 4) — a pastoral answer given in catastrophe, but one the Torah itself is never recorded giving. Ask it as an honest question, not a gotcha; this is the ache Yom Kippur itself carries."],"ask":"On Yom Kippur, what carries your sins now — and where does the Torah say that suffices?","ids":["temple-atonement-problem","jeremiah-new-covenant"]},{"n":6,"t":"The invitation","what":["The famous move: read Isaiah 52:13–53:12 aloud together without saying where it's from, and let them tell you it sounds like the New Testament — then show them it's Isaiah, from their own scroll, centuries before Yeshua. Then one invitation, transparent about what you're asking: read the Gospel of Matthew — the most Jewish of the four, opening with a toledot from Abraham, structured around Torah, fluent in fulfillment. Not a scalp. An open book, one chapter a week, and they hold you accountable to their text."],"ask":"Read Matthew with me as a Jewish book — one chapter a week, and you keep me honest?","ids":["isaiah-53-servant","nt-jewishness"]}];
