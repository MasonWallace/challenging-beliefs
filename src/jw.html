function renderTimeline(){
  const read=store.read;
  $("#main").innerHTML=`<div class="viewhead"><h2>${"The record, in "+["no","one","two","three","four","five","six"][Math.min(6,TLACTS.length)]+" act"+(TLACTS.length===1?"":"s")}</h2>
  <p>What was published on the left; what actually happened on the right. Red years mark the turning points. Click an act to open it — your reading progress fills each meter.</p></div>
  <div class="chs">${TLACTS.map((a,i)=>{
    const linked=a.events.filter(e=>e.id);
    const done=linked.filter(e=>read.has(e.id)).length;
    return `<button class="ch ${state.act===i?"on":""}" data-act="${i}"><span class="n">${a.num}</span><span class="range">${a.range}</span><h4>${a.name}</h4><p>${a.desc} · ${a.events.length} events</p><div class="meter"><i style="width:${linked.length?Math.round(done/linked.length*100):0}%"></i></div></button>`;
  }).join("")}</div>
  ${state.act!=null&&TLACTS[state.act]?actHtml(TLACTS[state.act]):`<p class="tlhint">Select an act to open its record.</p>`}`;
  function actHtml(a){
    return `<div class="chopen"><h4>Act ${a.num} · ${a.name} (${a.range})</h4>
    <div class="cvr"><div class="hh claims">What was claimed</div><div></div><div class="hh record">What the record shows</div>
    ${a.events.map(e=>{
      const bubble=`<div class="bubble ${e.side==="claim"?"claim":"rec"}${e.crit?" crit":""}${e.id&&store.read.has(e.id)?" done":""}">${e.id&&IMGMAP[e.id]?`<img class="ebthumb" src="${IMGMAP[e.id].src}" loading="lazy">`:""}${e.crit?`<span class="tpx">★ turning point</span>`:""}${e.id&&store.read.has(e.id)?`<span class="donechip">✓ read</span>`:""}<h4>${esc(e.t)}</h4><p>${esc(e.p)} ${e.id&&byId[e.id]?`<button class="jump" data-open="${e.id}">→ open the case</button>`:""}</p></div>`;
      return `<div class="cell">${e.side==="claim"?bubble:""}</div><div class="mid"><div class="yr2 ${e.crit?"critY":""}">${e.y}</div></div><div class="cell">${e.side==="record"?bubble:""}</div>`;
    }).join("")}</div></div>`;
  }
  document.querySelectorAll(".ch").forEach(b=>b.addEventListener("click",()=>{const i=+b.dataset.act;state.act=state.act===i?null:i;renderTimeline();}));
  document.querySelectorAll(".jump").forEach(b=>b.addEventListener("click",()=>openCase(b.dataset.open)));
}

/* ---------- glossary ---------- */
function renderGlossary(){
  $("#main").innerHTML=`<div class="viewhead"><h2>Word guide</h2><p>${GLOSSARY.length} terms this subject runs on, in plain English — names, books, sources and technical vocabulary. Every one of them is underlined with a dotted line wherever it appears in a case; hover or tap it there for the definition without leaving the page.</p></div><details class="primer" open><summary>New here? The story in ninety seconds</summary><div class="primerbody"><p><b>In 1879 a Pittsburgh haberdasher named Charles Taze Russell began publishing a magazine called <i>Zion's Watch Tower</i>.</b> He taught that Christ had already returned invisibly — in 1874 — and that 1914 would bring the end of the present world order. When 1914 came and brought a world war instead of Armageddon, the date was kept and its meaning was changed: it now marked Christ's invisible enthronement rather than the end.</p>
    <p>His successor <b>Joseph Rutherford</b>, a lawyer, took control after Russell's death in 1916, gave the movement its name in 1931, predicted the resurrection of Abraham, Isaac and Jacob by 1925, and built <b>Beth Sarim</b>, a San Diego mansion deeded to them. Later leaders added 1975. Each failure was absorbed rather than admitted.</p>
    <p><b>The chain that holds everything together runs 607 → 1914 → 1919 → the Governing Body.</b> The organization dates Jerusalem's destruction to 607 BC, adds 2,520 years to reach 1914, and teaches that in 1919 Christ inspected all religions and appointed the Watch Tower Society over his belongings. That appointment is the basis of the Governing Body's authority — and therefore of the blood doctrine, the shunning policy, and the obligation to accept every future adjustment.</p>
    <p>Along the way the organization produced its own Bible, the <b>New World Translation</b>, from an anonymous committee. Names and terms in dotted underline can be hovered anywhere for a definition.</p></div></details>
  <div class="gaccord">${GLOSSARY.map(g=>`<div class="gitem"><b>${esc(g.t)}</b><p>${g.d}</p></div>`).join("")}</div>`;
}

/* ---------- the heart of it ---------- */
function renderCore(){
  const link=id=>byId[id]?`<button class="corelink" data-open="${id}">${esc(byId[id].title)} →</button>`:"";
  $("#main").innerHTML=`<div class="viewhead"><h2>The heart of it: one date holds up everything else</h2>
  <p>If you read nothing else on this site, read this page. Nearly every distinctive Jehovah's Witness doctrine is suspended from a single chain of four links — and the first link is a date that no historian, and no verse, supports.</p></div><figure class="corehero"><img src="https://commons.wikimedia.org/wiki/Special:FilePath/Jehovah's%20witnesses%20Kingdom%20Hall%20Hong%20Kong.png?width=900" loading="lazy" alt=""><figcaption>A Kingdom Hall. Two meetings a week, no cross, and — for most of the people inside — a hope that depends on one date.</figcaption></figure>
  <div class="corebox"><h3>1 · The chain</h3>
  <p><b>607 BC → 1914 → 1919 → the Governing Body.</b> The organization teaches that Jerusalem fell in 607 BC; that 2,520 years from 607 lands on 1914; that Christ returned invisibly in 1914, inspected all religions, and in 1919 appointed the Watchtower Society over his belongings. That 1919 appointment is the entire basis for the Governing Body's authority — and therefore for the blood doctrine, the shunning policy, the two-class salvation system, and the obligation to accept every future adjustment.</p>
  <p>Pull the first link and the whole chain is on the floor. That is why this is the only page you have to read.</p>
  <details class="srcdet"><summary>Open the cases behind this</summary><div class="corelinks" style="margin-top:12px">${link("chron-607-vs-587")}${link("auth-fds-2012-governing-body")}</div></details></div>

  <div class="corebox"><h3>2 · 607 is not in the Bible, and it is not in the ground</h3>
  <p>No verse gives the year. 607 is produced by taking 537 BC — the return from exile — and subtracting the seventy years of Jeremiah 25. Every other line of evidence disagrees: Babylonian business tablets, astronomical diaries dated by eclipses and planetary positions, king lists, and synchronisms with Egyptian and Assyrian records all place the fall of Jerusalem at <b>587/586 BC</b>, twenty years later. There is no scholar of the Neo-Babylonian period defending 607.</p>
  <p>In 1977 a Swedish elder named Carl Olof Jonsson submitted a careful study of exactly this to headquarters. He was disfellowshipped. His research has still never been answered.</p>
  <details class="srcdet"><summary>Open the cases behind this</summary><div class="corelinks" style="margin-top:12px">${link("chron-607-vs-587")}${link("chron-jonsson-gentile-times")}${link("chron-70-years-servitude")}</div></details></div>

  <div class="corebox"><h3>3 · 1914 was not the original claim</h3>
  <p>This is the part almost no Witness has been told. Until 1943 the organization taught that Christ's invisible presence began in <b>1874</b>, not 1914 — and 1914 was published as the year the world would <i>end</i>: <i>“the battle of the great day of God Almighty… will end in A.D. 1914 with the complete overthrow of earth's present rulership”</i> (1889). When 1914 came and the world did not end, the date was kept and its meaning was replaced. A prediction that failed became a fulfilment.</p>
  <details class="srcdet"><summary>Open the cases behind this</summary><div class="corelinks" style="margin-top:12px">${link("dates-1874-1914-retrofit")}${link("dates-generation-1914-redefined")}</div></details></div>

  <div class="corebox"><h3>4 · The question that does the work</h3>
  <p>Do not argue Babylonian chronology at a doorstep. Ask one thing, kindly, and let it sit:</p>
  <p class="pullq">“Is the faithful and discreet slave inspired?”</p>
  <p>Their own publications answer no — the Governing Body has repeatedly said it is neither inspired nor infallible. Then the second question follows on its own: <b>if it isn't inspired, why does disagreeing with it cost me my family?</b> No date, no Greek, no history required. It is the question that has walked more Witnesses to the door than every chronology argument combined.</p>
  <details class="srcdet"><summary>Open the cases behind this</summary><div class="corelinks" style="margin-top:12px">${link("auth-prophet-paradox")}${link("shunning-mechanics-family")}</div></details></div>

  <div class="corebox"><h3>5 · And then the Jesus who is enough</h3>
  <p>Everything above only clears ground. The gospel is what you plant in it. A Witness has spent their life earning a place — hours, returns, studies, the hope of surviving Armageddon and then a thousand-year probation before life is finally secure. Nobody at the Kingdom Hall has ever told them that Jesus is not the archangel but the one at whose name every knee bows, that the Spirit is not a force but the Comforter who lives in them, or that the bread and cup at that Memorial were meant for <i>them</i>.</p>
  <p>Read John 20:28 with them, and 1 John 5:13 — <i>“that ye may know that ye have eternal life.”</i> Not hope. <b>Know.</b> That word is not in their vocabulary, and it is the whole reason to have this conversation at all.</p>
  <p><button class="corelink" data-goto="share">How to actually have this conversation →</button></p></div>`;
  $("#main").querySelectorAll(".corelink").forEach(b=>{if(b.dataset.open)b.addEventListener("click",()=>openCase(b.dataset.open));});
  const g=$("#main").querySelector("[data-goto]");
  if(g)g.addEventListener("click",()=>{state.view="share";render();});
}
function renderShare(){
  $("#main").innerHTML=`<div class="viewhead"><h2>Sharing Jesus with a Jehovah's Witness</h2>
  <p>Not to win the doorstep — to reach a person who has been taught that leaving costs them their mother. Built from the testimony of former Witnesses and from ministries that have done this for decades, with gentleness (2 Timothy 2:24–25).</p></div>
  <div class="pb-h">The invitation to work toward</div>
  <div class="saybox"><span class="who">You, once there is real trust</span><p>"Would you read the Gospel of John with me — just the two of us, in your Bible, no literature on either side?"</p></div>
  <p class="pd" style="font-size:.78rem;margin:0 0 4px">This is the ask everything builds to. Witnesses are trained to conduct a study, not to receive one; the offer to read Scripture together <i>as equals</i> is unlike anything in their week — and John is where the archangel doctrine quietly dies.</p>

  <div class="pb-h">What actually reaches a Witness — ranked by what ex-Witnesses report</div><div class="pb-grid">
  <div class="pb"><span class="num">1</span><h4>A Christian who is still there in a year</h4><p>The organization's strongest claim is that worldly friendships are shallow and conditional. A neighbor who keeps showing up, keeps being kind, and never once gloats disproves the doctrine without arguing against it. Almost every exit story has one such person in it. The single most common regret of ex-Witnesses is that nobody stayed.</p></div>
  <div class="pb"><span class="num">2</span><h4>Questions, never lectures</h4><p>Witnesses are drilled against arguments — every objection you know has a scripted counter in the <i>Reasoning</i> book. What they have no script for is a sincere question they cannot answer, asked by someone who obviously likes them. Ask, then let silence do the work. A question travels home with them; an argument does not.</p></div>
  <div class="pb"><span class="num">3</span><h4>Their own literature, in their own hands</h4><p>Never bring "apostate" material — the moment it appears you become a category, not a person. Instead ask them to look something up in their own library: the 1889 statement that 1914 would END the present order, Beth Sarim in the <i>Proclaimers</i> book, the pre-1971 rendering of Hebrews 1:6. Watchtower facts, found by a Witness, in a Watchtower publication, cannot be dismissed as apostate lies.</p></div>
  <div class="pb"><span class="num">4</span><h4>Assurance — the thing they have never once been offered</h4><p>Ask, "Do you know you have eternal life?" They cannot say yes; the honest answer is a hope conditioned on the organization, Armageddon, and a thousand-year probation. Then read 1 John 5:13 in their Bible: <i>"that ye may know that ye have eternal life."</i> Many former Witnesses date the beginning of their exit to that one verse.</p></div>
  </div>

  <div class="pb-h">The method</div><div class="pb-grid">
  <div class="pb do"><h4>Use their Bible, always</h4><p>Everything on this site can be shown in the New World Translation. Reaching for your own translation lets them file the conversation under "he doesn't trust our Bible" and stop listening. John 20:28, 1 Timothy 2:5, 1 John 5:13, Hebrews 1:6 — all of it works in theirs. Where the NWT differs, don't accuse: ask what Greek word is behind it, and ask them to check the Kingdom Interlinear.</p></div>
  <div class="pb do"><h4>Name the cost out loud, early</h4><p>"I know that if you ended up agreeing with me, it could cost you your family. I'm not asking you to pay that today." Saying it aloud does two things: it proves you understand their world, and it quietly puts the shunning policy on the table as a thing that needs explaining. Nothing else you say will land until they believe you know what you are asking.</p></div>
  <div class="pb do"><h4>One question, then change the subject</h4><p>The doorstep is a poor classroom, and a Witness who feels cornered will not return. Plant one thing, be genuinely warm, and let them leave wanting to come back. The people who reach Witnesses are almost never the people who won the first conversation — they are the ones who got a second, and a tenth.</p></div>
  <div class="pb dont"><h4>Never mock the organization to their face</h4><p>To them the Governing Body is God's channel and the Kingdom Hall is their entire community, calendar, and family. Contempt for it reads as contempt for them, confirms exactly what they have been warned about "opposers," and ends the relationship. Honest questions about the organization are fair; sneering never is.</p></div>
  <div class="pb dont"><h4>Don't open with blood, holidays, or 607</h4><p>Blood is their identity and their martyrdom; holidays are trivial; 607 is a research project. Opening on any of them wastes the one conversation you may get. Start with who Jesus is and whether they can know they are saved — the two doors that lead somewhere.</p></div>
  <div class="pb dont"><h4>Don't try to finish it in one sitting</h4><p>Nobody leaves a high-control group in an afternoon; the typical exit takes years and runs through dozens of small doubts. Your job is to be one of them, and to be the safe person they remember when the doubt finally arrives. Play a long game or don't play.</p></div>
  </div>

  <div class="pb-h" style="margin-top:34px">How it actually goes — the deeper craft</div>
  <p class="sh-open">Every distinctive doctrine they hold arrives through <span class="hl">one channel</span> — and their own publications say that channel is not inspired.</p>
  <p class="sh-att">— the paradox at the centre of every conversation on this site</p>

  <div class="sa"><h4 class="sat">The four questions that do the most work</h4>
  <ol class="sh-list">
    <li><b style="color:var(--ink)">"Is the faithful and discreet slave inspired?"</b> Their publications answer no. Then, gently: <i>if it isn't inspired, why is disagreeing with it grounds for losing my family?</i> No history, no Greek, no chronology needed — and no scripted answer exists.</li>
    <li><b style="color:var(--ink)">"Do you know you have eternal life?"</b> Read 1 John 5:13 in their Bible and let the word <i>know</i> sit there. Their whole system is built on hope conditioned on performance; assurance is the one thing the Kingdom Hall cannot give.</li>
    <li><b style="color:var(--ink)">"Jesus said 'drink ye all of it' — why did you pass the cup?"</b> Ask it after the Memorial, when they have just watched the emblems go by untouched. 1 Timothy 2:5 follows naturally: <i>is Christ your mediator, or only theirs?</i></li>
    <li><b style="color:var(--ink)">"What did Jesus say when Thomas called him 'my Lord and my God'?"</b> He accepted it. Then Hebrews 1:6 — and the question of what that verse said before 1971. Two verses, both in their Bible, and the archangel doctrine has nowhere left to stand.</li>
  </ol></div>

  <div class="sa"><h4 class="sat">If they are already doubting</h4>
  <p class="pd">A Witness who has begun to doubt is in real danger — of losing their marriage, their parents, their entire social world at once. Do not celebrate, do not push, and do not tell anyone. Offer three things: that you will still be there whatever they decide, that they can ask you anything without it becoming a project, and that the God of the Bible is not the God of the audit. Point them to ex-Witness support communities for the practical side; you carry the gospel side.</p></div>

  <div class="sa"><h4 class="sat">Start here</h4>
  <p class="pd">The <b>foundation path</b> walks the one chain everything else hangs from; every case page ends with a suggested question and a scripted back-and-forth ("How the conversation usually goes") so you are ready for the counter-moves.</p>
  <button class="start" data-goto-path="foundation">Open the foundation path →</button></div>${DATA.some(d=>d.avoid)?`<div class="pb-h" style="margin-top:30px">Arguments that will embarrass you — do not use these</div><p class="pd" style="font-size:.8rem;margin:0 0 10px">Popular claims that are false or overclaimed. Each links to the correction — repeating them hands the other side an easy win and discredits your true arguments.</p><div class="relrow">${DATA.filter(d=>d.avoid).map(d=>`<button data-open="${d.id}">⚠ ${esc(d.title)}</button>`).join("")}</div>`:""}`;
  const b=$("#main").querySelector("[data-goto-path]");
  if(b)b.addEventListener("click",()=>{const p=PATHS.find(x=>x.id===b.dataset.gotoPath);if(!p)return;state.pathId=p.id;const read=store.read;const next=p.items.find(i=>!read.has(i))||p.items[0];openCase(next,true);});
  bindOpens();
}

const PROOFS=[{"v":"John 14:28 — 'the Father is greater than I'","they":"Jesus plainly says the Father is greater, so Jesus cannot be God or equal to him.","you":"'Greater' describes position, not nature — a king is greater than his ambassador without being more human. Jesus speaks during his voluntary humbling, having 'emptied himself' to become man (Philippians 2:6-7), and the same Gospel opens with 'the Word was God' and closes with Thomas saying 'my Lord and my God' — unrebuked. The verse compares the Son on earth with the Father in glory, which is why Jesus is talking about *returning* to that glory (John 17:5).","refs":"John 1:1-3 · John 17:5 · John 20:28 · Philippians 2:6-11 · Hebrews 1:3"},{"v":"Colossians 1:15 — 'the firstborn of all creation'","they":"Firstborn means first-created: Jesus is God's first and greatest creature, who then made everything else.","you":"'Firstborn' (prototokos) is a title of rank: David, the youngest son, is 'appointed firstborn' (Psalm 89:27), and Israel is God's 'firstborn' among nations it didn't precede. The context settles it — 'ALL things were created in him... through him and for him' (v.16) and 'he is before all things' (v.17). The New World Translation had to insert the word 'other' four times ('all other things') — unbracketed in 1950, bracketed 1961-1984, unbracketed again in 2013 — because without it the passage teaches exactly what they deny.","refs":"Colossians 1:16-17 · Psalm 89:27 · Exodus 4:22 · John 1:3 · Hebrews 1:2"},{"v":"Revelation 7:4 — the 144,000","they":"Exactly 144,000 anointed ones go to heaven to rule with Christ; the 'great crowd' of verse 9 lives forever on earth.","you":"Read the whole passage: the 144,000 are also male virgins (14:4) from twelve named tribes of Israel — a list that oddly omits Dan and doubles Joseph, a signal of symbolism. Nobody takes the tribes, the maleness, or the celibacy literally; only the number, because the two-class system needs it. Meanwhile the great crowd stands 'before the throne' serving 'in his temple' (naos — the heavenly sanctuary, 7:15), and Revelation 19:1 explicitly locates 'a great crowd IN HEAVEN.'","refs":"Revelation 7:9,15 · Revelation 14:1-4 · Revelation 19:1 · John 10:16 · Ephesians 4:4 — one hope"},{"v":"Psalm 83:18 — 'whose name alone is JEHOVAH' (KJV)","they":"God's personal name is Jehovah, and true worshippers must use it — churches hid it.","you":"Using God's revealed name is wonderful — 'Jehovah' itself is a 16th-century hybrid of the Hebrew consonants YHWH with the vowels of 'Adonai,' so their 'restored' name is itself a later convention ('Yahweh' is closer). The decisive fact is the New Testament: not one of the 5,000+ Greek manuscripts contains the divine name, yet the NWT inserts 'Jehovah' 237 times — including Romans 10:13, where 'everyone who calls on the name of the Lord' quotes Joel about YHWH and applies it to *Jesus*. The apostles' inspired practice, not Christendom's conspiracy, is what the manuscripts preserve.","refs":"Romans 10:9-13 · Joel 2:32 · Philippians 2:9-11 · Acts 4:12"},{"v":"John 17:3 — 'taking in knowledge' (old NWT)","they":"Everlasting life depends on taking in accurate knowledge of Jehovah — which means studying with Jehovah's organization.","you":"The Greek verb ginōskō means to *know someone personally*, not to absorb information — which is why the Watchtower's own 2013 revision quietly changed it to 'their coming to know you.' For six decades the old rendering turned eternal life into a curriculum; the correction concedes the point: eternal life is a relationship, not a study program. Jesus says in the same Gospel, 'you refuse to come to ME that you may have life' (John 5:39-40).","refs":"John 5:39-40 · Matthew 7:22-23 — 'I never knew you' · Philippians 3:8-10 · NWT 2013 John 17:3"},{"v":"Acts 15:28-29 — 'abstain... from blood'","they":"God's law from Noah onward forbids taking blood into the body; transfusion is a modern way of consuming blood.","you":"The decree addresses eating blood — the issue in Genesis 9 and Leviticus 17 and the flashpoint of Jewish-Gentile table fellowship, the actual context of Acts 15. A transfusion no more 'eats' blood than a heart transplant eats a heart; blood transfused stays blood and functions as an organ. Their own position concedes incoherence: since June 2000, fractions of *every* blood component — hemoglobin included — are permitted as conscience matters. And Jesus' rule for ceremonial law versus human life is explicit: 'the Sabbath was made for man, not man for the Sabbath.'","refs":"Leviticus 17:10-12 — 'eats blood' · Mark 2:23-27 · Matthew 12:7 — 'mercy, not sacrifice' · Watchtower June 15, 2000 (fractions)"},{"v":"Daniel 4 — the 'seven times' and 1914","they":"The tree dream's 'seven times' prophetically equals 2,520 years from Jerusalem's fall in 607 BCE, ending in October 1914 when Christ was enthroned in heaven.","you":"Daniel 4 interprets itself: 'it is you, O king' (v.22) — Nebuchadnezzar's seven times of madness, fulfilled in his own lifetime (v.34-37), with no hint of a second fulfillment. The calculation needs five unstated moves: seven 'times' become 360-day years (2,520 days); a day-for-a-year rule imported from unrelated passages turns them into 2,520 years; the start date is set at 607 BCE, which every Babylonian chronology source (business tablets, the astronomical diary VAT 4956) and every historian contradicts — Jerusalem fell in 587/586; and the endpoint is an invisible event no one could verify. Tellingly, Russell inherited this same math from Nelson Barbour and preached 1914 as the END of earthly governments — when that failed, the date was kept and its meaning replaced.","refs":"Daniel 4:20-27, 34-37 · Acts 1:6-7 — 'not for you to know times' · Matthew 24:26 — inner rooms warning · 587/586 BCE scholarly consensus"}];

const THEYSAY=[{"say":"The Trinity is pagan — the word isn't even in the Bible.","quick":"Neither is 'theocracy,' 'Governing Body,' or 'Bible' itself — the question is whether the *idea* is there, and Thomas calls Jesus 'my Lord and my God' in John 20:28 without being corrected. **Ask what Jesus meant in John 5:23: that all should honor the Son just as they honor the Father.**","id":"nwt-john-1-1"},{"say":"Jesus is God's first creation — 'the firstborn of all creation.'","quick":"In Scripture 'firstborn' is a rank, not a birth order — David is appointed 'firstborn' as the youngest son (Psalm 89:27). **The very next verse says ALL things were created through him and FOR him — which is why the NWT had to insert the word 'other' four times.**","id":"colossians-other-inserted"},{"say":"Jesus died on a torture stake — the cross is a pagan symbol.","quick":"Whatever the wood's shape, John 20:25 says nails (plural) through his hands, which fits a crossbeam, and no doctrine hangs on it. **Ask why the shape of the instrument matters more than the One who died on it.**","id":"birthdays-holidays"},{"say":"God's name Jehovah was removed from the New Testament by Christendom.","quick":"There are over 5,000 ancient Greek New Testament manuscripts and not one contains the divine name — the NWT inserts 'Jehovah' 237 times with zero manuscript support. **The 'removal' theory asks you to believe God let his Word be corrupted — the exact thing Jesus denied in Matthew 24:35.**","id":"jehovah-inserted-nt"},{"say":"Only 144,000 go to heaven — everyone else lives forever on a paradise earth.","quick":"Revelation 7 also says they're male Jewish virgins from twelve named tribes — why is the number literal but everything else symbolic? **And Revelation 19:1 places the 'great crowd' IN heaven, standing before God's throne.**","id":"144000-two-classes"},{"say":"Christmas and birthdays are pagan celebrations.","quick":"Watchtower literature admits wedding rings likely have pagan roots yet allows them because present meaning is what counts — the same logic they refuse to apply to a child's birthday. **Ask why Romans 14:5-6 lets each Christian decide about days, but their organization decides for them.**","id":"birthdays-holidays"},{"say":"We're the only ones preaching the good news in all the earth.","quick":"Bible translators, missionaries, and churches were taking the gospel worldwide centuries before 1879, and still dwarf JW output today. **The real claim underneath is that only their organization counts — ask who decided that, and when.**","id":"faithful-discreet-slave"},{"say":"Look around — we're clearly living in the last days since 1914.","quick":"Their own founder taught 1914 would be the END of the world's rulership, not the start of invisible kingship — the date kept its prestige only by changing its meaning. **If the chronology behind 1914 rests on 607 BCE, why does every historian date Jerusalem's fall to 587?**","id":"chronology-607-1914"},{"say":"Jesus has been ruling invisibly from heaven since October 1914.","quick":"An invisible enthronement that nobody could observe was announced only after the visible predictions for 1914 failed. **Jesus warned about exactly this: 'If anyone says to you, Look! He is in the inner rooms — do not believe it' (Matthew 24:26).**","id":"russell-1914-end"},{"say":"Jerusalem was destroyed in 607 BCE — that's where the 2,520 years to 1914 start.","quick":"Every line of evidence — Babylonian business tablets, astronomical diaries like VAT 4956, and all modern scholarship — puts it at 587/586 BCE; 607 exists only because 1914 needs it. **Move the start date and 1914 evaporates, and with it the organization's claim to be appointed in 1919.**","id":"chronology-607-1914"},{"say":"The light gets brighter — Proverbs 4:18 explains why our understanding changes.","quick":"Light getting brighter reveals more of what was already true; it doesn't make organ transplants cannibalism in 1967 and acceptable in 1980, or the 'generation' mean five different things. **Ask gently: was it light from God when it was taught, or when it was reversed — because it can't be both.**","id":"light-gets-brighter-flipflops"},{"say":"The faithful and discreet slave provides our spiritual food at the proper time.","quick":"That's their name for the Governing Body, which teaches Jesus inspected all religions in 1919 and chose them — a claim with no evidence outside their own publications. **Ask what Jesus was inspecting: in 1919 they were still teaching the Great Pyramid measured the last days.**","id":"faithful-discreet-slave"},{"say":"The soul isn't immortal — the dead are conscious of nothing at all.","quick":"Ecclesiastes describes life 'under the sun,' but Jesus tells the thief 'today you will be with me in Paradise' and Paul calls departing to be 'with Christ' far better (Philippians 1:23). **Ask why Jesus warned about One who can destroy 'both soul AND body' if soul just means body (Matthew 10:28).**","id":"bodily-resurrection-denied"},{"say":"A God of love would never torture people in hellfire.","quick":"Agree that caricatures deserve rejection — then note Jesus spoke of final judgment more than anyone, and annihilation isn't obviously more loving than justice. **The deeper issue is that in their system Jesus' own resurrection wasn't bodily — ask what they do with 'destroy this temple and in three days I will raise it up... he was talking about the temple of his body' (John 2:19-21).**","id":"bodily-resurrection-denied"},{"say":"The holy spirit is God's active force, like electricity — not a person.","quick":"Electricity doesn't speak, teach, intercede, get grieved, or say 'set apart for me Barnabas and Saul' (Acts 13:2). **Ask who the 'he' is in John 16:13-14 who hears, speaks, and glorifies Jesus.**","id":"holy-spirit-active-force"},{"say":"Blood transfusion violates God's law — Acts 15 says abstain from blood.","quick":"Acts 15 addresses eating blood at the table, and their own policy now permits fractions of every blood component — hemoglobin included — which is incoherent if blood itself is sacredly off-limits. **Ask whether the Sabbath principle applies: 'the Sabbath was made for man, not man for the Sabbath' (Mark 2:27).**","id":"blood-transfusion-ban"},{"say":"Where were YOU taught the Bible? Someone had to teach you.","quick":"Fair question — and it cuts both ways, because every JW doctrine arrives through one publishing corporation that forbids checking it against outside scholarship. **The Beroeans were praised for verifying the apostle Paul against Scripture (Acts 17:11) — ask if they're allowed to do that to the Watchtower.**","id":"faithful-discreet-slave"},{"say":"Christendom's churches blessed both sides of the world wars.","quick":"Real failures happened and honest Christians grieve them — but the Watchtower quietly held associate NGO status with the United Nations from 1992 to 2001, the very 'wild beast' it damns others for touching. **Institutional hypocrisy is an argument against institutions claiming to be God's channel, not against Christ.**","id":"un-ngo-membership"},{"say":"Armageddon is right around the corner — this generation will not pass away.","quick":"That 'generation' has been redefined at least four times — people alive in 1914, then those who understood it, then since 2010 two overlapping lifespans that can stretch past the 2040s. **Ask what kind of promise survives by redefining its terms every time it fails.**","id":"overlapping-generations"},{"say":"Higher education is spiritually dangerous and shows lack of faith in the end coming soon.","quick":"Generations of young Witnesses skipped university for a paradise promised within their parents' lifetimes — a real cost paid for dates that failed. **Ask who bears the loss when the organization's timeline moves and your twenties don't come back.**","id":"higher-education-discouraged"},{"say":"We don't shun anyone — people are free to leave whenever they want.","quick":"Their own August 2024 Watchtower renamed disfellowshipping 'removal from the congregation' while instructing members not to associate with the removed — including family outside the household. **Ask softly: if you woke up doubting tomorrow, could you say so out loud without losing your mother?**","id":"disfellowshipping-shunning"},{"say":"The New World Translation is the most accurate Bible ever produced.","quick":"Its translation committee was anonymous, and the one identified member, Fred Franz, had no degree in biblical Greek or Hebrew; Greek scholars across the spectrum reject renderings like 'a god' in John 1:1. **Ask which published Greek grammarian, not affiliated with the Watchtower, endorses it.**","id":"nwt-john-1-1"}];
const LESSONS=[{"n":1,"t":"The contact — doorstep, cart, or 'informal witnessing'","what":["Goal is never conversation for its own sake: it's the 'return visit' — a reason to come back (a question left open, a piece of literature, a video on the tablet)","Cart witnessing is deliberately passive; publishers are trained to let you approach so the contact feels self-initiated","Everything said at this stage is scripted from the meeting workbook — objections you raise have pre-loaded answers","Success metric used to be hours logged; since November 2023 rank-and-file just tick a box, but pioneers still count every hour of this"],"ask":"I'd love to talk — **before we start, is there any question I could ask that would be allowed to change your mind?**","ids":["faithful-discreet-slave"]},{"n":2,"t":"The free home Bible study","what":["The current course is 'Enjoy Life Forever! — An Interactive Bible Course' (2021), 60 lessons with embedded JW.org videos","You study the book, not the Bible: each point cites verses, but the book supplies the interpretation and the questions","The Bible used is the New World Translation, so contested renderings (John 1:1, Colossians 1:16-17) arrive pre-settled","By design the study produces commitments along the way — attending a meeting, praying to 'Jehovah,' dropping holidays — before doctrine is examined critically"],"ask":"**Are we studying the Bible, or studying a book that tells me what the Bible means?** Could we do one session with just the Bible — any translation you like?","ids":["nwt-john-1-1","jehovah-inserted-nt","colossians-other-inserted"]},{"n":3,"t":"The meeting invitation — entering the social world","what":["Two weekly meetings (midweek 'Life and Ministry,' weekend public talk + Watchtower study) plus instant warmth: greeters, meal invitations, everyone knows your name","The welcome is real and it is also conditional — the friendship deepens exactly in step with your progress in the study","Answers at the Watchtower study are read from the paragraph just studied; independent commentary from the floor is not the format","This is where 'the truth' vocabulary starts: the congregation is 'the truth,' everything outside is 'the world'"],"ask":"Everyone here has been so kind — **would these friendships survive if I studied everything and concluded differently?**","ids":["disfellowshipping-shunning"]},{"n":4,"t":"Unbaptized publisher — behaving in before believing through","what":["You begin door-to-door work before baptism, after elders approve your conduct and doctrinal answers","Life conformity comes now: quit birthdays, holidays, church, voting, and often old friendships; dress and grooming expectations apply","Young people hear higher education framed as spiritually risky; pioneering is held up as the wise career","You are now publicly identified with the organization at doors — the psychological cost of leaving rises with every doorbell"],"ask":"**Why does the practice change come before the doctrine test?** In Acts, people examined the message first and were baptized on belief in Jesus, not after a probation of conduct.","ids":["birthdays-holidays","higher-education-discouraged"]},{"n":5,"t":"Baptism — vowing to the organization","what":["Candidates review dozens of questions with elders from 'Organized to Do Jehovah's Will' before approval","In 1985 the public baptism vow was changed: the second question now identifies you 'as one of Jehovah's Witnesses in association with God's spirit-directed organization' — the organization replaced the holy spirit in the formula (Watchtower, June 1, 1985); the 2019 revision still reads 'in association with Jehovah's organization'","That wording is legally and socially load-bearing: baptism is what makes you shunnable if you later leave","Most candidates are congregation children or study students at the emotional peak of belonging"],"ask":"Jesus said baptize in the name of the Father, the Son, and the holy spirit — **who edited the holy spirit out of the vow and put an organization in?**","ids":["faithful-discreet-slave","disfellowshipping-shunning"]},{"n":6,"t":"The publisher life — the treadmill","what":["Rhythm: two meetings weekly with preparation, field service, family worship evening, twice-yearly circuit assemblies and a three-day regional convention","Monthly activity report (a participation checkbox since November 2023 — for 103 years before that, hours); pioneers still log hour quotas","Standing is visible and graded: publisher, auxiliary pioneer, regular pioneer, ministerial servant, elder — and everyone knows who's 'irregular' or 'inactive'","Doubt has no safe outlet: questioning teachings aloud can become a judicial matter, so fatigue is performed as joy"],"ask":"**If you stopped reporting, attending, and knocking — what part of God's love for you would remain?** That answer tells you what the system believes about grace.","ids":["disfellowshipping-shunning","higher-education-discouraged"]}];

const KNOW={"didyouknow":[{"t":"The purple triangle","d":"In the Nazi camps Jehovah's Witnesses wore a purple triangle — and they were the only prisoners who could have walked out at any moment by signing a renunciation of their faith. Around 10,000 were imprisoned; roughly 1,500 died. Jewish survivors' memoirs repeatedly single them out as the prisoners least likely to inform and most likely to share food.","tip":"Say this before you say anything critical. It is true, it costs you nothing, and it disarms the persecution narrative that otherwise absorbs every question you ask."},{"t":"They wrote a chunk of American religious-liberty law","d":"Between 1938 and 1955 Jehovah's Witnesses took more than fifty cases to the US Supreme Court. West Virginia v. Barnette (1943) — no American can be compelled to salute a flag or profess a belief — is theirs, and so is Cantwell v. Connecticut (1940), which applied the Free Exercise Clause to the states.","tip":"Most Christians have no idea their own church's legal protection was largely litigated by Witnesses. Knowing it signals that you did the work."},{"t":"1914 was originally the END of the world, not the beginning of the end","d":"Russell taught that Armageddon would be OVER by 1914: 'the battle of the great day of God Almighty... will end in A.D. 1914 with the complete overthrow of earth's present rulership.' When 1914 brought a world war instead of the world's end, the date was recycled as Christ's invisible heavenly enthronement — the failure became the proof.","src":"C.T. Russell, The Time Is at Hand (1889)","id":"russell-1914-end"},{"t":"The Watchtower built a San Diego mansion for Abraham and King David","d":"Beth Sarim ('House of the Princes'), built 1929, was deeded in perpetual trust for the resurrected 'princes' — Abraham, Isaac, Jacob, David — expected imminently. Watch Tower president Rutherford lived and wintered there until his death in 1942. The patriarchs never arrived; the Society quietly sold the house in 1948.","src":"San Diego deed (1930); Wikipedia, 'Beth Sarim'","id":"millions-1925-beth-sarim"},{"t":"'Millions Now Living Will Never Die' — the 1925 prediction","d":"Rutherford's 1920 book declared 1925 'definitely settled by the Scriptures' for the return of the faithful patriarchs and the beginning of restoration. 1925 passed; Rutherford later admitted to Bethel staff he had 'made an ass of himself' over it. Many who sold homes and businesses were not reimbursed.","src":"J.F. Rutherford, Millions Now Living Will Never Die (1920)","id":"millions-1925-beth-sarim"},{"t":"The Great Pyramid of Giza was 'God's stone witness' — until it became Satan's","d":"For decades the Society taught the Great Pyramid's internal passages, measured in 'pyramid inches,' confirmed 1874 and 1914 chronology — Russell called it God's 'stone witness and prophet.' In 1928 Rutherford reversed course, declaring pyramid study inspired by Satan. A pyramid monument the Society erected still stands at its burial plot near Russell's grave in Pittsburgh (he's under a conventional marker beside it, contrary to folklore).","src":"Thy Kingdom Come (1891); Watchtower Nov 15 & Dec 1, 1928","id":"light-gets-brighter-flipflops"},{"t":"The Photo-Drama of Creation was a 1914 multimedia blockbuster","d":"An eight-hour presentation of slides and film synchronized with phonograph sound — genuinely pioneering cinema — shown free to audiences totaling around nine million in its first year. It taught, among other things, that 1914 marked the close of the Gentile Times and the imminent end of the present order.","src":"Watch Tower Society, Photo-Drama of Creation (1914)"},{"t":"The 'Miracle Wheat' scandal","d":"In 1911 the Watch Tower sold 'Miracle Wheat' seed at $1 per pound (roughly $30 today), claiming extraordinary yields. When the Brooklyn Daily Eagle mocked the scheme, Russell sued for $100,000 in libel — and lost, after government testing showed the wheat was ordinary. The court record remains public.","src":"Russell v. Brooklyn Daily Eagle (1913-1915)"},{"t":"'Judge' Rutherford ran the Society like a corporation and lived like an executive","d":"Joseph Rutherford — 'the Judge,' from a brief stint as a substitute judge — centralized all doctrinal authority, replaced elected elders with appointees, and directed the movement from Beth Sarim, driven in 16-cylinder luxury cars during the Great Depression while publishers went door to door unpaid.","src":"Wikipedia, 'Joseph Franklin Rutherford'; Penton, Apocalypse Delayed"},{"t":"Eight Watch Tower leaders went to prison in 1918","d":"Rutherford and seven associates were convicted under the Espionage Act over anti-war passages in 'The Finished Mystery' and sentenced to 20 years; they served about nine months in Atlanta before release on bail in 1919, and the convictions were vacated. The organization now dates Jesus' selection of it as his 'faithful and discreet slave' to precisely 1919 — the year the leaders got out.","src":"Wikipedia, 'Joseph Franklin Rutherford'; JW.org's own 1918 centennial article","id":"faithful-discreet-slave"},{"t":"Awake! carried a promise to the 1914 generation on its masthead — then quietly deleted it","d":"Until October 22, 1995, every issue's masthead promised 'the Creator's promise of a peaceful and secure new world BEFORE THE GENERATION THAT SAW THE EVENTS OF 1914 PASSES AWAY.' The November 8, 1995 issue dropped the clause without announcement, in step with that month's Watchtower redefining 'this generation.'","src":"Awake! Oct 22 vs Nov 8, 1995 mastheads","id":"overlapping-generations"},{"t":"1975 was heavily promoted as the end of 6,000 years of human history","d":"The 1966 book 'Life Everlasting in Freedom of the Sons of God' tied 1975 to the close of six millennia since Adam; articles like 'Why Are You Looking Forward to 1975?' (Watchtower, Aug 15, 1968) stoked expectation, and some sold homes and postponed careers. After the failure, publisher numbers fell for years; a 1980 Watchtower conceded the organization shared blame — while disciplining members who said so.","src":"Life Everlasting (1966); Watchtower Aug 15, 1968; Mar 15, 1980","id":"1975-generation"},{"t":"'This generation' now means two overlapping lifespans","d":"After redefinitions in 1995 and 2008, the April 15, 2010 Watchtower unveiled the 'overlapping generations' doctrine: the 'generation' of Matthew 24:34 spans anointed ones alive in 1914 PLUS anyone anointed while any of them still lived — anchored publicly on Fred Franz (d. 1992). One verse's 'generation' now stretches toward 130+ years.","src":"Watchtower Apr 15, 2010; D. Splane, JW Broadcasting (2015)","id":"overlapping-generations"},{"t":"Memorial partakers are multiplying when they should be vanishing","d":"Doctrine says the anointed 'remnant' of the 144,000 (sealed mostly before 1935 in older teaching) should be dying off. Instead, partakers bottomed out around 8,500 in the mid-2000s and have nearly tripled since — the organization's own 2025 report counts 24,576 partakers worldwide (23,212 in 2024).","src":"JW.org Service Year Reports, Grand Totals 2024-2025","id":"memorial-passing-emblems"},{"t":"The Watchtower was a UN-associated NGO for nine years","d":"While teaching that the United Nations is the scarlet 'wild beast' of Revelation and the 'disgusting thing,' the Watchtower Society held associate NGO status with the UN Department of Public Information from 1992 to 2001 — annually renewed — and withdrew only days after The Guardian exposed it on October 8, 2001.","src":"The Guardian, Oct 8, 2001; UN DPI letter","id":"un-ngo-membership"},{"t":"Organ transplants: cannibalism in 1967, conscience matter in 1980","d":"The Watchtower of November 15, 1967 classed transplants as 'cannibalism, a practice abhorrent to all civilized people'; Witnesses declined kidneys and corneas accordingly. In 1980 the position reversed to personal conscience. No apology was made to those who lost organs, sight, or life in the interval.","src":"Watchtower Nov 15, 1967; Mar 15, 1980","id":"organ-transplant-reversal"},{"t":"The blood ban permits 'fractions' of everything it bans","d":"Whole blood and its four 'primary components' are forbidden, but since the June 15, 2000 Watchtower, fractions derived from ANY component are a conscience matter — including hemoglobin, the oxygen-carrying core of red cells. A Witness may refuse red cells yet accept bovine-derived hemoglobin. No principled line explains where a 'component' ends and a 'fraction' begins.","src":"Watchtower June 15, 2000; AJWRB","id":"blood-fractions-incoherence"},{"t":"Awake! celebrated 26 children who died refusing blood","d":"The May 22, 1994 Awake! cover — 'Youths Who Put God First' — displayed photos of 26 young Witnesses who died refusing transfusions, presented as exemplary. The accompanying text said youths who put God first 'are still doing it, only today the drama is played out in hospitals and courtrooms, with blood transfusions the issue.'","src":"Awake! May 22, 1994","id":"awake-youths-died"},{"t":"Every publisher carries a no-blood card","d":"Witnesses carry a signed Advance Decision / durable power of attorney document refusing blood transfusion even if unconscious and dying, typically renewed annually and often witnessed by congregation elders — which also means the congregation knows if it isn't signed.","src":"JW.org medical information documents","id":"blood-transfusion-ban"},{"t":"Ex-members are officially 'mentally diseased'","d":"The July 15, 2011 Watchtower told members: 'apostates are mentally diseased, and they seek to infect others with their disloyal teachings' — quotation marks around a phrase lifted from 1 Timothy 6:4's 'obsessed.' UK police in Portsmouth examined whether the article breached religious-hatred law.","src":"Watchtower July 15, 2011, pp. 15-19; The Independent (2011)","id":"mentally-diseased-apostates"},{"t":"Australia's Royal Commission: 1,006 alleged abusers, zero reported by the organization","d":"The 2015-2016 Royal Commission found JW Australia's own files recorded 1,006 alleged child sexual abusers since 1950 — and the organization itself reported not one to police (383 cases reached police via victims or families). The Commission singled out the two-witness rule's 'inflexible' application to child abuse as a systemic failure. The organization still applies the rule.","src":"Royal Commission Case Study 29 (2016)","id":"child-abuse-two-witness-rule"},{"t":"Russia banned Jehovah's Witnesses as 'extremist' in 2017","d":"On April 20, 2017 Russia's Supreme Court liquidated the JW administrative center and its 395 local organizations, seizing all property; hundreds of Witnesses have since been prosecuted or imprisoned. The persecution is real and worth condemning without reservation — and internally it is read as prophecy being fulfilled, which strengthens rather than tests conviction.","src":"Human Rights Watch, Apr 20, 2017; USCIRF"},{"t":"After 103 years, the hour ledger closed — mostly","d":"From 1920 to 2023 every publisher filed a monthly report of hours spent preaching. As of November 2023, rank-and-file publishers just check a box for participation — but pioneers and missionaries still count hours, and congregation records still distinguish the 'regular' from the 'irregular' and 'inactive.'","src":"2023 Annual Meeting; Religion News Service, Nov 27, 2023"},{"t":"'Disfellowshipped' was rebranded in 2024 — the shunning wasn't","d":"The August 2024 Watchtower retired the word 'disfellowshipped' for 'removed from the congregation,' and now permits a brief greeting at the Kingdom Hall. Members are still directed not to associate with removed ones — including family outside the household. The vocabulary softened; the mechanism survived.","src":"Watchtower Aug 2024, study ed.; JW.org FAQ 'removed from the congregation'","id":"disfellowshipping-shunning"},{"t":"JW.org is the most-translated website on earth","d":"Content in over 1,100 languages including 100+ sign languages — more than Google, Wikipedia, and Apple combined. It's a genuinely staggering translation operation, and it means the same centrally-produced sentences reach every member on the planet simultaneously; there is no local theological variation to compare notes against.","src":"Religion News Service, Nov 4, 2019; jw.org"},{"t":"Windowless Kingdom Halls: the folklore and the reality","d":"The rumor says halls have no windows 'to keep members from escaping.' The reality is duller: many halls are windowless or minimally windowed for construction cost, security, and vandalism reasons, and plenty have ordinary windows. The buildings aren't the cage; the exit costs are.","src":"JW regional building design guidelines; site surveys","id":"disfellowshipping-shunning"},{"t":"'No paid clergy' — except the ones with vows","d":"Witnesses proudly have no salaried pastorate, and local elders are genuinely unpaid volunteers. But Bethel workers, circuit overseers, and the Governing Body belong to the Worldwide Order of Special Full-Time Servants — housed, fed, insured, and supported by the organization under a vow of poverty. There is a professional religious class; it just isn't called clergy.","src":"Watch Tower legal filings; Organized to Do Jehovah's Will","id":"faithful-discreet-slave"}],"week":[{"t":"Midweek meeting: 'Our Christian Life and Ministry'","d":"About 1¾ hours on a weeknight: Bible-reading assignments, student demonstrations of door-step conversations, and organizational instruction, all from a centrally published workbook identical worldwide.","tip":"If you visit, notice that student 'talks' rehearse conversations with people like you — your objections have been practiced on stage."},{"t":"Weekend meeting: public talk + Watchtower study","d":"A 30-minute public talk from an approved outline, then an hour studying that week's Watchtower article: a reader reads the paragraph, the conductor asks the printed question, hands go up to restate the paragraph.","tip":"Answering 'in your own words' means paraphrasing the paragraph — original analysis from the floor is not the exercise. Attend once; it explains everything about how doctrine propagates."},{"t":"Field service","d":"Door-to-door and return visits, usually organized in car groups after a brief meeting. Since November 2023 most publishers no longer log hours — but participation is still reported monthly and noticed.","tip":"The person at your door may be as tired as you are. Offering coffee and an unhurried conversation is rarer for them than an argument — and far more destabilizing to the script."},{"t":"The cart shift","d":"Two publishers stand by a literature cart in a public spot, trained NOT to approach — passersby must initiate. It counts as witnessing and suits members exhausted by doors.","tip":"Cart witnesses expect to be ignored. A friendly question — 'what made you personally sure this is the truth?' — is often the first real conversation of their shift."},{"t":"Family worship evening","d":"One weeknight reserved for parent-led study of Watchtower materials — established in 2009 when the separate congregation book study was folded into the midweek meeting.","tip":"For JW kids this is a third structured religious evening weekly. Understanding the sheer time-load explains why 'just read this book I like' is a bigger ask than it sounds."},{"t":"The monthly report","d":"Every publisher files monthly: now a checkbox for sharing in the ministry plus a count of Bible studies; pioneers still report hours. Miss enough months and you're classed 'irregular,' then 'inactive' — labels elders track.","tip":"Spiritual health is operationalized as reported activity. When a Witness friend seems anxious near month's end, this is often why."},{"t":"The Memorial — the one observance (Nisan 14)","d":"Their only holy day: an evening Lord's Supper after sundown corresponding to Nisan 14, with the bread and wine passed hand to hand — and declined by nearly everyone present, since only the 'anointed' may partake. Attendance (about 21 million) triples membership.","tip":"It's their biggest invitation event and the easiest meeting to attend. Watching a room pass the emblems untasted is the two-class doctrine made visible — worth seeing once, gently discussed after."},{"t":"Assemblies and the regional convention","d":"Two one-day circuit assemblies plus a three-day regional convention each year: baptisms, new releases, and dramatizations. Vacation time is expected to bend around them.","tip":"Conventions are where new doctrine and policy premiere. Asking a friend 'what changed this year?' is a non-hostile way to surface the fact that things do change."},{"t":"Judicial committees","d":"Alleged 'serious sin' (fornication, apostasy, smoking, celebrating Christmas...) goes before three elders in a closed meeting — no observers, no advocate, no recordings permitted. Outcomes range from reproof to removal from the congregation.","tip":"If a Witness friend goes quiet and distressed, a committee may be why. Knowing the process exists helps you ask better questions and judge less."},{"t":"School life for JW children","d":"No birthday parties, no holiday crafts or carols, no standing for the anthem or saluting the flag, no extracurricular sports typically, and often the only Witness in class — a weekly exercise in being conspicuously different.","tip":"For a JW child, being singled out at school is pre-framed as persecution and proof of faith. Kind, unremarkable inclusion — with a parent-approved alternative in hand — lands better than making an example either way."},{"t":"The preparation load","d":"Between pre-studying the Watchtower article, the midweek workbook, assigned Bible chapters, and family worship, a conscientious publisher's week holds four to six timetabled spiritual obligations before any field service.","tip":"'Come to church Sunday AND a midweek thing AND read this' mirrors the structure they're exhausted by. One unhurried meal with no agenda is the counter-cultural move."}],"aboutyou":[{"t":"You are 'Christendom' — and Christendom is Babylon the Great","d":"All non-JW Christianity is classed as part of 'Babylon the Great, the world empire of false religion,' whose destruction opens Armageddon. Your baptism, your communion, your prayers are not misguided worship in their eyes — they are false religion awaiting judgment.","tip":"Don't spend energy proving your denomination is nice. The category itself is the claim to examine: ask where Scripture teaches that everyone outside one 1919-appointed organization is Babylon."},{"t":"Your church is scheduled for destruction","d":"They expect governments, turning on religion, to destroy the churches as the tribulation begins — an event they anticipate rather than mourn. Loving individuals may genuinely hope you'll 'get out of her' before then.","tip":"Hear the affection inside the warning: door-knocking at your house is, in their frame, pulling you from a burning building. Respond to the love, then question the fire."},{"t":"Your cross is a pagan idol","d":"They teach Jesus died on an upright 'torture stake' and that the cross is a pagan symbol Christians should not display or wear. A crucifix on your wall reads to them roughly as an idol.","tip":"Skip the archaeology duel first; ask the value question — **why would the shape of the instrument matter more than the death upon it?** (1 Corinthians 1:18 glories in the cross, whatever its geometry.)"},{"t":"The Trinity is, to them, a satanic deception","d":"Watchtower literature has long traced the Trinity to Babylonian and pagan triads and presented it as Satan's masterstroke of misdirection. When you say 'God the Son,' they hear the signature lie of false religion.","tip":"Definitions first: most JWs rebut tritheism ('three gods') because that's what they were taught the Trinity is. Establish 'one God in three persons — not three gods, not one person in costume' before any verse is worth exchanging."},{"t":"Your ex-JW friend is the most dangerous person you know","d":"'Apostates' — especially former members — are described as 'mentally diseased' (Watchtower, July 15, 2011), and members are trained to refuse all contact with them and their words. Citing an ex-JW source can end a conversation instantly.","tip":"Never open with 'I talked to an ex-Witness.' Use their own publications and the Bible — sources they're allowed to look at — and save survivor testimony for when trust is deep."},{"t":"They can't take your literature — or your holiday greetings","d":"Non-JW religious material is off-limits ('apostate' material especially — framed like spiritual poison), and 'Merry Christmas' obliges an awkward decline. The refusal is trained, not personal.","tip":"Don't hand them a book; ask a question they'll carry home. Questions get through customs; pamphlets don't."},{"t":"Your objections are their confirmation","d":"They are catechized to expect opposition as proof of being the true faith — Russia's 2017 ban is taught as prophecy fulfilled. Hostility, mockery, and doorstep debate all land as 'we were told this would happen.'","tip":"This is why gentleness IS the argument. The one experience the persecution-frame cannot metabolize is a warm, unhurried Christian who asks good questions and doesn't slam the door."},{"t":"You're being measured by how you treat THEM","d":"Their reading of the sheep and the goats (Matthew 25) says the nations are judged by their response to Christ's anointed 'brothers' — i.e., to the Witnesses and their message. Your reception at the door is, doctrinally, your judgment scene in miniature.","tip":"Use the frame kindly: receive them as you would Christ's own — food, respect, patience — and then ask who Matthew 25 actually calls 'the least of these,' and whether verse 46's outcome ('everlasting punishment') fits annihilation."},{"t":"They can't pray with you","d":"Interfaith activity — praying with you, attending your service (except perhaps a funeral or wedding, silently), joining a Bible study you lead — is forbidden as false worship. Declining your prayer isn't coldness; it's compliance.","tip":"Offer instead of insisting: 'May I pray for you — right now, out loud? You don't have to join, just listen.' Listening isn't participating, and almost no one refuses being prayed FOR."},{"t":"You are 'worldly,' and friendship with you is a managed risk","d":"Everything outside the organization is 'the world' lying in Satan's power (their reading of 1 John 5:19); 'bad associations spoil useful habits' (1 Corinthians 15:33) is applied to close friendship with you. Real warmth is possible, but deep unsupervised friendship draws counsel.","tip":"Expect a ceiling on the relationship and don't take it personally. Consistent, undemanding kindness over years is exactly the data point the 'worldly people are Satan's' doctrine can't explain."}],"doctrine":[{"topic":"God and the Trinity","theirs":"Jehovah is the one almighty God, a single divine person, and his personal name matters supremely. The Trinity is a pagan-influenced doctrine adopted centuries after Christ, unreasonable and unscriptural — Jesus is God's Son, never 'God the Son.' Honoring Jehovah means rejecting the Trinity as a teaching that dishonors him.","bible":"There is one God (Deuteronomy 6:4) — and the Father is called God (John 6:27), the Son is called God (John 1:1; 20:28; Hebrews 1:8), the Spirit is God (Acts 5:3-4), yet they are distinct persons who speak to and about one another. Jesus receives worship (Matthew 28:9,17; Hebrews 1:6), forgives sins (Mark 2:5-7), and shares the Father's glory 'before the world was' (John 17:5). Baptism is into one name — of the Father AND the Son AND the holy spirit (Matthew 28:19).","key":"The question is not whether the word 'Trinity' appears, but whether the Bible presents one God existing as Father, Son, and Spirit — and it does on every page of the New Testament."},{"topic":"Jesus — Michael the archangel?","theirs":"Jesus is God's first creation, the archangel Michael, who was used to create everything else. He lived a perfect human life as a ransom, was raised as a mighty spirit creature, and has ruled invisibly as heavenly King since 1914. He is 'a god' (John 1:1 NWT) — divine-like, but not Jehovah.","bible":"Hebrews 1 exists to deny exactly this: 'to which of the angels did God ever say, You are my Son?' (1:5), 'let all God's angels worship him' (1:6), and the Son is addressed as 'God' whose throne is forever (1:8). Michael 'did not dare' rebuke Satan (Jude 9); Jesus rebuked him freely (Matthew 4:10). No verse states Jesus is Michael — the identification is inferred from a trumpet-and-voice text (1 Thessalonians 4:16).","key":"If the whole point of Hebrews 1 is that the Son is categorically above every angel, the Son cannot be an angel."},{"topic":"The holy spirit","theirs":"The holy spirit is not a person but Jehovah's active force — the invisible power he sends forth to accomplish his will, comparable to a hand or to electricity. It is therefore written lowercase and is not to be worshipped or prayed to.","bible":"The Spirit speaks (Acts 13:2), teaches and reminds (John 14:26), can be lied to — and lying to him is lying to God (Acts 5:3-4) — can be grieved (Ephesians 4:30), intercedes (Romans 8:26-27), and distributes gifts 'just as he wills' (1 Corinthians 12:11). Forces don't will, grieve, or say 'me' (Acts 13:2).","key":"Every personal capacity — will, speech, knowledge, grief — is ascribed to the Spirit; 'active force' requires explaining all of them away."},{"topic":"Salvation and the two classes","theirs":"Exactly 144,000 'anointed' Christians are born again, taken into the new covenant, and will rule with Christ in heaven. The 'great crowd' — virtually all Witnesses today — hope to survive Armageddon and live forever on a paradise earth, gaining final salvation after faithfulness through Christ's thousand-year reign and a final test. Only the anointed partake of the Memorial emblems.","bible":"'Unless someone is born again he cannot SEE the kingdom of God' (John 3:3) — stated to Nicodemus with no ceiling of 144,000. 'Unless you eat the flesh of the Son of man and drink his blood, you have no life in yourselves' (John 6:53). There is 'one body and one spirit... one hope' (Ephesians 4:4), and salvation is by grace through faith, not survival plus a millennium of works (Ephesians 2:8-9; Romans 8:1).","key":"The New Testament knows one flock, one hope, and one table — a salvation system that tells 99.7% of its members not to touch the bread and wine has no apostolic precedent."},{"topic":"The soul and death","theirs":"The soul is the person, not something a person has; when you die, you cease to exist entirely. 'The dead are conscious of nothing at all' (Ecclesiastes 9:5). The hope is not survival of death but future re-creation by resurrection — God remembers you perfectly and remakes you.","bible":"Jesus: 'today you will be with me in Paradise' (Luke 23:43 — the NWT relocates the comma). Paul desires 'to depart and be with Christ, which is far better' (Philippians 1:23) and calls being absent from the body being 'at home with the Lord' (2 Corinthians 5:8). Jesus warns of the One who can destroy 'both soul and body' — two things, not one (Matthew 10:28); Moses and Elijah appear conversing at the Transfiguration.","key":"If death is nonexistence, departing to be with Christ cannot be 'far better' — there would be no one there to be with him."},{"topic":"Hell","theirs":"Hell (Sheol/Hades) is simply the common grave of mankind; hellfire is a slander on God's love. The unredeemed wicked are annihilated — punished with everlasting destruction in the sense of permanent nonexistence — most at Armageddon, with no conscious afterlife of any kind.","bible":"Jesus speaks of judgment more soberly than anyone: 'everlasting punishment' set in parallel with 'everlasting life' (Matthew 25:46 — the same adjective governing both), the rich man conscious in Hades (Luke 16:23-24), and torment 'day and night forever' for the devil, beast, and false prophet (Revelation 20:10) in the lake into which the condemned also go (20:15). Christians debate the nature of final punishment honestly; Scripture does not permit reducing it to painless deletion at Armageddon based on chronology.","key":"Whatever hell's precise nature, Matthew 25:46 will not allow 'everlasting' to mean eternal for life but momentary for punishment."},{"topic":"The resurrection of Jesus","theirs":"Jesus was raised a spirit creature; his physical body was not raised — God removed or dissolved it. His post-resurrection appearances were materialized bodies assumed for the occasion, which is why he wasn't always recognized. He returned, invisibly, as a spirit king in 1914.","bible":"Jesus staked the claim in advance: 'destroy this temple and in three days I will raise it up... he was talking about the temple of his body' (John 2:19-21). Risen, he insists 'a spirit does not have flesh and bones as you see that I have' (Luke 24:39), eats fish, and invites Thomas's fingers into the wounds — the same body, glorified. The tomb was empty because the body that died is the body that rose (1 Corinthians 15).","key":"A 'resurrection' that leaves the corpse dissolved is precisely what Jesus said would NOT happen to the temple of his body."},{"topic":"1914 and the last days","theirs":"The 'seven times' of Daniel 4 equal 2,520 years running from Jerusalem's destruction in 607 BCE to October 1914, when Christ was enthroned in heaven and Satan was cast down to earth. World War I, quakes, famines, and the preaching work prove we've been in the last days since; 'this generation' — now two overlapping groups of anointed ones — will see the end.","bible":"Daniel 4 announces its own meaning: 'it is you, O king' — fulfilled in Nebuchadnezzar's madness within his own reign, with no second application offered anywhere in Scripture. Jesus forbade exactly this arithmetic: 'it does not belong to you to know the times or seasons' (Acts 1:7); 'nobody knows that day or hour' (Matthew 24:36); and he pre-refuted invisible comings — 'if they say he is in the inner rooms, do not believe it... as lightning flashes, so the Son of man will be' (Matthew 24:26-27).","key":"607 BCE is contradicted by all historical evidence (Jerusalem fell 587/586), and without 607 there is no 1914 — the organization's entire claim to authority stands on a date only it defends."},{"topic":"The organization and the faithful slave","theirs":"Jehovah has always worked through a visible channel; today that channel is the 'faithful and discreet slave' — the Governing Body — appointed by Christ over his belongings in 1919 to dispense spiritual food at the proper time. Loyalty to Jehovah is inseparable from loyalty to his organization; salvation requires coming to it. Jesus is mediator of the new covenant for the anointed 144,000, not for the great crowd directly.","bible":"'There is one God, and one mediator between God and men, a man, Christ Jesus, who gave himself a ransom FOR ALL' (1 Timothy 2:5-6). The 'faithful and discreet slave' is a character in a parable about watchfulness (Matthew 24:45-51), not a prophecy of a 1919 corporate appointment — and the same parable warns that the slave may prove wicked. The Beroeans were commended for verifying an apostle against Scripture (Acts 17:11); no organization is above that test.","key":"Any system in which Christ's mediation reaches you only through a committee has replaced the one Mediator with many."},{"topic":"Blood","theirs":"Blood is sacred, representing life, and God's law from Noah through Acts 15 forbids taking it into the body — including by transfusion. Whole blood and its four primary components (red cells, white cells, platelets, plasma) must be refused even at the cost of life; fractions derived from any component are a personal conscience matter, as are non-blood alternatives.","bible":"Every biblical blood text concerns eating blood or its ritual use (Genesis 9:4; Leviticus 17:10-12; Acts 15:28-29 in a table-fellowship context) — and the law itself made life-saving exceptions, as Jesus argued: David ate forbidden showbread and was guiltless; 'the Sabbath was made for man' (Mark 2:25-27); 'I want mercy, and not sacrifice' (Matthew 12:7). The command's stated logic — blood poured out because life belongs to God — is honored, not violated, by using blood to save a life.","key":"A rule that forbids red cells but permits hemoglobin, and that has cost children's lives (Awake!, May 22, 1994), is not the weightier matters of the law — justice, mercy, faithfulness."},{"topic":"The earth's future","theirs":"God's original purpose for a paradise earth will be fulfilled: after Armageddon, the great crowd will transform the globe into a garden during Christ's thousand-year reign, the dead will be resurrected to earth, and obedient mankind will live forever here in perfection. Heaven is for the 144,000 only; earth is not destined for destruction but for restoration.","bible":"The renewed earth is a genuinely biblical hope Christians share — 'the meek will inherit the earth' (Matthew 5:5); creation itself will be set free (Romans 8:21); 'new heavens and a new earth' (2 Peter 3:13; Revelation 21:1). But Scripture never splits redeemed humanity into permanent heaven-people and earth-people: the New Jerusalem comes DOWN, God dwells with mankind, and the throne is on the renewed earth for all his servants, who 'will see his face' (Revelation 21:2-3; 22:3-4).","key":"The Bible's ending is not two eternal address lists but one — heaven and earth reunited, with every redeemed person in God's immediate presence."},{"topic":"Worship in practice","theirs":"True worship excludes anything with pagan roots or nationalistic meaning: no Christmas, Easter, birthdays, or holidays; no flag salute, anthems, voting, or military service; no cross imagery. Worship centers on meeting attendance, public preaching, personal study of the organization's publications, and using God's name Jehovah. Political neutrality and moral cleanness mark God's people.","bible":"Conscientious neutrality and moral seriousness deserve respect — but the apostles handled disputable days differently: 'one man judges one day as above another; another judges all days alike; let each be fully convinced in his own mind' (Romans 14:5), and 'let no one judge you... in respect of a festival' (Colossians 2:16). Where Scripture leaves freedom, binding every member's conscience organization-wide — on penalty of judicial action — is what Jesus rebuked in the Pharisees (Mark 7:7-9).","key":"The issue isn't whether a Christian may skip Christmas — of course they may — but whether anyone may be shunned for keeping it: 'why is my freedom judged by another's conscience?' (1 Corinthians 10:29)."}]};
/* ---------- know them ---------- */
function renderKnow(){
  const tabs=[["kt-facts","✨ Did you know?"],["kt-week","🗓 Inside their week"],["kt-you","👀 What they're taught about you"]];
  if(KNOW.doctrine)tabs.push(["kt-doct","📖 Side by side"]);
  const on=state.knowTab||"kt-facts";
  $("#main").innerHTML=`<div class="viewhead"><h2>Know your Jehovah's Witness neighbor</h2>
  <p>Understanding before argument. Surprising true facts for conversational fluency, the rhythm of their religious life so you can love them practically, and how they've been taught to see you — so nothing they say catches you off guard.</p></div>
  <div class="tabs2">${tabs.map(([k,l])=>`<button class="tab2 ${on===k?"on":""}" data-pane="${k}">${l}</button>`).join("")}</div>
  <div class="tabpane2 ${on==="kt-facts"?"on":""}" id="kt-facts"><div class="kgrid">${KNOW.didyouknow.map(x=>`<div class="ptcard">${x.img?`<img class="ktop" src="${x.img.src}" loading="lazy" data-full="${x.img.src.replace("width=520","width=1400")}" data-cap="${esc(x.img.cap)}">`:""}<h3 class="ptv">${esc(x.t)}</h3><p class="pt">${rich(x.d)}</p><div class="refs">${x.src?`<a href="${esc(x.src)}" target="_blank" rel="noopener">Source</a>`:""}${x.id&&byId[x.id]?` · <button class="klink" data-open="${x.id}">Related case: ${esc(byId[x.id].title)}</button>`:""}</div></div>`).join("")}</div></div>
  <div class="tabpane2 ${on==="kt-week"?"on":""}" id="kt-week">${KNOW.week.map(x=>`<div class="ptcard"><h3 class="ptv">${esc(x.t)}</h3><p class="pt">${rich(x.d)}</p>${x.tip?`<div class="who you">For you as their friend</div><p class="pt">${rich(x.tip)}</p>`:""}</div>`).join("")}</div>
  <div class="tabpane2 ${on==="kt-you"?"on":""}" id="kt-you">${KNOW.aboutyou.map(x=>`<div class="ptcard"><h3 class="ptv">${esc(x.t)}</h3><p class="pt">${rich(x.d)}</p>${x.tip?`<div class="who you">How to navigate it</div><p class="pt">${rich(x.tip)}</p>`:""}</div>`).join("")}</div>${KNOW.doctrine?`<div class="tabpane2 ${on==="kt-doct"?"on":""}" id="kt-doct">${KNOW.doctrine.map(x=>`<div class="ptcard"><h3 class="ptv">${esc(x.topic)}</h3><div class="ddgrid"><div><div class="who them">They teach</div><p class="pt">${rich(x.theirs)}</p></div><div><div class="who you">The Bible teaches</div><p class="pt">${rich(x.bible)}</p></div></div>${x.key?`<div class="ddkey">${rich(x.key)}</div>`:""}</div>`).join("")}</div>`:""}`;
  document.querySelectorAll("#main .tab2").forEach(t=>t.addEventListener("click",()=>{state.knowTab=t.dataset.pane;}));
  document.querySelectorAll("#main [data-open]").forEach(b=>b.addEventListener("click",()=>openCase(b.dataset.open)));
}
