<title>Challenging Beliefs — Jehovah's Witnesses, Examined Against the Bible</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --bg:#0f1116; --side:#0b0d11; --panel:#161a21; --panel2:#12151b; --line:#232833; --line2:#2b313d;
    --ink:#e7e9ec; --muted:#98a0ac; --dim:#565e6b; --gold:#82b1d8; --gold-ink:#0e1116;
    --red:#e0736a; --red-bg:#38221f; --red-cell:#5e2b27; --red-cell-hi:#8a3a32;
    --amber:#cf9a45; --amber-bg:#332a18; --amber-cell:#54431f; --amber-cell-hi:#7d6224;
    --green:#7fb08d; --green-bg:#1d2c26; --green-cell:#27443a;
    --purp:#b394e0; --purp-bg:#2c2440;
    --serif:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif;
    --sans:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    --acc:var(--gold);
    --acc2:var(--purp);
    --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  }
  :root[data-theme="light"]{
    --bg:#f3f4f6; --side:#e9ebee; --panel:#ffffff; --panel2:#f7f8fa; --line:#dfe2e7; --line2:#cfd4db;
    --ink:#1b1e23; --muted:#5c6470; --dim:#9aa1ab; --gold:#2f6b9e; --gold-ink:#ffffff;
    --red:#b03a31; --red-bg:#f6e4e2; --red-cell:#e7b6b1; --red-cell-hi:#cc766d;
    --amber:#8a5f0e; --amber-bg:#f3ecd9; --amber-cell:#e4d1a2; --amber-cell-hi:#c6a75e;
    --green:#3e7455; --green-bg:#e3ede6; --green-cell:#b7d1bf;
    --purp:#6b4fa1; --purp-bg:#ece5f6;
  }
  *{box-sizing:border-box}
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6}
  a{color:var(--gold)}
  button{font-family:inherit}
  mark{background:color-mix(in srgb,var(--amber) 30%,transparent);color:inherit;border-radius:2px;padding:0 2px}
  kbd{font-family:var(--mono);font-size:.72rem;background:var(--panel);border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;padding:1px 6px;color:var(--muted)}

  .app{display:grid;grid-template-columns:216px minmax(0,1fr) 280px;min-height:100vh}
  @media (max-width:1020px){.app{grid-template-columns:216px minmax(0,1fr)}.preview{display:none}}
  @media (max-width:720px){.app{grid-template-columns:1fr}.side{position:sticky;top:0;z-index:40;height:auto;border-right:0;border-bottom:1px solid var(--line)}
    .side .nav{display:flex;flex-wrap:wrap;gap:2px;padding:0 10px 10px}.side .nav h5{display:none}.side .sideprog{display:none}}

  /* sidebar */
  .side{background:var(--side);border-right:1px solid var(--line);padding:18px 0;position:sticky;top:0;height:100vh;overflow-y:auto}
  @media (max-width:720px){.side{height:auto;overflow:visible}}
  .logo{font-family:var(--serif);font-size:1rem;letter-spacing:.1em;padding:0 18px 14px;color:var(--ink)}
  .logo b{color:var(--gold)}
  .sidesearch{padding:0 14px 12px}
  .sidesearch input{width:100%;font-family:inherit;font-size:.82rem;padding:7px 12px;border-radius:8px;border:1px solid var(--line2);background:var(--panel);color:var(--ink)}
  .sidesearch input:focus{outline:2px solid var(--gold);outline-offset:1px}
  .info{display:inline-grid;place-items:center;width:14px;height:14px;border:1px solid currentColor;border-radius:50%;font-size:.58rem;font-style:normal;font-weight:700;opacity:.75;cursor:help;position:relative;flex:none}
  .info:hover,.info:focus{opacity:1}
  .info .tip{display:none;position:absolute;left:50%;transform:translateX(-50%);top:160%;width:250px;background:var(--side);color:var(--ink);border:1px solid var(--line2);font-family:var(--sans);font-size:.76rem;line-height:1.5;padding:9px 12px;border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.35);z-index:30;text-transform:none;letter-spacing:0;font-weight:400;text-align:left}
  .info:hover .tip,.info:focus .tip{display:block}
  .badge,.tag{display:inline-flex;align-items:center;gap:5px}
  .nav a{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 18px;font-size:.86rem;color:var(--muted);text-decoration:none;cursor:pointer;border-left:2px solid transparent}
  .nav a:hover{background:var(--panel2);color:var(--ink)}
  .nav a.on{background:var(--panel);color:var(--ink);border-left-color:var(--gold)}
  .nav .cnt{font-family:var(--mono);font-size:.68rem;color:var(--dim)}
  .nav h5{font-size:.64rem;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin:18px 18px 6px;font-weight:600}
  .sideprog{margin:22px 18px 8px;font-size:.72rem;color:var(--muted)}
  .pbar{height:4px;background:var(--line);border-radius:2px;margin-top:6px;overflow:hidden}
  .pbar i{display:block;height:100%;background:var(--gold);transition:width .4s ease}

  /* main */
  .main{padding:18px 26px 80px;min-width:0}
  .cmd{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line2);border-radius:8px;padding:4px 8px 4px 14px;margin-bottom:18px}
  .cmd input{flex:1;background:none;border:0;color:var(--ink);font-family:inherit;font-size:.9rem;padding:7px 0;outline:none}
  .cmd input::placeholder{color:var(--dim)}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:20px}
  .tile{background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:12px 14px;cursor:pointer;text-align:left;color:var(--ink)}
  .tile:hover{border-color:var(--gold)}
  .tile.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
  .tile .v{font-family:var(--serif);font-size:1.7rem;font-variant-numeric:tabular-nums;line-height:1.1}
  .tile .l{font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:2px}
  .tile.t-ad .v{color:var(--purp)}.tile.t-un .v{color:var(--red)}.tile.t-co .v{color:var(--amber)}.tile.t-an .v{color:var(--green)}
  h4.bt{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;font-weight:600}
  .vwall{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:10px;align-items:start}
  @media (max-width:1240px){.vwall{grid-template-columns:1fr 1fr}}
  @media (max-width:700px){.vwall{grid-template-columns:1fr}}
  .vcol{background:var(--panel2);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .vcol header{padding:14px 16px 12px;border-bottom:2px solid var(--line)}
  .vcol.ad header{border-bottom-color:var(--purp)}
  .vcol.ad .n,.vcol.ad .t{color:var(--purp)}
  .vcol.ad .vt:hover{border-left-color:var(--purp)}
  .vcol.un header{border-bottom-color:var(--red)}
  .vcol.co header{border-bottom-color:var(--amber)}
  .vcol.an header{border-bottom-color:var(--green)}
  .vcol header .n{font-family:var(--serif);font-size:1.9rem;line-height:1;font-variant-numeric:tabular-nums}
  .vcol.un .n{color:var(--red)}.vcol.co .n{color:var(--amber)}.vcol.an .n{color:var(--green)}
  .vcol header .t{font-size:.72rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;margin-left:8px}
  .vcol.un .t{color:var(--red)}.vcol.co .t{color:var(--amber)}.vcol.an .t{color:var(--green)}
  .vcol header .d{font-size:.74rem;color:var(--muted);margin-top:4px}
  .vgroup h6{font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:0;padding:10px 16px 4px;font-weight:600}
  .vt{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:9px 16px 9px 13px;cursor:pointer;color:var(--ink);border-left:3px solid transparent}
  .vt:hover,.vt.sel{background:var(--panel)}
  .vt.sel{border-left-color:var(--gold)}
  .vcol.un .vt:hover{border-left-color:var(--red)}
  .vcol.co .vt:hover{border-left-color:var(--amber)}
  .vcol.an .vt:hover{border-left-color:var(--green)}
  .vt.dimmed{opacity:.25}
  .vt h5{font-family:var(--serif);font-weight:500;font-size:.92rem;line-height:1.35;margin:0}
  .vt .m{font-size:.66rem;color:var(--dim);letter-spacing:.05em;text-transform:uppercase;margin-top:2px;display:flex;gap:8px;align-items:center}
  .vt .m .rd{color:var(--green)}
  .vt .m .star{color:var(--gold)}

  /* list */
  .rows{display:flex;flex-direction:column}
  .rowitem{display:grid;grid-template-columns:12px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:11px 6px;cursor:pointer;color:var(--ink)}
  .rowitem:hover,.rowitem.sel{background:var(--panel2)}
  .rowitem .stripe{width:4px;height:26px;border-radius:2px}
  .rowitem.v-unrefuted .stripe{background:var(--red)}
  .rowitem.v-contested .stripe{background:var(--amber)}
  .rowitem.v-answered .stripe{background:var(--green)}
  .rowitem h5{font-family:var(--serif);font-weight:500;font-size:1rem;margin:0;line-height:1.35}
  .rowitem .sub{font-size:.72rem;color:var(--muted)}
  .rowitem .meta{display:flex;gap:8px;align-items:center;font-size:.66rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;white-space:nowrap}
  .rowitem .meta .rd{color:var(--green)}

  .badge{font-size:.64rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:3px 9px;border-radius:999px;display:inline-block}
  .badge.v-admitted{background:var(--purp-bg);color:var(--purp)}
  .badge.v-unrefuted{background:var(--red-bg);color:var(--red)}
  .badge.v-contested{background:var(--amber-bg);color:var(--amber)}
  .badge.v-answered{background:var(--green-bg);color:var(--green)}
  .tag{font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line2);border-radius:999px;padding:2px 9px;display:inline-block}

  /* case view */
  .backbar{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
  .backbar button.bk{background:var(--panel);border:1px solid var(--line2);color:var(--muted);border-radius:8px;padding:6px 13px;font-size:.8rem;cursor:pointer}
  .backbar button.bk:hover{color:var(--ink);border-color:var(--gold)}
  .pathnext{margin-left:auto;background:var(--gold);color:var(--gold-ink);border:0;border-radius:8px;padding:7px 14px;font-size:.8rem;font-weight:700;cursor:pointer}
  .case h2{font-family:var(--serif);font-weight:500;font-size:1.6rem;line-height:1.25;margin:10px 0 14px;max-width:30ch;text-wrap:balance}
  .case .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
  .dlab{font-size:.7rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:26px 0 10px}
  .dlab.red{color:var(--red)}.dlab.blue{color:var(--gold)}
  .claimrow{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(270px,1fr);gap:28px;align-items:start}
  .claimrow.solo{grid-template-columns:1fr}
  @media (max-width:900px){.claimrow{grid-template-columns:1fr}}
  .claim p{font-size:.97rem;line-height:1.75;max-width:66ch;margin:0 0 12px}
  .claimside{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:16px 18px;position:sticky;top:16px}
  .claimside .passcols{grid-template-columns:1fr;gap:12px}
  .claimside .sidenote{font-size:.76rem;color:var(--dim);margin:-4px 0 12px}
  .defense p.lead{margin:0 0 4px}
  .defense p{line-height:1.7;margin:0 0 10px}
  .pts{margin:8px 0 0;padding:0;list-style:none;counter-reset:pt}
  .pts li{position:relative;padding:10px 0 10px 36px;border-top:1px dashed color-mix(in srgb,var(--green) 25%,var(--line));line-height:1.7}
  .pts li:first-child{border-top:0}
  .pts li::before{counter-increment:pt;content:counter(pt);position:absolute;left:0;top:10px;width:23px;height:23px;border-radius:50%;background:var(--green-bg);color:var(--green);display:grid;place-items:center;font-size:.72rem;font-weight:700}
  .vbox p{margin:0 0 8px;line-height:1.7}
  .vbox p:last-child{margin-bottom:0}
  .ref-lds{color:var(--red);font-weight:600}
  .ref-bib{color:var(--gold);font-weight:600}
  .qq{font-family:var(--serif);font-style:italic;background:color-mix(in srgb,var(--amber) 16%,transparent);border-radius:3px;padding:0 3px}
  .kw{font-weight:700;text-decoration:underline;text-underline-offset:2px}
  .talk{background:color-mix(in srgb,var(--green) 8%,var(--panel));border:1px solid color-mix(in srgb,var(--green) 30%,var(--line));border-radius:8px;padding:16px 18px;font-size:.93rem;max-width:80ch}
  .talk p{margin:0 0 8px;line-height:1.7}
  .talk p:last-child{margin-bottom:0}
  .dlg{display:flex;flex-direction:column;gap:10px;max-width:76ch}
  .dlg .msg{border-radius:12px;padding:12px 16px;max-width:88%}
  .dlg .msg p{margin:0;font-size:.9rem;line-height:1.65}
  .dlg .who{display:block;font-size:.64rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin-bottom:4px}
  .dlg .them{align-self:flex-start;background:var(--panel);border:1px solid var(--line2);border-bottom-left-radius:4px}
  .dlg .them .who{color:var(--red)}
  .dlg .you{align-self:flex-end;background:color-mix(in srgb,var(--green) 9%,var(--panel));border:1px solid color-mix(in srgb,var(--green) 30%,var(--line));border-bottom-right-radius:4px}
  .dlg .you .who{color:var(--green)}
  .corelinks{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .corelink{font-size:.78rem;background:var(--panel2);border:1px solid var(--line2);color:var(--gold);border-radius:999px;padding:5px 13px;cursor:pointer;text-align:left}
  .corelink:hover{border-color:var(--gold)}
  .gtab{width:100%;border-collapse:collapse;font-size:.86rem;margin:14px 0 6px}
  .gtab th{text-align:left;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:8px 12px;border-bottom:2px solid var(--line2)}
  .gtab th:nth-child(2){color:var(--red)}
  .gtab th:nth-child(3){color:var(--gold)}
  .gtab td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.55}
  .gtab td:first-child{font-weight:700;white-space:nowrap;color:var(--muted)}
  .dodont{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media (max-width:700px){.dodont{grid-template-columns:1fr}}
  .dodont ul{margin:8px 0 0;padding-left:18px;font-size:.86rem;color:var(--muted)}
  .dodont li{padding:3px 0;line-height:1.55}
  .why{background:color-mix(in srgb,var(--gold) 7%,var(--panel));border:1px solid color-mix(in srgb,var(--gold) 28%,var(--line));border-radius:8px;padding:16px 18px;font-size:.93rem;max-width:80ch}
  .why p{margin:0 0 10px;line-height:1.7}
  .why .wtail{color:var(--muted);font-style:italic;margin-bottom:0;border-top:1px dashed color-mix(in srgb,var(--gold) 30%,var(--line));padding-top:10px}
  .compare2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media (max-width:760px){.compare2{grid-template-columns:1fr}}
  .pane{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
  .pane .ref{font-size:.7rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
  .pane.bom .ref{color:var(--red)}.pane.bible .ref{color:var(--gold)}
  .pane .scripture{font-family:var(--serif);font-size:1rem;line-height:1.65}
  .cnote{font-size:.8rem;color:var(--muted);margin-top:8px;max-width:80ch}
  .passcols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media (max-width:760px){.passcols{grid-template-columns:1fr}}
  .passcols h6{font-size:.68rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin:0 0 8px}
  .passcols .h-bom{color:var(--red)}.passcols .h-bib{color:var(--gold)}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{font-size:.78rem;font-family:var(--serif);border:1px solid var(--line2);background:var(--panel);border-radius:6px;padding:4px 10px;cursor:pointer;color:var(--ink)}
  .chip:hover{border-color:var(--gold)}
  .chip.open{background:var(--amber-bg);border-color:var(--gold)}
  .chip.ext::after{content:" ↗";color:var(--muted);font-family:var(--sans);font-size:.68rem}
  .versebox{grid-column:1/-1;background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:8px;padding:14px 18px;margin-top:4px}
  .versebox .vr{font-size:.7rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-bottom:8px;display:flex;justify-content:space-between}
  .versebox .vr button{background:none;border:0;color:var(--muted);cursor:pointer;font-size:.8rem}
  .versebox .vtext{font-family:var(--serif);font-size:.98rem;line-height:1.7;max-width:72ch}
  .versebox .vnum{font-family:var(--sans);font-size:.62rem;color:var(--muted);vertical-align:super;margin-right:3px}
  .versebox .vwhy{margin-top:10px;font-size:.8rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px;max-width:76ch}
  .versebox .vwhy b{color:var(--gold)}
  .srcdet{margin-top:30px;border-top:1px solid var(--line);padding-top:14px}
  .srcdet summary{font-size:.74rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);cursor:pointer;list-style:none}
  .srcdet summary::before{content:"▸ ";color:var(--gold)}
  .srcdet[open] summary::before{content:"▾ "}
  .srcdet .srcs{margin-top:12px}
  .app.reading{grid-template-columns:216px minmax(0,1fr)}
  .app.reading .preview{display:none}
  body:has(.app.reading) .keysbar{right:0}
  .srcs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
  .srcs li{display:flex;gap:9px;align-items:baseline;font-size:.85rem}
  .sb{flex:none;font-size:.6rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;border-radius:4px;padding:2px 7px;position:relative;top:-1px}
  .sb-scholarly{background:var(--green-bg);color:var(--green)}
  .sb-apologetics{background:var(--amber-bg);color:var(--amber)}
  .sb-primary,.sb-institutional{background:color-mix(in srgb,var(--gold) 16%,transparent);color:var(--gold)}
  .sb-journalism{background:var(--panel);color:var(--muted);border:1px solid var(--line2)}
  .sb-testimony{background:var(--red-bg);color:var(--red)}
  .defense{background:color-mix(in srgb,var(--green) 7%,var(--panel));border:1px solid color-mix(in srgb,var(--green) 30%,var(--line));border-radius:8px;padding:16px 18px;font-size:.92rem;max-width:80ch}
  .defense .dsrc{font-size:.78rem;color:var(--muted);margin-top:10px}
  .vbox{display:flex;gap:12px;align-items:flex-start;border-radius:8px;padding:16px 18px;font-size:.92rem;max-width:80ch}
  .vbox.v-admitted{background:var(--purp-bg)}.vbox.v-unrefuted{background:var(--red-bg)}.vbox.v-contested{background:var(--amber-bg)}.vbox.v-answered{background:var(--green-bg)}
  .vbox b.vb{flex:none;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;padding-top:3px}
  .vbox.v-admitted b.vb{color:var(--purp)}.vbox.v-unrefuted b.vb{color:var(--red)}.vbox.v-contested b.vb{color:var(--amber)}.vbox.v-answered b.vb{color:var(--green)}
  .relrow{display:flex;gap:8px;flex-wrap:wrap}
  .relrow button{font-size:.78rem;background:var(--panel);border:1px solid var(--line2);color:var(--ink);border-radius:999px;padding:5px 13px;cursor:pointer}
  .relrow button:hover{border-color:var(--gold);color:var(--gold)}
  .pinbtn{background:none;border:1px dashed var(--line2);color:var(--muted);border-radius:8px;padding:7px 14px;font-size:.8rem;cursor:pointer}
  .pinbtn:hover{border-color:var(--gold);color:var(--gold)}
  .pinbtn.pinned{border-style:solid;border-color:var(--gold);color:var(--gold)}

  /* glossary tooltip */
  .g{border-bottom:2px dotted var(--gold);cursor:help;position:relative}
  .g .gt{display:none;position:absolute;left:0;top:140%;width:270px;background:var(--side);color:var(--ink);border:1px solid var(--line2);font-family:var(--sans);font-size:.78rem;line-height:1.5;padding:10px 13px;border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.35);z-index:20;font-style:normal;font-weight:400}
  .g:hover .gt,.g:focus .gt{display:block}

n your eyes, not a raised eyebrow.","blood-doctrine":"Never open here — it is their identity and their martyrdom. If it comes up: **“Why is hemoglobin a conscience matter when the red cell it came from is a disfellowshipping offense?”** Then Acts 15 in context — *“Is this a dietary ruling for table fellowship, or a medical rule about transfusion?”* One question, then silence.","shunning-exit":"This is the wall around everything else, and the person in front of you may lose their mother over this conversation. Say it out loud: **“I know what this could cost you, and I'm not asking you to pay it today.”** Then the only question that matters: *“If it's the truth, why does leaving it have to cost you your family?”*","institutional":"Use their own standard, never a sneer: **“You test other religions by their fruits — would you apply the same test here?”** Name the UN NGO years and the Royal Commission plainly, from the primary documents, and stop. Contempt for the organization reads as contempt for them.","practice":"Where Scripture leaves liberty, don't argue the liberty — argue the conscience. **“Where does the Bible forbid a birthday?”** and then Romans 14: *“Paul says one man esteems one day above another — why isn't this a conscience matter?”* Keep it light; this is the least important door in the house."};
const DIALOG={"nwt-translation":[{"w":"them","t":"The New World Translation is the most accurate Bible available — it restored God's name and freed the text from Christendom's bias. John 1:1 correctly reads 'the Word was a god.'"},{"w":"you","t":"I love that you take translation seriously — most people never check. Help me with one thing: **who translated it?** Every other major Bible publishes its committee's names and credentials so scholars can be examined."},{"w":"them","t":"The translators chose to remain anonymous so the glory goes to Jehovah, not to men."},{"w":"you","t":"That's a beautiful motive — but it also means no one can verify their Greek and Hebrew. The one member later identified, Frederick Franz, had no degree in biblical languages. And on 'a god': the same Greek construction appears in John 1:6, 1:12, 1:18 — the NWT translates it 'God' there. **Why does theos become 'a god' only in the one verse where it describes Jesus?**"},{"w":"them","t":"The Governing Body has scholars who reviewed all of this. Jehovah's organization wouldn't give us an inaccurate Bible — we trust the channel Jehovah is using."},{"w":"you","t":"And I hear that trust — it's sincere. But notice what just happened: the answer to a Greek grammar question was 'trust the organization.' The Beroeans were praised for checking even the apostle Paul against Scripture. **If the translation can only be defended by trusting its publisher, how would you ever find out if it were wrong?** I'd genuinely love to read John 1 with you in any translation you pick — even an interlinear from your own Kingdom Hall library."}],"chronology-607":[{"w":"them","t":"Bible chronology proves Jerusalem was destroyed in 607 BCE, and counting the 'seven times' of Daniel 4 — 2,520 years — brings you exactly to October 1914, when Christ began ruling as King."},{"w":"you","t":"You clearly know this material better than most — can I ask about just the starting point? Every reference work, every Babylonian business tablet, and astronomical diaries like VAT 4956 date Jerusalem's fall to 587 or 586 BCE. **Do you know of any historian or archaeologist outside the organization who defends 607?**"},{"w":"them","t":"Secular historians rely on pagan records that can be wrong. We start from the Bible: Jerusalem lay desolate seventy years, and Babylon fell in 539 — count back and you get 607."},{"w":"you","t":"That's fair reasoning, so let's use only the Bible: Jeremiah 25:11-12 says the seventy years are nations serving the KING OF BABYLON, ended by Babylon's fall in 539 — servitude, not desolation, which fits 605-539. And Zechariah 1:12, written around 519, speaks of seventy years still being lamented — decades after your count ends. But here's my real question: **if 607 moves by even twenty years, what happens to 1914?**"},{"w":"them","t":"1914 is confirmed by world events — war, earthquakes, the sign of the last days. The faithful slave has helped us understand the chronology, and the events prove they were right."},{"w":"you","t":"Yet the organization itself was appointed — by its own teaching — in 1919 BECAUSE 1914 was true. The date proves the organization and the organization vouches for the date; that circle is worth sitting with. I say this as a friend, not a prosecutor: **you deserve a foundation that survives checking.** Would you be willing to look at the seventy-years verses with me sometime, just the two of us and the text?"}],"failed-dates":[{"w":"them","t":"Jehovah's people have always been eager for the end — sometimes expectations ran ahead of the light. But Proverbs 4:18 says the light gets brighter, and our understanding has been refined."},{"w":"you","t":"I appreciate the honesty in that — everyone's tradition has embarrassments, mine included. But can we look at the specifics together? 1914 was preached as the end of all earthly governments; 1925 was 'definitely settled by the Scriptures' for Abraham's return — there was a mansion waiting; 1975 emptied savings accounts. **These weren't private guesses — they were published worldwide as Scripture's own timetable.**"},{"w":"them","t":"Even the apostles expected the Kingdom in their day. Being wrong about timing out of eagerness isn't the same as being a false prophet."},{"w":"you","t":"The apostles asked and Jesus said it wasn't theirs to know — and after Pentecost they never once published a date. Here's the test I can't get around: Deuteronomy 18:22 says when a word spoken in Jehovah's name does not come true, don't fear it. The Watchtower called itself Jehovah's channel while announcing those dates. **Does 'brighter light' explain saying false things in Jehovah's name — or does it just rename them?**"},{"w":"them","t":"The organization has admitted mistakes were made. What matters is that Jehovah kept using them — look at the worldwide preaching work. No one else is doing that."},{"w":"you","t":"Notice, though — when the dates failed, members who said so were disfellowshipped, while the leaders who published them kept their seats. That asymmetry troubles me for your sake, not against you. **If a hundred years of dated predictions all failed, what future claim from the same source could ever be tested?** You're allowed to love God and still ask that. I'll ask it with you anytime, over coffee, no scorekeeping."}],"prophecy-authority":[{"w":"them","t":"Jesus said the faithful and discreet slave would give food at the proper time. In 1919 he inspected all who claimed to serve God and appointed the anointed brothers taking the lead — today the Governing Body — over all his belongings."},{"w":"you","t":"That's the load-bearing wall of everything else, isn't it — so it's worth weighing carefully. Just historically: **what was Christ inspecting in 1919 that he approved?** In 1919 the Society was still teaching that the Great Pyramid was God's stone witness, that the last days began in 1799, and that Christ returned in 1874. All of that was later discarded as error — some of it as satanic."},{"w":"them","t":"They had some wrong expectations, but their hearts were clean and they were preaching the Kingdom. Jehovah looks at the heart."},{"w":"you","t":"Amen — he does, and I don't doubt those hearts. But the claim isn't 'sincere people'; it's a legal appointment as the sole channel of truth, dated to a year when nearly everything they taught was, by the current Governing Body's own standard, false. And Matthew 24 is a parable urging EVERY servant to stay faithful — verse 48 warns the same slave could prove wicked. **Where in the text is a 1919 appointment of a corporation — and who verified it besides the corporation?**"},{"w":"them","t":"Someone has to take the lead. Jehovah has always used an organization — Israel, then the first-century governing body in Jerusalem. Without the slave we'd have confusion, like Christendom's thousands of sects."},{"w":"you","t":"Order matters, agreed — but Acts 15 shows apostles and elders reasoning from Scripture in the open, and Paul telling churches to test even angels and apostles against the gospel (Galatians 1:8, Acts 17:11). Unity purchased by forbidding examination isn't the unity of the Spirit; it's the silence of the room. Gently: **if the appointment claim is true, it can survive your investigation — so what would it cost you to investigate it?** I'm safe company for that question, whenever you want."}],"doctrine-of-god":[{"w":"them","t":"We worship Jehovah, the only true God. Jesus is his Son — the first creation — and never claimed to be God. The Trinity confuses people and dishonors the Father."},{"w":"you","t":"Can I say first — your reverence for God's honor is something I genuinely respect. Let me ask about one scene: risen Jesus stands before Thomas, who says 'My Lord and my GOD' (John 20:28). Jesus doesn't correct him — he blesses those who believe the same without seeing. **If Jesus were not God, wasn't that the moment to say so?**"},{"w":"them","t":"Thomas was exclaiming in astonishment — or acknowledging Jesus as 'a god,' a divine one, like the NWT says at John 1:1. Jesus himself said the Father is greater than he is."},{"w":"you","t":"An exclamation using God's title as a swear-word would be blasphemy on the spot — and John wrote the verse as the Gospel's climax: 'these were written that you may believe.' As for 'greater' — the sent one submits to the sender (a king is greater than the prince on campaign) without being a different kind of being; that's Philippians 2, equality laid aside for the mission. Here's my honest question: **Isaiah 44:24 says Jehovah stretched out the heavens ALONE — 'who was with me?' — yet John 1:3 says nothing was created without the Word. How can both be true unless the Word is Jehovah's own being?**"},{"w":"them","t":"Jehovah created Jesus first and then used him for everything else — that's what 'firstborn of all creation' means. The organization has explained these deep things; we can't lean on our own understanding."},{"w":"you","t":"Notice the NWT itself had to add 'other' to Colossians 1 — 'all OTHER things' — to keep Jesus inside creation; the Greek just says all things, through him and FOR him. Friend, I'm not asking you to lean on your understanding or mine, but on the text in front of us both. **Would you read Hebrews 1 aloud with me — just that one chapter — and tell me honestly whether its author thought the Son was an angel?** No trap; I'll bring the NWT."}],"two-class-salvation":[{"w":"them","t":"The Bible speaks of two hopes: 144,000 anointed ones who rule with Christ in heaven, and the great crowd who live forever on paradise earth. We know we're the great crowd — the heavenly calling was mostly sealed long ago."},{"w":"you","t":"Here's what moves me about that, honestly: it decides in advance what Scripture's promises are allowed to mean for YOU. So one gentle question first — at the Last Supper, Jesus said 'this is my blood of the covenant.' At your Memorial, the bread and wine pass down the row and almost no one partakes. **Jesus said 'unless you eat the flesh of the Son of man and drink his blood, you have no life in yourselves' (John 6:53) — who told you that wasn't addressed to you?**"},{"w":"them","t":"The emblems are for those in the new covenant — the anointed with the heavenly hope. The great crowd benefits from the ransom without being party to the covenant. The faithful slave has made the two classes clear from Revelation 7 and 14."},{"w":"you","t":"But look at Revelation 7 with fresh eyes: the 144,000 are sealed from twelve named tribes of Israel — with Dan missing — and in chapter 14 they're male celibates. Everyone agrees those details are symbolic; only the number is kept literal. Meanwhile the great crowd is 'before the throne... in his temple' — and Revelation 19:1 puts a great crowd IN HEAVEN. **If the tribes, the maleness, and the virginity are symbols, on what basis is 144,000 arithmetic?**"},{"w":"them","t":"Numbers in Revelation can be literal when the context shows it. Anyway, I don't feel the heavenly calling — I love the thought of paradise earth, seeing resurrected loved ones, petting lions. That's the hope Jehovah's organization has always shown us from Scripture."},{"w":"you","t":"And a renewed earth IS in Scripture — we agree there, truly; Revelation ends with heaven coming down to earth, God's tent with mankind, every servant seeing his face (21:3, 22:4). What Scripture never does is post some believers at a distance forever. That promise — seeing HIS face — is written to all who are his. **Would you take the emblems question home this year — read John 6 and Luke 22 before the Memorial, and ask Jehovah directly whether Jesus meant you?** That prayer can't be wrong to pray."}],"blood-doctrine":[{"w":"them","t":"Blood is sacred to Jehovah — it represents life itself. From Noah to the apostolic decree, 'abstain from blood' is unambiguous. We carry no-blood cards because obeying God matters more than extending life a few years."},{"w":"you","t":"I want to honor what's real here: that's costly obedience, and I don't laugh at it. But let me ask about the boundary itself. Acts 15 concerns eating blood — the issue since Genesis 9 was consuming a creature's life. A transfusion doesn't feed anyone; the blood keeps doing its job as living tissue, like a transplanted kidney. **If a doctor said 'abstain from alcohol,' would that forbid rubbing alcohol on a wound?**"},{"w":"them","t":"Taking it into your veins is still taking it into your body. The organization has explained that the principle covers transfusion — and Jehovah blessed us with bloodless medicine as a result."},{"w":"you","t":"Bloodless surgery advances are genuinely good fruit — granted gladly. But here's what I can't resolve: the policy forbids red cells yet permits hemoglobin — which is most of the red cell — plus fractions of every 'forbidden' component, each as a conscience matter since 2000. **If blood is too sacred to transfuse, how can nearly all of it, piece by piece, be fine?** A line that moves like that looks like policy, not principle."},{"w":"them","t":"The faithful slave refines our understanding as knowledge increases. Where the Bible doesn't give details, conscience decides — but the clear command stands, and I trust Jehovah more than I fear death."},{"w":"you","t":"Your courage isn't in question — only the command's address. When David's men were starving, they ate the holy showbread, and Jesus defended it: 'the Sabbath was made for man, not man for the Sabbath'; 'I want mercy, not sacrifice.' Blood was poured out precisely because life belongs to God — using it to SAVE a life honors that logic. **May I ask just one thing of you — not to change your card tonight, but to read Mark 2:23-27 asking whether Jesus would sign it?** And know this: if you were ever in that hospital bed, I'd be beside you either way."}],"shunning-exit":[{"w":"them","t":"We don't shun anyone. People are free to leave — and removal from the congregation is loving discipline that protects the flock and often moves the person to come back to Jehovah."},{"w":"you","t":"I believe you've seen it work that way for some, and I know the intent is love. But can we be concrete? If your grown daughter concluded — honestly, prayerfully — that the Governing Body isn't God's channel, and said so, she'd face a judicial committee and removal. Then you'd be directed not to associate with her. **Is that freedom to leave, or freedom to leave everyone you love behind?**"},{"w":"them","t":"That's painful, but it's Scriptural — 'remove the wicked man from among yourselves,' 'do not receive him into your homes.' And the door is always open; the shunning is meant to help them miss Jehovah and return."},{"w":"you","t":"Those verses address unrepentant immorality and men actively deceiving churches — Paul never cuts off a doubter; Jude says 'show mercy to those who doubt.' Notice, too, whom the policy actually pressures: not the convinced apostate, but the quiet questioner who now knows the price of honesty. **What does it do to a family's love when everyone knows it can be switched off by committee?** Even the August 2024 adjustment — a greeting allowed at the Kingdom Hall — concedes the old line wasn't Scripture but policy, changeable by print run."},{"w":"them","t":"The Governing Body adjusts things as Jehovah directs. I trust that. Without loyalty to the organization there'd be no clean congregation at all."},{"w":"you","t":"Here's the thought I'd leave with you, offered gently because I'm not going anywhere: a message that's true doesn't need exit costs; the truth keeps people by being true. Jesus asked the Twelve 'do you want to go also?' with the door wide open — and they stayed for HIM. **If the teaching is solid, why must leaving cost your mother?** Whatever you ever decide, my table doesn't have a committee. That's not rhetoric; it's an invitation."}],"institutional":[{"w":"them","t":"Jehovah's organization is the cleanest people on earth — no war-blessing, no political entanglement, no scandal-ridden clergy like Christendom's churches."},{"w":"you","t":"Churches have real sins on the books — I won't defend a single one of them. But held to its own standard: the Watchtower Society was an associate NGO of the United Nations from 1992 to 2001 — the very organization it calls the wild beast — and withdrew only after The Guardian exposed it. **If a Witness had privately affiliated with the UN for nine years, what would a judicial committee have done?**"},{"w":"them","t":"That's an apostate distortion. I've heard the association was only for access to the UN library, and it required no membership commitment."},{"w":"you","t":"Check it against sources you'd accept in any other case — the UN's own letter states associate NGOs were required to support the UN's ideals and renew annually, which the Society did nine times. And there's harder ground: Australia's Royal Commission examined the organization's OWN files — 1,006 alleged child abusers since 1950, not one reported to authorities by the organization, largely due to the two-witness rule. **Shouldn't 'by their fruits you will recognize them' apply to every tree, including this one?**"},{"w":"them","t":"Imperfect men have always been part of Jehovah's arrangement — look at Israel's kings. The organization isn't inspired, but it's still the channel Jehovah is using. Where else would we go?"},{"w":"you","t":"Friend, notice that 'imperfect men' now covers what 'Babylon the Great' condemns in everyone else — that's two scales, and Proverbs calls that detestable. And that last question — Peter's actual words weren't 'where else would we go' but '**Lord, to WHOM shall we go?**' (John 6:68). A person, not a headquarters. That question deserves your best years, and you can explore it without me ever gloating — that's a promise."}],"practice":[{"w":"them","t":"Christmas, Easter, birthdays — all pagan in origin. December 25 was a sun festival; the only birthday parties in the Bible ended with executions. True worship must be clean of Babylonish customs."},{"w":"you","t":"You're right about more of the history than most Christians know, honestly — December 25 isn't in the Bible and nobody's required to keep it. But test the rule itself: your literature acknowledges wedding rings likely have pagan roots, yet allows them because of what they mean NOW. **Why does 'present meaning matters' rescue the ring but not a child's birthday cake?**"},{"w":"them","t":"The Bible mentions wedding rings neutrally — but it records both birthday feasts negatively, Pharaoh's and Herod's. And the organization has shown these celebrations promote creature worship and greed."},{"w":"you","t":"Two wicked kings threw parties and did wicked things AT them — Scripture never says the anniversary was the sin; both texts condemn the killings, not the cake. And Job's children held feasts 'each on his own day' while Job stays blameless. The apostles faced this exact question about days and food offered to idols, and their answer was liberty: 'let each be fully convinced in his own mind' (Romans 14:5). **If Paul wouldn't bind a conscience on days, who may?**"},{"w":"them","t":"Unity matters — if everyone decided individually, the congregation would splinter. The faithful slave keeps worship clean worldwide, and I'm grateful for that direction."},{"w":"you","t":"But watch what that trades away: Colossians 2:16 says 'let NO ONE judge you in respect of a festival' — and a judicial committee for celebrating Christmas is precisely someone judging you about a festival. Unity that Romans 14 builds is agreement to differ in love, not identical calendars under penalty. Here's my open door, and it's the whole point: **come to no service, sign nothing — just bring your family for dinner on the 25th, and see whether what happens at our table looks like sun worship or like gratitude for a Savior.** You'll be welcomed, not recruited."}]};
const ABBR=["c","cf","vs","e.g","i.e","etc","Dr","St","Mr","Mrs","ch","pp","v","vv","no","approx","Jr","Sr"];
function splitSentences(raw){
  const tokens=raw.split(/(?<=[.!?])\s+(?=[A-Z0-9"'(‘“])/);
  const merged=[];
  tokens.forEach(t=>{
    if(merged.length){
      const prev=merged[merged.length-1];
      const m=prev.match(/([A-Za-z&.]+)\.$/);
      const w=m?m[1].replace(/\./g,""):null;
      if(w&&ABBR.includes(w)){merged[merged.length-1]=prev+" "+t;return;}
    }
    merged.push(t);
  });
  return merged;
}
const LDSBOOKS="(?:The Watchtower[,]?\\\\s(?:[A-Z][a-z]+\\\\s\\\\d{1,2},\\\\s)?\\\\d{4}|Awake![,]?\\\\s(?:[A-Z][a-z]+\\\\s\\\\d{1,2},\\\\s)?\\\\d{4}|w\\\\d{2}\\\\s\\\\d{1,2}/\\\\d{1,2}|Insight on the Scriptures|Proclaimers|Kingdom Interlinear|New World Translation|NWT)";
const BIBBOOKS="(?:[1-3]\\s)?(?:Genesis|Exodus|Leviticus|Numbers|Deuteronomy|Joshua|Judges|Ruth|Samuel|Kings|Chronicles|Ezra|Nehemiah|Esther|Job|Psalms?|Proverbs|Ecclesiastes|Isaiah|Jeremiah|Lamentations|Ezekiel|Daniel|Hosea|Joel|Amos|Obadiah|Jonah|Micah|Nahum|Habakkuk|Zephaniah|Haggai|Zechariah|Malachi|Matthew|Mark|Luke|John|Acts|Romans|Corinthians|Galatians|Ephesians|Philippians|Colossians|Thessalonians|Timothy|Titus|Philemon|Hebrews|James|Peter|Jude|Revelation)";
const REFNUM="";
const KEYWORDS=/\b(concedes?d?|conceded|disavow(?:s|ed|al)?|undisputed|unfalsifiable|no ancient manuscript|zero ancient witnesses|never recanted|does not match|do not match|no adequate answer|contradict(?:s|ing|ion)?|impossible|no record|officially disavowed)\b/gi;
function emphasize(t){
  t=t.replace(new RegExp("\\b("+LDSBOOKS+REFNUM+")","g"),'<span class="ref-lds">$1</span>');
  t=t.replace(new RegExp("\\b("+BIBBOOKS+"\\s\\d+(?::\\d+(?:[\\-–]\\d+)?(?:,\\s?\\d+(?:[\\-–]\\d+)?)*)?)","g"),m=>m.includes("ref-lds")?m:'<span class="ref-bib">'+m+'</span>');
  t=t.replace(/(^|[\s(—–])'([^'<>]{3,200}?)'(?=$|[\s.,;:)!?—–])/g,'$1<span class="qq">‘$2’</span>');
  t=t.replace(KEYWORDS,'<b class="kw">$1</b>');
  t=t.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/==(.+?)==/g,'<mark>$1</mark>');
  return t;
}
function rich(raw){return glossify(emphasize(esc(raw).replace(/&lt;(\/?)(b|i|em|strong)&gt;/g,"<$1$2>")));}
function paras(raw,per){
  per=per||2;
  const s=splitSentences(raw),ps=[];
  for(let i=0;i<s.length;i+=per)ps.push(s.slice(i,i+per).join(" "));
  return ps.map(p=>`<p>${rich(p)}</p>`).join("");
}
function formatDefense(raw){
  if(/\(\d+\)/.test(raw)){
    const parts=raw.split(/\(\d+\)\s*/);
    const intro=parts.shift().trim();
    return (intro?`<p class="lead">${rich(intro)}</p>`:"")+
      `<ol class="pts">${parts.map(p=>`<li>${rich(p.trim())}</li>`).join("")}</ol>`;
  }
  return paras(raw,2);
}

const GLOSSARY=[{"t":"the 144,000","d":"Read by the Watchtower as a literal number — the only people who go to heaven, are born again, are in the new covenant, and may take the bread and wine. Everyone else hopes for earth. At the 2023 Memorial, 21.1 million attended and 23,212 partook."},{"t":"the 1914 generation","d":"The teaching that people alive in 1914 would see Armageddon. Redefined in 1995, 2008, and again in 2010 as two 'overlapping' generations."},{"t":"a chiasm","d":"A mirror-image literary structure (A-B-C-B-A) common in Hebrew writing. It appears in these arguments because its presence in a text is sometimes offered as evidence of ancient Semitic authorship."},{"t":"a codex","d":"A book with bound pages, as opposed to a scroll. Christians adopted the codex format remarkably early, which is part of why so many early Christian manuscripts survive."},{"t":"a palimpsest","d":"A manuscript whose original writing was scraped off so the expensive material could be reused. Modern imaging can often recover the erased text underneath — which is how the Sanaa Quran's earlier layer was read."},{"t":"a proof-text","d":"A verse quoted on its own to establish a point, usually detached from what surrounds it. Proof-texting is the single most common way both sides of every argument on this site go wrong."},{"t":"a stele","d":"An upright inscribed stone slab set up to record a victory, a law, or a treaty — one of archaeology's most valuable finds, because it is a dated, deliberate, public record."},{"t":"a textual variant","d":"Any difference between two manuscripts, including a misspelling or a change in word order. The famous 'hundreds of thousands of variants' figure is real and almost entirely trivial; the meaningful and viable ones are well under 1%, and every modern Bible footnotes them."},{"t":"an anachronism","d":"Something appearing in a story before it existed in real life — a horse in a place with no horses, a stirrup centuries too early. Anachronisms are one of the main tools for dating a text, because a writer can only mention the world he lives in."},{"t":"an apologist","d":"Someone who defends a faith's claims — from the Greek <i>apologia</i>, a legal defense. Not an insult, and not the same as an apologizer. This site quotes apologists deliberately: a claim is only worth making if it survives the best defense of it."},{"t":"an ossuary","d":"A limestone box for bones, used in Judea for about a century around the time of Jesus: a body was left to decompose for a year, then the bones were collected into the box. Names carved on ossuaries are how we have physical traces of individuals like the high priest Caiaphas."},{"t":"the anointed","d":"The 144,000 who go to heaven, are born again, are in the new covenant, and alone may take the Memorial bread and wine."},{"t":"the apocrypha","d":"Books written between the Testaments (Tobit, Judith, Maccabees and others), included in Catholic and Orthodox Bibles and in the original 1611 KJV, but not in the Hebrew canon or in Protestant Bibles today."},{"t":"apostate","d":"Anyone who persistently disagrees with the Governing Body's teaching. A 2011 Watchtower called apostates 'mentally diseased' and told members to avoid their words entirely."},{"t":"Armageddon","d":"In Witness teaching, the imminent global destruction of every human being outside the organization, after which survivors live forever on a paradise earth. It is not a distant doctrine but the organizing fact of a Witness's week."},{"t":"Awake!","d":"The organization's second magazine, aimed at a general audience. Its 22 May 1994 issue, which celebrated 26 young Witnesses who died refusing blood transfusions, is one of the most-cited documents in this section."},{"t":"Beth Sarim","d":"'House of the Princes' — a San Diego mansion the Society bought in 1929 and deeded to Abraham, Isaac, Jacob and other resurrected patriarchs expected imminently. Rutherford lived in it. It was sold in 1948, and the organization's own <i>Proclaimers</i> history discusses it."},{"t":"Bethel","d":"A branch headquarters and the volunteer community that staffs it, under a vow of poverty — the organization's professional religious class, though it isn't called clergy."},{"t":"blood fractions","d":"Components-of-components (including hemoglobin) that individual conscience may accept, even though the whole blood they come from is forbidden."},{"t":"the canon","d":"The list of books a community accepts as Scripture. The New Testament canon was recognized gradually by usage over the first three centuries rather than voted on at a council — Athanasius's list of 367 AD matches ours exactly."},{"t":"Charles Taze Russell","d":"The founder (1852–1916), a Pittsburgh haberdasher who began publishing <i>Zion's Watch Tower</i> in 1879. He taught that Christ's invisible presence began in 1874 and that 1914 would bring the end — and the organization spent decades afterwards reworking what he had written."},{"t":"Codex Sinaiticus","d":"A complete Greek Bible hand-copied around 330–360 AD, found at St Catherine's Monastery on Mount Sinai in the 1840s. Along with Vaticanus it is one of the two oldest complete Bibles in existence, and its text is essentially the text you read today."},{"t":"Codex Vaticanus","d":"A Greek Bible copied around 300–325 AD, held in the Vatican Library — slightly older than Sinaiticus and, with it, the backbone of modern New Testament textual scholarship."},{"t":"the Dead Sea Scrolls","d":"About 900 manuscripts found in caves at Qumran near the Dead Sea between 1947 and 1956, copied roughly 250 BC–70 AD. They pushed our oldest Hebrew Bible manuscripts back a thousand years — and the text matched what had been copied ever since. The single most important manuscript discovery ever made."},{"t":"Deutero-Isaiah","d":"The name critical scholars give to the proposed anonymous author of Isaiah 40–55, writing during the Babylonian exile. See the multi-Isaiah theory."},{"t":"disassociation","d":"Formally resigning — treated exactly like expulsion since 1981, which is why there is no neutral way to leave."},{"t":"disfellowshipped / removed","d":"Expelled after a judicial committee. Renamed 'removed from the congregation' in August 2024; other Witnesses, including family outside the household, cut off normal association."},{"t":"the Documentary Hypothesis","d":"The critical theory that the first five books of the Bible were woven together from several earlier sources (labelled J, E, D and P) rather than written by Moses. The classic form is now heavily revised even among critical scholars, but some version of it is the mainstream academic position."},{"t":"exegesis","d":"Drawing out what a text actually says, in its own context. Its opposite is eisegesis — reading your conclusion into the text."},{"t":"the faithful and discreet slave","d":"Their name for the Governing Body, read out of Matthew 24:45 as a prophecy that Christ inspected all religions in 1919 and appointed them over his belongings."},{"t":"field service","d":"The door-to-door and cart witnessing work, usually organized in groups after a short meeting."},{"t":"Fred Franz","d":"The Watchtower's leading theologian for decades and the principal figure behind the New World Translation. Under oath in a Scottish court in 1954 he was asked to translate a simple verse from English into Hebrew and declined. He had studied classical Greek for two years at university and had no formal Hebrew training."},{"t":"the Governing Body","d":"The eight or so men at world headquarters who define all doctrine; since 2012 they identify themselves alone as the 'faithful and discreet slave' of Matthew 24:45."},{"t":"the great crowd","d":"Everyone else — roughly 99.9% of Witnesses — who hope to survive Armageddon and live forever on a paradise earth as God's 'friends' rather than his sons."},{"t":"the Great Isaiah Scroll","d":"The star of the Dead Sea Scrolls: a complete copy of Isaiah, all 66 chapters, copied around 125 BC. It proves Isaiah 53 and its portrait of a pierced, suffering servant existed more than a century before Jesus — nobody added it afterwards."},{"t":"Joseph Rutherford","d":"Russell's successor (1869–1942), a lawyer who consolidated control, coined the name 'Jehovah's Witnesses' in 1931, introduced the 1925 prediction and the Beth Sarim mansion, and drove the movement's confrontational legal campaigns."},{"t":"Josephus","d":"Titus Flavius Josephus (c. 37–100 AD), a Jewish general who surrendered to Rome and became its most important historian of first-century Judea. Not a Christian, which is why his mentions of Jesus, James and John the Baptist carry so much weight."},{"t":"judicial committee","d":"Three elders meeting privately to decide a member's standing. No observers, no advocate, no recordings permitted."},{"t":"Kingdom Hall","d":"The local meeting place. Two meetings a week are held there; the building is deliberately plain and displays no cross."},{"t":"the Kingdom Interlinear","d":"The Watchtower's own Greek–English interlinear New Testament, which prints the literal word-under-word Greek beside the New World Translation. It is the single most useful book in a Witness's library for these conversations, because it lets them see for themselves what the Greek says."},{"t":"the KJV","d":"The King James Version of 1611, the English Bible of the whole period covered by this site. Its wording matters constantly here: several movements examined on this site were born inside its cadence, and some of them treat it as the only legitimate Bible."},{"t":"the Masoretic Text","d":"The standard Hebrew Bible, preserved and vowel-pointed by Jewish scribes called the Masoretes between roughly 600 and 1000 AD. Almost every Old Testament translation is based on it; where it differs from the Septuagint or the Scrolls, that difference is what scholars argue about."},{"t":"the Memorial","d":"Their one annual observance, on Nisan 14: the bread and wine are passed down the rows and nearly every person present declines them."},{"t":"the multi-Isaiah theory","d":"The mainstream critical view that the book of Isaiah had more than one author: chapters 1–39 from the eighth-century prophet, 40–55 from an anonymous writer during the Babylonian exile ('Deutero-Isaiah'), and sometimes 56–66 from a third. It is argued from style and from the fact that chapters 40+ address the exile as present. Conservatives dispute it; it matters here because it is the standard reply whenever Isaiah is said to predict something."},{"t":"Nebuchadnezzar","d":"King of Babylon 605–562 BC, who destroyed Jerusalem and the Temple. The date of that destruction is the hinge of this entire section."},{"t":"the Neo-Babylonian period","d":"The Babylonian empire of Nebuchadnezzar, roughly 626–539 BC. Its chronology is fixed by thousands of dated business tablets and by astronomical diaries recording eclipses and planetary positions — which is why 587 BC for Jerusalem's fall is not a matter of scholarly opinion, and why 607 has no support anywhere."},{"t":"NWT","d":"The New World Translation — the Watchtower's own Bible, produced by an anonymous committee, and the only translation used in their meetings and literature."},{"t":"papyrus","d":"Paper made from reed pith, the ordinary writing material of the ancient world. New Testament papyri are labelled with a P and a number — P52, a scrap of John, is the earliest known New Testament manuscript, copied around 125 AD."},{"t":"PIMO","d":"'Physically In, Mentally Out' — a member who no longer believes but keeps attending to avoid losing their family."},{"t":"pioneer","d":"A publisher who commits to an hour quota in the ministry each month — the status held up to young Witnesses in place of university."},{"t":"the Proclaimers book","d":"<i>Jehovah's Witnesses — Proclaimers of God's Kingdom</i> (1993), the organization's own official history. It is unusually candid about the failed dates and about Beth Sarim, which makes it the ideal source to cite: a Witness cannot call their own history apostate literature."},{"t":"publisher","d":"A baptized or approved member who takes part in the preaching work and files a monthly activity report."},{"t":"Qumran","d":"The settlement beside the caves where the Dead Sea Scrolls were found, on the northwest shore of the Dead Sea. Usually associated with the Essenes, a strict Jewish sect of the Second Temple period."},{"t":"the Reasoning book","d":"<i>Reasoning from the Scriptures</i> — the field-service handbook giving Witnesses a prepared answer to every common objection, arranged by topic. Assume the person at your door has a script for whatever you were about to say, which is why questions work better than arguments."},{"t":"the Septuagint","d":"The Greek translation of the Hebrew Scriptures made by Jewish scholars in Alexandria beginning about 250 BC — abbreviated LXX. It matters constantly here because it is pre-Christian: when it renders a verse a certain way, no Christian could have influenced it."},{"t":"the Smithsonian Institution","d":"The United States' national museum and research complex. It matters here because for decades a 'Smithsonian statement' was circulated claiming the institution used the Book of Mormon as an archaeological guide. The Smithsonian issued a formal statement denying it, and now sends a standard letter saying its archaeologists see no connection between the New World's archaeology and the book's contents."},{"t":"Tacitus","d":"Roman senator and historian (c. 56–120 AD). His hostile mention of 'Christus,' executed by the procurator Pontius Pilate under Tiberius, is the standard non-Christian confirmation of the crucifixion."},{"t":"the Tetragrammaton","d":"YHWH, the four Hebrew letters of God's personal name, rendered 'Jehovah' in the New World Translation and 'the LORD' in most English Bibles. The Witnesses' insistence on it is a genuine point in their favour in the Old Testament; the difficulty is that the NWT also inserts 'Jehovah' 237 times into the New Testament, where no Greek manuscript has it."},{"t":"textual criticism","d":"The scholarly discipline of comparing manuscripts to work out what the original wording was. It is not an attack on Scripture — it is the method that lets us say with confidence what the text said."},{"t":"the Watchtower","d":"Both the organization's flagship magazine (published since 1879) and the shorthand for the Watch Tower Bible and Tract Society, its legal and publishing arm. When a case cites 'The Watchtower, 15 March 1975,' it is citing the magazine — the primary evidence throughout this section."}];

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function hl(text,phrases){let out=esc(text);(phrases||[]).forEach(p=>{const e=esc(p).replace(/[.*+?^${}()|[\]\\]/g,"\\$&");out=out.replace(new RegExp(e,"gi"),m=>"<mark>"+m+"</mark>");});return out;}
function glossify(escapedText){
  if(!glossify._re){
    const ts=GLOSSARY.slice().sort((a,b)=>esc(b.t).length-esc(a.t).length);
    const alts=ts.map(g=>esc(g.t).replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|");
    glossify._re=new RegExp("(?<![\\w-])("+alts+")(?![\\w-])","gi");
    glossify._map={};GLOSSARY.forEach(g=>{glossify._map[esc(g.t).toLowerCase()]=g;});
  }
  const used=glossify.seen||(glossify.seen=new Set());
  return escapedText.replace(/(<[^>]*>)|([^<]+)/g,(m,tag,txt)=>{
    if(tag)return tag;
    return txt.replace(glossify._re,w=>{
      const g=glossify._map[w.toLowerCase()];
      if(!g||used.has(g.t))return w;
      used.add(g.t);
      return '<span class="g" tabindex="0">'+w+'<span class="gt"><b>'+esc(g.t)+'</b> — '+g.d+'</span></span>';
    });
  });
}


function findWhy(d,cite){
  const key=cite.replace(/–/g,"-").replace(/\s*\(.*\)\s*/g,"").trim();
  const m=key.match(/^([1-4]?\s?[A-Za-z&; ]+?)\s+(\d+)/);
  const frag=m?(m[1].trim()+" "+m[2]):key;
  const sentences=(d.claim+" "+d.rationale).replace(/–/g,"-").split(/(?<=[.!?])\s+/);
  const hit=sentences.find(s=>s.includes(frag));
  return hit?hit.replace(/-/g,"–"):null;
}

function extUrl(cite){
  const c=cite.replace(/–/g,"-").replace(/\s*\(.*\)\s*/g,"").trim();
  const qm=c.match(/^Quran\s+(\d+):(\d+)/i);
  if(qm)return "https://quran.com/"+qm[1]+"/"+qm[2];
  const qc=c.match(/^Quran\s+(\d+)/i);
  if(qc)return "https://quran.com/"+qc[1];
  const mm=c.match(/^([1-3]?\s?[A-Za-z ]+?)\s+(\d+)/);
  if(mm)return "https://www.biblegateway.com/passage/?search="+encodeURIComponent(c)+"&version=KJV";
  return "https://quran.com/";
}

/* ---------- case ---------- */
function openCase(id,fromPath){
  state.caseId=id;state.sel=id;state.view="case";
  if(location.hash!=="#case/"+id)try{history.pushState(null,"","#case/"+id)}catch(e){}
  if(!fromPath)state.pathId=state.pathId; // keep path context if navigating within
  store.markRead(id);
  render();
  window.scrollTo({top:0});
}
function ROLENOTE(side){return side==="quran"?"<b>Role:</b> this is the Watchtower teaching the claim examines.":"<b>Role:</b> this is the biblical standard the claim measures against.";}
const DEFLABEL="How Jehovah's Witnesses answer this — put at its strongest";
const VDESC={"admitted":"The Watchtower's own publications concede these facts — cite them from their sources alone","unrefuted":"No adequate answer exists — or the best answers concede the point","contested":"A serious rebuttal exists; both sides are shown","answered":"The defense holds — included so nothing here is cherry-picked"};
function plainHtml(d){
  const rt=t=>glossify(emphasize(esc(t).replace(/&lt;(\/?)(b|i)&gt;/g,"<$1$2>")));
  return (d.plain||[]).map(b=>{
    const ss=splitSentences(b.d),ps=[];
    for(let i=0;i<ss.length;i+=2)ps.push("<p>"+rt(ss.slice(i,i+2).join(" "))+"</p>");
    const t=b.t.toLowerCase();
    const kind=b.say?"k-say":/^(the objection|what (you|your|people|they)|how it usually)/.test(t)?"k-them":/(verse|text|chapter|says|passage|record|promise|covenant does)/.test(t)?"k-text":/^how strong|^the rule|don't|do not use/.test(t)?"k-strength":/^why this|^why it|helps you/.test(t)?"k-help":"k-plain";
    const big=/(k-text|k-say)/.test(kind)?" k-big":"";
    return `<div class="pblk${b.say?" say":""}${big}"><div class="plab ${kind}">${esc(b.t)}</div>${ps.join("")}</div>`;
  }).join("");
}

  const hadithChips=(d.hadith||[]).map(h=>{

  }).join("");
  const cimg=IMGMAP[d.id]?`<figure class="cimg"><img src="${IMGMAP[d.id].src}" alt="${esc(IMGMAP[d.id].cap)}" loading="lazy"><button class="cimg-x" title="Expand image" data-full="${IMGMAP[d.id].src.replace("width=520","width=1400")}" data-cap="${esc(IMGMAP[d.id].cap)}">⤢</button><figcaption>${esc(IMGMAP[d.id].cap)}</figcaption></figure>`:"";

        ${(d.quran||[]).length?`<div><h6 class="h-bom">Watchtower</h6><div class="chips" data-side="quran">${chipHtml(d.quran)}</div></div>`:""}
        ${(d.hadith||[]).length?`<div><h6 class="h-bom" style="color:var(--amber)">Watchtower publications</h6><div class="chips" data-side="hadith">${hadithChips}</div></div>`:""}

      <span style="font-size:.72rem;color:var(--dim)">${idx+1>0?`Case ${idx+1} of ${list.length}`:""} · <kbd>←</kbd>/<kbd>→</kbd> to move</span>
      ${nextInPath?`<button class="pathnext" id="pathnext">Next in path →</button>`:""}
    </div>
    <div class="case">
      <div class="meta"><span class="badge v-${d.verdict}">${VLABEL[d.verdict]} ${info(TIPS.verdict[d.verdict])}</span><span class="tag">${CATS[d.category]} ${info(CATDESC[d.category])}</span><span class="tag">seriousness: ${SEVLABEL[d.severity]} ${info(TIPS.impact)}</span>${d.avoid?`<span class="tag" style="border-color:var(--red);color:var(--red)">⚠ popular claim — do not use it</span>`:d.featured?`<span class="tag" style="border-color:var(--gold);color:var(--gold)">★ strongest evidence ${info(TIPS.strongest)}</span>`:isStrong(d)?`<span class="tag" style="border-color:var(--amber);color:var(--amber)">☆ strong evidence</span>`:""}</div>
      <h2>${esc(d.title)}</h2>
      ${(d.plain&&d.plain.length&&store.full)?`<button class="quickback" id="toquick">← Show the quick summary</button>`:""}
      <div class="ctop">

      ${comp}
      <div class="tabs2">

        <div class="pair2">

    $("#back").addEventListener("click",()=>{state.view=path?"paths":"overview";state.caseId=null;render();});
  if(nextInPath)$("#pathnext").addEventListener("click",()=>openCase(nextInPath));
  document.querySelectorAll(".relrow [data-open]").forEach(b=>b.addEventListener("click",()=>openCase(b.dataset.open)));
  let pinnedCite=null,hoverTimer=null,scrolling=false,scrollT=null;

  const sideOf=ch=>ch.closest("[data-side]")?ch.closest("[data-side]").dataset.side:"";
  const buildHtml=(cite,v,side)=>{
    if(!v||!v.verses)

    }).join("");
    return '<div class="versebox"><div class="vr"><span>'+esc(cite)+ctx+'</span><button data-close>✕ close</button></div><div class="vtext">'+body+'</div><div class="vwhy">'+whyHtml+'</div></div>';

    const box=vbox(); if(!box)return;
    const cite=ch.dataset.cite;
    const host=ch.closest(".pblk")||ch.closest(".claim")||ch.closest(".defense")||null;

    }
    document.querySelectorAll(".chip.open,.chip.peek").forEach(x=>x.classList.remove("open","peek"));
    ch.classList.add(pin?"open":"peek");
    if(pin)pinnedCite=cite;
    box.innerHTML=buildHtml(cite,VERSES[cite],sideOf(ch));
    const cb=box.querySelector("[data-close]");if(cb)cb.addEventListener("click",clearVerse);
  };
  window.addEventListener("scroll",()=>{scrolling=true;clearTimeout(scrollT);clearTimeout(hoverTimer);

  document.querySelectorAll("#main .ref-bib, #main .ref-lds").forEach(r=>{
    const key=r.textContent.replace(/\s+/g," ").trim().replace(/[.,;:]$/,"");
    const hit=VERSES[key]?key:Object.keys(VERSES).find(k=>k.replace(/[\u2013\u2014]/g,"-")===key.replace(/[\u2013\u2014]/g,"-"));
    if(!hit)return;

  });
  const canHover=window.matchMedia("(hover:hover)").matches;
  document.querySelectorAll(".chip").forEach(ch=>{

        hoverTimer=setTimeout(()=>{if(!scrolling&&!pinnedCite)openVerse(ch,false);},240);});
      ch.addEventListener("mouseleave",()=>{clearTimeout(hoverTimer);
        if(pinnedCite)return;
        hoverTimer=setTimeout(()=>{if(!pinnedCite)clearVerse();},160);});
    }
  });
  
document.querySelectorAll(".cimg-x").forEach(b=>b.addEventListener("click",e=>{e.stopPropagation();showLightbox(b.dataset.full,b.dataset.cap);}));
  renderNav();renderPreview();
}
