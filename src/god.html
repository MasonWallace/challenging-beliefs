<title>Which Gospel? — The Case for God, for Skeptics</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --bg:#0f1116; --side:#0b0d11; --panel:#161a21; --panel2:#12151b; --line:#232833; --line2:#2b313d;
    --ink:#e7e9ec; --muted:#98a0ac; --dim:#565e6b; --gold:#82b1d8; --gold-ink:#0e1116;
    --red:#e0736a; --red-bg:#38221f; --red-cell:#5e2b27; --red-cell-hi:#8a3a32;
    --amber:#cf9a45; --amber-bg:#332a18; --amber-cell:#54431f; --amber-cell-hi:#7d6224;
    --green:#7fb08d; --green-bg:#1d2c26; --green-cell:#27443a;
    --purp:#b394e0; --purp-bg:#2c2440;
    --serif:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif;
    --sans:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    --acc:var(--gold);
    --acc2:var(--purp);
    --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  }
  :root[data-theme="light"]{
    --bg:#f3f4f6; --side:#e9ebee; --panel:#ffffff; --panel2:#f7f8fa; --line:#dfe2e7; --line2:#cfd4db;
    --ink:#1b1e23; --muted:#5c6470; --dim:#9aa1ab; --gold:#2f6b9e; --gold-ink:#ffffff;
    --red:#b03a31; --red-bg:#f6e4e2; --red-cell:#e7b6b1; --red-cell-hi:#cc766d;
    --amber:#8a5f0e; --amber-bg:#f3ecd9; --amber-cell:#e4d1a2; --amber-cell-hi:#c6a75e;
    --green:#3e7455; --green-bg:#e3ede6; --green-cell:#b7d1bf;
    --purp:#6b4fa1; --purp-bg:#ece5f6;
  }
  *{box-sizing:border-box}
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6}
  a{color:var(--gold)}
  button{font-family:inherit}
  mark{background:color-mix(in srgb,var(--amber) 30%,transparent);color:inherit;border-radius:2px;padding:0 2px}
  kbd{font-family:var(--mono);font-size:.72rem;background:var(--panel);border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;padding:1px 6px;color:var(--muted)}

  .app{display:grid;grid-template-columns:216px minmax(0,1fr) 280px;min-height:100vh}
  @media (max-width:1020px){.app{grid-template-columns:216px minmax(0,1fr)}.preview{display:none}}
  @media (max-width:720px){.app{grid-template-columns:1fr}.side{position:sticky;top:0;z-index:40;height:auto;border-right:0;border-bottom:1px solid var(--line)}
    .side .nav{display:flex;flex-wrap:wrap;gap:2px;padding:0 10px 10px}.side .nav h5{display:none}.side .sideprog{display:none}}

  /* sidebar */
  .side{background:var(--side);border-right:1px solid var(--line);padding:18px 0;position:sticky;top:0;height:100vh;overflow-y:auto}
  @media (max-width:720px){.side{height:auto;overflow:visible}}
  .logo{font-family:var(--serif);font-size:1rem;letter-spacing:.1em;padding:0 18px 14px;color:var(--ink)}
  .logo b{color:var(--gold)}
  .sidesearch{padding:0 14px 12px}
  .sidesearch input{width:100%;font-family:inherit;font-size:.82rem;padding:7px 12px;border-radius:8px;border:1px solid var(--line2);background:var(--panel);color:var(--ink)}
  .sidesearch input:focus{outline:2px solid var(--gold);outline-offset:1px}
  .info{display:inline-grid;place-items:center;width:14px;height:14px;border:1px solid currentColor;border-radius:50%;font-size:.58rem;font-style:normal;font-weight:700;opacity:.75;cursor:help;position:relative;flex:none}
  .info:hover,.info:focus{opacity:1}
  .info .tip{display:none;position:absolute;left:50%;transform:translateX(-50%);top:160%;width:250px;background:var(--side);color:var(--ink);border:1px solid var(--line2);font-family:var(--sans);font-size:.76rem;line-height:1.5;padding:9px 12px;border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.35);z-index:30;text-transform:none;letter-spacing:0;font-weight:400;text-align:left}
  .info:hover .tip,.info:focus .tip{display:block}
  .badge,.tag{display:inline-flex;align-items:center;gap:5px}
  .nav a{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 18px;font-size:.86rem;color:var(--muted);text-decoration:none;cursor:pointer;border-left:2px solid transparent}
  .nav a:hover{background:var(--panel2);color:var(--ink)}
  .nav a.on{background:var(--panel);color:var(--ink);border-left-color:var(--gold)}
  .nav .cnt{font-family:var(--mono);font-size:.68rem;color:var(--dim)}
  .nav h5{font-size:.64rem;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin:18px 18px 6px;font-weight:600}
  .sideprog{margin:22px 18px 8px;font-size:.72rem;color:var(--muted)}
  .pbar{height:4px;background:var(--line);border-radius:2px;margin-top:6px;overflow:hidden}
  .pbar i{display:block;height:100%;background:var(--gold);transition:width .4s ease}

  /* main */
  .main{padding:18px 26px 80px;min-width:0}
  .cmd{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line2);border-radius:8px;padding:4px 8px 4px 14px;margin-bottom:18px}
  .cmd input{flex:1;background:none;border:0;color:var(--ink);font-family:inherit;font-size:.9rem;padding:7px 0;outline:none}
  .cmd input::placeholder{color:var(--dim)}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:20px}
  .tile{background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:12px 14px;cursor:pointer;text-align:left;color:var(--ink)}
  .tile:hover{border-color:var(--gold)}
  .tile.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
  .tile .v{font-family:var(--serif);font-size:1.7rem;font-variant-numeric:tabular-nums;line-height:1.1}
  .tile .l{font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:2px}
  .tile.t-ad .v{color:var(--purp)}.tile.t-un .v{color:var(--red)}.tile.t-co .v{color:var(--amber)}.tile.t-an .v{color:var(--green)}
  h4.bt{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;font-weight:600}
  .vwall{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:10px;align-items:start}
  @media (max-width:1240px){.vwall{grid-template-columns:1fr 1fr}}
  @media (max-width:700px){.vwall{grid-template-columns:1fr}}
  .vcol{background:var(--panel2);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .vcol header{padding:14px 16px 12px;border-bottom:2px solid var(--line)}
  .vcol.ad header{border-bottom-color:var(--purp)}
  .vcol.ad .n,.vcol.ad .t{color:var(--purp)}
  .vcol.ad .vt:hover{border-left-color:var(--purp)}
  .vcol.un header{border-bottom-color:var(--red)}
  .vcol.co header{border-bottom-color:var(--amber)}
  .vcol.an header{border-bottom-color:var(--green)}
  .vcol header .n{font-family:var(--serif);font-size:1.9rem;line-height:1;font-variant-numeric:tabular-nums}
  .vcol.un .n{color:var(--red)}.vcol.co .n{color:var(--amber)}.vcol.an .n{color:var(--green)}
  .vcol header .t{font-size:.72rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;margin-left:8px}
  .vcol.un .t{color:var(--red)}.vcol.co .t{color:var(--amber)}.vcol.an .t{color:var(--green)}
  .vcol header .d{font-size:.74rem;color:var(--muted);margin-top:4px}
  .vgroup h6{font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:0;padding:10px 16px 4px;font-weight:600}
  .vt{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:9px 16px 9px 13px;cursor:pointer;color:var(--ink);border-left:3px solid transparent}
  .vt:hover,.vt.sel{background:var(--panel)}
  .vt.sel{border-left-color:var(--gold)}
  .vcol.un .vt:hover{border-left-color:var(--red)}
  .vcol.co .vt:hover{border-left-color:var(--amber)}
  .vcol.an .vt:hover{border-left-color:var(--green)}
  .vt.dimmed{opacity:.25}
  .vt h5{font-family:var(--serif);font-weight:500;font-size:.92rem;line-height:1.35;margin:0}
  .vt .m{font-size:.66rem;color:var(--dim);letter-spacing:.05em;text-transform:uppercase;margin-top:2px;display:flex;gap:8px;align-items:center}
  .vt .m .rd{color:var(--green)}
  .vt .m .star{color:var(--gold)}

  /* list */
  .rows{display:flex;flex-direction:column}
  .rowitem{display:grid;grid-template-columns:12px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:11px 6px;cursor:pointer;color:var(--ink)}
  .rowitem:hover,.rowitem.sel{background:var(--panel2)}
  .rowitem .stripe{width:4px;height:26px;border-radius:2px}
  .rowitem.v-unrefuted .stripe{background:var(--red)}
  .rowitem.v-contested .stripe{background:var(--amber)}
  .rowitem.v-answered .stripe{background:var(--green)}
  .rowitem h5{font-family:var(--serif);font-weight:500;font-size:1rem;margin:0;line-height:1.35}
  .rowitem .sub{font-size:.72rem;color:var(--muted)}
  .rowitem .meta{display:flex;gap:8px;align-items:center;font-size:.66rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;white-space:nowrap}
  .rowitem .meta .rd{color:var(--green)}

  .badge{font-size:.64rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:3px 9px;border-radius:999px;display:inline-block}
  .badge.v-admitted{background:var(--purp-bg);color:var(--purp)}
  .badge.v-unrefuted{background:var(--red-bg);color:var(--red)}
  .badge.v-contested{background:var(--amber-bg);color:var(--amber)}
  .badge.v-answered{background:var(--green-bg);color:var(--green)}
  .tag{font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line2);border-radius:999px;padding:2px 9px;display:inline-block}

  /* case view */
  .backbar{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
  .backbar button.bk{background:var(--panel);border:1px solid var(--line2);color:var(--muted);border-radius:8px;padding:6px 13px;font-size:.8rem;cursor:pointer}
  .backbar button.bk:hover{color:var(--ink);border-color:var(--gold)}
  .pathnext{margin-left:auto;background:var(--gold);color:var(--gold-ink);border:0;border-radius:8px;padding:7px 14px;font-size:.8rem;font-weight:700;cursor:pointer}
  .case h2{font-family:var(--serif);font-weight:500;font-size:1.6rem;line-height:1.25;margin:10px 0 14px;max-width:30ch;text-wrap:balance}
  .case .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
  .dlab{font-size:.7rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:26px 0 10px}
  .dlab.red{color:var(--red)}.dlab.blue{color:var(--gold)}
  .claimrow{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(270px,1fr);gap:28px;align-items:start}
  .claimrow.solo{grid-template-columns:1fr}
  @media (max-width:900px){.claimrow{grid-template-columns:1fr}}
  .claim p{font-size:.97rem;line-height:1.75;max-width:66ch;margin:0 0 12px}
  .claimside{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:16px 18px;position:sticky;top:16px}
  .claimside .passcols{grid-template-columns:1fr;gap:12px}
  .claimside .sidenote{font-size:.76rem;color:var(--dim);margin:-4px 0 12px}
  .defense p.lead{margin:0 0 4px}
  .defense p{line-height:1.7;margin:0 0 10px}
  .pts{margin:8px 0 0;padding:0;list-style:none;counter-reset:pt}
  .pts li{position:relative;padding:10px 0 10px 36px;border-top:1px dashed color-mix(in srgb,var(--green) 25%,var(--line));line-height:1.7}
  .pts li:first-child{border-top:0}
  .pts li::before{counter-increment:pt;content:counter(pt);position:absolute;left:0;top:10px;width:23px;height:23px;border-radius:50%;background:var(--green-bg);color:var(--green);display:grid;place-items:center;font-size:.72rem;font-weight:700}
  .vbox p{margin:0 0 8px;line-height:1.7}
  .vbox p:last-child{margin-bottom:0}
  .ref-lds{color:var(--red);font-weight:600}
  .ref-bib{color:var(--gold);font-weight:600}
  .qq{font-family:var(--serif);font-style:italic;background:color-mix(in srgb,var(--amber) 16%,transparent);border-radius:3px;padding:0 3px}
  .kw{font-weight:700;text-decoration:underline;text-underline-offset:2px}
  .talk{background:color-mix(in srgb,var(--green) 8%,var(--panel));border:1px solid color-mix(in srgb,var(--green) 30%,var(--line));border-radius:8px;padding:16px 18px;font-size:.93rem;max-width:80ch}
  .talk p{margin:0 0 8px;line-height:1.7}
  .talk p:last-child{margin-bottom:0}
  .dlg{display:flex;flex-direction:column;gap:10px;max-width:76ch}
  .dlg .msg{border-radius:12px;padding:12px 16px;max-width:88%}
  .dlg .msg p{margin:0;font-size:.9rem;line-height:1.65}
  .dlg .who{display:block;font-size:.64rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin-bottom:4px}
  .dlg .them{align-self:flex-start;background:var(--panel);border:1px solid var(--line2);border-bottom-left-radius:4px}
  .dlg .them .who{color:var(--red)}
  .dlg .you{align-self:flex-end;background:color-mix(in srgb,var(--green) 9%,var(--panel));border:1px solid color-mix(in srgb,var(--green) 30%,var(--line));border-bottom-right-radius:4px}
  .dlg .you .who{color:var(--green)}
  .corelinks{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .corelink{font-size:.78rem;background:var(--panel2);border:1px solid var(--line2);color:var(--gold);border-radius:999px;padding:5px 13px;cursor:pointer;text-align:left}
  .corelink:hover{border-color:var(--gold)}
  .gtab{width:100%;border-collapse:collapse;font-size:.86rem;margin:14px 0 6px}
  .gtab th{text-align:left;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:8px 12px;border-bottom:2px solid var(--line2)}
  .gtab th:nth-child(2){color:var(--red)}
  .gtab th:nth-child(3){color:var(--gold)}
  .gtab td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.55}
  .gtab td:first-child{font-weight:700;white-space:nowrap;color:var(--muted)}
  .dodont{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media (max-width:700px){.dodont{grid-template-columns:1fr}}
  .dodont ul{margin:8px 0 0;padding-left:18px;font-size:.86rem;color:var(--muted)}
  .dodont li{padding:3px 0;line-height:1.55}
  .why{background:color-mix(in srgb,var(--gold) 7%,var(--panel));border:1px solid color-mix(in srgb,var(--gold) 28%,var(--line));border-radius:8px;padding:16px 18px;font-size:.93rem;max-width:80ch}
  .why p{margin:0 0 10px;line-height:1.7}
  .why .wtail{color:var(--muted);font-style:italic;margin-bottom:0;border-top:1px dashed color-mix(in srgb,var(--gold) 30%,var(--line));padding-top:10px}
  .compare2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media (max-width:760px){.compare2{grid-template-columns:1fr}}
  .pane{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
  .pane .ref{font-size:.7rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
  .pane.bom .ref{color:var(--red)}.pane.bible .ref{color:var(--gold)}
  .pane .scripture{font-family:var(--serif);font-size:1rem;line-height:1.65}
  .cnote{font-size:.8rem;color:var(--muted);margin-top:8px;max-width:80ch}
  .passcols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media (max-width:760px){.passcols{grid-template-columns:1fr}}
  .passcols h6{font-size:.68rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin:0 0 8px}
  .passcols .h-bom{color:var(--red)}.passcols .h-bib{color:var(--gold)}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{font-size:.78rem;font-family:var(--serif);border:1px solid var(--line2);background:var(--panel);border-radius:6px;padding:4px 10px;cursor:pointer;color:var(--ink)}
  .chip:hover{border-color:var(--gold)}
  .chip.open{background:var(--amber-bg);border-color:var(--gold)}
  .chip.ext::after{content:" ↗";color:var(--muted);font-family:var(--sans);font-size:.68rem}
  .versebox{grid-column:1/-1;background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:8px;padding:14px 18px;margin-top:4px}
  .versebox .vr{font-size:.7rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-bottom:8px;display:flex;justify-content:space-between}
  .versebox .vr button{background:none;border:0;color:var(--muted);cursor:pointer;font-size:.8rem}
  .versebox .vtext{font-family:var(--serif);font-size:.98rem;line-height:1.7;max-width:72ch}
  .versebox .vnum{font-family:var(--sans);font-size:.62rem;color:var(--muted);vertical-align:super;margin-right:3px}
  .versebox .vwhy{margin-top:10px;font-size:.8rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px;max-width:76ch}
  .versebox .vwhy b{color:var(--gold)}
  .srcdet{margin-top:30px;border-top:1px solid var(--line);padding-top:14px}
  .srcdet summary{font-size:.74rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);cursor:pointer;list-style:none}
  .srcdet summary::before{content:"▸ ";color:var(--gold)}
  .srcdet[open] summary::before{content:"▾ "}
  .srcdet .srcs{margin-top:12px}
  .app.reading{grid-template-columns:216px minmax(0,1fr)}
  .app.reading .preview{display:none}
  body:has(.app.reading) .keysbar{right:0}
  .srcs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
  .srcs li{display:flex;gap:9px;align-items:baseline;font-size:.85rem}
  .sb{flex:none;font-size:.6rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;border-radius:4px;padding:2px 7px;position:relative;top:-1px}
  .sb-scholarly{background:var(--green-bg);color:var(--green)}
  .sb-apologetics{background:var(--amber-bg);color:var(--amber)}
  .sb-primary,.sb-institutional{background:color-mix(in srgb,var(--gold) 16%,transparent);color:var(--gold)}
  .sb-journalism{background:var(--panel);color:var(--muted);border:1px solid var(--line2)}
  .sb-testimony{background:var(--red-bg);color:var(--red)}
  .defense{background:color-mix(in srgb,var(--green) 7%,var(--panel));border:1px solid color-mix(in srgb,var(--green) 30%,var(--line));border-radius:8px;padding:16px 18px;font-size:.92rem;max-width:80ch}
  .defense .dsrc{font-size:.78rem;color:var(--muted);margin-top:10px}
  .vbox{display:flex;gap:12px;align-items:flex-start;border-radius:8px;padding:16px 18px;font-size:.92rem;max-width:80ch}
  .vbox.v-admitted{background:var(--purp-bg)}.vbox.v-unrefuted{background:var(--red-bg)}.vbox.v-contested{background:var(--amber-bg)}.vbox.v-answered{background:var(--green-bg)}
  .vbox b.vb{flex:none;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;padding-top:3px}
  .vbox.v-admitted b.vb{color:var(--purp)}.vbox.v-unrefuted b.vb{color:var(--red)}.vbox.v-contested b.vb{color:var(--amber)}.vbox.v-answered b.vb{color:var(--green)}
  .relrow{display:flex;gap:8px;flex-wrap:wrap}
  .relrow button{font-size:.78rem;background:var(--panel);border:1px solid var(--line2);color:var(--ink);border-radius:999px;padding:5px 13px;cursor:pointer}
  .relrow button:hover{border-color:var(--gold);color:var(--gold)}
  .pinbtn{background:none;border:1px dashed var(--line2);color:var(--muted);border-radius:8px;padding:7px 14px;font-size:.8rem;cursor:pointer}
  .pinbtn:hover{border-color:var(--gold);color:var(--gold)}
  .pinbtn.pinned{border-style:solid;border-color:var(--gold);color:var(--gold)}

  /* glossary tooltip */
  .g{border-bottom:2px dotted var(--gold);cursor:help;position:relative}
  .g .gt{display:none;position:absolute;left:0;top:140%;width:270px;background:var(--side);color:var(--ink);border:1px solid var(--line2);font-family:var(--sans);font-size:.78rem;line-height:1.5;padding:10px 13px;border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.35);z-index:20;font-style:normal;font-weight:400}
  .g:hover .gt,.g:focus .gt{display:block}

const WHYMAP={"existence-arguments":"These do not deliver Christianity — they deliver the possibility of it. Their job is to move 'obviously not' to 'that's worth thinking about,' which is the only move most conversations need.","resurrection-case":"Christianity is the one faith that stakes itself on a public, datable, falsifiable event. Paul says so himself: if it didn't happen, the whole thing is worthless.","manuscript-reliability":"If the text can't be trusted to be what was written, nothing built on it matters. This is also where honesty pays most — the variant count is not a secret, and pretending otherwise is why people stop listening.","archaeology-history":"The Bible makes checkable claims about real kings, real pools, and real officials. Some check out strikingly. One genuinely doesn't yet, and saying so is what makes the rest credible.","prophecy-evidence":"Prophecy is the argument most often ruined by overclaiming. Handled carefully it is real evidence; handled loosely it converts a skeptic into a skeptic with a good story about you.","objections-answered":"These are not talking points to defeat — they are the reasons people actually don't believe, and several of them are genuinely hard. An answer that pretends they're easy answers nothing.","dont-use-apologetics":"Every one of these is still in circulation, and each one costs a hearing for everything true you have to say. Retiring them is the highest-return thing on this page."};

 that fast, and every skeptic has a list of Christians who could not do it."};
const DIALOG={"existence-arguments":[{"w":"them","t":"Let me be precise, because most Christians argue with a strawman. I don't claim 'there is no God' with dogmatic certainty. My claim is Oppy's: naturalism and theism both explain the world, but naturalism does it with fewer commitments — no extra divine entity. Simpler theory, same data. That's why I'm an atheist."},{"w":"you","t":"That's the strongest version of atheism and I'd rather argue with it than the bumper sticker — thank you. But I'd contest 'same data.' Naturalism has to take as brute, unexplained facts things theism predicts: that anything contingent exists at all, that the constants sit inside a life-permitting window as narrow as 1 part in 10^120 for the cosmological constant, that the universe is intelligible to minds. A 'simpler' theory that must shrug at more data isn't simpler — it's just shorter."},{"w":"them","t":"Fine-tuning has a naturalistic answer: the multiverse plus observer selection. Infinite universes, varying constants — of course we find ourselves in a habitable one. Where else would we be?"},{"w":"you","t":"I won't pretend that's a dodge — the multiverse comes out of serious physics, and I'd rather you hold it than pretend the tuning isn't there. Two honest pushbacks, though: it's postulated, not observed, and possibly unobservable in principle — an interesting position for the 'evidence only' side; and the multiverse-generating mechanism itself needs finely set laws to churn out universes at all, so the tuning question climbs one level and waits for you there. You've multiplied entities beyond anything theism ever dreamed to avoid one Mind."},{"w":"them","t":"And here's my fatigue talking: every one of these arguments is a god-of-the-gaps. 'Science can't explain X, therefore God.' The gaps keep closing. Lightning, disease, now cosmology — same retreat, new trench."},{"w":"you","t":"If I were arguing from ignorance you should dismiss me — but notice these arguments run the other way: from what we KNOW. We know the constants' values; we know contingency; the more cosmology advanced, the sharper the beginning and the tuning got — Lemaître, a priest, did some of the advancing. So here's my honest question, and you can refuse it: setting proofs aside, if it turned out there were a Mind behind this — would that be good news to you, or bad news? Nagel admitted 'I hope there is no God.' I'm not scoring points; I genuinely want to know which conversation we're actually in."}],"resurrection-case":[{"w":"them","t":"Extraordinary claims require extraordinary evidence, and a resurrection is the most extraordinary claim there is. Hume settled this: it's always more probable that testimony is mistaken than that nature broke. Whatever your evidence is, 'they lied or erred' beats 'a man rose.'"},{"w":"you","t":"I accept the principle — big claims need serious evidence — but Hume's version proves too much: it would forbid believing ANY sufficiently rare event on testimony, which isn't how history or courts work. So let's do it your way: start from only what critical scholars grant. Jesus was crucified — Ehrman calls it one of the most certain facts of history. His followers had experiences they were convinced were the risen Jesus — the atheist scholar Lüdemann says that's 'historically certain.' The church's enemy Paul and skeptical brother James flipped. My claim is modest: the resurrection is the best EXPLANATION of that data. Beat the explanation."},{"w":"them","t":"I've read my Ehrman too, so let's be honest about him: he does NOT grant your empty tomb, and he thinks apologists oversell the '1 Corinthians 15 creed within three years' dating. You're quote-mining concessions."},{"w":"you","t":"You're right, and I'll say it plainly: Ehrman disputes the empty tomb and cautions against the tight creed dating — anyone who cites him without saying so is bluffing, and you've earned the right to hate bluffing. What he does affirm: the creed is pre-Pauline tradition, and Paul got it early — at latest around his Jerusalem visit within a few years of the cross; the aggressive early dating actually comes from non-Christians like Lüdemann and Goulder. So even on Ehrman's floor: no legend had time to grow. Something happened in year one, not generation three."},{"w":"them","t":"Grief hallucinations happened. They're documented — bereaved people see the dead all the time. Traumatized disciples, cognitive dissonance, visions, and the story snowballs. No miracle needed."},{"w":"you","t":"Grief visions are real — I won't insult you by denying the literature. But look at the fit: they're private, individual, and the bereaved almost never conclude 'therefore he is bodily risen — let's die saying so.' This theory needs repeated experiences, to groups, including two men NOT grieving — Paul was hunting Christians and James thought his brother unhinged — plus it leaves the tomb occupied in the one city where producing the body ends the movement by lunch. I'll grant you this isn't mathematical proof; it's inference to the best explanation, and you're entitled to weigh it. My question is only whether you're weighing it — or whether, resurrection being unwelcome, any alternative wins by default. Would you WANT it to be true?"}],"manuscript-reliability":[{"w":"them","t":"Ehrman's number, since you like him: there are more variants among New Testament manuscripts than there are words IN the New Testament — 400,000 plus. It's a photocopied photocopy of anonymous documents. Why would I trust a word of it?"},{"w":"you","t":"The number's real, so let's look at the denominator he'd also give you: 400,000 variants counted across some 5,800 Greek manuscripts plus tens of thousands of ancient translations. More manuscripts means more variants the way more witnesses means more discrepancies — it's a symptom of a huge evidence base, which is the OPPOSITE of a transmission problem. The overwhelming majority are spelling, word order, a dropped article. Compare: most classical works survive in a few dozen copies from centuries later, and nobody panics. By the standards applied to Tacitus, this is embarrassment of riches."},{"w":"them","t":"Spelling errors, sure — but Mark's resurrection ending and the woman caught in adultery are whole invented PASSAGES. Your own study Bible admits it in the footnotes. Scribes added stories. That's not a typo problem."},{"w":"you","t":"Correct, both — and think about how you know. You know because the tradition is transparent enough to catch its own seams: thousands of manuscripts to compare, and the conclusions printed in brackets in every pew Bible on earth. A conspiracy doesn't footnote its forgeries. Those two passages are the LARGEST variants in existence, and no doctrine rests on either. The system worked in front of you — you're citing its receipts."},{"w":"them","t":"Honestly? I heard all this at youth group, then watched it fall apart. The gospels are still formally anonymous — 'according to Matthew' is a second-century label — and still written decades after the events by non-eyewitnesses. Polished transmission of anonymous late documents is still anonymous late documents."},{"w":"you","t":"The anonymity is formally true and I won't fight it — and I'm sorry youth group gave you the airbrushed version; you deserved the real one. Here's what the airbrush skipped, in both directions: 'decades later' is EARLY for ancient biography — within living eyewitness memory, with Paul's letters and that creed earlier still. And the attribution puzzle cuts oddly: the titles are uniform everywhere we find them — no manuscript calls Matthew anything else — and if the church were inventing authorities from scratch, Mark (a nobody) and Luke (not even a witness) are bizarre choices over Peter or James. My offer stands from earlier: you clearly know this material. Pick the hardest passage you've got and let's read it together — I'd rather do that than trade summaries of other people's YouTube videos."}],"archaeology-history":[{"w":"them","t":"Strip away believers writing about their own beliefs, and what's left? No contemporary record of Jesus. No Roman paperwork. For the Old Testament it's worse — David and Solomon's empire leaves barely a trace. These are legends with street names."},{"w":"you","t":"Let's calibrate 'no record' against how antiquity works: almost no one — governors, generals — gets contemporary paperwork that survives; we date and know most figures from later narrative sources. For Jesus, within about 90 years we have Tacitus, hostile, confirming his execution under Pilate; Josephus (using the version scholars keep after trimming Christian interpolation — I'll concede the tampering before you raise it); Pliny interrogating Christians. That's why virtually no credentialed historian, Ehrman loudly included, doubts Jesus existed. And David stopped being 'legendary' in 1993, when the Tel Dan stele turned up — an ENEMY king bragging about defeating the 'House of David.' Pilate got his own stone at Caesarea in 1961. The 'never existed' category keeps shrinking on contact with dirt."},{"w":"them","t":"Fine, a stele names a dynasty. But archaeology also bites you: the Exodus — two million people, forty years in Sinai — leaves nothing. No camps, no graves, nothing. And archaeologists like Finkelstein say the conquest of Canaan didn't happen as written. Do you take the dirt or the book?"},{"w":"you","t":"I'll give you a straight answer instead of a brochure: Exodus archaeology is genuinely contested, including among believing scholars — some argue a smaller exodus and a misread number-word for 'thousand,' some redate the evidence, and honest ones admit the Sinai record is thin. I won't bluff you where the field itself is arguing. But keep both ledgers open: the same discipline delivered Tel Dan, the Pilate stone, Hezekiah's tunnel and its inscription, the Pool of Siloam, Caiaphas's ossuary. The pattern for a century has been skeptical consensus first, spade second — 'no Hittites' until Hittite archives, 'no David' until Tel Dan."},{"w":"them","t":"Even granting every stone: archaeology proving a pool existed doesn't prove a man healed a blind guy there. You're using confirmed geography to smuggle in unconfirmed miracles."},{"w":"you","t":"Completely right, and I want the claim exactly that size: archaeology can't prove theology — no stone will certify a miracle. What it does is test the FRAME: were these authors writing grounded history or floating legend? Legends set in nowhere accumulate no confirmable detail; John names a five-colonnaded pool everyone called fictional until it was excavated. Every dig keeps ruling out 'fable,' which forces the real question the dirt can't settle: the man at the center. That one's decided by reading him. Mark's sixteen chapters, one a week, your objections welcome — you bring Finkelstein, I'll bring coffee. Deal?"}],"prophecy-evidence":[{"w":"them","t":"Prophecy is the weakest wing of apologetics and honestly the reason I first started doubting. It's a shell game: either vague enough to fit anything, written AFTER the events — scholars date Daniel to the 160s BC, right after the events it 'predicts' — or ripped out of context, like Matthew using Isaiah 7:14, which is about a child in Isaiah's own day."},{"w":"you","t":"I'm going to concede more than you expect, because you're right about the shell games. The Maccabean dating of Daniel IS the critical consensus and apologists should say so instead of pretending otherwise. And Matthew's use of Isaiah 7:14 is typological — a this-fills-that pattern-reading, which is a real ancient Jewish way of reading but is not a knock-down prediction, and selling it as one is how youth groups manufacture future atheists like, apparently, you. So let me put one text on the table that doesn't dissolve: Isaiah 53."},{"w":"them","t":"Go ahead — but I know the move, so I'll pre-empt it: how do I know Isaiah 53 wasn't edited after Jesus, or that the gospel writers didn't just write Jesus' story to MATCH it? That's the standard explanation and it's a good one."},{"w":"you","t":"Both halves deserve answers. Post-dating is physically dead: the Great Isaiah Scroll sits in a Jerusalem museum, carbon-dated and paleographically dated to roughly 125 BC, complete, with chapter 53 intact — a century-plus before the cross, no edit possible. 'Written to match' is the serious option — for details the disciples controlled. But the spine of the passage is exactly what they COULDN'T stage and demonstrably didn't want: a servant despised, executed with criminals, whose death is counted as an offering for others' sins, then who 'prolongs his days.' A crucified Messiah was, on Paul's own report, a 'stumbling block to Jews and folly to Greeks' — you don't engineer your movement onto its era's most repulsive premise to fit a poem."},{"w":"them","t":"The rabbis would tell you the servant is Israel personified — the nation suffering in exile. Jewish readers had that text for centuries and didn't see Jesus in it. Why should I trust your reading over theirs?"},{"w":"you","t":"That's the oldest and best counter-reading and it deserves respect, not dismissal — Israel IS called the servant earlier in Isaiah. The wrinkle inside chapter 53 itself: this servant suffers FOR 'my people,' innocent for guilty, which is hard if the servant simply IS the people; and some pre-Christian and early rabbinic readings did take it messianically, so the door was never closed. But you shouldn't take my word or theirs. Blind test: read Isaiah 53 cold, no commentary, and tell me who you see. And then my real question, the one under all of this — if the poem DID come true in him, if the whole thing were actually so — is that a world you'd want to live in? Because that answer decides how the evidence gets weighed, for both of us."}],"objections-answered":[{"w":"them","t":"I need to stop you before the arguments start, because I know them all — I taught them, actually. I didn't leave Christianity over the kalam. I left because our youth pastor did things to kids, and when it came out, the elders protected him and prayed the families into silence. THEN I discovered the arguments were weak. So which do you want to defend first?"},{"w":"you","t":"Neither. What happened to those kids — and to you, watching the people who taught you about holiness organize a cover-up — was evil. Not 'imperfect,' not 'a failure of process.' Evil. And it was not Jesus. I'm not going to hand you an argument right now, because using philosophy to change the subject from your wound would be one more churchman managing you instead of hearing you. I'm sorry. If you want to tell me the rest, I'd rather listen than talk."},{"w":"them","t":"You should know every exvangelical has heard that too — 'that wasn't REAL Christianity.' It's the ultimate dodge. The abusers WERE the real Christians: elders, board members, the guy with the seminary degree. You don't get to keep the brand and refund the damage."},{"w":"you","t":"You're right — 'not real Christians' is usually a dodge, and I won't hide behind it. They held the offices; the institution owned it. Here's the one thing I'll put next to that, not against it: the angriest voice in the Bible about religious abusers is Jesus — 'whitewashed tombs' for the clergy, and for anyone who causes a child to stumble, better a millstone around the neck and the bottom of the sea. That's HIS sentence for your youth pastor. I'm not asking you back to that church or any institution tonight. I'm only noting that your fury at what they did — you learned that standard somewhere, and it wasn't from naturalism. Your rage agrees with him."},{"w":"them","t":"Then where was he? That's the whole problem, isn't it — not abstract 'evil' but THIS: kids prayed in that building for it to stop. Nothing. If a God watched that happen and did nothing, I don't want him even if he exists."},{"w":"you","t":"I'm not going to give you a tidy answer, because there isn't one and you've been lied to enough. I don't know why God didn't stop it. Christianity has never told me why THIS suffering, THIS child — anyone who claims that knowledge is selling something. What I have is smaller and stranger: a God who did not stay clear of it — betrayed by his inner circle, handed over by clergy, and who screamed 'why have you forsaken me?' from the cross. Not an explanation. A location: closer to those kids than to that pulpit. And your 'I don't want him even if he exists' — I won't argue with it. It's the most honest sentence anyone says, and God seems to prefer it to polite lies; there's a whole psalm category for it."},{"w":"them","t":"So what do you actually want from me? Because if this ends with an invitation to your church, we're done."},{"w":"you","t":"No church. Two things, both refusable. One: Mark's gospel, with me, a chapter a week — not because you don't know it, you probably know it better than I do, but because you've never once read it with the institution out of the room; watch what Jesus does around religious power and see if it reads differently now. Two, and only when you're ready for it: the question I ask myself in the dark — if it were true, the whole thing, a God who takes millstones personally and puts the last things right — would you WANT it to be true? You don't owe me an answer. Some people in your shoes say 'I wish I could believe it and can't,' and if that's you, I'm not going to argue with it. I'll just still be here next week."}]};
const ABBR=["c","cf","vs","e.g","i.e","etc","Dr","St","Mr","Mrs","ch","pp","v","vv","no","approx","Jr","Sr"];
function splitSentences(raw){
  const tokens=raw.split(/(?<=[.!?])\s+(?=[A-Z0-9"'(‘“])/);
  const merged=[];
  tokens.forEach(t=>{
    if(merged.length){
      const prev=merged[merged.length-1];
      const m=prev.match(/([A-Za-z&.]+)\.$/);
      const w=m?m[1].replace(/\./g,""):null;
      if(w&&ABBR.includes(w)){merged[merged.length-1]=prev+" "+t;return;}
    }
    merged.push(t);
  });
  return merged;
}
const LDSBOOKS="(?:Stanford Encyclopedia|SEP|Habermas|Ehrman|Oppy|Schellenberg|Bauckham|Wright|Licona|Craig|Carroll|4Q\\\\d+)";
const BIBBOOKS="(?:[1-3]\\s)?(?:Genesis|Exodus|Leviticus|Numbers|Deuteronomy|Joshua|Judges|Ruth|Samuel|Kings|Chronicles|Ezra|Nehemiah|Esther|Job|Psalms?|Proverbs|Ecclesiastes|Isaiah|Jeremiah|Lamentations|Ezekiel|Daniel|Hosea|Joel|Amos|Obadiah|Jonah|Micah|Nahum|Habakkuk|Zephaniah|Haggai|Zechariah|Malachi|Matthew|Mark|Luke|John|Acts|Romans|Corinthians|Galatians|Ephesians|Philippians|Colossians|Thessalonians|Timothy|Titus|Philemon|Hebrews|James|Peter|Jude|Revelation)";
const REFNUM="";
const KEYWORDS=/\b(concedes?d?|conceded|disavow(?:s|ed|al)?|undisputed|unfalsifiable|no ancient manuscript|zero ancient witnesses|never recanted|does not match|do not match|no adequate answer|contradict(?:s|ing|ion)?|impossible|no record|officially disavowed)\b/gi;
function emphasize(t){
  t=t.replace(new RegExp("\\b("+LDSBOOKS+REFNUM+")","g"),'<span class="ref-lds">$1</span>');
  t=t.replace(new RegExp("\\b("+BIBBOOKS+"\\s\\d+(?::\\d+(?:[\\-–]\\d+)?(?:,\\s?\\d+(?:[\\-–]\\d+)?)*)?)","g"),m=>m.includes("ref-lds")?m:'<span class="ref-bib">'+m+'</span>');
  t=t.replace(/(^|[\s(—–])'([^'<>]{3,200}?)'(?=$|[\s.,;:)!?—–])/g,'$1<span class="qq">‘$2’</span>');
  t=t.replace(KEYWORDS,'<b class="kw">$1</b>');
  t=t.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/==(.+?)==/g,'<mark>$1</mark>');
  return t;
}
function rich(raw){return glossify(emphasize(esc(raw).replace(/&lt;(\/?)(b|i|em|strong)&gt;/g,"<$1$2>")));}
function paras(raw,per){
  per=per||2;
  const s=splitSentences(raw),ps=[];
  for(let i=0;i<s.length;i+=per)ps.push(s.slice(i,i+per).join(" "));
  return ps.map(p=>`<p>${rich(p)}</p>`).join("");
}
function formatDefense(raw){
  if(/\(\d+\)/.test(raw)){
    const parts=raw.split(/\(\d+\)\s*/);
    const intro=parts.shift().trim();
    return (intro?`<p class="lead">${rich(intro)}</p>`:"")+
      `<ol class="pts">${parts.map(p=>`<li>${rich(p.trim())}</li>`).join("")}</ol>`;
  }
  return paras(raw,2);
}

const GLOSSARY=[{"t":"the 'none'","d":"The religiously unaffiliated majority of self-described atheists and agnostics — usually not philosophical atheists, usually not interested in arguments, and reachable mostly by relationship."},{"t":"1 Clement","d":"A letter from the church at Rome to the church at Corinth, written around AD 95 — one of the earliest Christian documents outside the New Testament. It matters here because it speaks of Peter's and Paul's sufferings within living memory of them."},{"t":"the 1 Corinthians 15 creed","d":"A formula Paul says he 'received' and passes on — dated by most scholars to within about five years of the crucifixion. The single biggest problem for legend-development theories."},{"t":"a Bayesian argument","d":"Reasoning about how much a piece of evidence raises or lowers the probability of a claim. Most serious modern apologetics is Bayesian: no single knockdown proof, but a cumulative case that shifts the odds."},{"t":"a chiasm","d":"A mirror-image literary structure (A-B-C-B-A) common in Hebrew writing. It appears in these arguments because its presence in a text is sometimes offered as evidence of ancient Semitic authorship."},{"t":"a codex","d":"A book with bound pages, as opposed to a scroll. Christians adopted the codex format remarkably early, which is part of why so many early Christian manuscripts survive."},{"t":"a palimpsest","d":"A manuscript whose original writing was scraped off so the expensive material could be reused. Modern imaging can often recover the erased text underneath — which is how the Sanaa Quran's earlier layer was read."},{"t":"a proof-text","d":"A verse quoted on its own to establish a point, usually detached from what surrounds it. Proof-texting is the single most common way both sides of every argument on this site go wrong."},{"t":"a stele","d":"An upright inscribed stone slab set up to record a victory, a law, or a treaty — one of archaeology's most valuable finds, because it is a dated, deliberate, public record."},{"t":"a textual variant","d":"Any difference between two manuscripts, including a misspelling or a change in word order. The famous 'hundreds of thousands of variants' figure is real and almost entirely trivial; the meaningful and viable ones are well under 1%, and every modern Bible footnotes them."},{"t":"an anachronism","d":"Something appearing in a story before it existed in real life — a horse in a place with no horses, a stirrup centuries too early. Anachronisms are one of the main tools for dating a text, because a writer can only mention the world he lives in."},{"t":"an apologist","d":"Someone who defends a faith's claims — from the Greek <i>apologia</i>, a legal defense. Not an insult, and not the same as an apologizer. This site quotes apologists deliberately: a claim is only worth making if it survives the best defense of it."},{"t":"an ossuary","d":"A limestone box for bones, used in Judea for about a century around the time of Jesus: a body was left to decompose for a year, then the bones were collected into the box. Names carved on ossuaries are how we have physical traces of individuals like the high priest Caiaphas."},{"t":"the apocrypha","d":"Books written between the Testaments (Tobit, Judith, Maccabees and others), included in Catholic and Orthodox Bibles and in the original 1611 KJV, but not in the Hebrew canon or in Protestant Bibles today."},{"t":"the apocryphal Acts","d":"Second- to fourth-century romances about individual apostles — the Acts of Thomas, of Andrew, of Peter and others. They are the source of most vivid martyrdom traditions, and they also contain talking animals and resurrected fish. Not history."},{"t":"Bart Ehrman","d":"The most-read skeptical New Testament scholar alive, an agnostic and former evangelical. He is quoted throughout this section precisely because he does not want the conclusion: he calls the crucifixion one of the most certain facts of ancient history."},{"t":"Bayesian argument","d":"Reasoning about how much a piece of evidence raises or lowers the probability of a hypothesis. Most serious modern apologetics is Bayesian: no single knockdown, a cumulative case."},{"t":"the BGV theorem","d":"Borde–Guth–Vilenkin (2003): any universe that has on average been expanding cannot be extended infinitely into the past. Alexander Vilenkin is one of its authors and has stated the implication bluntly — though he also holds that it does not by itself establish a creator, which is worth quoting honestly."},{"t":"the burden of proof","d":"Who has to make the case. Most atheists hold the 'lack of belief' position — not the claim that God does not exist — which means demanding they disprove God misfires immediately."},{"t":"the canon","d":"The list of books a community accepts as Scripture. The New Testament canon was recognized gradually by usage over the first three centuries rather than voted on at a council — Athanasius's list of 367 AD matches ours exactly."},{"t":"Codex Sinaiticus","d":"A complete Greek Bible hand-copied around 330–360 AD, found at St Catherine's Monastery on Mount Sinai in the 1840s. Along with Vaticanus it is one of the two oldest complete Bibles in existence, and its text is essentially the text you read today."},{"t":"Codex Vaticanus","d":"A Greek Bible copied around 300–325 AD, held in the Vatican Library — slightly older than Sinaiticus and, with it, the backbone of modern New Testament textual scholarship."},{"t":"contingency","d":"The argument from things that could have not existed to something that could not have failed to. Often stronger than the Kalam because it does not depend on cosmology having the beginning right."},{"t":"the contingency argument","d":"The argument from things that could have failed to exist to something that could not have. Often stronger than the Kalam in conversation, because it does not depend on any particular cosmology being correct."},{"t":"the Dead Sea Scrolls","d":"About 900 manuscripts found in caves at Qumran near the Dead Sea between 1947 and 1956, copied roughly 250 BC–70 AD. They pushed our oldest Hebrew Bible manuscripts back a thousand years — and the text matched what had been copied ever since. The single most important manuscript discovery ever made."},{"t":"the deconvert","d":"Someone who was a Christian and is not now. They have heard your material, usually from people they loved, and then watched it answered. Treat them as an expert witness, not a project."},{"t":"Deutero-Isaiah","d":"The name critical scholars give to the proposed anonymous author of Isaiah 40–55, writing during the Babylonian exile. See the multi-Isaiah theory."},{"t":"divine hiddenness","d":"Schellenberg's argument: a perfectly loving God would ensure no one is non-resistantly unaware of him. The strongest argument in contemporary atheist philosophy after evil."},{"t":"the Documentary Hypothesis","d":"The critical theory that the first five books of the Bible were woven together from several earlier sources (labelled J, E, D and P) rather than written by Moses. The classic form is now heavily revised even among critical scholars, but some version of it is the mainstream academic position."},{"t":"the Euthyphro dilemma","d":"From Plato: is something good because God commands it, or does God command it because it is good? Either horn seems to cost the theist something. The standard answer is that goodness is grounded in God's own nature, so the dilemma is a false one — but expect a philosophically literate atheist to press it."},{"t":"exegesis","d":"Drawing out what a text actually says, in its own context. Its opposite is eisegesis — reading your conclusion into the text."},{"t":"The Fate of the Apostles","d":"Sean McDowell's 2015 book — a Christian apologist's own systematic grading of the evidence for how each apostle died. It is the reason honest Christians no longer say 'all twelve were martyred': he concludes only a handful of the deaths are historically well-established."},{"t":"fine-tuning","d":"The observation that physical constants sit in extraordinarily narrow life-permitting ranges — the cosmological constant to roughly one part in 10^120. The standard reply is the multiverse."},{"t":"Gerd Lüdemann","d":"A German New Testament scholar and atheist who held that the disciples genuinely had experiences they took to be appearances of the risen Jesus, and explained them as visions. Useful because he concedes the data and disputes only the explanation."},{"t":"Graham Oppy","d":"Probably the most respected atheist philosopher of religion writing today. He argues that naturalism and theism both explain the world but naturalism does so with fewer commitments. Read him rather than a Christian summary of him."},{"t":"the Great Isaiah Scroll","d":"The star of the Dead Sea Scrolls: a complete copy of Isaiah, all 66 chapters, copied around 125 BC. It proves Isaiah 53 and its portrait of a pierced, suffering servant existed more than a century before Jesus — nobody added it afterwards."},{"t":"J. L. Mackie","d":"The atheist philosopher whose logical problem of evil dominated the mid-twentieth century — and which Alvin Plantinga's free-will defense is widely regarded as having answered, including by atheist philosophers."},{"t":"Josephus","d":"Titus Flavius Josephus (c. 37–100 AD), a Jewish general who surrendered to Rome and became its most important historian of first-century Judea. Not a Christian, which is why his mentions of Jesus, James and John the Baptist carry so much weight."},{"t":"the Kalam","d":"'Whatever begins to exist has a cause; the universe began to exist; therefore the universe has a cause.' The most-debated theistic argument of the last fifty years, associated with William Lane Craig."},{"t":"the KJV","d":"The King James Version of 1611, the English Bible of the whole period covered by this site. Its wording matters constantly here: several movements examined on this site were born inside its cadence, and some of them treat it as the only legitimate Bible."},{"t":"the Lady Hope story","d":"The claim that Darwin recanted on his deathbed. It is false, was denied by his family at the time, and repeating it is a live demonstration that you do not check your sources."},{"t":"the Masoretic Text","d":"The standard Hebrew Bible, preserved and vowel-pointed by Jewish scribes called the Masoretes between roughly 600 and 1000 AD. Almost every Old Testament translation is based on it; where it differs from the Septuagint or the Scrolls, that difference is what scholars argue about."},{"t":"methodological naturalism","d":"The working rule that science looks only for natural causes. It is a method, not a metaphysics — conflating the two is the most common mistake on both sides of this conversation."},{"t":"the minimal facts","d":"Gary Habermas's method: build only on data granted by the large majority of scholars, including skeptics — the crucifixion, the disciples' experiences, Paul's conversion, James's conversion, the early proclamation."},{"t":"the multi-Isaiah theory","d":"The mainstream critical view that the book of Isaiah had more than one author: chapters 1–39 from the eighth-century prophet, 40–55 from an anonymous writer during the Babylonian exile ('Deutero-Isaiah'), and sometimes 56–66 from a third. It is argued from style and from the fact that chapters 40+ address the exile as present. Conservatives dispute it; it matters here because it is the standard reply whenever Isaiah is said to predict something."},{"t":"the multiverse","d":"The proposal that vastly many universes exist with varying constants, so a life-permitting one is unsurprising. A serious hypothesis, and one that is not currently testable — which cuts both ways."},{"t":"papyrus","d":"Paper made from reed pith, the ordinary writing material of the ancient world. New Testament papyri are labelled with a P and a number — P52, a scrap of John, is the earliest known New Testament manuscript, copied around 125 AD."},{"t":"Pascal's wager","d":"Pascal's argument that betting on God is rational given the stakes. It was never designed as an opening move — it addresses someone already persuaded the odds are non-trivial — and led with, it sounds like an invitation to fake a belief for insurance."},{"t":"the problem of evil","d":"Logical form (evil is incompatible with God) is now widely regarded as failed, including by atheist philosophers; the evidential form (the amount and distribution of suffering counts against God) is live and genuinely hard."},{"t":"Quirinius","d":"The Roman governor of Syria whose census Luke 2:2 places at Jesus's birth — but whose known census fell in AD 6, about a decade after Herod the Great died. This is a genuine historical difficulty with several proposed solutions and no consensus, and saying so is what makes the rest of the archaeology credible."},{"t":"Qumran","d":"The settlement beside the caves where the Dead Sea Scrolls were found, on the northwest shore of the Dead Sea. Usually associated with the Essenes, a strict Jewish sect of the Second Temple period."},{"t":"scientism","d":"The claim that only scientific methods yield knowledge — a philosophical claim that cannot itself be established scientifically. Point this out once, gently, and never as a gotcha."},{"t":"Sean Carroll","d":"A theoretical physicist and atheist, best known here for his 2014 debate with William Lane Craig, in which he argued that modern cosmology gives no support to the Kalam's second premise. The most substantial scientific reply to that argument."},{"t":"the Septuagint","d":"The Greek translation of the Hebrew Scriptures made by Jewish scholars in Alexandria beginning about 250 BC — abbreviated LXX. It matters constantly here because it is pre-Christian: when it renders a verse a certain way, no Christian could have influenced it."},{"t":"the Smithsonian Institution","d":"The United States' national museum and research complex. It matters here because for decades a 'Smithsonian statement' was circulated claiming the institution used the Book of Mormon as an archaeological guide. The Smithsonian issued a formal statement denying it, and now sends a standard letter saying its archaeologists see no connection between the New World's archaeology and the book's contents."},{"t":"Tacitus","d":"Roman senator and historian (c. 56–120 AD). His hostile mention of 'Christus,' executed by the procurator Pontius Pilate under Tiberius, is the standard non-Christian confirmation of the crucifixion."},{"t":"the Tel Dan Stele","d":"A ninth-century BC inscription found in northern Israel in 1993 in which an Aramean king boasts of defeating the 'House of David.' It is the first extra-biblical reference to David's dynasty, and it landed at a moment when minimalist scholars were arguing David was a fiction."},{"t":"textual criticism","d":"The scholarly discipline of comparing manuscripts to work out what the original wording was. It is not an attack on Scripture — it is the method that lets us say with confidence what the text said."},{"t":"textual variant","d":"Any difference between manuscripts, including spelling. The famous '400,000 variants' figure is real and almost entirely trivial; the meaningful-and-viable subset is well under 1%."},{"t":"Tyre","d":"The Phoenician port city of Ezekiel 26. The prophecy's fulfilment is often overclaimed — the mainland city fell to Nebuchadnezzar and Alexander built a causeway to the island, but a city called Tyre exists today. Use this one carefully or not at all."}];

const esc=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function hl(text,phrases){let out=esc(text);(phrases||[]).forEach(p=>{const e=esc(p).replace(/[.*+?^${}()|[\]\\]/g,"\\$&");out=out.replace(new RegExp(e,"gi"),m=>"<mark>"+m+"</mark>");});return out;}
function glossify(escapedText){
  if(!glossify._re){
    const ts=GLOSSARY.slice().sort((a,b)=>esc(b.t).length-esc(a.t).length);
    const alts=ts.map(g=>esc(g.t).replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|");
    glossify._re=new RegExp("(?<![\\w-])("+alts+")(?![\\w-])","gi");
    glossify._map={};GLOSSARY.forEach(g=>{glossify._map[esc(g.t).toLowerCase()]=g;});
  }
  const used=glossify.seen||(glossify.seen=new Set());
  let inRef=0;
  return escapedText.replace(/(<[^>]*>)|([^<]+)/g,(m,tag,txt)=>{
    if(tag){
      if(/^<span class="ref-(lds|bib)"/.test(tag))inRef++;
      else if(inRef&&tag.indexOf("</span>")===0)inRef--;
      return tag;
    }
    if(inRef)return txt;
    return txt.replace(glossify._re,w=>{
      const g=glossify._map[w.toLowerCase()];
      if(!g||used.has(g.t))return w;
      used.add(g.t);
      return '<span class="g" tabindex="0">'+w+'<span class="gt"><b>'+esc(g.t)+'</b> — '+g.d+'</span></span>';
    });
  });
}


function findWhy(d,cite){
  const key=cite.replace(/–/g,"-").replace(/\s*\(.*\)\s*/g,"").trim();
  const m=key.match(/^([1-4]?\s?[A-Za-z&; ]+?)\s+(\d+)/);
  const frag=m?(m[1].trim()+" "+m[2]):key;
  const sentences=(d.claim+" "+d.rationale).replace(/–/g,"-").split(/(?<=[.!?])\s+/);
  const hit=sentences.find(s=>s.includes(frag));
  return hit?hit.replace(/-/g,"–"):null;
}

function extUrl(cite){
  const c=cite.replace(/–/g,"-").replace(/\s*\(.*\)\s*/g,"").trim();
  const qm=c.match(/^Quran\s+(\d+):(\d+)/i);
  if(qm)return "https://quran.com/"+qm[1]+"/"+qm[2];
  const qc=c.match(/^Quran\s+(\d+)/i);
  if(qc)return "https://quran.com/"+qc[1];

  return "https://quran.com/";
}

function filtered(){
  const arr=DATA.filter(d=>
    (state.section==="all"||d.section===state.section)&&
    (!state.verdict||d.verdict===state.verdict)&&
    (!state.severity||d.severity===state.severity)&&
    (!state.q||(d.title+" "+d.claim+" "+(d.response||"")+" "+(d.rationale||"")+" "+(CATS[d.category]||"")).toLowerCase().includes(state.q))
  );
  if(state.section==="peculiar")return arr.sort((a,b)=>PORDER.indexOf(a.id)-PORDER.indexOf(b.id));
  return arr.sort((a,b)=>(b.featured?1:0)-(a.featured?1:0)||SEVRANK[a.severity]-SEVRANK[b.severity]||VRANK[a.verdict]-VRANK[b.verdict]);
}

function plainHtml(d){
  const rt=t=>glossify(emphasize(esc(t).replace(/&lt;(\/?)(b|i)&gt;/g,"<$1$2>")));
  return (d.plain||[]).map(b=>{
    const ss=splitSentences(b.d),ps=[];
    for(let i=0;i<ss.length;i+=2)ps.push("<p>"+rt(ss.slice(i,i+2).join(" "))+"</p>");
    const t=b.t.toLowerCase();

    const big=/(k-text|k-say)/.test(kind)?" k-big":"";
    return `<div class="pblk${b.say?" say":""}${big}"><div class="plab ${kind}">${esc(b.t)}</div>${ps.join("")}</div>`;

function renderGlossary(){
  $("#main").innerHTML=`<div class="viewhead"><h2>Word guide</h2><p>${GLOSSARY.length} terms this subject runs on, in plain English — names, books, sources and technical vocabulary. Every one of them is underlined with a dotted line wherever it appears in a case; hover or tap it there for the definition without leaving the page.</p></div><details class="primer" open><summary>New here? How this section works</summary><div class="primerbody"><p><b>This section runs in the opposite direction from the rest of the site.</b> Nothing here is argued from biblical authority to someone who does not hold it. Instead the case is built from sources that do not want the conclusion — skeptical historians, atheist philosophers, and the manuscript and archaeological record.</p>
    <p><b>The first thing to get right is who you are talking to.</b> The <i>philosophical atheist</i> is rare, has genuine reasons, reads Graham Oppy and Sean Carroll, and enjoys a well-conducted argument. The <i>apathetic none</i> is the large majority, is not looking for an argument at all, and is reachable mostly through relationship. The <i>deconvert</i> was a Christian, has already heard your best material — usually from people they loved — and often carries a real injury from the church. Aiming the wrong conversation at the wrong person is the most common way this fails.</p>
    <p><b>The realistic goal is one notch, not the whole distance:</b> from "obviously false" to "actually worth thinking about." The arguments here are cumulative rather than knockdown — contingency, fine-tuning, moral facts, the reliability of reason — and each has a serious reply, which is printed alongside it.</p>
    <p>A third of this section is marked <b>Contested</b> on purpose, and five entries are arguments to <b>retire</b>. Overclaiming is how these conversations are lost. Terms in dotted underline can be hovered anywhere for a definition.</p></div></details>
  <div class="gaccord">${GLOSSARY.map(g=>`<div class="gitem"><b>${esc(g.t)}</b><p>${g.d}</p></div>`).join("")}</div>`;
}

  const link=id=>byId[id]?`<button class="corelink" data-open="${id}">${esc(byId[id].title)} →</button>`:"";
  $("#main").innerHTML=`<div class="viewhead"><h2>The heart of it: one claim you can actually check</h2>
  <p>If you read nothing else on this section, read this page. Christianity is unusual among religions in staking itself on a public, datable event that could in principle be disproved — and its own founding document says so first.</p></div><figure class="corehero"><img src="https://commons.wikimedia.org/wiki/Special:FilePath/Hubble%20ultra%20deep%20field%20high%20rez%20edit1.jpg?width=900" loading="lazy" alt=""><figcaption>The Hubble Ultra Deep Field. Every smudge is a galaxy — and the constants that allow any of it are the fine-tuning argument.</figcaption></figure>
  <div class="corebox"><h3>0 · Work out who is in front of you</h3>
  <p>There are three completely different conversations here. The <b>philosophical atheist</b> is rare, has genuine reasons, reads Oppy and Carroll, and will enjoy an argument conducted well. The <b>apathetic none</b> — the large majority — is not looking for an argument at all and is reachable almost entirely through relationship. The <b>deconvert</b> has already heard your best material, usually from people they loved, and often carries a real injury from the church.</p>
  <p>Deploying a philosophy-seminar case on someone in the third group is the single most common way this goes wrong. Ask first: <i>“what made you land where you are?”</i> — and then listen long enough to actually find out.</p>
  <details class="srcdet"><summary>Open the cases behind this</summary><div class="corelinks" style="margin-top:12px">${link("dontuse-atheist-mind-reading")}${link("objection-divine-hiddenness")}</div></details></div>

  <div class="corebox"><h3>1 · Aim lower than proof</h3>
  <p>No argument on this page proves Christianity, and pretending otherwise is why skeptics stop listening. The realistic target is one notch: from <i>“obviously false”</i> to <i>“that's actually worth thinking about.”</i> That move is achievable in a single conversation, and it is the move that matters.</p>
  <p>The arguments that do it best are cumulative, not knockdown: something rather than nothing (contingency); constants that sit in an absurdly narrow window; moral facts that feel discovered rather than invented; and the oddity of trusting a reasoning faculty built entirely by processes indifferent to truth. Each has a serious reply. Together they shift a prior — which is all evidence ever does.</p>
  <details class="srcdet"><summary>Open the cases behind this</summary><div class="corelinks" style="margin-top:12px">${link("existence-kalam-contingency")}${link("existence-fine-tuning")}${link("existence-moral-argument")}</div></details></div>

  <div class="corebox"><h3>2 · The one falsifiable claim</h3>
  <p>Paul stakes the entire religion on a historical event and says plainly that if it did not happen, the faith is worthless and Christians are to be pitied. That is a remarkable thing for a religion to build into its own foundation documents, and it means the conversation can be had with history rather than authority.</p>
  <p>Start where a skeptical historian already is. The large majority of scholars — including agnostics and atheists — grant that Jesus was crucified under Pilate; that his followers had experiences they took to be appearances of the risen Jesus; that <b>Paul</b>, an active persecutor, changed sides after such an experience; that <b>James</b>, a skeptical brother, did too; and that the proclamation began immediately in the city where it could most easily have been refuted.</p>
  <p>Then the dating problem for legend theories: the creed in 1 Corinthians 15 is a fixed formula Paul says he <i>received</i>, and most scholars — again including skeptics — put it within about five years of the crucifixion. Legends take generations. This did not.</p>
  <details class="srcdet"><summary>Open the cases behind this</summary><div class="corelinks" style="margin-top:12px">${link("resurrection-minimal-facts")}${link("resurrection-early-creed")}${link("resurrection-hallucination-hypotheses")}</div></details></div>

  <div class="corebox"><h3>3 · Concede the numbers, and win the argument</h3>
  <p>There are somewhere around 400,000 textual variants in the New Testament manuscript tradition. Say that first, out loud, before anyone asks. Then say what they are: spelling, word order, and a small number of passages — the longer ending of Mark, the woman caught in adultery — that every modern Bible already footnotes. No Christian doctrine rests on a disputed reading.</p>
  <p>The reason the number is large is the reason the text is secure: there are far more manuscripts than for any other ancient work, and more copies means more countable differences. And the Dead Sea Scrolls ran the same test on the Hebrew Bible across a thousand-year gap — and it passed.</p>
  <details class="srcdet"><summary>Open the cases behind this</summary><div class="corelinks" style="margin-top:12px">${link("manuscripts-nt-text")}${link("manuscripts-dead-sea-scrolls")}${link("manuscripts-canon-formation")}</div></details></div>

  <div class="corebox"><h3>4 · Do not flinch at the hard ones</h3>
  <p>The evidential problem of evil and Schellenberg's hiddenness argument are the two strongest arguments in contemporary atheist philosophy, and neither has a tidy answer. The Canaanite conquest passages are genuinely difficult, and the options for reading them all cost something. Say all of that plainly.</p>
  <p class="pullq">"That's the strongest argument against what I believe, and I don't think it has a tidy answer."</p>
  <p>That sentence buys more credibility than any rebuttal, and it is also simply honest. Then give the real response, with its limits named — and on suffering, remember that the argument in front of you is very often a wound wearing a syllogism. Ask what happened to them before you answer what they said.</p>
  <details class="srcdet"><summary>Open the cases behind this</summary><div class="corelinks" style="margin-top:12px">${link("objection-problem-of-evil")}${link("objection-divine-hiddenness")}${link("objection-canaanite-conquest")}</div></details></div>

  <div class="corebox"><h3>5 · Then stop arguing and offer a person</h3>
  <p>Nobody has ever been argued into the kingdom, and the evidence only clears ground. When it is cleared, the offer is not a proposition but a person — the one whose crucifixion even the atheist historians grant, and whose followers went to their deaths saying they had seen him afterwards.</p>
  <p>Ask the question that actually opens things: <i>“If it were true, would you want it to be?”</i> The answer tells you whether you are dealing with an argument or a grief, and those need very different things from you.</p>
  <p><button class="corelink" data-goto="share">How to actually have this conversation →</button></p></div>`;

function renderShare(){
  $("#main").innerHTML=`<div class="viewhead"><h2>Sharing Jesus with a skeptic</h2>
  <p>Not to win a debate — the debate is almost never the real thing in the room. To be the Christian who is honest about what is hard, who doesn't use arguments they haven't checked, and who is still there next year.</p></div>
  <div class="pb-h">The invitation to work toward</div>
  <div class="saybox"><span class="who">You, once there's real trust</span><p>"Would you read one Gospel with me — Luke, or Mark — and just tell me what you actually think of him?"</p></div>
  <p class="pd" style="font-size:.78rem;margin:0 0 4px">Most skeptics have opinions about Christianity and have never read a Gospel straight through as an adult. The offer is unusual precisely because it asks for their judgment rather than their agreement.</p>

  <div class="pb-h">What actually reaches a skeptic</div><div class="pb-grid">
  <div class="pb"><span class="num">1</span><h4>Conceding what is genuinely hard — first</h4><p>Evil, hiddenness, the conquest passages, the census of Quirinius. Naming these before you are pushed is the strongest move available to you, because every skeptic has met Christians who couldn't. A person who admits the difficulty is worth listening to on everything else; a person who has an instant answer for everything is worth listening to on nothing.</p></div>
  <div class="pb"><span class="num">2</span><h4>Arguing from sources that don't want your conclusion</h4><p>Bart Ehrman on the crucifixion. Gerd Lüdemann on the disciples' experiences. The dating of the 1 Corinthians 15 creed. The Tel Dan Stele. Every one of these comes from outside the church, and that is exactly why it travels — you are not asking them to trust your book, only to notice what their own side already grants.</p></div>
  <div class="pb"><span class="num">3</span><h4>Asking what happened to them</h4><p>Behind a large share of atheism is not an argument but a story: a church that covered something up, a prayer that went unanswered at the worst possible moment, a parent's funeral. The syllogism is real and deserves an answer, but it is usually not the thing that needs answering first. Ask, and then be quiet for a long time.</p></div>
  <div class="pb"><span class="num">4</span><h4>Being unembarrassing</h4><p>The fastest way to lose this conversation is a bad argument confidently delivered. Retiring the banana, the thermodynamics claim, the transitional-fossil line and the Darwin deathbed legend costs you nothing and buys you the right to be taken seriously on the resurrection.</p></div>
  </div>

  <div class="pb-h">The method</div><div class="pb-grid">
  <div class="pb do"><h4>Aim one notch, not the whole distance</h4><p>From "obviously false" to "worth thinking about" is a realistic single-conversation goal and a genuine victory. Trying to close the whole gap in one evening produces a person who now has a reason to avoid the topic with you.</p></div>
  <div class="pb do"><h4>Say "I don't know" when you don't</h4><p>Then go find out and come back with it. This is the single most credibility-building behaviour available in these conversations, and it is available to anyone regardless of how much philosophy they've read.</p></div>
  <div class="pb do"><h4>Know their best arguments better than they do</h4><p>Read Graham Oppy rather than a Christian summary of Oppy. Watch Sean Carroll's debate with Craig. A Christian who can state the hiddenness argument accurately before answering it is in a completely different category from one who has only met a caricature.</p></div>
  <div class="pb dont"><h4>Don't tell them what they secretly believe</h4><p>"You know God exists and are suppressing it," "you just want to sin," "atheism takes more faith." Each one tells your friend that you are talking to a stereotype rather than to them, and each one ends the conversation while sounding, to you, like a point scored.</p></div>
  <div class="pb dont"><h4>Don't open with Pascal's wager</h4><p>It was never designed as an opener — it addresses someone already persuaded the odds are non-trivial. Led with, it sounds like an invitation to fake a belief for insurance, which is both bad philosophy and bad theology.</p></div>
  <div class="pb dont"><h4>Don't make evolution the battlefield</h4><p>Christianity is not committed to a six-thousand-year-old earth, and large parts of the church have never thought so. Fighting there means the actual claim — a man executed under Pilate and seen alive afterwards — never gets discussed at all.</p></div>
  </div>

  <div class="pb-h" style="margin-top:34px">How it actually goes — the deeper craft</div>
  <p class="sh-open">"One of the most certain facts of history is that <span class="hl">Jesus was crucified</span> on orders of the Roman prefect."</p>
  <p class="sh-att">— Bart Ehrman, agnostic; the most-read skeptical New Testament scholar alive</p>

  <div class="sa"><h4 class="sat">The four questions that do the most work</h4>
  <ol class="sh-list">
    <li><b style="color:var(--ink)">"What made you land where you are?"</b> Ask it first, every time, and listen to the whole answer. It tells you which of the three conversations you are actually in, and nothing you say before knowing that is aimed at anything.</li>
    <li><b style="color:var(--ink)">"Do you think Jesus existed and was crucified?"</b> Almost every informed skeptic says yes. Starting from shared ground and moving one step at a time is the only version of this argument that works.</li>
    <li><b style="color:var(--ink)">"What would it take to change your mind?"</b> A fair question because you must answer it about yourself too — and Paul already did, in 1 Corinthians 15:17. If neither of you can answer it, you are not having an argument, you are having a standoff.</li>
    <li><b style="color:var(--ink)">"If it were true, would you want it to be?"</b> The most revealing question here. The answer distinguishes an intellectual obstacle from a grief or an injury, and those need entirely different things from you.</li>
  </ol></div>

  <div class="sa"><h4 class="sat">Start here</h4>
  <p class="pd">Read <b>Arguments to retire</b> before anything else — it is the highest-return page on the site. Then the <b>Easter path</b>: what skeptical historians grant about AD 30, and what explains it. Every case ends with a scripted back-and-forth ("How the conversation usually goes") with the strongest naturalistic reply included.</p>
  <button class="start" data-goto-path="easter">Open the Easter path →</button></div>${DATA.some(d=>d.avoid)?`<div class="pb-h" style="margin-top:30px">Arguments that will embarrass you — do not use these</div><p class="pd" style="font-size:.8rem;margin:0 0 10px">Popular claims that are false or overclaimed. Each links to the correction — repeating them hands the other side an easy win and discredits your true arguments.</p><div class="relrow">${DATA.filter(d=>d.avoid).map(d=>`<button data-open="${d.id}">⚠ ${esc(d.title)}</button>`).join("")}</div>`:""}`;
  const b=$("#main").querySelector("[data-goto-path]");
  if(b)b.addEventListener("click",()=>{const p=PATHS.find(x=>x.id===b.dataset.gotoPath);if(!p)return;state.pathId=p.id;const read=store.read;const next=p.items.find(i=>!read.has(i))||p.items[0];openCase(next,true);});
  bindOpens();
