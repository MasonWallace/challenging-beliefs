const PROOFS=[{"v":"1 Samuel 15:2-3","they":"'Kill man, woman, child and infant.' Your God commands genocide. Full stop. How is this different from any war-god tribes have always invented to bless their conquests?","you":"Don't soften it first — read it with them and let it be as hard as it is. Then the context that's true: the command follows four centuries of stated delay 'for the sin of the Amorites is not yet complete' (Gen 15:16) — judgment, not ethnic hatred; the 'utterly destroy' formula is standard ancient Near Eastern war rhetoric (Egyptian and Moabite kings claim total annihilation of peoples who show up alive next chapter — and so do Amalekites, in 1 Sam 27 and 30); and Israel gets the identical sentence threatened on itself (Lev 18:28). Many scholars read hyperbolic idiom for decisive defeat. Then the honesty: some Christians accept that reading, some don't, and this remains a genuinely hard text. One more thing, said gently — the moral outrage they feel at slaughtered infants assumes every human life has non-negotiable worth. That conviction has a source, and it isn't blind selection.","refs":"Genesis 15:16 · 1 Samuel 27:8; 30:1 · Leviticus 18:24-28 · Deuteronomy 20:10-18 · Matthew 5:43-45"},{"v":"Psalm 137:9","they":"'Blessed is the one who seizes your infants and dashes them against the rocks.' It's in your hymnbook. Sung. How do you worship with that on the page?","you":"Name what the psalm is: the scream of exiles who had just watched Babylon do exactly that to THEIR children — verse 8 says it plainly: 'repay you what you have done to us.' It is trauma praying, not policy; description of a shattered heart, not prescription for anyone's hands. The astonishing thing isn't that ancient victims felt this — every victim does — it's that Scripture keeps the scream IN, insisting God would rather hear rage prayed at him than acted out or hidden. Vengeance is handed up, not taken (Rom 12:19). And the story bends: the man from this same book absorbs violence on a cross rather than returning it. A sanitized Bible would be a dishonest one; this page is why abuse survivors keep finding the Psalms readable.","refs":"Psalm 137:1-9 · Lamentations 2:11 · Romans 12:19 · Matthew 5:44"},{"v":"Judges 11:30-39","they":"Jephthah sacrifices his own daughter to keep a vow to your God — and he's listed as a hero of faith in Hebrews 11. Explain that.","you":"First concession: the natural reading is that he killed her, and it should horrify — the narrator agrees. Judges REPORTS this without one word of divine approval; God neither asked for the vow nor answered it. The whole book is a documented spiral into moral madness with a refrain as its thesis: 'everyone did what was right in his own eyes' (21:25). Torah had already banned human sacrifice in the strongest terms (Deut 12:31) — Jephthah broke the law he claimed to honor, which is the point: this is what Israel becomes without its King. (Some argue vv. 37-39 describe perpetual virginity, not death — possible, contested; say so and don't lean on it.) Hebrews 11 credits one act of battlefield trust, in a list that also includes a prostitute and a murderer — it's a catalog of grace toward wrecks, not endorsements of resumes. Judges is an indictment. Reading it as instruction is the one error the book itself forbids.","refs":"Judges 11:29-40 · Judges 21:25 · Deuteronomy 12:31 · Hebrews 11:32"},{"v":"Exodus 21:20-21","they":"Your Bible regulates beating slaves — 'if the slave survives a day or two, the owner is not punished, for the slave is his property.' It never says slavery is wrong. Abolition came from Enlightenment humanists dragging the church along.","you":"Concede first and fully: these laws regulate debt-servitude in an Iron Age economy, verse 21 is genuinely hard, and Exodus is not an abolitionist tract — pretending otherwise costs you the conversation and deserves to. Then the real texture: in the same chapter, kidnapping a person for sale is a capital crime (21:16 — the verse that condemns the entire Atlantic trade, which is why 1 Tim 1:10 lists 'enslavers' with murderers); Deuteronomy 23:15-16 forbids returning escaped slaves — unique in the ancient world, and the exact opposite of the Fugitive Slave Act. The trajectory runs through Philemon ('no longer a slave — a beloved brother') to abolition itself, which was driven overwhelmingly by Christians — Wilberforce, the Quakers, Douglass — arguing from the image of God. And own the failure: Christians also quoted these verses to defend chattel slavery, and they were wrong. The Bible's own trajectory is what proved them wrong.","refs":"Exodus 21:16 · Deuteronomy 23:15-16 · Philemon 15-16 · 1 Timothy 1:10 · Genesis 1:27"},{"v":"Matthew 27:52-53","they":"Dead saints climb out of their graves and stroll into Jerusalem, 'appearing to many' — and not one historian, not even the other gospels, mentions zombie day? That silence tells you what these books are.","you":"Give the straight answer: there is no outside corroboration for this passage, and Christians genuinely divide over it. Some take it as a literal, local sign; others — notably evangelical scholar Michael Licona — read it as apocalyptic imagery, a standard Jewish way of saying 'this death cracked the reign of death open.' Licona took serious professional fire for saying so in 2011, which is worth admitting too: Christians sometimes punish their own for honesty, and skeptics notice. The load-bearing point: the case for the resurrection was never built on these two verses. It's built on the creed in 1 Corinthians 15 — decades earlier than Matthew, naming checkable witnesses — and on facts critics like Ehrman and Lüdemann concede. A difficult verse in Matthew doesn't unwrite an early creed. Let this passage be exactly as strange as it is.","refs":"Matthew 27:52-53 · 1 Corinthians 15:3-8 · Matthew 27:45,51 (apocalyptic signs cluster)"},{"v":"Mark 16:9-20; John 7:53-8:11","they":"Your own Bible admits the ending of Mark and the woman-caught-in-adultery story were ADDED later. If scribes slipped whole passages in, how do you know what else is fake?","you":"Lean in — this objection is secretly your best evidence. Yes: the earliest manuscripts lack both passages, scholars across the spectrum agree they're later additions, and your Bible TOLD you so, in brackets, in the footnotes. Ask the question hiding in that: how do we KNOW? Because we have thousands of Greek manuscripts to compare — enough data that additions stick out like a raised seam. A tradition run by cover-up artists doesn't print its own corrections in the margins of every pew Bible on earth. That's the difference between a guarded text and a transparent one: we can see the seams precisely because nothing is hidden. And the accounting matters: across all ~5,800 manuscripts these two passages are the LARGEST variants that exist; no doctrine — none — rests on either. The scribes' fingerprints prove the rest of the page is clean enough to check.","refs":"Mark 16:9-20 (bracketed in modern translations) · John 7:53-8:11 (bracketed) · Luke 1:1-4"}];

const THEYSAY=[{"say":"There's no evidence for God.","quick":"There's evidence you haven't found persuasive — different claim. A universe whose constants sit on a knife's edge (cosmological constant tuned to ~1 part in 10^120) is at minimum evidence to be weighed. Ask: 'What would you accept as evidence, even in principle?' If the answer is 'nothing,' the problem isn't evidence.","id":"fine-tuning"},{"say":"Extraordinary claims require extraordinary evidence.","quick":"Agree with the principle — then apply it. The resurrection case doesn't ask them to trust a feeling; it asks what best explains facts most critical scholars grant: crucifixion, the disciples' sincere belief they saw Jesus alive, and Paul's about-face. 'Extraordinary' evidence just means sufficient evidence for the claim's size — so weigh it, don't wave it off.","id":"minimal-facts-resurrection"},{"say":"I just believe in one less god than you do.","quick":"Clever line, but the arguments for God aren't a lineup of Thors. Contingency and cosmological arguments point to a necessary, non-contingent ground of everything — a category Zeus never occupied. Rejecting 999 contingent sky-beings and rejecting the reason anything exists at all are different moves. You dismiss Thor for the same reason they do.","id":"kalam-contingency"},{"say":"The Bible was written by men — it's full of contradictions.","quick":"Written by men, yes — Christianity has always said so; inspiration isn't dictation. Ask for their best contradiction specifically; most dissolve on genre or perspective, and the ones that don't (differing detail in resurrection accounts) are what independent testimony actually looks like. Colluding witnesses match perfectly.","id":"manuscript-attestation"},{"say":"It's been translated so many times, like a game of telephone.","quick":"That's the one objection scholarship has simply closed. Modern translations go straight from Hebrew and Greek manuscripts — one step, not a chain. The Dead Sea Scrolls proved it: the Great Isaiah Scroll (~125 BC) matches the medieval text used for centuries about 95% word-for-word, with differences mostly spelling. A thousand years of copying, almost no drift.","id":"dss-ot-stability"},{"say":"Okay, then who made God?","quick":"The argument isn't 'everything has a cause' — it's 'everything that begins to exist has a cause.' God by definition doesn't begin; the question is like asking 'what's north of the North Pole?' And notice: the atheist needs an unmade something too (eternal laws, eternal multiverse). Everyone stops somewhere; the debate is over what the stopping point is like.","id":"who-made-god"},{"say":"A good God wouldn't let children get cancer.","quick":"Don't rush past this — it's the strongest card in their deck and often it's personal. Concede what's true: Christianity offers no tidy accounting for any specific child's suffering. What it offers is a God who entered it — the cross means God's answer to evil isn't a syllogism but a wound. And ask gently: on atheism, what makes the child's death wrong rather than just unfortunate?","id":"problem-of-evil"},{"say":"Religion is the #1 cause of war in history.","quick":"The skeptics' own favorite source undoes this: the Encyclopedia of Wars catalogs 1,763 wars and classifies about 123 (~7%) as religious. The 20th century's worst body counts were explicitly atheist regimes. Be fair, though — religious violence is real and Christians own their share. Just don't let 'the #1 cause' stand; it's not close.","id":"religion-causes-wars"},{"say":"I used to be a Christian — I probably know the Bible better than you.","quick":"Maybe they do — say so, and mean it. 'Great. Then let's read the hard parts together; you pick.' The ex-Christian's knowledge is an asset, not a threat. But gently note which Bible they know: many deconverts left a brittle version (young-earth-or-nothing, inerrancy-or-atheism) and have never met the faith of, say, Bart Ehrman's own colleagues who read the same data and believe.","id":"ehrman-concessions"},{"say":"Science has explained everything religion used to explain.","quick":"Science explains mechanisms brilliantly — it has never once explained why there are mechanisms. 'How does the universe run?' and 'why is there a universe that runs?' are different questions; the Big Bang's own author, Fr. Georges Lemaître, was clear on the difference. Christianity never needed God as a stopgap physics theory; it needs him as the reason physics works.","id":"science-and-genesis"},{"say":"The resurrection is a legend that grew over decades.","quick":"Legends need generations; this claim has years. The creed Paul quotes in 1 Corinthians 15 — died, buried, raised, seen — was already formalized tradition when he received it, within the first few years after the crucifixion on almost any scholar's dating. Legend-growth is the one theory the timeline actually kills.","id":"corinthians-creed-dating"},{"say":"The gospels are anonymous and written decades after the fact.","quick":"Formally anonymous, yes — concede it. But notice what the 'legend-polishers' forgot to fix: every gospel makes women the first resurrection witnesses, in a culture where Josephus says women's testimony was discounted in court. Inventors clean that up. And 'decades late' is within living eyewitness memory — early by ancient-biography standards, not late.","id":"women-witnesses"},{"say":"You're only a Christian because you were born in America.","quick":"And if they'd been born in secular Sweden, they'd likely be an atheist — the genetic fallacy cuts both ways and settles nothing. Where a belief came from doesn't tell you whether it's true; you check that on the evidence. Also, the premise is dated: Christianity's center of gravity is now the Global South. Then return to the actual question.","id":"argument-from-reason"},{"say":"Your beliefs are just neurons firing — brain chemistry, nothing more.","quick":"Careful — that argument eats itself. If ALL beliefs are just chemistry, so is that one, and so is atheism. If reasoning is nothing but non-rational particle motion selected for survival rather than truth, why trust the reasoning that produced naturalism? This is Lewis's and Plantinga's point: naturalism struggles to underwrite the very reason it runs on.","id":"argument-from-reason"},{"say":"The Flying Spaghetti Monster and the celestial teapot — same evidence as your God.","quick":"The parodies work against a god who is one more object inside the universe — which is exactly what classical theism doesn't claim. Nobody argues a teapot is the necessary ground of contingent being, the source of moral obligation, or the best explanation of an empty tomb. Take the joke graciously, then ask them to engage the actual claim.","id":"kalam-contingency"},{"say":"Faith is belief without evidence.","quick":"That's a definition Christianity itself rejects. Paul stakes everything on a checkable claim: 'if Christ has not been raised, your faith is futile' (1 Cor 15:14) — and cites living witnesses. Biblical faith is trust in a person based on track record, like trusting a spouse — evidence-based, not evidence-free. Don't defend the strawman; disown it.","id":"minimal-facts-resurrection"},{"say":"Christians cherry-pick the Old Testament — shellfish and mixed fabrics, anyone?","quick":"It's not cherry-picking; it's reading a covenant story in order. Israel's civil and ceremonial law was for a nation at a moment; the New Testament itself declares those fulfilled in Christ (Mark 7:19, Acts 10, Hebrews 8) while the moral core is re-affirmed. There's a principled, ancient distinction here — Christians didn't invent it last Tuesday to dodge Leviticus.","id":"canaanite-conquest"},{"say":"If God existed, he'd make himself obvious. He hasn't. So he doesn't.","quick":"Schellenberg's hiddenness argument — treat it as the serious one it is. Two honest replies: God may want more than assent (Satan assents); relationship requires a knowledge that woos rather than coerces. And ask whether they've done what they'd do for any other person who might exist — actually looked. But concede the ache is real; Scripture itself cries 'why do you hide yourself?' (Ps 44).","id":"divine-hiddenness"},{"say":"The disciples were grieving. Grief does strange things — they hallucinated.","quick":"Grief hallucinations are real and well-documented — concede that first. But they're private, individual events. This theory needs group experiences, repeated, to skeptics as well as mourners — James the doubting brother, Paul the active enemy — plus an occupied tomb nobody produced. Hallucinations explain a vision; they don't explain a movement in Jerusalem.","id":"hallucination-hypotheses"},{"say":"The universe came from nothing — quantum fluctuations. No God required.","quick":"The 'nothing' in those models is a quantum vacuum — a seething physical something governed by laws. That's re-labeling, not explaining; where did the vacuum and the laws come from? Cite Vilenkin honestly, both barrels: 'they have to face the problem of a cosmic beginning' AND his caveat that the theorem assumes classical spacetime. The beginning question stands either way.","id":"universe-beginning"},{"say":"People die for false beliefs all the time — the 9/11 hijackers did. So the apostles dying proves nothing.","quick":"**Completely agree — and that's why I don't make that argument.** Sincerity proves sincerity. The narrower point is that these particular men weren't believing someone else's testimony: they were claiming to have eaten with a man they watched die, so they weren't in a position to be honestly mistaken the way a second-hand believer is. Either they saw something or they knew they hadn't. That rules out deliberate fraud and nothing more — and I'll grant you up front that the evidence for most of the twelve is late and thin. Paul is the case worth your time: he was persecuting them first.","refs":"Acts 12:2 · Acts 26:9-11 · 2 Corinthians 11:23-28"}];
const LESSONS=[{"n":1,"t":"Which atheist are you talking to?","what":["There is no such thing as 'talking to an atheist' — there are three utterly different conversations. The PHILOSOPHICAL atheist (rare) has reasons and enjoys the argument; engage the ideas. The APATHETIC none (the majority — most of the 29% of Americans who are unaffiliated never think about God at all) isn't rejecting answers; they've never had the questions — arguments bore them, and curiosity about their life is the only door. The DECONVERT WITH WOUNDS left over people, not premises — PRRI found 47% of leavers cite the church's treatment of LGBTQ people and 31% cite abuse scandals. With the wounded, apologetics is malpractice until the wound is heard: answering an injury with a syllogism confirms everything they left. Diagnose before you say one substantive word."],"ask":"Can I ask your story? Did you grow up with faith — and if you left, what was the moment it broke?","ids":["problem-of-evil","divine-hiddenness","ehrman-concessions"]},{"n":2,"t":"The burden-of-proof standoff","what":["'Atheism is just a lack of belief — I don't have to prove anything.' The honest response: partially grant it. Someone merely unpersuaded owes no argument, and fighting over the dictionary wastes the whole evening. But two things are true: anyone who asserts 'there is no God' or 'naturalism is true' (as serious atheists like Graham Oppy cheerfully do) has taken a position and shares the burden; and 'lack of belief' describes a psychological state, not a view — a thermostat lacks belief. The winning move is to stop the tug-of-war entirely: volunteer to carry the burden. You have evidence; offer it. Burden games are for people with nothing to say."],"ask":"Fair enough — I'll take the burden. If I gave you my single best reason, one, would you genuinely want to hear it?","ids":["kalam-contingency","fine-tuning","who-made-god"]},{"n":3,"t":"The evidence stage: one line, held","what":["The fatal error is the gish gallop — kalam, then fine-tuning, then morality, then prophecy, each abandoned at first pushback. It reads as salesmanship, and the deconvert has watched every one of those arguments 'destroyed' in a YouTube rebuttal already. Pick ONE line — usually the resurrection, because it's historical rather than abstract and it's where Christianity stakes everything (1 Cor 15:14) — and stay on it for the whole conversation, conceding freely at the edges. Build only on what critical scholars grant: crucifixion (Ehrman: 'one of the most certain facts of history'), the disciples' sincere experiences (atheist Lüdemann: 'historically certain'), the pre-Pauline creed, Paul's and James's reversals. Never claim more certainty than the field has; borrowed overconfidence is how the last apologist lost them."],"ask":"Forget proving God for a second — as a matter of plain history, what do you think actually happened to make that movement explode in Jerusalem?","ids":["minimal-facts-resurrection","corinthians-creed-dating","women-witnesses","ehrman-concessions","hallucination-hypotheses"]},{"n":4,"t":"The objections stage: evil, handled with honesty about limits","what":["Every conversation arrives here eventually, and it is where trust is won or lost. The rule: no tidy theodicies for specific suffering — 'God needed another angel' talk has manufactured more atheists than Dawkins. Concede the limits out loud: Christianity does not tell you WHY this child, this cancer, this abuse. What it offers is different — a God who entered suffering rather than explaining it, and a promise that evil is intrusion, not fabric. Then, gently, the pressure runs both ways: their outrage at evil is evidence they believe the universe OWES better, which is a strange debt for blind physics to carry. The Canaanite texts and hiddenness get the same treatment — real answers where they exist, honest 'this one is hard and Christians disagree' where they don't. One admitted limit buys more credibility than ten confident answers."],"ask":"When you say the child's death was WRONG — not just sad, wrong — what do you think that word is standing on?","ids":["problem-of-evil","canaanite-conquest","divine-hiddenness","moral-argument"]},{"n":5,"t":"The invitation: Mark, and the desire question","what":["Debates end; readings begin something. The close is never 'so do you concede?' — it's an invitation with no trap in it: read Mark together, one chapter a week, skeptic's questions welcome, no quiz at the end. Mark is short, fast, unvarnished, and full of the embarrassing details legend-writers remove. And somewhere near the end, ask the desire question — 'if this were true, would you WANT it to be?' — because it locates the real conversation. Nagel answered it with rare candor: 'I hope there is no God! I don't want the universe to be like that.' Some skeptics discover the same; the argument was never the obstacle. But with the wounded it often flips — 'I wish I could believe, I just can't' — and that answer is holy ground. Don't argue with it. Stay, read, and let Jesus make his own case."],"ask":"Set aside whether it's proven. If it turned out to be true — all of it — would that be good news or bad news to you?","ids":["minimal-facts-resurrection","science-and-genesis"]}];

function bindOpens(){document.querySelectorAll("#main [data-open]").forEach(b=>b.addEventListener("click",()=>openCase(b.dataset.open)));}
function renderTheySay(){
  $("#main").innerHTML=`<div class="viewhead"><h2>They just said…</h2>
  <p>Real conversations start with a line, not a topic. Find the line you just heard, answer in two sentences, then open the full case together. Use the search box to jump (Ctrl+F works too).</p></div>`+
  THEYSAY.map(t=>`<div class="ptcard"><h3 class="ptv">“${esc(t.say)}”</h3>
    <div class="who you">Your two sentences</div><p class="pt">${rich(t.quick)}</p>
    <div class="relrow"><button data-open="${t.id}">Open the full case: ${esc((byId[t.id]||{}).title||t.id)}</button></div></div>`).join("");
  bindOpens();
}
function renderLessons(){
  $("#main").innerHTML=`<div class="viewhead"><h2>The shape of the conversation</h2>
  <p>There is no opposing script to counter here — the stages below are the shape of a conversation that actually goes somewhere: working out who you're talking to, clearing the bad arguments, conceding what's hard, arguing from their sources, and knowing when to stop and offer a person instead. Each stage carries the one thing to do right then, and the cases behind it.</p></div>`+
  LESSONS.map(L=>`<div class="sa"><span class="tpx">${esc(L.n)}</span><h4 class="sat">${esc(L.t)}</h4><div class="who them">What happens</div><p class="pt">${(Array.isArray(L.what)?L.what:[L.what]).map(w=>"• "+esc(w)).join("<br>")}</p>
    <div class="saybox" style="margin-top:12px"><span class="who">The question to ask</span><p>${rich(L.ask)}</p></div>
    <div class="relrow">${L.ids.map(id=>byId[id]?`<button data-open="${id}">${esc(byId[id].title)}</button>`:"").join("")}</div></div>`).join("");
  bindOpens();
}
const KNOW={"didyouknow":[{"t":"Ehrman's certainties","d":"Bart Ehrman — the most-read skeptical New Testament scholar alive, an agnostic — writes: 'One of the most certain facts of history is that Jesus was crucified on orders of the Roman prefect of Judea, Pontius Pilate.' He also affirms that creeds about Jesus' death and resurrection were circulating before Paul wrote. (Honesty note: he disputes the empty tomb and thinks the tight '3-6 year' creed dating is oversold — cite him for what he actually grants, never more.)","src":"Ehrman, Did Jesus Exist? (2012); ehrmanblog.org","id":"ehrman-concessions"},{"t":"Antony Flew changed his mind at 81","d":"For 50 years Flew was the world's most influential philosophical atheist ('Theology and Falsification,' 1950). In 2004 he announced he'd come to believe in a designing intelligence, citing fine-tuning and the complexity of DNA — following 'the evidence wherever it leads.' Handle it accurately: he became a deist, never a Christian, and skeptics questioned his co-authored 2007 book given his age; Flew publicly affirmed it represented his views. Claim exactly that much and no more.","src":"Flew with Varghese, There Is a God (2007)","id":"fine-tuning"},{"t":"What atheist scholars concede about Easter","d":"Gerd Lüdemann (atheist NT scholar): 'It may be taken as historically certain that Peter and the disciples had experiences after Jesus's death in which Jesus appeared to them as the risen Christ.' John Dominic Crossan (co-founder, Jesus Seminar): 'That he was crucified is as sure as anything historical can ever be.' The debate among scholars isn't whether the disciples had experiences — it's what caused them.","src":"Lüdemann, What Really Happened to Jesus (1995), p. 80; Crossan, Jesus: A Revolutionary Biography (1994)","id":"minimal-facts-resurrection"},{"t":"The atheist bus said 'probably'","d":"The 2008-09 London Atheist Bus Campaign — 'There's PROBABLY no God. Now stop worrying and enjoy your life' — aimed for £5,500, hit it by 10 a.m., and raised over £150,000, with Richard Dawkins matching the first £5,500. Two conversation gifts: even the flagship atheist ad hedged its central claim, and its promise ('stop worrying, enjoy life') is a bid for peace and joy — which is a shared longing, not a rebuttal.","src":"Wikipedia, 'Atheist Bus Campaign'; The Guardian (2008-09)"},{"t":"'No religion' is now America's largest religion — and most nones believe","d":"Pew's 2023-24 Religious Landscape Study: 29% of U.S. adults are religiously unaffiliated — a larger bloc than Catholics or evangelicals. But only 17% of nones call themselves atheists, and roughly 7 in 10 believe in God or a higher power. The 'nothing in particular' majority isn't hostile; it's unmoored. Most of the mission field isn't Dawkins — it's drift.","src":"Pew Research Center, RLS 2023-24; 'Religious Nones in America' (Jan 2024)"},{"t":"#exvangelical: deconversion is now a community event","d":"The hashtag was coined by podcaster Blake Chastain in 2016, and 'deconstruction' has become an online genre with its own testimonies, celebrities, and liturgy — TikToks, subreddits (r/exchristian), memoirs. Leaving church once meant isolation; now it means joining a support group that has already rehearsed every argument you might bring. Assume the deconvert you love has an entire community discipling them out.","src":"Chastain, Exvangelical podcast (2016- ); reporting in RNS/The Atlantic"},{"t":"Why people actually leave","d":"PRRI (2023): 67% of Americans who left a religion say they simply stopped believing its teachings — but 47% cite negative teaching about or treatment of LGBTQ people (nearly doubled from 29% in 2016), and 31% cite clergy sexual-abuse scandals (up from 19%). Among under-30 leavers, the LGBTQ figure hits ~60%. Translation: the wound-driven share of deconversion is large and growing. Arguments didn't empty the pews alone; injuries helped.","src":"PRRI, 'Religious Change in America' (2023/2024)"},{"t":"The Big Bang was proposed by a priest","d":"Fr. Georges Lemaître — Belgian Catholic priest and physicist — proposed the expanding universe (1927) and the 'primeval atom' (1931) before it was nicknamed the Big Bang by a detractor. Einstein initially resisted the idea's beginning-shaped implications. In 2018 the IAU renamed the law of cosmic expansion the Hubble-Lemaître Law. Bonus integrity point: Lemaître himself cautioned against using his physics as a proof of God — he kept the magisteria honest in both directions.","src":"IAU resolution (2018); Lemaître, Nature (1931)","id":"science-and-genesis"},{"t":"The scientists on the other side of the stereotype","d":"Francis Collins — director of the Human Genome Project, later NIH — is an ex-atheist Christian (The Language of God, 2006). Michael Faraday and James Clerk Maxwell, arguably the two greatest experimental and theoretical physicists of the 19th century, were devout believers; the Cavendish Laboratory founded in Maxwell's era bore Psalm 111:2 carved over its door. The 'science vs. faith' war narrative has to be maintained AGAINST these biographies.","src":"Collins, The Language of God (2006); standard biographies","id":"science-and-genesis"},{"t":"The fine-tuning numbers are not rhetoric","d":"The cosmological constant is life-permitting to roughly 1 part in 10^120. Roger Penrose calculated the universe's initial low-entropy state at 1 in 10^(10^123) — a number with more zeros than there are particles in the observable universe. Shift the strong nuclear force a few percent and chemistry as we know it dies. Even Stephen Hawking: 'The remarkable fact is that the values of these numbers seem to have been very finely adjusted to make possible the development of life.' The serious naturalist response is the multiverse — engage that, not straw.","src":"Penrose, The Emperor's New Mind (1989); Hawking, A Brief History of Time (1988); Rees, Just Six Numbers (1999)","id":"fine-tuning"},{"t":"Nagel's confession","d":"Philosopher Thomas Nagel (atheist, NYU): 'I want atheism to be true... It isn't just that I don't believe in God... It's that I hope there is no God! I don't want there to be a God; I don't want the universe to be like that.' He calls it 'the cosmic authority problem' and guesses it's 'not a rare condition.' Use it fairly: it doesn't prove atheists are self-deceived — it proves motives exist on BOTH sides, which is exactly why the desire question is worth asking out loud.","src":"Nagel, The Last Word (1997), pp. 130-131","id":"argument-from-reason"},{"t":"Three skeptics who investigated their way in","d":"C.S. Lewis, atheist tutored by the fiercely rationalist 'Great Knock,' called himself 'the most reluctant convert in all England' (1929-31) — the final push came through a long night's conversation with Tolkien. J. Warner Wallace, a cold-case homicide detective and atheist until 35, applied forensic statement analysis to the gospels and concluded they behave like eyewitness accounts. Lee Strobel, Yale-trained legal editor at the Chicago Tribune, spent two years investigating to debunk his wife's new faith. Common thread: none were argued into it at a debate; all were given room to investigate honestly.","src":"Lewis, Surprised by Joy; Wallace, Cold-Case Christianity (2013); Strobel, The Case for Christ (1998)"},{"t":"The Vilenkin quote wars","d":"Cosmologist Alexander Vilenkin wrote of the Borde-Guth-Vilenkin theorem: 'With the proof now in place, cosmologists can no longer hide behind the possibility of a past-eternal universe. There is no escape: they have to face the problem of a cosmic beginning.' He ALSO wrote (2013) that the theorem assumes classical spacetime, so quantum regimes might complicate 'beginning' talk. Apologists quote the first; skeptics the second. Integrity rule for this site: always cite both. The man said both.","src":"Vilenkin, Many Worlds in One (2006), p. 176; Vilenkin correspondence (2013)","id":"universe-beginning"},{"t":"The stone that named David","d":"Until 1993, skeptics could say King David was as historical as King Arthur. Then the Tel Dan Stele — a 9th-century BC Aramaic victory inscription — surfaced, boasting of defeating a king of the 'House of David.' An enemy's monument, not a scribe's flattery. Same pattern in 1961: the Pilate Stone at Caesarea gave us Pontius Pilate's name and title in contemporary limestone. Archaeology can't prove theology, but it keeps eliminating the 'these people never existed' move.","src":"Biran & Naveh, IEJ (1993, 1995); Pilate inscription, Israel Museum","id":"tel-dan-pilate"},{"t":"A thousand years, ninety-five percent","d":"Before 1947, the oldest complete Hebrew Isaiah was medieval (~1000 AD). The Great Isaiah Scroll from Qumran (~125 BC) is a millennium older — and matches at roughly 95% word-for-word, the differences overwhelmingly spelling and slips of the pen. The 'telephone game' prediction was drift; the manuscripts came back and testified to a copying culture of obsessive fidelity. This is the single cleanest empirical test the transmission claim has ever gotten, and it passed.","src":"Dead Sea Scrolls, 1QIsaa; standard OT textual criticism references","id":"dss-ot-stability"}],"week":[{"t":"Deconversion is a bereavement","d":"Leaving faith COSTS, the way joining does: the deconvert loses their community, their calendar, their meaning-structure, often their family's approval, sometimes a marriage. Many describe relief and grief in the same breath — free of fear, homesick for a home they no longer believe exists. The grief runs in waves and re-surges at funerals, Christmases, and their kids' milestones.","tip":"Treat deconversion like a death in the family, not a rebellion. 'That must have cost you a lot' opens more doors than any argument ever printed."},{"t":"They live inside a rebuttal ecosystem","d":"Reddit (r/atheism, r/exchristian), YouTube debate clips, 'apologist gets DESTROYED' compilations, deconstruction TikTok. Whatever argument you're about to make, they have likely watched its strongest form get its strongest answer — and the bad apologetics they were raised on (banana design, 'Liar-Lunatic-Lord' with no legend option) collapsing is part of WHY they left.","tip":"Never deploy an argument you haven't heard the best objection to. Ask first: 'What have you already heard on this? Rate it for me.' Freshness and honesty are your only credibility."},{"t":"Science is belonging, not just method","d":"For many skeptics, 'I believe in science' is an identity and a community — podcasts, subreddits, a tribe of the curious that welcomed them when church didn't. Attacking science reads as attacking their people.","tip":"Never make them choose between the lab and the faith — introduce them to Lemaître and Collins instead. Ask what they're reading; get genuinely curious. Shared wonder is common ground, not enemy territory."},{"t":"They are building meaning, seriously","d":"Secular humanism, effective altruism, mutual-aid groups, running clubs, sobriety communities, climate activism — the thoughtful secular world is dense with meaning-making projects. They are not nihilists, and calling their life meaningless is both false and insulting: they demonstrably find it meaningful.","tip":"Never argue their life is empty. Ask instead what their strong sense of purpose is standing on — 'you clearly live like some things MATTER; where does that mattering come from?' — and listen to the whole answer."},{"t":"The apathetic majority is a different door entirely","d":"Most nones aren't arguing with God; they've simply never thought about him. Pew finds only 17% of the unaffiliated call themselves atheists — the bulk are 'nothing in particular,' and religion just isn't a live question. Apologetics answers questions they are not asking; opening with the kalam is like handing a chess proof to someone who wandered by looking for coffee.","tip":"With the apathetic, don't argue — intrigue. Live a life that raises questions (1 Pet 3:15 assumes someone ASKS). Your peace under pressure is the only apologetic they'll notice."},{"t":"Mixed-faith marriages and minefield holidays","d":"A huge share of deconverts remain embedded in believing families — a spouse still in the pew, parents who cry about grandchildren's souls, a Thanksgiving where one prayer can detonate the table. They manage a chronic diplomacy problem you never see.","tip":"Be the believer who LOWERS the temperature at the table. If the family's strategy is ambush and guilt, be the one safe Christian — that role, held for years, is often the door everything else eventually walks through."},{"t":"The 'nothing in particular' middle is spiritually noisy","d":"The largest slice of nones (63% of them) isn't materialist at all — Pew finds most believe in a higher power, and the same demographic drives astrology apps, manifestation TikTok, tarot, and 'the universe has a plan' talk. They left institutions, not the supernatural. The vacuum filled immediately.","tip":"Don't debate materialism with someone who owns crystals. Ask what they've experienced and what they're seeking — then introduce them to the Person behind the personalized universe they already suspect."},{"t":"Every scandal headline re-litigates their exit","d":"Each new church-abuse story or celebrity-pastor collapse lands on the deconvert as fresh confirmation: 'THIS is what I left, and I was right to.' PRRI shows scandal-driven leaving jumped from 19% to 31% in seven years. They often know the details of a scandal before the Christians in their life do.","tip":"When a scandal breaks, name it FIRST — grieved, unprompted, undefended. Silence reads as complicity; 'well, no institution is perfect' reads worse. 'That was evil and it enrages me too' is the whole move."}],"aboutyou":[{"t":"They've pre-watched your best material","d":"The deconvert especially has heard the case — at youth group, at camp, in the book their mom mailed them — and then watched each piece get answered in a 40-minute rebuttal video. Recycled arguments delivered with fresh confidence confirm their theory that Christians don't actually engage objections.","tip":"Open with an audit, not an argument: 'What have you heard from Christians so far, and what did you make of it?' Concede the bad apologetics they were given. Sorting your own side's weak arguments from its strong ones is the most credible thing you can do."},{"t":"They keep a hypocrisy file, and it's accurate","d":"Catholic abuse cover-ups, Ravi Zacharias, the megachurch collapse of the month, plus a private ledger: the deacon who was cruel, the youth leader who shamed them. When they say 'the church hurt people,' they are usually not exaggerating.","tip":"Agree faster than they expect and defend nothing indefensible. 'You're right, and Jesus reserved his angriest words for exactly that' (Matt 23; the millstone of Matt 18:6). You are not the church's defense attorney; you're a witness to its Lord."},{"t":"They suspect the friendship is a funnel","d":"'You only visit to convert me.' Many have experienced relationship-as-sales-pipeline — love-bombed at the door, dropped when they didn't pray the prayer. They watch for the agenda, and they can smell a scoreboard.","tip":"Love with no exit clause. Show up for the move, the diagnosis, the birthday — for years, with zero leverage. Say it out loud once if needed: 'I'd want you in my life if you never darkened a church door again.' Then prove it."},{"t":"They assume you're anti-science","d":"The stereotype arrives before you do: you deny evolution, distrust vaccines, think the earth is six thousand years old. For science-identity skeptics this alone disqualifies you from serious conversation.","tip":"Break it early and casually — mention Lemaître (Big Bang priest), Collins (genome-mapping Christian), Maxwell. Ask real questions about the science they love. Being the Christian who is CURIOUS is disorienting in the best way."},{"t":"'Thoughts and prayers' reads as doing nothing","d":"To them, prayer-talk after tragedy is the emblem of religion's uselessness — piety as a substitute for casseroles, rides, money, and showing up. The cynicism is earned by every Christian who prayed instead of helping rather than while helping.","tip":"Let action arrive before explanation. Pray privately, show up publicly. When your help precedes and outlasts everyone else's, 'I've been praying for you' stops sounding like a shrug and starts sounding like the engine."},{"t":"Your politics arrived before you did","d":"They believe they can read your entire ballot off your baptism, and they've usually met Christians for whom that read was accurate. For many deconverts, the merger of faith and partisan politics is literally the reason they left — PRRI's data backs the pattern.","tip":"Be harder to predict than the stereotype. Let Jesus scramble your categories visibly — mercy where they expect judgment, conviction where they expect convenience. When they can't file you, they have to actually talk to you."},{"t":"The ex-Christian may genuinely know Scripture — use it","d":"'I've read the Bible twice, that's WHY I'm an atheist.' Sometimes true — many deconverts know the texts, the Greek factoids, and the hard passages better than the average pew-sitter. Treating that as a threat, or condescending to it, ends the conversation.","tip":"Treat their literacy as the best possible news: 'Great — then we can skip the kiddie pool. You pick the passage; let's read the hard parts together.' An open Bible between two honest readers is the least defensive room there is."},{"t":"What actually moved the famous converts","d":"Lewis had a decade of friendship with Tolkien and Dyson before the long night walk. Strobel had two years of watching his wife's changed life while a church tolerated his hostile questions. Wallace was given room to run his own forensic investigation. Rosaria Butterfield had a pastor who hosted dinners for years without ambushing her. The pattern is unbroken: relationship plus honest intellectual space. Almost no one is argued in from cold; nobody is insulted in at all.","tip":"Aim to be trusted, not to be right. Your job description is Tolkien's, not the debate team's: stay close, stay honest, stay long, and leave the closing to God."},{"t":"They're testing your love before your logic","d":"How you treat the waiter, how you talk about gay neighbors and Muslims and 'those people' when they're not in the room — the skeptic runs this test continuously, because their working hypothesis is that Christian love is conditional and tribal. Every unkindness to a third party is logged as data about your God.","tip":"The argument they can't rebut is watching you love someone who can't pay you back — especially someone your tribe is supposed to dislike. They know what Christians claim; they're checking whether it's load-bearing."}],"doctrine":[{"topic":"Origin of the universe","theirs":"The universe emerged ~13.8 billion years ago; inflationary cosmology describes the earliest moments, and quantum-cosmology models explore how a universe might arise without a prior cause. Beyond that, the honest position is 'we don't yet know' — and an honest 'I don't know' beats a comforting story.","bible":"In the beginning, God created the heavens and the earth (Gen 1:1); creation is contingent — it exists because Something necessary holds it (Col 1:17; Heb 1:3).","key":"Physics describes how the universe behaves; it cannot explain why there is a universe behaving, or why the laws themselves exist. 'Why is there something rather than nothing?' survives every equation — and both sides should admit their answer ends in something eternal and uncaused."},{"topic":"Origin of life","theirs":"Abiogenesis: life arose from chemistry — RNA-world, hydrothermal-vent, and metabolism-first models are all live research programs. No consensus mechanism yet, and candid origin-of-life researchers say so; but 'unsolved' is not 'unsolvable.'","bible":"Life comes from the living God who breathes it (Gen 2:7; Ps 36:9; Acts 17:25); creation is commanded to bring forth, suggesting mediated process is no threat.","key":"Don't build God on the gap — gaps close, and a god of gaps shrinks. Build on what's already known: chemistry is life-permitting AT ALL only because the laws were. The wonder isn't the missing step; it's that the staircase exists."},{"topic":"Consciousness","theirs":"Mind is what brains do — an emergent product of neural complexity. The steelman is honest: naturalists like Chalmers call subjective experience 'the hard problem' and admit no current theory explains why matter should be accompanied by an inner life at all.","bible":"Humans are embodied souls made in God's image (Gen 1:27); mind is not an accident of matter but a family resemblance to the first Mind.","key":"First-person experience — the felt redness of red — is the one datum naturalism has made the least progress on. Theism predicts consciousness (reality starts with a Mind); materialism must be perpetually surprised by it."},{"topic":"Grounding of morality","theirs":"Morality evolved for cooperation and is refined by reason and culture; secular thinkers live by it seriously and often admirably. Steelmanned (Oppy and others): moral facts might just be natural facts, needing no divine layer.","bible":"The law is written on every heart (Rom 2:14-15) — which is why atheists are often good; goodness itself is anchored in God's unchanging character (Mark 10:18), not in consensus.","key":"The argument is NOT 'atheists can't be moral' — retire that slander forever. It's about grounding: evolution explains why we FEEL torture is wrong; the question is what makes it wrong for the strong to harm the weak when no one's watching and it pays. 'Wrong' is either a report about us or a fact about reality."},{"topic":"Meaning and purpose","theirs":"The cosmos supplies no meaning, so we make our own — in love, work, art, and leaving the world better. The honest humanist doesn't flinch: self-authored meaning is real meaning, and its fragility is part of its dignity.","bible":"Meaning is found, not manufactured: made BY God, FOR God, with works prepared in advance (Eph 2:10); apart from that, even the sage votes 'vapor' (Ecclesiastes).","key":"Made meaning versus found meaning. Ask the honest question: when they grieve a wasted life or an injustice, does it feel like a preference violated — or like a purpose betrayed? Grief usually testifies to the second."},{"topic":"Death","theirs":"Death is cessation — the end of experience, nothing to fear because nothing is experienced (Epicurus: 'death is nothing to us'). Meaning is intensified, not destroyed, by finitude; face it with courage and leave a legacy.","bible":"Death is real, terrible, and an ENEMY (1 Cor 15:26) — not a doorway to be euphemized; it is defeated bodily, resurrection not mere soul-survival (1 Cor 15).","key":"Christianity agrees with the atheist against the sentimentalist: death is not natural, not beautiful, not 'a part of life.' That's exactly why it must be defeated rather than reframed. The empty tomb is the only proposal on the table that takes death as seriously as the mourner does."},{"topic":"Human value","theirs":"Human worth is grounded in sentience, rationality, and mutual recognition — we confer dignity on each other, and human-rights culture shows conferred dignity can be robust.","bible":"Worth is conferred once, from outside, prior to any capacity: the image of God (Gen 1:27; Jas 3:9) — which is why the embryo, the disabled, and the demented are covered without argument.","key":"Capacity-based worth has edges, and history shows who falls off them. Image-based worth has no edges. Note the receipts: universal human dignity entered the world's moral vocabulary through the imago Dei, and secular rights-talk still spends that inheritance."},{"topic":"Free will","theirs":"Determinism plus physics leaves no room for libertarian freedom; many naturalists are compatibilists (freedom = acting on your own desires), and some (Harris) call free will an illusion outright — with real courage about the consequences for blame and desert.","bible":"Humans are genuine agents, called to choose (Deut 30:19; Josh 24:15) and held responsible — moral appeal saturates Scripture from Eden's 'where are you?' onward.","key":"Watch the practice, not the theory: nobody — including the free-will skeptic — can live a week without resenting a betrayal or crediting a kindness, and resentment is a metaphysical claim. If choices are dominoes, praise and protest are noises. Everyone's life testifies against the lecture."},{"topic":"Evil and suffering","theirs":"Suffering is exactly what an indifferent universe predicts — 'no design, no purpose, no evil, no good, nothing but pitiless indifference' (Dawkins). The evidential argument (Rowe): gratuitous suffering makes God improbable. This is atheism's strongest ground; respect it.","bible":"Evil is intrusion, not fabric (Gen 3; Rom 8:20-22) — named, grieved (Lamentations; Jesus weeping), entered at the cross, and scheduled for eviction (Rev 21:4).","key":"Naturalism explains evil's EXISTENCE better than almost anything else it explains — but it cannot explain our OUTRAGE, the unshakeable verdict that the child's cancer is not just unpleasant but WRONG, that the universe owes better. Protest is a debt claim. Who signed the note?"},{"topic":"How we know things","theirs":"Science and reason are the only tools with a track record — testable, self-correcting, convergent. Claims exempting themselves from evidence get no seat at the table. This discipline is genuinely admirable; it built the modern world.","bible":"Reason is honored ('Come, let us reason together,' Isa 1:18; Paul arguing evidence in Acts 17 and 26) — but knowing persons requires trust as well as tests, and God is a person, not a specimen.","key":"The claim 'only science yields knowledge' is not itself a scientific finding — no experiment can produce it; scientism fails its own entry exam. Everyone knows things science can't reach: that the torture of innocents is wrong, that their spouse loves them, that the past is real. The question is never evidence vs. faith; it's which kinds of evidence fit which kinds of question."},{"topic":"Where history is going","theirs":"History has no script — no direction but the one we fight to give it. Steelmanned: moral progress (abolition, rights, medicine) is real, hard-won, reversible, and entirely our responsibility. That's not bleak; it's adulthood.","bible":"History is a line, not a wheel — creation to fall to redemption to renewal, with a Judge who will put things right (Acts 17:31) and a Kingdom arriving from outside the process.","key":"'The arc of the moral universe bends toward justice' — the secular world's favorite hope — is borrowed teleology; blind processes don't have arcs. Honor the borrowing: their hunger for history to MEAN something is common ground. The question is whether the arc has an Author or we're bending it alone against entropy."},{"topic":"Hope","theirs":"Hope in each other: medicine advancing, children flourishing, solidarity in suffering, the long project of leaving Earth better. Real hope, honestly held — and often heroically practiced. Its horizon is simply this world.","bible":"A living hope anchored outside the grave (1 Pet 1:3) — not optimism about outcomes but confidence in a Person; hope that specifically survives the failure of every this-world hope (Rom 8:24-25, 38-39).","key":"The gentle test: what survives the worst case? Secular hope is real but underwritten by nothing beyond us — the sun still swallows the earth, and every graveside secular hope must change the subject or go quiet. Honor that they hope anyway; that stubborn hoping-against-the-void may itself be the homing signal."}]};

  const on=state.knowTab||"kt-facts";
  $("#main").innerHTML=`<div class="viewhead"><h2>Know your skeptical friend</h2>
  <p>Understanding before argument. Surprising true facts for conversational fluency, the rhythm of their religious life so you can love them practically, and how they've been taught to see you — so nothing they say catches you off guard.</p></div>
  <div class="tabs2">${tabs.map(([k,l])=>`<button class="tab2 ${on===k?"on":""}" data-pane="${k}">${l}</button>`).join("")}</div>
  <div class="tabpane2 ${on==="kt-facts"?"on":""}" id="kt-facts"><div class="kgrid">${KNOW.didyouknow.map(x=>`<div class="ptcard">${x.img?`<img class="ktop" src="${x.img.src}" loading="lazy" data-full="${x.img.src.replace("width=520","width=1400")}" data-cap="${esc(x.img.cap)}">`:""}<h3 class="ptv">${esc(x.t)}</h3><p class="pt">${rich(x.d)}</p><div class="refs">${x.src?`<a href="${esc(x.src)}" target="_blank" rel="noopener">Source</a>`:""}${x.id&&byId[x.id]?` · <button class="klink" data-open="${x.id}">Related case: ${esc(byId[x.id].title)}</button>`:""}</div></div>`).join("")}</div></div>
  <div class="tabpane2 ${on==="kt-week"?"on":""}" id="kt-week">${KNOW.week.map(x=>`<div class="ptcard"><h3 class="ptv">${esc(x.t)}</h3><p class="pt">${rich(x.d)}</p>${x.tip?`<div class="who you">For you as their friend</div><p class="pt">${rich(x.tip)}</p>`:""}</div>`).join("")}</div>
  <div class="tabpane2 ${on==="kt-you"?"on":""}" id="kt-you">${KNOW.aboutyou.map(x=>`<div class="ptcard"><h3 class="ptv">${esc(x.t)}</h3><p class="pt">${rich(x.d)}</p>${x.tip?`<div class="who you">How to navigate it</div><p class="pt">${rich(x.tip)}</p>`:""}</div>`).join("")}</div>${KNOW.doctrine?`<div class="tabpane2 ${on==="kt-doct"?"on":""}" id="kt-doct">${KNOW.doctrine.map(x=>`<div class="ptcard"><h3 class="ptv">${esc(x.topic)}</h3><div class="ddgrid"><div><div class="who them">They teach</div><p class="pt">${rich(x.theirs)}</p></div><div><div class="who you">The Bible teaches</div><p class="pt">${rich(x.bible)}</p></div></div>${x.key?`<div class="ddkey">${rich(x.key)}</div>`:""}</div>`).join("")}</div>`:""}`;
  document.querySelectorAll("#main .tab2").forEach(t=>t.addEventListener("click",()=>{state.knowTab=t.dataset.pane;}));
  document.querySelectorAll("#main [data-open]").forEach(b=>b.addEventListener("click",()=>openCase(b.dataset.open)));
}

function render(){
  if(state.view!=="case"&&location.hash.indexOf("#case/")===0)try{history.replaceState(null,"",location.pathname+location.search)}catch(e){}
  document.querySelector(".app").classList.toggle("reading",state.view!=="overview");
  renderNav();
  if(state.view==="case")return renderCase();
  if(state.view==="paths")return renderPaths(),renderPreview();
  if(state.view==="timeline")return renderTimeline(),renderPreview();
  if(state.view==="glossary")return renderGlossary(),renderPreview();
  if(state.view==="share")return renderShare(),renderPreview();
  if(state.view==="proofs")return renderProofs(),renderPreview();
  if(state.view==="theysay")return renderTheySay(),renderPreview();
  if(state.view==="lessons")return renderLessons(),renderPreview();
  if(state.view==="know")return renderKnow(),renderPreview();
  if(state.view==="core")return renderCore(),renderPreview();
  renderOverview();renderPreview();
}

/* ---------- keyboard ---------- */
document.addEventListener("keydown",e=>{
  const inInput=/input|textarea/i.test(document.activeElement.tagName);
  if(inInput){if(e.key==="Escape")document.activeElement.blur();return;}
  const list=filtered();
  const move=dir=>{
    const idx=list.findIndex(x=>x.id===state.sel);
    const next=list[Math.min(list.length-1,Math.max(0,(idx<0?0:idx+dir)))];
    if(!next)return;
    state.sel=next.id;
    if(state.view==="case"){openCase(next.id);}
    else{renderPreview();
      const el=document.querySelector(`.vt[data-id="${next.id}"]`);
      document.querySelectorAll(".vt.sel").forEach(x=>x.classList.remove("sel"));
      document.querySelectorAll(`.vt[data-id="${next.id}"]`).forEach(x=>x.classList.add("sel"));
      if(el)el.scrollIntoView({block:"nearest"});}
  };
  switch(e.key==="ArrowRight"?"next":e.key==="ArrowLeft"?"prev":e.key.toLowerCase()){
    case "next":e.preventDefault();move(1);break;
    case "prev":e.preventDefault();move(-1);break;
    case "enter":if(state.sel&&state.view!=="case")openCase(state.sel);break;
    case "escape":if(state.view==="case"){state.view=state.pathId?"paths":"overview";state.caseId=null;render();}else{state.q="";const q=$("#q");if(q)q.value="";state.verdict=null;state.severity=null;render();}break;
    case "o":state.view="overview";state.section="all";state.caseId=null;render();break;
    case "p":state.view="paths";state.caseId=null;render();break;
    case "t":state.view="timeline";state.caseId=null;render();break;
    case "g":state.view="glossary";state.caseId=null;render();break;
    case "s":state.view="share";state.caseId=null;render();break;
    case "h":state.view="core";state.caseId=null;render();break;
  }
});


const TOURKEY="wbg_tour";
const TOURSTEPS=[{"icon":"🌌","title":"This section runs in reverse","body":"Nothing here is argued from the Bible's authority to someone who does not hold it. The case is built from sources that do not want the conclusion — skeptical historians, atheist philosophers, and the manuscript record. <b>__N__ cases</b>."},{"icon":"🎯","title":"Who are you talking to?","body":"There are three different conversations. The <b>philosophical atheist</b> is rare, has real reasons, and enjoys the argument. The <b>apathetic none</b> is most people and is not looking for one. The <b>deconvert</b> has heard your best material already, often from someone they loved. Aiming the wrong one at the wrong person is the usual way this fails."},{"icon":"🏷","title":"Four verdicts, one glance","body":"Every case lands in one of four columns:<div class=\"vrow2\"><div><span class=\"badge v-admitted\">Conceded</span><span>skeptical scholars grant it</span></div><div><span class=\"badge v-unrefuted\">Strong</span><span>no good answer has been published</span></div><div><span class=\"badge v-contested\">Contested</span><span>argued both ways — say so</span></div><div><span class=\"badge v-answered\">Don't use</span><span>a Christian argument that fails</span></div></div><p style='margin:10px 0 0'>A third of this section is marked Contested on purpose.</p>"},{"icon":"🧨","title":"Read the retirement list first","body":"The banana. \"No transitional fossils.\" The second law of thermodynamics. Darwin's deathbed. Pascal's wager as an opener. Every one is still circulating, and every one tells a skeptic you do not check your sources. It is the highest-value page here."},{"icon":"🚀","title":"Where to start","body":"Read <b>The heart of it</b>. Not \"the Bible says\", but what a room full of skeptical historians grants about AD 30 — and what explains it.","cta":"Take me to the heart of it"}];
function startTour(){
  const old=document.querySelector(".tourwrap");if(old)old.remove();
  let ti=0;
  const wrap=document.createElement("div");wrap.className="tourwrap";
  function finish(go){localStorage.setItem(TOURKEY,"1");wrap.remove();if(go){state.view="core";state.caseId=null;render();}}
  function draw(){
    const s=TOURSTEPS[ti];
    wrap.innerHTML='<div class="tourcard"><div class="ticon">'+s.icon+'</div><h3>'+s.title+'</h3><div class="tbody">'+s.body+'</div>'+
      '<div class="tdots">'+TOURSTEPS.map((_,j)=>'<i class="'+(j===ti?"on":"")+'"></i>').join("")+'</div>'+
      '<div class="trow"><button class="tskip">Skip tour</button><div>'+(ti>0?'<button class="tback">Back</button>':'')+
      '<button class="tnext">'+(ti===TOURSTEPS.length-1?s.cta:'Next')+'</button></div></div></div>';
    wrap.querySelector(".tskip").addEventListener("click",()=>finish(false));
    const bk=wrap.querySelector(".tback");if(bk)bk.addEventListener("click",()=>{ti--;draw();});
    wrap.querySelector(".tnext").addEventListener("click",()=>{if(ti===TOURSTEPS.length-1){finish(ti===TOURSTEPS.length-1&&true);}else{ti++;draw();}});
  }
  document.body.appendChild(wrap);draw();
}
