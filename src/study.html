function bindOpens(){document.querySelectorAll("#main [data-open]").forEach(b=>b.addEventListener("click",()=>openCase(b.dataset.open)));}
function renderTheySay(){
  $("#main").innerHTML=`<div class="viewhead"><h2>They just said…</h2>
  <p>Real conversations don't start with topics — they start with a line. Find the line you just heard, answer in two sentences, then open the full case together. Use the search box to jump (Ctrl+F works too).</p></div>`+
  THEYSAY.map(t=>`<div class="ptcard"><h3 class="ptv">“${esc(t.say)}”</h3>
    <div class="who you">Your two sentences</div><p class="pt">${rich(t.quick)}</p>
    <div class="relrow"><button data-open="${t.id}">Open the full case: ${esc((byId[t.id]||{}).title||t.id)}</button></div></div>`).join("");
  bindOpens();
}
function renderLessons(){
  $("#main").innerHTML=`<div class="viewhead"><h2>When the missionaries come</h2>
  <p>LDS missionaries teach a fixed curriculum — <i>Preach My Gospel</i>, Lessons 1–5. Here is what each lesson will say, the one question to ask right then, and the cases behind it. Knowing their script lets you be relaxed, warm, and ready.</p></div>`+
  LESSONS.map(L=>`<div class="sa"><span class="tpx">${esc(L.n)}</span><h4 class="sat">${esc(L.t)}</h4><div class="who them">They will teach</div><p class="pt">${L.what.map(w=>"• "+esc(w)).join("<br>")}</p>
    <div class="saybox" style="margin-top:12px"><span class="who">The question to ask</span><p>${rich(L.ask)}</p></div>
    <div class="relrow">${L.ids.map(id=>byId[id]?`<button data-open="${id}">${esc(byId[id].title)}</button>`:"").join("")}</div></div>`).join("");
  bindOpens();
}
const KNOW={"didyouknow":[{"t":"Utah once had its own alphabet","d":"In 1853-54 Brigham Young commissioned a 38-character phonetic script called the Deseret alphabet, taught it in territorial schools, and printed the Book of Mormon in it in 1869. The experiment cost a fortune and died with Young in 1877 — but the alphabet lives on today as an official Unicode block.","src":"https://www.churchofjesuschrist.org/study/history/topics/deseret-alphabet?lang=eng","img":{"src":"https://commons.wikimedia.org/wiki/Special:FilePath/Deseret%20alphabet%20first%20print%20of%201854%20according%20to%20Beesley.png?width=520","cap":"The Deseret alphabet, first print, 1854"}},{"t":"The Garden of Eden was in Missouri","d":"Latter-day Saints teach that Eden was located in Jackson County, Missouri, and that after the Fall, Adam moved to a valley Joseph Smith named Adam-ondi-Ahman (D&C 116), in Daviess County. The church owns the site and teaches that Adam will return there for a great gathering before the Second Coming.","src":"https://www.churchofjesuschrist.org/learn/locations/adam-ondi-ahman?lang=eng","img":{"src":"https://commons.wikimedia.org/wiki/Special:FilePath/Adam-ondi-Ahman-Tower.jpg?width=520","cap":"Adam-ondi-Ahman, Daviess County, Missouri"}},{"t":"The church still has Joseph Smith's seer stone","d":"In August 2015 the church published the first photographs of the small brown seer stone Joseph Smith used to dictate most of the Book of Mormon — a stone he found while digging a well years before, and which the church has quietly kept since the 1800s. Accounts describe Smith placing the stone in a hat and reading off the text, with the gold plates often covered nearby.","src":"https://www.churchofjesuschrist.org/church/news/book-of-mormon-printers-manuscript-photos-of-seer-stone-featured-in-new-book?lang=eng","id":"translation-seer-stone","img":{"src":"https://commons.wikimedia.org/wiki/Special:FilePath/Joseph%20Smith%2C%20Jr.%20portrait%20owned%20by%20Joseph%20Smith%20III.jpg?width=520","cap":"Joseph Smith"}},{"t":"Kolob: the star near God's throne — and Battlestar Galactica","d":"The Book of Abraham describes Kolob as the star 'nearest unto the throne of God,' and a beloved LDS hymn is titled 'If You Could Hie to Kolob.' Battlestar Galactica creator Glen Larson, a Latter-day Saint, borrowed it as 'Kobol,' along with a 'Quorum of Twelve' and marriages called 'sealings.'","src":"https://www.deseret.com/2014/11/22/20553208/mormon-creator-of-battlestar-galactica-dared-to-produce-something-profound/"},{"t":"BYU didn't sell caffeinated soda until 2017","d":"Brigham Young University ended a roughly six-decade campus ban on caffeinated soft drinks in September 2017, announcing it with a photo of a Coke can and the words 'It's happening.' The church had clarified in 2012 that its health code doesn't actually forbid caffeinated soda — only 'hot drinks,' interpreted as coffee and tea.","src":"https://time.com/4951966/byu-brigham-young-soda/","id":"word-of-wisdom-dietary-law"},{"t":"The church is Florida's largest private landowner","d":"Through its for-profit arm AgReserves, the church bought about 383,000 acres from the St. Joe Company for $562 million, pushing its Florida holdings to roughly 673,000 acres — almost 2 percent of the state. Its Deseret Ranches near Orlando is one of the largest cow-calf cattle operations in America.","src":"https://www.csmonitor.com/USA/Latest-News-Wires/2013/1109/Mormon-church-Florida-s-biggest-private-landowner"},{"t":"A $100+ billion investment fund — and an SEC penalty","d":"In 2019 a whistleblower revealed the church's investment arm, Ensign Peak Advisors, had quietly grown to over $100 billion, largely from tithing. In February 2023 the SEC fined the church and Ensign Peak $5 million for hiding the portfolio's size behind 13 shell companies from 1997 to 2019.","src":"https://www.washingtonpost.com/business/2023/02/21/lds-church-sec-charges/","id":"sec-ensign-peak-settlement"},{"t":"A genealogy vault carved into a granite mountain","d":"Since 1965 the church has stored the world's largest genealogical collection — 2.4 million microfilm rolls holding some 3.5 billion images — in a vault tunneled 700 feet into Granite Mountain near Salt Lake City, now fully digitized into the free FamilySearch site. The reason Mormons care so much about genealogy is theological: they perform proxy baptisms in temples on behalf of deceased ancestors, who they believe can accept or reject the ordinance in the spirit world.","src":"https://news-in.churchofjesuschrist.org/article/granite-mountain-records-vault","id":"no-postmortem-repentance"},{"t":"Why Utah is the Beehive State","d":"In the Book of Mormon, 'deseret' means honeybee (Ether 2:3), and the pioneers named their proposed state Deseret with a beehive emblem symbolizing industry. The beehive still marks Utah highway signs, the state emblem, and the new 2024 state flag — a piece of scripture hiding in plain sight on the interstate.","src":"https://byustudies.byu.edu/article/the-symbolism-of-the-beehive-in-latter-day-saint-tradition","id":"bom-geography-retreat","img":{"src":"https://commons.wikimedia.org/wiki/Special:FilePath/Flag%20of%20Utah.svg?width=520","cap":"Utah's beehive flag — 'deseret' means honeybee"}},{"t":"Joseph Smith ran for President of the United States","d":"In January 1844 Smith launched an independent presidential campaign, and that March he secretly organized the Council of Fifty, a body meant to be the nucleus of the political Kingdom of God on earth; hundreds of missionaries electioneered for him. He was killed by a mob that June while jailed in Carthage, Illinois — ending the campaign before the election.","src":"https://www.josephsmithpapers.org/articles/administrative-records-council-of-fifty-minutes","img":{"src":"https://commons.wikimedia.org/wiki/Special:FilePath/Joseph%20Smith%2C%20Jr.%20portrait%20owned%20by%20Joseph%20Smith%20III.jpg?width=520","cap":"Joseph Smith, 1844 presidential candidate"}},{"t":"No crosses on any of their buildings","d":"LDS chapels and temples display no crosses. President Gordon B. Hinckley explained the practice: 'For us, the cross is the symbol of the dying Christ, while our message is a declaration of the living Christ.' Steeples yes, spires yes — but the central symbol of historic Christianity is deliberately absent.","src":"https://www.churchofjesuschrist.org/study/ensign/2005/04/the-symbol-of-our-faith?lang=eng","img":{"src":"https://commons.wikimedia.org/wiki/Special:FilePath/Christus%20statue%20temple%20square%20salt%20lake%20city.jpg?width=520","cap":"The Christus — the symbol chosen instead"}},{"t":"They bought their first temple back — for $192.5 million","d":"In March 2024 the church purchased the Kirtland Temple (Ohio, dedicated 1836) from the smaller Community of Christ, which had owned it for over a century, along with Nauvoo historic buildings and Joseph Smith's Bible-revision manuscripts, for $192.5 million. The two denominations both descend from Joseph Smith's original movement.","src":"https://religionnews.com/2024/03/05/kirtland-temple-purchased-by-lds-church-for-192-5-million/","img":{"src":"https://commons.wikimedia.org/wiki/Special:FilePath/KirtlandTemple%20Ohio%20USA.jpg?width=520","cap":"The Kirtland Temple, Ohio"}},{"t":"The Three Nephites: immortal helpers on the highway","d":"The Book of Mormon says Jesus granted three New World disciples the ability to 'never taste of death' and remain on earth until His return (3 Nephi 28). This spawned a huge body of Mormon folklore — mysterious strangers who change a tire or deliver a warning and then vanish — so much that the church officially cautions members about retelling such stories.","src":"https://en.wikipedia.org/wiki/Three_Nephites"},{"t":"The seagull miracle has its own monument","d":"In 1848 flocks of gulls devoured the crickets destroying the pioneers' first crops, an event Latter-day Saints remember as the 'miracle of the gulls.' The Seagull Monument on Temple Square (1913) is considered the first monument to birds in the U.S., and the California gull is Utah's state bird because of it.","src":"https://www.churchofjesuschrist.org/study/history/topics/crickets-and-seagulls?lang=eng","img":{"src":"https://commons.wikimedia.org/wiki/Special:FilePath/Seagull%20Monument%20-%20Temple%20Square%20-%2026%20April%202025.jpg?width=520","cap":"The Seagull Monument, Temple Square"}},{"t":"One announcement doubled the missionary pipeline","d":"In October 2012 the church dropped the missionary age to 18 for men and 19 for women, and applications jumped from about 700 to 4,000 per week, swelling the force from 58,990 to about 88,000 by 2014. In November 2025 new church president Dallin H. Oaks equalized the age at 18 for women too, and in 2026 the church reported an all-time record of 88,500 missionaries.","src":"https://www.deseret.com/faith/2026/07/14/new-record-88500-missionaries-latter-day-saints-why/","id":"missionary-program-realities"},{"t":"The longest-running broadcast in network history","d":"The Tabernacle Choir's 'Music & the Spoken Word' has aired every week since July 1929, making it the world's longest-running continuous network broadcast. The choir itself dropped 'Mormon' from its name in October 2018, becoming The Tabernacle Choir at Temple Square.","src":"https://en.wikipedia.org/wiki/Music_%26_the_Spoken_Word","img":{"src":"https://commons.wikimedia.org/wiki/Special:FilePath/Mormon%20Tabernacle%2C%20Salt%20Lake.jpg?width=520","cap":"The Salt Lake Tabernacle"}},{"t":"The handcart tragedy Mormons still walk to remember","d":"In 1856 the Willie and Martin handcart companies — about 980 European converts pulling their belongings in wooden carts — left too late in the season and were trapped by Wyoming blizzards; more than 210 died despite a dramatic rescue from Salt Lake. LDS youth groups today reenact 'trek' pulls in pioneer dress, and the story functions as the faith's defining sacrifice narrative.","src":"https://en.wikipedia.org/wiki/Willie_and_Martin_handcart_companies","img":{"src":"https://commons.wikimedia.org/wiki/Special:FilePath/Mormon%20Pioneer%20handcart%20statue.jpg?width=520","cap":"Handcart pioneer memorial statue"}},{"t":"'Oh my heck': a dialect of substitute swearing","d":"Mormon culture produced a whole vocabulary of minced oaths — 'fetch,' 'flip,' 'freaking,' 'gosh,' 'oh my heck' — to vent without profanity, and linguists and journalists have documented them as a real regional dialect feature of the Mormon corridor. Hearing a grown adult mutter 'what the fetch' is a genuinely Utah experience.","src":"https://www.huffpost.com/entry/mormon-cursing_b_8281022"},{"t":"Green Jell-O is Utah's official state snack","d":"Utah's legislature made Jell-O the official state snack in 2001, and at the 2002 Salt Lake Olympics the most coveted collectible pin was a bowl of green Jell-O. The 'Jell-O Belt' is an affectionate nickname for the Mormon culture region, where lime Jell-O salads (sometimes with carrots) are potluck legend.","src":"https://www.deseret.com/2002/2/6/20704070/there-s-green-jell-o-on-your-lapel/"},{"t":"Church was three hours long until 2019","d":"For decades an LDS Sunday meant a three-hour block of meetings. In October 2018 the church announced a move to two hours starting January 2019, paired with a home-study curriculum called 'Come, Follow Me' — framed as making religion 'home-centered, church-supported.'","src":"https://newsroom.churchofjesuschrist.org/article/church-announces-new-balance-between-gospel-instruction-home-church"},{"t":"You can't pick your congregation","d":"Latter-day Saints are assigned to a ward strictly by home address; there is no church-shopping between congregations, and moving houses means a new ward, new leaders, and often a new church job. Leaders defend the system as forcing members to love and serve whoever geography gives them.","src":"https://en.wikipedia.org/wiki/Ward_(LDS_Church)"},{"t":"The health code wasn't binding for 88 years","d":"The Word of Wisdom (1833) — no alcohol, tobacco, or 'hot drinks' (coffee and tea) — was originally given 'not by commandment or constraint,' and early leaders including Brigham Young drank tea or used tobacco at times. Only around 1921, under President Heber J. Grant, did full abstinence become a requirement for temple admission.","src":"https://www.churchofjesuschrist.org/study/history/topics/word-of-wisdom-dc-89?lang=eng","id":"word-of-wisdom-dietary-law"},{"t":"Joseph Smith became a Freemason weeks before the endowment","d":"Smith was initiated into Freemasonry in Nauvoo in March 1842, and on May 4, 1842 he introduced the temple endowment ceremony in the upper room of his Red Brick Store — the same room where the Masonic lodge met. The church's own history essay acknowledges the two rituals have similarities, while teaching the endowment was revealed, not borrowed.","src":"https://www.churchofjesuschrist.org/study/history/topics/masonry?lang=eng","id":"endowment-masonic-origins","img":{"src":"https://commons.wikimedia.org/wiki/Special:FilePath/Joseph%20Smith%20Red%20Brick%20Store%20in%20Nauvoo.jpg?width=520","cap":"The Red Brick Store, Nauvoo — Masonic lodge and first endowment room"}},{"t":"The church takes no position on where the Book of Mormon happened","d":"Despite generations of members assuming the book's lands were known, the church's official essay states it 'takes no position on the specific geographic location of Book of Mormon events in the ancient Americas' and asks members not to teach geography theories in church. Faithful scholars remain split between Mesoamerican and North American 'heartland' models.","src":"https://scripturecentral.org/blog/church-releases-statement-on-book-of-mormon-geography","id":"bom-geography-retreat","img":{"src":"https://commons.wikimedia.org/wiki/Special:FilePath/El%20Castillo%20Stitch%202008%20Edit%201.jpg?width=520","cap":"Chichén Itzá — one contested candidate region"}},{"t":"The Word of Wisdom's forgotten beer clause","d":"D&C 89:17 designates barley 'for mild drinks' — a phrase early Saints understood to permit beer, and the church's own history essay concedes that for two generations leaders tolerated milder alcoholic drinks, denouncing only whiskey and drunkenness. Total abstention became a temple-recommend requirement only under Heber J. Grant in the early 1920s, in step with the American temperance movement.","src":"https://www.churchofjesuschrist.org/study/history/topics/word-of-wisdom-dc-89?lang=eng","id":"word-of-wisdom-dietary-law"},{"t":"Joseph Smith's Jupiter talisman","d":"A silver Jupiter talisman — a magical astrological charm — was reportedly on Joseph Smith's person at Carthage, a claim popularized by D. Michael Quinn's Early Mormonism and the Magic World View. Honesty requires the caveat: the provenance rests entirely on an affidavit Charles Bidamon (son of Emma's second husband) gave when selling it in the 1930s, the talisman appears nowhere in the 1844 inventory of Joseph's effects, and the researcher who first presented it, Reed Durham, later retracted his claim of primary evidence.","src":"https://www.fairlatterdaysaints.org/answers/Joseph_Smith/Occultism_and_magic/Jupiter_talisman","id":"translation-seer-stone"},{"t":"The temple ceremony quietly changed in 2019","d":"In January 2019 the endowment was revised so women no longer covenant to 'hearken' to their husbands — following a 1990 change that removed their promise to 'obey.' The First Presidency confirmed adjustments had been made without detailing them and asked members not to discuss specifics. Further documented revisions followed in 2023, part of a long pattern of changes to a ceremony presented as restored eternal ordinances.","src":"https://religionnews.com/2019/01/03/major-changes-to-mormon-temple-ceremony-especially-for-women/","id":"endowment-masonic-origins"},{"t":"One president announced more temples than 188 years of history built","d":"President Russell M. Nelson announced 200 new temples in under eight years — more than the roughly 160 the church had managed to complete in its entire history before him. As of mid-2026 the church counts 385 temples total, but only 219 are dedicated (211 operating); 61 are under construction and 105 remain merely announced, many still without sites or groundbreaking dates.","src":"https://www.thechurchnews.com/temples/2025/09/30/by-the-numbers-look-200-temples-announced-president-nelson-7-years/"}],"week":[{"t":"The two-hour Sunday block","d":"Sunday is a 60-minute sacrament meeting (hymns, lay-member talks, and the weekly communion of bread and water) followed by a second hour that alternates between Sunday School and men's/women's classes. Sermons are given by assigned ordinary members, not a pastor — even children and teens speak from the pulpit.","tip":"You can accept an invitation to sacrament meeting without any commitment — it's open to visitors and nobody will single you out."},{"t":"Callings: everyone has a church job","d":"Nearly every active member holds an unpaid 'calling' — organist, nursery leader, youth president, clerk — assigned by leaders, not applied for, and the bishop himself is a volunteer with a day job. Big callings can quietly consume 10-20 hours a week.","tip":"Ask your friend what their calling is — it's one of the fastest ways to understand their actual weekly life, and they'll be surprised you know to ask."},{"t":"Ministering assignments","d":"Each member is assigned specific families to watch over — visits, texts, help moving, meals in a crisis — under a program called 'ministering' (which replaced 'home teaching' in 2018). It means much of Mormon social life is organized, assigned care rather than spontaneous friendship.","tip":"Your friend both ministers to assigned families and is ministered to — genuine unassigned friendship from you can matter more than you'd guess."},{"t":"Monday night is family night","d":"Monday evening is Family Home Evening — a churchwide tradition of reserving Monday for a family lesson, activity, and treat. Church buildings go dark on Mondays and members are taught to decline other commitments.","tip":"Invite them to dinner any night but Monday — and being invited to their family night is a real gesture of trust."},{"t":"Seminary at 6 a.m.","d":"LDS high schoolers attend seminary — a scripture class every school day for all four years. Outside Utah (where it's a release-time class), that usually means early morning, often around 6 a.m., before school.","tip":"If your teenager's Mormon friend looks exhausted, this is why — and it tells you how early religious formation is engineered into their week."},{"t":"Temple and chapel are completely different buildings","d":"The chapel is for Sunday worship and open to anyone; the temple is for special ordinances (endowments, sealings, proxy baptisms), open only to members holding a 'temple recommend' earned through a worthiness interview. Even faithful members' relatives cannot enter for a temple wedding without a recommend.","tip":"Don't casually ask to 'see inside the temple' — but do ask what going to the temple means to them; members can discuss it in general terms and usually appreciate the sincere question."},{"t":"Garments worn every day","d":"Endowed adults wear the temple garment — a white two-piece underclothing — day and night as a private reminder of covenants made in the temple. It quietly shapes wardrobe: covered shoulders, longer shorts, modest necklines.","tip":"Never joke about 'magic underwear' — to them it's as sacred as a clerical collar or prayer shawl, and mockery of it closes doors instantly."},{"t":"The annual tithing meeting","d":"Members are expected to give 10 percent of their income, and each fall every family is invited to a 'tithing declaration' meeting (renamed from 'tithing settlement' in 2022) to tell the bishop whether they are full tithe-payers. Full tithing is required for a temple recommend.","tip":"Money and faithfulness are formally linked in their world — understand that a Mormon family may be paying 10 percent gross before any other giving."},{"t":"Fast Sunday","d":"On the first Sunday of each month members skip two meals, donate at least the saved cost as a 'fast offering' for the poor, and hold an open-microphone 'fast and testimony meeting' where members declare 'I know the Church is true.' Even kids often participate in bearing testimony.","tip":"Don't plan brunch with them on the first Sunday of the month — and know that 'I know' rather than 'I believe' is the community's learned language of faith."},{"t":"The Word of Wisdom in social life","d":"No alcohol, coffee, or tea — which shapes every dinner party, work happy hour, and coffee-shop invitation. Caffeinated soda is fine (many Utah soda-shop chains thrive on this), as is hot chocolate and herbal tea.","tip":"Offer sparkling cider or a soda run instead of drinks, and never tease with 'just one won't hurt' — honoring their code builds more trust than any argument."},{"t":"Missionary farewells, emails, and homecomings","d":"When a young person leaves for an 18-24 month mission, the family's whole rhythm changes: a farewell sacrament meeting, weekly emails or calls, and a packed homecoming talk two years later. Missionaries pay their own way and follow strict rules about contact home.","tip":"If your friend has a child on a mission, asking 'where is your missionary serving?' is one of the warmest questions you can ask a Mormon parent."},{"t":"General conference weekends","d":"The first weekends of April and October, local services are cancelled and members watch about 10 hours of broadcast sermons from church leaders in Salt Lake City, often in pajamas with special family breakfasts. Talks from 'the prophet and apostles' then get quoted in lessons for the next six months.","tip":"Ask 'what stood out to you from conference?' the following week — you'll hear what's currently shaping their thinking straight from the source."},{"t":"Worthiness interviews — including for youth","d":"Members sit in periodic one-on-one interviews with their bishop covering belief, chastity, tithing, and Word of Wisdom compliance — required for temple recommends, callings, and youth participation in temple trips. Teens typically have such interviews annually from age 11 or 12.","tip":"Recognize that your friend's standing in their community is formally reviewed — 'worthiness' is a live, administrative category in their life, not just a feeling."},{"t":"Institute, BYU, and young-adult culture","d":"College-age members attend 'institute' religion classes near campuses, or church schools like BYU with honor codes governing dress, curfew-era rules, and beards. Singles are organized into their own 'YSA' (young single adult) wards designed partly to help them marry within the faith.","tip":"A Mormon young adult's social world is often church-saturated by design — a genuine outside friendship is rarer and more valuable than you might assume."}],"aboutyou":[{"t":"The 'great and abominable church' — and how it's softened","d":"Nephi's vision describes exactly two churches: 'the church of the Lamb of God' and 'the church of the devil,' also called 'the great and abominable church' (1 Nephi 13:6; 14:10). Early leaders sometimes applied this to Catholicism or Christendom broadly, but the standard modern reading (Stephen E. Robinson, Ensign, Jan. 1988) says it is no specific denomination — it's every organization that fights God.","tip":"Don't assume your friend thinks your church is 'the church of the devil' — most have absorbed the softened reading — but know the binary framework sits in their scriptures."},{"t":"'All their creeds were an abomination'","d":"In Joseph Smith's canonized First Vision account, God tells him to join no existing church because 'all their creeds were an abomination in his sight; that those professors were all corrupt' (Joseph Smith—History 1:19). Every Latter-day Saint has read this; it is the founding charter of their view of historic Christianity.","tip":"Arguing for the Nicene Creed head-on triggers this pre-loaded text — it's usually more fruitful to ask what they think the creeds actually say, since few have read them."},{"t":"The Great Apostasy: your church's authority was lost","d":"They're taught that after the apostles died, Christ's church fell into universal apostasy — priesthood authority left the earth until God restored it through Joseph Smith in 1830. That's why converts from other churches are rebaptized: your baptism is seen as sincere but performed without authority.","tip":"Understand that to them the issue is never your sincerity — it's authority; asking 'what exactly was lost, and where's the historical evidence?' opens a better conversation than defending your denomination."},{"t":"You have 'a portion of the truth' — they have the fulness","d":"The standard framing is additive, not adversarial: other churches have much good and truth, but the restored church has the 'fulness of the gospel.' President Hinckley's oft-repeated missionary invitation was to 'bring with you all that you have of good and truth... and let us see if we may add to it.'","tip":"Expect affirmation rather than attack — the evangelistic frame is 'you're right as far as you go,' so be ready to lovingly press on where your gospels actually differ, not just where they overlap."},{"t":"'We're Christians too' is the sorest spot","d":"Being told they aren't Christian is the criticism Latter-day Saints feel most keenly. In 2018 President Nelson made the church's full name a spiritual imperative, calling nicknames like 'Mormon church' 'a major victory for Satan' — partly because 'Mormon' obscures the name of Jesus Christ.","tip":"Never open with 'Mormons aren't Christians' — say 'The Church of Jesus Christ of Latter-day Saints' or 'Latter-day Saints,' and frame differences as 'we mean different things by some of the same words.'"},{"t":"Suspicion of paid clergy","d":"Their local leaders are unpaid volunteers, and the Book of Mormon condemns 'priestcrafts' — preaching 'to get gain and praise of the world' (2 Nephi 26:29). Many members are quietly taught to see professional, salaried ministry as evidence of corrupted religion (though senior LDS leaders do receive living allowances).","tip":"Don't be surprised if your pastor's salary reads as a red flag to them; a gracious explanation of why your church supports full-time ministry (1 Tim 5:17-18) may be a genuinely new thought."},{"t":"The script about people who leave","d":"The culture carries a ready-made explanation for ex-members: they were offended, wanted to sin, or stopped trying — reinforced by talks like Bednar's 'And Nothing Shall Offend Them' (Oct. 2006) and Nelson's warning about 'lazy learners and lax disciples' (Apr. 2021). Testimony from former Mormons is therefore heavily pre-discounted.","tip":"Citing an ex-Mormon's story usually backfires — your own firsthand faith in Christ, offered as a friend in good standing in their life, carries far more weight."},{"t":"Where good Christians end up in their plan","d":"In the LDS afterlife, devout Christians who never accept the restored gospel are typically taught to inherit the terrestrial (middle) kingdom — 'honorable men of the earth, who were blinded by the craftiness of men' (D&C 76:75) — a kingdom of glory, but without God the Father's presence or eternal family. Almost nobody goes to hell in their system.","tip":"'Are you saved?' lands strangely on someone taught that virtually everyone gets a kingdom of glory — ask instead what it takes to live with Heavenly Father forever, which is where the real stakes sit for them."},{"t":"Death isn't the deadline","d":"They're taught that the gospel is preached to the dead in the spirit world (D&C 138) and that proxy baptisms let the deceased accept it later — so your unbelieving grandfather still has his chance. This removes the urgency historic Christianity attaches to this life (Hebrews 9:27).","tip":"This is a genuine doctrinal divergence worth naming gently: ask what Scripture says about judgment after death, because 'second chances after death' is load-bearing for their whole temple system."},{"t":"Opposition is expected — and confirms their faith","d":"From Joseph Smith's persecution narrative onward, members are taught that a true church will be fought ('anti-Mormon' material is framed as fulfilling prophecy), so attacks tend to strengthen rather than shake commitment. Meanwhile 'every member a missionary' culture means your friendship may sincerely double as outreach toward you.","tip":"Never open with an attack on Joseph Smith — they're pre-loaded to read it as persecution, which validates their faith; ask honest questions and let them discover tensions themselves."}]};

function renderKnow(){

  $("#main").innerHTML=`<div class="viewhead"><h2>Know your Latter-day Saint neighbor</h2>
  <p>Understanding before argument. Surprising true facts for conversational fluency, the rhythm of their religious life so you can love them practically, and how they've been taught to see you — so nothing they say catches you off guard.</p></div>

  <div class="tabpane2 ${on==="kt-week"?"on":""}" id="kt-week">${KNOW.week.map(x=>`<div class="ptcard"><h3 class="ptv">${esc(x.t)}</h3><p class="pt">${rich(x.d)}</p>${x.tip?`<div class="who you">For you as their friend</div><p class="pt">${rich(x.tip)}</p>`:""}</div>`).join("")}</div>
  <div class="tabpane2 ${on==="kt-you"?"on":""}" id="kt-you">${KNOW.aboutyou.map(x=>`<div class="ptcard"><h3 class="ptv">${esc(x.t)}</h3><p class="pt">${rich(x.d)}</p>${x.tip?`<div class="who you">How to navigate it</div><p class="pt">${rich(x.tip)}</p>`:""}</div>`).join("")}</div>`;
  document.querySelectorAll("#main .tab2").forEach(t=>t.addEventListener("click",()=>{state.knowTab=t.dataset.pane;}));
  document.querySelectorAll("#main [data-open]").forEach(b=>b.addEventListener("click",()=>openCase(b.dataset.open)));
}

/* ---------- router ---------- */
function render(){
  if(state.view!=="case"&&location.hash.indexOf("#case/")===0)try{history.replaceState(null,"",location.pathname+location.search)}catch(e){}
  document.querySelector(".app").classList.toggle("reading",state.view!=="overview");
  renderNav();
  if(state.view==="case")return renderCase();
  if(state.view==="paths")return renderPaths(),renderPreview();
  if(state.view==="timeline")return renderTimeline(),renderPreview();
  if(state.view==="glossary")return renderGlossary(),renderPreview();
  if(state.view==="share")return renderShare(),renderPreview();
  if(state.view==="proofs")return renderProofs(),renderPreview();
  if(state.view==="theysay")return renderTheySay(),renderPreview();
  if(state.view==="lessons")return renderLessons(),renderPreview();
  if(state.view==="know")return renderKnow(),renderPreview();
  if(state.view==="core")return renderCore(),renderPreview();
  renderOverview();renderPreview();
}

/* ---------- keyboard ---------- */
document.addEventListener("keydown",e=>{
  const inInput=/input|textarea/i.test(document.activeElement.tagName);
  if(inInput){if(e.key==="Escape")document.activeElement.blur();return;}
  const list=filtered();
  const move=dir=>{
    const idx=list.findIndex(x=>x.id===state.sel);
    const next=list[Math.min(list.length-1,Math.max(0,(idx<0?0:idx+dir)))];
    if(!next)return;
    state.sel=next.id;
    if(state.view==="case"){openCase(next.id);}
    else{renderPreview();
      const el=document.querySelector(`.vt[data-id="${next.id}"]`);
      document.querySelectorAll(".vt.sel").forEach(x=>x.classList.remove("sel"));
      document.querySelectorAll(`.vt[data-id="${next.id}"]`).forEach(x=>x.classList.add("sel"));
      if(el)el.scrollIntoView({block:"nearest"});}
  };
  switch(e.key==="ArrowRight"?"next":e.key==="ArrowLeft"?"prev":e.key.toLowerCase()){
    case "next":e.preventDefault();move(1);break;
    case "prev":e.preventDefault();move(-1);break;
    case "enter":if(state.sel&&state.view!=="case")openCase(state.sel);break;
    case "escape":if(state.view==="case"){state.view=state.pathId?"paths":"overview";state.caseId=null;render();}else{state.q="";const q=$("#q");if(q)q.value="";state.verdict=null;state.severity=null;render();}break;
    case "o":state.view="overview";state.section="all";state.caseId=null;render();break;
    case "p":state.view="paths";state.caseId=null;render();break;
    case "t":state.view="timeline";state.caseId=null;render();break;
    case "g":state.view="glossary";state.caseId=null;render();break;
    case "s":state.view="share";state.caseId=null;render();break;
    case "h":state.view="core";state.caseId=null;render();break;
  }
});

const TOURSTEPS=[{"icon":"⚖","title":"Welcome to the examination","body":"<b>__N__ documented claims</b> about Mormonism, each weighed against the Bible. Every claim shows its sources, the church's <b>strongest defense</b>, and an honest verdict — nothing is cherry-picked, and weak criticisms are called weak."},{"icon":"🏷","title":"Four verdicts, one glance","body":"Every claim lands in one of four columns:<div class=\"vrow2\"><div><span class=\"badge v-admitted\">Admitted</span><span>their own sources concede the facts</span></div><div><span class=\"badge v-unrefuted\">Unrefuted</span><span>no adequate answer exists</span></div><div><span class=\"badge v-contested\">Contested</span><span>a real debate — both sides shown</span></div><div><span class=\"badge v-answered\">Answered</span><span>the defense wins, and we say so</span></div></div>"},{"icon":"📂","title":"Open any case","body":"Click a claim title and you get the full case file: <b>the claim</b> → <b>the verses behind it</b> (click any reference to read it in place) → <b>the best defense, steelmanned</b> → <b>the verdict</b> → <b>why it matters</b> → and <b>how to bring it up in conversation</b>."},{"icon":"🧭","title":"The sidebar is your map","body":"Sections sort the claims by kind. Below them: <b>The heart of it</b> (the three foundational issues), <b>Sharing the gospel</b> (the full how-to guide), <b>Guided paths</b>, <b>Timeline</b>, and <b>Terms explained</b>. Use ← → arrow keys to move between cases; hover any ⓘ for a plain-English explainer."},{"icon":"🚀","title":"Where to start","body":"New to all this? Read <b>The heart of it</b> first — a different God, a different Jesus, a different gospel — then take the guided path <i>The five strongest cases</i>. You can replay this tour anytime from the sidebar.","cta":"Take me to the heart of it"}];
function startTour(){
  const old=document.querySelector(".tourwrap");if(old)old.remove();
  let ti=0;
  const wrap=document.createElement("div");wrap.className="tourwrap";
  function finish(go){localStorage.setItem(TOURKEY,"1");wrap.remove();if(go){state.view="core";state.caseId=null;render();}}
  function draw(){
    const s=TOURSTEPS[ti];
    wrap.innerHTML='<div class="tourcard"><div class="ticon">'+s.icon+'</div><h3>'+s.title+'</h3><div class="tbody">'+s.body+'</div>'+
      '<div class="tdots">'+TOURSTEPS.map((_,j)=>'<i class="'+(j===ti?"on":"")+'"></i>').join("")+'</div>'+
      '<div class="trow"><button class="tskip">Skip tour</button><div>'+(ti>0?'<button class="tback">Back</button>':'')+
      '<button class="tnext">'+(ti===TOURSTEPS.length-1?s.cta:'Next')+'</button></div></div></div>';
    wrap.querySelector(".tskip").addEventListener("click",()=>finish(false));
    const bk=wrap.querySelector(".tback");if(bk)bk.addEventListener("click",()=>{ti--;draw();});
    wrap.querySelector(".tnext").addEventListener("click",()=>{if(ti===TOURSTEPS.length-1){finish(ti===TOURSTEPS.length-1&&true);}else{ti++;draw();}});
  }
  document.body.appendChild(wrap);draw();
}
if(!localStorage.getItem(TOURKEY))setTimeout(startTour,500);

document.documentElement.dataset.theme=localStorage.getItem("wb_theme")||"dark";
$("#q").addEventListener("input",e=>{
  state.q=e.target.value.trim().toLowerCase();
  if(state.view!=="overview"){state.view="overview";state.caseId=null;}
  render();
});
window.addEventListener("hashchange",()=>{
  const m=location.hash.match(/^#case\/([A-Za-z0-9-]+)$/);
  if(m&&byId[m[1]]){if(state.caseId!==m[1])openCase(m[1]);}
  else if(!location.hash&&state.view==="case"){state.view="overview";state.caseId=null;render();}
});
