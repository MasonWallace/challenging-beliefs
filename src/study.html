<title>Which Gospel? — Mormonism, Examined Against the Bible</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --bg:#0f1116; --side:#0b0d11; --panel:#161a21; --panel2:#12151b; --line:#232833; --line2:#2b313d;
    --ink:#e7e9ec; --muted:#98a0ac; --dim:#565e6b; --gold:#82b1d8; --gold-ink:#0e1116;
    --red:#e0736a; --red-bg:#38221f; --red-cell:#5e2b27; --red-cell-hi:#8a3a32;
    --amber:#cf9a45; --amber-bg:#332a18; --amber-cell:#54431f; --amber-cell-hi:#7d6224;
    --green:#7fb08d; --green-bg:#1d2c26; --green-cell:#27443a;
    --purp:#b394e0; --purp-bg:#2c2440;
    --teal:#6cb6ad; --teal-bg:#16302e;
    --serif:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif;
    --sans:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    --acc:var(--gold);
    --acc2:var(--purp);
    --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  }
  :root[data-theme="light"]{
    --bg:#f3f4f6; --side:#e9ebee; --panel:#ffffff; --panel2:#f7f8fa; --line:#dfe2e7; --line2:#cfd4db;
    --ink:#1b1e23; --muted:#5c6470; --dim:#9aa1ab; --gold:#2f6b9e; --gold-ink:#ffffff;
    --red:#b03a31; --red-bg:#f6e4e2; --red-cell:#e7b6b1; --red-cell-hi:#cc766d;
    --amber:#8a5f0e; --amber-bg:#f3ecd9; --amber-cell:#e4d1a2; --amber-cell-hi:#c6a75e;
    --green:#3e7455; --green-bg:#e3ede6; --green-cell:#b7d1bf;
    --purp:#6b4fa1; --purp-bg:#ece5f6;
    --teal:#26706a; --teal-bg:#e0eeec;
  }
  *{box-sizing:border-box}
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6}
  a{color:var(--gold)}
  button{font-family:inherit}
  mark{background:color-mix(in srgb,var(--amber) 30%,transparent);color:inherit;border-radius:2px;padding:0 2px}
  kbd{font-family:var(--mono);font-size:.72rem;background:var(--panel);border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;padding:1px 6px;color:var(--muted)}

  .app{display:grid;grid-template-columns:216px minmax(0,1fr) 280px;min-height:100vh}
  @media (max-width:1020px){.app{grid-template-columns:216px minmax(0,1fr)}.preview{display:none}}
  @media (max-width:720px){.app{grid-template-columns:1fr}.side{position:sticky;top:0;z-index:40;height:auto;border-right:0;border-bottom:1px solid var(--line)}
    .side .nav{display:flex;flex-wrap:wrap;gap:2px;padding:0 10px 10px}.side .nav h5{display:none}.side .sideprog{display:none}}

  /* sidebar */
  .side{background:var(--side);border-right:1px solid var(--line);padding:18px 0;position:sticky;top:0;height:100vh;overflow-y:auto}
  @media (max-width:720px){.side{height:auto;overflow:visible}}
  .logo{font-family:var(--serif);font-size:1rem;letter-spacing:.1em;padding:0 18px 14px;color:var(--ink)}
  .logo b{color:var(--gold)}
  .sidesearch{padding:0 14px 12px}
  .sidesearch input{width:100%;font-family:inherit;font-size:.82rem;padding:7px 12px;border-radius:8px;border:1px solid var(--line2);background:var(--panel);color:var(--ink)}
  .sidesearch input:focus{outline:2px solid var(--gold);outline-offset:1px}
  .info{display:inline-grid;place-items:center;width:14px;height:14px;border:1px solid currentColor;border-radius:50%;font-size:.58rem;font-style:normal;font-weight:700;opacity:.75;cursor:help;position:relative;flex:none}
  .info:hover,.info:focus{opacity:1}
  .info .tip{display:none;position:absolute;left:50%;transform:translateX(-50%);top:160%;width:250px;background:var(--side);color:var(--ink);border:1px solid var(--line2);font-family:var(--sans);font-size:.76rem;line-height:1.5;padding:9px 12px;border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.35);z-index:30;text-transform:none;letter-spacing:0;font-weight:400;text-align:left}
  .info:hover .tip,.info:focus .tip{display:block}
  .badge,.tag{display:inline-flex;align-items:center;gap:5px}
  .nav a{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 18px;font-size:.86rem;color:var(--muted);text-decoration:none;cursor:pointer;border-left:2px solid transparent}
  .nav a:hover{background:var(--panel2);color:var(--ink)}
  .nav a.on{background:var(--panel);color:var(--ink);border-left-color:var(--gold)}
  .nav .cnt{font-family:var(--mono);font-size:.68rem;color:var(--dim)}
  .nav h5{font-size:.64rem;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin:18px 18px 6px;font-weight:600}
  .sideprog{margin:22px 18px 8px;font-size:.72rem;color:var(--muted)}
  .pbar{height:4px;background:var(--line);border-radius:2px;margin-top:6px;overflow:hidden}
  .pbar i{display:block;height:100%;background:var(--gold);transition:width .4s ease}

  /* main */
  .main{padding:18px 26px 80px;min-width:0}
  .cmd{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line2);border-radius:8px;padding:4px 8px 4px 14px;margin-bottom:18px}
  .cmd input{flex:1;background:none;border:0;color:var(--ink);font-family:inherit;font-size:.9rem;padding:7px 0;outline:none}
  .cmd input::placeholder{color:var(--dim)}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:20px}
  .tile{background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:12px 14px;cursor:pointer;text-align:left;color:var(--ink)}
  .tile:hover{border-color:var(--gold)}
  .tile.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
  .tile .v{font-family:var(--serif);font-size:1.7rem;font-variant-numeric:tabular-nums;line-height:1.1}
  .tile .l{font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:2px}
  .tile.t-ad .v{color:var(--purp)}.tile.t-un .v{color:var(--red)}.tile.t-co .v{color:var(--amber)}.tile.t-an .v{color:var(--green)}
  h4.bt{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;font-weight:600}
  .vwall{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:10px;align-items:start}
  @media (max-width:1240px){.vwall{grid-template-columns:1fr 1fr}}
  @media (max-width:700px){.vwall{grid-template-columns:1fr}}
  .vcol{background:var(--panel2);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .vcol header{padding:14px 16px 12px;border-bottom:2px solid var(--line)}
  .vcol.ad header{border-bottom-color:var(--purp)}
  .vcol.ad .n,.vcol.ad .t{color:var(--purp)}
  .vcol.ad .vt:hover{border-left-color:var(--purp)}
  .vcol.un header{border-bottom-color:var(--red)}
  .vcol.co header{border-bottom-color:var(--amber)}
  .vcol.an header{border-bottom-color:var(--dim)}
  .vcol header .n{font-family:var(--serif);font-size:1.9rem;line-height:1;font-variant-numeric:tabular-nums}
  .vcol.un .n{color:var(--red)}.vcol.co .n{color:var(--amber)}.vcol.an .n{color:var(--muted)}
  .vcol.an .t{color:var(--muted)}
  .vcol header .t{font-size:.72rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;margin-left:8px}
  .vcol.un .t{color:var(--red)}.vcol.co .t{color:var(--amber)}.vcol.an .t{color:var(--green)}
  .vcol header .d{font-size:.74rem;color:var(--muted);margin-top:4px}
  /* Option B: the four bands run down the page, five cases each */
  .vwall.vstack{display:block;max-width:none}
  .vwall.vstack .vcol{margin:0 0 16px}
  .vwall.vstack .vcol header{padding:16px 18px 14px}
  .vwall.vstack .vcol header .n{font-size:2.1rem}
  .vwall.vstack .vcol header .t{font-size:.8rem;letter-spacing:.12em}
  .vwall.vstack .vcol header .d{font-size:.86rem;margin-top:6px;max-width:70ch;line-height:1.55}
  .vwall.vstack .vt{padding:11px 18px 11px 15px}
  .vwall.vstack .vt h5{font-size:.99rem}
  /* a picture beside every claim; a letter block where no image exists yet */
  .vwall.vstack .vt{display:flex;gap:14px;align-items:center;padding:10px 18px 10px 15px}
  .vth{width:62px;height:46px;flex:0 0 62px;border-radius:7px;object-fit:cover;border:1px solid var(--line2);background:var(--panel)}
  .vth.ph{display:grid;place-items:center;color:var(--dim);font-family:var(--serif);font-size:1.15rem}
  .vtx{display:block;min-width:0;flex:1}
  .vwall.vstack .vt .h5{font-family:var(--serif);font-weight:500;font-size:1.02rem;line-height:1.35;display:block}
  /* the genuinely striking ones carry more weight on the page */
  .vwall.vstack .vt.wow .h5{font-size:1.32rem;line-height:1.28}
  .vwall.vstack .vt.wow .vth{width:78px;height:58px;flex-basis:78px}
  @media (max-width:620px){.vwall.vstack .vt.wow .h5{font-size:1.12rem}}
  .showall{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);
    padding:11px 18px;cursor:pointer;color:var(--gold);font-family:inherit;font-size:.83rem;font-weight:600;letter-spacing:.02em}
  .showall:hover{background:color-mix(in srgb,var(--gold) 8%,transparent)}
  .vgroup h6{font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:0;padding:10px 16px 4px;font-weight:600}
  .vt{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:9px 16px 9px 13px;cursor:pointer;color:var(--ink);border-left:3px solid transparent}
  .vt:hover,.vt.sel{background:var(--panel)}
  .vt.sel{border-left-color:var(--gold)}
  .vcol.un .vt:hover{border-left-color:var(--red)}
  .vcol.co .vt:hover{border-left-color:var(--amber)}
  .vcol.an .vt:hover{border-left-color:var(--green)}
  .vt.dimmed{opacity:.25}
  .vt h5{font-family:var(--serif);font-weight:500;font-size:.92rem;line-height:1.35;margin:0}
  .vt .m{font-size:.66rem;color:var(--dim);letter-spacing:.05em;text-transform:uppercase;margin-top:2px;display:flex;gap:8px;align-items:center}
  .vt .m .rd{color:var(--green)}
  .vt .m .star{color:var(--gold)}

  /* list */
  .rows{display:flex;flex-direction:column}
  .rowitem{display:grid;grid-template-columns:12px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:11px 6px;cursor:pointer;color:var(--ink)}
  .rowitem:hover,.rowitem.sel{background:var(--panel2)}
  .rowitem .stripe{width:4px;height:26px;border-radius:2px}
  .rowitem.v-unrefuted .stripe{background:var(--red)}
  .rowitem.v-contested .stripe{background:var(--amber)}
  .rowitem.v-answered .stripe{background:var(--green)}
  .rowitem h5{font-family:var(--serif);font-weight:500;font-size:1rem;margin:0;line-height:1.35}
  .rowitem .sub{font-size:.72rem;color:var(--muted)}
  .rowitem .meta{display:flex;gap:8px;align-items:center;font-size:.66rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;white-space:nowrap}
  .rowitem .meta .rd{color:var(--green)}

  .badge{font-size:.64rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:3px 9px;border-radius:999px;display:inline-block}
  .badge.v-admitted{background:var(--purp-bg);color:var(--purp)}
  .badge.v-unrefuted{background:var(--red-bg);color:var(--red)}
  .badge.v-contested{background:var(--amber-bg);color:var(--amber)}
  .badge.v-answered{background:var(--green-bg);color:var(--green)}
  .tag{font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line2);border-radius:999px;padding:2px 9px;display:inline-block}

  /* case view */
  .backbar{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
  .backbar button.bk{background:var(--panel);border:1px solid var(--line2);color:var(--muted);border-radius:8px;padding:6px 13px;font-size:.8rem;cursor:pointer}
  .backbar button.bk:hover{color:var(--ink);border-color:var(--gold)}
  .pathnext{margin-left:auto;background:var(--gold);color:var(--gold-ink);border:0;border-radius:8px;padding:7px 14px;font-size:.8rem;font-weight:700;cursor:pointer}
  .case h2{font-family:var(--serif);font-weight:500;font-size:1.6rem;line-height:1.25;margin:10px 0 14px;max-width:30ch;text-wrap:balance}
  .case .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
  .dlab{font-size:.92rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink);margin:28px 0 11px;line-height:1.35}
  .dlab.red{color:var(--red)}.dlab.blue{color:var(--gold)}
  .claimrow{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(270px,1fr);gap:28px;align-items:start}
  .claimrow.solo{grid-template-columns:1fr}
  @media (max-width:900px){.claimrow{grid-template-columns:1fr}}
  .claim p{font-size:.97rem;line-height:1.75;max-width:66ch;margin:0 0 12px}
  .claimside{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:16px 18px;position:sticky;top:16px}
  .claimside .passcols{grid-template-columns:1fr;gap:12px}
  .claimside .sidenote{font-size:.76rem;color:var(--dim);margin:-4px 0 12px}
  .defense p.lead{margin:0 0 4px}
  .defense p{line-height:1.7;margin:0 0 10px}
  .pts{margin:8px 0 0;padding:0;list-style:none;counter-reset:pt}
  .pts li{position:relative;padding:10px 0 10px 36px;border-top:1px dashed color-mix(in srgb,var(--green) 25%,var(--line));line-height:1.7}
  .pts li:first-child{border-top:0}
  .pts li::before{counter-increment:pt;content:counter(pt);position:absolute;left:0;top:10px;width:23px;height:23px;border-radius:50%;background:var(--green-bg);color:var(--green);display:grid;place-items:center;font-size:.72rem;font-weight:700}
  .vbox p{margin:0 0 8px;line-height:1.7}
  .vbox p:last-child{margin-bottom:0}
  .ref-lds{color:var(--red);font-weight:600}
  .ref-bib{color:var(--gold);font-weight:600}
  .qq{font-family:var(--serif);font-style:italic;background:color-mix(in srgb,var(--amber) 16%,transparent);border-radius:3px;padding:0 3px}
  .kw{font-weight:700;text-decoration:underline;text-underline-offset:2px}
  .talk{background:color-mix(in srgb,var(--green) 8%,var(--panel));border:1px solid color-mix(in srgb,var(--green) 30%,var(--line));border-radius:8px;padding:16px 18px;font-size:.93rem;max-width:80ch}
  .talk p{margin:0 0 8px;line-height:1.7}
  .talk p:last-child{margin-bottom:0}
  .corelinks{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .corelink{font-size:.78rem;background:var(--panel2);border:1px solid var(--line2);color:var(--gold);border-radius:999px;padding:5px 13px;cursor:pointer;text-align:left}
  .corelink:hover{border-color:var(--gold)}
  .gtab{width:100%;border-collapse:collapse;font-size:.86rem;margin:14px 0 6px}
  .gtab th{text-align:left;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:8px 12px;border-bottom:2px solid var(--line2)}
  .gtab th:nth-child(2){color:var(--red)}
  .gtab th:nth-child(3){color:var(--gold)}
  .gtab td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.55}
  .gtab td:first-child{font-weight:700;white-space:nowrap;color:var(--muted)}
  .dodont{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media (max-width:700px){.dodont{grid-template-columns:1fr}}
  .dodont ul{margin:8px 0 0;padding-left:18px;font-size:.86rem;color:var(--muted)}
  .dodont li{padding:3px 0;line-height:1.55}
  .why{background:color-mix(in srgb,var(--gold) 7%,var(--panel));border:1px solid color-mix(in srgb,var(--gold) 28%,var(--line));border-radius:8px;padding:16px 18px;font-size:.93rem;max-width:80ch}
  .why p{margin:0 0 10px;line-height:1.7}
  .why .wtail{color:var(--muted);font-style:italic;margin-bottom:0;border-top:1px dashed color-mix(in srgb,var(--gold) 30%,var(--line));padding-top:10px}
  .compare2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media (max-width:760px){.compare2{grid-template-columns:1fr}}
  .pane{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
  .pane .ref{font-size:.7rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
  .pane.bom .ref{color:var(--red)}.pane.bible .ref{color:var(--gold)}
  .pane .scripture{font-family:var(--serif);font-size:1rem;line-height:1.65}
  .cnote{font-size:.8rem;color:var(--muted);margin-top:8px;max-width:80ch}
  .passcols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  /* a reference with a reason attached needs the full width, so drop to one column */
  .passcols:has(.rrow){grid-template-columns:1fr;gap:18px}
  .chips:has(.rrow){display:block}
  .rrow{display:flex;gap:10px;align-items:baseline;padding:7px 0;border-top:1px solid var(--line)}
  .rrow:first-child{border-top:none;padding-top:1px}
  .rrow .chip{flex:0 0 auto}
  .rwhy{font-size:.83rem;line-height:1.55;color:color-mix(in srgb,var(--ink) 86%,var(--muted))}
  .rwhy b{color:var(--gold);font-weight:600}
  .claimside .rrow{flex-direction:column;gap:5px;align-items:flex-start}
  @media (max-width:620px){.rrow{flex-direction:column;gap:5px;align-items:flex-start}}
  @media (max-width:760px){.passcols{grid-template-columns:1fr}}
  .passcols h6{font-size:.68rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin:0 0 8px}
  .passcols .h-bom{color:var(--red)}.passcols .h-bib{color:var(--gold)}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{font-size:.78rem;font-family:var(--serif);border:1px solid var(--line2);background:var(--panel);border-radius:6px;padding:4px 10px;cursor:pointer;color:var(--ink)}
  .chip:hover{border-color:var(--gold)}
  .chip.open{background:var(--amber-bg);border-color:var(--gold)}
  .chip.ext::after{content:" ↗";color:var(--muted);font-family:var(--sans);font-size:.68rem}
  .versebox{grid-column:1/-1;background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:8px;padding:14px 18px;margin-top:4px}
  .versebox .vr{font-size:.7rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-bottom:8px;display:flex;justify-content:space-between}
  .versebox .vr button{background:none;border:0;color:var(--muted);cursor:pointer;font-size:.8rem}
  .versebox .vtext{font-family:var(--serif);font-size:.98rem;line-height:1.7;max-width:72ch}
  .versebox .vnum{font-family:var(--sans);font-size:.62rem;color:var(--muted);vertical-align:super;margin-right:3px}
  .versebox .vwhy{margin-top:10px;font-size:.8rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px;max-width:76ch}
  .versebox .vwhy b{color:var(--gold)}
  .srcdet{margin-top:30px;border-top:1px solid var(--line);padding-top:14px}
  .srcdet summary{font-size:.74rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);cursor:pointer;list-style:none}
  .srcdet summary::before{content:"▸ ";color:var(--gold)}
  .srcdet[open] summary::before{content:"▾ "}
  .srcdet .srcs{margin-top:12px}
  .app.reading{grid-template-columns:216px minmax(0,1fr)}
  .app.reading .preview{display:none}
  body:has(.app.reading) .keysbar{right:0}
  .srcs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
  .srcs li{display:flex;gap:9px;align-items:baseline;font-size:.85rem}
  .sb{flex:none;font-size:.6rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;border-radius:4px;padding:2px 7px;position:relative;top:-1px}
  .sb-scholarly{background:var(--green-bg);color:var(--green)}
  .sb-apologetics{background:var(--amber-bg);color:var(--amber)}
  .sb-primary,.sb-institutional{background:color-mix(in srgb,var(--gold) 16%,transparent);color:var(--gold)}
  .sb-journalism{background:var(--panel);color:var(--muted);border:1px solid var(--line2)}
  .sb-testimony{background:var(--red-bg);color:var(--red)}
  .defense{background:color-mix(in srgb,var(--green) 7%,var(--panel));border:1px solid color-mix(in srgb,var(--green) 30%,var(--line));border-radius:8px;padding:16px 18px;font-size:.92rem;max-width:80ch}

function splitSentences(raw){

      const prev=merged[merged.length-1];
      const m=prev.match(/([A-Za-z&.]+)\.$/);
      const w=m?m[1].replace(/\./g,""):null;
      if(w&&ABBR.includes(w)){merged[merged.length-1]=prev+" "+t;return;}
    }
    merged.push(t);
  });

const GLOSSARY=[{"t":"a chiasm","d":"A mirror-image literary structure (A-B-C-B-A) common in Hebrew writing. It appears in these arguments because its presence in a text is sometimes offered as evidence of ancient Semitic authorship."},{"t":"a codex","d":"A book with bound pages, as opposed to a scroll. Christians adopted the codex format remarkably early, which is part of why so many early Christian manuscripts survive."},{"t":"a palimpsest","d":"A manuscript whose original writing was scraped off so the expensive material could be reused. Modern imaging can often recover the erased text underneath — which is how the Sanaa Quran's earlier layer was read."},{"t":"a proof-text","d":"A verse quoted on its own to establish a point, usually detached from what surrounds it. Proof-texting is the single most common way both sides of every argument on this site go wrong."},{"t":"a stele","d":"An upright inscribed stone slab set up to record a victory, a law, or a treaty — one of archaeology's most valuable finds, because it is a dated, deliberate, public record."},{"t":"a temple recommend","d":"The card certifying a member is worthy to enter the temple, issued after interviews covering belief, chastity, and full tithe-paying. Without it a member cannot attend their own child's wedding."},{"t":"a textual variant","d":"Any difference between two manuscripts, including a misspelling or a change in word order. The famous 'hundreds of thousands of variants' figure is real and almost entirely trivial; the meaningful and viable ones are well under 1%, and every modern Bible footnotes them."},{"t":"Adam-God","d":"Brigham Young's teaching that Adam is 'our Father and our God and the only God with whom we have to do.' Taught repeatedly from the pulpit and later used in the temple lecture, it was denounced as false doctrine by Spencer W. Kimball in 1976 — which raises the question of a prophet teaching error from the pulpit for decades."},{"t":"Alma","d":"Two figures in the Book of Mormon (father and son) and the book's longest section. Alma the Younger's conversion story deliberately parallels Paul's on the Damascus road."},{"t":"an anachronism","d":"Something appearing in a story before it existed in real life — a horse in a place with no horses, a stirrup centuries too early. Anachronisms are one of the main tools for dating a text, because a writer can only mention the world he lives in."},{"t":"an apologist","d":"Someone who defends a faith's claims — from the Greek <i>apologia</i>, a legal defense. Not an insult, and not the same as an apologizer. This site quotes apologists deliberately: a claim is only worth making if it survives the best defense of it."},{"t":"an ossuary","d":"A limestone box for bones, used in Judea for about a century around the time of Jesus: a body was left to decompose for a year, then the bones were collected into the box. Names carved on ossuaries are how we have physical traces of individuals like the high priest Caiaphas."},{"t":"the apocrypha","d":"Books written between the Testaments (Tobit, Judith, Maccabees and others), included in Catholic and Orthodox Bibles and in the original 1611 KJV, but not in the Hebrew canon or in Protestant Bibles today."},{"t":"bishop","d":"The unpaid lay leader of a ward — typically a member with a full-time job who serves ~5 years, conducting worthiness interviews, tithing settlement, and counseling."},{"t":"the Book of Abraham","d":"A short LDS scripture Joseph Smith said he translated from Egyptian papyri he bought from a travelling mummy exhibition in 1835. Fragments of those papyri were rediscovered in 1966; every Egyptologist who has examined them, LDS and non-LDS alike, identifies them as ordinary funerary texts — the Book of Breathings — with no connection to Abraham."},{"t":"brass plates","d":"The record Nephi obtains in Jerusalem c. 600 BC, said to contain the law of Moses and the writings of prophets down to Jeremiah — the Book of Mormon's claimed source for its biblical quotations."},{"t":"the Brethren","d":"Collective insider term for the First Presidency and Quorum of the Twelve Apostles — 'follow the Brethren' is the standing loyalty norm."},{"t":"Brigham Young","d":"Joseph Smith's successor (1801–1877), who led the migration to Utah and governed the territory. Many of the most difficult teachings examined here — Adam-God, blood atonement, the racial priesthood ban — are his rather than Joseph Smith's, and the modern church has disavowed several of them."},{"t":"calling","d":"An assigned, unpaid church job — teacher, clerk, youth leader, organist. Nearly every active member holds one; they are 'extended' by leaders and formally accepted, not applied for."},{"t":"the canon","d":"The list of books a community accepts as Scripture. The New Testament canon was recognized gradually by usage over the first three centuries rather than voted on at a council — Athanasius's list of 367 AD matches ours exactly."},{"t":"the celestial kingdom","d":"The highest of the three LDS degrees of glory. Almost everyone reaches some degree of glory in this system; the celestial kingdom's top tier, where exaltation happens, requires temple ordinances."},{"t":"the CES Letter","d":"A 2013 open letter by Jeremy Runnells, written as questions to a Church Educational System director, collecting the historical problems in one document. It circulated very widely, and Runnells was summoned to a disciplinary council; he resigned first."},{"t":"Codex Sinaiticus","d":"A complete Greek Bible hand-copied around 330–360 AD, found at St Catherine's Monastery on Mount Sinai in the 1840s. Along with Vaticanus it is one of the two oldest complete Bibles in existence, and its text is essentially the text you read today."},{"t":"Codex Vaticanus","d":"A Greek Bible copied around 300–325 AD, held in the Vatican Library — slightly older than Sinaiticus and, with it, the backbone of modern New Testament textual scholarship."},{"t":"the Community of Christ","d":"Formerly the Reorganized Church of Jesus Christ of Latter Day Saints (RLDS) — the branch that stayed in the Midwest under Joseph Smith's son rather than following Brigham Young west. It owns the Kirtland Temple and much of the Independence temple lot."},{"t":"CTR","d":"'Choose the Right' — the church's WWJD. The CTR ring is given in Primary and worn by children and adults alike."},{"t":"Cumorah","d":"The hill where the plates were buried and, in the text, where the Nephites are annihilated in a battle involving hundreds of thousands. The traditional site is in upstate New York near Joseph Smith's home; many LDS scholars now argue for a separate Mesoamerican Cumorah, which requires two hills of the same name."},{"t":"the Danites","d":"A short-lived Mormon vigilante band formed in Missouri in 1838. Their existence is documented; the extent of Joseph Smith's knowledge of their activities is what is argued about."},{"t":"the Dead Sea Scrolls","d":"About 900 manuscripts found in caves at Qumran near the Dead Sea between 1947 and 1956, copied roughly 250 BC–70 AD. They pushed our oldest Hebrew Bible manuscripts back a thousand years — and the text matched what had been copied ever since. The single most important manuscript discovery ever made."},{"t":"Deutero-Isaiah","d":"Chapters 40–55 of Isaiah, judged by most scholars to be written by an anonymous author during the Babylonian exile (c. 545–539 BC) — long after the historical Isaiah, and after Lehi's claimed departure."},{"t":"the Doctrine and Covenants","d":"The LDS book of Joseph Smith's revelations and those of later presidents — abbreviated D&C. Unlike the Book of Mormon it is openly revised: sections have been added, edited and removed across editions."},{"t":"the Documentary Hypothesis","d":"The critical theory that the first five books of the Bible were woven together from several earlier sources (labelled J, E, D and P) rather than written by Moses. The classic form is now heavily revised even among critical scholars, but some version of it is the mainstream academic position."},{"t":"endowment","d":"The LDS temple ceremony of covenants, signs, and tokens introduced by Joseph Smith in May 1842 — seven weeks after his Masonic initiation. Its penalty oaths and five points of fellowship were removed in 1990."},{"t":"the endowment","d":"The central LDS temple ceremony: a instructional drama, covenants, ritual clothing, and signs and tokens. Its 1842 form was closely modelled on Masonic ritual, which Joseph Smith had been initiated into seven weeks earlier; several elements including penalty gestures were removed in 1990."},{"t":"exaltation","d":"The highest LDS salvation: becoming a god in the celestial kingdom through temple ordinances and celestial marriage (D&C 132), with eternal increase and divine creative capacity."},{"t":"exegesis","d":"Drawing out what a text actually says, in its own context. Its opposite is eisegesis — reading your conclusion into the text."},{"t":"the facsimiles","d":"The three Egyptian illustrations printed in the Book of Abraham with Joseph Smith's explanations of what each figure means. They can be checked directly against Egyptology, and this is where the translation claim is most testable."},{"t":"FAIR","d":"Faithful Answers, Informed Response — the largest volunteer LDS apologetics organization. Not an official church voice, but the standard source for the best defense of any criticism."},{"t":"fast & testimony meeting","d":"First Sunday of the month: members skip two meals, donate the value ('fast offering'), and take turns at the pulpit bearing testimony — the phrase 'I know the Church is true' is the liturgical core."},{"t":"felix culpa","d":"'Happy fault' — the Christian tradition that Adam's fall occasioned a greater good (the Incarnation). Cited by LDS scholars as precedent for 2 Nephi 2's necessary-fall doctrine."},{"t":"FHE / Family Home Evening","d":"Monday night reserved churchwide for family lesson, activity, and treat. Practical note: don't schedule anything with an active LDS family on a Monday evening."},{"t":"the First Presidency","d":"The president of the LDS Church and his two counsellors — the church's highest governing body, above the Quorum of the Twelve Apostles. A 'First Presidency statement' is the most authoritative form of LDS pronouncement."},{"t":"general conference","d":"The twice-yearly (April/October) worldwide broadcast weekend of leader talks — replaces church, fills Latter-day Saint social media, and supplies the next six months of lesson content."},{"t":"the golden plates","d":"The metal plates Joseph Smith said he received from Moroni and translated into the Book of Mormon, before returning them to the angel. Eleven witnesses signed statements about them; the plates themselves are unavailable for examination."},{"t":"Gospel Topics Essays","d":"Thirteen essays the church published quietly in 2013–2015 conceding long-disputed historical facts: the seer stone method, multiple First Vision accounts, Smith's polygamy, the papyri mismatch."},{"t":"the Gospel Topics essays","d":"Thirteen essays the church quietly published on its own website between 2013 and 2015, conceding matters long denied or minimized — polygamy including teenage brides, the seer stone in the hat, the priesthood-and-race ban, multiple First Vision accounts, and the Book of Abraham papyri. They are unsigned, were originally unlinked from the main navigation, and are the single most useful source for citing this material from LDS publications."},{"t":"the Great Isaiah Scroll","d":"The star of the Dead Sea Scrolls: a complete copy of Isaiah, all 66 chapters, copied around 125 BC. It proves Isaiah 53 and its portrait of a pierced, suffering servant existed more than a century before Jesus — nobody added it afterwards."},{"t":"haplogroup","d":"A population sharing a common genetic ancestor on the maternal (mtDNA) or paternal (Y) line. Native American haplogroups trace to Siberia/East Asia, not the ancient Near East."},{"t":"Jack Mormon","d":"Insider slang for a member who doesn't practice (drinks coffee or alcohol, skips church) but retains cultural identity. Not hostile — often affectionate."},{"t":"the Jaredites","d":"An earlier and entirely separate civilization in the Book of Mormon, said to have crossed the ocean in eight sealed barges at the time of the Tower of Babel and to have destroyed itself in a war of millions. Their story is the book of Ether, and their barges and their 'cureloms and cumoms' are among the book's most-discussed features."},{"t":"the Joseph Smith Papers","d":"The church-sponsored scholarly project publishing every surviving Joseph Smith document. It is the reason many facts on this site can be cited from LDS sources: the project's own volumes contain the material earlier manuals left out."},{"t":"Josephus","d":"Titus Flavius Josephus (c. 37–100 AD), a Jewish general who surrendered to Rome and became its most important historian of first-century Judea. Not a Christian, which is why his mentions of Jesus, James and John the Baptist carry so much weight."},{"t":"Journal of Discourses","d":"The 26-volume official-printer collection of 19th-century LDS sermons (1854–1886), including Brigham Young's Adam-God and blood-atonement teachings — now treated by apologists as non-canonical."},{"t":"JST","d":"The Joseph Smith Translation (1830–33): Smith's revision of the KJV Bible, adding and altering text by revelation. Not supported by any ancient manuscript at its major additions."},{"t":"King Follett discourse","d":"Joseph Smith's April 1844 funeral sermon — his most famous: God 'was once as we are now, and is an exalted man,' and the Saints must learn 'how to be gods yourselves.'"},{"t":"Kirtland","d":"The Ohio town that was the church's headquarters from 1831 to 1838 — site of the first temple, the Egyptian papyri purchase, and the Kirtland Safety Society banking collapse that drove hundreds out of the church."},{"t":"the KJV","d":"The King James Version of 1611, the English Bible of the whole period covered by this site. Its wording matters constantly here: several movements examined on this site were born inside its cadence, and some of them treat it as the only legitimate Bible."},{"t":"KJV italics","d":"Words printed in italics in the King James Bible to mark text the 1611 translators supplied that has no equivalent in the Hebrew or Greek — a feature of the printed English page only."},{"t":"the Lamanites","d":"In the Book of Mormon, the descendants of Lehi's rebellious sons Laman and Lemuel — the Nephites' enemies for a thousand years, cursed in the text with a 'skin of blackness' (2 Nephi 5:21). The church long taught they were the principal ancestors of Native Americans; the Book of Mormon's introduction was quietly changed in 2006 from 'principal ancestors' to 'among the ancestors' after DNA studies."},{"t":"Lehi","d":"In the Book of Mormon, a prophet in Jerusalem around 600 BC who is warned by God to flee before the Babylonians destroy the city. He takes his family across the wilderness and builds a ship to the Americas — everything in the book descends from that voyage. He is the father of Nephi, Laman and Lemuel."},{"t":"limited geography model","d":"The apologetic thesis that Book of Mormon events occupied only a small region (usually Mesoamerica), not the hemisphere — replacing the traditional reading to blunt archaeological and DNA objections."},{"t":"loanshift","d":"Applying an existing word to a new, unfamiliar thing (as Spaniards called bison 'cows'). The standard apologetic explanation for horses, wheat, and steel in the Book of Mormon."},{"t":"the Manifesto","d":"Wilford Woodruff's 1890 declaration ending the practice of plural marriage, issued under intense federal pressure and printed at the end of the D&C. Plural marriages nonetheless continued to be performed, which produced a Second Manifesto in 1904."},{"t":"the Masoretic Text","d":"The standard Hebrew Bible, preserved and vowel-pointed by Jewish scribes called the Masoretes between roughly 600 and 1000 AD. Almost every Old Testament translation is based on it; where it differs from the Septuagint or the Scrolls, that difference is what scholars argue about."},{"t":"Mesoamerican","d":"Relating to the ancient civilizations of southern Mexico and Central America — Maya, Olmec, Aztec. Most LDS scholars now place the Book of Mormon here rather than across the whole hemisphere, which is a substantial change from what was taught for a century."},{"t":"ministering","d":"Assigned member-to-member visiting (formerly 'home/visiting teaching') — each household has designated members responsible for checking on them."},{"t":"Mormon","d":"In the Book of Mormon, a fourth-century Nephite general and prophet who abridges a thousand years of records onto the golden plates — which is why the book bears his name. His son is Moroni."},{"t":"Moroni","d":"Mormon's son, the last Nephite, who finishes and buries the plates around 421 AD — and who, as a resurrected angel, is said to have appeared to Joseph Smith in 1823 to reveal where they were. The gold statue on LDS temples is Moroni."},{"t":"Mountain Meadows","d":"The 1857 massacre in southern Utah in which a Mormon militia, with some Paiute involvement, killed about 120 members of an emigrant wagon train under a flag of truce, sparing only the youngest children. One man, John D. Lee, was eventually executed for it."},{"t":"the multi-Isaiah theory","d":"The mainstream critical view that the book of Isaiah had more than one author: chapters 1–39 from the eighth-century prophet, 40–55 from an anonymous writer during the Babylonian exile ('Deutero-Isaiah'), and sometimes 56–66 from a third. It is argued from style and from the fact that chapters 40+ address the exile as present. Conservatives dispute it; it matters here because it is the standard reply whenever Isaiah is said to predict something."},{"t":"Nauvoo","d":"The Illinois city the Latter-day Saints built in the 1840s and the setting of the last years of Joseph Smith's life: the temple, the secret plural marriages, the destruction of the <i>Nauvoo Expositor</i> printing press, and his killing at Carthage in 1844."},{"t":"Nephi","d":"Lehi's righteous younger son and the Book of Mormon's opening narrator. He builds the ship, keeps the plates, and founds the Nephites. Also the name of several later figures and of two books (1 and 2 Nephi, 3 and 4 Nephi) — and, in the earliest published accounts, the name given to the angel later called Moroni."},{"t":"the Nephites","d":"In the Book of Mormon, the descendants of Nephi: the literate, record-keeping, mostly-believing civilization whose thousand-year history the book narrates. They are wiped out by the Lamanites in a final battle at Cumorah around 400 AD."},{"t":"papyrus","d":"Paper made from reed pith, the ordinary writing material of the ancient world. New Testament papyri are labelled with a P and a number — P52, a scrap of John, is the earliest known New Testament manuscript, copied around 125 AD."},{"t":"patriarchal blessing","d":"A once-in-a-lifetime prophetic blessing given by an ordained patriarch, transcribed and treated as personal scripture — it declares one's tribe of Israel lineage."},{"t":"the Pearl of Great Price","d":"The shortest book of LDS scripture, containing the Book of Moses, the Book of Abraham, Joseph Smith's own history, and the Articles of Faith."},{"t":"Qumran","d":"The settlement beside the caves where the Dead Sea Scrolls were found, on the northwest shore of the Dead Sea. Usually associated with the Essenes, a strict Jewish sect of the Second Temple period."},{"t":"reformed Egyptian","d":"The script the Book of Mormon says its plates were written in (Mormon 9:32). No such script is known to Egyptology or to any other discipline; the term appears nowhere outside the Book of Mormon."},{"t":"Relief Society","d":"The women's organization — every LDS woman 18+ belongs. Runs compassionate service, meal trains, and one of the Sunday classes."},{"t":"RM","d":"'Returned missionary' — a status label with real social weight, especially in dating. 'Serve worthily' and 'RM' function as marriageability credentials in LDS culture."},{"t":"sealing","d":"The temple ordinance binding a marriage or family 'for time and all eternity.' A living man may hold sealings to multiple women (serially); a living woman may hold only one."},{"t":"the second anointing","d":"A rarely-discussed higher temple ordinance in which a couple's exaltation is made certain in this life. It is not mentioned in church curriculum and is administered by invitation from an apostle."},{"t":"seer stone","d":"A brown stone Joseph Smith found c. 1822 and used for treasure-seeking; the same stone he later placed in a hat to dictate the Book of Mormon. Photographed and published by the church in 2015."},{"t":"the seer stone","d":"A brown stone Joseph Smith had earlier used for treasure-hunting, which he placed in his hat and looked into to dictate most of the Book of Mormon — with the plates often not in the room. The church acknowledged this openly in 2015 and published photographs of the stone; for 150 years the story taught in its manuals showed him reading directly from the plates."},{"t":"seminary","d":"Daily scripture class for high schoolers — historically at 6am before school in much of the U.S. Four years covers the four LDS scripture volumes."},{"t":"the Septuagint","d":"The Greek translation of the Hebrew Scriptures made by Jewish scholars in Alexandria beginning about 250 BC — abbreviated LXX. It matters constantly here because it is pre-Christian: when it renders a verse a certain way, no Christian could have influenced it."},{"t":"the Smithsonian Institution","d":"The United States' national museum and research complex. It matters here because for decades a 'Smithsonian statement' was circulated claiming the institution used the Book of Mormon as an archaeological guide. The Smithsonian issued a formal statement denying it, and now sends a standard letter saying its archaeologists see no connection between the New World's archaeology and the book's contents."},{"t":"stake","d":"A group of 5–12 wards under a stake president — roughly a diocese. 'Stake conference' replaces normal Sunday services twice a year."},{"t":"stylometry","d":"Statistical analysis of writing style (word frequencies, function words) used to attribute authorship. Applied to the Book of Mormon by both BYU researchers and critics — inconclusively."},{"t":"sustaining","d":"The raised-hand vote to approve leaders and callings. Voting opposed is so rare it makes news; 'sustaining the prophet' is a temple-recommend question."},{"t":"Tacitus","d":"Roman senator and historian (c. 56–120 AD). His hostile mention of 'Christus,' executed by the procurator Pontius Pilate under Tiberius, is the standard non-Christian confirmation of the crucifixion."},{"t":"temple recommend","d":"The renewable pass required to enter an LDS temple, granted after worthiness interviews covering tithing, the Word of Wisdom, garment wearing, and belief — the gate to the ordinances LDS teaching ties to exaltation."},{"t":"textual criticism","d":"The discipline of reconstructing a text's original wording by comparing its surviving manuscripts — the science behind claims about the long ending of Mark and the KJV's late readings."},{"t":"theosis","d":"The ancient Christian doctrine of deification — believers 'partaking of the divine nature' (2 Peter 1:4). LDS apologists cite it as precedent for exaltation; patristic scholars reply that theosis always preserved the Creator/creature distinction."},{"t":"the Three and Eight Witnesses","d":"Eleven men whose testimonies are printed in the front of every Book of Mormon. The Three (Cowdery, Whitmer, Harris) describe an angel and a voice; the Eight describe handling the plates. All three of the Three later left the church, and Whitmer and Harris described the experience in terms of 'spiritual eyes' or 'the eye of faith.'"},{"t":"tumbaga","d":"A Mesoamerican gold-copper alloy. Apologists propose the gold plates were tumbaga, which would match the witnesses' ~40–60 lb weight estimates better than solid gold."},{"t":"Urim and Thummim","d":"Biblical divination objects (Exodus 28:30). Early Mormons used the term loosely for both the Nephite 'interpreters' and Smith's own seer stone."},{"t":"the Urim and Thummim","d":"In the Hebrew Bible, an unexplained means of seeking God's decision, kept in the high priest's breastplate. In LDS usage, the name given to a pair of seer stones said to have accompanied the golden plates."},{"t":"ward","d":"The local congregation, assigned strictly by home address — members cannot choose their congregation. Several wards share a building; a 'branch' is a small ward."},{"t":"the Word of Wisdom","d":"The LDS health code (D&C 89) forbidding alcohol, tobacco, coffee and tea. Given in 1833 explicitly 'not by commandment,' it became a requirement for temple entry under Heber J. Grant in the 1920s."},{"t":"Zarahemla","d":"The Book of Mormon's principal Nephite city and capital. No archaeological site has ever been identified with it, and there is no consensus among LDS scholars about where it was — or on which continent."}];

function hl(text,phrases){let out=esc(text);(phrases||[]).forEach(p=>{const e=esc(p).replace(/[.*+?^${}()|[\]\\]/g,"\\$&");out=out.replace(new RegExp(e,"gi"),m=>"<mark>"+m+"</mark>");});return out;}
function glossify(escapedText){
  if(!glossify._re){
    const ts=GLOSSARY.slice().sort((a,b)=>esc(b.t).length-esc(a.t).length);
    const alts=ts.map(g=>esc(g.t).replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|");
    glossify._re=new RegExp("(?<![\\w-])("+alts+")(?![\\w-])","gi");
    glossify._map={};GLOSSARY.forEach(g=>{glossify._map[esc(g.t).toLowerCase()]=g;});
  }
  const used=glossify.seen||(glossify.seen=new Set());
  let inRef=0;
  return escapedText.replace(/(<[^>]*>)|([^<]+)/g,(m,tag,txt)=>{
    if(tag){
      if(/^<span class="ref-(lds|bib)"/.test(tag))inRef++;
      else if(inRef&&tag.indexOf("</span>")===0)inRef--;
      return tag;
    }
    if(inRef)return txt;
    return txt.replace(glossify._re,w=>{
      const g=glossify._map[w.toLowerCase()];
      if(!g||used.has(g.t))return w;
      used.add(g.t);
      return '<span class="g" tabindex="0">'+w+'<span class="gt"><b>'+esc(g.t)+'</b> — '+g.d+'</span></span>';
    });
  });
}


function findWhy(d,cite){
  const key=cite.replace(/–/g,"-").replace(/\s*\(.*\)\s*/g,"").trim();
  const m=key.match(/^([1-4]?\s?[A-Za-z&; ]+?)\s+(\d+)/);
  const frag=m?(m[1].trim()+" "+m[2]):key;
  const sentences=(d.claim+" "+d.rationale).replace(/–/g,"-").split(/(?<=[.!?])\s+/);
  const hit=sentences.find(s=>s.includes(frag));
  return hit?hit.replace(/-/g,"–"):null;
}

  const BOMB={"1 nephi":"1-ne","2 nephi":"2-ne","jacob":"jacob","enos":"enos","jarom":"jarom","omni":"omni","words of mormon":"w-of-m","mosiah":"mosiah","alma":"alma","helaman":"hel","3 nephi":"3-ne","4 nephi":"4-ne","mormon":"morm","ether":"ether","moroni":"moro"};
  const dcm=c.match(/^D&C\s+(\d+)/i);
  if(dcm)return "https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/"+dcm[1]+"?lang=eng";
  if(/^official declaration\s*2/i.test(c))return "https://www.churchofjesuschrist.org/study/scriptures/dc-testament/od/2?lang=eng";
  const abm=c.match(/^Abraham\s+(\d+)/i);
  if(abm)return "https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/"+abm[1]+"?lang=eng";
  const mm=c.match(/^([1-4]?\s?[A-Za-z ]+?)\s+(\d+)/);
  if(mm){const b=mm[1].trim().toLowerCase();
    if(BOMB[b])return "https://www.churchofjesuschrist.org/study/scriptures/bofm/"+BOMB[b]+"/"+mm[2]+"?lang=eng";
    if(/^jst/i.test(c))return "https://www.churchofjesuschrist.org/study/scriptures/jst?lang=eng";
    return "https://www.biblegateway.com/passage/?search="+encodeURIComponent(c)+"&version=KJV";}
  return "https://www.churchofjesuschrist.org/study/scriptures?lang=eng";
}

  const KINDRE=t=>(/answer,? at full strength|^their answer|^the .{2,22} answer\b|^how (they|.*s) (answer|explain)|best (defense|answer)|at its strongest|^the (rabbinic|muslim|witness|sceptic|skeptic) (reply|answer)/.test(t)?"k-def"
      :/^how strong|^the rule\b|^where it lands|^the verdict|don't use|do not use/.test(t)?"k-strength"
      :/^why this|^why it|helps you|^what it cost|^what to do instead|^what to say instead|^the takeaway|^why that matters/.test(t)?"k-help"
      :/runs out|problem|^why that is|^where it breaks|^what that misses|^the gap|^why it is wrong|^the trouble|^what it does not/.test(t)?"k-gap"
      :/verse|text|chapter|\bsays\b|passage|record|scripture|evidence|the numbers|what survives|the hadith|manuscript|papyri|inscription/.test(t)?"k-text"
      :/^the claim|^what is taught|^what (they|the book|the movement|the church|the camps) |^what happened|^how it (usually|ended|came out)|objection|^what (you|your|people)|describes|^the story|^what is at stake/.test(t)?"k-claim"
      :"k-plain");
  const KINDOF=b=>{
    if(b.say)return "k-say";
    const t=b.t.toLowerCase();
    return KINDRE(t);
  };
  /* One fixed sequence for every case, so the colours mean the same thing on
     every page and a reader learns the shape once. "What to say" is last in all
     318 cases and always anchors the run in green. */
  const SEQ=["amber","gold","red","purp","teal","slate"];
  const blocks=(d.plain||[]);
  const kinds=blocks.map(KINDOF);
  let si=0;
  const hues=blocks.map(b=>b.say?"green":SEQ[si++%SEQ.length]);
  return blocks.map((b,bi)=>{
    const ss=splitSentences(b.d),ps=[];
    for(let i=0;i<ss.length;i+=2)ps.push("<p>"+rt(ss.slice(i,i+2).join(" "))+"</p>");
    const kind=kinds[bi], hue="h-"+hues[bi];
    const big=/(k-text|k-say)/.test(kind)?" k-big":"";
    return `<div class="pblk ${kind} ${hue}${b.say?" say":""}${big}"><div class="plab ${hue}">${esc(b.t)}</div>${ps.join("")}</div>`;
  }).join("");
}

  const vbox=()=>$("#versebox");
  const clearVerse=()=>{pinnedCite=null;const b=vbox();if(b)b.innerHTML="";
    document.querySelectorAll(".chip.open,.chip.peek").forEach(x=>x.classList.remove("open","peek"));};
  const sideOf=ch=>ch.closest("[data-side]")?ch.closest("[data-side]").dataset.side:"";
  const buildHtml=(cite,v,side)=>{
    if(!v||!v.verses)
      return '<div class="versebox vmiss"><div class="vr"><span>'+esc(cite)+'</span><button data-close>✕ close</button></div><div class="vwhy">This reference is cited by the claim but isn\'t in the built-in reader — open it in your own Bible.</div></div>';
    const why=findWhy(d,cite);
    const whyHtml=why?"<b>Why it's cited:</b> "+esc(why):ROLENOTE(side);
    const anyHl=v.verses.some(x=>x.hl);

    const body=v.verses.map(x=>{

      return '<span class="vs'+(lit?" hl":"")+'"><span class="vnum">'+x.v+'</span>'+txt+' </span>';
    }).join("");
    return '<div class="versebox"><div class="vr"><span>'+esc(cite)+ctx+'</span><button data-close>✕ close</button></div><div class="vtext">'+body+'</div><div class="vwhy">'+whyHtml+'</div></div>';
  };
  /* The box opens in place, beside what you pointed at. The old glitch came from it
     opening while the page was scrolling, so the page kept resizing under the cursor.

    const box=vbox(); if(!box)return;
    const cite=ch.dataset.cite;
    const host=ch.closest(".pblk, .claim, .defense, .talk, .vbox, .why, .saybox, li, p")
      ||ch.closest(".chips") && ch.closest(".claimside");

    document.querySelectorAll(".chip.open,.chip.peek").forEach(x=>x.classList.remove("open","peek"));
    ch.classList.add(pin?"open":"peek");

    const cb=box.querySelector("[data-close]");if(cb)cb.addEventListener("click",clearVerse);

    if(inner&&hl){

      inner.scrollTop=Math.max(0,want);
    }
  };
  window.addEventListener("scroll",()=>{scrolling=true;clearTimeout(scrollT);clearTimeout(hoverTimer);
    scrollT=setTimeout(()=>{scrolling=false;},220);},{passive:true});
  /* LIVEREFS: references printed inside prose become openable, like the chips */
  document.querySelectorAll("#main .ref-bib, #main .ref-lds").forEach(r=>{

  const canHover=window.matchMedia("(hover:hover)").matches;
  document.querySelectorAll(".chip").forEach(ch=>{

        hoverTimer=setTimeout(()=>{if(!pinnedCite)clearVerse();},160);});
    }
  });
  
});

function renderShare(){
  $("#main").innerHTML=`<div class="viewhead"><h2>Sharing Jesus with a Latter-day Saint friend</h2>
  <p>Not to win an argument. To help a real person meet the real Jesus, with gentleness (2 Timothy 2:24–25). Built from documented ex-Mormon conversions and from ministries with decades in this work.</p></div><div class="pb-h">Say this early, long before any crisis</div>
<div class="saybox"><span class="who">You, over hot chocolate</span><p>"If the church ever turned out not to be true, that would not mean Jesus is not real."</p></div>
<p class="pd">Say it while everything is calm, so a friend has somewhere to land later. A faith crisis without it usually ends in atheism, not in Christ.</p>

<div class="pb-h">What brings Latter-day Saints to Christ, ranked by their own stories</div>
<div class="pb-grid">
<div class="pb"><span class="num">1</span><h4>Reading the New Testament for itself</h4><p>The most common starting point. A missionary in Orlando set out to convert a Baptist pastor. The pastor fed him, gave him the gospel, and asked him to "read the Bible as a child would read it." Eighteen months later he gave his life to Christ, knowing the cost. His mother, a tenured BYU professor, read it again and "saw the difference between their Mormon Christ and the biblical Jesus." She resigned on 3/16, in honor of John 3:16 (Lynn Wilder, <i>Unveiling Grace</i>).</p></div>
<div class="pb"><span class="num">2</span><h4>Grace, after years of trying to be worthy</h4><p>The cycle of worthiness interviews produces a documented fatigue. What lands is full forgiveness that does not depend on how the week went.</p></div>
<div class="pb"><span class="num">3</span><h4>Facts crack the shelf, and a friend decides where they land</h4><p>The CES Letter gets people out of the church. It does not get them to Jesus. When a faith is all true or all false, the usual landing is atheism. Every story has two parts. Evidence broke the shelf. Then one Christian, loving them without conditions, carried them to Jesus instead of nowhere.</p></div>
<div class="pb"><span class="num">4</span><h4>Being loved with no agenda</h4><p>Their culture has a word for friendship with a goal attached: friendshipping. A friendship that survives their doubts, and their leaving, is startling. The version they grew up with is conditional.</p></div>
</div>

<div class="pb-h">The method</div>
<div class="pb-grid">
<div class="pb do"><h4>Witness to Christ, not against Mormonism</h4><p>Speak about Jesus as the one who took your place, not just a good example. See your friend as burdened, not an opponent.</p></div>
<div class="pb do"><h4>Ask questions instead of making statements</h4><p>Two questions do most of the work. "What exactly do you mean by that word?" makes them define it. "How did you come to that conclusion?" moves the burden back. Both beat a testimony played as a trump card.</p></div>
<div class="pb do"><h4>Learn their vocabulary first</h4><p>Grace, salvation, eternal life, atonement. You share the words, not the meanings. Define them before you argue, or you will agree loudly while meaning opposite things.</p></div>
<div class="pb do"><h4>Use only their own sources</h4><p>The Gospel Topics Essays, the Joseph Smith Papers, church manuals. Never use a claim you cannot document from an LDS source. One overstated attack discredits ten true ones and feeds the persecution story.</p></div>
<div class="pb dont"><h4>Never mock the temple or the garments</h4><p>The fastest way to end the friendship for good. In 2003, street preachers at Temple Square desecrated garments in public. Twenty-three evangelical ministers denounced them. It backfires twice: their doctrine reads opposition as proof the church is true, so every yelled slogan works like a testimony meeting.</p></div>
<div class="pb dont"><h4>Never use the weak arguments</h4><p>This site marks the claims that do not hold up. Repeating one hands your friend an easy win and discredits your true ones.</p></div>
<div class="pb dont"><h4>Never expect a decision today</h4><p>Exits take months or years. Plant one thing per conversation and let it sit. If your friendship depends on agreement, you offer the same deal the church does.</p></div>
<div class="pb do"><h4>Pray, and keep praying</h4><p>You cannot argue anyone into the kingdom. "No one can come to me unless the Father who sent me draws him" (John 6:44).</p></div>
</div>

<div class="pb-h">How it actually goes</div>
<p class="sh-open">Exits take years. Almost every one has a Christian in it who stayed.</p>

<div class="sa"><h4 class="sat">When they say prophets were only imperfect men</h4>
<p class="pd">The standard answer when Joseph Smith's conduct comes up. The church openly denies that prophets are perfect, so <i>Joseph sinned</i> bounces off. Two things do not bounce.</p>
<ol class="sh-list">
<li><b>Their own words about the man.</b> D&C 135:3 says Joseph "has done more, save Jesus only, for the salvation of men in this world, than any other man." The church set that standard, not you. The hymn <i>Praise to the Man</i> is still sung to him.</li>
<li><b>Sinning is not the same as lying about revelation.</b> A prophet may lose his temper. He may not lie about what God told him. Every book and ordinance runs through his honesty. The record is hard here. Public denials of polygamy, while he was secretly married to more than thirty women. A revelation threatening Emma by name. Revelations edited after the fact. The Book of Abraham. Ask him: "I am not asking whether Joseph was perfect. I am asking whether he told the truth about the revelations. Which of those does Deuteronomy 18 speak to?"</li>
</ol>
<p class="pd">The fruits test in Matthew 7:15–20 is fair game too. Missionaries use it for Joseph. Accept it, then open the Admitted column of this site and weigh the fruit.</p></div>

<div class="sa"><h4 class="sat">Argue from their canon, not from yours</h4>
<p class="pd">Article of Faith 8 trusts the Bible only "as far as it is translated correctly." That makes it the least trusted book they own. The Book of Mormon is "the most correct of any book on earth." Your friend can wave off Isaiah. They cannot wave off Moroni.</p>
<ol class="sh-list">
<li><b>One God, or many gods.</b> Alma 11:28–29 asks if there is more than one God, and answers no.</li>
<li><b>A God who changes.</b> Moroni 8:18 calls God "unchangeable from all eternity to all eternity." The King Follett sermon says God <i>was once as we are now</i>.</li>
<li><b>Polygamy.</b> Jacob 2:24 calls the many wives of David and Solomon abominable. D&C 132 calls them a gift from God.</li>
<li><b>A second chance.</b> Alma 34:32–35 says "this life is the time to prepare to meet God." A whole temple system is built on saving the dead.</li>
</ol>
<p class="pd">Then ask the question that lands: "If I showed you that the Book of Mormon disagrees with what your church teaches today, which one would you go with?"</p></div>

<div class="sa"><h4 class="sat">When the missionaries are at your table</h4>
<p class="pd">Open the door. They are eighteen to twenty, homesick, living on very little. Feed them. You may be the only committed Christian who ever shares a meal with them, and more than one famous exit began that way. Here is your best move for each of the five lessons in <i>Preach My Gospel</i>.</p>
<ol class="sh-list">
<li><b>The Restoration.</b> Total apostasy after the apostles, then restoration through Joseph Smith. Then pray for a feeling about the Book of Mormon. Ask: "Jesus said the gates of hell would not prevail against his church. If it failed for seventeen hundred years, was he wrong?" On the feeling, offer to test it against Scripture instead (Matthew 16:18; Acts 17:11; Galatians 1:8).</li>
<li><b>The Plan of Salvation.</b> Spirits before birth, three degrees of glory, a kingdom for nearly everyone. Ask: "Scripture says we become the children of God by adoption. Does that not mean we were not his children before?" Then: "If almost everyone gets a kingdom, what did Jesus save us from?" (Romans 8:15; John 1:12).</li>
<li><b>The gospel.</b> Faith, repentance, baptism by their authority, enduring to the end, and grace <i>after all we can do</i>. The most fruitful question in this work: "What must I do to be completely forgiven, and have you done it?"</li>
<li><b>The commandments.</b> Follow the prophet, the Word of Wisdom, tithing, chastity. Do not fight the rules. Probe what they do: "When you keep all of it, does it ever feel like enough? How would you know?" Then say that for you, obedience is thanks for a salvation you already have.</li>
<li><b>Laws and ordinances.</b> Priesthood, temple ordinances, eternal marriage, baptism for the dead. Open Hebrews together (10:11–14; 7:23–25) and ask why Jesus is seated. Because the work is finished.</li>
</ol></div>

<div class="sa"><h4 class="sat">Four things to know about how it goes</h4>
<ol class="sh-list">
<li><b>When they bear testimony.</b> <i>I know the church is true</i> is a trained move. Do not argue with the feeling. Question the test: "How do you tell a feeling that is from God apart from one that is only deeply felt?" People of many faiths report the same burning confirmation of opposite things. God gave a test for prophets that does not run on feelings (Deuteronomy 18:22; 1 John 4:1). Moroni 10:4 asks you to pray about the book, but it assumes the answer. 1 Corinthians 15:3–8 rests on witnesses instead. Jeremiah 17:9 and Proverbs 14:12 say why the heart alone is no safe judge. Then say: "My confidence holds up on my worst-feeling day. It is not in my feelings about Jesus. It is in what he did in history. My feelings have bad days. The empty tomb does not."</li>
<li><b>The shelf.</b> Members shelve the doubts they cannot resolve, until the shelf breaks. You cannot see the shelf, so do not demand an answer. Say: "You do not have to answer that now. Just sit with it."</li>
<li><b>Milk before meat.</b> Your friend may honestly not know the hard history, and the missionaries at your table may know less than you do. Never say the church is hiding it. Say: "I read this in an LDS source. Can you help me understand it?"</li>
<li><b>Count the cost out loud.</b> Doubting can mean bishop interviews, a warned spouse, weddings they are not invited to, distance from family. The family cost is enormous. Never gloat over a crack in their faith. Say: "I know what this could cost you. I am not going anywhere either way." Be the unconditional community the ward cannot be. Expect years.</li>
</ol></div>

<div class="sa"><h4 class="sat">The gospel side by side, and the bridge across</h4>
<ol class="sh-list">
<li><b>God.</b> An exalted man, one of many gods, once as we are now. Or God "from everlasting to everlasting," with none formed before or after him (Psalm 90:2; Isaiah 43:10).</li>
<li><b>Jesus.</b> Firstborn spirit child, our elder brother, who reached godhood. Or the eternal Word who <i>was</i> God, made flesh, maker of all things (John 1:1, 14; Colossians 1:16).</li>
<li><b>Worthiness becomes grace.</b> Resurrection for all, then exaltation by ordinances, covenants and worthiness, <i>after all we can do</i>. Or a gift by faith, "not of works, lest any man should boast" (2 Nephi 25:23; Ephesians 2:8–9; John 19:30). Say: "I am not worthy either. That is exactly who Jesus came for." In Romans 4:5, God justifies the ungodly.</li>
<li><b>Exaltation becomes adoption.</b> Becoming a god one day, or a child of God today. Romans 8:15–17 gives an inheritance received, not a rank achieved. Adoption quietly undoes the pre-existence story.</li>
<li><b>The endless temple becomes the finished cross.</b> Hebrews 10:11–14. Their priests stand daily. Our high priest sat down. Ask why he is sitting.</li>
<li><b>Enduring becomes assurance.</b> A recommend renewed, worthiness reviewed by interview. Or "he that believeth on the Son hath everlasting life," present tense, no condemnation (John 3:36; Romans 8:1). 1 John 5:13 says "that ye may know that ye have eternal life." Ask if they know.</li>
<li><b>Forsaking becomes coming home.</b> The standard set by Kimball is crushing. In Luke 15 the father runs to his son mid-confession (1 John 1:9). Listen for their tiredness.</li>
<li><b>Destiny.</b> Members become gods with eternal increase (D&C 132:19–20). Or adopted children glorified with Christ, worshippers for ever, never rival gods (Romans 8:17; Revelation 22:3).</li>
<li><b>The Great Apostasy becomes the Christ who held.</b> Ask: "Which is more likely? That Jesus lost his church for seventeen hundred years, or that he kept his promise?" (Matthew 16:18; Ephesians 3:21).</li>
</ol></div>
