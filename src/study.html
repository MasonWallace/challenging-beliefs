function renderTimeline(){
  const read=store.read;
  $("#main").innerHTML=`<div class="viewhead"><h2>The revision record, in three acts</h2>
  <p>What was claimed on the left; what the documents later showed on the right. Red years mark the turning points. Click an act to open it — your reading progress fills each meter.</p></div>
  <div class="chs">${TLACTS.map((a,i)=>{
    const linked=a.events.filter(e=>e.id);
    const done=linked.filter(e=>read.has(e.id)).length;
    return `<button class="ch ${state.act===i?"on":""}" data-act="${i}"><span class="n">${a.num}</span><span class="range">${a.range}</span><h4>${a.name}</h4><p>${a.desc} · ${a.events.length} events</p><div class="meter"><i style="width:${linked.length?Math.round(done/linked.length*100):0}%"></i></div></button>`;
  }).join("")}</div>
  ${state.act!=null&&TLACTS[state.act]?actHtml(TLACTS[state.act]):`<p class="tlhint">Pick a period above to see what happened in it.</p>`}`;
  function actHtml(a){
    return `<div class="chopen"><h4>Act ${a.num} · ${a.name} (${a.range})</h4>
    <div class="cvr"><div class="hh claims">What was claimed</div><div></div><div class="hh record">What the record shows</div>
    ${a.events.map(e=>{
      const bubble=`<div class="bubble ${e.side==="claim"?"claim":"rec"}${e.crit?" crit":""}${e.id&&store.read.has(e.id)?" done":""}">${e.id&&IMGMAP[e.id]?`<img class="ebthumb" src="${IMGMAP[e.id].src}" loading="lazy">`:""}${e.crit?`<span class="tpx">★ turning point</span>`:""}${e.id&&store.read.has(e.id)?`<span class="donechip">✓ read</span>`:""}<h4>${esc(e.t)}</h4>${e.why?`<p class="tpwhy">${esc(e.why)}</p>`:""}<p class="${e.why?"tpsub":""}">${esc(e.p)} ${e.id&&byId[e.id]?`<button class="jump" data-open="${e.id}">→ open the case</button>`:""}</p></div>`;
      return `<div class="cell">${e.side==="claim"?bubble:""}</div><div class="mid"><div class="yr2 ${e.crit?"critY":""}">${e.y}</div></div><div class="cell">${e.side==="record"?bubble:""}</div>`;
    }).join("")}</div></div>`;
  }
  document.querySelectorAll(".ch").forEach(b=>b.addEventListener("click",()=>{const i=+b.dataset.act;state.act=state.act===i?null:i;renderTimeline();}));
  document.querySelectorAll(".jump").forEach(b=>b.addEventListener("click",()=>openCase(b.dataset.open)));
}

/* ---------- glossary ---------- */
function renderGlossary(){
  $("#main").innerHTML=`<div class="viewhead"><h2>Word guide</h2><p>${GLOSSARY.length} words you will meet on this site, explained in plain English — people, books, sources, and the specialist terms. Every one of them is underlined with a dotted line wherever it appears in a case; hover or tap it there for the definition without leaving the page.</p></div><details class="primer" open><summary>New here? The story in ninety seconds</summary><div class="primerbody"><p><b>The Book of Mormon claims to be a history of ancient America.</b> Around 600 BC a prophet named <b>Lehi</b> flees Jerusalem before the Babylonians destroy it, crosses the wilderness with his family, and sails to the Americas. His sons divide: the righteous line follows <b>Nephi</b> and becomes the <b>Nephites</b>, the rebellious line follows Laman and becomes the <b>Lamanites</b>. An earlier group, the <b>Jaredites</b>, had crossed in sealed barges at the time of the Tower of Babel and destroyed themselves in a war of millions.</p>
    <p>The Nephites build cities, keep records on metal plates, and fight the Lamanites for a thousand years. After his resurrection, Jesus visits them. Eventually they fall away and are annihilated at the hill <b>Cumorah</b> around 400 AD. The last survivor, <b>Moroni</b> — son of the general <b>Mormon</b>, who had abridged the whole record — buries the plates.</p>
    <p><b>In 1823, Joseph Smith says that same Moroni appeared to him as an angel</b> and showed him where the plates were buried, in a hill near his home in upstate New York. He dictates the translation, largely by looking at a <b>seer stone</b> in his hat, and publishes the Book of Mormon in 1830. Later he produces the <b>Book of Abraham</b> from Egyptian papyri he bought from a travelling mummy exhibition, introduces temple ceremonies and plural marriage at <b>Nauvoo</b>, and is killed by a mob in 1844. <b>Brigham Young</b> leads most of the church to Utah.</p>
    <p>That is the picture every case on this site assumes. Names in dotted underline can be hovered anywhere on the site for a definition.</p></div></details>
  <div class="gaccord">${GLOSSARY.map(g=>`<div class="gitem"><b>${esc(g.t)}</b><p>${g.d}</p></div>`).join("")}</div>`;
}

/* ---------- the heart of it ---------- */
function renderCore(){
  const link=id=>byId[id]?`<button class="corelink" data-open="${id}">${esc(byId[id].title)} →</button>`:"";
  $("#main").innerHTML=`
  <div class="viewhead"><h2>The heart of it: a different God, a different Jesus, a different gospel</h2>
  <p>If you read nothing else on this site, read this page. Mormonism's problems are not a pile of historical trivia — they converge on three foundational differences that decide everything. This is why the theology matters, in plain terms.</p></div>
  <div class="corestrip"><figure><img src="../img/joseph-smith-papyrus-i-1luj4g3-m.webp" loading="lazy" data-cap="The papyri: the one translation we can check"><figcaption>The papyri: the one translation we can check</figcaption></figure><figure><img src="../img/the-great-isaiah-scroll-ms-a-1qisa-google-art-project-4sb8mc-m.webp" loading="lazy" data-cap="The scrolls: the Bible was never lost"><figcaption>The scrolls: the Bible was never lost</figcaption></figure><figure><img src="../img/joseph-smith-jr-portrait-owned-by-joseph-smith-iii-1ki1srz-m.webp" loading="lazy" data-cap="The prophet: Deuteronomy 18 is the test"><figcaption>The prophet: Deuteronomy 18 is the test</figcaption></figure></div>

  <div class="pathcard"><h3 style="color:var(--red)">1 · A different God</h3>
  <p style="font-size:.92rem;line-height:1.75">Mormonism teaches that God the Father is <b>an exalted man</b> — a being of flesh and bone (D&C 130:22) who <b>“was once as we are now”</b> (King Follett discourse, still quoted approvingly in the church's own <i>Becoming Like God</i> essay), one god among many, who <i>organized</i> pre-existing matter rather than creating everything from nothing. The Bible's God is categorically different: <span class="qq">‘from everlasting to everlasting, thou art God’</span> (Psalm 90:2), <span class="qq">‘God is not a man’</span> (Numbers 23:19), <span class="qq">‘before me there was no God formed, neither shall there be after me’</span> (Isaiah 43:10). <b>Why it matters:</b> worship offered to a different being is not worship of God, however sincere. This is the first commandment issue, not a technicality.</p>
  <details class="srcdet" style="border-top:0;padding-top:0;margin-top:12px"><summary>Open the cases behind this</summary><div class="corelinks" style="margin-top:12px">${link("god-exalted-man-flesh-and-bone")}${link("trinity-vs-godhead")}${link("unchangeable-god-vs-king-follett")}${link("exaltation-eternal-progression")}</div></details></div>

  <div class="pathcard"><h3 style="color:var(--red)">2 · A different Jesus</h3>
  <p style="font-size:.92rem;line-height:1.75">In LDS teaching, Jesus is the <b>firstborn spirit child</b> of heavenly parents — the literal elder brother of every human <i>and of Lucifer</i> (the church's own 2007 statement confirms the shared spirit-parentage) — a being of our species who <b>attained</b> godhood. The Bible's Jesus is the eternal Creator who was never made: <span class="qq">‘All things were made through him, and without him was not any thing made that was made’</span> (John 1:3), <span class="qq">‘he is before all things’</span> (Colossians 1:17), <span class="qq">‘the same yesterday, today, and forever’</span> (Hebrews 13:8). <b>Why it matters:</b> only an infinite, uncreated Christ can carry infinite sin. A created elder brother who climbed to divinity cannot save anyone — which is why Paul treats <span class="qq">‘another Jesus’</span> as a salvation issue (2 Corinthians 11:4), not a difference of opinion.</p>
  <details class="srcdet" style="border-top:0;padding-top:0;margin-top:12px"><summary>Open the cases behind this</summary><div class="corelinks" style="margin-top:12px">${link("jesus-firstborn-spirit-attained-godhood")}${link("jesus-lucifer-spirit-brothers")}${link("different-jesus-hinckley-1998")}${link("blood-atonement")}</div></details></div>

  <div class="pathcard"><h3 style="color:var(--red)">3 · A different gospel</h3>
  <p style="font-size:.92rem;line-height:1.75">The LDS gospel is grace <span class="qq">‘after all we can do’</span> (2 Nephi 25:23) — ordinances, temple worthiness, covenants kept, interviews passed, exaltation earned. The biblical gospel is the exact reverse of that order: <span class="qq">‘by grace are ye saved through faith… not of works, lest any man should boast’</span> (Ephesians 2:8–9); God <span class="qq">‘justifieth the ungodly’</span> (Romans 4:5); <span class="qq">‘It is finished’</span> (John 19:30). <b>Why it matters:</b> this is the exact error Paul pronounced anathema in Galatians 1:8 — a gospel of grace-plus-requirements. It is also Mormonism's pastoral wound: millions of sincere people on a worthiness treadmill that never lets them rest. The good news you carry is that <b>God's love has no worthiness interview</b>.</p>
  <details class="srcdet" style="border-top:0;padding-top:0;margin-top:12px"><summary>Open the cases behind this</summary><div class="corelinks" style="margin-top:12px">${link("grace-after-all-we-can-do")}${link("another-gospel-canon-closure")}${link("no-postmortem-repentance")}${link("word-of-wisdom-dietary-law")}</div></details></div>

  <div class="pathcard"><h3 style="color:var(--gold)">The foundation under all of it: the Bible was not corrupted</h3>
  <p style="font-size:.92rem;line-height:1.75">Mormonism's entire justification for existing is that the Bible was corrupted — <span class="qq">‘plain and precious things taken away’</span> (1 Nephi 13) — requiring a Restoration. But the manuscript evidence closed that door: the <b>Dead Sea Scrolls</b> (c. 250 BC–70 AD) match our Old Testament across a thousand-year gap, and 5,800+ Greek New Testament manuscripts — many centuries older than Joseph Smith — allow the text to be reconstructed to within trivial variants. <b>Why it matters:</b> if the Bible was NOT corrupted, the Restoration answers a problem that never existed — and every place a new scripture contradicts the preserved Bible, it is the new scripture that must be thrown out, not the old one. The same argument, incidentally, applies to any faith that claims the Bible was changed.</p>
  <details class="srcdet" style="border-top:0;padding-top:0;margin-top:12px"><summary>Open the cases behind this</summary><div class="corelinks" style="margin-top:12px">${link("plain-precious-things-removed")}${link("another-gospel-canon-closure")}</div></details></div>`;
  $("#main").querySelectorAll(".corelink,[data-open]").forEach(b=>{if(b.dataset.open)b.addEventListener("click",()=>openCase(b.dataset.open));});
  const g=$("#main").querySelector("[data-goto]");
  if(g)g.addEventListener("click",()=>{state.view="share";render();});
}

/* ---------- sharing the gospel ---------- */


const DIALOG={"kjv-dependence":[{"w":"them","t":"Of course the Book of Mormon sounds like the King James Bible — the Lord revealed it in the scriptural language Joseph and his readers already knew. FAIR has a whole article on this; it's a translation choice, not a problem."},{"w":"you","t":"That makes sense for style, but here's what puzzles me: 2 Nephi 14:5 copies the KJV's 'defence,' which we now know mistranslates the Hebrew word for 'canopy.' **If Joseph was translating an ancient plate, why would God's translation repeat the 1611 translators' mistakes?**"},{"w":"them","t":"I don't have an answer for every detail, but I've read the Book of Mormon and prayed about it, and the Spirit testified to me that it's true. That witness means more to me than a scholar's quibble."},{"w":"you","t":"I don't doubt your sincerity for a second. But my feelings have bad days; that's why I anchor mine to something outside me, like the empty tomb. **Would you read those Isaiah chapters side by side with me — and we'll both pray for truth as we go?**"}],"deutero-isaiah":[{"w":"them","t":"The multiple-Isaiah theory is just a scholarly assumption that prophets can't see the future. Latter-day Saint scholars have shown the unity case is stronger than people think — and Nephi simply quoted what was on the brass plates."},{"w":"you","t":"Fair — I believe prophets can see the future too. But Isaiah 40–55 isn't only predicting the exile; it comforts people already in Babylon, names Cyrus, and assumes the temple is destroyed — which is why so many scholars date it after 600 BC. **If those chapters were written after Lehi left Jerusalem, how did they get onto the brass plates?**"},{"w":"them","t":"Honestly, I put questions like that on the shelf. I've felt the Spirit too strongly reading Nephi's words to believe they aren't real."},{"w":"you","t":"I love that you take Scripture that seriously. I just want the shelf to hold — and 1 John 4:1 tells us to test claims, not just feel them. **Could we look at Isaiah 44–45 together sometime, no ambush, just the text?**"}],"nt-anachronism":[{"w":"them","t":"People say Moroni 7 sounds like 1 Corinthians 13, but that's what you'd expect — the same Spirit revealed the same truths to Mormon and to Paul. Truth is truth in any century."},{"w":"you","t":"I could accept that for shared ideas — but this is the same English sentences, in the same order, matching the King James wording of 1611. **Wouldn't a fifth-century American prophet independently receiving Paul's truths sound like himself, not like the KJV?**"},{"w":"them","t":"Maybe the Lord gave Joseph the translation in words his readers would recognize. Either way, I've prayed about the Book of Mormon like Moroni 10 says, and I know it's true."},{"w":"you","t":"I'm not trying to take that seriousness from you — I want us both closer to Christ, not a win. But a warm feeling can confirm true and false books alike; the resurrection is checkable in a way a feeling isn't. **Would you read 1 Corinthians 13 and Moroni 7 side by side with me and tell me honestly what you see?**"}],"cultural-anachronism":[{"w":"them","t":"The anachronism argument is outdated — absence of evidence isn't evidence of absence. FAIR points out 'horse' could be a loan-word for an animal like the tapir, the way Spaniards called bison 'cows.'"},{"w":"you","t":"I've read that response and I want to be fair to it. But the book describes horses pulling chariots, steel swords, and wheat harvests across a thousand years — and archaeology in the Americas has recovered none of it, while routinely finding far smaller traces of real cultures. **At what point does 'not found yet' become a verdict rather than a delay?**"},{"w":"them","t":"I can't prove it archaeologically, and I don't need to. Moroni's promise worked for me — I prayed, and the Holy Ghost told me it's true, and I can't deny that."},{"w":"you","t":"I'd never ask you to deny an experience — only to weigh it, since sincere people in many faiths report the same confirmation about contradictory books. When my feelings wobble, the tomb outside Jerusalem is still empty. **Can we keep testing this together, as friends, no matter where it lands?**"}],"doctrinal-conflict":[{"w":"them","t":"There's no conflict between grace and works. 2 Nephi 25:23 says we're saved by grace 'after all we can do' — grace makes up the difference once we've done our best. Faith without works is dead, right?"},{"w":"you","t":"James is in my Bible too, and real faith does work. But Paul puts it in the opposite order: 'by grace you have been saved through faith... not of works' (Ephesians 2:8-9) — works are the fruit of salvation, not the entry fee. **Honestly, have you ever done 'all you can do' — and how would you know you had?**"},{"w":"them","t":"That's between me and the Lord. I'm doing my best, and I have a testimony that this is His church and His plan for me."},{"w":"you","t":"Then hear the best news I know: Jesus told the thief on the cross 'today you shall be with me in paradise' — no checklist, just trust. My performance has bad days; His finished work doesn't. **Would you read Romans 3–5 with me and see whether that rest is offered to you too?**"}],"canon-provenance":[{"w":"them","t":"Yes, some revelations were edited between the Book of Commandments and the Doctrine and Covenants — the Lord let Joseph clarify the wording as understanding grew. Line upon line. Doctrine develops; the gospel doesn't change."},{"w":"you","t":"But some edits insert whole new offices and priesthood language into revelations dated years earlier — the Joseph Smith Papers show it. And in the King Follett discourse Joseph taught God was once a man, while Moroni 8:18 calls God 'unchangeable from all eternity to all eternity.' **When a later prophet contradicts the Book of Mormon itself, which one is true?**"},{"w":"them","t":"The Brethren have answered questions like that better than I can. What I know is what the Spirit has told me: Joseph was a prophet and this is Christ's restored church."},{"w":"you","t":"I'm asking because I take you seriously, not to score points. Isaiah 40:8 says God's word stands forever — a word that keeps getting rewritten is fair to test, and testing isn't faithlessness. **If a revelation can be revised later, what would it even mean for one to be wrong?**"}],"prophecy":[{"w":"them","t":"Prophecies are often conditional — think of Jonah and Nineveh. The Independence temple prophecy in D&C 84 depended on the Saints' faithfulness, and they were driven out of Missouri; the Lord released them in D&C 124:49."},{"w":"you","t":"I've read that answer — but D&C 84 doesn't say 'if.' It says the temple 'shall be reared in this generation,' and that generation is long gone. **Deuteronomy 18:22 says a prophecy that fails wasn't from the Lord — how do we apply that test here without special pleading?**"},{"w":"them","t":"I trust the Lord's timing more than my own reading of one verse. I've felt the Spirit confirm that Joseph was His prophet, and that settles it for me."},{"w":"you","t":"I'd rather have your honest wrestling than a rehearsed answer from either of us. But God gave Deuteronomy 18 precisely so we wouldn't have to rely on feelings to recognize a prophet. **Would you read D&C 84:1-5 slowly with me and tell me what the words themselves say?**"}],"textual-transmission":[{"w":"them","t":"The Book of Mormon explains why we need it — 1 Nephi 13 says plain and precious truths were taken out of the Bible by the great and abominable church. The Restoration puts back what was lost."},{"w":"you","t":"Here's my honest problem: the Dead Sea Scrolls give us Old Testament manuscripts from before Christ, and Isaiah reads essentially the same then as in your Bible now. **If plain and precious parts were stripped out, why can't we find a single early manuscript that still has them?**"},{"w":"them","t":"Maybe the loss happened even earlier, or in how people interpreted it. Either way, the Spirit has testified to me that the Book of Mormon restores the fulness of the gospel."},{"w":"you","t":"I'm grateful you care this much about God's word — most people don't. But Jesus said His words would not pass away, and the manuscripts look like He kept that promise. **Would you look at the Great Isaiah Scroll online with me — it's a text anyone can check?**"}],"archaeology":[{"w":"them","t":"There's actually growing support — an altar was found in Yemen with the letters NHM, right where the Book of Mormon puts Nahom. And FAIR notes we shouldn't expect ruins labeled 'Nephite' — most of Mesoamerica is unexcavated."},{"w":"you","t":"Nahom is in Arabia, though — the Old World leg, where Lehi's family traveled known trade routes. It's the New World where a thousand years of Nephite civilization should sit, and the Smithsonian has said flatly it sees no connection between the Book of Mormon and New World archaeology. **Why does the trail go cold exactly where the plates were supposedly written?**"},{"w":"them","t":"Archaeology changes every decade. My testimony doesn't rest on digs — I prayed about the Book of Mormon and received my own witness from the Holy Ghost."},{"w":"you","t":"I won't pretend archaeology proves my faith either — but it's striking that digging in Israel keeps confirming the Bible's world while digging in the Americas keeps not finding Nephi's. My confidence finally rests on a checkable event: the empty tomb. **What's the strongest outside evidence for the Book of Mormon you know of — and can we examine it together?**"}],"dna":[{"w":"them","t":"The DNA question was answered in the church's own Gospel Topics essay — Lehi's small group would leave almost no genetic trace after mixing into larger native populations. Bottlenecks and drift erase small lineages."},{"w":"you","t":"That's real science if Lehi's party was a drop in an existing ocean of people — I'll grant it. But for 150 years prophets taught Lamanites were the 'principal ancestors' of Native Americans, and in 2006 the church quietly edited the book's introduction to say 'among the ancestors.' **If earlier prophets were wrong about what the book even claims, how do we know today's reading is right?**"},{"w":"them","t":"Prophets aren't infallible on every detail — but the book itself is true. I know that by the power of the Holy Ghost, and no DNA study can take that from me."},{"w":"you","t":"I don't want to take anything from you — I want to be sure what you're holding can hold you. A claim that retreats each time evidence arrives deserves daylight, and our friendship will survive the looking. **Can I ask what evidence, even in principle, could ever count against the book for you?**"}],"demographics":[{"w":"them","t":"Critics say the population numbers grow too fast, but the text itself hints there were other people already in the land — Nephi's group intermarried and absorbed them. Even LDS scholars like John Sorenson argued that for decades."},{"w":"you","t":"Honestly? That's one of the better answers I've heard — if 'others in the land' is right, the math problem mostly goes away, and I'll concede that. But it raises a new one: the record never mentions meeting these vast native populations in a thousand years of detailed history. **Doesn't the fix work only by adding people the book itself never notices?**"},{"w":"them","t":"Maybe the record just wasn't about them — Mormon abridged a thousand years onto a few plates. What I can't explain away is what the Spirit told me when I read it."},{"w":"you","t":"That's fair, and I want to be the kind of friend who says so when your side has a point. I'd just rather we follow the whole trail than stop at the first workable patch. **Since this one's roughly a draw, would you look with me at the one I find hardest to patch — the Book of Abraham papyri?**"}],"provenance":[{"w":"them","t":"Yes, Joseph sometimes used a seer stone in a hat — the church published photos of the stone in 2015, and the Gospel Topics essay explains it. Prophets use the instruments the Lord gives them; it doesn't change the translation."},{"w":"you","t":"I appreciate that you know the essay — most members I ask haven't seen it. But for generations the church's own art showed Joseph studying the plates like a scholar, when by witness accounts the plates often sat covered or weren't even in the room. **If the true story was faith-promoting, why did the institution illustrate a different one for a century?**"},{"w":"them","t":"Artists take license; paintings aren't doctrine. However it happened, the book came forth, and I've received my own witness that it's the word of God."},{"w":"you","t":"I believe you felt something real reading it — I'm not here to mock that. I just think how a book arrived is part of whether to trust it; I accept the same standard for my Bible. **Would you read the church's translation essay out loud with me and talk about what surprises us both?**"}],"translation-test":[{"w":"them","t":"The Book of Abraham critics only have a few papyrus fragments — the full record was probably much longer, or Joseph used the papyri as a catalyst for revelation. The church's essay covers both possibilities."},{"w":"you","t":"It does — so let me use only the church's own words. The essay admits the surviving fragments are a common Egyptian funerary text, the Book of Breathings, dated more than a thousand years after Abraham, with no connection to him. **Doesn't 'catalyst' quietly concede that what Joseph called a translation... wasn't one?**"},{"w":"them","t":"Translation for a prophet can mean revelation, not academics. Joseph never claimed to be an Egyptologist."},{"w":"you","t":"But he published the facsimiles with his own explanations — names, gods, 'the idolatrous god of Pharaoh' — and Egyptologists, including LDS ones, agree those readings are wrong. This is the one case where we can grade his work against the source document. **If the one test we can check came back this way, what should we conclude about the tests we can't?**"},{"w":"them","t":"I hear you, and I won't pretend that one doesn't sit on my shelf. But I've had experiences with the Spirit I cannot deny, and I trust the Lord will sort out the rest."},{"w":"you","t":"Thank you for saying that honestly — that took more courage than any argument. I'm not asking you to deny your experiences, just to let evidence and the Spirit speak together; the God of truth never needs us to look away. **Whatever you decide, we're still friends — can we keep reading these things together, slowly?**"}],"stylometry":[{"w":"them","t":"Actually, BYU wordprint studies found the Book of Mormon contains multiple distinct authorship styles — Nephi and Alma don't write like each other or like Joseph Smith. That's hard to fake."},{"w":"you","t":"I'll be straight with you: other stylometric studies, like Jockers at Stanford, point toward nineteenth-century authors instead, and experts dispute both methods — so I don't think the computers settle this for either of us. **Since the stylometry is a wash, shouldn't we rest the case on evidence we can both actually evaluate?**"},{"w":"them","t":"That's fair. For me it comes down to Moroni's promise anyway — I asked God with a sincere heart, and He answered me by the Spirit."},{"w":"you","t":"I'd rather have this honest conversation than ten debates. I just notice a Muslim friend of mine reports the same burning certainty about the Quran — so the feeling can't be the tiebreaker. **What if we picked one checkable question — the Isaiah chapters or the Abraham papyri — and followed it wherever it goes, together?**"}],"origin-story":[{"w":"them","t":"Small details in early retellings varied — that's normal for oral history. Whether a scribe wrote 'Nephi' or 'Moroni' in one 1842 article doesn't change what happened in Joseph's bedroom in 1823."},{"w":"you","t":"Except it wasn't one stray article — 'Nephi' appeared in Times and Seasons while Joseph was editor, and in his own mother's history, and was corrected later. And in his Bible revision, Joseph added a prophecy to Genesis 50 about a future seer named Joseph, son of Joseph — himself. **If a man edited ancient prophecy to predict himself, how would that look different from what Joseph did?**"},{"w":"them","t":"You're reading it with suspicion; I read it with faith. I've prayed about Joseph Smith, and the Spirit has borne witness to me that he was called of God."},{"w":"you","t":"The suspicion isn't of you — it's the ordinary caution Scripture commands toward anyone claiming to speak for God (1 John 4:1); the Bereans were praised for double-checking Paul himself. **Would you look at the Nephi-to-Moroni change with me in the Joseph Smith Papers — the church's own publication?**"}],"first-vision":[{"w":"them","t":"Multiple accounts of the First Vision are a strength, not a problem — Paul's conversion is told three ways in Acts with differences too. Joseph emphasized different details for different audiences; the Gospel Topics essay walks through all four."},{"w":"you","t":"Paul's accounts differ in minor detail, though — not in who showed up. Joseph's earliest account, written in 1832 in his own hand and posted on josephsmithpapers.org, mentions one personage, 'the Lord,' centers on forgiveness of his sins, and says he'd already concluded no church was true before praying. **How does one divine visitor in 1832 become the Father and the Son by 1838?**"},{"w":"them","t":"He may have focused on the Savior's forgiveness early and given the fuller picture later. Memory unfolds like that."},{"w":"you","t":"Maybe — though memory of the most staggering event of your life doesn't usually add a second divine person sixteen years on, right when the church needed a founding narrative. **Isn't the 1838 version the only one the missionaries teach — and doesn't that selection itself tell us something?**"},{"w":"them","t":"I can't argue the documents with you, but I don't need to. I've been on my knees like Joseph was, and the same Spirit that answered him answered me."},{"w":"you","t":"That's the most honest thing either of us has said today, and I honor it. I've just learned my own heart can burn over things that turn out false, which is why I come back to a claim nailed down in history — Christ risen, datable, checkable. **Would you read the 1832 account with me, straight from the church's website, and we'll pray before and after?**"}],"gold-plates":[{"w":"them","t":"The plates had eleven witnesses whose testimony is printed in every copy of the Book of Mormon, and none of them ever denied it — even the ones who left the church and had every reason to."},{"w":"you","t":"That's the strongest card in the deck, and I take it seriously. But Martin Harris said he saw the plates with 'the eye of faith' and 'spiritual eyes,' and no neutral party ever examined them before Moroni took them back. **What other extraordinary claim would we accept where the physical evidence was shown only to insiders and then removed?**"},{"w":"them","t":"The Lord doesn't put sacred things in museums — faith comes first, then the witness. I've received mine by the Holy Ghost, and it's as real to me as anything I've touched."},{"w":"you","t":"Notice that's the opposite of what happened with Jesus — He ate fish with doubters and told Thomas to touch His wounds; God isn't afraid of inspection. My faith rests on witnesses whose claim could have been ended by producing one body. **Can we compare the two sets of witnesses side by side sometime — honestly, in both directions?**"}],"exit-costs":[{"w":"them","t":"I'll be honest with you — even when something bothers me, I can't let myself go down that road. My marriage was sealed in the temple, my job came through a member, my whole family is in. If I left, I'd lose everything."},{"w":"you","t":"Thank you for trusting me with that — I hear the weight of it, and I won't pretend it's small. **Can I ask what scares you most — the losing, or not knowing who you'd be after?**"},{"w":"them","t":"Both, honestly. People who leave get called anti-Mormon, and I've watched families go cold toward them. It's easier to keep my questions on the shelf and keep my life."},{"w":"you","t":"That's not weakness — that's a person counting a real cost, and Jesus told us to count costs. Just hear one promise He made: He will be family to those who lose family for His sake (Mark 10:29-30). **What would you need from me for it to feel safe to even look?**"},{"w":"them","t":"Mostly this — someone who doesn't push. Everyone else either bears their testimony at me or attacks the church at me."},{"w":"you","t":"Then here's my only commitment: whatever you conclude, whenever, you will not lose me — this friendship is not a missionary tactic. **When a question comes off the shelf and you want company, will you bring it to me first?**"}],"institutional":[{"w":"them","t":"Every organization run by humans has messy moments. The September Six was local discipline, the SEC matter was a filing issue the church settled and fixed, and the Gospel Topics essays prove the church isn't hiding anything — it published the hard stuff itself."},{"w":"you","t":"I'm glad the essays exist — truly, I cite them constantly. But notice the pattern: scholars excommunicated in 1993 for publishing what the essays now admit, a $5 million SEC settlement over thirteen shell companies created to obscure the fund's size, and essays posted quietly, unsigned, rarely taught in Sunday School. **Does that look like stewards of truth, or an institution managing it?**"},{"w":"them","t":"The church is led by imperfect men, but the Lord is at the helm. I sustain the Brethren, and the Spirit has confirmed to me that this is His church."},{"w":"you","t":"I'm not asking you to trade faith for cynicism — I'm asking whether 'the Lord's one true church' should be graded on the same curve as every human institution. Jesus said 'by their fruits.' **If a church you didn't love did these exact things, what would you honestly conclude?**"}],"practice-worship":[{"w":"them","t":"The Word of Wisdom is a law of health with a promise — and honestly, science keeps catching up to it. Living it is a small sacrifice that shows the Lord I'll obey Him in small things."},{"w":"you","t":"I admire the discipline, truly. But your temple recommend — your access to your own family's sealing — hangs partly on abstaining from coffee and tea, while Paul says 'let no one pass judgment on you in questions of food and drink' (Colossians 2:16). **When did a health guideline become a gate between you and God's presence?**"},{"w":"them","t":"Obedience is the first law of heaven. It's not about the coffee — it's about covenant-keeping, and I've felt the Spirit confirm the blessings of living it."},{"w":"you","t":"I hear that — and I'd gently note that Jesus's sharpest words were for gatekeepers who added rules to God's house. In Christ the veil is already torn; no beverage stands between you and Him. **Can I show you Hebrews 10:19-22 and let you tell me what access it says you already have?**"}],"practice-temple":[{"w":"them","t":"The endowment is sacred, not secret — I can't discuss details, but the covenants there bind my family forever. As for the Masonic thing, similar symbols don't mean borrowed ceremony; fragments of truth show up everywhere."},{"w":"you","t":"I won't press you to break anything sacred, I promise. But it's public record that Joseph became a Mason in March 1842 and introduced the endowment seven weeks later, with matching tokens, signs, and penalties — and the church itself removed the penalties and the five points of fellowship in 1990. **If the ceremony was restored from Solomon's temple, why did it arrive right after Masonry and then change by committee?**"},{"w":"them","t":"Revelation is ongoing — the Lord adjusts ordinances for His people's needs. What I know is what I've felt in the temple: a peace I can't describe."},{"w":"you","t":"I believe you felt peace, and I won't cheapen it. I'd only say the Bible's temple finished its work with a torn veil — 'it is finished' — so peace with God now comes through the great High Priest, not ceremonies that keep needing revision. **Would you read Hebrews 9 with me and compare it with what you're free to share?**"}],"exaltation":[{"w":"them","t":"'Becoming like God' isn't blasphemy — it's the whole point of being His children. Even C.S. Lewis said God will make us dazzling, radiant creatures — 'gods and goddesses.' The early church fathers taught deification too."},{"w":"you","t":"The church's 'Becoming Like God' essay does quote Lewis — but Lewis, like the fathers, meant glorified creatures, never beings of the same kind as the uncreated God. Lorenzo Snow's couplet claims more: 'as God now is, man may be.' **How does that fit God's own words in Isaiah 43:10 — 'before me there was no God formed, neither shall there be after me'?**"},{"w":"them","t":"There's a lot about eternity we don't understand, and I'm content with that. What I know, by the Spirit, is that I'm a child of Heavenly Parents with a divine destiny."},{"w":"you","t":"You are made for glory — we agree there, and I'd never take that hope away. I just think the hope is grander the Bible's way: not becoming what God is, but forever enjoying the God there's only one of. **Would you read Isaiah 43–46 with me and count how many times He says 'there is no other'?**"}],"christology":[{"w":"them","t":"We worship the same Jesus — the church even issued a statement in 2007 explaining that yes, Jesus and Lucifer were both spirit sons of Heavenly Father, but that hardly makes them equals. Jesus is the Firstborn and our Savior."},{"w":"you","t":"I'm glad you know that statement — many members deny the teaching outright. But John 1:3 says of Jesus that 'all things were made through him, and without him was not any thing made that was made' — which puts Lucifer among the things Jesus made, not among His brothers. **Can the Jesus who created all things and the Jesus who is Lucifer's spirit brother really be the same Jesus?**"},{"w":"them","t":"Philosophy aside, I know my Savior lives. I've felt His love and His atonement change me, and no doctrinal debate can touch that."},{"w":"you","t":"I don't doubt you love the Jesus you know — that's exactly why I raise it, because Jesus said eternal life is knowing Him as He truly is (John 17:3), and Paul warned kindly about 'another Jesus' preached sincerely (2 Corinthians 11:4). **Would you walk through John 1 with me and let it tell us together who He is?**"}],"nature-of-god":[{"w":"them","t":"'As man now is, God once was; as God now is, man may be.' That's what the Restoration adds — God isn't a distant essence, He's our literal Father, an exalted man who knows our path because He walked it."},{"w":"you","t":"I understand why that feels intimate. But Psalm 90:2 says 'from everlasting to everlasting, thou art God' — no career before deity. And Brigham Young taught from the pulpit that Adam was our God, which President Kimball later denounced as false doctrine. **If a prophet can be that wrong about who God is, what makes the current teaching safe?**"},{"w":"them","t":"Prophets sometimes speak as men; doctrine gets clarified over time. What I know is that I have a Heavenly Father who hears my prayers — the Spirit has told me that much."},{"w":"you","t":"You do have a Father who hears you — that's the Bible's claim too, and He's better than a graduate of our situation: the everlasting God who stooped down to us in Christ. My hope isn't in a God who progressed but in One who condescended. **Could we read Psalm 90 and Isaiah 40 together and just sit with how big He is?**"}],"polygamy-history":[{"w":"them","t":"Plural marriage is hard for everyone — but the church put out an honest essay on it. Joseph was commanded, like Abraham, and resisted until an angel with a drawn sword required it. Many sealings were dynastic, for eternity only."},{"w":"you","t":"The essay does say those things — and it also confirms Joseph married about 30 to 40 women, one 'several months before her 15th birthday,' and some already married to living men. **What doctrine of God requires a married 37-year-old to be sealed to a 14-year-old, on pain of a sword?**"},{"w":"them","t":"Helen Mar Kimball's sealing may not have involved everything people assume. And we can't judge the 1840s by today's norms."},{"w":"you","t":"Gently — the harder problem isn't the norms, it's the honesty: Joseph publicly denied the practice in 1844 while sealed to dozens — 'What a thing it is for a man to be accused of... having seven wives, when I can only find one.' **Can a true prophet institutionalize secrecy and public denial about God's supposed commandment?**"},{"w":"them","t":"I don't understand everything Joseph did — nobody does. But I've prayed about the Book of Mormon and the Restoration, and God told me it's true. I have to stand on that."},{"w":"you","t":"And I'll stand next to you as your friend no matter what — hear that first. I'd only offer this: a testimony can't make a documented pattern untrue, and the God of truth never asks us to protect Him from the archives. **Would you read the church's own essay with me, one section a week — no pressure, no gloating, ever?**"}],"violence-history":[{"w":"them","t":"Mountain Meadows was a terrible atrocity committed by local members amid wartime hysteria — and the church has fully owned it. It even published the definitive history through Oxford. Brigham Young didn't order it."},{"w":"you","t":"I've read parts of that book, and the church's historians deserve real credit for writing it — this isn't a cover-up story anymore. What stays with me is that devout, ordinary Saints, primed by preaching about enemies and vengeance, killed about 120 unarmed men, women, and children under a flag of truce. **What does it tell us when religious obedience made the massacre easier rather than harder?**"},{"w":"them","t":"People can twist any faith into violence — Christians had crusades. The gospel I live teaches me to love, and the Spirit confirms the church is true despite its members' sins."},{"w":"you","t":"You're right, and I won't pretend Christian history is clean — that's a fair hit, and I take it. Maybe the shared lesson is that any system where obedience to leaders outruns conscience is dangerous, which is why I test everything against Christ Himself. **Could we read the last chapter of the Oxford book together and talk about what safeguards each of us really has?**"}],"modern-policy":[{"w":"them","t":"The 2015 policy on children of gay couples was hard, but President Nelson explained it came by revelation, to protect families from conflict. And its reversal in 2019 came by revelation too — the Lord leads His church line upon line."},{"w":"you","t":"That's the part I need help with — not the policy, the mechanism. President Nelson called it 'the mind of the Lord and the will of the Lord' in January 2016, and the same Lord reversed it 39 months later. **If a revelation can be announced, defended, and undone that fast, how would anyone distinguish it from leadership deciding?**"},{"w":"them","t":"That's exactly why we have living prophets — so the Lord can adjust guidance for our day. I sustain them, and the Spirit has confirmed to me that they're His servants."},{"w":"you","t":"I honor your loyalty, I really do. But Scripture offers a kinder gift than perpetual adjustment: 'the word of the Lord endures forever,' and a Shepherd whose voice doesn't reverse itself. **Would you ask with me what test — other than sustaining — Jesus gave us for recognizing His voice?**"}]};
const PROOFS=[{"v":"1 Corinthians 15:29","they":"'Why are they then baptized for the dead?' — Paul endorses baptism for the dead; the early church practiced it and we restored it.","you":"Read the pronoun: Paul says 'what shall THEY do' — not 'we.' He's citing a practice of some group (possibly heretical, as many at Corinth were) to argue for resurrection, without endorsing it — the way he cites pagan poets. One ambiguous verse against the entire Bible's teaching that judgment follows death (Hebrews 9:27) can't carry a temple system. Notably, the Book of Mormon itself teaches NO post-death second chance (Alma 34:32–35).","refs":"Hebrews 9:27 · Alma 34:32-35 · Luke 16:26"},{"v":"Ezekiel 37:15-17","they":"The two sticks — the stick of Judah (the Bible) and the stick of Joseph (the Book of Mormon) — joined in God's hand!","you":"Keep reading to verse 22: God himself explains the sign — 'I will make them ONE NATION in the land upon the mountains of Israel.' The sticks are the divided kingdoms of Judah and Israel being reunited — the text interprets itself, and it's about nations, not books. A 'stick' (ets, wood) was a writing tablet at most; Nephite plates were metal.","refs":"Ezekiel 37:21-22"},{"v":"James 1:5","they":"'If any of you lack wisdom, let him ask of God' — that's why Joseph prayed, and why you should pray about the Book of Mormon (Moroni 10:4).","you":"James is writing to believers about wisdom in trials (v.2) — not about testing whether books are scripture. God's given method for testing claims is Scripture itself: the Bereans were commended for checking Paul AGAINST the scriptures (Acts 17:11), and Galatians 1:8 says even an angel preaching another gospel is accursed — praying for a feeling about a message an angel delivered is precisely backwards. Feelings confirm contradictory books to sincere people of every faith; 'the heart is deceitful' (Jeremiah 17:9).","refs":"Acts 17:11 · Galatians 1:8 · Jeremiah 17:9 · Proverbs 14:12"},{"v":"John 10:16","they":"'Other sheep I have, which are not of this fold' — Jesus meant the Nephites in America, whom he visited after his resurrection (3 Nephi 15).","you":"Jesus tells you who they are in the same breath: sheep 'not of this fold' who become 'one fold' — the Gentiles, exactly as the rest of the New Testament unfolds it (Ephesians 2:11–18: the two made one). The apostles were sent to those other sheep (Matthew 28:19). Nothing in the text hints at another hemisphere — that reading needs the Book of Mormon first, which is the question at issue.","refs":"Ephesians 2:11-18 · Acts 10:34-35"},{"v":"Amos 3:7","they":"'Surely the Lord GOD will do nothing, but he revealeth his secret unto his servants the prophets' — so there must be living prophets today.","you":"Amen to the verse — and Hebrews 1:1–2 tells us how it culminated: 'God, who spake in time past unto the fathers by the prophets, hath in these last days spoken unto us by his SON.' The question was never whether God speaks through prophets; it's whether Joseph Smith passed the prophet test God gave (Deuteronomy 18:21–22). The Independence temple prophecy is on this site — check it against that test.","refs":"Hebrews 1:1-2 · Deuteronomy 18:21-22"},{"v":"1 Corinthians 15:40-41","they":"Celestial and terrestrial bodies, differing in glory like sun, moon, and stars — the three degrees of glory!","you":"Paul is contrasting resurrection bodies with mortal bodies — 'so also is the resurrection of the dead' (v.42): sown corruptible, raised incorruptible. Two kinds of body, not three heavens for sorted people; there's no 'telestial' in any Greek manuscript — that word had to be invented. And the Book of Mormon itself knows only two destinations (Alma 41:4-6; 1 Nephi 15:35).","refs":"1 Corinthians 15:42-44 · Alma 41:4-6"}];

function proofCombine(v,refs){
  const m=String(v).match(/^(.+?)\s+(\d+):(\d+)(?:\s*[-\u2013]\s*(\d+))?$/); if(!m)return null;
  const book=m[1].trim(), ch=m[2]; let lo=+m[3], hi=+(m[4]||m[3]), found=false;
  String(refs||"").replace(/<[^>]+>/g," ").split(/[\u00b7;,]/).forEach(part=>{
    const r=part.trim().match(/^(.+?)\s+(\d+):(\d+)(?:\s*[-\u2013]\s*(\d+))?$/); if(!r)return;
    if(r[1].trim().toLowerCase()!==book.toLowerCase()||r[2]!==ch)return;
    lo=Math.min(lo,+r[3]); hi=Math.max(hi,+(r[4]||r[3])); found=true;});
  return found?book+" "+ch+":"+lo+"-"+hi:null;
}
function proofVerse(ref,refs){
  const cb=refs?proofCombine(ref,refs):null;
  const v=(cb&&VERSES[cb])?VERSES[cb]:VERSES[ref]; if(!v||!v.verses)return "";
  const anyHl=v.verses.some(x=>x.hl), hasCtx=anyHl&&v.verses.some(x=>!x.hl);
  const body=v.verses.map(x=>{
    const lit=(x.hl||!anyHl);
    const txt=(x.hl&&hasCtx)?"<em>"+esc(x.t)+"</em>":esc(x.t);
    return '<span class="vs'+(lit?" hl":"")+'"><span class="vnum">'+x.v+'</span>'+txt+' </span>';
  }).join("");
  const head=hasCtx?esc(v.ref)+", with the verses either side":esc(v.ref);
  return '<div class="versebox proofbox"><div class="vr"><span>'+head+'</span></div><div class="vtext">'+body+'</div></div>';
}
function renderProofs(){
  $("#main").innerHTML=`<div class="viewhead"><h2>When they quote YOUR Bible</h2>
  <p>The verses a Latter-day Saint friend will bring to you, and the two-minute responses — context first, then the question that reopens the conversation. Read the passage together whenever you can; the text itself does most of the work.</p></div>`+
  PROOFS.map(p=>`<div class="ptcard"><h3 class="ptv">${p.v}</h3>
    ${proofVerse(p.v,p.refs)}
    <div class="who them">They may say</div><p class="pt">${p.they}</p>
    <div class="who you">You respond</div><p class="pt">${rich(p.you)}</p>
    <div class="refs">Read together: ${p.refs}</div></div>`).join("");
}

const THEYSAY=[
{"say":"I prayed about it, and the Holy Ghost told me it's true.","quick":"I believe you felt something real — but Muslims, Catholics, and Strangites report the **same confirming feeling** about contradictory books, so the feeling can't be the tiebreaker. God's own test runs the other way: **doctrine tests experience** (Deuteronomy 13:1–3; 1 John 4:1), never the reverse.","id":"burning-in-bosom-epistemology"},
{"say":"The Bible is missing plain and precious truths — that's why we need the Restoration.","quick":"The Dead Sea Scrolls give us the Old Testament from **before Christ**, and Isaiah reads the same then as now. If plain and precious parts were stripped out, why has no early manuscript ever been found that still has them?","id":"plain-precious-things-removed"},
{"say":"We believe in the same Jesus you do.","quick":"President Hinckley himself said the opposite: 'The traditional Christ of whom they speak is not the Christ of whom I speak' (1998). The LDS Jesus is Lucifer's spirit brother and a created being — John 1:3 says **all** things were made through Him.","id":"different-jesus-hinckley-1998"},
{"say":"How could an uneducated farm boy have written the Book of Mormon?","quick":"The book quotes the 1769 KJV verbatim — **including its translation errors** — and tracks 19th-century sources like The Late War. The question isn't whether a farm boy could write scripture; it's why God's translation copies a printed English Bible's mistakes.","id":"source-parallels-voth-late-war"},
{"say":"That's anti-Mormon material. Where did you hear that?","quick":"Almost everything on this site cites the church's **own sources** — the Gospel Topics essays, the Joseph Smith Papers, the Journal of Discourses. Ask them: have you read the church's own essay on this topic?","id":"ces-letter-gospel-topics-visibility"},
{"say":"The witnesses never denied what they saw — even after leaving the church.","quick":"Martin Harris said he saw the plates with *'the eye of faith'* and *'spiritual eyes'* — and most witnesses later followed **other** prophets and seers, including James Strang and his equally-witnessed plates. Consistency isn't the issue; the nature of the 'seeing' is.","id":"witnesses-character-and-vision"},
{"say":"Prophets are imperfect men. That doesn't make them false.","quick":"Sinning is human — **teaching false doctrine as God's word** is what Deuteronomy 18 says a true prophet cannot do. D&C 135:3 claims Joseph did more for salvation than anyone but Jesus; the question is whether his testable claims passed the test.","id":"prophetic-fallibility-unfalsifiable"},
{"say":"There was a Great Apostasy — the church had to be restored.","quick":"Jesus promised the gates of hell would **not** prevail against His church (Matthew 16:18), and Paul cursed even an angel who brings 'another gospel' (Galatians 1:8). A total apostasy makes Jesus's promise fail — that's a high price for the Restoration narrative.","id":"another-gospel-canon-closure"},
{"say":"Don't you want to be with your family forever?","quick":"I do — and Jesus offers that without a recommend card: everyone in Christ is family forever, no temple gate between a mother and her child's wedding. Ask gently: **who was excluded from yours?**","id":"temple-wedding-family-exclusion"},
{"say":"Baptism for the dead is in the Bible — 1 Corinthians 15:29.","quick":"Paul says 'what shall **they** do' — citing someone else's practice, not commanding ours — and the Book of Mormon itself teaches **no** second chance after death (Alma 34:32–35). One ambiguous verse can't carry a temple system that the rest of Scripture contradicts (Hebrews 9:27).","id":"no-postmortem-repentance"},
{"say":"God has a body of flesh and bone — we're His literal children.","quick":"Jesus said God is **spirit** (John 4:24) and 'a spirit hath not flesh and bones' (Luke 24:39). The exalted-man doctrine came from the 1844 King Follett discourse — and it contradicts the Book of Mormon itself (Moroni 8:18).","id":"god-exalted-man-flesh-and-bone"},
{"say":"As man now is, God once was; as God now is, man may be.","quick":"Psalm 90:2 — 'from everlasting to everlasting, thou art God.' No career before deity. And the Book of Mormon agrees: God is 'unchangeable from all eternity to all eternity' — Lorenzo Snow's couplet contradicts their own keystone scripture.","id":"unchangeable-god-vs-king-follett"},
{"say":"Polygamy was commanded by God, like with Abraham.","quick":"The church's own essay concedes Joseph married about 30–40 women — one at 14, some with living husbands — under threat from *'an angel with a drawn sword.'* Galatians 1:8 covers exactly this: even an angel preaching another gospel is accursed.","id":"polygamy-coercion-angel-sword"},
{"say":"DNA can't disprove the Book of Mormon — small groups vanish into larger populations.","quick":"That defense works only by abandoning what prophets taught for 150 years: that Lamanites are the **principal** ancestors of Native Americans. The church quietly edited the book's introduction in 2006 — the claim retreats every time evidence arrives.","id":"dna-native-american-origins"},
{"say":"Nahom — the NHM altars in Yemen prove the Book of Mormon.","quick":"Grant it fully: a three-consonant tribal name on the Old-World leg, where Lehi followed known trade routes. Then ask why the **New** World — where a thousand years of Nephite civilization unfolded — has produced nothing at all.","id":"nahom-nhm-altars"},
{"say":"The papyri were just a catalyst — the Book of Abraham came by revelation.","quick":"Joseph published the facsimiles with his own translations of specific figures — and the readable captions name Osiris, Isis, and Maat, not Abraham and Pharaoh. 'Catalyst' quietly concedes that what he called a translation wasn't one — in the **one case we can check**.","id":"book-of-abraham-papyri"},
{"say":"Just read the Book of Mormon and ask God with a sincere heart (Moroni 10:4).","quick":"James 1:5 is about wisdom in trials, not testing scripture — the Bereans were praised for checking Paul **against the scriptures** (Acts 17:11). Offer a trade: you'll read Moroni 10 if they'll read Isaiah 43–46 with you.","id":"burning-in-bosom-epistemology"},

{"say":"Joseph Smith sealed his testimony with his blood — he died a martyr.","quick":"He died in a gunfight, firing a smuggled pistol, after ordering a printing press destroyed for exposing his secret polygamy. That's a tragedy — but it's not Stephen's martyrdom, and dying doesn't make claims true.","id":"nauvoo-expositor-carthage"},

{"say":"The Book of Mormon has never changed — unlike the Bible's thousands of variants.","quick":"The 1837 edition changed 'the Son of' in four verses about Jesus's deity, 'white and delightsome' became 'pure and delightsome,' and thousands of other edits are documented in the church's own critical text project. The claim is simply false.","id":"1837-son-of-edits"},
{"say":"Why do you persecute us? We're Christians too.","quick":"This isn't persecution — it's the conversation Mormonism itself started by declaring all other churches' creeds an **abomination** (JS–History 1:19). The question was never sincerity; it's whether the LDS Godhead is the God of the Bible.","id":"trinity-vs-godhead"}
