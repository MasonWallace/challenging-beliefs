<title>Challenging Beliefs — Mormonism, Examined Against the Bible</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --bg:#0f1116; --side:#0b0d11; --panel:#161a21; --panel2:#12151b; --line:#232833; --line2:#2b313d;
    --ink:#e7e9ec; --muted:#98a0ac; --dim:#565e6b; --gold:#82b1d8; --gold-ink:#0e1116;
    --red:#e0736a; --red-bg:#38221f; --red-cell:#5e2b27; --red-cell-hi:#8a3a32;
    --amber:#cf9a45; --amber-bg:#332a18; --amber-cell:#54431f; --amber-cell-hi:#7d6224;
    --green:#7fb08d; --green-bg:#1d2c26; --green-cell:#27443a;
    --purp:#b394e0; --purp-bg:#2c2440;
    --serif:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif;
    --sans:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  }
  :root[data-theme="light"]{
    --bg:#f3f4f6; --side:#e9ebee; --panel:#ffffff; --panel2:#f7f8fa; --line:#dfe2e7; --line2:#cfd4db;
    --ink:#1b1e23; --muted:#5c6470; --dim:#9aa1ab; --gold:#2f6b9e; --gold-ink:#ffffff;
    --red:#b03a31; --red-bg:#f6e4e2; --red-cell:#e7b6b1; --red-cell-hi:#cc766d;
    --amber:#8a5f0e; --amber-bg:#f3ecd9; --amber-cell:#e4d1a2; --amber-cell-hi:#c6a75e;
    --green:#3e7455; --green-bg:#e3ede6; --green-cell:#b7d1bf;
    --purp:#6b4fa1; --purp-bg:#ece5f6;
  }
  *{box-sizing:border-box}
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6}
  a{color:var(--gold)}
  button{font-family:inherit}
  mark{background:color-mix(in srgb,var(--amber) 30%,transparent);color:inherit;border-radius:2px;padding:0 2px}
  kbd{font-family:var(--mono);font-size:.72rem;background:var(--panel);border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;padding:1px 6px;color:var(--muted)}

  .app{display:grid;grid-template-columns:216px minmax(0,1fr) 280px;min-height:100vh}
  @media (max-width:1020px){.app{grid-template-columns:216px minmax(0,1fr)}.preview{display:none}}
  @media (max-width:720px){.app{grid-template-columns:1fr}.side{position:sticky;top:0;z-index:40;height:auto;border-right:0;border-bottom:1px solid var(--line)}
    .side .nav{display:flex;flex-wrap:wrap;gap:2px;padding:0 10px 10px}.side .nav h5{display:none}.side .sideprog{display:none}}

  /* sidebar */
  .side{background:var(--side);border-right:1px solid var(--line);padding:18px 0;position:sticky;top:0;height:100vh;overflow-y:auto}
  @media (max-width:720px){.side{height:auto;overflow:visible}}
  .logo{font-family:var(--serif);font-size:1rem;letter-spacing:.1em;padding:0 18px 14px;color:var(--ink)}
  .logo b{color:var(--gold)}
  .sidesearch{padding:0 14px 12px}
  .sidesearch input{width:100%;font-family:inherit;font-size:.82rem;padding:7px 12px;border-radius:8px;border:1px solid var(--line2);background:var(--panel);color:var(--ink)}
  .sidesearch input:focus{outline:2px solid var(--gold);outline-offset:1px}
  .info{display:inline-grid;place-items:center;width:14px;height:14px;border:1px solid currentColor;border-radius:50%;font-size:.58rem;font-style:normal;font-weight:700;opacity:.75;cursor:help;position:relative;flex:none}
  .info:hover,.info:focus{opacity:1}
  .info .tip{display:none;position:absolute;left:50%;transform:translateX(-50%);top:160%;width:250px;background:var(--side);color:var(--ink);border:1px solid var(--line2);font-family:var(--sans);font-size:.76rem;line-height:1.5;padding:9px 12px;border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.35);z-index:30;text-transform:none;letter-spacing:0;font-weight:400;text-align:left}
  .info:hover .tip,.info:focus .tip{display:block}
  .badge,.tag{display:inline-flex;align-items:center;gap:5px}
  .nav a{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 18px;font-size:.86rem;color:var(--muted);text-decoration:none;cursor:pointer;border-left:2px solid transparent}
  .nav a:hover{background:var(--panel2);color:var(--ink)}
  .nav a.on{background:var(--panel);color:var(--ink);border-left-color:var(--gold)}
  .nav .cnt{font-family:var(--mono);font-size:.68rem;color:var(--dim)}
  .nav h5{font-size:.64rem;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin:18px 18px 6px;font-weight:600}
  .sideprog{margin:22px 18px 8px;font-size:.72rem;color:var(--muted)}
  .pbar{height:4px;background:var(--line);border-radius:2px;margin-top:6px;overflow:hidden}
  .pbar i{display:block;height:100%;background:var(--gold);transition:width .4s ease}

  /* main */
  .main{padding:18px 26px 80px;min-width:0}
  .cmd{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line2);border-radius:8px;padding:4px 8px 4px 14px;margin-bottom:18px}
  .cmd input{flex:1;background:none;border:0;color:var(--ink);font-family:inherit;font-size:.9rem;padding:7px 0;outline:none}
  .cmd input::placeholder{color:var(--dim)}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:20px}
  .tile{background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:12px 14px;cursor:pointer;text-align:left;color:var(--ink)}
  .tile:hover{border-color:var(--gold)}
  .tile.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
  .tile .v{font-family:var(--serif);font-size:1.7rem;font-variant-numeric:tabular-nums;line-height:1.1}
  .tile .l{font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:2px}
  .tile.t-ad .v{color:var(--purp)}.tile.t-un .v{color:var(--red)}.tile.t-co .v{color:var(--amber)}.tile.t-an .v{color:var(--green)}
  h4.bt{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;font-weight:600}
  .vwall{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:10px;align-items:start}
  @media (max-width:1240px){.vwall{grid-template-columns:1fr 1fr}}
  @media (max-width:700px){.vwall{grid-template-columns:1fr}}
  .vcol{background:var(--panel2);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .vcol header{padding:14px 16px 12px;border-bottom:2px solid var(--line)}
  .vcol.ad header{border-bottom-color:var(--purp)}
  .vcol.ad .n,.vcol.ad .t{color:var(--purp)}
  .vcol.ad .vt:hover{border-left-color:var(--purp)}
  .vcol.un header{border-bottom-color:var(--red)}
  .vcol.co header{border-bottom-color:var(--amber)}
  .vcol.an header{border-bottom-color:var(--green)}
  .vcol header .n{font-family:var(--serif);font-size:1.9rem;line-height:1;font-variant-numeric:tabular-nums}
  .vcol.un .n{color:var(--red)}.vcol.co .n{color:var(--amber)}.vcol.an .n{color:var(--green)}
  .vcol header .t{font-size:.72rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;margin-left:8px}
  .vcol.un .t{color:var(--red)}.vcol.co .t{color:var(--amber)}.vcol.an .t{color:var(--green)}
  .vcol header .d{font-size:.74rem;color:var(--muted);margin-top:4px}
  .vgroup h6{font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:0;padding:10px 16px 4px;font-weight:600}
  .vt{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:9px 16px 9px 13px;cursor:pointer;color:var(--ink);border-left:3px solid transparent}
  .vt:hover,.vt.sel{background:var(--panel)}
  .vt.sel{border-left-color:var(--gold)}
  .vcol.un .vt:hover{border-left-color:var(--red)}
  .vcol.co .vt:hover{border-left-color:var(--amber)}
  .vcol.an .vt:hover{border-left-color:var(--green)}
  .vt.dimmed{opacity:.25}
  .vt h5{font-family:var(--serif);font-weight:500;font-size:.92rem;line-height:1.35;margin:0}
  .vt .m{font-size:.66rem;color:var(--dim);letter-spacing:.05em;text-transform:uppercase;margin-top:2px;display:flex;gap:8px;align-items:center}
  .vt .m .rd{color:var(--green)}
  .vt .m .star{color:var(--gold)}

  /* list */
  .rows{display:flex;flex-direction:column}
  .rowitem{display:grid;grid-template-columns:12px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:11px 6px;cursor:pointer;color:var(--ink)}
  .rowitem:hover,.rowitem.sel{background:var(--panel2)}
  .rowitem .stripe{width:4px;height:26px;border-radius:2px}
  .rowitem.v-unrefuted .stripe{background:var(--red)}
  .rowitem.v-contested .stripe{background:var(--amber)}
  .rowitem.v-answered .stripe{background:var(--green)}
  .rowitem h5{font-family:var(--serif);font-weight:500;font-size:1rem;margin:0;line-height:1.35}
  .rowitem .sub{font-size:.72rem;color:var(--muted)}
  .rowitem .meta{display:flex;gap:8px;align-items:center;font-size:.66rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;white-space:nowrap}
  .rowitem .meta .rd{color:var(--green)}

  .badge{font-size:.64rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:3px 9px;border-radius:999px;display:inline-block}
  .badge.v-admitted{background:var(--purp-bg);color:var(--purp)}
  .badge.v-unrefuted{background:var(--red-bg);color:var(--red)}
  .badge.v-contested{background:var(--amber-bg);color:var(--amber)}
  .badge.v-answered{background:var(--green-bg);color:var(--green)}
  .tag{font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line2);border-radius:999px;padding:2px 9px;display:inline-block}

  /* case view */
  .backbar{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
  .backbar button.bk{background:var(--panel);border:1px solid var(--line2);color:var(--muted);border-radius:8px;padding:6px 13px;font-size:.8rem;cursor:pointer}
  .backbar button.bk:hover{color:var(--ink);border-color:var(--gold)}
  .pathnext{margin-left:auto;background:var(--gold);color:var(--gold-ink);border:0;border-radius:8px;padding:7px 14px;font-size:.8rem;font-weight:700;cursor:pointer}
  .case h2{font-family:var(--serif);font-weight:500;font-size:1.6rem;line-height:1.25;margin:10px 0 14px;max-width:30ch;text-wrap:balance}
  .case .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
  .dlab{font-size:.7rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:26px 0 10px}
  .dlab.red{color:var(--red)}.dlab.blue{color:var(--gold)}
  .claimrow{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(270px,1fr);gap:28px;align-items:start}
  .claimrow.solo{grid-template-columns:1fr}
  @media (max-width:900px){.claimrow{grid-template-columns:1fr}}
  .claim p{font-size:.97rem;line-height:1.75;max-width:66ch;margin:0 0 12px}
  .claimside{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:16px 18px;position:sticky;top:16px}
  .claimside .passcols{grid-template-columns:1fr;gap:12px}
  .claimside .sidenote{font-size:.76rem;color:var(--dim);margin:-4px 0 12px}
  .defense p.lead{margin:0 0 4px}
  .defense p{line-height:1.7;margin:0 0 10px}
  .pts{margin:8px 0 0;padding:0;list-style:none;counter-reset:pt}
  .pts li{position:relative;padding:10px 0 10px 36px;border-top:1px dashed color-mix(in srgb,var(--green) 25%,var(--line));line-height:1.7}
  .pts li:first-child{border-top:0}
  .pts li::before{counter-increment:pt;content:counter(pt);position:absolute;left:0;top:10px;width:23px;height:23px;border-radius:50%;background:var(--green-bg);color:var(--green);display:grid;place-items:center;font-size:.72rem;font-weight:700}
  .vbox p{margin:0 0 8px;line-height:1.7}
  .vbox p:last-child{margin-bottom:0}
  .ref-lds{color:var(--red);font-weight:600}
  .ref-bib{color:var(--gold);font-weight:600}
  .qq{font-family:var(--serif);font-style:italic;background:color-mix(in srgb,var(--amber) 16%,transparent);border-radius:3px;padding:0 3px}
  .kw{font-weight:700;text-decoration:underline;text-underline-offset:2px}
  .talk{background:color-mix(in srgb,var(--green) 8%,var(--panel));border:1px solid color-mix(in srgb,var(--green) 30%,var(--line));border-radius:8px;padding:16px 18px;font-size:.93rem;max-width:80ch}
  .talk p{margin:0 0 8px;line-height:1.7}
  .talk p:last-child{margin-bottom:0}
  .corelinks{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .corelink{font-size:.78rem;background:var(--panel2);border:1px solid var(--line2);color:var(--gold);border-radius:999px;padding:5px 13px;cursor:pointer;text-align:left}
  .corelink:hover{border-color:var(--gold)}
  .gtab{width:100%;border-collapse:collapse;font-size:.86rem;margin:14px 0 6px}
  .gtab th{text-align:left;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:8px 12px;border-bottom:2px solid var(--line2)}
  .gtab th:nth-child(2){color:var(--red)}
  .gtab th:nth-child(3){color:var(--gold)}
  .gtab td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.55}
  .gtab td:first-child{font-weight:700;white-space:nowrap;color:var(--muted)}
  .dodont{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media (max-width:700px){.dodont{grid-template-columns:1fr}}
  .dodont ul{margin:8px 0 0;padding-left:18px;font-size:.86rem;color:var(--muted)}
  .dodont li{padding:3px 0;line-height:1.55}
  .why{background:color-mix(in srgb,var(--gold) 7%,var(--panel));border:1px solid color-mix(in srgb,var(--gold) 28%,var(--line));border-radius:8px;padding:16px 18px;font-size:.93rem;max-width:80ch}
  .why p{margin:0 0 10px;line-height:1.7}
  .why .wtail{color:var(--muted);font-style:italic;margin-bottom:0;border-top:1px dashed color-mix(in srgb,var(--gold) 30%,var(--line));padding-top:10px}
  .compare2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media (max-width:760px){.compare2{grid-template-columns:1fr}}
  .pane{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
  .pane .ref{font-size:.7rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
  .pane.bom .ref{color:var(--red)}.pane.bible .ref{color:var(--gold)}
  .pane .scripture{font-family:var(--serif);font-size:1rem;line-height:1.65}
  .cnote{font-size:.8rem;color:var(--muted);margin-top:8px;max-width:80ch}
  .passcols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media (max-width:760px){.passcols{grid-template-columns:1fr}}
  .passcols h6{font-size:.68rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin:0 0 8px}
  .passcols .h-bom{color:var(--red)}.passcols .h-bib{color:var(--gold)}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{font-size:.78rem;font-family:var(--serif);border:1px solid var(--line2);background:var(--panel);border-radius:6px;padding:4px 10px;cursor:pointer;color:var(--ink)}
  .chip:hover{border-color:var(--gold)}
  .chip.open{background:var(--amber-bg);border-color:var(--gold)}
  .chip.ext::after{content:" ↗";color:var(--muted);font-family:var(--sans);font-size:.68rem}
  .versebox{grid-column:1/-1;background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:8px;padding:14px 18px;margin-top:4px}
  .versebox .vr{font-size:.7rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-bottom:8px;display:flex;justify-content:space-between}
  .versebox .vr button{background:none;border:0;color:var(--muted);cursor:pointer;font-size:.8rem}
  .versebox .vtext{font-family:var(--serif);font-size:.98rem;line-height:1.7;max-width:72ch}
  .versebox .vnum{font-family:var(--sans);font-size:.62rem;color:var(--muted);vertical-align:super;margin-right:3px}
  .versebox .vwhy{margin-top:10px;font-size:.8rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px;max-width:76ch}
  .versebox .vwhy b{color:var(--gold)}
  .srcdet{margin-top:30px;border-top:1px solid var(--line);padding-top:14px}
  .srcdet summary{font-size:.74rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);cursor:pointer;list-style:none}
  .srcdet summary::before{content:"▸ ";color:var(--gold)}
  .srcdet[open] summary::before{content:"▾ "}
  .srcdet .srcs{margin-top:12px}
  .app.reading{grid-template-columns:216px minmax(0,1fr)}
  .app.reading .preview{display:none}
  body:has(.app.reading) .keysbar{right:0}
  .srcs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
  .srcs li{display:flex;gap:9px;align-items:baseline;font-size:.85rem}
  .sb{flex:none;font-size:.6rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;border-radius:4px;padding:2px 7px;position:relative;top:-1px}
  .sb-scholarly{background:var(--green-bg);color:var(--green)}
  .sb-apologetics{background:var(--amber-bg);color:var(--amber)}
  .sb-primary,.sb-institutional{background:color-mix(in srgb,var(--gold) 16%,transparent);color:var(--gold)}
  .sb-journalism{background:var(--panel);color:var(--muted);border:1px solid var(--line2)}
  .sb-testimony{background:var(--red-bg);color:var(--red)}
  .defense{background:color-mix(in srgb,var(--green) 7%,var(--panel));border:1px solid color-mix(in srgb,var(--green) 30%,var(--line));border-radius:8px;padding:16px 18px;font-size:.92rem;max-width:80ch}
  .defense .dsrc{font-size:.78rem;color:var(--muted);margin-top:10px}
  .vbox{display:flex;gap:12px;align-items:flex-start;border-radius:8px;padding:16px 18px;font-size:.92rem;max-width:80ch}
  .vbox.v-admitted{background:var(--purp-bg)}.vbox.v-unrefuted{background:var(--red-bg)}.vbox.v-contested{background:var(--amber-bg)}.vbox.v-answered{background:var(--green-bg)}
  .vbox b.vb{flex:none;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;padding-top:3px}
  .vbox.v-admitted b.vb{color:var(--purp)}.vbox.v-unrefuted b.vb{color:var(--red)}.vbox.v-contested b.vb{color:var(--amber)}.vbox.v-answered b.vb{color:var(--green)}
  .relrow{display:flex;gap:8px;flex-wrap:wrap}
  .relrow button{font-size:.78rem;background:var(--panel);border:1px solid var(--line2);color:var(--ink);border-radius:999px;padding:5px 13px;cursor:pointer}
  .relrow button:hover{border-color:var(--gold);color:var(--gold)}
  .pinbtn{background:none;border:1px dashed var(--line2);color:var(--muted);border-radius:8px;padding:7px 14px;font-size:.8rem;cursor:pointer}
  .pinbtn:hover{border-color:var(--gold);color:var(--gold)}
  .pinbtn.pinned{border-style:solid;border-color:var(--gold);color:var(--gold)}

  /* glossary tooltip */
  .g{border-bottom:2px dotted var(--gold);cursor:help;position:relative}
  .g .gt{display:none;position:absolute;left:0;top:140%;width:270px;background:var(--side);color:var(--ink);border:1px solid var(--line2);font-family:var(--sans);font-size:.78rem;line-height:1.5;padding:10px 13px;border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.35);z-index:20;font-style:normal;font-weight:400}
  .g:hover .gt,.g:focus .gt{display:block}
  .g .gt b{color:var(--gold)}

  /* preview */
  .preview{background:var(--panel2);border-left:1px solid var(--line);padding:20px 18px;position:sticky;top:0;height:100vh;overflow-y:auto}
  .preview h5.pt{font-family:var(--serif);font-weight:500;font-size:1.05rem;line-height:1.35;margin:10px 0}
  .preview p{font-size:.78rem;color:var(--muted);margin:0 0 12px}
  .preview .go{display:inline-block;font-size:.78rem;color:var(--gold-ink);background:var(--gold);border:0;border-radius:6px;padding:7px 14px;cursor:pointer;font-weight:700}
  .preview h6{font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:20px 0 6px}

function splitSentences(raw){
  const tokens=raw.split(/(?<=[.!?])\s+(?=[A-Z0-9"'(‘“])/);
  const merged=[];
  tokens.forEach(t=>{
    if(merged.length){
      const prev=merged[merged.length-1];
      const m=prev.match(/([A-Za-z&.]+)\.$/);
      const w=m?m[1].replace(/\./g,""):null;
      if(w&&ABBR.includes(w)){merged[merged.length-1]=prev+" "+t;return;}
    }
    merged.push(t);
  });
  return merged;
}

/* ---------- state ---------- */
const store={
  get read(){try{return new Set(JSON.parse(localStorage.getItem("wb_read")||"[]"))}catch(e){return new Set()}},
  markRead(id){const r=this.read;r.add(id);localStorage.setItem("wb_read",JSON.stringify([...r]))},
  get pins(){try{return JSON.parse(localStorage.getItem("wb_pins")||"[]")}catch(e){return[]}},
  set pins(v){localStorage.setItem("wb_pins",JSON.stringify(v))}
};
const state={view:"overview",section:"all",verdict:null,severity:null,q:"",sel:null,caseId:null,pathId:null,act:0};

const $=s=>document.querySelector(s);
const esc=s=>(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function hl(text,phrases){let out=esc(text);(phrases||[]).forEach(p=>{const e=esc(p).replace(/[.*+?^${}()|[\]\\]/g,"\\$&");out=out.replace(new RegExp(e,"gi"),m=>"<mark>"+m+"</mark>");});return out;}
function glossify(escapedText){
  let out=escapedText;
  GLOSSARY.forEach(g=>{
    const e=esc(g.t).replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
    let done=false;
    out=out.replace(new RegExp("\\b("+e+")\\b","i"),(m,w)=>{if(done)return m;done=true;
      return '<span class="g" tabindex="0">'+w+'<span class="gt"><b>'+esc(g.t)+'</b> — '+esc(g.d)+'</span></span>';});
  });
  return out;
}
function findWhy(d,cite){
  const key=cite.replace(/–/g,"-").replace(/\s*\(.*\)\s*/g,"").trim();
  const m=key.match(/^([1-4]?\s?[A-Za-z&; ]+?)\s+(\d+)/);
  const frag=m?(m[1].trim()+" "+m[2]):key;
  const sentences=(d.claim+" "+d.rationale).replace(/–/g,"-").split(/(?<=[.!?])\s+/);
  const hit=sentences.find(s=>s.includes(frag));
  return hit?hit.replace(/-/g,"–"):null;
}

function showLightbox(src,cap){
  const lb=document.createElement("div");lb.className="lightbox";
  lb.innerHTML='<figure style="margin:0;text-align:center"><img src="'+src+'" alt=""><figcaption>'+cap+'</figcaption></figure><button class="lx-close">✕ Close</button>';
  lb.addEventListener("click",()=>lb.remove());
  document.body.appendChild(lb);
}
function extUrl(cite){
  const c=cite.replace(/–/g,"-").replace(/\s*\(.*\)\s*/g,"").trim();
  const BOMB={"1 nephi":"1-ne","2 nephi":"2-ne","jacob":"jacob","enos":"enos","jarom":"jarom","omni":"omni","words of mormon":"w-of-m","mosiah":"mosiah","alma":"alma","helaman":"hel","3 nephi":"3-ne","4 nephi":"4-ne","mormon":"morm","ether":"ether","moroni":"moro"};
  const dcm=c.match(/^D&C\s+(\d+)/i);
  if(dcm)return "https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/"+dcm[1]+"?lang=eng";
  if(/^official declaration\s*2/i.test(c))return "https://www.churchofjesuschrist.org/study/scriptures/dc-testament/od/2?lang=eng";
  const abm=c.match(/^Abraham\s+(\d+)/i);
  if(abm)return "https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/"+abm[1]+"?lang=eng";
  const mm=c.match(/^([1-4]?\s?[A-Za-z ]+?)\s+(\d+)/);
  if(mm){const b=mm[1].trim().toLowerCase();
    if(BOMB[b])return "https://www.churchofjesuschrist.org/study/scriptures/bofm/"+BOMB[b]+"/"+mm[2]+"?lang=eng";
    if(/^jst/i.test(c))return "https://www.churchofjesuschrist.org/study/scriptures/jst?lang=eng";
    return "https://www.biblegateway.com/passage/?search="+encodeURIComponent(c)+"&version=KJV";}
  return "https://www.churchofjesuschrist.org/study/scriptures?lang=eng";
}
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),1800);}

/* ---------- filtered list (ordered) ---------- */
function filtered(){
  const arr=DATA.filter(d=>
    (state.section==="all"||d.section===state.section)&&
    (!state.verdict||d.verdict===state.verdict)&&
    (!state.severity||d.severity===state.severity)&&
    (!state.q||(d.title+" "+d.claim+" "+(d.response||"")).toLowerCase().includes(state.q))
  );
  if(state.section==="peculiar")return arr.sort((a,b)=>PORDER.indexOf(a.id)-PORDER.indexOf(b.id));
  return arr.sort((a,b)=>(b.featured?1:0)-(a.featured?1:0)||SEVRANK[a.severity]-SEVRANK[b.severity]||VRANK[a.verdict]-VRANK[b.verdict]);
}

/* ---------- sidebar ---------- */
function renderNav(){
  const secCount={};DATA.forEach(d=>secCount[d.section]=(secCount[d.section]||0)+1);
  const items=[["overview","Overview",DATA.length],...Object.entries(SECTIONS).filter(([k])=>secCount[k]).map(([k,l])=>["sec:"+k,l,secCount[k]])];
  const views=[["core","The heart of it","3"],["share","Sharing the gospel","✝"],["paths","Guided paths",PATHS.length],["timeline","Timeline","3 acts"],["glossary","Terms explained",GLOSSARY.length]];
  const cur=state.view==="overview"&&state.section!=="all"?"sec:"+state.section:state.view;
  $("#nav").innerHTML=items.map(([k,l,c])=>`<a class="${cur===k?"on":""}" data-k="${k}">${l} <span class="cnt">${c}</span></a>`).join("")
    +`<h5>Views</h5>`+views.map(([k,l,c])=>`<a class="${cur===k?"on":""}" data-k="${k}">${l} <span class="cnt">${c}</span></a>`).join("");
  document.querySelectorAll("#nav a").forEach(a=>a.addEventListener("click",()=>{
    const k=a.dataset.k;
    if(k.startsWith("sec:")){state.view="overview";state.section=k.slice(4);state.caseId=null;}
    else if(k==="overview"){state.view="overview";state.section="all";state.caseId=null;}
    else{state.view=k;state.caseId=null;}
    render();
  }));
  const read=store.read.size;
  $("#sideprog").innerHTML=`${read} of ${DATA.length} cases read<div class="pbar"><i style="width:${Math.round(read/DATA.length*100)}%"></i></div>
    <button id="themebtn" style="margin-top:14px;background:none;border:1px solid var(--line2);color:var(--muted);border-radius:8px;padding:5px 12px;font-size:.72rem;cursor:pointer">◐ ${document.documentElement.dataset.theme==="light"?"Dark":"Light"} mode</button> <button id="tourbtn" style="margin-top:8px;background:none;border:1px solid var(--line2);color:var(--muted);border-radius:8px;padding:5px 12px;font-size:.72rem;cursor:pointer">✦ Replay tour</button>`;
  $("#themebtn").addEventListener("click",()=>{
    const cur=document.documentElement.dataset.theme==="light"?"dark":"light";
    document.documentElement.dataset.theme=cur;
    localStorage.setItem("wb_theme",cur);
    renderNav();
  });
  const tb=$("#tourbtn");if(tb)tb.addEventListener("click",()=>startTour());
}

/* ---------- preview ---------- */
function renderPreview(){
  const el=$("#preview");
  const d=state.sel?byId[state.sel]:null;
  if(!d){el.innerHTML=`<div class="empty">Hover or select a case<br>to preview it here.<br><br><kbd>J</kbd>/<kbd>K</kbd> to move · <kbd>↵</kbd> to open</div>`;return;}
  const rel=(RELATED[d.id]||[]).filter(id=>byId[id]);
  el.innerHTML=`<span class="badge v-${d.verdict}">${VLABEL[d.verdict]}</span>
    <h5 class="pt">${esc(d.title)}</h5>
    <p>${esc(d.claim.split(/(?<=\.)\s/)[0])}</p>
    <button class="go" data-open="${d.id}">Open case →</button>
    <h6>Connected cases</h6>
    ${rel.map(id=>`<button class="rr" data-open="${id}">${esc(byId[id].title)}</button>`).join("")||'<p style="font-size:.75rem">—</p>'}`;
  el.querySelectorAll("[data-open]").forEach(b=>b.addEventListener("click",()=>openCase(b.dataset.open)));
}

/* ---------- overview ---------- */
function renderOverview(){
  const items=filtered();
  const anyF=state.verdict||state.severity||state.q||state.section!=="all";
  const visible=new Set(items.map(d=>d.id));
  const read=store.read;
  const VDESC={admitted:"The church's own publications concede these facts — cite them from their sources alone",unrefuted:"No adequate answer exists — or the best answers concede the point",contested:"A serious rebuttal exists; both sides shown",answered:"The defense holds — included so nothing is cherry-picked"};
  const counts={};DATA.forEach(d=>counts[d.verdict]=(counts[d.verdict]||0)+1);
  const col=v=>{
    const cls=v==="admitted"?"ad":v==="unrefuted"?"un":v==="contested"?"co":"an";
    const src=state.section==="all"?DATA:DATA.filter(d=>d.section===state.section);
    const groups=["high","medium","low"].map(s=>{
      const g=src.filter(d=>d.verdict===v&&d.severity===s).sort((a,b)=>(b.featured?1:0)-(a.featured?1:0));
      if(!g.length)return "";
      return `<div class="vgroup"><h6>${s==="high"?"Most serious":s==="medium"?"Moderate":"Minor"} · ${g.length}</h6>`+
        g.map(d=>`<button class="vt ${state.sel===d.id?"sel":""}${visible.has(d.id)?"":" dimmed"}" data-id="${d.id}">
          <h5>${esc(d.title)}</h5>
          <span class="m">${read.has(d.id)?'<span class="rd">✓ read</span>':""}${d.featured?'<span class="star">★ strongest evidence</span>':""}<span>${SECTIONS[d.section]}</span></span>
        </button>`).join("")+`</div>`;
    }).join("");
    const cnt=src.filter(d=>d.verdict===v).length;
    return `<div class="vcol ${cls}"><header><span class="n">${cnt}</span><span class="t">${VLABEL[v]}</span><div class="d">${VDESC[v]}</div></header>${groups}</div>`;
  };
  if(state.section==="peculiar"){
    const items2=filtered();
    $("#main").innerHTML=`
      <div class="tiles">
        <button class="tile on" data-v=""><div class="v">${DATA.filter(d=>d.section==="peculiar").length}</div><div class="l">Ranked entries</div></button>
        <button class="tile t-un" data-v=""><div class="v" style="font-size:1rem;padding-top:8px">Most jaw-dropping first</div><div class="l">how this list is sorted</div></button>
      </div>
      <h4 class="bt">Strange to outsiders — practices and institutional behavior, ranked by how surprising they are to a non-Mormon. Not core theology; each is documented and steelmanned like everything else.</h4>
      <div class="vcol" style="max-width:760px">${items2.map((d,i)=>`
        <button class="vt ${state.sel===d.id?"sel":""}" data-id="${d.id}">
          <h5><span style="font-family:var(--mono);color:var(--dim);font-size:.8rem;margin-right:8px">${String(i+1).padStart(2,"0")}</span>${esc(d.title)}</h5>
          <span class="m">${read.has(d.id)?'<span class="rd">✓ read</span>':""}<span class="badge v-${d.verdict}">${VLABEL[d.verdict]}</span><span>seriousness: ${SEVLABEL[d.severity]}</span></span>
        </button>`).join("")}</div>
      <p class="methodfoot">Ranking is editorial: how startling the item is to someone outside the tradition, most to least. Verdicts still grade only the factual claim.</p>`;
    document.querySelectorAll(".vt").forEach(c=>{
      c.addEventListener("mouseenter",()=>{state.sel=c.dataset.id;renderPreview();});
      c.addEventListener("click",()=>openCase(c.dataset.id));
    });
    return;
  }
  $("#main").innerHTML=`
    <h4 class="bt">${state.section==="all"?DATA.length+" claims, sorted by where the argument stands · click any title to open its case":SECTIONS[state.section]+" — by verdict"}${anyF?` · <button id="clearf" style="background:none;border:0;color:var(--gold);cursor:pointer;text-decoration:underline;font-size:.72rem;letter-spacing:0;text-transform:none">${items.length} match filters — clear</button>`:""}</h4>
    <div class="vwall">${col("admitted")}${col("unrefuted")}${col("contested")}${col("answered")}</div>
    <p class="methodfoot">Steelman rules: every claim carries the best published defense; weak criticisms are marked answered; sections are judged by different evidence standards (manuscripts · scripture · physical evidence · policy+testimony). Compiled July 2026 from published sources — verify citations at the links before quoting. Verdicts are editorial judgments about the public argument.</p>`;
  document.querySelectorAll(".vt").forEach(c=>{
    c.addEventListener("mouseenter",()=>{state.sel=c.dataset.id;renderPreview();});
    c.addEventListener("click",()=>openCase(c.dataset.id));
  });
  const cf=$("#clearf");if(cf)cf.addEventListener("click",()=>{state.verdict=null;state.severity=null;state.q="";state.section="all";render();});
}

/* ---------- case ---------- */
function openCase(id,fromPath){
  state.caseId=id;state.sel=id;state.view="case";
  if(!fromPath)state.pathId=state.pathId; // keep path context if navigating within
  store.markRead(id);
  render();
  window.scrollTo({top:0});
}
function renderCase(){
  const d=byId[state.caseId];if(!d){state.view="overview";return renderOverview();}
  const list=filtered();const idx=list.findIndex(x=>x.id===d.id);
  const path=state.pathId?PATHS.find(p=>p.id===state.pathId):null;
  let nextInPath=null;
  if(path){const i=path.items.indexOf(d.id);if(i>-1&&i<path.items.length-1)nextInPath=path.items[i+1];}
  const comp=d.comparison?`
    <div class="dlab">Side by side</div>
    <div class="compare2">
      <div class="pane bom"><div class="ref">${esc(d.comparison.left.ref)}</div><div class="scripture">${hl(d.comparison.left.text,d.comparison.hl)}</div></div>
      <div class="pane bible"><div class="ref">${esc(d.comparison.right.ref)}</div><div class="scripture">${hl(d.comparison.right.text,d.comparison.hl)}</div></div>
    </div>${d.comparison.note?`<p class="cnote">${esc(d.comparison.note)}</p>`:""}`:"";
  const chipHtml=(arr)=>arr.map(p=>{
    const v=VERSES[p];
    return `<button class="chip ${v?"":"ext"}" data-cite="${esc(p)}" ${v?"":`data-ext="${extUrl(p)}"`}>${esc(p)}</button>`;
  }).join("");
  const isHigher=p=>/^(D&C|Official Declaration|Abraham|Moses|JST|Introduction|Title Page|Testimony)/i.test(p.trim());
  const bomCore=d.bom.filter(p=>!isHigher(p)),ldsOther=d.bom.filter(isHigher);
  const cimg=IMGMAP[d.id]?`<figure class="cimg"><img src="${IMGMAP[d.id].src}" alt="${esc(IMGMAP[d.id].cap)}" loading="lazy"><button class="cimg-x" title="Expand image" data-full="${IMGMAP[d.id].src.replace("width=520","width=1400")}" data-cap="${esc(IMGMAP[d.id].cap)}">⤢</button><figcaption>${esc(IMGMAP[d.id].cap)}</figcaption></figure>`:"";
  const passages=(d.bom.length||d.bible.length||IMGMAP[d.id])?`
    <aside class="claimside">
      ${cimg}
      <div class="dlab" style="margin-top:0">The verses behind this claim</div>
      <p class="sidenote">Every reference here is cited by this specific claim — click one to read it in place. Remember: Mormons hold their own scriptures above the Bible, so citations from their books carry the most weight with them.</p>
      <div class="passcols">
        ${bomCore.length?`<div><h6 class="h-bom">Book of Mormon</h6><div class="chips" data-side="bom">${chipHtml(bomCore)}</div></div>`:""}
        ${ldsOther.length?`<div><h6 class="h-bom" style="color:var(--amber)">D&C & Pearl of Great Price</h6><div class="chips" data-side="bom">${chipHtml(ldsOther)}</div></div>`:""}
        ${d.bible.length?`<div><h6 class="h-bib">Bible</h6><div class="chips" data-side="bib">${chipHtml(d.bible)}</div></div>`:""}
        <div id="versebox"></div>
      </div>
    </aside>`:"";
  const rel=(RELATED[d.id]||[]).filter(x=>byId[x]);
  $("#main").innerHTML=`
    <div class="backbar">
      <button class="bk" id="back">← ${path?esc(path.name):"All cases"}</button>
      <span style="font-size:.72rem;color:var(--dim)">${idx+1>0?`Case ${idx+1} of ${list.length}`:""} · <kbd>←</kbd>/<kbd>→</kbd> to move</span>
      ${nextInPath?`<button class="pathnext" id="pathnext">Next in path →</button>`:""}
    </div>
    <div class="case">
      <div class="meta"><span class="badge v-${d.verdict}">${VLABEL[d.verdict]} ${info(TIPS.verdict[d.verdict])}</span><span class="tag">${SECTIONS[d.section]}</span><span class="tag">${CATS[d.category]} ${info(CATDESC[d.category])}</span><span class="tag">seriousness: ${SEVLABEL[d.severity]} ${info(TIPS.impact)}</span>${d.featured?`<span class="tag" style="border-color:var(--gold);color:var(--gold)">★ strongest evidence ${info(TIPS.strongest)}</span>`:""}</div>
      <h2>${esc(d.title)}</h2>
      <div class="claimrow${passages?"":" solo"}">
        <div><div class="dlab red" style="margin-top:0">The claim</div><div class="claim">${paras(d.claim)}</div></div>
        ${passages}
      </div>
      ${comp}
      <div class="dlab blue">The best defense, steelmanned</div>
      <div class="defense">${formatDefense(d.response)}${d.responseSource?`<div class="dsrc">Source: ${d.responseSource.url?`<a href="${esc(d.responseSource.url)}" target="_blank" rel="noopener">${esc(d.responseSource.name)}</a>`:esc(d.responseSource.name)}</div>`:""}</div>
      <div class="dlab">The verdict</div>
      <div class="vbox v-${d.verdict}"><b class="vb">${VLABEL[d.verdict]}</b><span>${paras(d.rationale)}</span></div>
      <div class="dlab">Why this matters</div>
      <div class="why">${paras(WHYMAP[d.category]||"")}<p class="wtail">${esc(WHYTAIL[d.verdict])}</p></div>
      ${TALK[d.category]?`<div class="dlab" style="color:var(--green)">Bringing it up in conversation</div>
      <div class="talk">${paras(TALK[d.category])}</div>`:""}
      <details class="srcdet"><summary>Connected cases — ${rel.length} related claim${rel.length===1?"":"s"}</summary>
      <div class="relrow" style="margin-top:12px">${rel.map(id=>`<button data-open="${id}">${esc(byId[id].title)}</button>`).join("")||"—"}</div></details>

function renderPaths(){

      <ol>${p.items.map(i=>`<li class="${read.has(i)?"done":""}">${esc(byId[i].title)}</li>`).join("")}</ol>
      <button class="start" data-path="${p.id}">${done===0?"Start path":done>=p.items.length?"Revisit path":"Continue path"} →</button></div>`;
    }).join("")+"</div>";
  document.querySelectorAll("[data-path]").forEach(b=>b.addEventListener("click",()=>{
    const p=PATHS.find(x=>x.id===b.dataset.path);state.pathId=p.id;

    openCase(next,true);
  }));
}

function renderTimeline(){

    return `<button class="ch ${state.act===i?"on":""}" data-act="${i}"><span class="n">${a.num}</span><span class="range">${a.range}</span><h4>${a.name}</h4><p>${a.desc} · ${a.events.length} events</p><div class="meter"><i style="width:${linked.length?Math.round(done/linked.length*100):0}%"></i></div></button>`;

  ${state.act!=null&&TLACTS[state.act]?actHtml(TLACTS[state.act]):`<p class="tlhint">Select an act to open its record.</p>`}`;
  function actHtml(a){
    return `<div class="chopen"><h4>Act ${a.num} · ${a.name} (${a.range})</h4>
    <div class="cvr"><div class="hh claims">What was claimed</div><div></div><div class="hh record">What the record shows</div>
    ${a.events.map(e=>{
      const bubble=`<div class="bubble ${e.side==="claim"?"claim":"rec"}"><h4>${esc(e.t)}</h4><p>${esc(e.p)} ${e.id&&byId[e.id]?`<button class="jump" data-open="${e.id}">→ open the case</button>`:""}</p></div>`;
      return `<div class="cell">${e.side==="claim"?bubble:""}</div><div class="mid"><div class="yr2 ${e.crit?"critY":""}">${e.y}</div></div><div class="cell">${e.side==="record"?bubble:""}</div>`;

/* ---------- the heart of it ---------- */
function renderCore(){
  const link=id=>byId[id]?`<button class="corelink" data-open="${id}">${esc(byId[id].title)} →</button>`:"";
  $("#main").innerHTML=`
  <div class="viewhead"><h2>The heart of it: a different God, a different Jesus, a different gospel</h2>
  <p>If you read nothing else on this site, read this page. Mormonism's problems are not a pile of historical trivia — they converge on three foundational differences that decide everything. This is why the theology matters, in plain terms.</p></div>

  <div class="pathcard"><h3 style="color:var(--red)">1 · A different God</h3>
  <p style="font-size:.92rem;line-height:1.75">Mormonism teaches that God the Father is <b>an exalted man</b> — a being of flesh and bone (D&C 130:22) who <b>“was once as we are now”</b> (King Follett discourse, still quoted approvingly in the church's own <i>Becoming Like God</i> essay), one god among many, who <i>organized</i> pre-existing matter rather than creating everything from nothing. The Bible's God is categorically different: <span class="qq">‘from everlasting to everlasting, thou art God’</span> (Psalm 90:2), <span class="qq">‘God is not a man’</span> (Numbers 23:19), <span class="qq">‘before me there was no God formed, neither shall there be after me’</span> (Isaiah 43:10). <b>Why it matters:</b> worship offered to a different being is not worship of God, however sincere. This is the first commandment issue, not a technicality.</p>
  <details class="srcdet" style="border-top:0;padding-top:0;margin-top:12px"><summary>Open the cases behind this</summary><div class="corelinks" style="margin-top:12px">${link("god-exalted-man-flesh-and-bone")}${link("trinity-vs-godhead")}${link("unchangeable-god-vs-king-follett")}${link("exaltation-eternal-progression")}</div></details></div>

  <div class="pathcard"><h3 style="color:var(--red)">2 · A different Jesus</h3>
  <p style="font-size:.92rem;line-height:1.75">In LDS teaching, Jesus is the <b>firstborn spirit child</b> of heavenly parents — the literal elder brother of every human <i>and of Lucifer</i> (the church's own 2007 statement confirms the shared spirit-parentage) — a being of our species who <b>attained</b> godhood. The Bible's Jesus is the eternal Creator who was never made: <span class="qq">‘All things were made through him, and without him was not any thing made that was made’</span> (John 1:3), <span class="qq">‘he is before all things’</span> (Colossians 1:17), <span class="qq">‘the same yesterday, today, and forever’</span> (Hebrews 13:8). <b>Why it matters:</b> only an infinite, uncreated Christ can carry infinite sin. A created elder brother who climbed to divinity cannot save anyone — which is why Paul treats <span class="qq">‘another Jesus’</span> as a salvation issue (2 Corinthians 11:4), not a difference of opinion.</p>
  <details class="srcdet" style="border-top:0;padding-top:0;margin-top:12px"><summary>Open the cases behind this</summary><div class="corelinks" style="margin-top:12px">${link("jesus-firstborn-spirit-attained-godhood")}${link("jesus-lucifer-spirit-brothers")}${link("different-jesus-hinckley-1998")}${link("blood-atonement")}</div></details></div>

  <div class="pathcard"><h3 style="color:var(--red)">3 · A different gospel</h3>
  <p style="font-size:.92rem;line-height:1.75">The LDS gospel is grace <span class="qq">‘after all we can do’</span> (2 Nephi 25:23) — ordinances, temple worthiness, covenants kept, interviews passed, exaltation earned. The biblical gospel is the exact reverse of that order: <span class="qq">‘by grace are ye saved through faith… not of works, lest any man should boast’</span> (Ephesians 2:8–9); God <span class="qq">‘justifieth the ungodly’</span> (Romans 4:5); <span class="qq">‘It is finished’</span> (John 19:30). <b>Why it matters:</b> this is the exact error Paul pronounced anathema in Galatians 1:8 — a gospel of grace-plus-requirements. It is also Mormonism's pastoral wound: millions of sincere people on a worthiness treadmill that never lets them rest. The good news you carry is that <b>God's love has no worthiness interview</b>.</p>
  <details class="srcdet" style="border-top:0;padding-top:0;margin-top:12px"><summary>Open the cases behind this</summary><div class="corelinks" style="margin-top:12px">${link("grace-after-all-we-can-do")}${link("another-gospel-canon-closure")}${link("no-postmortem-repentance")}${link("word-of-wisdom-dietary-law")}</div></details></div>

  <div class="pathcard"><h3 style="color:var(--gold)">The foundation under all of it: the Bible was not corrupted</h3>
  <p style="font-size:.92rem;line-height:1.75">Mormonism's entire justification for existing is that the Bible was corrupted — <span class="qq">‘plain and precious things taken away’</span> (1 Nephi 13) — requiring a Restoration. But the manuscript evidence closed that door: the <b>Dead Sea Scrolls</b> (c. 250 BC–70 AD) match our Old Testament across a thousand-year gap, and 5,800+ Greek New Testament manuscripts — many centuries older than Joseph Smith — allow the text to be reconstructed to within trivial variants. <b>Why it matters:</b> if the Bible was NOT corrupted, the Restoration answers a problem that never existed — and every place a new scripture contradicts the preserved Bible, it is the new scripture that must be thrown out, not the old one. The same argument, incidentally, applies to any faith that claims the Bible was changed.</p>
  <details class="srcdet" style="border-top:0;padding-top:0;margin-top:12px"><summary>Open the cases behind this</summary><div class="corelinks" style="margin-top:12px">${link("plain-precious-things-removed")}${link("another-gospel-canon-closure")}</div></details></div>`;
  $("#main").querySelectorAll(".corelink,[data-open]").forEach(b=>{if(b.dataset.open)b.addEventListener("click",()=>openCase(b.dataset.open));});
  const g=$("#main").querySelector("[data-goto]");
  if(g)g.addEventListener("click",()=>{state.view="share";render();});
}

/* ---------- sharing the gospel ---------- */
function renderShare(){
  $("#main").innerHTML=`
  <div class="viewhead"><h2>Sharing the gospel with Mormon friends</h2>
  <p>This whole site exists for one reason: not to win arguments, but to help real people meet the real Jesus. "The Lord's servant must not be quarrelsome but kind to everyone… correcting his opponents with gentleness" (2 Timothy 2:24–25). What follows is built from documented ex-Mormon conversions and the methods of ministries that have done this for decades.</p></div>

  <div class="pathcard"><h3>What actually brought ex-Mormons to Christ</h3>
  <p class="pd" style="margin-bottom:8px">The recurring patterns across published testimonies, ranked by how often they appear:</p>
  <ol style="font-size:.88rem;color:var(--muted);line-height:1.7;margin:6px 0 0;padding-left:20px">
    <li><b style="color:var(--ink)">Reading the New Testament for itself — without the LDS lens.</b> The single most common catalyst. A missionary in Orlando tried to convert a Baptist pastor; the pastor fed him, shared the gospel, and challenged him to "read the Bible as a child." Eighteen months of reading the New Testament later, the missionary surrendered to Christ knowing it would cost him everything. His mother — a tenured BYU professor — re-read the New Testament with the family, "saw the difference between their Mormon Christ and the biblical Jesus," and resigned from BYU on 3/16 in honor of John 3:16 (Lynn Wilder, <i>Unveiling Grace</i>).</li>
    <li><b style="color:var(--ink)">Grace answering worthiness exhaustion.</b> The recommend-interview treadmill produces a documented spiritual fatigue. The message that lands: complete forgiveness not conditional on ongoing performance.</li>
    <li><b style="color:var(--ink)">Facts crack the shelf — a loving Christian decides where they land.</b> The CES Letter gets people <i>out</i>, but the default landing after an "all true or all false" faith collapses is atheism, not Christ. The two-part structure repeats in testimony after testimony: evidence broke the shelf, and <i>a specific Christian who loved them without conditions</i> carried them to Jesus instead of to nothing.</li>
    <li><b style="color:var(--ink)">Being loved without an agenda.</b> Mormon culture knows friendship-with-an-agenda ("friendshipping"). A friendship that survives their doubts — and survives their leaving — is startling, because their community's version is often conditional.</li>
  </ol>
  <p class="pd" style="margin-top:10px"><b style="color:var(--ink)">The one sentence to say early, before any crisis:</b> <i>"If Mormonism turned out not to be true, that wouldn't mean Jesus isn't."</i> Said in advance, that sentence routes a future faith crisis toward Christ instead of atheism.</p></div>

  <div class="pathcard"><h3>The method: questions, their sources, and patience</h3>
  <ol style="font-size:.88rem;color:var(--muted);line-height:1.7;margin:6px 0 0;padding-left:20px">
    <li><b style="color:var(--ink)">Witness Christ — don't debate Mormonism.</b> Emphasize Jesus as substitute, not merely example. Compassion over confrontation: see them as burdened, not as enemies.</li>
    <li><b style="color:var(--ink)">Ask questions instead of making statements</b> (the Columbo method): "What do you mean by that?" forces definitions; "How did you come to that conclusion?" shifts the burden of proof — crucial against testimony-as-trump-card.</li>
    <li><b style="color:var(--ink)">Learn "Mormonese."</b> Grace, salvation, eternal life, atonement — shared words, different meanings. Define terms before arguing about them, or you'll agree loudly while meaning opposite things.</li>
    <li><b style="color:var(--ink)">Cite only their own sources.</b> Gospel Topics Essays, the Joseph Smith Papers, church manuals. Never use a claim you can't document from LDS sources — one overstated attack discredits ten true ones and feeds the persecution narrative.</li>
    <li><b style="color:var(--ink)">Never mock what they hold sacred.</b> The 2003 Temple Square street preachers who desecrated garments were denounced by 23 evangelical ministers — and every yelled slogan functions as a testimony meeting for the Mormon hearing it, because their doctrine codes opposition as evidence of truth.</li>
    <li><b style="color:var(--ink)">Plant one seed per conversation, and keep the friendship no matter what.</b> Exits take years. If your friendship is conditional on agreement, you're offering the same deal the church does.</li>
    <li><b style="color:var(--ink)">Pray.</b> "No one can come to me unless the Father who sent me draws him" (John 6:44).</li>
  </ol></div>

  <div class="pathcard"><h3>When they say "prophets are just imperfect men"</h3>
  <p class="pd" style="margin-bottom:8px">This is the standard escape when Joseph Smith's conduct comes up — and unlike Islam (where Muhammad is the 'excellent pattern,' Quran 33:21), Mormonism officially denies prophetic perfection, so "Joseph sinned" bounces off. Two things don't bounce:</p>
  <ol style="font-size:.88rem;color:var(--muted);line-height:1.7;margin:6px 0 0;padding-left:20px">
    <li><b style="color:var(--ink)">Their own veneration text.</b> D&C 135:3: Joseph "has done more, <i>save Jesus only</i>, for the salvation of men in this world, than any other man." Second only to Jesus is the standard the church itself sets — and the hymn "Praise to the Man" is sung to him weekly.</li>
    <li><b style="color:var(--ink)">Sinning is not the same as deceiving in the prophetic act itself.</b> A prophet may lose his temper; a prophet may not lie about revelation — because every book and ordinance flows through his honesty as the instrument. The record shows exactly that: public polygamy denials while secretly married to 30+ women, a "revelation" threatening Emma by name, revelations edited after the fact, the Book of Abraham. Ask: <i>"I'm not asking whether Joseph was perfect. I'm asking whether he told the truth about the revelations. Which of those does Deuteronomy 18 address?"</i></li>
  </ol>
  <p class="pd" style="margin-top:10px">And the fruits test (Matthew 7:15–20) is fair game — missionaries invoke it FOR Joseph ("could a bad tree produce the Book of Mormon?"). Accept the test; then open the Admitted column of this site and weigh the fruit.</p></div>

  <div class="pathcard"><h3>Their canon outranks the Bible — so argue from their canon</h3>
  <p class="pd" style="margin-bottom:8px">Article of Faith 8 says the Bible is God's word only "as far as it is translated correctly" — making it the <b>least</b> trusted book in the LDS canon — while the Book of Mormon is "the most correct of any book on earth." A Mormon can wave off Isaiah; they cannot wave off Moroni. So your most unanswerable arguments set <b>their most-trusted books against their own doctrine</b>:</p>
  <ol style="font-size:.88rem;color:var(--muted);line-height:1.7;margin:6px 0 0;padding-left:20px">
    <li><b style="color:var(--ink)">One God vs. many gods:</b> Alma 11:28–29 — "Is there more than one God?… No." The Book of Mormon itself refutes the plurality of gods.</li>
    <li><b style="color:var(--ink)">Unchangeable God vs. exalted man:</b> Moroni 8:18 — "unchangeable from all eternity to all eternity" vs. King Follett's God who "was once as we are now."</li>
    <li><b style="color:var(--ink)">Polygamy:</b> Jacob 2:24 calls David's and Solomon's wives "abominable" vs. D&C 132 calling them God-given.</li>
    <li><b style="color:var(--ink)">No second chance vs. temple work for the dead:</b> Alma 34:32–35 — "this life is the time" vs. an entire temple system built on postmortem salvation.</li>
  </ol>
  <p class="pd" style="margin-top:10px">The question that lands: <i>"If I showed you that the Book of Mormon disagrees with what your church teaches today — which one would you go with?"</i> Every case above is in this catalog with full citations.</p></div>

  <div class="pathcard"><h3>Hosting the missionaries</h3>
  <p class="pd" style="margin-bottom:10px">Open the door. They're 18–20, homesick, on tiny budgets — <b>feed them</b>. You may be the only committed Christian who ever shares a meal with them, and more than one famous exit began with a pastor who fed a missionary the gospel instead of an argument. They teach five lessons from <i>Preach My Gospel</i>; here is your best move for each:</p>
  <div style="overflow-x:auto"><table class="gtab">
    <tr><th>Their lesson</th><th>What it claims</th><th>Your best question</th></tr>
    <tr><td>1 · Restoration</td><td>Total apostasy after the apostles; church restored through Joseph Smith; pray for a feeling about the Book of Mormon</td><td>"Jesus said the gates of hell would not prevail against his church (Matthew 16:18). If the church totally failed for 1,700 years, was Jesus wrong?" On praying for a feeling: "I test messages against Scripture (Acts 17:11; Galatians 1:8) — would you test it that way with me?"</td></tr>
    <tr><td>2 · Plan of Salvation</td><td>Premortal spirits; three degrees of glory; nearly everyone gets a kingdom</td><td>"Scripture says we become God's children by adoption (Romans 8:15; John 1:12) — doesn't that mean we weren't naturally his children before? And if almost everyone gets a kingdom of glory… what did Jesus save us from?"</td></tr>
    <tr><td>3 · The Gospel</td><td>Faith, repentance, baptism by LDS authority, enduring to the end; grace "after all we can do"</td><td>The most fruitful question in this work: "What must I do to be completely forgiven — and have you done it? Have you actually done 'all you can do'?" Then read Ephesians 2:8–9 and Romans 4:5 together — God justifies the ungodly.</td></tr>
    <tr><td>4 · Commandments</td><td>Follow the prophet, Word of Wisdom, tithing, chastity</td><td>Don't fight the rules — probe the function: "When you keep all of this, do you ever feel like it's enough? How would you know?" Then: "For me obedience is gratitude for a salvation I already have, not the entry fee for one I hope to get."</td></tr>
    <tr><td>5 · Laws & Ordinances</td><td>Priesthood, temple ordinances, eternal marriage, baptism for the dead</td><td>Open Hebrews together: priests stand daily, "but this man, after he had offered one sacrifice for sins for ever, sat down" (Hebrews 10:11–14; 7:23–25). Ask: "Why is Jesus seated?" Because the work is finished.</td></tr>
  </table></div></div>

  <div class="pathcard"><h3>Conversation dynamics you must know</h3>
  <p style="font-size:.88rem;line-height:1.7"><b>When they bear testimony</b> ("I know the church is true…"): it's a trained move that converts facts into personal experience. Don't argue with it — get underneath it: <i>"Thank you — I can tell that's precious to you. How do you tell the difference between a feeling that's from God and one that's just deeply felt? People of many faiths describe the same burning confirmation of contradictory things."</i> Then bear your own, differently grounded: <i>"My confidence isn't in my feelings about Jesus — it's in what he did in history. My feelings have bad days; the empty tomb doesn't."</i></p>
  <p style="font-size:.88rem;line-height:1.7"><b>The shelf:</b> Mormons "shelve" unresolved doubts until the shelf breaks. You're placing weight on a shelf you can't see — so don't demand resolution: <i>"You don't have to answer now — just sit with it."</i></p>
  <p style="font-size:.88rem;line-height:1.7"><b>Milk before meat:</b> your friend may sincerely not know the hard history, and the missionaries at your table may know less than you do. Never say "your church hides this" — say <i>"I read this in an LDS source — can you help me understand it?"</i></p>
  <p style="font-size:.88rem;line-height:1.7"><b>Count their cost out loud.</b> Doubting can mean bishop interviews, a warned spouse, missed weddings, family distance. Never gloat over a crack in their faith. Say: <i>"I know what this could cost you — I'm not going anywhere either way."</i> Be the unconditional community their ward's conditional version can't be. Expect years, not weeks.</p></div>

  <div class="pathcard"><h3>Seven gospel bridges (in their vocabulary)</h3>
  <ol style="font-size:.88rem;color:var(--muted);line-height:1.7;margin:6px 0 0;padding-left:20px">
    <li><b style="color:var(--ink)">Worthiness → Grace.</b> "I'm not worthy either — that's exactly who Jesus came for." 2 Nephi 25:23 vs. Romans 4:5: God justifies <i>the ungodly</i>.</li>
    <li><b style="color:var(--ink)">Exaltation → Adoption.</b> Becoming gods someday vs. becoming God's child now: Romans 8:15–17 — an inheritance received, not a status achieved. The word "adoption" itself quietly dismantles the pre-existence framework.</li>
    <li><b style="color:var(--ink)">"I know" → "I trust."</b> Feelings vs. history: Moroni 10:4 vs. 1 Corinthians 15:3–8. "My confidence stays true on my worst-feeling day."</li>
    <li><b style="color:var(--ink)">The endless temple → the finished cross.</b> Hebrews 10:11–14: their priests stand daily; our High Priest <b>sat down</b>. Ask why.</li>
    <li><b style="color:var(--ink)">Enduring to the end → assurance now.</b> 1 John 5:13: "that ye may KNOW that ye have eternal life." Ask: "If you died tonight, do you know? John says you can."</li>
    <li><b style="color:var(--ink)">Repentance-as-forsaking → repentance-as-return.</b> Kimball's crushing standard vs. the Father who runs to the prodigal mid-confession (Luke 15; 1 John 1:9). Listen for their fatigue.</li>
    <li><b style="color:var(--ink)">The Great Apostasy → the unfailing Christ.</b> "Which is more likely — that Jesus lost his church for 1,700 years, or that he kept his promise?" (Matthew 16:18; Ephesians 3:21).</li>
  </ol></div>

  <div class="pathcard"><h3>The gospel, side by side</h3>
  <div style="overflow-x:auto"><table class="gtab">
    <tr><th></th><th>LDS teaching</th><th>Biblical gospel</th></tr>
    <tr><td>God</td><td>An exalted man; one of many gods; once as we are now</td><td>Eternally God, "from everlasting to everlasting" (Psalm 90:2); no God formed before or after him (Isaiah 43:10)</td></tr>
    <tr><td>Jesus</td><td>Firstborn spirit child, our elder brother, attained godhood</td><td>The eternal Word who <i>was</i> God and became flesh (John 1:1,14); Creator of all things (Colossians 1:16)</td></tr>
    <tr><td>Salvation</td><td>Resurrection for all; exaltation through ordinances, covenants, and worthiness — "after all we can do"</td><td>A gift received by faith, "not of works, lest any man should boast" (Ephesians 2:8–9); "It is finished" (John 19:30)</td></tr>
    <tr><td>Assurance</td><td>Renewable temple recommends; worthiness reviewed by interview</td><td>"He that believeth on the Son hath everlasting life" — present tense (John 3:36); "no condemnation" (Romans 8:1)</td></tr>
    <tr><td>Destiny</td><td>Faithful members become gods with eternal increase (D&amp;C 132:19–20)</td><td>Adopted children of God, glorified with Christ — worshipers forever, never rival deities (Romans 8:17; Revelation 22:3)</td></tr>
  </table></div></div>

  <div class="pathcard"><h3>When they say "I know the church is true — I've felt it"</h3>
  <p class="pd" style="margin-bottom:8px">Don't attack the feeling; question the test. Try:</p>
  <div class="talk" style="max-width:none"><p><b>"I believe you felt something real. But Muslims, Hindus, and I have all felt things too — feelings tell us something happened in us, not whether a book is true. If God gave us a way to test prophets that doesn't depend on feelings (Deuteronomy 18:22, 1 John 4:1), would you be willing to apply it to Joseph Smith with me?"</b></p>
  <p>Also worth knowing: Moroni 10:4's invitation to pray about the book presumes the answer. Jeremiah 17:9 and Proverbs 14:12 explain why the heart alone is not a safe judge.</p></div></div>

  <div class="pathcard"><h3>Do / Don't</h3>
  <div class="dodont">
    <div><b style="color:var(--green);font-size:.8rem;letter-spacing:.1em">DO</b><ul>
      <li>Lead with Jesus and grace — the "better offer" — not just problems</li>
      <li>Read Bible passages together and let Scripture speak</li>
      <li>Learn their vocabulary: "gospel," "salvation," "heaven" mean different things to them</li>
      <li>Invite them to read John or Galatians with you, one chapter at a time</li>
      <li>Feed them dinner. Ex-Mormons consistently say love opened the door</li>
    </ul></div>
    <div><b style="color:var(--red);font-size:.8rem;letter-spacing:.1em">DON'T</b><ul>
      <li>Dogpile — one question, then listen</li>
      <li>Use the weak arguments (this site marks them <i>answered</i>) — one bad argument discredits ten good ones</li>
      <li>Mock garments, temples, or Joseph Smith personally</li>
      <li>Expect a decision on the spot — exits take months or years</li>
      <li>Win the argument and lose the person</li>
    </ul></div>
  </div></div>

  <div class="pathcard"><h3>Start here</h3>
  <p class="pd">The <b>For gospel conversations</b> guided path walks the six cases that lead most naturally to the gospel. Every case page ends with a "Bringing it up in conversation" box — a question you can actually ask.</p>
  <button class="start" data-goto-path="gospel">Open the gospel-conversations path →</button></div>`;
  const b=$("#main").querySelector("[data-goto-path]");
  if(b)b.addEventListener("click",()=>{state.view="paths";state.caseId=null;render();});
}

/* ---------- router ---------- */
function render(){
  document.querySelector(".app").classList.toggle("reading",state.view!=="overview");
  renderNav();
  if(state.view==="case")return renderCase();
  if(state.view==="paths")return renderPaths(),renderPreview();
  if(state.view==="timeline")return renderTimeline(),renderPreview();
  if(state.view==="glossary")return renderGlossary(),renderPreview();
  if(state.view==="share")return renderShare(),renderPreview();
  if(state.view==="core")return renderCore(),renderPreview();
  renderOverview();renderPreview();
}

/* ---------- keyboard ---------- */
document.addEventListener("keydown",e=>{
  const inInput=/input|textarea/i.test(document.activeElement.tagName);
  if(inInput){if(e.key==="Escape")document.activeElement.blur();return;}
  const list=filtered();
  const move=dir=>{
    const idx=list.findIndex(x=>x.id===state.sel);
    const next=list[Math.min(list.length-1,Math.max(0,(idx<0?0:idx+dir)))];
    if(!next)return;
    state.sel=next.id;
    if(state.view==="case"){openCase(next.id);}
    else{renderPreview();
      const el=document.querySelector(`.vt[data-id="${next.id}"]`);
      document.querySelectorAll(".vt.sel").forEach(x=>x.classList.remove("sel"));
      document.querySelectorAll(`.vt[data-id="${next.id}"]`).forEach(x=>x.classList.add("sel"));
      if(el)el.scrollIntoView({block:"nearest"});}
  };
  switch(e.key==="ArrowRight"?"next":e.key==="ArrowLeft"?"prev":e.key.toLowerCase()){
    case "next":e.preventDefault();move(1);break;
    case "prev":e.preventDefault();move(-1);break;
    case "enter":if(state.sel&&state.view!=="case")openCase(state.sel);break;
    case "escape":if(state.view==="case"){state.view=state.pathId?"paths":"overview";state.caseId=null;render();}else{state.q="";const q=$("#q");if(q)q.value="";state.verdict=null;state.severity=null;render();}break;
    case "o":state.view="overview";state.section="all";state.caseId=null;render();break;
    case "p":state.view="paths";state.caseId=null;render();break;
    case "t":state.view="timeline";state.caseId=null;render();break;
    case "g":state.view="glossary";state.caseId=null;render();break;
    case "s":state.view="share";state.caseId=null;render();break;
    case "h":state.view="core";state.caseId=null;render();break;
  }
});


const TOURKEY="wb_tour";
const TOURSTEPS=[{"icon":"⚖","title":"Welcome to the examination","body":"<b>80 documented claims</b> about Mormonism, each weighed against the Bible. Every claim shows its sources, the church's <b>strongest defense</b>, and an honest verdict — nothing is cherry-picked, and weak criticisms are called weak."},{"icon":"🏷","title":"Four verdicts, one glance","body":"Every claim lands in one of four columns:<div class=\"vrow2\"><div><span class=\"badge v-admitted\">Admitted</span><span>their own sources concede the facts</span></div><div><span class=\"badge v-unrefuted\">Unrefuted</span><span>no adequate answer exists</span></div><div><span class=\"badge v-contested\">Contested</span><span>a real debate — both sides shown</span></div><div><span class=\"badge v-answered\">Answered</span><span>the defense wins, and we say so</span></div></div>"},{"icon":"📂","title":"Open any case","body":"Click a claim title and you get the full case file: <b>the claim</b> → <b>the verses behind it</b> (click any reference to read it in place) → <b>the best defense, steelmanned</b> → <b>the verdict</b> → <b>why it matters</b> → and <b>how to bring it up in conversation</b>."},{"icon":"🧭","title":"The sidebar is your map","body":"Sections sort the claims by kind. Below them: <b>The heart of it</b> (the three foundational issues), <b>Sharing the gospel</b> (the full how-to guide), <b>Guided paths</b>, <b>Timeline</b>, and <b>Terms explained</b>. Use ← → arrow keys to move between cases; hover any ⓘ for a plain-English explainer."},{"icon":"🚀","title":"Where to start","body":"New to all this? Read <b>The heart of it</b> first — a different God, a different Jesus, a different gospel — then take the guided path <i>The five strongest cases</i>. You can replay this tour anytime from the sidebar.","cta":"Take me to the heart of it"}];
function startTour(){
  const old=document.querySelector(".tourwrap");if(old)old.remove();
  let ti=0;
  const wrap=document.createElement("div");wrap.className="tourwrap";
  function finish(go){localStorage.setItem(TOURKEY,"1");wrap.remove();if(go){state.view="core";state.caseId=null;render();}}
  function draw(){
    const s=TOURSTEPS[ti];
    wrap.innerHTML='<div class="tourcard"><div class="ticon">'+s.icon+'</div><h3>'+s.title+'</h3><div class="tbody">'+s.body+'</div>'+
      '<div class="tdots">'+TOURSTEPS.map((_,j)=>'<i class="'+(j===ti?"on":"")+'"></i>').join("")+'</div>'+
      '<div class="trow"><button class="tskip">Skip tour</button><div>'+(ti>0?'<button class="tback">Back</button>':'')+
      '<button class="tnext">'+(ti===TOURSTEPS.length-1?s.cta:'Next')+'</button></div></div></div>';
    wrap.querySelector(".tskip").addEventListener("click",()=>finish(false));
    const bk=wrap.querySelector(".tback");if(bk)bk.addEventListener("click",()=>{ti--;draw();});
    wrap.querySelector(".tnext").addEventListener("click",()=>{if(ti===TOURSTEPS.length-1){finish(ti===TOURSTEPS.length-1&&true);}else{ti++;draw();}});
  }
  document.body.appendChild(wrap);draw();
}
if(!localStorage.getItem(TOURKEY))setTimeout(startTour,500);

document.documentElement.dataset.theme=localStorage.getItem("wb_theme")||"dark";
$("#q").addEventListener("input",e=>{
  state.q=e.target.value.trim().toLowerCase();
  if(state.view!=="overview"){state.view="overview";state.caseId=null;}
  render();
});
render();
