<title>Which Gospel? — Hebrew Israelites, Examined Against the Bible</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --bg:#0f1116; --side:#0b0d11; --panel:#161a21; --panel2:#12151b; --line:#232833; --line2:#2b313d;
    --ink:#e7e9ec; --muted:#98a0ac; --dim:#565e6b; --gold:#82b1d8; --gold-ink:#0e1116;
    --red:#e0736a; --red-bg:#38221f; --red-cell:#5e2b27; --red-cell-hi:#8a3a32;
    --amber:#cf9a45; --amber-bg:#332a18; --amber-cell:#54431f; --amber-cell-hi:#7d6224;
    --green:#7fb08d; --green-bg:#1d2c26; --green-cell:#27443a;
    --purp:#b394e0; --purp-bg:#2c2440;
    --serif:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif;
    --sans:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    --acc:var(--gold);
    --acc2:var(--purp);
    --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  }
  :root[data-theme="light"]{
    --bg:#f3f4f6; --side:#e9ebee; --panel:#ffffff; --panel2:#f7f8fa; --line:#dfe2e7; --line2:#cfd4db;
    --ink:#1b1e23; --muted:#5c6470; --dim:#9aa1ab; --gold:#2f6b9e; --gold-ink:#ffffff;
    --red:#b03a31; --red-bg:#f6e4e2; --red-cell:#e7b6b1; --red-cell-hi:#cc766d;
    --amber:#8a5f0e; --amber-bg:#f3ecd9; --amber-cell:#e4d1a2; --amber-cell-hi:#c6a75e;
    --green:#3e7455; --green-bg:#e3ede6; --green-cell:#b7d1bf;
    --purp:#6b4fa1; --purp-bg:#ece5f6;
  }
  *{box-sizing:border-box}
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6}
  a{color:var(--gold)}
  button{font-family:inherit}
  mark{background:color-mix(in srgb,var(--amber) 30%,transparent);color:inherit;border-radius:2px;padding:0 2px}
  kbd{font-family:var(--mono);font-size:.72rem;background:var(--panel);border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;padding:1px 6px;color:var(--muted)}

  .app{display:grid;grid-template-columns:216px minmax(0,1fr) 280px;min-height:100vh}
  @media (max-width:1020px){.app{grid-template-columns:216px minmax(0,1fr)}.preview{display:none}}
  @media (max-width:720px){.app{grid-template-columns:1fr}.side{position:sticky;top:0;z-index:40;height:auto;border-right:0;border-bottom:1px solid var(--line)}
    .side .nav{display:flex;flex-wrap:wrap;gap:2px;padding:0 10px 10px}.side .nav h5{display:none}.side .sideprog{display:none}}

  /* sidebar */
  .side{background:var(--side);border-right:1px solid var(--line);padding:18px 0;position:sticky;top:0;height:100vh;overflow-y:auto}
  @media (max-width:720px){.side{height:auto;overflow:visible}}
  .logo{font-family:var(--serif);font-size:1rem;letter-spacing:.1em;padding:0 18px 14px;color:var(--ink)}
  .logo b{color:var(--gold)}
  .sidesearch{padding:0 14px 12px}
  .sidesearch input{width:100%;font-family:inherit;font-size:.82rem;padding:7px 12px;border-radius:8px;border:1px solid var(--line2);background:var(--panel);color:var(--ink)}
  .sidesearch input:focus{outline:2px solid var(--gold);outline-offset:1px}
  .info{display:inline-grid;place-items:center;width:14px;height:14px;border:1px solid currentColor;border-radius:50%;font-size:.58rem;font-style:normal;font-weight:700;opacity:.75;cursor:help;position:relative;flex:none}
  .info:hover,.info:focus{opacity:1}
  .info .tip{display:none;position:absolute;left:50%;transform:translateX(-50%);top:160%;width:250px;background:var(--side);color:var(--ink);border:1px solid var(--line2);font-family:var(--sans);font-size:.76rem;line-height:1.5;padding:9px 12px;border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.35);z-index:30;text-transform:none;letter-spacing:0;font-weight:400;text-align:left}
  .info:hover .tip,.info:focus .tip{display:block}
  .badge,.tag{display:inline-flex;align-items:center;gap:5px}
  .nav a{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 18px;font-size:.86rem;color:var(--muted);text-decoration:none;cursor:pointer;border-left:2px solid transparent}
  .nav a:hover{background:var(--panel2);color:var(--ink)}
  .nav a.on{background:var(--panel);color:var(--ink);border-left-color:var(--gold)}
  .nav .cnt{font-family:var(--mono);font-size:.68rem;color:var(--dim)}
  .nav h5{font-size:.64rem;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin:18px 18px 6px;font-weight:600}
  .sideprog{margin:22px 18px 8px;font-size:.72rem;color:var(--muted)}
  .pbar{height:4px;background:var(--line);border-radius:2px;margin-top:6px;overflow:hidden}
  .pbar i{display:block;height:100%;background:var(--gold);transition:width .4s ease}

  /* main */
  .main{padding:18px 26px 80px;min-width:0}
  .cmd{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line2);border-radius:8px;padding:4px 8px 4px 14px;margin-bottom:18px}
  .cmd input{flex:1;background:none;border:0;color:var(--ink);font-family:inherit;font-size:.9rem;padding:7px 0;outline:none}
  .cmd input::placeholder{color:var(--dim)}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:20px}
  .tile{background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:12px 14px;cursor:pointer;text-align:left;color:var(--ink)}
  .tile:hover{border-color:var(--gold)}
  .tile.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
  .tile .v{font-family:var(--serif);font-size:1.7rem;font-variant-numeric:tabular-nums;line-height:1.1}
  .tile .l{font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:2px}
  .tile.t-ad .v{color:var(--purp)}.tile.t-un .v{color:var(--red)}.tile.t-co .v{color:var(--amber)}.tile.t-an .v{color:var(--green)}
  h4.bt{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;font-weight:600}
  .vwall{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:10px;align-items:start}
  @media (max-width:1240px){.vwall{grid-template-columns:1fr 1fr}}
  @media (max-width:700px){.vwall{grid-template-columns:1fr}}
  .vcol{background:var(--panel2);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .vcol header{padding:14px 16px 12px;border-bottom:2px solid var(--line)}
  .vcol.ad header{border-bottom-color:var(--purp)}
  .vcol.ad .n,.vcol.ad .t{color:var(--purp)}
  .vcol.ad .vt:hover{border-left-color:var(--purp)}
  .vcol.un header{border-bottom-color:var(--red)}
  .vcol.co header{border-bottom-color:var(--amber)}
  .vcol.an header{border-bottom-color:var(--green)}
  .vcol header .n{font-family:var(--serif);font-size:1.9rem;line-height:1;font-variant-numeric:tabular-nums}
  .vcol.un .n{color:var(--red)}.vcol.co .n{color:var(--amber)}.vcol.an .n{color:var(--green)}
  .vcol header .t{font-size:.72rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;margin-left:8px}
  .vcol.un .t{color:var(--red)}.vcol.co .t{color:var(--amber)}.vcol.an .t{color:var(--green)}
  .vcol header .d{font-size:.74rem;color:var(--muted);margin-top:4px}
  .vgroup h6{font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:0;padding:10px 16px 4px;font-weight:600}
  .vt{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:9px 16px 9px 13px;cursor:pointer;color:var(--ink);border-left:3px solid transparent}
  .vt:hover,.vt.sel{background:var(--panel)}
  .vt.sel{border-left-color:var(--gold)}
  .vcol.un .vt:hover{border-left-color:var(--red)}
  .vcol.co .vt:hover{border-left-color:var(--amber)}
  .vcol.an .vt:hover{border-left-color:var(--green)}
  .vt.dimmed{opacity:.25}
  .vt h5{font-family:var(--serif);font-weight:500;font-size:.92rem;line-height:1.35;margin:0}
  .vt .m{font-size:.66rem;color:var(--dim);letter-spacing:.05em;text-transform:uppercase;margin-top:2px;display:flex;gap:8px;align-items:center}
  .vt .m .rd{color:var(--green)}
  .vt .m .star{color:var(--gold)}

  /* list */
  .rows{display:flex;flex-direction:column}
  .rowitem{display:grid;grid-template-columns:12px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:11px 6px;cursor:pointer;color:var(--ink)}
  .rowitem:hover,.rowitem.sel{background:var(--panel2)}
  .rowitem .stripe{width:4px;height:26px;border-radius:2px}
  .rowitem.v-unrefuted .stripe{background:var(--red)}
  .rowitem.v-contested .stripe{background:var(--amber)}
  .rowitem.v-answered .stripe{background:var(--green)}
  .rowitem h5{font-family:var(--serif);font-weight:500;font-size:1rem;margin:0;line-height:1.35}
  .rowitem .sub{font-size:.72rem;color:var(--muted)}
  .rowitem .meta{display:flex;gap:8px;align-items:center;font-size:.66rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;white-space:nowrap}
  .rowitem .meta .rd{color:var(--green)}

  .badge{font-size:.64rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:3px 9px;border-radius:999px;display:inline-block}
  .badge.v-admitted{background:var(--purp-bg);color:var(--purp)}
  .badge.v-unrefuted{background:var(--red-bg);color:var(--red)}
  .badge.v-contested{background:var(--amber-bg);color:var(--amber)}
  .badge.v-answered{background:var(--green-bg);color:var(--green)}
  .tag{font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line2);border-radius:999px;padding:2px 9px;display:inline-block}

  /* case view */
  .backbar{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
  .backbar button.bk{background:var(--panel);border:1px solid var(--line2);color:var(--muted);border-radius:8px;padding:6px 13px;font-size:.8rem;cursor:pointer}
  .backbar button.bk:hover{color:var(--ink);border-color:var(--gold)}
  .pathnext{margin-left:auto;background:var(--gold);color:var(--gold-ink);border:0;border-radius:8px;padding:7px 14px;font-size:.8rem;font-weight:700;cursor:pointer}
  .case h2{font-family:var(--serif);font-weight:500;font-size:1.6rem;line-height:1.25;margin:10px 0 14px;max-width:30ch;text-wrap:balance}
  .case .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
  .dlab{font-size:.7rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:26px 0 10px}
  .dlab.red{color:var(--red)}.dlab.blue{color:var(--gold)}
  .claimrow{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(270px,1fr);gap:28px;align-items:start}
  .claimrow.solo{grid-template-columns:1fr}
  @media (max-width:900px){.claimrow{grid-template-columns:1fr}}
  .claim p{font-size:.97rem;line-height:1.75;max-width:66ch;margin:0 0 12px}
  .claimside{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:16px 18px;position:sticky;top:16px}
  .claimside .passcols{grid-template-columns:1fr;gap:12px}
  .claimside .sidenote{font-size:.76rem;color:var(--dim);margin:-4px 0 12px}
  .defense p.lead{margin:0 0 4px}
  .defense p{line-height:1.7;margin:0 0 10px}
  .pts{margin:8px 0 0;padding:0;list-style:none;counter-reset:pt}
  .pts li{position:relative;padding:10px 0 10px 36px;border-top:1px dashed color-mix(in srgb,var(--green) 25%,var(--line));line-height:1.7}
  .pts li:first-child{border-top:0}
  .pts li::before{counter-increment:pt;content:counter(pt);position:absolute;left:0;top:10px;width:23px;height:23px;border-radius:50%;background:var(--green-bg);color:var(--green);display:grid;place-items:center;font-size:.72rem;font-weight:700}
  .vbox p{margin:0 0 8px;line-height:1.7}
  .vbox p:last-child{margin-bottom:0}
  .ref-lds{color:var(--red);font-weight:600}
  .ref-bib{color:var(--gold);font-weight:600}
  .qq{font-family:var(--serif);font-style:italic;background:color-mix(in srgb,var(--amber) 16%,transparent);border-radius:3px;padding:0 3px}
  .kw{font-weight:700;text-decoration:underline;text-underline-offset:2px}
  .talk{background:color-mix(in srgb,var(--green) 8%,var(--panel));border:1px solid color-mix(in srgb,var(--green) 30%,var(--line));border-radius:8px;padding:16px 18px;font-size:.93rem;max-width:80ch}
  .talk p{margin:0 0 8px;line-height:1.7}
  .talk p:last-child{margin-bottom:0}
  .dlg{display:flex;flex-direction:column;gap:10px;max-width:76ch}
  .dlg .msg{border-radius:12px;padding:12px 16px;max-width:88%}
  .dlg .msg p{margin:0;font-size:.9rem;line-height:1.65}
  .dlg .who{display:block;font-size:.64rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin-bottom:4px}
  .dlg .them{align-self:flex-start;background:var(--panel);border:1px solid var(--line2);border-bottom-left-radius:4px}
  .dlg .them .who{color:var(--red)}
  .dlg .you{align-self:flex-end;background:color-mix(in srgb,var(--green) 9%,var(--panel));border:1px solid color-mix(in srgb,var(--green) 30%,var(--line));border-bottom-right-radius:4px}
  .dlg .you .who{color:var(--green)}
  .corelinks{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .corelink{font-size:.78rem;background:var(--panel2);border:1px solid var(--line2);color:var(--gold);border-radius:999px;padding:5px 13px;cursor:pointer;text-align:left}
  .corelink:hover{border-color:var(--gold)}
  .gtab{width:100%;border-collapse:collapse;font-size:.86rem;margin:14px 0 6px}
  .gtab th{text-align:left;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:8px 12px;border-bottom:2px solid var(--line2)}
  .gtab th:nth-child(2){color:var(--red)}
  .gtab th:nth-child(3){color:var(--gold)}
  .gtab td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.55}
  .gtab td:first-child{font-weight:700;white-space:nowrap;color:var(--muted)}
  .dodont{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media (max-width:700px){.dodont{grid-template-columns:1fr}}
  .dodont ul{margin:8px 0 0;padding-left:18px;font-size:.86rem;color:var(--muted)}
  .dodont li{padding:3px 0;line-height:1.55}
  .why{background:color-mix(in srgb,var(--gold) 7%,var(--panel));border:1px solid color-mix(in srgb,var(--gold) 28%,var(--line));border-radius:8px;padding:16px 18px;font-size:.93rem;max-width:80ch}
  .why p{margin:0 0 10px;line-height:1.7}
  .why .wtail{color:var(--muted);font-style:italic;margin-bottom:0;border-top:1px dashed color-mix(in srgb,var(--gold) 30%,var(--line));padding-top:10px}
  .compare2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media (max-width:760px){.compare2{grid-template-columns:1fr}}
  .pane{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
  .pane .ref{font-size:.7rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
  .pane.bom .ref{color:var(--red)}.pane.bible .ref{color:var(--gold)}
  .pane .scripture{font-family:var(--serif);font-size:1rem;line-height:1.65}
  .cnote{font-size:.8rem;color:var(--muted);margin-top:8px;max-width:80ch}
  .passcols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media (max-width:760px){.passcols{grid-template-columns:1fr}}
  .passcols h6{font-size:.68rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin:0 0 8px}
  .passcols .h-bom{color:var(--red)}.passcols .h-bib{color:var(--gold)}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{font-size:.78rem;font-family:var(--serif);border:1px solid var(--line2);background:var(--panel);border-radius:6px;padding:4px 10px;cursor:pointer;color:var(--ink)}
  .chip:hover{border-color:var(--gold)}
  .chip.open{background:var(--amber-bg);border-color:var(--gold)}
  .chip.ext::after{content:" ↗";color:var(--muted);font-family:var(--sans);font-size:.68rem}
  .versebox{grid-column:1/-1;background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:8px;padding:14px 18px;margin-top:4px}
  .versebox .vr{font-size:.7rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-bottom:8px;display:flex;justify-content:space-between}
  .versebox .vr button{background:none;border:0;color:var(--muted);cursor:pointer;font-size:.8rem}
  .versebox .vtext{font-family:var(--serif);font-size:.98rem;line-height:1.7;max-width:72ch}
  .versebox .vnum{font-family:var(--sans);font-size:.62rem;color:var(--muted);vertical-align:super;margin-right:3px}
  .versebox .vwhy{margin-top:10px;font-size:.8rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px;max-width:76ch}
  .versebox .vwhy b{color:var(--gold)}
  .srcdet{margin-top:30px;border-top:1px solid var(--line);padding-top:14px}
  .srcdet summary{font-size:.74rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);cursor:pointer;list-style:none}
  .srcdet summary::before{content:"▸ ";color:var(--gold)}
  .srcdet[open] summary::before{content:"▾ "}
  .srcdet .srcs{margin-top:12px}
  .app.reading{grid-template-columns:216px minmax(0,1fr)}
  .app.reading .preview{display:none}
  body:has(.app.reading) .keysbar{right:0}
  .srcs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
  .srcs li{display:flex;gap:9px;align-items:baseline;font-size:.85rem}
  .sb{flex:none;font-size:.6rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;border-radius:4px;padding:2px 7px;position:relative;top:-1px}
  .sb-scholarly{background:var(--green-bg);color:var(--green)}
  .sb-apologetics{background:var(--amber-bg);color:var(--amber)}
  .sb-primary,.sb-institutional{background:color-mix(in srgb,var(--gold) 16%,transparent);color:var(--gold)}
  .sb-journalism{background:var(--panel);color:var(--muted);border:1px solid var(--line2)}
  .sb-testimony{background:var(--red-bg);color:var(--red)}
  .defense{background:color-mix(in srgb,var(--green) 7%,var(--panel));border:1px solid color-mix(in srgb,var(--green) 30%,var(--line));border-radius:8px;padding:16px 18px;font-size:.92rem;max-width:80ch}
  .defense .dsrc{font-size:.78rem;color:var(--muted);margin-top:10px}
  .vbox{display:flex;gap:12px;align-items:flex-start;border-radius:8px;padding:16px 18px;font-size:.92rem;max-width:80ch}
  .vbox.v-admitted{background:var(--purp-bg)}.vbox.v-unrefuted{background:var(--red-bg)}.vbox.v-contested{background:var(--amber-bg)}.vbox.v-answered{background:var(--green-bg)}
  .vbox b.vb{flex:none;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;padding-top:3px}
  .vbox.v-admitted b.vb{color:var(--purp)}.vbox.v-unrefuted b.vb{color:var(--red)}.vbox.v-contested b.vb{color:var(--amber)}.vbox.v-answered b.vb{color:var(--green)}
  .relrow{display:flex;gap:8px;flex-wrap:wrap}
  .relrow button{font-size:.78rem;background:var(--panel);border:1px solid var(--line2);color:var(--ink);border-radius:999px;padding:5px 13px;cursor:pointer}
  .relrow button:hover{border-color:var(--gold);color:var(--gold)}
  .pinbtn{background:none;border:1px dashed var(--line2);color:var(--muted);border-radius:8px;padding:7px 14px;font-size:.8rem;cursor:pointer}
  .pinbtn:hover{border-color:var(--gold);color:var(--gold)}
  .pinbtn.pinned{border-style:solid;border-color:var(--gold);color:var(--gold)}

  /* glossary tooltip */
  .g{border-bottom:2px dotted var(--gold);cursor:help;position:relative}
  .g .gt{display:none;position:absolute;left:0;top:140%;width:270px;background:var(--side);color:var(--ink);border:1px solid var(--line2);font-family:var(--sans);font-size:.78rem;line-height:1.5;padding:10px 13px;border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.35);z-index:20;font-style:normal;font-weight:400}
  .g:hover .gt,.g:focus .gt{display:block}

ern founder is worth thinking about slowly.","practice":"The method is the door. **“Isaiah 28:10 — read me the next three verses.”** Verse 13 turns 'precept upon precept' into judgment on people who wouldn't listen. That's not a gotcha; it's an invitation to read chapters instead of chains of single lines — and the whole edifice depends on the chains."};
const DIALOG={"identity-claims":[{"w":"them","t":"So-called Black man! You're not African, you're not 'Black' — that's a color the slave master gave you. You're a Hebrew, tribe of Judah. That's why nothing in this country works for you."},{"w":"you","t":"I'll tell you my name if you tell me yours — I'm ___. And listen, I'm not going to mock the question, because it's the right question: who am I, and why has my people suffered? I just want to check the answer against the whole Book."},{"w":"them","t":"The Book already answered. Deuteronomy 28:68 — bondage, ships. Precept: Joel 3, they sold the children of Judah. Precept: Revelation 2:9, them over in Israel are liars. It's all there if you wasn't asleep."},{"w":"you","t":"That's four half-verses in ten seconds, brother. Pick one — your best one — and let's read the whole chapter together right now. Deuteronomy 28: who's being addressed in verse 15? Where do the ships go in verse 68? It says Egypt, and it ends 'no man shall buy you.' Millions of our ancestors were bought. The verse describes a different tragedy."},{"w":"them","t":"Egypt means bondage, everybody knows that. And even if you was right about one verse, you still can't tell me who you are. DNA? That's Esau's paperwork."},{"w":"you","t":"Here's what I can tell you, and no one can revoke it: 'You are all sons of God through faith in Christ Jesus… if you are Christ's, then you are Abraham's seed, heirs according to the promise' — Galatians 3. An identity older than 1619 and stronger than any chart, and it's offered to you by name, not by lineage. Come read that chapter with me after you're done here — I'm buying the coffee."}],"curses-reading":[{"w":"them","t":"Deuteronomy 28 is our fingerprint. Slavery, ships, scattered, ruled over by strangers — you're living the curses right now. That's how you KNOW who you are."},{"w":"you","t":"I won't pretend the resonance isn't real — reading that chapter next to the Middle Passage is chilling, and the suffering it echoes was genuinely evil. But a fingerprint has to match everywhere, not just where it's held up. Can we read verse 15? The curses fall on the nation that received THIS covenant and broke it — the people standing at Moab."},{"w":"them","t":"Right — Israel broke the covenant, Israel got the curses, and the curses lasted 400 years. Acts 7:6! A nation would enslave them four hundred years. America, 1619. Do the math."},{"w":"you","t":"Read Acts 7:7 — the next verse. Stephen says that prophecy is about EGYPT, and it was already fulfilled at the Exodus; he's retelling Genesis 15. You can't reissue a receipt for a debt the text says was paid. And here's what the camps never read: Deuteronomy 30. After the curse, God promises to gather, restore and circumcise hearts. The chapter isn't a fingerprint kit — it's a story with an ending."},{"w":"them","t":"The ending is Israel keeping the laws again. That's the regathering — us, waking up, back under the commandments."},{"w":"you","t":"The ending is better than that. Jeremiah 31: 'I will make a NEW covenant with the house of Israel… I will write my law on their hearts… I will remember their sin no more.' And Jesus, a son of Judah, lifted the cup and said 'this cup is the new covenant in my blood.' The curse of the law landed on him — Galatians 3:13 — so it doesn't have to land on you. That's not the slave master's doctrine; that's Israel's own prophets, kept."}],"history-genetics":[{"w":"them","t":"Them people in Tel Aviv are Khazars — converts from the Caucasus. The real Jews got shipped to the Americas. That's why they hid your history from you."},{"w":"you","t":"That theory's been tested, though — genome-wide, by more than twenty geneticists in 2013. Result: no Khazar signal; Ashkenazi Jews cluster with Middle Eastern populations and with other Jewish communities from Iraq to Morocco. The one study claiming otherwise used modern Armenians as stand-ins for Khazars, and got taken apart for it."},{"w":"them","t":"And who funded them studies? Come on. Meanwhile your 23andMe says 'Nigeria' because Esau's scientists programmed it to say Nigeria."},{"w":"you","t":"Brother, hear what just happened: every possible test result confirms the chart, and every contrary result is a conspiracy. That's a lock, not a key. The ancestry studies trace African American roots to Senegambia down through Angola — matching the slave ships' own ledgers, kept by men who had no reason to hide Israelites. But let me tell you what I actually think matters more."},{"w":"them","t":"Here it comes — 'race don't matter.' Easy to say when they didn't take YOUR name and YOUR God."},{"w":"you","t":"No — they took the names and gods of my ancestors too, further back; every family tree has chains in it somewhere, and yours has them close and brutal. I'm not waving that away. I'm saying the Bible itself refuses to hang salvation on ancestry: 'not all who are descended from Israel belong to Israel' — Romans 9. John the Baptist told actual, verified sons of Abraham that God could raise up sons from stones. If bloodline couldn't save THEM, the chart can't save anyone. But faith in the Messiah made a eunuch from Africa an heir the same afternoon — Acts 8. That inheritance no lab and no lie can take."}],"law-and-salvation":[{"w":"them","t":"Christ said if you love me, KEEP my commandments. Not 'believe and do nothing.' You have to keep the laws, statutes and commandments — Sabbath, feast days, dietary law. That grace stuff is how Rome put you to sleep."},{"w":"you","t":"I actually respect the seriousness — you've reordered your week, your plate, your clothes around this Book, and most people I know haven't reordered a lunch. So let me ask the question the Book itself asks: how much of the law? Deuteronomy 27:26 — 'Cursed be he that confirmeth not ALL the words of this law to do them.'"},{"w":"them","t":"All of it. We keep it all. That's what the school is for — you learn precept by precept until you're walking in it."},{"w":"you","t":"All 613, every day, from the heart — no lust, no anger, no idol of the mind? Your own bishop can't clear that bar; neither can I. James 2:10 — stumble in one point, guilty of all. That's not me lowering the standard; that's the standard refusing to be graded on a curve. So the law's own math leaves everyone under the curse. Then Galatians 3:13: 'Christ redeemed us from the curse of the law, being made a curse for us.' He kept it all, and then took the sentence."},{"w":"them","t":"Paul. Always Paul. Convenient how the 'curse' got cancelled right when the Gentiles wanted in."},{"w":"you","t":"Then leave Paul aside for a second — take Jesus at Passover: 'this is my blood of the covenant, poured out for MANY for the remission of sins.' Take David: 'Blessed is the man to whom the LORD imputes no iniquity' — Psalm 32, a man under the law throwing himself on mercy. Grace isn't a Gentile invention; it's the oldest song Israel knows. And here's the part nobody at the podium tells you: grace doesn't abolish obedience, it finally makes it possible — the new covenant writes the law on the heart instead of over your head. Come read Hebrews 8 with me and check whether that sounds like Rome or like Jeremiah."}],"race-doctrine":[{"w":"them","t":"Esau is the white man — hairy, red, born fighting Jacob in the womb. Edomites run this world system, and Malachi said it plain: Esau have I HATED."},{"w":"you","t":"Let's find Edom on a map first. Esau's people settled Seir — modern southern Jordan. They were Israel's literal brothers, Semitic like Jacob's line, and by a century before Christ they'd been absorbed into Judea; Herod himself was an Idumean. History knows exactly where Edom went, and it isn't Norway."},{"w":"them","t":"That's the cover story. Obadiah says Esau stood by while his brother was carried off, and handed him over. Who stood on the shore while YOUR people got carried off? Who did the handing over?"},{"w":"you","t":"And there it is — that's the real charge, and I won't dodge it: people who called themselves Christians shipped, sold and whipped image-bearers of God, and painted Jesus white while they did it. That happened. God's word for it is in the Book — Revelation 18 lists trading in 'slaves, that is, souls of men' among Babylon's damning cargo. But notice what Obadiah actually condemns Edom FOR: hating a brother. A doctrine that teaches me to hate a race back doesn't reverse Edom's sin — it re-enlists in it, jersey swapped."},{"w":"them","t":"Easy for you to preach 'no hate' from the winning side. God's got a day coming when the last go first — Isaiah 14, Israel's gonna rule over their oppressors, take THEM captive for a change."},{"w":"you","t":"Read all of Isaiah's ending, though — not just chapter 14's taunt over Babylon. Isaiah 25: a feast on the mountain 'for ALL peoples,' death swallowed up forever. Isaiah 2: nations streaming to Zion to beat swords into plows. The Bible's last picture isn't the plantation with new management — it's the auction block burned down and every nation at one table with the Lamb. I'd rather invite you to that table than win this sidewalk. And Revelation 7:9 says there's a seat there with your name on it — your real one."}],"movement-history":[{"w":"them","t":"This truth ain't new. 1896 — Crowdy was teaching Israelite identity while your church was still segregating its own pews. We PRESERVED this. The church buried it."},{"w":"you","t":"You know your history, and I won't cheapen it — Crowdy founded the Church of God and Saints of Christ in 1896, born enslaved, a Union veteran, and the pew segregation he faced was a scandal against the gospel. Both things can be true: the wound was real, and the medicine still has to be tested against Scripture, not against seniority. Islam is older than 1896; Hinduism's older than both. Old isn't the same as true."},{"w":"them","t":"It ain't just old, it's unbroken. Crowdy to the schools to us. One line, one truth, while y'all split into thirty thousand denominations."},{"w":"you","t":"Gently — that's not the history. The street camps come from Abba Bivens leaving a Harlem congregation in the 1960s to start the school at 1 West 125th. And 1West didn't stay one: IUIC, ISUPK, Great Millstone, Sicarii — camps that excommunicate each other on YouTube weekly. Meanwhile Ben Ammi's people went to Dimona and live peacefully; Rabbi Funnye's congregation talks WITH the Jewish community. So when you invite me to 'Israel,' I have to ask: which one? The invitation splinters exactly like the thing it condemns."},{"w":"them","t":"Camps disagree on doctrine, not identity. Every camp knows WHO we are. Y'all can't even agree on baptism."},{"w":"you","t":"Fair hit on Christian division — it grieves God, and Jesus prayed against it in John 17. But here's the difference I'd stake everything on: Christian unity rests on a Person all the fragments confess — 'Jesus is Lord, raised from the dead.' The camps' unity rests on a chart no verse produces. When Crowdy's own 1896 church still honors Jesus, and Dimona doesn't, and 1West preaches Yahawashi for Israelites only — 'who we are' is exactly what's unresolved. 'Who HE is' is the question that settles identity. Come test that one with me — whole chapters, my kitchen table, any Sabbath evening after sundown."}],"practice":[{"w":"them","t":"You keep Sunday, Christmas and Easter — Babylon, Babylon, Babylon. We keep the Sabbath, the feasts, the dietary laws, the fringes — like the Book says. Who's really following the Bible, me or you?"},{"w":"you","t":"I'll give you this straight: your practice is serious, and I won't pretend Christmas's date came off Moses' desk — it didn't, and Christians honestly debate the holidays among ourselves. So I won't defend a calendar. But can I ask the question underneath the calendar? What are the feasts FOR? What was Passover pointing at, all those centuries?"},{"w":"them","t":"Remembrance and obedience. The Most High said keep it FOREVER — Exodus 12. Forever ain't 'until Rome changes it.'"},{"w":"you","t":"Then follow the lamb through the Book with me. Exodus 12: blood on the doorposts, death passes over. Isaiah 53: a man led 'like a lamb to the slaughter,' wounded for our transgressions. Then John the Baptist sees Jesus: 'Behold the Lamb of God who takes away the sin of the world.' And Paul — a Pharisee who kept more Passovers than both of us combined — writes 'Christ, our Passover, is sacrificed for us.' Colossians 2 calls the feasts 'a shadow of things to come; the substance is Christ.' A shadow is honored, not insulted, when you turn to face what casts it."},{"w":"them","t":"Shadows. That's how y'all delete every commandment you don't feel like keeping. Next you'll tell me the swine is clean."},{"w":"you","t":"No — I'll tell you what Mark 7 says Jesus taught about what defiles, and what the voice told Peter in Acts 10, and you can weigh those texts yourself; you take texts seriously, so take those. But here's my honest bottom line, brother: if you kept every feast, every fringe, every Sabbath perfectly from tonight on, Deuteronomy 27:26 would still be waiting at the end with a curse for the years you didn't. The feasts were never the door — they were the hallway. Hebrews 7 through 10 walks that whole hallway to the door himself. Read those four chapters with me — Friday night, after your sundown, your table or mine. I'll bring food you can eat."}]};
const ABBR=["c","cf","vs","e.g","i.e","etc","Dr","St","Mr","Mrs","ch","pp","v","vv","no","approx","Jr","Sr"];
function splitSentences(raw){
  const tokens=raw.split(/(?<=[.!?])\s+(?=[A-Z0-9"'(‘“])/);
  const merged=[];
  tokens.forEach(t=>{
    if(merged.length){
      const prev=merged[merged.length-1];
      const m=prev.match(/([A-Za-z&.]+)\.$/);
      const w=m?m[1].replace(/\./g,""):null;
      if(w&&ABBR.includes(w)){merged[merged.length-1]=prev+" "+t;return;}
    }
    merged.push(t);
  });
  return merged;
}
const LDSBOOKS="(?:12 Tribes Chart|One West|1WT|IUIC|ISUPK|Great Millstone|Commandment Keepers|Church of God and Saints of Christ)";
const BIBBOOKS="(?:[1-3]\\s)?(?:Genesis|Exodus|Leviticus|Numbers|Deuteronomy|Joshua|Judges|Ruth|Samuel|Kings|Chronicles|Ezra|Nehemiah|Esther|Job|Psalms?|Proverbs|Ecclesiastes|Isaiah|Jeremiah|Lamentations|Ezekiel|Daniel|Hosea|Joel|Amos|Obadiah|Jonah|Micah|Nahum|Habakkuk|Zephaniah|Haggai|Zechariah|Malachi|Matthew|Mark|Luke|John|Acts|Romans|Corinthians|Galatians|Ephesians|Philippians|Colossians|Thessalonians|Timothy|Titus|Philemon|Hebrews|James|Peter|Jude|Revelation)";
const REFNUM="";
const KEYWORDS=/\b(concedes?d?|conceded|disavow(?:s|ed|al)?|undisputed|unfalsifiable|no ancient manuscript|zero ancient witnesses|never recanted|does not match|do not match|no adequate answer|contradict(?:s|ing|ion)?|impossible|no record|officially disavowed)\b/gi;
function emphasize(t){
  t=t.replace(new RegExp("\\b("+LDSBOOKS+REFNUM+")","g"),'<span class="ref-lds">$1</span>');
  t=t.replace(new RegExp("\\b("+BIBBOOKS+"\\s\\d+(?::\\d+(?:[\\-–]\\d+)?(?:,\\s?\\d+(?:[\\-–]\\d+)?)*)?)","g"),m=>m.includes("ref-lds")?m:'<span class="ref-bib">'+m+'</span>');
  t=t.replace(/(^|[\s(—–])'([^'<>]{3,200}?)'(?=$|[\s.,;:)!?—–])/g,'$1<span class="qq">‘$2’</span>');
  t=t.replace(KEYWORDS,'<b class="kw">$1</b>');
  t=t.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/==(.+?)==/g,'<mark>$1</mark>');
  return t;
}
function rich(raw){return glossify(emphasize(esc(raw).replace(/&lt;(\/?)(b|i|em|strong)&gt;/g,"<$1$2>")));}
function paras(raw,per){
  per=per||2;
  const s=splitSentences(raw),ps=[];
  for(let i=0;i<s.length;i+=per)ps.push(s.slice(i,i+per).join(" "));
  return ps.map(p=>`<p>${rich(p)}</p>`).join("");
}
function formatDefense(raw){
  if(/\(\d+\)/.test(raw)){
    const parts=raw.split(/\(\d+\)\s*/);
    const intro=parts.shift().trim();
    return (intro?`<p class="lead">${rich(intro)}</p>`:"")+
      `<ol class="pts">${parts.map(p=>`<li>${rich(p.trim())}</li>`).join("")}</ol>`;
  }
  return paras(raw,2);
}

const GLOSSARY=[{"t":"the 12 Tribes Chart","d":"A chart mapping the twelve tribes onto modern nationalities — Judah to Black Americans, Benjamin to West Indians, and so on. It has no ancient source; it was assembled in the twentieth century."},{"t":"1WT / 'One West'","d":"The One West Camp lineage (from a Harlem address), the doctrinal root of most of the confrontational street camps, including their race eschatology."},{"t":"2 Esdras","d":"An apocryphal apocalypse (also called 4 Ezra) whose chapter 13 describes the ten tribes travelling to a far country called Arzareth. The camps cite it as evidence of a migration; it is not in the Hebrew or Protestant canon, and it is a first-century-AD text, not a historical record."},{"t":"a chiasm","d":"A mirror-image literary structure (A-B-C-B-A) common in Hebrew writing. It appears in these arguments because its presence in a text is sometimes offered as evidence of ancient Semitic authorship."},{"t":"a codex","d":"A book with bound pages, as opposed to a scroll. Christians adopted the codex format remarkably early, which is part of why so many early Christian manuscripts survive."},{"t":"a palimpsest","d":"A manuscript whose original writing was scraped off so the expensive material could be reused. Modern imaging can often recover the erased text underneath — which is how the Sanaa Quran's earlier layer was read."},{"t":"a proof-text","d":"A verse quoted on its own to establish a point, usually detached from what surrounds it. Proof-texting is the single most common way both sides of every argument on this site go wrong."},{"t":"a stele","d":"An upright inscribed stone slab set up to record a victory, a law, or a treaty — one of archaeology's most valuable finds, because it is a dated, deliberate, public record."},{"t":"a textual variant","d":"Any difference between two manuscripts, including a misspelling or a change in word order. The famous 'hundreds of thousands of variants' figure is real and almost entirely trivial; the meaningful and viable ones are well under 1%, and every modern Bible footnotes them."},{"t":"an anachronism","d":"Something appearing in a story before it existed in real life — a horse in a place with no horses, a stirrup centuries too early. Anachronisms are one of the main tools for dating a text, because a writer can only mention the world he lives in."},{"t":"an apologist","d":"Someone who defends a faith's claims — from the Greek <i>apologia</i>, a legal defense. Not an insult, and not the same as an apologizer. This site quotes apologists deliberately: a claim is only worth making if it survives the best defense of it."},{"t":"an ossuary","d":"A limestone box for bones, used in Judea for about a century around the time of Jesus: a body was left to decompose for a year, then the bones were collected into the box. Names carved on ossuaries are how we have physical traces of individuals like the high priest Caiaphas."},{"t":"the apocrypha","d":"Books written between the Testaments (Tobit, Judith, Maccabees and others), included in Catholic and Orthodox Bibles and in the original 1611 KJV, but not in the Hebrew canon or in Protestant Bibles today."},{"t":"Ashkenazi","d":"Jews of central and eastern European descent, as distinct from Sephardi (Iberian) and Mizrahi (Middle Eastern) Jews. Genetic studies consistently show Ashkenazi populations clustering with Middle Eastern rather than Caucasus groups."},{"t":"Ben Ammi & Dimona","d":"Ben Ammi Ben-Israel led a group from Chicago to Liberia in 1967 and then to Dimona, Israel, in 1969. That community — the African Hebrew Israelites of Jerusalem — is vegan, peaceable, and nothing like the street camps."},{"t":"the camps","d":"Street-preaching schools — IUIC, ISUPK, GMS, and others — that teach in public with a podium, uniforms and an amplifier. They are not one organization; they disagree sharply and often bitterly with each other."},{"t":"the canon","d":"The list of books a community accepts as Scripture. The New Testament canon was recognized gradually by usage over the first three centuries rather than voted on at a council — Athanasius's list of 367 AD matches ours exactly."},{"t":"Church of God and Saints of Christ","d":"Founded 1896 by William Saunders Crowdy, a formerly enslaved Union Army veteran — the oldest documented Black Hebrew Israelite body, and still a functioning denomination."},{"t":"Codex Sinaiticus","d":"A complete Greek Bible hand-copied around 330–360 AD, found at St Catherine's Monastery on Mount Sinai in the 1840s. Along with Vaticanus it is one of the two oldest complete Bibles in existence, and its text is essentially the text you read today."},{"t":"Codex Vaticanus","d":"A Greek Bible copied around 300–325 AD, held in the Vatican Library — slightly older than Sinaiticus and, with it, the backbone of modern New Testament textual scholarship."},{"t":"Commandment Keepers","d":"Wentworth Arthur Matthew's Harlem congregation (1919), the strand that moved closest to rabbinic Judaism."},{"t":"the Dead Sea Scrolls","d":"About 900 manuscripts found in caves at Qumran near the Dead Sea between 1947 and 1956, copied roughly 250 BC–70 AD. They pushed our oldest Hebrew Bible manuscripts back a thousand years — and the text matched what had been copied ever since. The single most important manuscript discovery ever made."},{"t":"Deutero-Isaiah","d":"The name critical scholars give to the proposed anonymous author of Isaiah 40–55, writing during the Babylonian exile. See the multi-Isaiah theory."},{"t":"Deuteronomy 28","d":"The covenant curses chapter, and the movement's cornerstone text — especially verse 68, 'the LORD shall bring thee into Egypt again with ships.'"},{"t":"Dimona","d":"A town in Israel's Negev desert, home since 1969 to the African Hebrew Israelites of Jerusalem — a vegan, communal, peaceable group founded by Ben Ammi. They are the clearest proof that this movement is not one thing, and blanket claims about it die here."},{"t":"the Documentary Hypothesis","d":"The critical theory that the first five books of the Bible were woven together from several earlier sources (labelled J, E, D and P) rather than written by Moses. The classic form is now heavily revised even among critical scholars, but some version of it is the mainstream academic position."},{"t":"Edom","d":"In the Hebrew Bible, the nation descended from Esau, Jacob's brother, living south-east of the Dead Sea. In camp teaching Edom is identified with white people — the doctrine that carries the movement's judgment language. The identification has no basis in the text's own geography or in any ancient source."},{"t":"Edomite","d":"In camp teaching, white people — identified as the descendants of Esau. This is the doctrine that carries the movement's judgment language."},{"t":"Esau","d":"Jacob's older twin, who sold his birthright for a meal (Genesis 25). The camps read him as the ancestor of Europeans, partly from the word <i>admoni</i> ('ruddy') used of him — a word the same Scriptures also use of David, whom the camps identify as Black."},{"t":"exegesis","d":"Drawing out what a text actually says, in its own context. Its opposite is eisegesis — reading your conclusion into the text."},{"t":"the Great Isaiah Scroll","d":"The star of the Dead Sea Scrolls: a complete copy of Isaiah, all 66 chapters, copied around 125 BC. It proves Isaiah 53 and its portrait of a pierced, suffering servant existed more than a century before Jesus — nobody added it afterwards."},{"t":"the heathen / the gentile","d":"Everyone outside the twelve tribes. In the strongest camp teaching, the heathen are excluded from salvation or admitted only as servants in the kingdom."},{"t":"ISUPK","d":"Israelite School of Universal Practical Knowledge — the camp behind most viral street-confrontation footage. Its rhetoric on other races is the harshest in the movement."},{"t":"IUIC","d":"Israel United in Christ — the largest and most media-visible camp, founded 2003. Comparatively less confrontational in style than ISUPK, and it does teach Christ."},{"t":"Josephus","d":"Titus Flavius Josephus (c. 37–100 AD), a Jewish general who surrendered to Rome and became its most important historian of first-century Judea. Not a Christian, which is why his mentions of Jesus, James and John the Baptist carry so much weight."},{"t":"the Khazars","d":"A Turkic people of the Caucasus whose elite converted to Judaism around the eighth century. The claim that modern Ashkenazi Jews descend from them, and are therefore 'impostors,' is a twentieth-century theory that population genetics has examined and rejected — Behar's studies specifically sampled the Khazar region."},{"t":"the KJV","d":"The King James Version of 1611, the English Bible of the whole period covered by this site. Its wording matters constantly here: several movements examined on this site were born inside its cadence, and some of them treat it as the only legitimate Bible."},{"t":"Levantine","d":"Of the eastern Mediterranean — Israel, Lebanon, Syria, Jordan. In genetic studies, 'Levantine ancestry' is the marker relevant to any claim of descent from ancient Israel."},{"t":"the Masoretic Text","d":"The standard Hebrew Bible, preserved and vowel-pointed by Jewish scribes called the Masoretes between roughly 600 and 1000 AD. Almost every Old Testament translation is based on it; where it differs from the Septuagint or the Scrolls, that difference is what scholars argue about."},{"t":"the Middle Passage","d":"The ocean crossing of the transatlantic slave trade, in which roughly 12.5 million Africans were shipped and around 1.8 million died at sea. It is the historical reality behind Deuteronomy 28:68 in camp preaching, and it should never be spoken of lightly in these conversations."},{"t":"the Most High / Ahayah","d":"Their preferred name for God, from a reading of the Hebrew of Exodus 3:14. Many camps regard 'God' and 'Lord' as pagan titles."},{"t":"the multi-Isaiah theory","d":"The mainstream critical e for decades a 'Smithsonian statement' was circulated claiming the institution used the Book of Mormon as an archaeological guide. The Smithsonian issued a formal statement denying it, and now sends a standard letter saying its archaeologists see no connection between the New World's archaeology and the book's contents."},{"t":"so-called Negro / so-called Black","d":"Their standard phrase for Black Americans — the point being that 'Black' is a slave-master label imposed over a stolen national identity."},{"t":"the SPLC","d":"The Southern Poverty Law Center, an American legal advocacy organization that publishes a list of hate groups. It lists specific radical Israelite camps. The camps are right that a listing is not a refutation of a doctrine; critics are right that the teaching listed is real."},{"t":"Tacitus","d":"Roman senator and historian (c. 56–120 AD). His hostile mention of 'Christus,' executed by the procurator Pontius Pilate under Tiberius, is the standard non-Christian confirmation of the crucifixion."},{"t":"textual criticism","d":"The scholarly discipline of comparing manuscripts to work out what the original wording was. It is not an attack on Scripture — it is the method that lets us say with confidence what the text said."},{"t":"the transgression","d":"The reason for the curses: Israel's disobedience. In camp preaching, everything that has happened to Black America since 1619 is read as this chapter running its course."},{"t":"waking up","d":"Conversion language: realising you are an Israelite. The opposite is 'sleep' — accepting the identity the slave trade assigned you."},{"t":"Yashaya / Yahawashi","d":"Sacred-name renderings of 'Jesus.' Camps differ; some treat the English name Jesus as a deliberate corruption."}];

const esc=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function hl(text,phrases){let out=esc(text);(phrases||[]).forEach(p=>{const e=esc(p).replace(/[.*+?^${}()|[\]\\]/g,"\\$&");out=out.replace(new RegExp(e,"gi"),m=>"<mark>"+m+"</mark>");});return out;}
function glossify(escapedText){
  if(!glossify._re){
    const ts=GLOSSARY.slice().sort((a,b)=>esc(b.t).length-esc(a.t).length);
    const alts=ts.map(g=>esc(g.t).replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|");
    glossify._re=new RegExp("(?<![\\w-])("+alts+")(?![\\w-])","gi");
    glossify._map={};GLOSSARY.forEach(g=>{glossify._map[esc(g.t).toLowerCase()]=g;});
  }
  const used=glossify.seen||(glossify.seen=new Set());
  let inRef=0;
  return escapedText.replace(/(<[^>]*>)|([^<]+)/g,(m,tag,txt)=>{
    if(tag){
      if(/^<span class="ref-(lds|bib)"/.test(tag))inRef++;
      else if(inRef&&tag.indexOf("</span>")===0)inRef--;
      return tag;
    }
    if(inRef)return txt;
    return txt.replace(glossify._re,w=>{
      const g=glossify._map[w.toLowerCase()];
      if(!g||used.has(g.t))return w;
      used.add(g.t);
      return '<span class="g" tabindex="0">'+w+'<span class="gt"><b>'+esc(g.t)+'</b> — '+g.d+'</span></span>';
    });
  });
}


function findWhy(d,cite){
  const key=cite.replace(/–/g,"-").replace(/\s*\(.*\)\s*/g,"").trim();
  const m=key.match(/^([1-4]?\s?[A-Za-z&; ]+?)\s+(\d+)/);
  const frag=m?(m[1].trim()+" "+m[2]):key;
  const sentences=(d.claim+" "+d.rationale).replace(/–/g,"-").split(/(?<=[.!?])\s+/);
  const hit=sentences.find(s=>s.includes(frag));
  return hit?hit.replace(/-/g,"–"):null;
}

function extUrl(cite){
  const c=cite.replace(/–/g,"-").replace(/\s*\(.*\)\s*/g,"").trim();
  const qm=c.match(/^Quran\s+(\d+):(\d+)/i);
  if(qm)return "https://quran.com/"+qm[1]+"/"+qm[2];
  const qc=c.match(/^Quran\s+(\d+)/i);
  if(qc)return "https://quran.com/"+qc[1];
  const mm=c.match(/^([1-3]?\s?[A-Za-z ]+?)\s+(\d+)/);
  if(mm)return "https://www.biblegateway.com/passage/?search="+encodeURIComponent(c)+"&version=KJV";
  return "https://quran.com/";
}

function plainHtml(d){
  const rt=t=>glossify(emphasize(esc(t).replace(/&lt;(\/?)(b|i)&gt;/g,"<$1$2>")));
  return (d.plain||[]).map(b=>{
    const ss=splitSentences(b.d),ps=[];
    for(let i=0;i<ss.length;i+=2)ps.push("<p>"+rt(ss.slice(i,i+2).join(" "))+"</p>");
    const t=b.t.toLowerCase();
    const kind=b.say?"k-say":/^(the objection|what (you|your|people|they)|how it usually)/.test(t)?"k-them":/(verse|text|chapter|says|passage|record|promise|covenant does)/.test(t)?"k-text":/^how strong|^the rule|don't|do not use/.test(t)?"k-strength":/^why this|^why it|helps you/.test(t)?"k-help":"k-plain";
    const big=/(k-text|k-say)/.test(kind)?" k-big":"";
    return `<div class="pblk${b.say?" say":""}${big}"><div class="plab ${kind}">${esc(b.t)}</div>${ps.join("")}</div>`;
  }).join("");
}

  const sideOf=ch=>ch.closest("[data-side]")?ch.closest("[data-side]").dataset.side:"";
  const buildHtml=(cite,v,side)=>{

      :(!anyHl?' <span class="vcited">— '+esc(v.ref)+'</span>':'');
    const body=v.verses.map(x=>{
      const lit=(x.hl||!anyHl);

      return '<span class="vs'+(lit?" hl":"")+'"><span class="vnum">'+x.v+'</span>'+txt+' </span>';
    }).join("");
    return '<div class="versebox"><div class="vr"><span>'+esc(cite)+ctx+'</span><button data-close>✕ close</button></div><div class="vtext">'+body+'</div><div class="vwhy">'+whyHtml+'</div></div>';
  };
  /* The box opens in place, beside what you pointed at. The old glitch came from it
     opening while the page was scrolling, so the page kept resizing under the cursor.
     Fix: a hover delay, and nothing opens while a scroll is in progress. */
  const openVerse=(ch,pin)=>{
    const box=vbox(); if(!box)return;
    const cite=ch.dataset.cite;
    const host=ch.closest(".pblk, .claim, .defense, .talk, .vbox, .why, .saybox, li, p")
      ||ch.closest(".chips") && ch.closest(".claimside");
    if(host&&host.parentNode&&box.previousElementSibling!==host)host.parentNode.insertBefore(box,host.nextSibling);
    document.querySelectorAll(".chip.open,.chip.peek").forEach(x=>x.classList.remove("open","peek"));
    ch.classList.add(pin?"open":"peek");
    if(pin)pinnedCite=cite;
    box.innerHTML=buildHtml(cite,VERSES[cite],sideOf(ch));
    const cb=box.querySelector("[data-close]");if(cb)cb.addEventListener("click",clearVerse);
    /* the cited verse can sit below three verses of context — bring it into view */
    const inner=box.querySelector(".versebox"),hl=box.querySelector(".vs.hl");
    if(inner&&hl){
      const want=hl.offsetTop-inner.offsetTop-Math.max(0,(inner.clientHeight-hl.offsetHeight)/2);
      inner.scrollTop=Math.max(0,want);
    }
  };
  window.addEventListener("scroll",()=>{scrolling=true;clearTimeout(scrollT);clearTimeout(hoverTimer);
    scrollT=setTimeout(()=>{scrolling=false;},220);},{passive:true});
  /* LIVEREFS: references printed inside prose become openable, like the chips */
  document.querySelectorAll("#main .ref-bib, #main .ref-lds").forEach(r=>{
    const key=r.textContent.replace(/\s+/g," ").trim().replace(/[.,;:]$/,"");
    const hit=VERSES[key]?key:Object.keys(VERSES).find(k=>k.replace(/[\u2013\u2014]/g,"-")===key.replace(/[\u2013\u2014]/g,"-"));
    if(!hit)return;
    r.classList.add("live","chip");r.dataset.cite=hit;
  });
  const canHover=window.matchMedia("(hover:hover)").matches;
  document.querySelectorAll(".chip").forEach(ch=>{
    ch.addEventListener("click",()=>{
      if(ch.dataset.ext){window.open(ch.dataset.ext,"_blank");return;}
      if(pinnedCite===ch.dataset.cite){clearVerse();return;}
      openVerse(ch,true);
    });
    if(!ch.dataset.ext&&canHover){
      ch.addEventListener("mouseenter",()=>{clearTimeout(hoverTimer);
        if(pinnedCite||scrolling)return;
        hoverTimer=setTimeout(()=>{if(!scrolling&&!pinnedCite)openVerse(ch,false);},240);});
      ch.addEventListener("mouseleave",()=>{clearTimeout(hoverTimer);
        if(pinnedCite)return;
        hoverTimer=setTimeout(()=>{if(!pinnedCite)clearVerse();},160);});
    }
  });
  
});
  document.querySelectorAll(".cimg-x").forEach(b=>b.addEventListener("click",e=>{e.stopPropagation();showLightbox(b.dataset.full,b.dataset.cap);}));
  renderNav();renderPreview();
}

/* ---------- glossary ---------- */
function renderGlossary(){
  $("#main").innerHTML=`<div class="viewhead"><h2>Word guide</h2><p>${GLOSSARY.length} terms this subject runs on, in plain English — names, books, sources and technical vocabulary. Every one of them is underlined with a dotted line wherever it appears in a case; hover or tap it there for the definition without leaving the page.</p></div><details class="primer" open><summary>New here? The story in ninety seconds</summary><div class="primerbody"><p><b>The core claim is that Black, Hispanic and Native Americans are the literal descendants of the twelve tribes of Israel</b> — and that the people known as Jews today are not. The argument runs almost entirely through one chapter: <b>Deuteronomy 28</b>, the covenant curses, and especially verse 68, which says the LORD will bring Israel back to Egypt in ships to be sold as slaves. Read as a prophecy of the transatlantic slave trade, the chapter appears to describe African-American history in detail.</p>
    <p>Attached to it is a <b>12 Tribes Chart</b> mapping each tribe onto a modern nationality, and a doctrine identifying <b>Esau</b> and <b>Edom</b> with white people. Salvation, in the strongest camp teaching, is bounded by descent and by law-keeping.</p>
    <p><b>This is not one organization, and that matters enormously.</b> It runs from the Church of God and Saints of Christ — founded in 1896 by William Saunders Crowdy, born enslaved, a Union Army veteran, and still a functioning denomination — through a vegan farming community at <b>Dimona</b> in Israel, to the confrontational street camps of the viral videos. They disagree with each other bitterly. Any argument that treats them as a single thing fails immediately.</p>
    <p>And underneath all of it is a real grievance: the church was largely silent about slavery, and often worse. Names and terms in dotted underline can be hovered anywhere for a definition.</p></div></details>
  <div class="gaccord">${GLOSSARY.map(g=>`<div class="gitem"><b>${esc(g.t)}</b><p>${g.d}</p></div>`).join("")}</div>`;
}

/* ---------- the heart of it ---------- */
function renderCore(){
  const link=id=>byId[id]?`<button class="corelink" data-open="${id}">${esc(byId[id].title)} →</button>`:"";
  $("#main").innerHTML=`<div class="viewhead"><h2>The heart of it: read the whole chapter</h2>
  <p>If you read nothing else on this site, read this page. The Hebrew Israelite case is built almost entirely on one chapter of Deuteronomy — and it is answered by that same chapter, read from verse 1 to the end and on into chapter 30. But it cannot be answered until something else is said first.</p></div><figure class="corehero"><img src="https://commons.wikimedia.org/wiki/Special:FilePath/Brookes%20slave%20ship%2C%20British%20Library%20(cropped).jpg?width=900" loading="lazy" alt=""><figcaption>The Brookes, 1788. This is the history Deuteronomy 28:68 is read against — and the reason the chapter has the force it has.</figcaption></figure>
  <div class="corebox"><h3>1 · Say the true thing first, and mean it</h3>
  <p>People did not join this movement because a chart persuaded them. They joined because they were told, for the first time, that their history was in the Bible and that God had not forgotten what was done to their families — and because the church that could have said that was largely silent about slavery, and in many cases blessed it.</p>
  <p>That grievance is real, and it is <b>not</b> the part to argue with. Say so out loud, early, without a "but": the church owes an apology it has mostly not made. Nothing further you say will be heard until that is on the table.</p>
  <details class="srcdet"><summary>Open the cases behind this</summary><div class="corelinks" style="margin-top:12px">${link("avoid-dismissing-the-longing")}${link("suffering-as-identity-proof")}</div></details></div>

  <div class="corebox"><h3>2 · Deuteronomy 28, from verse 1</h3>
  <p>The chapter is quoted from the middle. Read it from the top and it names its own audience: Moses, at Moab, addressing the covenant nation about the consequences of covenant disobedience. Verse 68 — <i>"the LORD shall bring thee into Egypt again with ships"</i> — is the last of a long list, and "Egypt" is literal Egypt everywhere else in the book.</p>
  <p>Then keep reading. <b>Deuteronomy 30:1–5</b> is the same covenant's own resolution: when the curses come, and you return, God gathers you back. The curses were never a permanent identity — the chapter that pronounces them also ends them.</p>
  <details class="srcdet"><summary>Open the cases behind this</summary><div class="corelinks" style="margin-top:12px">${link("deut-28-68-ships-to-egypt")}${link("deut-28-curses-already-fulfilled")}</div></details></div>

  <div class="corebox"><h3>3 · Suffering is not a genealogy</h3>
  <p>The engine of the movement is an argument that looks like this: <i>the curses describe us, therefore we are the cursed people</i>. But suffering the described consequences does not establish descent. The Armenians, the Irish, the Cambodians and the Rwandans could each read Deuteronomy 28 and find their own century in it — the chapter's power is precisely that it describes what happens to human beings under judgment, not a fingerprint.</p>
  <p>And the chart that assigns tribes to modern nationalities has no ancient source at all. It was assembled in the twentieth century, and when that is pointed out the reply is that the records were destroyed — which is true of the records, and also makes the claim impossible to test in either direction.</p>
  <details class="srcdet"><summary>Open the cases behind this</summary><div class="corelinks" style="margin-top:12px">${link("suffering-as-identity-proof")}${link("twelve-tribes-chart")}</div></details></div>

  <div class="corebox"><h3>4 · The real dividing line is not race — it is the gospel</h3>
  <p>You could concede every genealogical claim on the site and the central question would be untouched: <b>how is a person saved?</b> The camps answer with bloodline and law-keeping. Paul spent his life answering that question the other way — and Galatians was written against exactly this error, running in the opposite direction, when Jewish believers wanted Gentiles kept out.</p>
  <p class="pullq">"If ye be Christ's, then are ye Abraham's seed, and heirs according to the promise." — Galatians 3:29</p>
  <p>Ask the question that has no answer inside the system: <i>if salvation is by keeping the law, are you keeping all of it — and what is the atonement when you fail?</i> There has been no altar since AD 70.</p>
  <details class="srcdet"><summary>Open the cases behind this</summary><div class="corelinks" style="margin-top:12px">${link("law-keeping-salvation")}${link("bloodline-versus-abrahams-offspring-by-faith")}${link("gentile-exclusion-and-race-eschatology")}</div></details></div>

  <div class="corebox"><h3>5 · The dignity they are looking for is already theirs</h3>
  <p>Underneath the chart and the megaphone is a true and God-given hunger: <i>I want to matter in God's story.</i> The answer is not that they don't — it is that in Christ they are not a footnote to Israel but a co-heir with the Messiah, adopted, named, and seated. That is a larger dignity than the chart offers, and it does not depend on a genealogy nobody can produce.</p>
  <p><button class="corelink" data-goto="share">How to actually have this conversation →</button></p></div>`;
  $("#main").querySelectorAll(".corelink").forEach(b=>{if(b.dataset.open)b.addEventListener("click",()=>openCase(b.dataset.open));});
  const g=$("#main").querySelector("[data-goto]");
  if(g)g.addEventListener("click",()=>{state.view="share";render();});
}
function renderShare(){
  $("#main").innerHTML=`<div class="viewhead"><h2>Sharing Jesus with a Hebrew Israelite</h2>
  <p>Not to win a street exchange — those are unwinnable by design — but to reach a person whose grievance is real and whose remedy is not. Concede first, ask second, and never take the bait of the crowd.</p></div>
  <div class="pb-h">The invitation to work toward</div>
  <div class="saybox"><span class="who">You, away from the crowd</span><p>"Would you read Deuteronomy 28 and 30 with me, start to finish, and then Galatians — just us, no podium, no camera?"</p></div>
  <p class="pd" style="font-size:.78rem;margin:0 0 4px">Everything on this site is designed for that conversation and not for the street. Whole chapters, read together, dismantle the chain-of-verses method without your ever having to attack it.</p>

  <div class="pb-h">What actually reaches someone in the camps</div><div class="pb-grid">
  <div class="pb"><span class="num">1</span><h4>Naming what the church got wrong — first, and without a "but"</h4><p>American Christianity was largely silent about slavery and often complicit in it. Say that plainly before you say anything else. Every person in front of you has been told that Christians will deny it or minimize it, and the moment you don't, you have become something they have no category for.</p></div>
  <div class="pb"><span class="num">2</span><h4>Reading whole chapters instead of trading verses</h4><p>The camps teach "precept upon precept" — chains of single lines from across the Bible. The method is the vulnerability. Read Deuteronomy 28 from verse 1, or Isaiah 28 through verse 13, and the chain breaks on its own. You are not arguing against their verses; you are reading around them.</p></div>
  <div class="pb"><span class="num">3</span><h4>One question, then genuine silence</h4><p>"Who is verse 1 addressed to?" "If a white man repents, is he saved?" "What is the atonement when you break the law?" These are not gotchas — each one is a real question with no prepared camp answer, and they work precisely because you stop talking afterwards.</p></div>
  <div class="pb"><span class="num">4</span><h4>Being the Christian who is still around next month</h4><p>Street teaching is a performance space; friendship is not. Almost nobody leaves this movement because of an argument, and almost everybody who leaves has one patient person who kept treating them as a human being rather than as a debate.</p></div>
  </div>

  <div class="pb-h">The method</div><div class="pb-grid">
  <div class="pb do"><h4>Concede the true half, out loud</h4><p>Cheap grace is a real distortion. The church's silence on slavery is a real failure. Replacement theology — the idea that God is finished with Israel — is a real error the New Testament explicitly forbids (Romans 11:1). Grant all three before you contest anything, and you will be arguing with a person instead of a wall.</p></div>
  <div class="pb do"><h4>Distinguish the strands, always</h4><p>The 1896 church, the Dimona community, IUIC and ISUPK are not the same thing and do not like each other. Knowing the difference signals that you did the work — and it quietly makes the point that a "recovered ancient identity" is currently at war with itself over what it is.</p></div>
  <div class="pb do"><h4>Move the conversation off the street</h4><p>A podium, an amplifier, officers and a circle of phones is a stage, and every exchange there is scored by the crowd. Ask for coffee. If the answer is no, that itself tells you the exchange was never about the question.</p></div>
  <div class="pb dont"><h4>Don't fight about skin color</h4><p>The historical Jesus was a first-century Judean and did not look like a European painting — that much is simply true, and defending the painting makes you the caricature they preach about. It is also not the argument. Concede the point and go to whether he is the Messiah.</p></div>
  <div class="pb dont"><h4>Don't call the movement a hate group</h4><p>It is factually wrong as a blanket claim — it sweeps in a peaceable Israeli farming village and a 130-year-old denomination — and it ends the conversation instantly. Name a specific teaching if you must name something; never the whole movement.</p></div>
  <div class="pb dont"><h4>Don't bring the viral clip</h4><p>Confrontation footage ages badly, gets re-cut, and tells your listener only which outlet you watch. It trades a durable argument from the text for a perishable one from the news cycle.</p></div>
  </div>

  <div class="pb-h" style="margin-top:34px">How it actually goes — the deeper craft</div>
  <p class="sh-open">People do not join because the chart is <span class="hl">academically compelling</span>. They join because someone finally told them their history was in the Bible.</p>
  <p class="sh-att">— the thing to answer, and the thing never to mock</p>

  <div class="sa"><h4 class="sat">The four questions that do the most work</h4>
  <ol class="sh-list">
    <li><b style="color:var(--ink)">"Who is Deuteronomy 28:1 addressed to?"</b> Ask them to read it aloud. The chapter names its own audience, and the whole edifice is built on quoting it from the middle.</li>
    <li><b style="color:var(--ink)">"What does Deuteronomy 30 say happens after the curses?"</b> The same covenant that pronounces them promises the gathering back. The curses were never designed to be a permanent identity.</li>
    <li><b style="color:var(--ink)">"If salvation is by keeping the law, what is the atonement when you fail?"</b> There has been no altar since AD 70. This question has no answer inside the system, and it is the one that reaches people.</li>
    <li><b style="color:var(--ink)">"If a white man repents and believes, is he saved?"</b> Ask it gently. The answers differ camp to camp, and the disagreement inside the movement makes the point better than you can.</li>
  </ol></div>

  <div class="sa"><h4 class="sat">Start here</h4>
  <p class="pd">The <b>identity path</b> walks the one chapter everything else depends on; every case page ends with a suggested question and a scripted back-and-forth ("How the conversation usually goes") so you are ready for the counter-moves.</p>
  <button class="start" data-goto-path="identity">Open the identity path →</button></div>${DATA.some(d=>d.avoid)?`<div class="pb-h" style="margin-top:30px">Arguments that will embarrass you — do not use these</div><p class="pd" style="font-size:.8rem;margin:0 0 10px">Popular claims that are false or overclaimed. Each links to the correction — repeating them hands the other side an easy win and discredits your true arguments.</p><div class="relrow">${DATA.filter(d=>d.avoid).map(d=>`<button data-open="${d.id}">⚠ ${esc(d.title)}</button>`).join("")}</div>`:""}`;
  const b=$("#main").querySelector("[data-goto-path]");
  if(b)b.addEventListener("click",()=>{const p=PATHS.find(x=>x.id===b.dataset.gotoPath);if(!p)return;state.pathId=p.id;const read=store.read;const next=p.items.find(i=>!read.has(i))||p.items[0];openCase(next,true);});
  bindOpens();
}

const PROOFS=[{"v":"Deuteronomy 28:68","they":"'The LORD shall bring thee into Egypt again with ships… and there ye shall be sold… and no man shall buy you.' Egypt means bondage generally; ships mean the Middle Passage; this is the prophecy of the trans-Atlantic slave trade, so Black Americans are the Israel of this chapter.","you":"Read verses 15 and 58 first: these curses fall on the covenant nation for breaking the covenant God made at Sinai — the chapter's 'you' is the people who stood at Moab. The destination is Egypt, and 'again' points back to the exodus. And the last clause runs opposite to the Atlantic trade: 'no man shall buy you' describes a slave market with no buyers — utter worthlessness — while the Middle Passage ran on buyers. Josephus records a literal fulfillment: after Jerusalem fell in AD 70, Rome shipped captives to the Egyptian mines (Wars 6.9.2). Most of all: the chapter is not the end of the story. Deuteronomy 30 promises restoration when hearts return to the LORD — the very heart-circumcision the New Covenant delivers (Deut 30:6; Jer 31:31-34).","refs":"Deut 28:15, 58, 68 · Deut 30:1-6 · Josephus, Wars 6.9.2 · Jer 31:31-34 · Gal 3:13"},{"v":"Revelation 1:14-15","they":"Hair like wool, feet like burnt brass 'as if they burned in a furnace' — that's an Afro and dark skin. The white Jesus is a Renaissance forgery; John saw a Black Messiah.","you":"On the forgery point, agree: European portraiture made Jesus look Dutch, and that deserves the critique. But read the verse whole: the hair is 'WHITE like wool, white as snow' — wool supplies the whiteness, exactly as in Daniel 7:9 where the Ancient of Days has hair 'like pure wool.' The feet are like bronze glowing in a furnace — molten, radiant metal — and two verses on, his face is 'like the sun shining in full strength.' No complexion glows like a furnace. This is theophany-glory, and John's response settles the genre: 'I fell at his feet as though dead.' The historical Jesus was a brown-skinned Judean of Middle Eastern appearance — neither the blond of the paintings nor a proof-text for anyone's chart.","refs":"Rev 1:12-17 · Dan 7:9 · Dan 10:5-6 · Ezek 1:26-28"},{"v":"Daniel 7:9","they":"The Ancient of Days has hair 'like the pure wool' — the heavenly court is Black; wool hair is African hair.","you":"Follow the logic where it goes: the Ancient of Days here is God the Father figure enthroned — so on this reading the text is assigning ethnicity to the eternal God, whom 'no one has ever seen' (John 1:18) and who is spirit (John 4:24). The vision's own accents are whiteness and fire: garment 'white as snow,' hair like pure wool, throne of flames. Wool in both testaments is the Bible's standard image for whiteness — 'though your sins be as scarlet… they shall be as wool' (Isa 1:18). Apocalyptic visions communicate holiness, purity and unapproachable glory, not demographics.","refs":"Dan 7:9-10 · Isa 1:18 · John 4:24 · 1 Tim 6:16"},{"v":"Song of Solomon 1:5","they":"'I am black, but comely, O ye daughters of Jerusalem' — the Bible's own voice declaring Israelites are Black people.","you":"Read verse 6, where she explains herself: 'Look not upon me, because I am black, because the SUN hath looked upon me… they made me the keeper of the vineyards.' She is describing a field-worker's deep tan, and asking the pale city women not to look down on her for it — a class contrast inside the same people, in a love poem. If anything, the exchange assumes the daughters of Jerusalem were lighter-skinned than a sunburned vineyard girl. Ancient Israelites were Levantine people with the range of brown skin that region still has; this verse is neither embarrassed by dark skin nor a racial census.","refs":"Song 1:5-6 · Lam 4:7-8 (complexion as poetry, not ethnology)"},{"v":"Zephaniah 3:10","they":"'From beyond the rivers of Ethiopia my suppliants, even the daughter of my dispersed, shall bring mine offering' — the scattered Israelites are in Africa, beyond Cush. That's the trans-Atlantic diaspora.","you":"The verse before it gives the frame: 'then will I turn to the PEOPLES a pure language, that they may all call upon the name of the LORD' (3:9) — this is the great ingathering, worship streaming to God from the farthest horizon a Judean could name. 'Beyond the rivers of Cush' is the idiom for the ends of the earth (cf. Isa 18:1). And notice how the New Testament shows it beginning: an Ethiopian official reading Isaiah on the Gaza road, baptized by Philip (Acts 8) — Africa was in the story from the church's first decade, by grace, not by chart. The verse promises distant worshipers brought near, which is exactly what the gospel does for every nation (Eph 2:13).","refs":"Zeph 3:9-10 · Isa 18:1, 7 · Acts 8:26-39 · Eph 2:13"},{"v":"James 1:1","they":"'To the twelve tribes which are scattered abroad' — the tribes were still scattered in bondage, and James is writing to us, the tribes lost in the Americas.","you":"James wrote in the mid-first century to Jewish believers dispersed across the Greco-Roman world — a diaspora everyone could locate: Acts 2:5-11 lists its nations ('Parthians, Medes, Elamites… Egypt… Rome'), and Paul found its synagogues in every city he entered. Sixteen centuries separate this letter from 1619; you cannot re-address someone else's mail. And note the letter's first identification: James, 'a servant of God and of the Lord Jesus Christ,' writing to those who 'hold the faith of our Lord Jesus Christ, the Lord of glory' (2:1) — the scattered tribes he greets are defined by faith in Jesus, which is precisely the identity offered to everyone.","refs":"James 1:1; 2:1 · Acts 2:5-11 · 1 Pet 1:1 · Gal 3:26-29"},{"v":"Acts 21:38","they":"The Roman captain mistook Paul for an Egyptian — you can't mistake a white man for an Egyptian. The apostles looked African.","you":"Read the next verse: the confusion ends the moment Paul speaks — 'I am a Jew from Tarsus' (21:39). The tribune wasn't studying Paul's complexion; he assumed this riot-center must be a known fugitive, the Egyptian insurrectionist Josephus also mentions. First-century Egyptians and Judeans were both eastern-Mediterranean peoples — brown-skinned neighbors, plausibly confusable, which actually agrees with the mainstream picture: Jesus and the apostles were Middle Eastern men, not northern Europeans. That's a fair correction of the paintings; it isn't a twelve-tribes chart.","refs":"Acts 21:37-39 · Josephus, Wars 2.13.5 · Antiquities 20.8.6"}];
