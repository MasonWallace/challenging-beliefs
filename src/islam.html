<title>Challenging Beliefs — Islam, Examined Against the Bible</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --bg:#0f1116; --side:#0b0d11; --panel:#161a21; --panel2:#12151b; --line:#232833; --line2:#2b313d;
    --ink:#e7e9ec; --muted:#98a0ac; --dim:#565e6b; --gold:#82b1d8; --gold-ink:#0e1116;
    --red:#e0736a; --red-bg:#38221f; --red-cell:#5e2b27; --red-cell-hi:#8a3a32;
    --amber:#cf9a45; --amber-bg:#332a18; --amber-cell:#54431f; --amber-cell-hi:#7d6224;
    --green:#7fb08d; --green-bg:#1d2c26; --green-cell:#27443a;
    --purp:#b394e0; --purp-bg:#2c2440;
    --teal:#6cb6ad; --teal-bg:#16302e;
    --serif:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif;
    --sans:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    --acc:var(--gold);
    --acc2:var(--purp);
    --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  }
  :root[data-theme="light"]{
    --bg:#f3f4f6; --side:#e9ebee; --panel:#ffffff; --panel2:#f7f8fa; --line:#dfe2e7; --line2:#cfd4db;
    --ink:#1b1e23; --muted:#5c6470; --dim:#9aa1ab; --gold:#2f6b9e; --gold-ink:#ffffff;
    --red:#b03a31; --red-bg:#f6e4e2; --red-cell:#e7b6b1; --red-cell-hi:#cc766d;
    --amber:#8a5f0e; --amber-bg:#f3ecd9; --amber-cell:#e4d1a2; --amber-cell-hi:#c6a75e;
    --green:#3e7455; --green-bg:#e3ede6; --green-cell:#b7d1bf;
    --purp:#6b4fa1; --purp-bg:#ece5f6;
    --teal:#26706a; --teal-bg:#e0eeec;
  }
  *{box-sizing:border-box}
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6}
  a{color:var(--gold)}
  button{font-family:inherit}
  mark{background:color-mix(in srgb,var(--amber) 30%,transparent);color:inherit;border-radius:2px;padding:0 2px}
  kbd{font-family:var(--mono);font-size:.72rem;background:var(--panel);border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;padding:1px 6px;color:var(--muted)}

  .app{display:grid;grid-template-columns:216px minmax(0,1fr) 280px;min-height:100vh}
  @media (max-width:1020px){.app{grid-template-columns:216px minmax(0,1fr)}.preview{display:none}}
  @media (max-width:720px){.app{grid-template-columns:1fr}.side{position:sticky;top:0;z-index:40;height:auto;border-right:0;border-bottom:1px solid var(--line)}
    .side .nav{display:flex;flex-wrap:wrap;gap:2px;padding:0 10px 10px}.side .nav h5{display:none}.side .sideprog{display:none}}

  /* sidebar */
  .side{background:var(--side);border-right:1px solid var(--line);padding:18px 0;position:sticky;top:0;height:100vh;overflow-y:auto}
  @media (max-width:720px){.side{height:auto;overflow:visible}}
  .logo{font-family:var(--serif);font-size:1rem;letter-spacing:.1em;padding:0 18px 14px;color:var(--ink)}
  .logo b{color:var(--gold)}
  .sidesearch{padding:0 14px 12px}
  .sidesearch input{width:100%;font-family:inherit;font-size:.82rem;padding:7px 12px;border-radius:8px;border:1px solid var(--line2);background:var(--panel);color:var(--ink)}
  .sidesearch input:focus{outline:2px solid var(--gold);outline-offset:1px}
  .info{display:inline-grid;place-items:center;width:14px;height:14px;border:1px solid currentColor;border-radius:50%;font-size:.58rem;font-style:normal;font-weight:700;opacity:.75;cursor:help;position:relative;flex:none}
  .info:hover,.info:focus{opacity:1}
  .info .tip{display:none;position:absolute;left:50%;transform:translateX(-50%);top:160%;width:250px;background:var(--side);color:var(--ink);border:1px solid var(--line2);font-family:var(--sans);font-size:.76rem;line-height:1.5;padding:9px 12px;border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.35);z-index:30;text-transform:none;letter-spacing:0;font-weight:400;text-align:left}
  .info:hover .tip,.info:focus .tip{display:block}
  .badge,.tag{display:inline-flex;align-items:center;gap:5px}
  .nav a{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 18px;font-size:.86rem;color:var(--muted);text-decoration:none;cursor:pointer;border-left:2px solid transparent}
  .nav a:hover{background:var(--panel2);color:var(--ink)}
  .nav a.on{background:var(--panel);color:var(--ink);border-left-color:var(--gold)}
  .nav .cnt{font-family:var(--mono);font-size:.68rem;color:var(--dim)}
  .nav h5{font-size:.64rem;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin:18px 18px 6px;font-weight:600}
  .sideprog{margin:22px 18px 8px;font-size:.72rem;color:var(--muted)}
  .pbar{height:4px;background:var(--line);border-radius:2px;margin-top:6px;overflow:hidden}
  .pbar i{display:block;height:100%;background:var(--gold);transition:width .4s ease}

  /* main */
  .main{padding:18px 26px 80px;min-width:0}
  .cmd{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line2);border-radius:8px;padding:4px 8px 4px 14px;margin-bottom:18px}
  .cmd input{flex:1;background:none;border:0;color:var(--ink);font-family:inherit;font-size:.9rem;padding:7px 0;outline:none}
  .cmd input::placeholder{color:var(--dim)}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:20px}
  .tile{background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:12px 14px;cursor:pointer;text-align:left;color:var(--ink)}
  .tile:hover{border-color:var(--gold)}
  .tile.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
  .tile .v{font-family:var(--serif);font-size:1.7rem;font-variant-numeric:tabular-nums;line-height:1.1}
  .tile .l{font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:2px}
  .tile.t-ad .v{color:var(--purp)}.tile.t-un .v{color:var(--red)}.tile.t-co .v{color:var(--amber)}.tile.t-an .v{color:var(--green)}
  h4.bt{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;font-weight:600}
  .vwall{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:10px;align-items:start}
  @media (max-width:1240px){.vwall{grid-template-columns:1fr 1fr}}
  @media (max-width:700px){.vwall{grid-template-columns:1fr}}
  .vcol{background:var(--panel2);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .vcol header{padding:14px 16px 12px;border-bottom:2px solid var(--line)}
  .vcol.ad header{border-bottom-color:var(--purp)}
  .vcol.ad .n,.vcol.ad .t{color:var(--purp)}
  .vcol.ad .vt:hover{border-left-color:var(--purp)}
  .vcol.un header{border-bottom-color:var(--red)}
  .vcol.co header{border-bottom-color:var(--amber)}
  .vcol.an header{border-bottom-color:var(--dim)}
  .vcol header .n{font-family:var(--serif);font-size:1.9rem;line-height:1;font-variant-numeric:tabular-nums}
  .vcol.un .n{color:var(--red)}.vcol.co .n{color:var(--amber)}.vcol.an .n{color:var(--muted)}
  .vcol.an .t{color:var(--muted)}
  .vcol header .t{font-size:.72rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;margin-left:8px}
  .vcol.un .t{color:var(--red)}.vcol.co .t{color:var(--amber)}.vcol.an .t{color:var(--green)}
  .vcol header .d{font-size:.74rem;color:var(--muted);margin-top:4px}
  /* Option B: the four bands run down the page, five cases each */
  .vwall.vstack{display:block;max-width:none}
  .vwall.vstack .vcol{margin:0 0 16px}
  .vwall.vstack .vcol header{padding:16px 18px 14px}
  .vwall.vstack .vcol header .n{font-size:2.1rem}
  .vwall.vstack .vcol header .t{font-size:.8rem;letter-spacing:.12em}
  .vwall.vstack .vcol header .d{font-size:.86rem;margin-top:6px;max-width:70ch;line-height:1.55}
  .vwall.vstack .vt{padding:11px 18px 11px 15px}
  .vwall.vstack .vt h5{font-size:.99rem}
  /* a picture beside every claim; a letter block where no image exists yet */
  .vwall.vstack .vt{display:flex;gap:14px;align-items:center;padding:10px 18px 10px 15px}
  .vth{width:62px;height:46px;flex:0 0 62px;border-radius:7px;object-fit:cover;border:1px solid var(--line2);background:var(--panel)}
  .vth.ph{display:grid;place-items:center;color:var(--dim);font-family:var(--serif);font-size:1.15rem}
  .vtx{display:block;min-width:0;flex:1}
  .vwall.vstack .vt .h5{font-family:var(--serif);font-weight:500;font-size:1.02rem;line-height:1.35;display:block}
  /* the genuinely striking ones carry more weight on the page */
  .vwall.vstack .vt.wow .h5{font-size:1.32rem;line-height:1.28}
  .vwall.vstack .vt.wow .vth{width:78px;height:58px;flex-basis:78px}
  @media (max-width:620px){.vwall.vstack .vt.wow .h5{font-size:1.12rem}}
  .showall{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);
    padding:11px 18px;cursor:pointer;color:var(--gold);font-family:inherit;font-size:.83rem;font-weight:600;letter-spacing:.02em}
  .showall:hover{background:color-mix(in srgb,var(--gold) 8%,transparent)}
  .vgroup h6{font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:0;padding:10px 16px 4px;font-weight:600}
  .vt{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:9px 16px 9px 13px;cursor:pointer;color:var(--ink);border-left:3px solid transparent}
  .vt:hover,.vt.sel{background:var(--panel)}
  .vt.sel{border-left-color:var(--gold)}
  .vcol.un .vt:hover{border-left-color:var(--red)}
  .vcol.co .vt:hover{border-left-color:var(--amber)}
  .vcol.an .vt:hover{border-left-color:var(--green)}
  .vt.dimmed{opacity:.25}
  .vt h5{font-family:var(--serif);font-weight:500;font-size:.92rem;line-height:1.35;margin:0}
  .vt .m{font-size:.66rem;color:var(--dim);letter-spacing:.05em;text-transform:uppercase;margin-top:2px;display:flex;gap:8px;align-items:center}
  .vt .m .rd{color:var(--green)}
  .vt .m .star{color:var(--gold)}

  /* list */
  .rows{display:flex;flex-direction:column}
  .rowitem{display:grid;grid-template-columns:12px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:11px 6px;cursor:pointer;color:var(--ink)}
  .rowitem:hover,.rowitem.sel{background:var(--panel2)}
  .rowitem .stripe{width:4px;height:26px;border-radius:2px}
  .rowitem.v-unrefuted .stripe{background:var(--red)}
  .rowitem.v-contested .stripe{background:var(--amber)}
  .rowitem.v-answered .stripe{background:var(--green)}
  .rowitem h5{font-family:var(--serif);font-weight:500;font-size:1rem;margin:0;line-height:1.35}
  .rowitem .sub{font-size:.72rem;color:var(--muted)}
  .rowitem .meta{display:flex;gap:8px;align-items:center;font-size:.66rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;white-space:nowrap}
  .rowitem .meta .rd{color:var(--green)}

  .badge{font-size:.64rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:3px 9px;border-radius:999px;display:inline-block}
  .badge.v-admitted{background:var(--purp-bg);color:var(--purp)}
  .badge.v-unrefuted{background:var(--red-bg);color:var(--red)}
  .badge.v-contested{background:var(--amber-bg);color:var(--amber)}
  .badge.v-answered{background:var(--green-bg);color:var(--green)}
  .tag{font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line2);border-radius:999px;padding:2px 9px;display:inline-block}

  /* case view */
  .backbar{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
  .backbar button.bk{background:var(--panel);border:1px solid var(--line2);color:var(--muted);border-radius:8px;padding:6px 13px;font-size:.8rem;cursor:pointer}
  .backbar button.bk:hover{color:var(--ink);border-color:var(--gold)}
  .pathnext{margin-left:auto;background:var(--gold);color:var(--gold-ink);border:0;border-radius:8px;padding:7px 14px;font-size:.8rem;font-weight:700;cursor:pointer}
  .case h2{font-family:var(--serif);font-weight:500;font-size:1.6rem;line-height:1.25;margin:10px 0 14px;max-width:30ch;text-wrap:balance}
  .case .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
  .dlab{font-size:.92rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink);margin:28px 0 11px;line-height:1.35}
  .dlab.red{color:var(--red)}.dlab.blue{color:var(--gold)}
  .claimrow{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(270px,1fr);gap:28px;align-items:start}
  .claimrow.solo{grid-template-columns:1fr}
  @media (max-width:900px){.claimrow{grid-template-columns:1fr}}
  .claim p{font-size:.97rem;line-height:1.75;max-width:66ch;margin:0 0 12px}
  .claimside{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:16px 18px;position:sticky;top:16px}
  .claimside .passcols{grid-template-columns:1fr;gap:12px}
  .claimside .sidenote{font-size:.76rem;color:var(--dim);margin:-4px 0 12px}
  .defense p.lead{margin:0 0 4px}
  .defense p{line-height:1.7;margin:0 0 10px}
  .pts{margin:8px 0 0;padding:0;list-style:none;counter-reset:pt}
  .pts li{position:relative;padding:10px 0 10px 36px;border-top:1px dashed color-mix(in srgb,var(--green) 25%,var(--line));line-height:1.7}
  .pts li:first-child{border-top:0}
  .pts li::before{counter-increment:pt;content:counter(pt);position:absolute;left:0;top:10px;width:23px;height:23px;border-radius:50%;background:var(--green-bg);color:var(--green);display:grid;place-items:center;font-size:.72rem;font-weight:700}
  .vbox p{margin:0 0 8px;line-height:1.7}
  .vbox p:last-child{margin-bottom:0}
  .ref-lds{color:var(--red);font-weight:600}
  .ref-bib{color:var(--gold);font-weight:600}
  .qq{font-family:var(--serif);font-style:italic;background:color-mix(in srgb,var(--amber) 16%,transparent);border-radius:3px;padding:0 3px}
  .kw{font-weight:700;text-decoration:underline;text-underline-offset:2px}
  .talk{background:color-mix(in srgb,var(--green) 8%,var(--panel));border:1px solid color-mix(in srgb,var(--green) 30%,var(--line));border-radius:8px;padding:16px 18px;font-size:.93rem;max-width:80ch}
  .talk p{margin:0 0 8px;line-height:1.7}
  .talk p:last-child{margin-bottom:0}
  .dlg{display:flex;flex-direction:column;gap:10px;max-width:76ch}
  .dlg .msg{border-radius:12px;padding:12px 16px;max-width:88%}
  .dlg .msg p{margin:0;font-size:.9rem;line-height:1.65}
  .dlg .who{display:block;font-size:.64rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin-bottom:4px}
  .dlg .them{align-self:flex-start;background:var(--panel);border:1px solid var(--line2);border-bottom-left-radius:4px}
  .dlg .them .who{color:var(--red)}
  .dlg .you{align-self:flex-end;background:color-mix(in srgb,var(--green) 9%,var(--panel));border:1px solid color-mix(in srgb,var(--green) 30%,var(--line));border-bottom-right-radius:4px}
  .dlg .you .who{color:var(--green)}
  .corelinks{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .corelink{font-size:.78rem;background:var(--panel2);border:1px solid var(--line2);color:var(--gold);border-radius:999px;padding:5px 13px;cursor:pointer;text-align:left}
  .corelink:hover{border-color:var(--gold)}
  .gtab{width:100%;border-collapse:collapse;font-size:.86rem;margin:14px 0 6px}
  .gtab th{text-align:left;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:8px 12px;border-bottom:2px solid var(--line2)}
  .gtab th:nth-child(2){color:var(--red)}
  .gtab th:nth-child(3){color:var(--gold)}
  .gtab td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.55}
  .gtab td:first-child{font-weight:700;white-space:nowrap;color:var(--muted)}
  .dodont{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media (max-width:700px){.dodont{grid-template-columns:1fr}}
  .dodont ul{margin:8px 0 0;padding-left:18px;font-size:.86rem;color:var(--muted)}
  .dodont li{padding:3px 0;line-height:1.55}
  .why{background:color-mix(in srgb,var(--gold) 7%,var(--panel));border:1px solid color-mix(in srgb,var(--gold) 28%,var(--line));border-radius:8px;padding:16px 18px;font-size:.93rem;max-width:80ch}
  .why p{margin:0 0 10px;line-height:1.7}
  .why .wtail{color:var(--muted);font-style:italic;margin-bottom:0;border-top:1px dashed color-mix(in srgb,var(--gold) 30%,var(--line));padding-top:10px}
  .compare2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media (max-width:760px){.compare2{grid-template-columns:1fr}}
  .pane{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
  .pane .ref{font-size:.7rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
  .pane.bom .ref{color:var(--red)}.pane.bible .ref{color:var(--gold)}
  .pane .scripture{font-family:var(--serif);font-size:1rem;line-height:1.65}
  .cnote{font-size:.8rem;color:var(--muted);margin-top:8px;max-width:80ch}
  .passcols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  /* a reference with a reason attached needs the full width, so drop to one column */
  .passcols:has(.rrow){grid-template-columns:1fr;gap:18px}
  .chips:has(.rrow){display:block}
  .rrow{display:flex;gap:10px;align-items:baseline;padding:7px 0;border-top:1px solid var(--line)}
  .rrow:first-child{border-top:none;padding-top:1px}
  .rrow .chip{flex:0 0 auto}
  .rwhy{font-size:.83rem;line-height:1.55;color:color-mix(in srgb,var(--ink) 86%,var(--muted))}
  .rwhy b{color:var(--gold);font-weight:600}
  .claimside .rrow{flex-direction:column;gap:5px;align-items:flex-start}
  @media (max-width:620px){.rrow{flex-direction:column;gap:5px;align-items:flex-start}}
  @media (max-width:760px){.passcols{grid-template-columns:1fr}}
  .passcols h6{font-size:.68rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin:0 0 8px}
  .passcols .h-bom{color:var(--red)}.passcols .h-bib{color:var(--gold)}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{font-size:.78rem;font-family:var(--serif);border:1px solid var(--line2);background:var(--panel);border-radius:6px;padding:4px 10px;cursor:pointer;color:var(--ink)}
  .chip:hover{border-color:var(--gold)}
  .chip.open{background:var(--amber-bg);border-color:var(--gold)}
  .chip.ext::after{content:" ↗";color:var(--muted);font-family:var(--sans);font-size:.68rem}
  .versebox{grid-column:1/-1;background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:8px;padding:14px 18px;margin-top:4px}
  .versebox .vr{font-size:.7rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-bottom:8px;display:flex;justify-content:space-between}
  .versebox .vr button{background:none;border:0;color:var(--muted);cursor:pointer;font-size:.8rem}
  .versebox .vtext{font-family:var(--serif);font-size:.98rem;line-height:1.7;max-width:72ch}
  .versebox .vnum{font-family:var(--sans);font-size:.62rem;color:var(--muted);vertical-align:super;margin-right:3px}
  .versebox .vwhy{margin-top:10px;font-size:.8rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px;max-width:76ch}
  .versebox .vwhy b{color:var(--gold)}
  .srcdet{margin-top:30px;border-top:1px solid var(--line);padding-top:14px}
  .srcdet summary{font-size:.74rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);cursor:pointer;list-style:none}
  .srcdet summary::before{content:"▸ ";color:var(--gold)}
  .srcdet[open] summary::before{content:"▾ "}
  .srcdet .srcs{margin-top:12px}
  .app.reading{grid-template-columns:216px minmax(0,1fr)}
  .app.reading .preview{display:none}
  body:has(.app.reading) .keysbar{right:0}
  .srcs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
  .srcs li{display:flex;gap:9px;align-items:baseline;font-size:.85rem}

function splitSentences(raw){
  const tokens=raw.split(/(?<=[.!?])\s+(?=[A-Z0-9"'(‘“])/);
  const merged=[];
  tokens.forEach(t=>{
    if(merged.length){
      const prev=merged[merged.length-1];
      const m=prev.match(/([A-Za-z&.]+)\.$/);
      const w=m?m[1].replace(/\./g,""):null;
      if(w&&ABBR.includes(w)){merged[merged.length-1]=prev+" "+t;return;}
    }
    merged.push(t);
  });
  return merged;
}

const GLOSSARY=[{"t":"a chiasm","d":"A mirror-image literary structure (A-B-C-B-A) common in Hebrew writing. It appears in these arguments because its presence in a text is sometimes offered as evidence of ancient Semitic authorship."},{"t":"a codex","d":"A book with bound pages, as opposed to a scroll. Christians adopted the codex format remarkably early, which is part of why so many early Christian manuscripts survive."},{"t":"a hadith","d":"A report of something Muhammad said, did, or approved. Hadith are the source of most Islamic practice — the Quran does not explain how to pray five times a day. Each is transmitted with a chain of narrators and is graded for reliability."},{"t":"a palimpsest","d":"A manuscript whose original writing was scraped off so the expensive material could be reused. Modern imaging can often recover the erased text underneath — which is how the Sanaa Quran's earlier layer was read."},{"t":"a proof-text","d":"A verse quoted on its own to establish a point, usually detached from what surrounds it. Proof-texting is the single most common way both sides of every argument on this site go wrong."},{"t":"a stele","d":"An upright inscribed stone slab set up to record a victory, a law, or a treaty — one of archaeology's most valuable finds, because it is a dated, deliberate, public record."},{"t":"a surah","d":"A chapter of the Quran. There are 114, arranged roughly longest to shortest rather than chronologically — which is why reading the Quran front to back gives no sense of the order in which anything was revealed."},{"t":"a textual variant","d":"Any difference between two manuscripts, including a misspelling or a change in word order. The famous 'hundreds of thousands of variants' figure is real and almost entirely trivial; the meaningful and viable ones are well under 1%, and every modern Bible footnotes them."},{"t":"abrogation","d":"Naskh — the doctrine, grounded in Quran 2:106, that a later revelation can cancel an earlier one. It is how peaceful early Meccan verses are reconciled with later Medinan ones, and it means a verse quoted at you may be one Islamic scholarship regards as abrogated."},{"t":"ahruf / qira'at","d":"The 'seven modes' in which the Quran was said to be revealed, and the canonical reading-traditions (Hafs, Warsh…) printed today — the framework Muslim scholarship uses to explain variant readings as all divinely revealed."},{"t":"Aisha","d":"Muhammad's youngest and favourite wife, daughter of Abu Bakr. She is one of the most prolific hadith narrators in Islam, and Sahih al-Bukhari records that she was six at the marriage contract and nine at its consummation — a fact reported in Islam's own most authoritative sources rather than alleged by critics."},{"t":"al-Tabari","d":"Muhammad ibn Jarir al-Tabari (839–923), the great early historian and commentator. His <i>History</i> and his tafsir are the earliest detailed sources for many events in Muhammad's life, including several that later writers omit."},{"t":"alhamdulillah","d":"'Praise be to God' — the response to 'how are you,' good news, and sneezes. Gratitude formula woven through everyday speech."},{"t":"Allah","d":"The Arabic word for God, used by Arabic-speaking Christians for God long before Islam — it is not a separate name for a separate deity, and arguments built on the word itself go nowhere. The real question is what is claimed about him."},{"t":"an anachronism","d":"Something appearing in a story before it existed in real life — a horse in a place with no horses, a stirrup centuries too early. Anachronisms are one of the main tools for dating a text, because a writer can only mention the world he lives in."},{"t":"an apologist","d":"Someone who defends a faith's claims — from the Greek <i>apologia</i>, a legal defense. Not an insult, and not the same as an apologizer. This site quotes apologists deliberately: a claim is only worth making if it survives the best defense of it."},{"t":"an ayah","d":"A verse of the Quran; the word also means 'sign' or 'miracle.'"},{"t":"an ossuary","d":"A limestone box for bones, used in Judea for about a century around the time of Jesus: a body was left to decompose for a year, then the bones were collected into the box. Names carved on ossuaries are how we have physical traces of individuals like the high priest Caiaphas."},{"t":"the apocrypha","d":"Books written between the Testaments (Tobit, Judith, Maccabees and others), included in Catholic and Orthodox Bibles and in the original 1611 KJV, but not in the Hebrew canon or in Protestant Bibles today."},{"t":"astaghfirullah","d":"'I seek God's forgiveness' — uttered after mentioning or witnessing something sinful; also an exclamation of shock at impropriety."},{"t":"the Banu Qurayza","d":"A Jewish tribe of Medina whose men — between 600 and 900 by the traditional sources — were executed after surrendering in 627, with the women and children enslaved. The event is reported in Islam's own earliest biographies, not by critics."},{"t":"bid'ah","d":"'Innovation' in religion — a serious accusation. Anything added to Islam after Muhammad is suspect; this is why practices vary and debates over celebrations (even his birthday) get heated."},{"t":"the canon","d":"The list of books a community accepts as Scripture. The New Testament canon was recognized gradually by usage over the first three centuries rather than voted on at a council — Athanasius's list of 367 AD matches ours exactly."},{"t":"Codex Sinaiticus","d":"A complete Greek Bible hand-copied around 330–360 AD, found at St Catherine's Monastery on Mount Sinai in the 1840s. Along with Vaticanus it is one of the two oldest complete Bibles in existence, and its text is essentially the text you read today."},{"t":"Codex Vaticanus","d":"A Greek Bible copied around 300–325 AD, held in the Vatican Library — slightly older than Sinaiticus and, with it, the backbone of modern New Testament textual scholarship."},{"t":"da'wah","d":"Invitation — Islamic outreach and evangelism. Street da'wah at campus tables and city-centre stalls follows a trained sequence, which is what the 'When they call you over' page maps."},{"t":"dawah","d":"Islamic evangelism/apologetics. Trained dawah arguments (Deedat, Zakir Naik tradition) supply the standard objections a Christian will hear — the Bible is corrupt, the Trinity is three gods, Muhammad is in the Bible."},{"t":"the Dead Sea Scrolls","d":"About 900 manuscripts found in caves at Qumran near the Dead Sea between 1947 and 1956, copied roughly 250 BC–70 AD. They pushed our oldest Hebrew Bible manuscripts back a thousand years — and the text matched what had been copied ever since. The single most important manuscript discovery ever made."},{"t":"Deutero-Isaiah","d":"Chapters 40–55 of Isaiah, judged by most scholars to be written during the Babylonian exile — relevant here only as background to biblical scholarship debates."},{"t":"the Documentary Hypothesis","d":"The critical theory that the first five books of the Bible were woven together from several earlier sources (labelled J, E, D and P) rather than written by Moses. The classic form is now heavily revised even among critical scholars, but some version of it is the mainstream academic position."},{"t":"du'a","d":"Personal supplication, as distinct from salah (the five formal prayers). Offering to make du'a for someone is warm; asking a Muslim friend to pray for you is received kindly."},{"t":"Eid al-Adha","d":"The Feast of Sacrifice commemorating Allah ransoming Abraham's son 'with a great sacrifice' (37:107) — the best annual doorway to the gospel of substitutionary atonement."},{"t":"exegesis","d":"Drawing out what a text actually says, in its own context. Its opposite is eisegesis — reading your conclusion into the text."},{"t":"fitra","d":"The innate disposition toward Islam every human is born with — hence converts are called 'reverts': they're understood to be returning, not converting."},{"t":"the Great Isaiah Scroll","d":"The star of the Dead Sea Scrolls: a complete copy of Isaiah, all 66 chapters, copied around 125 BC. It proves Isaiah 53 and its portrait of a pierced, suffering servant existed more than a century before Jesus — nobody added it afterwards."},{"t":"hadith","d":"Reports of Muhammad's words and deeds, collected 150–250 years after his death and graded by chain of transmission. Sahih ('sound') collections — Bukhari and Muslim — are Islam's most trusted sources after the Quran."},{"t":"hafiz","d":"Someone who has memorized the entire Quran — all ~6,236 verses in Arabic. Millions worldwide have; a hafiz brings honor to a whole family and may lead Ramadan prayers."},{"t":"halal / haram","d":"Permitted / forbidden — covering food (no pork, no alcohol, ritually slaughtered meat), finance (no interest), and conduct. 'Is it halal?' is a daily navigation question."},{"t":"Hira","d":"The cave outside Mecca where Muhammad was meditating when the first revelation came in 610."},{"t":"honor-shame","d":"The cultural operating system of most Muslim societies: identity, family honor, and community standing govern behavior more than individual guilt. It is why mocking Muhammad ends conversations, and why the gospel told as shame-bearing and honor-restoring (Hebrews 12:2) lands deeper than courtroom language alone."},{"t":"Ibn Kathir","d":"Ismail ibn Kathir (d. 1373), author of the most widely used classical Quranic commentary in the Sunni world. When this site says 'classical tafsir says,' it usually means him or al-Tabari."},{"t":"imam","d":"The prayer leader of a mosque — not a priest and not ordained; Sunni Islam has no clergy hierarchy or sacraments. Authority comes from knowledge and community standing."},{"t":"Injil","d":"The Quran's word for the Gospel given to Jesus. Mainstream Islam claims it was a single revealed book, now lost — a book with no manuscript, citation, or historical trace in seven centuries between Jesus and Muhammad."},{"t":"inshallah","d":"'If God wills' — appended to any statement about the future (James 4:15 is the biblical parallel). Can also function as a polite, non-committal 'maybe.'"},{"t":"IslamQA","d":"A large Salafi fatwa website run by Muhammad al-Munajjid — the most-consulted English-language source for ordinary Muslims looking up a ruling. It is quoted here because it states the traditional position plainly rather than diplomatically."},{"t":"isnad","d":"The chain of narrators by which a hadith is transmitted. Muslim scholarship accepts or rejects reports by grading the chain, not the content — which is why some well-attested early events (like the satanic verses) are rejected on chain grounds."},{"t":"the isnad","d":"The chain of narrators attached to a hadith: X heard from Y who heard from Z who heard the Prophet. Islamic scholarship grades a report by evaluating this chain, and the grading — sahih (sound), hasan (good), da'if (weak), mawdu' (fabricated) — is what determines whether a Muslim must accept it."},{"t":"jizya / dhimmi","d":"The tax and subordinate protected status imposed on Jews and Christians under Islamic rule (9:29)."},{"t":"Josephus","d":"Titus Flavius Josephus (c. 37–100 AD), a Jewish general who surrendered to Rome and became its most important historian of first-century Judea. Not a Christian, which is why his mentions of Jesus, James and John the Baptist carry so much weight."},{"t":"jummah","d":"Friday congregational prayer with sermon (khutbah) — the anchor of the week, obligatory for men. Muslim coworkers may need a long Friday lunch window."},{"t":"the Kaaba","d":"The cube-shaped building at the centre of the Grand Mosque in Mecca, toward which Muslims pray. It was a pagan shrine housing many idols before Muhammad cleansed it in 630, and several rites of the pilgrimage predate Islam."},{"t":"kafir","d":"'Unbeliever/one who covers the truth' — the term for non-Muslims. Ranges from neutral-descriptive to deeply pejorative depending on speaker and context."},{"t":"Khadija","d":"Muhammad's first wife, fifteen years his senior, a wealthy merchant who employed him. She was the first Muslim, and she is the one who reassures him after the first revelation terrifies him."},{"t":"the KJV","d":"The King James Version of 1611, the English Bible of the whole period covered by this site. Its wording matters constantly here: several movements examined on this site were born inside its cadence, and some of them treat it as the only legitimate Bible."},{"t":"madhhab","d":"One of the four Sunni schools of law (Hanafi, Maliki, Shafi'i, Hanbali) — why practice differs by region on details from prayer posture to food rules."},{"t":"the Masoretic Text","d":"The standard Hebrew Bible, preserved and vowel-pointed by Jewish scribes called the Masoretes between roughly 600 and 1000 AD. Almost every Old Testament translation is based on it; where it differs from the Septuagint or the Scrolls, that difference is what scholars argue about."},{"t":"the multi-Isaiah theory","d":"The mainstream critical view that the book of Isaiah had more than one author: chapters 1–39 from the eighth-century prophet, 40–55 from an anonymous writer during the Babylonian exile ('Deutero-Isaiah'), and sometimes 56–66 from a third. It is argued from style and from the fact that chapters 40+ address the exile as present. Conservatives dispute it; it matters here because it is the standard reply whenever Isaiah is said to predict something."},{"t":"naskh","d":"Abrogation — Allah replacing earlier verses with later ones (2:106), including 'abrogation of recitation,' the doctrine that explains verses Companions remembered as Quran that are not in today's text."},{"t":"papyrus","d":"Paper made from reed pith, the ordinary writing material of the ancient world. New Testament papyri are labelled with a P and a number — P52, a scrap of John, is the earliest known New Testament manuscript, copied around 125 AD."},{"t":"the People of the Book","d":"Ahl al-Kitab — the Quran's term for Jews and Christians, who hold a distinct legal and theological status in Islam as recipients of earlier revelation."},{"t":"the qira'at","d":"The canonical 'readings' of the Quran — variant recitations differing in vowels, dots and occasionally consonants. Ten are recognized; the Hafs reading dominates the printed Quran today, while Warsh persists in North and West Africa. Two different printed texts are in circulation now."},{"t":"Qumran","d":"The settlement beside the caves where the Dead Sea Scrolls were found, on the northwest shore of the Dead Sea. Usually associated with the Essenes, a strict Jewish sect of the Second Temple period."},{"t":"revert","d":"A convert to Islam — see fitra. Convert stories are celebrated in dawah exactly the way testimonies are in evangelicalism."},{"t":"sahih","d":"'Sound/authentic' — the highest grade of hadith reliability. When a fact sits in Sahih al-Bukhari or Sahih Muslim, mainstream Islam accepts it; that is why this site cites them constantly."},{"t":"Sahih al-Bukhari","d":"The most authoritative hadith collection in Sunni Islam, compiled by Muhammad al-Bukhari (d. 870) from a reported 600,000 traditions, of which he kept about 7,275. 'Sahih' means authentic. To a Sunni Muslim, a fact recorded here is not in dispute — which is why so much of this section is cited from it."},{"t":"Sahih Muslim","d":"The second most authoritative Sunni hadith collection, compiled by Muslim ibn al-Hajjaj (d. 875). Together Bukhari and Muslim are called the two Sahihs, and anything in both is regarded as beyond question."},{"t":"the Sanaa palimpsest","d":"Quran manuscripts found in the Great Mosque of Sanaa, Yemen, in 1972. The lower, erased layer — recovered by imaging — contains a text that differs from the standard Uthmanic text in word order and wording, making it the most significant Quranic manuscript find of the modern era."},{"t":"the Septuagint","d":"The Greek translation of the Hebrew Scriptures made by Jewish scholars in Alexandria beginning about 250 BC — abbreviated LXX. It matters constantly here because it is pre-Christian: when it renders a verse a certain way, no Christian could have influenced it."},{"t":"the shahada","d":"The Islamic creed — 'there is no god but Allah, and Muhammad is his messenger.' Reciting it sincerely makes a person a Muslim, which is why a street conversation is often steered toward it."},{"t":"shirk","d":"Associating partners with Allah — Islam's unforgivable sin (4:48). Worshiping Jesus is shirk if he is a creature; it is simple obedience if he is the eternal Creator (John 20:28)."},{"t":"the Smithsonian Institution","d":"The United States' national museum and research complex. It matters here because for decades a 'Smithsonian statement' was circulated claiming the institution used the Book of Mormon as an archaeological guide. The Smithsonian issued a formal statement denying it, and now sends a standard letter saying its archaeologists see no connection between the New World's archaeology and the book's contents."},{"t":"sunnah","d":"The Prophet's example — his practices, preferences, and habits, known through hadith. Doing something 'because it is sunnah' (beard, miswak, right hand first) earns reward."},{"t":"Sunni and Shia","d":"Islam's two main branches, divided since the seventh century over who should have succeeded Muhammad. Roughly 85–90% of Muslims are Sunni. They have different hadith collections, so an argument built on Bukhari may not land with a Shia Muslim."},{"t":"Tacitus","d":"Roman senator and historian (c. 56–120 AD). His hostile mention of 'Christus,' executed by the procurator Pontius Pilate under Tiberius, is the standard non-Christian confirmation of the crucifixion."},{"t":"tafsir","d":"Classical Quran commentary (al-Tabari, Ibn Kathir, al-Qurtubi). Where modern reinterpretations conflict with the unanimous early tafsir, this site notes it."},{"t":"tahrif","d":"'Corruption' — the Muslim doctrine that Jews and Christians altered their scriptures. The earliest Islam taught corruption of MEANING (misinterpretation); corruption of the TEXT is a doctrine that crystallized only with Ibn Hazm, four centuries after Muhammad."},{"t":"taqiyya","d":"Concealment of faith under persecution — chiefly a Shia doctrine (from 3:28; 16:106). Widely misused in polemics: mainstream Sunni Islam does NOT license routine lying to non-Muslims, and accusing your Muslim friend of taqiyya is both usually false and instantly conversation-ending."},{"t":"tawhid","d":"Islam's absolute oneness of God — the doctrine every sonship and Trinity denial defends. Christians also confess one God; the dispute is whether that one God is a solitary monad or eternally Father, Son, and Spirit."},{"t":"Tawrat","d":"The Quran's word for the Torah of Moses — which the Quran says was 'with' the Jews of Muhammad's day and contained Allah's judgment (5:43)."},{"t":"the Tawrat, Zabur and Injil","d":"The Quran's names for the Torah given to Moses, the Psalms given to David, and the Gospel given to Jesus. The Quran repeatedly affirms all three — which is the basis of the argument that runs through this whole section."},{"t":"textual criticism","d":"The scholarly discipline of comparing manuscripts to work out what the original wording was. It is not an attack on Scripture — it is the method that lets us say with confidence what the text said."},{"t":"Umar","d":"The second caliph (r. 634–644), and the figure who first pressed for the Quran to be collected after reciters died at the battle of Yamama."},{"t":"ummah","d":"The worldwide community of Muslims — a strong transnational identity: an insult to Islam anywhere is felt as an insult to the ummah everywhere."},{"t":"the ummah","d":"The worldwide community of Muslims. Leaving Islam means leaving the ummah, which is why apostasy is experienced as a social and familial rupture rather than a private change of mind."},{"t":"Uthman","d":"The third caliph (r. 644–656). He standardized the Quran into a single official text and ordered all variant copies burned — an act reported approvingly in Bukhari, and central to every question about the Quran's transmission."},{"t":"Uthmanic recension","d":"The standardized Quran text produced under Caliph Uthman (~650 AD), who ordered all other copies burned (Bukhari 4987). What is preserved today is this recension."},{"t":"Waraqa","d":"Waraqa ibn Nawfal, Khadija's cousin — a Christian who, in Bukhari's account, is brought the terrified Muhammad and identifies his experience as the same 'namus' that came to Moses. He is the first person to authenticate the revelation, and he dies shortly afterwards."},{"t":"wudu","d":"Ritual washing (hands, mouth, nose, face, arms, head, feet) required before prayer — broken by sleep or using the bathroom. Why Muslim colleagues wash in workplace restrooms at midday."},{"t":"Zabur","d":"The Psalms of David, affirmed as revelation in the Quran (4:163; 17:55) — which makes Psalm 22's crucifixion portrait shared ground a Muslim can read without betraying the Quran."}];

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function hl(text,phrases){let out=esc(text);(phrases||[]).forEach(p=>{const e=esc(p).replace(/[.*+?^${}()|[\]\\]/g,"\\$&");out=out.replace(new RegExp(e,"gi"),m=>"<mark>"+m+"</mark>");});return out;}
function glossify(escapedText){
  if(!glossify._re){
    const ts=GLOSSARY.slice().sort((a,b)=>esc(b.t).length-esc(a.t).length);
    const alts=ts.map(g=>esc(g.t).replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|");
    glossify._re=new RegExp("(?<![\\w-])("+alts+")(?![\\w-])","gi");
    glossify._map={};GLOSSARY.forEach(g=>{glossify._map[esc(g.t).toLowerCase()]=g;});
  }
  const used=glossify.seen||(glossify.seen=new Set());
  let inRef=0;
  return escapedText.replace(/(<[^>]*>)|([^<]+)/g,(m,tag,txt)=>{
    if(tag){
      if(/^<span class="ref-(lds|bib)"/.test(tag))inRef++;
      else if(inRef&&tag.indexOf("</span>")===0)inRef--;
      return tag;
    }
    if(inRef)return txt;
    return txt.replace(glossify._re,w=>{
      const g=glossify._map[w.toLowerCase()];
      if(!g||used.has(g.t))return w;
      used.add(g.t);
      return '<span class="g" tabindex="0">'+w+'<span class="gt"><b>'+esc(g.t)+'</b> — '+g.d+'</span></span>';
    });
  });
}


function findWhy(d,cite){
  const key=cite.replace(/–/g,"-").replace(/\s*\(.*\)\s*/g,"").trim();
  const m=key.match(/^([1-4]?\s?[A-Za-z&; ]+?)\s+(\d+)/);
  const frag=m?(m[1].trim()+" "+m[2]):key;
  const sentences=(d.claim+" "+d.rationale).replace(/–/g,"-").split(/(?<=[.!?])\s+/);
  const hit=sentences.find(s=>s.includes(frag));
  return hit?hit.replace(/-/g,"–"):null;
}

  document.body.appendChild(lb);
}
function extUrl(cite){

  if(qm)return "https://quran.com/"+qm[1]+"/"+qm[2];
  const qc=c.match(/^Quran\s+(\d+)/i);
  if(qc)return "https://quran.com/"+qc[1];
  const mm=c.match(/^([1-3]?\s?[A-Za-z ]+?)\s+(\d+)/);
  if(mm)return "https://www.biblegateway.com/passage/?search="+encodeURIComponent(c)+"&version=KJV";
  return "https://quran.com/";
}
function hadithUrl(h){
  const m=h.replace(/\s*\(.*\)\s*/g,"").match(/^(Sahih al-Bukhari|Sahih Muslim|Sunan Abi Dawud|Sunan Ibn Majah|Jami at-Tirmidhi|Sunan an-Nasa'i)\s+(\d+[a-z]?)/i);
  if(!m)return null;
  const map={"sahih al-bukhari":"bukhari","sahih muslim":"muslim","sunan abi dawud":"abudawud","sunan ibn majah":"ibnmajah","jami at-tirmidhi":"tirmidhi","sunan an-nasa'i":"nasai"};
  const col=map[m[1].toLowerCase()];
  return col?"https://sunnah.com/"+col+":"+m[2].toLowerCase():null;
}
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),1800);}

/* ---------- filtered list (ordered) ---------- */
function filtered(){
  const arr=DATA.filter(d=>
    (state.section==="all"||d.section===state.section)&&
    (!state.verdict||d.verdict===state.verdict)&&
    (!state.severity||d.severity===state.severity)&&
    (!state.q||(d.title+" "+(d.titleLong||"")+" "+d.claim+" "+(d.response||"")+" "+(d.rationale||"")+" "+(CATS[d.category]||"")).toLowerCase().includes(state.q))
  );
  if(state.section==="peculiar")return arr.sort((a,b)=>PORDER.indexOf(a.id)-PORDER.indexOf(b.id));
  return arr.sort((a,b)=>(b.featured?1:0)-(a.featured?1:0)||SEVRANK[a.severity]-SEVRANK[b.severity]||VRANK[a.verdict]-VRANK[b.verdict]);
}

/* ---------- overview ---------- */
const WOW=new Set(/*__WOW__*/[]);
const RANKED=/*__RANKED__*/[];
function renderOverview(){
  const items=filtered();
  const anyF=state.verdict||state.severity||state.q||state.section!=="all";
  const visible=new Set(items.map(d=>d.id));
  const read=store.read;
  
  const counts={};DATA.forEach(d=>counts[d.verdict]=(counts[d.verdict]||0)+1);
  const col=v=>{
    const cls=v==="admitted"?"ad":v==="unrefuted"?"un":v==="contested"?"co":"an";
    const src=state.section==="all"?DATA:DATA.filter(d=>d.section===state.section);
    /* one ordered list per verdict: most serious first, strongest evidence at the top of each */
    /* the five on show are the ones a reader should meet first: flagged evidence
       outranks severity, so a band never opens on its dullest case */
    /* RANKED is the editorial most-striking-first order; fall back to the flags */
    const rank=d=>{const i=RANKED.indexOf(d.id); if(i>=0)return 10000-i;
      return (d.featured?6:isStrong(d)?4:0)+(d.severity==="high"?2:d.severity==="medium"?1:0);};
    const all=src.filter(d=>d.verdict===v).sort((a,b)=>rank(b)-rank(a));
    if(!all.length)return "";
    /* a filter or a search means the reader has already narrowed it — show everything */
    const open=state.open&&state.open[v], narrowed=!!(state.q||state.verdict||state.severity);
    const shown=(open||narrowed)?all:all.slice(0,5);
    const rows=shown.map(d=>{
      const im=IMGMAP[d.id];
      const thumb=im?`<img class="vth" src="${im.src.replace("width=520","width=160")}" alt="" loading="lazy">`
        :`<span class="vth ph">${esc((d.title.match(/[A-Za-z]/)||["·"])[0])}</span>`;
      return `<button class="vt ${state.sel===d.id?"sel":""}${visible.has(d.id)?"":" dimmed"}${WOW.has(d.id)?" wow":""}" data-id="${d.id}">
          ${thumb}<span class="vtx"><span class="h5">${esc(d.title)}</span>
          <span class="m">${d.avoid?'<span class="star avd">⚠ do not use</span>':d.featured?'<span class="star">★ strongest evidence</span>':isStrong(d)?'<span class="star s2">☆ strong evidence</span>':""}${read.has(d.id)?'<span class="rd">✓ read</span>':""}</span></span>
        </button>`;}).join("");
    const more=(!narrowed&&all.length>5)
      ? `<button class="showall" data-v="${v}">${open?"Show fewer &uarr;":"Show all "+all.length+" &rarr;"}</button>` : "";
    return `<div class="vcol ${cls}"><header><span class="n">${all.length}</span><span class="t">${VLABEL[v]}</span><div class="d">${VDESC[v]}</div></header><div class="vgroup">${rows}</div>${more}</div>`;
  };
  if(state.section==="peculiar"){
    const items2=filtered();
    $("#main").innerHTML=`
      <div class="tiles">
        <button class="tile on" data-v=""><div class="v">${DATA.filter(d=>d.section==="peculiar").length}</div><div class="l">Ranked entries</div></button>
        <button class="tile t-un" data-v=""><div class="v" style="font-size:1rem;padding-top:8px">Most jaw-dropping first</div><div class="l">how this list is sorted</div></button>
      </div>
      <h4 class="bt">Strange to outsiders — practices and institutional behavior, ranked by how surprising they are to a non-Mormon. Not core theology; each is documented and steelmanned like everything else.</h4>
      <div class="vcol" style="max-width:760px">${items2.map((d,i)=>`
        <button class="vt ${state.sel===d.id?"sel":""}" data-id="${d.id}">
          <h5><span style="font-family:var(--mono);color:var(--dim);font-size:.8rem;margin-right:8px">${String(i+1).padStart(2,"0")}</span>${esc(d.title)}</h5>
          <span class="m">${read.has(d.id)?'<span class="rd">✓ read</span>':""}<span class="badge v-${d.verdict}">${VLABEL[d.verdict]}</span><span>seriousness: ${SEVLABEL[d.severity]}</span></span>
        </button>`).join("")}</div>
      <p class="methodfoot">Ranking is editorial: how startling the item is to someone outside the tradition, most to least. Verdicts still grade only the factual claim.</p>`;
    document.querySelectorAll(".vt").forEach(c=>{
      c.addEventListener("mouseenter",()=>{state.sel=c.dataset.id;renderPreview();});
      c.addEventListener("click",()=>openCase(c.dataset.id));
    });
    return;
  }
  $("#main").innerHTML=`
    <h4 class="bt">${state.section==="all"?DATA.length+" claims, sorted by where the argument stands · click any title to open its case":SECTIONS[state.section]+" — by verdict"}${anyF?` · <button id="clearf" style="background:none;border:0;color:var(--gold);cursor:pointer;text-decoration:underline;font-size:.72rem;letter-spacing:0;text-transform:none">${items.length} match filters — clear</button>`:""}</h4>
    <div class="vwall vstack">${col("unrefuted")}${col("admitted")}${col("contested")}${col("answered")}</div>
    <p class="methodfoot">How this page is built: every claim is shown with the strongest published Muslim answer to it first — that is called steelmanning, the opposite of a straw man. Weak criticisms are labelled so. And where a fact is admitted in the hadith collections Muslims themselves rate as sound (sahih), it is marked Admitted. Compiled July 2026 from published sources — verify citations at the links before quoting. Verdicts are editorial judgments about the public argument.</p>`;
  document.querySelectorAll(".vt").forEach(c=>{
    c.addEventListener("mouseenter",()=>{state.sel=c.dataset.id;renderPreview();});
    c.addEventListener("click",()=>openCase(c.dataset.id));
  });
  document.querySelectorAll(".showall").forEach(b=>b.addEventListener("click",()=>{
    state.open=state.open||{}; state.open[b.dataset.v]=!state.open[b.dataset.v]; renderOverview();
  }));
  const cf=$("#clearf");if(cf)cf.addEventListener("click",()=>{state.verdict=null;state.severity=null;state.q="";state.section="all";render();});
}

/* ---------- case ---------- */
function openCase(id,fromPath){
  state.caseId=id;state.sel=id;state.view="case";
  if(location.hash!=="#case/"+id)try{history.pushState(null,"","#case/"+id)}catch(e){}
  if(!fromPath)state.pathId=state.pathId; // keep path context if navigating within
  store.markRead(id);
  render();
  window.scrollTo({top:0});
}
function ROLENOTE(side){return side==="quran"?"<b>Why this verse is here:</b> it is the Quran passage this claim is about.":"<b>Why this verse is here:</b> it is the Bible passage the claim is measured against.";}
const DEFLABEL="How Muslims answer this — put at its strongest";
const VDESC={"admitted":"The facts sit in Islam's own trusted sources. You can make this point from their books alone.","unrefuted":"No good counter-argument has been published by Muslim scholars.","contested":"Muslim scholars have a real answer here. Say so before your friend does.","answered":"The Muslim answer holds up. Do not lead with this one."};
const IMGS=/*__IMGS__*/{};
function figs(d,where){
  const a=(IMGS[d.id]||[]).filter(x=>x.where===where);
  if(!a.length)return "";
  return `<div class="figrow${a.length>1?" multi":""}">`+a.map(x=>
    `<figure class="cfig"><img src="${x.src}" alt="${esc(x.cap)}" loading="lazy">
      <button class="cimg-x" title="Expand" data-full="${x.src.replace("width=520","width=1400")}" data-cap="${esc(x.cap)}">⤢</button>
      <figcaption>${esc(x.cap)}</figcaption></figure>`).join("")+"</div>";
}
function plainHtml(d){
  const rt=t=>glossify(emphasize(esc(t).replace(/&lt;(\/?)(b|i)&gt;/g,"<$1$2>")));
  const KINDRE=t=>(/answer,? at full strength|^their answer|^the .{2,22} answer\b|^how (they|.*s) (answer|explain)|best (defense|answer)|at its strongest|^the (rabbinic|muslim|witness|sceptic|skeptic) (reply|answer)/.test(t)?"k-def"
      :/^how strong|^the rule\b|^where it lands|^the verdict|don't use|do not use/.test(t)?"k-strength"
      :/^why this|^why it|helps you|^what it cost|^what to do instead|^what to say instead|^the takeaway|^why that matters/.test(t)?"k-help"
      :/runs out|problem|^why that is|^where it breaks|^what that misses|^the gap|^why it is wrong|^the trouble|^what it does not/.test(t)?"k-gap"
      :/verse|text|chapter|\bsays\b|passage|record|scripture|evidence|the numbers|what survives|the hadith|manuscript|papyri|inscription/.test(t)?"k-text"
      :/^the claim|^what is taught|^what (they|the book|the movement|the church|the camps) |^what happened|^how it (usually|ended|came out)|objection|^what (you|your|people)|describes|^the story|^what is at stake/.test(t)?"k-claim"
      :"k-plain");
  const KINDOF=b=>{
    if(b.say)return "k-say";
    const t=b.t.toLowerCase();
    return KINDRE(t);
  };
  /* One fixed sequence for every case, so the colours mean the same thing on
     every page and a reader learns the shape once. "What to say" is last in all
     318 cases and always anchors the run in green. */
  const SEQ=["amber","gold","red","purp","teal","slate"];
  const blocks=(d.plain||[]);
  const kinds=blocks.map(KINDOF);
  let si=0;
  const hues=blocks.map(b=>b.say?"green":SEQ[si++%SEQ.length]);
  return blocks.map((b,bi)=>{
    const ss=splitSentences(b.d),ps=[];
    for(let i=0;i<ss.length;i+=2)ps.push("<p>"+rt(ss.slice(i,i+2).join(" "))+"</p>");
    const kind=kinds[bi], hue="h-"+hues[bi];
    const big=/(k-text|k-say)/.test(kind)?" k-big":"";
    return `<div class="pblk ${kind} ${hue}${b.say?" say":""}${big}"><div class="plab ${hue}">${esc(b.t)}</div>${ps.join("")}</div>`;
  }).join("");
}
function renderCase(){
  const d=byId[state.caseId];if(!d){state.view="overview";return renderOverview();}
  const list=filtered();const idx=list.findIndex(x=>x.id===d.id);
  const path=state.pathId?PATHS.find(p=>p.id===state.pathId):null;
  let nextInPath=null;
  if(path){const i=path.items.indexOf(d.id);if(i>-1&&i<path.items.length-1)nextInPath=path.items[i+1];}
  const comp=d.comparison?`
    <div class="dlab">Side by side</div>
    <div class="compare2">
      <div class="pane bom"><div class="ref">${esc(d.comparison.left.ref)}</div><div class="scripture">${hl(d.comparison.left.text,d.comparison.hl)}</div></div>

    </div>${d.comparison.note?`<p class="cnote">${esc(d.comparison.note)}</p>`:""}`:"";
  const rwhyTxt=t=>esc(t).replace(/&lt;(\/?)(b|i)&gt;/g,"<$1$2>");
  const chipHtml=(arr)=>arr.map(p=>{
    const v=VERSES[p],why=(d.refwhy||{})[p];

    if(!d.refwhy)return btn;
    return `<div class="rrow">${btn}${why?`<span class="rwhy">${rwhyTxt(why)}</span>`:""}</div>`;
  }).join("");
  const hadithChips=(d.hadith||[]).map(h=>{
    const u=hadithUrl(h),why=(d.refwhy||{})[h];

    return `<div class="rrow">${chip}${why?`<span class="rwhy">${rwhyTxt(why)}</span>`:""}</div>`;

  const cimg=IMGMAP[d.id]?`<figure class="cimg"><img src="${IMGMAP[d.id].src}" alt="${esc(IMGMAP[d.id].cap)}" loading="lazy"><button class="cimg-x" title="Expand image" data-full="${IMGMAP[d.id].src.replace("width=520","width=1400")}" data-cap="${esc(IMGMAP[d.id].cap)}">⤢</button><figcaption>${esc(IMGMAP[d.id].cap)}</figcaption></figure>`:"";
  const passages=((d.quran||[]).length||(d.hadith||[]).length||(d.bible||[]).length||IMGMAP[d.id])?`
    <aside class="claimside">

      <div class="passcols">
        ${(d.quran||[]).length?`<div><h6 class="h-bom">Quran</h6><div class="chips" data-side="quran">${chipHtml(d.quran)}</div></div>`:""}
        ${(d.hadith||[]).length?`<div><h6 class="h-bom" style="color:var(--amber)">Hadith</h6><div class="chips" data-side="hadith">${hadithChips}</div></div>`:""}
        ${(d.bible||[]).length?`<div><h6 class="h-bib">Bible</h6><div class="chips" data-side="bib">${chipHtml(d.bible)}</div></div>`:""}
        </div></details>
    </aside>`:"";
  const rel=(RELATED[d.id]||[]).filter(x=>byId[x]);
  $("#main").innerHTML=`
    <div class="backbar">
      <button class="bk" id="back">← ${path?esc(path.name):"All cases"}</button>
      <span style="font-size:.72rem;color:var(--dim)">${idx+1>0?`Case ${idx+1} of ${list.length}`:""} · <kbd>←</kbd>/<kbd>→</kbd> to move</span>
      ${nextInPath?`<button class="pathnext" id="pathnext">Next in path →</button>`:""}
    </div>
    <div class="case">
      <div class="meta"><span class="badge v-${d.verdict}">${VLABEL[d.verdict]} ${info(TIPS.verdict[d.verdict])}</span><span class="tag">${CATS[d.category]} ${info(CATDESC[d.category])}</span><span class="tag">seriousness: ${SEVLABEL[d.severity]} ${info(TIPS.impact)}</span>${d.avoid?`<span class="tag" style="border-color:var(--red);color:var(--red)">⚠ popular claim — do not use it</span>`:d.featured?`<span class="tag" style="border-color:var(--gold);color:var(--gold)">★ strongest evidence ${info(TIPS.strongest)}</span>`:isStrong(d)?`<span class="tag" style="border-color:var(--amber);color:var(--amber)">☆ strong evidence</span>`:""}</div>
      <h2>${esc(d.title)}</h2>
      
      <div class="ctop">
        <div class="claimcol">${(d.plain&&d.plain.length)?`${plainHtml(d)}<details class="claimfull"><summary>The claim, stated in full</summary><div class="claim">${paras(d.claim)}</div></details>`:`<div class="dlab red" style="margin-top:0">The claim</div><div class="claim">${paras(d.claim)}</div>`}<div id="versebox"></div>${figs(d,"claim")}</div>
      </div>
      ${comp}
      <div class="tabs2">

        <div class="dlab">Connected cases</div>
        <div class="relrow">${rel.map(id=>`<button data-open="${id}">${esc(byId[id].title)}</button>`).join("")||"—"}</div>
      </div>
    </div>`;
    $("#back").addEventListener("click",()=>{state.view=path?"paths":"overview";state.caseId=null;render();});
  if(nextInPath)$("#pathnext").addEventListener("click",()=>openCase(nextInPath));
  document.querySelectorAll(".relrow [data-open]").forEach(b=>b.addEventListener("click",()=>openCase(b.dataset.open)));
  versesReady.then(()=>{
  let pinnedCite=null,hoverTimer=null,scrolling=false,scrollT=null;
  const vbox=()=>$("#versebox");
  const clearVerse=()=>{pinnedCite=null;const b=vbox();if(b)b.innerHTML="";
    document.querySelectorAll(".chip.open,.chip.peek").forEach(x=>x.classList.remove("open","peek"));};
  const sideOf=ch=>ch.closest("[data-side]")?ch.closest("[data-side]").dataset.side:"";
  const buildHtml=(cite,v,side)=>{
    if(!v||!v.verses)
      return '<div class="versebox vmiss"><div class="vr"><span>'+esc(cite)+'</span><button data-close>✕ close</button></div><div class="vwhy">This reference is cited by the claim but isn\'t in the built-in reader — open it in your own Bible.</div></div>';
    const why=findWhy(d,cite);
    const whyHtml=why?"<b>Why it's cited:</b> "+esc(why):ROLENOTE(side);
    const anyHl=v.verses.some(x=>x.hl);
    const hasCtx=anyHl&&v.verses.some(x=>!x.hl);
    const ctx=hasCtx?' <span class="vcited">— '+esc(v.ref)+', with the verses either side</span>'
      :(!anyHl?' <span class="vcited">— '+esc(v.ref)+'</span>':'');
    const body=v.verses.map(x=>{
      const lit=(x.hl||!anyHl);
      const txt=(x.hl&&hasCtx)?"<em>"+esc(x.t)+"</em>":esc(x.t);
      return '<span class="vs'+(lit?" hl":"")+'"><span class="vnum">'+x.v+'</span>'+txt+' </span>';
    }).join("");
    return '<div class="versebox"><div class="vr"><span>'+esc(cite)+ctx+'</span><button data-close>✕ close</button></div><div class="vtext">'+body+'</div><div class="vwhy">'+whyHtml+'</div></div>';
  };
  /* The box opens in place, beside what you pointed at. The old glitch came from it
     opening while the page was scrolling, so the page kept resizing under the cursor.
     Fix: a hover delay, and nothing opens while a scroll is in progress. */
  const openVerse=(ch,pin)=>{
    const box=vbox(); if(!box)return;
    const cite=ch.dataset.cite;
    const host=ch.closest(".pblk, .claim, .defense, .talk, .vbox, .why, .saybox, li, p")
      ||ch.closest(".chips") && ch.closest(".claimside");
    if(host&&host.parentNode&&box.previousElementSibling!==host)host.parentNode.insertBefore(box,host.nextSibling);
    document.querySelectorAll(".chip.open,.chip.peek").forEach(x=>x.classList.remove("open","peek"));
    ch.classList.add(pin?"open":"peek");
    if(pin)pinnedCite=cite;
    box.innerHTML=buildHtml(cite,VERSES[cite],sideOf(ch));
    const cb=box.querySelector("[data-close]");if(cb)cb.addEventListener("click",clearVerse);
    /* the cited verse can sit below three verses of context — bring it into view */
    const inner=box.querySelector(".versebox"),hl=box.querySelector(".vs.hl");
    if(inner&&hl){
      const want=hl.offsetTop-inner.offsetTop-Math.max(0,(inner.clientHeight-hl.offsetHeight)/2);
      inner.scrollTop=Math.max(0,want);
    }
  };
  window.addEventListener("scroll",()=>{scrolling=true;clearTimeout(scrollT);clearTimeout(hoverTimer);
    scrollT=setTimeout(()=>{scrolling=false;},220);},{passive:true});
  /* LIVEREFS: references printed inside prose become openable, like the chips */
  document.querySelectorAll("#main .ref-bib, #main .ref-lds").forEach(r=>{
    const key=r.textContent.replace(/\s+/g," ").trim().replace(/[.,;:]$/,"");
    const hit=VERSES[key]?key:Object.keys(VERSES).find(k=>k.replace(/[\u2013\u2014]/g,"-")===key.replace(/[\u2013\u2014]/g,"-"));
    if(!hit)return;
    r.classList.add("live","chip");r.dataset.cite=hit;
  });
  const canHover=window.matchMedia("(hover:hover)").matches;
  document.querySelectorAll(".chip").forEach(ch=>{
    ch.addEventListener("click",()=>{
      if(ch.dataset.ext){window.open(ch.dataset.ext,"_blank");return;}
      if(pinnedCite===ch.dataset.cite){clearVerse();return;}
      openVerse(ch,true);
    });
    if(!ch.dataset.ext&&canHover){
      ch.addEventListener("mouseenter",()=>{clearTimeout(hoverTimer);
        if(pinnedCite||scrolling)return;
        hoverTimer=setTimeout(()=>{if(!scrolling&&!pinnedCite)openVerse(ch,false);},240);});
      ch.addEventListener("mouseleave",()=>{clearTimeout(hoverTimer);
        if(pinnedCite)return;
        hoverTimer=setTimeout(()=>{if(!pinnedCite)clearVerse();},160);});
    }
  });
  
});
  document.querySelectorAll(".cimg-x").forEach(b=>b.addEventListener("click",e=>{e.stopPropagation();showLightbox(b.dataset.full,b.dataset.cap);}));
  renderNav();renderPreview();
}

/* ---------- paths ---------- */
function renderPaths(){
  const read=store.read;
  $("#main").innerHTML=`<div class="viewhead"><h2>Guided paths</h2><p>Reading orders we put together for you — pick the one that fits what you need, and read the cases in order. Your place is saved on this device, and each case has a "Next in path" button to carry you along.</p></div><div class="pgrid">`+PATHS.map(p=>{
      const done=p.items.filter(i=>read.has(i)).length;
      return `<div class="pathcard">${PATHIMG[p.id]?`<img class="pathimg" src="${PATHIMG[p.id]}" loading="lazy">`:""}<h3>${esc(p.name)}</h3><p class="pd">${esc(p.desc)} · ${p.time} · ${done}/${p.items.length} read</p>
      <ol>${p.items.map(i=>`<li class="${read.has(i)?"done":""}">${esc(byId[i].title)}</li>`).join("")}</ol>
      <button class="start" data-path="${p.id}">${done===0?"Start path":done>=p.items.length?"Revisit path":"Continue path"} →</button></div>`;
    }).join("")+"</div>";
  document.querySelectorAll("[data-path]").forEach(b=>b.addEventListener("click",()=>{
    const p=PATHS.find(x=>x.id===b.dataset.path);state.pathId=p.id;
    const read=store.read;const next=p.items.find(i=>!read.has(i))||p.items[0];
    openCase(next,true);
  }));
}

hammad","why":"Bibles older than Islam came out of the ground, and they match the Bible today"},{"y":"1972","side":"record","t":"Sanaa manuscripts found","p":"The lower text confirms early textual plurality.","id":"sanaa-palimpsest-qiraat"},{"y":"2015","side":"record","t":"Birmingham radiocarbon dating","p":"The Quran's text is genuinely early — which answers the revisionists, not the preservation claim.","id":"quran-late-composition"}]}];
function renderTimeline(){
  const read=store.read;
  $("#main").innerHTML=`<div class="viewhead"><h2>The record, in four acts</h2>
  <p>What was claimed on the left; what the manuscripts and canon show on the right. Red years mark the turning points. Click an act to open it — your reading progress fills each meter.</p></div>
  <div class="chs">${TLACTS.map((a,i)=>{
    const linked=a.events.filter(e=>e.id);
    const done=linked.filter(e=>read.has(e.id)).length;
    return `<button class="ch ${state.act===i?"on":""}" data-act="${i}"><span class="n">${a.num}</span><span class="range">${a.range}</span><h4>${a.name}</h4><p>${a.desc} · ${a.events.length} events</p><div class="meter"><i style="width:${linked.length?Math.round(done/linked.length*100):0}%"></i></div></button>`;
  }).join("")}</div>
  ${state.act!=null&&TLACTS[state.act]?actHtml(TLACTS[state.act]):`<p class="tlhint">Pick a period above to see what happened in it.</p>`}`;
  function actHtml(a){
    return `<div class="chopen"><h4>Act ${a.num} · ${a.name} (${a.range})</h4>
    <div class="cvr"><div class="hh claims">What was claimed</div><div></div><div class="hh record">What the record shows</div>
    ${a.events.map(e=>{
      const bubble=`<div class="bubble ${e.side==="claim"?"claim":"rec"}${e.crit?" crit":""}${e.id&&store.read.has(e.id)?" done":""}">${e.id&&IMGMAP[e.id]?`<img class="ebthumb" src="${IMGMAP[e.id].src}" loading="lazy">`:""}${e.crit?`<span class="tpx">★ turning point</span>`:""}${e.id&&store.read.has(e.id)?`<span class="donechip">✓ read</span>`:""}<h4>${esc(e.t)}</h4>${e.why?`<p class="tpwhy">${esc(e.why)}</p>`:""}<p class="${e.why?"tpsub":""}">${esc(e.p)} ${e.id&&byId[e.id]?`<button class="jump" data-open="${e.id}">→ open the case</button>`:""}</p></div>`;
      return `<div class="cell">${e.side==="claim"?bubble:""}</div><div class="mid"><div class="yr2 ${e.crit?"critY":""}">${e.y}</div></div><div class="cell">${e.side==="record"?bubble:""}</div>`;
    }).join("")}</div></div>`;
  }
  document.querySelectorAll(".ch").forEach(b=>b.addEventListener("click",()=>{const i=+b.dataset.act;state.act=state.act===i?null:i;renderTimeline();}));
  document.querySelectorAll(".jump").forEach(b=>b.addEventListener("click",()=>openCase(b.dataset.open)));
}

function renderGlossary(){

    <p>Rejected in Mecca, he emigrates to Medina in 622 — the start of the Islamic calendar — where he becomes a political and military leader. He returns to take Mecca in 630, cleanses the <b>Kaaba</b> of its idols, and dies in 632.</p>
    <p><b>The Quran is not the only authority.</b> Almost all Islamic practice comes from the <b>hadith</b> — reports of what Muhammad said and did, graded for reliability by their chain of narrators, the <b>isnad</b>. The two most authoritative collections are <b>Sahih al-Bukhari</b> and <b>Sahih Muslim</b>, and a fact recorded in them is not disputed by Sunni Muslims. That is why so much of this section is argued from those books rather than from Christian sources.</p>
    <p>The Quran repeatedly affirms the <b>Tawrat</b> (Torah), <b>Zabur</b> (Psalms) and <b>Injil</b> (Gospel) given before it — which sets up the argument the whole section turns on. Names in dotted underline can be hovered anywhere for a definition.</p></div></details>
  <div class="gaccord">${GLOSSARY.map(g=>`<div class="gitem"><b>${esc(g.t)}</b><p>${g.d}</p></div>`).join("")}</div>`;
}

  <p>If you read nothing else on this site, read this page. Islam's entire case against Christianity rests on one claim, and that claim self-destructs. Here is the whole argument, in plain terms.</p></div>
  <div class="corestrip"><figure><img src="https://commons.wikimedia.org/wiki/Special:FilePath/Codex%20Sinaiticus%2C%20GA%2001.jpg?width=800" loading="lazy" data-cap="The manuscripts predate Muhammad — the tahrif trap closes"><figcaption>The manuscripts predate Muhammad — the tahrif trap closes</figcaption></figure><figure><img src="https://commons.wikimedia.org/wiki/Special:FilePath/Cristo%20crucificado.jpg?width=800" loading="lazy" data-cap="The crucifixion: history's best-attested fact about Jesus"><figcaption>The crucifixion: history's best-attested fact about Jesus</figcaption></figure><figure><img src="https://commons.wikimedia.org/wiki/Special:FilePath/Samarkand%20Kufic%20Quran%2C%201905%20(2022-07-05)%2003.jpg?width=800" loading="lazy" data-cap="The Quran's own transmission history"><figcaption>The Quran's own transmission history</figcaption></figure></div>

/* ---------- sharing the gospel ---------- */
function renderShare(){
  $("#main").innerHTML=`<div class="viewhead"><h2>Sharing Jesus with a Muslim friend</h2>
  <p>Not to win an argument. To help a real person meet the real Jesus, with gentleness (2 Timothy 2:24–25). Built from the largest study of Muslim conversions ever done, and from ministries with decades in this work.</p></div><div class="pb-h">The invitation to work toward</div>
<div class="saybox"><span class="who">You, once trust is real</span><p>"Would you read one Gospel with me? Luke. The Quran itself says to judge by the Injil."</p></div>
<p class="pd">Quran 5:47 commands it. Quran 10:94 sends doubters to the people who read the Scripture. You are asking your friend to do what their own book says.</p>

<div class="pb-h">What brought ex-Muslims to Christ: the Woodberry findings, ranked</div>
<div class="pb-grid">
<div class="pb"><span class="num">1</span><h4>The lifestyle and love of the Christians they knew</h4><p>The top-ranked factor, ahead of every argument. Love inside Christian marriages. Love for enemies. Plain honesty. A Christian who stayed. Nabeel Qureshi and David Wood argued for four years and stayed friends the whole way through: a friend both openly convinced and always there. Most Muslims never have one close Christian friend. Be the first.</p></div>
<div class="pb"><span class="num">2</span><h4>Reading the Bible, especially the Sermon on the Mount</h4><p>They are taught it is corrupt, so reading it is the shock. Mosab Hassan Yousef, son of a Hamas founder, put it this way: "When I read love your enemies and pray for those who persecute you, I was thunderstruck. This was the message I had been searching for all my life."</p></div>
<div class="pb"><span class="num">3</span><h4>The character of Jesus, next to their own sources</h4><p>Mark Gabriel had the whole Quran memorized and taught at Al-Azhar. His doubts began inside the texts, not outside them. What moved him was studying Jesus and Muhammad side by side.</p></div>
<div class="pb"><span class="num">4</span><h4>Dreams of Jesus, handled factually</h4><p>Surveys keep finding that 25 to 33 percent of Muslim-background believers report a dream of Jesus before they converted. The pattern is steady. The dream opens the door, and a Bible or a Christian walks through it. Ask gently: "Have you ever had a dream about Jesus?" Many have, and have told nobody.</p></div>
<div class="pb"><span class="num">5</span><h4>Assurance, against the scales</h4><p>Converts worn out by earning name this as the thing that decided it. A person can know they are forgiven (1 John 5:13). The scales never offer that.</p></div>
</div>

<div class="pb-h">The method</div>
<div class="pb-grid">
<div class="pb dont"><h4>Never mock Muhammad or the Quran</h4><p>Honor and shame are the frame here, not guilt. An insult to the Prophet attacks their family, their identity and their community. It triggers the honor-defense reflex and ends the conversation for good. In some settings it can put them in danger. Honest questions about Muhammad are fair. Contempt never is.</p></div>
<div class="pb do"><h4>Hospitality is the master key</h4><p>Eating together is the trust currency of Muslim culture. Accept invitations to iftar. Host them back, with no pork and no alcohol. Return the welcome at Christmas and Easter. Most real work with Muslims happens over meals in homes, not in debates.</p></div>
<div class="pb dont"><h4>Use the Quran as a door, never as an authority</h4><p>"Your own book says striking things about Isa. Have you seen them?" is a fair opener. Then get to the Bible quickly and stay there.</p></div>
<div class="pb do"><h4>Learn their vocabulary</h4><p>Isa al-Masih, Injil, Tawrat, Zabur. Using the words signals respect. But define sin, salvation and Son of God before you argue about them.</p></div>
<div class="pb do"><h4>Tell the gospel in honor and shame</h4><p>The sin of Adam brought shame, hiding and exile. Jesus bore our shame in public, <i>despising the shame</i> (Hebrews 12:2), so God could cover us, clean us and seat us as his children with honor. Luke 15:22 has the robe, the ring and the feast. This frame lands where courtroom language does not.</p></div>
<div class="pb do"><h4>Debate and friendship are different tools</h4><p>Debate videos reach doubters watching alone at two in the morning. They are not a script for the face of your neighbor. What breaks certainty rarely makes disciples on its own. Relationships do.</p></div>

<div class="pb do"><h4>Expect years, and pray</h4><p>Qureshi took four years. Abdu Murray took nine, from being persuaded to saying so out loud, because the cost is so high. This is farming, not harvesting.</p></div>

<div class="pb-h">How it actually goes</div>
<p class="sh-open">Of about 750 former Muslims surveyed, the top reason they followed Jesus was the lifestyle and love of the Christians they knew. Not arguments.</p>
<p class="sh-att">— Woodberry, Shubin and Marks, <i>Why Muslims Follow Jesus</i> (Fuller Seminary study, Christianity Today, 2007).</p>

<div class="sa"><h4 class="sat">The seven objections you will hear</h4>
<ol class="sh-list">
<li><b>The Bible is corrupted.</b> The flagship, and everything rests on it. The answer has two halves. The Quran endorses the Bible of the day of Muhammad (10:94; 5:47; 5:68; 6:115). The manuscripts prove that Bible is ours: the Dead Sea Scrolls, and Sinaiticus. Ask: "Corrupted before Muhammad? Then why does the Quran endorse it? Corrupted after? Then why do the pre-Islamic manuscripts match ours?"</li>
<li><b>Jesus never said he was God.</b> Show what he did claim. He forgave sins in his own person (Mark 2:5–7). At his trial he made the Daniel 7 claim that got him condemned for blasphemy (Mark 14:61–64). He accepted the worship of Thomas (John 20:28). He said <i>before Abraham was, I AM</i> (John 8:58). Ask why he was executed for blasphemy.</li>
<li><b>The Trinity is three gods.</b> Clear the ground first. What the Quran attacks is Allah, Jesus and Mary (5:116). That is tritheism, and Christians condemn it too. One God (Deuteronomy 6:4), three persons: one what, three whos. The Quran itself calls Jesus the Word of God and a Spirit from him (4:171). Were the Word and the Spirit of God ever separate from God?</li>
<li><b>Paul invented Christianity.</b> The resurrection creed Paul received (1 Corinthians 15:3–8) dates to within a few years of the cross. Peter, James and John endorsed his gospel (Galatians 2:9). If Paul hijacked it, why did the eyewitnesses die for the same message?</li>
<li><b>Muhammad is the Paraclete of John 14.</b> Read the passage together. The Comforter is the Spirit of truth, whom the world cannot see, who would be in the disciples then living (14:17), sent in the name of Jesus (14:26). Muhammad was a visible man born five hundred years later.</li>
<li><b>The Bible names Muhammad in Song of Songs 5:16.</b> The Hebrew word machmad means lovely, or desirable. It appears about thirteen times in the Old Testament, including of things plundered and destroyed. In context a bride is praising the kisses of her husband. A sound-alike is not a name.</li>
<li><b>The Gospel of Barnabas is the true gospel.</b> It is a demonstrated forgery from the fourteenth to the sixteenth century: a medieval Jubilee reference, wine casks, quotations from Dante. It also contradicts the Quran, because it denies that Jesus is the Messiah. Most Muslim scholars concede that it is not authentic.</li>
</ol></div>

<div class="sa"><h4 class="sat">Count the cost, and never out a seeker</h4>
<p class="pd">Leaving Islam is a crime in about seventeen countries and carries the death penalty in roughly a dozen. In the West the cost is disownment, expulsion, broken engagements, and in extreme cases violence. A convert may lose their family entirely. So never out a Muslim seeker. Not to their family, not on social media, not in a group prayer text. Let them control who knows. Do not run tests with pork or alcohol, because eating bacon proves nothing about faith in Christ (Romans 14). Respect gender lines: men witness to men, women to women. Time baptism wisely. It is the public act that triggers the consequences. And when someone does come to Christ, the church has to become their family in practice, with meals, holidays and help finding a home. Otherwise they drift back, not from doubt but from loneliness. Say it early and often: "I know what this could cost you. I am not going anywhere either way."</p></div>

<div class="sa"><h4 class="sat">Seven bridges, in words they already use</h4>
<ol class="sh-list">
<li><b>The resume of Isa, to the Word made flesh.</b> Word of Allah, Spirit from him, Messiah, born of a virgin, sinless, alive, returning (3:45–49; 4:171). Ask whose resume that is, and why not read everything this one said. Then John 1:1–14.</li>
<li><b>Eid al-Adha, to the Lamb of God.</b> "We ransomed him with a great sacrifice" (37:107). Ask what the ram was pointing to, and why a ransom at all. Then Genesis 22:8, John 1:29 and Mark 10:45.</li>
<li><b>The scales, to assurance.</b> Quran 23:102–103 next to 1 John 5:13. Ask: "Are you sure your good outweighs your bad? Would you want to be sure?"</li>
<li><b>The ninety-nine names, to the one that is missing.</b> The missing name is Father. Master and slave, or Abba. In Luke 15 the father runs, which costs him honor to do. Then Romans 8:15.</li>
<li><b>The Zabur, to Psalm 22.</b> The Quran affirms the Psalms (4:163). Read Psalm 22: pierced hands, divided garments, a thousand years early. Then read Matthew 27. The crucifixion the Quran denies in one late verse is described in a book it endorses.</li>
<li><b>Shame, to honor.</b> Jesus bore shame in public to cover ours and to seat us with honor (Hebrews 12:2). In 1 Peter 2:6, whoever believes in him will not be put to shame.</li>
<li><b>Quran 10:94, to permission to read.</b> Their own book tells doubters to consult the people who read the Book. Offer to read Luke together, one chapter at a time. Nearly every conversion story runs through an open Bible.</li>
</ol></div>

function proofCombine(v,refs){
  const m=String(v).match(/^(.+?)\s+(\d+):(\d+)(?:\s*[-\u2013]\s*(\d+))?$/); if(!m)return null;
  const book=m[1].trim(), ch=m[2]; let lo=+m[3], hi=+(m[4]||m[3]), found=false;
  String(refs||"").replace(/<[^>]+>/g," ").split(/[\u00b7;,]/).forEach(part=>{
    const r=part.trim().match(/^(.+?)\s+(\d+):(\d+)(?:\s*[-\u2013]\s*(\d+))?$/); if(!r)return;
    if(r[1].trim().toLowerCase()!==book.toLowerCase()||r[2]!==ch)return;
    lo=Math.min(lo,+r[3]); hi=Math.max(hi,+(r[4]||r[3])); found=true;});
  return found?book+" "+ch+":"+lo+"-"+hi:null;
}
function proofVerse(ref,refs){
  const cb=refs?proofCombine(ref,refs):null;
  const v=(cb&&VERSES[cb])?VERSES[cb]:VERSES[ref]; if(!v||!v.verses)return "";
  const anyHl=v.verses.some(x=>x.hl), hasCtx=anyHl&&v.verses.some(x=>!x.hl);
  const body=v.verses.map(x=>{
    const lit=(x.hl||!anyHl);
    const txt=(x.hl&&hasCtx)?"<em>"+esc(x.t)+"</em>":esc(x.t);
    return '<span class="vs'+(lit?" hl":"")+'"><span class="vnum">'+x.v+'</span>'+txt+' </span>';
  }).join("");
  const head=hasCtx?esc(v.ref)+", with the verses either side":esc(v.ref);
  return '<div class="versebox proofbox"><div class="vr"><span>'+head+'</span></div><div class="vtext">'+body+'</div></div>';
}
