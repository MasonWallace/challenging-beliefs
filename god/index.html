gical perfection collapses under bad design too. The recurrent laryngeal nerve takes an absurd detour. The vertebrate eye has a blind spot. And using a refuted argument taxes the credibility of every good argument you make afterwards."},{"t":"Do not use this one","d":"Drop it. The skeptic's rebuttal is simply correct on the facts. The wonder itself is legitimate, so say honestly that this is what the world looks like to you. But the argument form belongs to fine-tuning, where the numbers are real and the people arguing are physicists."},{"say":true,"t":"What to say","d":"\"I'm not going to use the banana one. It's wrong, and I'd rather show you the physics.\""}],"rewritten":true,"refwhy":{"Psalm 19:1-4":"The wonder itself is biblical. But this is testimony, not an argument you can win with.","Romans 1:20":"Paul's claim that God is perceived through what he made. It backs fine-tuning, not the banana."},"titleLong":"The banana and 'just look at the trees': retire the design shortcut","quran":[],"hadith":[]},
{"id":"dontuse-anti-evolution-science","title":"Why the 'no transitional fossils' line fails","category":"dont-use-apologetics","claim":"Two arguments to retire together, plainly. First: 'there are no transitional fossils' is false — not disputed, false. Tiktaalik is a fish-tetrapod intermediate that was found by predicting which rock stratum and age to search. Archaeopteryx exists. So does the therapsid reptile-mammal sequence, the whale series from Pakicetus through Ambulocetus to Basilosaurus, and the hominin fossil record. They are displayed in museums, and in an important sense every fossil population is transitional. Second: 'evolution violates the second law of thermodynamics' misuses physics. The second law governs closed systems, and Earth is not one. It receives a torrent of low-entropy sunlight, and local increases in order are utterly routine — an embryo, a snowflake, a refrigerator — while total entropy still rises. Even major creationist organisations now list versions of these arguments among those to avoid. The deeper issue is Augustine's, sixteen centuries old. A Christian talking demonstrable nonsense about nature, 'to the derision of unbelievers', teaches the unbeliever that the faith itself is nonsense. Whatever position one takes on origins, it must not be defended with claims that a first-year biology or physics student can refute.","bible":["Proverbs 18:17","1 Thessalonians 5:21"],"sources":[{"name":"TalkOrigins CC200: 'There are no transitional fossils'","type":"skeptic","url":"http://www.talkorigins.org/indexcc/CC/CC200.html"},{"name":"TalkOrigins CF001: second law claims","type":"skeptic","url":"http://www.talkorigins.org/indexcc/CF/CF001.html"},{"name":"Answers in Genesis, 'Arguments to Avoid' (creationists policing their own)","type":"apologetics","url":"https://answersingenesis.org/arguments-to-avoid/"},{"name":"Wikipedia, 'Tiktaalik' (the predicted find)","type":"institutional","url":"https://en.wikipedia.org/wiki/Tiktaalik"}],"response":"The skeptical rebuttal is settled science, not opinion. The transitional series are catalogued, physical and public, and Tiktaalik was a successful prediction of evolutionary theory — the strongest kind of evidence there is. The thermodynamics claim fails on the first page of any textbook treatment, since open systems importing energy decrease local entropy constantly. A skeptic who hears these arguments concludes, reasonably, that the speaker either does not understand the science or does not care. He then files everything else the speaker says, including the resurrection case, under the same heading.","responseSource":{"url":"http://www.talkorigins.org/indexcc/CC/CC200.html"},"verdict":"answered","rationale":"Don't use — these are false and refuted, and this site says so plainly rather than hedging. TalkOrigins documents both, at CC200 on transitional fossils and CF001 on the second law, and Answers in Genesis lists them among arguments to avoid. Christians hold a range of origins views, as the science-and-Genesis entry sets out. None of those views needs, or is helped by, claims that are simply wrong. The cost is paid by the Gospel's credibility, exactly as Augustine warned.","severity":"low","avoid":true,"plain":[{"t":"Two claims to retire","d":"First: \"there are no transitional fossils.\" That is not disputed. It is false. Second: \"evolution violates the second law of thermodynamics.\" That misuses physics."},{"t":"The fossils","d":"Tiktaalik is a fish-tetrapod intermediate. It was found by predicting which rock layer and age to search in, which is the strongest kind of evidence there is. Then Archaeopteryx. The therapsid sequence from reptile to mammal. The whale series, from Pakicetus through Ambulocetus to Basilosaurus. The hominin record. They are on display in museums. In an important sense every fossil population is transitional."},{"t":"The physics","d":"The second law governs closed systems. Earth is not one. It receives a torrent of low-entropy sunlight. Local order increases all the time, in an embryo, a snowflake, a refrigerator, while total entropy still rises. This one fails on the first page of any textbook."},{"t":"Who else says so","d":"Even major creationist bodies now list versions of these among arguments to avoid. Answers in Genesis publishes such a list. TalkOrigins catalogues both claims: CC200 on transitional fossils, CF001 on the second law."},{"t":"Do not use these","d":"They are false and refuted, and this site says so plainly rather than hedging. The deeper issue is Augustine's, sixteen centuries old. A Christian talking demonstrable nonsense about nature, <b>\"to the derision of unbelievers,\"</b> teaches the unbeliever that the faith is nonsense too. Christians hold a range of views on origins. None of them needs claims a first-year student can refute."},{"say":true,"t":"What to say","d":"\"Those two are wrong and I won't use them. Whatever you think about origins, that isn't the argument.\""}],"rewritten":true,"refwhy":{"Proverbs 18:17":"The first to plead seems right until another examines him. Both claims fail that examining.","1 Thessalonians 5:21":"'Test all things.' The rule that should have caught these two before anyone repeated them."},"titleLong":"'No transitional fossils' and the second law of thermodynamics: bad science, bad witness","quran":[],"hadith":[]},
{"id":"dontuse-darwin-recanted","title":"The Darwin deathbed story never happened","category":"dont-use-apologetics","claim":"The story that Charles Darwin renounced evolution and embraced Christ on his deathbed traces to 'Lady Hope', Elizabeth Hope, a British evangelist. She told a Massachusetts gathering in 1915 — thirty-three years after Darwin died in 1882 — that she had visited him near the end and found him reading Hebrews and lamenting his theory. Darwin's family, who were actually present at his death, flatly denied it. His daughter Henrietta Litchfield wrote in print in 1922: 'I was present at his deathbed... He never recanted any of his scientific views, then or earlier.' Darwin died an agnostic, courteous toward a faith he did not share, and no serious historian — Christian or otherwise — credits the tale. Notice also that the story would prove nothing even if it were true. Theories stand or fall on evidence, not on their authors' final anxieties. Christianity would not be falsified by a deathbed recantation from Paul's biographer, and evolution is not falsified by one from Darwin. Repeating this legend does double damage: it spreads a falsehood, and it implies that the speaker's case needs one.","bible":["Exodus 20:16","Ephesians 4:25"],"sources":[{"name":"TalkOrigins, 'The Lady Hope Story: A Widespread Falsehood'","type":"skeptic","url":"http://www.talkorigins.org/faqs/hope.html"},{"name":"Wikipedia, 'Elizabeth Hope' (the legend's history)","type":"institutional","url":"https://en.wikipedia.org/wiki/Elizabeth_Hope"},{"name":"Answers in Genesis lists it among arguments to avoid","type":"apologetics","url":"https://answersingenesis.org/arguments-to-avoid/"},{"name":"James Moore, The Darwin Legend (the scholarly autopsy)","type":"scholarly","url":"https://en.wikipedia.org/wiki/The_Darwin_Legend"}],"response":"There is no counter to steelman. The skeptic is right, the historians are right, and even the major creationist organisations agree the story is false — Answers in Genesis lists it among arguments to avoid, and James Moore's The Darwin Legend is the scholarly autopsy. The Darwin family's firsthand denials, the thirty-three-year gap, and the total absence of corroboration settle it. A Christian repeating it is bearing false witness about a dead man, in service of a point that would be logically worthless even if the story were true.","responseSource":{"url":"http://www.talkorigins.org/faqs/hope.html"},"verdict":"answered","rationale":"Don't use, ever. The command against false witness does not have an apologetics exemption. If it comes up, the Christian's move is to debunk it first. Nothing builds trust with a skeptic faster than watching a believer kill a convenient legend on principle.","severity":"low","avoid":true,"plain":[{"t":"The story","d":"The story is that Charles Darwin gave up evolution on his deathbed and turned to Christ. The source is Lady Hope, whose name was Elizabeth Hope. She was a British evangelist. In 1915 she told a gathering in Massachusetts that she had visited him near the end. She said she found him reading Hebrews and sorry for his theory."},{"t":"Why it is false","d":"Darwin died in 1882. That is thirty-three years before she told the story. His family were there. They denied it flatly. His daughter Henrietta Litchfield wrote in print in 1922: <b>\"I was present at his deathbed... He never recanted any of his scientific views, then or earlier.\"</b> Darwin died an agnostic, kind about a faith he did not share. No serious historian credits the tale. James Moore's The Darwin Legend is the careful study of it. Answers in Genesis lists the story among arguments to avoid."},{"t":"It would prove nothing anyway","d":"A theory stands or falls on evidence. It does not stand or fall on what its author felt at the end. Christianity would not be undone by a deathbed change of heart from one of Paul's biographers. Evolution is not undone by one from Darwin."},{"t":"Do not use this one, ever","d":"Telling it does two kinds of damage. It spreads something false. And it tells your listener that your case needs a false thing. The command against bearing false witness has no exemption for apologetics (Exodus 20:16)."},{"t":"What to do instead","d":"If it comes up, debunk it first, yourself. Nothing builds trust with a skeptic faster than watching a Christian kill a convenient legend on principle."},{"say":true,"t":"What to say","d":"\"That story isn't true. His daughter denied it in print, and I'm not going to repeat it.\""}],"rewritten":true,"refwhy":{"Exodus 20:16":"'Do not bear false witness.' Quoted in the case. There is no exemption for apologetics.","Ephesians 4:25":"'Put away falsehood; speak the truth.' The same command, aimed at the church itself."},"titleLong":"'Darwin recanted on his deathbed': the Lady Hope legend is false","quran":[],"hadith":[]},
{"id":"dontuse-pascals-wager-opener","title":"Why Pascal's wager fails as an opener","category":"dont-use-apologetics","claim":"Deployed as a conversation-opener — 'you might as well believe; if you're wrong you lose nothing' — the wager fails three ways, and skeptics know all three. The many-gods objection: the same bet works for Allah, for Vishnu, or for a deity who rewards honest doubt and punishes hedged belief, so the wager alone selects no religion. The doxastic problem: belief is not a light switch, and no one can sincerely believe a proposition for prize money — as the skeptic being lectured is vividly aware while not believing. The mercenary problem: it presents faith as fire insurance, which misrepresents a Gospel whose call is love of God, not actuarial self-interest. What almost everyone misses is that Pascal knew all this. The wager appears in the Pensées at fragment 233, aimed at a specific reader: the sophisticated Parisian too indifferent to investigate. Its real function is anti-apathy — to show that the God question is not intellectually optional, and that the stakes make honest investigation mandatory. After that, Pascal prescribes practice and inquiry, not instant belief. That limited use survives, as a closing nudge to a genuine inquirer, not as an opening argument to a skeptic.","bible":["Deuteronomy 6:5","Jeremiah 29:13","Hebrews 11:6"],"sources":[{"name":"SEP, 'Pascal's Wager' (the objections, formalized)","type":"scholarly","url":"https://plato.stanford.edu/entries/pascal-wager/"},{"name":"Blaise Pascal, Pensées (the wager in context, fragment 233)","type":"primary","url":"https://www.gutenberg.org/ebooks/18269"},{"name":"Wikipedia, 'Pascal's wager' (many-gods objection history)","type":"institutional","url":"https://en.wikipedia.org/wiki/Pascal%27s_wager"},{"name":"Peter Kreeft's sympathetic reconstruction (the legitimate limited use)","type":"apologetics","url":"https://www.peterkreeft.com/"}],"response":"The skeptic's objections are sound against the popular version. The wager is decision theory with a rigged partition, since it assumes exactly two live options. It demands belief as an act of will, which is impossible. And the God it imagines — one fooled by self-interested compliance — is not worth believing in, since an omniscient being would presumably prefer honest disbelief to strategic pretence. Even the rehabilitated anti-apathy use has a limit. It motivates inquiry, and inquiry may honestly conclude against faith. The wager cannot then be re-invoked to overrule the verdict it commissioned.","responseSource":{"url":"https://plato.stanford.edu/entries/pascal-wager/"},"verdict":"answered","rationale":"Don't use as an opener or as a proof. It is graded 'answered' because in its common street form the skeptical counters succeed. The salvage is real, and Peter Kreeft has reconstructed it sympathetically. At the end of a conversation with a genuinely undecided person, Pascal's actual point — that this question is too important for indifference, so investigate it seriously — is both honest and effective. Slot matters: last word to the apathetic, never first word to the skeptic.","severity":"low","avoid":true,"plain":[{"t":"The version that fails","d":"\"You might as well believe. If you're wrong, you lose nothing.\" Used as an opener, that fails in three ways, and skeptics know all three."},{"t":"The three problems","d":"Many gods: the same bet works for Allah, for Vishnu, or for a god who rewards honest doubt and punishes hedged belief. So the wager alone picks no religion. Belief is not a switch: nobody can sincerely believe something for prize money, as the person being lectured is vividly aware. And it is mercenary: it sells faith as fire insurance, which misrepresents a Gospel whose call is to love God (Deuteronomy 6:5)."},{"t":"What almost everyone misses","d":"Pascal knew all of this. The wager sits in the Pensées, fragment 233, aimed at one particular reader. The sophisticated Parisian too indifferent to look into the question. Its real job is anti-apathy. It says the question is not optional, and the stakes make honest inquiry a duty. Then Pascal prescribes practice and inquiry, not instant belief. Peter Kreeft has reconstructed that limited use sympathetically."},{"t":"Their answer, at full strength","d":"The objections are sound against the street version. The wager is decision theory with a rigged table, since it assumes exactly two live options. It demands belief as an act of will, which is impossible. And a God fooled by self-interested compliance is not worth believing in. An all-knowing being would presumably prefer honest disbelief to strategic pretence. Even the rescued use has a limit. It motivates inquiry, and inquiry may honestly end against faith. You cannot then re-invoke the wager to overrule the verdict it asked for."},{"t":"Do not open with this","d":"Slot matters. Last word to someone apathetic. Never first word to a skeptic. The salvage is real. At the end of a talk with a genuinely undecided person, Pascal's actual point stands. This question is too important to be indifferent about."},{"say":true,"t":"What to say","d":"\"I'm not asking you to bet. I'm asking whether the question is worth your serious attention.\""}],"rewritten":true,"refwhy":{"Deuteronomy 6:5":"'Love the LORD your God with all your heart.' The call a fire-insurance bet cannot produce.","Jeremiah 29:13":"'Seek me with all your heart.' Seeking, not betting. That is Pascal's real prescription.","Hebrews 11:6":"Says God rewards those who seek him, but also that one must first believe he is. Awkward for a bet."},"titleLong":"Pascal's wager as an opener: wrong tool, wrong slot","quran":[],"hadith":[]},
{"id":"dontuse-atheist-mind-reading","title":"Mind-reading the atheist: three lines to retire","category":"dont-use-apologetics","claim":"Three tropes to retire, and Scripture itself retires the worst of them. 'Atheists secretly believe and are suppressing it' proof-texts Romans 1 while ignoring Romans 2:14-15, where Gentiles without the law 'do by nature what the law requires' because it is 'written on their hearts'. The Bible predicts morally serious, conscience-driven unbelievers. It does not license telling your neighbour that she is lying about her own inner life. Empirically, many atheists are deconverts who describe leaving faith as painful, slow and honest, often by way of church hurt — John Marriott's research documents exactly that. Telling them their loss was secretly insincere reopens the wound and ends the conversation. 'Atheists have no basis for morality' conflates a legitimate metaethical question, about what grounds moral facts, with a slander that atheists are not moral — false in observation and, per Romans 2, false in doctrine. 'It takes more faith to be an atheist' equivocates, since the atheist means by 'faith' precisely what she rejects, so the line lands as a taunt rather than an argument. All three substitute diagnosis of the person for engagement with the position. The entire posture of this section depends on refusing that substitution.","bible":["Romans 2:14-15","1 Peter 3:15-16","Proverbs 18:13"],"sources":[{"name":"Romans 2:14-15 (the text that forbids the trope)","type":"primary","url":"https://www.biblegateway.com/passage/?search=Romans+2%3A12-16&version=ESV"},{"name":"SEP, 'Atheism and Agnosticism' (what atheists actually claim)","type":"scholarly","url":"https://plato.stanford.edu/entries/atheism-agnosticism/"},{"name":"Pew Research, religious 'nones' and deconversion data","type":"institutional","url":"https://www.pewresearch.org/religion/"},{"name":"John Marriott's research on deconversion and church hurt","type":"apologetics","url":"https://www.biola.edu/"}],"response":"The skeptic's response is simply true and should be received as such. 'I don't secretly believe. I left slowly, honestly, and at real personal cost, and being told otherwise is being called a liar.' On morality: moral motivation and moral knowledge are demonstrably independent of metaethics. Atheists donate kidneys and run soup kitchens, and Euthyphro-style questions show that grounding puzzles cut at theists too. On 'more faith': defining the atheist's evidential standard as 'faith' is a word game that concedes the argument by changing the dictionary. Each rebuttal is correct, and each trope, when deployed, confirms the deconvert's suspicion that the church argues in bad faith.","responseSource":{"url":"https://www.biblegateway.com/passage/?search=Romans+2%3A12-16&version=ESV"},"verdict":"answered","rationale":"Don't use. It is graded 'answered' because the skeptical rebuttals to all three tropes succeed, and in this case the Bible is on the skeptic's side of the exchange, since Romans 2 predicts the moral atheist. Engage arguments, never diagnose interlocutors. With deconverts especially, ask about their story before offering any case at all. This entry is the tonal keystone of the whole section.","severity":"low","avoid":true,"plain":[{"t":"Three lines to retire","d":"\"You secretly believe, and you're suppressing it.\" \"You have no basis for morality.\" \"Atheism takes more faith than Christianity.\" All three are common. All three should go."},{"t":"Scripture retires the first one","d":"It proof-texts Romans 1 and skips Romans 2:14-15, where Gentiles without the law <b>\"do by nature what the law requires\"</b> because it is <b>\"written on their hearts.\"</b> The Bible predicts morally serious unbelievers. It does not license telling your neighbour she is lying about her own inner life."},{"t":"And the facts do too","d":"Many atheists are deconverts. They describe leaving as slow, painful and honest, and it often began with being hurt by a church. John Marriott has researched exactly that. Telling them the loss was secretly insincere reopens the wound and ends the conversation."},{"t":"The other two","d":"\"No basis for morality\" mixes a real question with a slander. The real question is what grounds moral facts, and that is the moral argument, worth having. The slander is that atheists are not moral. That is false in observation and false in doctrine, per Romans 2. \"It takes more faith\" is a word game. The atheist means by faith precisely the thing she rejects, so the line lands as a taunt, not an argument."},{"t":"Do not use any of them","d":"Each rebuttal is correct. Each line, used, confirms a deconvert's suspicion that the church argues in bad faith. All three swap diagnosing the person for engaging the position. Engage arguments. Never diagnose people. With deconverts especially, ask about their story before you offer any case at all. The rest of this section depends on that one habit."},{"say":true,"t":"What to say","d":"\"What happened? I'd rather hear your story than argue with a version of you I invented.\""}],"rewritten":true,"refwhy":{"Romans 2:14-15":"Serves the sceptic here. People without the law 'do by nature what the law requires'.","1 Peter 3:15-16":"Answer 'with mildness and deep respect'. The standard all three of these lines break.","Proverbs 18:13":"Answering before you have heard the matter is folly. That is what mind-reading a person is."},"titleLong":"Mind-reading the atheist: 'you secretly believe,' 'you have no morals,' 'atheism takes more faith'","quran":[],"hadith":[]},
{"id":"resurrection-willing-to-die","title":"'They died for it' — and where it fails","category":"resurrection-case","claim":"The disciples suffered, and in several cases died, rather than deny that they had seen Jesus alive. People will die for something they sincerely believe. Nobody dies for something they know they made up. And these particular people were in a position to know.","response":"The skeptic's reply comes in three parts, and the first two are right. (1) Sincerity proves nothing about truth. The 9/11 hijackers died for their faith, as have Heaven's Gate members, Jim Jones's congregation, and martyrs of every religion on earth. Willingness to die establishes that a person believes what they are saying, and nothing more. (2) The historical record for most of the apostles is very thin. Only one apostolic death is recorded in the New Testament: James son of Zebedee, beheaded by Herod Agrippa I around AD 44 (Acts 12:2). The vivid traditions — Thomas speared in India, Bartholomew flayed alive, Andrew on an X-shaped cross, Peter crucified upside down — come from apocryphal Acts written between the second and fourth centuries, which also contain talking animals and resurrected fish. Sean McDowell's <i>The Fate of the Apostles</i> (2015) is the most thorough treatment by a Christian scholar, and he grades the evidence honestly. He judges the martyrdoms of Peter, Paul, James son of Zebedee and James the brother of Jesus to be historically well-established, John's death to be probably natural, and most of the rest to be possible but not demonstrable. (3) And even granting all of it, martyrdom establishes only that the disciples sincerely believed they had seen the risen Jesus — which skeptical scholars like Gerd Lüdemann already concede without difficulty, explaining the belief as visionary experience.","responseSource":{"name":"Sean McDowell, The Fate of the Apostles (2015); Candida Moss, The Myth of Persecution (2013); Gerd Lüdemann, The Resurrection of Jesus","url":"https://www.routledge.com/The-Fate-of-the-Apostles/McDowell/p/book/9781032097213"},"sources":[{"name":"Sean McDowell, The Fate of the Apostles (Routledge, 2015)","type":"scholarly","url":"https://www.routledge.com/The-Fate-of-the-Apostles/McDowell/p/book/9781032097213"},{"name":"1 Clement 5 (c. AD 95) — on Peter and Paul's sufferings","type":"primary","url":"https://www.earlychristianwritings.com/text/1clement-roberts.html"},{"name":"Josephus, Antiquities 20.200 — the execution of James, the brother of Jesus","type":"primary","url":"https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.01.0146%3Abook%3D20"},{"name":"Tacitus, Annals 15.44 — the Neronian persecution","type":"primary","url":"https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.02.0078:book=15:chapter=44"},{"name":"Candida Moss, The Myth of Persecution (HarperOne, 2013)","type":"scholarly","url":"https://www.harpercollins.com/products/the-myth-of-persecution-candida-moss"}],"bible":["Acts 12:1-2","1 Corinthians 15:14-19","2 Corinthians 11:23-28","Acts 26:9-11"],"verdict":"contested","severity":"medium","rationale":"Graded contested, because the popular version fails and the disciplined version holds, and the difference between them is everything. What survives scrutiny is a narrow, real point. The disciples were not in the position of ordinary religious martyrs. A Muslim martyr dies for a revelation he received on someone else's testimony. A Heaven's Gate member dies for a metaphysics nobody could check. The disciples are claiming to have eaten with a man they watched die — a claim about which they personally could not be honestly mistaken in the way a second-hand believer can. Either they saw something, or they knew they had not. Paul is the sharpest case, because he was persecuting the movement and had every worldly reason not to join it, and 2 Corinthians 11 lists what it cost him, in his own hand. So the argument does real work, but bounded work. It establishes sincerity, not truth. It rules out deliberate fraud — the 'they stole the body and made it up' theory — and it rules out nothing else. Present it that way, with the thin evidence for the ten conceded up front, and it is durable. Present it as 'all twelve apostles were tortured to death and none recanted' and you will meet someone who has read McDowell, or Candida Moss's The Myth of Persecution, and you will lose everything you said before it.","talk":"Never say 'all twelve were martyred.' Say the narrow thing: **“I'm not arguing that dying for a belief makes it true — plenty of people have died for things that were false. I'm arguing these particular men were in a position to know whether they had made it up, and they behaved for the rest of their lives like men who hadn't.”** Then concede the evidence for most of them is late and thin, and name Paul, who was on the other side first.","plain":[{"t":"The argument","d":"The disciples suffered, and some of them died, rather than deny that they had seen Jesus alive. People will die for what they truly believe. Nobody dies for a thing they know they made up. And these men were in a place to know."},{"t":"Two thirds of the reply are right","d":"One: being sincere proves nothing about being right. The 9/11 hijackers died for their faith. So did Heaven's Gate members, and Jim Jones's flock, and martyrs of every faith on earth. A willingness to die shows belief, and no more. Two: the record is thin. The New Testament gives one apostle's death. James son of Zebedee, beheaded by Herod Agrippa I around AD 44 (Acts 12:2)."},{"t":"Where the vivid stories come from","d":"Thomas speared in India. Bartholomew flayed alive. Andrew on an X-shaped cross. Peter nailed up head down. Those come from the apocryphal Acts, written between the second and fourth centuries. Those same texts have talking animals and a smoked fish brought back to life. Sean McDowell's <i>The Fate of the Apostles</i> (Routledge, 2015) is the fullest Christian study, and he grades the evidence honestly. Well attested: Peter, Paul, James son of Zebedee, and James the brother of Jesus. John most likely died of old age. Most of the rest is possible but cannot be shown."},{"t":"The third part, and what survives","d":"Even granting all of it, martyrdom shows only that they believed they had seen Jesus risen. Gerd Lüdemann concedes that easily and calls it a vision. Here is what still stands. These were not ordinary martyrs. A Muslim martyr dies for a message he received on someone else's word. A Heaven's Gate member dies for a picture of reality nobody could check. These men claimed to have eaten with a man they watched die. Either they saw something or they knew they had not. Paul is the sharpest case. He had been hunting the movement down. He had every worldly reason to stay out. And 2 Corinthians 11 lists what it cost him, in his own hand."},{"t":"How strong is this argument?","d":"Contested, because the loud version fails and the careful one holds. It shows they meant it. It does not show they were right. It rules out a planned fraud, the \"they stole the body\" theory, and nothing more. Present it that way, giving away the thin evidence for the other ten up front, and it will hold. Present it as all twelve tortured and none breaking, and you will meet someone who has read McDowell, or Candida Moss's The Myth of Persecution."},{"say":true,"t":"What to say","d":"\"They weren't taking someone's word for it. They said they ate with a man they had watched die.\""}],"rewritten":true,"refwhy":{"Acts 12:1-2":"The one apostle whose death the New Testament records. Herod had James put to the sword.","1 Corinthians 15:14-19":"Paul says that if Christ was not raised, their preaching is empty and they are false witnesses.","2 Corinthians 11:23-28":"Paul's own list of what the claim cost him: beatings, prison, shipwreck. First-hand, not legend.","Acts 26:9-11":"Paul describing how hard he once hunted Christians. It is why his change of side counts."},"titleLong":"'They died for it' — the argument in the only form that works","quran":[],"hadith":[]},
{"id":"dontuse-all-twelve-martyred","title":"Don't claim all twelve apostles were martyred","category":"dont-use-apologetics","claim":"A staple of sermons and tracts. Every one of the twelve was tortured to death. A single recantation would have ended Christianity, yet not one of them broke.","response":"There is no ancient source that says this, and there never was. The New Testament records one apostolic death, James son of Zebedee (Acts 12:2). Peter and Paul's deaths in Rome are early and well-attested. 1 Clement, written around AD 95, speaks of their sufferings, and Tacitus describes Nero's persecution. But the specific details, including the upside-down cross, come from later tradition. For most of the others, the source is a body of apocryphal Acts composed from the second to the fourth century. Those same texts feature a talking lion and a resurrected smoked fish. Early Christian tradition holds that John died of old age at Ephesus, which Eusebius reports in Church History 3.31. That by itself falsifies the 'all twelve' claim. The 'not one recanted' half is worse. It argues from the absence of records nobody kept. We have no roster of who held firm, because we have no reliable roster of what happened to most of them at all. Sean McDowell wrote as a Christian apologist, specifically to defend this line of evidence. He is the one who documents how little of it can be established.","responseSource":{"name":"Sean McDowell, The Fate of the Apostles (2015) — a Christian scholar's own grading of the evidence","url":"https://www.routledge.com/The-Fate-of-the-Apostles/McDowell/p/book/9781032097213"},"sources":[{"name":"Sean McDowell, The Fate of the Apostles (Routledge, 2015)","type":"scholarly","url":"https://www.routledge.com/The-Fate-of-the-Apostles/McDowell/p/book/9781032097213"},{"name":"The Acts of Thomas (3rd c. apocryphal)","type":"primary","url":"https://www.newadvent.org/fathers/0805.htm"},{"name":"Eusebius, Church History 3.31 — John at Ephesus","type":"primary","url":"https://www.newadvent.org/fathers/250103.htm"}],"bible":["Acts 12:1-2","1 Thessalonians 5:21","Proverbs 12:22"],"verdict":"answered","severity":"low","avoid":true,"rationale":"Avoid it. It overclaims a real argument into a false one, and the correction is a single search away. The moment a skeptic checks Thomas or Bartholomew and finds a third-century romance, everything true you said about the crucifixion, the creed and Paul is suspect. You have taught them that you repeat things you have not checked. The fix is not to drop the evidence. Shrink the claim to what the sources carry: Peter, Paul, James son of Zebedee and James the brother of Jesus. The last of those is attested by Josephus, who was not a Christian. Four well-documented deaths, made in the strongest possible position of knowledge, is a better argument than twelve legendary ones. It is better precisely because it survives being checked.","talk":"If you have used this one — and most of us have — say so: **“I used to say all twelve were martyred. That's not what the sources support, and I stopped saying it.”** Then give the four that hold. Nothing rebuilds credibility with a skeptic faster than a Christian correcting a Christian talking point unprompted.","plain":[{"t":"The claim","d":"Every one of the twelve was tortured to death, and one recantation would have ended Christianity, yet not one of them broke. It is a staple of sermons and tracts."},{"t":"There is no ancient source for it","d":"There never was one. The New Testament records a single apostolic death, James son of Zebedee (Acts 12:2). Peter and Paul's deaths in Rome are early and well attested. 1 Clement, written around AD 95, speaks of their sufferings, and Tacitus describes Nero's persecution. But the specific details, including the upside-down cross, come from later tradition."},{"t":"Where the rest comes from","d":"For most of the others, the source is a body of apocryphal Acts written from the second to the fourth century. Those texts also feature a talking lion and a resurrected smoked fish. And early Christian tradition holds that John died of old age at Ephesus, which Eusebius reports in Church History 3.31. That by itself falsifies the claim about all twelve."},{"t":"The second half is worse","d":"\"Not one recanted\" argues from the absence of records nobody kept. We have no roster of who held firm, because we have no reliable roster of what happened to most of them at all."},{"t":"Do not use this one","d":"It overclaims a real argument into a false one, and the correction is one search away. The moment someone checks Thomas or Bartholomew and finds a third-century romance, everything true you said about the crucifixion, the creed and Paul becomes suspect. The fix is not to drop the evidence. Shrink the claim to what the sources carry. Peter, Paul, James son of Zebedee, and James the brother of Jesus, the last attested by Josephus, who was not a Christian. Four well-documented deaths, by men in the strongest possible position to know, beats twelve legendary ones. It survives being checked. Sean McDowell, an apologist who set out to defend this evidence, is the one who documented how little of it stands."},{"say":true,"t":"What to say","d":"\"I only claim four of them, and I can show you the sources for all four.\""}],"rewritten":true,"refwhy":{"Acts 12:1-2":"The only apostolic death in the New Testament. One, not twelve. That is the whole correction.","1 Thessalonians 5:21":"'Test all things.' A rule that would have stopped this claim before it spread.","Proverbs 12:22":"'Lying lips are detestable to the LORD.' Why an overclaim is not a small thing."},"titleLong":"DON'T USE: 'all twelve apostles were martyred and not one recanted'","quran":[],"hadith":[]}

const WHYTAIL={"admitted":"Skeptical scholarship grants the core fact here. Argue it from their sources and there is nothing to dispute except what follows from it.","unrefuted":"The published naturalistic alternatives do not answer this. Present it once, without pressing, and let it do its own work.","contested":"Serious people argue this both ways. Say that out loud before you take a side — a skeptic can tell when a case is being oversold, and that is usually the moment they stop listening.","answered":"Do not use this one. It is a popular Christian argument that fails, and it costs you the credibility of every true thing you have said."};
const WHYMAP={"existence-arguments":"These do not deliver Christianity — they deliver the possibility of it. Their job is to move 'obviously not' to 'that's worth thinking about,' which is the only move most conversations need.","resurrection-case":"Christianity is the one faith that stakes itself on a public, datable, falsifiable event. Paul says so himself: if it didn't happen, the whole thing is worthless.","manuscript-reliability":"If the text can't be trusted to be what was written, nothing built on it matters. This is also where honesty pays most — the variant count is not a secret, and pretending otherwise is why people stop listening.","archaeology-history":"The Bible makes checkable claims about real kings, real pools, and real officials. Some check out strikingly. One genuinely doesn't yet, and saying so is what makes the rest credible.","prophecy-evidence":"Prophecy is the argument most often ruined by overclaiming. Handled carefully it is real evidence; handled loosely it converts a skeptic into a skeptic with a good story about you.","objections-answered":"These are not talking points to defeat — they are the reasons people actually don't believe, and several of them are genuinely hard. An answer that pretends they're easy answers nothing.","dont-use-apologetics":"Every one of these is still in circulation, and each one costs a hearing for everything true you have to say. Retiring them is the highest-return thing on this page."};
const TALK={"existence-arguments":"Do not try to prove God at a dinner table. Aim one notch lower: **“Would you agree this is at least a question worth taking seriously?”** Contingency travels better than the Kalam — *“why is there anything at all, rather than nothing?”* — because it does not depend on any particular cosmology being right.","resurrection-case":"Start where they already agree: **“Do you think Jesus existed and was crucified?”** Almost every informed skeptic says yes. Then, one step at a time: the disciples' experiences, Paul, James, the creed's date. Never assert the Bible is inspired here — you are arguing from documents, not from Scripture.","manuscript-reliability":"Concede the number first, loudly: **“There are hundreds of thousands of variants — and I'll show you what they are.”** Spellings, word order, a handful of meaningful passages that every modern Bible footnotes. Honesty about the number is what makes the conclusion believable.","archaeology-history":"Lead with the strongest and concede the weakest in the same breath: **“Tel Dan, Hezekiah's tunnel, the Pilate stone, the Pool of Siloam — and the Quirinius census is a genuine difficulty I can't fully resolve.”** That second clause is what makes the first one land.","prophecy-evidence":"This is the easiest place to lose a skeptic by overclaiming. Use the Dead Sea Scrolls point — **“the text is provably older than the events”** — and skip the Tyre-brick-by-brick material entirely unless you know its complications cold.","objections-answered":"Never answer these quickly. **“That's the strongest argument against what I believe, and I don't think it has a tidy answer”** buys more than any rebuttal. Then give the real one, with its limits named. On evil, ask what happened to them — very often the argument is a wound wearing a syllogism.","dont-use-apologetics":"If you have used one of these, say so plainly: **“I used to argue that, and it was wrong.”** Nothing else you can do rebuilds credibility that fast, and every skeptic has a list of Christians who could not do it."};
const DIALOG={"existence-arguments":[{"w":"them","t":"Let me be precise, because most Christians argue with a strawman. I don't claim 'there is no God' with dogmatic certainty. My claim is Oppy's: naturalism and theism both explain the world, but naturalism does it with fewer commitments — no extra divine entity. Simpler theory, same data. That's why I'm an atheist."},{"w":"you","t":"That's the strongest version of atheism and I'd rather argue with it than the bumper sticker — thank you. But I'd contest 'same data.' Naturalism has to take as brute, unexplained facts things theism predicts: that anything contingent exists at all, that the constants sit inside a life-permitting window as narrow as 1 part in 10^120 for the cosmological constant, that the universe is intelligible to minds. A 'simpler' theory that must shrug at more data isn't simpler — it's just shorter."},{"w":"them","t":"Fine-tuning has a naturalistic answer: the multiverse plus observer selection. Infinite universes, varying constants — of course we find ourselves in a habitable one. Where else would we be?"},{"w":"you","t":"I won't pretend that's a dodge — the multiverse comes out of serious physics, and I'd rather you hold it than pretend the tuning isn't there. Two honest pushbacks, though: it's postulated, not observed, and possibly unobservable in principle — an interesting position for the 'evidence only' side; and the multiverse-generating mechanism itself needs finely set laws to churn out universes at all, so the tuning question climbs one level and waits for you there. You've multiplied entities beyond anything theism ever dreamed to avoid one Mind."},{"w":"them","t":"And here's my fatigue talking: every one of these arguments is a god-of-the-gaps. 'Science can't explain X, therefore God.' The gaps keep closing. Lightning, disease, now cosmology — same retreat, new trench."},{"w":"you","t":"If I were arguing from ignorance you should dismiss me — but notice these arguments run the other way: from what we KNOW. We know the constants' values; we know contingency; the more cosmology advanced, the sharper the beginning and the tuning got — Lemaître, a priest, did some of the advancing. So here's my honest question, and you can refuse it: setting proofs aside, if it turned out there were a Mind behind this — would that be good news to you, or bad news? Nagel admitted 'I hope there is no God.' I'm not scoring points; I genuinely want to know which conversation we're actually in."}],"resurrection-case":[{"w":"them","t":"Extraordinary claims require extraordinary evidence, and a resurrection is the most extraordinary claim there is. Hume settled this: it's always more probable that testimony is mistaken than that nature broke. Whatever your evidence is, 'they lied or erred' beats 'a man rose.'"},{"w":"you","t":"I accept the principle — big claims need serious evidence — but Hume's version proves too much: it would forbid believing ANY sufficiently rare event on testimony, which isn't how history or courts work. So let's do it your way: start from only what critical scholars grant. Jesus was crucified — Ehrman calls it one of the most certain facts of history. His followers had experiences they were convinced were the risen Jesus — the atheist scholar Lüdemann says that's 'historically certain.' The church's enemy Paul and skeptical brother James flipped. My claim is modest: the resurrection is the best EXPLANATION of that data. Beat the explanation."},{"w":"them","t":"I've read my Ehrman too, so let's be honest about him: he does NOT grant your empty tomb, and he thinks apologists oversell the '1 Corinthians 15 creed within three years' dating. You're quote-mining concessions."},{"w":"you","t":"You're right, and I'll say it plainly: Ehrman disputes the empty tomb and cautions against the tight creed dating — anyone who cites him without saying so is bluffing, and you've earned the right to hate bluffing. What he does affirm: the creed is pre-Pauline tradition, and Paul got it early — at latest around his Jerusalem visit within a few years of the cross; the aggressive early dating actually comes from non-Christians like Lüdemann and Goulder. So even on Ehrman's floor: no legend had time to grow. Something happened in year one, not generation three."},{"w":"them","t":"Grief hallucinations happened. They're documented — bereaved people see the dead all the time. Traumatized disciples, cognitive dissonance, visions, and the story snowballs. No miracle needed."},{"w":"you","t":"Grief visions are real — I won't insult you by denying the literature. But look at the fit: they're private, individual, and the bereaved almost never conclude 'therefore he is bodily risen — let's die saying so.' This theory needs repeated experiences, to groups, including two men NOT grieving — Paul was hunting Christians and James thought his brother unhinged — plus it leaves the tomb occupied in the one city where producing the body ends the movement by lunch. I'll grant you this isn't mathematical proof; it's inference to the best explanation, and you're entitled to weigh it. My question is only whether you're weighing it — or whether, resurrection being unwelcome, any alternative wins by default. Would you WANT it to be true?"}],"manuscript-reliability":[{"w":"them","t":"Ehrman's number, since you like him: there are more variants among New Testament manuscripts than there are words IN the New Testament — 400,000 plus. It's a photocopied photocopy of anonymous documents. Why would I trust a word of it?"},{"w":"you","t":"The number's real, so let's look at the denominator he'd also give you: 400,000 variants counted across some 5,800 Greek manuscripts plus tens of thousands of ancient translations. More manuscripts means more variants the way more witnesses means more discrepancies — it's a symptom of a huge evidence base, which is the OPPOSITE of a transmission problem. The overwhelming majority are spelling, word order, a dropped article. Compare: most classical works survive in a few dozen copies from centuries later, and nobody panics. By the standards applied to Tacitus, this is embarrassment of riches."},{"w":"them","t":"Spelling errors, sure — but Mark's resurrection ending and the woman caught in adultery are whole invented PASSAGES. Your own study Bible admits it in the footnotes. Scribes added stories. That's not a typo problem."},{"w":"you","t":"Correct, both — and think about how you know. You know because the tradition is transparent enough to catch its own seams: thousands of manuscripts to compare, and the conclusions printed in brackets in every pew Bible on earth. A conspiracy doesn't footnote its forgeries. Those two passages are the LARGEST variants in existence, and no doctrine rests on either. The system worked in front of you — you're citing its receipts."},{"w":"them","t":"Honestly? I heard all this at youth group, then watched it fall apart. The gospels are still formally anonymous — 'according to Matthew' is a second-century label — and still written decades after the events by non-eyewitnesses. Polished transmission of anonymous late documents is still anonymous late documents."},{"w":"you","t":"The anonymity is formally true and I won't fight it — and I'm sorry youth group gave you the airbrushed version; you deserved the real one. Here's what the airbrush skipped, in both directions: 'decades later' is EARLY for ancient biography — within living eyewitness memory, with Paul's letters and that creed earlier still. And the attribution puzzle cuts oddly: the titles are uniform everywhere we find them — no manuscript calls Matthew anything else — and if the church were inventing authorities from scratch, Mark (a nobody) and Luke (not even a witness) are bizarre choices over Peter or James. My offer stands from earlier: you clearly know this material. Pick the hardest passage you've got and let's read it together — I'd rather do that than trade summaries of other people's YouTube videos."}],"archaeology-history":[{"w":"them","t":"Strip away believers writing about their own beliefs, and what's left? No contemporary record of Jesus. No Roman paperwork. For the Old Testament it's worse — David and Solomon's empire leaves barely a trace. These are legends with street names."},{"w":"you","t":"Let's calibrate 'no record' against how antiquity works: almost no one — governors, generals — gets contemporary paperwork that survives; we date and know most figures from later narrative sources. For Jesus, within about 90 years we have Tacitus, hostile, confirming his execution under Pilate; Josephus (using the version scholars keep after trimming Christian interpolation — I'll concede the tampering before you raise it); Pliny interrogating Christians. That's why virtually no credentialed historian, Ehrman loudly included, doubts Jesus existed. And David stopped being 'legendary' in 1993, when the Tel Dan stele turned up — an ENEMY king bragging about defeating the 'House of David.' Pilate got his own stone at Caesarea in 1961. The 'never existed' category keeps shrinking on contact with dirt."},{"w":"them","t":"Fine, a stele names a dynasty. But archaeology also bites you: the Exodus — two million people, forty years in Sinai — leaves nothing. No camps, no graves, nothing. And archaeologists like Finkelstein say the conquest of Canaan didn't happen as written. Do you take the dirt or the book?"},{"w":"you","t":"I'll give you a straight answer instead of a brochure: Exodus archaeology is genuinely contested, including among believing scholars — some argue a smaller exodus and a misread number-word for 'thousand,' some redate the evidence, and honest ones admit the Sinai record is thin. I won't bluff you where the field itself is arguing. But keep both ledgers open: the same discipline delivered Tel Dan, the Pilate stone, Hezekiah's tunnel and its inscription, the Pool of Siloam, Caiaphas's ossuary. The pattern for a century has been skeptical consensus first, spade second — 'no Hittites' until Hittite archives, 'no David' until Tel Dan."},{"w":"them","t":"Even granting every stone: archaeology proving a pool existed doesn't prove a man healed a blind guy there. You're using confirmed geography to smuggle in unconfirmed miracles."},{"w":"you","t":"Completely right, and I want the claim exactly that size: archaeology can't prove theology — no stone will certify a miracle. What it does is test the FRAME: were these authors writing grounded history or floating legend? Legends set in nowhere accumulate no confirmable detail; John names a five-colonnaded pool everyone called fictional until it was excavated. Every dig keeps ruling out 'fable,' which forces the real question the dirt can't settle: the man at the center. That one's decided by reading him. Mark's sixteen chapters, one a week, your objections welcome — you bring Finkelstein, I'll bring coffee. Deal?"}],"prophecy-evidence":[{"w":"them","t":"Prophecy is the weakest wing of apologetics and honestly the reason I first started doubting. It's a shell game: either vague enough to fit anything, written AFTER the events — scholars date Daniel to the 160s BC, right after the events it 'predicts' — or ripped out of context, like Matthew using Isaiah 7:14, which is about a child in Isaiah's own day."},{"w":"you","t":"I'm going to concede more than you expect, because you're right about the shell games. The Maccabean dating of Daniel IS the critical consensus and apologists should say so instead of pretending otherwise. And Matthew's use of Isaiah 7:14 is typological — a this-fills-that pattern-reading, which is a real ancient Jewish way of reading but is not a knock-down prediction, and selling it as one is how youth groups manufacture future atheists like, apparently, you. So let me put one text on the table that doesn't dissolve: Isaiah 53."},{"w":"them","t":"Go ahead — but I know the move, so I'll pre-empt it: how do I know Isaiah 53 wasn't edited after Jesus, or that the gospel writers didn't just write Jesus' story to MATCH it? That's the standard explanation and it's a good one."},{"w":"you","t":"Both halves deserve answers. Post-dating is physically dead: the Great Isaiah Scroll sits in a Jerusalem museum, carbon-dated and paleographically dated to roughly 125 BC, complete, with chapter 53 intact — a century-plus before the cross, no edit possible. 'Written to match' is the serious option — for details the disciples controlled. But the spine of the passage is exactly what they COULDN'T stage and demonstrably didn't want: a servant despised, executed with criminals, whose death is counted as an offering for others' sins, then who 'prolongs his days.' A crucified Messiah was, on Paul's own report, a 'stumbling block to Jews and folly to Greeks' — you don't engineer your movement onto its era's most repulsive premise to fit a poem."},{"w":"them","t":"The rabbis would tell you the servant is Israel personified — the nation suffering in exile. Jewish readers had that text for centuries and didn't see Jesus in it. Why should I trust your reading over theirs?"},{"w":"you","t":"That's the oldest and best counter-reading and it deserves respect, not dismissal — Israel IS called the servant earlier in Isaiah. The wrinkle inside chapter 53 itself: this servant suffers FOR 'my people,' innocent for guilty, which is hard if the servant simply IS the people; and some pre-Christian and early rabbinic readings did take it messianically, so the door was never closed. But you shouldn't take my word or theirs. Blind test: read Isaiah 53 cold, no commentary, and tell me who you see. And then my real question, the one under all of this — if the poem DID come true in him, if the whole thing were actually so — is that a world you'd want to live in? Because that answer decides how the evidence gets weighed, for both of us."}],"objections-answered":[{"w":"them","t":"I need to stop you before the arguments start, because I know them all — I taught them, actually. I didn't leave Christianity over the kalam. I left because our youth pastor did things to kids, and when it came out, the elders protected him and prayed the families into silence. THEN I discovered the arguments were weak. So which do you want to defend first?"},{"w":"you","t":"Neither. What happened to those kids — and to you, watching the people who taught you about holiness organize a cover-up — was evil. Not 'imperfect,' not 'a failure of process.' Evil. And it was not Jesus. I'm not going to hand you an argument right now, because using philosophy to change the subject from your wound would be one more churchman managing you instead of hearing you. I'm sorry. If you want to tell me the rest, I'd rather listen than talk."},{"w":"them","t":"You should know every exvangelical has heard that too — 'that wasn't REAL Christianity.' It's the ultimate dodge. The abusers WERE the real Christians: elders, board members, the guy with the seminary degree. You don't get to keep the brand and refund the damage."},{"w":"you","t":"You're right — 'not real Christians' is usually a dodge, and I won't hide behind it. They held the offices; the institution owned it. Here's the one thing I'll put next to that, not against it: the angriest voice in the Bible about religious abusers is Jesus — 'whitewashed tombs' for the clergy, and for anyone who causes a child to stumble, better a millstone around the neck and the bottom of the sea. That's HIS sentence for your youth pastor. I'm not asking you back to that church or any institution tonight. I'm only noting that your fury at what they did — you learned that standard somewhere, and it wasn't from naturalism. Your rage agrees with him."},{"w":"them","t":"Then where was he? That's the whole problem, isn't it — not abstract 'evil' but THIS: kids prayed in that building for it to stop. Nothing. If a God watched that happen and did nothing, I don't want him even if he exists."},{"w":"you","t":"I'm not going to give you a tidy answer, because there isn't one and you've been lied to enough. I don't know why God didn't stop it. Christianity has never told me why THIS suffering, THIS child — anyone who claims that knowledge is selling something. What I have is smaller and stranger: a God who did not stay clear of it — betrayed by his inner circle, handed over by clergy, and who screamed 'why have you forsaken me?' from the cross. Not an explanation. A location: closer to those kids than to that pulpit. And your 'I don't want him even if he exists' — I won't argue with it. It's the most honest sentence anyone says, and God seems to prefer it to polite lies; there's a whole psalm category for it."},{"w":"them","t":"So what do you actually want from me? Because if this ends with an invitation to your church, we're done."},{"w":"you","t":"No church. Two things, both refusable. One: Mark's gospel, with me, a chapter a week — not because you don't know it, you probably know it better than I do, but because you've never once read it with the institution out of the room; watch what Jesus does around religious power and see if it reads differently now. Two, and only when you're ready for it: the question I ask myself in the dark — if it were true, the whole thing, a God who takes millstones personally and puts the last things right — would you WANT it to be true? You don't owe me an answer. Some people in your shoes say 'I wish I could believe it and can't,' and if that's you, I'm not going to argue with it. I'll just still be here next week."}]};
const ABBR=["c","cf","vs","e.g","i.e","etc","Dr","St","Mr","Mrs","ch","pp","v","vv","no","approx","Jr","Sr"];
function splitSentences(raw){
  const tokens=raw.split(/(?<=[.!?])\s+(?=[A-Z0-9"'(‘“])/);
  const merged=[];
  tokens.forEach(t=>{
    if(merged.length){
      const prev=merged[merged.length-1];
      const m=prev.match(/([A-Za-z&.]+)\.$/);
      const w=m?m[1].replace(/\./g,""):null;
      if(w&&ABBR.includes(w)){merged[merged.length-1]=prev+" "+t;return;}
    }
    merged.push(t);
  });
  return merged;
}
const LDSBOOKS="(?:Stanford Encyclopedia|SEP|Habermas|Ehrman|Oppy|Schellenberg|Bauckham|Wright|Licona|Craig|Carroll|4Q\\\\d+)";
const BIBBOOKS="(?:[1-3]\\s)?(?:Genesis|Exodus|Leviticus|Numbers|Deuteronomy|Joshua|Judges|Ruth|Samuel|Kings|Chronicles|Ezra|Nehemiah|Esther|Job|Psalms?|Proverbs|Ecclesiastes|Isaiah|Jeremiah|Lamentations|Ezekiel|Daniel|Hosea|Joel|Amos|Obadiah|Jonah|Micah|Nahum|Habakkuk|Zephaniah|Haggai|Zechariah|Malachi|Matthew|Mark|Luke|John|Acts|Romans|Corinthians|Galatians|Ephesians|Philippians|Colossians|Thessalonians|Timothy|Titus|Philemon|Hebrews|James|Peter|Jude|Revelation)";
const REFNUM="";
const KEYWORDS=/\b(concedes?d?|conceded|disavow(?:s|ed|al)?|undisputed|unfalsifiable|no ancient manuscript|zero ancient witnesses|never recanted|does not match|do not match|no adequate answer|contradict(?:s|ing|ion)?|impossible|no record|officially disavowed)\b/gi;
function emphasize(t){
  t=t.replace(new RegExp("\\b("+LDSBOOKS+REFNUM+")","g"),'<span class="ref-lds">$1</span>');
  t=t.replace(new RegExp("\\b("+BIBBOOKS+"\\s\\d+(?::\\d+(?:[\\-–]\\d+)?(?:,\\s?\\d+(?:[\\-–]\\d+)?)*)?)","g"),m=>m.includes("ref-lds")?m:'<span class="ref-bib">'+m+'</span>');
  t=t.replace(/(^|[\s(—–])'([^'<>]{3,200}?)'(?=$|[\s.,;:)!?—–])/g,'$1<span class="qq">‘$2’</span>');
  t=t.replace(KEYWORDS,'<b class="kw">$1</b>');
  t=t.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/==(.+?)==/g,'<mark>$1</mark>');
  return t;
}
function rich(raw){return glossify(emphasize(esc(raw).replace(/&lt;(\/?)(b|i|em|strong)&gt;/g,"<$1$2>")));}
function paras(raw,per){
  per=per||2;
  const s=splitSentences(raw),ps=[];
  for(let i=0;i<s.length;i+=per)ps.push(s.slice(i,i+per).join(" "));
  return ps.map(p=>`<p>${rich(p)}</p>`).join("");
}
function formatDefense(raw){
  if(/\(\d+\)/.test(raw)){
    const parts=raw.split(/\(\d+\)\s*/);
    const intro=parts.shift().trim();
    return (intro?`<p class="lead">${rich(intro)}</p>`:"")+
      `<ol class="pts">${parts.map(p=>`<li>${rich(p.trim())}</li>`).join("")}</ol>`;
  }
  return paras(raw,2);
}

const GLOSSARY=[{"t":"the 'none'","d":"The religiously unaffiliated majority of self-described atheists and agnostics — usually not philosophical atheists, usually not interested in arguments, and reachable mostly by relationship."},{"t":"1 Clement","d":"A letter from the church at Rome to the church at Corinth, written around AD 95 — one of the earliest Christian documents outside the New Testament. It matters here because it speaks of Peter's and Paul's sufferings within living memory of them."},{"t":"the 1 Corinthians 15 creed","d":"A formula Paul says he 'received' and passes on — dated by most scholars to within about five years of the crucifixion. The single biggest problem for legend-development theories."},{"t":"a Bayesian argument","d":"Reasoning about how much a piece of evidence raises or lowers the probability of a claim. Most serious modern apologetics is Bayesian: no single knockdown proof, but a cumulative case that shifts the odds."},{"t":"a chiasm","d":"A mirror-image literary structure (A-B-C-B-A) common in Hebrew writing. It appears in these arguments because its presence in a text is sometimes offered as evidence of ancient Semitic authorship."},{"t":"a codex","d":"A book with bound pages, as opposed to a scroll. Christians adopted the codex format remarkably early, which is part of why so many early Christian manuscripts survive."},{"t":"a palimpsest","d":"A manuscript whose original writing was scraped off so the expensive material could be reused. Modern imaging can often recover the erased text underneath — which is how the Sanaa Quran's earlier layer was read."},{"t":"a proof-text","d":"A verse quoted on its own to establish a point, usually detached from what surrounds it. Proof-texting is the single most common way both sides of every argument on this site go wrong."},{"t":"a stele","d":"An upright inscribed stone slab set up to record a victory, a law, or a treaty — one of archaeology's most valuable finds, because it is a dated, deliberate, public record."},{"t":"a textual variant","d":"Any difference between two manuscripts, including a misspelling or a change in word order. The famous 'hundreds of thousands of variants' figure is real and almost entirely trivial; the meaningful and viable ones are well under 1%, and every modern Bible footnotes them."},{"t":"an anachronism","d":"Something appearing in a story before it existed in real life — a horse in a place with no horses, a stirrup centuries too early. Anachronisms are one of the main tools for dating a text, because a writer can only mention the world he lives in."},{"t":"an apologist","d":"Someone who defends a faith's claims — from the Greek <i>apologia</i>, a legal defense. Not an insult, and not the same as an apologizer. This site quotes apologists deliberately: a claim is only worth making if it survives the best defense of it."},{"t":"an ossuary","d":"A limestone box for bones, used in Judea for about a century around the time of Jesus: a body was left to decompose for a year, then the bones were collected into the box. Names carved on ossuaries are how we have physical traces of individuals like the high priest Caiaphas."},{"t":"the apocrypha","d":"Books written between the Testaments (Tobit, Judith, Maccabees and others), included in Catholic and Orthodox Bibles and in the original 1611 KJV, but not in the Hebrew canon or in Protestant Bibles today."},{"t":"the apocryphal Acts","d":"Second- to fourth-century romances about individual apostles — the Acts of Thomas, of Andrew, of Peter and others. They are the source of most vivid martyrdom traditions, and they also contain talking animals and resurrected fish. Not history."},{"t":"Bart Ehrman","d":"The most-read skeptical New Testament scholar alive, an agnostic and former evangelical. He is quoted throughout this section precisely because he does not want the conclusion: he calls the crucifixion one of the most certain facts of ancient history."},{"t":"Bayesian argument","d":"Reasoning about how much a piece of evidence raises or lowers the probability of a hypothesis. Most serious modern apologetics is Bayesian: no single knockdown, a cumulative case."},{"t":"the BGV theorem","d":"Borde–Guth–Vilenkin (2003): any universe that has on average been expanding cannot be extended infinitely into the past. Alexander Vilenkin is one of its authors and has stated the implication bluntly — though he also holds that it does not by itself establish a creator, which is worth quoting honestly."},{"t":"the burden of proof","d":"Who has to make the case. Most atheists hold the 'lack of belief' position — not the claim that God does not exist — which means demanding they disprove God misfires immediately."},{"t":"the canon","d":"The list of books a community accepts as Scripture. The New Testament canon was recognized gradually by usage over the first three centuries rather than voted on at a council — Athanasius's list of 367 AD matches ours exactly."},{"t":"Codex Sinaiticus","d":"A complete Greek Bible hand-copied around 330–360 AD, found at St Catherine's Monastery on Mount Sinai in the 1840s. Along with Vaticanus it is one of the two oldest complete Bibles in existence, and its text is essentially the text you read today."},{"t":"Codex Vaticanus","d":"A Greek Bible copied around 300–325 AD, held in the Vatican Library — slightly older than Sinaiticus and, with it, the backbone of modern New Testament textual scholarship."},{"t":"contingency","d":"The argument from things that could have not existed to something that could not have failed to. Often stronger than the Kalam because it does not depend on cosmology having the beginning right."},{"t":"the contingency argument","d":"The argument from things that could have failed to exist to something that could not have. Often stronger than the Kalam in conversation, because it does not depend on any particular cosmology being correct."},{"t":"the Dead Sea Scrolls","d":"About 900 manuscripts found in caves at Qumran near the Dead Sea between 1947 and 1956, copied roughly 250 BC–70 AD. They pushed our oldest Hebrew Bible manuscripts back a thousand years — and the text matched what had been copied ever since. The single most important manuscript discovery ever made."},{"t":"the deconvert","d":"Someone who was a Christian and is not now. They have heard your material, usually from people they loved, and then watched it answered. Treat them as an expert witness, not a project."},{"t":"Deutero-Isaiah","d":"The name critical scholars give to the proposed anonymous author of Isaiah 40–55, writing during the Babylonian exile. See the multi-Isaiah theory."},{"t":"divine hiddenness","d":"Schellenberg's argument: a perfectly loving God would ensure no one is non-resistantly unaware of him. The strongest argument in contemporary atheist philosophy after evil."},{"t":"the Documentary Hypothesis","d":"The critical theory that the first five books of the Bible were woven together from several earlier sources (labelled J, E, D and P) rather than written by Moses. The classic form is now heavily revised even among critical scholars, but some version of it is the mainstream academic position."},{"t":"the Euthyphro dilemma","d":"From Plato: is something good because God commands it, or does God command it because it is good? Either horn seems to cost the theist something. The standard answer is that goodness is grounded in God's own nature, so the dilemma is a false one — but expect a philosophically literate atheist to press it."},{"t":"exegesis","d":"Drawing out what a text actually says, in its own context. Its opposite is eisegesis — reading your conclusion into the text."},{"t":"The Fate of the Apostles","d":"Sean McDowell's 2015 book — a Christian apologist's own systematic grading of the evidence for how each apostle died. It is the reason honest Christians no longer say 'all twelve were martyred': he concludes only a handful of the deaths are historically well-established."},{"t":"fine-tuning","d":"The observation that physical constants sit in extraordinarily narrow life-permitting ranges — the cosmological constant to roughly one part in 10^120. The standard reply is the multiverse."},{"t":"Gerd Lüdemann","d":"A German New Testament scholar and atheist who held that the disciples genuinely had experiences they took to be appearances of the risen Jesus, and explained them as visions. Useful because he concedes the data and disputes only the explanation."},{"t":"Graham Oppy","d":"Probably the most respected atheist philosopher of religion writing today. He argues that naturalism and theism both explain the world but naturalism does so with fewer commitments. Read him rather than a Christian summary of him."},{"t":"the Great Isaiah Scroll","d":"The star of the Dead Sea Scrolls: a complete copy of Isaiah, all 66 chapters, copied around 125 BC. It proves Isaiah 53 and its portrait of a pierced, suffering servant existed more than a century before Jesus — nobody added it afterwards."},{"t":"J. L. Mackie","d":"The atheist philosopher whose logical problem of evil dominated the mid-twentieth century — and which Alvin Plantinga's free-will defense is widely regarded as having answered, including by atheist philosophers."},{"t":"Josephus","d":"Titus Flavius Josephus (c. 37–100 AD), a Jewish general who surrendered to Rome and became its most important historian of first-century Judea. Not a Christian, which is why his mentions of Jesus, James and John the Baptist carry so much weight."},{"t":"the Kalam","d":"'Whatever begins to exist has a cause; the universe began to exist; therefore the universe has a cause.' The most-debated theistic argument of the last fifty years, associated with William Lane Craig."},{"t":"the KJV","d":"The King James Version of 1611, the English Bible of the whole period covered by this site. Its wording matters constantly here: several movements examined on this site were born inside its cadence, and some of them treat it as the only legitimate Bible."},{"t":"the Lady Hope story","d":"The claim that Darwin recanted on his deathbed. It is false, was denied by his family at the time, and repeating it is a live demonstration that you do not check your sources."},{"t":"the Masoretic Text","d":"The standard Hebrew Bible, preserved and vowel-pointed by Jewish scribes called the Masoretes between roughly 600 and 1000 AD. Almost every Old Testament translation is based on it; where it differs from the Septuagint or the Scrolls, that difference is what scholars argue about."},{"t":"methodological naturalism","d":"The working rule that science looks only for natural causes. It is a method, not a metaphysics — conflating the two is the most common mistake on both sides of this conversation."},{"t":"the minimal facts","d":"Gary Habermas's method: build only on data granted by the large majority of scholars, including skeptics — the crucifixion, the disciples' experiences, Paul's conversion, James's conversion, the early proclamation."},{"t":"the multi-Isaiah theory","d":"The mainstream critical view that the book of Isaiah had more than one author: chapters 1–39 from the eighth-century prophet, 40–55 from an anonymous writer during the Babylonian exile ('Deutero-Isaiah'), and sometimes 56–66 from a third. It is argued from style and from the fact that chapters 40+ address the exile as present. Conservatives dispute it; it matters here because it is the standard reply whenever Isaiah is said to predict something."},{"t":"the multiverse","d":"The proposal that vastly many universes exist with varying constants, so a life-permitting one is unsurprising. A serious hypothesis, and one that is not currently testable — which cuts both ways."},{"t":"papyrus","d":"Paper made from reed pith, the ordinary writing material of the ancient world. New Testament papyri are labelled with a P and a number — P52, a scrap of John, is the earliest known New Testament manuscript, copied around 125 AD."},{"t":"Pascal's wager","d":"Pascal's argument that betting on God is rational given the stakes. It was never designed as an opening move — it addresses someone already persuaded the odds are non-trivial — and led with, it sounds like an invitation to fake a belief for insurance."},{"t":"the problem of evil","d":"Logical form (evil is incompatible with God) is now widely regarded as failed, including by atheist philosophers; the evidential form (the amount and distribution of suffering counts against God) is live and genuinely hard."},{"t":"Quirinius","d":"The Roman governor of Syria whose census Luke 2:2 places at Jesus's birth — but whose known census fell in AD 6, about a decade after Herod the Great died. This is a genuine historical difficulty with several proposed solutions and no consensus, and saying so is what makes the rest of the archaeology credible."},{"t":"Qumran","d":"The settlement beside the caves where the Dead Sea Scrolls were found, on the northwest shore of the Dead Sea. Usually associated with the Essenes, a strict Jewish sect of the Second Temple period."},{"t":"scientism","d":"The claim that only scientific methods yield knowledge — a philosophical claim that cannot itself be established scientifically. Point this out once, gently, and never as a gotcha."},{"t":"Sean Carroll","d":"A theoretical physicist and atheist, best known here for his 2014 debate with William Lane Craig, in which he argued that modern cosmology gives no support to the Kalam's second premise. The most substantial scientific reply to that argument."},{"t":"the Septuagint","d":"The Greek translation of the Hebrew Scriptures made by Jewish scholars in Alexandria beginning about 250 BC — abbreviated LXX. It matters constantly here because it is pre-Christian: when it renders a verse a certain way, no Christian could have influenced it."},{"t":"the Smithsonian Institution","d":"The United States' national museum and research complex. It matters here because for decades a 'Smithsonian statement' was circulated claiming the institution used the Book of Mormon as an archaeological guide. The Smithsonian issued a formal statement denying it, and now sends a standard letter saying its archaeologists see no connection between the New World's archaeology and the book's contents."},{"t":"Tacitus","d":"Roman senator and historian (c. 56–120 AD). His hostile mention of 'Christus,' executed by the procurator Pontius Pilate under Tiberius, is the standard non-Christian confirmation of the crucifixion."},{"t":"the Tel Dan Stele","d":"A ninth-century BC inscription found in northern Israel in 1993 in which an Aramean king boasts of defeating the 'House of David.' It is the first extra-biblical reference to David's dynasty, and it landed at a moment when minimalist scholars were arguing David was a fiction."},{"t":"textual criticism","d":"The scholarly discipline of comparing manuscripts to work out what the original wording was. It is not an attack on Scripture — it is the method that lets us say with confidence what the text said."},{"t":"textual variant","d":"Any difference between manuscripts, including spelling. The famous '400,000 variants' figure is real and almost entirely trivial; the meaningful-and-viable subset is well under 1%."},{"t":"Tyre","d":"The Phoenician port city of Ezekiel 26. The prophecy's fulfilment is often overclaimed — the mainland city fell to Nebuchadnezzar and Alexander built a causeway to the island, but a city called Tyre exists today. Use this one carefully or not at all."}];

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function hl(text,phrases){let out=esc(text);(phrases||[]).forEach(p=>{const e=esc(p).replace(/[.*+?^${}()|[\]\\]/g,"\\$&");out=out.replace(new RegExp(e,"gi"),m=>"<mark>"+m+"</mark>");});return out;}
function glossify(escapedText){
  if(!glossify._re){
    const ts=GLOSSARY.slice().sort((a,b)=>esc(b.t).length-esc(a.t).length);
    const alts=ts.map(g=>esc(g.t).replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|");
    glossify._re=new RegExp("(?<![\\w-])("+alts+")(?![\\w-])","gi");
    glossify._map={};GLOSSARY.forEach(g=>{glossify._map[esc(g.t).toLowerCase()]=g;});
  }
  const used=glossify.seen||(glossify.seen=new Set());
  let inRef=0;
  return escapedText.replace(/(<[^>]*>)|([^<]+)/g,(m,tag,txt)=>{
    if(tag){
      if(/^<span class="ref-(lds|bib)"/.test(tag))inRef++;
      else if(inRef&&tag.indexOf("</span>")===0)inRef--;
      return tag;
    }
    if(inRef)return txt;
    return txt.replace(glossify._re,w=>{
      const g=glossify._map[w.toLowerCase()];
      if(!g||used.has(g.t))return w;
      used.add(g.t);
      return '<span class="g" tabindex="0">'+w+'<span class="gt"><b>'+esc(g.t)+'</b> — '+g.d+'</span></span>';
    });
  });
}


function findWhy(d,cite){
  const key=cite.replace(/–/g,"-").replace(/\s*\(.*\)\s*/g,"").trim();
  const m=key.match(/^([1-4]?\s?[A-Za-z&; ]+?)\s+(\d+)/);
  const frag=m?(m[1].trim()+" "+m[2]):key;
  const sentences=(d.claim+" "+d.rationale).replace(/–/g,"-").split(/(?<=[.!?])\s+/);
  const hit=sentences.find(s=>s.includes(frag));
  return hit?hit.replace(/-/g,"–"):null;
}

function extUrl(cite){
  const c=cite.replace(/–/g,"-").replace(/\s*\(.*\)\s*/g,"").trim();
  const qm=c.match(/^Quran\s+(\d+):(\d+)/i);
  if(qm)return "https://quran.com/"+qm[1]+"/"+qm[2];
  const qc=c.match(/^Quran\s+(\d+)/i);
  if(qc)return "https://quran.com/"+qc[1];
  const mm=c.match(/^([1-3]?\s?[A-Za-z ]+?)\s+(\d+)/);
  if(mm)return "https://www.biblegateway.com/passage/?search="+encodeURIComponent(c)+"&version=KJV";
  return "https://quran.com/";
}

function filtered(){

    (state.section==="all"||d.section===state.section)&&
    (!state.verdict||d.verdict===state.verdict)&&
    (!state.severity||d.severity===state.severity)&&
    (!state.q||(d.title+" "+(d.titleLong||"")+" "+d.claim+" "+(d.response||"")+" "+(d.rationale||"")+" "+(CATS[d.category]||"")).toLowerCase().includes(state.q))
  );
  if(state.section==="peculiar")return arr.sort((a,b)=>PORDER.indexOf(a.id)-PORDER.indexOf(b.id));
  return arr.sort((a,b)=>(b.featured?1:0)-(a.featured?1:0)||SEVRANK[a.severity]-SEVRANK[b.severity]||VRANK[a.verdict]-VRANK[b.verdict]);
}

function openCase(id,fromPath){
  state.caseId=id;state.sel=id;state.view="case";
  if(location.hash!=="#case/"+id)try{history.pushState(null,"","#case/"+id)}catch(e){}
  if(!fromPath)state.pathId=state.pathId; // keep path context if navigating within
  store.markRead(id);
