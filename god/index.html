:26,"t":"In journeyings often, in perils of waters, in perils of robbers, in perils by mine own countrymen, in perils by the heathen, in perils in the city, in perils in the wilderness, in perils in the sea, in perils among false brethren;","hl":1},{"v":27,"t":"In weariness and painfulness, in watchings often, in hunger and thirst, in fastings often, in cold and nakedness.","hl":1},{"v":28,"t":"Beside those things that are without, that which cometh upon me daily, the care of all the churches.","hl":1},{"v":29,"t":"Who is weak, and I am not weak? who is offended, and I burn not?"},{"v":30,"t":"If I must needs glory, I will glory of the things which concern mine infirmities."},{"v":31,"t":"The God and Father of our Lord Jesus Christ, which is blessed for evermore, knoweth that I lie not."}]},"Acts 26:9-11":{"ref":"Acts 26","cited":"9-11","verses":[{"v":6,"t":"And now I stand and am judged for the hope of the promise made of God unto our fathers:"},{"v":7,"t":"Unto which promise our twelve tribes, instantly serving God day and night, hope to come. For which hope's sake, king Agrippa, I am accused of the Jews."},{"v":8,"t":"Why should it be thought a thing incredible with you, that God should raise the dead?"},{"v":9,"t":"I verily thought with myself, that I ought to do many things contrary to the name of Jesus of Nazareth.","hl":1},{"v":10,"t":"Which thing I also did in Jerusalem: and many of the saints did I shut up in prison, having received authority from the chief priests; and when they were put to death, I gave my voice against them.","hl":1},{"v":11,"t":"And I punished them oft in every synagogue, and compelled them to blaspheme; and being exceedingly mad against them, I persecuted them even unto strange cities.","hl":1},{"v":12,"t":"Whereupon as I went to Damascus with authority and commission from the chief priests,"},{"v":13,"t":"At midday, O king, I saw in the way a light from heaven, above the brightness of the sun, shining round about me and them which journeyed with me."},{"v":14,"t":"And when we were all fallen to the earth, I heard a voice speaking unto me, and saying in the Hebrew tongue, Saul, Saul, why persecutest thou me? it is hard for thee to kick against the pricks."}]},"Proverbs 12:22":{"ref":"Proverbs 12","cited":"22","verses":[{"v":19,"t":"The lip of truth shall be established for ever: but a lying tongue is but for a moment."},{"v":20,"t":"Deceit is in the heart of them that imagine evil: but to the counsellors of peace is joy."},{"v":21,"t":"There shall no evil happen to the just: but the wicked shall be filled with mischief."},{"v":22,"t":"Lying lips are abomination to the LORD: but they that deal truly are his delight.","hl":1},{"v":23,"t":"A prudent man concealeth knowledge: but the heart of fools proclaimeth foolishness."},{"v":24,"t":"The hand of the diligent shall bear rule: but the slothful shall be under tribute."},{"v":25,"t":"Heaviness in the heart of man maketh it stoop: but a good word maketh it glad."}]},"Isaiah 52:13-53:12":{"ref":"Isaiah 52-53","cited":"Isaiah 52:13-53:12","verses":[{"v":"52:13","t":"Behold, my servant shall deal prudently, he shall be exalted and extolled, and be very high.","hl":1},{"v":"52:14","t":"As many were astonied at thee; his visage was so marred more than any man, and his form more than the sons of men:","hl":1},{"v":"52:15","t":"So shall he sprinkle many nations; the kings shall shut their mouths at him: for that which had not been told them shall they see; and that which they had not heard shall they consider.","hl":1},{"v":"53:1","t":"Who hath believed our report? and to whom is the arm of the LORD revealed?","hl":1},{"v":"53:2","t":"For he shall grow up before him as a tender plant, and as a root out of a dry ground: he hath no form nor comeliness; and when we shall see him, there is no beauty that we should desire him.","hl":1},{"v":"53:3","t":"He is despised and rejected of men; a man of sorrows, and acquainted with grief: and we hid as it were our faces from him; he was despised, and we esteemed him not.","hl":1},{"v":"53:4","t":"Surely he hath borne our griefs, and carried our sorrows: yet we did esteem him stricken, smitten of God, and afflicted.","hl":1},{"v":"53:5","t":"But he was wounded for our transgressions, he was bruised for our iniquities: the chastisement of our peace was upon him; and with his stripes we are healed.","hl":1},{"v":"53:6","t":"All we like sheep have gone astray; we have turned every one to his own way; and the LORD hath laid on him the iniquity of us all.","hl":1},{"v":"53:7","t":"He was oppressed, and he was afflicted, yet he opened not his mouth: he is brought as a lamb to the slaughter, and as a sheep before her shearers is dumb, so he openeth not his mouth.","hl":1},{"v":"53:8","t":"He was taken from prison and from judgment: and who shall declare his generation? for he was cut off out of the land of the living: for the transgression of my people was he stricken.","hl":1},{"v":"53:9","t":"And he made his grave with the wicked, and with the rich in his death; because he had done no violence, neither was any deceit in his mouth.","hl":1},{"v":"53:10","t":"Yet it pleased the LORD to bruise him; he hath put him to grief: when thou shalt make his soul an offering for sin, he shall see his seed, he shall prolong his days, and the pleasure of the LORD shall prosper in his hand.","hl":1},{"v":"53:11","t":"He shall see of the travail of his soul, and shall be satisfied: by his knowledge shall my righteous servant justify many; for he shall bear their iniquities.","hl":1},{"v":"53:12","t":"Therefore will I divide him a portion with the great, and he shall divide the spoil with the strong; because he hath poured out his soul unto death: and he was numbered with the transgressors; and he bare the sin of many, and made intercession for the transgressors.","hl":1}]},"Psalm 22:1-18":{"ref":"Psalms 22","cited":"1-18","verses":[{"v":1,"t":"My God, my God, why hast thou forsaken me? why art thou so far from helping me, and from the words of my roaring?","hl":1},{"v":2,"t":"O my God, I cry in the daytime, but thou hearest not; and in the night season, and am not silent.","hl":1},{"v":3,"t":"But thou art holy, O thou that inhabitest the praises of Israel.","hl":1},{"v":4,"t":"Our fathers trusted in thee: they trusted, and thou didst deliver them.","hl":1},{"v":5,"t":"They cried unto thee, and were delivered: they trusted in thee, and were not confounded.","hl":1},{"v":6,"t":"But I am a worm, and no man; a reproach of men, and despised of the people.","hl":1},{"v":7,"t":"All they that see me laugh me to scorn: they shoot out the lip, they shake the head, saying,","hl":1},{"v":8,"t":"He trusted on the LORD that he would deliver him: let him deliver him, seeing he delighted in him.","hl":1},{"v":9,"t":"But thou art he that took me out of the womb: thou didst make me hope when I was upon my mother's breasts.","hl":1},{"v":10,"t":"I was cast upon thee from the womb: thou art my God from my mother's belly.","hl":1},{"v":11,"t":"Be not far from me; for trouble is near; for there is none to help.","hl":1},{"v":12,"t":"Many bulls have compassed me: strong bulls of Bashan have beset me round.","hl":1},{"v":13,"t":"They gaped upon me with their mouths, as a ravening and a roaring lion.","hl":1},{"v":14,"t":"I am poured out like water, and all my bones are out of joint: my heart is like wax; it is melted in the midst of my bowels.","hl":1},{"v":15,"t":"My strength is dried up like a potsherd; and my tongue cleaveth to my jaws; and thou hast brought me into the dust of death.","hl":1},{"v":16,"t":"For dogs have compassed me: the assembly of the wicked have inclosed me: they pierced my hands and my feet.","hl":1},{"v":17,"t":"I may tell all my bones: they look and stare upon me.","hl":1},{"v":18,"t":"They part my garments among them, and cast lots upon my vesture.","hl":1},{"v":19,"t":"But be not thou far from me, O LORD: O my strength, haste thee to help me."},{"v":20,"t":"Deliver my soul from the sword; my darling from the power of the dog."},{"v":21,"t":"Save me from the lion's mouth: for thou hast heard me from the horns of the unicorns."}]},"Genesis 1:1-2:3":{"ref":"Genesis 1-2","cited":"Genesis 1:1-2:3","verses":[{"v":"1:1","t":"In the beginning God created the heaven and the earth.","hl":1},{"v":"1:2","t":"And the earth was without form, and void; and darkness was upon the face of the deep. And the Spirit of God moved upon the face of the waters.","hl":1},{"v":"1:3","t":"And God said, Let there be light: and there was light.","hl":1},{"v":"1:4","t":"And God saw the light, that it was good: and God divided the light from the darkness.","hl":1},{"v":"1:5","t":"And God called the light Day, and the darkness he called Night. And the evening and the morning were the first day.","hl":1},{"v":"1:6","t":"And God said, Let there be a firmament in the midst of the waters, and let it divide the waters from the waters.","hl":1},{"v":"1:7","t":"And God made the firmament, and divided the waters which were under the firmament from the waters which were above the firmament: and it was so.","hl":1},{"v":"1:8","t":"And God called the firmament Heaven. And the evening and the morning were the second day.","hl":1},{"v":"1:9","t":"And God said, Let the waters under the heaven be gathered together unto one place, and let the dry land appear: and it was so.","hl":1},{"v":"1:10","t":"And God called the dry land Earth; and the gathering together of the waters called he Seas: and God saw that it was good.","hl":1},{"v":"1:11","t":"And God said, Let the earth bring forth grass, the herb yielding seed, and the fruit tree yielding fruit after his kind, whose seed is in itself, upon the earth: and it was so.","hl":1},{"v":"1:12","t":"And the earth brought forth grass, and herb yielding seed after his kind, and the tree yielding fruit, whose seed was in itself, after his kind: and God saw that it was good.","hl":1},{"v":"1:13","t":"And the evening and the morning were the third day.","hl":1},{"v":"1:14","t":"And God said, Let there be lights in the firmament of the heaven to divide the day from the night; and let them be for signs, and for seasons, and for days, and years:","hl":1},{"v":"1:15","t":"And let them be for lights in the firmament of the heaven to give light upon the earth: and it was so.","hl":1},{"v":"1:16","t":"And God made two great lights; the greater light to rule the day, and the lesser light to rule the night: he made the stars also.","hl":1},{"v":"1:17","t":"And God set them in the firmament of the heaven to give light upon the earth,","hl":1},{"v":"1:18","t":"And to rule over the day and over the night, and to divide the light from the darkness: and God saw that it was good.","hl":1},{"v":"1:19","t":"And the evening and the morning were the fourth day.","hl":1},{"v":"1:20","t":"And God said, Let the waters bring forth abundantly the moving creature that hath life, and fowl that may fly above the earth in the open firmament of heaven.","hl":1},{"v":"1:21","t":"And God created great whales, and every living creature that moveth, which the waters brought forth abundantly, after their kind, and every winged fowl after his kind: and God saw that it was good.","hl":1},{"v":"1:22","t":"And God blessed them, saying, Be fruitful, and multiply, and fill the waters in the seas, and let fowl multiply in the earth.","hl":1},{"v":"1:23","t":"And the evening and the morning were the fifth day.","hl":1},{"v":"1:24","t":"And God said, Let the earth bring forth the living creature after his kind, cattle, and creeping thing, and beast of the earth after his kind: and it was so.","hl":1},{"v":"1:25","t":"And God made the beast of the earth after his kind, and cattle after their kind, and every thing that creepeth upon the earth after his kind: and God saw that it was good.","hl":1},{"v":"1:26","t":"And God said, Let us make man in our image, after our likeness: and let them have dominion over the fish of the sea, and over the fowl of the air, and over the cattle, and over all the earth, and over every creeping thing that creepeth upon the earth.","hl":1},{"v":"1:27","t":"So God created man in his own image, in the image of God created he him; male and female created he them.","hl":1},{"v":"1:28","t":"And God blessed them, and God said unto them, Be fruitful, and multiply, and replenish the earth, and subdue it: and have dominion over the fish of the sea, and over the fowl of the air, and over every living thing that moveth upon the earth.","hl":1},{"v":"1:29","t":"And God said, Behold, I have given you every herb bearing seed, which is upon the face of all the earth, and every tree, in the which is the fruit of a tree yielding seed; to you it shall be for meat.","hl":1},{"v":"1:30","t":"And to every beast of the earth, and to every fowl of the air, and to every thing that creepeth upon the earth, wherein there is life, I have given every green herb for meat: and it was so.","hl":1},{"v":"1:31","t":"And God saw every thing that he had made, and, behold, it was very good. And the evening and the morning were the sixth day.","hl":1},{"v":"2:1","t":"Thus the heavens and the earth were finished, and all the host of them.","hl":1},{"v":"2:2","t":"And on the seventh day God ended his work which he had made; and he rested on the seventh day from all his work which he had made.","hl":1},{"v":"2:3","t":"And God blessed the seventh day, and sanctified it: because that in it he had rested from all his work which God created and made.","hl":1}]},"Psalm 104":{"ref":"Psalms 104","cited":"","verses":[{"v":1,"t":"Bless the LORD, O my soul. O LORD my God, thou art very great; thou art clothed with honour and majesty."},{"v":2,"t":"Who coverest thyself with light as with a garment: who stretchest out the heavens like a curtain:"},{"v":3,"t":"Who layeth the beams of his chambers in the waters: who maketh the clouds his chariot: who walketh upon the wings of the wind:"},{"v":4,"t":"Who maketh his angels spirits; his ministers a flaming fire:"},{"v":5,"t":"Who laid the foundations of the earth, that it should not be removed for ever."},{"v":6,"t":"Thou coveredst it with the deep as with a garment: the waters stood above the mountains."},{"v":7,"t":"At thy rebuke they fled; at the voice of thy thunder they hasted away."},{"v":8,"t":"They go up by the mountains; they go down by the valleys unto the place which thou hast founded for them."},{"v":9,"t":"Thou hast set a bound that they may not pass over; that they turn not again to cover the earth."},{"v":10,"t":"He sendeth the springs into the valleys, which run among the hills."},{"v":11,"t":"They give drink to every beast of the field: the wild asses quench their thirst."},{"v":12,"t":"By them shall the fowls of the heaven have their habitation, which sing among the branches."},{"v":13,"t":"He watereth the hills from his chambers: the earth is satisfied with the fruit of thy works."},{"v":14,"t":"He causeth the grass to grow for the cattle, and herb for the service of man: that he may bring forth food out of the earth;"},{"v":15,"t":"And wine that maketh glad the heart of man, and oil to make his face to shine, and bread which strengtheneth man's heart."},{"v":16,"t":"The trees of the LORD are full of sap; the cedars of Lebanon, which he hath planted;"},{"v":17,"t":"Where the birds make their nests: as for the stork, the fir trees are her house."},{"v":18,"t":"The high hills are a refuge for the wild goats; and the rocks for the conies."},{"v":19,"t":"He appointed the moon for seasons: the sun knoweth his going down."},{"v":20,"t":"Thou makest darkness, and it is night: wherein all the beasts of the forest do creep forth."},{"v":21,"t":"The young lions roar after their prey, and seek their meat from God."},{"v":22,"t":"The sun ariseth, they gather themselves together, and lay them down in their dens."},{"v":23,"t":"Man goeth forth unto his work and to his labour until the evening."},{"v":24,"t":"O LORD, how manifold are thy works! in wisdom hast thou made them all: the earth is full of thy riches."},{"v":25,"t":"So is this great and wide sea, wherein are things creeping innumerable, both small and great beasts."},{"v":26,"t":"There go the ships: there is that leviathan, whom thou hast made to play therein."},{"v":27,"t":"These wait all upon thee; that thou mayest give them their meat in due season."},{"v":28,"t":"That thou givest them they gather: thou openest thine hand, they are filled with good."},{"v":29,"t":"Thou hidest thy face, they are troubled: thou takest away their breath, they die, and return to their dust."},{"v":30,"t":"Thou sendest forth thy spirit, they are created: and thou renewest the face of the earth."},{"v":31,"t":"The glory of the LORD shall endure for ever: the LORD shall rejoice in his works."},{"v":32,"t":"He looketh on the earth, and it trembleth: he toucheth the hills, and they smoke."},{"v":33,"t":"I will sing unto the LORD as long as I live: I will sing praise to my God while I have my being."},{"v":34,"t":"My meditation of him shall be sweet: I will be glad in the LORD."},{"v":35,"t":"Let the sinners be consumed out of the earth, and let the wicked be no more. Bless thou the LORD, O my soul. Praise ye the LORD."}]},"Galatians 1:18":{"ref":"Galatians 1","cited":"18","verses":[{"v":15,"t":"But when it pleased God, who separated me from my mother's womb, and called me by his grace,"},{"v":16,"t":"To reveal his Son in me, that I might preach him among the heathen; immediately I conferred not with flesh and blood:"},{"v":17,"t":"Neither went I up to Jerusalem to them which were apostles before me; but I went into Arabia, and returned again unto Damascus."},{"v":18,"t":"Then after three years I went up to Jerusalem to see Peter, and abode with him fifteen days.","hl":1},{"v":19,"t":"But other of the apostles saw I none, save James the Lord's brother."},{"v":20,"t":"Now the things which I write unto you, behold, before God, I lie not."},{"v":21,"t":"Afterwards I came into the regions of Syria and Cilicia;"}]},"Mark 16:9-20":{"ref":"Mark 16","cited":"9-20","verses":[{"v":6,"t":"And he saith unto them, Be not affrighted: Ye seek Jesus of Nazareth, which was crucified: he is risen; he is not here: behold the place where they laid him."},{"v":7,"t":"But go your way, tell his disciples and Peter that he goeth before you into Galilee: there shall ye see him, as he said unto you."},{"v":8,"t":"And they went out quickly, and fled from the sepulchre; for they trembled and were amazed: neither said they any thing to any man; for they were afraid."},{"v":9,"t":"Now when Jesus was risen early the first day of the week, he appeared first to Mary Magdalene, out of whom he had cast seven devils.","hl":1},{"v":10,"t":"And she went and told them that had been with him, as they mourned and wept.","hl":1},{"v":11,"t":"And they, when they had heard that he was alive, and had been seen of her, believed not.","hl":1},{"v":12,"t":"After that he appeared in another form unto two of them, as they walked, and went into the country.","hl":1},{"v":13,"t":"And they went and told it unto the residue: neither believed they them.","hl":1},{"v":14,"t":"Afterward he appeared unto the eleven as they sat at meat, and upbraided them with their unbelief and hardness of heart, because they believed not them which had seen him after he was risen.","hl":1},{"v":15,"t":"And he said unto them, Go ye into all the world, and preach the gospel to every creature.","hl":1},{"v":16,"t":"He that believeth and is baptized shall be saved; but he that believeth not shall be damned.","hl":1},{"v":17,"t":"And these signs shall follow them that believe; In my name shall they cast out devils; they shall speak with new tongues;","hl":1},{"v":18,"t":"They shall take up serpents; and if they drink any deadly thing, it shall not hurt them; they shall lay hands on the sick, and they shall recover.","hl":1},{"v":19,"t":"So then after the Lord had spoken unto them, he was received up into heaven, and sat on the right hand of God.","hl":1},{"v":20,"t":"And they went forth, and preached every where, the Lord working with them, and confirming the word with signs following. Amen.","hl":1}]},"John 7:53-8:11":{"ref":"John 7-8","cited":"John 7:53-8:11","verses":[{"v":"7:53","t":"And every man went unto his own house.","hl":1},{"v":"8:1","t":"Jesus went unto the mount of Olives.","hl":1},{"v":"8:2","t":"And early in the morning he came again into the temple, and all the people came unto him; and he sat down, and taught them.","hl":1},{"v":"8:3","t":"And the scribes and Pharisees brought unto him a woman taken in adultery; and when they had set her in the midst,","hl":1},{"v":"8:4","t":"They say unto him, Master, this woman was taken in adultery, in the very act.","hl":1},{"v":"8:5","t":"Now Moses in the law commanded us, that such should be stoned: but what sayest thou?","hl":1},{"v":"8:6","t":"This they said, tempting him, that they might have to accuse him. But Jesus stooped down, and with his finger wrote on the ground, as though he heard them not.","hl":1},{"v":"8:7","t":"So when they continued asking him, he lifted up himself, and said unto them, He that is without sin among you, let him first cast a stone at her.","hl":1},{"v":"8:8","t":"And again he stooped down, and wrote on the ground.","hl":1},{"v":"8:9","t":"And they which heard it, being convicted by their own conscience, went out one by one, beginning at the eldest, even unto the last: and Jesus was left alone, and the woman standing in the midst.","hl":1},{"v":"8:10","t":"When Jesus had lifted up himself, and saw none but the woman, he said unto her, Woman, where are those thine accusers? hath no man condemned thee?","hl":1},{"v":"8:11","t":"She said, No man, Lord. And Jesus said unto her, Neither do I condemn thee: go, and sin no more.","hl":1}]},"Mark 1:41":{"ref":"Mark 1","cited":"41","verses":[{"v":38,"t":"And he said unto them, Let us go into the next towns, that I may preach there also: for therefore came I forth."},{"v":39,"t":"And he preached in their synagogues throughout all Galilee, and cast out devils."},{"v":40,"t":"And there came a leper to him, beseeching him, and kneeling down to him, and saying unto him, If thou wilt, thou canst make me clean."},{"v":41,"t":"And Jesus, moved with compassion, put forth his hand, and touched him, and saith unto him, I will; be thou clean.","hl":1},{"v":42,"t":"And as soon as he had spoken, immediately the leprosy departed from him, and he was cleansed."},{"v":43,"t":"And he straitly charged him, and forthwith sent him away;"},{"v":44,"t":"And saith unto him, See thou say nothing to any man: but go thy way, shew thyself to the priest, and offer for thy cleansing those things which Moses commanded, for a testimony unto them."}]},"Isaiah 53":{"ref":"Isaiah 53","cited":"","verses":[{"v":1,"t":"Who hath believed our report? and to whom is the arm of the LORD revealed?"},{"v":2,"t":"For he shall grow up before him as a tender plant, and as a root out of a dry ground: he hath no form nor comeliness; and when we shall see him, there is no beauty that we should desire him."},{"v":3,"t":"He is despised and rejected of men; a man of sorrows, and acquainted with grief: and we hid as it were our faces from him; he was despised, and we esteemed him not."},{"v":4,"t":"Surely he hath borne our griefs, and carried our sorrows: yet we did esteem him stricken, smitten of God, and afflicted."},{"v":5,"t":"But he was wounded for our transgressions, he was bruised for our iniquities: the chastisement of our peace was upon him; and with his stripes we are healed."},{"v":6,"t":"All we like sheep have gone astray; we have turned every one to his own way; and the LORD hath laid on him the iniquity of us all."},{"v":7,"t":"He was oppressed, and he was afflicted, yet he opened not his mouth: he is brought as a lamb to the slaughter, and as a sheep before her shearers is dumb, so he openeth not his mouth."},{"v":8,"t":"He was taken from prison and from judgment: and who shall declare his generation? for he was cut off out of the land of the living: for the transgression of my people was he stricken."},{"v":9,"t":"And he made his grave with the wicked, and with the rich in his death; because he had done no violence, neither was any deceit in his mouth."},{"v":10,"t":"Yet it pleased the LORD to bruise him; he hath put him to grief: when thou shalt make his soul an offering for sin, he shall see his seed, he shall prolong his days, and the pleasure of the LORD shall prosper in his hand."},{"v":11,"t":"He shall see of the travail of his soul, and shall be satisfied: by his knowledge shall my righteous servant justify many; for he shall bear their iniquities."},{"v":12,"t":"Therefore will I divide him a portion with the great, and he shall divide the spoil with the strong; because he hath poured out his soul unto death: and he was numbered with the transgressors; and he bare the sin of many, and made intercession for the transgressors."}]},"2 Peter 3:16":{"ref":"2 Peter 3","cited":"16","verses":[{"v":13,"t":"Nevertheless we, according to his promise, look for new heavens and a new earth, wherein dwelleth righteousness."},{"v":14,"t":"Wherefore, beloved, seeing that ye look for such things, be diligent that ye may be found of him in peace, without spot, and blameless."},{"v":15,"t":"And account that the longsuffering of our Lord is salvation; even as our beloved brother Paul also according to the wisdom given unto him hath written unto you;"},{"v":16,"t":"As also in all his epistles, speaking in them of these things; in which are some things hard to be understood, which they that are unlearned and unstable wrest, as they do also the other scriptures, unto their own destruction.","hl":1},{"v":17,"t":"Ye therefore, beloved, seeing ye know these things before, beware lest ye also, being led away with the error of the wicked, fall from your own steadfastness."},{"v":18,"t":"But grow in grace, and in the knowledge of our Lord and Saviour Jesus Christ. To him be glory both now and for ever. Amen."}]},"2 Kings 19":{"ref":"2 Kings 19","cited":"","verses":[{"v":1,"t":"And it came to pass, when king Hezekiah heard it, that he rent his clothes, and covered himself with sackcloth, and went into the house of the LORD."},{"v":2,"t":"And he sent Eliakim, which was over the household, and Shebna the scribe, and the elders of the priests, covered with sackcloth, to Isaiah the prophet the son of Amoz."},{"v":3,"t":"And they said unto him, Thus saith Hezekiah, This day is a day of trouble, and of rebuke, and blasphemy: for the children are come to the birth, and there is not strength to bring forth."},{"v":4,"t":"It may be the LORD thy God will hear all the words of Rab-shakeh, whom the king of Assyria his master hath sent to reproach the living God; and will reprove the words which the LORD thy God hath heard: wherefore lift up thy prayer for the remnant that are left."},{"v":5,"t":"So the servants of king Hezekiah came to Isaiah."},{"v":6,"t":"And Isaiah said unto them, Thus shall ye say to your master, Thus saith the LORD, Be not afraid of the words which thou hast heard, with which the servants of the king of Assyria have blasphemed me."},{"v":7,"t":"Behold, I will send a blast upon him, and he shall hear a rumour, and shall return to his own land; and I will cause him to fall by the sword in his own land."},{"v":8,"t":"So Rab-shakeh returned, and found the king of Assyria warring against Libnah: for he had heard that he was departed from Lachish."},{"v":9,"t":"And when he heard say of Tirhakah king of Ethiopia, Behold, he is come out to fight against thee: he sent messengers again unto Hezekiah, saying,"},{"v":10,"t":"Thus shall ye speak to Hezekiah king of Judah, saying, Let not thy God in whom thou trustest deceive thee, saying, Jerusalem shall not be delivered into the hand of the king of Assyria."},{"v":11,"t":"Behold, thou hast heard what the kings of Assyria have done to all lands, by destroying them utterly: and shalt thou be delivered?"},{"v":12,"t":"Have the gods of the nations delivered them which my fathers have destroyed; as Gozan, and Haran, and Rezeph, and the children of Eden which were in Thelasar?"},{"v":13,"t":"Where is the king of Hamath, and the king of Arpad, and the king of the city of Sepharvaim, of Hena, and Ivah?"},{"v":14,"t":"And Hezekiah received the letter of the hand of the messengers, and read it: and Hezekiah went up into the house of the LORD, and spread it before the LORD."},{"v":15,"t":"And Hezekiah prayed before the LORD, and said, O LORD God of Israel, which dwellest between the cherubims, thou art the God, even thou alone, of all the kingdoms of the earth; thou hast made heaven and earth."},{"v":16,"t":"LORD, bow down thine ear, and hear: open, LORD, thine eyes, and see: and hear the words of Sennacherib, which hath sent him to reproach the living God."},{"v":17,"t":"Of a truth, LORD, the kings of Assyria have destroyed the nations and their lands,"},{"v":18,"t":"And have cast their gods into the fire: for they were no gods, but the work of men's hands, wood and stone: therefore they have destroyed them."},{"v":19,"t":"Now therefore, O LORD our God, I beseech thee, save thou us out of his hand, that all the kingdoms of the earth may know that thou art the LORD God, even thou only."},{"v":20,"t":"Then Isaiah the son of Amoz sent to Hezekiah, saying, Thus saith the LORD God of Israel, That which thou hast prayed to me against Sennacherib king of Assyria I have heard."},{"v":21,"t":"This is the word that the LORD hath spoken concerning him; The virgin the daughter of Zion hath despised thee, and laughed thee to scorn; the daughter of Jerusalem hath shaken her head at thee."},{"v":22,"t":"Whom hast thou reproached and blasphemed? and against whom hast thou exalted thy voice, and lifted up thine eyes on high? even against the Holy One of Israel."},{"v":23,"t":"By thy messengers thou hast reproached the Lord, and hast said, With the multitude of my chariots I am come up to the height of the mountains, to the sides of Lebanon, and will cut down the tall cedar trees thereof, and the choice fir trees thereof: and I will enter into the lodgings of his borders, and into the forest of his Carmel."},{"v":24,"t":"I have digged and drunk strange waters, and with the sole of my feet have I dried up all the rivers of besieged places."},{"v":25,"t":"Hast thou not heard long ago how I have done it, and of ancient times that I have formed it? now have I brought it to pass, that thou shouldest be to lay waste fenced cities into ruinous heaps."},{"v":26,"t":"Therefore their inhabitants were of small power, they were dismayed and confounded; they were as the grass of the field, and as the green herb, as the grass on the housetops, and as corn blasted before it be grown up."},{"v":27,"t":"But I know thy abode, and thy going out, and thy coming in, and thy rage against me."},{"v":28,"t":"Because thy rage against me and thy tumult is come up into mine ears, therefore I will put my hook in thy nose, and my bridle in thy lips, and I will turn thee back by the way by which thou camest."},{"v":29,"t":"And this shall be a sign unto thee, Ye shall eat this year such things as grow of themselves, and in the second year that which springeth of the same; and in the third year sow ye, and reap, and plant vineyards, and eat the fruits thereof."},{"v":30,"t":"And the remnant that is escaped of the house of Judah shall yet again take root downward, and bear fruit upward."},{"v":31,"t":"For out of Jerusalem shall go forth a remnant, and they that escape out of mount Zion: the zeal of the LORD of hosts shall do this."},{"v":32,"t":"Therefore thus saith the LORD concerning the king of Assyria, He shall not come into this city, nor shoot an arrow there, nor come before it with shield, nor cast a bank against it."},{"v":33,"t":"By the way that he came, by the same shall he return, and shall not come into this city, saith the LORD."},{"v":34,"t":"For I will defend this city, to save it, for mine own sake, and for my servant David's sake."},{"v":35,"t":"And it came to pass that night, that the angel of the LORD went out, and smote in the camp of the Assyrians an hundred fourscore and five thousand: and when they arose early in the morning, behold, they were all dead corpses."},{"v":36,"t":"So Sennacherib king of Assyria departed, and went and returned, and dwelt at Nineveh."},{"v":37,"t":"And it came to pass, as he was worshipping in the house of Nisroch his god, that Adrammelech and Sharezer his sons smote him with the sword: and they escaped into the land of Armenia. And Esarhaddon his son reigned in his stead."}]},"Ezra 1":{"ref":"Ezra 1","cited":"","verses":[{"v":1,"t":"Now in the first year of Cyrus king of Persia, that the word of the LORD by the mouth of Jeremiah might be fulfilled, the LORD stirred up the spirit of Cyrus king of Persia, that he made a proclamation throughout all his kingdom, and put it also in writing, saying,"},{"v":2,"t":"Thus saith Cyrus king of Persia, The LORD God of heaven hath given me all the kingdoms of the earth; and he hath charged me to build him an house at Jerusalem, which is in Judah."},{"v":3,"t":"Who is there among you of all his people? his God be with him, and let him go up to Jerusalem, which is in Judah, and build the house of the LORD God of Israel, (he is the God,) which is in Jerusalem."},{"v":4,"t":"And whosoever remaineth in any place where he sojourneth, let the men of his place help him with silver, and with gold, and with goods, and with beasts, beside the freewill offering for the house of God that is in Jerusalem."},{"v":5,"t":"Then rose up the chief of the fathers of Judah and Benjamin, and the priests, and the Levites, with all them whose spirit God had raised, to go up to build the house of the LORD which is in Jerusalem."},{"v":6,"t":"And all they that were about them strengthened their hands with vessels of silver, with gold, with goods, and with beasts, and with precious things, beside all that was willingly offered."},{"v":7,"t":"Also Cyrus the king brought forth the vessels of the house of the LORD, which Nebuchadnezzar had brought forth out of Jerusalem, and had put them in the house of his gods;"},{"v":8,"t":"Even those did Cyrus king of Persia bring forth by the hand of Mithredath the treasurer, and numbered them unto Sheshbazzar, the prince of Judah."},{"v":9,"t":"And this is the number of them: thirty chargers of gold, a thousand chargers of silver, nine and twenty knives,"},{"v":10,"t":"Thirty basins of gold, silver basins of a second sort four hundred and ten, and other vessels a thousand."},{"v":11,"t":"All the vessels of gold and of silver were five thousand and four hundred. All these did Sheshbazzar bring up with them of the captivity that were brought up from Babylon unto Jerusalem."}]},"John 9":{"ref":"John 9","cited":"","verses":[{"v":1,"t":"And as Jesus passed by, he saw a man which was blind from his birth."},{"v":2,"t":"And his disciples asked him, saying, Master, who did sin, this man, or his parents, that he was born blind?"},{"v":3,"t":"Jesus answered, Neither hath this man sinned, nor his parents: but that the works of God should be made manifest in him."},{"v":4,"t":"I must work the works of him that sent me, while it is day: the night cometh, when no man can work."},{"v":5,"t":"As long as I am in the world, I am the light of the world."},{"v":6,"t":"When he had thus spoken, he spat on the ground, and made clay of the spittle, and he anointed the eyes of the blind man with the clay,"},{"v":7,"t":"And said unto him, Go, wash in the pool of Siloam, (which is by interpretation, Sent.) He went his way therefore, and washed, and came seeing."},{"v":8,"t":"The neighbours therefore, and they which before had seen him that he was blind, said, Is not this he that sat and begged?"},{"v":9,"t":"Some said, This is he: others said, He is like him: but he said, I am he."},{"v":10,"t":"Therefore said they unto him, How were thine eyes opened?"},{"v":11,"t":"He answered and said, A man that is called Jesus made clay, and anointed mine eyes, and said unto me, Go to the pool of Siloam, and wash: and I went and washed, and I received sight."},{"v":12,"t":"Then said they unto him, Where is he? He said, I know not."},{"v":13,"t":"They brought to the Pharisees him that aforetime was blind."},{"v":14,"t":"And it was the sabbath day when Jesus made the clay, and opened his eyes."},{"v":15,"t":"Then again the Pharisees also asked him how he had received his sight. He said unto them, He put clay upon mine eyes, and I washed, and do see."},{"v":16,"t":"Therefore said some of the Pharisees, This man is not of God, because he keepeth not the sabbath day. Others said, How can a man that is a sinner do such miracles? And there was a division among them."},{"v":17,"t":"They say unto the blind man again, What sayest thou of him, that he hath opened thine eyes? He said, He is a prophet."},{"v":18,"t":"But the Jews did not believe concerning him, that he had been blind, and received his sight, until they called the parents of him that had received his sight."},{"v":19,"t":"And they asked them, saying, Is this your son, who ye say was born blind? how then doth he now see?"},{"v":20,"t":"His parents answered them and said, We know that this is our son, and that he was born blind:"},{"v":21,"t":"But by what means he now seeth, we know not; or who hath opened his eyes, we know not: he is of age; ask him: he shall speak for himself."},{"v":22,"t":"These words spake his parents, because they feared the Jews: for the Jews had agreed already, that if any man did confess that he was Christ, he should be put out of the synagogue."},{"v":23,"t":"Therefore said his parents, He is of age; ask him."},{"v":24,"t":"Then again called they the man that was blind, and said unto him, Give God the praise: we know that this man is a sinner."},{"v":25,"t":"He answered and said, Whether he be a sinner or no, I know not: one thing I know, that, whereas I was blind, now I see."},{"v":26,"t":"Then said they to him again, What did he to thee? how opened he thine eyes?"},{"v":27,"t":"He answered them, I have told you already, and ye did not hear: wherefore would ye hear it again? will ye also be his disciples?"},{"v":28,"t":"Then they reviled him, and said, Thou art his disciple; but we are Moses' disciples."},{"v":29,"t":"We know that God spake unto Moses: as for this fellow, we know not from whence he is."},{"v":30,"t":"The man answered and said unto them, Why herein is a marvellous thing, that ye know not from whence he is, and yet he hath opened mine eyes."},{"v":31,"t":"Now we know that God heareth not sinners: but if any man be a worshipper of God, and doeth his will, him he heareth."},{"v":32,"t":"Since the world began was it not heard that any man opened the eyes of one that was born blind."},{"v":33,"t":"If this man were not of God, he could do nothing."},{"v":34,"t":"They answered and said unto him, Thou wast altogether born in sins, and dost thou teach us? And they cast him out."},{"v":35,"t":"Jesus heard that they had cast him out; and when he had found him, he said unto him, Dost thou believe on the Son of God?"},{"v":36,"t":"He answered and said, Who is he, Lord, that I might believe on him?"},{"v":37,"t":"And Jesus said unto him, Thou hast both seen him, and it is he that talketh with thee."},{"v":38,"t":"And he said, Lord, I believe. And he worshipped him."},{"v":39,"t":"And Jesus said, For judgment I am come into this world, that they which see not might see; and that they which see might be made blind."},{"v":40,"t":"And some of the Pharisees which were with him heard these words, and said unto him, Are we blind also?"},{"v":41,"t":"Jesus said unto them, If ye were blind, ye should have no sin: but now ye say, We see; therefore your sin remaineth."}]},"Luke 2:2":{"ref":"Luke 2","cited":"2","verses":[{"v":1,"t":"And it came to pass in those days, that there went out a decree from Cæsar Augustus, that all the world should be taxed."},{"v":2,"t":"(And this taxing was first made when Cyrenius was governor of Syria.)","hl":1},{"v":3,"t":"And all went to be taxed, every one into his own city."},{"v":4,"t":"And Joseph also went up from Galilee, out of the city of Nazareth, into Judæa, unto the city of David, which is called Bethlehem; (because he was of the house and lineage of David:)"},{"v":5,"t":"To be taxed with Mary his espoused wife, being great with child."}]},"Micah 5:2":{"ref":"Micah 5","cited":"2","verses":[{"v":1,"t":"Now gather thyself in troops, O daughter of troops: he hath laid siege against us: they shall smite the judge of Israel with a rod upon the cheek."},{"v":2,"t":"But thou, Beth-lehem Ephratah, though thou be little among the thousands of Judah, yet out of thee shall he come forth unto me that is to be ruler in Israel; whose goings forth have been from of old, from everlasting.","hl":1},{"v":3,"t":"Therefore will he give them up, until the time that she which travaileth hath brought forth: then the remnant of his brethren shall return unto the children of Israel."},{"v":4,"t":"And he shall stand and feed in the strength of the LORD, in the majesty of the name of the LORD his God; and they shall abide: for now shall he be great unto the ends of the earth."},{"v":5,"t":"And this man shall be the peace, when the Assyrian shall come into our land: and when he shall tread in our palaces, then shall we raise against him seven shepherds, and eight principal men."}]},"Ezekiel 26":{"ref":"Ezekiel 26","cited":"","verses":[{"v":1,"t":"And it came to pass in the eleventh year, in the first day of the month, that the word of the LORD came unto me, saying,"},{"v":2,"t":"Son of man, because that Tyrus hath said against Jerusalem, Aha, she is broken that was the gates of the people: she is turned unto me: I shall be replenished, now she is laid waste:"},{"v":3,"t":"Therefore thus saith the Lord GOD; Behold, I am against thee, O Tyrus, and will cause many nations to come up against thee, as the sea causeth his waves to come up."},{"v":4,"t":"And they shall destroy the walls of Tyrus, and break down her towers: I will also scrape her dust from her, and make her like the top of a rock."},{"v":5,"t":"It shall be a place for the spreading of nets in the midst of the sea: for I have spoken it, saith the Lord GOD: and it shall become a spoil to the nations."},{"v":6,"t":"And her daughters which are in the field shall be slain by the sword; and they shall know that I am the LORD."},{"v":7,"t":"For thus saith the Lord GOD; Behold, I will bring upon Tyrus Nebuchadrezzar king of Babylon, a king of kings, from the north, with horses, and with chariots, and with horsemen, and companies, and much people."},{"v":8,"t":"He shall slay with the sword thy daughters in the field: and he shall make a fort against thee, and cast a mount against thee, and lift up the buckler against thee."},{"v":9,"t":"And he shall set engines of war against thy walls, and with his axes he shall break down thy towers."},{"v":10,"t":"By reason of the abundance of his horses their dust shall cover thee: thy walls shall shake at the noise of the horsemen, and of the wheels, and of the chariots, when he shall enter into thy gates, as men enter into a city wherein is made a breach."},{"v":11,"t":"With the hoofs of his horses shall he tread down all thy streets: he shall slay thy people by the sword, and thy strong garrisons shall go down to the ground."},{"v":12,"t":"And they shall make a spoil of thy riches, and make a prey of thy merchandise: and they shall break down thy walls, and destroy thy pleasant houses: and they shall lay thy stones and thy timber and thy dust in the midst of the water."},{"v":13,"t":"And I will cause the noise of thy songs to cease; and the sound of thy harps shall be no more heard."},{"v":14,"t":"And I will make thee like the top of a rock: thou shalt be a place to spread nets upon; thou shalt be built no more: for I the LORD have spoken it, saith the Lord GOD."},{"v":15,"t":"Thus saith the Lord GOD to Tyrus; Shall not the isles shake at the sound of thy fall, when the wounded cry, when the slaughter is made in the midst of thee?"},{"v":16,"t":"Then all the princes of the sea shall come down from their thrones, and lay away their robes, and put off their broidered garments: they shall clothe themselves with trembling; they shall sit upon the ground, and shall tremble at every moment, and be astonished at thee."},{"v":17,"t":"And they shall take up a lamentation for thee, and say to thee, How art thou destroyed, that wast inhabited of seafaring men, the renowned city, which wast strong in the sea, she and her inhabitants, which cause their terror to be on all that haunt it!"},{"v":18,"t":"Now shall the isles tremble in the day of thy fall; yea, the isles that are in the sea shall be troubled at thy departure."},{"v":19,"t":"For thus saith the Lord GOD; When I shall make thee a desolate city, like the cities that are not inhabited; when I shall bring up the deep upon thee, and great waters shall cover thee;"},{"v":20,"t":"When I shall bring thee down with them that descend into the pit, with the people of old time, and shall set thee in the low parts of the earth, in places desolate of old, with them that go down to the pit, that thou be not inhabited; and I shall set glory in the land of the living;"},{"v":21,"t":"I will make thee a terror, and thou shalt be no more: though thou be sought for, yet shalt thou never be found again, saith the Lord GOD."}]},"Ezekiel 29":{"ref":"Ezekiel 29","cited":"","verses":[{"v":1,"t":"In the tenth year, in the tenth month, in the twelfth day of the month, the word of the LORD came unto me, saying,"},{"v":2,"t":"Son of man, set thy face against Pharaoh king of Egypt, and prophesy against him, and against all Egypt:"},{"v":3,"t":"Speak, and say, Thus saith the Lord GOD; Behold, I am against thee, Pharaoh king of Egypt, the great dragon that lieth in the midst of his rivers, which hath said, My river is mine own, and I have made it for myself."},{"v":4,"t":"But I will put hooks in thy jaws, and I will cause the fish of thy rivers to stick unto thy scales, and I will bring thee up out of the midst of thy rivers, and all the fish of thy rivers shall stick unto thy scales."},{"v":5,"t":"And I will leave thee thrown into the wilderness, thee and all the fish of thy rivers: thou shalt fall upon the open fields; thou shalt not be brought together, nor gathered: I have given thee for meat to the beasts of the field and to the fowls of the heaven."},{"v":6,"t":"And all the inhabitants of Egypt shall know that I am the LORD, because they have been a staff of reed to the house of Israel."},{"v":7,"t":"When they took hold of thee by thy hand, thou didst break, and rend all their shoulder: and when they leaned upon thee, thou brakest, and madest all their loins to be at a stand."},{"v":8,"t":"Therefore thus saith the Lord GOD; Behold, I will bring a sword upon thee, and cut off man and beast out of thee."},{"v":9,"t":"And the land of Egypt shall be desolate and waste; and they shall know that I am the LORD: because he hath said, The river is mine, and I have made it."},{"v":10,"t":"Behold, therefore I am against thee, and against thy rivers, and I will make the land of Egypt utterly waste and desolate, from the tower of Syene even unto the border of Ethiopia."},{"v":11,"t":"No foot of man shall pass through it, nor foot of beast shall pass through it, neither shall it be inhabited forty years."},{"v":12,"t":"And I will make the land of Egypt desolate in the midst of the countries that are desolate, and her cities among the cities that are laid waste shall be desolate forty years: and I will scatter the Egyptians among the nations, and will disperse them through the countries."},{"v":13,"t":"Yet thus saith the Lord GOD; At the end of forty years will I gather the Egyptians from the people whither they were scattered:"},{"v":14,"t":"And I will bring again the captivity of Egypt, and will cause them to return into the land of Pathros, into the land of their habitation; and they shall be there a base kingdom."},{"v":15,"t":"It shall be the basest of the kingdoms; neither shall it exalt itself any more above the nations: for I will diminish them, that they shall no more rule over the nations."},{"v":16,"t":"And it shall be no more the confidence of the house of Israel, which bringeth their iniquity to remembrance, when they shall look after them: but they shall know that I am the Lord GOD."},{"v":17,"t":"And it came to pass in the seven and twentieth year, in the first month, in the first day of the month, the word of the LORD came unto me, saying,"},{"v":18,"t":"Son of man, Nebuchadrezzar king of Babylon caused his army to serve a great service against Tyrus: every head was made bald, and every shoulder was peeled: yet had he no wages, nor his army, for Tyrus, for the service that he had served against it:"},{"v":19,"t":"Therefore thus saith the Lord GOD; Behold, I will give the land of Egypt unto Nebuchadrezzar king of Babylon; and he shall take her multitude, and take her spoil, and take her prey; and it shall be the wages for his army."},{"v":20,"t":"I have given him the land of Egypt for his labour wherewith he served against it, because they wrought for me, saith the Lord GOD."},{"v":21,"t":"In that day will I cause the horn of the house of Israel to bud forth, and I will give thee the opening of the mouth in the midst of them; and they shall know that I am the LORD."}]},"Daniel 11":{"ref":"Daniel 11","cited":"","verses":[{"v":1,"t":"Also I in the first year of Darius the Mede, even I, stood to confirm and to strengthen him."},{"v":2,"t":"And now will I shew thee the truth. Behold, there shall stand up yet three kings in Persia; and the fourth shall be far richer than they all: and by his strength through his riches he shall stir up all against the realm of Grecia."},{"v":3,"t":"And a mighty king shall stand up, that shall rule with great dominion, and do according to his will."},{"v":4,"t":"And when he shall stand up, his kingdom shall be broken, and shall be divided toward the four winds of heaven; and not to his posterity, nor according to his dominion which he ruled: for his kingdom shall be plucked up, even for others beside those."},{"v":5,"t":"And the king of the south shall be strong, and one of his princes; and he shall be strong above him, and have dominion; his dominion shall be a great dominion."},{"v":6,"t":"And in the end of years they shall join themselves together; for the king's daughter of the south shall come to the king of the north to make an agreement: but she shall not retain the power of the arm; neither shall he stand, nor his arm: but she shall be given up, and they that brought her, and he that begat her, and he that strengthened her in these times."},{"v":7,"t":"But out of a branch of her roots shall one stand up in his estate, which shall come with an army, and shall enter into the fortress of the king of the north, and shall deal against them, and shall prevail:"},{"v":8,"t":"And shall also carry captives into Egypt their gods, with their princes, and with their precious vessels of silver and of gold; and he shall continue more years than the king of the north."},{"v":9,"t":"So the king of the south shall come into his kingdom, and shall return into his own land."},{"v":10,"t":"But his sons shall be stirred up, and shall assemble a multitude of great forces: and one shall certainly come, and overflow, and pass through: then shall he return, and be stirred up, even to his fortress."},{"v":11,"t":"And the king of the south shall be moved with choler, and shall come forth and fight with him, even with the king of the north: and he shall set forth a great multitude; but the multitude shall be given into his hand."},{"v":12,"t":"And when he hath taken away the multitude, his heart shall be lifted up; and he shall cast down many ten thousands: but he shall not be strengthened by it."},{"v":13,"t":"For the king of the north shall return, and shall set forth a multitude greater than the former, and shall certainly come after certain years with a great army and with much riches."},{"v":14,"t":"And in those times there shall many stand up against the king of the south: also the robbers of thy people shall exalt themselves to establish the vision; but they shall fall."},{"v":15,"t":"So the king of the north shall come, and cast up a mount, and take the most fenced cities: and the arms of the south shall not withstand, neither his chosen people, neither shall there be any strength to withstand."},{"v":16,"t":"But he that cometh against him shall do according to his own will, and none shall stand before him: and he shall stand in the glorious land, which by his hand shall be consumed."},{"v":17,"t":"He shall also set his face to enter with the strength of his whole kingdom, and upright ones with him; thus shall he do: and he shall give him the daughter of women, corrupting her: but she shall not stand on his side, neither be for him."},{"v":18,"t":"After this shall he turn his face unto the isles, and shall take many: but a prince for his own behalf shall cause the reproach offered by him to cease; without his own reproach he shall cause it to turn upon him."},{"v":19,"t":"Then he shall turn his face toward the fort of his own land: but he shall stumble and fall, and not be found."},{"v":20,"t":"Then shall stand up in his estate a raiser of taxes in the glory of the kingdom: but within few days he shall be destroyed, neither in anger, nor in battle."},{"v":21,"t":"And in his estate shall stand up a vile person, to whom they shall not give the honour of the kingdom: but he shall come in peaceably, and obtain the kingdom by flatteries."},{"v":22,"t":"And with the arms of a flood shall they be overflown from before him, and shall be broken; yea, also the prince of the covenant."},{"v":23,"t":"And after the league made with him he shall work deceitfully: for he shall come up, and shall become strong with a small people."},{"v":24,"t":"He shall enter peaceably even upon the fattest places of the province; and he shall do that which his fathers have not done, nor his fathers' fathers; he shall scatter among them the prey, and spoil, and riches: yea, and he shall forecast his devices against the strong holds, even for a time."},{"v":25,"t":"And he shall stir up his power and his courage against the king of the south with a great army; and the king of the south shall be stirred up to battle with a very great and mighty army; but he shall not stand: for they shall forecast devices against him."},{"v":26,"t":"Yea, they that feed of the portion of his meat shall destroy him, and his army shall overflow: and many shall fall down slain."},{"v":27,"t":"And both these kings' hearts shall be to do mischief, and they shall speak lies at one table; but it shall not prosper: for yet the end shall be at the time appointed."},{"v":28,"t":"Then shall he return into his land with great riches; and his heart shall be against the holy covenant; and he shall do exploits, and return to his own land."},{"v":29,"t":"At the time appointed he shall return, and come toward the south; but it shall not be as the former, or as the latter."},{"v":30,"t":"For the ships of Chittim shall come against him: therefore he shall be grieved, and return, and have indignation against the holy covenant: so shall he do; he shall even return, and have intelligence with them that forsake the holy covenant."},{"v":31,"t":"And arms shall stand on his part, and they shall pollute the sanctuary of strength, and shall take away the daily sacrifice, and they shall place the abomination that maketh desolate."},{"v":32,"t":"And such as do wickedly against the covenant shall he corrupt by flatteries: but the people that do know their God shall be strong, and do exploits."},{"v":33,"t":"And they that understand among the people shall instruct many: yet they shall fall by the sword, and by flame, by captivity, and by spoil, many days."},{"v":34,"t":"Now when they shall fall, they shall be holpen with a little help: but many shall cleave to them with flatteries."},{"v":35,"t":"And some of them of understanding shall fall, to try them, and to purge, and to make them white, even to the time of the end: because it is yet for a time appointed."},{"v":36,"t":"And the king shall do according to his will; and he shall exalt himself, and magnify himself above every god, and shall speak marvellous things against the God of gods, and shall prosper till the indignation be accomplished: for that that is determined shall be done."},{"v":37,"t":"Neither shall he regard the God of his fathers, nor the desire of women, nor regard any god: for he shall magnify himself above all."},{"v":38,"t":"But in his estate shall he honour the God of forces: and a god whom his fathers knew not shall he honour with gold, and silver, and with precious stones, and pleasant things."},{"v":39,"t":"Thus shall he do in the most strong holds with a strange god, whom he shall acknowledge and increase with glory: and he shall cause them to rule over many, and shall divide the land for gain."},{"v":40,"t":"And at the time of the end shall the king of the south push at him: and the king of the north shall come against him like a whirlwind, with chariots, and with horsemen, and with many ships; and he shall enter into the countries, and shall overflow and pass over."},{"v":41,"t":"He shall enter also into the glorious land, and many countries shall be overthrown: but these shall escape out of his hand, even Edom, and Moab, and the chief of the children of Ammon."},{"v":42,"t":"He shall stretch forth his hand also upon the countries: and the land of Egypt shall not escape."},{"v":43,"t":"But he shall have power over the treasures of gold and of silver, and over all the precious things of Egypt: and the Libyans and the Ethiopians shall be at his steps."},{"v":44,"t":"But tidings out of the east and out of the north shall trouble him: therefore he shall go forth with great fury to destroy, and utterly to make away many."},{"v":45,"t":"And he shall plant the tabernacles of his palace between the seas in the glorious holy mountain; yet he shall come to his end, and none shall help him."}]},"Daniel 7":{"ref":"Daniel 7","cited":"","verses":[{"v":1,"t":"In the first year of Belshazzar king of Babylon Daniel had a dream and visions of his head upon his bed: then he wrote the dream, and told the sum of the matters."},{"v":2,"t":"Daniel spake and said, I saw in my vision by night, and, behold, the four winds of the heaven strove upon the great sea."},{"v":3,"t":"And four great beasts came up from the sea, diverse one from another."},{"v":4,"t":"The first was like a lion, and had eagle's wings: I beheld till the wings thereof were plucked, and it was lifted up from the earth, and made stand upon the feet as a man, and a man's heart was given to it."},{"v":5,"t":"And behold another beast, a second, like to a bear, and it raised up itself on one side, and it had three ribs in the mouth of it between the teeth of it: and they said thus unto it, Arise, devour much flesh."},{"v":6,"t":"After this I beheld, and lo another, like a leopard, which had upon the back of it four wings of a fowl; the beast had also four heads; and dominion was given to it."},{"v":7,"t":"After this I saw in the night visions, and behold a fourth beast, dreadful and terrible, and strong exceedingly; and it had great iron teeth: it devoured and brake in pieces, and stamped the residue with the feet of it: and it was diverse from all the beasts that were before it; and it had ten horns."},{"v":8,"t":"I considered the horns, and, behold, there came up among them another little horn, before whom there were three of the first horns plucked up by the roots: and, behold, in this horn were eyes like the eyes of man, and a mouth speaking great things."},{"v":9,"t":"I beheld till the thrones were cast down, and the Ancient of days did sit, whose garment was white as snow, and the hair of his head like the pure wool: his throne was like the fiery flame, and his wheels as burning fire."},{"v":10,"t":"A fiery stream issued and came forth from before him: thousand thousands ministered unto him, and ten thousand times ten thousand stood before him: the judgment was set, and the books were opened."},{"v":11,"t":"I beheld then because of the voice of the great words which the horn spake: I beheld even till the beast was slain, and his body destroyed, and given to the burning flame."},{"v":12,"t":"As concerning the rest of the beasts, they had their dominion taken away: yet their lives were prolonged for a season and time."},{"v":13,"t":"I saw in the night visions, and, behold, one like the Son of man came with the clouds of heaven, and came to the Ancient of days, and they brought him near before him."},{"v":14,"t":"And there was given him dominion, and glory, and a kingdom, that all people, nations, and languages, should serve him: his dominion is an everlasting dominion, which shall not pass away, and his kingdom that which shall not be destroyed."},{"v":15,"t":"I Daniel was grieved in my spirit in the midst of my body, and the visions of my head troubled me."},{"v":16,"t":"I came near unto one of them that stood by, and asked him the truth of all this. So he told me, and made me know the interpretation of the things."},{"v":17,"t":"These great beasts, which are four, are four kings, which shall arise out of the earth."},{"v":18,"t":"But the saints of the most High shall take the kingdom, and possess the kingdom for ever, even for ever and ever."},{"v":19,"t":"Then I would know the truth of the fourth beast, which was diverse from all the others, exceeding dreadful, whose teeth were of iron, and his nails of brass; which devoured, brake in pieces, and stamped the residue with his feet;"},{"v":20,"t":"And of the ten horns that were in his head, and of the other which came up, and before whom three fell; even of that horn that had eyes, and a mouth that spake very great things, whose look was more stout than his fellows."},{"v":21,"t":"I beheld, and the same horn made war with the saints, and prevailed against them;"},{"v":22,"t":"Until the Ancient of days came, and judgment was given to the saints of the most High; and the time came that the saints possessed the kingdom."},{"v":23,"t":"Thus he said, The fourth beast shall be the fourth kingdom upon earth, which shall be diverse from all kingdoms, and shall devour the whole earth, and shall tread it down, and break it in pieces."},{"v":24,"t":"And the ten horns out of this kingdom are ten kings that shall arise: and another shall rise after them; and he shall be diverse from the first, and he shall subdue three kings."},{"v":25,"t":"And he shall speak great words against the most High, and shall wear out the saints of the most High, and think to change times and laws: and they shall be given into his hand until a time and times and the dividing of time."},{"v":26,"t":"But the judgment shall sit, and they shall take away his dominion, to consume and to destroy it unto the end."},{"v":27,"t":"And the kingdom and dominion, and the greatness of the kingdom under the whole heaven, shall be given to the people of the saints of the most High, whose kingdom is an everlasting kingdom, and all dominions shall serve and obey him."},{"v":28,"t":"Hitherto is the end of the matter. As for me Daniel, my cogitations much troubled me, and my countenance changed in me: but I kept the matter in my heart."}]},"Daniel 9":{"ref":"Daniel 9","cited":"","verses":[{"v":1,"t":"In the first year of Darius the son of Ahasuerus, of the seed of the Medes, which was made king over the realm of the Chaldeans;"},{"v":2,"t":"In the first year of his reign I Daniel understood by books the number of the years, whereof the word of the LORD came to Jeremiah the prophet, that he would accomplish seventy years in the desolations of Jerusalem."},{"v":3,"t":"And I set my face unto the Lord God, to seek by prayer and supplications, with fasting, and sackcloth, and ashes:"},{"v":4,"t":"And I prayed unto the LORD my God, and made my confession, and said, O Lord, the great and dreadful God, keeping the covenant and mercy to them that love him, and to them that keep his commandments;"},{"v":5,"t":"We have sinned, and have committed iniquity, and have done wickedly, and have rebelled, even by departing from thy precepts and from thy judgments:"},{"v":6,"t":"Neither have we hearkened unto thy servants the prophets, which spake in thy name to our kings, our princes, and our fathers, and to all the people of the land."},{"v":7,"t":"O Lord, righteousness belongeth unto thee, but unto us confusion of faces, as at this day; to the men of Judah, and to the inhabitants of Jerusalem, and unto all Israel, that are near, and that are far off, through all the countries whither thou hast driven them, because of their trespass that they have trespassed against thee."},{"v":8,"t":"O Lord, to us belongeth confusion of face, to our kings, to our princes, and to our fathers, because we have sinned against thee."},{"v":9,"t":"To the Lord our God belong mercies and forgivenesses, though we have rebelled against him;"},{"v":10,"t":"Neither have we obeyed the voice of the LORD our God, to walk in his laws, which he set before us by his servants the prophets."},{"v":11,"t":"Yea, all Israel have transgressed thy law, even by departing, that they might not obey thy voice; therefore the curse is poured upon us, and the oath that is written in the law of Moses the servant of God, because we have sinned against him."},{"v":12,"t":"And he hath confirmed his words, which he spake against us, and against our judges that judged us, by bringing upon us a great evil: for under the whole heaven hath not been done as hath been done upon Jerusalem."},{"v":13,"t":"As it is written in the law of Moses, all this evil is come upon us: yet made we not our prayer before the LORD our God, that we might turn from our iniquities, and understand thy truth."},{"v":14,"t":"Therefore hath the LORD watched upon the evil, and brought it upon us: for the LORD our God is righteous in all his works which he doeth: for we obeyed not his voice."},{"v":15,"t":"And now, O Lord our God, that hast brought thy people forth out of the land of Egypt with a mighty hand, and hast gotten thee renown, as at this day; we have sinned, we have done wickedly."},{"v":16,"t":"O Lord, according to all thy righteousness, I beseech thee, let thine anger and thy fury be turned away from thy city Jerusalem, thy holy mountain: because for our sins, and for the iniquities of our fathers, Jerusalem and thy people are become a reproach to all that are about us."},{"v":17,"t":"Now therefore, O our God, hear the prayer of thy servant, and his supplications, and cause thy face to shine upon thy sanctuary that is desolate, for the Lord's sake."},{"v":18,"t":"O my God, incline thine ear, and hear; open thine eyes, and behold our desolations, and the city which is called by thy name: for we do not present our supplications before thee for our righteousnesses, but for thy great mercies."},{"v":19,"t":"O Lord, hear; O Lord, forgive; O Lord, hearken and do; defer not, for thine own sake, O my God: for thy city and thy people are called by thy name."},{"v":20,"t":"And whiles I was speaking, and praying, and confessing my sin and the sin of my people Israel, and presenting my supplication before the LORD my God for the holy mountain of my God;"},{"v":21,"t":"Yea, whiles I was speaking in prayer, even the man Gabriel, whom I had seen in the vision at the beginning, being caused to fly swiftly, touched me about the time of the evening oblation."},{"v":22,"t":"And he informed me, and talked with me, and said, O Daniel, I am now come forth to give thee skill and understanding."},{"v":23,"t":"At the beginning of thy supplications the commandment came forth, and I am come to shew thee; for thou art greatly beloved: therefore understand the matter, and consider the vision."},{"v":24,"t":"Seventy weeks are determined upon thy people and upon thy holy city, to finish the transgression, and to make an end of sins, and to make reconciliation for iniquity, and to bring in everlasting righteousness, and to seal up the vision and prophecy, and to anoint the most Holy."},{"v":25,"t":"Know therefore and understand, that from the going forth of the commandment to restore and to build Jerusalem unto the Messiah the Prince shall be seven weeks, and threescore and two weeks: the street shall be built again, and the wall, even in troublous times."},{"v":26,"t":"And after threescore and two weeks shall Messiah be cut off, but not for himself: and the people of the prince that shall come shall destroy the city and the sanctuary; and the end thereof shall be with a flood, and unto the end of the war desolations are determined."},{"v":27,"t":"And he shall confirm the covenant with many for one week: and in the midst of the week he shall cause the sacrifice and the oblation to cease, and for the overspreading of abominations he shall make it desolate, even until the consummation, and that determined shall be poured upon the desolate."}]},"Psalm 22":{"ref":"Psalms 22","cited":"","verses":[{"v":1,"t":"My God, my God, why hast thou forsaken me? why art thou so far from helping me, and from the words of my roaring?"},{"v":2,"t":"O my God, I cry in the daytime, but thou hearest not; and in the night season, and am not silent."},{"v":3,"t":"But thou art holy, O thou that inhabitest the praises of Israel."},{"v":4,"t":"Our fathers trusted in thee: they trusted, and thou didst deliver them."},{"v":5,"t":"They cried unto thee, and were delivered: they trusted in thee, and were not confounded."},{"v":6,"t":"But I am a worm, and no man; a reproach of men, and despised of the people."},{"v":7,"t":"All they that see me laugh me to scorn: they shoot out the lip, they shake the head, saying,"},{"v":8,"t":"He trusted on the LORD that he would deliver him: let him deliver him, seeing he delighted in him."},{"v":9,"t":"But thou art he that took me out of the womb: thou didst make me hope when I was upon my mother's breasts."},{"v":10,"t":"I was cast upon thee from the womb: thou art my God from my mother's belly."},{"v":11,"t":"Be not far from me; for trouble is near; for there is none to help."},{"v":12,"t":"Many bulls have compassed me: strong bulls of Bashan have beset me round."},{"v":13,"t":"They gaped upon me with their mouths, as a ravening and a roaring lion."},{"v":14,"t":"I am poured out like water, and all my bones are out of joint: my heart is like wax; it is melted in the midst of my bowels."},{"v":15,"t":"My strength is dried up like a potsherd; and my tongue cleaveth to my jaws; and thou hast brought me into the dust of death."},{"v":16,"t":"For dogs have compassed me: the assembly of the wicked have inclosed me: they pierced my hands and my feet."},{"v":17,"t":"I may tell all my bones: they look and stare upon me."},{"v":18,"t":"They part my garments among them, and cast lots upon my vesture."},{"v":19,"t":"But be not thou far from me, O LORD: O my strength, haste thee to help me."},{"v":20,"t":"Deliver my soul from the sword; my darling from the power of the dog."},{"v":21,"t":"Save me from the lion's mouth: for thou hast heard me from the horns of the unicorns."},{"v":22,"t":"I will declare thy name unto my brethren: in the midst of the congregation will I praise thee."},{"v":23,"t":"Ye that fear the LORD, praise him; all ye the seed of Jacob, glorify him; and fear him, all ye the seed of Israel."},{"v":24,"t":"For he hath not despised nor abhorred the affliction of the afflicted; neither hath he hid his face from him; but when he cried unto him, he heard."},{"v":25,"t":"My praise shall be of thee in the great congregation: I will pay my vows before them that fear him."},{"v":26,"t":"The meek shall eat and be satisfied: they shall praise the LORD that seek him: your heart shall live for ever."},{"v":27,"t":"All the ends of the world shall remember and turn unto the LORD: and all the kindreds of the nations shall worship before thee."},{"v":28,"t":"For the kingdom is the LORD's: and he is the governor among the nations."},{"v":29,"t":"All they that be fat upon earth shall eat and worship: all they that go down to the dust shall bow before him: and none can keep alive his own soul."},{"v":30,"t":"A seed shall serve him; it shall be accounted to the Lord for a generation."},{"v":31,"t":"They shall come, and shall declare his righteousness unto a people that shall be born, that he hath done this."}]},"Psalm 22:16":{"ref":"Psalms 22","cited":"16","verses":[{"v":13,"t":"They gaped upon me with their mouths, as a ravening and a roaring lion."},{"v":14,"t":"I am poured out like water, and all my bones are out of joint: my heart is like wax; it is melted in the midst of my bowels."},{"v":15,"t":"My strength is dried up like a potsherd; and my tongue cleaveth to my jaws; and thou hast brought me into the dust of death."},{"v":16,"t":"For dogs have compassed me: the assembly of the wicked have inclosed me: they pierced my hands and my feet.","hl":1},{"v":17,"t":"I may tell all my bones: they look and stare upon me."},{"v":18,"t":"They part my garments among them, and cast lots upon my vesture."},{"v":19,"t":"But be not thou far from me, O LORD: O my strength, haste thee to help me."}]},"James 2:19":{"ref":"James 2","cited":"19","verses":[{"v":16,"t":"And one of you say unto them, Depart in peace, be ye warmed and filled; notwithstanding ye give them not those things which are needful to the body; what doth it profit?"},{"v":17,"t":"Even so faith, if it hath not works, is dead, being alone."},{"v":18,"t":"Yea, a man may say, Thou hast faith, and I have works: shew me thy faith without thy works, and I will shew thee my faith by my works."},{"v":19,"t":"Thou believest that there is one God; thou doest well: the devils also believe, and tremble.","hl":1},{"v":20,"t":"But wilt thou know, O vain man, that faith without works is dead?"},{"v":21,"t":"Was not Abraham our father justified by works, when he had offered Isaac his son upon the altar?"},{"v":22,"t":"Seest thou how faith wrought with his works, and by works was faith made perfect?"}]},"Psalm 13":{"ref":"Psalms 13","cited":"","verses":[{"v":1,"t":"How long wilt thou forget me, O LORD? for ever? how long wilt thou hide thy face from me?"},{"v":2,"t":"How long shall I take counsel in my soul, having sorrow in my heart daily? how long shall mine enemy be exalted over me?"},{"v":3,"t":"Consider and hear me, O LORD my God: lighten mine eyes, lest I sleep the sleep of death;"},{"v":4,"t":"Lest mine enemy say, I have prevailed against him; and those that trouble me rejoice when I am moved."},{"v":5,"t":"But I have trusted in thy mercy; my heart shall rejoice in thy salvation."},{"v":6,"t":"I will sing unto the LORD, because he hath dealt bountifully with me."}]},"1 Samuel 15":{"ref":"1 Samuel 15","cited":"","verses":[{"v":1,"t":"Samuel also said unto Saul, The LORD sent me to anoint thee to be king over his people, over Israel: now therefore hearken thou unto the voice of the words of the LORD."},{"v":2,"t":"Thus saith the LORD of hosts, I remember that which Amalek did to Israel, how he laid wait for him in the way, when he came up from Egypt."},{"v":3,"t":"Now go and smite Amalek, and utterly destroy all that they have, and spare them not; but slay both man and woman, infant and suckling, ox and sheep, camel and ass."},{"v":4,"t":"And Saul gathered the people together, and numbered them in Telaim, two hundred thousand footmen, and ten thousand men of Judah."},{"v":5,"t":"And Saul came to a city of Amalek, and laid wait in the valley."},{"v":6,"t":"And Saul said unto the Kenites, Go, depart, get you down from among the Amalekites, lest I destroy you with them: for ye shewed kindness to all the children of Israel, when they came up out of Egypt. So the Kenites departed from among the Amalekites."},{"v":7,"t":"And Saul smote the Amalekites from Havilah until thou comest to Shur, that is over against Egypt."},{"v":8,"t":"And he took Agag the king of the Amalekites alive, and utterly destroyed all the people with the edge of the sword."},{"v":9,"t":"But Saul and the people spared Agag, and the best of the sheep, and of the oxen, and of the fatlings, and the lambs, and all that was good, and would not utterly destroy them: but every thing that was vile and refuse, that they destroyed utterly."},{"v":10,"t":"Then came the word of the LORD unto Samuel, saying,"},{"v":11,"t":"It repenteth me that I have set up Saul to be king: for he is turned back from following me, and hath not performed my commandments. And it grieved Samuel; and he cried unto the LORD all night."},{"v":12,"t":"And when Samuel rose early to meet Saul in the morning, it was told Samuel, saying, Saul came to Carmel, and, behold, he set him up a place, and is gone about, and passed on, and gone down to Gilgal."},{"v":13,"t":"And Samuel came to Saul: and Saul said unto him, Blessed be thou of the LORD: I have performed the commandment of the LORD."},{"v":14,"t":"And Samuel said, What meaneth then this bleating of the sheep in mine ears, and the lowing of the oxen which I hear?"},{"v":15,"t":"And Saul said, They have brought them from the Amalekites: for the people spared the best of the sheep and of the oxen, to sacrifice unto the LORD thy God; and the rest we have utterly destroyed."},{"v":16,"t":"Then Samuel said unto Saul, Stay, and I will tell thee what the LORD hath said to me this night. And he said unto him, Say on."},{"v":17,"t":"And Samuel said, When thou wast little in thine own sight, wast thou not made the head of the tribes of Israel, and the LORD anointed thee king over Israel?"},{"v":18,"t":"And the LORD sent thee on a journey, and said, Go and utterly destroy the sinners the Amalekites, and fight against them until they be consumed."},{"v":19,"t":"Wherefore then didst thou not obey the voice of the LORD, but didst fly upon the spoil, and didst evil in the sight of the LORD?"},{"v":20,"t":"And Saul said unto Samuel, Yea, I have obeyed the voice of the LORD, and have gone the way which the LORD sent me, and have brought Agag the king of Amalek, and have utterly destroyed the Amalekites."},{"v":21,"t":"But the people took of the spoil, sheep and oxen, the chief of the things which should have been utterly destroyed, to sacrifice unto the LORD thy God in Gilgal."},{"v":22,"t":"And Samuel said, Hath the LORD as great delight in burnt offerings and sacrifices, as in obeying the voice of the LORD? Behold, to obey is better than sacrifice, and to hearken than the fat of rams."},{"v":23,"t":"For rebellion is as the sin of witchcraft, and stubbornness is as iniquity and idolatry. Because thou hast rejected the word of the LORD, he hath also rejected thee from being king."},{"v":24,"t":"And Saul said unto Samuel, I have sinned: for I have transgressed the commandment of the LORD, and thy words: because I feared the people, and obeyed their voice."},{"v":25,"t":"Now therefore, I pray thee, pardon my sin, and turn again with me, that I may worship the LORD."},{"v":26,"t":"And Samuel said unto Saul, I will not return with thee: for thou hast rejected the word of the LORD, and the LORD hath rejected thee from being king over Israel."},{"v":27,"t":"And as Samuel turned about to go away, he laid hold upon the skirt of his mantle, and it rent."},{"v":28,"t":"And Samuel said unto him, The LORD hath rent the kingdom of Israel from thee this day, and hath given it to a neighbour of thine, that is better than thou."},{"v":29,"t":"And also the Strength of Israel will not lie nor repent
