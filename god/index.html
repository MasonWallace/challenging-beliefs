{"id":"prophecy-isaiah53-psalm22","title":"Isaiah 53 and Psalm 22: the Dead Sea Scrolls prove the texts came first","category":"prophecy-evidence","claim":"Strip this argument to the part that is physically certain. The Great Isaiah Scroll, containing all of Isaiah 53 — the servant despised, pierced for others' transgressions, silent before shearers, numbered with transgressors, buried with the rich, seeing light after death — sits in the Israel Museum and dates to roughly 125 BC, more than a century before the crucifixion. Psalm 22 — mockery, 'why have you forsaken me,' divided garments, cast lots, encircled hands and feet — was translated into Greek generations before Jesus. Whatever one concludes about these texts, one hypothesis is dead on arrival: that Christians wrote or edited them after the fact to fit Jesus. The correspondence between Israel's most famous suffering-figure texts and the manner of Jesus's death is either coincidence, literary construction by the evangelists, or design — but the texts' priority is not a faith claim; it is carbon-dated parchment. This is the strongest form of the prophecy argument: begin from what is physically beyond dispute, then argue about interpretation.","bible":["Isaiah 52:13-53:12","Psalm 22:1-18","Luke 24:25-27","Acts 8:32-35"],"sources":[{"name":"Great Isaiah Scroll, Israel Museum (view Isaiah 53 online)","type":"institutional","url":"http://dss.collections.imj.org.il/isaiah"},{"name":"Wikipedia, 'Isaiah 53' (Jewish and Christian interpretation history)","type":"institutional","url":"https://en.wikipedia.org/wiki/Isaiah_53"},{"name":"Psalm 22 (text)","type":"primary","url":"https://www.biblegateway.com/passage/?search=Psalm+22&version=ESV"},{"name":"Wikipedia, 'Psalm 22' (incl. the 22:16 textual question)","type":"institutional","url":"https://en.wikipedia.org/wiki/Psalm_22"}],"response":"The mainstream Jewish and critical reading: Isaiah's servant is Israel — the text SAYS so repeatedly in the surrounding chapters ('you are my servant, Israel,' 41:8, 44:1, 49:3) — suffering in exile and vindicated in return; chapter 53 is not a messianic prediction in context. Psalm 22 is an individual lament, a genre piece, not prophecy. The 'match' has a simpler explanation: the passion narratives were COMPOSED using these texts — the evangelists, writing decades later, narrated the crucifixion in the language of Psalm 22 (Mark hands you the psalm's first line from the cross), so of course the events fit the texts; the texts shaped the telling. And Psalm 22:16's 'pierced' rests on a genuine textual crux (Masoretic 'like a lion' vs. the ka'aru reading) — too disputed to bear weight.","responseSource":{"url":"http://dss.collections.imj.org.il/isaiah"},"verdict":"admitted","rationale":"Admitted — strictly for the pre-dating, which is the entry's actual claim and is conceded by everyone with a radiocarbon lab. The messianic INTERPRETATION is genuinely contested, and the rationale must keep those layers separate. Usage: this is the answer to 'the prophecies were written in after the fact' — full stop. Against the servant-as-Israel reading, note honestly that the servant in ch. 53 suffers vicariously FOR 'my people' and some pre-Christian Jewish tradition read the passage messianically — then let the texts do their own work. Don't hang anything on Psalm 22:16's disputed word.","severity":"medium","avoid":false,"context":"Any argument that a text predicted something invites the obvious reply: the text was written or edited afterwards. For Isaiah 53 and Psalm 22 that reply can be tested and closed. The Great Isaiah Scroll from Qumran contains the entire book, copied around 125 BC, and a Psalms fragment from the same region does the same job for Psalm 22. Whatever you conclude about the passages, they demonstrably existed before the events they are said to describe. Nobody added them.","quran":[],"hadith":[]},
{"id":"objection-problem-of-evil","title":"The problem of evil: the skeptic's best argument, answered within its limits","category":"objections-answered","claim":"Take it at full strength, because it deserves it. William Rowe's fawn: a deer burns slowly to death in a forest fire no human ever knows about — what greater good does THAT serve? Paul Draper: the actual distribution of pain and pleasure looks exactly like what biological indifference predicts, and not like what a loving Father predicts. This is the skeptic's best card, and many deconverts hold it not as philosophy but as autopsy — a child's grave, an unanswered prayer. The Christian responses, honestly labeled: the logical problem is widely regarded as answered — even J. L. Mackie conceded Plantinga's free-will defense shows 'the problem of evil does not, after all, show that the central doctrines of theism are logically inconsistent.' The evidential problem remains: free will, soul-making (Hick), and skeptical theism (we're poorly positioned to certify suffering as pointless) each carry real weight and real costs. Scripture's own answer to Job is not a theodicy but a presence. And Christianity's distinctive: a God with wounds — the cross puts God inside the problem, not above it.","bible":["Job 38:1-7","Romans 8:18-25","John 11:35","Revelation 21:4"],"sources":[{"name":"SEP, 'The Problem of Evil' (Tooley)","type":"scholarly","url":"https://plato.stanford.edu/entries/evil/"},{"name":"J. L. Mackie, The Miracle of Theism (the concession on the logical problem)","type":"skeptic","url":"https://en.wikipedia.org/wiki/The_Miracle_of_Theism"},{"name":"Alvin Plantinga, God, Freedom, and Evil","type":"scholarly","url":"https://en.wikipedia.org/wiki/God,_Freedom,_and_Evil"},{"name":"Paul Draper's evidential argument (overview)","type":"skeptic","url":"https://en.wikipedia.org/wiki/Problem_of_evil"},{"name":"C. S. Lewis, A Grief Observed (the pastoral register)","type":"apologetics","url":"https://en.wikipedia.org/wiki/A_Grief_Observed"}],"response":"Rowe and Draper, pressed properly: skeptical theism saves God at the price of skepticism about everything — if we can't judge the fawn's suffering pointless, we also can't judge anything God-commanded as good, and moral knowledge collapses. Free will is irrelevant to earthquakes, parasites, and the 500 million years of animal suffering that preceded any human choice. Soul-making fails for suffering that destroys souls rather than builds them (child dementia; the fawn, which has no soul to make). Draper's comparative point stands un-answered rather than answered: on the hypothesis of indifference, the biological role of pain is expected; on theism it requires auxiliary hypotheses stacked ad hoc. The cross may console; it does not explain.","responseSource":{"url":"https://plato.stanford.edu/entries/evil/"},"verdict":"contested","rationale":"Contested — anyone who grades this 'answered' hasn't felt it. The honest position: the logical problem is resolved (with Mackie's concession in print), the evidential problem is a genuine open wound, and Christianity's resources (free will, soul-making, eschatology, the cross) reduce but do not eliminate its force. PASTORAL RULE, non-negotiable: with a suffering person, arguments are the wrong tool — Job's friends were at their best in the seven silent days. This entry is for the whiteboard, never the hospital room.","severity":"medium","avoid":false,"context":"This is the reason most people give for not believing, and it deserves better than a quick answer. It comes in two forms that need to be kept apart. The logical form — that suffering is strictly incompatible with a good, all-powerful God — is now widely regarded as unsuccessful, including by atheist philosophers, largely because of the free-will defense. The evidential form is a different animal: not that suffering disproves God, but that the sheer amount and distribution of it counts as evidence against him. That version is live, serious and hard.","quran":[],"hadith":[]},
{"id":"objection-divine-hiddenness","title":"Divine hiddenness: Schellenberg's argument and the shape of a God who wants love, not compliance","category":"objections-answered","claim":"J. L. Schellenberg's argument, stated fairly: a perfectly loving God would ensure that a conscious relationship is available to every creature open to one; yet 'nonresistant nonbelief' exists — people who sought God sincerely, sometimes through years of anguished prayer, and found silence. Many deconverts are exhibit A, and the first Christian response must be to believe them: their seeking was real, and 'you secretly resisted' is both unkind and unfounded. The substantive responses: Paul Moser argues God's aim is filial knowledge — love that transforms — not spectator certainty, and evidence sufficient to compel assent without surrender might produce precisely the wrong relationship; Pascal saw the same asymmetry ('enough light for those who desire to see, enough obscurity for those of a contrary disposition'). Scripture itself testifies to the experience — 'Truly, you are a God who hides himself' (Isaiah 45:15); a third of the Psalms are lament at the silence. The Christian claim was never that God is obvious; it isthat he is findable — sought with the whole heart (Jeremiah 29:13), known finally in a person rather than a proof.","bible":["Isaiah 45:15","Jeremiah 29:13","Psalm 13:1-2","Matthew 11:25-27"],"sources":[{"name":"SEP, 'Divine Hiddenness' (Schellenberg's own entry)","type":"scholarly","url":"https://plato.stanford.edu/entries/divine-hiddenness/"},{"name":"J. L. Schellenberg, Divine Hiddenness and Human Reason","type":"skeptic","url":"https://en.wikipedia.org/wiki/Divine_hiddenness"},{"name":"Paul Moser, The Elusive God (CUP)","type":"scholarly","url":"https://www.cambridge.org/core/books/elusive-god/6C4A5E11D3D24AE0B6B4B4D1F9C4F6C5"},{"name":"Blaise Pascal, Pensées (light/obscurity fragments)","type":"primary","url":"https://www.gutenberg.org/ebooks/18269"}],"response":"Schellenberg's rejoinders are strong: relationship REQUIRES belief that the other party exists — a loving parent does not hide so thoroughly that the child doubts she has a parent; whatever goods obscurity secures, an omnipotent God could secure them alongside basic awareness of his existence. The 'wrong kind of belief' worry conflates knowing God exists with surrendering to him — the demons of James 2:19 manage the first without the second, proving the two come apart, so clarity coerces nothing. And Stephen Maitzen's demographic point bites: nonbelief clusters by geography and upbringing — Thailand vs. Texas — which is what cultural transmission predicts and divine relational strategy does not. The lament Psalms attest the experience of hiddenness; they do not explain why a loving God would allow honest seekers to die in the silence.","responseSource":{"url":"https://plato.stanford.edu/entries/divine-hiddenness/"},"verdict":"contested","rationale":"Contested — this is the strongest atheological argument after evil, it is aimed precisely at the deconvert's actual experience, and pretending it has a tidy answer will read as gaslighting to anyone who lived it. Usage: lead by validating the seeker's experience as real and biblically attested (Isaiah 45:15, Psalm 13), then offer Moser/Pascal as a coherent — not conclusive — account of why a love-seeking God might not maximize obviousness. Never say 'they secretly resisted.'","severity":"medium","avoid":false,"context":"Most Christians have never heard this argument, and it is probably the strongest one in contemporary atheist philosophy after the problem of evil. J. L. Schellenberg's version runs: a perfectly loving God would want a relationship with every person open to one; a relationship requires believing the other party exists; yet there are people who are genuinely open and still do not believe. If that is true, something has to give. It is worth stating accurately before answering, because a Christian who can do that is rare.","quran":[],"hadith":[]},
{"id":"objection-canaanite-conquest","title":"The Canaanite commands: the real options, laid out without flinching","category":"objections-answered","claim":"The texts are as hard as skeptics say: Deuteronomy 20:16-18 and 1 Samuel 15 as written command total destruction, including children. The faithful options, each with its price. (1) Ancient Near Eastern war rhetoric: 'utterly destroyed... left none remaining' was conventional hyperbole — Joshua 10-11 reports total annihilation of cities whose inhabitants are alive and numerous chapters later (Judges 1); other ANE victory texts (Merneptah: 'Israel is wasted, his seed is not') brag identically about survivors. Copan and Flannagan argue the commands target military strongholds and dispossession, not extermination. (2) The Bible's own dominant verb is 'drive out,' gradually (Exodus 23:29-30, 'little by little'), after a 400-year moral forbearance (Genesis 15:16). (3) Archaeology's minimal-conquest picture — most sites show no destruction layer — ironically undercuts a literal genocide reading. (4) The hard views: some (Wolterstorff) read the accounts as hagiographic hyperbole never meant literally; others bite the bullet on divine prerogative; still others (Seibert, Enns) say the texts reflect Israel's assumptions about God rather than God — a costly move for biblical authority. No option is free. Say which you hold, and its price.","bible":["Deuteronomy 20:16-18","Genesis 15:16","Exodus 23:29-30","Judges 1:27-33"],"sources":[{"name":"Paul Copan & Matthew Flannagan, Did God Really Command Genocide?","type":"apologetics","url":"https://www.paulcopan.com/"},{"name":"Nicholas Wolterstorff on reading Joshua (in Divine Evil?, OUP)","type":"scholarly","url":"https://global.oup.com/academic/product/divine-evil-9780199576739"},{"name":"Wikipedia, 'The Bible and violence' (survey of positions)","type":"institutional","url":"https://en.wikipedia.org/wiki/The_Bible_and_violence"},{"name":"Randal Rauser's internal critique (the honest in-house objection)","type":"apologetics","url":"https://randalrauser.com/"}],"response":"The steelmanned objection: 1 Samuel 15 is not siege rhetoric — Saul is condemned for insufficient killing, and 'infant and nursing child' is specified; hyperbole readings look motivated, applied exactly and only where the morality is intolerable, and a hermeneutic elastic enough to soften genocide commands can soften anything, forfeiting the claim that the text constrains its readers. Raising the ban to 'dispossession' merely relabels ethnic cleansing. And the internal critique (pressed by Christian philosopher Randal Rauser as much as by atheists): if your moral perception is reliable enough to recognize the resurrection's God as good, it is reliable enough to recognize commanded infant-killing as evil — you cannot switch it off selectively when the text needs rescuing.","responseSource":{"url":"https://www.paulcopan.com/"},"verdict":"contested","rationale":"Contested, with no pretense otherwise — this is the hardest text-level objection Christianity faces, and the entry's value is showing the map honestly rather than selling one exit. Usage: never quick-answer this in conversation; acknowledge the horror first (the skeptic's moral reaction is functioning exactly as Romans 2 says it should), then present the options with their costs. Evidential weight for the positive case: low — pure defense, and modeling honest defense is the point.","severity":"low","avoid":false,"context":"The commands in Joshua and 1 Samuel to destroy the Canaanites and the Amalekites — including, in the text, women and children — are the hardest passages in the Bible to read, and no honest treatment makes them comfortable. This case lays out the four main approaches Christians actually take, including ones that disagree sharply with each other, and is clear that each of them costs something. Softening the text before reading it is the one move guaranteed to fail with a skeptic, who has usually read it already.","quran":[],"hadith":[]},
{"id":"objection-who-made-god","title":"'Then who made God?' — a category error, honestly scoped","category":"objections-answered","claim":"The pop version fails on the definitions. No classical theistic argument premises 'everything has a cause' — the Kalam says everything that BEGINS has a cause; the contingency argument says every CONTINGENT thing needs an explanation. God, as classically defined, neither begins nor is contingent: a necessary being is precisely the kind of thing the question cannot apply to — asking who made the unmade is asking what's north of the North Pole. Dawkins's upgraded version ('a designing God would be even more complex, hence more improbable') imports the assumption that God is a composite physical system whose complexity needs assembling; classical theism (divine simplicity) denies exactly that, and Dawkins nowhere engages the actual doctrine. Honest scope note: there IS a sophisticated version that survives — Graham Oppy asks why the initial physical state can't be the necessary stopping point instead of God. That is a real question. But notice it concedes this entry's point: something must be uncaused and necessary; the argument is over what. The schoolyard gotcha is dead; the grown-up debate is the contingency argument (see that entry).","bible":["Psalm 90:2","Exodus 3:14","John 8:58","Revelation 1:8"],"sources":[{"name":"SEP, 'Cosmological Argument' (what the premises actually say)","type":"scholarly","url":"https://plato.stanford.edu/entries/cosmological-argument/"},{"name":"Edward Feser on the 'who made God' confusion","type":"apologetics","url":"https://edwardfeser.blogspot.com/"},{"name":"Richard Dawkins, The God Delusion ch. 4 (the Boeing 747 gambit)","type":"skeptic","url":"https://en.wikipedia.org/wiki/The_God_Delusion"},{"name":"SEP, 'Divine Simplicity'","type":"scholarly","url":"https://plato.stanford.edu/entries/divine-simplicity/"}],"response":"The best skeptical salvage (Oppy, and Russell before him): fine — no serious argument says everything has a cause; but then the theist has abandoned the intuitive engine that made the argument feel forceful, and the naturalist simply claims the same exemption for the universe's initial state: necessary, uncaused, brute. Now both worldviews terminate in an unexplained necessary something, and the naturalist's candidate is one we already know exists, with no additional attributes (omniscience, personhood) purchased on credit. 'Why is God exempt?' fails; 'why is God a BETTER stopping point than physics?' does not — and divine simplicity, the doctrine doing the anti-Dawkins work, is itself contested even among theists.","responseSource":{"url":"https://plato.stanford.edu/entries/cosmological-argument/"},"verdict":"unrefuted","rationale":"Unrefuted — against the popular objection as actually posed, the category answer stands, and even sophisticated atheists (Oppy) prosecute a different, better question instead. Usage: answer the gotcha in two sentences, cheerfully concede that the real debate (which stopping point is better) is live, and route it to the Kalam/contingency entry. Don't spike the football; the person asking usually heard it from a YouTube short and deserves the respectful version.","severity":"medium","avoid":false,"context":"'If everything needs a cause, what caused God?' is the most common objection to the cosmological argument and it is asked in good faith far more often than Christians assume. The short answer is that the argument's premise was never 'everything needs a cause' but 'everything that *begins to exist* needs a cause' — so an eternal being is not an exception smuggled in but the thing the argument is reasoning toward. This case also notes where the objection still has real force.","quran":[],"hadith":[]},
{"id":"objection-science-genesis","title":"Science and Genesis: Christianity is not married to a six-thousand-year-old earth","category":"objections-answered","claim":"The objection 'science has disproven Genesis, therefore Christianity' assumes young-earth literalism is THE Christian reading. It never was the only one. Augustine — writing On the Literal Meaning of Genesis around AD 415, fourteen centuries before Darwin — argued the 'days' need not be solar days, and warned that Christians talking scientific nonsense about the world 'to the derision of unbelievers' disgrace the faith; Origen earlier noted that days one through three occur before the sun exists, signaling the text's own non-literal cues. The current faithful range: young-earth creationism, old-earth/day-age, the framework reading, John Walton's cosmic-temple reading (Genesis 1 as functional origins, not material mechanics), and evolutionary creation (BioLogos; Francis Collins, who led the Human Genome Project while confessing the creeds). This site takes no position among them. The point is narrower and stronger: 'evolution, therefore atheism' is a non sequitur that young-earth fundamentalism and New Atheism strangely agree on — both insist Genesis must be a science textbook or a lie. The tradition's oldest readers knew better.","bible":["Genesis 1:1-2:3","Psalm 104","Job 38-39","2 Peter 3:8"],"sources":[{"name":"Augustine, De Genesi ad litteram (the 'derision of unbelievers' passage, I.19)","type":"primary","url":"https://en.wikipedia.org/wiki/De_Genesi_ad_litteram"},{"name":"BioLogos (Francis Collins's organization)","type":"institutional","url":"https://biologos.org/"},{"name":"John Walton, The Lost World of Genesis One","type":"scholarly","url":"https://www.ivpress.com/the-lost-world-of-genesis-one"},{"name":"American Scientific Affiliation (spectrum of Christian views)","type":"institutional","url":"https://network.asa3.org/"}],"response":"The skeptical press: the interpretive diversity is real, but its TIMING is suspicious — non-literal readings surged precisely when geology and Darwin made literalism untenable, which looks like a retreat dressed as exegesis (Augustine notwithstanding, the dominant premodern reading was a young earth and a global flood). And the problem cascades past chapter one: an evolutionary history means no first couple bottleneck (population genetics), which strains the historical Adam, the Fall, and Paul's Adam-Christ architecture in Romans 5 — Dennett's 'universal acid' eats more than the six days. At some point, says the skeptic, reinterpretation-under-fire becomes indistinguishable from a theory that can absorb any disconfirmation.","responseSource":{"url":"https://en.wikipedia.org/wiki/De_Genesi_ad_litteram"},"verdict":"unrefuted","rationale":"Unrefuted for the narrow claim actually made: 'science falsifies Christianity' fails, because non-literal readings are ancient (Augustine and Origen predate geology by over a millennium — the post-hoc charge breaks on that fact) and Christianity's core claims are about Christ, not chronology. Honest limits: the historical-Adam and Fall questions are genuinely hard theological work in progress — concede that. Usage: never let an evangelistic conversation become a young-earth referendum; the site must not marry that position.","severity":"medium","avoid":false,"context":"A great many conversations about God get diverted into arguments about the age of the earth and never come back. This case exists to say plainly that Christianity is not committed to a young earth: the church has held several readings of Genesis 1 for a very long time, including from Augustine in the fourth century, and a large share of Christians in the sciences hold none of the positions a skeptic is expecting. Choosing that hill means the actual claim — a man executed under Pilate and seen alive afterwards — never gets discussed.","quran":[],"hadith":[]},
{"id":"objection-religion-wars","title":"'Religion causes all wars' — the data says otherwise; use it with clean hands","category":"objections-answered","claim":"The Encyclopedia of Wars (Phillips & Axelrod), a standard secular reference cataloguing 1,763 wars across recorded history, classifies 123 — about 7% — as having religious causes. The overwhelming drivers of war are territory, resources, dynastic succession, and power: the ordinary appetites of states. The 20th century sharpens the point: history's largest body counts accrued under regimes that were explicitly anti-religious — Stalin's USSR, Mao's China, Pol Pot's Cambodia. Now the discipline in using this: the conclusion is NOT 'atheism causes gulags' — that would be the mirror image of the fallacy being answered, and unfair to the atheist neighbor for exactly the reasons 'religion causes wars' is unfair to the believer. The conclusion is narrower and biblical: removing religion demonstrably does not remove atrocity, because the common variable is human beings plus unaccountable power — which is roughly what the doctrine of sin has claimed all along (Jeremiah 17:9). Religion has been a real accelerant in real wars; Christians should say so about the Crusades and the Thirty Years' War without flinching. But the causal arrow 'no religion, therefore peace' is empirically dead.","bible":["Jeremiah 17:9","James 4:1-2","Matthew 26:52","Romans 3:10-18"],"sources":[{"name":"Phillips & Axelrod, Encyclopedia of Wars (the 123/1763 classification)","type":"scholarly","url":"https://en.wikipedia.org/wiki/Religious_war"},{"name":"Wikipedia, 'Religious war' (data and debate)","type":"institutional","url":"https://en.wikipedia.org/wiki/Religious_war"},{"name":"The Black Book of Communism (20th-century state atrocity counts)","type":"scholarly","url":"https://en.wikipedia.org/wiki/The_Black_Book_of_Communism"},{"name":"David Bentley Hart, Atheist Delusions (historical corrective)","type":"apologetics","url":"https://en.wikipedia.org/wiki/Atheist_Delusions"}],"response":"The skeptic's better version: the 7% figure depends on classification choices — religion is entangled with 'political' wars everywhere (was the Thirty Years' War dynastic or confessional? Yes), so clean category counts flatter religion. Hitchens's actual thesis was never 'religion causes all wars' but that religion poisons conflicts it touches — supplying absolute stakes, out-group sanctification, and divine permission. As for the atheist-state rebuttal: those regimes functioned as quasi-religions — infallible doctrine, sacred texts, heresy trials — so they arguably indict dogmatic certainty, not secularism; though the theist may fairly note this rescue risks special pleading in both directions, defining every atrocity as 'religious in structure' makes the claim unfalsifiable.","responseSource":{"url":"https://en.wikipedia.org/wiki/Religious_war"},"verdict":"unrefuted","rationale":"Unrefuted against the claim as popularly made ('religion is the main cause of war') — the data is secular and decisive. Usage discipline is the whole game: concede religious atrocities specifically and by name; never weaponize Stalin as 'atheism did it'; frame the 20th century as proof that secularism doesn't fix humans, which is an argument for the doctrine of sin, not against your neighbor. Used clean, this flips a gotcha into common ground about human nature.","severity":"medium","avoid":false,"context":"'Religion causes most wars' is asserted constantly and is straightforwardly checkable. The standard reference work catalogues roughly 1,760 wars and classifies about 7% as religious in origin; the twentieth century's largest death tolls came from explicitly secular regimes. Those numbers are real. This case also insists on the second half, which most Christian responses skip: the Crusades, the Inquisition and the wars of religion happened, Christians did them, and a rebuttal that only cites statistics has not answered the person in front of you.","quran":[],"hadith":[]},
{"id":"dontuse-banana-design","title":"The banana and 'just look at the trees': retire the design shortcut","category":"dont-use-apologetics","claim":"Ray Comfort's 2006 argument that the banana is 'the atheist's nightmare' — perfectly shaped for the human hand, tab at the top, biodegradable wrapper — failed in the most instructive way possible: the Cavendish banana is a seedless cultivar produced by centuries of human selective breeding; wild bananas are stubby, seed-packed, and barely edible. The argument accidentally credited God's design to agronomists, and it lives on as a joke format in atheist spaces. Its gentler cousin — 'how can you see the trees and not believe?' — is not wrong as testimony: Psalm 19 and Romans 1:20 describe a real perception of glory through creation. But testimony is not argument. Offered AS an argument, it invites the immediate counter Darwin himself felt: look also at the Ichneumonidae wasp larvae eating caterpillars alive, the childhood cancers, the parasites of the eye. If the design intuition is worth defending in argument form — and it is — the defensible version is fine-tuning (see that entry), which survives expert scrutiny. The banana does not.","bible":["Psalm 19:1-4","Romans 1:20"],"sources":[{"name":"Wikipedia, 'Ray Comfort' (the banana argument and retraction)","type":"institutional","url":"https://en.wikipedia.org/wiki/Ray_Comfort"},{"name":"Wikipedia, 'Banana' (domestication history)","type":"institutional","url":"https://en.wikipedia.org/wiki/Banana"},{"name":"Darwin's Ichneumonidae letter to Asa Gray, 1860","type":"primary","url":"https://www.darwinproject.ac.uk/letter/DCP-LETT-2814.xml"},{"name":"SEP, 'Teleological Arguments' (what a serious design argument looks like)","type":"scholarly","url":"https://plato.stanford.edu/entries/teleological-arguments/"}],"response":"The skeptic's rebuttal is simply correct: the banana was designed — by humans, via artificial selection, which is precisely the naturalistic mechanism writ small; and appeals to everyday biological 'perfection' collapse under dysteology (the recurrent laryngeal nerve's detour, the vertebrate blind spot, parasitic life cycles). Comfort himself later conceded the banana point. 'Look at the trees' proves the speaker's experience of wonder, which the atheist may share while attributing it to deep time and selection — it moves no one who doesn't already believe.","responseSource":{"url":"https://en.wikipedia.org/wiki/Ray_Comfort"},"verdict":"answered","rationale":"Don't use. The skeptical counter is right on the facts, and deploying refuted arguments taxes the credibility of every good argument you make afterward. Redirect: the wonder is legitimate as testimony (say 'this is what the world looks like to me' honestly); the argument-form belongs to fine-tuning, where the numbers are real and the interlocutors are physicists.","severity":"low","avoid":true,"context":"The banana argument — the fruit's shape and ridges as evidence of design — is probably the single most mocked moment in modern apologetics, and it is still repeated. This case explains why it fails in a way that is worth understanding rather than just avoiding: the modern banana is a human cultivar, selectively bred over centuries from a wild fruit full of hard seeds. It is a genuine argument for intelligent design, just not the kind intended. 'Just look at the trees' fails for a related reason.","quran":[],"hadith":[]},
{"id":"dontuse-anti-evolution-science","title":"'No transitional fossils' and the second law of thermodynamics: bad science, bad witness","category":"dont-use-apologetics","claim":"Two arguments to retire together, plainly. First: 'there are no transitional fossils' is false — not disputed, false. Tiktaalik (a fish-tetrapod intermediate found by PREDICTING which rock stratum and age to search), Archaeopteryx, the therapsid reptile-mammal sequence, the whale series from Pakicetus through Ambulocetus to Basilosaurus, and the hominin fossil record all exist and are displayed in museums; in an important sense every fossil population is transitional. Second: 'evolution violates the second law of thermodynamics' misuses physics — the second law governs closed systems, and Earth is not one: it receives a torrent of low-entropy sunlight, and local order increases are utterly routine (an embryo, a snowflake, a refrigerator) while total entropy still rises. Even major creationist organizations now list versions of these arguments among those to avoid. The deeper issue is Augustine's, sixteen centuries old: a Christian talking demonstrable nonsense about nature, 'to the derision of unbelievers,' teaches the unbeliever that the faith itself is nonsense. Whatever position one takes on origins, it must not be defended with claims a first-year biology or physics student can refute.","bible":["Proverbs 18:17","1 Thessalonians 5:21"],"sources":[{"name":"TalkOrigins CC200: 'There are no transitional fossils'","type":"skeptic","url":"http://www.talkorigins.org/indexcc/CC/CC200.html"},{"name":"TalkOrigins CF001: second law claims","type":"skeptic","url":"http://www.talkorigins.org/indexcc/CF/CF001.html"},{"name":"Answers in Genesis, 'Arguments to Avoid' (creationists policing their own)","type":"apologetics","url":"https://answersingenesis.org/arguments-to-avoid/"},{"name":"Wikipedia, 'Tiktaalik' (the predicted find)","type":"institutional","url":"https://en.wikipedia.org/wiki/Tiktaalik"}],"response":"The skeptical rebuttal is settled science, not opinion: the transitional series are catalogued, physical, and public; Tiktaalik was a successful PREDICTION of evolutionary theory, the strongest kind of evidence there is. The thermodynamics claim fails on the first page of any textbook treatment — open systems importing energy decrease local entropy constantly. A skeptic who hears these arguments concludes, reasonably, that the speaker either doesn't understand the science or doesn't care, and files everything else the speaker says — including the resurrection case — under the same heading.","responseSource":{"url":"http://www.talkorigins.org/indexcc/CC/CC200.html"},"verdict":"answered","rationale":"Don't use — these are false and refuted, and this site says so plainly rather than hedging. Christians hold a range of origins views (see science-and-Genesis entry); none of those views needs, or is helped by, claims that are simply wrong. The cost is paid by the Gospel's credibility, per Augustine's warning.","severity":"low","avoid":true,"context":"Two claims in particular still circulate widely in churches: that there are no transitional fossils, and that the second law of thermodynamics makes evolution impossible. This case is blunt that both are false, and shows why the second is worse than the first — the second law applies to closed systems, and the earth receives energy from the sun continuously, which a skeptic with a high-school physics class behind them will point out. Using either tells your listener that you repeat things you have not checked.","quran":[],"hadith":[]},
{"id":"dontuse-darwin-recanted","title":"'Darwin recanted on his deathbed': the Lady Hope legend is false","category":"dont-use-apologetics","claim":"The story that Charles Darwin renounced evolution and embraced Christ on his deathbed traces to 'Lady Hope' (Elizabeth Hope), a British evangelist who told a Massachusetts gathering in 1915 — thirty-three years after Darwin died in 1882 — that she had visited him near the end and found him reading Hebrews and lamenting his theory. Darwin's family, who were actually present at his death, flatly denied it. His daughter Henrietta Litchfield, in print in 1922: 'I was present at his deathbed... He never recanted any of his scientific views, then or earlier.' Darwin died an agnostic, courteous toward faith he did not share, and no serious historian — Christian or otherwise — credits the tale. Notice also that the story would prove nothing even if true: theories stand or fall on evidence, not on their authors' final anxieties; Christianity would not be falsified by a deathbed recantation from Paul's biographer, and evolution is not falsified by one from Darwin. Repeating this legend does double damage: it spreads a falsehood, and it implies the speaker's case needs one.","bible":["Exodus 20:16","Ephesians 4:25"],"sources":[{"name":"TalkOrigins, 'The Lady Hope Story: A Widespread Falsehood'","type":"skeptic","url":"http://www.talkorigins.org/faqs/hope.html"},{"name":"Wikipedia, 'Elizabeth Hope' (the legend's history)","type":"institutional","url":"https://en.wikipedia.org/wiki/Elizabeth_Hope"},{"name":"Answers in Genesis lists it among arguments to avoid","type":"apologetics","url":"https://answersingenesis.org/arguments-to-avoid/"},{"name":"James Moore, The Darwin Legend (the scholarly autopsy)","type":"scholarly","url":"https://en.wikipedia.org/wiki/The_Darwin_Legend"}],"response":"There is no counter to steelman — the skeptic is right, the historians are right, and even the major creationist organizations agree the story is false. The Darwin family's firsthand denials, the thirty-three-year gap, and the total absence of corroboration settle it. A Christian repeating it is bearing false witness about a dead man, in service of a point that would be logically worthless even if the story were true.","responseSource":{"url":"http://www.talkorigins.org/faqs/hope.html"},"verdict":"answered","rationale":"Don't use, ever. The command against false witness does not have an apologetics exemption. If it comes up, the Christian's move is to debunk it FIRST — nothing builds trust with a skeptic faster than watching a believer kill a convenient legend on principle.","severity":"low","avoid":true,"context":"The story that Darwin renounced evolution on his deathbed and asked for the Gospel to be preached traces to a woman known as Lady Hope, who claimed to have visited him. Darwin's daughter Henrietta, who was present during his final illness, denied it flatly and in print. The story keeps circulating because it is satisfying. This case treats it as a test case in source-checking: the person you are talking to can disprove it on a phone in twenty seconds, and will then reasonably discount everything else you said.","quran":[],"hadith":[]},
{"id":"dontuse-pascals-wager-opener","title":"Pascal's wager as an opener: wrong tool, wrong slot","category":"dont-use-apologetics","claim":"Deployed as a conversation-opener — 'you might as well believe; if you're wrong you lose nothing' — the wager fails three ways, and skeptics know all three. The many-gods objection: the same bet works for Allah, Vishnu, or a deity who rewards honest doubt and punishes hedged belief, so the wager alone selects no religion. The doxastic problem: belief is not a light switch — no one can sincerely believe a proposition for prize money, as the skeptic being lectured is vividly aware while not-believing. The mercenary problem: it presents faith as fire insurance, which misrepresents a Gospel whose call is love of God, not actuarial self-interest. What almost everyone misses is that Pascal knew this. The wager appears in the Pensées aimed at a specific reader: the sophisticated Parisian too indifferent to investigate. Its real function is anti-apathy — to show that the God question is not intellectually optional, that the stakes make honest investigation mandatory — after which Pascal prescribes practice and inquiry, not instant belief. That limited use survives: as a closing nudge to a genuine inquirer ('this question deserves your serious attention'), not as an opening argument to a skeptic.","bible":["Deuteronomy 6:5","Jeremiah 29:13","Hebrews 11:6"],"sources":[{"name":"SEP, 'Pascal's Wager' (the objections, formalized)","type":"scholarly","url":"https://plato.stanford.edu/entries/pascal-wager/"},{"name":"Blaise Pascal, Pensées (the wager in context, fragment 233)","type":"primary","url":"https://www.gutenberg.org/ebooks/18269"},{"name":"Wikipedia, 'Pascal's wager' (many-gods objection history)","type":"institutional","url":"https://en.wikipedia.org/wiki/Pascal%27s_wager"},{"name":"Peter Kreeft's sympathetic reconstruction (the legitimate limited use)","type":"apologetics","url":"https://www.peterkreeft.com/"}],"response":"The skeptic's objections are sound against the pop version: the wager is decision theory with a rigged partition (it assumes exactly two live options), it demands belief as an act of will (impossible), and the God it imagines — fooled by self-interested compliance — is not worth believing in; an omniscient being would presumably prefer honest disbelief to strategic pretense. Even the rehabilitated anti-apathy use has a limit: it motivates INQUIRY, and inquiry may honestly conclude against faith — the wager cannot then be re-invoked to overrule the verdict it commissioned.","responseSource":{"url":"https://plato.stanford.edu/entries/pascal-wager/"},"verdict":"answered","rationale":"Don't use as an opener or as a proof — graded 'answered' because in its common street form the skeptical counters succeed. Salvage: at the END of a conversation with a genuinely undecided person, Pascal's actual point ('this question is too important for indifference — investigate it seriously') is both honest and effective. Slot matters: last word to the apathetic, never first word to the skeptic.","severity":"low","avoid":true,"context":"Pascal's wager — that betting on God is rational given what is at stake — is a genuinely interesting piece of philosophy, and it was never designed to do the job it is usually given. Pascal aimed it at someone already persuaded the odds were non-trivial and unable to move the final inch. Led with, it lands as an invitation to fake a belief for insurance purposes, which is both poor philosophy and poor theology, and it invites the obvious reply about all the other gods on offer.","quran":[],"hadith":[]},
{"id":"dontuse-atheist-mind-reading","title":"Mind-reading the atheist: 'you secretly believe,' 'you have no morals,' 'atheism takes more faith'","category":"dont-use-apologetics","claim":"Three tropes to retire, and Scripture itself retires the worst of them. 'Atheists secretly believe and are suppressing it' proof-texts Romans 1 while ignoring that Romans 2:14-15 says Gentiles without the law 'do by nature what the law requires' because it is 'written on their hearts' — the Bible PREDICTS morally serious, conscience-driven unbelievers; it does not license telling your neighbor she is lying about her own inner life. Empirically, many atheists are deconverts who describe leaving faith as painful, slow, and honest — often through church hurt; telling them their loss was secretly insincere re-opens the wound and ends the conversation. 'Atheists have no basis for morality' conflates a legitimate metaethical question (what GROUNDS moral facts? — see the moral-argument entry) with a slander (atheists aren't moral) that is false in observation and, per Romans 2, false in doctrine. 'It takes more faith to be an atheist' equivocates — the atheist means by 'faith' precisely what she rejects, so the line lands as a taunt, not an argument. All three substitute diagnosis of the person for engagement with the position. The entire posture of this section depends on refusing that substitution.","bible":["Romans 2:14-15","1 Peter 3:15-16","Colossians 4:6","Proverbs 18:13"],"sources":[{"name":"Romans 2:14-15 (the text that forbids the trope)","type":"primary","url":"https://www.biblegateway.com/passage/?search=Romans+2%3A12-16&version=ESV"},{"name":"SEP, 'Atheism and Agnosticism' (what atheists actually claim)","type":"scholarly","url":"https://plato.stanford.edu/entries/atheism-agnosticism/"},{"name":"Pew Research, religious 'nones' and deconversion data","type":"institutional","url":"https://www.pewresearch.org/religion/"},{"name":"John Marriott's research on deconversion and church hurt","type":"apologetics","url":"https://www.biola.edu/"}],"response":"The skeptic's response is simply true and should be received as such: 'I don't secretly believe — I left slowly, honestly, and at real personal cost, and being told otherwise is being called a liar.' On morality: moral MOTIVATION and moral knowledge are demonstrably independent of metaethics — atheists donate kidneys and run soup kitchens, and Euthyphro-style questions show grounding puzzles cut at theists too. On 'more faith': defining the atheist's evidential standard as 'faith' is a word game that concedes the argument by changing the dictionary. Each rebuttal is correct; each trope, deployed, confirms the deconvert's suspicion that the church argues in bad faith.","responseSource":{"url":"https://www.biblegateway.com/passage/?search=Romans+2%3A12-16&version=ESV"},"verdict":"answered","rationale":"Don't use — graded 'answered' because the skeptical rebuttals to all three tropes succeed, and in this case the Bible is on the skeptic's side of the exchange (Romans 2 predicts the moral atheist). Usage: engage arguments, never diagnose interlocutors; with deconverts especially, ask about their story before offering any case at all. This entry is the tonal keystone of the whole section.","severity":"low","avoid":true,"context":"'You know God exists and you're suppressing it.' 'You just want to keep sinning.' 'Atheism takes more faith than Christianity.' Each of these tells the person in front of you that you are addressing a stereotype rather than them, and each one ends the conversation while feeling, to the speaker, like a point scored. This case is about why they fail even when the underlying theology is defensible — a claim about someone's inner motives is not something you can know, and they can tell.","quran":[],"hadith":[]},
{"id":"resurrection-willing-to-die","title":"'They died for it' — the argument in the only form that works","category":"resurrection-case","claim":"The disciples suffered and in several cases died rather than deny that they had seen Jesus alive. People will die for something they sincerely believe, but nobody dies for something they know they made up — and these particular people were in a position to know.","response":"The skeptic's reply comes in three parts, and the first two are right. (1) Sincerity proves nothing about truth. The 9/11 hijackers died for their faith; so have Heaven's Gate members, Jim Jones's congregation, and martyrs of every religion on earth. Willingness to die establishes that a person believes what they are saying — nothing more. (2) The historical record for most of the apostles is very thin. Only one apostolic death is recorded in the New Testament: James son of Zebedee, beheaded by Herod Agrippa I around AD 44 (Acts 12:2). The vivid traditions — Thomas speared in India, Bartholomew flayed alive, Andrew on an X-shaped cross, Peter crucified upside down — come from apocryphal Acts written between the second and fourth centuries, which also contain talking animals and resurrected fish. Sean McDowell's <i>The Fate of the Apostles</i> (2015) is the most thorough treatment by a Christian scholar, and he grades the evidence honestly: he judges the martyrdoms of Peter, Paul, James son of Zebedee and James the brother of Jesus as historically well-established, John's death as probably natural, and most of the rest as possible but not demonstrable. (3) And even granting all of it, martyrdom establishes only that the disciples sincerely believed they had seen the risen Jesus — which skeptical scholars like Gerd Lüdemann already concede without difficulty, explaining the belief as visionary experience.","responseSource":{"name":"Sean McDowell, The Fate of the Apostles (2015); Candida Moss, The Myth of Persecution (2013); Gerd Lüdemann, The Resurrection of Jesus","url":"https://www.routledge.com/The-Fate-of-the-Apostles/McDowell/p/book/9781032097213"},"sources":[{"name":"Sean McDowell, The Fate of the Apostles (Routledge, 2015)","type":"scholarly","url":"https://www.routledge.com/The-Fate-of-the-Apostles/McDowell/p/book/9781032097213"},{"name":"1 Clement 5 (c. AD 95) — on Peter and Paul's sufferings","type":"primary","url":"https://www.earlychristianwritings.com/text/1clement-roberts.html"},{"name":"Josephus, Antiquities 20.200 — the execution of James, the brother of Jesus","type":"primary","url":"https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.01.0146%3Abook%3D20"},{"name":"Tacitus, Annals 15.44 — the Neronian persecution","type":"primary","url":"https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.02.0078:book=15:chapter=44"},{"name":"Candida Moss, The Myth of Persecution (HarperOne, 2013)","type":"scholarly","url":"https://www.harpercollins.com/products/the-myth-of-persecution-candida-moss"}],"bible":["Acts 12:1-2","1 Corinthians 15:14-19","2 Corinthians 11:23-28","Acts 26:9-11"],"verdict":"contested","severity":"medium","rationale":"Graded contested because the popular version fails and the disciplined version holds, and the difference between them is everything. What survives scrutiny is a narrow, real point: the disciples were not in the position of ordinary religious martyrs. A Muslim martyr dies for a revelation he received on someone else's testimony; a Heaven's Gate member dies for a metaphysics nobody could check. The disciples are claiming to have eaten with a man they watched die — a claim about which they personally could not be honestly mistaken in the way a second-hand believer can. Either they saw something or they knew they hadn't. Paul is the sharpest case, because he was persecuting the movement and had every worldly reason not to join it, and 2 Corinthians 11 lists what it cost him in his own hand. So the argument does real work, but bounded work: it establishes sincerity, not truth. It rules out deliberate fraud — the 'they stole the body and made it up' theory — and it rules out nothing else. Present it that way, with the thin evidence for the ten conceded up front, and it is durable. Present it as 'all twelve apostles were tortured to death and none recanted' and you will meet someone who has read McDowell, and you will lose everything you said before it.","talk":"Never say 'all twelve were martyred.' Say the narrow thing: **“I'm not arguing that dying for a belief makes it true — plenty of people have died for things that were false. I'm arguing these particular men were in a position to know whether they had made it up, and they behaved for the rest of their lives like men who hadn't.”** Then concede the evidence for most of them is late and thin, and name Paul, who was on the other side first.","context":"'They died for it' is one of the most-repeated arguments in Christian conversation, and in its usual form it does not work — people die for false beliefs constantly, which any skeptic will point out immediately. This case rescues the narrow version that does work. The disciples were not believing someone else's testimony about an event they never saw; they were claiming to have eaten with a man they watched die. That is a claim about which they could not be honestly mistaken in the way a second-hand believer can. It rules out deliberate fraud, and nothing more.","quran":[],"hadith":[]},
{"id":"dontuse-all-twelve-martyred","title":"DON'T USE: 'all twelve apostles were martyred and not one recanted'","category":"dont-use-apologetics","claim":"A staple of sermons and tracts: every one of the twelve was tortured to death, and a single recantation would have ended Christianity — yet not one of them broke.","response":"There is no ancient source that says this, and there never was. The New Testament records one apostolic death (James son of Zebedee, Acts 12:2). Peter and Paul's deaths in Rome are early and well-attested — 1 Clement, written around AD 95, speaks of their sufferings, and Tacitus describes Nero's persecution — but the specific details, including the upside-down cross, come from later tradition. For most of the others, the source is a body of apocryphal Acts composed from the second to the fourth century, texts that also feature a talking lion and a resurrected smoked fish. Early Christian tradition holds that John died of old age at Ephesus, which by itself falsifies the 'all twelve' claim. The 'not one recanted' half is worse: it is an argument from the absence of records nobody kept. We have no roster of who held firm because we have no reliable roster of what happened to most of them at all. Sean McDowell, writing as a Christian apologist specifically to defend this line of evidence, is the one who documents how little of it can be established.","responseSource":{"name":"Sean McDowell, The Fate of the Apostles (2015) — a Christian scholar's own grading of the evidence","url":"https://www.routledge.com/The-Fate-of-the-Apostles/McDowell/p/book/9781032097213"},"sources":[{"name":"Sean McDowell, The Fate of the Apostles (Routledge, 2015)","type":"scholarly","url":"https://www.routledge.com/The-Fate-of-the-Apostles/McDowell/p/book/9781032097213"},{"name":"The Acts of Thomas (3rd c. apocryphal)","type":"primary","url":"https://www.newadvent.org/fathers/0805.htm"},{"name":"Eusebius, Church History 3.31 — John at Ephesus","type":"primary","url":"https://www.newadvent.org/fathers/250103.htm"}],"bible":["Acts 12:1-2","1 Thessalonians 5:21","Proverbs 12:22"],"verdict":"answered","severity":"low","avoid":true,"rationale":"Avoid because it overclaims a real argument into a false one, and because the correction is a single search away. The moment a skeptic checks Thomas or Bartholomew and finds a third-century romance, everything true you said about the crucifixion, the creed and Paul is retroactively suspect — you have taught them that you repeat things you have not verified. The fix is not to drop the evidence but to shrink the claim to what the sources carry: Peter, Paul, James son of Zebedee and James the brother of Jesus, the last of those attested by Josephus, who was not a Christian. Four well-documented deaths made in the strongest possible position of knowledge is a better argument than twelve legendary ones, precisely because it survives being checked.","talk":"If you have used this one — and most of us have — say so: **“I used to say all twelve were martyred. That's not what the sources support, and I stopped saying it.”** Then give the four that hold. Nothing rebuilds credibility with a skeptic faster than a Christian correcting a Christian talking point unprompted.","context":"'All twelve apostles were tortured to death and not one recanted' is a sermon staple, and there is no ancient source that says it. The New Testament records one apostolic death; John is traditionally held to have died of old age; and the vivid traditions about the rest come from second-to-fourth-century romances that also feature talking animals. This case is graded from Sean McDowell's own research — an apologist who set out to defend this evidence and documented honestly how little of it can be established.","quran":[],"hadith":[]}
];

-8","verses":[{"v":1,"t":"And when the sabbath was past, Mary Magdalene, and Mary the mother of James, and Salome, had bought sweet spices, that they might come and anoint him.","hl":1},{"v":2,"t":"And very early in the morning the first day of the week, they came unto the sepulchre at the rising of the sun.","hl":1},{"v":3,"t":"And they said among themselves, Who shall roll us away the stone from the door of the sepulchre?","hl":1},{"v":4,"t":"And when they looked, they saw that the stone was rolled away: for it was very great.","hl":1},{"v":5,"t":"And entering into the sepulchre, they saw a young man sitting on the right side, clothed in a long white garment; and they were affrighted.","hl":1},{"v":6,"t":"And he saith unto them, Be not affrighted: Ye seek Jesus of Nazareth, which was crucified: he is risen; he is not here: behold the place where they laid him.","hl":1},{"v":7,"t":"But go your way, tell his disciples and Peter that he goeth before you into Galilee: there shall ye see him, as he said unto you.","hl":1},{"v":8,"t":"And they went out quickly, and fled from the sepulchre; for they trembled and were amazed: neither said they any thing to any man; for they were afraid.","hl":1},{"v":9,"t":"Now when Jesus was risen early the first day of the week, he appeared first to Mary Magdalene, out of whom he had cast seven devils."},{"v":10,"t":"And she went and told them that had been with him, as they mourned and wept."},{"v":11,"t":"And they, when they had heard that he was alive, and had been seen of her, believed not."}]},"Acts 2:22-32":{"ref":"Acts 2","cited":"22-32","verses":[{"v":19,"t":"And I will shew wonders in heaven above, and signs in the earth beneath; blood, and fire, and vapour of smoke:"},{"v":20,"t":"The sun shall be turned into darkness, and the moon into blood, before that great and notable day of the Lord come:"},{"v":21,"t":"And it shall come to pass, that whosoever shall call on the name of the Lord shall be saved."},{"v":22,"t":"Ye men of I e reign of Tiberius Cæsar, Pontius Pilate being governor of Judæa, and Herod being tetrarch of Galilee, and his brother Philip tetrarch of Ituræa and of the region of Trachonitis, and Lysanias the tetrarch of Abilene,","hl":1},{"v":2,"t":"Annas and Caiaphas being the high priests, the word of God came unto John the son of Zacharias in the wilderness."},{"v":3,"t":"And he came into all the country about Jordan, preaching the baptism of repentance for the remission of sins;"},{"v":4,"t":"As it is written in the book of the words of Esaias the prophet, saying, The voice of one crying in the wilderness, Prepare ye the way of the Lord, make his paths straight."}]},"Luke 2:1-7":{"ref":"Luke 2","cited":"1-7","verses":[{"v":1,"t":"And it came to pass in those days, that there went out a decree from Cæsar Augustus, that all the world should be taxed.","hl":1},{"v":2,"t":"(And this taxing was first made when Cyrenius was governor of Syria.)","hl":1},{"v":3,"t":"And all went to be taxed, every one into his own city.","hl":1},{"v":4,"t":"And Joseph also went up from Galilee, out of the city of Nazareth, into Judæa, unto the city of David, which is called Bethlehem; (because he was of the house and lineage of David:)","hl":1},{"v":5,"t":"To be taxed with Mary his espoused wife, being great with child.","hl":1},{"v":6,"t":"And so it was, that, while they were there, the days were accomplished that she should be delivered.","hl":1},{"v":7,"t":"And she brought forth her firstborn son, and wrapped him in swaddling clothes, and laid him in a manger; because there was no room for them in the inn.","hl":1},{"v":8,"t":"And there were in the same country shepherds abiding in the field, keeping watch over their flock by night."},{"v":9,"t":"And, lo, the angel of the Lord came upon them, and the glory of the Lord shone round about them: and they were sore afraid."},{"v":10,"t":"And the angel said unto them, Fear not: for, behold, I bring you good tidings of great joy, which shall be to all hat the word of the LORD came unto me, saying,"},{"v":2,"t":"Son of man, because that Tyrus hath said against Jerusalem, Aha, she is broken that was the gates of the people: she is turned unto me: I shall be replenished, now she is laid waste:"},{"v":3,"t":"Therefore thus saith the Lord GOD; Behold, I am against thee, O Tyrus, and will cause many nations to come up against thee, as the sea causeth his waves to come up.","hl":1},{"v":4,"t":"And they shall destroy the walls of Tyrus, and break down her towers: I will also scrape her dust from her, and make her like the top of a rock.","hl":1},{"v":5,"t":"It shall be a place for the spreading of nets in the midst of the sea: for I have spoken it, saith the Lord GOD: and it shall become a spoil to the nations.","hl":1},{"v":6,"t":"And her daughters which are in the field shall be slain by the sword; and they shall know that I am the LORD.","hl":1},{"v":7,"t":"For thus saith the Lord GOD; Behold, I will bring upon Tyrus Nebuchadrezzar king of Babylon, a king of kings, from the north, with horses, and with chariots, and with horsemen, and companies, and much people.","hl":1},{"v":8,"t":"He shall slay with the sword thy daughters in the field: and he shall make a fort against thee, and cast a mount against thee, and lift up the buckler against thee.","hl":1},{"v":9,"t":"And he shall set engines of war against thy walls, and with his axes he shall break down thy towers.","hl":1},{"v":10,"t":"By reason of the abundance of his horses their dust shall cover thee: thy walls shall shake at the noise of the horsemen, and of the wheels, and of the chariots, when he shall enter into thy gates, as men enter into a city wherein is made a breach.","hl":1},{"v":11,"t":"With the hoofs of his horses shall he tread down all thy streets: he shall slay thy people by the sword, and thy strong garrisons shall go down to the ground.","hl":1},{"v":12,"t":"And they shall make a spoil of thy riches, and make a prey of thy merchandise: and they shall break down thy walls, and destroy thy pleasant houses: and they shall lay thy stones and thy timber and thy dust in the midst of the water.","hl":1},{"v":13,"t":"And I will cause the noise of thy songs to cease; and the sound of thy harps shall be no more heard.","hl":1},{"v":14,"t":"And I will make thee like the top of a rock: thou shalt be a place to spread nets upon; thou shalt be built no more: for I the LORD have spoken it, saith the Lord GOD.","hl":1},{"v":15,"t":"Thus saith the Lord GOD to Tyrus; Shall not the isles shake at the sound of thy fall, when the wounded cry, when the slaughter is made in the midst of thee?"},{"v":16,"t":"Then all the princes of the sea shall come down from their thrones, and lay away their robes, and put off their broidered garments: they shall clothe themselves with trembling; they shall sit upon the ground, and shall tremble at every moment, and be astonished at thee."},{"v":17,"t":"And they shall take up a lamentation for thee, and say to thee, How art thou destroyed, that wast inhabited of seafaring men, the renowned city, which wast strong in the sea, she and her inhabitants, which cause their terror to be on all that haunt it!"}]},"Ezekiel 29:17-20":{"ref":"Ezekiel 29","cited":"17-20","verses":[{"v":14,"t":"And I will bring again the captivity of Egypt, and will cause them to return into the land of Pathros, into the land of their habitation; and they shall be there a base kingdom."},{"v":15,"t":"It shall be the basest of the kingdoms; neither shall it exalt itself any more above the nations: for I will diminish them, that they shall no more rule over the nations."},{"v":16,"t":"And it shall be no more the confidence of the house of Israel, which bringeth their iniquity to remembrance, when they shall look after them: but they shall know that I am the Lord GOD."},{"v":17,"t":"And it came to pass in the seven and twentieth year, in the first month, in the first day of the month, the word of the LORD came unto me, saying,", 1},{"v":14,"t":"And there was given him dominion, and glory, and a kingdom, that all people, nations, and languages, should serve him: his dominion is an everlasting dominion, which shall not pass away, and his kingdom that which shall not be destroyed.","hl":1},{"v":15,"t":"I Daniel was grieved in my spirit in the midst of my body, and the visions of my head troubled me."},{"v":16,"t":"I came near unto one of them that stood by, and asked him the truth of all this. So he told me, and made me know the interpretation of the things."},{"v":17,"t":"These great beasts, which are four, are four kings, which shall arise out of the earth."}]},"Daniel 9:24-27":{"ref":"Daniel 9","cited":"24-27","verses":[{"v":21,"t":"Yea, whiles I was speaking in prayer, even the man Gabriel, whom I had seen in the vision at the beginning, being caused to fly swiftly, touched me about the time of the evening oblation."},{"v":22,"t":"And he informed me, and talked with me, and said, O Daniel, I am now come forth to give thee skill and understanding."},{"v":23,"t":"At the beginning of thy supplications the commandment came forth, and I am come to shew thee; for thou art greatly beloved: therefore understand the matter, and consider the vision."},{"v":24,"t":"Seventy weeks are determined upon thy people and upon thy holy city, to finish the transgression, and to make an end of sins, and to make reconciliation for iniquity, and to bring in everlasting righteousness, and to seal up the vision and prophecy, and to anoint the most Holy.","hl":1},{"v":25,"t":"Know therefore and understand, that from the going forth of the commandment to restore and to build Jerusalem unto the Messiah the Prince shall be seven weeks, and threescore and two weeks: the street shall be built again, and the wall, even in troublous times.","hl":1},{"v":26,"t":"And after threescore and two weeks shall Messiah be cut off, but not for himself: and the people of the prince that shall come shall destroy the city and the sanctuary; and the end thereof shall be with a flood, and unto the end of the war desolations are determined.","hl":1},{"v":27,"t":"And he shall confirm the covenant with many for one week: and in the midst of the week he shall cause the sacrifice and the oblation to cease, and for the overspreading of abominations he shall make it desolate, even until the consummation, and that determined shall be poured upon the desolate.","hl":1}]},"Daniel 11:31-35":{"ref":"Daniel 11","cited":"31-35","verses":[{"v":28,"t":"Then shall he return into his land with great riches; and his heart shall be against the holy covenant; and he shall do exploits, and return to his own land."},{"v":29,"t":"At the time appointed he shall return, and come toward the south; but it shall not be as the former, or as the latter."},{"v":30,"t":"For the ships of Chittim shall come against him: therefore he shall be grieved, and return, and have indignation against the holy covenant: so shall he do; he shall even return, and have intelligence with them that forsake the holy covenant."},{"v":31,"t":"And arms shall stand on his part, and they shall pollute the sanctuary of strength, and shall take away the daily sacrifice, and they shall place the abomination that maketh desolate.","hl":1},{"v":32,"t":"And such as do wickedly against the covenant shall he corrupt by flatteries: but the people that do know their God shall be strong, and do exploits.","hl":1},{"v":33,"t":"And they that understand among the people shall instruct many: yet they shall fall by the sword, and by flame, by captivity, and by spoil, many days.","hl":1},{"v":34,"t":"Now when they shall fall, they shall be holpen with a little help: but many shall cleave to them with flatteries.","hl":1},{"v":35,"t":"And some of them of understanding shall fall, to try them, and to purge, and to make them white, even to the time of the end: because it is yet for a time appointed.","hl":1},{"v":36,"t":"And the king shall do according to his will; and he shall exalt himself, and magnify himself above every god, and shall speak marvellous things against the God of gods, and shall prosper till the indignation be accomplished: for that that is determined shall be done."},{"v":37,"t":"Neither shall he regard the God of his fathers, nor the desire of women, nor regard any god: for he shall magnify himself above all."},{"v":38,"t":"But in his estate shall he honour the God of forces: and a god whom his fathers knew not shall he honour with gold, and silver, and with precious stones, and pleasant things."}]},"Daniel 5:29-30":{"ref":"Daniel 5","cited":"29-30","verses":[{"v":26,"t":"This is the interpretation of the thing: MENE; God hath numbered thy kingdom, and finished it."},{"v":27,"t":"TEKEL; Thou art weighed in the balances, and art found wanting."},{"v":28,"t":"PERES; Thy kingdom is divided, and given to the Medes and Persians."},{"v":29,"t":"Then commanded Belshazzar, and they clothed Daniel with scarlet, and put a chain of gold about his neck, and made a proclamation concerning him, that he should be the third ruler in the kingdom.","hl":1},{"v":30,"t":"In that night was Belshazzar the king of the Chaldeans slain.","hl":1},{"v":31,"t":"And Darius the Median took the kingdom, being about threescore and two years old."}]},"Luke 24:25-27":{"ref":"Luke 24","cited":"25-27","verses":[{"v":22,"t":"Yea, and certain women also of our company made us astonished, which were early at the sepulchre;"},{"v":23,"t":"And when they found not his body, they came, saying, that they had also seen a vision of angels, which said that he was alive."},{"v":24,"t":"And certain of them which were with us went to the sepulchre, and found it even so as the women had said: but him they saw not."},{"v":25,"t":"Then he said unto them, O fools, and slow of heart to believe all that the prophets have spoken:","hl":1},{"v":26,"t":"Ought not Christ to have suffered these things, and to enter into his glory?","hl":1},{"v":27,"t":"And beginning at Moses 8","cited":"1-7","verses":[{"v":1,"t":"Then the LORD answered Job out of the whirlwind, and said,","hl":1},{"v":2,"t":"Who is this that darkeneth counsel by words without knowledge?","hl":1},{"v":3,"t":"Gird up now thy loins like a man; for I will demand of thee, and answer thou me.","hl":1},{"v":4,"t":"Where wast thou when I laid the foundations of the earth? declare, if thou hast understanding.","hl":1},{"v":5,"t":"Who hath laid the measures thereof, if thou knowest? or who hath stretched the line upon it?","hl":1},{"v":6,"t":"Whereupon are the foundations thereof fastened? or who laid the corner stone thereof;","hl":1},{"v":7,"t":"When the morning stars sang together, and all the sons of God shouted for joy?","hl":1},{"v":8,"t":"Or who shut up the sea with doors, when it brake forth, as if it had issued out of the womb?"},{"v":9,"t":"When I made the cloud the garment thereof, and thick darkness a swaddlingband for it,"},{"v":10,"t":"And brake up for it my decreed place, and set bars and doors,"}]},"Romans 8:18-25":{"ref":"Romans 8","cited":"18-25","verses":[{"v":15,"t":"For ye have not received the spirit of bondage again to fear; but ye have received the Spirit of adoption, whereby we cry, Abba, Father."},{"v":16,"t":"The Spirit itself beareth witness with our spirit, that we are the children of God:"},{"v":17,"t":"And if children, then heirs; heirs of God, and joint-heirs with Christ; if so be that we suffer with him, that we may be also glorified together."},{"v":18,"t":"For I reckon that the sufferings of this present time are not worthy to be compared with the glory which shall be revealed in us.","hl":1},{"v":19,"t":"For the earnest expectation of the creature waiteth for the manifestation of the sons of God.","hl":1},{"v":20,"t":"For the creature was made subject to vanity, not willingly, but by reason of him who hath subjected the same in hope,","hl":1},{"v":21,"t":"Because the creature itself also shall be delivered from the bondage of corruption into the glorious liberty of the children of God.","hl":1},{"v":22,"t":"For we know that the whole creation groaneth and travaileth in pain together until now.","hl":1},{"v":23,"t":"And not only they, but ourselves also, which have the firstfruits of the Spirit, even we ourselves groan within ourselves, waiting for the adoption, to wit, the redemption of our body.","hl":1},{"v":24,"t":"For we are saved by hope: but hope that is seen is not hope: for what a man seeth, why doth he yet hope for?","hl":1},{"v":25,"t":"But if we hope for that we see not, then do we with patience wait for it.","hl":1},{"v":26,"t":"Likewise the Spirit also helpeth our infirmities: for we know not what we should pray for as we ought: but the Spirit itself maketh intercession for us with groanings which cannot be uttered."},{"v":27,"t":"And he that searcheth the hearts knoweth what is the mind of the Spirit, because he maketh intercession for the saints according to the will of God."},{"v":28,"t":"And we know that all things work together for good to them that love God, to them who are the called according to his purpose."}]},"John 11:35":{"ref":"John 11","cited":"35","verses":[{"v":32,"t":"Then when Mary was come where Jesus was, and saw him, she fell down at his feet, saying unto him, Lord, if thou hadst been here, my brother had not died."},{"v":33,"t":"When Jesus therefore saw her weeping, and the Jews also weeping which came with her, he groaned in the spirit, and was troubled,"},{"v":34,"t":"And said, Where have ye laid him? They said unto him, Lord, come and see."},{"v":35,"t":"Jesus wept.","hl":1},{"v":36,"t":"Then said the Jews, Behold how he loved him!"},{"v":37,"t":"And some of them said, Could not this man, which opened the eyes of the blind, have caused that even this man should not have died?"},{"v":38,"t":"Jesus therefore again groaning in himself cometh to the grave. It was a cave, and a stone lay upon it."}]},"Revelation 21:4":{"ref":"Revelation 21","cited":"4","verses":[{"v":1,"t" ake unto thyself; and thou shalt eat the spoil of thine enemies, which the LORD thy God hath given thee."},{"v":15,"t":"Thus shalt thou do unto all the cities which are very far off from thee, which are not of the cities of these nations."},{"v":16,"t":"But of the cities of these people, which the LORD thy God doth give thee for an inheritance, thou shalt save alive nothing that breatheth:","hl":1},{"v":17,"t":"But thou shalt utterly destroy them; namely, the Hittites, and the Amorites, the Canaanites, and the Perizzites, the Hivites, and the Jebusites; as the LORD thy God hath commanded thee:","hl":1},{"v":18,"t":"That they teach you not to do after all their abominations, which they have done unto their gods; so should ye sin against the LORD your God.","hl":1},{"v":19,"t":"When thou shalt besiege a city a long time, in making war against it to take it, thou shalt not destroy the trees thereof by forcing an axe against them: for thou mayest eat of them, and thou shalt not cut them down (for the tree of the field is man's life) to employ them in the siege:"},{"v":20,"t":"Only the trees which thou knowest that they be not trees for meat, thou shalt destroy and cut them down; and thou shalt build bulwarks against the city that maketh war with thee, until it be subdued."}]},"Genesis 15:16":{"ref":"Genesis 15","cited":"16","verses":[{"v":13,"t":"And he said unto Abram, Know of a surety that thy seed shall be a stranger in a land that is not theirs, and shall serve them; and they shall afflict them four hundred years;"},{"v":14,"t":"And also that nation, whom they shall serve, will I judge: and afterward shall they come out with great substance."},{"v":15,"t":"And thou shalt go to thy fathers in peace; thou shalt be buried in a good old age."},{"v":16,"t":"But in the fourth generation they shall come hither again: for the iniquity of the Amorites is not yet full.","hl":1},{"v":17,"t":"And it came to pass, that, when the sun went down, and it was dark, behold a smoking f  a place which he should after receive for an inheritance, obeyed; and he went out, not knowing whither he went."},{"v":9,"t":"By faith he sojourned in the land of promise, as in a strange country, dwelling in tabernacles with Isaac and Jacob, the heirs with him of the same promise:"}]},"1 Peter 3:15-16":{"ref":"1 Peter 3","cited":"15-16","verses":[{"v":12,"t":"For the eyes of the Lord are over the righteous, and his ears are open unto their prayers: but the face of the Lord is against them that do evil."},{"v":13,"t":"And who is he that will harm you, if ye be followers of that which is good?"},{"v":14,"t":"But and if ye suffer for righteousness' sake, happy are ye: and be not afraid of their terror, neither be troubled;"},{"v":15,"t":"But sanctify the Lord God in your hearts: and be ready always to give an answer to every man that asketh you a reason of the hope that is in you with meekness and fear:","hl":1},{"v":16,"t":"Having a good conscience; that, whereas they speak evil of you, as of evildoers, they may be ashamed that falsely accuse your good conversation in Christ.","hl":1},{"v":17,"t":"For it is better, if the will of God be so, that ye suffer for well doing, than for evil doing."},{"v":18,"t":"For Christ also hath once suffered for sins, the just for the unjust, that he might bring us to God, being put to death in the flesh, but quickened by the Spirit:"},{"v":19,"t":"By which also he went and preached unto the spirits in prison;"}]},"Colossians 4:6":{"ref":"Colossians 4","cited":"6","verses":[{"v":3,"t":"Withal praying also for us, that God would open unto us a door of utterance, to speak the mystery of Christ, for which I am also in bonds:"},{"v":4,"t":"That I may make it manifest, as I ought to speak."},{"v":5,"t":"Walk in wisdom toward them that are without, redeeming the time."},{"v":6,"t":"Let your speech be alway with grace, seasoned with salt, that ye may know how ye ought to answer every man.","hl":1},{"v":7,"t":"All my state shall Tychicus dec e rose from the dead, how say some among you that there is no resurrection of the dead?"},{"v":13,"t":"But if there be no resurrection of the dead, then is Christ not risen:"},{"v":14,"t":"And if Christ be not risen, then is our preaching vain, and your faith is also vain.","hl":1},{"v":15,"t":"Yea, and we are found false witnesses of God; because we have testified of God that he raised up Christ: whom he raised not up, if so be that the dead rise not.","hl":1},{"v":16,"t":"For if the dead rise not, then is not Christ raised:","hl":1},{"v":17,"t":"And if Christ be not raised, your faith is vain; ye are yet in your sins.","hl":1},{"v":18,"t":"Then they also which are fallen asleep in Christ are perished.","hl":1},{"v":19,"t":"If in this life only we have hope in Christ, we are of all men most miserable.","hl":1},{"v":20,"t":"But now is Christ risen from the dead, and become the firstfruits of them that slept."},{"v":21,"t":"For since by man came death, by man came also the resurrection of the dead."},{"v":22,"t":"For as in Adam all die, even so in Christ shall all be made alive."}]},"2 Corinthians 11:23-28":{"ref":"2 Corinthians 11","cited":"23-28","verses":[{"v":20,"t":"For ye suffer, if a man bring you into bondage, if a man devour you, if a man take of you, if a man exalt himself, if a man smite you on the face."},{"v":21,"t":"I speak as concerning reproach, as though we had been weak. Howbeit whereinsoever any is bold, (I speak foolishly,) I am bold also."},{"v":22,"t":"Are they Hebrews? so am I. Are they Israelites? so am I. Are they the seed of Abraham? so am I."},{"v":23,"t":"Are they ministers of Christ? (I speak as a fool) I am more; in labours more abundant, in stripes above measure, in prisons more frequent, in deaths oft.","hl":1},{"v":24,"t":"Of the Jews five times received I forty stripes save one.","hl":1},{"v":25,"t":"Thrice was I beaten with rods, once was I stoned, thrice I suffered shipwreck, a night and a day I have been in the deep;","hl":1},{"v"
