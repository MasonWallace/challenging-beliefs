}
function ROLENOTE(side){return side==="quran"?"<b>Role:</b> this is the passage the argument refers to.":"<b>Role:</b> this is the biblical standard the claim measures against.";}
const DEFLABEL="The strongest reply from the other side — put at its best";
const VDESC={"admitted":"Skeptical scholars grant this themselves. Argue it from their sources, not yours.","unrefuted":"No good counter-argument has been published by atheist philosophers.","contested":"Serious philosophers argue this both ways. Say so before your friend does.","answered":"This Christian argument does not hold up. Drop it."};
function plainHtml(d){
  const rt=t=>glossify(emphasize(esc(t).replace(/&lt;(\/?)(b|i)&gt;/g,"<$1$2>")));
  const KINDRE=t=>(/answer,? at full strength|^their answer|^the .{2,22} answer\b|^how (they|.*s) (answer|explain)|best (defense|answer)|at its strongest|^the (rabbinic|muslim|witness|sceptic|skeptic) (reply|answer)/.test(t)?"k-def"
      :/^how strong|^the rule\b|^where it lands|^the verdict|don't use|do not use/.test(t)?"k-strength"
      :/^why this|^why it|helps you|^what it cost|^what to do instead|^what to say instead|^the takeaway|^why that matters/.test(t)?"k-help"
      :/runs out|problem|^why that is|^where it breaks|^what that misses|^the gap|^why it is wrong|^the trouble|^what it does not/.test(t)?"k-gap"
      :/verse|text|chapter|\bsays\b|passage|record|scripture|evidence|the numbers|what survives|the hadith|manuscript|papyri|inscription/.test(t)?"k-text"
      :/^the claim|^what is taught|^what (they|the book|the movement|the church|the camps) |^what happened|^how it (usually|ended|came out)|objection|^what (you|your|people)|describes|^the story|^what is at stake/.test(t)?"k-claim"
      :"k-plain");
  const KINDOF=b=>{
    if(b.say)return "k-say";
    const t=b.t.toLowerCase();
    return KINDRE(t);
  };
  /* One fixed sequence for every case, so the colours mean the same thing on
     every page and a reader learns the shape once. "What to say" is last in all
     318 cases and always anchors the run in green. */
  const SEQ=["amber","gold","red","purp","teal","slate"];
  const blocks=(d.plain||[]);
  const kinds=blocks.map(KINDOF);
  let si=0;
  const hues=blocks.map(b=>b.say?"green":SEQ[si++%SEQ.length]);
  return blocks.map((b,bi)=>{
    const ss=splitSentences(b.d),ps=[];
    for(let i=0;i<ss.length;i+=2)ps.push("<p>"+rt(ss.slice(i,i+2).join(" "))+"</p>");
    const kind=kinds[bi], hue="h-"+hues[bi];
    const big=/(k-text|k-say)/.test(kind)?" k-big":"";
    return `<div class="pblk ${kind} ${hue}${b.say?" say":""}${big}"><div class="plab ${hue}">${esc(b.t)}</div>${ps.join("")}</div>`;
  }).join("");
}

function renderTimeline(){
  const read=store.read;
  $("#main").innerHTML=`<div class="viewhead"><h2>${"The record, in "+["no","one","two","three","four","five","six"][Math.min(6,TLACTS.length)]+" act"+(TLACTS.length===1?"":"s")}</h2>
  <p>Claims and challenges on the left; what the ground and the manuscripts gave up on the right. Red years mark the turning points. Click an act to open it — your reading progress fills each meter.</p></div>
  <div class="chs">${TLACTS.map((a,i)=>{
    const linked=a.events.filter(e=>e.id);
    const done=linked.filter(e=>read.has(e.id)).length;
    return `<button class="ch ${state.act===i?"on":""}" data-act="${i}"><span class="n">${a.num}</span><span class="range">${a.range}</span><h4>${a.name}</h4><p>${a.desc} · ${a.events.length} events</p><div class="meter"><i style="width:${linked.length?Math.round(done/linked.length*100):0}%"></i></div></button>`;
  }).join("")}</div>
  ${state.act!=null&&TLACTS[state.act]?actHtml(TLACTS[state.act]):`<p class="tlhint">Select an act to open its record.</p>`}`;
  function actHtml(a){
    return `<div class="chopen"><h4>Act ${a.num} · ${a.name} (${a.range})</h4>
    <div class="cvr"><div class="hh claims">What was claimed</div><div></div><div class="hh record">What the record shows</div>
    ${a.events.map(e=>{
      const bubble=`<div class="bubble ${e.side==="claim"?"claim":"rec"}${e.crit?" crit":""}${e.id&&store.read.has(e.id)?" done":""}">${e.id&&IMGMAP[e.id]?`<img class="ebthumb" src="${IMGMAP[e.id].src}" loading="lazy">`:""}${e.crit?`<span class="tpx">★ turning point</span>`:""}${e.id&&store.read.has(e.id)?`<span class="donechip">✓ read</span>`:""}<h4>${esc(e.t)}</h4><p>${esc(e.p)} ${e.id&&byId[e.id]?`<button class="jump" data-open="${e.id}">→ open the case</button>`:""}</p></div>`;
      return `<div class="cell">${e.side==="claim"?bubble:""}</div><div class="mid"><div class="yr2 ${e.crit?"critY":""}">${e.y}</div></div><div class="cell">${e.side==="record"?bubble:""}</div>`;
    }).join("")}</div></div>`;
  }
  document.querySelectorAll(".ch").forEach(b=>b.addEventListener("click",()=>{const i=+b.dataset.act;state.act=state.act===i?null:i;renderTimeline();}));
  document.querySelectorAll(".jump").forEach(b=>b.addEventListener("click",()=>openCase(b.dataset.open)));
}

function renderGlossary(){
  $("#main").innerHTML=`<div class="viewhead"><h2>Word guide</h2><p>${GLOSSARY.length} terms this subject runs on, in plain English — names, books, sources and technical vocabulary. Every one of them is underlined with a dotted line wherever it appears in a case; hover or tap it there for the definition without leaving the page.</p></div><details class="primer" open><summary>New here? How this section works</summary><div class="primerbody"><p><b>This section runs in the opposite direction from the rest of the site.</b> Nothing here is argued from biblical authority to someone who does not hold it. Instead the case is built from sources that do not want the conclusion — skeptical historians, atheist philosophers, and the manuscript and archaeological record.</p>
    <p><b>The first thing to get right is who you are talking to.</b> The <i>philosophical atheist</i> is rare, has genuine reasons, reads Graham Oppy and Sean Carroll, and enjoys a well-conducted argument. The <i>apathetic none</i> is the large majority, is not looking for an argument at all, and is reachable mostly through relationship. The <i>deconvert</i> was a Christian, has already heard your best material — usually from people they loved — and often carries a real injury from the church. Aiming the wrong conversation at the wrong person is the most common way this fails.</p>
    <p><b>The realistic goal is one notch, not the whole distance:</b> from "obviously false" to "actually worth thinking about." The arguments here are cumulative rather than knockdown — contingency, fine-tuning, moral facts, the reliability of reason — and each has a serious reply, which is printed alongside it.</p>
    <p>A third of this section is marked <b>Contested</b> on purpose, and five entries are arguments to <b>retire</b>. Overclaiming is how these conversations are lost. Terms in dotted underline can be hovered anywhere for a definition.</p></div></details>
  <div class="gaccord">${GLOSSARY.map(g=>`<div class="gitem"><b>${esc(g.t)}</b><p>${g.d}</p></div>`).join("")}</div>`;
}

/* ---------- the heart of it ---------- */
function renderCore(){
  const link=id=>byId[id]?`<button class="corelink" data-open="${id}">${esc(byId[id].title)} →</button>`:"";
  $("#main").innerHTML=`<div class="viewhead"><h2>The heart of it: one claim you can actually check</h2>
  <p>If you read nothing else on this section, read this page. Christianity is unusual among religions in staking itself on a public, datable event that could in principle be disproved — and its own founding document says so first.</p></div><figure class="corehero"><img src="https://commons.wikimedia.org/wiki/Special:FilePath/Hubble%20ultra%20deep%20field%20high%20rez%20edit1.jpg?width=900" loading="lazy" alt=""><figcaption>The Hubble Ultra Deep Field. Every smudge is a galaxy — and the constants that allow any of it are the fine-tuning argument.</figcaption></figure>
  <div class="corebox"><h3>0 · Work out who is in front of you</h3>
  <p>There are three completely different conversations here. The <b>philosophical atheist</b> is rare, has genuine reasons, reads Oppy and Carroll, and will enjoy an argument conducted well. The <b>apathetic none</b> — the large majority — is not looking for an argument at all and is reachable almost entirely through relationship. The <b>deconvert</b> has already heard your best material, usually from people they loved, and often carries a real injury from the church.</p>
  <p>Deploying a philosophy-seminar case on someone in the third group is the single most common way this goes wrong. Ask first: <i>“what made you land where you are?”</i> — and then listen long enough to actually find out.</p>
  <details class="srcdet"><summary>Open the cases behind this</summary><div class="corelinks" style="margin-top:12px">${link("dontuse-atheist-mind-reading")}${link("objection-divine-hiddenness")}</div></details></div>

  <div class="corebox"><h3>1 · Aim lower than proof</h3>
  <p>No argument on this page proves Christianity, and pretending otherwise is why skeptics stop listening. The realistic target is one notch: from <i>“obviously false”</i> to <i>“that's actually worth thinking about.”</i> That move is achievable in a single conversation, and it is the move that matters.</p>
  <p>The arguments that do it best are cumulative, not knockdown: something rather than nothing (contingency); constants that sit in an absurdly narrow window; moral facts that feel discovered rather than invented; and the oddity of trusting a reasoning faculty built entirely by processes indifferent to truth. Each has a serious reply. Together they shift a prior — which is all evidence ever does.</p>
  <details class="srcdet"><summary>Open the cases behind this</summary><div class="corelinks" style="margin-top:12px">${link("existence-kalam-contingency")}${link("existence-fine-tuning")}${link("existence-moral-argument")}</div></details></div>

  <div class="corebox"><h3>2 · The one falsifiable claim</h3>
  <p>Paul stakes the entire religion on a historical event and says plainly that if it did not happen, the faith is worthless and Christians are to be pitied. That is a remarkable thing for a religion to build into its own foundation documents, and it means the conversation can be had with history rather than authority.</p>
  <p>Start where a skeptical historian already is. The large majority of scholars — including agnostics and atheists — grant that Jesus was crucified under Pilate; that his followers had experiences they took to be appearances of the risen Jesus; that <b>Paul</b>, an active persecutor, changed sides after such an experience; that <b>James</b>, a skeptical brother, did too; and that the proclamation began immediately in the city where it could most easily have been refuted.</p>
  <p>Then the dating problem for legend theories: the creed in 1 Corinthians 15 is a fixed formula Paul says he <i>received</i>, and most scholars — again including skeptics — put it within about five years of the crucifixion. Legends take generations. This did not.</p>
  <details class="srcdet"><summary>Open the cases behind this</summary><div class="corelinks" style="margin-top:12px">${link("resurrection-minimal-facts")}${link("resurrection-early-creed")}${link("resurrection-hallucination-hypotheses")}</div></details></div>

  <div class="corebox"><h3>3 · Concede the numbers, and win the argument</h3>
  <p>There are somewhere around 400,000 textual variants in the New Testament manuscript tradition. Say that first, out loud, before anyone asks. Then say what they are: spelling, word order, and a small number of passages — the longer ending of Mark, the woman caught in adultery — that every modern Bible already footnotes. No Christian doctrine rests on a disputed reading.</p>
  <p>The reason the number is large is the reason the text is secure: there are far more manuscripts than for any other ancient work, and more copies means more countable differences. And the Dead Sea Scrolls ran the same test on the Hebrew Bible across a thousand-year gap — and it passed.</p>
  <details class="srcdet"><summary>Open the cases behind this</summary><div class="corelinks" style="margin-top:12px">${link("manuscripts-nt-text")}${link("manuscripts-dead-sea-scrolls")}${link("manuscripts-canon-formation")}</div></details></div>

  <div class="corebox"><h3>4 · Do not flinch at the hard ones</h3>
  <p>The evidential problem of evil and Schellenberg's hiddenness argument are the two strongest arguments in contemporary atheist philosophy, and neither has a tidy answer. The Canaanite conquest passages are genuinely difficult, and the options for reading them all cost something. Say all of that plainly.</p>
  <p class="pullq">"That's the strongest argument against what I believe, and I don't think it has a tidy answer."</p>
  <p>That sentence buys more credibility than any rebuttal, and it is also simply honest. Then give the real response, with its limits named — and on suffering, remember that the argument in front of you is very often a wound wearing a syllogism. Ask what happened to them before you answer what they said.</p>
  <details class="srcdet"><summary>Open the cases behind this</summary><div class="corelinks" style="margin-top:12px">${link("objection-problem-of-evil")}${link("objection-divine-hiddenness")}${link("objection-canaanite-conquest")}</div></details></div>

  <div class="corebox"><h3>5 · Then stop arguing and offer a person</h3>
  <p>Nobody has ever been argued into the kingdom, and the evidence only clears ground. When it is cleared, the offer is not a proposition but a person — the one whose crucifixion even the atheist historians grant, and whose followers went to their deaths saying they had seen him afterwards.</p>
  <p>Ask the question that actually opens things: <i>“If it were true, would you want it to be?”</i> The answer tells you whether you are dealing with an argument or a grief, and those need very different things from you.</p>
  <p><button class="corelink" data-goto="share">How to actually have this conversation →</button></p></div>`;
  $("#main").querySelectorAll(".corelink").forEach(b=>{if(b.dataset.open)b.addEventListener("click",()=>openCase(b.dataset.open));});
  const g=$("#main").querySelector("[data-goto]");
  if(g)g.addEventListener("click",()=>{state.view="share";render();});
}
function renderShare(){
  $("#main").innerHTML=`<div class="viewhead"><h2>Sharing Jesus with a skeptic</h2>
  <p>The debate is almost never the real thing in the room. This is about being the Christian who is honest about what is hard, who does not use arguments they have not checked, and who is still there next year.</p></div>
<div class="pb-h">Work out which one you are talking to</div>
<div class="saybox"><span class="who">You, early on</span><p>"What made you land where you are? I would rather hear how you got there than argue about the arguments."</p></div>
<p>There is no generic atheist. There are at least three, and they need three different conversations. Get this wrong and everything else you say is aimed at nobody.</p>
<p>The first was in church and got hurt. A cover-up. A father who preached it and did not live it. A prayer that went unanswered at the worst possible moment. This person already knows the arguments and is not moved by them. Ask what happened, then be quiet for a long time.</p>
<p>The second reasoned their way out. Evidence, philosophy, science. They have usually read more on their own side than you have. They deserve real sources and real arguments, not a summary of a summary.</p>
<p>The third never thought about it at all. No wound and no argument. Religion has simply never been a live option. Debate bounces off, because there is nothing yet to debate. What moves this person is a real question, a real friendship, and a life that visibly costs something.</p>
<p>One rule covers all three. Never treat <i>I do not believe</i> as a bluff. It is not a pose, a rebellion, or a hidden belief being suppressed. Take it at face value. If you cannot, you are not in a conversation. You are running a script.</p>
<p>Work out which one you have before you decide what to bring. The wrong opening is not neutral. It tells the person you were not listening.</p>
<p>Most conversations also move between the three. A question about physics can be a grief wearing a coat, and a grief can harden into a syllogism over time.</p>
<p>So keep checking. The person you started talking to in March may not be the one in front of you in June.</p>

<div class="pb-h">The invitation to work toward</div>
<div class="saybox"><span class="who">You, in time</span><p>"Would you read one Gospel with me? Luke, or Mark. Then just tell me what you actually think of him."</p></div>
<p>Most skeptics have opinions about Christianity and have never read a Gospel straight through as an adult.</p>
<p>The offer is unusual because it asks for their judgment rather than their agreement. It also puts the person in front of them instead of the argument.</p>
<p>Aim one notch, not the whole distance. Moving someone from obviously false to worth thinking about is a real win for one evening.</p>
<p>Say out loud that a single evening is not going to settle it. That removes the pressure which makes people defend positions they do not really hold.</p>
<p>Then keep your word. Ask again in a month, not in an hour.</p>
<p>Trying to close the whole gap at once produces someone who now has a reason to avoid the subject with you.</p>

<div class="pb-h">What actually reaches a skeptic</div><div class="pb-grid">
<div class="pb"><span class="num">1</span><h4>Conceding what is genuinely hard, first</h4><p>Evil. Divine hiddenness. The conquest passages. The census of Quirinius. Name these before you are pushed. A person who admits a difficulty is worth hearing on everything else. A person with an instant answer for everything is worth hearing on nothing.</p></div>
<div class="pb"><span class="num">2</span><h4>Arguing from sources that want another answer</h4><p>Bart Ehrman on the crucifixion. Gerd Lüdemann on what the disciples experienced. The early dating of the creed in 1 Corinthians 15. The Tel Dan Stele. All of it comes from outside the church, and that is why it travels.</p></div>
<div class="pb"><span class="num">3</span><h4>Asking what happened to them</h4><p>Behind a large share of atheism is a story rather than an argument. The syllogism is real and deserves an answer. It is usually not the thing that needs answering first. Ask, and then wait longer than feels comfortable.</p></div>
<div class="pb"><span class="num">4</span><h4>Being unembarrassing</h4><p>The fastest way to lose this is a bad argument delivered with confidence. Retire the banana. Retire the thermodynamics claim. Retire the line about no transitional fossils. Retire the Darwin deathbed legend. Dropping them costs you nothing.</p></div>
</div>

<div class="pb-h">The method</div><div class="pb-grid">
<div class="pb do"><h4>Say you do not know, when you do not</h4><p>Then go and find out, and come back with it. This is the most credibility-building thing available in these conversations. It is available to anyone, whatever they have read.</p></div>
<div class="pb do"><h4>Know their best arguments better than they do</h4><p>Read Graham Oppy rather than a Christian summary of Oppy. Watch Sean Carroll debate William Lane Craig. If you cannot state the argument accurately before answering it, you are not ready to answer it.</p></div>
<div class="pb do"><h4>Take the hiddenness argument seriously</h4><p>Schellenberg on divine hiddenness and the evidential problem of evil are the two strongest arguments in living atheist philosophy. Neither has a tidy answer. Say so, give the real response, and name its limits.</p></div>
<div class="pb dont"><h4>Never tell them what they secretly believe</h4><p>You know God exists and are suppressing it. You just want to sin. Atheism takes more faith. Each line tells your friend you are talking to a stereotype instead of to them. Each one ends the conversation while sounding, to you, like a point scored.</p></div>
<div class="pb dont"><h4>Not the wager as an opener</h4><p>Pascal never built it as an opener. It speaks to someone already persuaded that the odds are not trivial. Led with, it sounds like an invitation to fake a belief for insurance. That is bad philosophy and worse theology.</p></div>
<div class="pb dont"><h4>Not evolution as the battlefield</h4><p>Christianity is not committed to a six-thousand-year-old earth, and large parts of the church never thought it was. Fight there and the actual claim never gets discussed. The claim is a man executed under Pilate and seen alive afterwards.</p></div>
</div>

<div class="pb-h">The sentence that buys the most credit</div>
<div class="saybox"><span class="who">You, honestly</span><p>"That is the strongest argument against what I believe, and I do not think it has a tidy answer."</p></div>
<p>Say that when it is true, and it will often be true.</p>
<p>It buys more credibility than any rebuttal, and it costs nothing you should want. The Canaanite passages are hard. Unanswered prayer in a hospital is hard.</p>
<p>Then give the real response, with its limits named. On suffering, remember that the argument in front of you may be standing in for a funeral you have not heard about yet.</p>
<p>And when the ground is cleared, stop arguing. Nobody has ever been argued into the kingdom. The evidence only clears space for a person.</p>
<p>The census of Quirinius is a genuine historical problem. The honest answer lays out the options and admits that none of them is clean.</p>
<p>The conquest passages are worse, and no short reply does them justice. Do not reach for one.</p>
<p>What you are offering in the end is not a proposition. It is the man whose execution under Pilate even your friend already accepts as history.</p>
<p>Notice also what you are not asked to do. You are not asked to defend every Christian, every church, or every bad argument you have ever heard made.</p>
<p>Say that plainly when it comes up. A lot of what your friend rejected is worth rejecting, and agreeing with them costs you nothing.</p>
<p>The one claim you cannot give away is the empty tomb. Everything else can be held loosely while you work out together what is actually being argued.</p>
<p>And if the conversation dies, leave the door open rather than the last word. You are trying to be there in five years, not to finish tonight.</p>

<div class="pb-h">How it actually goes</div>
<p class="sh-open">"One of the most certain facts of history is that Jesus was crucified on orders of the Roman prefect."</p>
<p class="sh-att">— Bart Ehrman, agnostic, and the most-read skeptical New Testament scholar alive</p>

<div class="sa"><h4 class="sat">The five questions that do the most work</h4>
<ol class="sh-list">
<li><b>"What made you land where you are?"</b> Ask it first, every time, and listen to the whole answer without preparing a reply. It tells you which of the three conversations you are actually in. Nothing you say before you know that is aimed at anything.</li>
<li><b>"Do you think Jesus existed and was crucified?"</b> Almost every informed skeptic says yes, and Ehrman says it in print. Start on shared ground and move one step at a time. That is the only version of this argument that has ever worked on anybody.</li>
<li><b>"What would it take to change your mind?"</b> It is a fair question because you have to answer it about yourself too. Paul already did, in 1 Corinthians 15:17. If neither of you can answer it, you are not arguing. You are in a standoff with better manners.</li>
<li><b>"If it were true, would you want it to be?"</b> This is the most revealing question here. The answer separates an intellectual obstacle from a grief or an injury. Those two need completely different things from you, and mixing them up wastes years.</li>
<li><b>"Can I tell you the part I cannot explain away?"</b> Then tell them why you are still in this, in your own words, briefly. Testimony is not proof and should not be offered as proof. It is evidence that a real person finds it worth staking a life on.</li>
</ol></div>

<div class="sa"><h4 class="sat">Start here</h4>
<p class="pd">Read Arguments to retire before anything else. It is the highest-return page on the site. Then take the Easter path, which covers what skeptical historians grant about AD 30 and what explains it. Every case ends with a scripted back-and-forth, with the strongest naturalistic reply included.</p>
<button class="start" data-goto-path="easter">Open the Easter path →</button></div>${DATA.some(d=>d.avoid)?`<div class="pb-h" style="margin-top:30px">Arguments that will embarrass you — do not use these</div><p class="pd" style="font-size:.8rem;margin:0 0 10px">Popular claims that are false or overclaimed. Each links to the correction — repeating them hands the other side an easy win and discredits your true arguments.</p><div class="relrow">${DATA.filter(d=>d.avoid).map(d=>`<button data-open="${d.id}">⚠ ${esc(d.title)}</button>`).join("")}</div>`:""}`;
  const b=$("#main").querySelector("[data-goto-path]");
  if(b)b.addEventListener("click",()=>{const p=PATHS.find(x=>x.id===b.dataset.gotoPath);if(!p)return;state.pathId=p.id;const read=store.read;const next=p.items.find(i=>!read.has(i))||p.items[0];openCase(next,true);});
  bindOpens();
}

const PROOFS=[{"v":"1 Samuel 15:2-3","they":"'Kill man, woman, child and infant.' Your God commands genocide. Full stop. How is this different from any war-god tribes have always invented to bless their conquests?","you":"Don't soften it first — read it with them and let it be as hard as it is. Then the context that's true: the command follows four centuries of stated delay 'for the sin of the Amorites is not yet complete' (Gen 15:16) — judgment, not ethnic hatred; the 'utterly destroy' formula is standard ancient Near Eastern war rhetoric (Egyptian and Moabite kings claim total annihilation of peoples who show up alive next chapter — and so do Amalekites, in 1 Sam 27 and 30); and Israel gets the identical sentence threatened on itself (Lev 18:28). Many scholars read hyperbolic idiom for decisive defeat. Then the honesty: some Christians accept that reading, some don't, and this remains a genuinely hard text. One more thing, said gently — the moral outrage they feel at slaughtered infants assumes every human life has non-negotiable worth. That conviction has a source, and it isn't blind selection.","refs":"Genesis 15:16 · 1 Samuel 27:8; 30:1 · Leviticus 18:24-28 · Deuteronomy 20:10-18 · Matthew 5:43-45"},{"v":"Psalm 137:9","they":"'Blessed is the one who seizes your infants and dashes them against the rocks.' It's in your hymnbook. Sung. How do you worship with that on the page?","you":"Name what the psalm is: the scream of exiles who had just watched Babylon do exactly that to THEIR children — verse 8 says it plainly: 'repay you what you have done to us.' It is trauma praying, not policy; description of a shattered heart, not prescription for anyone's hands. The astonishing thing isn't that ancient victims felt this — every victim does — it's that Scripture keeps the scream IN, insisting God would rather hear rage prayed at him than acted out or hidden. Vengeance is handed up, not taken (Rom 12:19). And the story bends: the man from this same book absorbs violence on a cross rather than returning it. A sanitized Bible would be a dishonest one; this page is why abuse survivors keep finding the Psalms readable.","refs":"Psalm 137:1-9 · Lamentations 2:11 · Romans 12:19 · Matthew 5:44"},{"v":"Judges 11:30-39","they":"Jephthah sacrifices his own daughter to keep a vow to your God — and he's listed as a hero of faith in Hebrews 11. Explain that.","you":"First concession: the natural reading is that he killed her, and it should horrify — the narrator agrees. Judges REPORTS this without one word of divine approval; God neither asked for the vow nor answered it. The whole book is a documented spiral into moral madness with a refrain as its thesis: 'everyone did what was right in his own eyes' (21:25). Torah had already banned human sacrifice in the strongest terms (Deut 12:31) — Jephthah broke the law he claimed to honor, which is the point: this is what Israel becomes without its King. (Some argue vv. 37-39 describe perpetual virginity, not death — possible, contested; say so and don't lean on it.) Hebrews 11 credits one act of battlefield trust, in a list that also includes a prostitute and a murderer — it's a catalog of grace toward wrecks, not endorsements of resumes. Judges is an indictment. Reading it as instruction is the one error the book itself forbids.","refs":"Judges 11:29-40 · Judges 21:25 · Deuteronomy 12:31 · Hebrews 11:32"},{"v":"Exodus 21:20-21","they":"Your Bible regulates beating slaves — 'if the slave survives a day or two, the owner is not punished, for the slave is his property.' It never says slavery is wrong. Abolition came from Enlightenment humanists dragging the church along.","you":"Concede first and fully: these laws regulate debt-servitude in an Iron Age economy, verse 21 is genuinely hard, and Exodus is not an abolitionist tract — pretending otherwise costs you the conversation and deserves to. Then the real texture: in the same chapter, kidnapping a person for sale is a capital crime (21:16 — the verse that condemns the entire Atlantic trade, which is why 1 Tim 1:10 lists 'enslavers' with murderers); Deuteronomy 23:15-16 forbids returning escaped slaves — unique in the ancient world, and the exact opposite of the Fugitive Slave Act. The trajectory runs through Philemon ('no longer a slave — a beloved brother') to abolition itself, which was driven overwhelmingly by Christians — Wilberforce, the Quakers, Douglass — arguing from the image of God. And own the failure: Christians also quoted these verses to defend chattel slavery, and they were wrong. The Bible's own trajectory is what proved them wrong.","refs":"Exodus 21:16 · Deuteronomy 23:15-16 · Philemon 15-16 · 1 Timothy 1:10 · Genesis 1:27"},{"v":"Matthew 27:52-53","they":"Dead saints climb out of their graves and stroll into Jerusalem, 'appearing to many' — and not one historian, not even the other gospels, mentions zombie day? That silence tells you what these books are.","you":"Give the straight answer: there is no outside corroboration for this passage, and Christians genuinely divide over it. Some take it as a literal, local sign; others — notably evangelical scholar Michael Licona — read it as apocalyptic imagery, a standard Jewish way of saying 'this death cracked the reign of death open.' Licona took serious professional fire for saying so in 2011, which is worth admitting too: Christians sometimes punish their own for honesty, and skeptics notice. The load-bearing point: the case for the resurrection was never built on these two verses. It's built on the creed in 1 Corinthians 15 — decades earlier than Matthew, naming checkable witnesses — and on facts critics like Ehrman and Lüdemann concede. A difficult verse in Matthew doesn't unwrite an early creed. Let this passage be exactly as strange as it is.","refs":"Matthew 27:52-53 · 1 Corinthians 15:3-8 · Matthew 27:45,51 (apocalyptic signs cluster)"},{"v":"Mark 16:9-20; John 7:53-8:11","they":"Your own Bible admits the ending of Mark and the woman-caught-in-adultery story were ADDED later. If scribes slipped whole passages in, how do you know what else is fake?","you":"Lean in — this objection is secretly your best evidence. Yes: the earliest manuscripts lack both passages, scholars across the spectrum agree they're later additions, and your Bible TOLD you so, in brackets, in the footnotes. Ask the question hiding in that: how do we KNOW? Because we have thousands of Greek manuscripts to compare — enough data that additions stick out like a raised seam. A tradition run by cover-up artists doesn't print its own corrections in the margins of every pew Bible on earth. That's the difference between a guarded text and a transparent one: we can see the seams precisely because nothing is hidden. And the accounting matters: across all ~5,800 manuscripts these two passages are the LARGEST variants that exist; no doctrine — none — rests on either. The scribes' fingerprints prove the rest of the page is clean enough to check.","refs":"Mark 16:9-20 (bracketed in modern translations) · John 7:53-8:11 (bracketed) · Luke 1:1-4"}];

function renderProofs(){
  $("#main").innerHTML=`<div class="viewhead"><h2>When they quote YOUR Bible</h2>
  <p>The verses a skeptical friend will bring to you, and the two-minute responses — context first, then the question that reopens the conversation. Read the passage together whenever you can; the text itself does most of the work.</p></div>`+
  PROOFS.map(p=>`<div class="ptcard"><h3 class="ptv">${p.v}</h3>
    <div class="who them">They may say</div><p class="pt">${p.they}</p>
    <div class="who you">You respond</div><p class="pt">${rich(p.you)}</p>
    <div class="refs">Read together: ${p.refs}</div></div>`).join("");
}
