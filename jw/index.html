verything the channel transmitted.","severity":"high","plain":[{"t":"The first claim: speak as God speaks","d":"The Watchtower of Apr 1, 1972 (p. 197) said Jehovah had a prophet to warn people. That prophet was not one man. It was <b>\"a body of men and women... known today as Jehovah's Christian witnesses.\"</b> The Watchtower of Jun 15, 1957 (p. 370) told members to respond to the slave's directions <b>\"as we would to the voice of God.\"</b> Members must obey instructions <b>\"whether these appear sound from a strategic or human standpoint or not\"</b> (The Watchtower, Nov 15, 2013, p. 20)."},{"t":"The second claim: we never claimed that","d":"When predictions fail, the claim reverses. <b>\"The Governing Body is neither inspired nor infallible\"</b> (The Watchtower, Feb 2017 study edition, p. 26). The Watchtower of May 1, 1972 said Jehovah's Witnesses do not claim any divine inspiration. Awake! of Mar 22, 1993 (pp. 3-4 and its footnote) said they never spoke in the name of Jehovah."},{"t":"Their answer, at full strength","d":"A channel need not be inspired. Israel's priests taught God's law with authority and received no new revelation. The Society says it administers and teaches a Bible that is already complete. \"Prophet\" in the 1972 article sits inside quotation marks: a warning role, not foretelling. Deuteronomy 18 condemns speaking presumptuously in Jehovah's name, and they have declined to attach his name to their expectations. Peter erred at Antioch and was still an apostle."},{"t":"Where that runs out","d":"No apostle ever demanded obedience to instructions \"whether sound or not\" while disclaiming responsibility for them. Peter's error was corrected in public by another fallible man. Watchtower rules forbid that, on pain of disfellowshipping. And the prophet-in-quotes defense meets the same corpus: they applied Ezekiel's watchman commission to themselves for decades, and dated Armageddon in print."},{"t":"How strong is this argument?","d":"Strong for you. The structure is heads-I-win. Authority is at its highest when obedience is being asked for. It is at its lowest when a prediction fails. You cannot bill yourself as the sole channel of a God who cannot lie, and also claim a waiver on everything the channel carried."},{"say":true,"t":"What to say","d":"\"If the Governing Body is not inspired, why must I obey instructions even when they do not seem sound?\""}],"rewritten":true,"refwhy":{"Deuteronomy 18:20-22":"The prophet test, and the hatch they use to escape it. They say they never spoke in Jehovah's name.","Jeremiah 23:21":"'I did not send them, yet they ran.' God on prophets who speak without being sent.","Matthew 7:15-20":"'By their fruits you will know them.' Jesus' test for teachers who claim to speak for God.","1 John 4:1":"'Test the spirits.' Set against a rule that says obey even when the instruction does not seem sound.","The Watchtower, Apr 1, 1972, p. 197":"The 1972 article naming the Witnesses as Jehovah's 'prophet' — a body of men and women.","The Watchtower, May 1, 1972 (no divine inspiration claimed)":"The same year, the same magazine: they claim no divine inspiration. Both halves printed in 1972.","The Watchtower, Jun 15, 1957, p. 370":"1957. Members are told to take the slave's directions 'as we would to the voice of God.'","Awake!, Mar 22, 1993, pp. 3-4 and footnote":"1993. The footnote saying they never spoke in Jehovah's name. This is the escape hatch.","The Watchtower, Nov 15, 2013, p. 20":"2013. Obey instructions 'whether these appear sound... or not.' The obedience half of the paradox.","The Watchtower, Feb 2017 (study), p. 26":"2017. The Governing Body is 'neither inspired nor infallible.' The disclaimer half."},"quran":[],"hadith":["The Watchtower, Apr 1, 1972, p. 197","The Watchtower, May 1, 1972 (no divine inspiration claimed)","The Watchtower, Jun 15, 1957, p. 370","Awake!, Mar 22, 1993, pp. 3-4 and footnote","The Watchtower, Nov 15, 2013, p. 20","The Watchtower, Feb 2017 (study), p. 26"]},
{"id":"avoid-jws-deny-jesus","title":"DON'T USE: 'Jehovah's Witnesses don't believe in Jesus'","category":"prophecy-authority","claim":"A common evangelical talking point asserts that Witnesses deny Jesus, or do not believe he existed. This is false, and it instantly discredits anyone who says it at the door. Jehovah's Witnesses believe Jesus is the Messiah, God's Son, the ransom sacrifice essential for salvation, the reigning King of God's Kingdom since 1914, and the one through whom all creation came into being. Their actual Christology is that the Son is God's first creation, identified with Michael the archangel. He is a god but not Jehovah God, and worship and prayer are directed to the Father only. That position is functionally a revival of Arianism, condemned at Nicaea in 325. It is the real point of difference and it is worth engaging. 'You deny Jesus' is a strawman that every Witness has heard and can refute from their own literature in seconds, ending the conversation.","wt":["jw.org, 'Do Jehovah's Witnesses Believe in Jesus?'","What Does the Bible Really Teach? (2005), ch. 4","Insight on the Scriptures, Vol. 2, 'Michael,' p. 393","The Watchtower, Sept 15, 2005, 'Is Jesus the Archangel Michael?'"],"bible":["John 20:28","Colossians 1:15-17","Hebrews 1:5-6","Daniel 10:13","Jude 9"],"sources":[{"name":"JW.org — Do Jehovah's Witnesses Believe in Jesus?","type":"watchtower","url":"https://www.jw.org/en/jehovahs-witnesses/faq/believe-in-jesus/"},{"name":"Wikipedia — Jehovah's Witnesses beliefs (Christology)","type":"institutional","url":"https://en.wikipedia.org/wiki/Jehovah%27s_Witnesses_beliefs"},{"name":"GotQuestions — What do Jehovah's Witnesses believe?","type":"apologetics","url":"https://www.gotquestions.org/Jehovahs-Witnesses.html"}],"response":"Witnesses affirm it without hesitation: 'We believe in Jesus, who said: I am the way and the truth and the life' (jw.org FAQ). They observe the Memorial of his death every year. They preach the good news about Jesus door to door. They hold that no one comes to the Father except through him. They simply decline, on biblical grounds as they read them, to identify the Son as Almighty God — a position they share with a long minority stream of Christian history.","responseSource":{"name":"JW.org FAQ — Do Jehovah's Witnesses Believe in Jesus?","url":"https://www.jw.org/en/jehovahs-witnesses/faq/believe-in-jesus/"},"verdict":"answered","rationale":"The accusation as popularly phrased is simply false, and the Witness at your door knows it. It is flagged avoid so that this site never repeats it. The legitimate adjacent conversation is a real one. Is Jesus a created archangel? Can a creature bear the titles of Hebrews 1 and receive Thomas's confession in John 20:28, which the NWT leaves intact as 'My Lord and my God!'? That is covered properly by the translation cases. One irony is worth keeping. The identification of Christ as Michael the archangel appears nowhere in Scripture, and rests on inference from two verses in Daniel and Jude.","severity":"low","avoid":true,"plain":[{"t":"The claim to stop making","d":"You will hear Christians say that Witnesses deny Jesus, or do not believe in him. It is false. Say it at a door and the conversation is over in ten seconds."},{"t":"What they actually believe about Jesus","d":"They believe Jesus is the Messiah and the Son of God. They believe his death is the ransom, and that salvation depends on it. They believe he has reigned as King since 1914. They believe all creation came through him. They hold the Memorial of his death every year. They preach about him at doors."},{"t":"Where the real difference is","d":"They teach that the Son is God's first creation. They identify him with Michael the archangel. He is a god, they say, but not Jehovah God. Prayer and worship go to the Father only. That is close to the old view called Arianism, which the church rejected at Nicaea in 325. That difference is worth talking about for hours."},{"t":"Why the false version costs you","d":"Every Witness has heard it. They can refute it from their own books in seconds. Once you have said something false, nothing true you say afterwards gets weighed."},{"t":"How strong is this argument?","d":"Do not use this one. Use the translation cases instead. Ask whether a created angel can be given the titles in Hebrews 1. Ask about Thomas in John 20:28, which even their Bible leaves as <b>\"My Lord and my God!\"</b> And note that no verse anywhere calls Jesus Michael. That link is drawn from two verses in Daniel and Jude."},{"say":true,"t":"What to say","d":"\"I know you believe in Jesus. What I want to understand is why you believe he was created.\""}],"rewritten":true,"refwhy":{"John 20:28":"Thomas says 'My Lord and my God!' Even their Bible keeps it. Use this instead of the false charge.","Colossians 1:15-17":"The 'firstborn of all creation' text. This is the real disagreement, not whether they believe in Jesus.","Hebrews 1:5-6":"God tells all his angels to worship the Son. Hard to square with the Son being an angel.","Daniel 10:13":"One of the two verses the Michael link is drawn from. It says nothing about Jesus.","Jude 9":"The other verse behind that link. It calls Michael an archangel, and again names no one else.","jw.org, 'Do Jehovah's Witnesses Believe in Jesus?'":"Their own page answering this charge. Read it first, because they will quote it back at you.","What Does the Bible Really Teach? (2005), ch. 4":"Their main teaching book, chapter 4, on who Jesus is. Their belief in their own words.","Insight on the Scriptures, Vol. 2, 'Michael,' p. 393":"Their encyclopedia entry, saying Michael is none other than Jesus Christ.","The Watchtower, Sept 15, 2005, 'Is Jesus the Archangel Michael?'":"A 2005 article making the Michael link. That link is the real point of difference."},"quran":[],"hadith":["jw.org, 'Do Jehovah's Witnesses Believe in Jesus?'","What Does the Bible Really Teach? (2005), ch. 4","Insight on the Scriptures, Vol. 2, 'Michael,' p. 393","The Watchtower, Sept 15, 2005, 'Is Jesus the Archangel Michael?'"]},
{"id":"avoid-russell-freemason","title":"DON'T USE: 'Charles Taze Russell was a Freemason'","category":"failed-dates","claim":"Internet lore holds that Charles Taze Russell was a Freemason. It cites the winged-sun and cross-and-crown symbols on early Watch Tower covers. It cites the pyramid monument near his grave. And it cites a 1913 address in San Francisco, in which he said 'I am a free and accepted mason.' The full transcript shows he was speaking in a figure. He denied membership in the same speech: 'I have never been a mason... something I do or say might be different from what a mason would do or say.' No Masonic lodge has any record of him. The Grand Lodge of British Columbia and Yukon keeps a research page on the claim, and confirms that none exists. The cross and crown was a common Protestant emblem of the era. The pyramid came from the pyramid theories Russell took from Piazzi Smyth. That is an embarrassment of its own, but a different one. The Freemason charge is unproven and easy to disprove.","wt":["C.T. Russell, 'The Temple of God' address, San Francisco, 1913 (full transcript)","Zion's Watch Tower cover designs, 1891-1931 (cross-and-crown emblem)"],"bible":["Exodus 20:16","Proverbs 19:9"],"sources":[{"name":"Watchtower Documents (B. Anderson) — Was Pastor Russell a Freemason?","type":"apologetics","url":"https://watchtowerdocuments.org/was-pastor-russell-a-freemason/"},{"name":"Pastor Russell blog — 1913 address in context","type":"apologetics","url":"http://pastorrussell.blogspot.com/2008/09/was-charles-taze-russell-mason.html"},{"name":"Freemasons Community — no lodge records for Russell","type":"institutional","url":"https://freemasonscommunity.life/was-charles-taze-russell-a-freemason/"}],"response":"Even hostile ex-Witness researchers reject the claim, among them Barbara Anderson of Watchtower Documents. Russell used masonic imagery as a figure of speech to a San Francisco audience. True Bible believers, he said, 'are all masons of the highest order, fashioned by the Almighty as living stones for the heavenly Temple.' He also stated plainly that he had never joined. Masonic bodies have no stake in protecting him, and they report no record. Russell criticized Freemasonry in print in the Watch Tower of June 1895. So the conspiracy reading needs him to be a secret member of an order he publicly discouraged.","responseSource":{"name":"Watchtower Documents — Was Pastor Russell a Freemason?","url":"https://watchtowerdocuments.org/was-pastor-russell-a-freemason/"},"verdict":"answered","rationale":"Flagged avoid. The claim fails on the primary source. Serious critics of the Watchtower reject it. Using it shows any informed Witness that the site deals in debunked lore, and that poisons the verified material beside it. The real Russell liabilities are damaging enough on their own. There is the pyramid as God's stone witness. There is the 1874 and 1914 chronology. There is the miracle-wheat affair. A site built on the line 'their own books concede this' cannot afford one entry built on a misquote.","severity":"low","avoid":true,"plain":[{"t":"The claim you will find online","d":"That Charles Taze Russell was a Freemason. People point to the winged sun and the cross-and-crown symbols on early Watch Tower covers. They point to the pyramid monument near his grave. And they quote a 1913 address in San Francisco where he said he was a free and accepted mason."},{"t":"What the full transcript shows","d":"He was speaking figuratively, and he denied membership in the same speech. His words were plain: <b>\"I have never been a mason.\"</b> He added that something he did or said might differ from what a mason would do or say."},{"t":"Nobody can find a lodge record","d":"No Masonic lodge has a record of him. The Grand Lodge of British Columbia and Yukon keeps a research page on this claim and confirms there is none. The cross and crown was a common Protestant emblem then. The pyramid came from the pyramid theories Russell took from Piazzi Smyth. That is an embarrassment, but it is a different one. He also criticized Freemasonry in print in the Watch Tower of June 1895."},{"t":"Even his critics reject it","d":"Barbara Anderson, an ex-Witness researcher, rejects the charge. Masonic bodies have no reason to protect him and report nothing. The conspiracy version needs him to be a secret member of an order he publicly discouraged."},{"t":"How strong is this argument?","d":"Do not use this one. It fails on the primary source. It shows an informed Witness that you deal in old internet lore, and that poisons the verified material beside it. Russell has real liabilities: the pyramid as God's stone witness, the 1874 and 1914 chronology, and the miracle wheat affair. Use those."},{"say":true,"t":"What to say","d":"\"I've seen the Freemason claim and I don't think it holds up. Can we talk about the 1874 date instead?\""}],"rewritten":true,"refwhy":{"Exodus 20:16":"'Do not bear false witness.' The reason this charge is off limits, whatever else is true of him.","Proverbs 19:9":"A false witness will not go free. The same warning, aimed at whoever repeats the story.","C.T. Russell, 'The Temple of God' address, San Francisco, 1913 (full transcript)":"The 1913 speech the claim rests on. Read whole, he says 'I have never been a mason.'","Zion's Watch Tower cover designs, 1891-1931 (cross-and-crown emblem)":"The covers people point to. The cross and crown was a common Protestant emblem then."},"quran":[],"hadith":["C.T. Russell, 'The Temple of God' address, San Francisco, 1913 (full transcript)","Zion's Watch Tower cover designs, 1891-1931 (cross-and-crown emblem)"]},
{"id":"avoid-1994-prediction","title":"DON'T USE: 'The Watchtower predicted the end in 1994'","category":"failed-dates","claim":"People sometimes pin a failed 1994 end-of-world date on Jehovah's Witnesses. The Watchtower never set it. That date belongs to Harold Camping of Family Radio. He was a Reformed broadcaster with no tie to the Watchtower. His book '1994?' came out in 1992 and put Christ's return in September of that year. He failed again, famously, with May 21, 2011. The mix-up probably comes from the fact that both set dates, and both were mocked in the same news cycles. The Watchtower's real dated failures are 1878, 1881, 1914, 1918, 1925 and 1975, plus the 1914 generation that has now expired. All of them are set down in its own books, and they need no padding. After 1975 the Society stopped printing dates at all. It moved to the undated overlapping generation, because dated claims had become a liability.","wt":["(none — no Watchtower publication predicted 1994)"],"bible":["Matthew 24:36"],"sources":[{"name":"TIME — Top 10 end-of-world predictions: Harold Camping, 1994","type":"journalism","url":"https://content.time.com/time/specials/packages/article/0,28804,2072678_2072683_2072703,00.html"},{"name":"CRI — A Summary Critique of 1994? by Harold Camping","type":"apologetics","url":"https://www.equip.org/articles/harold-camping-1994/"},{"name":"Christianity Today — Camping Misses End of World (1994)","type":"journalism","url":"https://www.christianitytoday.com/1994/10/camping-misses-end-of-world/"}],"response":"Not applicable. No Watchtower defense is needed here, because the Watchtower never made the claim. A Witness who hears 1994 will deny it, and will be right to.","responseSource":{"name":"Wikipedia — Harold Camping","url":"https://en.wikipedia.org/wiki/Harold_Camping"},"verdict":"answered","rationale":"Flagged avoid. Pinning Camping's date on the Watchtower is a plain error of fact. It lets a Witness correct you truthfully, which is the worst dynamic you can create. It also proves the story members are told: that critics spread lies. The real record is stronger than any borrowed one. Six dated claims in their own print, and not one came true. Keep this entry as a guardrail for our own writing.","severity":"low","avoid":true,"plain":[{"t":"The mix-up","d":"Some people say the Watchtower predicted the end of the world in 1994. It did not. No Watchtower publication ever set that date."},{"t":"Whose date it was","d":"The 1994 date belongs to Harold Camping of Family Radio. He was a Reformed broadcaster with no link to the Watchtower. His book 1994? came out in 1992 and put Christ's return in September of that year. He failed again, famously, with May 21, 2011."},{"t":"Why the two get confused","d":"Both made dated predictions. Both were mocked in the same news cycles. That is the whole connection."},{"t":"What the real record is","d":"Their own dated predictions are 1878, 1881, 1914, 1918, 1925 and 1975. Then there is the 1914 generation, which expired. All of it is documented in their own books. It needs no padding. After 1975 the Society stopped publishing dates and moved to the undated overlapping generation, because dated predictions had become a liability."},{"t":"How strong is this argument?","d":"Do not use this one. A Witness can correct you truthfully, and that hands them the moral high ground. It also proves the story they are told about critics. Keep this entry as a guardrail for yourself."},{"say":true,"t":"What to say","d":"\"That 1994 date was Harold Camping, not your organization. The dates I want to ask about are 1925 and 1975.\""}],"rewritten":true,"refwhy":{"Matthew 24:36":"'No one knows the day or the hour.' It answers Camping's 1994 date, not a Watchtower one.","(none — no Watchtower publication predicted 1994)":"There is nothing to cite, because nothing was printed. That absence is the whole entry."},"quran":[],"hadith":["(none — no Watchtower publication predicted 1994)"]},
{"id":"jesus-michael-archangel","title":"Jesus Is Michael the Archangel","category":"doctrine-of-god","claim":"The Watchtower teaches that Jesus Christ is Michael the archangel, a created angelic being, both before his human life and after his resurrection. This is current, official doctrine. The Watchtower article of April 1, 2010 (p. 19), 'Is Jesus the Archangel Michael?', concludes flatly that 'Jesus Christ is Michael the archangel.' The Insight on the Scriptures encyclopedia (1988, Vol. 2, p. 393) says Michael 'is none other than Jesus Christ.' The biblical basis offered is thin: 1 Thessalonians 4:16, where Jesus descends with an archangel's voice, plus inference from Daniel and Revelation. Hebrews 1:5-13 is a direct counter-argument, written precisely to distinguish the Son from angels. 'To which of the angels did God ever say, You are my Son?' (v. 5). 'Let all God's angels worship him' (v. 6). Angels are ministers, but of the Son it is said 'Your throne, O God, is forever' (vv. 7-8). If the Son is categorically contrasted with angels, he cannot be the chief angel. No verse in Scripture names Jesus as Michael, and the identification rests entirely on inference.","wt":["The Watchtower, April 1, 2010, p. 19 — 'Is Jesus the Archangel Michael?': 'Jesus Christ is Michael the archangel.'","Insight on the Scriptures (1988), Vol. 2, 'Michael', p. 393: identifies Michael as 'none other than Jesus Christ.'","What Does the Bible Really Teach? (2005), Appendix, 'Who Is Michael the Archangel?'"],"bible":["Hebrews 1:5-13","1 Thessalonians 4:16","Daniel 12:1","Jude 9","Revelation 12:7"],"sources":[{"name":"The Watchtower Apr 1, 2010 — Is Jesus the Archangel Michael? (wol.jw.org)","type":"primary","url":"https://wol.jw.org/en/wol/d/r1/lp-e/2010250"},{"name":"Witnesses in Transition (IRR) — Is Jesus Michael the archangel?","type":"scholarly","url":"https://wit.irr.org/jesus-michael-archangel"},{"name":"Apologetics Press — Is Jesus Really Michael the Archangel?","type":"scholarly","url":"https://apologeticspress.org/is-jesus-really-michael-the-archangel-1473/"},{"name":"CARM — Watchtower quotes on Jesus","type":"scholarly","url":"https://carm.org/jehovahs-witnesses/quotes-on-jesus-from-the-watchtower-bible-and-tract-society/"}],"response":"Witnesses argue that 1 Thessalonians 4:16 says Jesus descends with an archangel's voice, which implies that he is the archangel. They note that 'archangel' is only ever singular in Scripture, and that only Michael bears the title. Michael leads the angelic armies in Revelation 12:7, while Revelation 19 depicts Jesus leading heaven's armies, so they are the same commander. And they hold that Hebrews 1 contrasts Jesus with ordinary angels, not with his own pre-eminent angelic rank as chief angel.","responseSource":{"name":"The Watchtower, April 1, 2010; What Does the Bible Really Teach? appendix 'Who Is Michael the Archangel?'","url":"https://wol.jw.org/en/wol/d/r1/lp-e/2010250"},"verdict":"unrefuted","rationale":"The doctrine itself is admitted, since it is current official teaching. The criticism stands unrefuted. No text identifies Jesus as Michael, the argument is purely inferential, and Hebrews 1:5-13 draws a Son-versus-angels contrast that the Witness reading cannot absorb. The Father commands all angels to worship the Son, which on Watchtower premises would be idolatry.","severity":"high","plain":[{"t":"What they teach","d":"The Watchtower teaches that Jesus Christ is Michael the archangel. That means he is a created angel, before his human life and after his resurrection. This is current, official teaching. The Watchtower of April 1, 2010 (p. 19) states it flatly. Their encyclopedia, Insight on the Scriptures (1988, Vol. 2, p. 393), says Michael is none other than Jesus Christ."},{"t":"What it rests on","d":"The support offered is thin. It is 1 Thessalonians 4:16, where Jesus descends with an archangel's voice. The rest is inference from Daniel and Revelation. No verse anywhere names Jesus as Michael."},{"t":"Their answer, at full strength","d":"If Jesus comes with an archangel's voice, perhaps he is the archangel. The word archangel is always singular in Scripture, and only Michael carries the title. In Revelation 12:7 Michael leads heaven's armies, and in Revelation 19 Jesus does. So they may be the same commander. And Hebrews 1, they say, contrasts Jesus with ordinary angels, not with his own rank as chief angel."},{"t":"Where that runs out","d":"Hebrews 1:5-13 was written to separate the Son from angels. Verse 5 asks which of the angels God ever called his Son. Verse 6 says <b>\"let all God's angels worship him.\"</b> Angels are called ministers, but of the Son it says <b>\"your throne, O God, is forever.\"</b> If the Son is set against angels as a class, he is not the chief one. And on their own rules, angels worshipping a creature would be idolatry."},{"t":"How strong is this argument?","d":"Strong for you. They admit the doctrine, and no Watchtower answer deals with the Hebrews 1 contrast. The whole identification is inference stacked on inference."},{"say":true,"t":"What to say","d":"\"Could you show me the verse that says Jesus is Michael? Not one that hints at it, one that says it.\""}],"rewritten":true,"refwhy":{"Hebrews 1:5-13":"Written to set the Son apart from angels. Verse 6 has God's angels worship him. Their reading cannot absorb it.","1 Thessalonians 4:16":"Cuts for them. Jesus comes down 'with an archangel's voice', and this is their main proof text.","Daniel 12:1":"Michael 'the great prince' stands up. One of the verses the link is inferred from. It never names Jesus.","Jude 9":"Michael the archangel disputes with the devil. The other inference verse, and again no mention of Jesus.","Revelation 12:7":"Michael leads heaven's armies here. They pair it with Revelation 19, where Jesus does.","The Watchtower, April 1, 2010, p. 19 — 'Is Jesus the Archangel Michael?': 'Jesus Christ is Michael the archangel.'":"Their 2010 article, stating flatly that Jesus Christ is Michael the archangel.","Insight on the Scriptures (1988), Vol. 2, 'Michael', p. 393: identifies Michael as 'none other than Jesus Christ.'":"Their encyclopedia saying the same thing. This is current, official teaching.","What Does the Bible Really Teach? (2005), Appendix, 'Who Is Michael the Archangel?'":"The appendix in their main teaching book, where a new student first meets this."},"quran":[],"hadith":["The Watchtower, April 1, 2010, p. 19 — 'Is Jesus the Archangel Michael?': 'Jesus Christ is Michael the archangel.'","Insight on the Scriptures (1988), Vol. 2, 'Michael', p. 393: identifies Michael as 'none other than Jesus Christ.'","What Does the Bible Really Teach? (2005), Appendix, 'Who Is Michael the Archangel?'"]},
{"id":"bodily-resurrection-denied","title":"Denial of Jesus' Bodily Resurrection","category":"doctrine-of-god","claim":"Watchtower doctrine, from Russell to today, denies that Jesus rose in the body that was crucified. Russell wrote in 1889 that Jesus' body 'did not decay or corrupt... whether it was dissolved into gases or whether it is still preserved somewhere... no one knows' (The Time Is at Hand, p. 129). The modern teaching is materially the same. Jesus was raised 'a spirit creature' (The Watchtower, September 1, 1953, p. 518), and God 'evidently disposed of Jesus' fleshly body in his own way' (You Can Live Forever in Paradise on Earth, 1982, p. 144). The appearances were temporary materializations in assumed bodies. This collides with Jesus' own prediction: 'Destroy this temple and in three days I will raise it up... he was talking about the temple of his body' (John 2:19-21). It also collides with his post-resurrection words: 'See my hands and my feet, that it is I myself; touch me and see, for a spirit does not have flesh and bones as you see that I have' (Luke 24:39). On the Witness account, Jesus' proof that he was not a spirit was offered while he actually was a spirit, which makes the demonstration deceptive. The empty tomb is also evidentially idle if the body was simply dissolved.","wt":["C.T. Russell, The Time Is at Hand (Studies in the Scriptures Vol. 2, 1889), p. 129: 'whether it was dissolved into gases or whether it is still preserved somewhere... no one knows.'","You Can Live Forever in Paradise on Earth (1982), p. 144: 'Jehovah God evidently disposed of Jesus' fleshly body in his own way.'","The Watchtower, September 1, 1953, p. 518: Jesus was raised 'a spirit creature.'","Reasoning From the Scriptures (1985), pp. 333-336: resurrection 'in a spiritual body.'"],"bible":["John 2:19-21","Luke 24:36-43","John 20:24-29","Acts 2:31","1 Timothy 2:5 ('the man Christ Jesus')"],"sources":[{"name":"The Time Is at Hand (Russell, 1889) — full scan","type":"primary","url":"https://www.scribd.com/document/670888842/The-Time-is-at-Hand-Russell-1889"},{"name":"Watchman Fellowship — The Resurrection as Jesus' Climactic Miracle","type":"scholarly","url":"https://www.watchman.org/articles/jehovahs-witnesses/the-resurrection-as-jesus-climactic-miracle/"},{"name":"CARM — Watchtower quotes on Jesus","type":"scholarly","url":"https://carm.org/jehovahs-witnesses/quotes-on-jesus-from-the-watchtower-bible-and-tract-society/"}],"response":"Witnesses cite 1 Peter 3:18 — 'put to death in the flesh but made alive in the spirit' — and 1 Corinthians 15:45 and 15:50, where the last Adam 'became a life-giving spirit' and 'flesh and blood cannot inherit God's kingdom.' They take these as proof that the resurrection was to spirit life. There is also a ransom logic: Jesus sacrificed his human life permanently, so taking the body back would revoke the payment. And the materialized-body appearances follow the Old Testament precedent of angels appearing in flesh.","responseSource":{"name":"Reasoning From the Scriptures (1985), 'Resurrection'; The Watchtower and Awake! treatments of 1 Cor 15 and 1 Pet 3:18","url":"https://www.scribd.com/document/670888842/The-Time-is-at-Hand-Russell-1889"},"verdict":"admitted","rationale":"The teaching is openly stated in their own publications from 1889 to now, so there is no dispute about what they teach. The biblical counter from John 2:19-21 and Luke 24:39 is strong, and the materialization harmonization makes Jesus' own evidential appeal misleading on Witness premises. He offers his flesh and bones as proof that he is not a spirit. Graded admitted, because the doctrinal fact is conceded. The theological debate over 1 Corinthians 15 should be presented, not hidden.","severity":"high","plain":[{"t":"What they teach","d":"Watchtower doctrine denies that Jesus rose in the body that was crucified. Russell wrote in 1889 that the body did not decay, and asked whether it was dissolved into gases or is still kept somewhere. Nobody knows, he said (The Time Is at Hand, p. 129). The modern teaching is the same in substance. Jesus was raised a spirit creature (The Watchtower, Sept 1, 1953, p. 518). God disposed of the fleshly body in his own way (You Can Live Forever in Paradise on Earth, 1982, p. 144). The appearances were bodies briefly made for the occasion."},{"t":"What Jesus said would happen","d":"John 2:19-21 has Jesus say <b>\"destroy this temple and in three days I will raise it up.\"</b> John explains he meant the temple of his body. After the resurrection he says: <b>\"See my hands and my feet, that it is I myself; touch me and see, for a spirit does not have flesh and bones as you see that I have\"</b> (Luke 24:39)."},{"t":"Their answer, at full strength","d":"They cite 1 Peter 3:18: put to death in the flesh, made alive in the spirit. They cite 1 Corinthians 15:45 and 15:50: the last Adam became a life-giving spirit, and flesh and blood cannot inherit God's kingdom. There is also a ransom argument. Jesus gave up his human life for good, so taking the body back would cancel the payment. Angels appeared in flesh in the Old Testament, so the appearances have precedent."},{"t":"Where that runs out","d":"On their account, Jesus proved he was not a spirit while he actually was one. That makes his own demonstration misleading. The empty tomb also does no work if the body was simply dissolved."},{"t":"How strong is this argument?","d":"They admit this themselves, from 1889 to now. The debate about 1 Corinthians 15 is real, so present it rather than hide it. The strongest ground is Luke 24:39 and John 2:19-21."},{"say":true,"t":"What to say","d":"\"If he was a spirit at that moment, what did Luke 24:39 mean? He offers his hands and feet as proof.\""}],"rewritten":true,"refwhy":{"John 2:19-21":"Jesus says raise 'this temple', and John explains that he meant his body. The prediction the doctrine must get past.","Luke 24:36-43":"'A spirit does not have flesh and bones as you see that I have.' The strongest ground in the case.","John 20:24-29":"Thomas is told to put his hand in the wounds. Hard to square with a body made for the moment.","Acts 2:31":"Peter says his flesh did not see decay. That ties the rising to the body that was buried.","1 Timothy 2:5 ('the man Christ Jesus')":"Paul calls the mediator 'the man Christ Jesus', writing long after the resurrection.","C.T. Russell, The Time Is at Hand (Studies in the Scriptures Vol. 2, 1889), p. 129: 'whether it was dissolved into gases or whether it is still preserved somewhere... no one knows.'":"Russell in 1889, asking whether the body was turned to gas or kept somewhere. Nobody knows, he says.","You Can Live Forever in Paradise on Earth (1982), p. 144: 'Jehovah God evidently disposed of Jesus' fleshly body in his own way.'":"Their 1982 book. God 'disposed of' the fleshly body in his own way.","The Watchtower, September 1, 1953, p. 518: Jesus was raised 'a spirit creature.'":"1953. The doctrine in one phrase: he was raised 'a spirit creature'.","Reasoning From the Scriptures (1985), pp. 333-336: resurrection 'in a spiritual body.'":"Their 1985 handbook. This is the version taught at the door."},"quran":[],"hadith":["C.T. Russell, The Time Is at Hand (Studies in the Scriptures Vol. 2, 1889), p. 129: 'whether it was dissolved into gases or whether it is still preserved somewhere... no one knows.'","You Can Live Forever in Paradise on Earth (1982), p. 144: 'Jehovah God evidently disposed of Jesus' fleshly body in his own way.'","The Watchtower, September 1, 1953, p. 518: Jesus was raised 'a spirit creature.'","Reasoning From the Scriptures (1985), pp. 333-336: resurrection 'in a spiritual body.'"]},
{"id":"holy-spirit-active-force","title":"The Holy Spirit as Impersonal 'Active Force'","category":"doctrine-of-god","claim":"The Watchtower teaches that the holy spirit is not a person but God's active force, analogous to electricity or radar. The brochure Should You Believe in the Trinity? (1989) devotes a chapter to 'The Holy Spirit — God's Active Force,' Reasoning From the Scriptures (1985, p. 381) makes the electricity comparison, and the NWT decapitalizes 'holy spirit' throughout. But the New Testament repeatedly ascribes personal properties to the Spirit that no impersonal force can bear. Acts 5:3-4 is the sharpest: Peter says Ananias 'lied to the holy spirit,' and in the next breath 'you have lied not to men but to God.' You cannot lie to a force. The Spirit speaks and issues first-person commands — 'the holy spirit said: Set apart for me Barnabas and Saul' (Acts 13:2). It forbids travel plans (Acts 16:6-7), can be grieved (Ephesians 4:30), teaches (John 14:26), bears witness (Romans 8:16) and intercedes (Romans 8:26-27). And it 'distributes to each one respectively just as it wills' (1 Corinthians 12:11), in the NWT's own rendering. Willing is a paradigmatically personal act. The force model must explain away every one of these as extended personification.","wt":["Should You Believe in the Trinity? (1989), 'The Holy Spirit — God's Active Force': 'the holy spirit is not a person and it is not part of a Trinity.'","Reasoning From the Scriptures (1985), p. 381: the holy spirit as God's 'active force,' compared to electricity.","Insight on the Scriptures (1988), Vol. 2, 'Spirit.'"],"bible":["Acts 5:3-4","Acts 13:2","Acts 16:6-7","Ephesians 4:30","1 Corinthians 12:11","John 14:26","Romans 8:26-27"],"sources":[{"name":"Should You Believe in the Trinity? — The Holy Spirit, God's Active Force (jw.org)","type":"primary","url":"https://www.jw.org/en/library/brochures/Should-You-Believe-in-the-Trinity/The-Holy-Spirit-Gods-Active-Force/"},{"name":"Watchtower Online Library — The Holy Spirit, God's Active Force","type":"primary","url":"https://wol.jw.org/en/wol/d/r1/lp-e/1101989306"},{"name":"IRR Witnesses in Transition — Is the Holy Spirit a force?","type":"scholarly","url":"https://wit.irr.org/holy-spirit-force"}],"response":"Witnesses answer that Scripture personifies impersonal things. Wisdom cries out in Proverbs 8. Sin rules. Blood speaks. So personal verbs applied to the spirit are literary personification. The Greek pneuma is neuter, and the spirit is poured out, filled into people, and given in portions (John 3:34), which fits a force better than a person. Grieving the spirit means grieving God whose force it is, and lying to the spirit is lying to God for the same reason — which they say Acts 5 actually supports.","responseSource":{"name":"Should You Believe in the Trinity? (1989); Insight on the Scriptures, 'Spirit'","url":"https://www.jw.org/en/library/brochures/Should-You-Believe-in-the-Trinity/The-Holy-Spirit-Gods-Active-Force/"},"verdict":"unrefuted","rationale":"The personification defense covers isolated poetic texts, but not sustained narrative agency. The Spirit speaking in the first person, vetoing travel plans, and willing the distribution of gifts all occur in plain historical prose, not poetry. The neuter-gender argument proves nothing, because Greek gender is grammatical, and John uses masculine pronouns for the Spirit in John 16:13-14. The Witness defense exists and should be shown, but it does not neutralize Acts 5:3-4 or 1 Corinthians 12:11.","severity":"medium","plain":[{"t":"What they teach","d":"The Watchtower teaches that the holy spirit is not a person. It is God's active force. Their brochure Should You Believe in the Trinity? (1989) gives it a chapter. Reasoning From the Scriptures (1985, p. 381) compares it to electricity. Their Bible prints \"holy spirit\" without capitals throughout."},{"t":"What the New Testament does with it","d":"It gives the Spirit personal acts a force cannot perform. Acts 5:3-4 is the sharpest. Peter says Ananias lied to the holy spirit, then says in the next breath that he lied to God. You cannot lie to a force. The Spirit speaks and gives orders in the first person (Acts 13:2). It blocks travel plans (Acts 16:6-7). It can be grieved (Ephesians 4:30). It teaches (John 14:26), bears witness (Romans 8:16), and prays for us (Romans 8:26-27). And in 1 Corinthians 12:11 it distributes gifts <b>\"just as it wills\"</b> — even in their own Bible."},{"t":"Their answer, at full strength","d":"Scripture does personify things that are not persons. Wisdom cries out in Proverbs 8. Sin rules. Blood speaks. So personal verbs may be a figure of speech. The Greek word pneuma is neuter. And the spirit is poured out, given in portions and filled into people (John 3:34), which fits a force. Lying to the spirit is lying to God, they say, because it is his force."},{"t":"Where that runs out","d":"Personification fits poetry. It does not fit sustained narrative. Speaking in the first person, vetoing a journey, and choosing who gets which gift all happen in plain history writing. The gender argument proves nothing, since Greek gender is grammatical. John uses masculine pronouns for the Spirit in John 16:13-14."},{"t":"How strong is this argument?","d":"Strong for you. Their defense is real and should be shown. It does not touch Acts 5:3-4 or 1 Corinthians 12:11."},{"say":true,"t":"What to say","d":"\"Read 1 Corinthians 12:11 in your own Bible. What kind of thing decides for itself who gets what?\""}],"rewritten":true,"refwhy":{"Acts 5:3-4":"Peter says Ananias lied to the holy spirit, then that he lied to God. You cannot lie to a force.","Acts 13:2":"The spirit speaks in the first person: 'set apart for me Barnabas and Saul.' Plain history, not poetry.","Acts 16:6-7":"The spirit blocks Paul's travel plans. A force does not veto a journey.","Ephesians 4:30":"The spirit can be grieved. That is something done to a person.","1 Corinthians 12:11":"It hands out gifts 'just as it wills' — in their own Bible. Willing is the hardest word for a force.","John 14:26":"The spirit teaches and reminds. One more act the force model has to call a figure of speech.","Romans 8:26-27":"The spirit pleads for us, and has a mind that God reads. Both are personal acts.","Should You Believe in the Trinity? (1989), 'The Holy Spirit — God's Active Force': 'the holy spirit is not a person and it is not part of a Trinity.'":"Their 1989 brochure chapter. The doctrine in their own words: not a person.","Reasoning From the Scriptures (1985), p. 381: the holy spirit as God's 'active force,' compared to electricity.":"Their handbook, where the spirit is likened to electricity.","Insight on the Scriptures (1988), Vol. 2, 'Spirit.'":"Their encyclopedia article on 'Spirit'. The long form of the same teaching."},"quran":[],"hadith":["Should You Believe in the Trinity? (1989), 'The Holy Spirit — God's Active Force': 'the holy spirit is not a person and it is not part of a Trinity.'","Reasoning From the Scriptures (1985), p. 381: the holy spirit as God's 'active force,' compared to electricity.","Insight on the Scriptures (1988), Vol. 2, 'Spirit.'"]},
{"id":"soul-sleep-annihilationism","title":"Soul Sleep and Annihilationism","category":"doctrine-of-god","claim":"Watchtower doctrine holds that the soul is simply the living person. Their flagship text is Ecclesiastes 9:5, and their books say the dead 'are conscious of nothing at all.' The wicked are wiped out rather than punished, so eternal destruction means non-existence. Against this stands Jesus' account of the rich man and Lazarus (Luke 16:19-31). It depicts conscious experience after death and before the resurrection. The rich man sees, speaks, remembers his brothers, and is in torments. Revelation 6:9-11 shows the souls of slain martyrs, dead people awaiting resurrection. They cry out, they are answered, and they are given robes. Wiped-out beings do neither. Paul expects that to be away from the body is to be at home with the Lord (2 Corinthians 5:8). He calls departing to be with Christ 'far better' than staying alive (Philippians 1:23). That is an odd preference if departing means the lights go out. Jesus told the thief 'today you will be with me in Paradise' (Luke 23:43), which the NWT handles by moving the comma.","wt":["Insight on the Scriptures (1988), Vol. 2, 'Soul': the soul is the person; no immaterial soul survives death.","What Does the Bible Really Teach? (2005), ch. 6, 'Where Are the Dead?': 'the dead are conscious of nothing at all.'","Reasoning From the Scriptures (1985), 'Hell': hell is mankind's common grave; no conscious punishment."],"bible":["Luke 16:19-31","Revelation 6:9-11","2 Corinthians 5:6-8","Philippians 1:21-23","Luke 23:43","Matthew 25:46"],"sources":[{"name":"What Does the Bible Really Teach? ch. 6 (jw.org)","type":"primary","url":"https://www.jw.org/en/library/books/bible-teach/where-are-the-dead/"},{"name":"jwfacts — Soul and resurrection teachings","type":"scholarly","url":"https://www.jwfacts.com/"},{"name":"Christian Research Institute — JW doctrine analyses","type":"scholarly","url":"https://www.equip.org/"}],"response":"The strongest Witness defense runs like this. Ecclesiastes 9:5, Ecclesiastes 9:10 and Psalm 146:4 say the dead know nothing. Death is called sleep, by Jesus (John 11:11-14) and by Paul (1 Thessalonians 4:13). Luke 16 is a parable aimed at the Pharisees. It is not a map of the afterlife, and no other parable is pressed for a literal picture of the world. The words nephesh and psyche often just mean life, or person. And conditional immortality is defended by respected scholars who are not Witnesses. Edward Fudge and John Stott are the best known, and there is a minority stream of evangelicals behind them. So this belief cannot be dismissed as a cult marker.","responseSource":{"name":"What Does the Bible Really Teach? ch. 6; Insight, 'Soul'; parallel arguments in Fudge, The Fire That Consumes","url":"https://www.jw.org/en/library/books/bible-teach/where-are-the-dead/"},"verdict":"contested","rationale":"Graded conservatively. Both debates here are live inside orthodox Christianity. What happens between death and resurrection is argued. So is the nature of final punishment, and Stott famously leaned toward annihilation. Reading Luke 16 as a parable is defensible, and the sleep language is real. Use this case to show how a system drives readings of a text. The moved comma at Luke 23:43 is the clearest example. Do not use it as a stand-alone refutation.","severity":"low","plain":[{"t":"What they teach","d":"The soul is simply the living person. There is no part that survives death. Their flagship verse is Ecclesiastes 9:5, and their book What Does the Bible Really Teach? (2005) says the dead are conscious of nothing at all. Hell is the common grave of mankind. The wicked are destroyed, not punished forever."},{"t":"The texts that push back","d":"In Luke 16:19-31 the rich man sees, speaks, remembers his brothers and is in torment, after death and before the resurrection. Revelation 6:9-11 shows the souls of killed martyrs crying out, being answered and being given robes. Paul says being away from the body is being at home with the Lord (2 Corinthians 5:8). He calls departing to be with Christ far better than staying (Philippians 1:23). That is a strange preference if it means unconsciousness."},{"t":"Their answer, at full strength","d":"Ecclesiastes 9:5, Ecclesiastes 9:10 and Psalm 146:4 say the dead know nothing. Jesus called death sleep (John 11:11-14), and so did Paul (1 Thessalonians 4:13). Luke 16 is a parable aimed at the Pharisees, and no other parable is mined for a map of the afterlife. The words nephesh and psyche often just mean life or person. And conditional immortality has serious non-Witness defenders, including Edward Fudge and John Stott."},{"t":"Where that runs out","d":"Their reading of Luke 23:43 shows the system at work. Jesus tells the thief he will be with him in paradise. Their Bible moves the comma so that Jesus is only speaking today."},{"t":"How strong is this argument?","d":"Genuinely arguable, both ways. These debates run inside orthodox Christianity too, and Stott leaned toward annihilation. Use this case to show how a system drives readings, not as a knockout."},{"say":true,"t":"What to say","d":"\"Paul says leaving the body is being at home with the Lord. How does that work if nobody is home?\""}],"rewritten":true,"refwhy":{"Luke 16:19-31":"The rich man sees, speaks and remembers after death. Their reply, that it is a parable, is a fair one.","Revelation 6:9-11":"The souls of killed martyrs cry out and are given robes. Wiped-out beings do neither.","2 Corinthians 5:6-8":"Paul says that to be away from the body is to be at home with the Lord.","Philippians 1:21-23":"Paul calls departing to be with Christ 'far better'. An odd preference if it means the lights go out.","Luke 23:43":"'Today you will be with me in Paradise.' Their Bible moves the comma. The clearest sign of a system at work.","Matthew 25:46":"Everlasting punishment and everlasting life stand in one sentence. The text the whole debate turns on.","Insight on the Scriptures (1988), Vol. 2, 'Soul': the soul is the person; no immaterial soul survives death.":"Their encyclopedia on 'Soul'. The soul is the person, and nothing of it lives on.","What Does the Bible Really Teach? (2005), ch. 6, 'Where Are the Dead?': 'the dead are conscious of nothing at all.'":"Their main teaching book. The dead are 'conscious of nothing at all.'","Reasoning From the Scriptures (1985), 'Hell': hell is mankind's common grave; no conscious punishment.":"Their handbook on hell. It is the common grave, and nobody suffers there."},"quran":[],"hadith":["Insight on the Scriptures (1988), Vol. 2, 'Soul': the soul is the person; no immaterial soul survives death.","What Does the Bible Really Teach? (2005), ch. 6, 'Where Are the Dead?': 'the dead are conscious of nothing at all.'","Reasoning From the Scriptures (1985), 'Hell': hell is mankind's common grave; no conscious punishment."]},
{"id":"worship-of-jesus-flipflop","title":"The Worship-of-Jesus Reversal — In Their Own Charter","category":"doctrine-of-god","claim":"For its first seven decades the Watchtower organization taught that Jesus should be worshiped. Zion's Watch Tower of July 15, 1898 (p. 216) reads: 'Yes, we believe our Lord Jesus while on earth was really worshiped, and properly so.' The Watch Tower Society's own charter, as amended in 1945 under Knorr, listed among its purposes 'public Christian worship of Almighty God and Christ Jesus.' That language was not removed until a 1999 amendment. Then the doctrine flipped. 'No distinct worship is to be rendered to Jesus Christ now glorified in heaven' (The Watchtower, January 1, 1954). By 1964: 'It is unscriptural for worshipers of the living and true God to render worship to the Son of God, Jesus Christ' (The Watchtower, November 1, 1964, p. 671). The New World Translation tracked the shift. Hebrews 1:6 read 'let all God's angels worship him' in the 1961 edition, and was changed to 'do obeisance to him' in the 1971 revision — the same Greek word, proskyneo, with new theology. An organization claiming to be God's sole channel taught what it now calls idolatry, in its founding legal document, for over 50 years.","wt":["Zion's Watch Tower, July 15, 1898, p. 216: 'Yes, we believe our Lord Jesus while on earth was really worshiped, and properly so.'","Charter of the Watch Tower Bible and Tract Society, Article II as amended 1945 (reproduced in the 1945 Yearbook): 'public Christian worship of Almighty God and Christ Jesus.'","The Watchtower, January 1, 1954: 'No distinct worship is to be rendered to Jesus Christ now glorified in heaven.'","The Watchtower, November 1, 1964, p. 671: 'It is unscriptural... to render worship to the Son of God.'","New World Translation, Hebrews 1:6 — 'worship him' (1961) vs. 'do obeisance to him' (1971)."],"bible":["Hebrews 1:6","Matthew 28:9,17","Revelation 5:13-14","Philippians 2:10-11"],"sources":[{"name":"jwfacts — JW historical worship of Jesus until 1954","type":"scholarly","url":"https://www.jwfacts.com/watchtower/worship-jesus.php"},{"name":"Christian Research Institute — Is It Proper to Worship Jesus?","type":"scholarly","url":"https://www.equip.org/articles/is-it-proper-to-worship-jesus/"},{"name":"christiandefense.org — Hebrews 1:6 worship or obeisance","type":"scholarly","url":"https://christiandefense.org/general/jehovahs-witnesses-hebrews-16-worship-or-obeisance-brief-look/"}],"response":"Witnesses respond that the light gets brighter (Proverbs 4:18). Jehovah progressively refines his people's understanding, and early imprecision was corrected. Proskyneo has a legitimate range, from worship to respectful homage, and it is used of bowing to kings, so rendering it 'obeisance' toward Jesus is lexically defensible. The charter wording, they say, reflected an older loose usage of the word 'worship,' not Trinitarianism. Russell and Rutherford always denied that Jesus was Almighty God.","responseSource":{"name":"The Watchtower on progressive revelation (Prov 4:18 usage); NWT appendix arguments on proskyneo","url":"https://www.jwfacts.com/watchtower/worship-jesus.php"},"verdict":"admitted","rationale":"Every element comes from their own publications and their own corporate charter. Both positions are documented in Watchtower ink. The brighter-light defense concedes the flip. The lexical point about proskyneo has some force in isolation, but the NWT renders the same word 'worship' when it is directed to Jehovah and 'obeisance' when it is directed to Jesus. That is a translation choice driven by doctrine. And in Hebrews 1:6 it is God who commands the act toward the Son.","severity":"high","plain":[{"t":"What they taught for seventy years","d":"The organization once taught that Jesus should be worshipped. Zion's Watch Tower of July 15, 1898 (p. 216) says so plainly: <b>\"we believe our Lord Jesus while on earth was really worshiped, and properly so.\"</b> Their own charter, as amended in 1945 under Knorr, listed among its purposes <b>\"public Christian worship of Almighty God and Christ Jesus.\"</b> That wording stayed until a 1999 amendment."},{"t":"What they teach now","d":"The Watchtower of January 1, 1954 said no distinct worship is to be rendered to Jesus Christ now glorified in heaven. By 1964 it was stronger. It is unscriptural to render worship to the Son of God (The Watchtower, November 1, 1964, p. 671). What was taught in their founding legal document is now called idolatry."},{"t":"Their Bible moved with the doctrine","d":"Hebrews 1:6 read <b>\"let all God's angels worship him\"</b> in the 1961 edition. The 1971 revision changed it to <b>\"do obeisance to him.\"</b> Same Greek word, proskyneo. New theology."},{"t":"Their answer, at full strength","d":"The light gets brighter (Proverbs 4:18), so early imprecision was corrected. And proskyneo genuinely has a range. It covers bowing to a king as well as worship, so \"obeisance\" is lexically defensible. The charter wording, they say, used \"worship\" loosely. Russell and Rutherford always denied that Jesus was Almighty God."},{"t":"How strong is this argument?","d":"They admit this themselves, in their own magazines and their own charter. The brighter-light defense concedes the flip. And the lexical point breaks down in use: the same Greek word is rendered \"worship\" toward Jehovah and \"obeisance\" toward Jesus. In Hebrews 1:6 it is God commanding the act."},{"say":true,"t":"What to say","d":"\"Your charter said the purpose was public Christian worship of Almighty God and Christ Jesus. When did that stop being true?\""}],"rewritten":true,"refwhy":{"Hebrews 1:6":"The verse their Bible changed. 'Worship him' in 1961 became 'do obeisance to him' in 1971.","Matthew 28:9,17":"The disciples do the act to the risen Jesus. Their Bible renders the same Greek word as obeisance.","Revelation 5:13-14":"Every creature gives the Lamb the same praise as the One on the throne. Their reading has to split those.","Philippians 2:10-11":"Every knee bows at the name of Jesus, to the Father's glory. The act now ruled out.","Zion's Watch Tower, July 15, 1898, p. 216: 'Yes, we believe our Lord Jesus while on earth was really worshiped, and properly so.'":"1898, in print: Jesus 'was really worshiped, and properly so.'","Charter of the Watch Tower Bible and Tract Society, Article II as amended 1945 (reproduced in the 1945 Yearbook): 'public Christian worship of Almighty God and Christ Jesus.'":"Their own charter. Its stated purpose included worship of Christ Jesus, until 1999.","The Watchtower, January 1, 1954: 'No distinct worship is to be rendered to Jesus Christ now glorified in heaven.'":"1954. The reversal begins: no distinct worship for Jesus now in heaven.","The Watchtower, November 1, 1964, p. 671: 'It is unscriptural... to render worship to the Son of God.'":"1964, and stronger. What the charter set out is now called unscriptural.","New World Translation, Hebrews 1:6 — 'worship him' (1961) vs. 'do obeisance to him' (1971).":"The two printings side by side. Same Greek word, new theology."},"quran":[],"hadith":["Zion's Watch Tower, July 15, 1898, p. 216: 'Yes, we believe our Lord Jesus while on earth was really worshiped, and properly so.'","Charter of the Watch Tower Bible and Tract Society, Article II as amended 1945 (reproduced in the 1945 Yearbook): 'public Christian worship of Almighty God and Christ Jesus.'","The Watchtower, January 1, 1954: 'No distinct worship is to be rendered to Jesus Christ now glorified in heaven.'","The Watchtower, November 1, 1964, p. 671: 'It is unscriptural... to render worship to the Son of God.'","New World Translation, Hebrews 1:6 — 'worship him' (1961) vs. 'do obeisance to him' (1971)."]},
{"id":"two-class-salvation-system","title":"Two-Class Salvation: Only 144,000 Born Again","category":"two-class-salvation","claim":"Watchtower doctrine divides Christians into two classes, with different salvations, different hopes, and different relationships to Christ. Only 144,000 anointed are born again, go to heaven, are in the new covenant, and are sons of God. The great crowd, about 99.9% of Witnesses, hope to live forever on earth as God's friends. They are explicitly 'not participants in the new covenant' (The Watchtower, February 1, 1998, p. 18), and they neither need nor want to be born again. The New Testament knows no such division. Jesus made new birth the universal condition: 'unless anyone is born again, he cannot see the Kingdom of God' (John 3:3). Their own NWT reads 'Everyone believing that Jesus is the Christ has been born from God' (1 John 5:1). Paul writes that 'if anyone does not have Christ's spirit, this person does not belong to him' (Romans 8:9), yet Watchtower teaching reserves the spirit's anointing for the 144,000. The 144,000 of Revelation 7 are described as male, virgin Israelites from twelve named tribes (Revelation 7:4-8; 14:4). The Watchtower reads every one of those descriptors symbolically except the number.","wt":["The Watchtower, February 1, 1998, p. 18: 'Members of the great crowd are not participants in the new covenant.'","The Watchtower, December 1, 1984, p. 30 (repeated January 15, 2009): 'Not being in the new covenant... these other sheep do not partake of the Memorial emblems but attend as respectful observers.'","The Watchtower, January 15, 1983 and subsequent: only the anointed are born again; the other sheep are Jehovah's 'friends.'"],"bible":["John 3:3-7","1 John 5:1","Romans 8:9-17","Galatians 3:26-29","Revelation 7:4-8","Revelation 14:1-4","Luke 22:20"],"sources":[{"name":"The Other Sheep and the New Covenant (wol.jw.org)","type":"primary","url":"https://wol.jw.org/en/wol/d/r1/lp-e/1998085"},{"name":"CARM — Watchtower quotes on the great crowd","type":"scholarly","url":"https://carm.org/jehovahs-witnesses/quotes-on-the-great-crowd-from-the-watchtower-bible-and-tract-society/"},{"name":"jwfacts — Scriptures showing the great crowd in heaven","type":"scholarly","url":"https://www.jwfacts.com/watchtower/great-crowd-other-sheep.php"},{"name":"Reachout Trust — The Watchtower Society and the New Covenant","type":"scholarly","url":"https://reachouttrust.org/new-covenant/"}],"response":"Witnesses argue that Scripture itself distinguishes a 'little flock' given the Kingdom (Luke 12:32) from 'other sheep' (John 10:16). Revelation contrasts the sealed 144,000 with an innumerable great crowd standing before the throne, which they read as on earth, before God's attention. Psalm 37:29 and Matthew 5:5 promise that the meek inherit the earth, which requires an earthly-hope class. And 1 John 5:1, they say, describes those with the heavenly calling in John's first-century audience, not all believers of all time.","responseSource":{"name":"The Watchtower, 'The Other Sheep and the New Covenant' (Feb 1, 1998); What Does the Bible Really Teach? ch. 7-8","url":"https://wol.jw.org/en/wol/d/r1/lp-e/1998085"},"verdict":"unrefuted","rationale":"The doctrine is admitted, and the criticism is unrefuted. The other sheep of John 10:16 are explicitly brought into 'one flock, one shepherd,' which is the opposite of a permanent two-class split. The great crowd is located before the throne, where the angels and the elders are (Revelation 7:9-11). Restricting the word 'everyone' in 1 John 5:1 is special pleading that their own translation resists. And no Witness response engages the fact that every New Testament letter addresses all believers as anointed sons within the covenant.","severity":"high","plain":[{"t":"Two classes, two futures","d":"Watchtower doctrine splits Christians in two. Only 144,000 anointed are born again. They go to heaven, they are in the new covenant, and they are sons of God. Everyone else is the great crowd, about 99.9% of Witnesses. They hope to live forever on earth as God's friends. They are <b>\"not participants in the new covenant\"</b> (The Watchtower, February 1, 1998, p. 18). They neither need nor want to be born again."},{"t":"What the New Testament does with new birth","d":"Jesus made it the condition for everyone. <b>\"Unless anyone is born again, he cannot see the Kingdom of God\"</b> (John 3:3). Their own Bible reads at 1 John 5:1: <b>\"Everyone believing that Jesus is the Christ has been born from God.\"</b> Paul writes that anyone without Christ's spirit does not belong to him (Romans 8:9). Watchtower teaching keeps that spirit for the 144,000."},{"t":"Their answer, at full strength","d":"Scripture itself distinguishes groups. There is a little flock given the Kingdom (Luke 12:32) and there are other sheep (John 10:16). Revelation sets the sealed 144,000 beside a great crowd nobody can number. Psalm 37:29 and Matthew 5:5 promise that the meek inherit the earth, so an earthly class is needed. And 1 John 5:1, they say, addresses those with the heavenly calling in John's own day."},{"t":"Where that runs out","d":"John 10:16 says the other sheep are brought in so there is one flock and one shepherd. That is the opposite of a permanent split. The great crowd stands before the throne, beside the angels and elders (Revelation 7:9-11). And the 144,000 in Revelation 7:4-8 are male virgins from twelve named tribes of Israel. Every one of those details is read as symbolic, except the number."},{"t":"How strong is this argument?","d":"Strong for you. Restricting the word \"everyone\" in 1 John 5:1 is special pleading their own translation resists. No published answer deals with the fact that every New Testament letter addresses all believers as anointed sons in the covenant."},{"say":true,"t":"What to say","d":"\"Read John 3:3 to me. Does Jesus put anyone outside that requirement?\""}],"rewritten":true,"refwhy":{"John 3:3-7":"'Unless anyone is born again, he cannot see the Kingdom of God.' Jesus puts nobody outside that.","1 John 5:1":"'Everyone believing that Jesus is the Christ has been born from God' — the wording of their own Bible.","Romans 8:9-17":"Anyone without Christ's spirit does not belong to him. Their teaching keeps that spirit for 144,000.","Galatians 3:26-29":"All are sons of God through faith, with no classes. Cited against a two-tier church.","Revelation 7:4-8":"The 144,000 come from twelve named tribes of Israel. Every detail is read as symbol except the number.","Revelation 14:1-4":"The same group is described as male and virgin. Also read as symbol, while the number stays literal.","Luke 22:20":"The cup is 'the new covenant in my blood'. Almost all Witnesses are taught not to drink it.","The Watchtower, February 1, 1998, p. 18: 'Members of the great crowd are not participants in the new covenant.'":"1998, in print: the great crowd are 'not participants in the new covenant.'","The Watchtower, December 1, 1984, p. 30 (repeated January 15, 2009): 'Not being in the new covenant... these other sheep do not partake of the Memorial emblems but attend as respectful observers.'":"Where they teach that the other sheep attend the Memorial as observers and do not partake.","The Watchtower, January 15, 1983 and subsequent: only the anointed are born again; the other sheep are Jehovah's 'friends.'":"Where new birth is limited to the anointed, and everyone else is called a friend of God."},"quran":[],"hadith":["The Watchtower, February 1, 1998, p. 18: 'Members of the great crowd are not participants in the new covenant.'","The Watchtower, December 1, 1984, p. 30 (repeated January 15, 2009): 'Not being in the new covenant... these other sheep do not partake of the Memorial emblems but attend as respectful observers.'","The Watchtower, January 15, 1983 and subsequent: only the anointed are born again; the other sheep are Jehovah's 'friends.'"]},
{"id":"memorial-passing-emblems","title":"The Memorial: 99.9% Pass the Bread and Wine By","category":"two-class-salvation","claim":"Once a year, Jehovah's Witnesses hold the Memorial of Christ's death, their most important observance. The unleavened bread and the wine are passed along the rows, and almost every attendee declines to touch them. Only those professing to be of the anointed 144,000 partake. The organization's own published statistics for the 2024 service year record 21,119,442 Memorial attendees worldwide and 23,212 partakers — about 0.11%. In 2025 it was roughly 20.5 million attendees and about 24,600 partakers. Jesus' words at the institution were commands to all present: 'Take, eat... Drink out of it, all of you' (Matthew 26:26-27). Paul transmits 'keep doing this in remembrance of me' to the whole Corinthian congregation (1 Corinthians 11:23-26). Jesus attached the stakes explicitly: 'Unless you eat the flesh of the Son of man and drink his blood, you have no life in yourselves' (John 6:53, NWT). Watchtower doctrine thus instructs millions of devout people, yearly and by design, to decline the only meal Jesus commanded his followers to share.","wt":["2024 Service Year Report of Jehovah's Witnesses Worldwide, Grand Totals: Memorial attendance 21,119,442; partakers 23,212.","The Watchtower, December 1, 1984, p. 30: other sheep 'do not partake of the Memorial emblems but attend as respectful observers.'","The Watchtower, January 15, 2010 and annual Memorial invitations: partaking is only for the anointed."],"bible":["Matthew 26:26-28","1 Corinthians 11:23-26","John 6:53-56","Luke 22:19-20"],"sources":[{"name":"2024 Grand Totals — Service Year Report (jw.org)","type":"institutional","url":"https://www.jw.org/en/library/books/2024-Service-Year-Report-of-Jehovahs-Witnesses-Worldwide/2024-Grand-Totals/"},{"name":"Memorial (Jehovah's Witnesses) — Wikipedia overview with sourced statistics","type":"scholarly","url":"https://en.wikipedia.org/wiki/Memorial_(Jehovah%27s_Witnesses)"},{"name":"jwfacts — Memorial partakers analysis","type":"scholarly","url":"https://www.jwfacts.com/watchtower/memorial-partakers.php"}],"response":"Witnesses respond that the new covenant was made with those who will rule with Christ, since Luke 22:28-30 links the meal to a covenant for a kingdom. So the emblems belong to covenant participants only. The great crowd benefits from the ransom without being party to the covenant, just as non-Levites benefited from arrangements they did not administer. 'Drink out of it, all of you' addressed the eleven apostles, all of whom were prospective kingdom heirs, and not a mixed crowd. John 6 they read as exercising faith in the ransom, which the great crowd does.","responseSource":{"name":"The Watchtower Memorial articles (e.g., Jan 15, 2010); 'The Other Sheep and the Lord's Evening Meal' (The Watchtower, Feb 15, 1985)","url":"https://www.jw.org/en/library/books/2024-Service-Year-Report-of-Jehovahs-Witnesses-Worldwide/2024-Grand-Totals/"},"verdict":"admitted","rationale":"The practice and the numbers come wholly from their own publications. This is the two-class doctrine made visible and countable. The covenant-membership defense is their best argument, but it presupposes the two-class system it is meant to support — see the two-class-salvation-system case. It cannot explain why John 6:53 conditions life itself on the very act that 99.9% are told to abstain from. Their own NWT wording does the work here, so use it.","severity":"high","plain":[{"t":"What happens at the Memorial","d":"Once a year Witnesses hold the Memorial of Christ's death. It is their most important meeting. The bread and the wine are passed along the rows. Almost everyone present declines to touch them. Only those who profess to be of the anointed 144,000 partake."},{"t":"The numbers, from their own report","d":"For the 2024 service year they published both figures. Memorial attendance worldwide was 21,119,442. Partakers numbered 23,212. That is about 0.11%. In 2025 it was roughly 20.5 million attending and about 24,600 partaking."},{"t":"What Jesus said at the table","d":"His words were commands to everyone there. <b>\"Take, eat... Drink out of it, all of you\"</b> (Matthew 26:26-27). Paul passes on <b>\"keep doing this in remembrance of me\"</b> to the whole church at Corinth (1 Corinthians 11:23-26). And Jesus set the stakes: <b>\"Unless you eat the flesh of the Son of man and drink his blood, you have no life in yourselves\"</b> (John 6:53, in their own Bible)."},{"t":"Their answer, at full strength","d":"The new covenant was made with those who will rule with Christ. Luke 22:28-30 ties the meal to a covenant for a kingdom. So the emblems belong to those in the covenant. The great crowd benefits from the ransom without being party to the covenant, as non-Levites benefited from arrangements they did not run. \"All of you\" was said to the eleven apostles, who were all future kings, not to a mixed crowd. John 6, they say, means exercising faith in the ransom, which the great crowd does."},{"t":"How strong is this argument?","d":"They admit this themselves, and they publish the count. The covenant defense is their best, but it assumes the two-class system it is meant to prove. It cannot explain why John 6:53 ties life itself to the very act that 99.9% are told to decline."},{"say":true,"t":"What to say","d":"\"When the bread comes past you, what goes through your mind?\""}],"rewritten":true,"refwhy":{"Matthew 26:26-28":"'Take, eat... Drink out of it, all of you.' A command to everyone at the table.","1 Corinthians 11:23-26":"Paul passes 'keep doing this' to a whole congregation, not to a select class inside it.","John 6:53-56":"'Unless you eat... you have no life in yourselves' — in their Bible. Life is tied to the act they decline.","Luke 22:19-20":"The cup as 'the new covenant in my blood'. It is also where their covenant defence starts.","2024 Service Year Report of Jehovah's Witnesses Worldwide, Grand Totals: Memorial attendance 21,119,442; partakers 23,212.":"Their own 2024 report. Over 21 million attended and 23,212 partook. That is 0.11%.","The Watchtower, December 1, 1984, p. 30: other sheep 'do not partake of the Memorial emblems but attend as respectful observers.'":"Where the other sheep are told to attend as observers and let the emblems pass.","The Watchtower, January 15, 2010 and annual Memorial invitations: partaking is only for the anointed.":"Their yearly Memorial material, keeping the bread and wine for the anointed alone."},"quran":[],"hadith":["2024 Service Year Report of Jehovah's Witnesses Worldwide, Grand Totals: Memorial attendance 21,119,442; partakers 23,212.","The Watchtower, December 1, 1984, p. 30: other sheep 'do not partake of the Memorial emblems but attend as respectful observers.'","The Watchtower, January 15, 2010 and annual Memorial invitations: partaking is only for the anointed."]},
{"id":"mediator-only-144000","title":"Jesus: Mediator for Only 144,000","category":"two-class-salvation","claim":"The Watchtower explicitly teaches that Jesus Christ is not the mediator for the vast majority of Jehovah's Witnesses. Questions From Readers in The Watchtower of April 1, 1979 (p. 31) states: 'So in this strict Biblical sense Jesus is the \"mediator\" only for anointed Christians.' The book Worldwide Security Under the Prince of Peace (1986, p. 10) is plainer still. Jesus 'is not the Mediator between Jehovah God and all mankind. He is the Mediator between his heavenly Father, Jehovah God, and the nation of spiritual Israel, which is limited to only 144,000 members.' The text this collides with says the opposite in one sentence: 'For there is one God, and one mediator between God and men, a man, Christ Jesus, who gave himself a corresponding ransom for all' (1 Timothy 2:5-6, NWT). The verse defines the scope of the mediation by the scope of the ransom, which is for all. Under Watchtower doctrine, roughly 8.7 million of 9 million active Witnesses stand outside Christ's mediation, and approach God through association with the anointed class and its Governing Body.","wt":["The Watchtower, April 1, 1979, p. 31: 'So in this strict Biblical sense Jesus is the \"mediator\" only for anointed Christians.'","Worldwide Security Under the 'Prince of Peace' (1986), p. 10: mediator 'limited to only 144,000 members.'","Insight on the Scriptures (1988), Vol. 2, 'Mediator': Christ mediates the new covenant for those with the heavenly calling."],"bible":["1 Timothy 2:5-6","Hebrews 7:25","John 14:6","1 John 2:1-2"],"sources":[{"name":"jwfacts — Why the Watchtower teaches Jesus is not your Mediator","type":"scholarly","url":"https://jwfacts.com/watchtower/mediator.php"},{"name":"Believers Web — Destroying the Mediatorship of Christ","type":"scholarly","url":"https://believersweb.org/destroying-the-mediatorship-of-christ/"},{"name":"Dan Englund — Is Jesus the Mediator Only for the 144,000?","type":"scholarly","url":"https://daenglund.com/is-jesus-the-mediator-only-for-the-144000/"}],"response":"The Witness defense is that mediator, mesites, is a covenant-legal term. Moses mediated the Law covenant for Israel alone, and foreigners still benefited through Israel. In the same way, Jesus legally mediates the new covenant for the 144,000, while all mankind benefits from the ransom that covenant administers. They argue that 1 Timothy 2:5-6 links the mediation to the ransom's benefits reaching 'all sorts of people,' in the NWT rendering, rather than to covenant membership for everyone. The great crowd still prays through Jesus and gains salvation through his blood.","responseSource":{"name":"The Watchtower, April 1, 1979, 'Questions From Readers'; Insight, 'Mediator'","url":"https://jwfacts.com/watchtower/mediator.php"},"verdict":"admitted","rationale":"The teaching is stated in exactly these words in their own publications. Quote them directly and let readers compare with 1 Timothy 2:5-6. The covenant-legal steelman is internally coherent, but only inside the two-class system. The verse itself binds 'one mediator between God and men' to a ransom given 'for all,' and the NWT's 'all sorts of' gloss is a translational patch. Severity is high, because this touches whether ordinary Witnesses have direct access to Christ's mediation at all.","severity":"high","plain":[{"t":"What they teach","d":"A mediator is a go-between. The Watchtower teaches that Jesus is not the go-between for most Witnesses. Questions From Readers in The Watchtower of April 1, 1979 (p. 31) says it plainly: <b>\"So in this strict Biblical sense Jesus is the 'mediator' only for anointed Christians.\"</b>"},{"t":"The 1986 book is plainer still","d":"Worldwide Security Under the Prince of Peace (1986, p. 10) says Jesus <b>\"is not the Mediator between Jehovah God and all mankind.\"</b> He stands, it says, between Jehovah and spiritual Israel. That is capped at 144,000 members. So about 8.7 million of 9 million active Witnesses are left outside."},{"t":"The verse it collides with","d":"One sentence says the opposite. <b>\"For there is one God, and one mediator between God and men, a man, Christ Jesus, who gave himself a corresponding ransom for all\"</b> (1 Timothy 2:5-6, in their own Bible). The reach of the go-between is set by the reach of the ransom. And the ransom is for all."},{"t":"Their answer, at full strength","d":"The Greek word mesites is a legal term about covenants. Moses stood between God and Israel alone. Foreigners still gained by it. So Jesus stands for the 144,000 in the new covenant, while everyone gains from the ransom it carries. They read the verse as tying the benefit to <b>\"all sorts of people\"</b>, their own wording. The great crowd still prays through Jesus and is saved by his blood."},{"t":"How strong is this argument?","d":"They admit this themselves, in those words. Their defense works only inside the two-class system. The verse ties one go-between to a ransom given for all. Quote it and let people compare."},{"say":true,"t":"What to say","d":"\"Read 1 Timothy 2:5 in your Bible. Is Jesus the mediator for you, personally?\""}],"rewritten":true,"refwhy":{"1 Timothy 2:5-6":"'One mediator between God and men', who gave a ransom 'for all'. The verse the teaching collides with.","Hebrews 7:25":"He saves completely those who come to God through him. No class is carved out of that.","John 14:6":"'No one comes to the Father except through me.' Set against a go-between limited to 144,000.","1 John 2:1-2":"Christ is our advocate, and covers the sins of the whole world. The same scope problem for them.","The Watchtower, April 1, 1979, p. 31: 'So in this strict Biblical sense Jesus is the \"mediator\" only for anointed Christians.'":"1979, in their own words: Jesus is 'mediator' only for anointed Christians.","Worldwide Security Under the 'Prince of Peace' (1986), p. 10: mediator 'limited to only 144,000 members.'":"Their 1986 book. Jesus is not the mediator for all mankind, but for 144,000.","Insight on the Scriptures (1988), Vol. 2, 'Mediator': Christ mediates the new covenant for those with the heavenly calling.":"Their encyclopedia entry. It keeps the role for those with the heavenly hope."},"quran":[],"hadith":["The Watchtower, April 1, 1979, p. 31: 'So in this strict Biblical sense Jesus is the \"mediator\" only for anointed Christians.'","Worldwide Security Under the 'Prince of Peace' (1986), p. 10: mediator 'limited to only 144,000 members.'","Insight on the Scriptures (1988), Vol. 2, 'Mediator': Christ mediates the new covenant for those with the heavenly calling."]},
{"id":"1935-cutoff-abandoned","title":"The 1935 'Great Crowd' Cutoff — Taught for 72 Years, Then Dropped","category":"two-class-salvation","claim":"From the Rutherford era until 2007, the Watchtower taught that the heavenly calling of the 144,000 effectively closed in 1935. After that date, new converts belonged to the earthly class. Generations of Witnesses were told their hope had been settled by a date. Then Questions From Readers in The Watchtower of May 1, 2007 (pp. 30-31) quietly conceded: 'we cannot set a specific date for when the calling of Christians to the heavenly hope ends.' No scriptural argument had changed, because 1935 had never had one. It rested on a Rutherford convention talk in Washington D.C. The aftermath is measurable in their own statistics. Memorial partakers, those professing the heavenly calling, had declined for decades to a low of 8,524 in 2005, which is consistent with a closed class dying off. The number then reversed after the 2007 change and nearly tripled, reaching 23,212 by 2024. Either thousands of new partakers are genuinely anointed, in which case the 144,000 arithmetic and the whole 1935 edifice was wrong. Or the organization's flagship annual statistic now counts thousands it privately regards as mistaken or unwell. The dilemma was created entirely by its own doctrinal history.","wt":["The Watchtower, May 1, 2007, pp. 30-31, 'Questions From Readers': 'we cannot set a specific date for when the calling of Christians to the heavenly hope ends.'","The Watchtower, February 15, 1995 (and many earlier): heavenly calling essentially closed in 1935.","Service Year Reports: partakers 8,524 (2005) rising to 23,212 (2024)."],"bible":["Romans 8:16","Deuteronomy 18:21-22 (as a test of taught certainties)","1 Corinthians 4:6"],"sources":[{"name":"Questions From Readers, The Watchtower May 1, 2007 (jw.org)","type":"primary","url":"https://www.jw.org/en/library/magazines/w20070501/Questions-From-Readers/"},{"name":"jwfacts — Watchtower quote
