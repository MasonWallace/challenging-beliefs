const KNOW={"didyouknow":[{"t":"The purple triangle","d":"In the Nazi camps Jehovah's Witnesses wore a purple triangle — and they were the only prisoners who could have walked out at any moment by signing a renunciation of their faith. Around 10,000 were imprisoned; roughly 1,500 died. Jewish survivors' memoirs repeatedly single them out as the prisoners least likely to inform and most likely to share food.","tip":"Say this before you say anything critical. It is true, it costs you nothing, and it disarms the persecution narrative that otherwise absorbs every question you ask."},{"t":"They wrote a chunk of American religious-liberty law","d":"Between 1938 and 1955 Jehovah's Witnesses took more than fifty cases to the US Supreme Court. West Virginia v. Barnette (1943) — no American can be compelled to salute a flag or profess a belief — is theirs, and so is Cantwell v. Connecticut (1940), which applied the Free Exercise Clause to the states.","tip":"Most Christians have no idea their own church's legal protection was largely litigated by Witnesses. Knowing it signals that you did the work."},{"t":"1914 was originally the END of the world, not the beginning of the end","d":"Russell taught that Armageddon would be OVER by 1914: 'the battle of the great day of God Almighty... will end in A.D. 1914 with the complete overthrow of earth's present rulership.' When 1914 brought a world war instead of the world's end, the date was recycled as Christ's invisible heavenly enthronement — the failure became the proof.","src":"C.T. Russell, The Time Is at Hand (1889)","id":"russell-1914-end"},{"t":"The Watchtower built a San Diego mansion for Abraham and King David","d":"Beth Sarim ('House of the Princes'), built 1929, was deeded in perpetual trust for the resurrected 'princes' — Abraham, Isaac, Jacob, David — expected imminently. Watch Tower president Rutherford lived and wintered there until his death in 1942. The patriarchs never arrived; the Society quietly sold the house in 1948.","src":"San Diego deed (1930); Wikipedia, 'Beth Sarim'","id":"millions-1925-beth-sarim"},{"t":"'Millions Now Living Will Never Die' — the 1925 prediction","d":"Rutherford's 1920 book declared 1925 'definitely settled by the Scriptures' for the return of the faithful patriarchs and the beginning of restoration. 1925 passed; Rutherford later admitted to Bethel staff he had 'made an ass of himself' over it. Many who sold homes and businesses were not reimbursed.","src":"J.F. Rutherford, Millions Now Living Will Never Die (1920)","id":"millions-1925-beth-sarim"},{"t":"The Great Pyramid of Giza was 'God's stone witness' — until it became Satan's","d":"For decades the Society taught the Great Pyramid's internal passages, measured in 'pyramid inches,' confirmed 1874 and 1914 chronology — Russell called it God's 'stone witness and prophet.' In 1928 Rutherford reversed course, declaring pyramid study inspired by Satan. A pyramid monument the Society erected still stands at its burial plot near Russell's grave in Pittsburgh (he's under a conventional marker beside it, contrary to folklore).","src":"Thy Kingdom Come (1891); Watchtower Nov 15 & Dec 1, 1928","id":"light-gets-brighter-flipflops"},{"t":"The Photo-Drama of Creation was a 1914 multimedia blockbuster","d":"An eight-hour presentation of slides and film synchronized with phonograph sound — genuinely pioneering cinema — shown free to audiences totaling around nine million in its first year. It taught, among other things, that 1914 marked the close of the Gentile Times and the imminent end of the present order.","src":"Watch Tower Society, Photo-Drama of Creation (1914)"},{"t":"The 'Miracle Wheat' scandal","d":"In 1911 the Watch Tower sold 'Miracle Wheat' seed at $1 per pound (roughly $30 today), claiming extraordinary yields. When the Brooklyn Daily Eagle mocked the scheme, Russell sued for $100,000 in libel — and lost, after government testing showed the wheat was ordinary. The court record remains public.","src":"Russell v. Brooklyn Daily Eagle (1913-1915)"},{"t":"'Judge' Rutherford ran the Society like a corporation and lived like an executive","d":"Joseph Rutherford — 'the Judge,' from a brief stint as a substitute judge — centralized all doctrinal authority, replaced elected elders with appointees, and directed the movement from Beth Sarim, driven in 16-cylinder luxury cars during the Great Depression while publishers went door to door unpaid.","src":"Wikipedia, 'Joseph Franklin Rutherford'; Penton, Apocalypse Delayed"},{"t":"Eight Watch Tower leaders went to prison in 1918","d":"Rutherford and seven associates were convicted under the Espionage Act over anti-war passages in 'The Finished Mystery' and sentenced to 20 years; they served about nine months in Atlanta before release on bail in 1919, and the convictions were vacated. The organization now dates Jesus' selection of it as his 'faithful and discreet slave' to precisely 1919 — the year the leaders got out.","src":"Wikipedia, 'Joseph Franklin Rutherford'; JW.org's own 1918 centennial article","id":"faithful-discreet-slave"},{"t":"Awake! carried a promise to the 1914 generation on its masthead — then quietly deleted it","d":"Until October 22, 1995, every issue's masthead promised 'the Creator's promise of a peaceful and secure new world BEFORE THE GENERATION THAT SAW THE EVENTS OF 1914 PASSES AWAY.' The November 8, 1995 issue dropped the clause without announcement, in step with that month's Watchtower redefining 'this generation.'","src":"Awake! Oct 22 vs Nov 8, 1995 mastheads","id":"overlapping-generations"},{"t":"1975 was heavily promoted as the end of 6,000 years of human history","d":"The 1966 book 'Life Everlasting in Freedom of the Sons of God' tied 1975 to the close of six millennia since Adam; articles like 'Why Are You Looking Forward to 1975?' (Watchtower, Aug 15, 1968) stoked expectation, and some sold homes and postponed careers. After the failure, publisher numbers fell for years; a 1980 Watchtower conceded the organization shared blame — while disciplining members who said so.","src":"Life Everlasting (1966); Watchtower Aug 15, 1968; Mar 15, 1980","id":"1975-generation"},{"t":"'This generation' now means two overlapping lifespans","d":"After redefinitions in 1995 and 2008, the April 15, 2010 Watchtower unveiled the 'overlapping generations' doctrine: the 'generation' of Matthew 24:34 spans anointed ones alive in 1914 PLUS anyone anointed while any of them still lived — anchored publicly on Fred Franz (d. 1992). One verse's 'generation' now stretches toward 130+ years.","src":"Watchtower Apr 15, 2010; D. Splane, JW Broadcasting (2015)","id":"overlapping-generations"},{"t":"Memorial partakers are multiplying when they should be vanishing","d":"Doctrine says the anointed 'remnant' of the 144,000 (sealed mostly before 1935 in older teaching) should be dying off. Instead, partakers bottomed out around 8,500 in the mid-2000s and have nearly tripled since — the organization's own 2025 report counts 24,576 partakers worldwide (23,212 in 2024).","src":"JW.org Service Year Reports, Grand Totals 2024-2025","id":"memorial-passing-emblems"},{"t":"The Watchtower was a UN-associated NGO for nine years","d":"While teaching that the United Nations is the scarlet 'wild beast' of Revelation and the 'disgusting thing,' the Watchtower Society held associate NGO status with the UN Department of Public Information from 1992 to 2001 — annually renewed — and withdrew only days after The Guardian exposed it on October 8, 2001.","src":"The Guardian, Oct 8, 2001; UN DPI letter","id":"un-ngo-membership"},{"t":"Organ transplants: cannibalism in 1967, conscience matter in 1980","d":"The Watchtower of November 15, 1967 classed transplants as 'cannibalism, a practice abhorrent to all civilized people'; Witnesses declined kidneys and corneas accordingly. In 1980 the position reversed to personal conscience. No apology was made to those who lost organs, sight, or life in the interval.","src":"Watchtower Nov 15, 1967; Mar 15, 1980","id":"organ-transplant-reversal"},{"t":"The blood ban permits 'fractions' of everything it bans","d":"Whole blood and its four 'primary components' are forbidden, but since the June 15, 2000 Watchtower, fractions derived from ANY component are a conscience matter — including hemoglobin, the oxygen-carrying core of red cells. A Witness may refuse red cells yet accept bovine-derived hemoglobin. No principled line explains where a 'component' ends and a 'fraction' begins.","src":"Watchtower June 15, 2000; AJWRB","id":"blood-fractions-incoherence"},{"t":"Awake! celebrated 26 children who died refusing blood","d":"The May 22, 1994 Awake! cover — 'Youths Who Put God First' — displayed photos of 26 young Witnesses who died refusing transfusions, presented as exemplary. The accompanying text said youths who put God first 'are still doing it, only today the drama is played out in hospitals and courtrooms, with blood transfusions the issue.'","src":"Awake! May 22, 1994","id":"awake-youths-died"},{"t":"Every publisher carries a no-blood card","d":"Witnesses carry a signed Advance Decision / durable power of attorney document refusing blood transfusion even if unconscious and dying, typically renewed annually and often witnessed by congregation elders — which also means the congregation knows if it isn't signed.","src":"JW.org medical information documents","id":"blood-transfusion-ban"},{"t":"Ex-members are officially 'mentally diseased'","d":"The July 15, 2011 Watchtower told members: 'apostates are mentally diseased, and they seek to infect others with their disloyal teachings' — quotation marks around a phrase lifted from 1 Timothy 6:4's 'obsessed.' UK police in Portsmouth examined whether the article breached religious-hatred law.","src":"Watchtower July 15, 2011, pp. 15-19; The Independent (2011)","id":"mentally-diseased-apostates"},{"t":"Australia's Royal Commission: 1,006 alleged abusers, zero reported by the organization","d":"The 2015-2016 Royal Commission found JW Australia's own files recorded 1,006 alleged child sexual abusers since 1950 — and the organization itself reported not one to police (383 cases reached police via victims or families). The Commission singled out the two-witness rule's 'inflexible' application to child abuse as a systemic failure. The organization still applies the rule.","src":"Royal Commission Case Study 29 (2016)","id":"child-abuse-two-witness-rule"},{"t":"Russia banned Jehovah's Witnesses as 'extremist' in 2017","d":"On April 20, 2017 Russia's Supreme Court liquidated the JW administrative center and its 395 local organizations, seizing all property; hundreds of Witnesses have since been prosecuted or imprisoned. The persecution is real and worth condemning without reservation — and internally it is read as prophecy being fulfilled, which strengthens rather than tests conviction.","src":"Human Rights Watch, Apr 20, 2017; USCIRF"},{"t":"After 103 years, the hour ledger closed — mostly","d":"From 1920 to 2023 every publisher filed a monthly report of hours spent preaching. As of November 2023, rank-and-file publishers just check a box for participation — but pioneers and missionaries still count hours, and congregation records still distinguish the 'regular' from the 'irregular' and 'inactive.'","src":"2023 Annual Meeting; Religion News Service, Nov 27, 2023"},{"t":"'Disfellowshipped' was rebranded in 2024 — the shunning wasn't","d":"The August 2024 Watchtower retired the word 'disfellowshipped' for 'removed from the congregation,' and now permits a brief greeting at the Kingdom Hall. Members are still directed not to associate with removed ones — including family outside the household. The vocabulary softened; the mechanism survived.","src":"Watchtower Aug 2024, study ed.; JW.org FAQ 'removed from the congregation'","id":"disfellowshipping-shunning"},{"t":"JW.org is the most-translated website on earth","d":"Content in over 1,100 languages including 100+ sign languages — more than Google, Wikipedia, and Apple combined. It's a genuinely staggering translation operation, and it means the same centrally-produced sentences reach every member on the planet simultaneously; there is no local theological variation to compare notes against.","src":"Religion News Service, Nov 4, 2019; jw.org"},{"t":"Windowless Kingdom Halls: the folklore and the reality","d":"The rumor says halls have no windows 'to keep members from escaping.' The reality is duller: many halls are windowless or minimally windowed for construction cost, security, and vandalism reasons, and plenty have ordinary windows. The buildings aren't the cage; the exit costs are.","src":"JW regional building design guidelines; site surveys","id":"disfellowshipping-shunning"},{"t":"'No paid clergy' — except the ones with vows","d":"Witnesses proudly have no salaried pastorate, and local elders are genuinely unpaid volunteers. But Bethel workers, circuit overseers, and the Governing Body belong to the Worldwide Order of Special Full-Time Servants — housed, fed, insured, and supported by the organization under a vow of poverty. There is a professional religious class; it just isn't called clergy.","src":"Watch Tower legal filings; Organized to Do Jehovah's Will","id":"faithful-discreet-slave"}],"week":[{"t":"Midweek meeting: 'Our Christian Life and Ministry'","d":"About 1¾ hours on a weeknight: Bible-reading assignments, student demonstrations of door-step conversations, and organizational instruction, all from a centrally published workbook identical worldwide.","tip":"If you visit, notice that student 'talks' rehearse conversations with people like you — your objections have been practiced on stage."},{"t":"Weekend meeting: public talk + Watchtower study","d":"A 30-minute public talk from an approved outline, then an hour studying that week's Watchtower article: a reader reads the paragraph, the conductor asks the printed question, hands go up to restate the paragraph.","tip":"Answering 'in your own words' means paraphrasing the paragraph — original analysis from the floor is not the exercise. Attend once; it explains everything about how doctrine propagates."},{"t":"Field service","d":"Door-to-door and return visits, usually organized in car groups after a brief meeting. Since November 2023 most publishers no longer log hours — but participation is still reported monthly and noticed.","tip":"The person at your door may be as tired as you are. Offering coffee and an unhurried conversation is rarer for them than an argument — and far more destabilizing to the script."},{"t":"The cart shift","d":"Two publishers stand by a literature cart in a public spot, trained NOT to approach — passersby must initiate. It counts as witnessing and suits members exhausted by doors.","tip":"Cart witnesses expect to be ignored. A friendly question — 'what made you personally sure this is the truth?' — is often the first real conversation of their shift."},{"t":"Family worship evening","d":"One weeknight reserved for parent-led study of Watchtower materials — established in 2009 when the separate congregation book study was folded into the midweek meeting.","tip":"For JW kids this is a third structured religious evening weekly. Understanding the sheer time-load explains why 'just read this book I like' is a bigger ask than it sounds."},{"t":"The monthly report","d":"Every publisher files monthly: now a checkbox for sharing in the ministry plus a count of Bible studies; pioneers still report hours. Miss enough months and you're classed 'irregular,' then 'inactive' — labels elders track.","tip":"Spiritual health is operationalized as reported activity. When a Witness friend seems anxious near month's end, this is often why."},{"t":"The Memorial — the one observance (Nisan 14)","d":"Their only holy day: an evening Lord's Supper after sundown corresponding to Nisan 14, with the bread and wine passed hand to hand — and declined by nearly everyone present, since only the 'anointed' may partake. Attendance (about 21 million) triples membership.","tip":"It's their biggest invitation event and the easiest meeting to attend. Watching a room pass the emblems untasted is the two-class doctrine made visible — worth seeing once, gently discussed after."},{"t":"Assemblies and the regional convention","d":"Two one-day circuit assemblies plus a three-day regional convention each year: baptisms, new releases, and dramatizations. Vacation time is expected to bend around them.","tip":"Conventions are where new doctrine and policy premiere. Asking a friend 'what changed this year?' is a non-hostile way to surface the fact that things do change."},{"t":"Judicial committees","d":"Alleged 'serious sin' (fornication, apostasy, smoking, celebrating Christmas...) goes before three elders in a closed meeting — no observers, no advocate, no recordings permitted. Outcomes range from reproof to removal from the congregation.","tip":"If a Witness friend goes quiet and distressed, a committee may be why. Knowing the process exists helps you ask better questions and judge less."},{"t":"School life for JW children","d":"No birthday parties, no holiday crafts or carols, no standing for the anthem or saluting the flag, no extracurricular sports typically, and often the only Witness in class — a weekly exercise in being conspicuously different.","tip":"For a JW child, being singled out at school is pre-framed as persecution and proof of faith. Kind, unremarkable inclusion — with a parent-approved alternative in hand — lands better than making an example either way."},{"t":"The preparation load","d":"Between pre-studying the Watchtower article, the midweek workbook, assigned Bible chapters, and family worship, a conscientious publisher's week holds four to six timetabled spiritual obligations before any field service.","tip":"'Come to church Sunday AND a midweek thing AND read this' mirrors the structure they're exhausted by. One unhurried meal with no agenda is the counter-cultural move."}],"aboutyou":[{"t":"You are 'Christendom' — and Christendom is Babylon the Great","d":"All non-JW Christianity is classed as part of 'Babylon the Great, the world empire of false religion,' whose destruction opens Armageddon. Your baptism, your communion, your prayers are not misguided worship in their eyes — they are false religion awaiting judgment.","tip":"Don't spend energy proving your denomination is nice. The category itself is the claim to examine: ask where Scripture teaches that everyone outside one 1919-appointed organization is Babylon."},{"t":"Your church is scheduled for destruction","d":"They expect governments, turning on religion, to destroy the churches as the tribulation begins — an event they anticipate rather than mourn. Loving individuals may genuinely hope you'll 'get out of her' before then.","tip":"Hear the affection inside the warning: door-knocking at your house is, in their frame, pulling you from a burning building. Respond to the love, then question the fire."},{"t":"Your cross is a pagan idol","d":"They teach Jesus died on an upright 'torture stake' and that the cross is a pagan symbol Christians should not display or wear. A crucifix on your wall reads to them roughly as an idol.","tip":"Skip the archaeology duel first; ask the value question — **why would the shape of the instrument matter more than the death upon it?** (1 Corinthians 1:18 glories in the cross, whatever its geometry.)"},{"t":"The Trinity is, to them, a satanic deception","d":"Watchtower literature has long traced the Trinity to Babylonian and pagan triads and presented it as Satan's masterstroke of misdirection. When you say 'God the Son,' they hear the signature lie of false religion.","tip":"Definitions first: most JWs rebut tritheism ('three gods') because that's what they were taught the Trinity is. Establish 'one God in three persons — not three gods, not one person in costume' before any verse is worth exchanging."},{"t":"Your ex-JW friend is the most dangerous person you know","d":"'Apostates' — especially former members — are described as 'mentally diseased' (Watchtower, July 15, 2011), and members are trained to refuse all contact with them and their words. Citing an ex-JW source can end a conversation instantly.","tip":"Never open with 'I talked to an ex-Witness.' Use their own publications and the Bible — sources they're allowed to look at — and save survivor testimony for when trust is deep."},{"t":"They can't take your literature — or your holiday greetings","d":"Non-JW religious material is off-limits ('apostate' material especially — framed like spiritual poison), and 'Merry Christmas' obliges an awkward decline. The refusal is trained, not personal.","tip":"Don't hand them a book; ask a question they'll carry home. Questions get through customs; pamphlets don't."},{"t":"Your objections are their confirmation","d":"They are catechized to expect opposition as proof of being the true faith — Russia's 2017 ban is taught as prophecy fulfilled. Hostility, mockery, and doorstep debate all land as 'we were told this would happen.'","tip":"This is why gentleness IS the argument. The one experience the persecution-frame cannot metabolize is a warm, unhurried Christian who asks good questions and doesn't slam the door."},{"t":"You're being measured by how you treat THEM","d":"Their reading of the sheep and the goats (Matthew 25) says the nations are judged by their response to Christ's anointed 'brothers' — i.e., to the Witnesses and their message. Your reception at the door is, doctrinally, your judgment scene in miniature.","tip":"Use the frame kindly: receive them as you would Christ's own — food, respect, patience — and then ask who Matthew 25 actually calls 'the least of these,' and whether verse 46's outcome ('everlasting punishment') fits annihilation."},{"t":"They can't pray with you","d":"Interfaith activity — praying with you, attending your service (except perhaps a funeral or wedding, silently), joining a Bible study you lead — is forbidden as false worship. Declining your prayer isn't coldness; it's compliance.","tip":"Offer instead of insisting: 'May I pray for you — right now, out loud? You don't have to join, just listen.' Listening isn't participating, and almost no one refuses being prayed FOR."},{"t":"You are 'worldly,' and friendship with you is a managed risk","d":"Everything outside the organization is 'the world' lying in Satan's power (their reading of 1 John 5:19); 'bad associations spoil useful habits' (1 Corinthians 15:33) is applied to close friendship with you. Real warmth is possible, but deep unsupervised friendship draws counsel.","tip":"Expect a ceiling on the relationship and don't take it personally. Consistent, undemanding kindness over years is exactly the data point the 'worldly people are Satan's' doctrine can't explain."}],"doctrine":[{"topic":"God and the Trinity","theirs":"Jehovah is the one almighty God, a single divine person, and his personal name matters supremely. The Trinity is a pagan-influenced doctrine adopted centuries after Christ, unreasonable and unscriptural — Jesus is God's Son, never 'God the Son.' Honoring Jehovah means rejecting the Trinity as a teaching that dishonors him.","bible":"There is one God (Deuteronomy 6:4) — and the Father is called God (John 6:27), the Son is called God (John 1:1; 20:28; Hebrews 1:8), the Spirit is God (Acts 5:3-4), yet they are distinct persons who speak to and about one another. Jesus receives worship (Matthew 28:9,17; Hebrews 1:6), forgives sins (Mark 2:5-7), and shares the Father's glory 'before the world was' (John 17:5). Baptism is into one name — of the Father AND the Son AND the holy spirit (Matthew 28:19).","key":"The question is not whether the word 'Trinity' appears, but whether the Bible presents one God existing as Father, Son, and Spirit — and it does on every page of the New Testament."},{"topic":"Jesus — Michael the archangel?","theirs":"Jesus is God's first creation, the archangel Michael, who was used to create everything else. He lived a perfect human life as a ransom, was raised as a mighty spirit creature, and has ruled invisibly as heavenly King since 1914. He is 'a god' (John 1:1 NWT) — divine-like, but not Jehovah.","bible":"Hebrews 1 exists to deny exactly this: 'to which of the angels did God ever say, You are my Son?' (1:5), 'let all God's angels worship him' (1:6), and the Son is addressed as 'God' whose throne is forever (1:8). Michael 'did not dare' rebuke Satan (Jude 9); Jesus rebuked him freely (Matthew 4:10). No verse states Jesus is Michael — the identification is inferred from a trumpet-and-voice text (1 Thessalonians 4:16).","key":"If the whole point of Hebrews 1 is that the Son is categorically above every angel, the Son cannot be an angel."},{"topic":"The holy spirit","theirs":"The holy spirit is not a person but Jehovah's active force — the invisible power he sends forth to accomplish his will, comparable to a hand or to electricity. It is therefore written lowercase and is not to be worshipped or prayed to.","bible":"The Spirit speaks (Acts 13:2), teaches and reminds (John 14:26), can be lied to — and lying to him is lying to God (Acts 5:3-4) — can be grieved (Ephesians 4:30), intercedes (Romans 8:26-27), and distributes gifts 'just as he wills' (1 Corinthians 12:11). Forces don't will, grieve, or say 'me' (Acts 13:2).","key":"Every personal capacity — will, speech, knowledge, grief — is ascribed to the Spirit; 'active force' requires explaining all of them away."},{"topic":"Salvation and the two classes","theirs":"Exactly 144,000 'anointed' Christians are born again, taken into the new covenant, and will rule with Christ in heaven. The 'great crowd' — virtually all Witnesses today — hope to survive Armageddon and live forever on a paradise earth, gaining final salvation after faithfulness through Christ's thousand-year reign and a final test. Only the anointed partake of the Memorial emblems.","bible":"'Unless someone is born again he cannot SEE the kingdom of God' (John 3:3) — stated to Nicodemus with no ceiling of 144,000. 'Unless you eat the flesh of the Son of man and drink his blood, you have no life in yourselves' (John 6:53). There is 'one body and one spirit... one hope' (Ephesians 4:4), and salvation is by grace through faith, not survival plus a millennium of works (Ephesians 2:8-9; Romans 8:1).","key":"The New Testament knows one flock, one hope, and one table — a salvation system that tells 99.7% of its members not to touch the bread and wine has no apostolic precedent."},{"topic":"The soul and death","theirs":"The soul is the person, not something a person has; when you die, you cease to exist entirely. 'The dead are conscious of nothing at all' (Ecclesiastes 9:5). The hope is not survival of death but future re-creation by resurrection — God remembers you perfectly and remakes you.","bible":"Jesus: 'today you will be with me in Paradise' (Luke 23:43 — the NWT relocates the comma). Paul desires 'to depart and be with Christ, which is far better' (Philippians 1:23) and calls being absent from the body being 'at home with the Lord' (2 Corinthians 5:8). Jesus warns of the One who can destroy 'both soul and body' — two things, not one (Matthew 10:28); Moses and Elijah appear conversing at the Transfiguration.","key":"If death is nonexistence, departing to be with Christ cannot be 'far better' — there would be no one there to be with him."},{"topic":"Hell","theirs":"Hell (Sheol/Hades) is simply the common grave of mankind; hellfire is a slander on God's love. The unredeemed wicked are annihilated — punished with everlasting destruction in the sense of permanent nonexistence — most at Armageddon, with no conscious afterlife of any kind.","bible":"Jesus speaks of judgment more soberly than anyone: 'everlasting punishment' set in parallel with 'everlasting life' (Matthew 25:46 — the same adjective governing both), the rich man conscious in Hades (Luke 16:23-24), and torment 'day and night forever' for the devil, beast, and false prophet (Revelation 20:10) in the lake into which the condemned also go (20:15). Christians debate the nature of final punishment honestly; Scripture does not permit reducing it to painless deletion at Armageddon based on chronology.","key":"Whatever hell's precise nature, Matthew 25:46 will not allow 'everlasting' to mean eternal for life but momentary for punishment."},{"topic":"The resurrection of Jesus","theirs":"Jesus was raised a spirit creature; his physical body was not raised — God removed or dissolved it. His post-resurrection appearances were materialized bodies assumed for the occasion, which is why he wasn't always recognized. He returned, invisibly, as a spirit king in 1914.","bible":"Jesus staked the claim in advance: 'destroy this temple and in three days I will raise it up... he was talking about the temple of his body' (John 2:19-21). Risen, he insists 'a spirit does not have flesh and bones as you see that I have' (Luke 24:39), eats fish, and invites Thomas's fingers into the wounds — the same body, glorified. The tomb was empty because the body that died is the body that rose (1 Corinthians 15).","key":"A 'resurrection' that leaves the corpse dissolved is precisely what Jesus said would NOT happen to the temple of his body."},{"topic":"1914 and the last days","theirs":"The 'seven times' of Daniel 4 equal 2,520 years running from Jerusalem's destruction in 607 BCE to October 1914, when Christ was enthroned in heaven and Satan was cast down to earth. World War I, quakes, famines, and the preaching work prove we've been in the last days since; 'this generation' — now two overlapping groups of anointed ones — will see the end.","bible":"Daniel 4 announces its own meaning: 'it is you, O king' — fulfilled in Nebuchadnezzar's madness within his own reign, with no second application offered anywhere in Scripture. Jesus forbade exactly this arithmetic: 'it does not belong to you to know the times or seasons' (Acts 1:7); 'nobody knows that day or hour' (Matthew 24:36); and he pre-refuted invisible comings — 'if they say he is in the inner rooms, do not believe it... as lightning flashes, so the Son of man will be' (Matthew 24:26-27).","key":"607 BCE is contradicted by all historical evidence (Jerusalem fell 587/586), and without 607 there is no 1914 — the organization's entire claim to authority stands on a date only it defends."},{"topic":"The organization and the faithful slave","theirs":"Jehovah has always worked through a visible channel; today that channel is the 'faithful and discreet slave' — the Governing Body — appointed by Christ over his belongings in 1919 to dispense spiritual food at the proper time. Loyalty to Jehovah is inseparable from loyalty to his organization; salvation requires coming to it. Jesus is mediator of the new covenant for the anointed 144,000, not for the great crowd directly.","bible":"'There is one God, and one mediator between God and men, a man, Christ Jesus, who gave himself a ransom FOR ALL' (1 Timothy 2:5-6). The 'faithful and discreet slave' is a character in a parable about watchfulness (Matthew 24:45-51), not a prophecy of a 1919 corporate appointment — and the same parable warns that the slave may prove wicked. The Beroeans were commended for verifying an apostle against Scripture (Acts 17:11); no organization is above that test.","key":"Any system in which Christ's mediation reaches you only through a committee has replaced the one Mediator with many."},{"topic":"Blood","theirs":"Blood is sacred, representing life, and God's law from Noah through Acts 15 forbids taking it into the body — including by transfusion. Whole blood and its four primary components (red cells, white cells, platelets, plasma) must be refused even at the cost of life; fractions derived from any component are a personal conscience matter, as are non-blood alternatives.","bible":"Every biblical blood text concerns eating blood or its ritual use (Genesis 9:4; Leviticus 17:10-12; Acts 15:28-29 in a table-fellowship context) — and the law itself made life-saving exceptions, as Jesus argued: David ate forbidden showbread and was guiltless; 'the Sabbath was made for man' (Mark 2:25-27); 'I want mercy, and not sacrifice' (Matthew 12:7). The command's stated logic — blood poured out because life belongs to God — is honored, not violated, by using blood to save a life.","key":"A rule that forbids red cells but permits hemoglobin, and that has cost children's lives (Awake!, May 22, 1994), is not the weightier matters of the law — justice, mercy, faithfulness."},{"topic":"The earth's future","theirs":"God's original purpose for a paradise earth will be fulfilled: after Armageddon, the great crowd will transform the globe into a garden during Christ's thousand-year reign, the dead will be resurrected to earth, and obedient mankind will live forever here in perfection. Heaven is for the 144,000 only; earth is not destined for destruction but for restoration.","bible":"The renewed earth is a genuinely biblical hope Christians share — 'the meek will inherit the earth' (Matthew 5:5); creation itself will be set free (Romans 8:21); 'new heavens and a new earth' (2 Peter 3:13; Revelation 21:1). But Scripture never splits redeemed humanity into permanent heaven-people and earth-people: the New Jerusalem comes DOWN, God dwells with mankind, and the throne is on the renewed earth for all his servants, who 'will see his face' (Revelation 21:2-3; 22:3-4).","key":"The Bible's ending is not two eternal address lists but one — heaven and earth reunited, with every redeemed person in God's immediate presence."},{"topic":"Worship in practice","theirs":"True worship excludes anything with pagan roots or nationalistic meaning: no Christmas, Easter, birthdays, or holidays; no flag salute, anthems, voting, or military service; no cross imagery. Worship centers on meeting attendance, public preaching, personal study of the organization's publications, and using God's name Jehovah. Political neutrality and moral cleanness mark God's people.","bible":"Conscientious neutrality and moral seriousness deserve respect — but the apostles handled disputable days differently: 'one man judges one day as above another; another judges all days alike; let each be fully convinced in his own mind' (Romans 14:5), and 'let no one judge you... in respect of a festival' (Colossians 2:16). Where Scripture leaves freedom, binding every member's conscience organization-wide — on penalty of judicial action — is what Jesus rebuked in the Pharisees (Mark 7:7-9).","key":"The issue isn't whether a Christian may skip Christmas — of course they may — but whether anyone may be shunned for keeping it: 'why is my freedom judged by another's conscience?' (1 Corinthians 10:29)."}]};

  <div class="tabpane2 ${on==="kt-facts"?"on":""}" id="kt-facts"><div class="kgrid">${KNOW.didyouknow.map(x=>`<div class="ptcard">${x.img?`<img class="ktop" src="${x.img.src}" loading="lazy" data-full="${x.img.src.replace("width=520","width=1400")}" data-cap="${esc(x.img.cap)}">`:""}<h3 class="ptv">${esc(x.t)}</h3><p class="pt">${rich(x.d)}</p><div class="refs">${x.src?`<a href="${esc(x.src)}" target="_blank" rel="noopener">Source</a>`:""}${x.id&&byId[x.id]?` · <button class="klink" data-open="${x.id}">Related case: ${esc(byId[x.id].title)}</button>`:""}</div></div>`).join("")}</div></div>
  <div class="tabpane2 ${on==="kt-week"?"on":""}" id="kt-week">${KNOW.week.map(x=>`<div class="ptcard"><h3 class="ptv">${esc(x.t)}</h3><p class="pt">${rich(x.d)}</p>${x.tip?`<div class="who you">For you as their friend</div><p class="pt">${rich(x.tip)}</p>`:""}</div>`).join("")}</div>
  <div class="tabpane2 ${on==="kt-you"?"on":""}" id="kt-you">${KNOW.aboutyou.map(x=>`<div class="ptcard"><h3 class="ptv">${esc(x.t)}</h3><p class="pt">${rich(x.d)}</p>${x.tip?`<div class="who you">How to navigate it</div><p class="pt">${rich(x.tip)}</p>`:""}</div>`).join("")}</div>${KNOW.doctrine?`<div class="tabpane2 ${on==="kt-doct"?"on":""}" id="kt-doct">${KNOW.doctrine.map(x=>`<div class="ptcard"><h3 class="ptv">${esc(x.topic)}</h3><div class="ddgrid"><div><div class="who them">They teach</div><p class="pt">${rich(x.theirs)}</p></div><div><div class="who you">The Bible teaches</div><p class="pt">${rich(x.bible)}</p></div></div>${x.key?`<div class="ddkey">${rich(x.key)}</div>`:""}</div>`).join("")}</div>`:""}`;
  document.querySelectorAll("#main .tab2").forEach(t=>t.addEventListener("click",()=>{state.knowTab=t.dataset.pane;}));
  document.querySelectorAll("#main [data-open]").forEach(b=>b.addEventListener("click",()=>openCase(b.dataset.open)));
}

/* ---------- router ---------- */
function render(){
  if(state.view!=="case"&&location.hash.indexOf("#case/")===0)try{history.replaceState(null,"",location.pathname+location.search)}catch(e){}
  document.querySelector(".app").classList.toggle("reading",state.view!=="overview");
  renderNav();
  if(state.view==="case")return renderCase();
  if(state.view==="paths")return renderPaths(),renderPreview();
  if(state.view==="timeline")return renderTimeline(),renderPreview();
  if(state.view==="glossary")return renderGlossary(),renderPreview();
  if(state.view==="share")return renderShare(),renderPreview();
  if(state.view==="proofs")return renderProofs(),renderPreview();
  if(state.view==="theysay")return renderTheySay(),renderPreview();
  if(state.view==="lessons")return renderLessons(),renderPreview();
  if(state.view==="know")return renderKnow(),renderPreview();
  if(state.view==="core")return renderCore(),renderPreview();
  renderOverview();renderPreview();
}

/* ---------- keyboard ---------- */
document.addEventListener("keydown",e=>{
  const inInput=/input|textarea/i.test(document.activeElement.tagName);
  if(inInput){if(e.key==="Escape")document.activeElement.blur();return;}
  const list=filtered();
  const move=dir=>{
    const idx=list.findIndex(x=>x.id===state.sel);
    const next=list[Math.min(list.length-1,Math.max(0,(idx<0?0:idx+dir)))];
    if(!next)return;
    state.sel=next.id;
    if(state.view==="case"){openCase(next.id);}
    else{renderPreview();
      const el=document.querySelector(`.vt[data-id="${next.id}"]`);
      document.querySelectorAll(".vt.sel").forEach(x=>x.classList.remove("sel"));
      document.querySelectorAll(`.vt[data-id="${next.id}"]`).forEach(x=>x.classList.add("sel"));
      if(el)el.scrollIntoView({block:"nearest"});}
  };
  switch(e.key==="ArrowRight"?"next":e.key==="ArrowLeft"?"prev":e.key.toLowerCase()){
    case "next":e.preventDefault();move(1);break;
    case "prev":e.preventDefault();move(-1);break;
    case "enter":if(state.sel&&state.view!=="case")openCase(state.sel);break;
    case "escape":if(state.view==="case"){state.view=state.pathId?"paths":"overview";state.caseId=null;render();}else{state.q="";const q=$("#q");if(q)q.value="";state.verdict=null;state.severity=null;render();}break;
    case "o":state.view="overview";state.section="all";state.caseId=null;render();break;
    case "p":state.view="paths";state.caseId=null;render();break;
    case "t":state.view="timeline";state.caseId=null;render();break;
    case "g":state.view="glossary";state.caseId=null;render();break;
    case "s":state.view="share";state.caseId=null;render();break;
    case "h":state.view="core";state.caseId=null;render();break;
  }
});

const TOURSTEPS=[{"icon":"🚪","title":"Welcome to the examination","body":"<b>50 documented claims</b> about Jehovah's Witnesses, each weighed against the Bible — with Watchtower citations and Bible passages on every case. Every claim carries the <b>strongest Witness defense</b> and an honest verdict; popular criticisms that don't survive scrutiny are marked <b>do not use</b>."},{"icon":"🏷","title":"Four verdicts, one glance","body":"Every claim lands in one of four columns:<div class=\"vrow2\"><div><span class=\"badge v-admitted\">Admitted</span><span>their own publications concede the facts</span></div><div><span class=\"badge v-unrefuted\">Unrefuted</span><span>no adequate answer exists</span></div><div><span class=\"badge v-contested\">Contested</span><span>a real debate — both sides shown</span></div><div><span class=\"badge v-answered\">Answered</span><span>the defense wins, and we say so</span></div></div><p style='margin:10px 0 0'>Here, <b>Admitted</b> means the facts sit in the bound volumes, the <i>Proclaimers</i> history, or the Watchtower Index — sources a Witness already trusts.</p>"},{"icon":"💬","title":"Every case scripts the conversation","body":"Each case ends with <b>“How the conversation usually goes”</b> — a back-and-forth: <i>they may say → you respond → they may counter → you respond</i>. You'll never be caught without the next move. Bible references expand in place; Watchtower citations are listed so your friend can look them up in their own library."},{"icon":"🧭","title":"The sidebar is your map","body":"Start with <b>The heart of it</b> — the one thread everything hangs from. Then <b>When they knock</b> (their six-stage study script and the question to ask at each stage), <b>Quick answers</b>, <b>Guided paths</b>, and <b>Know your neighbor</b>, which is the difference between winning an argument and reaching a person."},{"icon":"🚀","title":"Where to start","body":"Take the <b>foundation path</b>: 607 BC → 1914 → 1919 → the Governing Body's authority. Every other doctrine hangs from that chain, and it is the one chain a Witness can check in a public library. Replay this tour anytime from the sidebar.","cta":"Take me to the heart of it"}];
function startTour(){
  const old=document.querySelector(".tourwrap");if(old)old.remove();
  let ti=0;
  const wrap=document.createElement("div");wrap.className="tourwrap";
  function finish(go){localStorage.setItem(TOURKEY,"1");wrap.remove();if(go){state.view="core";state.caseId=null;render();}}
  function draw(){
    const s=TOURSTEPS[ti];
    wrap.innerHTML='<div class="tourcard"><div class="ticon">'+s.icon+'</div><h3>'+s.title+'</h3><div class="tbody">'+s.body+'</div>'+
      '<div class="tdots">'+TOURSTEPS.map((_,j)=>'<i class="'+(j===ti?"on":"")+'"></i>').join("")+'</div>'+
      '<div class="trow"><button class="tskip">Skip tour</button><div>'+(ti>0?'<button class="tback">Back</button>':'')+
      '<button class="tnext">'+(ti===TOURSTEPS.length-1?s.cta:'Next')+'</button></div></div></div>';
    wrap.querySelector(".tskip").addEventListener("click",()=>finish(false));
    const bk=wrap.querySelector(".tback");if(bk)bk.addEventListener("click",()=>{ti--;draw();});
    wrap.querySelector(".tnext").addEventListener("click",()=>{if(ti===TOURSTEPS.length-1){finish(ti===TOURSTEPS.length-1&&true);}else{ti++;draw();}});
  }
  document.body.appendChild(wrap);draw();
}
if(!localStorage.getItem(TOURKEY))setTimeout(startTour,500);

});
