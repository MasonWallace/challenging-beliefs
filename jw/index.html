const GLOSSARY=[{"t":"the 144,000","d":"Read by the Watchtower as a literal number — the only people who go to heaven, are born again, are in the new covenant, and may take the bread and wine. Everyone else hopes for earth. At the 2023 Memorial, 21.1 million attended and 23,212 partook."},{"t":"the 1914 generation","d":"The teaching that people alive in 1914 would see Armageddon. Redefined in 1995, 2008, and again in 2010 as two 'overlapping' generations."},{"t":"a chiasm","d":"A mirror-image literary structure (A-B-C-B-A) common in Hebrew writing. It appears in these arguments because its presence in a text is sometimes offered as evidence of ancient Semitic authorship."},{"t":"a codex","d":"A book with bound pages, as opposed to a scroll. Christians adopted the codex format remarkably early, which is part of why so many early Christian manuscripts survive."},{"t":"a palimpsest","d":"A manuscript whose original writing was scraped off so the expensive material could be reused. Modern imaging can often recover the erased text underneath — which is how the Sanaa Quran's earlier layer was read."},{"t":"a proof-text","d":"A verse quoted on its own to establish a point, usually detached from what surrounds it. Proof-texting is the single most common way both sides of every argument on this site go wrong."},{"t":"a stele","d":"An upright inscribed stone slab set up to record a victory, a law, or a treaty — one of archaeology's most valuable finds, because it is a dated, deliberate, public record."},{"t":"a textual variant","d":"Any difference between two manuscripts, including a misspelling or a change in word order. The famous 'hundreds of thousands of variants' figure is real and almost entirely trivial; the meaningful and viable ones are well under 1%, and every modern Bible footnotes them."},{"t":"an anachronism","d":"Something appearing in a story before it existed in real life — a horse in a place with no horses, a stirrup centuries too early. Anachronisms are one of the main tools for dating a text, because a writer can only mention the world he lives in."},{"t":"an apologist","d":"Someone who defends a faith's claims — from the Greek <i>apologia</i>, a legal defense. Not an insult, and not the same as an apologizer. This site quotes apologists deliberately: a claim is only worth making if it survives the best defense of it."},{"t":"an ossuary","d":"A limestone box for bones, used in Judea for about a century around the time of Jesus: a body was left to decompose for a year, then the bones were collected into the box. Names carved on ossuaries are how we have physical traces of individuals like the high priest Caiaphas."},{"t":"the anointed","d":"The 144,000 who go to heaven, are born again, are in the new covenant, and alone may take the Memorial bread and wine."},{"t":"the apocrypha","d":"Books written between the Testaments (Tobit, Judith, Maccabees and others), included in Catholic and Orthodox Bibles and in the original 1611 KJV, but not in the Hebrew canon or in Protestant Bibles today."},{"t":"apostate","d":"Anyone who persistently disagrees with the Governing Body's teaching. A 2011 Watchtower called apostates 'mentally diseased' and told members to avoid their words entirely."},{"t":"Armageddon","d":"In Witness teaching, the imminent global destruction of every human being outside the organization, after which survivors live forever on a paradise earth. It is not a distant doctrine but the organizing fact of a Witness's week."},{"t":"Awake!","d":"The organization's second magazine, aimed at a general audience. Its 22 May 1994 issue, which celebrated 26 young Witnesses who died refusing blood transfusions, is one of the most-cited documents in this section."},{"t":"Beth Sarim","d":"'House of the Princes' — a San Diego mansion the Society bought in 1929 and deeded to Abraham, Isaac, Jacob and other resurrected patriarchs expected imminently. Rutherford lived in it. It was sold in 1948, and the organization's own <i>Proclaimers</i> history discusses it."},{"t":"Bethel","d":"A branch headquarters and the volunteer community that staffs it, under a vow of poverty — the organization's professional religious class, though it isn't called clergy."},{"t":"blood fractions","d":"Components-of-components (including hemoglobin) that individual conscience may accept, even though the whole blood they come from is forbidden."},{"t":"the canon","d":"The list of books a community accepts as Scripture. The New Testament canon was recognized gradually by usage over the first three centuries rather than voted on at a council — Athanasius's list of 367 AD matches ours exactly."},{"t":"Charles Taze Russell","d":"The founder (1852–1916), a Pittsburgh haberdasher who began publishing <i>Zion's Watch Tower</i> in 1879. He taught that Christ's invisible presence began in 1874 and that 1914 would bring the end — and the organization spent decades afterwards reworking what he had written."},{"t":"Codex Sinaiticus","d":"A complete Greek Bible hand-copied around 330–360 AD, found at St Catherine's Monastery on Mount Sinai in the 1840s. Along with Vaticanus it is one of the two oldest complete Bibles in existence, and its text is essentially the text you read today."},{"t":"Codex Vaticanus","d":"A Greek Bible copied around 300–325 AD, held in the Vatican Library — slightly older than Sinaiticus and, with it, the backbone of modern New Testament textual scholarship."},{"t":"the Dead Sea Scrolls","d":"About 900 manuscripts found in caves at Qumran near the Dead Sea between 1947 and 1956, copied roughly 250 BC–70 AD. They pushed our oldest Hebrew Bible manuscripts back a thousand years — and the text matched what had been copied ever since. The single most important manuscript discovery ever made."},{"t":"Deutero-Isaiah","d":"The name critical scholars give to the proposed anonymous author of Isaiah 40–55, writing during the Babylonian exile. See the multi-Isaiah theory."},{"t":"disassociation","d":"Formally resigning — treated exactly like expulsion since 1981, which is why there is no neutral way to leave."},{"t":"disfellowshipped / removed","d":"Expelled after a judicial committee. Renamed 'removed from the congregation' in August 2024; other Witnesses, including family outside the household, cut off normal association."},{"t":"the Documentary Hypothesis","d":"The critical theory that the first five books of the Bible were woven together from several earlier sources (labelled J, E, D and P) rather than written by Moses. The classic form is now heavily revised even among critical scholars, but some version of it is the mainstream academic position."},{"t":"exegesis","d":"Drawing out what a text actually says, in its own context. Its opposite is eisegesis — reading your conclusion into the text."},{"t":"the faithful and discreet slave","d":"Their name for the Governing Body, read out of Matthew 24:45 as a prophecy that Christ inspected all religions in 1919 and appointed them over his belongings."},{"t":"field service","d":"The door-to-door and cart witnessing work, usually organized in groups after a short meeting."},{"t":"Fred Franz","d":"The Watchtower's leading theologian for decades and the principal figure behind the New World Translation. Under oath in a Scottish court in 1954 he was asked to translate a simple verse from English into Hebrew and declined. He had studied classical Greek for two years at university and had no formal Hebrew training."},{"t":"the Governing Body","d":"The eight or so men at world headquarters who define all doctrine; since 2012 they identify themselves alone as the 'faithful and discreet slave' of Matthew 24:45."},{"t":"the great crowd","d":"Everyone else — roughly 99.9% of Witnesses — who hope to survive Armageddon and live forever on a paradise earth as God's 'friends' rather than his sons."},{"t":"the Great Isaiah Scroll","d":"The star of the Dead Sea Scrolls: a complete copy of Isaiah, all 66 chapters, copied around 125 BC. It proves Isaiah 53 and its portrait of a pierced, suffering servant existed more than a century before Jesus — nobody added it afterwards."},{"t":"Joseph Rutherford","d":"Russell's successor (1869–1942), a lawyer who consolidated control, coined the name 'Jehovah's Witnesses' in 1931, introduced the 1925 prediction and the Beth Sarim mansion, and drove the movement's confrontational legal campaigns."},{"t":"Josephus","d":"Titus Flavius Josephus (c. 37–100 AD), a Jewish general who surrendered to Rome and became its most important historian of first-century Judea. Not a Christian, which is why his mentions of Jesus, James and John the Baptist carry so much weight."},{"t":"judicial committee","d":"Three elders meeting privately to decide a member's standing. No observers, no advocate, no recordings permitted."},{"t":"Kingdom Hall","d":"The local meeting place. Two meetings a week are held there; the building is deliberately plain and displays no cross."},{"t":"the Kingdom Interlinear","d":"The Watchtower's own Greek–English interlinear New Testament, which prints the literal word-under-word Greek beside the New World Translation. It is the single most useful book in a Witness's library for these conversations, because it lets them see for themselves what the Greek says."},{"t":"the KJV","d":"The King James Version of 1611, the English Bible of the whole period covered by this site. Its wording matters constantly here: several movements examined on this site were born inside its cadence, and some of them treat it as the only legitimate Bible."},{"t":"the Masoretic Text","d":"The standard Hebrew Bible, preserved and vowel-pointed by Jewish scribes called the Masoretes between roughly 600 and 1000 AD. Almost every Old Testament translation is based on it; where it differs from the Septuagint or the Scrolls, that difference is what scholars argue about."},{"t":"the Memorial","d":"Their one annual observance, on Nisan 14: the bread and wine are passed down the rows and nearly every person present declines them."},{"t":"the multi-Isaiah theory","d":"The mainstream critical view that the book of Isaiah had more than one author: chapters 1–39 from the eighth-century prophet, 40–55 from an anonymous writer during the Babylonian exile ('Deutero-Isaiah'), and sometimes 56–66 from a third. It is argued from style and from the fact that chapters 40+ address the exile as present. Conservatives dispute it; it matters here because it is the standard reply whenever Isaiah is said to predict something."},{"t":"Nebuchadnezzar","d":"King of Babylon 605–562 BC, who destroyed Jerusalem and the Temple. The date of that destruction is the hinge of this entire section."},{"t":"the Neo-Babylonian period","d":"The Babylonian empire of Nebuchadnezzar, roughly 626–539 BC. Its chronology is fixed by thousands of dated business tablets and by astronomical diaries recording eclipses and planetary positions — which is why 587 BC for Jerusalem's fall is not a matter of scholarly opinion, and why 607 has no support anywhere."},{"t":"NWT","d":"The New World Translation — the Watchtower's own Bible, produced by an anonymous committee, and the only translation used in their meetings and literature."},{"t":"papyrus","d":"Paper made from reed pith, the ordinary writing material of the ancient world. New Testament papyri are labelled with a P and a number — P52, a scrap of John, is the earliest known New Testament manuscript, copied around 125 AD."},{"t":"PIMO","d":"'Physically In, Mentally Out' — a member who no longer believes but keeps attending to avoid losing their family."},{"t":"pioneer","d":"A publisher who commits to an hour quota in the ministry each month — the status held up to young Witnesses in place of university."},{"t":"the Proclaimers book","d":"<i>Jehovah's Witnesses — Proclaimers of God's Kingdom</i> (1993), the organization's own official history. It is unusually candid about the failed dates and about Beth Sarim, which makes it the ideal source to cite: a Witness cannot call their own history apostate literature."},{"t":"publisher","d":"A baptized or approved member who takes part in the preaching work and files a monthly activity report."},{"t":"Qumran","d":"The settlement beside the caves where the Dead Sea Scrolls were found, on the northwest shore of the Dead Sea. Usually associated with the Essenes, a strict Jewish sect of the Second Temple period."},{"t":"the Reasoning book","d":"<i>Reasoning from the Scriptures</i> — the field-service handbook giving Witnesses a prepared answer to every common objection, arranged by topic. Assume the person at your door has a script for whatever you were about to say, which is why questions work better than arguments."},{"t":"the Septuagint","d":"The Greek translation of the Hebrew Scriptures made by Jewish scholars in Alexandria beginning about 250 BC — abbreviated LXX. It matters constantly here because it is pre-Christian: when it renders a verse a certain way, no Christian could have influenced it."},{"t":"the Smithsonian Institution","d":"The United States' national museum and research complex. It matters here because for decades a 'Smithsonian statement' was circulated claiming the institution used the Book of Mormon as an archaeological guide. The Smithsonian issued a formal statement denying it, and now sends a standard letter saying its archaeologists see no connection between the New World's archaeology and the book's contents."},{"t":"Tacitus","d":"Roman senator and historian (c. 56–120 AD). His hostile mention of 'Christus,' executed by the procurator Pontius Pilate under Tiberius, is the standard non-Christian confirmation of the crucifixion."},{"t":"the Tetragrammaton","d":"YHWH, the four Hebrew letters of God's personal name, rendered 'Jehovah' in the New World Translation and 'the LORD' in most English Bibles. The Witnesses' insistence on it is a genuine point in their favour in the Old Testament; the difficulty is that the NWT also inserts 'Jehovah' 237 times into the New Testament, where no Greek manuscript has it."},{"t":"textual criticism","d":"The scholarly discipline of comparing manuscripts to work out what the original wording was. It is not an attack on Scripture — it is the method that lets us say with confidence what the text said."},{"t":"the Watchtower","d":"Both the organization's flagship magazine (published since 1879) and the shorthand for the Watch Tower Bible and Tract Society, its legal and publishing arm. When a case cites 'The Watchtower, 15 March 1975,' it is citing the magazine — the primary evidence throughout this section."}];

const esc=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function hl(text,phrases){let out=esc(text);(phrases||[]).forEach(p=>{const e=esc(p).replace(/[.*+?^${}()|[\]\\]/g,"\\$&");out=out.replace(new RegExp(e,"gi"),m=>"<mark>"+m+"</mark>");});return out;}
function glossify(escapedText){
  if(!glossify._re){
    const ts=GLOSSARY.slice().sort((a,b)=>esc(b.t).length-esc(a.t).length);
    const alts=ts.map(g=>esc(g.t).replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|");
    glossify._re=new RegExp("(?<![\\w-])("+alts+")(?![\\w-])","gi");
    glossify._map={};GLOSSARY.forEach(g=>{glossify._map[esc(g.t).toLowerCase()]=g;});
  }
  const used=glossify.seen||(glossify.seen=new Set());
  let inRef=0;
  return escapedText.replace(/(<[^>]*>)|([^<]+)/g,(m,tag,txt)=>{
    if(tag){
      if(/^<span class="ref-(lds|bib)"/.test(tag))inRef++;
      else if(inRef&&tag.indexOf("</span>")===0)inRef--;
      return tag;
    }
    if(inRef)return txt;
    return txt.replace(glossify._re,w=>{
      const g=glossify._map[w.toLowerCase()];
      if(!g||used.has(g.t))return w;
      used.add(g.t);
      return '<span class="g" tabindex="0">'+w+'<span class="gt"><b>'+esc(g.t)+'</b> — '+g.d+'</span></span>';
    });
  });
}


function findWhy(d,cite){
  const key=cite.replace(/–/g,"-").replace(/\s*\(.*\)\s*/g,"").trim();
  const m=key.match(/^([1-4]?\s?[A-Za-z&; ]+?)\s+(\d+)/);
  const frag=m?(m[1].trim()+" "+m[2]):key;
  const sentences=(d.claim+" "+d.rationale).replace(/–/g,"-").split(/(?<=[.!?])\s+/);
  const hit=sentences.find(s=>s.includes(frag));
  return hit?hit.replace(/-/g,"–"):null;
}

function filtered(){

    (!state.verdict||d.verdict===state.verdict)&&
    (!state.severity||d.severity===state.severity)&&
    (!state.q||(d.title+" "+d.claim+" "+(d.response||"")+" "+(d.rationale||"")+" "+(CATS[d.category]||"")).toLowerCase().includes(state.q))

  if(state.section==="peculiar")return arr.sort((a,b)=>PORDER.indexOf(a.id)-PORDER.indexOf(b.id));

}

const DEFLABEL="How Jehovah's Witnesses answer this — put at its strongest";
const VDESC={"admitted":"The Watchtower's own publications admit these facts. You can make this point from their library alone.","unrefuted":"No good counter-argument has been published by the Watchtower.","contested":"Witness defenders have a real answer here. Say so before your friend does.","answered":"The Witness answer holds up. Do not lead with this one."};
function plainHtml(d){
  const rt=t=>glossify(emphasize(esc(t).replace(/&lt;(\/?)(b|i)&gt;/g,"<$1$2>")));
  let alt=0;
  return (d.plain||[]).map(b=>{
    const ss=splitSentences(b.d),ps=[];
    for(let i=0;i<ss.length;i+=2)ps.push("<p>"+rt(ss.slice(i,i+2).join(" "))+"</p>");
    const t=b.t.toLowerCase();
    const kind=b.say?"k-say"
      :/answer,? at full strength|^their answer|^the .{2,22} answer\b|^how (they|.*s) (answer|explain)|best (defense|answer)|at its strongest|^the (rabbinic|muslim|witness|sceptic|skeptic) (reply|answer)/.test(t)?"k-def"
      :/^how strong|^the rule\b|^where it lands|^the verdict|don't use|do not use/.test(t)?"k-strength"
      :/^why this|^why it|helps you|^what it cost|^what to do instead|^what to say instead|^the takeaway|^why that matters/.test(t)?"k-help"
      :/runs out|problem|^why that is|^where it breaks|^what that misses|^the gap|^why it is wrong|^the trouble|^what it does not/.test(t)?"k-gap"
      :/verse|text|chapter|\bsays\b|passage|record|scripture|evidence|the numbers|what survives|the hadith|manuscript|papyri|inscription/.test(t)?"k-text"
      :/^the claim|^what is taught|^what (they|the book|the movement|the church|the camps) |^what happened|^how it (usually|ended|came out)|objection|^what (you|your|people)|describes|^the story|^what is at stake/.test(t)?"k-claim"
      :"k-plain";
    const big=/(k-text|k-say)/.test(kind)?" k-big":"";
    const cls=kind==="k-plain"?"k-plain a"+(alt++%3):kind;
    return `<div class="pblk ${cls}${b.say?" say":""}${big}"><div class="plab ${cls}">${esc(b.t)}</div>${ps.join("")}</div>`;
  }).join("");
}

      <div class="passcols">

        ${(d.hadith||[]).length?`<div><h6 class="h-bom" style="color:var(--amber)">Watchtower publications</h6><div class="chips" data-side="hadith">${hadithChips}</div></div>`:""}
        ${(d.bible||[]).length?`<div><h6 class="h-bib">Bible</h6><div class="chips" data-side="bib">${chipHtml(d.bible)}</div></div>`:""}
        </div></details>
    </aside>`:"";
  const rel=(RELATED[d.id]||[]).filter(x=>byId[x]);
  $("#main").innerHTML=`
    <div class="backbar">
      <button class="bk" id="back">← ${path?esc(path.name):"All cases"}</button>
      <span style="font-size:.72rem;color:var(--dim)">${idx+1>0?`Case ${idx+1} of ${list.length}`:""} · <kbd>←</kbd>/<kbd>→</kbd> to move</span>
      ${nextInPath?`<button class="pathnext" id="pathnext">Next in path →</button>`:""}
    </div>
    <div class="case">
      <div class="meta"><span class="badge v-${d.verdict}">${VLABEL[d.verdict]} ${info(TIPS.verdict[d.verdict])}</span><span class="tag">${CATS[d.category]} ${info(CATDESC[d.category])}</span><span class="tag">seriousness: ${SEVLABEL[d.severity]} ${info(TIPS.impact)}</span>${d.avoid?`<span class="tag" style="border-color:var(--red);color:var(--red)">⚠ popular claim — do not use it</span>`:d.featured?`<span class="tag" style="border-color:var(--gold);color:var(--gold)">★ strongest evidence ${info(TIPS.strongest)}</span>`:isStrong(d)?`<span class="tag" style="border-color:var(--amber);color:var(--amber)">☆ strong evidence</span>`:""}</div>
      <h2>${esc(d.title)}</h2>
      
      <div class="ctop">
        <div class="claimcol">${(d.plain&&d.plain.length)?`${plainHtml(d)}<details class="claimfull"><summary>The claim, stated in full</summary><div class="claim">${paras(d.claim)}</div></details>`:`<div class="dlab red" style="margin-top:0">The claim</div><div class="claim">${paras(d.claim)}</div>`}<div id="versebox"></div></div>
        ${passages}
      </div>
      ${comp}
      <div class="tabs2">
        <button class="tab2 on" data-pane="pane-case">🛡 Defense & Verdict</button>

        <div class="pair2">
          <div><div class="dlab">The verdict</div><div class="vbox v-${d.verdict}"><div class="verdictline"><b class="vb">${VLABEL[d.verdict]}</b><span class="vmeaning">${esc(VDESC[d.verdict]||"")}</span></div><span>${paras(d.rationale)}</span></div></div>
          <div><div class="dlab">Why this matters</div><div class="why">${paras(WHYMAP[d.category]||"")}<p class="wtail">${esc(WHYTAIL[d.verdict])}</p></div></div>

      <div class="tabpane2" id="pane-src">
        <div class="dlab" style="margin-top:0">Documented by — ${d.sources.length} source${d.sources.length>1?"s":""}</div>

    $("#back").addEventListener("click",()=>{state.view=path?"paths":"overview";state.caseId=null;render();});
  if(nextInPath)$("#pathnext").addEventListener("click",()=>openCase(nextInPath));

  versesReady.then(()=>{
  let pinnedCite=null,hoverTimer=null,scrolling=false,scrollT=null;
  const vbox=()=>$("#versebox");
  const clearVerse=()=>{pinnedCite=null;const b=vbox();if(b)b.innerHTML="";
    document.querySelectorAll(".chip.open,.chip.peek").forEach(x=>x.classList.remove("open","peek"));};
  const sideOf=ch=>ch.closest("[data-side]")?ch.closest("[data-side]").dataset.side:"";
  const buildHtml=(cite,v,side)=>{
    if(!v||!v.verses)
      return '<div class="versebox vmiss"><div class="vr"><span>'+esc(cite)+'</span><button data-close>✕ close</button></div><div class="vwhy">This reference is cited by the claim but isn\'t in the built-in reader — open it in your own Bible.</div></div>';
    const why=findWhy(d,cite);
    const whyHtml=why?"<b>Why it's cited:</b> "+esc(why):ROLENOTE(side);
    const anyHl=v.verses.some(x=>x.hl);
    const hasCtx=anyHl&&v.verses.some(x=>!x.hl);
    const ctx=hasCtx?' <span class="vcited">— '+esc(v.ref)+', with the verses either side</span>'
      :(!anyHl?' <span class="vcited">— '+esc(v.ref)+'</span>':'');
    const body=v.verses.map(x=>{
      const lit=(x.hl||!anyHl);
      const txt=(x.hl&&hasCtx)?"<em>"+esc(x.t)+"</em>":esc(x.t);
      return '<span class="vs'+(lit?" hl":"")+'"><span class="vnum">'+x.v+'</span>'+txt+' </span>';
    }).join("");
    return '<div class="versebox"><div class="vr"><span>'+esc(cite)+ctx+'</span><button data-close>✕ close</button></div><div class="vtext">'+body+'</div><div class="vwhy">'+whyHtml+'</div></div>';
  };
  /* The box opens in place, beside what you pointed at. The old glitch came from it
     opening while the page was scrolling, so the page kept resizing under the cursor.
     Fix: a hover delay, and nothing opens while a scroll is in progress. */
  const openVerse=(ch,pin)=>{
    const box=vbox(); if(!box)return;
    const cite=ch.dataset.cite;
    const host=ch.closest(".pblk, .claim, .defense, .talk, .vbox, .why, .saybox, li, p")
      ||ch.closest(".chips") && ch.closest(".claimside");
    if(host&&host.parentNode&&box.previousElementSibling!==host)host.parentNode.insertBefore(box,host.nextSibling);
    document.querySelectorAll(".chip.open,.chip.peek").forEach(x=>x.classList.remove("open","peek"));
    ch.classList.add(pin?"open":"peek");
    if(pin)pinnedCite=cite;
    box.innerHTML=buildHtml(cite,VERSES[cite],sideOf(ch));
    const cb=box.querySelector("[data-close]");if(cb)cb.addEventListener("click",clearVerse);
    /* the cited verse can sit below three verses of context — bring it into view */
    const inner=box.querySelector(".versebox"),hl=box.querySelector(".vs.hl");
    if(inner&&hl){
      const want=hl.offsetTop-inner.offsetTop-Math.max(0,(inner.clientHeight-hl.offsetHeight)/2);
      inner.scrollTop=Math.max(0,want);
    }
  };
  window.addEventListener("scroll",()=>{scrolling=true;clearTimeout(scrollT);clearTimeout(hoverTimer);
    scrollT=setTimeout(()=>{scrolling=false;},220);},{passive:true});
  /* LIVEREFS: references printed inside prose become openable, like the chips */
  document.querySelectorAll("#main .ref-bib, #main .ref-lds").forEach(r=>{
    const key=r.textContent.replace(/\s+/g," ").trim().replace(/[.,;:]$/,"");
    const hit=VERSES[key]?key:Object.keys(VERSES).find(k=>k.replace(/[\u2013\u2014]/g,"-")===key.replace(/[\u2013\u2014]/g,"-"));
    if(!hit)return;
    r.classList.add("live","chip");r.dataset.cite=hit;
  });
  const canHover=window.matchMedia("(hover:hover)").matches;
  document.querySelectorAll(".chip").forEach(ch=>{
    ch.addEventListener("click",()=>{
      if(ch.dataset.ext){window.open(ch.dataset.ext,"_blank");return;}
      if(pinnedCite===ch.dataset.cite){clearVerse();return;}
      openVerse(ch,true);
    });
    if(!ch.dataset.ext&&canHover){
      ch.addEventListener("mouseenter",()=>{clearTimeout(hoverTimer);
        if(pinnedCite||scrolling)return;
        hoverTimer=setTimeout(()=>{if(!scrolling&&!pinnedCite)openVerse(ch,false);},240);});
      ch.addEventListener("mouseleave",()=>{clearTimeout(hoverTimer);
        if(pinnedCite)return;
        hoverTimer=setTimeout(()=>{if(!pinnedCite)clearVerse();},160);});
    }
  });
  
});
  document.querySelectorAll(".cimg-x").forEach(b=>b.addEventListener("click",e=>{e.stopPropagation();showLightbox(b.dataset.full,b.dataset.cap);}));
  renderNav();renderPreview();
}

/* ---------- paths ---------- */
function renderPaths(){
  const read=store.read;
  $("#main").innerHTML=`<div class="viewhead"><h2>Guided paths</h2><p>Curated routes through the corpus. Progress is saved in your browser; inside a path, each case offers "Next in path."</p></div><div class="pgrid">`+PATHS.map(p=>{
      const done=p.items.filter(i=>read.has(i)).length;
      return `<div class="pathcard">${PATHIMG[p.id]?`<img class="pathimg" src="${PATHIMG[p.id]}" loading="lazy">`:""}<h3>${esc(p.name)}</h3><p class="pd">${esc(p.desc)} · ${p.time} · ${done}/${p.items.length} read</p>
      <ol>${p.items.map(i=>`<li class="${read.has(i)?"done":""}">${esc(byId[i].title)}</li>`).join("")}</ol>
      <button class="start" data-path="${p.id}">${done===0?"Start path":done>=p.items.length?"Revisit path":"Continue path"} →</button></div>`;
    }).join("")+"</div>";
  document.querySelectorAll("[data-path]").forEach(b=>b.addEventListener("click",()=>{
    const p=PATHS.find(x=>x.id===b.dataset.path);state.pathId=p.id;
    const read=store.read;const next=p.items.find(i=>!read.has(i))||p.items[0];
    openCase(next,true);
  }));
}

function renderGlossary(){
  $("#main").innerHTML=`<div class="viewhead"><h2>Word guide</h2><p>${GLOSSARY.length} terms this subject runs on, in plain English — names, books, sources and technical vocabulary. Every one of them is underlined with a dotted line wherever it appears in a case; hover or tap it there for the definition without leaving the page.</p></div><details class="primer" open><summary>New here? The story in ninety seconds</summary><div class="primerbody"><p><b>In 1879 a Pittsburgh haberdasher named Charles Taze Russell began publishing a magazine called <i>Zion's Watch Tower</i>.</b> He taught that Christ had already returned invisibly — in 1874 — and that 1914 would bring the end of the present world order. When 1914 came and brought a world war instead of Armageddon, the date was kept and its meaning was changed: it now marked Christ's invisible enthronement rather than the end.</p>
    <p>His successor <b>Joseph Rutherford</b>, a lawyer, took control after Russell's death in 1916, gave the movement its name in 1931, predicted the resurrection of Abraham, Isaac and Jacob by 1925, and built <b>Beth Sarim</b>, a San Diego mansion deeded to them. Later leaders added 1975. Each failure was absorbed rather than admitted.</p>
    <p><b>The chain that holds everything together runs 607 → 1914 → 1919 → the Governing Body.</b> The organization dates Jerusalem's destruction to 607 BC, adds 2,520 years to reach 1914, and teaches that in 1919 Christ inspected all religions and appointed the Watch Tower Society over his belongings. That appointment is the basis of the Governing Body's authority — and therefore of the blood doctrine, the shunning policy, and the obligation to accept every future adjustment.</p>
    <p>Along the way the organization produced its own Bible, the <b>New World Translation</b>, from an anonymous committee. Names and terms in dotted underline can be hovered anywhere for a definition.</p></div></details>
  <div class="gaccord">${GLOSSARY.map(g=>`<div class="gitem"><b>${esc(g.t)}</b><p>${g.d}</p></div>`).join("")}</div>`;
}

/* ---------- the heart of it ---------- */
function renderCore(){
  const link=id=>byId[id]?`<button class="corelink" data-open="${id}">${esc(byId[id].title)} →</button>`:"";
  $("#main").innerHTML=`<div class="viewhead"><h2>The heart of it: one date holds up everything else</h2>
  <p>If you read nothing else on this site, read this page. Nearly every distinctive Jehovah's Witness doctrine is suspended from a single chain of four links — and the first link is a date that no historian, and no verse, supports.</p></div><figure class="corehero"><img src="https://commons.wikimedia.org/wiki/Special:FilePath/Jehovah's%20witnesses%20Kingdom%20Hall%20Hong%20Kong.png?width=900" loading="lazy" alt=""><figcaption>A Kingdom Hall. Two meetings a week, no cross, and — for most of the people inside — a hope that depends on one date.</figcaption></figure>
  <div class="corebox"><h3>1 · The chain</h3>
  <p><b>607 BC → 1914 → 1919 → the Governing Body.</b> The organization teaches that Jerusalem fell in 607 BC; that 2,520 years from 607 lands on 1914; that Christ returned invisibly in 1914, inspected all religions, and in 1919 appointed the Watchtower Society over his belongings. That 1919 appointment is the entire basis for the Governing Body's authority — and therefore for the blood doctrine, the shunning policy, the two-class salvation system, and the obligation to accept every future adjustment.</p>
  <p>Pull the first link and the whole chain is on the floor. That is why this is the only page you have to read.</p>
  <details class="srcdet"><summary>Open the cases behind this</summary><div class="corelinks" style="margin-top:12px">${link("chron-607-vs-587")}${link("auth-fds-2012-governing-body")}</div></details></div>

  <div class="corebox"><h3>2 · 607 is not in the Bible, and it is not in the ground</h3>
  <p>No verse gives the year. 607 is produced by taking 537 BC — the return from exile — and subtracting the seventy years of Jeremiah 25. Every other line of evidence disagrees: Babylonian business tablets, astronomical diaries dated by eclipses and planetary positions, king lists, and synchronisms with Egyptian and Assyrian records all place the fall of Jerusalem at <b>587/586 BC</b>, twenty years later. There is no scholar of the Neo-Babylonian period defending 607.</p>
  <p>In 1977 a Swedish elder named Carl Olof Jonsson submitted a careful study of exactly this to headquarters. He was disfellowshipped. His research has still never been answered.</p>
  <details class="srcdet"><summary>Open the cases behind this</summary><div class="corelinks" style="margin-top:12px">${link("chron-607-vs-587")}${link("chron-jonsson-gentile-times")}${link("chron-70-years-servitude")}</div></details></div>

  <div class="corebox"><h3>3 · 1914 was not the original claim</h3>
  <p>This is the part almost no Witness has been told. Until 1943 the organization taught that Christ's invisible presence began in <b>1874</b>, not 1914 — and 1914 was published as the year the world would <i>end</i>: <i>“the battle of the great day of God Almighty… will end in A.D. 1914 with the complete overthrow of earth's present rulership”</i> (1889). When 1914 came and the world did not end, the date was kept and its meaning was replaced. A prediction that failed became a fulfilment.</p>
  <details class="srcdet"><summary>Open the cases behind this</summary><div class="corelinks" style="margin-top:12px">${link("dates-1874-1914-retrofit")}${link("dates-generation-1914-redefined")}</div></details></div>

  <div class="corebox"><h3>4 · The question that does the work</h3>
  <p>Do not argue Babylonian chronology at a doorstep. Ask one thing, kindly, and let it sit:</p>
  <p class="pullq">“Is the faithful and discreet slave inspired?”</p>
  <p>Their own publications answer no — the Governing Body has repeatedly said it is neither inspired nor infallible. Then the second question follows on its own: <b>if it isn't inspired, why does disagreeing with it cost me my family?</b> No date, no Greek, no history required. It is the question that has walked more Witnesses to the door than every chronology argument combined.</p>
  <details class="srcdet"><summary>Open the cases behind this</summary><div class="corelinks" style="margin-top:12px">${link("auth-prophet-paradox")}${link("shunning-mechanics-family")}</div></details></div>

  <div class="corebox"><h3>5 · And then the Jesus who is enough</h3>
  <p>Everything above only clears ground. The gospel is what you plant in it. A Witness has spent their life earning a place — hours, returns, studies, the hope of surviving Armageddon and then a thousand-year probation before life is finally secure. Nobody at the Kingdom Hall has ever told them that Jesus is not the archangel but the one at whose name every knee bows, that the Spirit is not a force but the Comforter who lives in them, or that the bread and cup at that Memorial were meant for <i>them</i>.</p>
  <p>Read John 20:28 with them, and 1 John 5:13 — <i>“that ye may know that ye have eternal life.”</i> Not hope. <b>Know.</b> That word is not in their vocabulary, and it is the whole reason to have this conversation at all.</p>
  <p><button class="corelink" data-goto="share">How to actually have this conversation →</button></p></div>`;
  $("#main").querySelectorAll(".corelink").forEach(b=>{if(b.dataset.open)b.addEventListener("click",()=>openCase(b.dataset.open));});
  const g=$("#main").querySelector("[data-goto]");
  if(g)g.addEventListener("click",()=>{state.view="share";render();});
}
function renderShare(){
  $("#main").innerHTML=`<div class="viewhead"><h2>Sharing Jesus with a Jehovah's Witness</h2>
  <p>Not to win the doorstep. To reach a person who has been taught that leaving will cost them their mother. Built from the testimony of former Witnesses and from ministries that have done this for decades, with gentleness (2 Timothy 2:24–25).</p></div><div class="pb-h">Start with what it would cost them</div>
<p class="pd">This is the most important fact on the page. A Witness who leaves is shunned. Not by acquaintances, but by every person they love: parents, brothers and sisters, lifelong friends, and in many cases their own grown children. The Kingdom Hall is their entire community, calendar and family. So a door conversation is never a debate to win. You are asking someone to risk everyone they have. Nothing else you say will land until they believe you understand that.</p>

<div class="pb-h">The invitation to work toward</div>
<div class="saybox"><span class="who">You, once there is real trust</span><p>"Would you read the Gospel of John with me? Just the two of us, in your Bible, with no literature on either side."</p></div>
<p class="pd">This is the ask everything builds to. Witnesses are trained to conduct a study, not to receive one. An offer to read Scripture together as equals is unlike anything else in their week. John is also where the archangel doctrine quietly dies.</p>

<div class="pb-h">What actually reaches a Witness</div>
<p class="pd">Ranked by what ex-Witnesses report.</p>
<div class="pb-grid">
<div class="pb"><span class="num">1</span><h4>A Christian who is still there in a year</h4><p>The organization claims that friendships on the outside are shallow and conditional. A neighbor who keeps showing up, keeps being kind, and never once gloats disproves that without arguing against it. Almost every exit story has one such person in it. The most common regret of ex-Witnesses is that nobody stayed.</p></div>
<div class="pb"><span class="num">2</span><h4>Questions, never lectures</h4><p>Witnesses are drilled against arguments. Every objection you know already has a scripted counter in the <i>Reasoning</i> book. What they have no script for is a sincere question they cannot answer, asked by someone who obviously likes them. Ask it, then let the silence do the work. A question travels home with them. An argument does not.</p></div>
<div class="pb"><span class="num">3</span><h4>Their own literature, in their own hands</h4><p>Never bring <i>apostate</i> material. The moment it appears you stop being a person and become a category. Ask them to look something up in their own library instead. The 1889 statement that 1914 would end the present order. Beth Sarim, in the <i>Proclaimers</i> book. The wording of Hebrews 1:6 before 1971. Watchtower facts, found by a Witness, in a Watchtower publication, cannot be waved off as apostate lies.</p></div>
<div class="pb"><span class="num">4</span><h4>Assurance, which they have never once been offered</h4><p>Ask them: "Do you know that you have eternal life?" They cannot say yes. The honest answer is a hope conditioned on the organization, on Armageddon, and on a thousand-year probation after that. Then read 1 John 5:13 in their own Bible: "that ye may know that ye have eternal life." Many former Witnesses date the start of their exit to that one verse.</p></div>
</div>

<div class="pb-h">The method</div>
<div class="pb-grid">
<div class="pb do"><h4>Use their Bible, always</h4><p>Everything on this site can be shown in the New World Translation. Reaching for your own translation lets them file the whole conversation under <i>he does not trust our Bible</i>, and stop listening. John 20:28, 1 Timothy 2:5, 1 John 5:13 and Hebrews 1:6 all work in theirs. Where the New World Translation differs, do not accuse. Ask what Greek word is behind it, and ask them to check the Kingdom Interlinear.</p></div>
<div class="pb do"><h4>Name the cost out loud, early</h4><p>Say it plainly: "I know that if you ended up agreeing with me, it could cost you your family. I am not asking you to pay that today." That does two things at once. It proves you understand their world. It also puts the shunning policy on the table as something that needs explaining.</p></div>
<div class="pb do"><h4>One question, then change the subject</h4><p>The doorstep is a poor classroom, and a Witness who feels cornered will not come back. Plant one thing, be genuinely warm, and let them leave wanting to return. The people who reach Witnesses are almost never the ones who won the first conversation. They are the ones who got a second, and a tenth.</p></div>
<div class="pb dont"><h4>Never mock the organization to their face</h4><p>To them the Governing Body is the channel God uses, and the Kingdom Hall is their whole life. Contempt for it reads as contempt for them. It also confirms exactly what they have been warned about opposers, and it ends the relationship. Honest questions about the organization are fair. Sneering never is.</p></div>
<div class="pb dont"><h4>Do not open with blood, holidays, or 607</h4><p>Blood is their identity and their martyrdom. Holidays are trivial. The 607 date is a research project. Opening on any of the three wastes the one conversation you may get. Start with who Jesus is, and with whether they can know they are saved. Those two doors lead somewhere.</p></div>
<div class="pb dont"><h4>Do not try to finish it in one sitting</h4><p>Nobody leaves a high-control group in an afternoon. The typical exit takes years and runs through dozens of small doubts. Your job is to be one of them, and to be the safe person they remember when the doubt finally arrives. Play a long game, or do not play.</p></div>
</div>

<div class="pb-h">How it actually goes</div>
<p class="sh-open">Every distinctive doctrine they hold arrives through one channel. Their own publications say that channel is not inspired.</p>
<p class="sh-att">— the paradox at the centre of every conversation on this site.</p>

<div class="sa"><h4 class="sat">The four questions that do the most work</h4>
<ol class="sh-list">
<li><b>Is the slave inspired?</b> Ask it in their words: "Is the faithful and discreet slave inspired?" Their own publications answer no. Then ask, gently, why disagreeing with something uninspired is grounds for losing your family. This needs no history, no Greek and no chronology. There is no scripted answer for it.</li>
<li><b>Do you know you have eternal life?</b> Read 1 John 5:13 in their Bible and let the word <i>know</i> sit there. Their whole system runs on a hope conditioned on performance. Assurance is the one thing the Kingdom Hall cannot give them.</li>
<li><b>Why did you pass the cup?</b> Ask it after the Memorial, when they have just watched the emblems go by untouched: "Jesus said drink ye all of it — why did you pass the cup?" Then 1 Timothy 2:5 follows naturally. Is Christ their mediator, or only the mediator of the other class?</li>
<li><b>What did Jesus say to Thomas?</b> Ask: "What did Jesus say when Thomas called him my Lord and my God?" He accepted it. Then open Hebrews 1:6, and ask what that verse said before 1971. Two verses, both in their own Bible, and the archangel doctrine has nowhere left to stand.</li>
</ol></div>

<div class="sa"><h4 class="sat">If they are already doubting</h4>
<p class="pd">A Witness who has begun to doubt is in real danger. They can lose their marriage, their parents and their whole social world in one week. Do not celebrate it. Do not push. Do not tell anyone. Offer three things instead. That you will still be there whatever they decide. That they can ask you anything without it turning into a project. And that the God of the Bible is not the God of the audit. Point them to the ex-Witness support communities for the practical side. You carry the gospel side.</p></div>

<div class="sa"><h4 class="sat">Start here</h4>
<p class="pd">The <b>foundation path</b> walks the one chain everything else hangs from. Every case page ends with a suggested question and a scripted back-and-forth, so you are ready for the counter-moves.</p>
<button class="start" data-goto-path="foundation">Open the foundation path →</button></div>${DATA.some(d=>d.avoid)?`<div class="pb-h" style="margin-top:30px">Arguments that will embarrass you — do not use these</div><p class="pd" style="font-size:.8rem;margin:0 0 10px">Popular claims that are false or overclaimed. Each links to the correction — repeating them hands the other side an easy win and discredits your true arguments.</p><div class="relrow">${DATA.filter(d=>d.avoid).map(d=>`<button data-open="${d.id}">⚠ ${esc(d.title)}</button>`).join("")}</div>`:""}`;
  const b=$("#main").querySelector("[data-goto-path]");
  if(b)b.addEventListener("click",()=>{const p=PATHS.find(x=>x.id===b.dataset.gotoPath);if(!p)return;state.pathId=p.id;const read=store.read;const next=p.items.find(i=>!read.has(i))||p.items[0];openCase(next,true);});
  bindOpens();
}

const PROOFS=[{"v":"John 14:28 — 'the Father is greater than I'","they":"Jesus plainly says the Father is greater, so Jesus cannot be God or equal to him.","you":"'Greater' describes position, not nature — a king is greater than his ambassador without being more human. Jesus speaks during his voluntary humbling, having 'emptied himself' to become man (Philippians 2:6-7), and the same Gospel opens with 'the Word was God' and closes with Thomas saying 'my Lord and my God' — unrebuked. The verse compares the Son on earth with the Father in glory, which is why Jesus is talking about *returning* to that glory (John 17:5).","refs":"John 1:1-3 · John 17:5 · John 20:28 · Philippians 2:6-11 · Hebrews 1:3"},{"v":"Colossians 1:15 — 'the firstborn of all creation'","they":"Firstborn means first-created: Jesus is God's first and greatest creature, who then made everything else.","you":"'Firstborn' (prototokos) is a title of rank: David, the youngest son, is 'appointed firstborn' (Psalm 89:27), and Israel is God's 'firstborn' among nations it didn't precede. The context settles it — 'ALL things were created in him... through him and for him' (v.16) and 'he is before all things' (v.17). The New World Translation had to insert the word 'other' four times ('all other things') — unbracketed in 1950, bracketed 1961-1984, unbracketed again in 2013 — because without it the passage teaches exactly what they deny.","refs":"Colossians 1:16-17 · Psalm 89:27 · Exodus 4:22 · John 1:3 · Hebrews 1:2"},{"v":"Revelation 7:4 — the 144,000","they":"Exactly 144,000 anointed ones go to heaven to rule with Christ; the 'great crowd' of verse 9 lives forever on earth.","you":"Read the whole passage: the 144,000 are also male virgins (14:4) from twelve named tribes of Israel — a list that oddly omits Dan and doubles Joseph, a signal of symbolism. Nobody takes the tribes, the maleness, or the celibacy literally; only the number, because the two-class system needs it. Meanwhile the great crowd stands 'before the throne' serving 'in his temple' (naos — the heavenly sanctuary, 7:15), and Revelation 19:1 explicitly locates 'a great crowd IN HEAVEN.'","refs":"Revelation 7:9,15 · Revelation 14:1-4 · Revelation 19:1 · John 10:16 · Ephesians 4:4 — one hope"},{"v":"Psalm 83:18 — 'whose name alone is JEHOVAH' (KJV)","they":"God's personal name is Jehovah, and true worshippers must use it — churches hid it.","you":"Using God's revealed name is wonderful — 'Jehovah' itself is a 16th-century hybrid of the Hebrew consonants YHWH with the vowels of 'Adonai,' so their 'restored' name is itself a later convention ('Yahweh' is closer). The decisive fact is the New Testament: not one of the 5,000+ Greek manuscripts contains the divine name, yet the NWT inserts 'Jehovah' 237 times — including Romans 10:13, where 'everyone who calls on the name of the Lord' quotes Joel about YHWH and applies it to *Jesus*. The apostles' inspired practice, not Christendom's conspiracy, is what the manuscripts preserve.","refs":"Romans 10:9-13 · Joel 2:32 · Philippians 2:9-11 · Acts 4:12"},{"v":"John 17:3 — 'taking in knowledge' (old NWT)","they":"Everlasting life depends on taking in accurate knowledge of Jehovah — which means studying with Jehovah's organization.","you":"The Greek verb ginōskō means to *know someone personally*, not to absorb information — which is why the Watchtower's own 2013 revision quietly changed it to 'their coming to know you.' For six decades the old rendering turned eternal life into a curriculum; the correction concedes the point: eternal life is a relationship, not a study program. Jesus says in the same Gospel, 'you refuse to come to ME that you may have life' (John 5:39-40).","refs":"John 5:39-40 · Matthew 7:22-23 — 'I never knew you' · Philippians 3:8-10 · NWT 2013 John 17:3"},{"v":"Acts 15:28-29 — 'abstain... from blood'","they":"God's law from Noah onward forbids taking blood into the body; transfusion is a modern way of consuming blood.","you":"The decree addresses eating blood — the issue in Genesis 9 and Leviticus 17 and the flashpoint of Jewish-Gentile table fellowship, the actual context of Acts 15. A transfusion no more 'eats' blood than a heart transplant eats a heart; blood transfused stays blood and functions as an organ. Their own position concedes incoherence: since June 2000, fractions of *every* blood component — hemoglobin included — are permitted as conscience matters. And Jesus' rule for ceremonial law versus human life is explicit: 'the Sabbath was made for man, not man for the Sabbath.'","refs":"Leviticus 17:10-12 — 'eats blood' · Mark 2:23-27 · Matthew 12:7 — 'mercy, not sacrifice' · Watchtower June 15, 2000 (fractions)"},{"v":"Daniel 4 — the 'seven times' and 1914","they":"The tree dream's 'seven times' prophetically equals 2,520 years from Jerusalem's fall in 607 BCE, ending in October 1914 when Christ was enthroned in heaven.","you":"Daniel 4 interprets itself: 'it is you, O king' (v.22) — Nebuchadnezzar's seven times of madness, fulfilled in his own lifetime (v.34-37), with no hint of a second fulfillment. The calculation needs five unstated moves: seven 'times' become 360-day years (2,520 days); a day-for-a-year rule imported from unrelated passages turns them into 2,520 years; the start date is set at 607 BCE, which every Babylonian chronology source (business tablets, the astronomical diary VAT 4956) and every historian contradicts — Jerusalem fell in 587/586; and the endpoint is an invisible event no one could verify. Tellingly, Russell inherited this same math from Nelson Barbour and preached 1914 as the END of earthly governments — when that failed, the date was kept and its meaning replaced.","refs":"Daniel 4:20-27, 34-37 · Acts 1:6-7 — 'not for you to know times' · Matthew 24:26 — inner rooms warning · 587/586 BCE scholarly consensus"}];
