<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Challenging Beliefs">
<meta property="og:title" content="Jehovah's Witnesses vs. the Bible — Challenging Beliefs">
<meta property="og:description" content="50 documented cases — verdicts, sources, and scripted conversations for every one.">
<meta property="og:url" content="https://masonwallace.github.io/challenging-beliefs/jw/">
<meta property="og:image" content="https://commons.wikimedia.org/wiki/Special:FilePath/The%20Great%20Isaiah%20Scroll%20MS%20A%20(1QIsa)%20-%20Google%20Art%20Project.jpg?width=1200">
<meta name="twitter:card" content="summary_large_image">
<meta name="description" content="50 documented cases — verdicts, sources, and scripted conversations for every one.">
<title>Challenging Beliefs — Jehovah's Witnesses, Examined Against the Bible</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --bg:#0f1116; --side:#0b0d11; --panel:#161a21; --panel2:#12151b; --line:#232833; --line2:#2b313d;
    --ink:#e7e9ec; --muted:#98a0ac; --dim:#565e6b; --gold:#82b1d8; --gold-ink:#0e1116;
    --red:#e0736a; --red-bg:#38221f; --red-cell:#5e2b27; --red-cell-hi:#8a3a32;
    --amber:#cf9a45; --amber-bg:#332a18; --amber-cell:#54431f; --amber-cell-hi:#7d6224;
    --green:#7fb08d; --green-bg:#1d2c26; --green-cell:#27443a;
    --purp:#b394e0; --purp-bg:#2c2440;
    --serif:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif;
    --sans:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  }
  :root[data-theme="light"]{
    --bg:#f3f4f6; --side:#e9ebee; --panel:#ffffff; --panel2:#f7f8fa; --line:#dfe2e7; --line2:#cfd4db;
    --ink:#1b1e23; --muted:#5c6470; --dim:#9aa1ab; --gold:#2f6b9e; --gold-ink:#ffffff;
    --red:#b03a31; --red-bg:#f6e4e2; --red-cell:#e7b6b1; --red-cell-hi:#cc766d;
    --amber:#8a5f0e; --amber-bg:#f3ecd9; --amber-cell:#e4d1a2; --amber-cell-hi:#c6a75e;
    --green:#3e7455; --green-bg:#e3ede6; --green-cell:#b7d1bf;
    --purp:#6b4fa1; --purp-bg:#ece5f6;
  }
  *{box-sizing:border-box}
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6}
  a{color:var(--gold)}
  button{font-family:inherit}
  mark{background:color-mix(in srgb,var(--amber) 30%,transparent);color:inherit;border-radius:2px;padding:0 2px}
  kbd{font-family:var(--mono);font-size:.72rem;background:var(--panel);border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;padding:1px 6px;color:var(--muted)}

  .app{display:grid;grid-template-columns:216px minmax(0,1fr) 280px;min-height:100vh}
  @media (max-width:1020px){.app{grid-template-columns:216px minmax(0,1fr)}.preview{display:none}}
  @media (max-width:720px){.app{grid-template-columns:1fr}.side{position:sticky;top:0;z-index:40;height:auto;border-right:0;border-bottom:1px solid var(--line)}
    .side .nav{display:flex;flex-wrap:wrap;gap:2px;padding:0 10px 10px}.side .nav h5{display:none}.side .sideprog{display:none}}

  /* sidebar */
  .side{background:var(--side);border-right:1px solid var(--line);padding:18px 0;position:sticky;top:0;height:100vh;overflow-y:auto}
  @media (max-width:720px){.side{height:auto;overflow:visible}}
  .logo{font-family:var(--serif);font-size:1rem;letter-spacing:.1em;padding:0 18px 14px;color:var(--ink)}
  .logo b{color:var(--gold)}
  .sidesearch{padding:0 14px 12px}
  .sidesearch input{width:100%;font-family:inherit;font-size:.82rem;padding:7px 12px;border-radius:8px;border:1px solid var(--line2);background:var(--panel);color:var(--ink)}
  .sidesearch input:focus{outline:2px solid var(--gold);outline-offset:1px}
  .info{display:inline-grid;place-items:center;width:14px;height:14px;border:1px solid currentColor;border-radius:50%;font-size:.58rem;font-style:normal;font-weight:700;opacity:.75;cursor:help;position:relative;flex:none}
  .info:hover,.info:focus{opacity:1}
  .info .tip{display:none;position:absolute;left:50%;transform:translateX(-50%);top:160%;width:250px;background:var(--side);color:var(--ink);border:1px solid var(--line2);font-family:var(--sans);font-size:.76rem;line-height:1.5;padding:9px 12px;border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.35);z-index:30;text-transform:none;letter-spacing:0;font-weight:400;text-align:left}
  .info:hover .tip,.info:focus .tip{display:block}
  .badge,.tag{display:inline-flex;align-items:center;gap:5px}
  .nav a{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 18px;font-size:.86rem;color:var(--muted);text-decoration:none;cursor:pointer;border-left:2px solid transparent}
  .nav a:hover{background:var(--panel2);color:var(--ink)}
  .nav a.on{background:var(--panel);color:var(--ink);border-left-color:var(--gold)}
  .nav .cnt{font-family:var(--mono);font-size:.68rem;color:var(--dim)}
  .nav h5{font-size:.64rem;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin:18px 18px 6px;font-weight:600}
  .sideprog{margin:22px 18px 8px;font-size:.72rem;color:var(--muted)}
  .pbar{height:4px;background:var(--line);border-radius:2px;margin-top:6px;overflow:hidden}
  .pbar i{display:block;height:100%;background:var(--gold);transition:width .4s ease}

  /* main */
  .main{padding:18px 26px 80px;min-width:0}
  .cmd{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line2);border-radius:8px;padding:4px 8px 4px 14px;margin-bottom:18px}
  .cmd input{flex:1;background:none;border:0;color:var(--ink);font-family:inherit;font-size:.9rem;padding:7px 0;outline:none}
  .cmd input::placeholder{color:var(--dim)}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:20px}
  .tile{background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:12px 14px;cursor:pointer;text-align:left;color:var(--ink)}
  .tile:hover{border-color:var(--gold)}
  .tile.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
  .tile .v{font-family:var(--serif);font-size:1.7rem;font-variant-numeric:tabular-nums;line-height:1.1}
  .tile .l{font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:2px}
  .tile.t-ad .v{color:var(--purp)}.tile.t-un .v{color:var(--red)}.tile.t-co .v{color:var(--amber)}.tile.t-an .v{color:var(--green)}
  h4.bt{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;font-weight:600}
  .vwall{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:10px;align-items:start}
  @media (max-width:1240px){.vwall{grid-template-columns:1fr 1fr}}
  @media (max-width:700px){.vwall{grid-template-columns:1fr}}
  .vcol{background:var(--panel2);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .vcol header{padding:14px 16px 12px;border-bottom:2px solid var(--line)}
  .vcol.ad header{border-bottom-color:var(--purp)}
  .vcol.ad .n,.vcol.ad .t{color:var(--purp)}
  .vcol.ad .vt:hover{border-left-color:var(--purp)}
  .vcol.un header{border-bottom-color:var(--red)}
  .vcol.co header{border-bottom-color:var(--amber)}
  .vcol.an header{border-bottom-color:var(--green)}
  .vcol header .n{font-family:var(--serif);font-size:1.9rem;line-height:1;font-variant-numeric:tabular-nums}
  .vcol.un .n{color:var(--red)}.vcol.co .n{color:var(--amber)}.vcol.an .n{color:var(--green)}
  .vcol header .t{font-size:.72rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;margin-left:8px}
  .vcol.un .t{color:var(--red)}.vcol.co .t{color:var(--amber)}.vcol.an .t{color:var(--green)}
  .vcol header .d{font-size:.74rem;color:var(--muted);margin-top:4px}
  .vgroup h6{font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:0;padding:10px 16px 4px;font-weight:600}
  .vt{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:9px 16px 9px 13px;cursor:pointer;color:var(--ink);border-left:3px solid transparent}
  .vt:hover,.vt.sel{background:var(--panel)}
  .vt.sel{border-left-color:var(--gold)}
  .vcol.un .vt:hover{border-left-color:var(--red)}
  .vcol.co .vt:hover{border-left-color:var(--amber)}
  .vcol.an .vt:hover{border-left-color:var(--green)}
  .vt.dimmed{opacity:.25}
  .vt h5{font-family:var(--serif);font-weight:500;font-size:.92rem;line-height:1.35;margin:0}
  .vt .m{font-size:.66rem;color:var(--dim);letter-spacing:.05em;text-transform:uppercase;margin-top:2px;display:flex;gap:8px;align-items:center}
  .vt .m .rd{color:var(--green)}
  .vt .m .star{color:var(--gold)}

  /* list */
  .rows{display:flex;flex-direction:column}
  .rowitem{display:grid;grid-template-columns:12px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:11px 6px;cursor:pointer;color:var(--ink)}
  .rowitem:hover,.rowitem.sel{background:var(--panel2)}
  .rowitem .stripe{width:4px;height:26px;border-radius:2px}
  .rowitem.v-unrefuted .stripe{background:var(--red)}
  .rowitem.v-contested .stripe{background:var(--amber)}
  .rowitem.v-answered .stripe{background:var(--green)}
  .rowitem h5{font-family:var(--serif);font-weight:500;font-size:1rem;margin:0;line-height:1.35}
  .rowitem .sub{font-size:.72rem;color:var(--muted)}
  .rowitem .meta{display:flex;gap:8px;align-items:center;font-size:.66rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;white-space:nowrap}
  .rowitem .meta .rd{color:var(--green)}

  .badge{font-size:.64rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:3px 9px;border-radius:999px;display:inline-block}
  .badge.v-admitted{background:var(--purp-bg);color:var(--purp)}
  .badge.v-unrefuted{background:var(--red-bg);color:var(--red)}
  .badge.v-contested{background:var(--amber-bg);color:var(--amber)}
  .badge.v-answered{background:var(--green-bg);color:var(--green)}
  .tag{font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line2);border-radius:999px;padding:2px 9px;display:inline-block}

  /* case view */
  .backbar{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
  .backbar button.bk{background:var(--panel);border:1px solid var(--line2);color:var(--muted);border-radius:8px;padding:6px 13px;font-size:.8rem;cursor:pointer}
  .backbar button.bk:hover{color:var(--ink);border-color:var(--gold)}
  .pathnext{margin-left:auto;background:var(--gold);color:var(--gold-ink);border:0;border-radius:8px;padding:7px 14px;font-size:.8rem;font-weight:700;cursor:pointer}
  .case h2{font-family:var(--serif);font-weight:500;font-size:1.6rem;line-height:1.25;margin:10px 0 14px;max-width:30ch;text-wrap:balance}
  .case .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
  .dlab{font-size:.7rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:26px 0 10px}
  .dlab.red{color:var(--red)}.dlab.blue{color:var(--gold)}
  .claimrow{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(270px,1fr);gap:28px;align-items:start}
  .claimrow.solo{grid-template-columns:1fr}
  @media (max-width:900px){.claimrow{grid-template-columns:1fr}}
  .claim p{font-size:.97rem;line-height:1.75;max-width:66ch;margin:0 0 12px}
  .claimside{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:16px 18px;position:sticky;top:16px}
  .claimside .passcols{grid-template-columns:1fr;gap:12px}
  .claimside .sidenote{font-size:.76rem;color:var(--dim);margin:-4px 0 12px}
  .defense p.lead{margin:0 0 4px}
  .defense p{line-height:1.7;margin:0 0 10px}
  .pts{margin:8px 0 0;padding:0;list-style:none;counter-reset:pt}
  .pts li{position:relative;padding:10px 0 10px 36px;border-top:1px dashed color-mix(in srgb,var(--green) 25%,var(--line));line-height:1.7}
  .pts li:first-child{border-top:0}
  .pts li::before{counter-increment:pt;content:counter(pt);position:absolute;left:0;top:10px;width:23px;height:23px;border-radius:50%;background:var(--green-bg);color:var(--green);display:grid;place-items:center;font-size:.72rem;font-weight:700}
  .vbox p{margin:0 0 8px;line-height:1.7}
  .vbox p:last-child{margin-bottom:0}
  .ref-lds{color:var(--red);font-weight:600}
  .ref-bib{color:var(--gold);font-weight:600}
  .qq{font-family:var(--serif);font-style:italic;background:color-mix(in srgb,var(--amber) 16%,transparent);border-radius:3px;padding:0 3px}
  .kw{font-weight:700;text-decoration:underline;text-underline-offset:2px}
  .talk{background:color-mix(in srgb,var(--green) 8%,var(--panel));border:1px solid color-mix(in srgb,var(--green) 30%,var(--line));border-radius:8px;padding:16px 18px;font-size:.93rem;max-width:80ch}
  .talk p{margin:0 0 8px;line-height:1.7}
  .talk p:last-child{margin-bottom:0}
  .dlg{display:flex;flex-direction:column;gap:10px;max-width:76ch}
  .dlg .msg{border-radius:12px;padding:12px 16px;max-width:88%}
  .dlg .msg p{margin:0;font-size:.9rem;line-height:1.65}
  .dlg .who{display:block;font-size:.64rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin-bottom:4px}
  .dlg .them{align-self:flex-start;background:var(--panel);border:1px solid var(--line2);border-bottom-left-radius:4px}
  .dlg .them .who{color:var(--red)}
  .dlg .you{align-self:flex-end;background:color-mix(in srgb,var(--green) 9%,var(--panel));border:1px solid color-mix(in srgb,var(--green) 30%,var(--line));border-bottom-right-radius:4px}
  .dlg .you .who{color:var(--green)}
  .corelinks{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .corelink{font-size:.78rem;background:var(--panel2);border:1px solid var(--line2);color:var(--gold);border-radius:999px;padding:5px 13px;cursor:pointer;text-align:left}
  .corelink:hover{border-color:var(--gold)}
  .gtab{width:100%;border-collapse:collapse;font-size:.86rem;margin:14px 0 6px}
  .gtab th{text-align:left;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:8px 12px;border-bottom:2px solid var(--line2)}
  .gtab th:nth-child(2){color:var(--red)}
  .gtab th:nth-child(3){color:var(--gold)}
  .gtab td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.55}
  .gtab td:first-child{font-weight:700;white-space:nowrap;color:var(--muted)}
  .dodont{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media (max-width:700px){.dodont{grid-template-columns:1fr}}
  .dodont ul{margin:8px 0 0;padding-left:18px;font-size:.86rem;color:var(--muted)}
  .dodont li{padding:3px 0;line-height:1.55}
  .why{background:color-mix(in srgb,var(--gold) 7%,var(--panel));border:1px solid color-mix(in srgb,var(--gold) 28%,var(--line));border-radius:8px;padding:16px 18px;font-size:.93rem;max-width:80ch}
  .why p{margin:0 0 10px;line-height:1.7}
  .why .wtail{color:var(--muted);font-style:italic;margin-bottom:0;border-top:1px dashed color-mix(in srgb,var(--gold) 30%,var(--line));padding-top:10px}
  .compare2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media (max-width:760px){.compare2{grid-template-columns:1fr}}
  .pane{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
  .pane .ref{font-size:.7rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
  .pane.bom .ref{color:var(--red)}.pane.bible .ref{color:var(--gold)}
  .pane .scripture{font-family:var(--serif);font-size:1rem;line-height:1.65}
  .cnote{font-size:.8rem;color:var(--muted);margin-top:8px;max-width:80ch}
  .passcols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media (max-width:760px){.passcols{grid-template-columns:1fr}}
  .passcols h6{font-size:.68rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin:0 0 8px}
  .passcols .h-bom{color:var(--red)}.passcols .h-bib{color:var(--gold)}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{font-size:.78rem;font-family:var(--serif);border:1px solid var(--line2);background:var(--panel);border-radius:6px;padding:4px 10px;cursor:pointer;color:var(--ink)}
  .chip:hover{border-color:var(--gold)}
  .chip.open{background:var(--amber-bg);border-color:var(--gold)}
  .chip.ext::after{content:" ↗";color:var(--muted);font-family:var(--sans);font-size:.68rem}
  .versebox{grid-column:1/-1;background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:8px;padding:14px 18px;margin-top:4px}
  .versebox .vr{font-size:.7rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-bottom:8px;display:flex;justify-content:space-between}
  .versebox .vr button{background:none;border:0;color:var(--muted);cursor:pointer;font-size:.8rem}
  .versebox .vtext{font-family:var(--serif);font-size:.98rem;line-height:1.7;max-width:72ch}
  .versebox .vnum{font-family:var(--sans);font-size:.62rem;color:var(--muted);vertical-align:super;margin-right:3px}
  .versebox .vwhy{margin-top:10px;font-size:.8rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px;max-width:76ch}
  .versebox .vwhy b{color:var(--gold)}
  .srcdet{margin-top:30px;border-top:1px solid var(--line);padding-top:14px}
  .srcdet summary{font-size:.74rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);cursor:pointer;list-style:none}
  .srcdet summary::before{content:"▸ ";color:var(--gold)}
  .srcdet[open] summary::before{content:"▾ "}
  .srcdet .srcs{margin-top:12px}
  .app.reading{grid-template-columns:216px minmax(0,1fr)}
  .app.reading .preview{display:none}
  body:has(.app.reading) .keysbar{right:0}
  .srcs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
  .srcs li{display:flex;gap:9px;align-items:baseline;font-size:.85rem}
  .sb{flex:none;font-size:.6rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;border-radius:4px;padding:2px 7px;position:relative;top:-1px}
  .sb-scholarly{background:var(--green-bg);color:var(--green)}
  .sb-apologetics{background:var(--amber-bg);color:var(--amber)}
  .sb-primary,.sb-institutional{background:color-mix(in srgb,var(--gold) 16%,transparent);color:var(--gold)}
  .sb-journalism{background:var(--panel);color:var(--muted);border:1px solid var(--line2)}
  .sb-testimony{background:var(--red-bg);color:var(--red)}
  .defense{background:color-mix(in srgb,var(--green) 7%,var(--panel));border:1px solid color-mix(in srgb,var(--green) 30%,var(--line));border-radius:8px;padding:16px 18px;font-size:.92rem;max-width:80ch}
  .defense .dsrc{font-size:.78rem;color:var(--muted);margin-top:10px}
  .vbox{display:flex;gap:12px;align-items:flex-start;border-radius:8px;padding:16px 18px;font-size:.92rem;max-width:80ch}
  .vbox.v-admitted{background:var(--purp-bg)}.vbox.v-unrefuted{background:var(--red-bg)}.vbox.v-contested{background:var(--amber-bg)}.vbox.v-answered{background:var(--green-bg)}
  .vbox b.vb{flex:none;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;padding-top:3px}
  .vbox.v-admitted b.vb{color:var(--purp)}.vbox.v-unrefuted b.vb{color:var(--red)}.vbox.v-contested b.vb{color:var(--amber)}.vbox.v-answered b.vb{color:var(--green)}
  .relrow{display:flex;gap:8px;flex-wrap:wrap}
  .relrow button{font-size:.78rem;background:var(--panel);border:1px solid var(--line2);color:var(--ink);border-radius:999px;padding:5px 13px;cursor:pointer}
  .relrow button:hover{border-color:var(--gold);color:var(--gold)}
  .pinbtn{background:none;border:1px dashed var(--line2);color:var(--muted);border-radius:8px;padding:7px 14px;font-size:.8rem;cursor:pointer}

  /* --- plain-first case view --- */

  .pblk:nth-child(3) .plab{color:var(--amber)}

    border-left:3px solid var(--green);border-radius:0 10px 10px 0;padding:13px 17px;margin-top:18px}

  .pblk.say p{color:var(--ink);font-family:var(--serif);font-size:1.04rem;line-height:1.6}
  details.fullcase{margin-top:22px;border-top:1px solid var(--line);padding-top:14px}
  details.fullcase>summary{cursor:pointer;list-style:none;font-size:.74rem;font-weight:700;letter-spacing:.12em;
    text-transform:uppercase;color:var(--acc);padding:4px 0}
  details.fullcase>summary::-webkit-details-marker{display:none}
  details.fullcase>summary::after{content:" →";transition:margin-left .2s}

    background:none;border:0;cursor:pointer;padding:4px 0;margin-bottom:12px;font-family:inherit}

</style>

<script>
const DATA=[
{"id":"nwt-john-1-1-a-god","title":"John 1:1 — 'the Word was a god'","category":"nwt-translation","claim":"The New World Translation renders John 1:1c 'and the Word was a god,' against virtually every major English translation (KJV, NIV, ESV, NASB, NRSV, even the Catholic NAB), which all read 'the Word was God.' Bruce Metzger of Princeton called it 'a frightful mistranslation' — 'erroneous,' 'pernicious,' 'reprehensible' (Theology Today, April 1953). The rendering serves the Watchtower's denial of Christ's deity, yet it creates a problem their own theology can't absorb: if the Word is 'a god' alongside Jehovah, the NWT teaches a second, lesser god — while Jehovah says 'before me there was no God formed, and after me there continued to be none' (NWT Isaiah 43:10). Watchtower literature defends the rendering by citing the absence of the Greek definite article before theos, and by appealing to a handful of obscure translations. The indefinite rendering also collides with John's own usage: anarthrous theos appears in John 1:6, 12, 13, 18, where the NWT renders 'God.'","wt":["NWT John 1:1","The Kingdom Interlinear Translation of the Greek Scriptures (1985), Appendix 2A","Should You Believe in the Trinity? (1989), pp. 26-28","jw.org, 'John 1:1—In the Beginning Was the Word'"],"bible":["John 1:1","John 1:18","John 20:28","Isaiah 43:10","Isaiah 44:6","Deuteronomy 32:39"],"sources":[{"name":"Bruce Metzger, 'The Jehovah's Witnesses and Jesus Christ' (Theology Today, 1953)","type":"scholarly","url":"https://www.bible-researcher.com/metzger.jw.html"},{"name":"CRI — John 1:1 and the New World Translation","type":"apologetics","url":"https://www.equip.org/articles/john-11-and-the-new-world-translation/"},{"name":"CRI — Jehovah's Witnesses and John 1:1: New Evidence Advances the Discussion","type":"apologetics","url":"https://www.equip.org/articles/jehovahs-witnesses-john-11-new-evidence-advances-discussion/"},{"name":"JW.org — John 1:1 explanation","type":"watchtower","url":"https://www.jw.org/en/bible-teachings/bible-verses/john-1-1/"},{"name":"BeDuhn, Truth in Translation (2003)","type":"scholarly","url":"https://www.goodreads.com/en/book/show/764823.Truth_in_Translation"}],"response":"Jason BeDuhn — a non-Witness academic — argues in Truth in Translation that the anarthrous predicate theos is grammatically indefinite or qualitative, that 'a god' or 'divine' is a defensible rendering, and that 'the Word was God' actually over-translates the Greek. Colwell's Rule, long cited against the NWT, is not a real rule of Greek grammar requiring definiteness, and even Daniel Wallace concedes conservative scholars misapplied it. Philip Harner's 1973 JBL study showed the construction is primarily qualitative — the Word has God's nature — which the Watchtower says its rendering captures without collapsing the Word into the Father, whom John distinguishes in the same verse ('the Word was with God').","responseSource":{"name":"JW.org — 'Is Jesus God?' / John 1:1 article","url":"https://www.jw.org/en/bible-teachings/bible-verses/john-1-1/"},"verdict":"contested","rationale":"Grade this honestly: the overwhelming majority of Greek scholars reject 'a god,' but the classic refutation (Colwell's Rule) is itself defective, and one credentialed non-JW scholar substantially defends the NWT here. Harner's qualitative reading — 'what God was, the Word was' (NEB) — is where scholarship actually landed, and it refutes Watchtower theology (the Word fully shares God's nature) without hanging on an article. In conversation, don't fight the grammar; grant the ambiguity and press Isaiah 43:10 in their own Bible: is Jesus a true god or a false god? Their theology has no third option.","severity":"high","context":"John's Gospel opens: 'In the beginning was the Word, and the Word was with God, and the Word was God.' The New World Translation renders the last phrase 'the Word was a god' — which turns a statement that Jesus is God into a statement that he is a lesser divine being. The argument is about Greek grammar and a missing definite article, and this case walks through it in plain terms.","quran":[],"hadith":["NWT John 1:1","The Kingdom Interlinear Translation of the Greek Scriptures (1985), Appendix 2A","Should You Believe in the Trinity? (1989), pp. 26-28","jw.org, 'John 1:1—In the Beginning Was the Word'"]},
{"id":"nwt-colossians-other-inserted","title":"Colossians 1:16-17 — 'other' inserted four times","category":"nwt-translation","claim":"In Colossians 1:16-17 (and v. 20) the NWT inserts the word 'other' — 'by means of him all other things were created... he is before all other things' — though 'other' (Greek allos/heteros) appears nowhere in these verses in any manuscript. Paul's point is that Christ created all things, full stop; inserting 'other' converts the passage into evidence that Christ is himself a created thing who then made the rest — precisely Watchtower doctrine. The editorial history is damning: the 1950 edition printed 'other' with no brackets; after criticism, later editions bracketed it ('all [other] things') to mark it as an addition; the 2013 revision removed the brackets again, so current readers cannot see the word is not in the Greek. The same maneuver is not applied at Romans 8:38-39 or John 1:3, where 'all things' is left alone — the insertion appears exactly where Christology is at stake.","wt":["NWT Colossians 1:16-17, 20 (1950, 1984 Reference, 2013 editions)","The Kingdom Interlinear Translation of the Greek Scriptures (1985), Colossians 1:16-17","Reasoning From the Scriptures (1985), pp. 408-409"],"bible":["Colossians 1:15-20","John 1:3","Hebrews 1:2","Isaiah 44:24"],"sources":[{"name":"CARM — Colossians 1:16-17 and 'all other things'","type":"apologetics","url":"https://carm.org/jehovahs-witnesses/col-116-17-all-other-things-were-created-by-him-and-the-jehovahs-witnesses/"},{"name":"Wikipedia — New World Translation (textual criticism section)","type":"institutional","url":"https://en.wikipedia.org/wiki/New_World_Translation"},{"name":"Evidence Unseen — 'All things' or 'all other things'","type":"apologetics","url":"https://www.evidenceunseen.com/bible-difficulties-2/nt-difficulties/1-2-thessalonians/col-116-all-things-or-all-other-things/"},{"name":"NWT Defended blog — Colossians 1:16 (JW-side defense)","type":"apologetics","url":"http://newworldtranslation.blogspot.com/2020/07/colossians-116-all-other-things-and-new.html"}],"response":"Defenders note that Greek panta ('all things') can idiomatically imply 'all other' — even the NIV renders Luke 13:2 'all the other Galileans' and Luke 21:29 'all the other trees' where 'other' is absent in Greek. Since Paul has just called Christ 'the firstborn of all creation' (1:15), the committee reasoned that 'other' merely makes explicit what the context implies: the firstborn is part of creation, so what he created is everything else. Translation always involves supplying implied words; the brackets were dropped in 2013 as part of a general move away from bracketing implied terms, not to deceive.","responseSource":{"name":"NWT Defended — Colossians 1:16 'all other things'","url":"http://newworldtranslation.blogspot.com/2020/07/colossians-116-all-other-things-and-new.html"},"verdict":"unrefuted","rationale":"The Luke 13:2 parallel shows supplying 'other' is not automatically fraudulent — but there the context demands it; here it manufactures the doctrine. Scholarship is near-unanimous that prōtotokos in 1:15 denotes preeminence and rank (as in Psalm 89:27, where David, the youngest, is 'firstborn'), not first-created — Paul's argument through v. 20 is that Christ stands on the Creator side of the Creator/creation line. The insertion assumes the very doctrine it is used to prove, and the bracket-removal in 2013 erased the one honest signal that the word was added. Four insertions in five verses, all in one Christological direction, is a pattern, not a translation choice.","severity":"high","context":"Colossians 1:16–17 says that by Jesus all things were created and that he is before all things. If that stands, he cannot himself be a created thing. The New World Translation inserts the word 'other' four times — 'all other things' — which makes him one created being among many. In the 1950 edition the additions were bracketed as insertions; in later editions the brackets came off.","quran":[],"hadith":["NWT Colossians 1:16-17, 20 (1950, 1984 Reference, 2013 editions)","The Kingdom Interlinear Translation of the Greek Scriptures (1985), Colossians 1:16-17","Reasoning From the Scriptures (1985), pp. 408-409"]},
{"id":"nwt-jehovah-inserted-nt","title":"'Jehovah' inserted 237 times into the New Testament","category":"nwt-translation","claim":"The NWT prints 'Jehovah' 237 times in the New Testament. The Tetragrammaton (YHWH) appears in exactly zero of the ~5,800 known Greek NT manuscripts — every one reads Kyrios ('Lord') or Theos ('God') in these places. The Watchtower's supporting apparatus, the 'J documents' cited in its own Kingdom Interlinear, consists mostly of Hebrew translations of the New Testament made between the 14th and 20th centuries — translations made FROM the very Greek text they are invoked to correct. The doctrinal payoff is large: at Romans 10:13, 'everyone who calls on the name of Jehovah will be saved' severs Paul's argument, which since v. 9 has been about calling on the Lord Jesus. The insertions are also selectively withheld where OT Jehovah-texts are applied to Jesus (Philippians 2:10-11 citing Isaiah 45:23; 1 Peter 3:15 citing Isaiah 8:13), revealing a theological filter, not a textual method.","wt":["NWT Appendix A5, 'The Divine Name in the Christian Greek Scriptures' (2013)","The Kingdom Interlinear Translation of the Greek Scriptures (1985), foreword and J-reference apparatus","New World Translation Reference Bible (1984), Appendix 1D"],"bible":["Romans 10:9-13","Joel 2:32","Philippians 2:9-11","Isaiah 45:23","1 Peter 3:15","Isaiah 8:13"],"sources":[{"name":"George Howard, 'The Tetragram and the New Testament,' JBL 96/1 (1977)","type":"scholarly","url":"https://scholarlypublishingcollective.org/sblpress/jbl/article/96/1/63/186508/The-Tetragram-and-the-New-Testament"},{"name":"Tetragrammaton.org — Appendix A: the 'J' Reference Sources","type":"apologetics","url":"https://tetragrammaton.org/tetrapdxa.html"},{"name":"Wikipedia — Kingdom Interlinear Translation","type":"institutional","url":"https://en.wikipedia.org/wiki/The_Kingdom_Interlinear_Translation_of_the_Greek_Scriptures"},{"name":"NWT Appendix A5 (Watchtower's own defense)","type":"watchtower","url":"https://www.jw.org/en/library/bible/nwt/appendix-a/tetragrammaton-divine-name-new-testament/"}],"response":"The strongest defense is George Howard's peer-reviewed 1977 JBL thesis: pre-Christian Septuagint copies (e.g., Papyrus Fouad 266) wrote YHWH in Hebrew letters inside the Greek text, so NT authors quoting the LXX may originally have written the Tetragrammaton, later replaced by scribes with the abbreviated nomina sacra. On this view the NWT is restoring, not inserting. The Watchtower adds that Jesus said he 'made your name known' (John 17:6), that Kyrios in OT quotations plainly stands for YHWH, and that Hebrew translations (J documents) show where translators across centuries judged the divine name to belong.","responseSource":{"name":"NWT Appendix A5 — The Divine Name in the Christian Greek Scriptures","url":"https://www.jw.org/en/library/bible/nwt/appendix-a/tetragrammaton-divine-name-new-testament/"},"verdict":"unrefuted","rationale":"Howard's hypothesis is real scholarship but covers only direct OT quotations — a minority of the 237 — and rests on zero NT manuscript evidence; Howard himself protested that the Witnesses made too much of his article. The J documents are logically circular: late translations of the Greek cannot testify against every extant Greek manuscript. Most telling is the inconsistency — 'Jehovah' is inserted where it protects the Father's uniqueness and withheld where the same OT texts land on Jesus. A translation that corrects 5,800 manuscripts 237 times on theological instinct has left translation for emendation. No manuscript discovery has ever vindicated a single one of the 237.","severity":"high","context":"Jehovah's Witnesses are right about something important: God's personal name, YHWH, appears thousands of times in the Hebrew Bible and most English translations replace it with 'the LORD.' Restoring it is defensible. The difficulty is the New Testament, where the New World Translation prints 'Jehovah' 237 times — even though no Greek manuscript of the New Testament contains the name anywhere.","quran":[],"hadith":["NWT Appendix A5, 'The Divine Name in the Christian Greek Scriptures' (2013)","The Kingdom Interlinear Translation of the Greek Scriptures (1985), foreword and J-reference apparatus","New World Translation Reference Bible (1984), Appendix 1D"]},
{"id":"nwt-john-8-58-i-have-been","title":"John 8:58 — 'Before Abraham came into existence, I have been'","category":"nwt-translation","claim":"Where every major translation has Jesus say 'before Abraham was, I am' (ego eimi), the NWT reads 'I have been' — dissolving the echo of God's self-identification and explaining away the crowd's immediate attempt to stone him for blasphemy (v. 59). The translation's original justification was fabricated: the 1950 NWT footnote parsed ego eimi as the 'perfect indefinite tense' — a tense that does not exist in Greek grammar. The footnote was quietly revised in later editions (to 'perfect tense,' then dropped in favor of an idiom argument), a tacit admission the original grammar was invented. The present tense eimi, set against Abraham's 'coming into existence' (genesthai), is the same being/becoming contrast John opens his Gospel with (John 1:1-3), and the absolute ego eimi recurs at 8:24 and 8:28, where even the NWT cannot supply a predicate.","wt":["NWT John 8:58 (1950 footnote: 'perfect indefinite tense'; 1984 Reference edition footnote)","The Kingdom Interlinear Translation (1985), John 8:58","Reasoning From the Scriptures (1985), pp. 417-418"],"bible":["John 8:58-59","Exodus 3:14","John 8:24","John 8:28","John 18:5-6","Isaiah 43:10 (LXX)"],"sources":[{"name":"Department of Christian Defense — the NWT and John 8:58","type":"apologetics","url":"https://christiandefense.org/general/a-concise-look-at-the-jehovah-witnesses-bible-nwt-on-john-858/"},{"name":"EarlyChurch.net — Ego Eimi in John 8:58","type":"apologetics","url":"https://www.earlychurch.net/egoeimi.htm"},{"name":"NWT Defended — ego eimi and John 8:58 (JW-side)","type":"apologetics","url":"http://newworldtranslation.blogspot.com/2018/07/egw-eimi-ego-eimi-i-am-and-john-858.html"},{"name":"Elihu Books — NWT footnotes to John 8:58 (history of the footnote changes)","type":"apologetics","url":"http://elihubooks.blogspot.com/2010/01/new-world-translation-footnotes-to-john.html"}],"response":"The serious defense is not the abandoned 'perfect indefinite tense' but the Present of Past Action (PPA) idiom: a Greek present verb with an expression of past time can legitimately be rendered as an English perfect. K. L. McKay — a recognized Greek grammarian with no Watchtower ties — wrote in Expository Times (1996) that 'I have been in existence since before Abraham was born' is an acceptable rendering of the idiom. On this reading Jesus claims pre-existence (itself remarkable) rather than pronouncing the divine name; the LXX of Exodus 3:14 identifies God as ho ōn ('the Being'), not bare ego eimi, weakening the direct allusion.","responseSource":{"name":"NWT Defended — EGO EIMI and John 8:58","url":"http://newworldtranslation.blogspot.com/2018/07/egw-eimi-ego-eimi-i-am-and-john-858.html"},"verdict":"contested","rationale":"Two things are simultaneously true: the Watchtower's original grammatical justification was invented and had to be retracted through successive footnote rewrites — a documented embarrassment — and yet the PPA rendering itself has genuine scholarly support (McKay), so 'I have been' cannot be called flatly impossible. The context cuts against the NWT: the absolute ego eimi in 8:24 ('unless you believe that I am, you will die in your sins') and the crowd reaching for stones fit a divine claim, not a grammar lesson. Grade contested; in conversation, argue from the audience's reaction and 8:24, not from tense charts.","severity":"medium","context":"In John 8:58 Jesus says 'Before Abraham was, I am' — and his hearers immediately pick up stones, because 'I AM' is the name God gives himself in Exodus 3. The New World Translation renders it 'I have been,' which turns a divine self-identification into a statement about age. This case examines the Greek and why the crowd reacted as it did.","quran":[],"hadith":["NWT John 8:58 (1950 footnote: 'perfect indefinite tense'; 1984 Reference edition footnote)","The Kingdom Interlinear Translation (1985), John 8:58","Reasoning From the Scriptures (1985), pp. 417-418"]},
{"id":"nwt-hebrews-1-8-throne","title":"Hebrews 1:8 — 'God is your throne'","category":"nwt-translation","claim":"Hebrews 1:8, quoting Psalm 45:6, is traditionally rendered 'But of the Son he says, Your throne, O God, is forever and ever' — the Father addressing the Son as God. The NWT reads 'God is your throne forever and ever,' removing the address. Critics have long listed this among the NWT's doctrinally motivated changes, since the chapter's argument is the Son's superiority to angels, and a vocative reading makes v. 8 its climax. The Greek (ho theos) is formally ambiguous between vocative and nominative, so the question is whether the NWT's choice is a defensible option or special pleading; the NWT makes the same move in the psalm itself (NWT Psalm 45:6). Notably, verse 10 goes on to apply Psalm 102 — words addressed to YHWH about creating heavens and earth — directly to the Son, which the NWT translates straightforwardly.","wt":["NWT Hebrews 1:8","NWT Psalm 45:6","The Watchtower, Jan 1, 1977, pp. 63-64 (Questions From Readers on Hebrews 1:8)"],"bible":["Hebrews 1:8-12","Psalm 45:6-7","Psalm 102:25-27","Hebrews 1:10"],"sources":[{"name":"AvoidJW — Hebrews 1:8 Bible comparison","type":"apologetics","url":"https://avoidjw.org/news/hebrews-1-8/"},{"name":"B.F. Westcott, The Epistle to the Hebrews (via survey of scholars)","type":"scholarly","url":"http://defendingthenwt.blogspot.com/2010/12/hebrews-18-thy-throne-o-god.html"},{"name":"OnlyTrueGod.org — Hebrews 1:8 (unitarian-side survey of the grammar)","type":"apologetics","url":"https://onlytruegod.org/defense/hebrews1.8.htm"}],"response":"This is the Witnesses' strongest translation defense, because eminent trinitarian scholars concede the point. B. F. Westcott concluded 'it seems best to adopt in the first clause the rendering: God is thy throne'; Hort and Nairne agreed; Moffatt's translation and the margins of the RSV, NRSV, and NEB all carry 'God is your throne.' A. T. Robertson admitted 'it is not certain whether ho theos is here the vocative.' Psalm 45 was originally a wedding song addressed to a Davidic king, making 'God is your throne' (your kingship rests on God) contextually natural, and Hebrews 1:9 immediately says 'God, your God, anointed you' — the Son has a God.","responseSource":{"name":"Defending the NWT — Hebrews 1:8","url":"http://defendingthenwt.blogspot.com/2010/12/hebrews-18-thy-throne-o-god.html"},"verdict":"answered","rationale":"Included deliberately for fairness. The grammar is genuinely open, and the NWT's rendering was endorsed by Westcott — a scholar no one accuses of anti-trinitarian bias — before the Watchtower existed as a translating body. Most modern commentators still prefer the vocative ('Your throne, O God') on contextual grounds, but a rendering carried in the margins of the RSV and NEB is not a mistranslation. Sites that list Hebrews 1:8 alongside John 1:1 weaken their credibility. The real argument in this chapter is verse 10-12: Psalm 102's words to YHWH the Creator applied to the Son — a point the NWT leaves fully intact.","severity":"low","context":"Hebrews 1 argues that the Son is greater than the angels, and verse 8 quotes the Father addressing him: 'Thy throne, O God, is for ever and ever.' The New World Translation reverses subject and predicate — 'God is your throne' — which removes the address. This case examines the Greek construction and how every other major translation reads it.","quran":[],"hadith":["NWT Hebrews 1:8","NWT Psalm 45:6","The Watchtower, Jan 1, 1977, pp. 63-64 (Questions From Readers on Hebrews 1:8)"]},
{"id":"nwt-luke-23-43-comma","title":"Luke 23:43 — the relocated comma","category":"nwt-translation","claim":"To the thief on the cross, Jesus says (all major translations): 'Truly I tell you, today you will be with me in paradise.' The NWT moves the comma: 'Truly I tell you today, you will be with me in paradise' — Jesus is merely saying it today, promising paradise at some unspecified future point. The relocation protects two Watchtower doctrines at once: soul sleep (the thief cannot be conscious anywhere that day) and a two-class afterlife (the thief belongs to the earthly-paradise class, not heaven). The pattern evidence is strong: forms of 'truly I say to you' occur over 70 times in the Gospels, and in no other instance does a time adverb attach to the saying formula rather than the content. The earliest manuscripts, however, carry virtually no punctuation, so the comma is in every translation an editorial decision — the question is whose decision follows the evidence and whose follows doctrine.","wt":["NWT Luke 23:43","New World Translation Reference Bible (1984), Luke 23:43 footnote","The Watchtower, Feb 1, 2013, 'Truly I Tell You Today' (jw.org treatment)"],"bible":["Luke 23:42-43","Matthew 5:18","Mark 14:30","2 Corinthians 12:2-4","Philippians 1:23"],"sources":[{"name":"FaithSaves — Luke 23:43: Where Does the Comma Go?","type":"apologetics","url":"https://faithsaves.net/luke-2343-comma/"},{"name":"Grace Communion International — The Comma of Luke 23:43","type":"apologetics","url":"https://archive.gci.org/articles/the-comma-of-luke-2343/"},{"name":"NWT Defended — A History of the Comma at Luke 23:43 (JW-side)","type":"apologetics","url":"http://newworldtranslation.blogspot.com/2018/09/a-history-of-comma-at-luke-2343.html"}],"response":"The earliest Greek manuscripts had no punctuation, so no translation can claim manuscript authority for its comma. Codex Vaticanus actually has a point after sēmeron ('today'), and the Curetonian Syriac (5th century) explicitly reads 'Truly I say to you today, that with me you will be...' Hesychius of Jerusalem (d. c. 434) attests that some readers punctuated exactly as the NWT does — this is an ancient reading, not a Watchtower invention. Rotherham's Emphasized Bible punctuates the same way. 'I tell you this day' is a solemn Hebrew declaration idiom (Deuteronomy 30:18), natural on the lips of a dying Jewish teacher. And Jesus himself was not in paradise that day — he was in the grave until the third day (Acts 10:40).","responseSource":{"name":"NWT Defended — History of the Comma at Luke 23:43","url":"http://newworldtranslation.blogspot.com/2018/09/a-history-of-comma-at-luke-2343.html"},"verdict":"contested","rationale":"The NWT's rendering is doctrinally motivated, but it has genuinely ancient attestation (Curetonian Syriac, Hesychius' report) and the manuscript-punctuation point is simply true. Against it: the 70+ occurrence pattern of the amēn formula never elsewhere modified by 'today,' and the emptiness of Jesus solemnly noting he is speaking 'today' to a man dying beside him. Most textual scholars side with the traditional comma, but this is a probability judgment, not a proof. Grade contested; use it to illustrate how doctrine steers 'neutral' decisions rather than as a standalone mistranslation charge.","severity":"low","context":"Jesus tells the dying thief, 'Verily I say unto thee, To day shalt thou be with me in paradise.' Witnesses do not believe anyone goes to heaven at death, so the New World Translation moves the comma: 'Truly I tell you today, you will be with me in Paradise.' Ancient Greek had no punctuation, so this is a real interpretive question — and this case examines how Luke uses the phrase elsewhere.","quran":[],"hadith":["NWT Luke 23:43","New World Translation Reference Bible (1984), Luke 23:43 footnote","The Watchtower, Feb 1, 2013, 'Truly I Tell You Today' (jw.org treatment)"]},
{"id":"nwt-john-14-14-me-deleted","title":"John 14:14 — 'ask me' becomes 'ask'","category":"nwt-translation","claim":"In John 14:14 Jesus says, per the best manuscripts: 'If you ask ME anything in my name, I will do it' — a direct warrant for prayer to Jesus, which Witnesses are taught is unscriptural. The NWT drops 'me': 'If you ask anything in my name, I will do it.' What makes this case unusually clean is that the Watchtower convicts itself: the NWT's stated base text (Westcott and Hort) includes me; the Society's own Kingdom Interlinear prints me in its Greek line; and the 1984 NWT Reference Bible footnote concedes that P66, Sinaiticus, Vaticanus, W, the Vulgate and Syriac read 'ask me' — yet the main text omits it anyway, following later Byzantine witnesses the committee rejects everywhere else. The 2013 revision retains the omission without the footnote. Modern critical editions (NA28/UBS5) include me; P66 and P75 put the reading within decades of composition.","wt":["NWT John 14:14 (1950, 1984, 2013 editions)","New World Translation Reference Bible (1984), John 14:14 footnote","The Kingdom Interlinear Translation (1985), John 14:14"],"bible":["John 14:13-14","John 15:16","John 16:23","Acts 7:59","1 Corinthians 1:2","Revelation 22:20"],"sources":[{"name":"Christian Publishing House — NTTC John 14:14","type":"apologetics","url":"https://christianpublishinghouse.co/2017/04/10/john-1414-if-you-ask-me-anything-in-my-name-i-will-do-it/"},{"name":"4Jehovah (Evidence Ministries) — John 14:14: Did Jesus Say 'Ask Me'?","type":"apologetics","url":"https://www.4jehovah.org/john-1414-did-jesus-say-ask-me-anything/"},{"name":"Rightly Dividing — the textual issue of John 14:14","type":"apologetics","url":"https://rdtwot.wordpress.com/2011/07/12/hear-o-lord-praying-to-jesus-%E2%80%93-the-textual-issue-of-john-1414/"},{"name":"Defend Jehovah's Witnesses — John 14:14 (JW-side)","type":"apologetics","url":"http://defendingjehovahswitnesses.blogspot.com/2012/05/john-1414-and-new-world-translation.html"}],"response":"The omission of me is not a Watchtower invention: it appears in a substantial manuscript stream (Codices A, D, K, L, the Byzantine tradition), in some Vulgate and Syriac witnesses, and in the KJV itself ('If ye shall ask any thing in my name'), which no one accuses of anti-trinitarian bias. Defenders argue 'ask me... in my name' is awkward — one asks the Father in Jesus' name, as the immediate context says (14:13, 15:16, 16:23) — so me may be an early scribal intrusion, and internal coherence justifies preferring the shorter reading even against the older manuscripts.","responseSource":{"name":"Defend Jehovah's Witnesses — John 14:14 and the NWT","url":"http://defendingjehovahswitnesses.blogspot.com/2012/05/john-1414-and-new-world-translation.html"},"verdict":"unrefuted","rationale":"The KJV parallel fails because the KJV followed the manuscripts available in 1611; the NWT committee had P66 and P75 and their own base text in front of them and documented the better reading in their own footnote while overriding it. Text-critical method the committee applies everywhere else (prefer the earliest and best witnesses; prefer the reading that explains the others — scribes deleted me to harmonize with 14:13) points one way; the committee went the other, in the sole direction their theology required. When a translation follows Westcott-Hort in 7,000 places and abandons it here, the variable is not the evidence.","severity":"medium","context":"In John 14:14 Jesus says, in the best manuscripts, 'If ye shall ask any thing in my name, <b>me</b> I will do it' — praying to Jesus. Since Witnesses hold that prayer belongs to Jehovah alone, the New World Translation drops the word 'me,' even though the manuscript support for it is strong. This case examines the textual evidence.","quran":[],"hadith":["NWT John 14:14 (1950, 1984, 2013 editions)","New World Translation Reference Bible (1984), John 14:14 footnote","The Kingdom Interlinear Translation (1985), John 14:14"]},
{"id":"nwt-committee-anonymity-credentials","title":"The anonymous translation committee and Fred Franz's credentials","category":"nwt-translation","claim":"The New World Bible Translation Committee has never been publicly identified by the Watchtower — readers are asked to accept a Bible whose translators' qualifications cannot be examined. Raymond Franz, a former Governing Body member, identified the committee as Nathan Knorr, Frederick Franz, George Gangas, and Albert Schroeder, with Frederick Franz the principal (and only substantially capable) translator (Crisis of Conscience, 4th ed.). Fred Franz had two years of Greek at the University of Cincinnati and was self-taught in Hebrew — no degree in biblical languages. In the 1954 Walsh trial (Court of Session, Scotland), Franz, under oath, answered 'I do not speak Hebrew,' and when asked to render Genesis 2:4 into Hebrew replied 'No. I wouldn't attempt to do that.' No other committee member had any known training in the biblical languages. Every major translation (NIV, ESV, NASB, NRSV) publishes its translators' names and credentials.","wt":["New World Translation (1950), Foreword (committee anonymity policy)","The Watchtower, Dec 15, 1974, p. 768 (anonymity 'gives glory to God')","Douglas Walsh v. The Right Honourable James Latham Clyde (1954), trial transcript, Franz cross-examination"],"bible":["Proverbs 18:17","1 Thessalonians 5:21","2 Timothy 2:15"],"sources":[{"name":"Walsh Trial transcript (Internet Archive scan)","type":"primary","url":"https://archive.org/details/WalshTrial"},{"name":"CRI — Fred Franz Court Transcripts, November 24, 1954","type":"apologetics","url":"https://www.equip.org/articles/fred-franz-court-transcripts-november-24-1954/"},{"name":"Bible Research (Michael Marlowe) — The New World Translation","type":"scholarly","url":"https://www.bible-researcher.com/new-world.html"},{"name":"Raymond Franz, Crisis of Conscience (4th ed., full text)","type":"primary","url":"https://friendsofraymondfranz.com/wp-content/uploads/2020/04/CC2004-Eng.pdf"},{"name":"For An Answer — Franz, LaSor, and the NWT","type":"apologetics","url":"https://www.forananswer.org/Top_JW/FranzNWT.htm"}],"response":"The Watchtower says the committee requested anonymity so that glory would go to God and the Bible's Author, not to men — and notes that translations are properly judged on their merits, not their makers' diplomas. On the merits, Jason BeDuhn ranked the NWT among the more accurate of nine English translations he compared. As for the Walsh trial, defenders point out Franz was asked to translate English INTO Hebrew — composition, a skill even many working Hebrew scholars would decline to perform extemporaneously in a courtroom — not to read or translate from Hebrew, which he demonstrably did for decades. Franz had studied Greek formally, won a scholarship, and read multiple languages.","responseSource":{"name":"For An Answer — Franz, LaSor, and the NWT (documents both sides)","url":"https://www.forananswer.org/Top_JW/FranzNWT.htm"},"verdict":"unrefuted","rationale":"The core facts stand: an anonymous committee, unverifiable credentials, and — per the account of a Governing Body insider and Franz's own nephew — a principal translator with two years of undergraduate Greek and self-taught Hebrew producing a translation that overrules the consensus of credentialed scholarship at doctrinally sensitive points. The steelman deserves respect on one detail: the Genesis 2:4 courtroom episode is routinely overstated by critics; declining to compose Hebrew on the stand proves little, and sites that lead with it get fact-checked into embarrassment. Use the anonymity and the documented credentials; skip the gotcha framing. Anonymity that prevents accountability is the issue Proverbs 18:17 names.","severity":"medium","context":"The New World Translation was produced by a committee whose members were never named — the organization says this was for humility. Names later emerged, and only one had studied biblical languages formally: Fred Franz, who had two years of classical Greek and no Hebrew training. Under oath in a Scottish court in 1954 he was asked to translate a verse into Hebrew and declined.","quran":[],"hadith":["New World Translation (1950), Foreword (committee anonymity policy)","The Watchtower, Dec 15, 1974, p. 768 (anonymity 'gives glory to God')","Douglas Walsh v. The Right Honourable James Latham Clyde (1954), trial transcript, Franz cross-examination"]},
{"id":"chron-607-vs-587","title":"607 BCE: the date archaeology refutes, on which 1914 depends","category":"chronology-607","claim":"The entire Watchtower system hangs on one date: Jerusalem destroyed in 607 BCE. Add the 'seven times' of Daniel 4 (2,520 years) and you reach 1914 — Christ's invisible enthronement, followed by his 1919 appointment of the Watchtower as his channel. But no historian dates the destruction to 607. Tens of thousands of dated Babylonian business tablets, the astronomical diary VAT 4956 (whose 30 recorded lunar and planetary positions fix Nebuchadnezzar's 37th year to 568/567 BCE), Berossus, and Ptolemy's canon all converge on 587/586 BCE for his 18th year, when Jerusalem fell. The Watchtower's own 2011 article concedes that 'secular historians usually say Jerusalem was destroyed in 587 B.C.E.' (The Watchtower, Oct 1, 2011, p. 26). The Society accepts this same Neo-Babylonian evidence to fix 539 BCE for Babylon's fall — the anchor of its own calculation — and rejects it twenty years earlier. If 607 falls, 1914 falls; and with 1914 falls the Governing Body's claimed 1919 appointment.","wt":["The Watchtower, Oct 1, 2011, pp. 26-31, 'When Was Ancient Jerusalem Destroyed?—Part One'","The Watchtower, Nov 1, 2011, pp. 22-28, 'When Was Ancient Jerusalem Destroyed?—Part Two'","Insight on the Scriptures (1988), Vol. 1, 'Chronology,' pp. 448-467","Let Your Kingdom Come (1981), Appendix, pp. 186-189"],"bible":["Daniel 4:16-17","Luke 21:24","Jeremiah 25:11-12","Jeremiah 29:10","2 Chronicles 36:20-21","Zechariah 1:12"],"sources":[{"name":"The Watchtower Nov 1, 2011 (Part Two, full text)","type":"watchtower","url":"https://wol.jw.org/en/wol/d/r1/lp-e/2011810"},{"name":"JWFacts — 607 vs 587: the evidence","type":"apologetics","url":"https://www.jwfacts.com/watchtower/607-587.php"},{"name":"Carl Olof Jonsson, The Gentile Times Reconsidered (Internet Archive)","type":"scholarly","url":"https://archive.org/details/the-gentile-times-reconsidered"},{"name":"Wikipedia — VAT 4956","type":"institutional","url":"https://en.wikipedia.org/wiki/VAT_4956"}],"response":"The Watchtower's defense: the Bible says Judah would be 'a desolate waste' serving Babylon seventy years (Jeremiah 25:11; 2 Chronicles 36:21). Babylon fell in 539 BCE — a date secular chronology itself supplies — the exiles returned by 537, and counting seventy literal years back from 537 yields 607. Where clay tablets and God's Word conflict, tablets yield: copyists erred, court astronomers may have back-calculated positions, and the Neo-Babylonian records passed through pagan and Seleucid hands. The 2011 article argues VAT 4956's lunar positions actually fit 588 BCE as Nebuchadnezzar's 37th year — placing his 18th year at 607 — and notes a lunar eclipse also occurred in 588.","responseSource":{"name":"The Watchtower, Nov 1, 2011 — When Was Ancient Jerusalem Destroyed? Part Two","url":"https://www.jw.org/en/library/magazines/wp20111101/When-Was-Ancient-Jerusalem-Destroyed-Part-Two/"},"verdict":"unrefuted","rationale":"The defense is internally inconsistent: it accepts the Neo-Babylonian astronomical-commercial record absolutely for 539 BCE and declares the same record corrupt for 587 — the corruption conveniently spanning exactly the twenty years the doctrine requires. Scripture doesn't require their reading: Jeremiah 25:11 makes the seventy years servitude of 'these nations' to Babylon (ending 539), Jeremiah 29:10 reads 'seventy years FOR Babylon,' and Zechariah 1:12 counts seventy years of indignation to 587-517. The business-tablet record is continuous — every regnal year of every Neo-Babylonian king is attested by dated contracts, leaving no room to insert twenty phantom years. Nothing in the Watchtower's response engages that continuity.","severity":"high","context":"This is the foundation stone of the entire religion, so it is worth understanding. The Watchtower dates Jerusalem's destruction by Babylon to 607 BC, adds 2,520 years, and arrives at 1914 — the year Christ supposedly began ruling invisibly. Every other source — thousands of dated Babylonian business tablets, astronomical records, king lists — puts the destruction at 587/586 BC.","quran":[],"hadith":["The Watchtower, Oct 1, 2011, pp. 26-31, 'When Was Ancient Jerusalem Destroyed?—Part One'","The Watchtower, Nov 1, 2011, pp. 22-28, 'When Was Ancient Jerusalem Destroyed?—Part Two'","Insight on the Scriptures (1988), Vol. 1, 'Chronology,' pp. 448-467","Let Your Kingdom Come (1981), Appendix, pp. 186-189"]},
{"id":"chron-2011-articles-vat4956","title":"The 2011 defense: keeping the eclipse, discarding the planets","category":"chronology-607","claim":"Facing growing internal doubt, the Watchtower published a rare two-part defense of 607 ('When Was Ancient Jerusalem Destroyed?', Oct 1 and Nov 1, 2011 — unsigned, with endnotes). Part Two's handling of VAT 4956 is the revealing part. The tablet's ~30 astronomical observations date Nebuchadnezzar's 37th year to 568/567 BCE; the article re-dates it to 588 by discarding the planetary observations (suggesting the cuneiform signs 'could have been misidentified') while retaining selected lunar positions it says fit 588 — and highlighting a lunar eclipse of July 15, 588 BCE as a fit, without telling readers the tablet's eclipse data and the remaining observations as a whole match 568 far better, or that 588/587 as the 37th year contradicts the Society's own dates for the reigns of the intervening kings (Amel-Marduk, Neriglissar) attested by thousands of dated tablets. Carl Olof Jonsson published a line-by-line rebuttal documenting selective citation of the scholars quoted in Part One.","wt":["The Watchtower, Oct 1, 2011, pp. 26-31","The Watchtower, Nov 1, 2011, pp. 22-28 (esp. the box 'VAT 4956—Does It Really Point to 587 B.C.E.?')"],"bible":["Proverbs 18:17","1 Thessalonians 5:21"],"sources":[{"name":"The Watchtower Nov 1, 2011 (jw.org full text)","type":"watchtower","url":"https://www.jw.org/en/library/magazines/wp20111101/When-Was-Ancient-Jerusalem-Destroyed-Part-Two/"},{"name":"Aperi Mentis — The Astronomical Diary VAT 4956 (analysis of the 2011 argument)","type":"apologetics","url":"https://aperimentis.wordpress.com/2018/02/18/astronomical-diary-vat-4956/"},{"name":"JWFacts — 607 page, section on the 2011 articles","type":"apologetics","url":"https://www.jwfacts.com/watchtower/607-587.php"},{"name":"Jonsson, The Gentile Times Reconsidered (4th ed. with responses)","type":"scholarly","url":"https://archive.org/details/the-gentile-times-reconsidered"}],"response":"The articles are the Watchtower at its most evidentially engaged: they cite the primary publications on VAT 4956, acknowledge openly that most scholars hold 587, and offer a testable counter-hypothesis — that the diary is a later copy whose planetary signs are ambiguous, while its month-by-month lunar positions, they report, were found by their researchers to match 588 BCE 'in all 13 sets.' A lunar eclipse did occur on July 15, 588 BCE, as they claim. If the 37th year were 588, the 18th year would be 607, harmonizing tablet and Scripture. The articles frame this as faith giving Scripture the benefit of the doubt where secular data admits any ambiguity.","responseSource":{"name":"The Watchtower, Nov 1, 2011","url":"https://www.jw.org/en/library/magazines/wp20111101/When-Was-Ancient-Jerusalem-Destroyed-Part-Two/"},"verdict":"unrefuted","rationale":"A method that deletes the data that falsify the hypothesis and keeps the data that permit it is not chronology. The planetary observations are precisely the ones that cannot fit 588; the eclipse 'fit' ignores that lunar eclipses recur constantly (the tablet's full eclipse description — time before sunrise, magnitude — matches 568, not 588); and moving Nebuchadnezzar's 37th year to 588 collides with the tablet-attested reign lengths of his successors, which the article never addresses. The anonymous authorship means no astronomer signed the calculation. The concession the articles do make — 'most scholars say 587' — is itself the takeaway for readers: the Society knows the score and asks members to overrule it.","severity":"medium","context":"In 2011 the Watchtower published a defense of 607 built on a Babylonian astronomical tablet called VAT 4956, which records lunar and planetary positions for a specific year of Nebuchadnezzar's reign. The articles accepted some observations on the tablet and set others aside. This case examines the tablet and what happens when you use all of its data rather than part of it.","quran":[],"hadith":["The Watchtower, Oct 1, 2011, pp. 26-31","The Watchtower, Nov 1, 2011, pp. 22-28 (esp. the box 'VAT 4956—Does It Really Point to 587 B.C.E.?')"]},
{"id":"chron-jonsson-gentile-times","title":"Carl Olof Jonsson: the elder who checked the math","category":"chronology-607","claim":"Carl Olof Jonsson was a Swedish Jehovah's Witness elder and pioneer who, challenged in 1968 during a Bible study to prove 607 BCE, spent years in the primary sources and concluded the Watchtower date was indefensible — seventeen independent lines of evidence converge on 587/586. In 1977 he submitted his treatise to Brooklyn headquarters, expecting engagement. He received evasion, then warnings; on June 9, 1982, he was disfellowshipped. He published the research in 1983 as The Gentile Times Reconsidered, still the standard treatment. Raymond Franz, then on the Governing Body, later recorded the manuscript's effect inside headquarters: 'the weight of the evidence left us feeling somewhat disconcerted' — yet the body voted to hold the doctrine. The episode shows the organization's epistemology in miniature: the chronology was not defended, its examiner was expelled, and members were never told the challenge existed.","wt":["The Watchtower, Aug 15, 1981, pp. 28-29 (warning against those questioning 1914 chronology)","Watch Tower Society correspondence with C.O. Jonsson, 1977-1980 (reproduced in The Gentile Times Reconsidered)","Raymond Franz, In Search of Christian Freedom (1991), ch. 5 (Governing Body reception of the manuscript)"],"bible":["1 Thessalonians 5:21","Acts 17:11","Proverbs 18:13"],"sources":[{"name":"The Gentile Times Reconsidered (full text, Internet Archive)","type":"primary","url":"https://archive.org/details/the-gentile-times-reconsidered"},{"name":"Jonsson's first-person account (watchtowerdocuments.org)","type":"primary","url":"https://photos.watchtowerdocuments.org/personal-experience-carl-olof-jonsson/"},{"name":"The Jerusalem Book — Jonsson biography and controversy","type":"apologetics","url":"https://www.jhalsey.com/jerusalem-book/controversy/jonsson.html"},{"name":"Beroean Pickets — Remembering Carl Olof Jonsson (1937-2023)","type":"journalism","url":"https://beroeans.net/2023/04/17/carl-jonsson"}],"response":"From the Watchtower's standpoint, Jonsson was not expelled for arithmetic but for apostasy: he began circulating material contradicting core teachings while serving as an elder, which any confessional community — a Catholic diocese, a Presbyterian session — would treat as a discipline matter. The Society does not answer critics by name as a matter of policy, but it did eventually publish its substantive case (the 1981 'Let Your Kingdom Come' appendix and the 2011 two-part articles), which defenders regard as the institutional response to Jonsson's line of argument. Religious bodies are entitled to define membership by doctrine.","responseSource":{"name":"Let Your Kingdom Come (1981), Appendix — wol.jw.org","url":"https://wol.jw.org/en/wol/publication/r1/lp-e/kc"},"verdict":"unrefuted","rationale":"The narrative is documented from both directions — Jonsson's correspondence file and the account of a then-sitting Governing Body member — and the Watchtower has never disputed the sequence of events. The steelman (churches may discipline doctrinal dissent) is real but misses the asymmetry: this organization claims its chronology is Jehovah's own timetable and disfellowshipping severs family ties, so the cost of asking whether 607 is true is total. Forty years on, The Gentile Times Reconsidered has never been rebutted in any scholarly venue, and the 2011 articles engage its evidence without acknowledging it exists. For conversations: ask a Witness what happened to the elder who checked.","severity":"medium","context":"In the 1970s a Swedish elder named Carl Olof Jonsson was asked a question about 607 he could not answer, so he spent years researching it and submitted his findings to headquarters. He was disfellowshipped. His work was published as <i>The Gentile Times Reconsidered</i>. This case examines both the research and the response to it — no published rebuttal has ever engaged it directly.","quran":[],"hadith":["The Watchtower, Aug 15, 1981, pp. 28-29 (warning against those questioning 1914 chronology)","Watch Tower Society correspondence with C.O. Jonsson, 1977-1980 (reproduced in The Gentile Times Reconsidered)","Raymond Franz, In Search of Christian Freedom (1991), ch. 5 (Governing Body reception of the manuscript)"]},
{"id":"dates-1874-1914-retrofit","title":"1914 was predicted as the END — and Christ's presence was 1874 until 1943","category":"failed-dates","claim":"Witnesses today are taught that the organization alone foresaw 1914 as the year Christ's invisible presence began. The founder's published predictions say otherwise. Russell taught that Christ's invisible presence had ALREADY begun — in 1874 — and that 1914 would be the finish: 'the battle of the great day of God Almighty (Rev. 16:14), which will end in A.D. 1914 with the complete overthrow of earth's present rulership, is already commenced' (The Time Is at Hand, 1889, p. 101). When 1914 brought war but no overthrow, the system was rebuilt backward: 1914 became a beginning instead of an end, and the 1874 'presence' was retained for decades — The Watch Tower was still affirming Christ's 1874 presence into the 1920s (e.g., Prophecy, 1929, p. 65), and the shift of the parousia to 1914 was not completed until The Truth Shall Make You Free (1943), p. 324. The signature doctrine of the religion is a retrofit, moved 29 years after the fact.","wt":["Studies in the Scriptures Vol. 2, The Time Is at Hand (1889), pp. 98-101","Studies in the Scriptures Vol. 4, The Battle of Armageddon (1897), p. 621 ('our Lord, the appointed King, is now present, since October 1874')","Prophecy (1929), p. 65","The Truth Shall Make You Free (1943), p. 324","Jehovah's Witnesses—Proclaimers of God's Kingdom (1993), pp. 133-137, 632-633"],"bible":["Matthew 24:36","Deuteronomy 18:21-22","Acts 1:6-7"],"sources":[{"name":"JWFacts — 1914: failed predictions and falsified history","type":"apologetics","url":"https://www.jwfacts.com/watchtower/failed-1914-predictions.php"},{"name":"Watchman Fellowship — Jehovah's Witnesses and the History of 1914","type":"apologetics","url":"https://www.watchman.org/articles/jehovahs-witnesses/jehovahs-witnesses-and-the-history-of-1914/"},{"name":"The Time Is at Hand, original edition scan (Internet Archive)","type":"primary","url":"https://archive.org/details/StudiesInTheScriptures"},{"name":"JWFacts — 1800s date predictions","type":"apologetics","url":"https://jwfacts.com/watchtower/1800s.php"}],"response":"The Watchtower's own history volume acknowledges the early expectations were mistaken: 'The Bible Students were not completely sure what would happen... they had expected more' (Proclaimers, 1993). Defenders argue the core insight was vindicated in substance: Russell's movement, alone among religious bodies, pointed decades in advance to 1914 as an epochal year — and 1914 did shatter the old world order. Like the apostles who asked 'Lord, are you restoring the kingdom at this time?' (Acts 1:6), they misread the details of timing while being right about the event's significance; later 'increased light' (Proverbs 4:18) corrected the frame, which is how progressive revelation is supposed to work.","responseSource":{"name":"Proclaimers of God's Kingdom (1993), ch. 10 — wol.jw.org","url":"https://wol.jw.org/en/wol/publication/r1/lp-e/jv"},"verdict":"admitted","rationale":"Graded 'admitted' because the raw facts — 1874 presence, 1914 as the end, the 1943 relocation — are all printed in the Society's own literature, and Proclaimers concedes the failed expectations while presenting the survivable residue as prophetic success. The 'they predicted 1914!' defense inverts the record: every specific thing predicted for 1914 (Armageddon complete, God's kingdom in full earthly power, the saints glorified) failed; the one thing now claimed for 1914 (invisible enthronement) was not the teaching until 1943. A prediction whose content is replaced after the fact confirms Deuteronomy 18:22 rather than escaping it.","severity":"high","context":"Almost no Witness has been told this. Until 1943 the organization taught that Christ's invisible presence began in <b>1874</b>, not 1914 — and 1914 was published as the year the world would <i>end</i>. An 1889 book said the battle of the great day of God would end in 1914 with the complete overthrow of earth's rulership. When it didn't, the date was kept and its meaning replaced.","quran":[],"hadith":["Studies in the Scriptures Vol. 2, The Time Is at Hand (1889), pp. 98-101","Studies in the Scriptures Vol. 4, The Battle of Armageddon (1897), p. 621 ('our Lord, the appointed King, is now present, since October 1874')","Prophecy (1929), p. 65","The Truth Shall Make You Free (1943), p. 324","Jehovah's Witnesses—Proclaimers of God's Kingdom (1993), pp. 133-137, 632-633"]},
{"id":"dates-1925-beth-sarim","title":"1925: 'Millions Now Living Will Never Die' — and the mansion for Abraham","category":"failed-dates","claim":"Rutherford's worldwide campaign proclaimed: 'we may confidently expect that 1925 will mark the return of Abraham, Isaac, Jacob and the faithful prophets of old... to the condition of human perfection' (Millions Now Living Will Never Die, 1920, pp. 89-90). The Watch Tower of Sept 1, 1922 (p. 262) raised the stakes: 'The date 1925 is even more distinctly indicated by the Scriptures than 1914.' When 1925 passed, the Society built a monument to the failure: Beth Sarim, a San Diego mansion completed in 1930, its deed held in trust for the resurrected 'princes' — David, Gideon, Barak, Samson, Samuel — as the Society's book Salvation (1939, p. 311) confirms in print. The patriarchs never checked in; Rutherford wintered there until his death in 1942, and the Society quietly sold the property in 1948. Membership collapsed after 1925 — the Society's own figures show attendance falling from roughly 90,000 (1925) to under 20,000 within three years.","wt":["Millions Now Living Will Never Die (1920), pp. 88-90, 97","The Watch Tower, Sept 1, 1922, p. 262","The Watch Tower, Apr 1, 1923, p. 106 ('The year 1925 is a date definitely and clearly marked in the Scriptures')","Salvation (1939), p. 311 (Beth Sarim held in trust for the princes)","Jehovah's Witnesses—Proclaimers of God's Kingdom (1993), p. 78 ('The year 1925 came and went. Jesus' anointed followers were still on earth as a class. The faithful men of old times—Abraham, David and others—had not been resurrected')"],"bible":["Deuteronomy 18:21-22","Matthew 24:36","Hebrews 11:13-16"],"sources":[{"name":"JWFacts — 1925 and 'Millions Now Living Will Never Die'","type":"apologetics","url":"https://www.jwfacts.com/watchtower/1925.php"},{"name":"CRI — Beth-Sarim: Monument to a False Prophecy","type":"apologetics","url":"https://www.equip.org/articles/beth-sarim/"},{"name":"Wikipedia — Beth Sarim","type":"institutional","url":"https://en.wikipedia.org/wiki/Beth_Sarim"},{"name":"Voice of San Diego — A Mansion for the Resurrected, in Kensington","type":"journalism","url":"https://voiceofsandiego.org/2011/06/01/a-mansion-for-the-resurrected-in-kensington/"},{"name":"Millions Now Living Will Never Die (original scan)","type":"primary","url":"https://archive.org/details/MillionsNowLivingWillNeverDie"}],"response":"The Society has acknowledged this failure explicitly: Proclaimers (1993, p. 78) prints the disappointment, and The Watchtower (1980) conceded such expectations were based on 'wrong premises.' Defenders note Rutherford himself reportedly admitted to the Bethel family that he had 'made an ass of himself' over 1925. The 'confidently expect' language, they argue, was expectation, not 'thus saith Jehovah' — the Awake! of March 22, 1993, stresses that these were the mistaken hopes of eager servants, never predictions issued in Jehovah's name. Beth Sarim, on this view, was a good-faith expression of a sincere (if premature) hope in the resurrection, later divested when the teaching was corrected.","responseSource":{"name":"Proclaimers of God's Kingdom (1993), p. 78 — wol.jw.org","url":"https://wol.jw.org/en/wol/publication/r1/lp-e/jv"},"verdict":"admitted","rationale":"The organization's own publications supply every element: the prediction, the escalation ('more distinctly indicated than 1914'), the real-estate consequence in print (Salvation, 1939), and the retrospective concession (Proclaimers, p. 78). The 'never in Jehovah's name' defense fails on the Society's own terms — the same literature calls the organization Jehovah's channel and mouthpiece, and the 1923 Watch Tower called 1925 'definitely and clearly marked in the Scriptures.' A speaker who claims divine channelship cannot retroactively demote failed predictions to private enthusiasm. This case is uniquely potent in conversation because there is a physical address: the house built for Abraham still stands at 4440 Braeburn Road.","severity":"high","context":"In the early 1920s the organization taught that 1925 would bring the resurrection of Abraham, Isaac and Jacob, under the slogan 'Millions Now Living Will Never Die.' In 1929 it bought a San Diego mansion, Beth Sarim, and deeded it to those patriarchs for their return. Its president Joseph Rutherford lived in it. The house was sold in 1948, and the organization's own history book discusses it.","quran":[],"hadith":["Millions Now Living Will Never Die (1920), pp. 88-90, 97","The Watch Tower, Sept 1, 1922, p. 262","The Watch Tower, Apr 1, 1923, p. 106 ('The year 1925 is a date definitely and clearly marked in the Scriptures')","Salvation (1939), p. 311 (Beth Sarim held in trust for the princes)","Jehovah's Witnesses—Proclaimers of God's Kingdom (1993), p. 78 ('The year 1925 came and went. Jesus' anointed followers were still on earth as a class. The faithful men of old times—Abraham, David and others—had not been resurrected')"]},
{"id":"dates-1975","title":"1975: the 6,000-year deadline and the exodus that followed","category":"failed-dates","claim":"In 1966 the Watchtower announced that 6,000 years of human history would end in 1975: 'according to this trustworthy Bible chronology six thousand years from man's creation will end in 1975, and the seventh period of a thousand years of human history will begin in the fall of 1975 C.E.' (Life Everlasting—in Freedom of the Sons of God, 1966, p. 29). The Watchtower of Aug 15, 1968 (p. 499) said the remaining interval 'may involve only a difference of weeks or months, not years.' Kingdom Ministry (May 1974, p. 3) praised members 'selling their homes and property' to pioneer 'the short time remaining.' Witnesses quit jobs, deferred surgery, cashed out pensions. When nothing happened, growth collapsed — worldwide publishers declined in 1977-78, the first sustained fall in decades. In 1980 the Society conceded blame in its own pages: the buildup came from statements 'published' by the organization, and the fault extended to 'persons having to do with the publication of the information' (The Watchtower, Mar 15, 1980, pp. 17-18).","wt":["Life Everlasting—in Freedom of the Sons of God (1966), pp. 29-30","The Watchtower, Aug 15, 1968, pp. 494-501, 'Why Are You Looking Forward to 1975?'","Kingdom Ministry, May 1974, p. 3","The Watchtower, Mar 15, 1980, pp. 17-18","Awake!, Jun 8, 1969 (counsel against pursuing higher education given the nearness of the end)"],"bible":["Matthew 24:36","Acts 1:7","Deuteronomy 18:22"],"sources":[{"name":"JWFacts — 1975 quotes archive","type":"apologetics","url":"https://www.jwfacts.com/watchtower/1975.php"},{"name":"Wikipedia — History of Jehovah's Witnesses (1975 section)","type":"institutional","url":"https://en.wikipedia.org/wiki/History_of_Jehovah%27s_Witnesses"},{"name":"CARM — The Watchtower and 1975","type":"apologetics","url":"https://carm.org/jehovahs-witnesses/the-watchtower-and-1975/"},{"name":"JWFacts — publisher/b
