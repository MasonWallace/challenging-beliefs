<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Challenging Beliefs">
<meta property="og:title" content="Jehovah's Witnesses vs. the Bible — Challenging Beliefs">
<meta property="og:description" content="50 documented cases — verdicts, sources, and scripted conversations for every one.">
<meta property="og:url" content="https://masonwallace.github.io/challenging-beliefs/jw/">
<meta property="og:image" content="https://commons.wikimedia.org/wiki/Special:FilePath/The%20Great%20Isaiah%20Scroll%20MS%20A%20(1QIsa)%20-%20Google%20Art%20Project.jpg?width=1200">
<meta name="twitter:card" content="summary_large_image">
<meta name="description" content="50 documented cases — verdicts, sources, and scripted conversations for every one.">
<title>Challenging Beliefs — Jehovah's Witnesses, Examined Against the Bible</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --bg:#0f1116; --side:#0b0d11; --panel:#161a21; --panel2:#12151b; --line:#232833; --line2:#2b313d;
    --ink:#e7e9ec; --muted:#98a0ac; --dim:#565e6b; --gold:#82b1d8; --gold-ink:#0e1116;
    --red:#e0736a; --red-bg:#38221f; --red-cell:#5e2b27; --red-cell-hi:#8a3a32;
    --amber:#cf9a45; --amber-bg:#332a18; --amber-cell:#54431f; --amber-cell-hi:#7d6224;
    --green:#7fb08d; --green-bg:#1d2c26; --green-cell:#27443a;
    --purp:#b394e0; --purp-bg:#2c2440;
    --teal:#6cb6ad; --teal-bg:#16302e;
    --serif:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif;
    --sans:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    --acc:var(--gold);
    --acc2:var(--purp);
    --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  }
  :root[data-theme="light"]{
    --bg:#f3f4f6; --side:#e9ebee; --panel:#ffffff; --panel2:#f7f8fa; --line:#dfe2e7; --line2:#cfd4db;
    --ink:#1b1e23; --muted:#5c6470; --dim:#9aa1ab; --gold:#2f6b9e; --gold-ink:#ffffff;
    --red:#b03a31; --red-bg:#f6e4e2; --red-cell:#e7b6b1; --red-cell-hi:#cc766d;
    --amber:#8a5f0e; --amber-bg:#f3ecd9; --amber-cell:#e4d1a2; --amber-cell-hi:#c6a75e;
    --green:#3e7455; --green-bg:#e3ede6; --green-cell:#b7d1bf;
    --purp:#6b4fa1; --purp-bg:#ece5f6;
    --teal:#26706a; --teal-bg:#e0eeec;
  }
  *{box-sizing:border-box}
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6}
  a{color:var(--gold)}
  button{font-family:inherit}
  mark{background:color-mix(in srgb,var(--amber) 30%,transparent);color:inherit;border-radius:2px;padding:0 2px}
  kbd{font-family:var(--mono);font-size:.72rem;background:var(--panel);border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;padding:1px 6px;color:var(--muted)}

  .app{display:grid;grid-template-columns:216px minmax(0,1fr) 280px;min-height:100vh}
  @media (max-width:1020px){.app{grid-template-columns:216px minmax(0,1fr)}.preview{display:none}}
  @media (max-width:720px){.app{grid-template-columns:1fr}.side{position:sticky;top:0;z-index:40;height:auto;border-right:0;border-bottom:1px solid var(--line)}
    .side .nav{display:flex;flex-wrap:wrap;gap:2px;padding:0 10px 10px}.side .nav h5{display:none}.side .sideprog{display:none}}

  /* sidebar */
  .side{background:var(--side);border-right:1px solid var(--line);padding:18px 0;position:sticky;top:0;height:100vh;overflow-y:auto}
  @media (max-width:720px){.side{height:auto;overflow:visible}}
  .logo{font-family:var(--serif);font-size:1rem;letter-spacing:.1em;padding:0 18px 14px;color:var(--ink)}
  .logo b{color:var(--gold)}
  .sidesearch{padding:0 14px 12px}
  .sidesearch input{width:100%;font-family:inherit;font-size:.82rem;padding:7px 12px;border-radius:8px;border:1px solid var(--line2);background:var(--panel);color:var(--ink)}
  .sidesearch input:focus{outline:2px solid var(--gold);outline-offset:1px}
  .info{display:inline-grid;place-items:center;width:14px;height:14px;border:1px solid currentColor;border-radius:50%;font-size:.58rem;font-style:normal;font-weight:700;opacity:.75;cursor:help;position:relative;flex:none}
  .info:hover,.info:focus{opacity:1}
  .info .tip{display:none;position:absolute;left:50%;transform:translateX(-50%);top:160%;width:250px;background:var(--side);color:var(--ink);border:1px solid var(--line2);font-family:var(--sans);font-size:.76rem;line-height:1.5;padding:9px 12px;border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.35);z-index:30;text-transform:none;letter-spacing:0;font-weight:400;text-align:left}
  .info:hover .tip,.info:focus .tip{display:block}
  .badge,.tag{display:inline-flex;align-items:center;gap:5px}
  .nav a{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 18px;font-size:.86rem;color:var(--muted);text-decoration:none;cursor:pointer;border-left:2px solid transparent}
  .nav a:hover{background:var(--panel2);color:var(--ink)}
  .nav a.on{background:var(--panel);color:var(--ink);border-left-color:var(--gold)}
  .nav .cnt{font-family:var(--mono);font-size:.68rem;color:var(--dim)}
  .nav h5{font-size:.64rem;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin:18px 18px 6px;font-weight:600}
  .sideprog{margin:22px 18px 8px;font-size:.72rem;color:var(--muted)}
  .pbar{height:4px;background:var(--line);border-radius:2px;margin-top:6px;overflow:hidden}
  .pbar i{display:block;height:100%;background:var(--gold);transition:width .4s ease}

  /* main */
  .main{padding:18px 26px 80px;min-width:0}
  .cmd{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line2);border-radius:8px;padding:4px 8px 4px 14px;margin-bottom:18px}
  .cmd input{flex:1;background:none;border:0;color:var(--ink);font-family:inherit;font-size:.9rem;padding:7px 0;outline:none}
  .cmd input::placeholder{color:var(--dim)}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:20px}
  .tile{background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:12px 14px;cursor:pointer;text-align:left;color:var(--ink)}
  .tile:hover{border-color:var(--gold)}
  .tile.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
  .tile .v{font-family:var(--serif);font-size:1.7rem;font-variant-numeric:tabular-nums;line-height:1.1}
  .tile .l{font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:2px}
  .tile.t-ad .v{color:var(--purp)}.tile.t-un .v{color:var(--red)}.tile.t-co .v{color:var(--amber)}.tile.t-an .v{color:var(--green)}
  h4.bt{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;font-weight:600}
  .vwall{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:10px;align-items:start}
  @media (max-width:1240px){.vwall{grid-template-columns:1fr 1fr}}
  @media (max-width:700px){.vwall{grid-template-columns:1fr}}
  .vcol{background:var(--panel2);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .vcol header{padding:14px 16px 12px;border-bottom:2px solid var(--line)}
  .vcol.ad header{border-bottom-color:var(--purp)}
  .vcol.ad .n,.vcol.ad .t{color:var(--purp)}
  .vcol.ad .vt:hover{border-left-color:var(--purp)}
  .vcol.un header{border-bottom-color:var(--red)}
  .vcol.co header{border-bottom-color:var(--amber)}
  .vcol.an header{border-bottom-color:var(--green)}
  .vcol header .n{font-family:var(--serif);font-size:1.9rem;line-height:1;font-variant-numeric:tabular-nums}
  .vcol.un .n{color:var(--red)}.vcol.co .n{color:var(--amber)}.vcol.an .n{color:var(--green)}
  .vcol header .t{font-size:.72rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;margin-left:8px}
  .vcol.un .t{color:var(--red)}.vcol.co .t{color:var(--amber)}.vcol.an .t{color:var(--green)}
  .vcol header .d{font-size:.74rem;color:var(--muted);margin-top:4px}
  .vgroup h6{font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:0;padding:10px 16px 4px;font-weight:600}
  .vt{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:9px 16px 9px 13px;cursor:pointer;color:var(--ink);border-left:3px solid transparent}
  .vt:hover,.vt.sel{background:var(--panel)}
  .vt.sel{border-left-color:var(--gold)}
  .vcol.un .vt:hover{border-left-color:var(--red)}
  .vcol.co .vt:hover{border-left-color:var(--amber)}
  .vcol.an .vt:hover{border-left-color:var(--green)}
  .vt.dimmed{opacity:.25}
  .vt h5{font-family:var(--serif);font-weight:500;font-size:.92rem;line-height:1.35;margin:0}
  .vt .m{font-size:.66rem;color:var(--dim);letter-spacing:.05em;text-transform:uppercase;margin-top:2px;display:flex;gap:8px;align-items:center}
  .vt .m .rd{color:var(--green)}
  .vt .m .star{color:var(--gold)}

  /* list */
  .rows{display:flex;flex-direction:column}
  .rowitem{display:grid;grid-template-columns:12px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:11px 6px;cursor:pointer;color:var(--ink)}
  .rowitem:hover,.rowitem.sel{background:var(--panel2)}
  .rowitem .stripe{width:4px;height:26px;border-radius:2px}
  .rowitem.v-unrefuted .stripe{background:var(--red)}
  .rowitem.v-contested .stripe{background:var(--amber)}
  .rowitem.v-answered .stripe{background:var(--green)}
  .rowitem h5{font-family:var(--serif);font-weight:500;font-size:1rem;margin:0;line-height:1.35}
  .rowitem .sub{font-size:.72rem;color:var(--muted)}
  .rowitem .meta{display:flex;gap:8px;align-items:center;font-size:.66rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;white-space:nowrap}
  .rowitem .meta .rd{color:var(--green)}

  .badge{font-size:.64rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:3px 9px;border-radius:999px;display:inline-block}
  .badge.v-admitted{background:var(--purp-bg);color:var(--purp)}
  .badge.v-unrefuted{background:var(--red-bg);color:var(--red)}
  .badge.v-contested{background:var(--amber-bg);color:var(--amber)}
  .badge.v-answered{background:var(--green-bg);color:var(--green)}
  .tag{font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line2);border-radius:999px;padding:2px 9px;display:inline-block}

  /* case view */
  .backbar{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
  .backbar button.bk{background:var(--panel);border:1px solid var(--line2);color:var(--muted);border-radius:8px;padding:6px 13px;font-size:.8rem;cursor:pointer}
  .backbar button.bk:hover{color:var(--ink);border-color:var(--gold)}
  .pathnext{margin-left:auto;background:var(--gold);color:var(--gold-ink);border:0;border-radius:8px;padding:7px 14px;font-size:.8rem;font-weight:700;cursor:pointer}
  .case h2{font-family:var(--serif);font-weight:500;font-size:1.6rem;line-height:1.25;margin:10px 0 14px;max-width:30ch;text-wrap:balance}
  .case .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
  .dlab{font-size:.7rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:26px 0 10px}
  .dlab.red{color:var(--red)}.dlab.blue{color:var(--gold)}
  .claimrow{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(270px,1fr);gap:28px;align-items:start}
  .claimrow.solo{grid-template-columns:1fr}
  @media (max-width:900px){.claimrow{grid-template-columns:1fr}}
  .claim p{font-size:.97rem;line-height:1.75;max-width:66ch;margin:0 0 12px}
  .claimside{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:16px 18px;position:sticky;top:16px}
  .claimside .passcols{grid-template-columns:1fr;gap:12px}
  .claimside .sidenote{font-size:.76rem;color:var(--dim);margin:-4px 0 12px}
  .defense p.lead{margin:0 0 4px}
  .defense p{line-height:1.7;margin:0 0 10px}
  .pts{margin:8px 0 0;padding:0;list-style:none;counter-reset:pt}
  .pts li{position:relative;padding:10px 0 10px 36px;border-top:1px dashed color-mix(in srgb,var(--green) 25%,var(--line));line-height:1.7}
  .pts li:first-child{border-top:0}
  .pts li::before{counter-increment:pt;content:counter(pt);position:absolute;left:0;top:10px;width:23px;height:23px;border-radius:50%;background:var(--green-bg);color:var(--green);display:grid;place-items:center;font-size:.72rem;font-weight:700}
  .vbox p{margin:0 0 8px;line-height:1.7}
  .vbox p:last-child{margin-bottom:0}
  .ref-lds{color:var(--red);font-weight:600}
  .ref-bib{color:var(--gold);font-weight:600}
  .qq{font-family:var(--serif);font-style:italic;background:color-mix(in srgb,var(--amber) 16%,transparent);border-radius:3px;padding:0 3px}
  .kw{font-weight:700;text-decoration:underline;text-underline-offset:2px}
  .talk{background:color-mix(in srgb,var(--green) 8%,var(--panel));border:1px solid color-mix(in srgb,var(--green) 30%,var(--line));border-radius:8px;padding:16px 18px;font-size:.93rem;max-width:80ch}
  .talk p{margin:0 0 8px;line-height:1.7}
  .talk p:last-child{margin-bottom:0}
  .dlg{display:flex;flex-direction:column;gap:10px;max-width:76ch}
  .dlg .msg{border-radius:12px;padding:12px 16px;max-width:88%}
  .dlg .msg p{margin:0;font-size:.9rem;line-height:1.65}
  .dlg .who{display:block;font-size:.64rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin-bottom:4px}
  .dlg .them{align-self:flex-start;background:var(--panel);border:1px solid var(--line2);border-bottom-left-radius:4px}
  .dlg .them .who{color:var(--red)}
  .dlg .you{align-self:flex-end;background:color-mix(in srgb,var(--green) 9%,var(--panel));border:1px solid color-mix(in srgb,var(--green) 30%,var(--line));border-bottom-right-radius:4px}
  .dlg .you .who{color:var(--green)}
  .corelinks{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .corelink{font-size:.78rem;background:var(--panel2);border:1px solid var(--line2);color:var(--gold);border-radius:999px;padding:5px 13px;cursor:pointer;text-align:left}
  .corelink:hover{border-color:var(--gold)}
  .gtab{width:100%;border-collapse:collapse;font-size:.86rem;margin:14px 0 6px}
  .gtab th{text-align:left;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:8px 12px;border-bottom:2px solid var(--line2)}
  .gtab th:nth-child(2){color:var(--red)}
  .gtab th:nth-child(3){color:var(--gold)}
  .gtab td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.55}
  .gtab td:first-child{font-weight:700;white-space:nowrap;color:var(--muted)}
  .dodont{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media (max-width:700px){.dodont{grid-template-columns:1fr}}
  .dodont ul{margin:8px 0 0;padding-left:18px;font-size:.86rem;color:var(--muted)}
  .dodont li{padding:3px 0;line-height:1.55}
  .why{background:color-mix(in srgb,var(--gold) 7%,var(--panel));border:1px solid color-mix(in srgb,var(--gold) 28%,var(--line));border-radius:8px;padding:16px 18px;font-size:.93rem;max-width:80ch}
  .why p{margin:0 0 10px;line-height:1.7}
  .why .wtail{color:var(--muted);font-style:italic;margin-bottom:0;border-top:1px dashed color-mix(in srgb,var(--gold) 30%,var(--line));padding-top:10px}
  .compare2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media (max-width:760px){.compare2{grid-template-columns:1fr}}
  .pane{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
  .pane .ref{font-size:.7rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
  .pane.bom .ref{color:var(--red)}.pane.bible .ref{color:var(--gold)}
  .pane .scripture{font-family:var(--serif);font-size:1rem;line-height:1.65}
  .cnote{font-size:.8rem;color:var(--muted);margin-top:8px;max-width:80ch}
  .passcols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  /* a reference with a reason attached needs the full width, so drop to one column */
  .passcols:has(.rrow){grid-template-columns:1fr;gap:18px}
  .chips:has(.rrow){display:block}
  .rrow{display:flex;gap:10px;align-items:baseline;padding:7px 0;border-top:1px solid var(--line)}
  .rrow:first-child{border-top:none;padding-top:1px}
  .rrow .chip{flex:0 0 auto}
  .rwhy{font-size:.83rem;line-height:1.55;color:color-mix(in srgb,var(--ink) 86%,var(--muted))}
  .rwhy b{color:var(--gold);font-weight:600}
  .claimside .rrow{flex-direction:column;gap:5px;align-items:flex-start}
  @media (max-width:620px){.rrow{flex-direction:column;gap:5px;align-items:flex-start}}
  @media (max-width:760px){.passcols{grid-template-columns:1fr}}
  .passcols h6{font-size:.68rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin:0 0 8px}
  .passcols .h-bom{color:var(--red)}.passcols .h-bib{color:var(--gold)}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{font-size:.78rem;font-family:var(--serif);border:1px solid var(--line2);background:var(--panel);border-radius:6px;padding:4px 10px;cursor:pointer;color:var(--ink)}
  .chip:hover{border-color:var(--gold)}
  .chip.open{background:var(--amber-bg);border-color:var(--gold)}
  .chip.ext::after{content:" ↗";color:var(--muted);font-family:var(--sans);font-size:.68rem}
  .versebox{grid-column:1/-1;background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:8px;padding:14px 18px;margin-top:4px}
  .versebox .vr{font-size:.7rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-bottom:8px;display:flex;justify-content:space-between}
  .versebox .vr button{background:none;border:0;color:var(--muted);cursor:pointer;font-size:.8rem}
  .versebox .vtext{font-family:var(--serif);font-size:.98rem;line-height:1.7;max-width:72ch}
  .versebox .vnum{font-family:var(--sans);font-size:.62rem;color:var(--muted);vertical-align:super;margin-right:3px}
  .versebox .vwhy{margin-top:10px;font-size:.8rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px;max-width:76ch}
  .versebox .vwhy b{color:var(--gold)}
  .srcdet{margin-top:30px;border-top:1px solid var(--line);padding-top:14px}
  .srcdet summary{font-size:.74rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);cursor:pointer;list-style:none}
  .srcdet summary::before{content:"▸ ";color:var(--gold)}
  .srcdet[open] summary::before{content:"▾ "}
  .srcdet .srcs{margin-top:12px}
  .app.reading{grid-template-columns:216px minmax(0,1fr)}
  .app.reading .preview{display:none}
  body:has(.app.reading) .keysbar{right:0}
  .srcs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
  .srcs li{display:flex;gap:9px;align-items:baseline;font-size:.85rem}
  .sb{flex:none;font-size:.6rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;border-radius:4px;padding:2px 7px;position:relative;top:-1px}
  .sb-scholarly{background:var(--green-bg);color:var(--green)}
  .sb-apologetics{background:var(--amber-bg);color:var(--amber)}
  .sb-primary,.sb-institutional{background:color-mix(in srgb,var(--gold) 16%,transparent);color:var(--gold)}
  .sb-journalism{background:var(--panel);color:var(--muted);border:1px solid var(--line2)}
  .sb-testimony{background:var(--red-bg);color:var(--red)}
  .defense{background:color-mix(in srgb,var(--green) 7%,var(--panel));border:1px solid color-mix(in srgb,var(--green) 30%,var(--line));border-radius:8px;padding:16px 18px;font-size:.92rem;max-width:80ch}
  .defense .dsrc{font-size:.78rem;color:var(--muted);margin-top:10px}
  .vbox{display:flex;gap:12px;align-items:flex-start;border-radius:8px;padding:16px 18px;font-size:.92rem;max-width:80ch}

<script>
const DATA=[
{"id":"nwt-john-1-1-a-god","title":"John 1:1 — 'the Word was a god'","category":"nwt-translation","claim":"The New World Translation reads 'and the Word was a god' at John 1:1. Nearly every major English Bible reads 'the Word was God' — the KJV, NIV, ESV, NASB, NRSV, and the Catholic NAB. Bruce Metzger of Princeton called the rendering 'a frightful mistranslation,' and also 'erroneous,' 'pernicious' and 'reprehensible' (Theology Today, April 1953). The wording serves the Watchtower's denial that Christ is God. But it creates a problem their own theology cannot absorb. If the Word is 'a god' alongside Jehovah, their Bible now teaches a second, lesser god. Yet in that same Bible Jehovah says: 'before me there was no God formed, and after me there continued to be none' (NWT Isaiah 43:10). Watchtower literature defends the reading by pointing to the missing Greek definite article before theos, and to a handful of obscure translations. It also collides with John's own habit. The word theos stands without the article in John 1:6, 12, 13 and 18, and there the NWT prints 'God.'","wt":["NWT John 1:1","The Kingdom Interlinear Translation of the Greek Scriptures (1985), Appendix 2A","Should You Believe in the Trinity? (1989), pp. 26-28","jw.org, 'John 1:1—In the Beginning Was the Word'"],"bible":["John 1:1","John 1:18","Isaiah 43:10","Isaiah 44:6"],"sources":[{"name":"Bruce Metzger, 'The Jehovah's Witnesses and Jesus Christ' (Theology Today, 1953)","type":"scholarly","url":"https://www.bible-researcher.com/metzger.jw.html"},{"name":"CRI — John 1:1 and the New World Translation","type":"apologetics","url":"https://www.equip.org/articles/john-11-and-the-new-world-translation/"},{"name":"CRI — Jehovah's Witnesses and John 1:1: New Evidence Advances the Discussion","type":"apologetics","url":"https://www.equip.org/articles/jehovahs-witnesses-john-11-new-evidence-advances-discussion/"},{"name":"JW.org — John 1:1 explanation","type":"watchtower","url":"https://www.jw.org/en/bible-teachings/bible-verses/john-1-1/"},{"name":"BeDuhn, Truth in Translation (2003)","type":"scholarly","url":"https://www.goodreads.com/en/book/show/764823.Truth_in_Translation"}],"response":"Jason BeDuhn, an academic who is not a Witness, defends the rendering in Truth in Translation. He argues that a predicate theos without the article is grammatically indefinite or qualitative. So 'a god' or 'divine' is a defensible rendering, and 'the Word was God' actually over-translates the Greek. Colwell's Rule, long cited against the NWT, is not a real rule of Greek grammar requiring definiteness. Even Daniel Wallace concedes that conservative scholars misapplied it. Philip Harner's 1973 study in the Journal of Biblical Literature showed the construction is mainly qualitative: the Word has God's nature. The Watchtower says its rendering keeps that sense without collapsing the Word into the Father, whom John distinguishes in the same verse ('the Word was with God').","responseSource":{"name":"JW.org — 'Is Jesus God?' / John 1:1 article","url":"https://www.jw.org/en/bible-teachings/bible-verses/john-1-1/"},"verdict":"contested","rationale":"Grade this one honestly. The great majority of Greek scholars reject 'a god.' But the classic refutation, Colwell's Rule, is itself defective, and one credentialed non-Witness scholar substantially defends the NWT here. Harner's qualitative reading is where scholarship actually landed: 'what God was, the Word was,' as the New English Bible puts it. That reading refutes Watchtower theology, because the Word fully shares God's nature, and it does not hang on an article. In conversation, do not fight the grammar. Grant the ambiguity and press Isaiah 43:10 in their own Bible. Is Jesus a true god or a false god? Their theology has no third option.","severity":"high","plain":[{"t":"What their Bible says at John 1:1","d":"Jehovah's Witnesses use their own Bible. It is called the New World Translation. At John 1:1 it reads <b>\"and the Word was a god.\"</b> Almost every other Bible reads <b>\"the Word was God.\"</b> The Word here means Jesus."},{"t":"Why one word matters","d":"Change \"God\" to \"a god\" and Jesus becomes a lesser being. Bruce Metzger of Princeton called it <b>\"a frightful mistranslation\"</b> (Theology Today, April 1953). It also gives their Bible a second god. Isaiah 43:10 in that same Bible says none was formed before Jehovah or after him."},{"t":"Their answer, at full strength","d":"Jason BeDuhn is a scholar, and he is not a Witness. His book Truth in Translation defends \"a god\" as a fair rendering. The Greek here has no word for \"the\" before theos, the word for God. He argues that \"the Word was God\" says more than the Greek does. The old rule used to refute them, Colwell's Rule, is not really a rule. Even Daniel Wallace grants that conservative scholars misused it."},{"t":"Where the argument actually goes","d":"Philip Harner studied the phrase in 1973 in the Journal of Biblical Literature. He showed it is mostly about nature, not identity. What God was, the Word was. That is the reading the New English Bible chose. And it still sinks Watchtower teaching. The Word shares God's own nature in full."},{"t":"How strong is this argument?","d":"Genuinely arguable, both ways. Most Greek scholars reject \"a god.\" But one credentialed outsider defends it, and the old knock-down rule was faulty. Do not stake the conversation on grammar. Stake it on Isaiah 43:10."},{"say":true,"t":"What to say","d":"\"Your own Bible says at Isaiah 43:10 that no god was formed before Jehovah or after him. So is Jesus a true god, or a false one?\""}],"rewritten":true,"refwhy":{"John 1:1":"The disputed verse. The word in dispute is <i>theos</i>: their Bible reads 'a god' where nearly all others read 'God'.","John 1:18":"Here <i>theos</i> also stands with no 'the' in Greek, yet their Bible prints 'God'. That is the inconsistency.","Isaiah 43:10":"Jehovah says no god was formed before him or after him. This is the verse the case tells you to press.","Isaiah 44:6":"'Beside me there is no God' — a second Jehovah text that leaves no room for a lesser one.","NWT John 1:1":"Their own Bible at the verse itself. The whole case turns on this one printed line.","The Kingdom Interlinear Translation of the Greek Scriptures (1985), Appendix 2A":"Their own defence of 'a god', resting on the missing Greek article. Cited so you can read their case in full.","Should You Believe in the Trinity? (1989), pp. 26-28":"Their 1989 booklet against the Trinity. These pages carry the popular form of the John 1:1 argument.","jw.org, 'John 1:1—In the Beginning Was the Word'":"Their current online article on the verse. Shows what they argue today, not decades ago."},"quran":[],"hadith":["NWT John 1:1","The Kingdom Interlinear Translation of the Greek Scriptures (1985), Appendix 2A","Should You Believe in the Trinity? (1989), pp. 26-28","jw.org, 'John 1:1—In the Beginning Was the Word'"]},
{"id":"nwt-colossians-other-inserted","title":"Colossians 1:16-17 — 'other' inserted four times","category":"nwt-translation","claim":"In Colossians 1:16-17, and again in verse 20, the NWT inserts the word 'other' — 'by means of him all other things were created... he is before all other things.' The Greek words for 'other,' allos and heteros, appear nowhere in these verses in any manuscript. Paul's point is that Christ created all things, full stop. Inserting 'other' turns the passage into evidence that Christ is himself a created thing who then made everything else. That is precisely Watchtower doctrine. The editorial history is damning. The 1950 edition printed 'other' with no brackets. After criticism, later editions bracketed it, 'all [other] things,' marking it as an addition. The 2013 revision removed the brackets again, so current readers cannot see that the word is not in the Greek. The same move is not made at Romans 8:38-39 or John 1:3, where 'all things' is left alone. The insertion appears exactly where Christology is at stake.","wt":["NWT Colossians 1:16-17, 20 (1950, 1984 Reference, 2013 editions)","The Kingdom Interlinear Translation of the Greek Scriptures (1985), Colossians 1:16-17","Reasoning From the Scriptures (1985), pp. 408-409"],"bible":["Colossians 1:15-20","John 1:3","Isaiah 44:24"],"sources":[{"name":"CARM — Colossians 1:16-17 and 'all other things'","type":"apologetics","url":"https://carm.org/jehovahs-witnesses/col-116-17-all-other-things-were-created-by-him-and-the-jehovahs-witnesses/"},{"name":"Wikipedia — New World Translation (textual criticism section)","type":"institutional","url":"https://en.wikipedia.org/wiki/New_World_Translation"},{"name":"Evidence Unseen — 'All things' or 'all other things'","type":"apologetics","url":"https://www.evidenceunseen.com/bible-difficulties-2/nt-difficulties/1-2-thessalonians/col-116-all-things-or-all-other-things/"},{"name":"NWT Defended blog — Colossians 1:16 (JW-side defense)","type":"apologetics","url":"http://newworldtranslation.blogspot.com/2020/07/colossians-116-all-other-things-and-new.html"}],"response":"Defenders note that the Greek panta, 'all things,' can idiomatically imply 'all other.' Even the NIV renders Luke 13:2 'all the other Galileans' and Luke 21:29 'all the other trees,' where 'other' is absent in the Greek. Paul has just called Christ 'the firstborn of all creation' in verse 15. So the committee reasoned that 'other' merely makes explicit what the context implies: the firstborn is part of creation, so what he created is everything else. Translation always involves supplying implied words. The brackets were dropped in 2013 as part of a general move away from bracketing implied terms, not in order to deceive.","responseSource":{"name":"NWT Defended — Colossians 1:16 'all other things'","url":"http://newworldtranslation.blogspot.com/2020/07/colossians-116-all-other-things-and-new.html"},"verdict":"unrefuted","rationale":"The Luke 13:2 parallel shows that supplying 'other' is not automatically fraudulent. But there the context demands it, and here it manufactures the doctrine. Scholarship is near-unanimous that prototokos in verse 15 denotes rank and preeminence, not being created first. Psalm 89:27 is the model: God calls David his firstborn, and David was the youngest. Paul's argument through verse 20 puts Christ on the Creator side of the Creator-creation line. The insertion assumes the very doctrine it is used to prove, and the bracket removal in 2013 erased the one honest signal that the word was added. Four insertions in five verses, all in one Christological direction, is a pattern rather than a translation choice.","severity":"high","plain":[{"t":"What the verses say","d":"Colossians 1:16-17 says Christ made all things. The New World Translation adds a word. It reads <b>\"all other things.\"</b> The word \"other\" appears four times in these two verses, and again in verse 20. No Greek manuscript has it."},{"t":"What the extra word does","d":"Without it, Christ made everything. So he is not one of the things that were made. With it, Christ was made first, and then made the rest. That is Watchtower doctrine exactly. The same word is not added at John 1:3 or Romans 8:38-39."},{"t":"How the printing changed","d":"In 1950 the word was printed plainly, with no brackets. After criticism, later editions used brackets: <b>\"all [other] things.\"</b> The 2013 revision dropped the brackets again. A reader today cannot see that the word was added."},{"t":"Their answer, at full strength","d":"The Greek word panta, \"all things,\" can carry the sense \"all other.\" Even the NIV writes \"all the other Galileans\" at Luke 13:2, where \"other\" is absent. It does the same at Luke 21:29. Paul has just called Christ <b>\"the firstborn of all creation\"</b> in verse 15. So, they say, the word only spells out what the context implies. Translators supply implied words all the time."},{"t":"Where that runs out","d":"The Luke parallel is fair. There the context demands the word. Here the word manufactures the doctrine. Scholars across traditions read \"firstborn\" as rank, not birth order. In Psalm 89:27 God calls David his firstborn, and David was the youngest son. Four insertions in five verses, all pushing one way, is a pattern."},{"say":true,"t":"What to say","d":"\"Your Kingdom Interlinear prints the Greek line. Could you show me the word for 'other' in Colossians 1:16?\""}],"rewritten":true,"refwhy":{"Colossians 1:15-20":"The passage in dispute. 'Other' is added four times here and again in verse 20. No Greek copy has it.","John 1:3":"Here 'all things' is left alone. The extra word is added only where it protects their teaching.","Isaiah 44:24":"Jehovah says he made all things alone, with none beside him. That leaves no room for a created helper.","NWT Colossians 1:16-17, 20 (1950, 1984 Reference, 2013 editions)":"Three printings of their own text. The brackets round 'other' appear after 1950, then vanish in 2013.","The Kingdom Interlinear Translation of the Greek Scriptures (1985), Colossians 1:16-17":"Their interlinear prints the Greek word for word. This is what you ask a Witness to open.","Reasoning From the Scriptures (1985), pp. 408-409":"Their 1985 field handbook. Cited as where they teach that 'firstborn' means made first."},"quran":[],"hadith":["NWT Colossians 1:16-17, 20 (1950, 1984 Reference, 2013 editions)","The Kingdom Interlinear Translation of the Greek Scriptures (1985), Colossians 1:16-17","Reasoning From the Scriptures (1985), pp. 408-409"]},
{"id":"nwt-jehovah-inserted-nt","title":"'Jehovah' inserted 237 times into the New Testament","category":"nwt-translation","claim":"The NWT prints 'Jehovah' 237 times in the New Testament. The four-letter name YHWH is called the Tetragrammaton. It appears in none of the roughly 5,800 known Greek New Testament manuscripts. Every one of them reads Kyrios, 'Lord,' or Theos, 'God,' in these places. The Watchtower's support is a set of 'J documents,' listed in its own Kingdom Interlinear. Most are Hebrew versions of the New Testament, made between the 14th and 20th centuries. They were made from the very Greek text they are used to correct. The doctrinal payoff is large. At Romans 10:13 the NWT reads 'everyone who calls on the name of Jehovah will be saved.' That cuts Paul's argument in half, since verse 9 has been about calling on the Lord Jesus. The name is also withheld where Old Testament Jehovah-texts land on Jesus. Philippians 2:10-11 quotes Isaiah 45:23. 1 Peter 3:15 quotes Isaiah 8:13. Neither gets the name. That is a filter set by doctrine, not a rule of translation.","wt":["NWT Appendix A5, 'The Divine Name in the Christian Greek Scriptures' (2013)","The Kingdom Interlinear Translation of the Greek Scriptures (1985), foreword and J-reference apparatus","New World Translation Reference Bible (1984), Appendix 1D"],"bible":["Romans 10:9-13","Joel 2:32","Philippians 2:9-11","Isaiah 45:23","1 Peter 3:15","Isaiah 8:13"],"sources":[{"name":"George Howard, 'The Tetragram and the New Testament,' JBL 96/1 (1977)","type":"scholarly","url":"https://scholarlypublishingcollective.org/sblpress/jbl/article/96/1/63/186508/The-Tetragram-and-the-New-Testament"},{"name":"Tetragrammaton.org — Appendix A: the 'J' Reference Sources","type":"apologetics","url":"https://tetragrammaton.org/tetrapdxa.html"},{"name":"Wikipedia — Kingdom Interlinear Translation","type":"institutional","url":"https://en.wikipedia.org/wiki/The_Kingdom_Interlinear_Translation_of_the_Greek_Scriptures"},{"name":"NWT Appendix A5 (Watchtower's own defense)","type":"watchtower","url":"https://www.jw.org/en/library/bible/nwt/appendix-a/tetragrammaton-divine-name-new-testament/"}],"response":"The strongest defense is George Howard's 1977 thesis in the Journal of Biblical Literature. It was peer reviewed. Some pre-Christian copies of the Septuagint, the Greek Old Testament, wrote YHWH in Hebrew letters inside the Greek text. Papyrus Fouad 266 is the standard example. So writers quoting them may have done the same. Later scribes may have replaced it with the short forms known as nomina sacra. On this view the NWT restores the name and does not insert it. The Watchtower adds that Jesus said he 'made your name known' (John 17:6), that Kyrios in Old Testament quotations plainly stands for YHWH, and that the J documents show where Hebrew translators judged the name to belong.","responseSource":{"name":"NWT Appendix A5 — The Divine Name in the Christian Greek Scriptures","url":"https://www.jw.org/en/library/bible/nwt/appendix-a/tetragrammaton-divine-name-new-testament/"},"verdict":"unrefuted","rationale":"Howard's idea is real scholarship. But it covers only direct Old Testament quotations, a minority of the 237, and it rests on no New Testament manuscript at all. Howard himself protested that the Witnesses made too much of his article. The J documents are circular: late versions of the Greek cannot testify against every surviving Greek copy. Most telling is the inconsistency. The name is inserted where it guards the Father's uniqueness. It is withheld where the same Old Testament texts land on Jesus. A translation that corrects 5,800 manuscripts 237 times on instinct has stopped translating. No manuscript find has ever backed one of the 237.","severity":"high","plain":[{"t":"What was added","d":"Their Bible prints \"Jehovah\" 237 times in the New Testament. About 5,800 Greek manuscripts of the New Testament survive. The name YHWH appears in none of them. Every one reads Kyrios, \"Lord,\" or Theos, \"God.\""},{"t":"What the Watchtower cites for it","d":"Their support is a set of \"J documents.\" You can see them listed in their own Kingdom Interlinear. Most are Hebrew translations of the New Testament. They were made between the 1300s and the 1900s. They were made from the very Greek text they are used to correct."},{"t":"Their best answer, at full strength","d":"George Howard published a real thesis in 1977 in the Journal of Biblical Literature. Old Greek copies of the Old Testament, such as Papyrus Fouad 266, wrote YHWH in Hebrew letters inside the Greek. So New Testament writers quoting them may have done the same. Scribes may have swapped it out later. On that view the NWT restores the name, and does not insert it. Jesus also said he made God's name known (John 17:6)."},{"t":"Where that runs out","d":"Howard's idea covers only direct Old Testament quotations. That is a minority of the 237. It rests on no New Testament manuscript at all. Howard himself protested that the Witnesses made too much of his article. And look at where the name is left out. It is not inserted at Philippians 2:10-11, quoting Isaiah 45:23, or at 1 Peter 3:15, quoting Isaiah 8:13. Those are the places where the name lands on Jesus."},{"t":"How strong is this argument?","d":"Strong for you. At Romans 10:13 the inserted name cuts Paul's argument in half, since verse 9 is about the Lord Jesus. No manuscript find has ever backed one of the 237."},{"say":true,"t":"What to say","d":"\"If the name belongs in Romans 10:13, why is it kept out of Philippians 2:11, where the same Old Testament words are used of Jesus?\""}],"rewritten":true,"refwhy":{"Romans 10:9-13":"Verse 9 is about the Lord Jesus. Verse 13 gets 'Jehovah' in their Bible. That split is the heart of the case.","Joel 2:32":"The line Paul quotes in Romans 10:13. It does carry the divine name, which is why they insert it there.","Philippians 2:9-11":"Here the name is <i>not</i> inserted, though Paul is quoting Isaiah and the words land on Jesus.","Isaiah 45:23":"The verse Paul draws on at Philippians 2:10-11. In it, every knee bows to Jehovah himself.","1 Peter 3:15":"Peter applies an Isaiah 'Jehovah' line to Christ. Their Bible leaves the name out here too.","Isaiah 8:13":"The Isaiah verse Peter is drawing on. It tells Israel to hold Jehovah himself as holy.","NWT Appendix A5, 'The Divine Name in the Christian Greek Scriptures' (2013)":"Their 2013 appendix setting out the case for the 237 insertions. Read it before arguing about them.","The Kingdom Interlinear Translation of the Greek Scriptures (1985), foreword and J-reference apparatus":"Where the 'J documents' are listed. Most are Hebrew versions made long after the Greek.","New World Translation Reference Bible (1984), Appendix 1D":"The 1984 form of the same argument, printed before the 2013 rewrite."},"quran":[],"hadith":["NWT Appendix A5, 'The Divine Name in the Christian Greek Scriptures' (2013)","The Kingdom Interlinear Translation of the Greek Scriptures (1985), foreword and J-reference apparatus","New World Translation Reference Bible (1984), Appendix 1D"]},
{"id":"nwt-john-8-58-i-have-been","title":"John 8:58 — 'Before Abraham came into existence, I have been'","category":"nwt-translation","claim":"Where every major translation has Jesus say 'before Abraham was, I am' (ego eimi), the NWT reads 'I have been.' That dissolves the echo of God's self-identification, and explains away the crowd's immediate attempt to stone him for blasphemy in verse 59. The original justification was fabricated. The 1950 NWT footnote parsed ego eimi as the 'perfect indefinite tense' — a tense that does not exist in Greek grammar. The footnote was quietly revised in later editions, first to 'perfect tense,' then dropped in favour of an idiom argument. That is a tacit admission that the original grammar was invented. The present tense eimi, set against Abraham's 'coming into existence' (genesthai), is the same being-and-becoming contrast John opens his Gospel with in John 1:1-3. The absolute ego eimi also recurs at John 8:24 and 8:28, where even the NWT cannot supply a predicate.","wt":["NWT John 8:58 (1950 footnote: 'perfect indefinite tense'; 1984 Reference edition footnote)","The Kingdom Interlinear Translation (1985), John 8:58","Reasoning From the Scriptures (1985), pp. 417-418"],"bible":["John 8:58-59","Exodus 3:14","John 8:24","John 8:28","Isaiah 43:10 (LXX)"],"sources":[{"name":"Department of Christian Defense — the NWT and John 8:58","type":"apologetics","url":"https://christiandefense.org/general/a-concise-look-at-the-jehovah-witnesses-bible-nwt-on-john-858/"},{"name":"EarlyChurch.net — Ego Eimi in John 8:58","type":"apologetics","url":"https://www.earlychurch.net/egoeimi.htm"},{"name":"NWT Defended — ego eimi and John 8:58 (JW-side)","type":"apologetics","url":"http://newworldtranslation.blogspot.com/2018/07/egw-eimi-ego-eimi-i-am-and-john-858.html"},{"name":"Elihu Books — NWT footnotes to John 8:58 (history of the footnote changes)","type":"apologetics","url":"http://elihubooks.blogspot.com/2010/01/new-world-translation-footnotes-to-john.html"}],"response":"The serious defense is not the abandoned 'perfect indefinite tense' but the Present of Past Action idiom. A Greek present verb with an expression of past time can legitimately be rendered as an English perfect. K. L. McKay, a recognized Greek grammarian with no Watchtower ties, wrote in Expository Times in 1996 that 'I have been in existence since before Abraham was born' is an acceptable rendering of the idiom. On this reading Jesus claims pre-existence, which is itself remarkable, rather than pronouncing the divine name. The Greek Old Testament at Exodus 3:14 also identifies God as ho on, 'the Being,' not as a bare ego eimi, which weakens the direct allusion.","responseSource":{"name":"NWT Defended — EGO EIMI and John 8:58","url":"http://newworldtranslation.blogspot.com/2018/07/egw-eimi-ego-eimi-i-am-and-john-858.html"},"verdict":"contested","rationale":"Two things are true at once. The Watchtower's original grammatical justification was invented and had to be retracted through successive footnote rewrites, which is a documented embarrassment. And yet the idiom rendering itself has genuine scholarly support in McKay, so 'I have been' cannot be called flatly impossible. The context cuts against the NWT. The absolute ego eimi at John 8:24 — 'unless you believe that I am, you will die in your sins' — and the crowd reaching for stones both fit a divine claim rather than a grammar lesson. Grade this contested. In conversation, argue from the audience's reaction and from 8:24, not from tense charts.","severity":"medium","plain":[{"t":"What the verse says","d":"Every major Bible has Jesus say <b>\"before Abraham was, I am.\"</b> The Greek is ego eimi. Their Bible reads \"I have been.\" The echo of God's own name fades. So does the reason the crowd picks up stones in the next verse."},{"t":"The footnote they had to withdraw","d":"The 1950 edition explained ego eimi as the \"perfect indefinite tense.\" No such tense exists in Greek. Later editions changed the note to \"perfect tense.\" Then it was dropped for a different argument. The first explanation was simply invented."},{"t":"Their real answer, at full strength","d":"The serious defense is an idiom called the Present of Past Action. A Greek present verb plus a past time phrase can be turned into an English perfect. K. L. McKay is a recognized Greek grammarian with no Watchtower ties. He wrote in Expository Times in 1996 that <b>\"I have been in existence since before Abraham was born\"</b> is acceptable. On that reading Jesus claims to have existed before Abraham, which is still a large claim. The Greek Old Testament also has God say ho on, \"the Being,\" at Exodus 3:14, not bare ego eimi."},{"t":"Where that runs out","d":"Look at John 8:24 and John 8:28. There the same words stand with nothing after them, even in their Bible. And a grammar point does not make a crowd reach for stones. The reaction tells you what they heard."},{"t":"How strong is this argument?","d":"Genuinely arguable, both ways. Their first explanation was made up, and they had to retract it. But the idiom defense is real. Argue from the crowd and from John 8:24, not from tense charts."},{"say":true,"t":"What to say","d":"\"Read John 8:59 with me. Why did they pick up stones over a sentence about how long he had existed?\""}],"rewritten":true,"refwhy":{"John 8:58-59":"The disputed verse and the reaction. 'I am' becomes 'I have been', and in verse 59 the crowd reaches for stones.","Exodus 3:14":"God's 'I AM' at the bush — the echo the change removes. But the Greek Old Testament reads 'the Being' here, which weakens the link.","John 8:24":"The same bare 'I am' with nothing after it, even in their Bible. The case says argue from here.","John 8:28":"A second bare 'I am' in the same chapter, again with no words after it.","Isaiah 43:10 (LXX)":"In the Greek Old Testament this verse has God say 'I am'. A closer parallel than Exodus 3:14.","NWT John 8:58 (1950 footnote: 'perfect indefinite tense'; 1984 Reference edition footnote)":"Their own footnote. The 1950 note named a Greek tense that does not exist, and had to be rewritten.","The Kingdom Interlinear Translation (1985), John 8:58":"Their interlinear prints the Greek word for word. Useful for showing what stands in the text.","Reasoning From the Scriptures (1985), pp. 417-418":"Their handbook's answer on this verse. What a Witness at the door is trained to say."},"quran":[],"hadith":["NWT John 8:58 (1950 footnote: 'perfect indefinite tense'; 1984 Reference edition footnote)","The Kingdom Interlinear Translation (1985), John 8:58","Reasoning From the Scriptures (1985), pp. 417-418"]},
{"id":"nwt-hebrews-1-8-throne","title":"Hebrews 1:8 — 'God is your throne'","category":"nwt-translation","claim":"Hebrews 1:8 quotes Psalm 45:6. It is traditionally rendered 'But of the Son he says, Your throne, O God, is forever and ever' — the Father addressing the Son as God. The NWT reads 'God is your throne forever and ever,' which removes the address. Critics have long listed this among the NWT's doctrinally motivated changes, since the chapter argues for the Son's superiority to angels, and a vocative reading makes verse 8 its climax. The Greek, ho theos, is formally ambiguous between vocative and nominative. So the question is whether the NWT's choice is a defensible option or special pleading. The NWT makes the same move in the psalm itself, at Psalm 45:6. Notably, verse 10 goes on to apply Psalm 102 — words addressed to YHWH about creating heaven and earth — directly to the Son, and the NWT translates that straightforwardly.","wt":["NWT Hebrews 1:8","NWT Psalm 45:6","The Watchtower, Jan 1, 1977, pp. 63-64 (Questions From Readers on Hebrews 1:8)"],"bible":["Hebrews 1:8-12","Psalm 45:6-7","Psalm 102:25-27"],"sources":[{"name":"AvoidJW — Hebrews 1:8 Bible comparison","type":"apologetics","url":"https://avoidjw.org/news/hebrews-1-8/"},{"name":"B.F. Westcott, The Epistle to the Hebrews (via survey of scholars)","type":"scholarly","url":"http://defendingthenwt.blogspot.com/2010/12/hebrews-18-thy-throne-o-god.html"},{"name":"OnlyTrueGod.org — Hebrews 1:8 (unitarian-side survey of the grammar)","type":"apologetics","url":"https://onlytruegod.org/defense/hebrews1.8.htm"}],"response":"This is the Witnesses' strongest translation defense, because eminent Trinitarian scholars concede the point. B. F. Westcott concluded that 'it seems best to adopt in the first clause the rendering: God is thy throne.' Hort and Nairne agreed. Moffatt's translation, and the margins of the RSV, NRSV and NEB, all carry 'God is your throne.' A. T. Robertson admitted that 'it is not certain whether ho theos is here the vocative.' Psalm 45 was originally a wedding song addressed to a Davidic king, which makes 'God is your throne' — your kingship rests on God — contextually natural. And Hebrews 1:9 immediately says 'God, your God, anointed you,' so the Son has a God.","responseSource":{"name":"Defending the NWT — Hebrews 1:8","url":"http://defendingthenwt.blogspot.com/2010/12/hebrews-18-thy-throne-o-god.html"},"verdict":"answered","rationale":"This case is included deliberately, for fairness. The grammar is genuinely open, and the NWT's rendering was endorsed by Westcott, a scholar nobody accuses of anti-Trinitarian bias, before the Watchtower existed as a translating body. Most modern commentators still prefer the vocative, 'Your throne, O God,' on contextual grounds. But a rendering carried in the margins of the RSV and the NEB is not a mistranslation. Sites that list Hebrews 1:8 alongside John 1:1 weaken their own credibility. The real argument in this chapter is verses 10 to 12, where Psalm 102's words to YHWH the Creator are applied to the Son — a point the NWT leaves fully intact.","severity":"low","plain":[{"t":"The argument some Christians make","d":"Hebrews 1:8 quotes Psalm 45:6. Most Bibles read <b>\"Your throne, O God, is forever and ever.\"</b> That is the Father calling the Son God. Their Bible reads \"God is your throne forever and ever.\" Critics list this among the changes driven by doctrine."},{"t":"Their answer, and it is a good one","d":"Respected Trinitarian scholars agree with them here. B. F. Westcott concluded it seems best to read <b>\"God is thy throne.\"</b> Hort and Nairne agreed. Moffatt's translation reads that way. So do the margins of the RSV, the NRSV and the NEB. A. T. Robertson admitted it is not certain that ho theos is a direct address. Psalm 45 was a wedding song for a king of David's line, so \"God is your throne\" fits. And verse 9 says God anointed him, so the Son has a God."},{"t":"Why this one fails for you","d":"The Greek really is open here. A reading carried in the margin of the RSV and the NEB is not a mistranslation. Naming it beside John 1:1 tells an informed Witness that you are listing rather than thinking."},{"t":"Use the next verses instead","d":"Read on to Hebrews 1:10-12. It quotes Psalm 102, words spoken to Jehovah about making heaven and earth. Hebrews applies them straight to the Son. Their own Bible translates that plainly and leaves it intact."},{"t":"How strong is this argument?","d":"Weak for you. Do not lead with verse 8. Concede it, and it costs you nothing. Then read verses 10 to 12, which cost them a great deal."},{"say":true,"t":"What to say","d":"\"Verse 8 is genuinely arguable, so I'll leave it. Would you read verses 10 to 12 to me, and tell me who is being spoken to?\""}],"rewritten":true,"refwhy":{"Hebrews 1:8-12":"Covers both halves. Verse 8 is arguable. Verses 10 to 12 are the ones you should actually use.","Psalm 45:6-7":"Cuts against you. Hebrews quotes this wedding song for a king, which is why 'God is your throne' can fit.","Psalm 102:25-27":"Words spoken to Jehovah about making heaven and earth. Hebrews applies them to the Son, and their Bible keeps it.","NWT Hebrews 1:8":"Their reading, 'God is your throne'. Westcott reached the same reading, so this is not a mistranslation.","NWT Psalm 45:6":"They read the psalm the same way. That consistency is part of why the charge fails here.","The Watchtower, Jan 1, 1977, pp. 63-64 (Questions From Readers on Hebrews 1:8)":"Their printed answer on this verse, from a 1977 Questions From Readers item."},"quran":[],"hadith":["NWT Hebrews 1:8","NWT Psalm 45:6","The Watchtower, Jan 1, 1977, pp. 63-64 (Questions From Readers on Hebrews 1:8)"]},
{"id":"nwt-luke-23-43-comma","title":"Luke 23:43 — the relocated comma","category":"nwt-translation","claim":"To the thief on the cross, Jesus says, in all major translations, 'Truly I tell you, today you will be with me in paradise.' The NWT moves the comma: 'Truly I tell you today, you will be with me in paradise.' Jesus is merely saying it today, and promising paradise at some unspecified later point. The relocation protects two Watchtower doctrines at once: soul sleep, since the thief cannot be conscious anywhere that day, and a two-class afterlife, since the thief belongs to the earthly-paradise class rather than to heaven. The pattern evidence is strong. Forms of 'truly I say to you' occur over 70 times in the Gospels, and in no other instance does a time adverb attach to the saying formula rather than to the content. The earliest manuscripts, however, carry virtually no punctuation, so the comma is an editorial decision in every translation. The question is whose decision follows the evidence and whose follows doctrine.","wt":["NWT Luke 23:43","New World Translation Reference Bible (1984), Luke 23:43 footnote","The Watchtower, Feb 1, 2013, 'Truly I Tell You Today' (jw.org treatment)"],"bible":["Luke 23:42-43","Matthew 5:18","Mark 14:30","2 Corinthians 12:2-4","Philippians 1:23"],"sources":[{"name":"FaithSaves — Luke 23:43: Where Does the Comma Go?","type":"apologetics","url":"https://faithsaves.net/luke-2343-comma/"},{"name":"Grace Communion International — The Comma of Luke 23:43","type":"apologetics","url":"https://archive.gci.org/articles/the-comma-of-luke-2343/"},{"name":"NWT Defended — A History of the Comma at Luke 23:43 (JW-side)","type":"apologetics","url":"http://newworldtranslation.blogspot.com/2018/09/a-history-of-comma-at-luke-2343.html"}],"response":"The earliest Greek manuscripts had no punctuation, so no translation can claim manuscript authority for its comma. Codex Vaticanus actually has a point after semeron, 'today.' The Curetonian Syriac, from the 5th century, explicitly reads 'Truly I say to you today, that with me you will be...' Hesychius of Jerusalem, who died about 434, attests that some readers punctuated exactly as the NWT does, so this is an ancient reading rather than a Watchtower invention. Rotherham's Emphasized Bible punctuates the same way. 'I tell you this day' is a solemn Hebrew declaration idiom, as in Deuteronomy 30:18, and natural on the lips of a dying Jewish teacher. And Jesus himself was not in paradise that day; he was in the grave until the third day (Acts 10:40).","responseSource":{"name":"NWT Defended — History of the Comma at Luke 23:43","url":"http://newworldtranslation.blogspot.com/2018/09/a-history-of-comma-at-luke-2343.html"},"verdict":"contested","rationale":"The NWT's rendering is doctrinally motivated, but it has genuinely ancient attestation in the Curetonian Syriac and in Hesychius' report, and the point about manuscript punctuation is simply true. Against it stand the 70-plus occurrences of the amen formula, never elsewhere modified by 'today,' and the emptiness of Jesus solemnly noting that he is speaking 'today' to a man dying beside him. Most textual scholars side with the traditional comma, but this is a probability judgment, not a proof. Grade it contested. Use it to illustrate how doctrine steers supposedly neutral decisions, rather than as a standalone charge of mistranslation.","severity":"low","plain":[{"t":"What the verse says","d":"Jesus speaks to the thief dying beside him. Most Bibles read: <b>\"Truly I tell you, today you will be with me in paradise.\"</b> Their Bible moves the comma: <b>\"Truly I tell you today, you will be with me in paradise.\"</b> Now Jesus is only noting the day he is speaking."},{"t":"Why the comma matters","d":"It guards two teachings at once. Witnesses teach that the dead know nothing, so the thief could not be conscious that day. They also teach two futures: heaven for a few, earth for the rest. The thief belongs to the earthly group."},{"t":"Their answer, at full strength","d":"The oldest Greek copies carry almost no punctuation. So no Bible can claim manuscript backing for its comma. Codex Vaticanus has a point after the word for \"today.\" The Curetonian Syriac, from the 400s, reads it their way. Hesychius of Jerusalem, who died about 434, reports readers who punctuated like this. Rotherham's Emphasized Bible does the same. \"I tell you this day\" is also a solemn Hebrew way of speaking (Deuteronomy 30:18). And Jesus was in the grave until the third day (Acts 10:40)."},{"t":"Where that runs out","d":"The phrase \"truly I say to you\" occurs over 70 times in the Gospels. Not once does a time word attach to the formula instead of the message. And it is an odd thing to say at all. He is dying beside the man he is speaking to."},{"t":"How strong is this argument?","d":"Genuinely arguable, both ways. Most textual scholars keep the usual comma, but that is a judgment, not a proof. Use this to show how doctrine steers small choices, not as a charge of fraud."},{"say":true,"t":"What to say","d":"\"Where else in the Gospels does 'truly I tell you' need the word today attached to it?\""}],"rewritten":true,"refwhy":{"Luke 23:42-43":"The verse itself. Their Bible moves the comma, so 'today' attaches to the speaking, not to the promise.","Matthew 5:18":"One of the 70-plus 'truly I say to you' sayings. The formula stands alone, with no time word tacked on.","Mark 14:30":"Cuts against you. Here the formula <i>is</i> followed by 'this day', which is the best reply to the pattern argument.","2 Corinthians 12:2-4":"Paul places paradise in the third heaven. That tells against the earthly paradise the thief is assigned to.","Philippians 1:23":"Paul wants to 'depart and be with Christ'. Cited against the teaching that the dead know nothing.","NWT Luke 23:43":"Their own printed line, with the comma moved. The whole case is about this one mark.","New World Translation Reference Bible (1984), Luke 23:43 footnote":"Their 1984 footnote on the verse, where the punctuation argument is set out.","The Watchtower, Feb 1, 2013, 'Truly I Tell You Today' (jw.org treatment)":"Their Feb 2013 article defending the reading. This is the current form of their answer."},"quran":[],"hadith":["NWT Luke 23:43","New World Translation Reference Bible (1984), Luke 23:43 footnote","The Watchtower, Feb 1, 2013, 'Truly I Tell You Today' (jw.org treatment)"]},
{"id":"nwt-john-14-14-me-deleted","title":"John 14:14 — 'ask me' becomes 'ask'","category":"nwt-translation","claim":"In John 14:14, according to the best manuscripts, Jesus says 'If you ask ME anything in my name, I will do it.' That is a direct warrant for prayer to Jesus, which Witnesses are taught is unscriptural. The NWT drops 'me': 'If you ask anything in my name, I will do it.' What makes this case unusually clean is that the Watchtower convicts itself. The NWT's stated base text, Westcott and Hort, includes me. The Society's own Kingdom Interlinear prints me in its Greek line. The 1984 NWT Reference Bible footnote concedes that P66, Sinaiticus, Vaticanus, W, the Vulgate and the Syriac read 'ask me.' Yet the main text omits it anyway, following later Byzantine witnesses that the committee rejects everywhere else. The 2013 revision retains the omission without the footnote. Modern critical editions, NA28 and UBS5, include me, and P66 and P75 put the reading within decades of composition.","wt":["NWT John 14:14 (1950, 1984, 2013 editions)","New World Translation Reference Bible (1984), John 14:14 footnote","The Kingdom Interlinear Translation (1985), John 14:14"],"bible":["John 14:13-14","John 15:16","John 16:23","Acts 7:59","Revelation 22:20"],"sources":[{"name":"Christian Publishing House — NTTC John 14:14","type":"apologetics","url":"https://christianpublishinghouse.co/2017/04/10/john-1414-if-you-ask-me-anything-in-my-name-i-will-do-it/"},{"name":"4Jehovah (Evidence Ministries) — John 14:14: Did Jesus Say 'Ask Me'?","type":"apologetics","url":"https://www.4jehovah.org/john-1414-did-jesus-say-ask-me-anything/"},{"name":"Rightly Dividing — the textual issue of John 14:14","type":"apologetics","url":"https://rdtwot.wordpress.com/2011/07/12/hear-o-lord-praying-to-jesus-%E2%80%93-the-textual-issue-of-john-1414/"},{"name":"Defend Jehovah's Witnesses — John 14:14 (JW-side)","type":"apologetics","url":"http://defendingjehovahswitnesses.blogspot.com/2012/05/john-1414-and-new-world-translation.html"}],"response":"The omission of me is not a Watchtower invention. It appears in a substantial manuscript stream — Codices A, D, K, L and the Byzantine tradition — in some Vulgate and Syriac witnesses, and in the KJV itself, which reads 'If ye shall ask any thing in my name' and which nobody accuses of anti-Trinitarian bias. Defenders argue that 'ask me... in my name' is awkward, since one asks the Father in Jesus' name, as the immediate context says at John 14:13, 15:16 and 16:23. So me may be an early scribal intrusion, and internal coherence justifies preferring the shorter reading even against the older manuscripts.","responseSource":{"name":"Defend Jehovah's Witnesses — John 14:14 and the NWT","url":"http://defendingjehovahswitnesses.blogspot.com/2012/05/john-1414-and-new-world-translation.html"},"verdict":"unrefuted","rationale":"The KJV parallel fails, because the KJV followed the manuscripts available in 1611. The NWT committee had P66 and P75 and their own base text in front of them, and documented the better reading in their own footnote while overriding it. The text-critical method the committee applies everywhere else points one way: prefer the earliest and best witnesses, and prefer the reading that explains the others, since scribes would delete me to harmonize with 14:13. The committee went the other way, in the sole direction their theology required. When a translation follows Westcott and Hort in 7,000 places and abandons it here, the variable is not the evidence.","severity":"medium","plain":[{"t":"What the verse says","d":"The best manuscripts have Jesus say: <b>\"If you ask me anything in my name, I will do it.\"</b> That is a warrant for praying to Jesus. Witnesses are taught that praying to Jesus is wrong. Their Bible drops the word \"me.\""},{"t":"Why this case is unusually clean","d":"They convict themselves in print. Their stated base text is Westcott and Hort, which has \"me.\" Their own Kingdom Interlinear prints \"me\" in the Greek line. The 1984 Reference Bible footnote lists P66, Sinaiticus, Vaticanus, W, the Vulgate and Syriac as reading \"ask me.\" The main text leaves it out anyway. The 2013 revision keeps the omission and drops the footnote."},{"t":"Their answer, at full strength","d":"The shorter reading is not a Watchtower invention. Codices A, D, K and L omit \"me,\" and so does the Byzantine tradition. Some Vulgate and Syriac copies do too. So does the King James Version, which nobody calls anti-Trinitarian. They also argue that \"ask me in my name\" is odd. The context says to ask the Father in Jesus' name (John 14:13; John 15:16; John 16:23). So \"me\" may be an early scribal addition."},{"t":"Where that runs out","d":"The King James men used what existed in 1611. This committee had P66 and P75, which sit within decades of the writing. They had their own base text open. They printed the better reading in their own footnote, then overruled it. NA28 and UBS5 both keep \"me.\""},{"t":"How strong is this argument?","d":"Strong for you. A translation that follows Westcott and Hort in thousands of places, and leaves it in one, is not being led by the evidence."},{"say":true,"t":"What to say","d":"\"Your own 1984 footnote says the oldest manuscripts read 'ask me.' Why does the verse above the footnote not?\""}],"rewritten":true,"refwhy":{"John 14:13-14":"The verse in dispute, with the line before it. Their Bible drops the word 'me' from 'ask me'.","John 15:16":"Cuts against you a little. Here you ask the Father in Jesus' name, which is why some think 'me' was added.","John 16:23":"The same point again: ask the Father in Jesus' name. Part of their case for the shorter reading.","Acts 7:59":"Stephen prays straight to Jesus: 'Lord Jesus, receive my spirit.' The practice the missing word would back.","Revelation 22:20":"The last prayer in the Bible is spoken to Jesus: 'Come, Lord Jesus.'","NWT John 14:14 (1950, 1984, 2013 editions)":"Three printings of their own verse, all without 'me'. The 2013 one also drops the footnote.","New World Translation Reference Bible (1984), John 14:14 footnote":"Their own footnote lists P66, Sinaiticus and Vaticanus as reading 'ask me'. The verse above it does not.","The Kingdom Interlinear Translation (1985), John 14:14":"Their interlinear prints 'me' in the Greek line. It is the word left out of their Bible."},"quran":[],"hadith":["NWT John 14:14 (1950, 1984, 2013 editions)","New World Translation Reference Bible (1984), John 14:14 footnote","The Kingdom Interlinear Translation (1985), John 14:14"]},
{"id":"nwt-committee-anonymity-credentials","title":"The anonymous translation committee and Fred Franz's credentials","category":"nwt-translation","claim":"The New World Bible Translation Committee has never been named by the Watchtower. Readers are asked to accept a Bible whose translators cannot be checked. Raymond Franz, a former Governing Body member, named the committee in Crisis of Conscience. It was Nathan Knorr, Frederick Franz, George Gangas and Albert Schroeder. Frederick Franz was the principal, and the only substantially capable, translator. He had two years of Greek at the University of Cincinnati and was self-taught in Hebrew. He held no degree in biblical languages. In the 1954 Walsh trial, in the Court of Session in Scotland, Franz answered under oath 'I do not speak Hebrew.' Asked to render Genesis 2:4 into Hebrew, he replied 'No. I wouldn't attempt to do that.' No other member had any known training in the biblical languages. Every major translation names its translators and their credentials, including the NIV, ESV, NASB and NRSV.","wt":["New World Translation (1950), Foreword (committee anonymity policy)","The Watchtower, Dec 15, 1974, p. 768 (anonymity 'gives glory to God')","Douglas Walsh v. The Right Honourable James Latham Clyde (1954), trial transcript, Franz cross-examination"],"bible":["Proverbs 18:17","1 Thessalonians 5:21"],"sources":[{"name":"Walsh Trial transcript (Internet Archive scan)","type":"primary","url":"https://archive.org/details/WalshTrial"},{"name":"CRI — Fred Franz Court Transcripts, November 24, 1954","type":"apologetics","url":"https://www.equip.org/articles/fred-franz-court-transcripts-november-24-1954/"},{"name":"Bible Research (Michael Marlowe) — The New World Translation","type":"scholarly","url":"https://www.bible-researcher.com/new-world.html"},{"name":"Raymond Franz, Crisis of Conscience (4th ed., full text)","type":"primary","url":"https://friendsofraymondfranz.com/wp-content/uploads/2020/04/CC2004-Eng.pdf"},{"name":"For An Answer — Franz, LaSor, and the NWT","type":"apologetics","url":"https://www.forananswer.org/Top_JW/FranzNWT.htm"}],"response":"The Watchtower says the committee asked to stay unnamed so that glory would go to God, and to the Bible's Author, rather than to men. It notes that translations are properly judged on their merits, not on their makers' diplomas. On the merits, Jason BeDuhn ranked the NWT among the more accurate of nine English translations he compared. As for the Walsh trial, defenders point out that Franz was asked to translate English into Hebrew. That is composition. Many working Hebrew scholars would decline to do it without preparation in a courtroom. It is not the same as reading Hebrew, which Franz demonstrably did for decades. He had studied Greek formally, won a scholarship, and read several languages.","responseSource":{"name":"For An Answer — Franz, LaSor, and the NWT (documents both sides)","url":"https://www.forananswer.org/Top_JW/FranzNWT.htm"},"verdict":"unrefuted","rationale":"The core facts stand. An anonymous committee. Credentials nobody can verify. And a principal translator with two years of undergraduate Greek and self-taught Hebrew, producing a Bible that overrules credentialed scholarship at exactly the sensitive points. That account comes from a Governing Body insider who was also Franz's nephew. The steelman deserves respect on one detail. The Genesis 2:4 courtroom episode is routinely overstated by critics. Declining to compose Hebrew on the stand proves little, and sites that lead with it get fact-checked into embarrassment. Use the anonymity and the documented credentials, and skip the gotcha framing. Anonymity that prevents accountability is the issue Proverbs 18:17 names.","severity":"medium","plain":[{"t":"Who translated it","d":"The New World Bible Translation Committee has never been named by the Watchtower. Readers are asked to trust a Bible whose translators cannot be checked. Every major Bible names its translators. The NIV, ESV, NASB and NRSV all publish their credentials."},{"t":"What is known anyway","d":"Raymond Franz sat on the Governing Body and later named them. In Crisis of Conscience he lists Nathan Knorr, Frederick Franz, George Gangas and Albert Schroeder. Fred Franz did most of the work. He had two years of Greek at the University of Cincinnati, and taught himself Hebrew. He held no degree in the biblical languages. No other member had known training in them."},{"t":"The courtroom scene","d":"In 1954 Fred Franz gave evidence under oath in the Walsh trial, in the Court of Session in Scotland. Asked about Hebrew, he answered <b>\"I do not speak Hebrew.\"</b> Asked to put Genesis 2:4 into Hebrew, he said <b>\"No. I wouldn't attempt to do that.\"</b>"},{"t":"Their answer, at full strength","d":"The committee asked to stay unnamed so the glory would go to God. A translation should be judged on its work, not on diplomas. Jason BeDuhn ranked their Bible among the more accurate of nine he compared. And the court asked Franz to compose Hebrew, not to read it. Many working Hebrew scholars would decline that on the stand. Franz had studied Greek formally and won a scholarship."},{"t":"How strong is this argument?","d":"Strong on the anonymity, weak on the courtroom line. Drop the Genesis 2:4 story. Critics who lead with it get corrected. Proverbs 18:17 is the point: the first to plead his case seems right until another examines him."},{"say":true,"t":"What to say","d":"\"Who translated the Bible you handed me? I can look up every translator of mine.\""}],"rewritten":true,"refwhy":{"Proverbs 18:17":"Quoted in the case. The first to plead seems right until another examines him. Anonymity blocks the examining.","1 Thessalonians 5:21":"'Test all things' — the ground for asking who translated a Bible before you trust it.","New World Translation (1950), Foreword (committee anonymity policy)":"The 1950 foreword. This is where they state that the translators will not be named.","The Watchtower, Dec 15, 1974, p. 768 (anonymity 'gives glory to God')":"Their printed reason for staying unnamed, from 1974: the glory should go to God, not to men.","Douglas Walsh v. The Right Honourable James Latham Clyde (1954), trial transcript, Franz cross-examination":"The 1954 Scottish trial record. Under oath Fred Franz said 'I do not speak Hebrew.'"},"quran":[],"hadith":["New World Translation (1950), Foreword (committee anonymity policy)","The Watchtower, Dec 15, 1974, p. 768 (anonymity 'gives glory to God')","Douglas Walsh v. The Right Honourable James Latham Clyde (1954), trial transcript, Franz cross-examination"]},
{"id":"chron-607-vs-587","title":"607 BCE: the date archaeology refutes, on which 1914 depends","category":"chronology-607","claim":"The entire Watchtower system hangs on one date: Jerusalem destroyed in 607 BCE. Add the 'seven times' of Daniel 4, counted as 2,520 years, and you reach 1914 — Christ's invisible enthronement, followed by his appointment of the Watchtower as his channel in 1919. But no historian dates the destruction to 607. Tens of thousands of dated Babylonian business tablets, the astronomical diary VAT 4956 — whose 30 recorded lunar and planetary positions fix Nebuchadnezzar's 37th year to 568/567 BCE — Berossus, and Ptolemy's canon all converge on 587/586 BCE for his 18th year, when Jerusalem fell. The Watchtower's own 2011 article concedes that 'secular historians usually say Jerusalem was destroyed in 587 B.C.E.' (The Watchtower, Oct 1, 2011, p. 26). The Society accepts this same Neo-Babylonian evidence to fix 539 BCE for Babylon's fall, which is the anchor of its own calculation, and rejects it twenty years earlier. If 607 falls, 1914 falls, and with 1914 falls the Governing Body's claimed appointment in 1919.","wt":["The Watchtower, Oct 1, 2011, pp. 26-31, 'When Was Ancient Jerusalem Destroyed?—Part One'","The Watchtower, Nov 1, 2011, pp. 22-28, 'When Was Ancient Jerusalem Destroyed?—Part Two'","Insight on the Scriptures (1988), Vol. 1, 'Chronology,' pp. 448-467","Let Your Kingdom Come (1981), Appendix, pp. 186-189"],"bible":["Daniel 4:16-17","Luke 21:24","Jeremiah 25:11-12","Jeremiah 29:10","2 Chronicles 36:20-21","Zechariah 1:12"],"sources":[{"name":"The Watchtower Nov 1, 2011 (Part Two, full text)","type":"watchtower","url":"https://wol.jw.org/en/wol/d/r1/lp-e/2011810"},{"name":"JWFacts — 607 vs 587: the evidence","type":"apologetics","url":"https://www.jwfacts.com/watchtower/607-587.php"},{"name":"Carl Olof Jonsson, The Gentile Times Reconsidered (Internet Archive)","type":"scholarly","url":"https://archive.org/details/the-gentile-times-reconsidered"},{"name":"Wikipedia — VAT 4956","type":"institutional","url":"https://en.wikipedia.org/wiki/VAT_4956"}],"response":"The Watchtower's defense runs like this. The Bible says Judah would be a desolate waste and would serve Babylon seventy years (Jeremiah 25:11; 2 Chronicles 36:21). Babylon fell in 539 BCE, a date secular chronology itself supplies. The exiles returned by 537, and counting seventy literal years back from 537 yields 607. Where clay tablets and God's Word conflict, the tablets yield: copyists erred, court astronomers may have back-calculated positions, and the Neo-Babylonian records passed through pagan and Seleucid hands. The 2011 article argues that VAT 4956's lunar positions actually fit 588 BCE as Nebuchadnezzar's 37th year, which places his 18th year at 607, and notes that a lunar eclipse also occurred in 588.","responseSource":{"name":"The Watchtower, Nov 1, 2011 — When Was Ancient Jerusalem Destroyed? Part Two","url":"https://www.jw.org/en/library/magazines/wp20111101/When-Was-Ancient-Jerusalem-Destroyed-Part-Two/"},"verdict":"unrefuted","rationale":"The defense is internally inconsistent. It accepts the Neo-Babylonian astronomical and commercial record absolutely for 539 BCE, and declares the same record corrupt for 587 — with the corruption conveniently spanning exactly the twenty years the doctrine requires. Scripture does not require their reading either. Jeremiah 25:11 makes the seventy years a servitude of 'these nations' to Babylon, ending in 539. Jeremiah 29:10 reads 'seventy years for Babylon.' Zechariah 1:12 counts seventy years of indignation, from 587 to 517. And the business-tablet record is continuous: every regnal year of every Neo-Babylonian king is attested by dated contracts, which leaves no room to insert twenty phantom years. Nothing in the Watchtower's response engages that continuity.","severity":"high","plain":[{"t":"The date everything hangs on","d":"Witnesses teach that Jerusalem fell in 607 BCE. Add the \"seven times\" of Daniel 4, counted as 2,520 years, and you reach 1914. That is when they say Christ was enthroned unseen. In 1919 he then chose the Watchtower as his channel. If 607 goes, all of that goes with it."},{"t":"What the evidence says","d":"No historian dates the fall to 607. Tens of thousands of dated Babylonian business tablets point elsewhere. So does the sky diary VAT 4956, whose 30 recorded moon and planet positions fix Nebuchadnezzar's 37th year to 568/567 BCE. Berossus and Ptolemy's canon agree. All of it lands on 587/586 BCE. Their own magazine grants the point: secular historians usually say 587 (The Watchtower, Oct 1, 2011, p. 26)."},{"t":"Their answer, at full strength","d":"Scripture says Judah would lie waste and serve Babylon seventy years (Jeremiah 25:11; 2 Chronicles 36:21). Babylon fell in 539 BCE. The exiles were home by 537. Count seventy years back and you get 607. Where clay tablets and God's word clash, the tablets yield. Copyists erred, court astronomers may have worked backwards, and the records passed through pagan hands. Their 2011 article argues the moon data in VAT 4956 fits 588 BCE, and notes an eclipse that year."},{"t":"Where that runs out","d":"They accept that same Babylonian record without question for 539 BCE. That date is the anchor of their own sum. The corruption they allege covers exactly the twenty years the doctrine needs. Scripture does not require their count either. Jeremiah 25:11 makes the seventy years a term of service by \"these nations\" to Babylon. Jeremiah 29:10 reads seventy years \"at Babylon.\" Zechariah 1:12 counts seventy years of anger, 587 to 517. And every regnal year of every Babylonian king is covered by dated contracts. There is no gap to put twenty years into."},{"t":"How strong is this argument?","d":"Strong for you, and it holds up the whole building. No 607, no 1914. No 1914, no inspection in 1919. No 1919, no appointment, and no duty to obey."},{"say":true,"t":"What to say","d":"\"You take the B
