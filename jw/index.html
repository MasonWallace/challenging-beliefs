{"id":"abuse-civil-cases","title":"Conti, Lopez, and the Civil Litigation Record","category":"institutional","claim":"US courts have repeatedly found Watchtower bodies negligent in child-abuse cases. They have also found them willing to defy discovery rather than open their files. Candace Conti won over $28 million from a jury in Alameda County in 2012. It was then the largest US award to one victim in a religious abuse case. The jury found the Watchtower and a Fremont congregation negligent. A known molester had been left in field service with children. On appeal the punitive award was reversed. The negligence findings stood, along with about $2.8 million, and the case settled in 2015. Jose Lopez won a $13.5 million default judgment in San Diego in 2014, from Judge Joan Lewis. It included $10.5 million in punitive damages. It followed a refusal to obey court orders to produce an internal database of child-abuse files. Those files answer to a letter of March 14, 1997, telling congregations to report known molesters to headquarters. The default was later reversed on appeal, in favour of lesser sanctions. The case over the same abuser ran on until a confidential settlement. That man, Gonzalo Campos, molested at least eight children while being repeatedly reinstated. The pattern is consistent. The files exist. The organization fights hard to keep them sealed. It settles when a court compels production.","wt":["Body of Elders letter, March 14, 1997: congregations to report known child molesters to the branch — the database at issue in Lopez.","Watchtower appellate briefs in Conti v. Watchtower (2015): no duty to warn congregation members.","jw.org statements following verdicts: policy is that elders comply with law and abhor child abuse."],"bible":["Luke 12:2-3","Romans 13:1-4","1 Timothy 5:20"],"sources":[{"name":"CBS San Francisco — Conti damages cut to $2.8M on appeal","type":"journalism","url":"https://www.cbsnews.com/sanfrancisco/news/jehovahs-witnesses-molested-woman-court-fremont/"},{"name":"NBC San Diego — $13.5M Lopez judgment","type":"journalism","url":"https://www.nbcsandiego.com/news/local/135m-awarded-to-bible-teacher-gonzalo-campos-alleged-abuse-victim-jose-lopez/62352/"},{"name":"Zalkin Law Firm — Lopez default judgment release","type":"primary","url":"https://www.prweb.com/releases/the_zalkin_law_firm_wins_13_5_million_default_judgment_against_the_jehovah_s_witnesses_watchtower_on_behalf_of_childhood_sexual_abuse_victim/prweb12295835.htm"},{"name":"Watchtower Documents — Conti court documents archive","type":"primary","url":"https://watchtowerdocuments.org/candace-conti-court-documents/"},{"name":"jwfacts — Watchtower child abuse settlements","type":"scholarly","url":"https://jwfacts.com/watchtower/child-abuse-settlements.php"}],"response":"The Watchtower's defense is that it has never been found to harbour abusers as policy. The punitive award in Conti was reversed precisely because malice was not proven. Appeal courts have divided on a real question: whether a church must warn members about a member's past sins confessed in confidence. Clergy-penitent privilege is a centuries-old protection, and every faith invokes it. The refusals in discovery protected thousands of uninvolved third parties named in church files, rather than hiding a cover-up. And settlements are ordinary risk management, not admissions.","responseSource":{"name":"Conti v. Watchtower, 235 Cal.App.4th 1214 (2015) — Watchtower's partially successful appeal; Lopez v. Watchtower, 246 Cal.App.4th 566 (2016); jw.org newsroom statements","url":"https://www.cbsnews.com/sanfrancisco/news/jehovahs-witnesses-molested-woman-court-fremont/"},"verdict":"unrefuted","rationale":"The verdicts, the sanctions and the 1997 letter are court record. The negligence finding in Conti survived appeal. Graded unrefuted rather than admitted, because the organization contests fault and won real reductions on appeal. State both sides of each number. The $28 million figure without the $2.8 million outcome is misleading. So is the Lopez default without its later reversal. The unanswered core is the pattern: a standing internal file of abusers, opened only under compulsion.","severity":"high","plain":[{"t":"Candace Conti, 2012","d":"A jury in Alameda County awarded her over $28 million. At the time it was the largest US award to one victim in a church abuse case. The jury found the Watchtower and a Fremont congregation negligent. A known molester had been left in field service with children. On appeal the punitive award was reversed. The negligence findings stood, along with about $2.8 million. The case settled in 2015."},{"t":"Jose Lopez, 2014","d":"Judge Joan Lewis in San Diego entered a default judgment of $13.5 million. That included $10.5 million in punitive damages. It followed a refusal to obey court orders. The orders sought an internal database of child abuse files. Those files answer to a letter of March 14, 1997, telling congregations to report known molesters to headquarters. The default was later reversed on appeal, in favour of lesser sanctions. The case over the same man, Gonzalo Campos, ran on to a sealed settlement. He had abused at least eight children, and was put back in good standing again and again."},{"t":"The pattern across cases","d":"The files exist. The Watchtower fights hard to keep them sealed. It settles when a court finally forces them open."},{"t":"Their answer, at full strength","d":"They have never been found to shelter abusers as policy. The punitive award in Conti fell precisely because malice was not proven. Courts have split on whether a church must warn members about sins confessed in confidence. Clergy confidence is an old protection, and every faith leans on it. Refusing discovery shielded thousands of uninvolved people named in church files. And a settlement is ordinary risk management, not a confession."},{"t":"How strong is this argument?","d":"Strong for you, if you state it accurately. The verdicts, the sanctions and the 1997 letter are court record. The negligence finding in Conti survived appeal. Give both numbers. The $28 million without the $2.8 million outcome is misleading. So is the Lopez default without its reversal. What no one has answered is the pattern. There is a standing file of abusers, and it opens only under court order."},{"say":true,"t":"What to say","d":"\"There is a file at headquarters listing known abusers. Why did it take a court order to open it?\""}],"rewritten":true,"refwhy":{"Luke 12:2-3":"'Nothing is covered up that will not be uncovered.' Cited for files opened only under court order.","Romans 13:1-4":"The state carries the sword against wrongdoing. It is the authority the files were kept from.","1 Timothy 5:20":"Paul says reprove sinners before all, so others take warning. The opposite of a sealed file.","Body of Elders letter, March 14, 1997: congregations to report known child molesters to the branch — the database at issue in Lopez.":"The 1997 letter telling congregations to report known molesters to the branch. It built the database.","Watchtower appellate briefs in Conti v. Watchtower (2015): no duty to warn congregation members.":"Their appeal argument: there is no duty to warn members about a person's past.","jw.org statements following verdicts: policy is that elders comply with law and abhor child abuse.":"Their public answer after the verdicts. Elders obey the law, and abuse is abhorred."},"quran":[],"hadith":["Body of Elders letter, March 14, 1997: congregations to report known child molesters to the branch — the database at issue in Lopez.","Watchtower appellate briefs in Conti v. Watchtower (2015): no duty to warn congregation members.","jw.org statements following verdicts: policy is that elders comply with law and abhor child abuse."]},
{"id":"failed-date-prophecies","title":"A Century of Failed Dates: 1914, 1925, 1975, 'This Generation'","category":"institutional","claim":"The organization that claims to be God's sole channel has a documented record of failed time-prophecies published as near-certainties. 1914 was to be the end of earthly governments, later reinterpreted as an invisible enthronement. For 1925, Millions Now Living Will Never Die (1920, pp. 89-90) promised the resurrection of Abraham, and a San Diego mansion, Beth Sarim, was deeded for the returning patriarchs. For 1975, Life Everlasting in Freedom of the Sons of God (1966, pp. 29-30) fixed the end of 6,000 years of human history. Kingdom Ministry of March 1968 (p. 4) said 'there are only about ninety months left.' Kingdom Ministry of May 1974 (p. 3) praised members 'selling their homes and property... Certainly this is a fine way to spend the short time remaining before the wicked world's end.' Membership fell measurably after 1976. The 1914 generation deadline stood on the Awake! masthead until 1995, and was then redefined twice, most recently as an overlapping generation (April 15, 2010) with no falsifiable content. The Watchtower of March 15, 1980 (pp. 17-18) conceded regret over the 1975 expectations. The Watchtower of April 1, 1972 (pp. 197-199) had identified the organization as God's 'prophet.' Deuteronomy 18:22 supplies the test it set for itself.","wt":["Millions Now Living Will Never Die (1920), p. 89-90: 1925 as the resurrection of the ancient worthies.","Life Everlasting in Freedom of the Sons of God (1966), pp. 29-30: 6,000 years end in 1975.","Kingdom Ministry, March 1968, p. 4: 'only about ninety months left.'","Kingdom Ministry, May 1974, p. 3: brothers 'selling their homes and property... Certainly this is a fine way to spend the short time remaining.'","The Watchtower, April 1, 1972, pp. 197-199: 'Identifying the \"Prophet\".'","The Watchtower, March 15, 1980, pp. 17-18: admission of responsibility for 1975 expectations.","The Watchtower, April 15, 2010: the 'overlapping generation' redefinition."],"bible":["Deuteronomy 18:20-22","Matthew 24:36","Acts 1:7","Matthew 24:34 (the redefined text)"],"sources":[{"name":"jwfacts — 1975: Watchtower quotes on what was predicted","type":"scholarly","url":"https://www.jwfacts.com/watchtower/1975.php"},{"name":"Wikipedia — Unfulfilled Watch Tower Society predictions (fully cited)","type":"scholarly","url":"https://en.wikipedia.org/wiki/Unfulfilled_Watch_Tower_Society_predictions"},{"name":"JW Watch — 2017 convention video whitewash of 1975","type":"scholarly","url":"https://jwwatch.org/conventions/watchtower-whitewashes-failed-1975-prophecy-2017-convention-video"}],"response":"The Witness defense is that the organization never claimed inspiration or infallibility. Its statements were not the word of Jehovah in the Deuteronomy 18 sense, but the fallible efforts of imperfect men eagerly awaiting Christ's return, self-corrected in print. They cite the 1980 admission itself as evidence of honesty. First-century disciples also expected the kingdom imminently and wrongly (Acts 1:6; Luke 19:11), without being false prophets. Watchful expectation, even overeager, obeys the command to keep on the watch (Matthew 24:42).","responseSource":{"name":"The Watchtower, March 15, 1980; Awake! March 22, 1993, pp. 3-4; Reasoning From the Scriptures, 'False Prophets'","url":"https://www.jwfacts.com/watchtower/1975.php"},"verdict":"admitted","rationale":"Every prediction is quoted from their own dated publications, and the 1980 Watchtower admitted responsibility for 1975 in print, so the record is conceded. The 'never claimed inspiration' defense collides with the same literature, which called the organization God's prophet in 1972 and demanded the expulsion of members who doubted the dates while they were current. That asymmetry — fallible when wrong, sole channel when obeyed — is the point to press. Severity high.","severity":"high","plain":[{"t":"The record in one place","d":"The body that says it is God's only channel has a long list of dated predictions that failed. 1914 was to end earthly governments. It was later reinterpreted as an unseen enthronement. 1925 was to bring back Abraham; Beth Sarim, a San Diego mansion, was deeded for the returning princes. Millions Now Living Will Never Die (1920, pp. 89-90) carried the promise."},{"t":"1975 in their own words","d":"Life Everlasting in Freedom of the Sons of God (1966, pp. 29-30) put the end of 6,000 years of human history in 1975. Kingdom Ministry of March 1968 (p. 4) said there were <b>\"only about ninety months left.\"</b> Kingdom Ministry of May 1974 (p. 3) praised members <b>\"selling their homes and property... Certainly this is a fine way to spend the short time remaining.\"</b> Membership fell measurably after 1976."},{"t":"The generation, then no deadline at all","d":"The 1914 generation deadline stood on the Awake! masthead until 1995. It was then redefined twice. The 2010 version is an overlapping generation, which nobody can test. The Watchtower of March 15, 1980 (pp. 17-18) did concede regret over 1975. The Watchtower of April 1, 1972 (pp. 197-199) had identified the organization as God's prophet."},{"t":"Their answer, at full strength","d":"They never claimed inspiration or infallibility. Their statements were the fallible work of imperfect men eagerly awaiting Christ's return, not the word of Jehovah in the sense of Deuteronomy 18. They corrected themselves in print, and they cite the 1980 admission as evidence of honesty. First-century disciples expected the kingdom at once, and were wrong (Acts 1:6; Luke 19:11), without being false prophets. Watching eagerly obeys the command to keep on the watch (Matthew 24:42)."},{"t":"How strong is this argument?","d":"They admit this themselves. Every prediction is quoted from their own dated magazines, and 1980 admitted responsibility for 1975. The \"never claimed inspiration\" defense meets the same shelf of books, which called the organization God's prophet in 1972 and expelled members who doubted the dates while they stood. Fallible when wrong, sole channel when obeyed. Press that asymmetry."},{"say":true,"t":"What to say","d":"\"Deuteronomy 18:22 gives a test for a prophet. How does the 1975 teaching do on that test?\""}],"rewritten":true,"refwhy":{"Deuteronomy 18:20-22":"The test the case applies. A word that fails was not spoken by Jehovah.","Matthew 24:36":"'No one knows the day or the hour.' The line every date on this list runs into.","Acts 1:7":"'It is not for you to know the times or the seasons.' Jesus refusing to give a date.","Matthew 24:34 (the redefined text)":"The generation saying. It was redefined twice after 1995, until nothing testable was left.","Millions Now Living Will Never Die (1920), p. 89-90: 1925 as the resurrection of the ancient worthies.":"The 1920 promise that 1925 would bring Abraham and the prophets back.","Life Everlasting in Freedom of the Sons of God (1966), pp. 29-30: 6,000 years end in 1975.":"The 1966 book putting the end of 6,000 years of history in 1975.","Kingdom Ministry, March 1968, p. 4: 'only about ninety months left.'":"March 1968, in print: 'only about ninety months left.'","Kingdom Ministry, May 1974, p. 3: brothers 'selling their homes and property... Certainly this is a fine way to spend the short time remaining.'":"May 1974. Praise for members selling homes and property for the short time left.","The Watchtower, April 1, 1972, pp. 197-199: 'Identifying the \"Prophet\".'":"The 1972 article 'Identifying the Prophet'. It names the organization as that prophet.","The Watchtower, March 15, 1980, pp. 17-18: admission of responsibility for 1975 expectations.":"The 1980 admission. They accept a share of the blame for the 1975 hopes.","The Watchtower, April 15, 2010: the 'overlapping generation' redefinition.":"The 2010 overlapping generation. It leaves nothing that anyone alive can test."},"quran":[],"hadith":["Millions Now Living Will Never Die (1920), p. 89-90: 1925 as the resurrection of the ancient worthies.","Life Everlasting in Freedom of the Sons of God (1966), pp. 29-30: 6,000 years end in 1975.","Kingdom Ministry, March 1968, p. 4: 'only about ninety months left.'","Kingdom Ministry, May 1974, p. 3: brothers 'selling their homes and property... Certainly this is a fine way to spend the short time remaining.'","The Watchtower, April 1, 1972, pp. 197-199: 'Identifying the \"Prophet\".'","The Watchtower, March 15, 1980, pp. 17-18: admission of responsibility for 1975 expectations.","The Watchtower, April 15, 2010: the 'overlapping generation' redefinition."]},
{"id":"birthdays-holidays-ban","title":"No Birthdays, No Holidays: The Two-Beheadings Argument","category":"practice","claim":"Jehovah's Witnesses may not keep birthdays or holidays. Keeping one, and not backing down, can bring a hearing. The birthday argument runs like this. Scripture records only two such parties. One is Pharaoh's (Genesis 40:20-22). One is Herod's (Matthew 14:6-10). Both men were pagan rulers, and both parties were marked by a death. So God's servants do not keep them. As reasoning, this argues from silence, then blames a custom for where it came from. The deaths were down to tyrants, not to cake. Scripture also shows Job's children feasting 'each one on his own day,' with no rebuke (Job 1:4). And no verse commands or implies the ban. The same origins test would forbid wedding rings and the names of the weekdays, which the Watchtower allows. So the test is not applied evenly. The Bible's own rule for days is liberty. 'One man judges one day as above another; another judges one day as all others; let each one be fully convinced in his own mind' (Romans 14:5-6; compare Colossians 2:16). The issue is not whether standing apart is allowed. It is. The issue is that a matter Paul leaves to conscience is enforced by shunning. The movement itself kept Christmas until 1928, and birthdays until about 1951.","wt":["Reasoning From the Scriptures (1985), pp. 68-70: the two-birthdays argument.","Awake!, 'Birthday Celebrations Have Left a Trail of Death' framing (see wol.jw.org).","Historical note: birthdays and Christmas were celebrated by the organization itself — Christmas until 1928, birthdays until c. 1951."],"bible":["Romans 14:4-6","Colossians 2:16-17","Job 1:4","Genesis 40:20-22","Matthew 14:6-10"],"sources":[{"name":"Birthday — Insight entry (wol.jw.org)","type":"primary","url":"https://wol.jw.org/en/wol/d/r1/lp-e/1200010747"},{"name":"CRI — Birthday celebrations and Jehovah's Witnesses","type":"scholarly","url":"https://www.equip.org/articles/birthday-celebrations-jehovahs-witnesses/"},{"name":"jw.org — Why don't JWs celebrate birthdays (official)","type":"primary","url":"https://www.jw.org/en/jehovahs-witnesses/faq/birthdays/"}],"response":"The steelman is stronger than the caricature. No early Christian kept birthdays. Origen wrote that only sinners, Pharaoh and Herod among them, mark the day of their birth. So the Witness reading has early-church backing. Cakes, candles and wishes do come down from pagan charms, per standard reference works. And nobody is harmed by sitting one out. Christmas rests on a date and customs that are not Christian, plus a nativity timeline many non-Witness scholars doubt. Standing apart honours a conscience aimed at pure worship (2 Corinthians 6:17).","responseSource":{"name":"jw.org FAQ on birthdays and holidays; Insight on the Scriptures, 'Birthday'; Origen, Homilies on Leviticus VIII (their patristic parallel)","url":"https://wol.jw.org/en/wol/d/r1/lp-e/1200010747"},"verdict":"contested","rationale":"Graded conservatively. Standing apart is a fair use of liberty, with real early-church backing, and mocking it plays badly. What is not contested is the enforcement. Romans 14:5 leaves days to each person. Watchtower policy makes a birthday proof that you have left, with family shunning downstream. Aim the case at the force, not at the quiet conscience. Severity low.","severity":"low","plain":[{"t":"What the rule is","d":"Witnesses may not keep birthdays or holidays. Keeping one, and not backing down, can bring a hearing. The birthday case runs like this. The Bible records only two such parties. One is Pharaoh's (Genesis 40:20-22). One is Herod's (Matthew 14:6-10). Both men were pagan kings. Both parties ended with a death. So God's servants do not keep them."},{"t":"Why that reasoning is weak","d":"It argues from silence. Then it blames a custom for where it came from. The deaths were down to tyrants, not to cake. The Bible also shows Job's children feasting <i>each one on his own day</i>, with no rebuke (Job 1:4). And no verse forbids it. That same test would rule out wedding rings and the names of the weekdays. The Watchtower allows both. So the test is not applied evenly."},{"t":"Their answer, at full strength","d":"The real case is better than the caricature. No early Christian kept birthdays. Origen wrote that only sinners, such as Pharaoh and Herod, mark the day of their birth. So the Witness reading has early-church backing. Cakes, candles and wishes do come down from pagan charms, per standard reference works. Nobody is harmed by sitting one out. Christmas rests on a date and customs that are not Christian, and on a nativity timeline many non-Witness scholars doubt. Standing apart honours a conscience aimed at pure worship (2 Corinthians 6:17)."},{"t":"Where the real problem is","d":"Not in standing apart. In being made to. Paul leaves days to each person. Romans 14:5-6 says it plainly: <b>\"let each one be fully convinced in his own mind.\"</b> One man rates one day above another. Another rates every day alike. See also Colossians 2:16. Watchtower policy treats a birthday as proof that you have left, with family shunning downstream. Note also that the movement kept Christmas until 1928, and birthdays until about 1951."},{"t":"How strong is this argument?","d":"Genuinely arguable, both ways. Sitting these out is a fair use of liberty, and it has early-church backing. Mocking it plays badly. Aim only at the force, never at the quiet conscience."},{"say":true,"t":"What to say","d":"\"I have no problem with you skipping birthdays. My question is why Romans 14:5 does not make it your own call.\""}],"rewritten":true,"refwhy":{"Romans 14:4-6":"'Let each one be fully convinced in his own mind.' Paul leaves days to conscience. The heart of the case.","Colossians 2:16-17":"'Let no one judge you over a festival or a new moon.' The same freedom, stated again.","Job 1:4":"Job's children feast 'each one on his own day', and no rebuke follows.","Genesis 40:20-22":"Pharaoh's birthday, and a hanging. One of the two parties their whole argument rests on.","Matthew 14:6-10":"Herod's birthday, and a beheading. The other half of the two-birthdays argument.","Reasoning From the Scriptures (1985), pp. 68-70: the two-birthdays argument.":"Their handbook, where the two-birthdays argument is laid out for use at the door.","Awake!, 'Birthday Celebrations Have Left a Trail of Death' framing (see wol.jw.org).":"An Awake! framing of birthdays as a trail of death. The popular form of the case.","Historical note: birthdays and Christmas were celebrated by the organization itself — Christmas until 1928, birthdays until c. 1951.":"The note that the movement kept Christmas until 1928, and birthdays until about 1951."},"quran":[],"hadith":["Reasoning From the Scriptures (1985), pp. 68-70: the two-birthdays argument.","Awake!, 'Birthday Celebrations Have Left a Trail of Death' framing (see wol.jw.org).","Historical note: birthdays and Christmas were celebrated by the organization itself — Christmas until 1928, birthdays until c. 1951."]},
{"id":"higher-education-discouraged","title":"Higher Education Discouraged — and the Measurable Cost","category":"practice","claim":"For decades the Watchtower has warned young people off university. Its books and convention talks call higher education a moral and spiritual danger. The Watchtower of October 1, 2005 (pp. 26-31) urged young ones toward theocratic goals instead. Anthony Morris III of the Governing Body gave a broadcast in May 2017, 'What Is the Best Education?', urging Bethel service over degrees. In 2023 Stephen Lett likened sending a child to university to a school of hungry sharks. Circuit overseers have been told that an elder whose family pursue higher education may lose his appointment. The result can be measured. The Religious Landscape data from Pew Research puts the share of US Witnesses with a bachelor's degree at about 9%. That is the lowest of any major US religious group surveyed. The national average is about 35%, and household incomes track it. Meanwhile their own senior counsel, Philip Brumley, holds a law degree. Bethel keeps qualified lawyers, doctors and engineers on hand, with the very skills the counsel would have kept members from getting. Scripture nowhere treats learning as apostasy. Moses was schooled in all Egypt's wisdom (Acts 7:22). Paul studied under Gamaliel (Acts 22:3). And 'the plans of the diligent one surely make for advantage' (Proverbs 21:5). A 2025 Governing Body update recast education as a personal choice, after the generations who obeyed had paid the cost.","wt":["The Watchtower, October 1, 2005, pp. 26-31: young ones urged toward theocratic goals over university.","Kingdom Ministry and convention direction from the 1969 assembly era: education pointless given the nearness of the end.","Anthony Morris III, 'What Is the Best Education?' (JW Broadcasting, May 2017).","Governing Body Update (2025): education reframed as personal choice."],"bible":["Acts 7:22","Acts 22:3","Proverbs 21:5","1 Timothy 5:8","Hosea 4:6"],"sources":[{"name":"Pew Research — Which US religious groups are most highly educated?","type":"institutional","url":"https://www.pewresearch.org/short-reads/2026/02/19/which-us-religious-groups-are-most-highly-educated/"},{"name":"NPR — Lack of education leads to lost dreams and low income for many JWs","type":"journalism","url":"https://www.npr.org/transcripts/510585965"},{"name":"jwfacts — JW stance against university","type":"scholarly","url":"https://www.jwfacts.com/watchtower/higher-education-university.php"},{"name":"avoidjw — 2025 GB update reframes education as personal choice","type":"scholarly","url":"https://avoidjw.org/news/higher-education-doctrinal-changes-governing-body-update-2025/"}],"response":"The Witness defense is that education was never banned. They require literacy and teach millions to read, and they leave schooling to families. Their counsel weighs real data that secular writers raise too: student debt, campus culture, and graduates in jobs that do not need a degree. Trade training has been urged for years. And the claim is about priority. If the Kingdom is real, seeking it first (Matthew 6:33) is rational, and warning against careerism is what any serious faith does.","responseSource":{"name":"jw.org FAQ 'Do Jehovah's Witnesses Ban Certain Books or Discourage Education?'; The Watchtower education articles; 2025 GB Update","url":"https://www.pewresearch.org/short-reads/2026/02/19/which-us-religious-groups-are-most-highly-educated/"},"verdict":"admitted","rationale":"The counsel is in their own broadcasts and magazines. The outcome is measured by neutral survey data from Pew. So both ends of the chain are documented. The 'personal choice' framing is genuine, but it arrived only in 2025. And the effect on elder appointments is documented in circuit direction. Severity medium. The costs are real and countable, though not bodily harm.","severity":"medium","plain":[{"t":"What has been taught","d":"For decades, university has been described as a spiritual danger. The Watchtower of October 1, 2005 (pp. 26-31) urged young ones toward theocratic goals instead. Governing Body member Anthony Morris III gave a broadcast in May 2017 called \"What Is the Best Education?\", urging Bethel service over degrees. In 2023 Stephen Lett compared sending a child to university to a school of hungry sharks. Circuit overseers have been directed that an elder whose family pursue higher education may lose his appointment."},{"t":"What it has cost, in numbers","d":"Pew Research measured it. About 9% of US Jehovah's Witnesses hold a bachelor's degree. That is the lowest of any major US religious group surveyed, against a national average of about 35%. Household incomes track it."},{"t":"The exception at headquarters","d":"Their own senior counsel, Philip Brumley, holds a law degree. Bethel keeps qualified lawyers, doctors and engineers on hand. Those are exactly the skills the counsel would have kept members from getting."},{"t":"Their answer, at full strength","d":"They have never banned education. They require literacy and teach millions to read, and they leave schooling to families. Their counsel weighs real data that secular writers also raise: student debt, campus culture, graduates in jobs that do not need degrees. Vocational training has been encouraged for years. And the priority is spiritual. If the Kingdom is real, seeking it first (Matthew 6:33) is rational, and warning against careerism is what any serious faith does."},{"t":"How strong is this argument?","d":"They admit this themselves. The counsel is in their own broadcasts and magazines, and the outcome is measured by neutral survey data. A 2025 Governing Body update reframed education as a personal choice. That is genuine, and it arrived after the generations who obeyed had paid for it. Scripture never treats learning as apostasy. Moses was schooled in all Egypt's wisdom (Acts 7:22). Paul studied under Gamaliel (Acts 22:3). <b>\"The plans of the diligent one surely make for advantage\"</b> (Proverbs 21:5)."},{"say":true,"t":"What to say","d":"\"Moses was trained in all the wisdom of Egypt and Paul studied under Gamaliel. What changed?\""}],"rewritten":true,"refwhy":{"Acts 7:22":"Moses was schooled in all the wisdom of Egypt. Luke states it as a credit, not a danger.","Acts 22:3":"Paul studied under Gamaliel. He names his training as a credential.","Proverbs 21:5":"'The plans of the diligent one surely make for advantage.' Quoted in the case itself.","1 Timothy 5:8":"A man must provide for his household. That bears on the income the counsel costs.","Hosea 4:6":"'My people perish for lack of knowledge.' Note the context is knowledge of God, which softens the use.","The Watchtower, October 1, 2005, pp. 26-31: young ones urged toward theocratic goals over university.":"The 2005 article. It steers the young toward church goals, and away from university.","Kingdom Ministry and convention direction from the 1969 assembly era: education pointless given the nearness of the end.":"Counsel from the 1969 era. Education is pointless, because the end is close.","Anthony Morris III, 'What Is the Best Education?' (JW Broadcasting, May 2017).":"A 2017 broadcast by a Governing Body member, urging Bethel service over a degree.","Governing Body Update (2025): education reframed as personal choice.":"The 2025 update, making it a personal choice. It came after the cost had been paid."},"quran":[],"hadith":["The Watchtower, October 1, 2005, pp. 26-31: young ones urged toward theocratic goals over university.","Kingdom Ministry and convention direction from the 1969 assembly era: education pointless given the nearness of the end.","Anthony Morris III, 'What Is the Best Education?' (JW Broadcasting, May 2017).","Governing Body Update (2025): education reframed as personal choice."]},
{"id":"avoid-no-medical-treatment","title":"DON'T USE: 'JWs Refuse All Medical Treatment'","category":"practice","claim":"Here is a common but false claim: that Jehovah's Witnesses reject medicine generally, like extreme faith-healing groups. In fact they accept virtually all medical care. Surgery, medication, chemotherapy, vaccination (encouraged since 1952), organ transplants (permitted since 1980), and intensive care. The sole standing prohibition is whole blood and its four primary components. The organization also operates a large apparatus specifically to connect members with bloodless medicine and cooperative surgical teams: Hospital Information Services, and roughly 1,700 or more Hospital Liaison Committees in over 110 countries. That effort has genuinely advanced transfusion-alternative techniques, which are now used for patients who are not Witnesses. Using the 'no medicine' claim hands a Witness an easy and honest refutation, and it discredits the accurate criticisms — the 1945 origin of the blood ban, the incoherence of the fractions policy, and the celebrated deaths. Keep the critique precise. The issue is one lethal prohibition with shifting boundaries, not hostility to medicine.","wt":["jw.org medical library: Hospital Liaison Committees and bloodless surgery resources.","Awake! and The Watchtower routinely counsel seeking quality medical care."],"bible":[],"sources":[{"name":"jw.org — Hospital Liaison Committees for Jehovah's Witnesses","type":"primary","url":"https://www.jw.org/en/medical-library/medical-information/hospital-liaison-committees/hln/"},{"name":"jw.org — Bloodless surgery and medicine by specialty","type":"primary","url":"https://www.jw.org/en/medical-library/bloodless-surgery-medicine/"}],"response":"Not applicable. This entry exists to stop the site from using a false claim.","responseSource":{"name":"jw.org medical library","url":"https://www.jw.org/en/medical-library/medical-information/hospital-liaison-committees/hln/"},"verdict":"answered","rationale":"The claim is simply false, and it is easily refuted from jw.org itself. Marked avoid so the site never runs it. The accurate and damning material is the blood-specific record.","severity":"low","avoid":true,"plain":[{"t":"The claim to stop making","d":"That Jehovah's Witnesses reject medicine, like the extreme faith-healing groups. It is false, and it is easy for them to disprove."},{"t":"What they actually accept","d":"Almost all of it. Surgery. Medication. Chemotherapy. Vaccines, encouraged since 1952. Organ transplants, permitted since 1980. Intensive care. The one standing ban is whole blood and its four primary parts."},{"t":"What they have built","d":"The organization runs Hospital Information Services and roughly 1,700 Hospital Liaison Committees, in more than 110 countries. They connect members with bloodless medicine and willing surgical teams. That effort has genuinely advanced techniques that avoid transfusion, and those techniques now help patients who are not Witnesses at all."},{"t":"Why the false version costs you","d":"It hands a Witness an easy and honest correction. Worse, it discredits the accurate criticisms standing beside it: the 1945 origin of the blood ban, the fractions line that does not hold, and the children celebrated in 1994."},{"t":"How strong is this argument?","d":"Do not use this one. Keep the criticism precise. The issue is one lethal ban with a shifting boundary. It is not hostility to medicine."},{"say":true,"t":"What to say","d":"\"I know you take medicine and surgery. My question is only about blood, and about where the line moved.\""}],"rewritten":true,"refwhy":{"jw.org medical library: Hospital Liaison Committees and bloodless surgery resources.":"Their own medical pages. They show a group seeking care, not refusing it.","Awake! and The Watchtower routinely counsel seeking quality medical care.":"Their magazines urging members to get good medical care. This is what sinks the false claim."},"quran":[],"hadith":["jw.org medical library: Hospital Liaison Committees and bloodless surgery resources.","Awake! and The Watchtower routinely counsel seeking quality medical care."]},
{"id":"avoid-jws-worship-russell","title":"DON'T USE: 'JWs Worship Charles Taze Russell'","category":"doctrine-of-god","claim":"This is a stale accusation from older anti-cult literature: that Jehovah's Witnesses venerate or follow the person of C.T. Russell. Modern Witnesses do not worship, venerate, or even much read Russell. The organization abandoned substantial parts of his theology — pyramidology, the details of his chronology, and his views on the higher powers. It renamed itself in 1931, partly to shed the Russellite label, and his writings are not in print or in study use. Calling Witnesses 'Russellites,' or claiming they revere him, signals to an informed Witness that the critic is recycling material from generations ago and has not engaged the current religion. The legitimate adjacent point is that the organization claims for its Governing Body an authority functionally similar to what it condemns in other religions' hierarchies. Make that point directly, using the sole-channel material and the Jackson testimony, rather than through a false personality-cult charge.","wt":["The Watchtower has itself repudiated veneration of Russell and the 'Russellite' label (1931 name change; later historical retrospectives)."],"bible":[],"sources":[{"name":"Wikipedia — Watch Tower Bible and Tract Society history","type":"scholarly","url":"https://en.wikipedia.org/wiki/Watch_Tower_Bible_and_Tract_Society_of_Pennsylvania"},{"name":"jw.org — history of the name Jehovah's Witnesses","type":"primary","url":"https://www.jw.org/en/jehovahs-witnesses/faq/why-called-jehovahs-witnesses/"}],"response":"Not applicable. This entry exists to stop the site from using a false claim.","responseSource":{"name":"Organizational history, both JW and independent","url":"https://en.wikipedia.org/wiki/Watch_Tower_Bible_and_Tract_Society_of_Pennsylvania"},"verdict":"answered","rationale":"False as stated. Modern Witnesses distance themselves from Russell. Use Russell only for what he documents — the 'dissolved into gases' resurrection teaching, and the early instruction that Jesus was properly worshipped — and never as a personality-cult charge.","severity":"low","avoid":true,"plain":[{"t":"The claim to stop making","d":"That Jehovah's Witnesses revere or follow Charles Taze Russell as a man. It comes out of anti-cult books written a long time ago."},{"t":"What is actually true","d":"Today they do not worship Russell, and few of them read him. The Society dropped much of what he taught. It dropped his pyramid teaching. It dropped the details of his dates. It dropped his view of the higher powers. It took a new name in 1931, partly to shed the Russellite label. His books are not in print, and not in use."},{"t":"Why it costs you","d":"Call them Russellites and any Witness can place your source. It was written before they were born. It tells them you have not looked at the faith as it is now."},{"t":"The real point underneath it","d":"There is a fair version of this. They grant the Governing Body a power much like the one they attack in other churches. Make that point straight. Use the sole-channel material, and what Geoffrey Jackson said on oath."},{"t":"How strong is this argument?","d":"Do not use this one. Use Russell only for what he wrote. He taught that the body of Jesus may have been turned to gas. That is a real quote. So is his line that Jesus was rightly worshipped."},{"say":true,"t":"What to say","d":"\"I'm not interested in Russell as a person. I'm interested in who has authority now, and where that authority comes from.\""}],"rewritten":true,"refwhy":{"The Watchtower has itself repudiated veneration of Russell and the 'Russellite' label (1931 name change; later historical retrospectives).":"Their own record of dropping the Russellite label, including the name change in 1931."},"quran":[],"hadith":["The Watchtower has itself repudiated veneration of Russell and the 'Russellite' label (1931 name change; later historical retrospectives)."]},
{"id":"avoid-2024-shunning-ended","title":"DON'T USE: 'The 2024 Changes Ended Shunning'","category":"shunning-exit","claim":"Here is an overclaim that has circulated since March 2024: that Jehovah's Witnesses abolished shunning. Here is what actually changed, per Governing Body Update #2 (March 2024, Mark Sanderson) and the August 2024 Watchtower. Members may now offer a simple greeting to a removed person. They may invite them to meetings. Elders may make shepherding visits, and study the Bible with them. 'Disfellowshipping' was renamed 'removal from the congregation.' The judicial and reinstatement steps were streamlined. And minors are handled with a parent present. Here is what did not change. Expulsion itself. The announcement. The rule against normal fellowship and social contact. The treatment of a formal resignation as the same as expulsion. And the loss of normal family life with relatives outside the household. Ex-member groups and mainstream coverage agree that the core stands. Saying shunning 'ended' lets a Witness correct the site truthfully. It also concedes, without meaning to, that the softer policy is adequate. The accurate framing is stronger. The 2024 changes quietly admit that the old severity was policy, not scripture. What was mandatory cruelty in 2023, refusing even a hello, became optional kindness in 2024, and no new biblical text was found in between.","wt":["Governing Body Update #2 (March 2024): greeting and meeting invitations permitted.","The Watchtower, August 2024, study articles 'removed from the congregation.'","Shepherd the Flock of God, 2024-2025 revisions: association restrictions retained."],"bible":["2 Thessalonians 3:14-15","Luke 15:20"],"sources":[{"name":"avoidjw — JWs to relax shunning rules? Not really","type":"scholarly","url":"https://avoidjw.org/news/jehovahs-witnesses-to-relax-shunning-rules/"},{"name":"Watchtower Documents — 2024 GB Update #2 changes","type":"scholarly","url":"https://watchtowerdocuments.org/shocking-doctrinal-changes-in-2024-governing-body-update-2/"},{"name":"jwfacts — disfellowshipping page (updated for 2024)","type":"scholarly","url":"https://www.jwfacts.com/watchtower/disfellowship-shunning.php"}],"response":"Not applicable. This entry exists to prevent an overclaim. The accurate version of the criticism lives in the shunning-mechanics-family case.","responseSource":{"name":"GB Update #2 (March 2024); The Watchtower August 2024","url":"https://avoidjw.org/news/jehovahs-witnesses-to-relax-shunning-rules/"},"verdict":"answered","rationale":"The change is real but limited, and it has been verified against both Witness-sourced descriptions and ex-Witness analyses. The stronger and accurate argument is that the softening itself proves the previous severity was policy discretion, not divine law.","severity":"low","avoid":true,"plain":[{"t":"The overclaim","d":"Since March 2024 people have said that Jehovah's Witnesses abolished shunning. They did not."},{"t":"What actually changed","d":"Governing Body Update #2 of March 2024, given by Mark Sanderson, and the August 2024 Watchtower set it out. Members may now offer a simple greeting to a removed person, and invite them to meetings. Elders may make shepherding visits and study the Bible with them. Judicial steps and reinstatement were streamlined. Minors are handled with a parent present. And \"disfellowshipping\" became \"removal from the congregation.\""},{"t":"What did not change","d":"Expulsion itself. The announcement. The direction against normal social contact. Treating a formal resignation the same as being thrown out. And the loss of normal family life with relatives outside the household. Ex-member groups and mainstream coverage agree the core stands."},{"t":"Why the overclaim costs you","d":"It lets a Witness correct you truthfully. It also concedes, without meaning to, that the softer version is good enough."},{"t":"How strong is this argument?","d":"Do not use this one. Use the accurate version, which is stronger. What was compulsory cruelty in 2023, refusing even a hello, became optional kindness in 2024. No new verse was discovered in between. That tells you the old severity was policy, not divine law."},{"say":true,"t":"What to say","d":"\"In 2023 you could not say hello. In 2024 you can. Which Bible verse changed?\""}],"rewritten":true,"refwhy":{"2 Thessalonians 3:14-15":"'Keep admonishing him as a brother.' Neither the old rule nor the new one reaches that.","Luke 15:20":"The father runs to the son while he is still far off. There is no greeting rule at all.","Governing Body Update #2 (March 2024): greeting and meeting invitations permitted.":"The March 2024 update. This is what actually changed: a greeting, and an invitation.","The Watchtower, August 2024, study articles 'removed from the congregation.'":"The August 2024 articles. They changed the name of the practice, not the practice.","Shepherd the Flock of God, 2024-2025 revisions: association restrictions retained.":"The revised elders' manual. It keeps the limits on contact in place."},"quran":[],"hadith":["Governing Body Update #2 (March 2024): greeting and meeting invitations permitted.","The Watchtower, August 2024, study articles 'removed from the congregation.'","Shepherd the Flock of God, 2024-2025 revisions: association restrictions retained."]},
{"id":"avoid-dismiss-persecution-record","title":"DON'T USE: dismissing their courage under persecution","category":"institutional","claim":"'They're just a cult — there's nothing to respect about them.' It is used to wave away the movement wholesale, usually as a preface to an argument about 1914 or blood.","response":"This one is not merely rude. It is false, and a Witness knows the history far better than the person using it. Under the Third Reich, Jehovah's Witnesses were the only group persecuted purely for a religious position they could have ended at any moment by signing a renunciation. Roughly 10,000 were imprisoned. Around 1,500 died. About 250 were executed for refusing military service. They wore the purple triangle in the camps, and the survivor literature, including accounts from Jewish survivors, repeatedly describes them as the prisoners least likely to inform and most likely to share food. In the United States they litigated their way to the Supreme Court more than fifty times between 1938 and 1955, and the case law they won belongs to everyone. West Virginia v. Barnette (1943) established that no American can be compelled to salute a flag or profess a belief. Cantwell v. Connecticut (1940) applied the Free Exercise Clause to the states. Much of the religious-liberty protection every American church now relies on was bought by Jehovah's Witnesses in court. Russia banned the organization as extremist in 2017 and has imprisoned members since, so the persecution is not only historical.","responseSource":{"name":"United States Holocaust Memorial Museum, \"Jehovah's Witnesses\"; West Virginia State Board of Education v. Barnette, 319 U.S. 624 (1943); Cantwell v. Connecticut, 310 U.S. 296 (1940); European Court of Human Rights, Taganrog LRO and Others v. Russia (2022)","url":"https://encyclopedia.ushmm.org/content/en/article/jehovahs-witnesses"},"sources":[{"name":"USHMM Holocaust Encyclopedia — Jehovah's Witnesses","type":"scholarly","url":"https://encyclopedia.ushmm.org/content/en/article/jehovahs-witnesses"},{"name":"West Virginia State Board of Education v. Barnette (1943)","type":"primary","url":"https://supreme.justia.com/cases/federal/us/319/624/"},{"name":"Cantwell v. Connecticut (1940)","type":"primary","url":"https://supreme.justia.com/cases/federal/us/310/296/"},{"name":"ECtHR — Taganrog LRO and Others v. Russia (2022)","type":"scholarly","url":"https://hudoc.echr.coe.int/eng?i=001-217173"}],"bible":["Matthew 5:10-12","1 Peter 3:15-16","Romans 12:10"],"verdict":"answered","severity":"low","avoid":true,"rationale":"Avoid this, because it is false and because it destroys your standing in one sentence. The courage is real. The legal legacy is real. And a Witness has heard it since childhood, because it is part of how the organization proves to members that opposition equals truth. Saying it first, unprompted and with genuine respect, does the opposite. It takes the persecution narrative off the table as a defense mechanism, and makes room for the actual questions. Note the distinction that does the work. Their willingness to suffer proves sincerity, which nobody disputes. It does not prove the doctrine, which is what is in question. Every martyr in history was sincere, and the Bereans were commended for checking the message anyway (Acts 17:11).","talk":"Say it out loud before you say anything else: **'Your people stood up to Hitler when almost nobody else would, and the religious-liberty law my church depends on was won by Witnesses in court.'** Mean it. Then, much later and gently: *'Does being willing to die for something make it true, or only make you sincere?'*","plain":[{"t":"The sentence to never say","d":"\"They're just a cult, there's nothing to respect about them.\" It usually comes out as a warm-up to a point about 1914 or blood. It is not only rude. It is false, and the Witness in front of you knows the history far better than you do."},{"t":"What they did under the Third Reich","d":"They were the one group held for a belief they could drop at any moment. A signature on a form would have freed them. Roughly 10,000 were jailed. Around 1,500 died. About 250 were put to death for refusing to serve in the army. They wore the purple triangle in the camps. Survivors, Jewish survivors among them, describe them as the least likely to inform and the most likely to share food."},{"t":"What they won in American courts","d":"Between 1938 and 1955 they took more than fifty cases to the Supreme Court. What they won belongs to everyone. West Virginia v. Barnette (1943) held that no American can be made to salute a flag, or to state a belief. Cantwell v. Connecticut (1940) applied the free exercise of faith to the states. Much of the religious freedom every US church leans on was bought by Jehovah's Witnesses in court."},{"t":"It is not only history","d":"Russia banned them as extremist in 2017. Members have been jailed there ever since."},{"t":"Why saying it first helps","d":"A Witness has heard this story since childhood. It is part of how the group proves to members that opposition means truth. Say it yourself, first, and mean it. Then that defense has nowhere to go. Then note the line that does the work. Willingness to suffer proves sincerity. Nobody disputes their sincerity. It does not prove the doctrine, and the doctrine is the question. Every martyr in history was sincere. The Beroeans were praised for checking the message anyway (Acts 17:11)."},{"say":true,"t":"What to say","d":"\"Before anything else: what your people did under Hitler, and what you won at the Supreme Court, I respect completely.\""}],"rewritten":true,"refwhy":{"Matthew 5:10-12":"'Blessed are those persecuted for righteousness.' Why their record deserves plain respect.","1 Peter 3:15-16":"Give your answer 'with mildness and deep respect'. The tone this whole entry is about.","Romans 12:10":"'Take the lead in showing honour to one another.' The rule the dismissive line breaks."},"quran":[],"hadith":[]}

const WHYTAIL={"admitted":"The facts here sit in the organization's own publications — the only dispute is what they mean. In conversation, cite them exclusively from Watchtower sources; a Witness can verify every word in their own library.","unrefuted":"No adequate answer to this has been published. A Witness must either live with the tension or produce a response the Governing Body has not yet managed.","contested":"There is a genuine debate here — the honest move is to read both sides and weigh which explanation asks less of the evidence.","answered":"Fairly weighed, the defense wins this one. Christians who keep using it weaken their own credibility on the claims that do stand."};
const WHYMAP={"nwt-translation":"If a translation is edited to fit a doctrine, the doctrine can never be tested by the text — the ruler has been bent to match the board.","chronology-607":"1914 is the foundation stone: no 607, no 1914; no 1914, no 1919 appointment; no appointment, no obligation to obey the Governing Body.","failed-dates":"Deuteronomy 18:22 gives one test for a voice claiming to speak for God — and the record here is public, dated, and printed by the organization itself.","prophecy-authority":"Everything a Witness believes arrives through one channel. Whether that channel is what it claims decides everything downstream.","doctrine-of-god":"This is where salvation itself is at stake: a created archangel cannot bear the weight Scripture puts on the Son.","two-class-salvation":"The New Testament knows one flock, one hope, one table — a system that tells most believers not to touch the bread and wine has no apostolic precedent.","blood-doctrine":"This doctrine has a body count, and the line it draws has been redrawn repeatedly by committee.","shunning-exit":"A message that is true does not need exit costs. This is the machinery that keeps every other question unexamined.","institutional":"'By their fruits you will know them' applies to every tree — including the one claiming to be God's only channel.","practice":"Where Scripture leaves liberty, binding every conscience organization-wide is what Jesus rebuked in the Pharisees."};
const TALK={"nwt-translation":"Never say *“your Bible is fake.”* Say: **“Can we read this verse in your Bible and in mine, side by side?”** Then let the insertion do the work — at Colossians 1:16-17 ask, *“Why is ‘other’ in brackets here but not in the 1950 edition? What Greek word is it translating?”* A Witness who checks the Kingdom Interlinear at that verse is doing the whole argument for you.","chronology-607":"Do not lecture on Neo-Babylonian tablets. Ask: **“Where does the Bible say 607?”** It doesn't — 607 comes from subtracting 70 from 537, and every secular source dates the fall of Jerusalem to 587. Then the quiet follow-up: *“If 607 moves, what happens to 1914?”* Leave it there. This is a seed, not a hammer.","failed-dates":"Read Deuteronomy 18:20-22 together first — let Scripture set the test, not you. Then: **“Has the organization ever published a date that didn't happen?”** Most Witnesses know about 1975. Very few know about 1925 and the Beth Sarim mansion. Ask, don't tell — *“Would you look up Beth Sarim in your own library?”*","prophecy-authority":"The paradox is the whole conversation: **“Is the faithful and discreet slave inspired?”** Their publications say no. Then: *“If it isn't inspired, why is disagreeing with it grounds for losing my family?”* Ask it gently and without triumph. This question has walked more Witnesses out than any argument about 607.","doctrine-of-god":"Go to John 20:28 in their own Bible and read it aloud: *“My Lord and my God.”* Then ask, **“What did Jesus say back? Did he correct him?”** Follow with Hebrews 1:6 — *“Does the NWT say the angels worship him, or ‘do obeisance’? What did it say before 1971?”* One verse, in their Bible, beats ten in yours.","two-class-salvation":"At the Memorial the emblems pass by untouched — ask about that: **“Jesus said ‘drink ye all of it.’ Why did you pass it?”** Then 1 Timothy 2:5: *“Is Christ your mediator, or only theirs?”* This is the most personal question on the site. Ask it with tears in your eyes, not a raised eyebrow.","blood-doctrine":"Never open here — it is their identity and their martyrdom. If it comes up: **“Why is hemoglobin a conscience matter when the red cell it came from is a disfellowshipping offense?”** Then Acts 15 in context — *“Is this a dietary ruling for table fellowship, or a medical rule about transfusion?”* One question, then silence.","shunning-exit":"This is the wall around everything else, and the person in front of you may lose their mother over this conversation. Say it out loud: **“I know what this could cost you, and I'm not asking you to pay it today.”** Then the only question that matters: *“If it's the truth, why does leaving it have to cost you your family?”*","institutional":"Use their own standard, never a sneer: **“You test other religions by their fruits — would you apply the same test here?”** Name the UN NGO years and the Royal Commission plainly, from the primary documents, and stop. Contempt for the organization reads as contempt for them.","practice":"Where Scripture leaves liberty, don't argue the liberty — argue the conscience. **“Where does the Bible forbid a birthday?”** and then Romans 14: *“Paul says one man esteems one day above another — why isn't this a conscience matter?”* Keep it light; this is the least important door in the house."};
const DIALOG={"nwt-translation":[{"w":"them","t":"The New World Translation is the most accurate Bible available — it restored God's name and freed the text from Christendom's bias. John 1:1 correctly reads 'the Word was a god.'"},{"w":"you","t":"I love that you take translation seriously — most people never check. Help me with one thing: **who translated it?** Every other major Bible publishes its committee's names and credentials so scholars can be examined."},{"w":"them","t":"The translators chose to remain anonymous so the glory goes to Jehovah, not to men."},{"w":"you","t":"That's a beautiful motive — but it also means no one can verify their Greek and Hebrew. The one member later identified, Frederick Franz, had no degree in biblical languages. And on 'a god': the same Greek construction appears in John 1:6, 1:12, 1:18 — the NWT translates it 'God' there. **Why does theos become 'a god' only in the one verse where it describes Jesus?**"},{"w":"them","t":"The Governing Body has scholars who reviewed all of this. Jehovah's organization wouldn't give us an inaccurate Bible — we trust the channel Jehovah is using."},{"w":"you","t":"And I hear that trust — it's sincere. But notice what just happened: the answer to a Greek grammar question was 'trust the organization.' The Beroeans were praised for checking even the apostle Paul against Scripture. **If the translation can only be defended by trusting its publisher, how would you ever find out if it were wrong?** I'd genuinely love to read John 1 with you in any translation you pick — even an interlinear from your own Kingdom Hall library."}],"chronology-607":[{"w":"them","t":"Bible chronology proves Jerusalem was destroyed in 607 BCE, and counting the 'seven times' of Daniel 4 — 2,520 years — brings you exactly to October 1914, when Christ began ruling as King."},{"w":"you","t":"You clearly know this material better than most — can I ask about just the starting point? Every reference work, every Babylonian business tablet, and astronomical diaries like VAT 4956 date Jerusalem's fall to 587 or 586 BCE. **Do you know of any historian or archaeologist outside the organization who defends 607?**"},{"w":"them","t":"Secular historians rely on pagan records that can be wrong. We start from the Bible: Jerusalem lay desolate seventy years, and Babylon fell in 539 — count back and you get 607."},{"w":"you","t":"That's fair reasoning, so let's use only the Bible: Jeremiah 25:11-12 says the seventy years are nations serving the KING OF BABYLON, ended by Babylon's fall in 539 — servitude, not desolation, which fits 605-539. And Zechariah 1:12, written around 519, speaks of seventy years still being lamented — decades after your count ends. But here's my real question: **if 607 moves by even twenty years, what happens to 1914?**"},{"w":"them","t":"1914 is confirmed by world events — war, earthquakes, the sign of the last days. The faithful slave has helped us understand the chronology, and the events prove they were right."},{"w":"you","t":"Yet the organization itself was appointed — by its own teaching — in 1919 BECAUSE 1914 was true. The date proves the organization and the organization vouches for the date; that circle is worth sitting with. I say this as a friend, not a prosecutor: **you deserve a foundation that survives checking.** Would you be willing to look at the seventy-years verses with me sometime, just the two of us and the text?"}],"failed-dates":[{"w":"them","t":"Jehovah's people have always been eager for the end — sometimes expectations ran ahead of the light. But Proverbs 4:18 says the light gets brighter, and our understanding has been refined."},{"w":"you","t":"I appreciate the honesty in that — everyone's tradition has embarrassments, mine included. But can we look at the specifics together? 1914 was preached as the end of all earthly governments; 1925 was 'definitely settled by the Scriptures' for Abraham's return — there was a mansion waiting; 1975 emptied savings accounts. **These weren't private guesses — they were published worldwide as Scripture's own timetable.**"},{"w":"them","t":"Even the apostles expected the Kingdom in their day. Being wrong about timing out of eagerness isn't the same as being a false prophet."},{"w":"you","t":"The apostles asked and Jesus said it wasn't theirs to know — and after Pentecost they never once published a date. Here's the test I can't get around: Deuteronomy 18:22 says when a word spoken in Jehovah's name does not come true, don't fear it. The Watchtower called itself Jehovah's channel while announcing those dates. **Does 'brighter light' explain saying false things in Jehovah's name — or does it just rename them?**"},{"w":"them","t":"The organization has admitted mistakes were made. What matters is that Jehovah kept using them — look at the worldwide preaching work. No one else is doing that."},{"w":"you","t":"Notice, though — when the dates failed, members who said so were disfellowshipped, while the leaders who published them kept their seats. That asymmetry troubles me for your sake, not against you. **If a hundred years of dated predictions all failed, what future claim from the same source could ever be tested?** You're allowed to love God and still ask that. I'll ask it with you anytime, over coffee, no scorekeeping."}],"prophecy-authority":[{"w":"them","t":"Jesus said the faithful and discreet slave would give food at the proper time. In 1919 he inspected all who claimed to serve God and appointed the anointed brothers taking the lead — today the Governing Body — over all his belongings."},{"w":"you","t":"That's the load-bearing wall of everything else, isn't it — so it's worth weighing carefully. Just historically: **what was Christ inspecting in 1919 that he approved?** In 1919 the Society was still teaching that the Great Pyramid was God's stone witness, that the last days began in 1799, and that Christ returned in 1874. All of that was later discarded as error — some of it as satanic."},{"w":"them","t":"They had some wrong expectations, but their hearts were clean and they were preaching the Kingdom. Jehovah looks at the heart."},{"w":"you","t":"Amen — he does, and I don't doubt those hearts. But the claim isn't 'sincere people'; it's a legal appointment as the sole channel of truth, dated to a year when nearly everything they taught was, by the current Governing Body's own standard, false. And Matthew 24 is a parable urging EVERY servant to stay faithful — verse 48 warns the same slave could prove wicked. **Where in the text is a 1919 appointment of a corporation — and who verified it besides the corporation?**"},{"w":"them","t":"Someone has to take the lead. Jehovah has always used an organization — Israel, then the first-century governing body in Jerusalem. Without the slave we'd have confusion, like Christendom's thousands of sects."},{"w":"you","t":"Order matters, agreed — but Acts 15 shows apostles and elders reasoning from Scripture in the open, and Paul telling churches to test even angels and apostles against the gospel (Galatians 1:8, Acts 17:11). Unity purchased by forbidding examination isn't the unity of the Spirit; it's the silence of the room. Gently: **if the appointment claim is true, it can survive your investigation — so what would it cost you to investigate it?** I'm safe company for that question, whenever you want."}],"doctrine-of-god":[{"w":"them","t":"We worship Jehovah, the only true God. Jesus is his Son — the first creation — and never claimed to be God. The Trinity confuses people and dishonors the Father."},{"w":"you","t":"Can I say first — your reverence for God's honor is something I genuinely respect. Let me ask about one scene: risen Jesus stands before Thomas, who says 'My Lord and my GOD' (John 20:28). Jesus doesn't correct him — he blesses those who believe the same without seeing. **If Jesus were not God, wasn't that the moment to say so?**"},{"w":"them","t":"Thomas was exclaiming in astonishment — or acknowledging Jesus as 'a god,' a divine one, like the NWT says at John 1:1. Jesus himself said the Father is greater than he is."},{"w":"you","t":"An exclamation using God's title as a swear-word would be blasphemy on the spot — and John wrote the verse as the Gospel's climax: 'these were written that you may believe.' As for 'greater' — the sent one submits to the sender (a king is greater than the prince on campaign) without being a different kind of being; that's Philippians 2, equality laid aside for the mission. Here's my honest question: **Isaiah 44:24 says Jehovah stretched out the heavens ALONE — 'who was with me?' — yet John 1:3 says nothing was created without the Word. How can both be true unless the Word is Jehovah's own being?**"},{"w":"them","t":"Jehovah created Jesus first and then used him for everything else — that's what 'firstborn of all creation' means. The organization has explained these deep things; we can't lean on our own understanding."},{"w":"you","t":"Notice the NWT itself had to add 'other' to Colossians 1 — 'all OTHER things' — to keep Jesus inside creation; the Greek just says all things, through him and FOR him. Friend, I'm not asking you to lean on your understanding or mine, but on the text in front of us both. **Would you read Hebrews 1 aloud with me — just that one chapter — and tell me honestly whether its author thought the Son was an angel?** No trap; I'll bring the NWT."}],"two-class-salvation":[{"w":"them","t":"The Bible speaks of two hopes: 144,000 anointed ones who rule with Christ in heaven, and the great crowd who live forever on paradise earth. We know we're the great crowd — the heavenly calling was mostly sealed long ago."},{"w":"you","t":"Here's what moves me about that, honestly: it decides in advance what Scripture's promises are allowed to mean for YOU. So one gentle question first — at the Last Supper, Jesus said 'this is my blood of the covenant.' At your Memorial, the bread and wine pass down the row and almost no one partakes. **Jesus said 'unless you eat the flesh of the Son of man and drink his blood, you have no life in yourselves' (John 6:53) — who told you that wasn't addressed to you?**"},{"w":"them","t":"The emblems are for those in the new covenant — the anointed with the heavenly hope. The great crowd benefits from the ransom without being party to the covenant. The faithful slave has made the two classes clear from Revelation 7 and 14."},{"w":"you","t":"But look at Revelation 7 with fresh eyes: the 144,000 are sealed from twelve named tribes of Israel — with Dan missing — and in chapter 14 they're male celibates. Everyone agrees those details are symbolic; only the number is kept literal. Meanwhile the great crowd is 'before the throne... in his temple' — and Revelation 19:1 puts a great crowd IN HEAVEN. **If the tribes, the maleness, and the virginity are symbols, on what basis is 144,000 arithmetic?**"},{"w":"them","t":"Numbers in Revelation can be literal when the context shows it. Anyway, I don't feel the heavenly calling — I love the thought of paradise earth, seeing resurrected loved ones, petting lions. That's the hope Jehovah's organization has always shown us from Scripture."},{"w":"you","t":"And a renewed earth IS in Scripture — we agree there, truly; Revelation ends with heaven coming down to earth, God's tent with mankind, every servant seeing his face (21:3, 22:4). What Scripture never does is post some believers at a distance forever. That promise — seeing HIS face — is written to all who are his. **Would you take the emblems question home this year — read John 6 and Luke 22 before the Memorial, and ask Jehovah directly whether Jesus meant you?** That prayer can't be wrong to pray."}],"blood-doctrine":[{"w":"them","t":"Blood is sacred to Jehovah — it represents life itself. From Noah to the apostolic decree, 'abstain from blood' is unambiguous. We carry no-blood cards because obeying God matters more than extending life a few years."},{"w":"you","t":"I want to honor what's real here: that's costly obedience, and I don't laugh at it. But let me ask about the boundary itself. Acts 15 concerns eating blood — the issue since Genesis 9 was consuming a creature's life. A transfusion doesn't feed anyone; the blood keeps doing its job as living tissue, like a transplanted kidney. **If a doctor said 'abstain from alcohol,' would that forbid rubbing alcohol on a wound?**"},{"w":"them","t":"Taking it into your veins is still taking it into your body. The organization has explained that the principle covers transfusion — and Jehovah blessed us with bloodless medicine as a result."},{"w":"you","t":"Bloodless surgery advances are genuinely good fruit — granted gladly. But here's what I can't resolve: the policy forbids red cells yet permits hemoglobin — which is most of the red cell — plus fractions of every 'forbidden' component, each as a conscience matter since 2000. **If blood is too sacred to transfuse, how can nearly all of it, piece by piece, be fine?** A line that moves like that looks like policy, not principle."},{"w":"them","t":"The faithful slave refines our understanding as knowledge increases. Where the Bible doesn't give details, conscience decides — but the clear command stands, and I trust Jehovah more than I fear death."},{"w":"you","t":"Your courage isn't in question — only the command's address. When David's men were starving, they ate the holy showbread, and Jesus defended it: 'the Sabbath was made for man, not man for the Sabbath'; 'I want mercy, not sacrifice.' Blood was poured out precisely because life belongs to God — using it to SAVE a life honors that logic. **May I ask just one thing of you — not to change your card tonight, but to read Mark 2:23-27 asking whether Jesus would sign it?** And know this: if you were ever in that hospital bed, I'd be beside you either way."}],"shunning-exit":[{"w":"them","t":"We don't shun anyone. People are free to leave — and removal from the congregation is loving discipline that protects the flock and often moves the person to come back to Jehovah."},{"w":"you","t":"I believe you've seen it work that way for some, and I know the intent is love. But can we be concrete? If your grown daughter concluded — honestly, prayerfully — that the Governing Body isn't God's channel, and said so, she'd face a judicial committee and removal. Then you'd be directed not to associate with her. **Is that freedom to leave, or freedom to leave everyone you love behind?**"},{"w":"them","t":"That's painful, but it's Scriptural — 'remove the wicked man from among yourselves,' 'do not receive him into your homes.' And the door is always open; the shunning is meant to help them miss Jehovah and return."},{"w":"you","t":"Those verses address unrepentant immorality and men actively deceiving churches — Paul never cuts off a doubter; Jude says 'show mercy to those who doubt.' Notice, too, whom the policy actually pressures: not the convinced apostate, but the quiet questioner who now knows the price of honesty. **What does it do to a family's love when everyone knows it can be switched off by committee?** Even the August 2024 adjustment — a greeting allowed at the Kingdom Hall — concedes the old line wasn't Scripture but policy, changeable by print run."},{"w":"them","t":"The Governing Body adjusts things as Jehovah directs. I trust that. Without loyalty to the organization there'd be no clean congregation at all."},{"w":"you","t":"Here's the thought I'd leave with you, offered gently because I'm not going anywhere: a message that's true doesn't need exit costs; the truth keeps people by being true. Jesus asked the Twelve 'do you want to go also?' with the door wide open — and they stayed for HIM. **If the teaching is solid, why must leaving cost your mother?** Whatever you ever decide, my table doesn't have a committee. That's not rhetoric; it's an invitation."}],"institutional":[{"w":"them","t":"Jehovah's organization is the cleanest people on earth — no war-blessing, no political entanglement, no scandal-ridden clergy like Christendom's churches."},{"w":"you","t":"Churches have real sins on the books — I won't defend a single one of them. But held to its own standard: the Watchtower Society was an associate NGO of the United Nations from 1992 to 2001 — the very organization it calls the wild beast — and withdrew only after The Guardian exposed it. **If a Witness had privately affiliated with the UN for nine years, what would a judicial committee have done?**"},{"w":"them","t":"That's an apostate distortion. I've heard the association was only for access to the UN library, and it required no membership commitment."},{"w":"you","t":"Check it against sources you'd accept in any other case — the UN's own letter states associate NGOs were required to support the UN's ideals and renew annually, which the Society did nine times. And there's harder ground: Australia's Royal Commission examined the organization's OWN files — 1,006 alleged child abusers since 1950, not one reported to authorities by the organization, largely due to the two-witness rule. **Shouldn't 'by their fruits you will recognize them' apply to every tree, including this one?**"},{"w":"them","t":"Imperfect men have always been part of Jehovah's arrangement — look at Israel's kings. The organization isn't inspired, but it's still the channel Jehovah is using. Where else would we go?"},{"w":"you","t":"Friend, notice that 'imperfect men' now covers what 'Babylon the Great' condemns in everyone else — that's two scales, and Proverbs calls that detestable. And that last question — Peter's actual words weren't 'where else would we go' but '**Lord, to WHOM shall we go?**' (John 6:68). A person, not a headquarters. That question deserves your best years, and you can explore it without me ever gloating — that's a promise."}],"practice":[{"w":"them","t":"Christmas, Easter, birthdays — all pagan in origin. December 25 was a sun festival; the only birthday parties in the Bible ended with executions. True worship must be clean of Babylonish customs."},{"w":"you","t":"You're right about more of the history than most Christians know, honestly — December 25 isn't in the Bible and nobody's required to keep it. But test the rule itself: your literature acknowledges wedding rings likely have pagan roots, yet allows them because of what they mean NOW. **Why does 'present meaning matters' rescue the ring but not a child's birthday cake?**"},{"w":"them","t":"The Bible mentions wedding rings neutrally — but it records both birthday feasts negatively, Pharaoh's and Herod's. And the organization has shown these celebrations promote creature worship and greed."},{"w":"you","t":"Two wicked kings threw parties and did wicked things AT them — Scripture never says the anniversary was the sin; both texts condemn the killings, not the cake. And Job's children held feasts 'each on his own day' while Job stays blameless. The apostles faced this exact question about days and food offered to idols, and their answer was liberty: 'let each be fully convinced in his own mind' (Romans 14:5). **If Paul wouldn't bind a conscience on days, who may?**"},{"w":"them","t":"Unity matters — if everyone decided individually, the congregation would splinter. The faithful slave keeps worship clean worldwide, and I'm grateful for that direction."},{"w":"you","t":"But watch what that trades away: Colossians 2:16 says 'let NO ONE judge you in respect of a festival' — and a judicial committee for celebrating Christmas is precisely someone judging you about a festival. Unity that Romans 14 builds is agreement to differ in love, not identical calendars under penalty. Here's my open door, and it's the whole point: **come to no service, sign nothing — just bring your family for dinner on the 25th, and see whether what happens at our table looks like sun worship or like gratitude for a Savior.** You'll be welcomed, not recruited."}]};
const ABBR=["c","cf","vs","e.g","i.e","etc","Dr","St","Mr","Mrs","ch","pp","v","vv","no","approx","Jr","Sr"];
function splitSentences(raw){
  const tokens=raw.split(/(?<=[.!?])\s+(?=[A-Z0-9"'(‘“])/);
  const merged=[];
  tokens.forEach(t=>{
    if(merged.length){
      const prev=merged[merged.length-1];
      const m=prev.match(/([A-Za-z&.]+)\.$/);
      const w=m?m[1].replace(/\./g,""):null;
      if(w&&ABBR.includes(w)){merged[merged.length-1]=prev+" "+t;return;}
    }
    merged.push(t);
  });
  return merged;
}
const LDSBOOKS="(?:The Watchtower[,]?\\\\s(?:[A-Z][a-z]+\\\\s\\\\d{1,2},\\\\s)?\\\\d{4}|Awake![,]?\\\\s(?:[A-Z][a-z]+\\\\s\\\\d{1,2},\\\\s)?\\\\d{4}|w\\\\d{2}\\\\s\\\\d{1,2}/\\\\d{1,2}|Insight on the Scriptures|Proclaimers|Kingdom Interlinear|New World Translation|NWT)";
const BIBBOOKS="(?:[1-3]\\s)?(?:Genesis|Exodus|Leviticus|Numbers|Deuteronomy|Joshua|Judges|Ruth|Samuel|Kings|Chronicles|Ezra|Nehemiah|Esther|Job|Psalms?|Proverbs|Ecclesiastes|Isaiah|Jeremiah|Lamentations|Ezekiel|Daniel|Hosea|Joel|Amos|Obadiah|Jonah|Micah|Nahum|Habakkuk|Zephaniah|Haggai|Zechariah|Malachi|Matthew|Mark|Luke|John|Acts|Romans|Corinthians|Galatians|Ephesians|Philippians|Colossians|Thessalonians|Timothy|Titus|Philemon|Hebrews|James|Peter|Jude|Revelation)";
const REFNUM="";
const KEYWORDS=/\b(concedes?d?|conceded|disavow(?:s|ed|al)?|undisputed|unfalsifiable|no ancient manuscript|zero ancient witnesses|never recanted|does not match|do not match|no adequate answer|contradict(?:s|ing|ion)?|impossible|no record|officially disavowed)\b/gi;
function emphasize(t){
  t=t.replace(new RegExp("\\b("+LDSBOOKS+REFNUM+")","g"),'<span class="ref-lds">$1</span>');
  t=t.replace(new RegExp("\\b("+BIBBOOKS+"\\s\\d+(?::\\d+(?:[\\-–]\\d+)?(?:,\\s?\\d+(?:[\\-–]\\d+)?)*)?)","g"),m=>m.includes("ref-lds")?m:'<span class="ref-bib">'+m+'</span>');
  t=t.replace(/(^|[\s(—–])'([^'<>]{3,200}?)'(?=$|[\s.,;:)!?—–])/g,'$1<span class="qq">‘$2’</span>');
  t=t.replace(KEYWORDS,'<b class="kw">$1</b>');
  t=t.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/==(.+?)==/g,'<mark>$1</mark>');
  return t;
}
function rich(raw){return glossify(emphasize(esc(raw).replace(/&lt;(\/?)(b|i|em|strong)&gt;/g,"<$1$2>")));}
function paras(raw,per){
  per=per||2;
  const s=splitSentences(raw),ps=[];
  for(let i=0;i<s.length;i+=per)ps.push(s.slice(i,i+per).join(" "));
  return ps.map(p=>`<p>${rich(p)}</p>`).join("");
}
function formatDefense(raw){
  if(/\(\d+\)/.test(raw)){
    const parts=raw.split(/\(\d+\)\s*/);
    const intro=parts.shift().trim();
    return (intro?`<p class="lead">${rich(intro)}</p>`:"")+
      `<ol class="pts">${parts.map(p=>`<li>${rich(p.trim())}</li>`).join("")}</ol>`;
  }
  return paras(raw,2);
}
