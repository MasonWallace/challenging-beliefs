e he maketh intercession for the saints according to the will of God.","hl":1},{"v":28,"t":"And we know that all things work together for good to them that love God, to them who are the called according to his purpose."},{"v":29,"t":"For whom he did foreknow, he also did predestinate to be conformed to the image of his Son, that he might be the firstborn among many brethren."},{"v":30,"t":"Moreover whom he did predestinate, them he also called: and whom he called, them he also justified: and whom he justified, them he also glorified."}]},"Luke 16:19-31":{"ref":"Luke 16","cited":"19-31","verses":[{"v":16,"t":"The law and the prophets were until John: since that time the kingdom of God is preached, and every man presseth into it."},{"v":17,"t":"And it is easier for heaven and earth to pass, than one tittle of the law to fail."},{"v":18,"t":"Whosoever putteth away his wife, and marrieth another, committeth adultery: and whosoever marrieth her that is put away from her husband committeth adultery."},{"v":19,"t":"There was a certain rich man, which was clothed in purple and fine linen, and fared sumptuously every day:","hl":1},{"v":20,"t":"And there was a certain beggar named Lazarus, which was laid at his gate, full of sores,","hl":1},{"v":21,"t":"And desiring to be fed with the crumbs which fell from the rich man's table: moreover the dogs came and licked his sores.","hl":1},{"v":22,"t":"And it came to pass, that the beggar died, and was carried by the angels into Abraham's bosom: the rich man also died, and was buried;","hl":1},{"v":23,"t":"And in hell he lift up his eyes, being in torments, and seeth Abraham afar off, and Lazarus in his bosom.","hl":1},{"v":24,"t":"And he cried and said, Father Abraham, have mercy on me, and send Lazarus, that he may dip the tip of his finger in water, and cool my tongue; for I am tormented in this flame.","hl":1},{"v":25,"t":"But Abraham said, Son, remember that thou in thy lifetime receivedst thy good things, and likewise Lazarus e ove the LORD thy God, and that thou mayest obey his voice, and that thou mayest cleave unto him: for he is thy life, and the length of thy days: that thou mayest dwell in the land which the LORD sware unto thy fathers, to Abraham, to Isaac, and to Jacob, to give them."}]},"Acts 10:40":{"ref":"Acts 10","cited":"40","verses":[{"v":37,"t":"That word, I say, ye know, which was published throughout all Judæa, and began from Galilee, after the baptism which John preached;"},{"v":38,"t":"How God anointed Jesus of Nazareth with the Holy Ghost and with power: who went about doing good, and healing all that were oppressed of the devil; for God was with him."},{"v":39,"t":"And we are witnesses of all things which he did both in the land of the Jews, and in Jerusalem; whom they slew and hanged on a tree:"},{"v":40,"t":"Him God raised up the third day, and shewed him openly;","hl":1},{"v":41,"t":"Not to all the people, but unto witnesses chosen before of God, even to us, who did eat and drink with him after he rose from the dead."},{"v":42,"t":"And he commanded us to preach unto the people, and to testify that it is he which was ordained of God to be the Judge of quick and dead."},{"v":43,"t":"To him give all the prophets witness, that through his name whosoever believeth in him shall receive remission of sins."}]},"John 14:14":{"ref":"John 14","cited":"14","verses":[{"v":11,"t":"Believe me that I am in the Father, and the Father in me: or else believe me for the very works' sake."},{"v":12,"t":"Verily, verily, I say unto you, He that believeth on me, the works that I do shall he do also; and greater works than these shall he do; because I go unto my Father."},{"v":13,"t":"And whatsoever ye shall ask in my name, that will I do, that the Father may be glorified in the Son."},{"v":14,"t":"If ye shall ask any thing in my name, I will do it.","hl":1},{"v":15,"t":"If ye love me, keep my commandments."},{"v":16,"t":"And I will pray the Father, and he shall give you another Comforter,  candle."},{"v":11,"t":"And this whole land shall be a desolation, and an astonishment; and these nations shall serve the king of Babylon seventy years.","hl":1},{"v":12,"t":"And it shall come to pass, when seventy years are accomplished, that I will punish the king of Babylon, and that nation, saith the LORD, for their iniquity, and the land of the Chaldeans, and will make it perpetual desolations."},{"v":13,"t":"And I will bring upon that land all my words which I have pronounced against it, even all that is written in this book, which Jeremiah hath prophesied against all the nations."},{"v":14,"t":"For many nations and great kings shall serve themselves of them also: and I will recompense them according to their deeds, and according to the works of their own hands."}]},"2 Chronicles 36:21":{"ref":"2 Chronicles 36","cited":"21","verses":[{"v":18,"t":"And all the vessels of the house of God, great and small, and the treasures of the house of the LORD, and the treasures of the king, and of his princes; all these he brought to Babylon."},{"v":19,"t":"And they burnt the house of God, and brake down the wall of Jerusalem, and burnt all the palaces thereof with fire, and destroyed all the goodly vessels thereof."},{"v":20,"t":"And them that had escaped from the sword carried he away to Babylon; where they were servants to him and his sons until the reign of the kingdom of Persia:"},{"v":21,"t":"To fulfil the word of the LORD by the mouth of Jeremiah, until the land had enjoyed her sabbaths: for as long as she lay desolate she kept sabbath, to fulfil threescore and ten years.","hl":1},{"v":22,"t":"Now in the first year of Cyrus king of Persia, that the word of the LORD spoken by the mouth of Jeremiah might be accomplished, the LORD stirred up the spirit of Cyrus king of Persia, that he made a proclamation throughout all his kingdom, and put it also in writing, saying,"},{"v":23,"t":"Thus saith Cyrus king of Persia, All the kingdoms of the earth hath the LORD God of heaven given me; and he hath charged me to build him an house in Jerusalem, which is in Judah. Who is there among you of all his people? The LORD his God be with him, and let him go up."}]},"Daniel 4":{"ref":"Daniel 4","cited":"","verses":[{"v":1,"t":"Nebuchadnezzar the king, unto all people, nations, and languages, that dwell in all the earth; Peace be multiplied unto you."},{"v":2,"t":"I thought it good to shew the signs and wonders that the high God hath wrought toward me."},{"v":3,"t":"How great are his signs! and how mighty are his wonders! his kingdom is an everlasting kingdom, and his dominion is from generation to generation."},{"v":4,"t":"I Nebuchadnezzar was at rest in mine house, and flourishing in my palace:"},{"v":5,"t":"I saw a dream which made me afraid, and the thoughts upon my bed and the visions of my head troubled me."},{"v":6,"t":"Therefore made I a decree to bring in all the wise men of Babylon before me, that they might make known unto me the interpretation of the dream."},{"v":7,"t":"Then came in the magicians, the astrologers, the Chaldeans, and the soothsayers: and I told the dream before them; but they did not make known unto me the interpretation thereof."},{"v":8,"t":"But at the last Daniel came in before me, whose name was Belteshazzar, according to the name of my god, and in whom is the spirit of the holy gods: and before him I told the dream, saying,"},{"v":9,"t":"O Belteshazzar, master of the magicians, because I know that the spirit of the holy gods is in thee, and no secret troubleth thee, tell me the visions of my dream that I have seen, and the interpretation thereof."},{"v":10,"t":"Thus were the visions of mine head in my bed; I saw, and behold a tree in the midst of the earth, and the height thereof was great."},{"v":11,"t":"The tree grew, and was strong, and the height thereof reached unto heaven, and the sight thereof to the end of all the earth:"},{"v":12,"t":"The leaves thereof were fair, and the fruit thereof much, and in it was meat for all: the beasts of the field had shadow under it, and the fowls of the heaven dwelt in the boughs thereof, and all flesh was fed of it."},{"v":13,"t":"I saw in the visions of my head upon my bed, and, behold, a watcher and an holy one came down from heaven;"},{"v":14,"t":"He cried aloud, and said thus, Hew down the tree, and cut off his branches, shake off his leaves, and scatter his fruit: let the beasts get away from under it, and the fowls from his branches:"},{"v":15,"t":"Nevertheless leave the stump of his roots in the earth, even with a band of iron and brass, in the tender grass of the field; and let it be wet with the dew of heaven, and let his portion be with the beasts in the grass of the earth:"},{"v":16,"t":"Let his heart be changed from man's, and let a beast's heart be given unto him; and let seven times pass over him."},{"v":17,"t":"This matter is by the decree of the watchers, and the demand by the word of the holy ones: to the intent that the living may know that the most High ruleth in the kingdom of men, and giveth it to whomsoever he will, and setteth up over it the basest of men."},{"v":18,"t":"This dream I king Nebuchadnezzar have seen. Now thou, O Belteshazzar, declare the interpretation thereof, forasmuch as all the wise men of my kingdom are not able to make known unto me the interpretation: but thou art able; for the spirit of the holy gods is in thee."},{"v":19,"t":"Then Daniel, whose name was Belteshazzar, was astonied for one hour, and his thoughts troubled him. The king spake, and said, Belteshazzar, let not the dream, or the interpretation thereof, trouble thee. Belteshazzar answered and said, My lord, the dream be to them that hate thee, and the interpretation thereof to thine enemies."},{"v":20,"t":"The tree that thou sawest, which grew, and was strong, whose height reached unto the heaven, and the sight thereof to all the earth;"},{"v":21,"t":"Whose leaves were fair, and the fruit thereof much, and in it was meat for all; under which the beasts of the field dwelt, and upon whose branches the fowls of the heaven had their habitation:"},{"v":22,"t":"It is thou, O king, that art grown and become strong: for thy greatness is grown, and reacheth unto heaven, and thy dominion to the end of the earth."},{"v":23,"t":"And whereas the king saw a watcher and an holy one coming down from heaven, and saying, Hew the tree down, and destroy it; yet leave the stump of the roots thereof in the earth, even with a band of iron and brass, in the tender grass of the field; and let it be wet with the dew of heaven, and let his portion be with the beasts of the field, till seven times pass over him;"},{"v":24,"t":"This is the interpretation, O king, and this is the decree of the most High, which is come upon my lord the king:"},{"v":25,"t":"That they shall drive thee from men, and thy dwelling shall be with the beasts of the field, and they shall make thee to eat grass as oxen, and they shall wet thee with the dew of heaven, and seven times shall pass over thee, till thou know that the most High ruleth in the kingdom of men, and giveth it to whomsoever he will."},{"v":26,"t":"And whereas they commanded to leave the stump of the tree roots; thy kingdom shall be sure unto thee, after that thou shalt have known that the heavens do rule."},{"v":27,"t":"Wherefore, O king, let my counsel be acceptable unto thee, and break off thy sins by righteousness, and thine iniquities by shewing mercy to the poor; if it may be a lengthening of thy tranquillity."},{"v":28,"t":"All this came upon the king Nebuchadnezzar."},{"v":29,"t":"At the end of twelve months he walked in the palace of the kingdom of Babylon."},{"v":30,"t":"The king spake, and said, Is not this great Babylon, that I have built for the house of the kingdom by the might of my power, and for the honour of my majesty?"},{"v":31,"t":"While the word was in the king's mouth, there fell a voice from heaven, saying, O king Nebuchadnezzar, to thee it is spoken; The kingdom is departed from thee."},{"v":32,"t":"And they shall drive thee from men, and thy dwelling shall be with the beasts of the field: they shall make thee to eat grass as oxen, and seven times shall pass over thee, until thou know that the most High ruleth in the kingdom of men, and giveth it to whomsoever he will."},{"v":33,"t":"The same hour was the thing fulfilled upon Nebuchadnezzar: and he was driven from men, and did eat grass as oxen, and his body was wet with the dew of heaven, till his hairs were grown like eagles' feathers, and his nails like birds' claws."},{"v":34,"t":"And at the end of the days I Nebuchadnezzar lifted up mine eyes unto heaven, and mine understanding returned unto me, and I blessed the most High, and I praised and honoured him that liveth for ever, whose dominion is an everlasting dominion, and his kingdom is from generation to generation:"},{"v":35,"t":"And all the inhabitants of the earth are reputed as nothing: and he doeth according to his will in the army of heaven, and among the inhabitants of the earth: and none can stay his hand, or say unto him, What doest thou?"},{"v":36,"t":"At the same time my reason returned unto me; and for the glory of my kingdom, mine honour and brightness returned unto me; and my counsellors and my lords sought unto me; and I was established in my kingdom, and excellent majesty was added unto me."},{"v":37,"t":"Now I Nebuchadnezzar praise and extol and honour the King of heaven, all whose works are truth, and his ways judgment: and those that walk in pride he is able to abase."}]},"Acts 1:6":{"ref":"Acts 1","cited":"6","verses":[{"v":3,"t":"To whom also he shewed himself alive after his passion by many infallible proofs, being seen of them forty days, and speaking of the things pertaining to the kingdom of God:"},{"v":4,"t":"And, being assembled together with them, commanded them that they should not depart from Jerusalem, but wait for the promise of the Father, which, saith he, ye have heard of me."},{"v":5,"t":"For John truly baptized with water; but ye shall be baptized with the Holy Ghost not many days hence."},{"v":6,"t":"When they therefore were come together, they asked of him, saying, Lord, wilt thou at this time restore again the kingdom to Israel?","hl":1},{"v":7,"t":"And he said unto them, It is not for you to know the times or the seasons, which the Father hath put in his own power."},{"v":8,"t":"But ye shall receive power, after that the Holy Ghost is come upon you: and ye shall be witnesses unto me both in Jerusalem, and in all Judæa, and in Samaria, and unto the uttermost part of the earth."},{"v":9,"t":"And when he had spoken these things, while they beheld, he was taken up; and a cloud received him out of their sight."}]},"Exodus 1:6":{"ref":"Exodus 1","cited":"6","verses":[{"v":3,"t":"Issachar, Zebulun, and Benjamin,"},{"v":4,"t":"Dan, and Naphtali, Gad, and Asher."},{"v":5,"t":"And all the souls that came out of the loins of Jacob were seventy souls: for Joseph was in Egypt already."},{"v":6,"t":"And Joseph died, and all his brethren, and all that generation.","hl":1},{"v":7,"t":"And the children of Israel were fruitful, and increased abundantly, and multiplied, and waxed exceeding mighty; and the land was filled with them."},{"v":8,"t":"Now there arose up a new king over Egypt, which knew not Joseph."},{"v":9,"t":"And he said unto his people, Behold, the people of the children of Israel are more and mightier than we:"}]},"Luke 19:11":{"ref":"Luke 19","cited":"11","verses":[{"v":8,"t":"And Zacchæus stood, and said unto the Lord; Behold, Lord, the half of my goods I give to the poor; and if I have taken any thing from any man by false accusation, I restore him fourfold."},{"v":9,"t":"And Jesus said unto him, This day is salvation come to this house, forsomuch as he also is a son of Abraham."},{"v":10,"t":"For the Son of man is come to seek and to save that which was lost."},{"v":11,"t":"And as they heard these things, he added and spake a parable, because he was nigh to Jerusalem, and because they thought that the kingdom of God should immediately appear.","hl":1},{"v":12,"t":"He said therefore, A certain nobleman went into a far country to receive for himself a kingdom, and to return."},{"v":13,"t":"And he called his ten servants, and delivered them ten pounds, and said unto them, Occupy till I come."},{"v":14,"t":"But his citizens hated him, and sent a message after him, saying, We will not have this man to reign over us."}]},"Matthew 24:45":{"ref":"Matthew 24","cited":"45","verses":[{"v":42,"t":"Watch therefore: for ye know not what hour your Lord doth come."},{"v":43,"t":"But know this, that if the goodman of the house had known in what watch the thief would come, he would have watched, and would not have suffered his house to be broken up."},{"v":44,"t":"Therefore be ye also ready: for in such an hour as ye think not the Son of man cometh."},{"v":45,"t":"Who then is a faithful and wise servant, whom his lord hath made ruler over his household, to give them meat in due season?","hl":1},{"v":46,"t":"Blessed is that servant, whom his lord when he cometh shall find so doing."},{"v":47,"t":"Verily I say unto you, That he shall make him ruler over all his goods."},{"v":48,"t":"But and if that evil servant shall say in his heart, My lord delayeth his coming;"}]},"Matthew 24:45-51":{"ref":"Matthew 24","cited":"45-51","verses":[{"v":42,"t":"Watch therefore: for ye know not what hour your Lord doth come."},{"v":43,"t":"But know this, that if the goodman of the house had known in what watch the thief would come, he would have watched, and would not have suffered his house to be broken up."},{"v":44,"t":"Therefore be ye also ready: for in such an hour as ye think not the Son of man cometh."},{"v":45,"t":"Who then is a faithful and wise servant, whom his lord hath made ruler over his household, to give them meat in due season?","hl":1},{"v":46,"t":"Blessed is that servant, whom his lord when he cometh shall find so doing.","hl":1},{"v":47,"t":"Verily I say unto you, That he shall make him ruler over all his goods.","hl":1},{"v":48,"t":"But and if that evil servant shall say in his heart, My lord delayeth his coming;","hl":1},{"v":49,"t":"And shall begin to smite his fellowservants, and to eat and drink with the drunken;","hl":1},{"v":50,"t":"The lord of that servant shall come in a day when he looketh not for him, and in an hour that he is not aware of,","hl":1},{"v":51,"t":"And shall cut him asunder, and appoint him his portion with the hypocrites: there shall be weeping and gnashing of teeth.","hl":1}]},"Acts 15":{"ref":"Acts 15","cited":"","verses":[{"v":1,"t":"And certain men which came down from Judæa taught the brethren, and said, Except ye be circumcised after the manner of Moses, ye cannot be saved."},{"v":2,"t":"When therefore Paul and Barnabas had no small dissension and disputation with them, they determined that Paul and Barnabas, and certain other of them, should go up to Jerusalem unto the apostles and elders about this question."},{"v":3,"t":"And being brought on their way by the church, they passed through Phenice and Samaria, declaring the conversion of the Gentiles: and they caused great joy unto all the brethren."},{"v":4,"t":"And when they were come to Jerusalem, they were received of the church, and of the apostles and elders, and they declared all things that God had done with them."},{"v":5,"t":"But there rose up certain of the sect of the Pharisees which believed, saying, That it was needful to circumcise them, and to command them to keep the law of Moses."},{"v":6,"t":"And the apostles and elders came together for to consider of this matter."},{"v":7,"t":"And when there had been much disputing, Peter rose up, and said unto them, Men and brethren, ye know how that a good while ago God made choice among us, that the Gentiles by my mouth should hear the word of the gospel, and believe."},{"v":8,"t":"And God, which knoweth the hearts, bare them witness, giving them the Holy Ghost, even as he did unto us;"},{"v":9,"t":"And put no difference between us and them, purifying their hearts by faith."},{"v":10,"t":"Now therefore why tempt ye God, to put a yoke upon the neck of the disciples, which neither our fathers nor we were able to bear?"},{"v":11,"t":"But we believe that through the grace of the Lord Jesus Christ we shall be saved, even as they."},{"v":12,"t":"Then all the multitude kept silence, and gave audience to Barnabas and Paul, declaring what miracles and wonders God had wrought among the Gentiles by them."},{"v":13,"t":"And after they had held their peace, James answered, saying, Men and brethren, hearken unto me:"},{"v":14,"t":"Simeon hath declared how God at the first did visit the Gentiles, to take out of them a people for his name."},{"v":15,"t":"And to this agree the words of the prophets; as it is written,"},{"v":16,"t":"After this I will return, and will build again the tabernacle of David, which is fallen down; and I will build again the ruins thereof, and I will set it up:"},{"v":17,"t":"That the residue of men might seek after the Lord, and all the Gentiles, upon whom my name is called, saith the Lord, who doeth all these things."},{"v":18,"t":"Known unto God are all his works from the beginning of the world."},{"v":19,"t":"Wherefore my sentence is, that we trouble not them, which from among the Gentiles are turned to God:"},{"v":20,"t":"But that we write unto them, that they abstain from pollutions of idols, and from fornication, and from things strangled, and from blood."},{"v":21,"t":"For Moses of old time hath in every city them that preach him, being read in the synagogues every sabbath day."},{"v":22,"t":"Then pleased it the apostles and elders, with the whole church, to send chosen men of their own company to Antioch with Paul and Barnabas; namely, Judas surnamed Barsabas, and Silas, chief men among the brethren:"},{"v":23,"t":"And they wrote letters by them after this manner; The apostles and elders and brethren send greeting unto the brethren which are of the Gentiles in Antioch and Syria and Cilicia:"},{"v":24,"t":"Forasmuch as we have heard, that certain which went out from us have troubled you with words, subverting your souls, saying, Ye must be circumcised, and keep the law: to whom we gave no such commandment:"},{"v":25,"t":"It seemed good unto us, being assembled with one accord, to send chosen men unto you with our beloved Barnabas and Paul,"},{"v":26,"t":"Men that have hazarded their lives for the name of our Lord Jesus Christ."},{"v":27,"t":"We have sent therefore Judas and Silas, who shall also tell you the same things by mouth."},{"v":28,"t":"For it seemed good to the Holy Ghost, and to us, to lay upon you no greater burden than these necessary things;"},{"v":29,"t":"That ye abstain from meats offered to idols, and from blood, and from things strangled, and from fornication: from which if ye keep yourselves, ye shall do well. Fare ye well."},{"v":30,"t":"So when they were dismissed, they came to Antioch: and when they had gathered the multitude together, they delivered the epistle:"},{"v":31,"t":"Which when they had read, they rejoiced for the consolation."},{"v":32,"t":"And Judas and Silas, being prophets also themselves, exhorted the brethren with many words, and confirmed them."},{"v":33,"t":"And after they had tarried there a space, they were let go in peace from the brethren unto the apostles."},{"v":34,"t":"Notwithstanding it pleased Silas to abide there still."},{"v":35,"t":"Paul also and Barnabas continued in Antioch, teaching and preaching the word of the Lord, with many others also."},{"v":36,"t":"And some days after Paul said unto Barnabas, Let us go again and visit our brethren in every city where we have preached the word of the Lord, and see how they do."},{"v":37,"t":"And Barnabas determined to take with them John, whose surname was Mark."},{"v":38,"t":"But Paul thought not good to take him with them, who departed from them from Pamphylia, and went not with them to the work."},{"v":39,"t":"And the contention was so sharp between them, that they departed asunder one from the other: and so Barnabas took Mark, and sailed unto Cyprus;"},{"v":40,"t":"And Paul chose Silas, and departed, being recommended by the brethren unto the grace of God."},{"v":41,"t":"And he went through Syria and Cilicia, confirming the churches."}]},"Romans 13":{"ref":"Romans 13","cited":"","verses":[{"v":1,"t":"Let every soul be subject unto the higher powers. For there is no power but of God: the powers that be are ordained of God."},{"v":2,"t":"Whosoever therefore resisteth the power, resisteth the ordinance of God: and they that resist shall receive to themselves damnation."},{"v":3,"t":"For rulers are not a terror to good works, but to the evil. Wilt thou then not be afraid of the power? do that which is good, and thou shalt have praise of the same:"},{"v":4,"t":"For he is the minister of God to thee for good. But if thou do that which is evil, be afraid; for he beareth not the sword in vain: for he is the minister of God, a revenger to execute wrath upon him that doeth evil."},{"v":5,"t":"Wherefore ye must needs be subject, not only for wrath, but also for conscience sake."},{"v":6,"t":"For for this cause pay ye tribute also: for they are God's ministers, attending continually upon this very thing."},{"v":7,"t":"Render therefore to all their dues: tribute to whom tribute is due; custom to whom custom; fear to whom fear; honour to whom honour."},{"v":8,"t":"Owe no man any thing, but to love one another: for he that loveth another hath fulfilled the law."},{"v":9,"t":"For this, Thou shalt not commit adultery, Thou shalt not kill, Thou shalt not steal, Thou shalt not bear false witness, Thou shalt not covet; and if there be any other commandment, it is briefly comprehended in this saying, namely, Thou shalt love thy neighbour as thyself."},{"v":10,"t":"Love worketh no ill to his neighbour: therefore love is the fulfilling of the law."},{"v":11,"t":"And that, knowing the time, that now it is high time to awake out of sleep: for now is our salvation nearer than when we believed."},{"v":12,"t":"The night is far spent, the day is at hand: let us therefore cast off the works of darkness, and let us put on the armour of light."},{"v":13,"t":"Let us walk honestly, as in the day; not in rioting and drunkenness, not in chambering and wantonness, not in strife and envying."},{"v":14,"t":"But put ye on the Lord Jesus Christ, and make not provision for the flesh, to fulfil the lusts thereof."}]},"Deuteronomy 18":{"ref":"Deuteronomy 18","cited":"","verses":[{"v":1,"t":"The priests the Levites, and all the tribe of Levi, shall have no part nor inheritance with Israel: they shall eat the offerings of the LORD made by fire, and his inheritance."},{"v":2,"t":"Therefore shall they have no inheritance among their brethren: the LORD is their inheritance, as he hath said unto them."},{"v":3,"t":"And this shall be the priest's due from the people, from them that offer a sacrifice, whether it be ox or sheep; and they shall give unto the priest the shoulder, and the two cheeks, and the maw."},{"v":4,"t":"The firstfruit also of thy corn, of thy wine, and of thine oil, and the first of the fleece of thy sheep, shalt thou give him."},{"v":5,"t":"For the LORD thy God hath chosen him out of all thy tribes, to stand to minister in the name of the LORD, him and his sons for ever."},{"v":6,"t":"And if a Levite come from any of thy gates out of all Israel, where he sojourned, and come with all the desire of his mind unto the place which the LORD shall choose;"},{"v":7,"t":"Then he shall minister in the name of the LORD his God, as all his brethren the Levites do, which stand there before the LORD."},{"v":8,"t":"They shall have like portions to eat, beside that which cometh of the sale of his patrimony."},{"v":9,"t":"When thou art come into the land which the LORD thy God giveth thee, thou shalt not learn to do after the abominations of those nations."},{"v":10,"t":"There shall not be found among you any one that maketh his son or his daughter to pass through the fire, or that useth divination, or an observer of times, or an enchanter, or a witch,"},{"v":11,"t":"Or a charmer, or a consulter with familiar spirits, or a wizard, or a necromancer."},{"v":12,"t":"For all that do these things are an abomination unto the LORD: and because of these abominations the LORD thy God doth drive them out from before thee."},{"v":13,"t":"Thou shalt be perfect with the LORD thy God."},{"v":14,"t":"For these nations, which thou shalt possess, hearkened unto observers of times, and unto diviners: but as for thee, the LORD thy God hath not suffered thee so to do."},{"v":15,"t":"The LORD thy God will raise up unto thee a Prophet from the midst of thee, of thy brethren, like unto me; unto him ye shall hearken;"},{"v":16,"t":"According to all that thou desiredst of the LORD thy God in Horeb in the day of the assembly, saying, Let me not hear again the voice of the LORD my God, neither let me see this great fire any more, that I die not."},{"v":17,"t":"And the LORD said unto me, They have well spoken that which they have spoken."},{"v":18,"t":"I will raise them up a Prophet from among their brethren, like unto thee, and will put my words in his mouth; and he shall speak unto them all that I shall command him."},{"v":19,"t":"And it shall come to pass, that whosoever will not hearken unto my words which he shall speak in my name, I will require it of him."},{"v":20,"t":"But the prophet, which shall presume to speak a word in my name, which I have not commanded him to speak, or that shall speak in the name of other gods, even that prophet shall die."},{"v":21,"t":"And if thou say in thine heart, How shall we know the word which the LORD hath not spoken?"},{"v":22,"t":"When a prophet speaketh in the name of the LORD, if the thing follow not, nor come to pass, that is the thing which the LORD hath not spoken, but the prophet hath spoken it presumptuously: thou shalt not be afraid of him."}]},"Hebrews 1":{"ref":"Hebrews 1","cited":"","verses":[{"v":1,"t":"God, who at sundry times and in divers manners spake in time past unto the fathers by the prophets,"},{"v":2,"t":"Hath in these last days spoken unto us by his Son, whom he hath appointed heir of all things, by whom also he made the worlds;"},{"v":3,"t":"Who being the brightness of his glory, and the express image of his person, and upholding all things by the word of his power, when he had by himself purged our sins, sat down on the right hand of the Majesty on high;"},{"v":4,"t":"Being made so much better than the angels, as he hath by inheritance obtained a more excellent name than they."},{"v":5,"t":"For unto which of the angels said he at any time, Thou art my Son, this day have I begotten thee? And again, I will be to him a Father, and he shall be to me a Son?"},{"v":6,"t":"And again, when he bringeth in the firstbegotten into the world, he saith, And let all the angels of God worship him."},{"v":7,"t":"And of the angels he saith, Who maketh his angels spirits, and his ministers a flame of fire."},{"v":8,"t":"But unto the Son he saith, Thy throne, O God, is for ever and ever: a sceptre of righteousness is the sceptre of thy kingdom."},{"v":9,"t":"Thou hast loved righteousness, and hated iniquity; therefore God, even thy God, hath anointed thee with the oil of gladness above thy fellows."},{"v":10,"t":"And, Thou, Lord, in the beginning hast laid the foundation of the earth; and the heavens are the works of thine hands:"},{"v":11,"t":"They shall perish; but thou remainest; and they all shall wax old as doth a garment;"},{"v":12,"t":"And as a vesture shalt thou fold them up, and they shall be changed: but thou art the same, and thy years shall not fail."},{"v":13,"t":"But to which of the angels said he at any time, Sit on my right hand, until I make thine enemies thy footstool?"},{"v":14,"t":"Are they not all ministering spirits, sent forth to minister for them who shall be heirs of salvation?"}]},"Revelation 19":{"ref":"Revelation 19","cited":"","verses":[{"v":1,"t":"And after these things I heard a great voice of much people in heaven, saying, Alleluia; Salvation, and glory, and honour, and power, unto the Lord our God:"},{"v":2,"t":"For true and righteous are his judgments: for he hath judged the great whore, which did corrupt the earth with her fornication, and hath avenged the blood of his servants at her hand."},{"v":3,"t":"And again they said, Alleluia. And her smoke rose up for ever and ever."},{"v":4,"t":"And the four and twenty elders and the four beasts fell down and worshipped God that sat on the throne, saying, Amen; Alleluia."},{"v":5,"t":"And a voice came out of the throne, saying, Praise our God, all ye his servants, and ye that fear him, both small and great."},{"v":6,"t":"And I heard as it were the voice of a great multitude, and as the voice of many waters, and as the voice of mighty thunderings, saying, Alleluia: for the Lord God omnipotent reigneth."},{"v":7,"t":"Let us be glad and rejoice, and give honour to him: for the marriage of the Lamb is come, and his wife hath made herself ready."},{"v":8,"t":"And to her was granted that she should be arrayed in fine linen, clean and white: for the fine linen is the righteousness of saints."},{"v":9,"t":"And he saith unto me, Write, Blessed are they which are called unto the marriage supper of the Lamb. And he saith unto me, These are the true sayings of God."},{"v":10,"t":"And I fell at his feet to worship him. And he said unto me, See thou do it not: I am thy fellowservant, and of thy brethren that have the testimony of Jesus: worship God: for the testimony of Jesus is the spirit of prophecy."},{"v":11,"t":"And I saw heaven opened, and behold a white horse; and he that sat upon him was called Faithful and True, and in righteousness he doth judge and make war."},{"v":12,"t":"His eyes were as a flame of fire, and on his head were many crowns; and he had a name written, that no man knew, but he himself."},{"v":13,"t":"And he was clothed with a vesture dipped in blood: and his name is called The Word of God."},{"v":14,"t":"And the armies which were in heaven followed him upon white horses, clothed in fine linen, white and clean."},{"v":15,"t":"And out of his mouth goeth a sharp sword, that with it he should smite the nations: and he shall rule them with a rod of iron: and he treadeth the winepress of the fierceness and wrath of Almighty God."},{"v":16,"t":"And he hath on his vesture and on his thigh a name written, KING OF KINGS, AND LORD OF LORDS."},{"v":17,"t":"And I saw an angel standing in the sun; and he cried with a loud voice, saying to all the fowls that fly in the midst of heaven, Come and gather yourselves together unto the supper of the great God;"},{"v":18,"t":"That ye may eat the flesh of kings, and the flesh of captains, and the flesh of mighty men, and the flesh of horses, and of them that sit on them, and the flesh of all men, both free and bond, both small and great."},{"v":19,"t":"And I saw the beast, and the kings of the earth, and their armies, gathered together to make war against him that sat on the horse, and against his army."},{"v":20,"t":"And the beast was taken, and with him the false prophet that wrought miracles before him, with which he deceived them that had received the mark of the beast, and them that worshipped his image. These both were cast alive into a lake of fire burning with brimstone."},{"v":21,"t":"And the remnant were slain with the sword of him that sat upon the horse, which sword proceeded out of his mouth: and all the fowls were filled with their flesh."}]},"Luke 24:39":{"ref":"Luke 24","cited":"39","verses":[{"v":36,"t":"And as they thus spake, Jesus himself stood in the midst of them, and saith unto them, Peace be unto you."},{"v":37,"t":"But they were terrified and affrighted, and supposed that they had seen a spirit."},{"v":38,"t":"And he said unto them, Why are ye troubled? and why do thoughts arise in your hearts?"},{"v":39,"t":"Behold my hands and my feet, that it is I myself: handle me, and see; for a spirit hath not flesh and bones, as ye see me have.","hl":1},{"v":40,"t":"And when he had thus spoken, he shewed them his hands and his feet."},{"v":41,"t":"And while they yet believed not for joy, and wondered, he said unto them, Have ye here any meat?"},{"v":42,"t":"And they gave him a piece of a broiled fish, and of an honeycomb."}]},"1 Peter 3:18":{"ref":"1 Peter 3","cited":"18","verses":[{"v":15,"t":"But sanctify the Lord God in your hearts: and be ready always to give an answer to every man that asketh you a reason of the hope that is in you with meekness and fear:"},{"v":16,"t":"Having a good conscience; that, whereas they speak evil of you, as of evildoers, they may be ashamed that falsely accuse your good conversation in Christ."},{"v":17,"t":"For it is better, if the will of God be so, that ye suffer for well doing, than for evil doing."},{"v":18,"t":"For Christ also hath once suffered for sins, the just for the unjust, that he might bring us to God, being put to death in the flesh, but quickened by the Spirit:","hl":1},{"v":19,"t":"By which also he went and preached unto the spirits in prison;"},{"v":20,"t":"Which sometime were disobedient, when once the longsuffering of God waited in the days of Noah, while the ark was a preparing, wherein few, that is, eight souls were saved by water."},{"v":21,"t":"The like figure whereunto even baptism doth also now save us (not the putting away of the filth of the flesh, but the answer of a good conscience toward God,) by the resurrection of Jesus Christ:"}]},"1 Corinthians 15:45":{"ref":"1 Corinthians 15","cited":"45","verses":[{"v":42,"t":"So also is the resurrection of the dead. It is sown in corruption; it is raised in incorruption:"},{"v":43,"t":"It is sown in dishonour; it is raised in glory: it is sown in weakness; it is raised in power:"},{"v":44,"t":"It is sown a natural body; it is raised a spiritual body. There is a natural body, and there is a spiritual body."},{"v":45,"t":"And so it is written, The first man Adam was made a living soul; the last Adam was made a quickening spirit.","hl":1},{"v":46,"t":"Howbeit that was not first which is spiritual, but that which is natural; and afterward that which is spiritual."},{"v":47,"t":"The first man is of the earth, earthy: the second man is the Lord from heaven."},{"v":48,"t":"As is the earthy, such are they also that are earthy: and as is the heavenly, such are they also that are heavenly."}]},"John 3:34":{"ref":"John 3","cited":"34","verses":[{"v":31,"t":"He that cometh from above is above all: he that is of the earth is earthly, and speaketh of the earth: he that cometh from heaven is above all."},{"v":32,"t":"And what he hath seen and heard, that he testifieth; and no man receiveth his testimony."},{"v":33,"t":"He that hath received his testimony hath set to his seal that God is true."},{"v":34,"t":"For he whom God hath sent speaketh the words of God: for God giveth not the Spirit by measure unto him.","hl":1},{"v":35,"t":"The Father loveth the Son, and hath given all things into his hand."},{"v":36,"t":"He that believeth on the Son hath everlasting life: and he that believeth not the Son shall not see life; but the wrath of God abideth on him."}]},"John 16:13-14":{"ref":"John 16","cited":"13-14","verses":[{"v":10,"t":"Of righteousness, because I go to my Father, and ye see me no more;"},{"v":11,"t":"Of judgment, because the prince of this world is judged."},{"v":12,"t":"I have yet many things to say unto you, but ye cannot bear them now."},{"v":13,"t":"Howbeit when he, the Spirit of truth, is come, he will guide you into all truth: for he shall not speak of himself; but whatsoever he shall hear, that shall he speak: and he will shew you things to come.","hl":1},{"v":14,"t":"He shall glorify me: for he shall receive of mine, and shall shew it unto you.","hl":1},{"v":15,"t":"All things that the Father hath are mine: therefore said I, that he shall take of mine, and shall shew it unto you."},{"v":16,"t":"A little while, and ye shall not see me: and again, a little while, and ye shall see me, because I go to the Father."},{"v":17,"t":"Then said some of his disciples among themselves, What is this that he saith unto us, A little while, and ye shall not see me: and again, a little while, and ye shall see me: and, Because I go to the Father?"}]},"Proverbs 8":{"ref":"Proverbs 8","cited":"","verses":[{"v":1,"t":"Doth not wisdom cry? and understanding put forth her voice?"},{"v":2,"t":"She standeth in the top of high places, by the way in the places of the paths."},{"v":3,"t":"She crieth at the gates, at the entry of the city, at the coming in at the doors."},{"v":4,"t":"Unto you, O men, I call; and my voice is to the sons of man."},{"v":5,"t":"O ye simple, understand wisdom: and, ye fools, be ye of an understanding heart."},{"v":6,"t":"Hear; for I will speak of excellent things; and the opening of my lips shall be right things."},{"v":7,"t":"For my mouth shall speak truth; and wickedness is an abomination to my lips."},{"v":8,"t":"All the words of my mouth are in righteousness; there is nothing froward or perverse in them."},{"v":9,"t":"They are all plain to him that understandeth, and right to them that find knowledge."},{"v":10,"t":"Receive my instruction, and not silver; and knowledge rather than choice gold."},{"v":11,"t":"For wisdom is better than rubies; and all the things that may be desired are not to be compared to it."},{"v":12,"t":"I wisdom dwell with prudence, and find out knowledge of witty inventions."},{"v":13,"t":"The fear of the LORD is to hate evil: pride, and arrogancy, and the evil way, and the froward mouth, do I hate."},{"v":14,"t":"Counsel is mine, and sound wisdom: I am understanding; I have strength."},{"v":15,"t":"By me kings reign, and princes decree justice."},{"v":16,"t":"By me princes rule, and nobles, even all the judges of the earth."},{"v":17,"t":"I love them that love me; and those that seek me early shall find me."},{"v":18,"t":"Riches and honour are with me; yea, durable riches and righteousness."},{"v":19,"t":"My fruit is better than gold, yea, than fine gold; and my revenue than choice silver."},{"v":20,"t":"I lead in the way of righteousness, in the midst of the paths of judgment:"},{"v":21,"t":"That I may cause those that love me to inherit substance; and I will fill their treasures."},{"v":22,"t":"The LORD possessed me in the beginning of his way, before his works of old."},{"v":23,"t":"I was set up from everlasting, from the beginning, or ever the earth was."},{"v":24,"t":"When there were no depths, I was brought forth; when there were no fountains abounding with water."},{"v":25,"t":"Before the mountains were settled, before the hills was I brought forth:"},{"v":26,"t":"While as yet he had not made the earth, nor the fields, nor the highest part of the dust of the world."},{"v":27,"t":"When he prepared the heavens, I was there: when he set a compass upon the face of the depth:"},{"v":28,"t":"When he established the clouds above: when he strengthened the fountains of the deep:"},{"v":29,"t":"When he gave to the sea his decree, that the waters should not pass his commandment: when he appointed the foundations of the earth:"},{"v":30,"t":"Then I was by him, as one brought up with him: and I was daily his delight, rejoicing always before him;"},{"v":31,"t":"Rejoicing in the habitable part of his earth; and my delights were with the sons of men."},{"v":32,"t":"Now therefore hearken unto me, O ye children: for blessed are they that keep my ways."},{"v":33,"t":"Hear instruction, and be wise, and refuse it not."},{"v":34,"t":"Blessed is the man that heareth me, watching daily at my gates, waiting at the posts of my doors."},{"v":35,"t":"For whoso findeth me findeth life, and shall obtain favour of the LORD."},{"v":36,"t":"But he that sinneth against me wrongeth his own soul: all they that hate me love death."}]},"Acts 5":{"ref":"Acts 5","cited":"","verses":[{"v":1,"t":"But a certain man named Ananias, with Sapphira his wife, sold a possession,"},{"v":2,"t":"And kept back part of the price, his wife also being privy to it, and brought a certain part, and laid it at the apostles' feet."},{"v":3,"t":"But Peter said, Ananias, why hath Satan filled thine heart to lie to the Holy Ghost, and to keep back part of the price of the land?"},{"v":4,"t":"Whiles it remained, was it not thine own? and after it was sold, was it not in thine own power? why hast thou conceived this thing in thine heart? thou hast not lied unto men, but unto God."},{"v":5,"t":"And Ananias hearing these words fell down, and gave up the ghost: and great fear came on all them that heard these things."},{"v":6,"t":"And the young men arose, wound him up, and carried him out, and buried him."},{"v":7,"t":"And it was about the space of three hours after, when his wife, not knowing what was done, came in."},{"v":8,"t":"And Peter answered unto her, Tell me whether ye sold the land for so much? And she said, Yea, for so much."},{"v":9,"t":"Then Peter said unto her, How is it that ye have agreed together to tempt the Spirit of the Lord? behold, the feet of them which have buried thy husband are at the door, and shall carry thee out."},{"v":10,"t":"Then fell she down straightway at his feet, and yielded up the ghost: and the young men came in, and found her dead, and, carrying her forth, buried her by her husband."},{"v":11,"t":"And great fear came upon all the church, and upon as many as heard these things."},{"v":12,"t":"And by the hands of the apostles were many signs and wonders wrought among the people; (and they were all with one accord in Solomon's porch."},{"v":13,"t":"And of the rest durst no man join himself to them: but the people magnified them."},{"v":14,"t":"And believers were the more added to the Lord, multitudes both of men and women.)"},{"v":15,"t":"Insomuch that they brought forth the sick into the streets, and laid them on beds and couches, that at the least the shadow of Peter passing by might overshadow some of them."},{"v":16,"t":"There came also a multitude out of the cities round about unto Jerusalem, bringing sick folks, and them which were vexed with unclean spirits: and they were healed every one."},{"v":17,"t":"Then the high priest rose up, and all they that were with him, (which is the sect of the Sadducees,) and were filled with indignation,"},{"v":18,"t":"And laid their hands on the apostles, and put them in the common prison."},{"v":19,"t":"But the angel of the Lord by night opened the prison doors, and brought them forth, and said,"},{"v":20,"t":"Go, stand and speak in the temple to the people all the words of this life."},{"v":21,"t":"And when they heard that, they entered into the temple early in the morning, and taught. But the high priest came, and they that were with him, and called the council together, and all the senate of the children of Israel, and sent to the prison to have them brought."},{"v":22,"t":"But when the officers came, and found them not in the prison, they returned, and told,"},{"v":23,"t":"Saying, The prison truly found we shut with all safety, and the keepers standing without before the doors: but when we had opened, we found no man within."},{"v":24,"t":"Now when the high priest and the captain of the temple and the chief priests heard these things, they doubted of them whereunto this would grow."},{"v":25,"t":"Then came one and told them, saying, Behold, the men whom ye put in prison are standing in the temple, and teaching the people."},{"v":26,"t":"Then went the captain with the officers, and brought them without violence: for they feared the people, lest they should have been stoned."},{"v":27,"t":"And when they had brought them, they set them before the council: and the high priest asked them,"},{"v":28,"t":"Saying, Did not we straitly command you that ye should not teach in this name? and, behold, ye have filled Jerusalem with your doctrine, and intend to bring this man's blood upon us."},{"v":29,"t":"Then Peter and the other apostles answered and said, We ought to obey God rather than men."},{"v":30,"t":"The God of our fathers raised up Jesus, whom ye slew and hanged on a tree."},{"v":31,"t":"Him hath God exalted with his right hand to be a Prince and a Saviour, for to give repentance to Israel, and forgiveness of sins."},{"v":32,"t":"And we are his witnesses of these things; and so is also the Holy Ghost, whom God hath given to them that obey him."},{"v":33,"t":"When they heard that, they were cut to the heart, and took counsel to slay them."},{"v":34,"t":"Then stood there up one in the council, a Pharisee, named Gamaliel, a doctor of the law, had in reputation among all the people, and commanded to put the apostles forth a little space;"},{"v":35,"t":"And said unto them, Ye men of Israel, take heed to yourselves what ye intend to do as touching these men."},{"v":36,"t":"For before these days rose up Theudas, boasting himself to be somebody; to whom a number of men, about four hundred, joined themselves: who was slain; and all, as many as obeyed him, were scattered, and brought to nought."},{"v":37,"t":"After this man rose up Judas of Galilee in the days of the taxing, and drew away much people after him: he also perished; and all, even as many as obeyed him, were dispersed."},{"v":38,"t":"And now I say unto you, Refrain from these men, and let them alone: for if this counsel or this work be of men, it will come to nought:"},{"v":39,"t":"But if it be of God, ye cannot overthrow it; lest haply ye be found even to fight against God."},{"v":40,"t":"And to him they agreed: and when they had called the apostles, and beaten them, they commanded that they should not speak in the name of Jesus, and let them go."},{"v":41,"t":"And they departed from the presence of the council, rejoicing that they were counted worthy to suffer shame for his name."},{"v":42,"t":"And daily in the temple, and in every house, they ceased not to teach and preach Jesus Christ."}]},"Ecclesiastes 9:5":{"ref":"Ecclesiastes 9","cited":"5","verses":[{"v":2,"t":"All things come alike to all: there is one event to the righteous, and to the wicked; to the good and to the clean, and to the unclean; to him that sacrificeth, and to him that sacrificeth not: as is the good, so is the sinner; and he that sweareth, as he that feareth an oath."},{"v":3,"t":"This is an evil among all things that are done under the sun, that there is one event unto all: yea, also the heart of the sons of men is full of evil, and madness is in their heart while they live, and after that they go to the dead."},{"v":4,"t":"For to him that is joined to all the living there is hope: for a living dog is better than a dead lion."},{"v":5,"t":"For the living know that they shall die: but the dead know not any thing, neither have they any more a reward; for the memory of them is forgotten.","hl":1},{"v":6,"t":"Also their love, and their hatred, and their envy, is now perished; neither have they any more a portion for ever in any thing that is done under the sun."},{"v":7,"t":"Go thy way, eat thy bread with joy, and drink thy wine with a merry heart; for God now accepteth thy works."},{"v":8,"t":"Let thy garments be always white; and let thy head lack no ointment."}]},"2 Corinthians 5:8":{"ref":"2 Corinthians 5","cited":"8","verses":[{"v":5,"t":"Now he that hath wrought us for the selfsame thing is God, who also hath given unto us the earnest of the Spirit."},{"v":6,"t":"Therefore we are always confident, knowing that, whilst we are at home in the body, we are absent from the Lord:"},{"v":7,"t":"(For we walk by faith, not by sight:)"},{"v":8,"t":"We are confident, I say, and willing rather to be absent from the body, and to be present with the Lord.","hl":1},{"v":9,"t":"Wherefore we labour, that, whether present or absent, we may be accepted of him."},{"v":10,"t":"For we must all appear before the judgment seat of Christ; that every one may receive the things done in his body, according to that he hath done, whether it be good or bad."},{"v":11,"t":"Knowing therefore the terror of the Lord, we persuade men; but we are made manifest unto God; and I trust also are made manifest in your consciences."}]},"Psalm 146:4":{"ref":"Psalms 146","cited":"4","verses":[{"v":1,"t":"Praise ye the LORD. Praise the LORD, O my soul."},{"v":2,"t":"While I live will I praise the LORD: I will sing praises unto my God while I have any being."},{"v":3,"t":"Put not your trust in princes, nor in the son of man, in whom there is no help."},{"v":4,"t":"His breath goeth forth, he returneth to his earth; in that very day his thoughts perish.","hl":1},{"v":5,"t":"Happy is he that hath the God of Jacob for his help, whose hope is in the LORD his God:"},{"v":6,"t":"Which made heaven, and earth, the sea, and all that therein is: which keepeth truth for ever:"},{"v":7,"t":"Which executeth judgment for the oppressed: which giveth food to the hungry. The LORD looseth the prisoners:"}]},"John 11:11-14":{"ref":"John 11","cited":"11-14","verses":[{"v":8,"t":"His disciples say unto him, Master, the Jews of late sought to stone thee; and goest thou thither again?"},{"v":9,"t":"Jesus answered, Are there not twelve hours in the day? If any man walk in the day, he stumbleth not, because he seeth the light of this world."},{"v":10,"t":"But if a man walk in the night, he stumbleth, because there is no light in him."},{"v":11,"t":"These things said he: and after that he saith unto them, Our friend Lazarus sleepeth; but I go, that I may awake him out of sleep.","hl":1},{"v":12,"t":"Then said his disciples, Lord, if he sleep, he shall do well.","hl":1},{"v":13,"t":"Howbeit Jesus spake of his death: but they thought that he had spoken of taking of rest in sleep.","hl":1},{"v":14,"t":"Then said Jesus unto them plainly, Lazarus is dead.","hl":1},{"v":15,"t":"And I am glad for your sakes that I was not there, to the intent ye may believe; nevertheless let us go unto him."},{"v":16,"t":"Then said Thomas, which is called Didymus, unto his fellowdisciples, Let us also go, that we may die with him."},{"v":17,"t":"Then when Jesus came, he found that he had lain in the grave four days already."}]},"Luke 16":{"ref":"Luke 16","cited":"","verses":[{"v":1,"t":"And he said also unto his disciples, There was a certain rich man, which had a steward; and the same was accused unto him that he had wasted his goods."},{"v":2,"t":"And he called him, and said unto him, How is it that I hear this of thee? give an account of thy stewardship; for thou mayest be no longer steward."},{"v":3,"t":"Then the steward said within himself, What shall I do? for my lord taketh away from me the stewardship: I cannot dig; to beg I am ashamed."},{"v":4,"t":"I am resolved what to do, that, when I am put out of the stewardship, they may receive me into their houses."},{"v":5,"t":"So he called every one of his lord's debtors unto him, and said unto the first, How much owest thou unto my lord?"},{"v":6,"t":"And he said, An hundred measures of oil. And he said unto him, Take thy bill, and sit down quickly, and write fifty."},{"v":7,"t":"Then said he to another, And how much owest thou? And he said, An hundred measures of wheat. And he said unto him, Take thy bill, and write fourscore."},{"v":8,"t":"And the lord commended the unjust steward, because he had done wisely: for the children of this world are in their generation wiser than the children of light."},{"v":9,"t":"And I say unto you, Make to yourselves friends of the mammon of unrighteousness; that, when ye fail, they may receive you into everlasting habitations."},{"v":10,"t":"He that is faithful in that which is least is faithful also in much: and he that is unjust in the least is unjust also in much."},{"v":11,"t":"If therefore ye have not been faithful in the unrighteous mammon, who will commit to your trust the true riches?"},{"v":12,"t":"And if ye have not been faithful in that which is another man's, who shall give you that which is your own?"},{"v":13,"t":"No servant can serve two masters: for either he will hate the one, and love the other; or else he will hold to the one, and despise the other. Ye cannot serve God and mammon."},{"v":14,"t":"And the Pharisees also, who were covetous, heard all these things: and they derided him."},{"v":15,"t":"And he said unto them, Ye are they which justify yourselves before men; but God knoweth your hearts: for that which is highly esteemed among men is abomination in the sight of God."},{"v":16,"t":"The law and the prophets were until John: since that time the kingdom of God is preached, and every man presseth into it."},{"v":17,"t":"And it is easier for heaven and earth to pass, than one tittle of the law to fail."},{"v":18,"t":"Whosoever putteth away his wife, and marrieth another, committeth adultery: and whosoever marrieth her that is put away from her husband committeth adultery."},{"v":19,"t":"There was a certain rich man, which was clothed in purple and fine linen, and fared sumptuously every day:"},{"v":20,"t":"And there was a certain beggar named Lazarus, which was laid at his gate, full of sores,"},{"v":21,"t":"And desiring to be fed with the crumbs which fell from the rich man's table: moreover the dogs came and licked his sores."},{"v":22,"t":"And it came to pass, that the beggar died, and was carried by the angels into Abraham's bosom: the rich man also died, and was buried;"},{"v":23,"t":"And in hell he lift up his eyes, being in torments, and seeth Abraham afar off, and Lazarus in his bosom."},{"v":24,"t":"And he cried and said, Father Abraham, have mercy on me, and send Lazarus, that he may dip the tip of his finger in water, and cool my tongue; for I am tormented in this flame."},{"v":25,"t":"But Abraham said, Son, remember that thou in thy lifetime receivedst thy good things, and likewise Lazarus evil things: but now he is comforted, and thou art tormented."},{"v":26,"t":"And beside all this, between us and you there is a great gulf fixed: so that they which would pass from hence to you cannot; neither can they pass to us, that would come from thence."},{"v":27,"t":"Then he said, I pray thee therefore, father, that thou wouldest send him to my father's house:"},{"v":28,"t":"For I have five brethren; that he may testify unto them, lest they also come into this place of torment."},{"v":29,"t":"Abraham saith unto him, They have Moses and the prophets; let them hear them."},{"v":30,"t":"And he said, Nay, father Abraham: but if one went unto them from the dead, they will repent."},{"v":31,"t":"And he said unto him, If they hear not Moses and the prophets, neither will they be persuaded, though one rose from the dead."}]},"John 3:3":{"ref":"John 3","cited":"3","verses":[{"v":1,"t":"There was a man of the Pharisees, named Nicodemus, a ruler of the Jews:"},{"v":2,"t":"The same came to Jesus by night, and said unto him, Rabbi, we know that thou art a teacher come from God: for no man can do these miracles that thou doest, except God be with him."},{"v":3,"t":"Jesus answered and said unto him, Verily, verily, I say unto thee, Except a man be born again, he cannot see the kingdom of God.","hl":1},{"v":4,"t":"Nicodemus saith unto him, How can a man be born when he is old? can he enter the second time into his mother's womb, and be born?"},{"v":5,"t":"Jesus answered, Verily, verily, I say unto thee, Except a man be born of water and of the Spirit, he cannot enter into the kingdom of God."},{"v":6,"t":"That which is born of the flesh is flesh; and that which is born of the Spirit is spirit."}]},"Romans 8:9":{"ref":"Romans 8","cited":"9","verses":[{"v":6,"t":"For to be carnally minded is death; but to be spiritually minded is life and peace."},{"v":7,"t":"Because the carnal mind is enmity against God: for it is not subject to the law of God, neither indeed can be."},{"v":8,"t":"So then they that are in the flesh cannot please God."},{"v":9,"t":"But ye are not in the flesh, but in the Spirit, if so be that the Spirit of God dwell in you. Now if any man have not the Spirit of Christ, he is none of his.","hl":1},{"v":10,"t":"And if Christ be in you, the body is dead because of sin; but the Spirit is life because of righteousness."},{"v":11,"t":"But if the Spirit of him that raised up Jesus from the dead dwell in you, he that raised up Christ from the dead shall also quicken your mortal bodies by his Spirit that dwelleth in you."},{"v":12,"t":"Therefore, brethren, we are debtors, not to the flesh, to live after the flesh."}]},"Luke 12:32":{"ref":"Luke 12","cited":"32","verses":[{"v":29,"t":"And seek not ye what ye shall eat, or what ye shall drink, neither be ye of doubtful mind."},{"v":30,"t":"For all these things do the nations of the world seek after: and your Father knoweth that ye have need of these things."},{"v":31,"t":"But rather seek ye the kingdom of God; and all these things shall be added unto you."},{"v":32,"t":"Fear not, little flock; for it is your Father's good pleasure to give you the kingdom.","hl":1},{"v":33,"t":"Sell that ye have, and give alms; provide yourselves bags which wax not old, a treasure in the heavens that faileth not, where no thief approacheth, neither moth corrupteth."},{"v":34,"t":"For where your treasure is, there will your heart be also."},{"v":35,"t":"Let your loins be girded about, and your lights burning;"}]},"John 10:16":{"ref":"John 10","cited":"16","verses":[{"v":13,"t":"The hireling fleeth, because he is an hireling, and careth not for the sheep."},{"v":14,"t":"I am the good shepherd, and know my sheep, and am known of mine."},{"v":15,"t":"As the Father knoweth me, even so know I the Father: and I lay down my life for the sheep."},{"v":16,"t":"And other sheep I have, which are not of this fold: them also I must bring, and they shall hear my voice; and there shall be one fold, and one shepherd.","hl":1},{"v":17,"t":"Therefore doth my Father love me, because I lay down my life, that I might take it again."},{"v":18,"t":"No man taketh it from me, but I lay it down of myself. I have power to lay it down, and I have power to take it again. This commandment have I received of my Father."},{"v":19,"t":"There was a division therefore again among the Jews for these sayings."}]},"Psalm 37:29":{"ref":"Psalms 37","cited":"29","verses":[{"v":26,"t":"He is ever merciful, and lendeth; and his seed is blessed."},{"v":27,"t":"Depart from evil, and do good; and dwell for evermore."},{"v":28,"t":"For the LORD loveth judgment, and forsaketh not his saints; they are preserved for ever: but the seed of the wicked shall be cut off."},{"v":29,"t":"The righteous shall inherit the land, and dwell therein for ever.","hl":1},{"v":30,"t":"The mouth of the righteous speaketh wisdom, and his tongue talketh of judgment."},{"v":31,"t":"The law of his God is in his heart; none of his steps shall slide."},{"v":32,"t":"The wicked watcheth the righteous, and seeketh to slay him."}]},"Matthew 5:5":{"ref":"Matthew 5","cited":"5","verses":[{"v":2,"t":"And he opened his mouth, and taught them, saying,"},{"v":3,"t":"Blessed are the poor in spirit: for theirs is the kingdom of heaven."},{"v":4,"t":"Blessed are they that mourn: for they shall be comforted."},{"v":5,"t":"Blessed are the meek: for they shall inherit the earth.","hl":1},{"v":6,"t":"Blessed are they which do hunger and thirst after righteousness: for they shall be filled."},{"v":7,"t":"Blessed are the merciful: for they shall obtain mercy."},{"v":8,"t":"Blessed are the pure in heart: for they shall see God."}]},"Revelation 7":{"ref":"Revelation 7","cited":"","verses":[{"v":1,"t":"And after these things I saw four angels standing on the four corners of the earth, holding the four winds of the earth, that the wind should not blow on the earth, nor on the sea, nor on any tree."},{"v":2,"t":"And I saw another angel ascending from the east, having the seal of the living God: and he cried with a loud voice to the four angels, to whom it was given to hurt the earth and the sea,"},{"v":3,"t":"Saying, Hurt not the earth, neither the sea, nor the trees, till we have sealed the servants of our God in their foreheads."},{"v":4,"t":"And I heard the number of them which were sealed: and there were sealed an hundred and forty and four thousand of all the tribes of the children of Israel."},{"v":5,"t":"Of the tribe of Juda were sealed twelve thousand. Of the tribe of Reuben were sealed twelve thousand. Of the tribe of Gad were sealed twelve thousand."},{"v":6,"t":"Of the tribe of Aser were sealed twelve thousand. Of the tribe of Nepthalim were sealed twelve thousand. Of the tribe of Manasses were sealed twelve thousand."},{"v":7,"t":"Of the tribe of Simeon were sealed twelve thousand. Of the tribe of Levi were sealed twelve thousand. Of the tribe of Issachar were sealed twelve thousand."},{"v":8,"t":"Of the tribe of Zabulon were sealed twelve thousand. Of the tribe of Joseph were sealed twelve thousand. Of the tribe of Benjamin were sealed twelve thousand."},{"v":9,"t":"After this I beheld, and, lo, a great multitude, which no man could number, of all nations, and kindreds, and people, and tongues, stood before the throne, and before the Lamb, clothed with white robes, and palms in their hands;"},{"v":10,"t":"And cried with a loud voice, saying, Salvation to our God which sitteth upon the throne, and unto the Lamb."},{"v":11,"t":"And all the angels stood round about the throne, and about the elders and the four beasts, and fell before the throne on their faces, and worshipped God,"},{"v":12,"t":"Saying, Amen: Blessing, and glory, and wisdom, and thanksgiving, and honour, and power, and might, be unto our God for ever and ever. Amen."},{"v":13,"t":"And one of the elders answered, saying unto me, What are these which are arrayed in white robes? and whence came they?"},{"v":14,"t":"And I said unto him, Sir, thou knowest. And he said to me, These are they which came out of great tribulation, and have washed their robes, and made them white in the blood of the Lamb."},{"v":15,"t":"Therefore are they before the throne of God, and serve him day and night in his temple: and he that sitteth on the throne shall dwell among them."},{"v":16,"t":"They shall hunger no more, neither thirst any more; neither shall the sun light on them, nor any heat."},{"v":17,"t":"For the Lamb which is in the midst of the throne shall feed them, and shall lead them unto living fountains of waters: and God shall wipe away all tears from their eyes."}]},"Matthew 26:26-27":{"ref":"Matthew 26","cited":"26-27","verses":[{"v":23,"t":"And he answered and said, He that dippeth his hand with me in the dish, the same shall betray me."},{"v":24,"t":"The Son of man goeth as it is written of him: but woe unto that man by whom the Son of man is betrayed! it had been good for that man if he had not been born."},{"v":25,"t":"Then Judas, which betrayed him, answered and said, Master, is it I? He said unto him, Thou hast said."},{"v":26,"t":"And as they were eating, Jesus took bread, and blessed it, and brake it, and gave it to the disciples, and said, Take, eat; this is my body.","hl":1},{"v":27,"t":"And he took the cup, and gave thanks, and gave it to them, saying, Drink ye all of it;","hl":1},{"v":28,"t":"For this is my blood of the new testament, which is shed for many for the remission of sins."},{"v":29,"t":"But I say unto you, I will not drink henceforth of this fruit of the vine, until that day when I drink it new with you in my Father's kingdom."},{"v":30,"t":"And when they had sung an hymn, they went out into the mount of Olives."}]},"John 6:53":{"ref":"John 6","cited":"53","verses":[{"v":50,"t":"This is the bread which cometh down from heaven, that a man may eat thereof, and not die."},{"v":51,"t":"I am the living bread which came down from heaven: if any man eat of this bread, he shall live for ever: and the bread that I will give is my flesh, which I will give for the life of the world."},{"v":52,"t":"The Jews therefore strove among themselves, saying, How can this man give us his flesh to eat?"},{"v":53,"t":"Then Jesus said unto them, Verily, verily, I say unto you, Except ye eat the flesh of the Son of man, and drink his blood, ye have no life in you.","hl":1},{"v":54,"t":"Whoso eateth my flesh, and drinketh my blood, hath eternal life; and I will raise him up at the last day."},{"v":55,"t":"For my flesh is meat indeed, and my blood is drink indeed."},{"v":56,"t":"He that eateth my flesh, and drinketh my blood, dwelleth in me, and I in him."}]},"Luke 22:28-30":{"ref":"Luke 22","cited":"28-30","verses":[{"v":25,"t":"And he said unto them, The kings of the Gentiles exercise lordship over them; and they that exercise authority upon them are called benefactors."},{"v":26,"t":"But ye shall not be so: but he that is greatest among you, let him be as the younger; and he that is chief, as he that doth serve."},{"v":27,"t":"For whether is greater, he that sitteth at meat, or he that serveth? is not he that sitteth at meat? but I am among you as he that serveth."},{"v":28,"t":"Ye are they which have continued with me in my temptations.","hl":1},{"v":29,"t":"And I appoint unto you a kingdom, as my Father hath appointed unto me;","hl":1},{"v":30,"t":"That ye may eat and drink at my table in my kingdom, and sit on thrones judging the twelve tribes of Israel.","hl":1},{"v":31,"t":"And the Lord said, Simon, Simon, behold, Satan hath desired to have you, that he may sift you as wheat:"},{"v":32,"t":"But I have prayed for thee, that thy faith fail not: and when thou art converted, strengthen thy brethren."},{"v":33,"t":"And he said unto him, Lord, I am ready to go with thee, both into prison, and to death."}]},"Acts 15:28-29":{"ref":"Acts 15","cited":"28-29","verses":[{"v":25,"t":"It seemed good unto us, being assembled with one accord, to send chosen men unto you with our beloved Barnabas and Paul,"},{"v":26,"t":"Men that have hazarded their lives for the name of our Lord Jesus Christ."},{"v":27,"t":"We have sent therefore Judas and Silas, who shall also tell you the same things by mouth."},{"v":28,"t":"For it seemed good to the Holy Ghost, and to us, to lay upon you no greater burden than these necessary things;","hl":1},{"v":29,"t":"That ye abstain from meats offered to idols, and from blood, and from things strangled, and from fornication: from which if ye keep yourselves, ye shall do well. Fare ye well.","hl":1},{"v":30,"t":"So when they were dismissed, they came to Antioch: and when they had gathered the multitude together, they delivered the epistle:"},{"v":31,"t":"Which when they had read, they rejoiced for the consolation."},{"v":32,"t":"And Judas and Silas, being prophets also themselves, exhorted the brethren with many words, and confirmed them."}]},"Genesis 9:4":{"ref":"Genesis 9","cited":"4","verses":[{"v":1,"t":"And God blessed Noah and his sons, and said unto them, Be fruitful, and multiply, and replenish the earth."},{"v":2,"t":"And the fear of you and the dread of you shall be upon every beast of the earth, and upon every fowl of the air, upon all that moveth upon the earth, and upon all the fishes of the sea; into your hand are they delivered."},{"v":3,"t":"Every moving thing that liveth shall be meat for you; even as the green herb have I given you all things."},{"v":4,"t":"But flesh with the life thereof, which is the blood thereof, shall ye not eat.","hl":1},{"v":5,"t":"And surely your blood of your lives will I require; at the hand of every beast will I require it, and at the hand of man; at the hand of every man's brother will I require the life of man."},{"v":6,"t":"Whoso sheddeth man's blood, by man shall his blood be shed: for in the image of God made he man."},{"v":7,"t":"And you, be ye fruitful, and multiply; bring forth abundantly in the earth, and multiply therein."}]},"Acts 15:29":{"ref":"Acts 15","cited":"29","verses":[{"v":26,"t":"Men that have hazarded their lives for the name of our Lord Jesus Christ."},{"v":27,"t":"We have sent therefore Judas and Silas, who shall also tell you the same things by mouth."},{"v":28,"t":"For it seemed good to the Holy Ghost, and to us, to lay upon you no greater burden than these necessary things;"},{"v":29,"t":"That ye abstain from meats offered to idols, and from blood, and from things strangled, and from fornication: from which if ye keep yourselves, ye shall do well. Fare ye well.","hl":1},{"v":30,"t":"So when they were dismissed, they came to Antioch: and when they had gathered the multitude together, they delivered the epistle:"},{"v":31,"t":"Which when they had read, they rejoiced for the consolation."},{"v":32,"t":"And Judas and Silas, being prophets also themselves, exhorted the brethren with many words, and confirmed them."}]},"Leviticus 17":{"ref":"Leviticus 17","cited":"","verses":[{"v":1,"t":"And the LORD spake unto Moses, saying,"},{"v":2,"t":"Speak unto Aaron, and unto his sons, and unto all the children of Israel, and say unto them; This is the thing which the LORD hath commanded, saying,"},{"v":3,"t":"What man soever there be of the house of Israel, that killeth an ox, or lamb, or goat, in the camp, or that killeth it out of the camp,"},{"v":4,"t":"And bringeth it not unto the door of the tabernacle of the congregation, to offer an offering unto the LORD before the tabernacle of the LORD; blood shall be imputed unto that man; he hath shed blood; and that man shall be cut off from among his people:"},{"v":5,"t":"To the end that the children of Israel may bring their sacrifices, which they offer in the open field, even that they may bring them unto the LORD, unto the door of the tabernacle of the congregation, unto the priest, and offer them for peace offerings unto the LORD."},{"v":6,"t":"And the priest shall sprinkle the blood upon the altar of the LORD at the door of the tabernacle of the congregation, and burn the fat for a sweet savour unto the LORD."},{"v":7,"t":"And they shall no more offer their sacrifices unto devils, after whom they have gone a whoring. This shall be a statute for ever unto them throughout their generations."},{"v":8,"t":"And thou shalt say unto them, Whatsoever man there be of the house of Israel, or of the strangers which sojourn among you, that offereth a burnt offering or sacrifice,"},{"v":9,"t":"And bringeth it not unto the door of the tabernacle of the congregation, to offer it unto the LORD; even that man shall be cut off from among his people."},{"v":10,"t":"And whatsoever man there be of the house of Israel, or of the strangers that sojourn among you, that eateth any manner of blood; I will even set my face against that soul that eateth blood, and will cut him off from among his people."},{"v":11,"t":"For the life of the flesh is in the blood: and I have given it to you upon the altar to make an atonement for your souls: for it is the blood that maketh an atonement for the soul."},{"v":12,"t":"Therefore I said unto the children of Israel, No soul of you shall eat blood, neither shall any stranger that sojourneth among you eat blood."},{"v":13,"t":"And whatsoever man there be of the children of Israel, or of the strangers that sojourn among you, which hunteth and catcheth any beast or fowl that may be eaten; he shall even pour out the blood thereof, and cover it with dust."},{"v":14,"t":"For it is the life of all flesh; the blood of it is for the life thereof: therefore I said unto the children of Israel, Ye shall eat the blood of no manner of flesh: for the life of all flesh is the blood thereof: whosoever eateth it shall be cut off."},{"v":15,"t":"And every soul that eateth that which died of itself, or that which was torn with beasts, whether it be one of your own country, or a stranger, he shall both wash his clothes, and bathe himself in water, and be unclean until the even: then shall he be clean."},{"v":16,"t":"But if he wash them not, nor bathe his flesh; then he shall bear his iniquity."}]},"Genesis 9":{"ref":"Genesis 9","cited":"","verses":[{"v":1,"t":"And God blessed Noah and his sons, and said unto them, Be fruitful, and multiply, and replenish the earth."},{"v":2,"t":"And the fear of you and the dread of you shall be upon every beast of the earth, and upon every fowl of the air, upon all that moveth upon the earth, and upon all the fishes of the sea; into your hand are they delivered."},{"v":3,"t":"Every moving thing that liveth shall be meat for you; even as the green herb have I given you all things."},{"v":4,"t":"But flesh with the life thereof, which is the blood thereof, shall ye not eat."},{"v":5,"t":"And surely your blood of your lives will I require; at the hand of every beast will I require it, and at the hand of man; at the hand of every man's brother will I require the life of man."},{"v":6,"t":"Whoso sheddeth man's blood, by man shall his blood be shed: for in the image of God made he man."},{"v":7,"t":"And you, be ye fruitful, and multiply; bring forth abundantly in the earth, and multiply therein."},{"v":8,"t":"And God spake unto Noah, and to his sons with him, saying,"},{"v":9,"t":"And I, behold, I establish my covenant with you, and with your seed after you;"},{"v":10,"t":"And with every living creature that is with you, of the fowl, of the cattle, and of every beast of the earth with you; from all that go out of the ark, to every beast of the earth."},{"v":11,"t":"And I will establish my covenant with you; neither shall all flesh be cut off any more by the waters of a flood; neither shall there any more be a flood to destroy the earth."},{"v":12,"t":"And God said, This is the token of the covenant which I make between me and you and every living creature that is with you, for perpetual generations:"},{"v":13,"t":"I do set my bow in the cloud, and it shall be for a token of a covenant between me and the earth."},{"v":14,"t":"And it shall come to pass, when I bring a cloud over the earth, that the bow shall be seen in the cloud:"},{"v":15,"t":"And I will remember my covenant, which is between me and you and every living creature of all flesh; and the waters shall no more become a flood to destroy all flesh."},{"v":16,"t":"And the bow shall be in the cloud; and I will look upon it, that I may remember the everlasting covenant between God and every living creature of all flesh that is upon the earth."},{"v":17,"t":"And God said unto Noah, This is the token of the covenant, which I have established between me and all flesh that is upon the earth."},{"v":18,"t":"And the sons of Noah, that went forth of the ark, were Shem, and Ham, and Japheth: and Ham is the father of Canaan."},{"v":19,"t":"These are the three sons of Noah: and of them was the whole earth overspread."},{"v":20,"t":"And Noah began to be an husbandman, and he planted a vineyard:"},{"v":21,"t":"And he drank of the wine, and was drunken; and he was uncovered within his tent."},{"v":22,"t":"And Ham, the father of Canaan, saw the nakedness of his father, and told his two brethren without."},{"v":23,"t":"And Shem and Japheth took a garment, and laid it upon both their shoulders, and went backward, and covered the nakedness of their father; and their faces were backward, and they saw not their father's nakedness."},{"v":24,"t":"And Noah awoke from his wine, and knew what his younger son had done unto him."},{"v":25,"t":"And he said, Cursed be Canaan; a servant of servants shall he be unto his brethren."},{"v":26,"t":"And he said, Blessed be the LORD God of Shem; and Canaan shall be his servant."},{"v":27,"t":"God shall enlarge Japheth, and he shall dwell in the tents of Shem; and Canaan shall be his servant."},{"v":28,"t":"And Noah lived after the flood three hundred and fifty years."},{"v":29,"t":"And all the days of Noah were nine hundred and fifty years: and he died."}]},"Daniel 3":{"ref":"Daniel 3","cited":"","verses":[{"v":1,"t":"Nebuchadnezzar the king made an ima
