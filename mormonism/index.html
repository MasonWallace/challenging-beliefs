{"id":"grenfell-exit-testimony","category":"exit-costs","severity":"low","verdict":"contested","title":"Alyssa Grenfell's exit testimony: post-departure contact, garments, and the cost of deconstruction","claim":"Alyssa Grenfell (BYU graduate, ex-Mormon YouTuber with ~570k subscribers) documents in 'How to Leave the Mormon Church: An Exmormon's Guide to Rebuilding After Religion' (2023) and her channel: that departing members continue to be contacted and visited by ward representatives after disengaging; that daily garment-wearing functions as bodily monitoring whose abandonment is a visible, socially costly exit marker; and that deconstruction imposes heavy identity, family, and social costs. Her individual account is personal testimony, but its central factual elements are corroborated: post-exit contact matches the documented QuitMormon/resignation pattern, and garment expectations are stated in the church's own General Handbook (38.5).","bom":[],"bible":[],"sources":[{"name":"Alyssa Grenfell (background and reception)","type":"journalism","url":"https://en.wikipedia.org/wiki/Alyssa_Grenfell"},{"name":"Grenfell, How to Leave the Mormon Church (2023)","type":"primary","url":"https://www.amazon.com/stores/author/B0CRX88VCT"},{"name":"Mormonish podcast interview with Grenfell","type":"testimony","url":"https://www.mormonishpodcast.org/episode/alyssa"},{"name":"General Handbook 38.5: Temple garment expectations (corroborating policy)","type":"primary","url":"https://www.churchofjesuschrist.org/study/manual/general-handbook/38-church-policies-and-guidelines?lang=eng"}],"response":"The church does not respond to individual ex-member memoirs; its standing position is that members who step away remain loved and welcome, that ministering visits are voluntary pastoral care that ends when a person asks or resigns, and that garments are a sacred private covenant obligation members freely accepted in the temple, not surveillance. Apologists would add that a monetized ex-Mormon media career creates its own incentives, and that one person's experience should not be generalized to a church of 17 million.","responseSource":{"name":"General Handbook (ministering, garments, and record removal provisions)","url":"https://www.churchofjesuschrist.org/study/manual/general-handbook/38-church-policies-and-guidelines?lang=eng"},"rationale":"Her core factual claims (continued contact after disengagement; garment norms; social exit costs) are corroborated by church policy documents and independent journalism at the pattern level, but the memoir itself is uncorroborated personal testimony on specific incidents — badged accordingly. It is included as a representative, corroborated voice for a documented pattern, not as standalone proof."},
{"id":"ces-letter-gospel-topics-visibility","category":"institutional","severity":"medium","verdict":"contested","title":"Information control: the CES Letter phenomenon and the quiet rollout of the Gospel Topics Essays","claim":"Jeremy Runnells' CES Letter (2013) — a compilation of historical problems sent to a Church Educational System director who never answered — became the most widely circulated exit document in modern Mormonism; Runnells was summoned to a disciplinary council and resigned in 2016. In the same period the church published 13 Gospel Topics Essays (2013–2015) conceding many long-denied historical facts (multiple First Vision accounts, seer-stone translation, Joseph Smith's polygamy), but released them with no announcement, unsigned, buried in the website's topics database; Church Historian Elder Steven E. Snow acknowledged the deliberate 'soft roll out,' and members teaching from the essays were in some cases rebuked by local leaders.","bom":[],"bible":[],"sources":[{"name":"CES Letter (the primary document)","type":"primary","url":"https://cesletter.org/"},{"name":"Gospel Topics Essays (official landing page)","type":"institutional","url":"https://www.churchofjesuschrist.org/study/manual/gospel-topics-essays/essays?lang=eng"},{"name":"Mormon Stories: Elder Steven E. Snow explains the quiet rollout (recording)","type":"primary","url":"https://www.mormonstories.org/elder-steven-e-snow-lds-gospel-topics-essays-not-advertisex/"},{"name":"Salt Lake Tribune: 'Mormon leaders spread word about controversial essays'","type":"journalism","url":"https://archive.sltrib.com/article.php?id=1606088&amp=&itype=CMSID"}],"response":"The church's steelman: it did the historically unprecedented thing critics demanded — publishing frank, scholar-vetted essays on its hardest topics on its own website, later integrating that history into the official 'Saints' volumes and curriculum. Elder Snow's explanation of the quiet rollout was pastoral, not conspiratorial: most members were not troubled by these issues, and the essays were placed where searching members would find them without alarming those who weren't asking. FAIR argues the CES Letter itself is a 'shotgun' compilation of recycled claims, most of which the essays and apologetic literature substantively answer.","responseSource":{"name":"FAIR: Response to the CES Letter","url":"https://www.fairlatterdaysaints.org/answers/Criticism_of_Mormonism/Websites/CES_Letter"},"rationale":"The factual timeline is established — including by Elder Snow's own recorded explanation of the deliberate low-visibility release — but 'information control' vs. 'pastoral prudence' is an interpretive dispute, and the church did ultimately publish the material. Runnells' discipline for compiling questions, however, is documented and sits uneasily with the transparency claim."},
{"id":"september-six","category":"institutional","severity":"medium","verdict":"unrefuted","title":"The September Six: coordinated 1993 discipline of scholars and feminists","claim":"In September 1993, six Mormon scholars and feminists — Lavina Fielding Anderson, Avraham Gileadi, Maxine Hanks, D. Michael Quinn, Paul Toscano, and Lynne Kanavel Whitesides — were excommunicated or disfellowshipped within weeks of each other for publishing history and theology unwelcome to leadership (Quinn's post-1890 polygamy research, Heavenly Mother writing, feminist advocacy). Months earlier, apostle Boyd K. Packer had publicly named 'the gay-lesbian movement, the feminist movement, and the so-called scholars or intellectuals' as the church's three greatest dangers, and evidence indicates apostolic involvement despite discipline nominally being local. The episode chilled Mormon studies for a generation.","bom":[],"bible":[],"sources":[{"name":"September Six (survey with primary citations)","type":"journalism","url":"https://en.wikipedia.org/wiki/September_Six"},{"name":"The Conversation: 'How September 1993 continues to trouble the church' (Sara Patterson, 2023)","type":"scholarly","url":"https://theconversation.com/how-september-1993-when-latter-day-saints-leaders-disciplined-six-dissidents-continues-to-trouble-the-church-213059"},{"name":"Dialogue: 'The September Six and the lost generation of Mormon studies'","type":"scholarly","url":"https://www.dialoguejournal.com/articles/the-september-six-and-the-lost-generation-of-mormon-studies/"}],"response":"FAIR and the church maintain that membership discipline is administered locally by stake presidents for conduct such as public opposition to the church and its leaders — apostasy as defined in the handbook — not for scholarship per se, noting that many practicing historians publish critical work without discipline and that the church does not centrally direct individual councils. The church also points to its later trajectory — the Joseph Smith Papers, Gospel Topics Essays, and rehabilitation gestures (Hanks was rebaptized in 2012) — as evidence it can absorb rigorous history.","responseSource":{"name":"FAIR: History scholars and Church discipline","url":"https://www.fairlatterdaysaints.org/answers/History_scholars_and_Church_discipline"},"rationale":"The six disciplinary actions, their timing, and Packer's 'three dangers' speech are matters of documented record disputed by no one; only the degree of central coordination is argued. As a factual claim about institutional response to dissent, it stands."},
{"id":"sec-ensign-peak-settlement","category":"institutional","severity":"high","verdict":"admitted","title":"2023 SEC settlement: $5M fine for two decades of concealed holdings via shell LLCs","claim":"On February 21, 2023, the SEC charged the LDS Church and its investment manager Ensign Peak Advisors with disclosure failures: from 1997 to 2019 Ensign Peak concealed a public-equity portfolio that grew to about $32 billion behind 13 shell LLCs with nominee 'managers,' filing misstated Forms 13F to avoid revealing the church's holdings — per the SEC order, with the knowledge and approval of the church's First Presidency, motivated by concern over negative publicity. Ensign Peak paid $4 million and the church $1 million to settle. This is a legal finding about institutional candor, not a truth-claim about doctrine.","bom":[],"bible":[],"sources":[{"name":"SEC press release 2023-35 (with link to the administrative order)","type":"primary","url":"https://www.sec.gov/newsroom/press-releases/2023-35"},{"name":"CNBC: 'Mormon church, affiliated nonprofit to pay $5 million to settle SEC charges'","type":"journalism","url":"https://www.cnbc.com/2023/02/21/mormon-lds-church-nonprofit-to-settle-sec-charges.html"},{"name":"2023 SEC charges against the LDS Church and Ensign Peak (survey)","type":"journalism","url":"https://en.wikipedia.org/wiki/2023_Securities_and_Exchange_Commission_charges_against_the_LDS_Church_and_Ensign_Peak_Advisors"}],"response":"The church's official statement says it relied on legal counsel's advice about how to comply with 13F reporting while maintaining the privacy of the portfolio (citing scriptural admonitions to keep sacred donations private and avoid ostentation), that it regrets mistakes made, and that when the SEC first expressed concern in 2019 Ensign Peak immediately reformed its filings — it now files a single consolidated 13F. The church emphasizes the settlement involved no allegation of misuse of funds, fraud against investors, or harm to members: it was a reporting-form violation, and funds remain devoted to the church's religious and charitable mission.","responseSource":{"name":"Church Newsroom: Church issues statement on SEC settlement","url":"https://newsroom.churchofjesuschrist.org/article/church-issues-statement-on-sec-settlement"},"rationale":"The facts are fixed by the SEC's administrative order and the church's own settlement and public statement acknowledging mistakes; the shell-LLC structure and its publicity-avoidance motive are in the order itself. Only the characterization (bad legal advice vs. deliberate institutional concealment) remains argued."},
{"id":"nephite-non-levite-priesthood","category":"doctrinal-conflict","severity":"medium","verdict":"contested","title":"Nephite priests and sacrifices without Levitical lineage","claim":"The Book of Mormon says the Nephites kept the Law of Moses strictly (2 Nephi 5:10; 25:24) and offered burnt sacrifices (1 Nephi 5:9; Mosiah 2:3), yet Nephi — of the tribe of Joseph/Manasseh (Alma 10:3) — consecrates his brothers Jacob and Joseph as priests (2 Nephi 5:26). The Mosaic law restricted the priesthood and sacrificial service to Aaron's line within Levi (Numbers 3:9–12; 16:39–40), and Hebrews 7:13–14 states plainly that of a non-Levite tribe 'no man gave attendance at the altar.' Critics argue a genuinely law-observant Israelite colony could not have operated a non-Levitical sacrificial priesthood while claiming to keep the law of Moses.","bom":["2 Nephi 5:10","2 Nephi 5:26","2 Nephi 25:24","1 Nephi 5:9","Mosiah 2:3","Jacob 1:18","Alma 10:3"],"bible":["Numbers 3:9-12","Numbers 16:39-40","Deuteronomy 33:8-11","Hebrews 7:13-14","2 Chronicles 26:16-21"],"sources":[{"name":"Institute for Religious Research — Contradictions Between Book of Mormon and Bible","type":"apologetics","url":"https://mit.irr.org/contradictions-between-book-of-mormon-and-bible"},{"name":"Book of Mormon (2 Nephi 5), primary text","type":"primary","url":"https://www.churchofjesuschrist.org/study/scriptures/bofm/2-ne/5?lang=eng"},{"name":"FAIR — Temples in the Book of Mormon","type":"apologetics","url":"https://www.fairlatterdaysaints.org/answers/Book_of_Mormon/Temple_in_New_World"}],"response":"LDS apologists argue the Nephites held the higher Melchizedek priesthood — Jacob was ordained 'after the manner of his holy order' (2 Nephi 6:2; cf. Alma 13) — which biblically predates and transcends Levi (Genesis 14; Psalm 110; Hebrews 7:4–10), so Levitical restrictions did not bind them. They add that the Book of Mormon never claims Levitical authority for these priests, that no Levites traveled with Lehi's party, and that historical Jewish communities of exactly Lehi's era operated sacrificial sites outside the Levitical-Jerusalem system (Elephantine, Arad), showing the practice was not unthinkable for diaspora Israelites.","responseSource":{"name":"FAIR — Temples in the Book of Mormon / Nephite priesthood","url":"https://www.fairlatterdaysaints.org/answers/Book_of_Mormon/Temple_in_New_World"},"rationale":"The Melchizedek-order reading has an internal textual basis (Alma 13) and Elephantine gives real historical precedent for irregular diaspora practice; but Hebrews 7 treats non-Levitical priesthood as incompatible with the Mosaic law the Nephites claim to be keeping 'in all things,' and the tension between strict law observance and a non-Aaronic altar remains unresolved."},
{"id":"temples-outside-jerusalem","category":"doctrinal-conflict","severity":"low","verdict":"contested","title":"Multiple Nephite temples vs. Deuteronomy's one sanctuary","claim":"Nephi builds a temple 'after the manner of the temple of Solomon' (2 Nephi 5:16), and the Book of Mormon later describes temples in multiple cities (Alma 16:13; 26:29; Helaman 3:9,14). Deuteronomy 12:5–14 confines sacrificial worship to 'the place which the LORD your God shall choose' — understood after Solomon as the Jerusalem temple alone — and Josiah's reform, within living memory of Lehi's departure, had specifically destroyed rival sanctuaries. A colony professing strict Mosaic observance while multiplying temples runs against the law's centralization command.","bom":["2 Nephi 5:16","Alma 16:13","Alma 26:29","Helaman 3:9","Helaman 3:14"],"bible":["Deuteronomy 12:5-14","1 Kings 8:29","2 Kings 23:4-20"],"sources":[{"name":"Institute for Religious Research — Contradictions Between Book of Mormon and Bible","type":"apologetics","url":"https://mit.irr.org/contradictions-between-book-of-mormon-and-bible"},{"name":"FAIR — Temples in the Book of Mormon","type":"apologetics","url":"https://www.fairlatterdaysaints.org/answers/Book_of_Mormon/Temple_in_New_World"},{"name":"Book of Mormon (2 Nephi 5:16), primary text","type":"primary","url":"https://www.churchofjesuschrist.org/study/scriptures/bofm/2-ne/5?lang=eng"}],"response":"FAIR points to documented Jewish temples outside Jerusalem contemporary with or shortly after Lehi — the sacrificial temple at Elephantine in Egypt, the sanctuary at Arad, and later Leontopolis — showing that Jews far from Jerusalem did in fact build temples, and arguing Deuteronomy 12's centralization applied within the land of Israel, not to communities cut off from it across an ocean. On this reading Nephi's temple is what a devout but permanently separated Israelite colony would plausibly do.","responseSource":{"name":"FAIR — Temples in the Book of Mormon","url":"https://www.fairlatterdaysaints.org/answers/Book_of_Mormon/Temple_in_New_World"},"rationale":"Elephantine and Arad are genuine archaeological facts that blunt the 'unthinkable' framing; but those sites are generally judged irregular against Deuteronomic law, whereas the Book of Mormon presents Nephite temples as fully legitimate, so the normative conflict with Deuteronomy 12 stands even if the historical practice has precedent."},
{"id":"christ-remains-in-heaven-acts-3","category":"doctrinal-conflict","severity":"low","verdict":"answered","title":"Christ's Nephite visit vs. Acts 3:21 'heaven must receive him'","claim":"The Book of Mormon's centerpiece is the resurrected Christ descending to minister bodily to the Nephites for days (3 Nephi 11–28). Critics set this against Peter's statement that Jesus is one 'whom the heaven must receive until the times of restitution of all things' (Acts 3:20–21) — arguing the New Testament expects Christ to remain in heaven between the ascension and the last days, leaving no room for an extended post-ascension earthly ministry in the Americas.","bom":["3 Nephi 11:8-17","3 Nephi 26:13"],"bible":["Acts 3:20-21","Acts 1:9-11"],"sources":[{"name":"Institute for Religious Research — Contradictions Between Book of Mormon and Bible","type":"apologetics","url":"https://mit.irr.org/contradictions-between-book-of-mormon-and-bible"},{"name":"Book of Mormon (3 Nephi 11), primary text","type":"primary","url":"https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/11?lang=eng"}],"response":"LDS apologists reply that the New Testament itself records post-ascension appearances of Christ — to Stephen (Acts 7:55–56), to Paul on the Damascus road (Acts 9:3–6; 1 Corinthians 15:8), and to John on Patmos (Revelation 1:12–18) — so Acts 3:21 cannot mean Christ never appears before the restitution; it describes his heavenly residence, not a prohibition on visitation. The Nephite ministry is claimed to be the same kind of appearance at larger scale, and 'other sheep I have' (John 10:16) is read as Jesus's own anticipation of it.","responseSource":{"name":"FAIR — Jesus Christ's visit to the Americas","url":"https://www.fairlatterdaysaints.org/answers/Book_of_Mormon/Jesus_Christ_visits_the_Americas"},"rationale":"The strong reading of Acts 3:21 (no earthly appearance until the end) is defeated by the New Testament's own post-ascension appearances to Stephen, Paul, and John; whatever other problems 3 Nephi has (covered elsewhere), this particular verse does not textually exclude an appearance."},
{"id":"joseph-smith-failed-prophecies","category":"canon-provenance","severity":"medium","verdict":"contested","title":"Joseph Smith's predictive prophecies vs. the Deuteronomy 18 test","claim":"D&C 84:2–5 (September 1832) declares that a temple 'shall be reared in this generation' on the dedicated lot in Independence, Missouri — 'verily this generation shall not all pass away until an house shall be built unto the Lord' — yet no temple was ever built there, and every member of that generation is long dead. Critics apply Deuteronomy 18:20–22: a prophet whose predicted thing 'follow not, nor come to pass' has spoken presumptuously. Related cases include D&C 114:1 (David W. Patten called to a mission 'next spring' — he was killed months earlier) and the 1835 fifty-six-year Second Coming statement.","bom":["D&C 84:2-5","D&C 114:1","D&C 124:49-51"],"bible":["Deuteronomy 18:20-22","Ezekiel 33:33","Jeremiah 28:9"],"sources":[{"name":"Pastor Unlikely — 41 Authentic Bible Verses to Contradict Mormonism","type":"apologetics","url":"https://pastorunlikely.com/41-authentic-bible-verses-to-contradict-mormonism/"},{"name":"Institute for Religious Research — Joseph Smith's Missouri Temple Prophecy","type":"apologetics","url":"https://mit.irr.org/joseph-smiths-missouri-temple-prophecy"},{"name":"Doctrine and Covenants 84, primary text","type":"primary","url":"https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/84?lang=eng"},{"name":"FAIR — Alleged false prophecies of Joseph Smith","type":"apologetics","url":"https://www.fairlatterdaysaints.org/answers/Alleged_false_prophecies_of_Joseph_Smith"}],"response":"FAIR argues biblical prophecy is often implicitly conditional on human obedience — Jonah's unqualified 'forty days and Nineveh shall be overthrown' did not come to pass and Jonah was no false prophet — and D&C 124:49–51 (1841) canonizes exactly this principle: when enemies prevent a commanded work, God 'requires that work no more.' The Saints were violently expelled from Jackson County in 1833, making the temple impossible; alternative readings take verse 5's 'an house' as fulfilled by the Kirtland temple (1836) or the command as a directive rather than a flat prediction.","responseSource":{"name":"FAIR — The temple in Independence, Missouri","url":"https://www.fairlatterdaysaints.org/answers/Joseph_Smith/Alleged_false_prophecies/Saints_left_Missouri_before_temple_was_built"},"rationale":"The non-fulfillment is an undisputed fact and the 'this generation shall not all pass away' formula reads as an unconditional time-bound oracle (later leaders like Orson Pratt kept reaffirming it as such); yet the Jonah precedent and the in-canon conditionality clause of D&C 124:49 give the LDS response genuine biblical and textual footing, so the argument turns on contested hermeneutics rather than settled fact."},
{"id":"word-of-wisdom-dietary-law","category":"practice-worship","severity":"medium","verdict":"contested","title":"The Word of Wisdom: coffee, tea, and temple worthiness","claim":"D&C 89 (1833) counsels against wine, strong drink, tobacco, and 'hot drinks' (defined as coffee and tea), and its own preamble states it is sent 'not by commandment or constraint' (D&C 89:2); for decades observance was uneven. Under Heber J. Grant, abstinence became a fixed temple-recommend requirement (formalized by 1921) — meaning a coffee or wine drinker today cannot enter the temple and therefore, in LDS teaching, cannot receive the ordinances required for exaltation. Critics set this against the New Testament's explicit release from food-and-drink regulations: Jesus 'declared all foods clean' (Mark 7:18–19), Paul forbids judging believers 'in meat, or in drink' and calls 'touch not; taste not; handle not' rules of no value (Colossians 2:16–23), warns that 'commanding to abstain from meats' marks latter-day apostasy (1 Timothy 4:1–5), and makes dietary practice a matter of conscience (Romans 14).","bom":["D&C 89:1-9"],"bible":["Mark 7:18-19","Colossians 2:16-23","1 Timothy 4:1-5","Romans 14:14-17","Matthew 11:19"],"sources":[{"name":"Church History Topics — Word of Wisdom (D&C 89)","type":"primary","url":"https://www.churchofjesuschrist.org/study/history/topics/word-of-wisdom-dc-89?lang=eng"},{"name":"FAIR — Word of Wisdom: History and implementation","type":"apologetics","url":"https://www.fairlatterdaysaints.org/answers/Word_of_Wisdom/History_and_implementation"},{"name":"MRM — The Word of Wisdom: Food Restrictions & False Prophets","type":"apologetics","url":"https://mrm.org/the-word-of-wisdom-food-restrictions-false-prophets"},{"name":"Doctrine and Covenants 89, primary text","type":"primary","url":"https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/89?lang=eng"}],"response":"The steelmanned LDS position: the Word of Wisdom is not a purity law claiming certain substances defile the soul, but a revealed health code and covenant standard — the body as a temple of God (1 Corinthians 6:19–20) — which the church, like any covenant community, may set as a condition of its own ordinances; biblical precedents include the Nazirite vow, Daniel's abstention, and the Rechabites, all commended. The shift from counsel to commandment is explained as prophetic implementation by common consent over time — 'adapted to the capacity of the weak' (D&C 89:3) — an exercise of the same living prophetic authority Latter-day Saints believe governed dietary rules in both Testaments.","responseSource":{"name":"FAIR — Word of Wisdom: History and implementation","url":"https://www.fairlatterdaysaints.org/answers/Word_of_Wisdom/History_and_implementation"},"rationale":"The historical facts (originally 'not by commandment,' later hardened into a worthiness gate) are undisputed and conceded in church sources; whether this contradicts Scripture is contested — the health-code framing is coherent, but Colossians 2:20–23 and 1 Timothy 4:3 target precisely the practice of making abstinence rules a measure of religious standing, and tying drink rules to exaltation-prerequisite ordinances presses hard against that text."},
{"id":"temple-garments-practice","category":"practice-temple","severity":"low","verdict":"contested","title":"Temple garments: prescribed sacred underclothing and its enforcement","claim":"Endowed Latter-day Saints covenant to wear the temple garment — a prescribed white underclothing bearing sacred marks — with the General Handbook (38.5) instructing that it should be worn 'day and night throughout your life' and never altered; since 2024 the temple-recommend interview includes a standardized statement on garment wearing to which members respond, making the practice a recurring worthiness checkpoint. Critics note the New Testament nowhere prescribes ritual clothing for believers, and that the claimed biblical analogue — the tzitzit fringes of Numbers 15:38–39 — was a visible outer sign commanded specifically to Israel under the Mosaic law, whereas Colossians 2:16–23 warns against measuring Christian standing by ordinances of external observance.","bom":[],"bible":["Numbers 15:38-39","Deuteronomy 22:12","Colossians 2:16-23","Matthew 23:5","1 Samuel 16:7"],"sources":[{"name":"General Handbook 38.5 — Temple Garment","type":"primary","url":"https://www.churchofjesuschrist.org/study/manual/general-handbook/38-church-policies-and-guidelines?lang=eng"},{"name":"Church — Temple Garment FAQ","type":"primary","url":"https://www.churchofjesuschrist.org/temples/temple-garment-faq?lang=eng"},{"name":"Salt Lake Tribune — LDS leaders alter temple recommend questions (2024)","type":"journalism","url":"https://www.sltrib.com/religion/2024/04/13/lds-leaders-alter-temple-recommend/"}],"response":"The church presents the garment as a private, personal reminder of covenants made in the temple — analogous to the nun's habit, the priest's cassock, the Jewish prayer shawl, or the Muslim skullcap, 'part of a rich tapestry of human devotion to God' — and notes the tzitzit's own stated purpose ('that ye may look upon it, and remember all the commandments of the LORD,' Numbers 15:39) is exactly the garment's stated purpose. Wearing it is framed as the keeping of a freely made covenant, not a claim that clothing saves; the recommend statement is read as covenant accountability rather than legalism.","responseSource":{"name":"Church Newsroom — Temple Garment FAQ","url":"https://www.churchofjesuschrist.org/temples/temple-garment-faq?lang=eng"},"rationale":"The practice and its interview enforcement are documented from the church's own handbook; whether it conflicts with Scripture is a normative dispute — the tzitzit parallel is real in function (a remembrance sign) but belongs to the Mosaic covenant Christians hold fulfilled, and the Bible neither commands nor forbids such a practice for the church, so the criticism rests on inference rather than direct contradiction."},
{"id":"exaltation-eternal-progression","category":"exaltation","severity":"high","verdict":"unrefuted","title":"Exaltation: humans becoming gods vs. Isaiah's exclusive monotheism","claim":"LDS scripture teaches that the faithful sealed in celestial marriage 'shall pass by the angels, and the gods… Then shall they be gods, because they have no end… because they have all power' (D&C 132:19–20); Joseph Smith's King Follett discourse (1844) taught that God 'was once a man like us' and that the Saints must learn 'how to be gods yourselves,' crystallized in Lorenzo Snow's couplet 'As man now is, God once was; as God now is, man may be.' The church's 2014 essay 'Becoming Like God' complains this is 'reduced in media to a cartoonish image of people receiving their own planets' — yet reaffirms the substance: exaltation to godhood with divine creative capacity. Critics set this against Yahweh's own words: 'before me there was no God formed, neither shall there be after me' (Isaiah 43:10; cf. 44:6–8), and note the first promise of godhood in Scripture came from the serpent: 'ye shall be as gods' (Genesis 3:5).","bom":["D&C 132:19-20","D&C 132:37","Abraham 3:22-26"],"bible":["Isaiah 43:10","Isaiah 44:6-8","Isaiah 45:5","Genesis 3:5","Psalm 90:2"],"sources":[{"name":"Gospel Topics Essay — Becoming Like God","type":"primary","url":"https://www.churchofjesuschrist.org/study/manual/gospel-topics-essays/becoming-like-god?lang=eng"},{"name":"King Follett Sermon (Ensign reprint)","type":"primary","url":"https://www.churchofjesuschrist.org/study/ensign/1971/04/the-king-follett-sermon?lang=eng"},{"name":"Doctrine and Covenants 132, primary text","type":"primary","url":"https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/132?lang=eng"},{"name":"Pastor Unlikely — 41 Authentic Bible Verses to Contradict Mormonism","type":"apologetics","url":"https://pastorunlikely.com/41-authentic-bible-verses-to-contradict-mormonism/"}],"response":"The essay's steelman: deification language pervades early Christianity — Psalm 82:6/John 10:34 ('Ye are gods'), 2 Peter 1:4 ('partakers of the divine nature'), Romans 8:17 ('joint-heirs with Christ'), and church fathers from Irenaeus to Clement of Alexandria ('the Word of God became man, that thou mayest learn from man how man may become God') — so LDS exaltation restores an ancient doctrine of theosis rather than inventing polytheism. Isaiah's denials are read as directed at idols and rival gods, not at God's children inheriting his nature; exalted beings remain eternally subordinate to the Father, and the essay stresses that little has been revealed about the couplet's first half.","responseSource":{"name":"Gospel Topics Essay — Becoming Like God","url":"https://www.churchofjesuschrist.org/study/manual/gospel-topics-essays/becoming-like-god?lang=eng"},"rationale":"The doctrinal content is established from the church's own canon and current essay, which disavows the planet caricature while reaffirming godhood with creative capacity; the theosis steelman fails to close the gap because patristic deification explicitly preserved the Creator/creature distinction and never taught that God was once a man or that the deified become gods in the ontological sense D&C 132 describes — leaving Isaiah 43:10's 'no God formed… after me' in direct tension."},
{"id":"priesthood-temple-ban-1852-1978","category":"doctrinal-conflict","severity":"high","verdict":"admitted","title":"The priesthood and temple ban on Black members, 1852–1978","claim":"From Brigham Young's 1852 announcements until Official Declaration 2 (June 1978), the church barred members of Black African descent — men from priesthood ordination, men and women from temple endowment and sealing — meaning, in the church's own soteriology, exclusion from the ordinances required for exaltation for 126 years; First Presidency statements (1949, 1969) defended the ban as divinely instituted, grounding it in premortal conduct and the curse of Cain. The church's 2013 essay 'Race and the Priesthood' now disavows 'the theories advanced in the past' and situates the ban's origin in the racial culture of 1850s America, claiming no founding revelation. Critics set the policy against Peter's revelation that 'God is no respecter of persons' (Acts 10:34–35) and Paul's 'there is neither Jew nor Greek… ye are all one in Christ Jesus' (Galatians 3:28).","bom":["Official Declaration 2"],"bible":["Acts 10:34-35","Galatians 3:28","Acts 17:26","Colossians 3:11","Revelation 7:9"],"sources":[{"name":"Gospel Topics Essay — Race and the Priesthood","type":"primary","url":"https://www.churchofjesuschrist.org/study/manual/gospel-topics-essays/race-and-the-priesthood?lang=eng"},{"name":"Official Declaration 2 (1978), primary text","type":"primary","url":"https://www.churchofjesuschrist.org/study/scriptures/dc-testament/od/2?lang=eng"},{"name":"FAIR — Blacks and the priesthood","type":"apologetics","url":"https://www.fairlatterdaysaints.org/answers/Mormonism_and_racial_issues/Blacks_and_the_priesthood"}],"response":"The steelmanned response leans on the 2013 essay itself: Joseph Smith ordained Black men (Elijah Able; Q. Walker Lewis), the restriction arose under Young amid 1850s American racial culture without a recorded founding revelation, and it was ended by genuine revelation to Spencer W. Kimball in 1978; the church has since repudiated every theological justification once offered. Apologists draw the parallel of Acts itself — the gospel was withheld from Gentiles until Peter's revelation — arguing God lifts restrictions on his own timetable through living prophets, and that a church capable of disavowing its leaders' errors demonstrates, rather than disproves, ongoing revelation.","responseSource":{"name":"Gospel Topics Essay — Race and the Priesthood","url":"https://www.churchofjesuschrist.org/study/manual/gospel-topics-essays/race-and-the-priesthood?lang=eng"},"rationale":"The history is fully documented and conceded in the church's own essay; the Acts-10 parallel cuts against the defense rather than for it — Peter's revelation abolished ethnic exclusion at the church's founding, whereas the LDS ban was instituted after an inclusive start, defended as doctrine by prophets for over a century, and its stated justifications are now officially disavowed, leaving the prophetic-reliability problem intact."},
{"id":"endowment-masonic-origins","category":"practice-temple","severity":"medium","verdict":"admitted","title":"The temple endowment: Masonic parallels, penalty oaths, and secrecy","claim":"Joseph Smith was initiated into Freemasonry in Nauvoo on March 15–16, 1842, rising to Master Mason in a single day, and introduced the temple endowment seven weeks later (May 4, 1842) — the first nine men to receive it were all Masons, facts the church's own history essay acknowledges. Documented shared elements included tokens (grips), signs, key words, ritual penalties miming throat-cutting and disembowelment, the five points of fellowship, and the compass-and-square symbols; the penalty oaths and five points were removed from the ceremony in April 1990. Critics contrast the ceremony's covenant of non-disclosure with Jesus's 'in secret have I said nothing' (John 18:20) and argue a restored 'ancient' ordinance should not track 18th-century Masonic ritual in datable detail.","bom":[],"bible":["John 18:20","Matthew 10:26-27","Ephesians 5:11-13"],"sources":[{"name":"Church History Topics — Masonry","type":"primary","url":"https://www.churchofjesuschrist.org/study/history/topics/masonry?lang=eng"},{"name":"MRM — Masonry and the Mormon Temple Endowment Ceremony","type":"apologetics","url":"https://mrm.org/masonry-and-the-mormon-temple-endowment-ceremony"},{"name":"CES Letter — Temples & Freemasonry","type":"apologetics","url":"https://read.cesletter.org/temples/"},{"name":"FAIR — The temple endowment and Freemasonry","type":"apologetics","url":"https://www.fairlatterdaysaints.org/answers/Relationship_between_the_temple_endowment_and_Freemasonry"}],"response":"The church and FAIR concede the parallels but distinguish form from substance: Masonry served as a 'catalyst for revelation,' a familiar ritual vocabulary Joseph adapted to teach genuinely revealed covenants — the endowment's content (creation, fall, redemption, covenants of consecration) has no Masonic counterpart, and unlike Masonry it was given to women and 'even the weakest of the Saints.' The ritual, FAIR argues, is the vehicle and not the endowment itself, so revising it (as in 1990 and 2019) is continuing revelation, not damage control; and the temple is 'sacred, not secret' — its teachings are published, only specific signs and tokens are covenantally withheld, akin to Jesus reserving some things from public teaching (Mark 4:34; John 16:12).","responseSource":{"name":"Church History Topics — Masonry","url":"https://www.churchofjesuschrist.org/study/history/topics/masonry?lang=eng"},"rationale":"The factual claim — Masonic initiation weeks before the endowment, borrowed ritual elements, later removal of the penalty oaths and five points — is documented and effectively conceded by the church's own essay; the 'catalyst' framing is a theological interpretation of those facts, not a rebuttal of them, and earlier ancient-origins apologetics (endowment as preserved Solomonic ritual) have been quietly abandoned."},
{"id":"heavenly-mother-doctrine","category":"doctrinal-conflict","severity":"medium","verdict":"unrefuted","title":"Heavenly Mother and spirit pre-existence vs. biblical silence","claim":"The church's 2015 essay 'Mother in Heaven' affirms as 'cherished and distinctive' doctrine that all human spirits are children of 'a Heavenly Father and a Heavenly Mother,' rooted in Joseph Smith's teaching of spirit pre-existence (Abraham 3:22–26; D&C 93:29) and popularized by Eliza R. Snow's hymn 'O My Father'; the essay concedes 'our present knowledge about a Mother in Heaven is limited' and that 'there is no record of a formal revelation to Joseph Smith on this doctrine,' and directs that members not pray to her. Critics note the Bible is wholly silent on a divine Mother — the only 'queen of heaven' it mentions is an idolatrous cult Jeremiah condemns (Jeremiah 7:18; 44:17–25) — and that a doctrine of divine parents procreating spirits sits uneasily with 'the LORD is one' (Deuteronomy 6:4) and 'beside me there is no God' (Isaiah 44:6–8).","bom":["Abraham 3:22-26","D&C 93:29","D&C 132:19-20"],"bible":["Deuteronomy 6:4","Isaiah 44:6-8","Jeremiah 7:18","Jeremiah 44:17-25","John 4:24"],"sources":[{"name":"Gospel Topics Essay — Mother in Heaven","type":"primary","url":"https://www.churchofjesuschrist.org/study/manual/gospel-topics-essays/mother-in-heaven?lang=eng"},{"name":"Paulsen & Pulido, 'A Mother There?' (BYU Studies 50:1)","type":"scholarly","url":"https://byustudies.byu.edu/article/a-mother-there-a-survey-of-historical-teachings-about-mother-in-heaven/"},{"name":"Pastor Unlikely — 41 Authentic Bible Verses to Contradict Mormonism","type":"apologetics","url":"https://pastorunlikely.com/41-authentic-bible-verses-to-contradict-mormonism/"}],"response":"The steelman: the essay and Paulsen–Pulido's survey of some 600 historical references present Heavenly Mother as a reasoned corollary of restored truths — if humans are literally God's spirit children made 'male and female' in the divine image (Genesis 1:26–27), eternal parenthood implies a Mother — and note that biblical silence is not denial, since Latter-day Saints do not hold the Bible to be doctrinally exhaustive. Worship and prayer remain directed solely to the Father in Christ's name, following Jesus's own pattern, so the doctrine is framed as honoring, not worshiping, a second divine being.","responseSource":{"name":"Gospel Topics Essay — Mother in Heaven","url":"https://www.churchofjesuschrist.org/study/manual/gospel-topics-essays/mother-in-heaven?lang=eng"},"rationale":"The core factual claim — an affirmed doctrine resting on no biblical text and, by the church's own admission, no recorded formal revelation — is conceded in the essay itself; the argument-from-corollary steelman is coherent within LDS premises but supplies no scriptural attestation, which is the point at issue."},
{"id":"jesus-firstborn-spirit-attained-godhood","category":"christology","severity":"high","verdict":"unrefuted","featured":true,"title":"Jesus as firstborn spirit child who attained godhood","claim":"Official LDS doctrine teaches that Jesus is the firstborn spirit child of Heavenly Father and heavenly parents — 'the firstborn of the spirit children of our Heavenly Father' (Gospel Principles ch. 2–3) — making him the literal elder brother of all humans, of the same species as us, who progressed to divinity in the premortal world (Talmage, Jesus the Christ: Christ 'attained the rank of Godhood' premortally). The Bible teaches Christ is the eternal, uncreated Creator: 'All things were made through him, and without him was not any thing made that was made' (John 1:3) — a scope that excludes Christ himself from the category of things that came to be; 'he is before all things' (Colossians 1:17); his 'goings forth are from of old, from everlasting' (Micah 5:2); he is 'the same yesterday, today, and forever' (Hebrews 13:8). A being begotten as one spirit child among billions who attains godhood is a different kind of being from one who eternally IS God.","bom":["D&C 93:21","Moses 1:33","Abraham 3:24"],"bible":["John 1:1-3","Colossians 1:16-17","Micah 5:2","Hebrews 13:8","John 8:58"],"sources":[{"name":"Gospel Principles, ch. 2 'Our Heavenly Family' (churchofjesuschrist.org)","type":"primary","url":"https://www.churchofjesuschrist.org/study/manual/gospel-principles/chapter-2-our-heavenly-family?lang=eng"},{"name":"Guide to the Scriptures: 'Firstborn'","type":"primary","url":"https://www.churchofjesuschrist.org/study/scriptures/gs/firstborn?lang=eng"},{"name":"The Living Christ: The Testimony of the Apostles (First Presidency/Twelve, 2000)","type":"primary","url":"https://www.churchofjesuschrist.org/study/scriptures/the-living-christ-the-testimony-of-the-apostles/the-living-christ-the-testimony-of-the-apostles?lang=eng"},{"name":"MRM: The Relationship Between Jesus and Lucifer in a Mormon Context","type":"apologetics","url":"https://mrm.org/lucifers-brother"}],"response":"LDS apologists reply that Jesus did not become divine late or from nothing meaningful: he is Jehovah, the God of the Old Testament ('He was the Great Jehovah of the Old Testament' — The Living Christ, 2000), fully divine before creation, and he created 'worlds without number' under the Father's direction (Moses 1:33; D&C 93:21 calls him 'the Firstborn' who was 'in the beginning with the Father'). On Colossians 1:15 they note Paul himself calls Christ 'the firstborn of every creature,' and FAIR argues the Greek in Colossians 1:16 connotes organizing existing material, not creation from nothing, so 'all things were made through him' need not include eternally existing spirit-matter or Christ's own spirit. Firstborn status, they argue, denotes preeminence and heirship (Psalm 89:27), which LDS theology affirms maximally.","responseSource":{"name":"FAIR: Does Colossians 1:16 teach that Jesus created all things out of nothing?","url":"https://www.fairlatterdaysaints.org/answers/Creation_in_Colossians_1:16"},"rationale":"The doctrine is accurately documented from current official sources, and the conflict is structural, not a proof-text quibble. Even granting that Christ-as-Jehovah was divine 'before the world was,' LDS theology still makes him a begotten spirit sibling of humanity whose divinity was attained — ontologically one of us who rose, rather than the eternal Creator who condescended. John 1:3's exhaustive scope ('without him was not any thing made that was made') and Colossians 1:17 ('he is before ALL things') leave no category of self-existent spirit-stuff or sibling spirits that Christ did not create; the LDS reading must carve out exactly the exceptions the text forecloses. The 'firstborn of every creature' steelman fails against verse 16's own explanatory 'for by him were all things created' — the firstborn is preeminent OVER creation because he made it."},
{"id":"jesus-lucifer-spirit-brothers","category":"christology","severity":"high","verdict":"unrefuted","title":"Jesus and Lucifer as spirit brothers","claim":"LDS scripture and manuals teach that Lucifer was 'a spirit son of God' who in the premortal council offered a rival redemption plan — 'Behold, here am I, send me, I will be thy son… wherefore give me thine honor' (Moses 4:1–4) — competing with the premortal Jesus before the world was made (Abraham 3:27–28; Gospel Principles ch. 3). Since all beings are spirit children of the same Heavenly Father, Jesus and Lucifer are, in LDS taxonomy, elder and younger spirit brothers. The church's own December 2007 Newsroom statement, responding to Mike Huckabee's question, acknowledged the underlying doctrine while rejecting the framing: 'all beings were created by God and are his spirit children,' while 'Satan… is a fallen angel.' Biblically, Christ is the Creator of ALL spiritual beings — 'by him were all things created… whether they be thrones, or dominions, or principalities, or powers' (Colossians 1:16) — so Satan is a creature Christ made, of a categorically different order from his Maker (Ezekiel 28:15 'thou wast created').","bom":["Moses 4:1-4","Abraham 3:27-28","D&C 76:25-27"],"bible":["Colossians 1:16","Ezekiel 28:13-15","John 1:3","Hebrews 1:4-6","Nehemiah 9:6"],"sources":[{"name":"Gospel Principles, ch. 3 'Jesus Christ, Our Chosen Leader and Savior'","type":"primary","url":"https://www.churchofjesuschrist.org/study/manual/gospel-principles/chapter-3-jesus-christ-our-chosen-leader-and-savior?lang=eng"},{"name":"Church Newsroom: Answering Media Questions About Jesus and Satan (Dec 12, 2007)","type":"primary","url":"https://newsroom.churchofjesuschrist.org/article/answering-media-questions-about-jesus-and-satan"},{"name":"Deseret News: Huckabee asks if Mormons believe Jesus, Satan are brothers (Dec 11, 2007)","type":"journalism","url":"https://www.deseret.com/2007/12/11/20058688/huckabee-asks-if-mormons-believe-jesus-satan-are-brothers/"},{"name":"IRR: On Mike Huckabee's Question","type":"apologetics","url":"https://mit.irr.org/on-mike-huckabees-question-mormon-jesus-brother-of-satan"}],"response":"FAIR concedes the taxonomy is 'technically accurate' but calls the framing misleading without context: shared spirit-parentage implies no parity, any more than Cain and Abel's brotherhood makes them 'spiritual equals or equally admirable.' They note the Bible itself calls Satan one of the 'sons of God' (Job 1:6; 2:1), that Jesus is uniquely 'the first and greatest Son,' the Creator of this world, and the Only Begotten in the flesh, while Satan 'squandered' his potential and became the eternal enemy of God. The 2007 Newsroom statement takes the same line: Christ and Satan are 'diametrically opposite' in every attribute.","responseSource":{"name":"FAIR: Jesus Christ/Brother of Satan","url":"https://www.fairlatterdaysaints.org/answers/Jesus_Christ/Brother_of_Satan"},"rationale":"The doctrine is documented from LDS canon (Moses 4; Abraham 3), the current manual, and the church's own 2007 statement, which confirms rather than denies the shared spirit-parentage. The steelman successfully rebuts the crude version ('Mormons think Jesus and the devil are alike') but does not touch the actual conflict, which is ontological, not moral: in biblical Christology Satan belongs to the class of created 'principalities and powers' that Christ himself made (Colossians 1:16), so Creator and fallen creature can no more be brothers of one species than a potter and his pot. Job 1:6's 'sons of God' designates angelic creatures in Yahweh's court, not begotten siblings of Yahweh. The moral-asymmetry defense answers a charge nobody serious is making while leaving the category collapse fully intact."},
{"id":"god-exalted-man-flesh-and-bone","category":"nature-of-god","severity":"high","verdict":"unrefuted","featured":true,"title":"God the Father: an exalted man with a body of flesh and bone","claim":"Joseph Smith taught canonically that 'The Father has a body of flesh and bones as tangible as man's' (D&C 130:22) and preached in the King Follett discourse (1844) that 'God himself was once as we are now, and is an exalted man' — a teaching the church's current essay 'Becoming Like God' still quotes approvingly, alongside Lorenzo Snow's couplet. The essay also affirms Smith's rejection of creation from nothing: God 'organized the universe out of existing elements.' The trajectory reached its extreme in Brigham Young's Adam-God doctrine — 'Adam is our father and our God, and the only God with whom we have to do' (Journal of Discourses 1:50–51, 1852; incorporated into the 1877 temple lecture at the veil) — which President Spencer W. Kimball officially repudiated in October 1976 General Conference: 'We denounce that theory… false doctrine.' The Bible teaches the opposite at every point: 'God is spirit' (John 4:24); 'God is not a man' (Numbers 23:19); 'from everlasting to everlasting, thou art God' (Psalm 90:2); 'before me there was no God formed' (Isaiah 43:10); and creation from nothing (Hebrews 11:3).","bom":["D&C 130:22","D&C 131:7-8","Abraham 3:22-24","Abraham 4:1"],"bible":["John 4:24","Numbers 23:19","Hosea 11:9","Psalm 90:2","Isaiah 43:10","Isaiah 45:5","Malachi 3:6","Hebrews 11:3"],"sources":[{"name":"Doctrine and Covenants 130:22","type":"primary","url":"https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/130?lang=eng"},{"name":"Gospel Topics Essay: Becoming Like God","type":"primary","url":"https://www.churchofjesuschrist.org/study/manual/gospel-topics-essays/becoming-like-god?lang=eng"},{"name":"Spencer W. Kimball, 'Our Own Liahona,' Oct 1976 General Conference (Adam-God repudiation)","type":"primary","url":"https://www.churchofjesuschrist.org/study/general-conference/1976/10/our-own-liahona?lang=eng"},{"name":"Dialogue: 'The Adam-God Doctrine' (David John Buerger)","type":"scholarly","url":"https://www.dialoguejournal.com/articles/the-adam-god-doctrine/"},{"name":"MRM: 'Adam-God' — Brigham Young's Theory or Divine Doctrine?","type":"apologetics","url":"https://mrm.org/adam-god"}],"response":"FAIR argues John 4:24 ('God is spirit') is a statement of mode and character, not anatomy — parallel to 'God is light' (1 John 1:5) and 'God is a consuming fire' (Deuteronomy 4:24), which no one takes as exhaustive ontology — and that spirit and embodiment are compatible since resurrected beings have bodies of flesh and bone (Luke 24:39). They marshal biblical theophanies (Exodus 33:11,23) and note BYU's David Paulsen arguing the earliest Christians held anthropomorphic views of God later displaced by Greek philosophical categories. On Adam-God, FAIR holds that Young's remarks were poorly recorded, speculative, or misunderstood, that they were never canonized, and that the church's rejection of the theory shows the self-correcting authority of living prophets rather than prophetic failure.","responseSource":{"name":"FAIR: Mormonism and the nature of God/God is a Spirit","url":"https://www.fairlatterdaysaints.org/answers/Mormonism_and_the_nature_of_God/God_is_a_Spirit"},"rationale":"Every element is documented from canonized or currently published LDS sources — D&C 130:22 is canon, and the 'Becoming Like God' essay confirms the church still teaches the exalted-man doctrine. The FAIR reading of John 4:24 has some force in isolation, but the conflict rests on the convergence of texts: a God who 'was once as we are now' cannot be 'from everlasting to everlasting' God (Psalm 90:2) or unchanging (Malachi 3:6), and a God who progressed within an eternal framework of matter and law is not the Bible's absolute Creator of all that exists (Isaiah 44:24; Hebrews 11:3). The Adam-God episode is independently devastating to the 'living prophets self-correct' frame: Young taught it explicitly, repeatedly, over 25 years, including in the temple, and Kimball's 1976 denunciation means one LDS prophet formally branded another LDS prophet's pulpit teaching about the identity of God 'false doctrine.'"},
{"id":"different-jesus-hinckley-1998","category":"christology","severity":"high","verdict":"contested","title":"The 'different Jesus' question: Hinckley's 1998 statement","claim":"Asked whether Latter-day Saints believe in 'the traditional Christ,' church president Gordon B. Hinckley said in 1998: 'No, I don't. The traditional Christ of whom they speak is not the Christ of whom I speak. For the Christ of whom I speak has been revealed in this the Dispensation of the Fulness of Times' (Church News, June 20, 1998). This is the sitting prophet conceding, in his own words, the substance of the evangelical claim: the LDS Christ — firstborn spirit child, elder brother of Lucifer and humanity, one of three separate Gods — differs from the Christ of historic Christianity. Paul warns against those who preach 'another Jesus, whom we have not preached' with 'another gospel' (2 Corinthians 11:4; Galatians 1:8). The church's essay 'Are Mormons Christian?' responds not by claiming doctrinal agreement but by contesting the definition of 'Christian.'","bom":[],"bible":["2 Corinthians 11:3-4","Galatians 1:6-9","Matthew 24:23-24","1 John 4:1-3"],"sources":[{"name":"Church News: 'Crown of gospel is upon our heads' (June 20, 1998)","type":"primary","url":"https://www.thechurchnews.com/1998/6/20/23250528/crown-of-gospel-is-upon-our-heads/"},{"name":"Gospel Topics Essay: Are 'Mormons' Christian?","type":"primary","url":"https://www.churchofjesuschrist.org/study/manual/gospel-topics-essays/christians?lang=eng"},{"name":"MRM: Quotes That Didn't Make the Cut — Hinckley","type":"apologetics","url":"https://mrm.org/hinckley-quotes"}],"response":"FAIR argues the quote is authentic but misused: in context Hinckley was distinguishing the LDS Christ from the 'traditional' CREEDAL Christ — the immaterial, incomprehensible being of Nicaea and Chalcedon — not from the Jesus of the New Testament, whom Latter-day Saints insist they worship as divine Son of God, Savior, and Redeemer ('The Living Christ,' 2000). The 'Are Mormons Christian?' essay adds that the earliest Christians' view of God 'changed dramatically over the course of centuries' under Greek philosophy, so fidelity to fourth-century creeds cannot be the test of who follows Jesus; Latter-day Saints claim restored, not reformed, Christianity. On 2 Corinthians 11:4, they note Paul's target was a different gospel MESSAGE, not a doctrinal exam on metaphysics.","responseSource":{"name":"FAIR: Jesus Christ/Biblical","url":"https://www.fairlatterdaysaints.org/answers/Jesus_Christ/Biblical"},"rationale":"The quotation is authentic, verified in the church's own Church News, and Hinckley plainly affirms a real difference — that much is unrefuted, and the difference itself is substantiated independently by the christology entries. But the specific inference this entry tests — that Hinckley's statement is an admission of 'another Jesus' in Paul's sense — is genuinely contested. FAIR's contextual point has real merit: 'traditional Christ' most naturally refers to the creedal formulation, and LDS materials consistently identify their Christ with the New Testament Jesus (same person, different metaphysics). Whether a different metaphysic of the same claimed historical person constitutes 'another Jesus' should be argued from the doctrinal entries, not settled by this quote alone."},
{"id":"premortal-spirit-children","category":"nature-of-god","severity":"medium","verdict":"unrefuted","title":"Premortal existence: all humans as literal spirit children of Heavenly Parents","claim":"LDS doctrine teaches that every human lived before birth as a literal spirit child begotten by Heavenly Parents: 'all human beings, male and female, are beloved spirit children of heavenly parents' (Gospel Topics essay 'Mother in Heaven'); 'Man, as a spirit, was begotten and born of heavenly parents, and reared to maturity in the eternal mansions of the Father' (First Presidency 1909, quoted in Gospel Principles ch. 2); Abraham 3:22–23 describes premortal 'intelligences that were organized before the world was.' The Bible teaches the reverse order and origin: 'that was not first which is spiritual, but that which is natural; and afterward that which is spiritual' (1 Corinthians 15:46); the LORD 'formeth the spirit of man within him' (Zechariah 12:1); man became a living soul when God breathed into formed dust (Genesis 2:7).","bom":["Abraham 3:22-23","D&C 93:29","Moses 3:5"],"bible":["1 Corinthians 15:46-47","Zechariah 12:1","Genesis 2:7","Isaiah 44:24"],"sources":[{"name":"Gospel Principles, ch. 2 'Our Heavenly Family'","type":"primary","url":"https://www.churchofjesuschrist.org/study/manual/gospel-principles/chapter-2-our-heavenly-family?lang=eng"},{"name":"Gospel Topics Essay: Mother in Heaven","type":"primary","url":"https://www.churchofjesuschrist.org/study/manual/gospel-topics-essays/mother-in-heaven?lang=eng"},{"name":"MRM: Jeremiah 1:5 — Does This Verse Speak About Preexistence?","type":"apologetics","url":"https://mrm.org/jeremiah-1-5"}],"response":"FAIR assembles a biblical case for premortality: God knew Jeremiah 'before I formed thee in the belly' (Jeremiah 1:5); the 'sons of God shouted for joy' at earth's founding (Job 38:4–7); at death 'the spirit shall return unto God who gave it' (Ecclesiastes 12:7) — 'return' implying prior residence; God is 'the Father of spirits' (Hebrews 12:9); and the disciples' question about the man born blind (John 9:2) presupposes possible premortal agency. They add that preexistence of souls was a live view in early Christianity (Origen) before being condemned in the sixth century. On 1 Corinthians 15:46, they respond that Paul's subject is resurrection bodies, not the origin of spirits.","responseSource":{"name":"FAIR: Biblical support for a pre-mortal existence","url":"https://www.fairlatterdaysaints.org/answers/Plan_of_salvation/Biblical_support_for_a_pre-mortal_existence"},"rationale":"The doctrine is precisely documented from current official sources, and the core conflict stands: no biblical text teaches that human spirits were begotten by Heavenly Parents before the world, and Zechariah 12:1 locates the forming of man's spirit 'within him.' The LDS proof-texts dissolve on context — Jeremiah 1:5 is election/foreknowledge language (cf. Romans 8:29); Job 38:7's 'sons of God' are angels, and God's point to Job is that Job was NOT there; Ecclesiastes 12:7's 'return' parallels dust returning to earth. FAIR is right that 1 Corinthians 15:46 concerns resurrection-body order, so that counter-text is weaker; and Origen shows soul-preexistence was thinkable early, though his version (no Heavenly Mother, no spirit birth) is not the LDS doctrine. The distinctive claim — literal celestial procreation of human spirits — remains without any biblical support."},
{"id":"trinity-vs-godhead","category":"nature-of-god","severity":"high","verdict":"contested","title":"The Trinity vs. the LDS Godhead: three Gods united in purpose","claim":"Official LDS doctrine holds the Father, Son, and Holy Ghost are 'three separate beings' — the Father and Son with tangible bodies — who are 'one in purpose' but not one Being (Gospel Topics: 'Godhead'; D&C 130:22). Joseph Smith's First Vision account has God declaring all existing creeds 'an abomination in his sight' (Joseph Smith—History 1:19), and the Book of Abraham narrates creation by 'the Gods' (Abraham 4:1). Smith preached plurality of gods explicitly in the June 1844 Sermon in the Grove. The Bible's monotheism is exclusive and ontological, not merely purposive: 'The LORD our God is one LORD' (Deuteronomy 6:4); 'I am the LORD that maketh all things; that stretcheth forth the heavens ALONE; that spreadeth abroad the earth BY MYSELF' (Isaiah 44:24 — no council of gods at creation); 'there is none other God but one' (1 Corinthians 8:4). Notably, the Book of Mormon itself reads monotheistically (Alma 11:28–29: 'Is there more than one God?… No').","bom":["D&C 130:22","Abraham 4:1","Alma 11:28-29","2 Nephi 31:21"],"bible":["Deuteronomy 6:4","Isaiah 44:24","Isaiah 43:10","Isaiah 45:5-6","1 Corinthians 8:4-6","John 17:20-23","John 10:30"],"sources":[{"name":"Gospel Topics: Godhead (churchofjesuschrist.org)","type":"primary","url":"https://www.churchofjesuschrist.org/study/manual/gospel-topics/godhead?lang=eng"},{"name":"Church Newsroom: Godhead","type":"primary","url":"https://newsroom.churchofjesuschrist.org/article/godhead"},{"name":"BYU Religious Studies Center: 'God' (Latter-day Saint Essentials)","type":"scholarly","url":"https://rsc.byu.edu/latter-day-saint-essentials/god"},{"name":"MRM: Godhead (Defined)","type":"apologetics","url":"https://mrm.org/godhead"}],"response":"The strongest LDS case: (1) Jesus prays that believers 'may be one, even as we are one' (John 17:22) — since believers cannot merge into one substance, the oneness of Father and Son in the same sentence is most naturally relational, exactly the LDS 'one in purpose' reading. (2) Jesus is visibly distinct from the Father throughout the NT (baptism, Gethsemane, Stephen's vision in Acts 7:55–56), and 1 Corinthians 8:6 distinguishes 'one God, the Father' from 'one Lord, Jesus Christ.' (3) Some respected Christian philosophers (social trinitarians — Plantinga, Swinburne, Craig) model the Trinity as three centers of consciousness united in essence and will, which BYU scholars argue lands close to Joseph Smith's Godhead; the disagreement, they say, is with post-biblical Greek metaphysics, not with the Bible. (4) Hebrew scholarship on the divine council (Psalm 82) shows plural elohim language native to the OT.","responseSource":{"name":"FAIR: Mormonism and the nature of God/Nicene creed","url":"https://www.fairlatterdaysaints.org/answers/Mormonism_and_the_nature_of_God/Nicene_creed"},"rationale":"The LDS doctrine is accurately documented, and a real conflict exists — but the steelman has genuine merit at exactly the point this entry tests. The relational reading of John 17 is exegetically defensible, and social trinitarianism is a live position within Christian philosophy. The conflict becomes sharp only where LDS doctrine exceeds it: social trinitarians still affirm one necessarily existent, uncreated divine essence, while LDS theology has three ontologically independent beings, two embodied, at least one of whom attained divinity, with exaltation extending godhood to others — a plurality Isaiah 44:24 ('alone… by myself') and Isaiah 43:10 exclude. Note the internal tension: the Book of Mormon itself reads monotheistically (Alma 11) against Smith's later Nauvoo theology. Graded contested because the John 17 argument succeeds on its own ground; the decisive conflict lives in Isaiah and the christology entries."},
{"id":"blood-atonement","category":"christology","severity":"medium","verdict":"unrefuted","title":"Blood atonement: sins beyond the reach of Christ's blood","claim":"Brigham Young taught from the Tabernacle pulpit that some sins exceed the atoning power of Christ's blood and require the sinner's own: 'There are sins that men commit for which they cannot receive forgiveness in this world, or in that which is to come, and if they had their eyes open to see their true condition, they would be perfectly willing to have their blood spilt upon the ground, that the smoke thereof might ascend to heaven as an offering for their sins' (Journal of Discourses 4:53–54, 1856; cf. 4:219–220, 1857). In June 2010 the church formally stated that 'so-called blood atonement… is not a doctrine of The Church of Jesus Christ of Latter-day Saints.' Scripture teaches the total sufficiency of Christ's one sacrifice: 'by one offering he hath perfected for ever them that are sanctified' (Hebrews 10:14); 'the blood of Jesus Christ his Son cleanseth us from ALL sin' (1 John 1:7); 'It is finished' (John 19:30).","bom":["D&C 42:18,79","Mosiah 3:11"],"bible":["Hebrews 10:12-14","1 John 1:7","John 19:30","Hebrews 9:26","Isaiah 53:5-6","1 Timothy 2:5-6"],"sources":[{"name":"Brigham Young sermon, JD 4:215–221 (full text, Utah Lighthouse Ministry scan)","type":"primary","url":"https://www.utlm.org/onlineresources/sermons_talks_interviews/jofdvol4p215_221brighambloodatonement.htm"},{"name":"Deseret News: Mormon church statement on blood atonement (June 18, 2010)","type":"journalism","url":"https://www.deseret.com/2010/6/18/20122138/mormon-church-statement-on-blood-atonement/"},{"name":"Mormonr: Blood Atonement and Capital Punishment (documents both sermons and disavowals)","type":"apologetics","url":"https://mormonr.org/qnas/0vsOHr/blood_atonement_and_capital_punishment"}],"response":"FAIR and Mormonr respond that: (1) blood-atonement rhetoric belongs to the overheated 'Mormon Reformation' preaching of 1856–57 and was hyperbole aimed at provoking repentance; (2) it was framed as voluntary and tied to a theory of capital punishment for capital crimes (echoing Genesis 9:6), not as vigilante practice, and there is no evidence the church institutionalized killing sinners to save them; (3) it was never canonized — D&C 42 prescribes excommunication and civil justice, not ritual death; and (4) the church has repeatedly and officially repudiated it (McConkie's 1978 letter; the 2010 statement), so it stands today as an abandoned 19th-century speculation, not LDS doctrine.","responseSource":{"name":"FAIR: Repudiated concepts/Blood atonement","url":"https://www.fairlatterdaysaints.org/answers/Mormonism_and_doctrine/Repudiated_concepts/Blood_atonement"},"rationale":"Both the teaching and its disavowal are documented beyond dispute — the sermons are verbatim in the Journal of Discourses, and the 2010 statement confirms the church understands what was taught well enough to disavow it by name. What Young preached — that certain sins lie beyond the reach of Christ's blood — is a direct verbal contradiction of Hebrews 10:14 and 1 John 1:7; the 'hyperbole' steelman strains against Young's own words, which present it as sober counsel across multiple sermons and years. Graded medium severity because the doctrine is genuinely repudiated and carries no current soteriological weight; its enduring force is as a second clear case (with Adam-God) of a prophet teaching over the pulpit what the church now calls false doctrine — which bears on the reliability of the prophetic office."},
{"id":"js-polygamy-wives-count-ages","category":"polygamy-history","severity":"high","verdict":"admitted","title":"Joseph Smith's ~30–40 wives, including teenagers","claim":"Joseph Smith was sealed to approximately 30–40 women — a figure the church's own Gospel Topics essay accepts ('careful estimates put the number between 30 and 40') — including Helen Mar Kimball, sealed 'several months before her 15th birthday' (age 14), and Fanny Alger (~16), a servant in the Smith home whose relationship Oliver Cowdery called 'a dirty, nasty, filthy scrape [affair]' in a January 21, 1838 letter; Cowdery was excommunicated shortly after, charged with 'falsely insinuating' Smith was guilty of adultery. Most sealings were concealed from Emma Smith and from the church at large.","bom":["Jacob 2:24","Jacob 2:27-28","Jacob 2:30"],"bible":["1 Timothy 3:2","Matthew 19:4-6","Genesis 2:24"],"sources":[{"name":"Gospel Topics Essay: Plural Marriage in Kirtland and Nauvoo","type":"institutional","url":"https://www.churchofjesuschrist.org/study/manual/gospel-topics-essays/plural-marriage-in-kirtland-and-nauvoo?lang=eng"},{"name":"Todd Compton, In Sacred Loneliness: The Plural Wives of Joseph Smith (Dialogue review)","type":"scholarly","url":"https://www.dialoguejournal.com/articles/plural-marriage-singular-lives-in-sacred-loneliness-the-plural-wives-of-joseph-smith-by-todd-compton/"},{"name":"Oliver Cowdery letter to Warren A. Cowdery, Jan 21, 1838 (transcript)","type":"primary","url":"https://josephsmithspolygamy.org/oliver-cowdery-letter-to-warren-a-cowdery-olivers-brother-january-21-1838/"},{"name":"LDS Discussions: Polygamy and Polyandry in Kirtland and Nauvoo","type":"journalism","url":"https://www.ldsdiscussions.com/polygamy-nauvoo"}],"response":"The church acknowledges the marriages but frames them as a commanded restoration of Old Testament plural marriage that Smith resisted (the angel-with-drawn-sword accounts). Apologists (Brian Hales) argue Helen Mar Kimball's sealing was likely 'eternity only' and dynastic — linking the Kimball and Smith families — with no evidence of conjugality; Helen continued living with her parents. Marriage ages of 14–16, while young, were legal and not unheard of on the 1840s frontier. Fanny Alger, per late reminiscences, was a marriage with parental consent, not an affair — Cowdery's characterization is that of an estranged critic.","responseSource":{"name":"Gospel Topics essay; Brian Hales, josephsmithspolygamy.org"},"rationale":"The core facts (30–40 wives, a 14-year-old bride, secrecy from Emma and the church) are conceded in the church's own essay. Apologetic arguments go to interpretation (eternity-only, dynastic purpose), not to the facts; the 'eternity-only' reading of the Kimball sealing is possible but unprovable, and 1840s norms do not explain concealment. The claim as stated is documented by the institution itself."},
{"id":"js-polyandry","category":"polygamy-history","severity":"high","verdict":"admitted","title":"Polyandry: sealings to women with living husbands","claim":"Joseph Smith was sealed to roughly 11 women who were civilly married to living husbands at the time — about one-third of his plural wives (Compton). Zina Diantha Huntington was sealed to Smith in October 1841 about seven months after marrying Henry Jacobs, after Smith relayed that an angel with a drawn sword threatened his position and life if plural marriage was not established; she continued living with Jacobs. The church's own Gospel Topics essay concedes Smith was sealed to 'a number of women who were already married.'","bom":["Jacob 2:27"],"bible":["Romans 7:2-3","Mark 10:11-12","Exodus 20:14"],"sources":[{"name":"Gospel Topics Essay: Plural Marriage in Kirtland and Nauvoo","type":"institutional","url":"https://www.churchofjesuschrist.org/study/manual/gospel-topics-essays/plural-marriage-in-kirtland-and-nauvoo?lang=eng"},{"name":"Todd Compton, In Sacred Loneliness (IRR summary)","type":"scholarly","url":"https://mit.irr.org/in-sacred-loneliness-plural-wives-of-joseph-smith"},{"name":"FAIR: Polyandry and Joseph Smith","type":"apologetics","url":"https://www.fairlatterdaysaints.org/answers/Polyandry_and_Joseph_Smith:_sealings_to_women_with_living_husbands"}],"response":"Hales argues most polyandrous sealings were 'eternity only' — a linkage for the next life that did not disturb the earthly marriage, which is why husbands like Henry Jacobs remained in the home and some stayed faithful members. Supporting evidence: 2016 DNA testing (Ugo Perego) excluded Smith as father of Josephine Lyon, whose mother was the polyandrous wife with the strongest documentary claim of conjugality, and no verified child of Smith by any plural wife has been identified. The essay itself states these sealings may have been about eternal linkage rather than earthly marital relations.","responseSource":{"name":"Brian Hales, josephsmithspolygamy.org; FAIR polyandry article"},"rationale":"The fact of sealings to married women is conceded by the church. Whether these included sexual relations is genuinely contested — the DNA evidence is a real apologetic win — but the claim as stated (sealings to other men's wives, under angelic threat, concealed from the community) stands on primary sources. Critics who assert proven sexual polyandry overreach; the sealings themselves do not."},
{"id":"dc132-emma-destroyed","category":"polygamy-history","severity":"high","verdict":"admitted","title":"D&C 132:54 — Emma threatened with destruction","claim":"Doctrine & Covenants 132 — dictated July 12, 1843 and still canonized LDS scripture today — directly addresses Emma Smith by name, commanding her to 'receive all those that have been given unto my servant Joseph' (v. 52) and warning 'if she will not abide this commandment she shall be destroyed, saith the Lord' (v. 54). Verse 64 generalizes the threat to any first wife who refuses consent. The revelation was dictated after Smith had already married most of his plural wives without Emma's knowledge or consent.","bom":["D&C 132:52-54","D&C 132:64"],"bible":["Ephesians 5:25","1 Peter 3:7","Colossians 3:19"],"sources":[{"name":"Doctrine and Covenants 132 (current LDS canon)","type":"primary","url":"https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/132?lang=eng"},{"name":"From the Desk: D&C 132 — What Is the Plural Marriage Revelation?","type":"scholarly","url":"https://fromthedesk.org/doctrine-and-covenants-132-plural-marriage-revelation/"},{"name":"CES Letter: Polygamy section","type":"journalism","url":"https://read.cesletter.org/polygamy/"}],"response":"Apologists read 'destroyed' not as physical death but as forfeiture of covenant blessings — covenant language paralleling verse 26 — and note no harm ever came to Emma, who refused, burned the revelation copy, and remained Smith's wife. The revelation is framed as an Abrahamic test; sections addressing Emma also promise blessings for obedience. Bushman notes the revelation was committed to writing at Hyrum's request specifically to persuade Emma, reflecting a domestic crisis, not a death threat.","responseSource":{"name":"FAIR commentary on D&C 132; Richard Bushman, Rough Stone Rolling"},"rationale":"The text and its canonical status are undisputed — anyone can read it in the current Doctrine and Covenants. The softened reading of 'destroyed' is a plausible gloss but does not change that canonized scripture conditions a named woman's fate on accepting her husband's additional wives. The factual claim is fully documented."},
{"id":"js-polygamy-denials","category":"polygamy-history","severity":"high","verdict":"admitted","featured":true,"title":"Smith's public denials while secretly married to 30+","claim":"On May 26, 1844 — a month before his death, when he had been sealed to over 30 women — Joseph Smith preached publicly: 'What a thing it is for a man to be accused of committing adultery, and having seven wives, when I can only find one' (History of the Church 6:411). This capped years of institutional denials: the 1835 Article on Marriage (in the D&C until 1876) declared one man/one wife, and church organs repeatedly denied 'spiritual wifery' throughout the Nauvoo period while the practice spread secretly among the leadership.","bom":[],"bible":["John 8:44","Ephesians 4:25","Proverbs 12:22","Colossians 3:9"],"sources":[{"name":"Joseph Smith Statements Denying Polygamy (compilation with primary citations)","type":"primary","url":"https://mit.irr.org/joseph-smith-statements-denying-polygamy"},{"name":"Mormon Polygamy Documents: Twenty-Three Polygamy 'Denials' chart","type":"primary","url":"https://mormonpolygamydocuments.org/chart-twenty-three-polygamy-denials/"},{"name":"FAIR: Joseph Smith hid polygamy from the general Church membership","type":"apologetics","url":"https://www.fairlatterdaysaints.org/answers/Joseph_Smith_hid_polygamy_from_the_general_Church_membership"},{"name":"wasmormon.org: Joseph Smith's Polygamy Denials","type":"testimony","url":"https://wasmormon.org/joseph-smiths-polygamy-denials-carefully-worded-lies-loopholes-and-lasting-damage/"}],"response":"FAIR argues the denials were 'carefully worded': Smith denied adultery and John C. Bennett's freelance 'spiritual wifery,' not divinely sanctioned celestial marriage; he had only one legal wife, so 'I can only find one' was technically true. Disclosure would have brought mob violence and prosecution (as the Expositor episode proved), so concealment protected the community — analogous, apologists argue, to Abraham's misdirection about Sarah. The church's essay acknowledges the secrecy and that participants found it agonizing.","responseSource":{"name":"FAIR, 'Joseph Smith hid polygamy from the general Church membership'"},"rationale":"The denials and the concurrent marriages are both documented beyond dispute; the apologetic defense concedes the deception and argues justification. 'Technically worded' statements made with intent to create a false impression are still deception by any ordinary or biblical standard of truth-telling, which is the claim being graded."},
{"id":"eternal-polygamy-today","category":"modern-policy","severity":"medium","verdict":"admitted","title":"Eternal polygamy in current LDS practice","claim":"Serial eternal polygamy is current practice: a widowed man may be sealed to an additional wife while remaining sealed to his deceased wife — church presidents Russell M. Nelson (sealed to Wendy Watson in 2006 after Dantzel's death) and Dallin H. Oaks (sealed to Kristen McMain in 2000 after June's death) are each sealed to two women for eternity. A living woman cannot be sealed to a second man without cancelling the first sealing. D&C 132 has never been de-canonized. Carol Lynn Pearson's research documents the resulting grief among believing LDS women who expect to be shared in eternity.","bom":["D&C 132:61-63"],"bible":["Matthew 22:30","1 Timothy 3:2"],"sources":[{"name":"Dallin H. Oaks, 'Trust in the Lord,' Oct 2019 General Conference","type":"institutional","url":"https://www.churchofjesuschrist.org/study/general-conference/2019/10/17oaks?lang=eng"},{"name":"Carol Lynn Pearson, The Ghost of Eternal Polygamy (2016)","type":"scholarly","url":"https://www.goodreads.com/author_blog_posts/25985102-confronting-the-abusive-lds-doctrine-of-eternal-polygamy?tab=book"},{"name":"wasmormon.org: Oaks, Polygamy, and the Promise of Mormon Heaven","type":"testimony","url":"https://wasmormon.org/trust-us-we-dont-know-dallin-h-oaks-polygamy-and-the-promise-of-mormon-heaven/"}],"response":"Oaks addressed this directly in October 2019 General Conference: the church makes no doctrinal claim about family configuration in the next life; 'trust in the Lord' — sealing complexities will be resolved by a loving God, and no one will receive an eternal arrangement they do not want. Since 1998, deceased women may be sealed by proxy to all men they married in life, with the assumption the woman will choose; the living-woman restriction is administrative, not a statement of eternal inequality. The church has not practiced plural marriage since 1904 and excommunicates those who do.","responseSource":{"name":"Dallin H. Oaks, 'Trust in the Lord' (Oct 2019 General Conference)","url":"https://www.churchofjesuschrist.org/study/general-conference/2019/10/17oaks?lang=eng"},"rationale":"The sealing asymmetry, the leaders' own second sealings, and D&C 132's canonical status are all matters of public record and current Handbook policy. The apologetic response is a candid 'we don't know,' which mitigates pastoral weight but refutes nothing; the asymmetry between men's and living women's sealings remains in force."},
