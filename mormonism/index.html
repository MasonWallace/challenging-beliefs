{"id":"prop-8-campaign","title":"Proposition 8: church-directed political mobilization for a state ballot measure","category":"modern-policy","claim":"In 2008 the First Presidency had a letter read from every California pulpit (June 29) urging members to 'do all you can' — 'your means and time' — to pass Proposition 8, which stripped same-sex marriage from California law. Ward and stake structures were converted into a precinct operation: assigned donation targets, phone banks, door-to-door canvassing coordinated with the Protect Marriage coalition the church joined at Catholic Archbishop Niederauer's invitation. Members contributed an estimated $20 million — roughly half the Yes campaign's funds — while Latter-day Saints were about 2% of Californians. The church itself reported in-kind contributions and was later fined by the California Fair Political Practices Commission for late-reported non-monetary contributions. This followed the same playbook used in Hawaii (1998) and California's Prop 22 (2000). The church's canonized position: 'We do not believe it just to mingle religious influence with civil government' (D&C 134:9). For evangelism, the point is institutional: a church claiming political neutrality directed member resources into civil law, then reversed course culturally within a decade (supporting the 2022 Respect for Marriage Act).","bom":["D&C 134:9"],"bible":["Matthew 22:21","John 18:36"],"sources":[{"name":"Church Newsroom: Same-Sex Marriage and Proposition 8","type":"institutional","url":"https://newsroom.churchofjesuschrist.org/article/same-sex-marriage-and-proposition-8"},{"name":"Thomas Jefferson School of Law: An Overview of LDS Involvement in Prop 8","type":"scholarly","url":"https://www.tjsl.edu/news-and-events/the-divine-institution-of-marriage-an-overview-of-lds-involvement-in-prop-8/"},{"name":"George Washington Law Review: Proposition 8 and the Mormon Church — A Case Study in Donor Disclosure","type":"scholarly","url":"https://www.gwlr.org/wp-content/uploads/2015/09/Youn.pdf"},{"name":"Religion Dispatches: When Mormons Mobilize","type":"journalism","url":"https://religiondispatches.org/2010/02/02/when-mormons-mobilize-anti-gay-marriage-prop-8-effort-outed"},{"name":"FAIR: Mormonism and politics — California Proposition 8","type":"apologetics","url":"https://www.fairlatterdaysaints.org/answers/Mormonism_and_politics/California_Proposition_8"}],"response":"The church's Newsroom and FAIR respond that churches have always had the right — and a duty — to speak on moral questions, and marriage is a moral question, not partisan politics; the church endorsed no candidate or party. It joined a broad interfaith coalition (Catholics, evangelicals, Orthodox Jews, Muslims) rather than acting alone; direct institutional spending was a small, disclosed in-kind amount; members donated freely as private citizens; and D&C 134 also affirms that governments should protect the free exercise of conscience, which the church argues it was doing.","responseSource":{"name":"Church Newsroom: Same-Sex Marriage and Proposition 8","url":"https://newsroom.churchofjesuschrist.org/article/same-sex-marriage-and-proposition-8"},"verdict":"admitted","rationale":"The facts — the First Presidency letter, the coordinated fundraising through church channels, the dominant member share of campaign funds, the FPPC fine — are documented and not denied; the church's defense is a justification of its involvement, not a dispute of it. Graded admitted on the factual substance. Whether religious political advocacy is wrong is a judgment call Christians themselves divide over, so the entry's force for evangelism is narrower: the mismatch with D&C 134:9's canonized separation language, the pattern of mobilize-then-soften (Prop 8 to the 2015 POX to the 2019 reversal to Respect for Marriage), and what that pattern implies about 'revelation' tracking public pressure. Medium severity.","severity":"medium"},
{"id":"huntsman-tithing-lawsuit","title":"Huntsman v. LDS Church: the City Creek tithing-fraud suit","category":"institutional","claim":"In 2021 James Huntsman — of the prominent Huntsman family — sued the church for fraud, seeking the return of roughly $5 million in tithing. He cited President Hinckley's 2003 general conference assurance about the City Creek mall project: 'tithing funds have not and will not be used to acquire this property,' set against whistleblower David Nielsen's account that Ensign Peak Advisors — whose portfolio was built from surplus tithing — moved about $1.4 billion toward City Creek. A Ninth Circuit panel revived the claim in 2023, but on January 31, 2025, an 11-0 en banc court ruled for the church: six judges held no reasonable juror could find misrepresentation, because Hinckley in the same address said funds would come from 'commercial entities owned by the Church' and 'earnings of invested reserve funds'; the remaining judges would have barred the suit under the church-autonomy doctrine. The case matters as the highest-profile legal test of the church's tithing representations, adjacent to the SEC's separate $5M Ensign Peak settlement.","bom":["D&C 119:3-4"],"bible":["2 Corinthians 8:20-21"],"sources":[{"name":"Deseret News: Huntsman tithing lawsuit dismissed by unanimous 9th Circuit panel","type":"journalism","url":"https://www.deseret.com/faith/2025/01/31/huntsman-tithing-lawsuit-dismissed-9th-circuit-panel/"},{"name":"Courthouse News: Church asks en banc Ninth Circuit to throw out fraud claims","type":"journalism","url":"https://www.courthousenews.com/mormon-church-asks-en-banc-ninth-circuit-panel-to-throw-out-fraud-claims-over-tithes/"},{"name":"Americans United: Huntsman v. Corporation of the President (case page)","type":"institutional","url":"https://www.au.org/how-we-protect-religious-freedom/legal-cases/cases/huntsman-v-corporation-of-the-president-of-the-church-of-jesus-christ-of-latter-day-saints/"},{"name":"Metropolitan News: Ninth Circuit judges disagree over why fraud suit fails","type":"journalism","url":"http://www.metnews.com/articles/2025/tithing_020325.htm"},{"name":"Sutherland Institute: Why the Ninth Circuit unanimously tossed the Huntsman lawsuit","type":"apologetics","url":"https://sutherlandinstitute.org/why-the-ninth-circuit-unanimously-tossed-the-huntsman-tithing-lawsuit/"}],"response":"The church's defense, accepted by the en banc majority, is that Hinckley's full 2003 statement distinguished tithing principal from 'earnings of invested reserve funds' and commercial-entity money, and City Creek was funded from the latter — so there was no misrepresentation, let alone fraud, and Huntsman produced no evidence tithing principal was spent. The concurring judges added that the First Amendment's church-autonomy doctrine forbids civil courts from adjudicating what a church told members about sacred donations at all.","responseSource":{"name":"Sutherland Institute: Why the Ninth Circuit unanimously tossed the Huntsman lawsuit","url":"https://sutherlandinstitute.org/why-the-ninth-circuit-unanimously-tossed-the-huntsman-tithing-lawsuit/"},"verdict":"answered","rationale":"After full adversarial testing, the fraud theory failed 11-0, and on the merits for a majority — not merely on constitutional avoidance. Hinckley's own contemporaneous wording anticipated the earnings-versus-principal distinction, so the residual complaint reduces to whether earnings on invested tithing are morally 'tithing,' a semantic and ethical quarrel rather than a demonstrated deception. Honest grading requires calling this answered; the church won this one. The broader transparency concern is real but belongs to the SEC/Ensign Peak entry, which stands on its own. Low severity: citing Huntsman as if it proved fraud would damage the evangelist's credibility.","severity":"low"},
{"id":"paul-h-dunn-fabrications","title":"Paul H. Dunn: a General Authority's fabricated faith-promoting stories","category":"institutional","claim":"Paul H. Dunn, a General Authority (Seventy, 1964–89) and one of the church's most beloved speakers, built talks and bestselling books on war and baseball stories that were fabricated: his best friend did not die in his arms in World War II, and he never played for the St. Louis Cardinals. Lynn Packer's investigation, published by the Arizona Republic in February 1991, documented the fabrications; Dunn initially defended them as necessary 'to illustrate his theological and moral points.' Church leaders had known years earlier — Packer's reporting was suppressed while Dunn was quietly given emeritus status in 1989 'for reasons of age and health.' In October 1991 Dunn published a confession in the Church News: 'I have not always been accurate in my public talks and writings,' acknowledging he had been censured by the First Presidency and the Twelve. The case is a documented instance of faith-promoting fabrication at the church's highest teaching level, and of the institution managing the image rather than the truth until forced.","bom":["2 Nephi 9:34"],"bible":["Ephesians 4:25","Proverbs 12:22","Romans 3:7-8"],"sources":[{"name":"Deseret News (1991): Arizona paper alleges many stories were exaggerated","type":"journalism","url":"https://www.deseret.com/1991/2/16/18906053/arizona-paper-alleges-many-stories-were-exaggerated/"},{"name":"Deseret News (1991): Elder Dunn offers apology for errors, admits censure","type":"journalism","url":"https://www.deseret.com/1991/10/27/18948334/elder-dunn-offers-apology-for-errors-admits-censure/"},{"name":"Wikipedia: Paul H. Dunn","type":"scholarly","url":"https://en.wikipedia.org/wiki/Paul_H._Dunn"},{"name":"FAIR: Criticisms of Paul H. Dunn","type":"apologetics","url":"https://www.fairlatterdaysaints.org/answers/Criticisms_of_Paul_H._Dunn"}],"response":"FAIR responds that Dunn's dishonesty was personal failure, not church policy: the institution investigated, censured him, moved him to emeritus status, and required a public apology — evidence of accountability, not cover-up. Latter-day Saints do not claim their leaders are infallible or sinless; one man's embellished sermons say nothing about whether the Restoration is true, any more than a dishonest pastor disproves Protestantism. His apology and the church's acceptance of it model repentance.","responseSource":{"name":"FAIR: Criticisms of Paul H. Dunn","url":"https://www.fairlatterdaysaints.org/answers/Criticisms_of_Paul_H._Dunn"},"verdict":"admitted","rationale":"Dunn's own published confession and admitted censure settle the facts; the church-owned Deseret News reported both. The apologetic point that one leader's sins don't falsify the religion is correct, which is why severity is low: this entry's value is as pattern evidence, not proof. What it legitimately illustrates is the ecology of 'faith-promoting' testimony — emotionally powerful stories generating spiritual witness in hearers who took that feeling as confirmation — and the institution's preference for quiet management (emeritus 'for age and health') over candor until journalism forced the issue. Use it to open the epistemology conversation, not as a standalone disproof.","severity":"low"},
{"id":"hofmann-forgeries-church-response","title":"The Mark Hofmann forgeries: prophets, seers, and undetected fraud","category":"institutional","claim":"From 1980–85 forger Mark Hofmann sold or donated to the church a stream of fake founding-era documents: the 'Anthon transcript' (1980), the Joseph Smith III blessing (1981, quietly traded to the RLDS church), and the 'salamander letter' (1984) in which 'Martin Harris' describes a white salamander, not an angel, guarding the plates — purchased for $40,000 by Steve Christensen and donated to the church. Senior leaders, including Gordon B. Hinckley, met Hofmann repeatedly and acquired sensitive items, some held in the First Presidency vault; leaders publicly downplayed what the church possessed. No apostle, seer, or revelator discerned the fraud. It unraveled only when Hofmann, fearing exposure, murdered Christensen and Kathy Sheets with pipe bombs in October 1985, and forensic examiner George Throckmorton proved the forgeries. The church's own history-topics essay now recounts the episode. The test: leaders sustained as 'seers' (D&C 46:23–27 promises the church discernment against deception) authenticated-by-acquisition documents attacking their own founding story rather than detecting a con man who later said he found deceiving the Brethren easy.","bom":["D&C 46:23-27"],"bible":["1 John 4:1","1 Corinthians 12:10"],"sources":[{"name":"Church History Topics: Hofmann Forgeries","type":"institutional","url":"https://www.churchofjesuschrist.org/study/history/topics/hofmann-forgeries?lang=eng"},{"name":"Wikipedia: Salamander letter","type":"scholarly","url":"https://en.wikipedia.org/wiki/Salamander_letter"},{"name":"Time: A Latter-Day Forger","type":"journalism","url":"https://time.com/archive/6708247/a-latter-day-forger/"},{"name":"FAIR: Church reaction to the Hofmann forgeries","type":"apologetics","url":"https://www.fairlatterdaysaints.org/answers/Church_reaction_to_the_Hofmann_forgeries"}],"response":"FAIR responds that spiritual discernment is not omniscience: God does not shield leaders from ordinary human deception, and scripture shows prophets being deceived in mundane matters. The nation's best document examiners, dealers, and historians were equally fooled; the church bought documents as any archive acquires materials bearing on its history, published several of them (including the salamander letter) rather than suppressing them, and cooperated with prosecutors. Leaders' willingness to engage troubling documents is framed as openness, and Hofmann's success says something about forgery, nothing about revelation.","responseSource":{"name":"FAIR: Church reaction to the Hofmann forgeries","url":"https://www.fairlatterdaysaints.org/answers/Church_reaction_to_the_Hofmann_forgeries"},"verdict":"admitted","rationale":"The event sequence — meetings, purchases, the vault, the failure to detect, the murders — is conceded in the church's own essay; only significance is disputed. The 'discernment isn't omniscience' defense has force against a naive gotcha, but it prunes the claims of the office: D&C 46 promises discerning of spirits precisely 'lest ye be deceived,' and leaders' behavior — negotiating for and securing documents that undercut the founding narrative — showed they found a magic-salamander origin plausible enough to buy. That leaders treated the salamander letter as potentially authentic Martin Harris material is itself telling about the folk-magic milieu (covered in the seer-stone entry). Medium severity.","severity":"medium"},
{"id":"burning-in-bosom-epistemology","title":"The burning in the bosom: Moroni 10:4 epistemology vs. the Bible's tests of truth","category":"doctrinal-conflict","claim":"The entire missionary system rests on Moroni 10:4–5: pray about the Book of Mormon and the Holy Ghost will confirm its truth — experienced as a feeling, the 'burning in the bosom' of D&C 9:8, which Dallin Oaks describes as 'a feeling of comfort and serenity.' Members are taught this witness outranks external evidence, and the confirmed feeling then validates the whole chain: book, prophet, priesthood, church. Two problems. First, the method cannot discriminate: Muslims, Catholics, evangelicals, and Strangites report equivalent confirming experiences for contradictory claims, so at most one set of feelings tracks truth. Second, Scripture commands the opposite order of testing: Deuteronomy 13:1–3 requires rejecting even a sign-working prophet whose doctrine is false; 'believe not every spirit, but try the spirits' (1 John 4:1); 'to the law and to the testimony' (Isaiah 8:20); the Bereans 'searched the scriptures daily, whether those things were so' (Acts 17:11); and 'the heart is deceitful above all things' (Jeremiah 17:9). Biblically, doctrine tests experience — never the reverse.","bom":["Moroni 10:4-5","D&C 9:8-9","Alma 32:27-28"],"bible":["Deuteronomy 13:1-3","1 John 4:1","Isaiah 8:20","Acts 17:11","Jeremiah 17:9"],"sources":[{"name":"FAIR: Holy Ghost — Burning in the bosom","type":"apologetics","url":"https://www.fairlatterdaysaints.org/answers/Holy_Ghost/Burning_in_the_bosom"},{"name":"FAIR: Moroni's promise of the Book of Mormon","type":"apologetics","url":"https://www.fairlatterdaysaints.org/answers/Moroni's_promise_of_the_Book_of_Mormon"},{"name":"MormonThink: Mormon Testimony & Spiritual Witnesses","type":"scholarly","url":"http://www.mormonthink.com/testimonyweb.htm"},{"name":"Midwest Christian Outreach: Examining the Faulty Logic of Moroni 10:4","type":"scholarly","url":"https://midwestoutreach.org/2012/03/23/begging-to-differ-examining-the-faulty-logic-of-moroni-104/"},{"name":"wasmormon.org: Moroni's Promise and Begging the Question","type":"journalism","url":"https://wasmormon.org/moronis-promise-and-begging-the-question/"}],"response":"FAIR argues personal revelation is thoroughly biblical: 'ask of God' (James 1:5), hearts burning on the Emmaus road (Luke 24:32), and Peter's testimony revealed 'not by flesh and blood' (Matthew 16:17). The witness is not raw emotion but knowledge borne by the Spirit, and D&C 9:8 commands study first — feeling confirms investigation rather than replacing it. Other faiths' spiritual experiences are expected, since God gives light to all people, and such experiences may soften hearts toward God generally without committing a person to a specific proposition; critics who reduce all spiritual experience to neurochemistry prove too much, undermining Christian conversion too.","responseSource":{"name":"FAIR: Holy Ghost — Burning in the bosom","url":"https://www.fairlatterdaysaints.org/answers/Holy_Ghost/Burning_in_the_bosom"},"verdict":"unrefuted","rationale":"The apologetic defends that God can communicate — which the Christian gladly grants — but never answers the actual objection: how a feeling distinguishes true claims from false ones when contradictory religions produce identical feelings. FAIR's own concession that spiritual experiences may not 'commit one to a specific proposition' surrenders exactly the use Moroni 10:4 is put to, since the missionary program treats the feeling as certifying a very specific proposition set. And Deuteronomy 13:1–3 forecloses the move in principle: even genuine supernatural experience must yield to doctrinal testing. This is arguably the keystone entry — every other case in this app is waved off by appeal to the testimony this method produces. High severity.","severity":"high"},
{"id":"chiasmus-alma-36","title":"Chiasmus in Alma 36: apologetic evidence examined","category":"stylometry","claim":"The strongest literary argument for Book of Mormon antiquity: in 1969 John Welch identified extended chiasmus (inverted parallelism, A-B-C-C'-B'-A') in the Book of Mormon, with Alma 36 as the showpiece — a full-chapter structure pivoting on 'born of God' — argued to reflect an ancient Hebrew form Joseph Smith could not have known. The critical response, led by Earl Wunderli's 'Critique of Alma 36 as an Extended Chiasm' (Dialogue, 2005), shows Welch's outline depends on selective labeling: choosing some repeated words as structural elements while ignoring others that break the pattern, skipping intervening text, and tolerating loose matches — by Welch's own fifteen criteria the chapter scores poorly. Chiasm-like patterns also appear where no one claims Hebrew antiquity: in the Doctrine and Covenants and in ordinary 19th-century prose. Meanwhile chiasmus scholarship (e.g., John Jebb's 1820 'Sacred Literature') predated the Book of Mormon, though Smith's access is undemonstrated. Physicists Boyd and Farrell Edwards countered statistically that Alma 36's chiastic ordering is unlikely by chance; Wunderli rebutted their element selection.","bom":["Alma 36:1-30"],"bible":["Genesis 9:6","Amos 5:4-6"],"sources":[{"name":"Earl Wunderli, 'Critique of Alma 36 as an Extended Chiasm' (Dialogue 38:4)","type":"scholarly","url":"https://www.dialoguejournal.com/wp-content/uploads/sbi/articles/Dialogue_V38N04_105.pdf"},{"name":"Boyd & Farrell Edwards, Response to Wunderli (Dialogue)","type":"scholarly","url":"https://www.dialoguejournal.com/articles/response-to-earl-m-wunderlis-critique-of-alma-36-as-an-extended-chiasm/"},{"name":"Wunderli, Response to the Edwardses (Dialogue)","type":"scholarly","url":"https://www.dialoguejournal.com/articles/response-to-boyd-and-farrell-edwardss-response-to-my-critique-of-alma-36-as-an-extended-chiasm/"},{"name":"Scholarly Publishing Collective: Critique of Alma 36 as an Extended Chiasm","type":"scholarly","url":"https://scholarlypublishingcollective.org/uip/dial/article/38/4/97/236743/Critique-of-Alma-36-as-an-Extended-Chiasm"}],"response":"The Edwardses' statistical analysis estimates a low probability that Alma 36's repeated elements would fall into chiastic order by chance, and argues their method does not depend on Welch's or Wunderli's contestable literary criteria. Apologists add that the structure is thematically apt — conversion at the center of an inverted life story — that candidate chiasms in the D&C are demonstrably weaker, and that there is no evidence Joseph Smith encountered Jebb or any chiasmus scholarship in rural New York before 1829.","responseSource":{"name":"Boyd & Farrell Edwards, Response to Wunderli (Dialogue)","url":"https://www.dialoguejournal.com/articles/response-to-earl-m-wunderlis-critique-of-alma-36-as-an-extended-chiasm/"},"verdict":"contested","rationale":"This is a genuine two-sided scholarly exchange in peer venues: Wunderli's selectivity critique lands, but the Edwardses' statistical reply is a serious counter that survives his rebuttal at least partially. Grading it contested — not dismissed — is both accurate and credibility-building. The deeper point for the evangelist: even granting a deliberate chiasm in Alma 36, the inference to antiquity fails independently — an author saturated in KJV parallelism could produce inverted structure, chiasmus appears in modern texts, and literary form cannot outweigh the anachronism, DNA, and textual evidence elsewhere in this app. Low severity: concede the phenomenon, contest the inference.","severity":"low"},
{"id":"nahom-nhm-altars","title":"Nahom and the NHM altars: the strongest archaeological claim examined","category":"archaeology","claim":"Apologists' flagship archaeological evidence: 1 Nephi 16:34 says Ishmael was buried 'in the place which was called Nahom' — a name the party did not coin — after which the group turned 'nearly eastward' (1 Nephi 17:1). Three limestone altars excavated from the Bar'an temple near Marib, Yemen (from 1988 on) carry dedications by a donor of the NHM (Nihm) tribe, dated to roughly the 7th–6th century BC — Lehi's era — and the Nihm tribal region lies near where the frankincense trail bends east toward the coast. Warren Aston and Scripture Central present this as a precise external hit. Critics respond: the inscriptions are three consonants naming a tribe, not a place called Nahom; the NHM root is common across Semitic names; the eastward turn matches incense-trail geography generally; and a form of the name ('Nehhm') appears on European maps from Carsten Niebuhr's expedition, in English by 1792 — so the correlation is explainable by common naming plus coincidence. Non-Mormon archaeologists attach no significance to the parallel (Philip Jenkins: 'there's no there there').","bom":["1 Nephi 16:34","1 Nephi 17:1"],"bible":["Proverbs 18:17"],"sources":[{"name":"Scripture Central: Book of Mormon Evidence — Nahom","type":"apologetics","url":"https://scripturecentral.org/evidence/book-of-mormon-evidence-nahom"},{"name":"Philip Jenkins: The Nahom Follies","type":"scholarly","url":"https://www.patheos.com/blogs/anxiousbench/2015/06/the-nahom-follies/"},{"name":"MRM: Finding Nahom — The Continuing Search for Archaeological Confirmation","type":"scholarly","url":"https://mrm.org/finding-nahom-the-continuing-search-for-archaeological-confirmation-of-the-book-of-mormon"},{"name":"Ryan Thomas: Nahom and Lehi's Journey through Arabia, Part 3","type":"scholarly","url":"https://www.patheos.com/blogs/faithpromotingrumor/2015/10/nahom-and-lehis-journey-through-arabia-a-historical-perspective-part-3/"},{"name":"FAIR: Possible locations for Nahom","type":"apologetics","url":"https://www.fairlatterdaysaints.org/answers/Possible_locations_for_Nahom"}],"response":"Aston and Scripture Central argue NHM is rare as an Arabian toponym, that the altars independently anchor the tribal name to precisely Lehi's period and region — something unknowable from 1820s New York — and that no evidence connects Joseph Smith to Niebuhr's maps. They stress convergence: a burial place bearing a mourning-related Semitic root (NHM connotes consolation/mourning), positioned exactly where the text turns the party east, terminating at plausible 'Bountiful' candidates on the Omani coast — a chain of hits they argue multiplies well beyond coincidence.","responseSource":{"name":"Scripture Central: Book of Mormon Evidence — Nahom","url":"https://scripturecentral.org/evidence/book-of-mormon-evidence-nahom"},"verdict":"contested","rationale":"Honesty requires ranking this as the best single apologetic datum: a real inscriptional correlate, correctly dated, plausibly located. It is also far weaker than presented: a tribal name of three consonants, a root common in Semitic onomastics, a turn that follows the trade route everyone took, and a name available on published maps decades before 1829 — with academic archaeology outside Mormonism seeing nothing evidentiary in it. Both sides field serious arguments from real data, which is the definition of contested. For the evangelist: grant Nahom its full weight, then note that one consonant cluster in Arabia cannot offset the total absence of Nephite evidence in the New World, where the story's 1,000 years unfold.","severity":"low"}
];

w 5","verses":[{"v":27,"t":"Ye have heard that it was said by them of old time, Thou shalt not commit adultery:"}]},"Matthew 5:44":{"ref":"Matthew 5","verses":[{"v":44,"t":"But I say unto you, Love your enemies, bless them that curse you, do good to them that hate you, and pray for them which despitefully use you, and persecute you;"}]},"2 Nephi 4:17":{"ref":"2 Nephi 4","verses":[{"v":17,"t":"Nevertheless, notwithstanding the great goodness of the Lord, in showing me his great and marvelous works, my heart exclaimeth: O wretched man that I am! Yea, my heart sorroweth because of my flesh; my soul grieveth because of mine iniquities."}]},"2 Nephi 9:39":{"ref":"2 Nephi 9","verses":[{"v":39,"t":"O, my beloved brethren, remember the awfulness in transgressing against that Holy God, and also the awfulness of yielding to the enticings of that cunning one. Remember, to be carnally-minded is death, and to be spiritually-minded is life eternal."}]},"1 Nephi 22:20":{"ref":"1 Nephi 22","verses":[{"v":20,"t":"And the Lord will surely prepare a way for his people, unto the fulfilling of the words of Moses, which he spake, saying: A prophet shall the Lord your God raise up unto you, like unto me; him shall ye hear in all things whatsoever he shall say unto you. And it shall come to pass that all those who will not hear that prophet shall be cut off from among the people."}]},"Alma 5:52":{"ref":"Alma 5","verses":[{"v":52,"t":"And again I say unto you, the Spirit saith: Behold, the ax is laid at the root of the tree; therefore every tree that bringeth not forth good fruit shall be hewn down and cast into the fire, yea, a fire which cannot be consumed, even an unquenchable fire. Behold, and remember, the Holy One hath spoken it."}]},"Moroni 7:45–47":{"ref":"Moroni 7","verses":[{"v":45,"t":"And charity suffereth long, and is kind, and envieth not, and is not puffed up, seeketh not her own, is not easily provoked, thinketh no evil, and rejoiceth not in iniquity but rejoiceth in the truth, beareth all things, believeth all things, hopeth all things, endureth all things."},{"v":46,"t":"Wherefore, my beloved brethren, if ye have not charity, ye are nothing, for charity never faileth. Wherefore, cleave unto charity, which is the greatest of all, for all things must fail—"},{"v":47,"t":"But charity is the pure love of Christ, and it endureth forever; and whoso is found possessed of it at the last day, it shall be well with him."}]},"Moroni 10:8–17":{"ref":"Moroni 10","verses":[{"v":8,"t":"And again, I exhort you, my brethren, that ye deny not the gifts of God, for they are many; and they come from the same God. And there are different ways that these gifts are administered; but it is the same God who worketh all in all; and they are given by the manifestations of the Spirit of God unto men, to profit them."},{"v":9,"t":"For behold, to one is given by the Spirit of God, that he may teach the word of wisdom;"},{"v":10,"t":"And to another, that he may teach the word of knowledge by the same Spirit;"},{"v":11,"t":"And to another, exceedingly great faith; and to another, the gifts of healing by the same Spirit;"},{"v":12,"t":"And again, to another, that he may work mighty miracles;"},{"v":13,"t":"And again, to another, that he may prophesy concerning all things;"},{"v":14,"t":"And again, to another, the beholding of angels and ministering spirits;"},{"v":15,"t":"And again, to another, all kinds of tongues;"},{"v":16,"t":"And again, to another, the interpretation of languages and of divers kinds of tongues."},{"v":17,"t":"And all these gifts come by the Spirit of Christ; and they come unto every man severally, according as he will."}]},"Romans 7:24":{"ref":"Romans 7","verses":[{"v":24,"t":"O wretched man that I am! who shall deliver me from the body of this death?"}]},"Romans 8:6":{"ref":"Romans 8","verses":[{"v":6,"t":"For to be carnally minded is death; but to be spiritually minded is life and peace."}]},"Acts 3:22–23":{"ref":"Acts 3","verses":[{"v":22,"t":"For Moses truly said unto the fathers, A prophet shall the Lord your God raise up unto you of your brethren, like unto me; him shall ye hear in all things whatsoever he shall say unto you."},{"v":23,"t":"And it shall come to pass, that every soul, which will not hear that prophet, shall be destroyed from among the people."}]},"Matthew 3:10":{"ref":"Matthew 3","verses":[{"v":10,"t":"And now also the axe is laid unto the root of the trees: therefore every tree which bringeth not forth good fruit is hewn down, and cast into the fire."}]},"1 Corinthians 13:4–8":{"ref":"1 Corinthians 13","verses":[{"v":4,"t":"Charity suffereth long, and is kind; charity envieth not; charity vaunteth not itself, is not puffed up,"},{"v":5,"t":"Doth not behave itself unseemly, seeketh not her own, is not easily provoked, thinketh no evil;"},{"v":6,"t":"Rejoiceth not in iniquity, but rejoiceth in the truth;"},{"v":7,"t":"Beareth all things, believeth all things, hopeth all things, endureth all things."},{"v":8,"t":"Charity never faileth: but whether there be prophecies, they shall fail; whether there be tongues, they shall cease; whether there be knowledge, it shall vanish away."}]},"1 Corinthians 12:4–11":{"ref":"1 Corinthians 12","verses":[{"v":4,"t":"Now there are diversities of gifts, but the same Spirit."},{"v":5,"t":"And there are differences of administrations, but the same Lord."},{"v":6,"t":"And there are diversities of operations, but it is the same God which worketh all in all."},{"v":7,"t":"But the manifestation of the Spirit is given to every man to profit withal."},{"v":8,"t":"For to one is given by the Spirit the word of wisdom; to another the word of knowledge by the same Spirit;"},{"v":9,"t":"To another faith by the same Spirit; to another the gifts of healing by the same Spirit;"},{"v":10,"t":"To another the working of miracles; to another prophecy; to another discerning of spirits; to another divers kinds of tongues; to another the interpretation of tongues:"},{"v":11,"t":"But all these worketh that one and the selfsame Spirit, dividing to every man severally as he will."}]},"Alma 13:17–19":{"ref":"Alma 13","verses":[{"v":17,"t":"Now this Melchizedek was a king over the land of Salem; and his people had waxed strong in iniquity and abomination; yea, they had all gone astray; they were full of all manner of wickedness;"},{"v":18,"t":"But Melchizedek having exercised mighty faith, and received the office of the high priesthood according to the holy order of God, did preach repentance unto his people. And behold, they did repent; and Melchizedek did establish peace in the land in his days; therefore he was called the prince of peace, for he was the king of Salem; and he did reign under his father."},{"v":19,"t":"Now, there were many before him, and also there were many afterwards, but none were greater; therefore, of him they have more particularly made mention."}]},"Hebrews 5:6–10":{"ref":"Hebrews 5","verses":[{"v":6,"t":"As he saith also in another place, Thou art a priest for ever after the order of Melchisedec."},{"v":7,"t":"Who in the days of his flesh, when he had offered up prayers and supplications with strong crying and tears unto him that was able to save him from death, and was heard in that he feared;"},{"v":8,"t":"Though he were a Son, yet learned he obedience by the things which he suffered;"},{"v":9,"t":"And being made perfect, he became the author of eternal salvation unto all them that obey him;"},{"v":10,"t":"Called of God an high priest after the order of Melchisedec."}]},"Hebrews 7:1–4":{"ref":"Hebrews 7","verses":[{"v":1,"t":"For this Melchisedec, king of Salem, priest of the most high God, who met Abraham returning from the slaughter of the kings, and blessed him;"},{"v":2,"t":"To whom also Abraham gave a tenth part of all; first being by interpretation King of righteousness, and after that also King of Salem, which is, King of peace;"},{"v":3,"t":"Without father, without mother, without descent, having neither beginning of days, nor end of life; but made like unto the Son of God; abideth a priest continually."},{"v":4,"t":"Now consider how great this man was, unto whom even the patriarch Abraham gave the tenth of the spoils."}]},"Psalm 110:4":{"ref":"Psalms 110","verses":[{"v":4,"t":"The LORD hath sworn, and will not repent, Thou art a priest for ever after the order of Melchizedek."}]},"Genesis 14:18–20":{"ref":"Genesis 14","verses":[{"v":18,"t":"And Melchizedek king of Salem brought forth bread and wine: and he was the priest of the most high God."},{"v":19,"t":"And he blessed him, and said, Blessed be Abram of the most high God, possessor of heaven and earth:"},{"v":20,"t":"And blessed be the most high God, which hath delivered thine enemies into thy hand. And he gave him tithes of all."}]},"Mormon 9:22–24":{"ref":"Mormon 9","verses":[{"v":22,"t":"For behold, thus said Jesus Christ, the Son of God, unto his disciples who should tarry, yea, and also to all his disciples, in the hearing of the multitude: Go ye into all the world, and preach the gospel to every creature;"},{"v":23,"t":"And he that believeth and is baptized shall be saved, but he that believeth not shall be damned;"},{"v":24,"t":"And these signs shall follow them that believe—in my name shall they cast out devils; they shall speak with new tongues; they shall take up serpents; and if they drink any deadly thing it shall not hurt them; they shall lay hands on the sick and they shall recover;"}]},"Ether 4:18":{"ref":"Ether 4","verses":[{"v":18,"t":"Therefore, repent all ye ends of the earth, and come unto me, and believe in my gospel, and be baptized in my name; for he that believeth and is baptized shall be saved; but he that believeth not shall be damned; and signs shall follow them that believe in my name."}]},"Mark 16:15–18":{"ref":"Mark 16","verses":[{"v":15,"t":"And he said unto them, Go ye into all the world, and preach the gospel to every creature."},{"v":16,"t":"He that believeth and is baptized shall be saved; but he that believeth not shall be damned."},{"v":17,"t":"And these signs shall follow them that believe; In my name shall they cast out devils; they shall speak with new tongues;"},{"v":18,"t":"They shall take up serpents; and if they drink any deadly thing, it shall not hurt them; they shall lay hands on the sick, and they shall recover."}]},"1 Nephi 18:25":{"ref":"1 Nephi 18","verses":[{"v":25,"t":"And it came to pass that we did find upon the land of promise, as we journeyed in the wilderness, that there were beasts in the forests of every kind, both the cow and the ox, and the ass and the horse, and the goat and the wild goat, and all manner of wild animals, which were for the use of men. And we did find all manner of ore, both of gold, and of silver, and of copper."}]},"Enos 1:21":{"ref":"Enos 1","verses":[{"v":21,"t":"And it came to pass that the people of Nephi did till the land, and raise all manner of grain, and of fruit, and flocks of herds, and flocks of all manner of cattle of every kind, and goats, and wild goats, and also many horses."}]},"Alma 18:9–12":{"ref":"Alma 18","verses":[{"v":9,"t":"And they said unto him: Behold, he is feeding thy horses. Now the king had commanded his servants, previous to the time of the watering of their flocks, that they should prepare his horses and chariots, and conduct him forth to the land of Nephi; for there had been a great feast appointed at the land of Nephi, by the father of Lamoni, who was king over all the land."},{"v":10,"t":"Now when king Lamoni heard that Ammon was preparing his horses and his chariots he was more astonished, because of the faithfulness of Ammon, saying: Surely there has not been any servant among all my servants that has been so faithful as this man; for even he doth remember all my commandments to execute them."},{"v":11,"t":"Now I surely know that this is the Great Spirit, and I would desire him that he come in unto me, but I durst not."},{"v":12,"t":"And it came to pass that when Ammon had made ready the horses and the chariots for the king and his servants, he went in unto the king, and he saw that the countenance of the king was changed; therefore he was about to return out of his presence."}]},"3 Nephi 3:22":{"ref":"3 Nephi 3","verses":[{"v":22,"t":"And it came to pass in the seventeenth year, in the latter end of the year, the proclamation of Lachoneus had gone forth throughout all the face of the land, and they had taken their horses, and their chariots, and their cattle, and all their flocks, and their herds, and their grain, and all their substance, and did march forth by thousands and by tens of thousands, until they had all gone forth to the place which had been appointed that they should gather themselves together, to defend themselves against their enemies."}]},"Ether 9:19":{"ref":"Ether 9","verses":[{"v":19,"t":"And they also had horses, and asses, and there were elephants and cureloms and cumoms; all of which were useful unto man, and more especially the elephants and cureloms and cumoms."}]},"1 Nephi 4:9":{"ref":"1 Nephi 4","verses":[{"v":9,"t":"And I beheld his sword, and I drew it forth from the sheath thereof; and the hilt thereof was of pure gold, and the workmanship thereof was exceedingly fine, and I saw that the blade thereof was of the most precious steel."}]},"1 Nephi 16:18":{"ref":"1 Nephi 16","verses":[{"v":18,"t":"And it came to pass that as I, Nephi, went forth to slay food, behold, I did break my bow, which was made of fine steel; and after I did break my bow, behold, my brethren were angry with me because of the loss of my bow, for we did obtain no food."}]},"2 Nephi 5:15":{"ref":"2 Nephi 5","verses":[{"v":15,"t":"And I did teach my people to build buildings, and to work in all manner of wood, and of iron, and of copper, and of brass, and of steel, and of gold, and of silver, and of precious ores, which were in great abundance."}]},"Jarom 1:8":{"ref":"Jarom 1","verses":[{"v":8,"t":"And we multiplied exceedingly, and spread upon the face of the land, and became exceedingly rich in gold, and in silver, and in precious things, and in fine workmanship of wood, in buildings, and in machinery, and also in iron and copper, and brass and steel, making all manner of tools of every kind to till the ground, and weapons of war—yea, the sharp pointed arrow, and the quiver, and the dart, and the javelin, and all preparations for war."}]},"Ether 7:9":{"ref":"Ether 7","verses":[{"v":9,"t":"Wherefore, he came to the hill Ephraim, and he did molten out of the hill, and made swords out of steel for those whom he had drawn away with him; and after he had armed them with swords he returned to the city Nehor, and gave battle unto his brother Corihor, by which means he obtained the kingdom and restored it unto his father Kib."}]},"Mosiah 9:9":{"ref":"Mosiah 9","verses":[{"v":9,"t":"And we began to till the ground, yea, even with all manner of seeds, with seeds of corn, and of wheat, and of barley, and with neas, and with sheum, and with seeds of all manner of fruits; and we did begin to multiply and prosper in the land."}]},"Alma 11:7,15":{"ref":"Alma 11","verses":[{"v":7,"t":"A senum of silver was equal to a senine of gold, and either for a measure of barley, and also for a measure of every kind of grain."},{"v":15,"t":"A shiblon is half of a senum; therefore, a shiblon for half a measure of barley."}]},"Alma 1:29":{"ref":"Alma 1","verses":[{"v":29,"t":"And now, because of the steadiness of the church they began to be exceedingly rich, having abundance of all things whatsoever they stood in need—an abundance of flocks and herds, and fatlings of every kind, and also abundance of grain, and of gold, and of silver, and of precious things, and abundance of silk and fine-twined linen, and all manner of good homely cloth."}]},"Ether 9:17":{"ref":"Ether 9","verses":[{"v":17,"t":"Having all manner of fruit, and of grain, and of silks, and of fine linen, and of gold, and of silver, and of precious things;"}]},"Ether 10:24":{"ref":"Ether 10","verses":[{"v":24,"t":"And they did have silks, and fine-twined linen; and they did work all manner of cloth, that they might clothe themselves from their nakedness."}]},"3 Nephi 1:1":{"ref":"3 Nephi 1","verses":[{"v":1,"t":"Now it came to pass that the ninety and first year had passed away and it was six hundred years from the time that Lehi left Jerusalem; and it was in the year that Lachoneus was the chief judge and the governor over the land."}]},"3 Nephi 19:4":{"ref":"3 Nephi 19","verses":[{"v":4,"t":"And it came to pass that on the morrow, when the multitude was gathered together, behold, Nephi and his brother whom he had raised from the dead, whose name was Timothy, and also his son, whose name was Jonas, and also Mathoni, and Mathonihah, his brother, and Kumen, and Kumenonhi, and Jeremiah, and Shemnon, and Jonas, and Zedekiah, and Isaiah—now these were the names of the disciples whom Jesus had chosen—and it came to pass that they went forth and stood in the midst of the multitude."}]},"3 Nephi 9:18":{"ref":"3 Nephi 9","verses":[{"v":18,"t":"I am the light and the life of the world. I am Alpha and Omega, the beginning and the end."}]},"Revelation 1:8":{"ref":"Revelation 1","verses":[{"v":8,"t":"I am Alpha and Omega, the beginning and the ending, saith the Lord, which is, and which was, and which is to come, the Almighty."}]},"1 Nephi 4:26":{"ref":"1 Nephi 4","verses":[{"v":26,"t":"And he, supposing that I spake of the brethren of the church, and that I was truly that Laban whom I had slain, wherefore he did follow me."}]},"2 Nephi 26:26":{"ref":"2 Nephi 26","verses":[{"v":26,"t":"Behold, hath he commanded any that they should depart out of the synagogues, or out of the houses of worship? Behold, I say unto you, Nay."}]},"Alma 16:13":{"ref":"Alma 16","verses":[{"v":13,"t":"And Alma and Amulek went forth preaching repentance to the people in their temples, and in their sanctuaries, and also in their synagogues, which were built after the manner of the Jews."}]},"Alma 21:4–6":{"ref":"Alma 21","verses":[{"v":4,"t":"And it came to pass that Aaron came to the city of Jerusalem, and first began to preach to the Amalekites. And he began to preach to them in their synagogues, for they had built synagogues after the order of the Nehors; for many of the Amalekites and the Amulonites were after the order of the Nehors."},{"v":5,"t":"Therefore, as Aaron entered into one of their synagogues to preach unto the people, and as he was speaking unto them, behold there arose an Amalekite and began to contend with him, saying: What is that thou hast testified? Hast thou seen an angel? Why do not angels appear unto us? Behold are not this people as good as thy people?"},{"v":6,"t":"Thou also sayest, except we repent we shall perish. How knowest thou the thought and intent of our hearts? How knowest thou that we have cause to repent? How knowest thou that we are not a righteous people? Behold, we have built sanctuaries, and we do assemble ourselves together to worship God. We do believe that God will save all men."}]},"2 Nephi 29:3–10":{"ref":"2 Nephi 29","verses":[{"v":3,"t":"And because my words shall hiss forth—many of the Gentiles shall say: A Bible! A Bible! We have got a Bible, and there cannot be any more Bible."},{"v":4,"t":"But thus saith the Lord God: O fools, they shall have a Bible; and it shall proceed forth from the Jews, mine ancient covenant people. And what thank they the Jews for the Bible which they receive from them? Yea, what do the Gentiles mean? Do they remember the travails, and the labors, and the pains of the Jews, and their diligence unto me, in bringing forth salvation unto the Gentiles?"},{"v":5,"t":"O ye Gentiles, have ye remembered the Jews, mine ancient covenant people? Nay; but ye have cursed them, and have hated them, and have not sought to recover them. But behold, I will return all these things upon your own heads; for I the Lord have not forgotten my people."},{"v":6,"t":"Thou fool, that shall say: A Bible, we have got a Bible, and we need no more Bible. Have ye obtained a Bible save it were by the Jews?"},{"v":7,"t":"Know ye not that there are more nations than one? Know ye not that I, the Lord your God, have created all men, and that I remember those who are upon the isles of the sea; and that I rule in the heavens above and in the earth beneath; and I bring forth my word unto the children of men, yea, even upon all the nations of the earth?"},{"v":8,"t":"Wherefore murmur ye, because that ye shall receive more of my word? Know ye not that the testimony of two nations is a witness unto you that I am God, that I remember one nation like unto another? Wherefore, I speak the same words unto one nation like unto another. And when the two nations shall run together the testimony of the two nations shall run together also."},{"v":9,"t":"And I do this that I may prove unto many that I am the same yesterday, today, and forever; and that I speak forth my words according to mine own pleasure. And because that I have spoken one word ye need not suppose that I cannot speak another; for my work is not yet finished; neither shall it be until the end of man, neither from that time henceforth and forever."},{"v":10,"t":"Wherefore, because that ye have a Bible ye need not suppose that it contains all my words; neither need ye suppose that I have not caused more to be written."}]},"1 Nephi 13:34–40":{"ref":"1 Nephi 13","verses":[{"v":34,"t":"And it came to pass that the angel of the Lord spake unto me, saying: Behold, saith the Lamb of God, after I have visited the remnant of the house of Israel—and this remnant of whom I speak is the seed of thy father—wherefore, after I have visited them in judgment, and smitten them by the hand of the Gentiles, and after the Gentiles do stumble exceedingly, because of the most plain and precious parts of the gospel of the Lamb which have been kept back by that abominable church, which is the mother of harlots, saith the Lamb—I will be merciful unto the Gentiles in that day, insomuch that I will bring forth unto them, in mine own power, much of my gospel, which shall be plain and precious, saith the Lamb."},{"v":35,"t":"For, behold, saith the Lamb: I will manifest myself unto thy seed, that they shall write many things which I shall minister unto them, which shall be plain and precious; and after thy seed shall be destroyed, and dwindle in unbelief, and also the seed of thy brethren, behold, these things shall be hid up, to come forth unto the Gentiles, by the gift and power of the Lamb."},{"v":36,"t":"And in them shall be written my gospel, saith the Lamb, and my rock and my salvation."},{"v":37,"t":"And blessed are they who shall seek to bring forth my Zion at that day, for they shall have the gift and the power of the Holy Ghost; and if they endure unto the end they shall be lifted up at the last day, and shall be saved in the everlasting kingdom of the Lamb; and whoso shall publish peace, yea, tidings of great joy, how beautiful upon the mountains shall they be."},{"v":38,"t":"And it came to pass that I beheld the remnant of the seed of my brethren, and also the book of the Lamb of God, which had proceeded forth from the mouth of the Jew, that it came forth from the Gentiles unto the remnant of the seed of my brethren."},{"v":39,"t":"And after it had come forth unto them I beheld other books, which came forth by the power of the Lamb, from the Gentiles unto them, unto the convincing of the Gentiles and the remnant of the seed of my brethren, and also the Jews who were scattered upon all the face of the earth, that the records of the prophets and of the twelve apostles of the Lamb are true."},{"v":40,"t":"And the angel spake unto me, saying: These last records, which thou hast seen among the Gentiles, shall establish the truth of the first, which are of the twelve apostles of the Lamb, and shall make known the plain and precious things which have been taken away from them; and shall make known to all kindreds, tongues, and people, that the Lamb of God is the Son of the Eternal Father, and the Savior of the world; and that all men must come unto him, or they cannot be saved."}]},"3 Nephi 27:13–21":{"ref":"3 Nephi 27","verses":[{"v":13,"t":"Behold I have given unto you my gospel, and this is the gospel which I have given unto you—that I came into the world to do the will of my Father, because my Father sent me."},{"v":14,"t":"And my Father sent me that I might be lifted up upon the cross; and after that I had been lifted up upon the cross, that I might draw all men unto me, that as I have been lifted up by men even so should men be lifted up by the Father, to stand before me, to be judged of their works, whether they be good or whether they be evil—"},{"v":15,"t":"And for this cause have I been lifted up; therefore, according to the power of the Father I will draw all men unto me, that they may be judged according to their works."},{"v":16,"t":"And it shall come to pass, that whoso repenteth and is baptized in my name shall be filled; and if he endureth to the end, behold, him will I hold guiltless before my Father at that day when I shall stand to judge the world."},{"v":17,"t":"And he that endureth not unto the end, the same is he that is also hewn down and cast into the fire, from whence they can no more return, because of the justice of the Father."},{"v":18,"t":"And this is the word which he hath given unto the children of men. And for this cause he fulfilleth the words which he hath given, and he lieth not, but fulfilleth all his words."},{"v":19,"t":"And no unclean thing can enter into his kingdom; therefore nothing entereth into his rest save it be those who have washed their garments in my blood, because of their faith, and the repentance of all their sins, and their faithfulness unto the end."},{"v":20,"t":"Now this is the commandment: Repent, all ye ends of the earth, and come unto me and be baptized in my name, that ye may be sanctified by the reception of the Holy Ghost, that ye may stand spotless before me at the last day."},{"v":21,"t":"Verily, verily, I say unto you, this is my gospel; and ye know the things that ye must do in my church; for the works which ye have seen me do that shall ye also do; for that which ye have seen me do even that shall ye do;"}]},"Galatians 1:6–9":{"ref":"Galatians 1","verses":[{"v":6,"t":"I marvel that ye are so soon removed from him that called you into the grace of Christ unto another gospel:"},{"v":7,"t":"Which is not another; but there be some that trouble you, and would pervert the gospel of Christ."},{"v":8,"t":"But though we, or an angel from heaven, preach any other gospel unto you than that which we have preached unto you, let him be accursed."},{"v":9,"t":"As we said before, so say I now again, If any man preach any other gospel unto you than that ye have received, let him be accursed."}]},"Revelation 22:18–19":{"ref":"Revelation 22","verses":[{"v":18,"t":"For I testify unto every man that heareth the words of the prophecy of this book, If any man shall add unto these things, God shall add unto him the plagues that are written in this book:"},{"v":19,"t":"And if any man shall take away from the words of the book of this prophecy, God shall take away his part out of the book of life, and out of the holy city, and from the things which are written in this book."}]},"Deuteronomy 4:2":{"ref":"Deuteronomy 4","verses":[{"v":2,"t":"Ye shall not add unto the word which I command you, neither shall ye diminish ought from it, that ye may keep the commandments of the LORD your God which I command you."}]},"Jude 3":{"ref":"Jude 1","verses":[{"v":3,"t":"Beloved, when I gave all diligence to write unto you of the common salvation, it was needful for me to write unto you, and exhort you that ye should earnestly contend for the faith which was once delivered unto the saints."}]},"Hebrews 1:1–2":{"ref":"Hebrews 1","verses":[{"v":1,"t":"God, who at sundry times and in divers manners spake in time past unto the fathers by the prophets,"},{"v":2,"t":"Hath in these last days spoken unto us by his Son, whom he hath appointed heir of all things, by whom also he made the worlds;"}]},"2 Nephi 25:23":{"ref":"2 Nephi 25","verses":[{"v":23,"t":"For we labor diligently to write, to persuade our children, and also our brethren, to believe in Christ, and to be reconciled to God; for we know that it is by grace that we are saved, after all we can do."}]},"Moroni 10:32–33":{"ref":"Moroni 10","verses":[{"v":32,"t":"Yea, come unto Christ, and be perfected in him, and deny yourselves of all ungodliness; and if ye shall deny yourselves of all ungodliness, and love God with all your might, mind and strength, then is his grace sufficient for you, that by his grace ye may be perfect in Christ; and if by the grace of God ye are perfect in Christ, ye can in nowise deny the power of God."},{"v":33,"t":"And again, if ye by the grace of God are perfect in Christ, and deny not his power, then are ye sanctified in Christ by the grace of God, through the shedding of the blood of Christ, which is in the covenant of the Father unto the remission of your sins, that ye become holy, without spot."}]},"Alma 11:37":{"ref":"Alma 11","verses":[{"v":37,"t":"And I say unto you again that he cannot save them in their sins; for I cannot deny his word, and he hath said that no unclean thing can inherit the kingdom of heaven; therefore, how can ye be saved, except ye inherit the kingdom of heaven? Therefore, ye cannot be saved in your sins."}]},"Ephesians 2:8–9":{"ref":"Ephesians 2","verses":[{"v":8,"t":"For by grace are ye saved through faith; and that not of yourselves: it is the gift of God:"},{"v":9,"t":"Not of works, lest any man should boast."}]},"Romans 11:6":{"ref":"Romans 11","verses":[{"v":6,"t":"And if by grace, then is it no more of works: otherwise grace is no more grace. But if it be of works, then is it no more grace: otherwise work is no more work."}]},"Romans 4:4–5":{"ref":"Romans 4","verses":[{"v":4,"t":"Now to him that worketh is the reward not reckoned of grace, but of debt."},{"v":5,"t":"But to him that worketh not, but believeth on him that justifieth the ungodly, his faith is counted for righteousness."}]},"Titus 3:5":{"ref":"Titus 3","verses":[{"v":5,"t":"Not by works of righteousness which we have done, but according to his mercy he saved us, by the washing of regeneration, and renewing of the Holy Ghost;"}]},"Galatians 2:16":{"ref":"Galatians 2","verses":[{"v":16,"t":"Knowing that a man is not justified by the works of the law, but by the faith of Jesus Christ, even we have believed in Jesus Christ, that we might be justified by the faith of Christ, and not by the works of the law: for by the works of the law shall no flesh be justified."}]},"Galatians 2:21":{"ref":"Galatians 2","verses":[{"v":21,"t":"I do not frustrate the grace of God: for if righteousness come by the law, then Christ is dead in vain."}]},"2 Nephi 5:21–23":{"ref":"2 Nephi 5","verses":[{"v":21,"t":"And he had caused the cursing to come upon them, yea, even a sore cursing, because of their iniquity. For behold, they had hardened their hearts against him, that they had become like unto a flint; wherefore, as they were white, and exceedingly fair and delightsome, that they might not be enticing unto my people the Lord God did cause a skin of blackness to come upon them."},{"v":22,"t":"And thus saith the Lord God: I will cause that they shall be loathsome unto thy people, save they shall repent of their iniquities."},{"v":23,"t":"And cursed shall be the seed of him that mixeth with their seed; for they shall be cursed even with the same cursing. And the Lord spake it, and it was done."}]},"Alma 3:6–9":{"ref":"Alma 3","verses":[{"v":6,"t":"And the skins of the Lamanites were dark, according to the mark which was set upon their fathers, which was a curse upon them because of their transgression and their rebellion against their brethren, who consisted of Nephi, Jacob, and Joseph, and Sam, who were just and holy men."},{"v":7,"t":"And their brethren sought to destroy them, therefore they were cursed; and the Lord God set a mark upon them, yea, upon Laman and Lemuel, and also the sons of Ishmael, and Ishmaelitish women."},{"v":8,"t":"And this was done that their seed might be distinguished from the seed of their brethren, that thereby the Lord God might preserve his people, that they might not mix and believe in incorrect traditions which would prove their destruction."},{"v":9,"t":"And it came to pass that whosoever did mingle his seed with that of the Lamanites did bring the same curse upon his seed."}]},"3 Nephi 2:14–15":{"ref":"3 Nephi 2","verses":[{"v":14,"t":"And it came to pass that those Lamanites who had united with the Nephites were numbered among the Nephites;"},{"v":15,"t":"And their curse was taken from them, and their skin became white like unto the Nephites;"}]},"Jacob 3:8–9":{"ref":"Jacob 3","verses":[{"v":8,"t":"O my brethren, I fear that unless ye shall repent of your sins that their skins will be whiter than yours, when ye shall be brought with them before the throne of God."},{"v":9,"t":"Wherefore, a commandment I give unto you, which is the word of God, that ye revile no more against them because of the darkness of their skins; neither shall ye revile against them because of their filthiness; but ye shall remember your own filthiness, and remember that their filthiness came because of their fathers."}]},"2 Nephi 30:6 (1830/1981 variants)":{"ref":"2 Nephi 30","verses":[{"v":6,"t":"And then shall they rejoice; for they shall know that it is a blessing unto them from the hand of God; and their scales of darkness shall begin to fall from their eyes; and many generations shall not pass away among them, save they shall be a pure and a delightsome people."}]},"Mormon 5:15":{"ref":"Mormon 5","verses":[{"v":15,"t":"And also that the seed of this people may more fully believe his gospel, which shall go forth unto them from the Gentiles; for this people shall be scattered, and shall become a dark, a filthy, and a loathsome people, beyond the description of that which ever hath been amongst us, yea, even that which hath been among the Lamanites, and this because of their unbelief and idolatry."}]},"Acts 17:26":{"ref":"Acts 17","verses":[{"v":26,"t":"And hath made of one blood all nations of men for to dwell on all the face of the earth, and hath determined the times before appointed, and the bounds of their habitation;"}]},"Acts 10:34–35":{"ref":"Acts 10","verses":[{"v":34,"t":"Then Peter opened his mouth, and said, Of a truth I perceive that God is no respecter of persons:"},{"v":35,"t":"But in every nation he that feareth him, and worketh righteousness, is accepted with him."}]},"1 Samuel 16:7":{"ref":"1 Samuel 16","verses":[{"v":7,"t":"But the LORD said unto Samuel, Look not on his countenance, or on the height of his stature; because I have refused him: for the LORD seeth not as man seeth; for man looketh on the outward appearance, but the LORD looketh on the heart."}]},"Galatians 3:28":{"ref":"Galatians 3","verses":[{"v":28,"t":"There is neither Jew nor Greek, there is neither bond nor free, there is neither male nor female: for ye are all one in Christ Jesus."}]},"John 7:24":{"ref":"John 7","verses":[{"v":24,"t":"Judge not according to the appearance, but judge righteous judgment."}]},"Revelation 7:9":{"ref":"Revelation 7","verses":[{"v":9,"t":"After this I beheld, and, lo, a great multitude, which no man could number, of all nations, and kindreds, and people, and tongues, stood before the throne, and before the Lamb, clothed with white robes, and palms in their hands;"}]},"2 Nephi 2:22–25":{"ref":"2 Nephi 2","verses":[{"v":22,"t":"And now, behold, if Adam had not transgressed he would not have fallen, but he would have remained in the garden of Eden. And all things which were created must have remained in the same state in which they were after they were created; and they must have remained forever, and had no end."},{"v":23,"t":"And they would have had no children; wherefore they would have remained in a state of innocence, having no joy, for they knew no misery; doing no good, for they knew no sin."},{"v":24,"t":"But behold, all things have been done in the wisdom of him who knoweth all things."},{"v":25,"t":"Adam fell that men might be; and men are, that they might have joy."}]},"Alma 12:22–26":{"ref":"Alma 12","verses":[{"v":22,"t":"Now Alma said unto him: This is the thing which I was about to explain. Now we see that Adam did fall by the partaking of the forbidden fruit, according to the word of God; and thus we see, that by his fall, all mankind became a lost and fallen people."},{"v":23,"t":"And now behold, I say unto you that if it had been possible for Adam to have partaken of the fruit of the tree of life at that time, there would have been no death, and the word would have been void, making God a liar, for he said: If thou eat thou shalt surely die."},{"v":24,"t":"And we see that death comes upon mankind, yea, the death which has been spoken of by Amulek, which is the temporal death; nevertheless there was a space granted unto man in which he might repent; therefore this life became a probationary state; a time to prepare to meet God; a time to prepare for that endless state which has been spoken of by us, which is after the resurrection of the dead."},{"v":25,"t":"Now, if it had not been for the plan of redemption, which was laid from the foundation of the world, there could have been no resurrection of the dead; but there was a plan of redemption laid, which shall bring to pass the resurrection of the dead, of which has been spoken."},{"v":26,"t":"And now behold, if it were possible that our first parents could have gone forth and partaken of the tree of life they would have been forever miserable, having no preparatory state; and thus the plan of redemption would have been frustrated, and the word of God would have been void, taking none effect."}]},"Genesis 1:28":{"ref":"Genesis 1","verses":[{"v":28,"t":"And God blessed them, and God said unto them, Be fruitful, and multiply, and replenish the earth, and subdue it: and have dominion over the fish of the sea, and over the fowl of the air, and over every living thing that moveth upon the earth."}]},"Genesis 2:17":{"ref":"Genesis 2","verses":[{"v":17,"t":"But of the tree of the knowledge of good and evil, thou shalt not eat of it: for in the day that thou eatest thereof thou shalt surely die."}]},"Romans 5:12–19":{"ref":"Romans 5","verses":[{"v":12,"t":"Wherefore, as by one man sin entered into the world, and death by sin; and so death passed upon all men, for that all have sinned:"},{"v":13,"t":"(For until the law sin was in the world: but sin is not imputed when there is no law."},{"v":14,"t":"Nevertheless death reigned from Adam to Moses, even over them that had not sinned after the similitude of Adam's transgression, who is the figure of him that was to come."},{"v":15,"t":"But not as the offence, so also is the free gift. For if through the offence of one many be dead, much more the grace of God, and the gift by grace, which is by one man, Jesus Christ, hath abounded unto many."},{"v":16,"t":"And not as it was by one that sinned, so is the gift: for the judgment was by one to condemnation, but the free gift is of many offences unto justification."},{"v":17,"t":"For if by one man's offence death reigned by one; much more they which receive abundance of grace and of the gift of righteousness shall reign in life by one, Jesus Christ.)"},{"v":18,"t":"Therefore as by the offence of one judgment came upon all men to condemnation; even so by the righteousness of one the free gift came upon all men unto justification of life."},{"v":19,"t":"For as by one man's disobedience many were made sinners, so by the obedience of one shall many be made righteous."}]},"Romans 8:20–22":{"ref":"Romans 8","verses":[{"v":20,"t":"For the creature was made subject to vanity, not willingly, but by reason of him who hath subjected the same in hope,"},{"v":21,"t":"Because the creature itself also shall be delivered from the bondage of corruption into the glorious liberty of the children of God."},{"v":22,"t":"For we know that the whole creation groaneth and travaileth in pain together until now."}]},"1 Timothy 2:14":{"ref":"1 Timothy 2","verses":[{"v":14,"t":"And Adam was not deceived, but the woman being deceived was in the transgression."}]},"1 Corinthians 15:21–22":{"ref":"1 Corinthians 15","verses":[{"v":21,"t":"For since by man came death, by man came also the resurrection of the dead."},{"v":22,"t":"For as in Adam all die, even so in Christ shall all be made alive."}]},"Moroni 8:8–23":{"ref":"Moroni 8","verses":[{"v":8,"t":"Listen to the words of Christ, your Redeemer, your Lord and your God. Behold, I came into the world not to call the righteous but sinners to repentance; the whole need no physician, but they that are sick; wherefore, little children are whole, for they are not capable of committing sin; wherefore the curse of Adam is taken from them in me, that it hath no power over them; and the law of circumcision is done away in me."},{"v":9,"t":"And after this manner did the Holy Ghost manifest the word of God unto me; wherefore, my beloved son, I know that it is solemn mockery before God, that ye should baptize little children."},{"v":10,"t":"Behold I say unto you that this thing shall ye teach—repentance and baptism unto those who are accountable and capable of committing sin; yea, teach parents that they must repent and be baptized, and humble themselves as their little children, and they shall all be saved with their little children."},{"v":11,"t":"And their little children need no repentance, neither baptism. Behold, baptism is unto repentance to the fulfilling the commandments unto the remission of sins."},{"v":12,"t":"But little children are alive in Christ, even from the foundation of the world; if not so, God is a partial God, and also a changeable God, and a respecter to persons; for how many little children have died without baptism!"},{"v":13,"t":"Wherefore, if little children could not be saved without baptism, these must have gone to an endless hell."},{"v":14,"t":"Behold I say unto you, that he that supposeth that little children need baptism is in the gall of bitterness and in the bonds of iniquity; for he hath neither faith, hope, nor charity; wherefore, should he be cut off while in the thought, he must go down to hell."},{"v":15,"t":"For awful is the wickedness to suppose that God saveth one child because of baptism, and the other must perish because he hath no baptism."},{"v":16,"t":"Wo be unto them that shall pervert the ways of the Lord after this manner, for they shall perish except they repent. Behold, I speak with boldness, having authority from God; and I fear not what man can do; for perfect love casteth out all fear."},{"v":17,"t":"And I am filled with charity, which is everlasting love; wherefore, all children are alike unto me; wherefore, I love little children with a perfect love; and they are all alike and partakers of salvation."},{"v":18,"t":"For I know that God is not a partial God, neither a changeable being; but he is unchangeable from all eternity to all eternity."},{"v":19,"t":"Little children cannot repent; wherefore, it is awful wickedness to deny the pure mercies of God unto them, for they are all alive in him because of his mercy."},{"v":20,"t":"And he that saith that little children need baptism denieth the mercies of Christ, and setteth at naught the atonement of him and the power of his redemption."},{"v":21,"t":"Wo unto such, for they are in danger of death, hell, and an endless torment. I speak it boldly; God hath commanded me. Listen unto them and give heed, or they stand against you at the judgment-seat of Christ."},{"v":22,"t":"For behold that all little children are alive in Christ, and also all they that are without the law. For the power of redemption cometh on all them that have no law; wherefore, he that is not condemned, or he that is under no condemnation, cannot repent; and unto such baptism availeth nothing—"},{"v":23,"t":"But it is mockery before God, denying the mercies of Christ, and the power of his Holy Spirit, and putting trust in dead works."}]},"Mosiah 3:16–21":{"ref":"Mosiah 3","verses":[{"v":16,"t":"And even if it were possible that little children could sin they could not be saved; but I say unto you they are blessed; for behold, as in Adam, or by nature, they fall, even so the blood of Christ atoneth for their sins."},{"v":17,"t":"And moreover, I say unto you, that there shall be no other name given nor any other way nor means whereby salvation can come unto the children of men, only in and through the name of Christ, the Lord Omnipotent."},{"v":18,"t":"For behold he judgeth, and his judgment is just; and the infant perisheth not that dieth in his infancy; but men drink damnation to their own souls except they humble themselves and become as little children, and believe that salvation was, and is, and is to come, in and through the atoning blood of Christ, the Lord Omnipotent."},{"v":19,"t":"For the natural man is an enemy to God, and has been from the fall of Adam, and will be, forever and ever, unless he yields to the enticings of the Holy Spirit, and putteth off the natural man and becometh a saint through the atonement of Christ the Lord, and becometh as a child, submissive, meek, humble, patient, full of love, willing to submit to all things which the Lord seeth fit to inflict upon him, even as a child doth submit to his father."},{"v":20,"t":"And moreover, I say unto you, that the time shall come when the knowledge of a Savior shall spread throughout every nation, kindred, tongue, and people."},{"v":21,"t":"And behold, when that time cometh, none shall be found blameless before God, except it be little children, only through repentance and faith on the name of the Lord God Omnipotent."}]},"2 Nephi 2:25":{"ref":"2 Nephi 2","verses":[{"v":25,"t":"Adam fell that men might be; and men are, that they might have joy."}]},"Psalm 51:5":{"ref":"Psalms 51","verses":[{"v":5,"t":"Behold, I was shapen in iniquity; and in sin did my mother conceive me."}]},"Ephesians 2:3":{"ref":"Ephesians 2","verses":[{"v":3,"t":"Among whom also we all had our conversation in times past in the lusts of our flesh, fulfilling the desires of the flesh and of the mind; and were by nature the children of wrath, even as others."}]},"Romans 5:12, 18–19":{"ref":"Romans 5","verses":[{"v":12,"t":"Wherefore, as by one man sin entered into the world, and death by sin; and so death passed upon all men, for that all have sinned:"},{"v":18,"t":"Therefore as by the offence of one judgment came upon all men to condemnation; even so by the righteousness of one the free gift came upon all men unto justification of life."},{"v":19,"t":"For as by one man's disobedience many were made sinners, so by the obedience of one shall many be made righteous."}]},"Genesis 8:21":{"ref":"Genesis 8","verses":[{"v":21,"t":"And the LORD smelled a sweet savour; and the LORD said in his heart, I will not again curse the ground any more for man's sake; for the imagination of man's heart is evil from his youth; neither will I again smite any more every thing living, as I have done."}]},"Psalm 58:3":{"ref":"Psalms 58","verses":[{"v":3,"t":"The wicked are estranged from the womb: they go astray as soon as they be born, speaking lies."}]},"1 Corinthians 15:22":{"ref":"1 Corinthians 15","verses":[{"v":22,"t":"For as in Adam all die, even so in Christ shall all be made alive."}]},"Mosiah 15:1–5":{"ref":"Mosiah 15","verses":[{"v":1,"t":"And now Abinadi said unto them: I would that ye should understand that God himself shall come down among the children of men, and shall redeem his people."},{"v":2,"t":"And because he dwelleth in flesh he shall be called the Son of God, and having subjected the flesh to the will of the Father, being the Father and the Son—"},{"v":3,"t":"The Father, because he was conceived by the power of God; and the Son, because of the flesh; thus becoming the Father and Son—"},{"v":4,"t":"And they are one God, yea, the very Eternal Father of heaven and of earth."},{"v":5,"t":"And thus the flesh becoming subject to the Spirit, or the Son to the Father, being one God, suffereth temptation, and yieldeth not to the temptation, but suffereth himself to be mocked, and scourged, and cast out, and disowned by his people."}]},"Mosiah 16:15":{"ref":"Mosiah 16","verses":[{"v":15,"t":"Teach them that redemption cometh through Christ the Lord, who is the very Eternal Father. Amen."}]},"Alma 11:26–29, 38–39":{"ref":"Alma 11","verses":[{"v":26,"t":"And Zeezrom said unto him: Thou sayest there is a true and living God?"},{"v":27,"t":"And Amulek said: Yea, there is a true and living God."},{"v":28,"t":"Now Zeezrom said: Is there more than one God?"},{"v":29,"t":"And he answered, No."},{"v":38,"t":"Now Zeezrom saith again unto him: Is the Son of God the very Eternal Father?"},{"v":39,"t":"And Amulek said unto him: Yea, he is the very Eternal Father of heaven and of earth, and all things which in them are; he is the beginning and the end, the first and the last;"}]},"2 Nephi 31:21":{"ref":"2 Nephi 31","verses":[{"v":21,"t":"And now, behold, my beloved brethren, this is the way; and there is none other way nor name given under heaven whereby man can be saved in the kingdom of God. And now, behold, this is the doctrine of Christ, and the only and true doctrine of the Father, and of the Son, and of the Holy Ghost, which is one God, without end. Amen."}]},"Mormon 7:7":{"ref":"Mormon 7","verses":[{"v":7,"t":"And he hath brought to pass the redemption of the world, whereby he that is found guiltless before him at the judgment day hath it given unto him to dwell in the presence of God in his kingdom, to sing ceaseless praises with the choirs above, unto the Father, and unto the Son, and unto the Holy Ghost, which are one God, in a state of happiness which hath no end."}]},"3 Nephi 11:27":{"ref":"3 Nephi 11","verses":[{"v":27,"t":"And after this manner shall ye baptize in my name; for behold, verily I say unto you, that the Father, and the Son, and the Holy Ghost are one; and I am in the Father, and the Father in me, and the Father and I are one."}]},"Deuteronomy 6:4":{"ref":"Deuteronomy 6","verses":[{"v":4,"t":"Hear, O Israel: The LORD our God is one LORD:"}]},"Isaiah 43:10":{"ref":"Isaiah 43","verses":[{"v":10,"t":"Ye are my witnesses, saith the LORD, and my servant whom I have chosen: that ye may know and believe me, and understand that I am he: before me there was no God formed, neither shall there be after me."}]},"Isaiah 44:6–8":{"ref":"Isaiah 44","verses":[{"v":6,"t":"Thus saith the LORD the King of Israel, and his redeemer the LORD of hosts; I am the first, and I am the last; and beside me there is no God."},{"v":7,"t":"And who, as I, shall call, and shall declare it, and set it in order for me, since I appointed the ancient people? and the things that are coming, and shall come, let them shew unto them."},{"v":8,"t":"Fear ye not, neither be afraid: have not I told thee from that time, and have declared it? ye are even my witnesses. Is there a God beside me? yea, there is no God; I know not any."}]},"Isaiah 45:5":{"ref":"Isaiah 45","verses":[{"v":5,"t":"I am the LORD, and there is none else, there is no God beside me: I girded thee, though thou hast not known me:"}]},"John 10:30":{"ref":"John 10","verses":[{"v":30,"t":"I and my Father are one."}]},"1 Timothy 2:5":{"ref":"1 Timothy 2","verses":[{"v":5,"t":"For there is one God, and one mediator between God and men, the man Christ Jesus;"}]},"John 1:1, 14":{"ref":"John 1","verses":[{"v":1,"t":"In the beginning was the Word, and the Word was with God, and the Word was God."},{"v":14,"t":"And the Word was made flesh, and
