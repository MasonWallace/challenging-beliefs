<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>Challenging Beliefs — Mormonism, Examined Against the Bible</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --bg:#0f1116; --side:#0b0d11; --panel:#161a21; --panel2:#12151b; --line:#232833; --line2:#2b313d;
    --ink:#e7e9ec; --muted:#98a0ac; --dim:#565e6b; --gold:#82b1d8; --gold-ink:#0e1116;
    --red:#e0736a; --red-bg:#38221f; --red-cell:#5e2b27; --red-cell-hi:#8a3a32;
    --amber:#cf9a45; --amber-bg:#332a18; --amber-cell:#54431f; --amber-cell-hi:#7d6224;
    --green:#7fb08d; --green-bg:#1d2c26; --green-cell:#27443a;
    --purp:#b394e0; --purp-bg:#2c2440;
    --serif:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif;
    --sans:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  }
  :root[data-theme="light"]{
    --bg:#f3f4f6; --side:#e9ebee; --panel:#ffffff; --panel2:#f7f8fa; --line:#dfe2e7; --line2:#cfd4db;
    --ink:#1b1e23; --muted:#5c6470; --dim:#9aa1ab; --gold:#2f6b9e; --gold-ink:#ffffff;
    --red:#b03a31; --red-bg:#f6e4e2; --red-cell:#e7b6b1; --red-cell-hi:#cc766d;
    --amber:#8a5f0e; --amber-bg:#f3ecd9; --amber-cell:#e4d1a2; --amber-cell-hi:#c6a75e;
    --green:#3e7455; --green-bg:#e3ede6; --green-cell:#b7d1bf;
    --purp:#6b4fa1; --purp-bg:#ece5f6;
  }
  *{box-sizing:border-box}
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6}
  a{color:var(--gold)}
  button{font-family:inherit}
  mark{background:color-mix(in srgb,var(--amber) 30%,transparent);color:inherit;border-radius:2px;padding:0 2px}
  kbd{font-family:var(--mono);font-size:.72rem;background:var(--panel);border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;padding:1px 6px;color:var(--muted)}

  .app{display:grid;grid-template-columns:216px minmax(0,1fr) 280px;min-height:100vh}
  @media (max-width:1020px){.app{grid-template-columns:216px minmax(0,1fr)}.preview{display:none}}
  @media (max-width:720px){.app{grid-template-columns:1fr}.side{position:sticky;top:0;z-index:40;height:auto;border-right:0;border-bottom:1px solid var(--line)}
    .side .nav{display:flex;flex-wrap:wrap;gap:2px;padding:0 10px 10px}.side .nav h5{display:none}.side .sideprog{display:none}}

  /* sidebar */
  .side{background:var(--side);border-right:1px solid var(--line);padding:18px 0;position:sticky;top:0;height:100vh;overflow-y:auto}
  @media (max-width:720px){.side{height:auto;overflow:visible}}
  .logo{font-family:var(--serif);font-size:1rem;letter-spacing:.1em;padding:0 18px 14px;color:var(--ink)}
  .logo b{color:var(--gold)}
  .sidesearch{padding:0 14px 12px}
  .sidesearch input{width:100%;font-family:inherit;font-size:.82rem;padding:7px 12px;border-radius:8px;border:1px solid var(--line2);background:var(--panel);color:var(--ink)}
  .sidesearch input:focus{outline:2px solid var(--gold);outline-offset:1px}
  .info{display:inline-grid;place-items:center;width:14px;height:14px;border:1px solid currentColor;border-radius:50%;font-size:.58rem;font-style:normal;font-weight:700;opacity:.75;cursor:help;position:relative;flex:none}
  .info:hover,.info:focus{opacity:1}
  .info .tip{display:none;position:absolute;left:50%;transform:translateX(-50%);top:160%;width:250px;background:var(--side);color:var(--ink);border:1px solid var(--line2);font-family:var(--sans);font-size:.76rem;line-height:1.5;padding:9px 12px;border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.35);z-index:30;text-transform:none;letter-spacing:0;font-weight:400;text-align:left}
  .info:hover .tip,.info:focus .tip{display:block}
  .badge,.tag{display:inline-flex;align-items:center;gap:5px}
  .nav a{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 18px;font-size:.86rem;color:var(--muted);text-decoration:none;cursor:pointer;border-left:2px solid transparent}
  .nav a:hover{background:var(--panel2);color:var(--ink)}
  .nav a.on{background:var(--panel);color:var(--ink);border-left-color:var(--gold)}
  .nav .cnt{font-family:var(--mono);font-size:.68rem;color:var(--dim)}
  .nav h5{font-size:.64rem;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin:18px 18px 6px;font-weight:600}
  .sideprog{margin:22px 18px 8px;font-size:.72rem;color:var(--muted)}
  .pbar{height:4px;background:var(--line);border-radius:2px;margin-top:6px;overflow:hidden}
  .pbar i{display:block;height:100%;background:var(--gold);transition:width .4s ease}

  /* main */
  .main{padding:18px 26px 80px;min-width:0}
  .cmd{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line2);border-radius:8px;padding:4px 8px 4px 14px;margin-bottom:18px}
  .cmd input{flex:1;background:none;border:0;color:var(--ink);font-family:inherit;font-size:.9rem;padding:7px 0;outline:none}
  .cmd input::placeholder{color:var(--dim)}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:20px}
  .tile{background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:12px 14px;cursor:pointer;text-align:left;color:var(--ink)}
  .tile:hover{border-color:var(--gold)}
  .tile.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
  .tile .v{font-family:var(--serif);font-size:1.7rem;font-variant-numeric:tabular-nums;line-height:1.1}
  .tile .l{font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:2px}
  .tile.t-ad .v{color:var(--purp)}.tile.t-un .v{color:var(--red)}.tile.t-co .v{color:var(--amber)}.tile.t-an .v{color:var(--green)}
  h4.bt{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;font-weight:600}
  .vwall{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:10px;align-items:start}
  @media (max-width:1240px){.vwall{grid-template-columns:1fr 1fr}}
  @media (max-width:700px){.vwall{grid-template-columns:1fr}}
  .vcol{background:var(--panel2);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .vcol header{padding:14px 16px 12px;border-bottom:2px solid var(--line)}
  .vcol.ad header{border-bottom-color:var(--purp)}
  .vcol.ad .n,.vcol.ad .t{color:var(--purp)}
  .vcol.ad .vt:hover{border-left-color:var(--purp)}
  .vcol.un header{border-bottom-color:var(--red)}
  .vcol.co header{border-bottom-color:var(--amber)}
  .vcol.an header{border-bottom-color:var(--green)}
  .vcol header .n{font-family:var(--serif);font-size:1.9rem;line-height:1;font-variant-numeric:tabular-nums}
  .vcol.un .n{color:var(--red)}.vcol.co .n{color:var(--amber)}.vcol.an .n{color:var(--green)}
  .vcol header .t{font-size:.72rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;margin-left:8px}
  .vcol.un .t{color:var(--red)}.vcol.co .t{color:var(--amber)}.vcol.an .t{color:var(--green)}
  .vcol header .d{font-size:.74rem;color:var(--muted);margin-top:4px}
  .vgroup h6{font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:0;padding:10px 16px 4px;font-weight:600}
  .vt{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:9px 16px 9px 13px;cursor:pointer;color:var(--ink);border-left:3px solid transparent}
  .vt:hover,.vt.sel{background:var(--panel)}
  .vt.sel{border-left-color:var(--gold)}
  .vcol.un .vt:hover{border-left-color:var(--red)}
  .vcol.co .vt:hover{border-left-color:var(--amber)}
  .vcol.an .vt:hover{border-left-color:var(--green)}
  .vt.dimmed{opacity:.25}
  .vt h5{font-family:var(--serif);font-weight:500;font-size:.92rem;line-height:1.35;margin:0}
  .vt .m{font-size:.66rem;color:var(--dim);letter-spacing:.05em;text-transform:uppercase;margin-top:2px;display:flex;gap:8px;align-items:center}
  .vt .m .rd{color:var(--green)}
  .vt .m .star{color:var(--gold)}

  /* list */
  .rows{display:flex;flex-direction:column}
  .rowitem{display:grid;grid-template-columns:12px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:11px 6px;cursor:pointer;color:var(--ink)}
  .rowitem:hover,.rowitem.sel{background:var(--panel2)}
  .rowitem .stripe{width:4px;height:26px;border-radius:2px}
  .rowitem.v-unrefuted .stripe{background:var(--red)}
  .rowitem.v-contested .stripe{background:var(--amber)}
  .rowitem.v-answered .stripe{background:var(--green)}
  .rowitem h5{font-family:var(--serif);font-weight:500;font-size:1rem;margin:0;line-height:1.35}
  .rowitem .sub{font-size:.72rem;color:var(--muted)}
  .rowitem .meta{display:flex;gap:8px;align-items:center;font-size:.66rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;white-space:nowrap}
  .rowitem .meta .rd{color:var(--green)}

  .badge{font-size:.64rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:3px 9px;border-radius:999px;display:inline-block}
  .badge.v-admitted{background:var(--purp-bg);color:var(--purp)}
  .badge.v-unrefuted{background:var(--red-bg);color:var(--red)}
  .badge.v-contested{background:var(--amber-bg);color:var(--amber)}
  .badge.v-answered{background:var(--green-bg);color:var(--green)}
  .tag{font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line2);border-radius:999px;padding:2px 9px;display:inline-block}

  /* case view */
  .backbar{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
  .backbar button.bk{background:var(--panel);border:1px solid var(--line2);color:var(--muted);border-radius:8px;padding:6px 13px;font-size:.8rem;cursor:pointer}
  .backbar button.bk:hover{color:var(--ink);border-color:var(--gold)}
  .pathnext{margin-left:auto;background:var(--gold);color:var(--gold-ink);border:0;border-radius:8px;padding:7px 14px;font-size:.8rem;font-weight:700;cursor:pointer}
  .case h2{font-family:var(--serif);font-weight:500;font-size:1.6rem;line-height:1.25;margin:10px 0 14px;max-width:30ch;text-wrap:balance}
  .case .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
  .dlab{font-size:.7rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:26px 0 10px}
  .dlab.red{color:var(--red)}.dlab.blue{color:var(--gold)}
  .claimrow{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(270px,1fr);gap:28px;align-items:start}
  .claimrow.solo{grid-template-columns:1fr}
  @media (max-width:900px){.claimrow{grid-template-columns:1fr}}
  .claim p{font-size:.97rem;line-height:1.75;max-width:66ch;margin:0 0 12px}
  .claimside{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:16px 18px;position:sticky;top:16px}
  .claimside .passcols{grid-template-columns:1fr;gap:12px}
  .claimside .sidenote{font-size:.76rem;color:var(--dim);margin:-4px 0 12px}
  .defense p.lead{margin:0 0 4px}
  .defense p{line-height:1.7;margin:0 0 10px}
  .pts{margin:8px 0 0;padding:0;list-style:none;counter-reset:pt}
  .pts li{position:relative;padding:10px 0 10px 36px;border-top:1px dashed color-mix(in srgb,var(--green) 25%,var(--line));line-height:1.7}
  .pts li:first-child{border-top:0}
  .pts li::before{counter-increment:pt;content:counter(pt);position:absolute;left:0;top:10px;width:23px;height:23px;border-radius:50%;background:var(--green-bg);color:var(--green);display:grid;place-items:center;font-size:.72rem;font-weight:700}
  .vbox p{margin:0 0 8px;line-height:1.7}
  .vbox p:last-child{margin-bottom:0}
  .ref-lds{color:var(--red);font-weight:600}
  .ref-bib{color:var(--gold);font-weight:600}
  .qq{font-family:var(--serif);font-style:italic;background:color-mix(in srgb,var(--amber) 16%,transparent);border-radius:3px;padding:0 3px}
  .kw{font-weight:700;text-decoration:underline;text-underline-offset:2px}
  .talk{background:color-mix(in srgb,var(--green) 8%,var(--panel));border:1px solid color-mix(in srgb,var(--green) 30%,var(--line));border-radius:8px;padding:16px 18px;font-size:.93rem;max-width:80ch}
  .talk p{margin:0 0 8px;line-height:1.7}
  .talk p:last-child{margin-bottom:0}
  .corelinks{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .corelink{font-size:.78rem;background:var(--panel2);border:1px solid var(--line2);color:var(--gold);border-radius:999px;padding:5px 13px;cursor:pointer;text-align:left}
  .corelink:hover{border-color:var(--gold)}
  .gtab{width:100%;border-collapse:collapse;font-size:.86rem;margin:14px 0 6px}
  .gtab th{text-align:left;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:8px 12px;border-bottom:2px solid var(--line2)}
  .gtab th:nth-child(2){color:var(--red)}
  .gtab th:nth-child(3){color:var(--gold)}
  .gtab td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.55}
  .gtab td:first-child{font-weight:700;white-space:nowrap;color:var(--muted)}
  .dodont{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media (max-width:700px){.dodont{grid-template-columns:1fr}}
  .dodont ul{margin:8px 0 0;padding-left:18px;font-size:.86rem;color:var(--muted)}
  .dodont li{padding:3px 0;line-height:1.55}
  .why{background:color-mix(in srgb,var(--gold) 7%,var(--panel));border:1px solid color-mix(in srgb,var(--gold) 28%,var(--line));border-radius:8px;padding:16px 18px;font-size:.93rem;max-width:80ch}
  .why p{margin:0 0 10px;line-height:1.7}
  .why .wtail{color:var(--muted);font-style:italic;margin-bottom:0;border-top:1px dashed color-mix(in srgb,var(--gold) 30%,var(--line));padding-top:10px}
  .compare2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media (max-width:760px){.compare2{grid-template-columns:1fr}}
  .pane{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
  .pane .ref{font-size:.7rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
  .pane.bom .ref{color:var(--red)}.pane.bible .ref{color:var(--gold)}
  .pane .scripture{font-family:var(--serif);font-size:1rem;line-height:1.65}
  .cnote{font-size:.8rem;color:var(--muted);margin-top:8px;max-width:80ch}
  .passcols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media (max-width:760px){.passcols{grid-template-columns:1fr}}
  .passcols h6{font-size:.68rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin:0 0 8px}
  .passcols .h-bom{color:var(--red)}.passcols .h-bib{color:var(--gold)}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{font-size:.78rem;font-family:var(--serif);border:1px solid var(--line2);background:var(--panel);border-radius:6px;padding:4px 10px;cursor:pointer;color:var(--ink)}
  .chip:hover{border-color:var(--gold)}
  .chip.open{background:var(--amber-bg);border-color:var(--gold)}
  .chip.ext::after{content:" ↗";color:var(--muted);font-family:var(--sans);font-size:.68rem}
  .versebox{grid-column:1/-1;background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:8px;padding:14px 18px;margin-top:4px}
  .versebox .vr{font-size:.7rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-bottom:8px;display:flex;justify-content:space-between}
  .versebox .vr button{background:none;border:0;color:var(--muted);cursor:pointer;font-size:.8rem}
  .versebox .vtext{font-family:var(--serif);font-size:.98rem;line-height:1.7;max-width:72ch}
  .versebox .vnum{font-family:var(--sans);font-size:.62rem;color:var(--muted);vertical-align:super;margin-right:3px}
  .versebox .vwhy{margin-top:10px;font-size:.8rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px;max-width:76ch}
  .versebox .vwhy b{color:var(--gold)}
  .srcdet{margin-top:30px;border-top:1px solid var(--line);padding-top:14px}
  .srcdet summary{font-size:.74rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);cursor:pointer;list-style:none}
  .srcdet summary::before{content:"▸ ";color:var(--gold)}
  .srcdet[open] summary::before{content:"▾ "}
  .srcdet .srcs{margin-top:12px}
  .app.reading{grid-template-columns:216px minmax(0,1fr)}
  .app.reading .preview{display:none}
  body:has(.app.reading) .keysbar{right:0}
  .srcs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
  .srcs li{display:flex;gap:9px;align-items:baseline;font-size:.85rem}
  .sb{flex:none;font-size:.6rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;border-radius:4px;padding:2px 7px;position:relative;top:-1px}
  .sb-scholarly{background:var(--green-bg);color:var(--green)}
  .sb-apologetics{background:var(--amber-bg);color:var(--amber)}
  .sb-primary,.sb-institutional{background:color-mix(in srgb,var(--gold) 16%,transparent);color:var(--gold)}
  .sb-journalism{background:var(--panel);color:var(--muted);border:1px solid var(--line2)}
  .sb-testimony{background:var(--red-bg);color:var(--red)}
  .defense{background:color-mix(in srgb,var(--green) 7%,var(--panel));border:1px solid color-mix(in srgb,var(--green) 30%,var(--line));border-radius:8px;padding:16px 18px;font-size:.92rem;max-width:80ch}
  .defense .dsrc{font-size:.78rem;color:var(--muted);margin-top:10px}
  .vbox{display:flex;gap:12px;align-items:flex-start;border-radius:8px;padding:16px 18px;font-size:.92rem;max-width:80ch}
  .vbox.v-admitted{background:var(--purp-bg)}.vbox.v-unrefuted{background:var(--red-bg)}.vbox.v-contested{background:var(--amber-bg)}.vbox.v-answered{background:var(--green-bg)}
  .vbox b.vb{flex:none;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;padding-top:3px}
  .vbox.v-admitted b.vb{color:var(--purp)}.vbox.v-unrefuted b.vb{color:var(--red)}.vbox.v-contested b.vb{color:var(--amber)}.vbox.v-answered b.vb{color:var(--green)}
  .relrow{display:flex;gap:8px;flex-wrap:wrap}
  .relrow button{font-size:.78rem;background:var(--panel);border:1px solid var(--line2);color:var(--ink);border-radius:999px;padding:5px 13px;cursor:pointer}
  .relrow button:hover{border-color:var(--gold);color:var(--gold)}
  .pinbtn{background:none;border:1px dashed var(--line2);color:var(--muted);border-radius:8px;padding:7px 14px;font-size:.8rem;cursor:pointer}
  .pinbtn:hover{border-color:var(--gold);color:var(--gold)}
  .pinbtn.pinned{border-style:solid;border-color:var(--gold);color:var(--gold)}

  /* glossary tooltip */
  .g{border-bottom:2px dotted var(--gold);cursor:help;position:relative}
  .g .gt{display:none;position:absolute;left:0;top:140%;width:270px;background:var(--side);color:var(--ink);border:1px solid var(--line2);font-family:var(--sans);font-size:.78rem;line-height:1.5;padding:10px 13px;border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.35);z-index:20;font-style:normal;font-weight:400}
  .g:hover .gt,.g:focus .gt{display:block}
  .g .gt b{color:var(--gold)}

  /* preview */
  .preview{background:var(--panel2);border-left:1px solid var(--line);padding:20px 18px;position:sticky;top:0;height:100vh;overflow-y:auto}
  .preview h5.pt{font-family:var(--serif);font-weight:500;font-size:1.05rem;line-height:1.35;margin:10px 0}
  .preview p{font-size:.78rem;color:var(--muted);margin:0 0 12px}
  .preview .go{display:inline-block;font-size:.78rem;color:var(--gold-ink);background:var(--gold);border:0;border-radius:6px;padding:7px 14px;cursor:pointer;font-weight:700}
  .preview h6{font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:20px 0 6px}
  .preview .rr{font-size:.78rem;color:var(--ink);padding:6px 0;border-top:1px solid var(--line);display:block;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%;cursor:pointer}

const DATA=[










{"id":"kjv-isaiah-block-quotation","category":"kjv-dependence","severity":"high","verdict":"unrefuted","title":"Isaiah chapters reproduced verbatim in King James English","claim":"Roughly 21 chapters of Isaiah appear in the Book of Mormon in wording overwhelmingly identical to the King James Version of 1611/1769, despite the claim that the text was independently translated from 6th-century BC plates written in 'reformed Egyptian.' Royal Skousen's own critical-text work confirms the quotations match the standard later KJV printings (not even the 1611 original), demonstrating dependence on a contemporary printed English Bible rather than an independent rendering of a Hebrew source. Where the Book of Mormon does vary from the KJV, the variants rarely reflect superior Hebrew readings.","bom":["1 Nephi 20–21","2 Nephi 7–8","2 Nephi 12–24","2 Nephi 27","Mosiah 14","3 Nephi 22"],"bible":["Isaiah 48–49","Isaiah 50–51","Isaiah 2–14","Isaiah 29","Isaiah 53","Isaiah 54"],"sources":[{"name":"David P. Wright, 'Isaiah in the Book of Mormon: Or Joseph Smith in Isaiah' (American Apocrypha, Signature Books, 2002)","type":"scholarly","url":"https://user.xmission.com/~research/central/isabm2.html"},{"name":"Royal Skousen, The History of the Text of the Book of Mormon, Part 5: The King James Quotations (2019), summarized at BYU Studies","type":"scholarly","url":"https://byustudies.byu.edu/article/royal-skousens-book-of-mormon-critical-text-project"},{"name":"LDS Discussions, 'The King James Bible and the Book of Mormon'","type":"primary","url":"https://www.ldsdiscussions.com/kjv"}],"response":"FAIR and Skousen argue the translation was not a word-for-word rendering of the plates: when the underlying record paralleled the biblical text, the familiar KJV wording was given (either by Joseph consulting a Bible or, in Skousen's tight-control model, by revelation supplying KJV-style text), so KJV wording is a feature of the translation, not evidence against an ancient source. Skousen further argues some Book of Mormon Isaiah variants reflect Early Modern English textual streams rather than copying.","responseSource":{"name":"FAIR, 'Isaiah and the Book of Mormon'","url":"https://www.fairlatterdaysaints.org/answers/Isaiah_and_the_Book_of_Mormon"},"rationale":"The core datum — that the English text derives from the KJV, including its post-1611 printing conventions — is conceded by the leading LDS textual scholar (Skousen); apologetic responses reinterpret the dependence rather than rebut it."},
{"id":"kjv-italics-revision","category":"kjv-dependence","severity":"high","verdict":"unrefuted","title":"Book of Mormon Isaiah variants cluster on KJV italicized words","claim":"The KJV printed in italics words its translators supplied that had no equivalent in the Hebrew — a typographic artifact of the 1611 English edition. David Wright showed that a conservative 22–38% of all Book of Mormon Isaiah variants from the KJV occur at or around these italicized words, and about 40% of KJV-italicized words are simply dropped, sometimes producing readings that are ungrammatical or contrary to the Hebrew. Since italics exist only on the printed English page, this pattern indicates the reviser was working from an open King James Bible, not an ancient Hebrew text.","bom":["2 Nephi 12:16","2 Nephi 16:2","2 Nephi 19:1","2 Nephi 12–24 (variant pattern)"],"bible":["Isaiah 2:16","Isaiah 6:2","Isaiah 9:1"],"sources":[{"name":"David P. Wright, 'Isaiah in the Book of Mormon: Or Joseph Smith in Isaiah' (American Apocrypha, 2002)","type":"scholarly","url":"https://user.xmission.com/~research/central/isabm2.html"},{"name":"Dialogue: 'Joseph Smith's Interpretation of Isaiah in the Book of Mormon'","type":"scholarly","url":"https://www.dialoguejournal.com/articles/joseph-smiths-interpretation-of-isaiah-in-the-book-of-mormon/"}],"response":"Stan Spencer (Interpreter Foundation) accepts the correlation but argues Joseph Smith, as an 'unlearned reader,' treated the visually distinct italicized words as suspect and revised around them while dictating, which is compatible with a revealed base-text model; FAIR similarly argues the italics marked genuinely weaker text that a prophetic revision would naturally target.","responseSource":{"name":"Stan Spencer, 'Missing Words: King James Bible Italics…', Interpreter","url":"https://interpreterfoundation.org/journal/missing-words-king-james-bible-italics-the-translation-of-the-book-of-mormon-and-joseph-smith-as-an-unlearned-reader"},"rationale":"Both critical and apologetic literature now agree the variants target the KJV's italics — a purely typographic feature of a 19th-century printed Bible; the rebuttals concede the dependence and offer only a reframing, and cases where italics-deletion damages the sense against the Hebrew remain unanswered."},
{"id":"kjv-translation-errors-copied","category":"kjv-dependence","severity":"high","verdict":"unrefuted","title":"KJV mistranslations and translation artifacts reproduced verbatim","claim":"The Book of Mormon reproduces specific KJV translation errors that a translation from an independent Hebrew source would not contain: e.g., 'and upon all the glory shall be a defence' (2 Nephi 14:5, where Hebrew chuppah means 'canopy'), 'make him of quick understanding' (2 Nephi 21:3, misrendering Hebrew 'his delight shall be in the fear of the LORD'), and the KJV's incorrect double plurals 'seraphims'/'cherubims' (2 Nephi 16:2). These are artifacts of the 1611 translators' English, not of any ancient text.","bom":["2 Nephi 14:5","2 Nephi 16:2","2 Nephi 21:3","Mosiah 14"],"bible":["Isaiah 4:5","Isaiah 6:2","Isaiah 11:3","Isaiah 53"],"comparison":{"left":{"ref":"2 Nephi 14:5 (Book of Mormon)","text":"And the Lord will create upon every dwelling-place of mount Zion, and upon her assemblies, a cloud and smoke by day and the shining of a flaming fire by night; for upon all the glory of Zion shall be a defence."},"right":{"ref":"Isaiah 4:5 (KJV, 1611)","text":"And the LORD will create upon every dwelling place of mount Zion, and upon her assemblies, a cloud and smoke by day, and the shining of a flaming fire by night: for upon all the glory shall be a defence."},"hl":["shall be a defence","a cloud and smoke by day","shining of a flaming fire by night"],"note":"'Defence' is the KJV translators' misreading of Hebrew chuppah ('canopy, bridal chamber') — an error of 1611 English, reproduced on plates allegedly written centuries before English existed."},"sources":[{"name":"David P. Wright, 'Isaiah in the Book of Mormon' (American Apocrypha, 2002)","type":"scholarly","url":"https://user.xmission.com/~research/central/isabm2.html"},{"name":"Grant H. Palmer, An Insider's View of Mormon Origins (Signature Books, 2002), ch. 3","type":"scholarly","url":"https://archive.org/details/insidersviewofmo0000palm"},{"name":"LDS Discussions, 'The King James Bible and the Book of Mormon'","type":"primary","url":"https://www.ldsdiscussions.com/kjv"}],"response":"FAIR argues that a 'functional' translation intended for a KJV-reading audience acceptably retains familiar KJV phrasing even where imperfect, that some alleged errors are defensible renderings of ambiguous Hebrew, and that God communicates 'after the manner of their language' (D&C 1:24); the errors therefore belong to the English translation layer, not the plates.","responseSource":{"name":"FAIR, 'KJV translation errors in the Book of Mormon'","url":"https://www.fairlatterdaysaints.org/answers/KJV_translation_errors_in_the_Book_of_Mormon"},"rationale":"The presence of KJV-specific translation artifacts is conceded; the defense relocates them to a divine-translation convention rather than showing the readings are not KJV errors, and no variant systematically corrects the KJV toward the Hebrew."},
{"id":"deutero-isaiah-problem","category":"deutero-isaiah","severity":"high","verdict":"unrefuted","featured":true,"title":"Isaiah chapters written after Lehi left Jerusalem appear in the Book of Mormon","claim":"Critical scholarship since the late 18th century holds on cumulative linguistic, historical, and theological grounds that Isaiah 40–55 was composed by an anonymous exilic author c. 545–539 BC (it presupposes the Babylonian exile and names Cyrus), with chapters 56–66 later still. The Book of Mormon has Nephi, Jacob, and Abinadi quoting extensively from these chapters off brass plates obtained in Jerusalem c. 600 BC — decades before the material existed. This is a hard chronological contradiction, not merely a translation-language issue.","bom":["1 Nephi 20–21","2 Nephi 7–8","2 Nephi 9:50–51","Mosiah 14","3 Nephi 20:32–45","3 Nephi 22"],"bible":["Isaiah 48–49","Isaiah 50–52","Isaiah 53","Isaiah 54","Isaiah 55:1–2"],"comparison":{"left":{"ref":"Mosiah 14:5 — Abinadi, c. 148 BC","text":"But he was wounded for our transgressions, he was bruised for our iniquities; the chastisement of our peace was upon him; and with his stripes we are healed."},"right":{"ref":"Isaiah 53:5 (KJV) — exilic, c. 540 BC","text":"But he was wounded for our transgressions, he was bruised for our iniquities: the chastisement of our peace was upon him; and with his stripes we are healed."},"hl":["wounded for our transgressions","bruised for our iniquities","chastisement of our peace","with his stripes we are healed"],"note":"Abinadi's entire sermon is built on Isaiah 53 — a chapter mainstream scholarship dates decades after Lehi's party left Jerusalem with the brass plates."},"sources":[{"name":"Colby Townsend, '\"The Robe of Righteousness\": Exilic and Post-Exilic Isaiah in the Book of Mormon,' Dialogue 55:1 (2022)","type":"scholarly","url":"https://www.dialoguejournal.com/articles/the-robe-of-righteousness-exilic-and-post-exilic-isaiah-in-the-book-of-mormon/"},{"name":"David P. Wright, 'Isaiah in the Book of Mormon' (American Apocrypha, 2002)","type":"scholarly","url":"https://user.xmission.com/~research/central/isabm2.html"},{"name":"LDS Discussions, 'Deutero-Isaiah in the Book of Mormon'","type":"primary","url":"https://www.ldsdiscussions.com/deuteroisaiah"},{"name":"Mormonr, 'Deutero-Isaiah' (LDS-side documentation of the problem)","type":"apologetics","url":"https://mormonr.org/qnas/y7pqob/deutero_isaiah"}],"response":"The strongest LDS responses take two lines: (1) Kevin Barney and FAIR grant the critical consensus and propose the Deutero-Isaiah material entered during translation — Joseph rendered Nephite themes using the KJV Isaiah familiar to his audience; (2) other apologists (following conservative evangelical scholarship) defend single authorship or argue a pre-exilic core of Isaiah 40–55 could have existed by 600 BC, noting Deutero-Isaiah dating rests partly on naturalistic assumptions about predictive prophecy.","responseSource":{"name":"FAIR, 'Deutero-Isaiah in the Book of Mormon?'","url":"https://www.fairlatterdaysaints.org/archive/publications/deutero-isaiah-in-the-book-of-mormon"},"rationale":"The exilic dating of Isaiah 40–55 is among the most secure conclusions in Hebrew Bible scholarship and is accepted by trained LDS biblicists (e.g., David Bokovoy); the available defenses either reject that consensus or concede it and relocate the material to Joseph Smith's translation — conceding the plates could not have contained it as narrated (Abinadi's sermon is built on Isaiah 53)."},
{"id":"sermon-on-mount-3-nephi","category":"nt-anachronism","severity":"high","verdict":"contested","title":"Sermon on the Mount in 3 Nephi follows late KJV/Byzantine readings","claim":"3 Nephi 12–14 reproduces Matthew 5–7 in nearly verbatim KJV English. Stan Larson identified eight passages where 3 Nephi follows readings of the late Greek manuscripts underlying the KJV that text-critical scholarship judges secondary — most notably the doxology 'For thine is the kingdom, and the power, and the glory, forever' (3 Nephi 13:13 = Matthew 6:13, absent from the earliest witnesses) and 'openly' in 3 Nephi 13:4, 6, 18 (Matthew 6:4, 6, 18). A genuine independent record of Jesus' New World sermon should not track scribal accretions of the 4th–16th centuries.","bom":["3 Nephi 12–14","3 Nephi 13:13","3 Nephi 13:4,6,18","3 Nephi 12:27","3 Nephi 12:44"],"bible":["Matthew 5–7","Matthew 6:13","Matthew 6:4,6,18","Matthew 5:27","Matthew 5:44"],"comparison":{"left":{"ref":"3 Nephi 13:13 — Jesus in America, c. AD 34","text":"And lead us not into temptation, but deliver us from evil. For thine is the kingdom, and the power, and the glory, forever. Amen."},"right":{"ref":"Matthew 6:13 (KJV — late Byzantine reading)","text":"And lead us not into temptation, but deliver us from evil: For thine is the kingdom, and the power, and the glory, for ever. Amen."},"hl":["For thine is the kingdom, and the power, and the glory"],"note":"The doxology is absent from the earliest Greek manuscripts (Sinaiticus, Vaticanus) — text critics judge it a later scribal addition, yet the resurrected Jesus in America speaks it in its KJV form."},"sources":[{"name":"Stan Larson, 'The Historicity of the Matthean Sermon on the Mount in 3 Nephi,' in New Approaches to the Book of Mormon (Signature Books, 1993)","type":"scholarly","url":"https://thoughtsonthingsandstuff.com/track-changes-the-sermon-on-the-mount-book-of-mormon-vs-new-testament/"},{"name":"Grant H. Palmer, An Insider's View of Mormon Origins, ch. 3","type":"scholarly","url":"https://archive.org/details/insidersviewofmo0000palm"}],"response":"John W. Welch (BYU) responded at length: several of Larson's eight variants are text-critically uncertain rather than settled; 3 Nephi's omission of 'without a cause' (3 Nephi 12:22 vs Matthew 5:22 KJV) actually agrees with the earliest manuscripts against the KJV; and the KJV wording elsewhere reflects the translation register rather than the underlying Nephite record, with 3 Nephi's deliberate contextual adaptations showing it is not mechanical copying.","responseSource":{"name":"John W. Welch, Illuminating the Sermon at the Temple and Sermon on the Mount (FARMS/Maxwell Institute)","url":"https://mi.byu.edu/illuminating-the-sermon-at-the-temple-sermon-on-the-mount"},"rationale":"Welch's rebuttal substantively engages the variants and the 'without a cause' omission is a genuine counter-datum, but the doxology and 'openly' readings remain best explained by KJV dependence; scholars genuinely dispute the individual cases while the overall KJV-register dependence is not in doubt."},
{"id":"nt-phrasing-in-preexilic-books","category":"nt-anachronism","severity":"high","verdict":"unrefuted","title":"Pervasive New Testament phrasing in allegedly pre-Christian Nephite texts","claim":"Books set 600–100 BC are saturated with distinctive KJV New Testament phraseology: Nephi echoes Paul ('O wretched man that I am,' 2 Nephi 4:17 = Romans 7:24; 'to be carnally-minded is death,' 2 Nephi 9:39 = Romans 8:6), quotes Peter's Acts 3:22–23 paraphrase of Deuteronomy 18 (1 Nephi 22:20), and Alma echoes John the Baptist (Alma 5:52 = Matthew 3:10). Moroni 7:45–47 tracks 1 Corinthians 13:4–8 and Moroni 10:8–17 tracks 1 Corinthians 12:4–11 nearly verbatim. BYU professor Nicholas Frederick has catalogued roughly 650 NT phrases woven through the text — language that did not exist before the first-century Greek documents it comes from.","bom":["2 Nephi 4:17","2 Nephi 9:39","1 Nephi 22:20","Alma 5:52","Moroni 7:45–47","Moroni 10:8–17"],"bible":["Romans 7:24","Romans 8:6","Acts 3:22–23","Matthew 3:10","1 Corinthians 13:4–8","1 Corinthians 12:4–11"],"comparison":{"left":{"ref":"Moroni 7:45 — Nephite record, c. AD 400","text":"And charity suffereth long, and is kind, and envieth not, and is not puffed up, seeketh not her own, is not easily provoked, thinketh no evil, and rejoiceth not in iniquity but rejoiceth in the truth, beareth all things, believeth all things, hopeth all things, endureth all things."},"right":{"ref":"1 Corinthians 13:4–7 (KJV) — Paul, c. AD 55","text":"Charity suffereth long, and is kind; charity envieth not; charity vaunteth not itself, is not puffed up, doth not behave itself unseemly, seeketh not her own, is not easily provoked, thinketh no evil; rejoiceth not in iniquity, but rejoiceth in the truth; beareth all things, believeth all things, hopeth all things, endureth all things."},"hl":["suffereth long, and is kind","envieth not","is not puffed up","seeketh not her own","is not easily provoked","thinketh no evil","rejoiceth in the truth","beareth all things, believeth all things, hopeth all things, endureth all things"],"note":"Mormon's sermon tracks Paul's Greek epistle phrase-for-phrase in its distinctive KJV English rendering — including word choices unique to the 1611 translators."},"sources":[{"name":"Nicholas J. Frederick, The Bible, Mormon Scripture, and the Rhetoric of Allusivity (Fairleigh Dickinson UP, 2016)","type":"scholarly","url":"https://byustudies.byu.edu/article/the-bible-mormon-scripture-and-the-rhetoric-of-allusivity"},{"name":"Frederick interview (LDS Perspectives): ~650 NT phrases in the Book of Mormon","type":"scholarly","url":"https://faenrandir.github.io/a_careful_examination/nt-in-bom-lhales-interview-frederick/"},{"name":"Grant H. Palmer, An Insider's View of Mormon Origins, chs. 3–4","type":"scholarly","url":"https://archive.org/details/insidersviewofmo0000palm"}],"response":"FAIR and Frederick argue the NT language belongs to the translation, not the plates: Joseph Smith (or a revealed translation targeting 1820s Bible readers) expressed Nephite concepts in the scriptural idiom his audience knew, just as the KJV NT itself renders ideas with shared covenant vocabulary; some parallels may also reflect common Old World sources or genuinely parallel revelation of the same gospel to pre-Christian prophets.","responseSource":{"name":"FAIR, response to An Insider's View of Mormon Origins","url":"https://www.fairlatterdaysaints.org/answers/Criticism_of_Mormonism/Books/An_Insider's_View_of_Mormon_Origins"},"rationale":"The datum is conceded even at BYU — hundreds of distinctively New Testament phrases pervade the text; the translation-idiom defense does not rebut the dependence but concedes the English text is not a literal rendering of an ancient record, and it strains where NT passages structure whole sermons."},
{"id":"hebrews-in-alma-12-13","category":"nt-anachronism","severity":"medium","verdict":"contested","title":"Alma 12–13 structured on the Epistle to the Hebrews","claim":"David Wright demonstrated that Alma's sermon (c. 82 BC) on priesthood 'after the order of the Son,' Melchizedek, and entering God's 'rest' reproduces the distinctive argument sequence, exegetical moves, and KJV wording of Hebrews 3:7–4:11 and 7:1–4 — including elements scholars regard as the author of Hebrews' own creative synthesis of Genesis 14 and Psalm 110, which no pre-Christian source contained. Alma 13:17–19's Melchizedek summary tracks Hebrews 7:1–4 closely.","bom":["Alma 12:9–37","Alma 13:1–20","Alma 13:17–19"],"bible":["Hebrews 3:7–4:11","Hebrews 5:6–10","Hebrews 7:1–4","Psalm 110:4","Genesis 14:18–20"],"sources":[{"name":"David P. Wright, '\"In Plain Terms That We May Understand\": Joseph Smith's Transformation of Hebrews in Alma 12–13,' in New Approaches to the Book of Mormon (Signature Books, 1994)","type":"scholarly","url":"https://en.wikipedia.org/wiki/David_P._Wright"},{"name":"Book of Mormon Origins commentary on Alma 13 (documents the parallels)","type":"primary","url":"https://www.bookofmormonorigins.com/content/alma/chapter_13.html"}],"response":"John W. Welch and FARMS reviewers argued Alma 13 and Hebrews could draw independently on older Melchizedek traditions (attested in Second Temple texts like 11QMelchizedek and Genesis Apocryphon), that the shared KJV wording is translation register, and that Alma's treatment diverges from Hebrews in emphasis (repentance and ordination vs. Christ's superiority), which dependence would not predict.","responseSource":{"name":"John W. Welch, 'The Melchizedek Material in Alma 13' (FARMS); FAIR review of New Approaches","url":"https://www.fairlatterdaysaints.org/answers/Criticism_of_Mormonism/Books/An_Insider's_View_of_Mormon_Origins"},"rationale":"Wright's verbal and structural case is detailed and has not been dismantled, but the common-tradition hypothesis is a substantive (if manuscript-unsupported) alternative that does not simply concede dependence; the dispute is genuine though the parallels favor Wright."},
{"id":"mark-long-ending-mormon-9","category":"nt-anachronism","severity":"medium","verdict":"contested","title":"Moroni quotes the disputed 'long ending' of Mark","claim":"Mormon 9:22–24 has the resurrected Jesus commissioning the Nephite disciples in words nearly identical to Mark 16:15–18 KJV — the 'long ending' of Mark, which is absent from the earliest Greek manuscripts (Sinaiticus, Vaticanus) and is judged by mainstream textual criticism to be a second-century scribal addition. The Book of Mormon thus attributes to Jesus in America a saying that, per the scholarly consensus, entered Mark's text after the first century.","bom":["Mormon 9:22–24","Ether 4:18"],"bible":["Mark 16:15–18"],"comparison":{"left":{"ref":"Mormon 9:22–24 — Moroni, c. AD 400","text":"Go ye into all the world, and preach the gospel to every creature; and he that believeth and is baptized shall be saved, but he that believeth not shall be damned; and these signs shall follow them that believe — in my name shall they cast out devils; they shall speak with new tongues; they shall take up serpents; and if they drink any deadly thing it shall not hurt them."},"right":{"ref":"Mark 16:15–18 (KJV — the disputed 'long ending')","text":"Go ye into all the world, and preach the gospel to every creature. He that believeth and is baptized shall be saved; but he that believeth not shall be damned. And these signs shall follow them that believe; In my name shall they cast out devils; they shall speak with new tongues; they shall take up serpents; and if they drink any deadly thing, it shall not hurt them."},"hl":["Go ye into all the world, and preach the gospel to every creature","believeth and is baptized shall be saved","cast out devils","speak with new tongues","take up serpents","drink any deadly thing"],"note":"The earliest manuscripts of Mark end at 16:8; most text critics judge vv. 9–20 a second-century addition."},"sources":[{"name":"Grant H. Palmer, An Insider's View of Mormon Origins, ch. 3","type":"scholarly","url":"https://archive.org/details/insidersviewofmo0000palm"},{"name":"LDS Discussions, 'The Long Ending of Mark and the Book of Mormon'","type":"primary","url":"https://www.ldsdiscussions.com/mark"}],"response":"Book of Mormon Central (KnoWhy #522) responds that a minority of credentialed non-LDS scholars (Nicholas Lunn, James Snapp) defend the long ending's authenticity on patristic and internal grounds; alternatively, even if Mark 16:9–20 is secondary, Moroni's source was the Nephite record of Christ's words, and the KJV phrasing is translation register — the resurrected Lord could have given the same commission in both hemispheres.","responseSource":{"name":"Book of Mormon Central, KnoWhy #522","url":"https://scripturecentral.org/knowhy/why-does-part-of-the-long-ending-of-mark-show-up-in-the-book-of-mormon"},"rationale":"The apologetic depends on a minority text-critical position, but that position has genuine published non-LDS defenders, so the underlying question (is the long ending authentic?) is disputed; under the majority view the criticism stands unanswered."},
{"id":"horses-anachronism","category":"cultural-anachronism","severity":"high","verdict":"unrefuted","title":"Horses (and chariots) in pre-Columbian America","claim":"The Book of Mormon repeatedly describes horses among Jaredites and Nephites (c. 2500 BC – AD 400), including horses harnessed to 'chariots.' Equids went extinct in the Americas at the end of the Pleistocene (~10,000 BC) and were reintroduced by the Spanish in the 16th century; no verified pre-Columbian Holocene horse remains, depictions, or loanwords exist despite extensive archaeological and paleontological sampling. Related Old World fauna the text names — cattle, oxen, asses, swine, elephants (Ether 9:19) — face the same null record.","bom":["1 Nephi 18:25","Enos 1:21","Alma 18:9–12","3 Nephi 3:22","Ether 9:19"],"bible":[],"sources":[{"name":"Michael D. Coe, 'Mormons and Archaeology: An Outside View,' Dialogue 8:2 (1973); Mormon Stories interviews (2011, 2018)","type":"scholarly","url":"https://www.mormonstories.org/dr-michael-coe/"},{"name":"Mormonr, 'Anachronisms in the Book of Mormon' (documents the state of evidence)","type":"apologetics","url":"https://mormonr.org/qnas/pLBiLb/anachronisms_in_the_book_of_mormon"}],"response":"Book of Mormon Central and FAIR offer three lines: 'horse' may be a loanshift — Joseph's translation applying a familiar label to a native animal (deer or tapir), as Spaniards and natives did with unfamiliar fauna; small relict horse populations may have survived into Book of Mormon times undetected (candidate late-dated remains have been tested, e.g., by Wade Miller); and absence of evidence is weak in tropical taphonomic conditions.","responseSource":{"name":"Book of Mormon Central, KnoWhy: 'Why Are Horses Mentioned in the Book of Mormon?'","url":"https://scripturecentral.org/knowhy/why-are-horses-mentioned-in-the-book-of-mormon"},"rationale":"No verified pre-Columbian Holocene horse has been produced (radiocarbon tests of candidate remains have come back Pleistocene or post-contact), and the loanshift defense concedes the core point that no actual horses were present; the text's horses-with-chariots imagery resists the tapir substitution."},
{"id":"steel-and-ferrous-metallurgy","category":"cultural-anachronism","severity":"high","verdict":"unrefuted","title":"Steel and an iron industry in the pre-Columbian New World","claim":"The Book of Mormon describes New World steel and iron working: Nephi's 'bow of steel' carried from Arabia, Nephites teaching the making of 'steel' and working 'in all manner of iron' (c. 590–400 BC), and Jaredite steel swords. Archaeology finds no ferrous metallurgy anywhere in pre-Columbian Mesoamerica — no smelting sites, slag, tools, or iron/steel weapons; metallurgy of any kind appears in Mesoamerica only c. AD 600–800 and never included iron smelting.","bom":["1 Nephi 4:9","1 Nephi 16:18","2 Nephi 5:15","Jarom 1:8","Ether 7:9"],"bible":[],"sources":[{"name":"Michael D. Coe, 'Mormons and Archaeology: An Outside View,' Dialogue 8:2 (1973)","type":"scholarly","url":"https://www.mormonstories.org/dr-michael-coe/"},{"name":"Deanne G. Matheny, 'Does the Shoe Fit? A Critique of the Limited Tehuantepec Geography,' in New Approaches to the Book of Mormon (1993)","type":"scholarly","url":"https://en.wikipedia.org/wiki/An_Insider's_View_of_Mormon_Origins"}],"response":"For the Old World references, apologists point to the Vered Jericho carburized-steel sword (c. 620 BC, Israel Museum) showing 'most precious steel' was real in Lehi's Jerusalem — a genuine vindication. For the New World, FAIR argues 'steel' in KJV English can mean any hardened metal (as KJV 'steel' renders Hebrew 'bronze'), that Mesoamericans did work meteoric iron, and that limited-scale Nephite metallurgy could have left little trace and its terminology be a loanshift.","responseSource":{"name":"FAIR, 'Book of Mormon/Metals/Steel'; Book of Mormon Central, 'Laban's Steel Sword'","url":"https://www.fairlatterdaysaints.org/answers/Book_of_Mormon/Metals/Steel"},"rationale":"The Old World steel references are genuinely answered (Vered Jericho sword), but the distinct core claim — a Nephite/Jaredite iron-and-steel industry in the Americas — has zero archaeological support and the semantic-loanshift defense concedes no actual steel existed while the text describes teaching its manufacture."},
{"id":"wheat-barley-silk","category":"cultural-anachronism","severity":"medium","verdict":"contested","title":"Old World crops and fabrics: wheat, barley, silk","claim":"The Book of Mormon describes Nephites and Jaredites cultivating wheat and barley and producing silk. Old World wheat (Triticum), barley (Hordeum vulgare), and silkworm sericulture are absent from the pre-Columbian archaeological and botanical record; New World agriculture centered on maize, beans, and squash. Barley and wheat are also embedded in the text's Mosaic-law economic system (Alma 11's measures — a weights system, not coins; the 'coins' chapter heading was a 20th-century editorial addition, since corrected).","bom":["Mosiah 9:9","Alma 11:7,15","Alma 1:29","Ether 9:17","Ether 10:24"],"bible":[],"sources":[{"name":"Michael D. Coe, Dialogue 8:2 (1973) and subsequent interviews","type":"scholarly","url":"https://www.mormonstories.org/dr-michael-coe/"},{"name":"Debunking-CES-Letter (apologetic) and CES Letter exchange documenting the dispute","type":"primary","url":"https://debunking-cesletter.com/book-of-mormon-1/anachronisms/"}],"response":"Apologists note that domesticated little barley (Hordeum pusillum), unknown to scholarship in 1830, has since been confirmed as a cultivated pre-Columbian North American grain — showing 'barley' is no longer a clean anachronism; 'wheat' and 'silk' are defended as loanshifts to comparable native grains (e.g., amaranth) and fine indigenous fibers (kapok, wild-silk textiles attested in Mesoamerica).","responseSource":{"name":"FAIR, 'Principles for assessing anachronisms'","url":"https://www.fairlatterdaysaints.org/answers/Principles_for_assessing_anachronisms"},"rationale":"The little-barley find gives the apologetic case real (if species-shifted) traction on barley, and wild-silk textiles are attested; but Old World wheat remains wholly unattested and the loanshift defense again concedes the named referents were absent, so the dispute is genuine but asymmetric."},
{"id":"greek-names-timothy-lachoneus","category":"cultural-anachronism","severity":"low","verdict":"contested","title":"Greek names and Greek-alphabet expressions in a Hebrew-Egyptian colony","claim":"The Book of Mormon contains Greek personal names — Timothy and Jonas (3 Nephi 19:4), Lachoneus ('the Laconian,' 3 Nephi 1:1) — and the resurrected Jesus calls himself 'Alpha and Omega' (3 Nephi 9:18), an expression dependent on the Greek alphabet and drawn from Revelation 1:8. A colony descended from 600 BC Jerusalemites writing 'reformed Egyptian' with no Greek contact should not produce Greek onomastics or alphabet idioms.","bom":["3 Nephi 1:1","3 Nephi 19:4","3 Nephi 9:18"],"bible":["Revelation 1:8"],"sources":[{"name":"Ricks/Nibley exchange records (B.H. Roberts Foundation)","type":"primary","url":"https://bhroberts.org/records/DwDHzj-0vXyI7/stephen_d_ricks_et_al_discusses_the_appearance_of_the_greek_names_jonas_lachoneus_and_timothy_in_the_book_of_mormon"},{"name":"Grant H. Palmer, An Insider's View of Mormon Origins","type":"scholarly","url":"https://archive.org/details/insidersviewofmo0000palm"}],"response":"Hugh Nibley and Stephen Ricks argue Greek presence in Lehi's world is historically demonstrable: from the mid-7th century BC, Ionian and Carian mercenaries and traders served Egypt (Necho II's army) and operated across the Levant, so Greek names could enter Lehite or especially Mulekite tradition; alternatively 'Timothy'/'Jonas' and 'Alpha and Omega' may be translator's substitutions of equivalent Nephite names and idioms for English readers.","responseSource":{"name":"FAIR, 'What is known about the name Lachoneus in the Book of Mormon?'","url":"https://www.fairlatterdaysaints.org/answers/Question:_What_is_known_about_the_name_%22Lachoneus%22_in_the_Book_of_Mormon%3F"},"rationale":"The mercenary-contact response rests on real history (Greeks in 7th-century BC Egypt/Levant) and translation-substitution is coherent for 'Alpha and Omega,' but 'Lachoneus' as a personal name and the Revelation-matching phrasing still fit 19th-century composition more naturally; neither side has a decisive case."},
{"id":"church-bible-synagogue-terms","category":"cultural-anachronism","severity":"low","verdict":"contested","title":"Anachronistic institutional terms: 'church,' 'synagogue,' 'Bible'","claim":"The text uses 'church' of 600 BC Jerusalem (1 Nephi 4:26) and of formal pre-Christian Nephite institutions, 'synagogues' before the institution's post-exilic development (2 Nephi 26:26; Alma 16:13), and has Nephi prophetically using the word 'Bible' (2 Nephi 29:3–10) — a term derived from Greek biblia and first applied to the scriptural codex centuries after Christ — in a passage that anticipates and rebuts 19th-century objections ('A Bible! A Bible! We have got a Bible').","bom":["1 Nephi 4:26","2 Nephi 26:26","Alma 16:13","Alma 21:4–6","2 Nephi 29:3–10"],"bible":[],"sources":[{"name":"Documented criticism (Fraser, Whalen et al.) via B.H. Roberts Foundation records","type":"primary","url":"https://bhroberts.org/records/DwDHzj-kx5snc/gordon_h_fraser_argues_that_churches_and_synagogues_are_anachronistic_in_the_book_of_mormon"},{"name":"MormonThink, 'Book of Mormon Difficulties'","type":"primary","url":"http://www.mormonthink.com/book-of-mormon-problems.htm"}],"response":"FAIR responds that 'church' and 'synagogue' are the English translator's institutional vocabulary for whatever assemblies the Nephites had (KJV usage of 'church' is similarly elastic), that synagogue scholar Lee Levine and others allow pre-exilic communal worship settings (gate chambers), and that 'Bible' occurs inside an explicit prophecy of the latter days, where foreknowledge of the future artifact is the point.","responseSource":{"name":"FAIR, 'Book of Mormon/Anachronisms/Buildings' and 'Book of Mormon/Synagogues'","url":"https://www.fairlatterdaysaints.org/answers/Book_of_Mormon/Anachronisms/Buildings"},"rationale":"As pure vocabulary, 'church'/'synagogue' are adequately handled by any translation theory (translators routinely use target-language institutional terms), but that defense sits awkwardly with Skousen's tight-control evidence, and 2 Nephi 29's 'Bible' passage functioning as a rebuttal to 19th-century critics remains better evidence of 19th-century composition than of prophecy."},
{"id":"another-gospel-canon-closure","category":"canon-provenance","severity":"high","verdict":"contested","title":"The 'another gospel' / closed-canon argument","claim":"The Book of Mormon constitutes 'another gospel' under Paul's anathema (Galatians 1:8 — even 'an angel from heaven' preaching a different gospel is accursed, which critics apply directly to the angel Moroni), and adding it to scripture violates the canon-closure warnings of Revelation 22:18–19 and Deuteronomy 4:2. Because its gospel content (conditional grace, exaltation, priesthood restoration) differs from the apostolic gospel, it falls under the curse regardless of its claimed angelic provenance.","bom":["Introduction ('the fulness of the everlasting gospel')","1 Nephi 13:34–40","3 Nephi 27:13–21"],"bible":["Galatians 1:6–9","Revelation 22:18–19","Deuteronomy 4:2","Jude 3","Hebrews 1:1–2"],"sources":[{"name":"CARM, 'The Gospel According to Mormonism'","type":"apologetics","url":"https://carm.org/mormonism/the-gospel-according-to-mormonism/"},{"name":"Mormonism Research Ministry, 'Does Revelation 22:18 Condemn the Book of Mormon?'","type":"apologetics","url":"https://mrm.org/revelation-22-18"},{"name":"pursueGOD, 'Mormonism Exposed by the Book of Galatians'","type":"apologetics","url":"https://www.pursuegod.org/mormonism-exposed-by-the-book-of-galatians/"}],"response":"(1) Revelation 22:18 warns against tampering with 'the words of the prophecy of THIS book' — the Apocalypse itself, a standard conclusion-curse formula on individual ancient scrolls; Revelation was not the last NT book written, and the same logic applied to Deuteronomy 4:2 would invalidate everything after Deuteronomy. Even many evangelical scholars concede Revelation 22:18 is book-specific. (2) The warning targets uninspired men adding to scripture, not God giving new revelation (Amos 3:7; Revelation 14:6's 'everlasting gospel' angel is read as Moroni). (3) Galatians 1:8 condemns a different gospel, and LDS hold the Book of Mormon teaches the same gospel of Christ crucified — so the argument presupposes its conclusion (that the content differs).","responseSource":{"name":"FAIR, 'Latter-day Saint scripture and the closed canon'","url":"https://www.fairlatterdaysaints.org/answers/Latter-day_Saint_scripture_and_the_closed_canon"},"rationale":"The Revelation 22:18 proof-text is the weakest form of the argument — most textual scholars agree the curse formula is scoped to Revelation, and FAIR's Deuteronomy 4:2 reductio lands. But the Galatians 1:8 form survives that reply: it turns entirely on whether the Book of Mormon's gospel content matches the apostolic gospel, which routes the question to the concrete doctrinal conflicts (see the grace and exaltation entries). Not self-standing, but not answered either."},
{"id":"grace-after-all-we-can-do","category":"doctrinal-conflict","severity":"high","verdict":"contested","title":"Salvation by grace 'after all we can do' vs. grace apart from works","claim":"2 Nephi 25:23 ('it is by grace that we are saved, after all we can do') and Moroni 10:32 ('deny yourselves of all ungodliness… then is his grace sufficient for you') make grace conditional on prior human effort, contradicting the biblical teaching that salvation is by grace through faith, emphatically not of works (Ephesians 2:8–9), and that grace-plus-works is a category collapse (Romans 11:6). For ~150 years official LDS interpretation read the verse in its plain conditional sense (Spencer W. Kimball's 'The Miracle of Forgiveness'; Bruce R. McConkie: 'Man cannot be saved by grace alone').","bom":["2 Nephi 25:23","Moroni 10:32–33","Alma 11:37"],"bible":["Ephesians 2:8–9","Romans 11:6","Romans 4:4–5","Titus 3:5","Galatians 2:16","Galatians 2:21"],"comparison":{"left":{"ref":"2 Nephi 25:23 (Book of Mormon)","text":"For we labor diligently to write, to persuade our children, and also our brethren, to believe in Christ, and to be reconciled to God; for we know that it is by grace that we are saved, after all we can do."},"right":{"ref":"Ephesians 2:8–9 (KJV)","text":"For by grace are ye saved through faith; and that not of yourselves: it is the gift of God: not of works, lest any man should boast."},"hl":["by grace","saved","after all we can do","not of works"],"note":"The whole dispute lives in two phrases: the Bible's 'not of works' against the Book of Mormon's 'after all we can do.'"},"sources":[{"name":"Mormonism Research Ministry, 'How Has 2 Nephi 25:23 Been Interpreted?'","type":"apologetics","url":"https://mrm.org/2-nephi-25-23"},{"name":"Mormonism Research Ministry, 'Saved by Grace \"In Spite Of\" All We Can Do?'","type":"apologetics","url":"https://mrm.org/2nephi2523"},{"name":"LDS Fact Check, 'Why 2 Nephi 25:23 and Ephesians 2:8 Can't Both Be True'","type":"apologetics","url":"https://ldsfactscheck.com/ephesians-vs-2-nephi/"}],"response":"(1) BYU's Stephen Robinson and Royal Skousen argue 'after all we can do' is an archaic idiom meaning 'in spite of all we can do' — grace saves notwithstanding our inadequate efforts. (2) Dieter F. Uchtdorf (First Presidency, 2015, 'The Gift of Grace'): 'after' does not mean 'because'; salvation is not earned by meeting a quota. (3) In narrative context Nephi's point is that the law of Moses is dead and only grace saves (2 Nephi 25:24–27), paralleling James 2's faith-works integration, which Ephesians must also be harmonized with. (4) John Welch (BYU) reads it against Mosiah 4:6–8's covenant framework.","responseSource":{"name":"BYU ScholarsArchive, '\"After All We Can Do\" (2 Nephi 25:23)'","url":"https://scholarsarchive.byu.edu/facpub/3645/"},"rationale":"The modern 'in spite of' reinterpretation is linguistically possible and now quasi-official (Uchtdorf), meaningfully narrowing the gap. But the criticism retains force: (a) the reinterpretation is late — the dominant authoritative LDS reading from Joseph Fielding Smith through Kimball and McConkie was conditional; (b) Moroni 10:32 ('deny yourselves of all ungodliness… THEN is his grace sufficient') is grammatically conditional in a way no idiom argument dissolves, and LDS ordinance-and-covenant soteriology still conditions exaltation on works. Neither side has a knockout."},
{"id":"dark-skin-curse","category":"doctrinal-conflict","severity":"high","verdict":"unrefuted","title":"Dark skin as a divine curse (and the modern text and heading edits)","claim":"The Book of Mormon teaches God cursed the Lamanites with 'a skin of blackness' to make them unattractive to the righteous Nephites (2 Nephi 5:21), marks descendants similarly (Alma 3:6–9), and describes converted Lamanites' skin becoming 'white' (3 Nephi 2:14–15) — contradicting the biblical teaching that God made all nations of one blood (Acts 17:26), shows no partiality (Acts 10:34–35), and looks on the heart, not outward appearance (1 Samuel 16:7). The church's own quiet edits — 1981: 'white and delightsome' → 'pure and delightsome' (2 Nephi 30:6); 2010: removal of racial language from the chapter headings of 2 Nephi 5 and Mormon 5 — are cited as tacit admission that the racial reading is the natural one.","bom":["2 Nephi 5:21–23","Alma 3:6–9","3 Nephi 2:14–15","Jacob 3:8–9","2 Nephi 30:6 (1830/1981 variants)","Mormon 5:15"],"bible":["Acts 17:26","Acts 10:34–35","1 Samuel 16:7","Galatians 3:28","John 7:24","Revelation 7:9"],"comparison":{"left":{"ref":"2 Nephi 5:21 (Book of Mormon)","text":"And he had caused the cursing to come upon them, yea, even a sore cursing, because of their iniquity… wherefore, as they were white, and exceedingly fair and delightsome, that they might not be enticing unto my people the Lord God did cause a skin of blackness to come upon them."},"right":{"ref":"Acts 17:26 (KJV)","text":"And hath made of one blood all nations of men for to dwell on all the face of the earth, and hath determined the times before appointed, and the bounds of their habitation."},"hl":["skin of blackness","one blood all nations"],"note":"No biblical passage ties skin color to covenant standing; the church's 2013 'Race and the Priesthood' essay disavows the theory the verse plainly states."},"sources":[{"name":"Salt Lake Tribune, 'Church removes racial references in Book of Mormon headings' (2010)","type":"journalism","url":"https://archive.sltrib.com/article.php?id=50882900&itype=cmsid"},{"name":"Rational Faiths, '\"White and Delightsome\": Racism in the Book of Mormon'","type":"scholarly","url":"https://rationalfaiths.com/racism-in-the-book-of-mormon/"},{"name":"CES Letter (Jeremy Runnells), Book of Mormon section","type":"apologetics","url":"https://read.cesletter.org/bom/"}],"response":"(1) Scripture Central and recent BYU scholarship (Ethan Sproat, Gerrit Steenblik) argue 'skin of blackness' may be metaphorical or refer to garments/marks the Lamanites adopted, not literal pigmentation — the actual curse was separation from the Lord (2 Nephi 5:20), with the 'mark' distinct from the curse. (2) FAIR notes the text condemns Nephite racism against Lamanites (Jacob 3:5–9 says the Lamanites were more righteous) and that narrative episodes where Nephites and Lamanites are indistinguishable make no sense if the skin difference were literal and stark. (3) The heading edits corrected uninspired 1981 study helps written by Bruce R. McConkie, not the revealed text; the 2013 'Race and the Priesthood' Gospel Topics essay disavows the theory that dark skin signals divine disfavor.","responseSource":{"name":"Scripture Central, 'What Is the \"Skin of Blackness\" in the Book of Mormon?'","url":"https://scripturecentral.org/knowhy/what-is-the-skin-of-blackness-in-the-book-of-mormon"},"rationale":"The metaphorical/garment reading is a late apologetic development that contradicts nearly two centuries of the church's own authoritative interpretation (Brigham Young through Spencer W. Kimball, who reported Lamanite converts becoming 'lighter'), and the text's causal chain — cursing 'because of their iniquity,' therefore 'a skin of blackness,' 'that they might not be enticing' — resists it (3 Nephi 2:15 has the curse and the skin change together). The church's 2013 disavowal effectively concedes the criticism against the text's plain sense rather than refuting it."},
{"id":"fortunate-fall","category":"doctrinal-conflict","severity":"medium","verdict":"contested","title":"The Fall as necessary blessing vs. the Fall as catastrophe","claim":"2 Nephi 2:22–25 teaches Adam's fall was necessary and good — without it Adam and Eve 'would have had no children,' and 'Adam fell that men might be; and men are, that they might have joy.' Critics argue this contradicts the Bible, which presents the fall as sin bringing death and condemnation (Romans 5:12–19), never as the enabling condition of procreation — since God commanded 'be fruitful and multiply' (Genesis 1:28) BEFORE the fall, making the Book of Mormon's premise (no children without the fall) a direct contradiction, and making God the author of a transgression he simultaneously forbade.","bom":["2 Nephi 2:22–25","Alma 12:22–26"],"bible":["Genesis 1:28","Genesis 2:17","Romans 5:12–19","Romans 8:20–22","1 Timothy 2:14","1 Corinthians 15:21–22"],"sources":[{"name":"Christian Research Institute, '2 Nephi 2 in the Book of Mormon'","type":"apologetics","url":"https://www.equip.org/articles/2-nephi-2-in-the-book-of-mormon/"},{"name":"Creation Ministries International, 'The Fall: a \"glorious necessity\"?!'","type":"apologetics","url":"https://creation.com/how-mormons-muddle-genesis"},{"name":"Mormonism Research Ministry, 'Citations on the Fall'","type":"apologetics","url":"https://mrm.org/fall"}],"response":"(1) BYU Religious Studies Center ('The Fortunate Fall of Adam and Eve') situates the doctrine within the venerable Christian felix culpa tradition — Ambrose, Augustine's 'O felix culpa,' the Easter Exsultet — in which the fall occasions a greater good (the Incarnation), so a providential fall is not foreign to Christianity. (2) Scripture Central: Lehi's teaching is that mortality, agency, and the capacity for joy require an opposition-structured world (2 Nephi 2:11); the fall was a 'transgression' of a lesser law rather than a sin in the fullest sense, a distinction some Christian theologians also draw. (3) Eve is honored rather than blamed, which LDS present as a strength.","responseSource":{"name":"BYU Religious Studies Center, 'The Fortunate Fall of Adam and Eve'","url":"https://rsc.byu.edu/no-weapon-shall-prosper/fortunate-fall-adam-eve"},"rationale":"The felix culpa parallel is a genuine steelman — Christianity has long held God brings greater good out of the fall — but it does not reach the specific claims: that the fall was REQUIRED for procreation (flatly against Genesis 1:28's pre-fall command) and that Adam and Eve 'would have remained in a state of innocence, having no joy.' The felix culpa tradition celebrates redemption despite the fall; 2 Nephi 2 makes the fall itself instrumentally necessary — a materially different claim. The Genesis 1:28 point remains without a strong published answer."},
{"id":"original-sin-infant-baptism","category":"doctrinal-conflict","severity":"medium","verdict":"contested","title":"Denial of original sin and damnation of infant-baptizers (Moroni 8)","claim":"Moroni 8 declares little children 'are not capable of committing sin,' that infant baptism is 'solemn mockery before God,' and that anyone who supposes children need baptism 'must go down to hell' if they die in that thought (Moroni 8:8–21) — contradicting the biblical teaching that humans are sinful from conception (Psalm 51:5), 'by nature children of wrath' (Ephesians 2:3), and condemned in Adam (Romans 5:12,18–19). Critics note the position mirrors the Pelagian controversy settled in AD 418, and that damning the majority of historic Christendom (which practiced infant baptism) exceeds any biblical warrant.","bom":["Moroni 8:8–23","Mosiah 3:16–21","2 Nephi 2:25"],"bible":["Psalm 51:5","Ephesians 2:3","Romans 5:12, 18–19","Genesis 8:21","Psalm 58:3","1 Corinthians 15:22"],"sources":[{"name":"Department of Christian Defense, Book of Mormon theology analyses","type":"apologetics","url":"https://christiandefense.org/oneness/modalism-and-the-book-of-mormon/"},{"name":"LDS Scripture Teachings, 'Moroni 8, Pelagius, and Questions about Infant Baptism'","type":"scholarly","url":"https://www.ldsscriptureteachings.org/2020/12/infant-baptism/"},{"name":"Improvement Era (critical analysis), 'When Rhetoric Overpowers Revelation: Moroni 8'","type":"scholarly","url":"https://www.improvementera.com/2023/06/when-rhetoric-overpowers-revelation.html?m=1"}],"response":"(1) FAIR argues the Bible nowhere commands infant baptism and nowhere depicts one; credobaptist Protestants (Baptists, most evangelicals) agree with the Book of Mormon's practical conclusion, so this cannot be a simple Bible-vs-BoM conflict — it tracks an intra-Christian dispute. (2) Original sin as inherited GUILT (vs. inherited corruption/mortality) is an Augustinian development contested within Christianity itself (Eastern Orthodoxy rejects inherited guilt); Psalm 51:5 is Davidic poetry about pervasive sinfulness, not a dogmatic statement of infant guilt. (3) LDS theology holds Christ's atonement unconditionally covers Adam's transgression (Articles of Faith 2; Moroni 8:8 — 'the curse of Adam is taken from them in me'), so children are redeemed, not merely innocent.","responseSource":{"name":"FAIR, 'Plan of salvation/Original sin'","url":"https://www.fairlatterdaysaints.org/answers/Plan_of_salvation/Original_sin"},"rationale":"As a pure proof-text battle the critics overreach: infant baptism and inherited-guilt formulations are disputed among Bible-affirming Christians, and the LDS reply correctly identifies allies for parts of its position. What survives is narrower but real: (a) Moroni 8's consignment of infant-baptizers to hell condemns virtually all pre-Reformation Christianity with a severity the Bible nowhere licenses; (b) the passage reproduces a specifically post-biblical (Pelagian-vs-Augustinian, and 19th-century revivalist) controversy in a purportedly 4th-century American text — which shades into a provenance problem."},
{"id":"trinitarian-monotheism-1830","category":"canon-provenance","severity":"high","verdict":"contested","title":"The Book of Mormon's monotheism vs. later LDS plurality of gods","claim":"The Book of Mormon repeatedly teaches strict monotheism and a Father-Son unity so tight it reads as trinitarian or even modalist — Mosiah 15:1–5 (Christ is 'the Father, because he was conceived by the power of God… being the Father and the Son… one God'), Alma 11:26–29,38–39 (there is 'one God' and no other, and Christ IS 'the very Eternal Father'), 2 Nephi 31:21 and Mormon 7:7 ('one God, without end') — agreeing with the Bible (Deuteronomy 6:4; Isaiah 43:10; 44:6,8) but contradicting Joseph Smith's later doctrine of a plurality of gods, God as an exalted man, and three separate beings (King Follett Discourse 1844; D&C 132:20; Book of Abraham 4–5, 'the Gods'). Critics argue this shows the Book of Mormon reflects Smith's 1829 theology, which then evolved — evidence of 19th-century composition.","bom":["Mosiah 15:1–5","Mosiah 16:15","Alma 11:26–29, 38–39","2 Nephi 31:21","Mormon 7:7","3 Nephi 11:27","Testimony of Three Witnesses ('one God')"],"bible":["Deuteronomy 6:4","Isaiah 43:10","Isaiah 44:6–8","Isaiah 45:5","John 10:30","1 Timothy 2:5"],"sources":[{"name":"Mormonism Research Ministry, 'Modalism in the Book of Mormon'","type":"apologetics","url":"https://mrm.org/modalism"},{"name":"Grant Palmer, An Insider's View of Mormon Origins, ch. 4","type":"scholarly","url":"https://en.wikipedia.org/wiki/An_Insider%27s_View_of_Mormon_Origins"},{"name":"CES Letter (Jeremy Runnells), Book of Mormon section","type":"apologetics","url":"https://read.cesletter.org/bom/"},{"name":"James K. Walker, 'Re-imagining Elohim' (CESNUR 2004)","type":"scholarly","url":"https://www.cesnur.org/2004/waco_walker.htm"}],"response":"(1) BYU's David Paulsen and Ari Bruening ('The Development of the Mormon Understanding of God: Early Mormon Modalism and Other Myths,' FARMS Review 13/2) argue the 1830 text read whole is NOT modalist: it distinguishes Father and Son (1 Nephi 10:4; 3 Nephi 11 — the Father's voice introduces the Son; Christ prays to the Father), so its 'one God' language expresses a unity of distinct persons — no further from later LDS 'social trinitarianism' than the NT's own 'one God' texts are from Nicaea. (2) Mosiah 15 is explained via divine investiture and Christ's dual roles (Father by creation/covenant, Son by the flesh), per the First Presidency's 1916 doctrinal exposition. (3) Brant Gardner: apparent modalism reflects translation-language limits, not theology.","responseSource":{"name":"FAIR, 'Monotheism, Messiah, and Mormon's Book' (2003 FAIR Conference); Paulsen scholarship","url":"https://www.fairlatterdaysaints.org/conference_home/2004-1999-fair-conferences/august-2003-fair-conference/monotheism-messiah-and-mormons-book"},"rationale":"The narrow 'modalism' label is genuinely contested — Paulsen shows Father-Son distinction in the text, and critics sometimes overstate. But the broader provenance point survives the steelman: the Book of Mormon's insistent 'one Eternal God' monotheism and its total silence on plurality of gods, eternal progression, God's corporeality, and exaltation — the doctrines that define mature Mormonism — align it with the Bible and 1820s Protestantism against Nauvoo-era LDS theology. The 1916 'divine investiture' apparatus is a harmonization built precisely because the plain text does not teach the later doctrine."},
{"id":"1837-son-of-edits","category":"canon-provenance","severity":"medium","verdict":"contested","title":"The 1837 'the Son of' edits to 1 Nephi (Christology revisions)","claim":"In the 1830 first edition, 1 Nephi identified Jesus directly as God: 'the virgin which thou seest, is the mother of God' (11:18), 'the Lamb of God, yea, even the Eternal Father' (11:21), 'the everlasting God, was judged of the world' (11:32), and 'the Lamb of God is the Eternal Father' (13:40). In the 1837 Kirtland edition Joseph Smith inserted 'the Son of' into all four verses. Critics argue a text 'translated by the gift and power of God' — and called 'the most correct of any book on earth' — was doctrinally revised to track Smith's evolving christology (and to deflect Alexander Campbell's 1831 'mother of God' criticism), evidencing human authorship; the ORIGINAL readings sit closer to biblical high christology than the revision.","bom":["1 Nephi 11:18 (1830 vs 1837)","1 Nephi 11:21 (1830 vs 1837)","1 Nephi 11:32 (1830 vs 1837)","1 Nephi 13:40 (1830 vs 1837)"],"bible":["John 1:1, 14","Colossians 2:9","Isaiah 9:6","Titus 2:13"],"comparison":{"left":{"ref":"1 Nephi 11:18 — 1830 first edition","text":"And he said unto me: Behold, the virgin which thou seest is the mother of God, after the manner of the flesh."},"right":{"ref":"1 Nephi 11:18 — 1837 Kirtland edition (Smith's revision)","text":"And he said unto me: Behold, the virgin whom thou seest is the mother of the Son of God, after the manner of the flesh."},"hl":["the mother of God","the mother of the Son of God"],"note":"Four verses received the same 'the Son of' insertion in 1837 — the same period Smith's godhead doctrine was shifting."},"sources":[{"name":"Mormonism Research Ministry, 'First Nephi and the Son of God'","type":"apologetics","url":"https://mrm.org/first-nephi-and-the-son-of-god"},{"name":"1830 first edition text of 1 Nephi (primary source)","type":"primary","url":"https://bookofmormon.com/1830/1-nephi/13"},{"name":"CES Letter (Jeremy Runnells), Book of Mormon changes section","type":"apologetics","url":"https://read.cesletter.org/bom/"}],"response":"(1) FAIR: Joseph Smith, as translator, was entitled to clarify ambiguity; Royal Skousen's Critical Text Project treats the change as clarification, since both readings are defensible — Christ genuinely is called 'the Eternal Father' elsewhere in the Book of Mormon (Mosiah 16:15), and unamended verses (e.g., Mosiah 15) were left intact, which a systematic doctrinal cover-up would not do. (2) The 'mother of God' phrase drew Catholic-sounding objections (Campbell; answered by Cowdery in 1835), so the edit removed a stumbling block without changing doctrine. (3) Thousands of Book of Mormon changes are typographical; these four are openly documented in Skousen's published variants, not hidden.","responseSource":{"name":"FAIR, 'Book of Mormon/Textual changes/\"the Son of\"'","url":"https://www.fairlatterdaysaints.org/answers/Book_of_Mormon/Textual_changes/%22the_Son_of%22"},"rationale":"The facts are undisputed (FAIR concedes the four insertions and Smith's authorship of them); only the significance is argued. The reply that similar 'Eternal Father' language survives elsewhere is a fair point against a 'cover-up' framing. But no LDS source adequately explains why a dictated, God-empowered translation needed christological amendment at exactly the verses an early critic attacked, in the same period Smith's godhead doctrine was shifting. As evidence of an evolving human text the argument stands; as proof of wholesale doctrinal rewriting it overreaches."},
{"id":"jacob-polygamy-vs-dc132","category":"canon-provenance","severity":"medium","verdict":"contested","title":"Jacob's condemnation of polygamy vs. D&C 132 (the Bible agrees with the Book of Mormon)","claim":"Jacob 2:24–27 declares that David's and Solomon's 'many wives and concubines' were 'abominable before me, saith the Lord' and commands 'there shall not any man among you have save it be one wife; and concubines he shall have none.' Doctrine and Covenants 132:38–39 says the opposite: David's wives and concubines 'were given unto him of me' and 'in none of these things did he sin.' Critics note the Book of Mormon here agrees with the Bible's monogamous ideal (Deuteronomy 17:17; 1 Kings 11:1–11; Matthew 19:4–6; 1 Timothy 3:2) while later canonized LDS revelation flatly contradicts both — a provenance problem: Smith's scripture reversed itself when polygamy became practice.","bom":["Jacob 2:24–30","Jacob 3:5","Mosiah 11:2","Ether 10:5"],"bible":["Deuteronomy 17:17","1 Kings 11:1–11","Matthew 19:4–6","1 Timothy 3:2","Genesis 2:24"],"sources":[{"name":"'The Scriptures vs. D&C Section 132' (aggregating the standard critical case)","type":"apologetics","url":"https://humblymybrain.substack.com/p/the-scriptures-vs-d-and-c-section"},{"name":"Richard Packham, 'Major Contradictions in Mormonism'","type":"apologetics","url":"https://packham.n4m.org/contra.htm"},{"name":"Mormonr, 'Doctrine and Covenants 132 and Polygamy' (documents both sides)","type":"scholarly","url":"https://mormonr.org/qnas/spymbg/doctrine_and_covenants_132_and_polygamy"}],"response":"(1) FAIR reads Jacob 2:30 as an escape clause: monogamy is the rule 'for if I will, saith the Lord of Hosts, raise up seed unto me, I will command my people; otherwise they shall hearken unto these things' — i.e., God may command plural marriage for specific purposes, and D&C 132 is that commanded exception; the two texts then teach one coherent policy. (2) On David/Solomon: Jacob condemns the unauthorized excess (Bathshe
