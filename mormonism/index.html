on my words, and exercise a particle of faith, yea, even if ye can no more than desire to believe, let this desire work in you, even until ye believe in a manner that ye can give place for a portion of my words."},{"v":28,"t":"Now, we will compare the word unto a seed. Now, if ye give place, that a seed may be planted in your heart, behold, if it be a true seed, or a good seed, if ye do not cast it out by your unbelief, that ye will resist the Spirit of the Lord, behold, it will begin to swell within your breasts; and when you feel these swelling motions, ye will begin to say within yourselves—It must needs be that this is a good seed, or that the word is good, for it beginneth to enlarge my soul; yea, it beginneth to enlighten my understanding, yea, it beginneth to be delicious to me."}]},"Deuteronomy 13:1-3":{"ref":"Deuteronomy 13","verses":[{"v":1,"t":"If there arise among you a prophet, or a dreamer of dreams, and giveth thee a sign or a wonder,"},{"v":2,"t":"And the sign or the wonder come to pass, whereof he spake unto thee, saying, Let us go after other gods, which thou hast not known, and let us serve them;"},{"v":3,"t":"Thou shalt not hearken unto the words of that prophet, or that dreamer of dreams: for the LORD your God proveth you, to know whether ye love the LORD your God with all your heart and with all your soul."}]},"Isaiah 8:20":{"ref":"Isaiah 8","verses":[{"v":20,"t":"To the law and to the testimony: if they speak not according to this word, it is because there is no light in them."}]},"Acts 17:11":{"ref":"Acts 17","verses":[{"v":11,"t":"These were more noble than those in Thessalonica, in that they received the word with all readiness of mind, and searched the scriptures daily, whether those things were so."}]},"Jeremiah 17:9":{"ref":"Jeremiah 17","verses":[{"v":9,"t":"The heart is deceitful above all things, and desperately wicked: who can know it?"}]},"Genesis 9:6":{"ref":"Genesis 9","verses":[{"v":6,"t":"Whoso sheddeth man's blood, by man shall const WHYTAIL={admitted:"The facts here are conceded in the church's own publications — the only dispute is what they mean. In conversation, cite them exclusively from LDS sources; there is nothing to argue about except the interpretation.",unrefuted:"No adequate answer to this has been published. A believer must either live with the tension or produce a response no scholar has yet managed.",contested:"There is a genuine debate here — the honest move is to read both sides and weigh which explanation asks less of the evidence.",answered:"Fairly weighed, the defense wins this one. Critics who keep using it weaken their own credibility on the claims that do stand."};
const WHYMAP={
"kjv-dependence":"The Book of Mormon claims to be an independent translation of a record written centuries before English existed. If its English actually derives from the 1611 King James Bible — printing conventions and translation errors included — then the claimed translation process didn't happen as described, and Joseph Smith's central credential as a prophet rests on it.",
"deutero-isaiah":"If chapters of Isaiah were written after Lehi's family left Jerusalem, they could not have been on the brass plates the Nephites carried. That would mean the book's narrative frame is impossible on its own terms — not a detail, but a load-bearing wall.",
"nt-anachronism":"New Testament language appearing in books set centuries before the New Testament means the text knows literature it could not have known. Every such passage is evidence the real author lived after the New Testament — in Joseph Smith's world, not Nephi's.",
"cultural-anachronism":"The book describes a physical civilization: animals, crops, metals, institutions. If archaeology consistently finds none of it where and when the book requires it, the claim that this is real history — not fiction — loses its footing one item at a time.",
"doctrinal-conflict":"Mormonism claims to restore biblical Christianity. Where its scripture or doctrine contradicts the Bible, a member must choose which authority wins — and every such conflict undercuts the claim that the two books teach one gospel.",
"canon-provenance":"These cases test where the text and its doctrines actually came from. Edited verses, doctrines that reverse themselves, and prophecies that failed all point the same direction: a human author revising as he went — which is fatal to the claim of divine dictation.",
"prophecy":"The Bible's own test for a prophet (Deuteronomy 18) is whether his predictions come true. This is the standard Joseph Smith must pass to be what the church claims he is.",
"textual-transmission":"The entire justification for a 'Restoration' is that the Bible was corrupted and truths were lost. If the manuscript evidence shows the Bible was NOT substantially corrupted, the Restoration answers a problem that never existed.",
"archaeology":"A book describing million-person civilizations should leave physical remains. Their total absence is not one missing artifact — it is the silence of an entire continent where a civilization is supposed to have been.",
"dna":"The book's own title page says the Lamanites are Israelites. If genetics shows Native Americans came from Asia, the church is left redefining who the book was even about — which it has already had to do in print.",
"demographics":"If the book's population numbers can't work, its battle accounts and civilizations are storytelling, not history. This one the defense handles better than critics admit — which is worth knowing too.",
"provenance":"How the book actually came to be — the stone in the hat, the lost pages, the interested witnesses — is the foundation everything else stands on. Cracks here are cracks under the whole building.",
"translation-test":"This is the only case where Joseph Smith's source document survives and his translation can be graded against real Egyptology. It is the closest thing to a laboratory test of his prophetic gift that will ever exist — and the church's own essay concedes the mismatch.",
"stylometry":"Computer authorship analysis gets cited by both sides. Knowing why neither side's studies settle anything protects you from being fooled by confident-sounding statistics.",
"origin-story":"The founding miracles are the reason the church exists. If the accounts of those miracles changed shape over time — names, dates, participants — that pattern is evidence about whether they happened.",
"first-vision":"The First Vision is, in the church's own words, the foundation of the Restoration. If the story grew and changed across Smith's retellings, the foundation was still being drafted years after the event.",
"gold-plates":"Everything depends on whether real plates existed and were what Smith said. No neutral person ever examined them — so the entire case rests on interested witnesses, which is why their reliability matters so much.",
"exit-costs":"The cost of leaving tells you how a belief system holds its members: by persuasion or by pressure. These facts matter to anyone weighing what joining — or leaving — would actually mean for their family and life.",
"institutional":"How the institution behaves under scrutiny — toward scholars, money, and its own history — is evidence about whether it acts like a custodian of truth or a organization protecting itself.",
"practice-worship":"Requirements like the Word of Wisdom decide who gets temple access — and in LDS teaching, temple access decides eternal standing. A rule the founding revelation called optional now gates salvation itself.",
"practice-temple":"Temple ordinances are, in LDS teaching, required for exaltation. Where those ceremonies actually came from — and how they've been quietly revised — bears directly on whether they are ancient and divine or modern and borrowed.",
"exaltation":"This is the doctrine that most sharply separates Mormonism from biblical monotheism: not whether God loves his children, but whether they become beings of the same kind he is. Isaiah says no god will be formed after him; D&C 132 says the faithful 'shall be gods.' Both cannot be true.",
"christology":"Everything in Christianity hangs on who Jesus is. If he is a created elder brother who earned his godhood, he is not the eternal God the Bible says made all things — and a created Christ cannot carry the infinite weight of sin. This is not a side issue; it is whether the Jesus being trusted is the Jesus who saves.",
"nature-of-god":"Who God is comes before every other question. An exalted man from another world who organized pre-existing matter is a different being from the eternal 'I AM' who created everything from nothing — and devotion offered to a different being is what the Bible has always called by another name.",
"polygamy-history":"The founding prophet secretly married other men's wives and girls as young as fourteen while publicly denying it — in the same years the revelations were coming. Jesus said prophets are known by their fruits (Matthew 7:15–20); this is the character evidence that test requires.",
"violence-history":"How a movement treats its critics and enemies reveals what drives it. These events do not by themselves disprove any doctrine — but they test the claim that this institution was being led by God through its formative decades.",
"modern-policy":"Revelation that reverses itself within a few years — on who can be baptized, on who counts as an apostate — raises the same question the failed prophecies do: is the voice being followed God's voice, or the leadership's?"};
const TALK={
"kjv-dependence":"Ask, don't lecture: **“If the plates were written a thousand years before English existed, why does the translation contain the King James translators' mistakes?”** Then let them look it up — the evidence is strongest when they find it themselves.",
"deutero-isaiah":"Try: **“Lehi left Jerusalem in 600 BC — how did chapters scholars date fifty years later get onto the brass plates?”** Most members have never heard the question; be patient with the silence that follows.",
"nt-anachronism":"Open a Book of Mormon and a Bible side by side and read Moroni 7:45 next to 1 Corinthians 13. Then ask gently: **“Which direction do you think the copying went?”**",
"cultural-anachronism":"Keep it light, not mocking: **“If millions of Nephites had horses and steel, what should archaeologists have found by now?”** Concede the honest apologetic answers where they exist — it earns you the right to press where they don't.",
"doctrinal-conflict":"Read the two passages together and ask **“if these disagree, which one should we trust?”** — then keep the conversation on what the Bible actually says. Scripture does the heavy lifting; you just turn the pages.",
"canon-provenance":"Ask: **“If the Book of Mormon was translated by the power of God, why did Joseph Smith need to revise what God said?”** The 1837 edits and the failed prophecies are documented in sources the church itself publishes.",
"prophecy":"Share Deuteronomy 18:22 and ask them to apply it themselves: **“What test would you use on anyone else claiming to be a prophet? Should Joseph Smith be exempt from it?”**",
"textual-transmission":"Ask: **“If God preserved the Book of Mormon perfectly through one man, why couldn't he preserve the Bible through thousands of manuscripts?”** The Dead Sea Scrolls are your friend here — the Bible passed the test the Restoration says it failed.",
"archaeology":"Ask what evidence they'd expect if the book were true, before showing what's missing — people defend conclusions but follow their own reasoning. The Smithsonian's statement is a neutral source they can check.",
"dna":"Point to the church's own 2006 change — 'principal ancestors' to 'among the ancestors' — and ask: **“Why did the introduction need to change if the book was right?”**",
"demographics":"This one is a trap for critics — the LDS answer is decent. Better to know it and skip it than to lead with a losing argument.",
"provenance":"Ask about the hat: **“Did you know the church's own essay says Joseph put a stone in his hat and didn't use the plates? Why were the plates needed at all?”** Cite only the Gospel Topics essay — their source, not yours.",
"translation-test":"This is the strongest single conversation you can have. **“The papyri exist. Egyptologists can read them. The church's own essay admits they don't match the Book of Abraham. What follows from that?”** Ask it with sorrow, not triumph.",
"stylometry":"Skip the dueling computer studies in conversation — neither side's numbers persuade anyone. Spend the time on the papyri or on grace instead.",
"origin-story":"Ask which version of the story they were taught, then show them the earlier accounts on the Joseph Smith Papers site — the church's own archive. Let the documents raise the question for you.",
"first-vision":"Gently: **“The 1832 account in Joseph's own handwriting mentions one personage and no revival. Why did the story grow?”** They can read it at josephsmithpapers.org — an official church site.",
"gold-plates":"Ask: **“Would you accept eleven interested witnesses and no artifact as proof of any other religion's founding miracle?”** The consistency standard is the point, not the witnesses' sincerity.",
"exit-costs":"Lead with compassion, not accusation — many members quietly know these costs. **“If the church is true, why does leaving it cost people their families?”** Then be the Christian whose friendship doesn't have a worthiness interview.",
"institutional":"Institutional behavior opens doors testimony can't: the SEC order and the September Six are documented by neutral sources. Ask: **“Is this how a church led by Jesus handles truth?”**",
"practice-worship":"Ask over the coffee they can't drink with you: **“Where does the New Testament make a drink a condition for entering God's presence?”** Then read Colossians 2:16 together.",
"practice-temple":"Never mock the garments — sacred things deserve gentle questions: **“If the endowment is ancient, why did it match 1842 Freemasonry, and why was it changed in 1990?”**",
"exaltation":"This is the heart of everything. Read Isaiah 43:10 together and ask: **“Can 'you may become a god' and 'before me there was no God formed, neither shall there be after me' both be true?”** Then tell them what the real gospel offers instead — not godhood earned, but sonship given (John 1:12).",
"christology":"Ask: **“Who do you believe Jesus was before Bethlehem?”** Their honest answer — the firstborn spirit child — opens John 1:1–3 for you: the Word wasn't born first; he *was* God and made ALL things. Read it together, slowly, and let the verse do the work.",
"nature-of-god":"Ask: **“Has God always been God?”** Then read Psalm 90:2 together — and Moroni 8:18 from their own book, which agrees with the Bible against the King Follett doctrine. Most members have never had to square those two.",
"polygamy-history":"Use only the church's own essay: **“Did you know the church's website now confirms Joseph had about 30–40 wives, some already married to other men?”** Ask how that fits with his public denials. Be gentle — for many members this one wounds deeply.",
"violence-history":"History works best as shared discovery, not accusation: **“Have you read what the church's own historians wrote about Mountain Meadows?”** Let the church-published history make the point so you don't have to.",

const ABBR=["c","cf","vs","e.g","i.e","etc","Dr","St","Mr","Mrs","ch","pp","v","vv","no","approx","Jr","Sr"];
function splitSentences(raw){
  const tokens=raw.split(/(?<=[.!?])\s+(?=[A-Z0-9"'(‘“])/);
  const merged=[];
  tokens.forEach(t=>{
    if(merged.length){
      const prev=merged[merged.length-1];
      const m=prev.match(/([A-Za-z&.]+)\.$/);
      const w=m?m[1].replace(/\./g,""):null;
      if(w&&ABBR.includes(w)){merged[merged.length-1]=prev+" "+t;return;}
    }
    merged.push(t);
  });
  return merged;
}

const REFNUM="\\s\\d+(?::\\d+(?:[\\-–]\\d+)?(?:,\\s?\\d+(?:[\\-–]\\d+)?)*)?";
const KEYWORDS=/\b(concedes?d?|conceded|disavow(?:s|ed|al)?|undisputed|unfalsifiable|no ancient manuscript|zero ancient witnesses|never recanted|does not match|do not match|no adequate answer|contradict(?:s|ing|ion)?|impossible|no record|officially disavowed)\b/gi;
function emphasize(t){
  t=t.replace(new RegExp("\\b("+LDSBOOKS+REFNUM+")","g"),'<span class="ref-lds">$1</span>');
  t=t.replace(new RegExp("\\b("+BIBBOOKS+REFNUM+")","g"),m=>m.includes("ref-lds")?m:'<span class="ref-bib">'+m+'</span>');
  t=t.replace(/(^|[\s(—–])'([^'<>]{3,200}?)'(?=$|[\s.,;:)!?—–])/g,'$1<span class="qq">‘$2’</span>');
  t=t.replace(KEYWORDS,'<b class="kw">$1</b>');
  t=t.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/==(.+?)==/g,'<mark>$1</mark>');

function rich(raw){return glossify(emphasize(esc(raw)));}
function paras(raw,per){
  per=per||2;
  const s=splitSentences(raw),ps=[];
  for(let i=0;i<s.length;i+=per)ps.push(s.slice(i,i+per).join(" "));
  return ps.map(p=>`<p>${rich(p)}</p>`).join("");
}
function formatDefense(raw){
  if(/\(\d+\)/.test(raw)){
    const parts=raw.split(/\(\d+\)\s*/);
    const intro=parts.shift().trim();
    return (intro?`<p class="lead">${rich(intro)}</p>`:"")+
      `<ol class="pts">${parts.map(p=>`<li>${rich(p.trim())}</li>`).join("")}</ol>`;
  }
  return paras(raw,2);
}

{t:"Deutero-Isaiah",d:"Chapters 40–55 of Isaiah, judged by most scholars to be written by an anonymous author during the Babylonian exile (c. 545–539 BC) — long after the historical Isaiah, and after Lehi's claimed departure."},

const $=s=>document.querySelector(s);
const esc=s=>(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function hl(text,phrases){let out=esc(text);(phrases||[]).forEach(p=>{const e=esc(p).replace(/[.*+?^${}()|[\]\\]/g,"\\$&");out=out.replace(new RegExp(e,"gi"),m=>"<mark>"+m+"</mark>");});return out;}
function glossify(escapedText){
  let out=escapedText;
  GLOSSARY.forEach(g=>{
    const e=esc(g.t).replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
    let done=false;
    out=out.replace(new RegExp("\\b("+e+")\\b","i"),(m,w)=>{if(done)return m;done=true;
      return '<span class="g" tabindex="0">'+w+'<span class="gt"><b>'+esc(g.t)+'</b> — '+esc(g.d)+'</span></span>';});
  });
  return out;
}
function findWhy(d,cite){
  const key=cite.replace(/–/g,"-").replace(/\s*\(.*\)\s*/g,"").trim();
  const m=key.match(/^([1-4]?\s?[A-Za-z&; ]+?)\s+(\d+)/);
  const frag=m?(m[1].trim()+" "+m[2]):key;
  const sentences=(d.claim+" "+d.rationale).replace(/–/g,"-").split(/(?<=[.!?])\s+/);
  const hit=sentences.find(s=>s.includes(frag));
  return hit?hit.replace(/-/g,"–"):null;
}

function showLightbox(src,cap){
  const lb=document.createElement("div");lb.className="lightbox";
  lb.innerHTML='<figure style="margin:0;text-align:center"><img src="'+src+'" alt=""><figcaption>'+cap+'</figcaption></figure><button class="lx-close">✕ Close</button>';
  lb.addEventListener("click",()=>lb.remove());
  document.body.appendChild(lb);
}
function extUrl(cite){
  const c=cite.replace(/–/g,"-").replace(/\s*\(.*\)\s*/g,"").trim();
  const BOMB={"1 nephi":"1-ne","2 nephi":"2-ne","jacob":"jacob","enos":"enos","jarom":"jarom","omni":"omni","words of mormon":"w-of-m","mosiah":"mosiah","alma":"alma","helaman":"hel","3 nephi":"3-ne","4 nephi":"4-ne","mormon":"morm","ether":"ether","moroni":"moro"};
  const dcm=c.match(/^D&C\s+(\d+)/i);
  if(dcm)return "https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/"+dcm[1]+"?lang=eng";
  if(/^official declaration\s*2/i.test(c))return "https://www.churchofjesuschrist.org/study/scriptures/dc-testament/od/2?lang=eng";
  const abm=c.match(/^Abraham\s+(\d+)/i);
  if(abm)return "https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/"+abm[1]+"?lang=eng";
  const mm=c.match(/^([1-4]?\s?[A-Za-z ]+?)\s+(\d+)/);
  if(mm){const b=mm[1].trim().toLowerCase();
    if(BOMB[b])return "https://www.churchofjesuschrist.org/study/scriptures/bofm/"+BOMB[b]+"/"+mm[2]+"?lang=eng";
    if(/^jst/i.test(c))return "https://www.churchofjesuschrist.org/study/scriptures/jst?lang=eng";
    return "https://www.biblegateway.com/passage/?search="+encodeURIComponent(c)+"&version=KJV";}
  return "https://www.churchofjesuschrist.org/study/scriptures?lang=eng";
}
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),1800);}

/* ---------- filtered list (ordered) ---------- */
function filtered(){
  const arr=DATA.filter(d=>
    (state.section==="all"||d.section===state.section)&&
    (!state.verdict||d.verdict===state.verdict)&&
    (!state.severity||d.severity===state.severity)&&
    (!state.q||(d.title+" "+d.claim+" "+(d.response||"")+" "+(d.rationale||"")+" "+(CATS[d.category]||"")).toLowerCase().includes(state.q))
  );
  if(state.section==="peculiar")return arr.sort((a,b)=>PORDER.indexOf(a.id)-PORDER.indexOf(b.id));
  return arr.sort((a,b)=>(b.featured?1:0)-(a.featured?1:0)||SEVRANK[a.severity]-SEVRANK[b.severity]||VRANK[a.verdict]-VRANK[b.verdict]);
}

/* ---------- case ---------- */
function openCase(id,fromPath){
  state.caseId=id;state.sel=id;state.view="case";
  if(!fromPath)state.pathId=state.pathId; // keep path context if navigating within
  store.markRead(id);
  render();
  window.scrollTo({top:0});
}
function renderCase(){
  const d=byId[state.caseId];if(!d){state.view="overview";return renderOverview();}
  const list=filtered();const idx=list.findIndex(x=>x.id===d.id);
  const path=state.pathId?PATHS.find(p=>p.id===state.pathId):null;
  let nextInPath=null;
  if(path){const i=path.items.indexOf(d.id);if(i>-1&&i<path.items.length-1)nextInPath=path.items[i+1];}
  const comp=d.comparison?`
    <div class="dlab">Side by side</div>
    <div class="compare2">
      <div class="pane bom"><div class="ref">${esc(d.comparison.left.ref)}</div><div class="scripture">${hl(d.comparison.left.text,d.comparison.hl)}</div></div>
      <div class="pane bible"><div class="ref">${esc(d.comparison.right.ref)}</div><div class="scripture">${hl(d.comparison.right.text,d.comparison.hl)}</div></div>
    </div>${d.comparison.note?`<p class="cnote">${esc(d.comparison.note)}</p>`:""}`:"";
  const chipHtml=(arr)=>arr.map(p=>{
    const v=VERSES[p];
    return `<button class="chip ${v?"":"ext"}" data-cite="${esc(p)}" ${v?"":`data-ext="${extUrl(p)}"`}>${esc(p)}</button>`;
  }).join("");
  const isHigher=p=>/^(D&C|Official Declaration|Abraham|Moses|JST|Introduction|Title Page|Testimony)/i.test(p.trim());
  const bomCore=d.bom.filter(p=>!isHigher(p)),ldsOther=d.bom.filter(isHigher);
  const cimg=IMGMAP[d.id]?`<figure class="cimg"><img src="${IMGMAP[d.id].src}" alt="${esc(IMGMAP[d.id].cap)}" loading="lazy"><button class="cimg-x" title="Expand image" data-full="${IMGMAP[d.id].src.replace("width=520","width=1400")}" data-cap="${esc(IMGMAP[d.id].cap)}">⤢</button><figcaption>${esc(IMGMAP[d.id].cap)}</figcaption></figure>`:"";
  const passages=(d.bom.length||d.bible.length||IMGMAP[d.id])?`
    <aside class="claimside">
      ${cimg}
      <details class="vdet"><summary>The verses behind this claim — ${d.bom.length+d.bible.length} refs</summary>
      <p class="sidenote">Every reference here is cited by this specific claim — click one to read it in place. Remember: Mormons hold their own scriptures above the Bible, so citations from their books carry the most weight with them.</p>
      <div class="passcols">
        ${bomCore.length?`<div><h6 class="h-bom">Book of Mormon</h6><div class="chips" data-side="bom">${chipHtml(bomCore)}</div></div>`:""}
        ${ldsOther.length?`<div><h6 class="h-bom" style="color:var(--amber)">D&C & Pearl of Great Price</h6><div class="chips" data-side="bom">${chipHtml(ldsOther)}</div></div>`:""}
        ${d.bible.length?`<div><h6 class="h-bib">Bible</h6><div class="chips" data-side="bib">${chipHtml(d.bible)}</div></div>`:""}
        <div id="versebox"></div>

    <div class="backbar">
      <button class="bk" id="back">← ${path?esc(path.name):"All cases"}</button>
      <span style="font-size:.72rem;color:var(--dim)">${idx+1>0?`Case ${idx+1} of ${list.length}`:""} · <kbd>←</kbd>/<kbd>→</kbd> to move</span>
      ${nextInPath?`<button class="pathnext" id="pathnext">Next in path →</button>`:""}

    <div class="case">

      <h2>${esc(d.title)}</h2>
      <div class="ctop">
        <div><div class="dlab red" style="margin-top:0">The claim</div><div class="claim">${paras(d.claim)}</div></div>
        ${passages}
      </div>
      ${comp}
      <div class="tabs2">
        <button class="tab2 on" data-pane="pane-case">🛡 Defense & Verdict</button>
        <button class="tab2" data-pane="pane-talk">💬 Conversation</button>
        <button class="tab2" data-pane="pane-src">📚 Sources & connections</button>
      </div>
      <div class="tabpane2 on" id="pane-case">
        <div class="dlab blue" style="margin-top:0">The best defense, steelmanned</div>
        <div class="defense">${formatDefense(d.response)}${d.responseSource?`<div class="dsrc">Source: ${d.responseSource.url?`<a href="${esc(d.responseSource.url)}" target="_blank" rel="noopener">${esc(d.responseSource.name)}</a>`:esc(d.responseSource.name)}</div>`:""}</div>
        <div class="pair2">
          <div><div class="dlab">The verdict</div><div class="vbox v-${d.verdict}"><b class="vb">${VLABEL[d.verdict]}</b><span>${paras(d.rationale)}</span></div></div>
          <div><div class="dlab">Why this matters</div><div class="why">${paras(WHYMAP[d.category]||"")}<p class="wtail">${esc(WHYTAIL[d.verdict])}</p></div></div>
        </div>
      </div>
      <div class="tabpane2" id="pane-talk">${TALK[d.category]?`<div class="dlab" style="margin-top:0;color:var(--green)">Bringing it up in conversation</div><div class="talk">${paras(TALK[d.category])}</div>`:""}${DIALOG[d.category]?`<div class="dlab" style="color:var(--green)">How the conversation usually goes</div><div class="dlg">${DIALOG[d.category].map(m=>`<div class="msg ${m.w}"><span class="who">${m.w==="them"?"They may say":"You respond"}</span><p>${rich(m.t)}</p></div>`).join("")}</div>`:""}</div>
      <div class="tabpane2" id="pane-src">
        <div class="dlab" style="margin-top:0">Documented by — ${d.sources.length} source${d.sources.length>1?"s":""}</div>
        <ul class="srcs">${d.sources.map(s=>`<li><span class="sb sb-${s.type}">${s.type}</span><span>${s.url?`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.name)}</a>`:esc(s.name)}</span></li>`).join("")}</ul>
        <div class="dlab">Connected cases</div>
        <div class="relrow">${rel.map(id=>`<button data-open="${id}">${esc(byId[id].title)}</button>`).join("")||"—"}</div>
      </div>
    </div>`;
    $("#back").addEventListener("click",()=>{state.view=path?"paths":"overview";state.caseId=null;render();});
  if(nextInPath)$("#pathnext").addEventListener("click",()=>openCase(nextInPath));
  document.querySelectorAll(".relrow [data-open]").forEach(b=>b.addEventListener("click",()=>openCase(b.dataset.open)));
  document.querySelectorAll(".chip").forEach(ch=>ch.addEventListener("click",()=>{
    if(ch.dataset.ext){window.open(ch.dataset.ext,"_blank");return;}
    const cite=ch.dataset.cite;const v=VERSES[cite];
    const box=$("#versebox");
    const already=ch.classList.contains("open");
    document.querySelectorAll(".chip.open").forEach(x=>x.classList.remove("open"));
    if(already){box.innerHTML="";return;}
    ch.classList.add("open");
    const side=ch.closest("[data-side]")?ch.closest("[data-side]").dataset.side:"";
    const why=findWhy(d,cite);
    const whyHtml=why?`<b>Why it's cited:</b> ${esc(why)}`:(side==="bom"?"<b>Role:</b> this is the Book of Mormon passage the claim examines.":"<b>Role:</b> this is the biblical standard the claim measures against.");

    box.querySelector("[data-close]").addEventListener("click",()=>{box.innerHTML="";document.querySelectorAll(".chip.open").forEach(x=>x.classList.remove("open"));});
  }));
  document.querySelectorAll(".cimg-x").forEach(b=>b.addEventListener("click",e=>{e.stopPropagation();showLightbox(b.dataset.full,b.dataset.cap);}));
  renderNav();renderPreview();
}

/* ---------- paths ---------- */
function renderPaths(){
  const read=store.read;
  $("#main").innerHTML=`<div class="viewhead"><h2>Guided paths</h2><p>Curated routes through the corpus. Progress is saved in your browser; inside a path, each case offers "Next in path."</p></div><div class="pgrid">`+PATHS.map(p=>{
      const done=p.items.filter(i=>read.has(i)).length;
      return `<div class="pathcard">${PATHIMG[p.id]?`<img class="pathimg" src="${PATHIMG[p.id]}" loading="lazy">`:""}<h3>${esc(p.name)}</h3><p class="pd">${esc(p.desc)} · ${p.time} · ${done}/${p.items.length} read</p>
      <ol>${p.items.map(i=>`<li class="${read.has(i)?"done":""}">${esc(byId[i].title)}</li>`).join("")}</ol>
      <button class="start" data-path="${p.id}">${done===0?"Start path":done>=p.items.length?"Revisit path":"Continue path"} →</button></div>`;
    }).join("")+"</div>";
  document.querySelectorAll("[data-path]").forEach(b=>b.addEventListener("click",()=>{
    const p=PATHS.find(x=>x.id===b.dataset.path);state.pathId=p.id;
    const read=store.read;const next=p.items.find(i=>!read.has(i))||p.items[0];
    openCase(next,true);
  }));
}

:[{"y":"1966","side":"record","crit":true,"t":"The papyri resurface","p":"Standard funerary texts. The testable translation fails.","id":"book-of-abraham-papyri"},{"y":"1978","side":"record","t":"Official Declaration 2","p":"The ban ends; every justification later disavowed.","id":"priesthood-temple-ban-1852-1978"},{"y":"1981","side":"record","crit":true,"t":"'White' becomes 'pure'","p":"2 Nephi 30:6 edited; racial headings follow in 2010.","id":"dark-skin-curse"},{"y":"1990","side":"record","crit":true,"t":"Penalty oaths removed","p":"The endowment quietly revised.","id":"endowment-masonic-origins"},{"y":"1985","side":"record","crit":true,"t":"The Hofmann bombings","p":"A forger who fooled the First Presidency kills two; no seer discerned the fraud.","id":"hofmann-forgeries-church-response"},{"y":"1993","side":"record","t":"The September Six","p":"Scholars disciplined in one coordinated month.","id":"september-six"},{"y":"2006","side":"record","crit":true,"t":"'Among the ancestors'","p":"The introduction rewritten after the DNA studies.","id":"dna-native-american-origins"},{"y":"2008","side":"record","t":"Proposition 8","p":"Ward structures mobilized for a state ballot measure; FPPC fine follows.","id":"prop-8-campaign"},{"y":"2013–15","side":"record","t":"The Gospel Topics Essays","p":"The stone, the accounts, the papyri — conceded quietly.","id":"ces-letter-gospel-topics-visibility"},{"y":"2023","side":"record","crit":true,"t":"The SEC settlement","p":"$32B behind 13 shell companies.","id":"sec-ensign-peak-settlement"},{"y":"2025","side":"record","t":"Huntsman ruling","p":"The 9th Circuit en banc rules 11-0 for the church on the tithing-fraud claim.","id":"huntsman-tithing-lawsuit"}]}];
function renderTimeline(){
  const read=store.read;
  $("#main").innerHTML=`<div class="viewhead"><h2>The revision record, in three acts</h2>
  <p>What was claimed on the left; what the documents later showed on the right. Red years mark the turning points. Click an act to open it — your reading progress fills each meter.</p></div>
  <div class="chs">${TLACTS.map((a,i)=>{
    const linked=a.events.filter(e=>e.id);
    const done=linked.filter(e=>read.has(e.id)).length;
    return `<button class="ch ${state.act===i?"on":""}" data-act="${i}"><span class="n">${a.num}</span><span class="range">${a.range}</span><h4>${a.name}</h4><p>${a.desc} · ${a.events.length} events</p><div class="meter"><i style="width:${linked.length?Math.round(done/linked.length*100):0}%"></i></div></button>`;
  }).join("")}</div>
  ${state.act!=null&&TLACTS[state.act]?actHtml(TLACTS[state.act]):`<p class="tlhint">Select an act to open its record.</p>`}`;
  function actHtml(a){
    return `<div class="chopen"><h4>Act ${a.num} · ${a.name} (${a.range})</h4>
    <div class="cvr"><div class="hh claims">What was claimed</div><div></div><div class="hh record">What the record shows</div>
    ${a.events.map(e=>{
      const bubble=`<div class="bubble ${e.side==="claim"?"claim":"rec"}${e.crit?" crit":""}${e.id&&store.read.has(e.id)?" done":""}">${e.id&&IMGMAP[e.id]?`<img class="ebthumb" src="${IMGMAP[e.id].src}" loading="lazy">`:""}${e.crit?`<span class="tpx">★ turning point</span>`:""}${e.id&&store.read.has(e.id)?`<span class="donechip">✓ read</span>`:""}<h4>${esc(e.t)}</h4><p>${esc(e.p)} ${e.id&&byId[e.id]?`<button class="jump" data-open="${e.id}">→ open the case</button>`:""}</p></div>`;
      return `<div class="cell">${e.side==="claim"?bubble:""}</div><div class="mid"><div class="yr2 ${e.crit?"critY":""}">${e.y}</div></div><div class="cell">${e.side==="record"?bubble:""}</div>`;
    }).join("")}</div></div>`;
  }
  document.querySelectorAll(".ch").forEach(b=>b.addEventListener("click",()=>{const i=+b.dataset.act;state.act=state.act===i?null:i;renderTimeline();}));
  document.querySelectorAll(".jump").forEach(b=>b.addEventListener("click",()=>openCase(b.dataset.open)));
}

/* ---------- the heart of it ---------- */
function renderCore(){
  const link=id=>byId[id]?`<button class="corelink" data-open="${id}">${esc(byId[id].title)} →</button>`:"";
  $("#main").innerHTML=`
  <div class="viewhead"><h2>The heart of it: a different God, a different Jesus, a different gospel</h2>
  <p>If you read nothing else on this site, read this page. Mormonism's problems are not a pile of historical trivia — they converge on three foundational differences that decide everything. This is why the theology matters, in plain terms.</p></div>
  <div class="corestrip"><figure><img src="https://commons.wikimedia.org/wiki/Special:FilePath/Joseph%20Smith%20Papyrus%20I.jpg?width=800" loading="lazy" data-cap="The papyri: the one translation we can check"><figcaption>The papyri: the one translation we can check</figcaption></figure><figure><img src="https://commons.wikimedia.org/wiki/Special:FilePath/The%20Great%20Isaiah%20Scroll%20MS%20A%20(1QIsa)%20-%20Google%20Art%20Project.jpg?width=800" loading="lazy" data-cap="The scrolls: the Bible was never lost"><figcaption>The scrolls: the Bible was never lost</figcaption></figure><figure><img src="https://commons.wikimedia.org/wiki/Special:FilePath/Joseph%20Smith%2C%20Jr.%20portrait%20owned%20by%20Joseph%20Smith%20III.jpg?width=800" loading="lazy" data-cap="The prophet: Deuteronomy 18 is the test"><figcaption>The prophet: Deuteronomy 18 is the test</figcaption></figure></div>

  <div class="pathcard"><h3 style="color:var(--red)">1 · A different God</h3>
  <p style="font-size:.92rem;line-height:1.75">Mormonism teaches that God the Father is <b>an exalted man</b> — a being of flesh and bone (D&C 130:22) who <b>“was once as we are now”</b> (King Follett discourse, still quoted approvingly in the church's own <i>Becoming Like God</i> essay), one god among many, who <i>organized</i> pre-existing matter rather than creating everything from nothing. The Bible's God is categorically different: <span class="qq">‘from everlasting to everlasting, thou art God’</span> (Psalm 90:2), <span class="qq">‘God is not a man’</span> (Numbers 23:19), <span class="qq">‘before me there was no God formed, neither shall there be after me’</span> (Isaiah 43:10). <b>Why it matters:</b> worship offered to a different being is not worship of God, however sincere. This is the first commandment issue, not a technicality.</p>
  <details class="srcdet" style="border-top:0;padding-top:0;margin-top:12px"><summary>Open the cases behind this</summary><div class="corelinks" style="margin-top:12px">${link("god-exalted-man-flesh-and-bone")}${link("trinity-vs-godhead")}${link("unchangeable-god-vs-king-follett")}${link("exaltation-eternal-progression")}</div></details></div>

  <div class="pathcard"><h3 style="color:var(--red)">2 · A different Jesus</h3>
  <p style="font-size:.92rem;line-height:1.75">In LDS teaching, Jesus is the <b>firstborn spirit child</b> of heavenly parents — the literal elder brother of every human <i>and of Lucifer</i> (the church's own 2007 statement confirms the shared spirit-parentage) — a being of our species who <b>attained</b> godhood. The Bible's Jesus is the eternal Creator who was never made: <span class="qq">‘All things were made through him, and without him was not any thing made that was made’</span> (John 1:3), <span class="qq">‘he is before all things’</span> (Colossians 1:17), <span class="qq">‘the same yesterday, today, and forever’</span> (Hebrews 13:8). <b>Why it matters:</b> only an infinite, uncreated Christ can carry infinite sin. A created elder brother who climbed to divinity cannot save anyone — which is why Paul treats <span class="qq">‘another Jesus’</span> as a salvation issue (2 Corinthians 11:4), not a difference of opinion.</p>
  <details class="srcdet" style="border-top:0;padding-top:0;margin-top:12px"><summary>Open the cases behind this</summary><div class="corelinks" style="margin-top:12px">${link("jesus-firstborn-spirit-attained-godhood")}${link("jesus-lucifer-spirit-brothers")}${link("different-jesus-hinckley-1998")}${link("blood-atonement")}</div></details></div>

  <div class="pathcard"><h3 style="color:var(--red)">3 · A different gospel</h3>
  <p style="font-size:.92rem;line-height:1.75">The LDS gospel is grace <span class="qq">‘after all we can do’</span> (2 Nephi 25:23) — ordinances, temple worthiness, covenants kept, interviews passed, exaltation earned. The biblical gospel is the exact reverse of that order: <span class="qq">‘by grace are ye saved through faith… not of works, lest any man should boast’</span> (Ephesians 2:8–9); God <span class="qq">‘justifieth the ungodly’</span> (Romans 4:5); <span class="qq">‘It is finished’</span> (John 19:30). <b>Why it matters:</b> this is the exact error Paul pronounced anathema in Galatians 1:8 — a gospel of grace-plus-requirements. It is also Mormonism's pastoral wound: millions of sincere people on a worthiness treadmill that never lets them rest. The good news you carry is that <b>God's love has no worthiness interview</b>.</p>
  <details class="srcdet" style="border-top:0;padding-top:0;margin-top:12px"><summary>Open the cases behind this</summary><div class="corelinks" style="margin-top:12px">${link("grace-after-all-we-can-do")}${link("another-gospel-canon-closure")}${link("no-postmortem-repentance")}${link("word-of-wisdom-dietary-law")}</div></details></div>

  <div class="pathcard"><h3 style="color:var(--gold)">The foundation under all of it: the Bible was not corrupted</h3>
  <p style="font-size:.92rem;line-height:1.75">Mormonism's entire justification for existing is that the Bible was corrupted — <span class="qq">‘plain and precious things taken away’</span> (1 Nephi 13) — requiring a Restoration. But the manuscript evidence closed that door: the <b>Dead Sea Scrolls</b> (c. 250 BC–70 AD) match our Old Testament across a thousand-year gap, and 5,800+ Greek New Testament manuscripts — many centuries older than Joseph Smith — allow the text to be reconstructed to within trivial variants. <b>Why it matters:</b> if the Bible was NOT corrupted, the Restoration answers a problem that never existed — and every place a new scripture contradicts the preserved Bible, it is the new scripture that must be thrown out, not the old one. The same argument, incidentally, applies to any faith that claims the Bible was changed.</p>
  <details class="srcdet" style="border-top:0;padding-top:0;margin-top:12px"><summary>Open the cases behind this</summary><div class="corelinks" style="margin-top:12px">${link("plain-precious-things-removed")}${link("another-gospel-canon-closure")}</div></details></div>`;
  $("#main").querySelectorAll(".corelink,[data-open]").forEach(b=>{if(b.dataset.open)b.addEventListener("click",()=>openCase(b.dataset.open));});
  const g=$("#main").querySelector("[data-goto]");
  if(g)g.addEventListener("click",()=>{state.view="share";render();});
}

/* ---------- sharing the gospel ---------- */
function renderShare(){
  $("#main").innerHTML=`
  <div class="viewhead"><h2>Sharing the gospel with Mormon friends</h2>
  <p>Not to win arguments — to help real people meet the real Jesus, with gentleness (2 Timothy 2:24–25). Built from documented ex-Mormon conversions and ministries with decades in this work.</p></div>
  <div class="pb-h">Say this early — as a friend, before any crisis</div>
  <div class="saybox"><span class="who">You, over hot chocolate</span><p>"If Mormonism ever turned out not to be true — that wouldn't mean Jesus isn't."</p></div>
  <p class="pd" style="font-size:.78rem;margin:0 0 4px">Said in advance, that sentence routes a future faith crisis toward Christ instead of atheism.</p>

  <div class="pb-h">What actually brought ex-Mormons to Christ — ranked by how often it appears in testimonies</div><div class="pb-grid"><div class="pb"><span class="num">1</span><h4>Reading the New Testament for itself — without the LDS lens</h4><p>The single most common catalyst. A missionary in Orlando tried to convert a Baptist pastor; the pastor fed him, shared the gospel, and challenged him to "read the Bible as a child." Eighteen months of reading the New Testament later, the missionary surrendered to Christ knowing it would cost him everything. His mother — a tenured BYU professor — re-read the New Testament with the family, "saw the difference between their Mormon Christ and the biblical Jesus," and resigned from BYU on 3/16 in honor of John 3:16 (Lynn Wilder, <i>Unveiling Grace</i>).</p></div><div class="pb"><span class="num">2</span><h4>Grace answering worthiness exhaustion</h4><p>The recommend-interview treadmill produces a documented spiritual fatigue. The message that lands: complete forgiveness not conditional on ongoing performance.</p></div><div class="pb"><span class="num">3</span><h4>Facts crack the shelf — a loving Christian decides where they land</h4><p>The CES Letter gets people <i>out</i>, but the default landing after an "all true or all false" faith collapses is atheism, not Christ. The two-part structure repeats in testimony after testimony: evidence broke the shelf, and <i>a specific Christian who loved them without conditions</i> carried them to Jesus instead of to nothing.</p></div><div class="pb"><span class="num">4</span><h4>Being loved without an agenda</h4><p>Mormon culture knows friendship-with-an-agenda ("friendshipping"). A friendship that survives their doubts — and survives their leaving — is startling, because their community's version is often conditional.</p></div></div>

  <div class="pb-h">The method</div><div class="pb-grid"><div class="pb do"><h4>Witness Christ — don't debate Mormonism</h4><p>Emphasize Jesus as substitute, not merely example. Compassion over confrontation: see them as burdened, not as enemies.</p></div><div class="pb do"><h4>Ask questions instead of making statements</h4><p>(the Columbo method): "What do you mean by that?" forces definitions; "How did you come to that conclusion?" shifts the burden of proof — crucial against testimony-as-trump-card.</p></div><div class="pb do"><h4>Learn "Mormonese."</h4><p>Grace, salvation, eternal life, atonement — shared words, different meanings. Define terms before arguing about them, or you'll agree loudly while meaning opposite things.</p></div><div class="pb do"><h4>Cite only their own sources</h4><p>Gospel Topics Essays, the Joseph Smith Papers, church manuals. Never use a claim you can't document from LDS sources — one overstated attack discredits ten true ones and feeds the persecution narrative.</p></div><div class="pb dont"><h4>Never mock what they hold sacred</h4><p>The 2003 Temple Square street preachers who desecrated garments were denounced by 23 evangelical ministers — and every yelled slogan functions as a testimony meeting for the Mormon hearing it, because their doctrine codes opposition as evidence of truth.</p></div><div class="pb do"><h4>Plant one seed per conversation, and keep the friendship no matter what</h4><p>Exits take years. If your friendship is conditional on agreement, you're offering the same deal the church does.</p></div><div class="pb do"><h4>Pray</h4><p>"No one can come to me unless the Father who sent me draws him" (John 6:44).</p></div></div>

  <div class="pb-h" style="margin-top:34px">How it actually goes — the deeper craft</div>
  <p class="sh-open">"Read the Bible <span class="hl">as a child would</span>." Eighteen months of the New Testament later, the missionary sent to convert a pastor <span class="hl">surrendered to Christ</span> — knowing what it would cost him.</p>
  <p class="sh-att">— the Wilder family's story (Lynn Wilder, <i>Unveiling Grace</i>); her BYU resignation came on 3/16, in honor of John 3:16</p>
  <div class="sa"><h4 class="sat">When they say "prophets are just imperfect men"</h4>
  <p class="pd" style="margin-bottom:8px">This is the standard escape when Joseph Smith's conduct comes up — and unlike Islam (where Muhammad is the 'excellent pattern,' Quran 33:21), Mormonism officially denies prophetic perfection, so "Joseph sinned" bounces off. Two things don't bounce:</p>
  <ol style="font-size:.88rem;color:var(--muted);line-height:1.7;margin:6px 0 0;padding-left:20px">
    <li><b style="color:var(--ink)">Their own veneration text.</b> D&C 135:3: Joseph "has done more, <i>save Jesus only</i>, for the salvation of men in this world, than any other man." Second only to Jesus is the standard the church itself sets — and the hymn "Praise to the Man" is sung to him weekly.</li>
    <li><b style="color:var(--ink)">Sinning is not the same as deceiving in the prophetic act itself.</b> A prophet may lose his temper; a prophet may not lie about revelation — because every book and ordinance flows through his honesty as the instrument. The record shows exactly that: public polygamy denials while secretly married to 30+ women, a "revelation" threatening Emma by name, revelations edited after the fact, the Book of Abraham. Ask: <i>"I'm not asking whether Joseph was perfect. I'm asking whether he told the truth about the revelations. Which of those does Deuteronomy 18 address?"</i></li>
  </ol>
  <p class="pd" style="margin-top:10px">And the fruits test (Matthew 7:15–20) is fair game — missionaries invoke it FOR Joseph ("could a bad tree produce the Book of Mormon?"). Accept the test; then open the Admitted column of this site and weigh the fruit.</p></div>

  <div class="sa"><h4 class="sat">Their canon outranks the Bible — so argue from their canon</h4>
  <p class="pd" style="margin-bottom:8px">Article of Faith 8 says the Bible is God's word only "as far as it is translated correctly" — making it the <b>least</b> trusted book in the LDS canon — while the Book of Mormon is "the most correct of any book on earth." A Mormon can wave off Isaiah; they cannot wave off Moroni. So your most unanswerable arguments set <b>their most-trusted books against their own doctrine</b>:</p>
  <ol style="font-size:.88rem;color:var(--muted);line-height:1.7;margin:6px 0 0;padding-left:20px">
    <li><b style="color:var(--ink)">One God vs. many gods:</b> Alma 11:28–29 — "Is there more than one God?… No." The Book of Mormon itself refutes the plurality of gods.</li>
    <li><b style="color:var(--ink)">Unchangeable God vs. exalted man:</b> Moroni 8:18 — "unchangeable from all eternity to all eternity" vs. King Follett's God who "was once as we are now."</li>
    <li><b style="color:var(--ink)">Polygamy:</b> Jacob 2:24 calls David's and Solomon's wives "abominable" vs. D&C 132 calling them God-given.</li>
    <li><b style="color:var(--ink)">No second chance vs. temple work for the dead:</b> Alma 34:32–35 — "this life is the time" vs. an entire temple system built on postmortem salvation.</li>
  </ol>
  <p class="pd" style="margin-top:10px">The question that lands: <i>"If I showed you that the Book of Mormon disagrees with what your church teaches today — which one would you go with?"</i> Every case above is in this catalog with full citations.</p></div>

  <div class="sa"><h4 class="sat">Hosting the missionaries</h4>
  <p class="pd" style="margin-bottom:10px">Open the door. They're 18–20, homesick, on tiny budgets — <b>feed them</b>. You may be the only committed Christian who ever shares a meal with them, and more than one famous exit began with a pastor who fed a missionary the gospel instead of an argument. They teach five lessons from <i>Preach My Gospel</i>; here is your best move for each:</p>
  <div style="overflow-x:auto"><table class="gtab">
    <tr><th>Their lesson</th><th>What it claims</th><th>Your best question</th></tr>
    <tr><td>1 · Restoration</td><td>Total apostasy after the apostles; church restored through Joseph Smith; pray for a feeling about the Book of Mormon</td><td>"Jesus said the gates of hell would not prevail against his church (Matthew 16:18). If the church totally failed for 1,700 years, was Jesus wrong?" On praying for a feeling: "I test messages against Scripture (Acts 17:11; Galatians 1:8) — would you test it that way with me?"</td></tr>
    <tr><td>2 · Plan of Salvation</td><td>Premortal spirits; three degrees of glory; nearly everyone gets a kingdom</td><td>"Scripture says we become God's children by adoption (Romans 8:15; John 1:12) — doesn't that mean we weren't naturally his children before? And if almost everyone gets a kingdom of glory… what did Jesus save us from?"</td></tr>
    <tr><td>3 · The Gospel</td><td>Faith, repentance, baptism by LDS authority, enduring to the end; grace "after all we can do"</td><td>The most fruitful question in this work: "What must I do to be completely forgiven — and have you done it? Have you actually done 'all you can do'?" Then read Ephesians 2:8–9 and Romans 4:5 together — God justifies the ungodly.</td></tr>
    <tr><td>4 · Commandments</td><td>Follow the prophet, Word of Wisdom, tithing, chastity</td><td>Don't fight the rules — probe the function: "When you keep all of this, do you ever feel like it's enough? How would you know?" Then: "For me obedience is gratitude for a salvation I already have, not the entry fee for one I hope to get."</td></tr>
    <tr><td>5 · Laws & Ordinances</td><td>Priesthood, temple ordinances, eternal marriage, baptism for the dead</td><td>Open Hebrews together: priests stand daily, "but this man, after he had offered one sacrifice for sins for ever, sat down" (Hebrews 10:11–14; 7:23–25). Ask: "Why is Jesus seated?" Because the work is finished.</td></tr>
  </table></div></div>

  <div class="sa"><h4 class="sat">Conversation dynamics you must know</h4>
  <p style="font-size:.88rem;line-height:1.7"><b>When they bear testimony</b> ("I know the church is true…"): it's a trained move that converts facts into personal experience. Don't argue with it — get underneath it: <i>"Thank you — I can tell that's precious to you. How do you tell the difference between a feeling that's from God and one that's just deeply felt? People of many faiths describe the same burning confirmation of contradictory things."</i> Then bear your own, differently grounded: <i>"My confidence isn't in my feelings about Jesus — it's in what he did in history. My feelings have bad days; the empty tomb doesn't."</i></p>
  <p style="font-size:.88rem;line-height:1.7"><b>The shelf:</b> Mormons "shelve" unresolved doubts until the shelf breaks. You're placing weight on a shelf you can't see — so don't demand resolution: <i>"You don't have to answer now — just sit with it."</i></p>
  <p style="font-size:.88rem;line-height:1.7"><b>Milk before meat:</b> your friend may sincerely not know the hard history, and the missionaries at your table may know less than you do. Never say "your church hides this" — say <i>"I read this in an LDS source — can you help me understand it?"</i></p>
  <p style="font-size:.88rem;line-height:1.7"><b>Count their cost out loud.</b> Doubting can mean bishop interviews, a warned spouse, missed weddings, family distance. Never gloat over a crack in their faith. Say: <i>"I know what this could cost you — I'm not going anywhere either way."</i> Be the unconditional community their ward's conditional version can't be. Expect years, not weeks.</p></div>

  <div class="sa"><h4 class="sat">Seven gospel bridges (in their vocabulary)</h4>
  <ol style="font-size:.88rem;color:var(--muted);line-height:1.7;margin:6px 0 0;padding-left:20px">
    <li><b style="color:var(--ink)">Worthiness → Grace.</b> "I'm not worthy either — that's exactly who Jesus came for." 2 Nephi 25:23 vs. Romans 4:5: God justifies <i>the ungodly</i>.</li>
    <li><b style="color:var(--ink)">Exaltation → Adoption.</b> Becoming gods someday vs. becoming God's child now: Romans 8:15–17 — an inheritance received, not a status achieved. The word "adoption" itself quietly dismantles the pre-existence framework.</li>
    <li><b style="color:var(--ink)">"I know" → "I trust."</b> Feelings vs. history: Moroni 10:4 vs. 1 Corinthians 15:3–8. "My confidence stays true on my worst-feeling day."</li>
    <li><b style="color:var(--ink)">The endless temple → the finished cross.</b> Hebrews 10:11–14: their priests stand daily; our High Priest <b>sat down</b>. Ask why.</li>
    <li><b style="color:var(--ink)">Enduring to the end → assurance now.</b> 1 John 5:13: "that ye may KNOW that ye have eternal life." Ask: "If you died tonight, do you know? John says you can."</li>
    <li><b style="color:var(--ink)">Repentance-as-forsaking → repentance-as-return.</b> Kimball's crushing standard vs. the Father who runs to the prodigal mid-confession (Luke 15; 1 John 1:9). Listen for their fatigue.</li>
    <li><b style="color:var(--ink)">The Great Apostasy → the unfailing Christ.</b> "Which is more likely — that Jesus lost his church for 1,700 years, or that he kept his promise?" (Matthew 16:18; Ephesians 3:21).</li>
  </ol></div>

  <div class="sa"><h4 class="sat">The gospel, side by side</h4>
  <div style="overflow-x:auto"><table class="gtab">
    <tr><th></th><th>LDS teaching</th><th>Biblical gospel</th></tr>
    <tr><td>God</td><td>An exalted man; one of many gods; once as we are now</td><td>Eternally God, "from everlasting to everlasting" (Psalm 90:2); no God formed before or after him (Isaiah 43:10)</td></tr>
    <tr><td>Jesus</td><td>Firstborn spirit child, our elder brother, attained godhood</td><td>The eternal Word who <i>was</i> God and became flesh (John 1:1,14); Creator of all things (Colossians 1:16)</td></tr>
    <tr><td>Salvation</td><td>Resurrection for all; exaltation through ordinances, covenants, and worthiness — "after all we can do"</td><td>A gift received by faith, "not of works, lest any man should boast" (Ephesians 2:8–9); "It is finished" (John 19:30)</td></tr>
    <tr><td>Assurance</td><td>Renewable temple recommends; worthiness reviewed by interview</td><td>"He that believeth on the Son hath everlasting life" — present tense (John 3:36); "no condemnation" (Romans 8:1)</td></tr>
    <tr><td>Destiny</td><td>Faithful members become gods with eternal increase (D&amp;C 132:19–20)</td><td>Adopted children of God, glorified with Christ — worshipers forever, never rival deities (Romans 8:17; Revelation 22:3)</td></tr>
  </table></div></div>

  <div class="sa"><h4 class="sat">When they say "I know the church is true — I've felt it"</h4>
  <p class="pd" style="margin-bottom:8px">Don't attack the feeling; question the test. Try:</p>
  <div class="talk" style="max-width:none"><p><b>"I believe you felt something real. But Muslims, Hindus, and I have all felt things too — feelings tell us something happened in us, not whether a book is true. If God gave us a way to test prophets that doesn't depend on feelings (Deuteronomy 18:22, 1 John 4:1), would you be willing to apply it to Joseph Smith with me?"</b></p>
  <p>Also worth knowing: Moroni 10:4's invitation to pray about the book presumes the answer. Jeremiah 17:9 and Proverbs 14:12 explain why the heart alone is not a safe judge.</p></div></div>

  <div class="sa"><h4 class="sat">Do / Don't</h4>
  <div class="dodont">
    <div><b style="color:var(--green);font-size:.8rem;letter-spacing:.1em">DO</b><ul>
      <li>Lead with Jesus and grace — the "better offer" — not just problems</li>
      <li>Read Bible passages together and let Scripture speak</li>
      <li>Learn their vocabulary: "gospel," "salvation," "heaven" mean different things to them</li>
      <li>Invite them to read John or Galatians with you, one chapter at a time</li>
      <li>Feed them dinner. Ex-Mormons consistently say love opened the door</li>
    </ul></div>
    <div><b style="color:var(--red);font-size:.8rem;letter-spacing:.1em">DON'T</b><ul>
      <li>Dogpile — one question, then listen</li>
      <li>Use the weak arguments (this site marks them <i>answered</i>) — one bad argument discredits ten good ones</li>
      <li>Mock garments, temples, or Joseph Smith personally</li>
      <li>Expect a decision on the spot — exits take months or years</li>
      <li>Win the argument and lose the person</li>
    </ul></div>
  </div></div>
