 dwelt among us, (and we beheld his glory, the glory as of the only begotten of the Father,) full of grace and truth."}]},"Colossians 2:9":{"ref":"Colossians 2","verses":[{"v":9,"t":"For in him dwelleth all the fulness of the Godhead bodily."}]},"Isaiah 9:6":{"ref":"Isaiah 9","verses":[{"v":6,"t":"For unto us a child is born, unto us a son is given: and the government shall be upon his shoulder: and his name shall be called Wonderful, Counsellor, The mighty God, The everlasting Father, The Prince of Peace."}]},"Titus 2:13":{"ref":"Titus 2","verses":[{"v":13,"t":"Looking for that blessed hope, and the glorious appearing of the great God and our Saviour Jesus Christ;"}]},"Jacob 2:24–30":{"ref":"Jacob 2","verses":[{"v":24,"t":"Behold, David and Solomon truly had many wives and concubines, which thing was abominable before me, saith the Lord."},{"v":25,"t":"Wherefore, thus saith the Lord, I have led this people forth out of the land of Jerusalem, by the power of mine arm, that I might raise up unto me a righteous branch from the fruit of the loins of Joseph."},{"v":26,"t":"Wherefore, I the Lord God will not suffer that this people shall do like unto them of old."},{"v":27,"t":"Wherefore, my brethren, hear me, and hearken to the word of the Lord: For there shall not any man among you have save it be one wife; and concubines he shall have none;"},{"v":28,"t":"For I, the Lord God, delight in the chastity of women. And whoredoms are an abomination before me; thus saith the Lord of Hosts."},{"v":29,"t":"Wherefore, this people shall keep my commandments, saith the Lord of Hosts, or cursed be the land for their sakes."},{"v":30,"t":"For if I will, saith the Lord of Hosts, raise up seed unto me, I will command my people; otherwise they shall hearken unto these things."}]},"Jacob 3:5":{"ref":"Jacob 3","verses":[{"v":5,"t":"Behold, the Lamanites your brethren, whom ye hate because of their filthiness and the cursing which hath come upon their skins, are more righteous than you; for they have not forgotten the commandment of the Lord, which was given unto our father—that they should have save it were one wife, and concubines they should have none, and there should not be whoredoms committed among them."}]},"Mosiah 11:2":{"ref":"Mosiah 11","verses":[{"v":2,"t":"For behold, he did not keep the commandments of God, but he did walk after the desires of his own heart. And he had many wives and concubines. And he did cause his people to commit sin, and do that which was abominable in the sight of the Lord. Yea, and they did commit whoredoms and all manner of wickedness."}]},"Ether 10:5":{"ref":"Ether 10","verses":[{"v":5,"t":"And it came to pass that Riplakish did not do that which was right in the sight of the Lord, for he did have many wives and concubines, and did lay that upon men's shoulders which was grievous to be borne; yea, he did tax them with heavy taxes; and with the taxes he did build many spacious buildings."}]},"Deuteronomy 17:17":{"ref":"Deuteronomy 17","verses":[{"v":17,"t":"Neither shall he multiply wives to himself, that his heart turn not away: neither shall he greatly multiply to himself silver and gold."}]},"1 Kings 11:1–11":{"ref":"1 Kings 11","verses":[{"v":1,"t":"But king Solomon loved many strange women, together with the daughter of Pharaoh, women of the Moabites, Ammonites, Edomites, Zidonians, and Hittites;"},{"v":2,"t":"Of the nations concerning which the LORD said unto the children of Israel, Ye shall not go in to them, neither shall they come in unto you: for surely they will turn away your heart after their gods: Solomon clave unto these in love."},{"v":3,"t":"And he had seven hundred wives, princesses, and three hundred concubines: and his wives turned away his heart."},{"v":4,"t":"For it came to pass, when Solomon was old, that his wives turned away his heart after other gods: and his heart was not perfect with the LORD his God, as was the heart of David his father."},{"v":5,"t":"For Solomon went after Ashtoreth the goddess of the Zidonians, and after Milcom the abomination of the Ammonites."},{"v":6,"t":"And Solomon did evil in the sight of the LORD, and went not fully after the LORD, as did David his father."},{"v":7,"t":"Then did Solomon build an high place for Chemosh, the abomination of Moab, in the hill that is before Jerusalem, and for Molech, the abomination of the children of Ammon."},{"v":8,"t":"And likewise did he for all his strange wives, which burnt incense and sacrificed unto their gods."},{"v":9,"t":"And the LORD was angry with Solomon, because his heart was turned from the LORD God of Israel, which had appeared unto him twice,"},{"v":10,"t":"And had commanded him concerning this thing, that he should not go after other gods: but he kept not that which the LORD commanded."},{"v":11,"t":"Wherefore the LORD said unto Solomon, Forasmuch as this is done of thee, and thou hast not kept my covenant and my statutes, which I have commanded thee, I will surely rend the kingdom from thee, and will give it to thy servant."}]},"Matthew 19:4–6":{"ref":"Matthew 19","verses":[{"v":4,"t":"And he answered and said unto them, Have ye not read, that he which made them at the beginning made them male and female,"},{"v":5,"t":"And said, For this cause shall a man leave father and mother, and shall cleave to his wife: and they twain shall be one flesh?"},{"v":6,"t":"Wherefore they are no more twain, but one flesh. What therefore God hath joined together, let not man put asunder."}]},"1 Timothy 3:2":{"ref":"1 Timothy 3","verses":[{"v":2,"t":"A bishop then must be blameless, the husband of one wife, vigilant, sober, of good behaviour, given to hospitality, apt to teach;"}]},"Genesis 2:24":{"ref":"Genesis 2","verses":[{"v":24,"t":"Therefore shall a man leave his father and his mother, and shall cleave unto his wife: and they shall be one flesh."}]},"Moroni 8:18":{"ref":"Moroni 8","verses":[{"v":18,"t":"For I know that God is not a partial God, neither a changeable being; but he is unchangeable from all eternity to all eternity."}]},"Mormon 9:9–11, 19":{"ref":"Mormon 9","verses":[{"v":9,"t":"For do we not read that God is the same yesterday, today, and forever, and in him there is no variableness neither shadow of changing?"},{"v":10,"t":"And now, if ye have imagined up unto yourselves a god who doth vary, and in whom there is shadow of changing, then have ye imagined up unto yourselves a god who is not a God of miracles."},{"v":11,"t":"But behold, I will show unto you a God of miracles, even the God of Abraham, and the God of Isaac, and the God of Jacob; and it is that same God who created the heavens and the earth, and all things that in them are."},{"v":19,"t":"And if there were miracles wrought then, why has God ceased to be a God of miracles and yet be an unchangeable Being? And behold, I say unto you he changeth not; if so he would cease to be God; and he ceaseth not to be God, and is a God of miracles."}]},"Moroni 7:22":{"ref":"Moroni 7","verses":[{"v":22,"t":"For behold, God knowing all things, being from everlasting to everlasting, behold, he sent angels to minister unto the children of men, to make manifest concerning the coming of Christ; and in Christ there should come every good thing."}]},"3 Nephi 24:6":{"ref":"3 Nephi 24","verses":[{"v":6,"t":"For I am the Lord, I change not; therefore ye sons of Jacob are not consumed."}]},"Psalm 90:2":{"ref":"Psalms 90","verses":[{"v":2,"t":"Before the mountains were brought forth, or ever thou hadst formed the earth and the world, even from everlasting to everlasting, thou art God."}]},"Malachi 3:6":{"ref":"Malachi 3","verses":[{"v":6,"t":"For I am the LORD, I change not; therefore ye sons of Jacob are not consumed."}]},"Isaiah 44:6":{"ref":"Isaiah 44","verses":[{"v":6,"t":"Thus saith the LORD the King of Israel, and his redeemer the LORD of hosts; I am the first, and I am the last; and beside me there is no God."}]},"James 1:17":{"ref":"James 1","verses":[{"v":17,"t":"Every good gift and every perfect gift is from above, and cometh down from the Father of lights, with whom is no variableness, neither shadow of turning."}]},"Numbers 23:19":{"ref":"Numbers 23","verses":[{"v":19,"t":"God is not a man, that he should lie; neither the son of man, that he should repent: hath he said, and shall he not do it? or hath he spoken, and shall he not make it good?"}]},"Alma 34:32–35":{"ref":"Alma 34","verses":[{"v":32,"t":"For behold, this life is the time for men to prepare to meet God; yea, behold the day of this life is the day for men to perform their labors."},{"v":33,"t":"And now, as I said unto you before, as ye have had so many witnesses, therefore, I beseech of you that ye do not procrastinate the day of your repentance until the end; for after this day of life, which is given us to prepare for eternity, behold, if we do not improve our time while in this life, then cometh the night of darkness wherein there can be no labor performed."},{"v":34,"t":"Ye cannot say, when ye are brought to that awful crisis, that I will repent, that I will return to my God. Nay, ye cannot say this; for that same spirit which doth possess your bodies at the time that ye go out of this life, that same spirit will have power to possess your body in that eternal world."},{"v":35,"t":"For behold, if ye have procrastinated the day of your repentance even until death, behold, ye have become subjected to the spirit of the devil, and he doth seal you his; therefore, the Spirit of the Lord hath withdrawn from you, and hath no place in you, and the devil hath all power over you; and this is the final state of the wicked."}]},"2 Nephi 9:38":{"ref":"2 Nephi 9","verses":[{"v":38,"t":"And, in fine, wo unto all those who die in their sins; for they shall return to God, and behold his face, and remain in their sins."}]},"Mosiah 2:36–39":{"ref":"Mosiah 2","verses":[{"v":36,"t":"And now, I say unto you, my brethren, that after ye have known and have been taught all these things, if ye should transgress and go contrary to that which has been spoken, that ye do withdraw yourselves from the Spirit of the Lord, that it may have no place in you to guide you in wisdom's paths that ye may be blessed, prospered, and preserved—"},{"v":37,"t":"I say unto you, that the man that doeth this, the same cometh out in open rebellion against God; therefore he listeth to obey the evil spirit, and becometh an enemy to all righteousness; therefore, the Lord has no place in him, for he dwelleth not in unholy temples."},{"v":38,"t":"Therefore if that man repenteth not, and remaineth and dieth an enemy to God, the demands of divine justice do awaken his immortal soul to a lively sense of his own guilt, which doth cause him to shrink from the presence of the Lord, and doth fill his breast with guilt, and pain, and anguish, which is like an unquenchable fire, whose flame ascendeth up forever and ever."},{"v":39,"t":"And now I say unto you, that mercy hath no claim on that man; therefore his final doom is to endure a never-ending torment."}]},"Mosiah 26:25–27":{"ref":"Mosiah 26","verses":[{"v":25,"t":"And it shall come to pass that when the second trump shall sound then shall they that never knew me come forth and shall stand before me."},{"v":26,"t":"And then shall they know that I am the Lord their God, that I am their Redeemer; but they would not be redeemed."},{"v":27,"t":"And then I will confess unto them that I never knew them; and they shall depart into everlasting fire prepared for the devil and his angels."}]},"Hebrews 9:27":{"ref":"Hebrews 9","verses":[{"v":27,"t":"And as it is appointed unto men once to die, but after this the judgment:"}]},"Luke 16:26":{"ref":"Luke 16","verses":[{"v":26,"t":"And beside all this, between us and you there is a great gulf fixed: so that they which would pass from hence to you cannot; neither can they pass to us, that would come from thence."}]},"2 Corinthians 6:2":{"ref":"2 Corinthians 6","verses":[{"v":2,"t":"(For he saith, I have heard thee in a time accepted, and in the day of salvation have I succoured thee: behold, now is the accepted time; behold, now is the day of salvation.)"}]},"John 8:24":{"ref":"John 8","verses":[{"v":24,"t":"I said therefore unto you, that ye shall die in your sins: for if ye believe not that I am he, ye shall die in your sins."}]},"Alma 7:10":{"ref":"Alma 7","verses":[{"v":10,"t":"And behold, he shall be born of Mary, at Jerusalem which is the land of our forefathers, she being a virgin, a precious and chosen vessel, who shall be overshadowed and conceive by the power of the Holy Ghost, and bring forth a son, yea, even the Son of God."}]},"Micah 5:2":{"ref":"Micah 5","verses":[{"v":2,"t":"But thou, Beth-lehem Ephratah, though thou be little among the thousands of Judah, yet out of thee shall he come forth unto me that is to be ruler in Israel; whose goings forth have been from of old, from everlasting."}]},"Matthew 2:1–6":{"ref":"Matthew 2","verses":[{"v":1,"t":"Now when Jesus was born in Bethlehem of Judæa in the days of Herod the king, behold, there came wise men from the east to Jerusalem,"},{"v":2,"t":"Saying, Where is he that is born King of the Jews? for we have seen his star in the east, and are come to worship him."},{"v":3,"t":"When Herod the king had heard these things, he was troubled, and all Jerusalem with him."},{"v":4,"t":"And when he had gathered all the chief priests and scribes of the people together, he demanded of them where Christ should be born."},{"v":5,"t":"And they said unto him, In Bethlehem of Judæa: for thus it is written by the prophet,"},{"v":6,"t":"And thou Bethlehem, in the land of Juda, art not the least among the princes of Juda: for out of thee shall come a Governor, that shall rule my people Israel."}]},"Luke 2:4–7":{"ref":"Luke 2","verses":[{"v":4,"t":"And Joseph also went up from Galilee, out of the city of Nazareth, into Judæa, unto the city of David, which is called Bethlehem; (because he was of the house and lineage of David:)"},{"v":5,"t":"To be taxed with Mary his espoused wife, being great with child."},{"v":6,"t":"And so it was, that, while they were there, the days were accomplished that she should be delivered."},{"v":7,"t":"And she brought forth her firstborn son, and wrapped him in swaddling clothes, and laid him in a manger; because there was no room for them in the inn."}]},"John 7:42":{"ref":"John 7","verses":[{"v":42,"t":"Hath not the scripture said, That Christ cometh of the seed of David, and out of the town of Bethlehem, where David was?"}]},"1 Nephi 13:26–29, 34, 40":{"ref":"1 Nephi 13","verses":[{"v":26,"t":"And after they go forth by the hand of the twelve apostles of the Lamb, from the Jews unto the Gentiles, thou seest the formation of that great and abominable church, which is most abominable above all other churches; for behold, they have taken away from the gospel of the Lamb many parts which are plain and most precious; and also many covenants of the Lord have they taken away."},{"v":27,"t":"And all this have they done that they might pervert the right ways of the Lord, that they might blind the eyes and harden the hearts of the children of men."},{"v":28,"t":"Wherefore, thou seest that after the book hath gone forth through the hands of the great and abominable church, that there are many plain and precious things taken away from the book, which is the book of the Lamb of God."},{"v":29,"t":"And after these plain and precious things were taken away it goeth forth unto all the nations of the Gentiles; and after it goeth forth unto all the nations of the Gentiles, yea, even across the many waters which thou hast seen with the Gentiles which have gone forth out of captivity, thou seest—because of the many plain and precious things which have been taken out of the book, which were plain unto the understanding of the children of men, according to the plainness which is in the Lamb of God—because of these things which are taken away out of the gospel of the Lamb, an exceedingly great many do stumble, yea, insomuch that Satan hath great power over them."},{"v":34,"t":"And it came to pass that the angel of the Lord spake unto me, saying: Behold, saith the Lamb of God, after I have visited the remnant of the house of Israel—and this remnant of whom I speak is the seed of thy father—wherefore, after I have visited them in judgment, and smitten them by the hand of the Gentiles, and after the Gentiles do stumble exceedingly, because of the most plain and precious parts of the gospel of the Lamb which have been kept back by that abominable church, which is the mother of harlots, saith the Lamb—I will be merciful unto the Gentiles in that day, insomuch that I will bring forth unto them, in mine own power, much of my gospel, which shall be plain and precious, saith the Lamb."},{"v":40,"t":"And the angel spake unto me, saying: These last records, which thou hast seen among the Gentiles, shall establish the truth of the first, which are of the twelve apostles of the Lamb, and shall make known the plain and precious things which have been taken away from them; and shall make known to all kindreds, tongues, and people, that the Lamb of God is the Son of the Eternal Father, and the Savior of the world; and that all men must come unto him, or they cannot be saved."}]},"1 Nephi 14:20–26":{"ref":"1 Nephi 14","verses":[{"v":20,"t":"And the angel said unto me: Behold one of the twelve apostles of the Lamb."},{"v":21,"t":"Behold, he shall see and write the remainder of these things; yea, and also many things which have been."},{"v":22,"t":"And he shall also write concerning the end of the world."},{"v":23,"t":"Wherefore, the things which he shall write are just and true; and behold they are written in the book which thou beheld proceeding out of the mouth of the Jew; and at the time they proceeded out of the mouth of the Jew, or, at the time the book proceeded out of the mouth of the Jew, the things which were written were plain and pure, and most precious and easy to the understanding of all men."},{"v":24,"t":"And behold, the things which this apostle of the Lamb shall write are many things which thou hast seen; and behold, the remainder shalt thou see."},{"v":25,"t":"But the things which thou shalt see hereafter thou shalt not write; for the Lord God hath ordained the apostle of the Lamb of God that he should write them."},{"v":26,"t":"And also others who have been, to them hath he shown all things, and they have written them; and they are sealed up to come forth in their purity, according to the truth which is in the Lamb, in the own due time of the Lord, unto the house of Israel."}]},"Isaiah 40:8":{"ref":"Isaiah 40","verses":[{"v":8,"t":"The grass withereth, the flower fadeth: but the word of our God shall stand for ever."}]},"Matthew 24:35":{"ref":"Matthew 24","verses":[{"v":35,"t":"Heaven and earth shall pass away, but my words shall not pass away."}]},"1 Peter 1:24–25":{"ref":"1 Peter 1","verses":[{"v":24,"t":"For all flesh is as grass, and all the glory of man as the flower of grass. The grass withereth, and the flower thereof falleth away:"},{"v":25,"t":"But the word of the Lord endureth for ever. And this is the word which by the gospel is preached unto you."}]},"Psalm 119:89":{"ref":"Psalms 119","verses":[{"v":89,"t":"For ever, O LORD, thy word is settled in heaven."}]},"Mormon 6:10–15":{"ref":"Mormon 6","verses":[{"v":10,"t":"And it came to pass that my men were hewn down, yea, even my ten thousand who were with me, and I fell wounded in the midst; and they passed by me that they did not put an end to my life."},{"v":11,"t":"And when they had gone through and hewn down all my people save it were twenty and four of us, (among whom was my son Moroni) and we having survived the dead of our people, did behold on the morrow, when the Lamanites had returned unto their camps, from the top of the hill Cumorah, the ten thousand of my people who were hewn down, being led in the front by me."},{"v":12,"t":"And we also beheld the ten thousand of my people who were led by my son Moroni."},{"v":13,"t":"And behold, the ten thousand of Gidgiddonah had fallen, and he also in the midst."},{"v":14,"t":"And Lamah had fallen with his ten thousand; and Gilgal had fallen with his ten thousand; and Limhah had fallen with his ten thousand; and Jeneum had fallen with his ten thousand; and Cumenihah, and Moronihah, and Antionum, and Shiblom, and Shem, and Josh, had fallen with their ten thousand each."},{"v":15,"t":"And it came to pass that there were ten more who did fall by the sword, with their ten thousand each; yea, even all my people, save it were those twenty and four who were with me, and also a few who had escaped into the south countries, and a few who had deserted over unto the Lamanites, had fallen; and their flesh, and bones, and blood lay upon the face of the earth, being left by the hands of those who slew them to molder upon the land, and to crumble and to return to their mother earth."}]},"Ether 15:2":{"ref":"Ether 15","verses":[{"v":2,"t":"He saw that there had been slain by the sword already nearly two millions of his people, and he began to sorrow in his heart; yea, there had been slain two millions of mighty men, and also their wives and their children."}]},"Alma 2:19":{"ref":"Alma 2","verses":[{"v":19,"t":"And it came to pass that the Nephites did pursue the Amlicites all that day, and did slay them with much slaughter, insomuch that there were slain of the Amlicites twelve thousand five hundred thirty and two souls; and there were slain of the Nephites six thousand five hundred sixty and two souls."}]},"Helaman 3:7–11":{"ref":"Helaman 3","verses":[{"v":7,"t":"And there being but little timber upon the face of the land, nevertheless the people who went forth became exceedingly expert in the working of cement; therefore they did build houses of cement, in the which they did dwell."},{"v":8,"t":"And it came to pass that they did multiply and spread, and did go forth from the land southward to the land northward, and did spread insomuch that they began to cover the face of the whole earth, from the sea south to the sea north, from the sea west to the sea east."},{"v":9,"t":"And the people who were in the land northward did dwell in tents, and in houses of cement, and they did suffer whatsoever tree should spring up upon the face of the land that it should grow up, that in time they might have timber to build their houses, yea, their cities, and their temples, and their synagogues, and their sanctuaries, and all manner of their buildings."},{"v":10,"t":"And it came to pass as timber was exceedingly scarce in the land northward, they did send forth much by the way of shipping."},{"v":11,"t":"And thus they did enable the people in the land northward that they might build many cities, both of wood and of cement."}]},"Mosiah 11:8–10":{"ref":"Mosiah 11","verses":[{"v":8,"t":"And it came to pass that king Noah built many elegant and spacious buildings; and he ornamented them with fine work of wood, and of all manner of precious things, of gold, and of silver, and of iron, and of brass, and of ziff, and of copper;"},{"v":9,"t":"And he also built him a spacious palace, and a throne in the midst thereof, all of which was of fine wood and was ornamented with gold and silver and with precious things."},{"v":10,"t":"And he also caused that his workmen should work all manner of fine work within the walls of the temple, of fine wood, and of copper, and of brass."}]},"2 Nephi 5:15–16":{"ref":"2 Nephi 5","verses":[{"v":15,"t":"And I did teach my people to build buildings, and to work in all manner of wood, and of iron, and of copper, and of brass, and of steel, and of gold, and of silver, and of precious ores, which were in great abundance."},{"v":16,"t":"And I, Nephi, did build a temple; and I did construct it after the manner of the temple of Solomon save it were not built of so many precious things; for they were not to be found upon the land, wherefore, it could not be built like unto Solomon's temple. But the manner of the construction was like unto the temple of Solomon; and the workmanship thereof was exceedingly fine."}]},"Mormon 9:32–34":{"ref":"Mormon 9","verses":[{"v":32,"t":"And now, behold, we have written this record according to our knowledge, in the characters which are called among us the reformed Egyptian, being handed down and altered by us, according to our manner of speech."},{"v":33,"t":"And if our plates had been sufficiently large we should have written in Hebrew; but the Hebrew hath been altered by us also; and if we could have written in Hebrew, behold, ye would have had no imperfection in our record."},{"v":34,"t":"But the Lord knoweth the things which we have written, and also that none other people knoweth our language; and because that none other people knoweth our language, therefore he hath prepared means for the interpretation thereof."}]},"1 Nephi 1:2":{"ref":"1 Nephi 1","verses":[{"v":2,"t":"Yea, I make a record in the language of my father, which consists of the learning of the Jews and the language of the Egyptians."}]},"Omni 1:20–22":{"ref":"Omni 1","verses":[{"v":20,"t":"And it came to pass in the days of Mosiah, there was a large stone brought unto him with engravings on it; and he did interpret the engravings by the gift and power of God."},{"v":21,"t":"And they gave an account of one Coriantumr, and the slain of his people. And Coriantumr was discovered by the people of Zarahemla; and he dwelt with them for the space of nine moons."},{"v":22,"t":"It also spake a few words concerning his fathers. And his first parents came out from the tower, at the time the Lord confounded the language of the people; and the severity of the Lord fell upon them according to his judgments, which are just; and their bones lay scattered in the land northward."}]},"Mosiah 8:11–13":{"ref":"Mosiah 8","verses":[{"v":11,"t":"And again, they have brought swords, the hilts thereof have perished, and the blades thereof were cankered with rust; and there is no one in the land that is able to interpret the language or the engravings that are on the plates. Therefore I said unto thee: Canst thou translate?"},{"v":12,"t":"And I say unto thee again: Knowest thou of any one that can translate? For I am desirous that these records should be translated into our language; for, perhaps, they will give us a knowledge of a remnant of the people who have been destroyed, from whence these records came; or, perhaps, they will give us a knowledge of this very people who have been destroyed; and I am desirous to know the cause of their destruction."},{"v":13,"t":"Now Ammon said unto him: I can assuredly tell thee, O king, of a man that can translate the records; for he has wherewith that he can look, and translate all records that are of ancient date; and it is a gift from God. And the things are called interpreters, and no man can look in them except he be commanded, lest he should look for that he ought not and he should perish. And whosoever is commanded to look in them, the same is called seer."}]},"Jacob 4:1–3":{"ref":"Jacob 4","verses":[{"v":1,"t":"Now behold, it came to pass that I, Jacob, having ministered much unto my people in word, (and I cannot write but a little of my words, because of the difficulty of engraving our words upon plates) and we know that the things which we write upon plates must remain;"},{"v":2,"t":"But whatsoever things we write upon anything save it be upon plates must perish and vanish away; but we can write a few words upon plates, which will give our children, and also our beloved brethren, a small degree of knowledge concerning us, or concerning their fathers—"},{"v":3,"t":"Now in this thing we do rejoice; and we labor diligently to engraven these words upon plates, hoping that our beloved brethren and our children will receive them with thankful hearts, and look upon them that they may learn with joy and not with sorrow, neither with contempt, concerning their first parents."}]},"1 Nephi 13:30":{"ref":"1 Nephi 13","verses":[{"v":30,"t":"Nevertheless, thou beholdest that the Gentiles who have gone forth out of captivity, and have been lifted up by the power of God above all other nations, upon the face of the land which is choice above all other lands, which is the land that the Lord God hath covenanted with thy father that his seed should have for the land of their inheritance; wherefore, thou seest that the Lord God will not suffer that the Gentiles will utterly destroy the mixture of thy seed, which are among thy brethren."}]},"2 Nephi 30:4–6":{"ref":"2 Nephi 30","verses":[{"v":4,"t":"And then shall the remnant of our seed know concerning us, how that we came out from Jerusalem, and that they are descendants of the Jews."},{"v":5,"t":"And the gospel of Jesus Christ shall be declared among them; wherefore, they shall be restored unto the knowledge of their fathers, and also to the knowledge of Jesus Christ, which was had among their fathers."},{"v":6,"t":"And then shall they rejoice; for they shall know that it is a blessing unto them from the hand of God; and their scales of darkness shall begin to fall from their eyes; and many generations shall not pass away among them, save they shall be a pure and a delightsome people."}]},"Alma 10:3":{"ref":"Alma 10","verses":[{"v":3,"t":"And Aminadi was a descendant of Nephi, who was the son of Lehi, who came out of the land of Jerusalem, who was a descendant of Manasseh, who was the son of Joseph who was sold into Egypt by the hands of his brethren."}]},"Helaman 15:11–13":{"ref":"Helaman 15","verses":[{"v":11,"t":"Yea, even if they should dwindle in unbelief the Lord shall prolong their days, until the time shall come which hath been spoken of by our fathers, and also by the prophet Zenos, and many other prophets, concerning the restoration of our brethren, the Lamanites, again to the knowledge of the truth—"},{"v":12,"t":"Yea, I say unto you, that in the latter times the promises of the Lord have been extended to our brethren, the Lamanites; and notwithstanding the many afflictions which they shall have, and notwithstanding they shall be driven to and fro upon the face of the earth, and be hunted, and shall be smitten and scattered abroad, having no place for refuge, the Lord shall be merciful unto them."},{"v":13,"t":"And this is according to the prophecy, that they shall again be brought to the true knowledge, which is the knowledge of their Redeemer, and their great and true shepherd, and be numbered among his sheep."}]},"3 Nephi 21:2–7":{"ref":"3 Nephi 21","verses":[{"v":2,"t":"And behold, this is the thing which I will give unto you for a sign—for verily I say unto you that when these things which I declare unto you, and which I shall declare unto you hereafter of myself, and by the power of the Holy Ghost which shall be given unto you of the Father, shall be made known unto the Gentiles that they may know concerning this people who are a remnant of the house of Jacob, and concerning this my people who shall be scattered by them;"},{"v":3,"t":"Verily, verily, I say unto you, when these things shall be made known unto them of the Father, and shall come forth of the Father, from them unto you;"},{"v":4,"t":"For it is wisdom in the Father that they should be established in this land, and be set up as a free people by the power of the Father, that these things might come forth from them unto a remnant of your seed, that the covenant of the Father may be fulfilled which he hath covenanted with his people, O house of Israel;"},{"v":5,"t":"Therefore, when these works and the works which shall be wrought among you hereafter shall come forth from the Gentiles, unto your seed which shall dwindle in unbelief because of iniquity;"},{"v":6,"t":"For thus it behooveth the Father that it should come forth from the Gentiles, that he may show forth his power unto the Gentiles, for this cause that the Gentiles, if they will not harden their hearts, that they may repent and come unto me and be baptized in my name and know of the true points of my doctrine, that they may be numbered among my people, O house of Israel;"},{"v":7,"t":"And when these things come to pass that thy seed shall begin to know these things—it shall be a sign unto them, that they may know that the work of the Father hath already commenced unto the fulfilling of the covenant which he hath made unto the people who are of the house of Israel."}]},"1 Nephi 18:23":{"ref":"1 Nephi 18","verses":[{"v":23,"t":"And it came to pass that after we had sailed for the space of many days we did arrive at the promised land; and we went forth upon the land, and did pitch our tents; and we did call it the promised land."}]},"2 Nephi 5:6–16":{"ref":"2 Nephi 5","verses":[{"v":6,"t":"Wherefore, it came to pass that I, Nephi, did take my family, and also Zoram and his family, and Sam, mine elder brother and his family, and Jacob and Joseph, my younger brethren, and also my sisters, and all those who would go with me. And all those who would go with me were those who believed in the warnings and the revelations of God; wherefore, they did hearken unto my words."},{"v":7,"t":"And we did take our tents and whatsoever things were possible for us, and did journey in the wilderness for the space of many days. And after we had journeyed for the space of many days we did pitch our tents."},{"v":8,"t":"And my people would that we should call the name of the place Nephi; wherefore, we did call it Nephi."},{"v":9,"t":"And all those who were with me did take upon them to call themselves the people of Nephi."},{"v":10,"t":"And we did observe to keep the judgments, and the statutes, and the commandments of the Lord in all things, according to the law of Moses."},{"v":11,"t":"And the Lord was with us; and we did prosper exceedingly; for we did sow seed, and we did reap again in abundance. And we began to raise flocks, and herds, and animals of every kind."},{"v":12,"t":"And I, Nephi, had also brought the records which were engraven upon the plates of brass; and also the ball, or compass, which was prepared for my father by the hand of the Lord, according to that which is written."},{"v":13,"t":"And it came to pass that we began to prosper exceedingly, and to multiply in the land."},{"v":14,"t":"And I, Nephi, did take the sword of Laban, and after the manner of it did make many swords, lest by any means the people who were now called Lamanites should come upon us and destroy us; for I knew their hatred towards me and my children and those who were called my people."},{"v":15,"t":"And I did teach my people to build buildings, and to work in all manner of wood, and of iron, and of copper, and of brass, and of steel, and of gold, and of silver, and of precious ores, which were in great abundance."},{"v":16,"t":"And I, Nephi, did build a temple; and I did construct it after the manner of the temple of Solomon save it were not built of so many precious things; for they were not to be found upon the land, wherefore, it could not be built like unto Solomon's temple. But the manner of the construction was like unto the temple of Solomon; and the workmanship thereof was exceedingly fine."}]},"Alma 28:2":{"ref":"Alma 28","verses":[{"v":2,"t":"And thus there was a tremendous battle; yea, even such an one as never had been known among all the people in the land from the time Lehi left Jerusalem; yea, and tens of thousands of the Lamanites were slain and scattered abroad."}]},"Mosiah 8:13–18":{"ref":"Mosiah 8","verses":[{"v":13,"t":"Now Ammon said unto him: I can assuredly tell thee, O king, of a man that can translate the records; for he has wherewith that he can look, and translate all records that are of ancient date; and it is a gift from God. And the things are called interpreters, and no man can look in them except he be commanded, lest he should look for that he ought not and he should perish. And whosoever is commanded to look in them, the same is called seer."},{"v":14,"t":"And behold, the king of the people who are in the land of Zarahemla is the man that is commanded to do these things, and who has this high gift from God."},{"v":15,"t":"And the king said that a seer is greater than a prophet."},{"v":16,"t":"And Ammon said that a seer is a revelator and a prophet also; and a gift which is greater can no man have, except he should possess the power of God, which no man can; yet a man may have great power given him from God."},{"v":17,"t":"But a seer can know of things which are past, and also of things which are to come, and by them shall all things be revealed, or, rather, shall secret things be made manifest, and hidden things shall come to light, and things which are not known shall be made known by them, and also things shall be made known by them which otherwise could not be known."},{"v":18,"t":"Thus God has provided a means that man, through faith, might work mighty miracles; therefore he becometh a great benefit to his fellow beings."}]},"Mosiah 28:11–16":{"ref":"Mosiah 28","verses":[{"v":11,"t":"Therefore he took the records which were engraven on the plates of brass, and also the plates of Nephi, and all the things which he had kept and preserved according to the commandments of God, after having translated and caused to be written the records which were on the plates of gold which had been found by the people of Limhi, which were delivered to him by the hand of Limhi;"},{"v":12,"t":"And this he did because of the great anxiety of his people; for they were desirous beyond measure to know concerning those people who had been destroyed."},{"v":13,"t":"And now he translated them by the means of those two stones which were fastened into the two rims of a bow."},{"v":14,"t":"Now these things were prepared from the beginning, and were handed down from generation to generation, for the purpose of interpreting languages;"},{"v":15,"t":"And they have been kept and preserved by the hand of the Lord, that he should discover to every creature who should possess the land the iniquities and abominations of his people;"},{"v":16,"t":"And whosoever has these things is called seer, after the manner of old times."}]},"Ether 3:23–28":{"ref":"Ether 3","verses":[{"v":23,"t":"And behold, these two stones will I give unto thee, and ye shall seal them up also with the things which ye shall write."},{"v":24,"t":"For behold, the language which ye shall write I have confounded; wherefore I will cause in my own due time that these stones shall magnify to the eyes of men these things which ye shall write."},{"v":25,"t":"And when the Lord had said these words, he showed unto the brother of Jared all the inhabitants of the earth which had been, and also all that would be; and he withheld them not from his sight, even unto the ends of the earth."},{"v":26,"t":"For he had said unto him in times before, that if he would believe in him that he could show unto him all things—it should be shown unto him; therefore the Lord could not withhold anything from him, for he knew that the Lord could show him all things."},{"v":27,"t":"And the Lord said unto him: Write these things and seal them up; and I will show them in mine own due time unto the children of men."},{"v":28,"t":"And it came to pass that the Lord commanded him that he should seal up the two stones which he had received, and show them not, until the Lord should show them unto the children of men."}]},"Words of Mormon 1:3–7":{"ref":"Words of Mormon 1","verses":[{"v":3,"t":"And now, I speak somewhat concerning that which I have written; for after I had made an abridgment from the plates of Nephi, down to the reign of this king Benjamin, of whom Amaleki spake, I searched among the records which had been delivered into my hands, and I found these plates, which contained this small account of the prophets, from Jacob down to the reign of this king Benjamin, and also many of the words of Nephi."},{"v":4,"t":"And the things which are upon these plates pleasing me, because of the prophecies of the coming of Christ; and my fathers knowing that many of them have been fulfilled; yea, and I also know that as many things as have been prophesied concerning us down to this day have been fulfilled, and as many as go beyond this day must surely come to pass—"},{"v":5,"t":"Wherefore, I chose these things, to finish my record upon them, which remainder of my record I shall take from the plates of Nephi; and I cannot write the hundredth part of the things of my people."},{"v":6,"t":"But behold, I shall take these plates, which contain these prophesyings and revelations, and put them with the remainder of my record, for they are choice unto me; and I know they will be choice unto my brethren."},{"v":7,"t":"And I do this for a wise purpose; for thus it whispereth me, according to the workings of the Spirit of the Lord which is in me. And now, I do not know all things; but the Lord knoweth all things which are to come; wherefore, he worketh in me to do according to his will."}]},"1 Nephi 9:2–6":{"ref":"1 Nephi 9","verses":[{"v":2,"t":"And now, as I have spoken concerning these plates, behold they are not the plates upon which I make a full account of the history of my people; for the plates upon which I make a full account of my people I have given the name of Nephi; wherefore, they are called the plates of Nephi, after mine own name; and these plates also are called the plates of Nephi."},{"v":3,"t":"Nevertheless, I have received a commandment of the Lord that I should make these plates, for the special purpose that there should be an account engraven of the ministry of my people."},{"v":4,"t":"Upon the other plates should be engraven an account of the reign of the kings, and the wars and contentions of my people; wherefore these plates are for the more part of the ministry; and the other plates are for the more part of the reign of the kings and the wars and contentions of my people."},{"v":5,"t":"Wherefore, the Lord hath commanded me to make these plates for a wise purpose in him, which purpose I know not."},{"v":6,"t":"But the Lord knoweth all things from the beginning; wherefore, he prepareth a way to accomplish all his works among the children of men; for behold, he hath all power unto the fulfilling of all his words. And thus it is. Amen."}]},"1 Nephi 19:1–6":{"ref":"1 Nephi 19","verses":[{"v":1,"t":"And it came to pass that the Lord commanded me, wherefore I did make plates of ore that I might engraven upon them the record of my people. And upon the plates which I made I did engraven the record of my father, and also our journeyings in the wilderness, and the prophecies of my father; and also many of mine own prophecies have I engraven upon them."},{"v":2,"t":"And I knew not at the time when I made them that I should be commanded of the Lord to make these plates; wherefore, the record of my father, and the genealogy of his fathers, and the more part of all our proceedings in the wilderness are engraven upon those first plates of which I have spoken; wherefore, the things which transpired before I made these plates are, of a truth, more particularly made mention upon the first plates."},{"v":3,"t":"And after I had made these plates by way of commandment, I, Nephi, received a commandment that the ministry and the prophecies, the more plain and precious parts of them, should be written upon these plates; and that the things which were written should be kept for the instruction of my people, who should possess the land, and also for other wise purposes, which purposes are known unto the Lord."},{"v":4,"t":"Wherefore, I, Nephi, did make a record upon the other plates, which gives an account, or which gives a greater account of the wars and contentions and destructions of my people. And this have I done, and commanded my people what they should do after I was gone; and that these plates should be handed down from one generation to another, or from one prophet to another, until further commandments of the Lord."},{"v":5,"t":"And an account of my making these plates shall be given hereafter; and then, behold, I proceed according to that which I have spoken; and this I do that the more sacred things may be kept for the knowledge of my people."},{"v":6,"t":"Nevertheless, I do not write anything upon plates save it be that I think it be sacred. And now, if I do err, even did they err of old; not that I would excuse myself because of other men, but because of the weakness which is in me, according to the flesh, I would excuse myself."}]},"Ether 5:2–4":{"ref":"Ether 5","verses":[{"v":2,"t":"And behold, ye may be privileged that ye may show the plates unto those who shall assist to bring forth this work;"},{"v":3,"t":"And unto three shall they be shown by the power of God; wherefore they shall know of a surety that these things are true."},{"v":4,"t":"And in the mouth of three witnesses shall these things be established; and the testimony of three, and this work, in the which shall be shown forth the power of God and also his word, of which the Father, and the Son, and the Holy Ghost bear record—and all this shall stand as a testimony against the world at the last day."}]},"2 Nephi 27:12–13":{"ref":"2 Nephi 27","verses":[{"v":12,"t":"Wherefore, at that day when the book shall be delivered unto the man of whom I have spoken, the book shall be hid from the eyes of the world, that the eyes of none shall behold it save it be that three witnesses shall behold it, by the power of God, besides him to whom the book shall be delivered; and they shall testify to the truth of the book and the things therein."},{"v":13,"t":"And there is none other which shall view it, save it be a few according to the will of God, to bear testimony of his word unto the children of men; for the Lord God hath said that the words of the faithful should speak as if it were from the dead."}]},"Deuteronomy 19:15":{"ref":"Deuteronomy 19","verses":[{"v":15,"t":"One witness shall not rise up against a man for any iniquity, or for any sin, in any sin that he sinneth: at the mouth of two witnesses, or at the mouth of three witnesses, shall the matter be established."}]},"2 Corinthians 13:1":{"ref":"2 Corinthians 13","verses":[{"v":1,"t":"This is the third time I am coming to you. In the mouth of two or three witnesses shall every word be established."}]},"Alma 46:12–13":{"ref":"Alma 46","verses":[{"v":12,"t":"And it came to pass that he rent his coat; and he took a piece thereof, and wrote upon it—In memory of our God, our religion, and freedom, and our peace, our wives, and our children—and he fastened it upon the end of a pole."},{"v":13,"t":"And he fastened on his head-plate, and his breastplate, and his shields, and girded on his armor about his loins; and he took the pole, which had on the end thereof his rent coat, (and he called it the title of liberty) and he bowed himself to the earth, and he prayed mightily unto his God for the blessings of liberty to rest upon his brethren, so long as there should a band of Christians remain to possess the land—"}]},"Ezekiel 37:15–20":{"ref":"Ezekiel 37","verses":[{"v":15,"t":"The word of the LORD came again unto me, saying,"},{"v":16,"t":"Moreover, thou son of man, take thee one stick, and write upon it, For Judah, and for the children of Israel his companions: then take another stick, and write upon it, For Joseph, the stick of Ephraim, and for all the house of Israel his companions:"},{"v":17,"t":"And join them one to another into one stick; and they shall become one in thine hand."},{"v":18,"t":"And when the children of thy people shall speak unto thee, saying, Wilt thou not shew us what thou meanest by these?"},{"v":19,"t":"Say unto them, Thus saith the Lord GOD; Behold, I will take the stick of Joseph, which is in the hand of Ephraim, and the tribes of Israel his fellows, and will put them with him, even with the stick of Judah, and make them one stick, and they shall be one in mine hand."},{"v":20,"t":"And the sticks whereon thou writest shall be in thine hand before their eyes."}]},"Isaiah 18":{"ref":"Isaiah 18","verses":[{"v":1,"t":"Woe to the land shadowing with wings, which is beyond the rivers of Ethiopia:"},{"v":2,"t":"That sendeth ambassadors by the sea, even in vessels of bulrushes upon the waters, saying, Go, ye swift messengers, to a nation scattered and peeled, to a people terrible from their beginning hitherto; a nation meted out and trodden down, whose land the rivers have spoiled!"},{"v":3,"t":"All ye inhabitants of the world, and dwellers on the earth, see ye, when he lifteth up an ensign on the mountains; and when he bloweth a trumpet, hear ye."},{"v":4,"t":"For so the LORD said unto me, I will take my rest, and I will consider in my dwelling place like a clear heat upon herbs, and like a cloud of dew in the heat of harvest."},{"v":5,"t":"For afore the harvest, when the bud is perfect, and the sour grape is ripening in the flower, he shall both cut off the sprigs with pruning hooks, and take away and cut down the branches."},{"v":6,"t":"They shall be left together unto the fowls of the mountains, and to the beasts of the earth: and the fowls shall summer upon them, and all the beasts of the earth shall winter upon them."},{"v":7,"t":"In that time shall the present be brought unto the LORD of hosts of a people scattered and peeled, and from a people terrible from their beginning hitherto; a nation meted out and trodden under foot, whose land the rivers have spoiled, to the place of the name of the LORD of hosts, the mount Zion."}]},"Abraham 1:1–3 (Pearl of Great Price)":{"ref":"Abraham 1","verses":[{"v":1,"t":"In the land of the Chaldeans, at the residence of my fathers, I, Abraham, saw that it was needful for me to obtain another place of residence;"},{"v":2,"t":"And, finding there was greater happiness and peace and rest for me, I sought for the blessings of the fathers, and the right whereunto I should be ordained to administer the same; having been myself a follower of righteousness, desiring also to be one who possessed great knowledge, and to be a greater follower of righteousness, and to possess a greater knowledge, and to be a father of many nations, a prince of peace, and desiring to receive instructions, and to keep the commandments of God, I became a rightful heir, a High Priest, holding the right belonging to the fathers."},{"v":3,"t":"It was conferred upon me from the fathers; it came down from the fathers, from the beginning of time, yea, even from the beginning, or before the foundation of the earth, down to the present time, even the right of the firstborn, or the first man, who is Adam, or first father, through the fathers unto me."}]},"2 Nephi 3:6–18":{"ref":"2 Nephi 3","verses":[{"v":6,"t":"For Joseph truly testified, saying: A seer shall the Lord my God raise up, who shall be a choice seer unto the fruit of my loins."},{"v":7,"t":"Yea, Joseph truly said: Thus saith the Lord unto me: A choice seer will I raise up out of the fruit of thy loins; and he shall be esteemed highly among the fruit of thy loins. And unto him will I give commandment that he shall do a work for the fruit of thy loins, his brethren, which shall be of great worth unto them, even to the bringing of them to the knowledge of the covenants which I have made with thy fathers."},{"v":8,"t":"And I will give unto him a commandment that he shall do none other work, save the work which I shall command him. And I will make him great in mine eyes; for he shall do my work."},{"v":9,"t":"And he shall be great like unto Moses, whom I have said I would raise up unto you, to deliver my people, O house of Israel."},{"v":10,"t":"And Moses will I raise up, to deliver thy people out of the land of Egypt."},{"v":11,"t":"But a seer will I raise up out of the fruit of thy loins; and unto him will I give power to bring forth my word unto the seed of thy loins—and not to the bringing forth my word only, saith the Lord, but to the convincing them of my word, which shall have already gone forth among them."},{"v":12,"t":"Wherefore, the fruit of thy loins shall write; and the fruit of the loins of Judah shall write; and that which shall be written by the fruit of thy loins, and also that which shall be written by the fruit of the loins of Judah, shall grow together, unto the confounding of false doctrines and laying down of contentions, and establishing peace among the fruit of thy loins, and bringing them to the knowledge of their fathers in the latter days, and also to the knowledge of my covenants, saith the Lord."},{"v":13,"t":"And out of weakness he shall be made strong, in that day when my work shall commence among all my people, unto the restoring thee, O house of Israel, saith the Lord."},{"v":14,"t":"And thus prophesied Joseph, saying: Behold, that seer will the Lord bless; and they that seek to destroy him shall be confounded; for this promise, which I have obtained of the Lord, of the fruit of my loins, shall be fulfilled. Behold, I am sure of the fulfilling of this promise;"},{"v":15,"t":"And his name shall be called after me; and it shall be after the name of his father. And he shall be like unto me; for the thing, which the Lord shall bring forth by his hand, by the power of the Lord shall bring my people unto salvation."},{"v":16,"t":"Yea, thus prophesied Joseph: I am sure of this thing, even as I am sure of the promise of Moses; for the Lord hath said unto me, I will preserve thy seed forever."},{"v":17,"t":"And the Lord hath said: I will raise up a Moses; and I will give power unto him in a rod; and I will give judgment unto him in writing. Yet I will not loose his tongue, that he shall speak much, for I will not make him mighty in speaking. But I will write unto him my law, by the finger of mine own hand; and I will make a spokesman for him."},{"v":18,"t":"And the Lord said unto me also: I will raise up unto the fruit of thy loins; and I will make for him a spokesman. And I, behold, I will give unto him that he shall write the writing of the fruit of thy loins, unto the fruit of thy loins; and the spokesman of thy loins shall declare it."}]},"2 Nephi 4:1–2":{"ref":"2 Nephi 4","verses":[{"v":1,"t":"And now, I, Nephi, speak concerning the prophecies of which my father hath spoken, concerning Joseph, who was carried into Egypt."},{"v":2,"t":"For behold, he truly prophesied concerning all his seed. And the prophecies which he wrote, there are not many greater. And he prophesied concerning us, and our future generations; and they are written upon the plates of brass."}]},"Genesis 50:22–26 (KJV)":{"ref":"Genesis 50","verses":[{"v":22,"t":"And Joseph dwelt in Egypt, he, and his father's house: and Joseph lived an hundred and ten years."},{"v":23,"t":"And Joseph saw Ephraim's children of the third generation: the children also of Machir the son of Manasseh were brought up upon Joseph's knees."},{"v":24,"t":"And Joseph said unto his brethren, I die: and God will surely visit you, and bring you out of this land unto the land which he sware to Abraham, to Isaac, and to Jacob."},{"v":25,"t":"And Joseph took an oath of the children of Israel, saying, God will surely visit you, and ye shall carry up my bones from hence."},{"v":26,"t":"So Joseph died, being an hundred and ten years old: and they embalmed him, and he was put in a coffin in Egypt."}]},"2 Nephi 5:10":{"ref":"2 Nephi 5","verses":[{"v":10,"t":"And we did observe to keep the judgments, and the statutes, and the commandments of the Lord in all things, according to the law of Moses."}]},"2 Nephi 5:26":{"ref":"2 Nephi 5","verses":[{"v":26,"t":"And it came to pass that I, Nephi, did consecrate Jacob and Joseph, that they should be priests and teachers over the land of my people."}]},"2 Nephi 25:24":{"ref":"2 Nephi 25","verses":[{"v":24,"t":"And, notwithstanding we believe in Christ, we keep the law of Moses, and look forward with steadfastness unto Christ, until the law shall be fulfilled."}]},"1 Nephi 5:9":{"ref":"1 Nephi 5","verses":[{"v":9,"t":"And it came to pass that they did rejoice exceedingly, and did offer sacrifice and burnt offerings unto the Lord; and they gave thanks unto the God of Israel."}]},"Mosiah 2:3":{"ref":"Mosiah 2","verses":[{"v":3,"t":"And they also took of the firstlings of their flocks, that they might offer sacrifice and burnt offerings according to the law of Moses;"}]},"Jacob 1:18":{"ref":"Jacob 1","verses":[{"v":18,"t":"For I, Jacob, and my brother Joseph had been consecrated priests and teachers of this people, by the hand of Nephi."}]},"Numbers 3:9-12":{"ref":"Numbers 3","verses":[{"v":9,"t":"And thou shalt give the Levites unto Aaron and to his sons: they are wholly given unto him out of the children of Israel."},{"v":10,"t":"And thou shalt appoint Aaron and his sons, and they shall wait on their priest's office: and the stranger that cometh nigh shall be put to death."},{"v":11,"t":"And the LORD spake unto Moses, saying,"},{"v":12,"t":"And I, behold, I have taken the Levites from among the children of Israel instead of all the firstborn that openeth the matrix among the children of Israel: therefore the Levites shall be mine;"}]},"Numbers 16:39-40":{"ref":"Numbers 16","verses":[{"v":39,"t":"And Eleazar the priest took the brasen censers, wherewith they that were burnt had offered; and they were made broad plates for a covering of the altar:"},{"v":40,"t":"To be a memorial unto the children of Israel, that no stranger, which is not of the seed of Aaron, come near to offer incense before the LORD; that he be not as Korah, and as his company: as the LORD said to him by the hand of Moses."}]},"Deuteronomy 33:8-11":{"ref":"Deuteronomy 33","verses":[{"v":8,"t":"And of Levi he said, Let thy Thummim and thy Urim be with thy holy one, whom thou didst prove at Massah, and with whom thou didst strive at the waters of Meribah;"},{"v":9,"t":"Who said unto his father and to his mother, I have not seen him; neither did he acknowledge his brethren, nor knew his own children: for they have observed thy word, and kept thy covenant."},{"v":10,"t":"They shall teach Jacob thy judgments, and Israel thy law: they shall put incense before thee, and whole burnt sacrifice upon thine altar."},{"v":11,"t":"Bless, LORD, his substance, and accept the work of his hands: smite through the loins of them that rise against him, and of them that hate him, that they rise not again."}]},"Hebrews 7:13-14":{"ref":"Hebrews 7","verses":[{"v":13,"t":"For he of whom these things are spoken pertaineth to another tribe, of which no man gave attendance at the altar."},{"v":14,"t":"For it is evident that our Lord sprang out of Juda; of which tribe Moses spake nothing concerning priesthood."}]},"2 Chronicles 26:16-21":{"ref":"2 Chronicles 26","verses":[{"v":16,"t":"But when he was strong, his heart was lifted up to his destruction: for he transgressed against the LORD his God, and went into the temple of the LORD to burn incense upon the altar of incense."},{"v":17,"t":"And Azariah the priest went in after him, and with him fourscore priests of the LORD, that were valiant men:"},{"v":18,"t":"And they withstood Uzziah the king, and said unto him, It appertaineth not unto thee, Uzziah, to burn incense unto the LORD, but to the priests the sons of Aaron, that are consecrated to burn incense: go out of the sanctuary; for thou hast trespassed; neither shall it be for thine honour from the LORD God."},{"v":19,"t":"Then Uzziah was wroth, and had a censer in his hand to burn incense: and while he was wroth with the priests, the leprosy even rose up in his forehead before the priests in the house of the LORD, from beside the incense altar."},{"v":20,"t":"And Azariah the chief priest, and all the priests, looked upon him, and, behold, he was leprous in his forehead, and they thrust him out from thence; yea, himself hasted also to go out, because the LORD had smitten him."},{"v":21,"t":"And Uzziah the king was a leper unto the heir wickedness, and their murders, and their robbings, and their plundering, and all manner of abominations and whoredoms, cannot be contained in this work."}]},"Deuteronomy 12:5-14":{"ref":"Deuteronomy 12","verses":[{"v":5,"t":"But unto the place which the LORD your God shall choose out of all your tribes to put his name there, even unto his habitation shall ye seek, and thither thou shalt come:"},{"v":6,"t":"And thither ye shall bring your burnt offerings, and your sacrifices, and your tithes, and heave offerings of your hand, and your vows, and your freewill offerings, and the firstlings of your herds and of your flocks:"},{"v":7,"t":"And there ye shall eat before the LORD your God, and ye shall rejoice in all that ye put your hand unto, ye and your households, wherein the LORD thy God hath blessed thee."},{"v":8,"t":"Ye shall not do after all the things that we do here this day, every man whatsoever is right in his own eyes."},{"v":9,"t":"For ye are not as yet come to the rest and to the inheritance, which the LORD your God giveth you."},{"v":10,"t":"But when ye go over Jordan, and dwell in the land which the LORD your God giveth you to inherit, and when he giveth you rest from all your enemies round about, so that ye dwell in safety;"},{"v":11,"t":"Then there shall be a place which the LORD your God shall choose to cause his name to dwell there; thither shall ye bring all that I command you; your burnt offerings, and your sacrifices, your tithes, and the heave offering of your hand, and all your choice vows which ye vow unto the LORD:"},{"v":12,"t":"And ye shall rejoice before the LORD your God, ye, and your sons, and your daughters, and your menservants, and your maidservants, and the Levite that is within your gates; forasmuch as he hath no part nor inheritance with you."},{"v":13,"t":"Take heed to thyself that thou offer not thy burnt offerings in every place that thou seest:"},{"v":14,"t":"But in the place which the LORD shall choose in one of thy tribes, there thou shalt offer thy burnt offerings, and there thou shalt do all that I command thee."}]},"1 Kings 8:29":{"ref":"1 Kings 8","verses":[{"v":29,"t":"That thine eyes may be open toward this house night and day, even toward the place of which thou hast said, My name shall be there: that thou mayest hearken unto the prayer which thy servant shall make toward this place."}]},"3 Nephi 11:8-17":{"ref":"3 Nephi 11","verses":[{"v":8,"t":"And it came to pass, as they understood they cast their eyes up again towards heaven; and behold, they saw a Man descending out of heaven; and he was clothed in a white robe; and he came down and stood in the midst of them; and the eyes of the whole multitude were turned upon him, and they durst not open their mouths, even one to another, and wist not what it meant, for they thought it was an angel that had appeared unto them."},{"v":9,"t":"And it came to pass that he stretched forth his hand and spake unto the people, saying:"},{"v":10,"t":"Behold, I am Jesus Christ, whom the prophets testified shall come into the world."},{"v":11,"t":"And behold, I am the light and the life of the world; and I have drunk out of that bitter cup which the Father hath given me, and have glorified the Father in taking upon me the sins of the world, in the which I have suffered the will of the Father in all things from the beginning."},{"v":12,"t":"And it came to pass that when Jesus had spoken these words the whole multitude fell to the earth; for they remembered that it had been prophesied among them that Christ should show himself unto them after his ascension into heaven."},{"v":13,"t":"And it came to pass that the Lord spake unto them saying:"},{"v":14,"t":"Arise and come forth unto me, that ye may thrust your hands into my side, and also that ye may feel the prints of the nails in my hands and in my feet, that ye may know that I am the God of Israel, and the God of the whole earth, and have been slain for the sins of the world."},{"v":15,"t":"And it came to pass that the multitude went forth, and thrust their hands into his side, and did feel the prints of the nails in his hands and in his feet; and this they did do, going forth one by one until they had all gone forth, and did see with their eyes and did feel with their hands, and did know of a surety and did bear record, that it was he, of whom it was written by the prophets, that should come."},{"v":16,"t":"And when they had all gone forth and had witnessed for themselves, they did cry out with one accord, saying:"},{"v":17,"t":"Hosanna! Blessed be the name of the Most High God! And they did fall down at the feet of Jesus, and did worship him."}]},"3 Nephi 26:13":{"ref":"3 Nephi 26","verses":[{"v":13,"t":"Therefore, I would that ye should behold that the Lord truly did teach the people, for the space of three days; and after that he did show himself unto them oft, and did break bread oft, and bless it, and give it unto them."}]},"Acts 3:20-21":{"ref":"Acts 3","verses":[{"v":20,"t":"And he shall send Jesus Christ, which before was preached unto you:"},{"v":21,"t":"Whom the heaven must receive until the times of restitution of all things, which God hath spoken by the mouth of all his holy prophets since the world began."}]},"Acts 1:9-11":{"ref":"Acts 1","verses":[{"v":9,"t":"And when he had spoken these things, while they beheld, he was taken up; and a cloud received him out of their sight."},{"v":10,"t":"And while they looked steadfastly toward heaven as he went up, behold, two men stood by them in white apparel;"},{"v":11,"t":"Which also said, Ye men of Galilee, why stand ye gazing up into heaven? this same Jesus, which is taken up from you into heaven, shall so come in like manner as ye have seen him go into heaven."}]},"D&C 84:2-5":{"ref":"D&C 84","verses":[{"v":2,"t":"Yea, the word of the Lord concerning his church, established in the last days for the restoration of his people, as he has spoken by the mouth of his prophets, and for the gathering of his saints to stand upon Mount Zion, which shall be the city of New Jerusalem."},{"v":3,"t":"Which city shall be built, beginning at the temple lot, which is appointed by the finger of the Lord, in the western boundaries of the State of Missouri, and dedicated by the hand of Joseph Smith, Jun., and others with whom the Lord was well pleased."},{"v":4,"t":"Verily this is the word of the Lord, that the city New Jerusalem shall be built by the gathering of the saints, beginning at this place, even the place of the temple, which temple shall be reared in this generation."},{"v":5,"t":"For verily this generation shall not all pass away until an house shall be built unto the Lord, and a cloud shall rest upon it, which cloud shall be even the glory of the Lord, which shall fill the house."}]},"D&C 114:1":{"ref":"D&C 114","verses":[{"v":1,"t":"Verily thus saith the Lord: It is wisdom in my servant David W. Patten, that he settle up all his business as soon as he possibly can, and make a disposition of his merchandise, that he may perform a mission unto me next spring, in company with others, even twelve including himself, to testify of my name and bear glad tidings unto all the world."}]},"D&C 124:49-51":{"ref":"D&C 124","verses":[{"v":49,"t":"Verily, verily, I say unto you, that when I give a commandment to any of the sons of men to do a work unto my name, and those sons of men go with all their might and with all they have to perform that work, and cease not their diligence, and their enemies come upon them and hinder them from performing that work, behold, it behooveth me to require that work no more at the hands of those sons of men, but to accept of their offerings."},{"v":50,"t":"And the iniquity and transgression of my holy laws and commandments I will visit upon the heads of those who hindered my work, unto the third and fourth generation, so long as they repent not, and hate me, saith the Lord God."},{"v":51,"t":"Therefore, for this cause have I accepted the offerings of those whom I commanded to build up a city and a house unto my name, in Jackson county, Missouri, and were hindered by their enemies, saith the Lord your God."}]},"Deuteronomy 18:20-22":{"ref":"Deuteronomy 18","verses":[{"v":20,"t":"But the prophet, which shall presume to speak a word in my name, which I have not commanded him to speak, or that shall speak in the name of other gods, even that prophet shall die."},{"v":21,"t":"And if thou say in thine heart, How shall we know the word which the LORD hath not spoken?"},{"v":22,"t":"When a prophet speaketh in the name of the LORD, if the thing follow not, nor come to pass, that is the thing which the LORD hath not spoken, but the prophet hath spoken it presumptuously: thou shalt not be afraid of him."}]},"Ezekiel 33:33":{"ref":"Ezekiel 33","verses":[{"v":33,"t":"And when this cometh to pass, (lo, it will come,) then shall they know that a prophet hath been among them."}]},"Jeremiah 28:9":{"ref":"Jeremiah 28","verses":[{"v":9,"t":"The prophet which prophesieth of peace, when the word of the prophet shall come to pass, then shall the prophet be known, that the LORD hath truly sent him."}]},"D&C 89:1-9":{"ref":"D&C 89","verses":[{"v":1,"t":"A WORD OF WISDOM, for the benefit of the council of high priests, assembled in Kirtland, and the church, and also the saints in Zion—"},{"v":2,"t":"To be sent greeting; not by commandment or constraint, but by revelation and the word of wisdom, showing forth the order and will of God in the temporal salvation of all saints in the last days—"},{"v":3,"t":"Given for a principle with promise, adapted to the capacity of the weak and the weakest of all saints, who are or can be called saints."},{"v":4,"t":"Behold, verily, thus saith the Lord unto you: In consequence of evils and designs which do and will exist in the hearts of conspiring men in the last days, I have warned you, and forewarn you, by giving unto you this word of wisdom by revelation—"},{"v":5,"t":"That inasmuch as any man drinketh wine or strong drink among you, behold it is not good, neither meet in the sight of your Father, only in assembling yourselves together to offer up your sacraments before him."},{"v":6,"t":"And, behold, this should be wine, yea, pure wine of the grape of the vine, of your own make."},{"v":7,"t":"And, again, strong drinks are not for the belly, but for the washing of your bodies."},{"v":8,"t":"And again, tobacco is not for the body, neither for the belly, and is not good for man, but is an herb for bruises and all sick cattle, to be used with judgment and skill."},{"v":9,"t":"And again, hot drinks are not for the body or belly."}]},"Mark 7:18-19":{"ref":"Mark 7","verses":[{"v":18,"t":"And he saith unto them, Are ye so without understanding also? Do ye not perceive, that whatsoever thing from without entereth into the man, it cannot defile him;"},{"v":19,"t":"Because it entereth not into his heart, but into the belly, and goeth out into the draught, purging all meats?"}]},"Colossians 2:16-23":{"ref":"Colossians 2","verses":[{"v":16,"t":"Let no man therefore judge you in meat, or in drink, or in respect of an holyday, or of the new moon, or of the sabbath days:"},{"v":17,"t":"Which are a shadow of things to come; but the body is of Christ."},{"v":18,"t":"Let no man beguile you of your reward in a voluntary humility and worshipping of angels, intruding into those things which he hath not seen, vainly puffed up by his fleshly mind,"},{"v":19,"t":"And not holding the Head, from which all the body by joints and bands having nourishment ministered, and knit together, increaseth with the increase of God."},{"v":20,"t":"Wherefore if ye be dead with Christ from the rudiments of the world, why, as though living in the world, are ye subject to ordinances,"},{"v":21,"t":"(Touch not; taste not; handle not;"},{"v":22,"t":"Which all are to perish with the using;) after the commandments and doctrines of men?"},{"v":23,"t":"Which things have indeed a shew of wisdom in will worship, and humility, and neglecting of the body; not in any honour to the satisfying of the flesh."}]},"1 Timothy 4:1-5":{"ref":"1 Timothy 4","verses":[{"v":1,"t":"Now the Spirit speaketh expressly, that in the latter times some shall depart from the faith, giving heed to seducing spirits, and doctrines of devils;"},{"v":2,"t":"Speaking lies in hypocrisy; having their conscience seared with a hot iron;"},{"v":3,"t":"Forbidding to marry, and commanding to abstain from meats, which God hath created to be received with thanksgiving of them which believe and know the truth."},{"v":4,"t":"For every creature of God is good, and nothing to be refused, if it be received with thanksgiving:"},{"v":5,"t":"For it is sanctified by the word of God and prayer."}]},"Romans 14:14-17":{"ref":"Romans 14","verses":[{"v":14,"t":"I know, and am persuaded by the Lord Jesus, that there is nothing unclean of itself: but to him that esteemeth any thing to be unclean, to him it is unclean."},{"v":15,"t":"But if thy brother be grieved with thy meat, now walkest thou not charitably. Destroy not him with thy meat, for whom Christ died."},{"v":16,"t":"Let not then your good be evil spoken of:"},{"v":17,"t":"For the kingdom of God is not meat and drink; but righteousness, and peace, and joy in the Holy Ghost."}]},"Matthew 11:19":{"ref":"Matthew 11","verses":[{"v":19,"t":"The Son of man came eating and drinking, and they say, Behold a man gluttonous, and a winebibber, a friend of publicans and sinners. But wisdom is justified of her children."}]},"Numbers 15:38-39":{"ref":"Numbers 15","verses":[{"v":38,"t":"Speak unto the children of Israel, and bid them that they make them fringes in the borders of their garments throughout their generations, and that they put upon the fringe of the borders a ribband of blue:"},{"v":39,"t":"And it shall be unto you for a fringe, that ye may look upon it, and remember all the commandments of the LORD, and do them; and that ye seek not after your own heart and your own eyes, after which ye use to go a whoring:"}]},"Deuteronomy 22:12":{"ref":"Deuteronomy 22","verses":[{"v":12,"t":"Thou shalt make thee fringes upon the four quarters of thy vesture, wherewith thou coverest thyself."}]},"Matthew 23:5":{"ref":"Matthew 23","verses":[{"v":5,"t":"But all their works they do for to be seen of men: they make broad their phylacteries, and enlarge the borders of their garments,"}]},"D&C 132:19-20":{"ref":"D&C 132","verses":[{"v":19,"t":"And again, verily I say unto you, if a man marry a wife by my word, which is my law, and by the new and everlasting covenant, and it is sealed unto them by the Holy Spirit of promise, by him who is anointed, unto whom I have appointed this power and the keys of this priesthood; and it shall be said unto them—Ye shall come forth in the first resurrection; and if it be after the first resurrection, in the next resurrection; and shall inherit thrones, kingdoms, principalities, and powers, dominions, all heights and depths—then shall it be written in the Lamb's Book of Life, that he shall commit no murder whereby to shed innocent blood, and if ye abide in my covenant, and commit no murder whereby to shed innocent blood, it shall be done unto them in all things whatsoever my servant hath put upon them, in time, and through all eternity; and shall be of full force when they are out of the world; and they shall pass by the angels, and the gods, which are set there, to their exaltation and glory in all things, as hath been sealed upon their heads, which glory shall be a fulness and a continuation of the seeds forever and ever."},{"v":20,"t":"Then shall they be gods, because they have no end; therefore shall they be from everlasting to everlasting, because they continue; then shall they be above all, because all things are subject unto them. Then shall they be gods, because they have all power, and the angels are subject unto them."}]},"D&C 132:37":{"ref":"D&C 132","verses":[{"v":37,"t":"Abraham received concubines, sformed into an angel of light."}]},"Jeremiah 23:14":{"ref":"Jeremiah 23","verses":[{"v":14,"t":"I have seen also in the prophets of Jerusalem an horrible thing: they commit adultery, and walk in lies: they strengthen also the hands of evildoers, that none doth return from his wickedness: they are all of them unto me as Sodom, and the inhabitants thereof as Gomorrah."}]},"D&C 128:15-18":{"ref":"D&C 128","verses":[{"v":15,"t":"And now, my dearly beloved brethren and sisters, let me assure you that these are principles in relation to the dead and the living that cannot be lightly passed over, as pertaining to our salvation. For their salvation is necessary and essential to our salvation, as Paul says concerning the fathers—that they without us cannot be made perfect—neither can we without our dead be made perfect."},{"v":16,"t":"And now, in relation to the baptism for the dead, I will give you another quotation of Paul, 1 Corinthians 15:29: Else what shall they do which are baptized for the dead, if the dead rise not at all? Why are they then baptized for the dead?"},{"v":17,"t":"And again, in connection with this quotation I will give you a quotation from one of the prophets, who had his eye fixed on the restoration of the priesthood, the glories to be revealed in the last days, and in an especial manner this most glorious of all subjects belonging to the everlasting gospel, namely, the baptism for the dead; for Malachi says, last chapter, verses 5th and 6th: Behold, I will send you Elijah the prophet before the coming of the great and dreadful day of the Lord: And he shall turn the heart of the fathers to the children, and the heart of the children to their fathers, lest I come and smite the earth with a curse."},{"v":18,"t":"I might have rendered a plainer translation to this, but it is sufficiently plain to suit my purpose as it stands. It is sufficient to know, in this case, that the earth will be smitten with a curse unless there is a welding link of some kind o e Spirit of the Lord hath withdrawn from you, and hath no place in you, and the devil hath all power over you; and this is the final state of the wicked."}]},"1 Corinthians 15:29":{"ref":"1 Corinthians 15","verses":[{"v":29,"t":"Else what shall they do which are baptized for the dead, if the dead rise not at all? why are they then baptized for the dead?"}]},"D&C 134:9":{"ref":"D&C 134","verses":[{"v":9,"t":"We do not believe it just to mingle religious influence with civil government, whereby one religious society is fostered and another proscribed in its spiritual privileges, and the individual rights of its members, as citizens, denied."}]},"Matthew 22:21":{"ref":"Matthew 22","verses":[{"v":21,"t":"They say unto him, Cæsar's. Then saith he unto them, Render therefore unto Cæsar the things which are Cæsar's; and unto God the things that are God's."}]},"John 18:36":{"ref":"John 18","verses":[{"v":36,"t":"Jesus answered, My kingdom is not of this world: if my kingdom were of this world, then would my servants fight, that I should not be delivered to the Jews: but now is my kingdom not from hence."}]},"2 Corinthians 8:20-21":{"ref":"2 Corinthians 8","verses":[{"v":20,"t":"Avoiding this, that no man should blame us in this abundance which is administered by us:"},{"v":21,"t":"Providing for honest things, not only in the sight of the Lord, but also in the sight of men."}]},"2 Nephi 9:34":{"ref":"2 Nephi 9","verses":[{"v":34,"t":"Wo unto the liar, for he shall be thrust down to hell."}]},"Romans 3:7-8":{"ref":"Romans 3","verses":[{"v":7,"t":"For if the truth of God hath more abounded through my lie unto his glory; why yet am I also judged as a sinner?"},{"v":8,"t":"And not rather, (as we be slanderously reported, and as some affirm that we say,) Let us do evil, that good may come? whose damnation is just."}]},"D&C 46:23-27":{"ref":"D&C 46","verses":[{"v":23,"t":"And to others the discerning of spirits."},{"v":24,"t":"And again, it is given to some to speak with tongues;"
