{"id":"mountain-meadows-massacre","category":"violence-history","severity":"high","verdict":"admitted","title":"The Mountain Meadows Massacre (1857)","claim":"On September 11, 1857, Mormon militiamen of the Iron County brigade — planned and ordered by local church/militia leaders in the Cedar City area, including stake president Isaac Haight and Bishop John D. Lee — lured the surrendered Baker-Fancher wagon train out under a white flag and murdered about 120 men, women, and children, sparing only small children. The church's own sponsored history (Walker, Turley, and Leonard, 'Massacre at Mountain Meadows,' Oxford 2008) confirms local church leadership responsibility, and in 2007 Elder Henry B. Eyring, for the First Presidency, expressed 'profound regret.' Only John D. Lee was ever executed (1877).","bom":[],"bible":["Exodus 20:13","Matthew 5:44","Romans 12:19"],"sources":[{"name":"Walker, Turley & Leonard, Massacre at Mountain Meadows (Oxford, church-sponsored)","type":"scholarly","url":"https://newsroom.churchofjesuschrist.org/article/co-authors-complete-multiyear-mountain-meadows-massacre-project"},{"name":"LDS Church History Topics: Mountain Meadows Massacre","type":"institutional","url":"https://www.churchofjesuschrist.org/study/history/topics/mountain-meadows-massacre?lang=eng"},{"name":"Church Newsroom: 150th Anniversary statement (Eyring, 2007)","type":"institutional","url":"https://newsroom.churchofjesuschrist.org/article/150th-anniversary-of-mountain-meadows-massacre"}],"response":"The church fully acknowledges the massacre and its horror. The steelman: it occurred amid Utah War hysteria — an approaching federal army, memories of Missouri and Nauvoo persecutions, and wartime rhetoric; the church-sponsored history concludes Brigham Young did not order it (his express letter counseling to let the train pass arrived two days late), local leaders acted against counsel, and the cover-up was local before it was institutional. Participants were later excommunicated; the church has built memorials, cooperated with descendant groups, and published the fullest account itself.","responseSource":{"name":"Walker, Turley & Leonard, Massacre at Mountain Meadows (Oxford, 2008); 2007 First Presidency statement"},"rationale":"The massacre, its scale, and local church leadership's orchestration are established by the church's own sponsored scholarship and official statements. Critics who claim Brigham Young directly ordered it go beyond the documentary evidence — the church history concludes he didn't, though his war-hysteria preaching contributed. The claim as stated — church leaders at the Cedar City level planned mass murder — is conceded by all serious parties."},
{"id":"nauvoo-expositor-carthage","category":"violence-history","severity":"high","verdict":"admitted","title":"The Nauvoo Expositor and the martyrdom narrative","claim":"On June 10, 1844, Joseph Smith as mayor and the Nauvoo city council ordered destruction of the Nauvoo Expositor's press after its single June 7 issue — whose core reporting on Smith's secret plural marriage and plurality-of-gods teaching was substantively accurate. The destruction triggered riot charges, Smith's surrender at Carthage, and the June 27 mob attack. At Carthage, Smith fired a smuggled six-shot pepperbox pistol into the mob, wounding three men (John Taylor's account, History of the Church 7:102–103) — a fact long omitted from devotional retellings of the 'martyrdom.'","bom":[],"bible":["1 Peter 2:23","Matthew 26:52","Proverbs 10:9"],"sources":[{"name":"LDS Church History Topics: Nauvoo Expositor","type":"institutional","url":"https://www.churchofjesuschrist.org/study/history/topics/nauvoo-expositor?lang=eng"},{"name":"Joseph Smith Papers: Order to Destroy Nauvoo Expositor Press","type":"primary","url":"https://www.josephsmithpapers.org/event/order-to-destroy-nauvoo-expositor-press"},{"name":"FAIR: Joseph Smith fired a gun at Carthage Jail","type":"apologetics","url":"https://www.fairlatterdaysaints.org/answers/Joseph_Smith_fired_a_gun_at_Carthage_Jail"}],"response":"Dallin H. Oaks's 1965 Utah Law Review analysis: before the 14th Amendment, the First Amendment did not bind city governments, and abating the newspapers as a nuisance had colorable legal basis under the Nauvoo Charter — though Oaks concedes destroying the press itself was likely beyond legal justification. The council feared the paper would incite mob violence against the city — and the mob came anyway. On Carthage: defending oneself against a lynch mob with painted faces does not negate unjust killing; Smith was in state custody under the governor's pledged protection, the pistol is recorded by eyewitness John Taylor himself, and the church has published the fact (e.g., in 'Saints'). Martyrdom in the broad sense means being killed for one's religion, not dying passively.","responseSource":{"name":"Dallin H. Oaks, 'The Suppression of the Nauvoo Expositor,' Utah Law Review 9 (1965); FAIR"},"rationale":"Every factual element — the accuracy of the Expositor's reporting, the mayor-ordered destruction, the pepperbox — is documented in the Joseph Smith Papers, History of the Church, and church topic essays. Apologetics contests the framing ('martyr' vs. 'gunfight victim') and mitigates the legality question, but the killing was unambiguously extrajudicial murder AND the suppression of a truthful press was the proximate trigger. Both things are true; neither is refuted."},
{"id":"oath-of-vengeance","category":"violence-history","severity":"medium","verdict":"unrefuted","title":"The temple oath of vengeance (c. 1845–1927)","claim":"From roughly 1845 until about 1927, the LDS temple endowment included a covenant to 'pray and never cease to pray Almighty God to avenge the blood of the prophets upon this nation, and… teach the same to your children and to your children's children unto the third and fourth generation.' Its existence and wording were documented under oath in the U.S. Senate's Reed Smoot hearings (1904–06); it was quietly removed around 1927 during the church's assimilation era, with no public explanation or repudiation.","bom":[],"bible":["Matthew 5:44","Romans 12:19-21","Luke 23:34"],"sources":[{"name":"Reed Smoot hearing testimony on the Oath of Vengeance (1906 record)","type":"primary","url":"https://bhroberts.org/records/yXnsPd-q7SvBk/report_concerning_the_reed_smoot_hearing_from_june_1906_discusses_the_oath_of_vengeance_in_the_lds_temple_ceremony"},{"name":"David John Buerger, 'The Development of the Mormon Temple Endowment Ceremony' (Dialogue)","type":"scholarly","url":"https://bhroberts.org/records/6kQ26b-jpNwrb/david_john_buergers_the_development_of_the_mormon_temple_endowment_ceremony_references_the_oath_of_vengeance_removal"},{"name":"FAIR: Endowment/Oath of vengeance","type":"apologetics","url":"https://www.fairlatterdaysaints.org/answers/Latter-day_Saint_Temples/Endowment/Oath_of_vengeance"}],"response":"FAIR emphasizes the oath asked God to avenge — it did not commit members to take vengeance themselves — closely paralleling the martyrs' cry in Revelation 6:10 ('How long, O Lord… dost thou not judge and avenge our blood?') and the imprecatory Psalms. It arose in the raw aftermath of the state-tolerated murders of Joseph and Hyrum Smith, for which no one was ever convicted, and was removed as the wounds healed. Temple ceremonies have always been revised; removal reflects the living, adaptive nature of the ordinances.","responseSource":{"name":"FAIR, 'Latter-day Saint Temples/Endowment/Oath of vengeance'","url":"https://www.fairlatterdaysaints.org/answers/Latter-day_Saint_Temples/Endowment/Oath_of_vengeance"},"rationale":"The oath's existence, wording, 80-year duration, and 1927 removal are established by sworn Senate testimony and peer-reviewed scholarship; no informed apologist denies it existed. The Revelation 6:10 parallel is a genuinely fair mitigation of the 'oath to commit violence' caricature — but the documented claim (a multigenerational vengeance prayer against the United States embedded in the faith's holiest ordinance, contrasting with Jesus's command to pray FOR enemies) stands."},
{"id":"danites-1838","category":"violence-history","severity":"medium","verdict":"contested","title":"The Danites and 1838 Missouri violence","claim":"In 1838 Missouri, a secret Mormon paramilitary band (the Danites), organized under Sampson Avard, intimidated and expelled church dissenters (the Danite Manifesto threatening Cowdery, the Whitmers, and others), and during the October 1838 conflict Mormon forces including Danites raided and burned non-Mormon settlements (Gallatin, Millport). The contested question is how much Joseph Smith knew and authorized: Avard testified Smith was the mastermind; LeSueur argues Smith endorsed and benefited from them; church-aligned scholars argue Avard ran his own criminal program.","bom":[],"bible":["Romans 12:17-19","2 Corinthians 10:3-4"],"sources":[{"name":"Joseph Smith Papers: Sampson Avard biography","type":"primary","url":"https://www.josephsmithpapers.org/person/sampson-avard"},{"name":"Stephen C. LeSueur, The 1838 Mormon War in Missouri (overview)","type":"scholarly","url":"https://gospeltangents.com/2025/08/1838-mormon-missouri-war/"},{"name":"FAIR: Mormonism and persecution/Danites","type":"apologetics","url":"https://www.fairlatterdaysaints.org/answers/Mormonism_and_persecution/Danites"}],"response":"Avard was a self-aggrandizing opportunist who turned state's witness to save himself, making his 'Smith was the mastermind' testimony maximally self-serving; he was excommunicated in 1839. Gentry and Baugh trace three phases: legitimate community defense that Avard corrupted into secret oaths and plunder without Smith's authorization. The 1838 context was existential — Mormons were being burned out and shortly subject to Boggs's Extermination Order and the Haun's Mill massacre — and Mormon violence, while real, was a fraction of what was inflicted on them. The church's own history topics acknowledge Danite excesses.","responseSource":{"name":"Gentry & Baugh scholarship, summarized at FAIR"},"rationale":"The Danites' existence, the dissenter expulsions, and the raids are undisputed. But the load-bearing claim — Smith's personal authorization — rests substantially on Avard's compromised testimony, and serious historians genuinely divide (LeSueur vs. Gentry/Baugh). Smith publicly praised Danite leaders and rode the wave, but operational command is not established. Contested is the honest grade."},
{"id":"policy-of-exclusion-2015","category":"modern-policy","severity":"high","verdict":"admitted","title":"The 2015 LGBT exclusion policy, called revelation, reversed in 2019","claim":"In November 2015 the church's Handbook was changed to label members in same-sex marriages 'apostates' subject to mandatory discipline and to bar their children from baby blessings and baptism until age 18, conditioned on disavowing their parents' marriage and leaving their home. In January 2016, President Russell M. Nelson publicly declared the policy a revelation — 'the mind of the Lord and the will of the Lord' revealed to President Monson. In April 2019 the church reversed both provisions, also framing the reversal as directed by the Lord. A revelation reversed by revelation within four years, with families bearing the cost in between.","bom":[],"bible":["Deuteronomy 24:16","Ezekiel 18:20","Mark 10:14","Numbers 23:19"],"sources":[{"name":"Church News: Policy Changes Announced for Members in Gay Marriages (Nov 2015)","type":"institutional","url":"https://www.churchofjesuschrist.org/church/news/policy-changes-announced-for-members-in-gay-marriages-children-of-lgbt-parents?lang=eng"},{"name":"Russell M. Nelson, 'Becoming True Millennials' (Jan 2016 — 'will of the Lord')","type":"primary","url":"https://www.churchofjesuschrist.org/study/broadcasts/worldwide-devotional-for-young-adults/2016/01/becoming-true-millennials?lang=eng"},{"name":"KUTV: LDS Church rules change reverses 2015 'revelation'","type":"journalism","url":"https://kutv.com/news/local/lds-church-rules-change-reverses-2015-revelation"}],"response":"The church frames both the policy and its reversal as inspired responses to circumstances, not contradictory eternal doctrine: the 2015 policy aimed to protect children from conflict between home and church (paralleling existing policy for children of polygamists), and by 2019 leaders concluded, through continued revelation, that it caused more harm than it prevented. Continuing revelation inherently allows course correction (Acts 10 reversing the exclusion of Gentiles is the scriptural template apologists cite); policies implement doctrine for a time and place, and the underlying doctrine of marriage never changed.","responseSource":{"name":"D. Todd Christofferson Nov 2015 interview; April 2019 First Presidency statement; FAIR"},"rationale":"Every factual element is on the record, including Nelson's explicit 'will of the Lord' framing — which forecloses the 'it was just policy, never revelation' defense for the 2015 change. The 'continuing revelation can reverse course' argument is theologically coherent on its own terms, but it concedes rather than refutes the documented sequence. What the 4-year reversal implies about revelation is for the reader; the record itself is not in dispute."},
{"id":"tithing-enforcement","category":"institutional","severity":"medium","verdict":"admitted","title":"Tithing enforcement: temple access gated on payment","claim":"Temple recommends — required for the ordinances the church teaches are necessary for exaltation, including attending a child's temple wedding — are conditioned on answering 'Are you a full-tithe payer?' in a worthiness interview; annual 'tithing settlement' (renamed 'tithing declaration' in 2019) has members declare their status to the bishop. 'Fire insurance' rhetoric flows from canonized D&C 64:23 ('he that is tithed shall not be burned at his coming'), and leaders have taught paying tithing before feeding one's family. James Huntsman's fraud suit over tithing use was dismissed 11–0 by the en banc Ninth Circuit in January 2025.","bom":["D&C 64:23","D&C 119:3-4"],"bible":["2 Corinthians 9:7","Matthew 23:23","Mark 12:41-44"],"sources":[{"name":"D&C 64 and D&C 119 (current LDS canon)","type":"primary","url":"https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/64?lang=eng"},{"name":"Ninth Circuit en banc opinion, Huntsman v. Corp. of the President (Jan 31, 2025)","type":"primary","url":"https://cdn.ca9.uscourts.gov/datastore/opinions/2025/01/31/21-56056.pdf"},{"name":"Deseret News: Huntsman tithing lawsuit dismissed","type":"journalism","url":"https://www.deseret.com/faith/2025/01/31/huntsman-tithing-lawsuit-dismissed-9th-circuit-panel/"}],"response":"The church has no paid local clergy — bishops, teachers, and leaders serve free — so tithing funds operations, chapels, temples, education, and a large welfare/humanitarian program; members widely testify tithing is a blessing, not extortion. Tithing predates Mormonism (Malachi 3:8–10, which frames non-payment as robbing God — the 'gating' standard is arguably biblical). The Huntsman ruling vindicated the church's statements: the court found no misrepresentation because City Creek was funded from earnings on invested reserves, as President Hinckley had said. Declaration is self-reported; no one audits income.","responseSource":{"name":"Church Newsroom on tithing; Ninth Circuit en banc opinion (2025)"},"rationale":"The recommend question, the declaration meeting, D&C 64:23, and the exaltation-gating structure are all in current church publications — none is contested. The critics' strongest overreach (the fraud theory) was judicially answered 11–0 and is graded accordingly; but the core claim — salvation-critical ordinances conditioned on financial contribution, contrasted with 2 Corinthians 9:7's 'not grudgingly, or of necessity' — is simply a description of current practice."},
{"id":"missionary-program-realities","category":"institutional","severity":"low","verdict":"admitted","title":"The missionary program: unpaid, family-funded, controlled contact","claim":"LDS missionaries (men at 18 for 24 months, women at 19 for 18 months) work unpaid full-time and pay for the privilege — a flat contribution ($500/month since 2020) typically paid by families; missionaries surrender control of daily life to mission rules and a mission president (schedule, media, companions at all times). Until February 2019, contact with family was limited to weekly emails and phone calls twice a year (Mother's Day and Christmas). Cultural and family pressure to serve, and the stigma of early return, are widely documented in member testimony.","bom":[],"bible":[],"sources":[{"name":"Church News: First Presidency announces increase in missionary contribution (2019)","type":"institutional","url":"https://www.thechurchnews.com/2019/6/27/23215166/first-presidency-lds-missionary-contribution/"},{"name":"NBC News: Mormons allow missionaries to call home weekly (2019)","type":"journalism","url":"https://www.nbcnews.com/news/religion/mormons-allow-missionaries-call-home-weekly-instead-twice-yearly-n972421"}],"response":"Missionary service is voluntary and framed as consecrated service, not labor: the equalized payment program means a missionary to Tokyo pays the same as one to Peru, with ward funds covering those who can't pay. Vast numbers of returned missionaries describe their mission as the formative experience of their lives — language acquisition, discipline, service. The structure exists for safety and focus, common to monastic and military traditions; the 2019 liberalizations (weekly calls, flexible schedules) show institutional responsiveness to missionary wellbeing.","responseSource":{"name":"Church News / Newsroom announcements, 2019"},"rationale":"Every element is documented by the church's own publications — costs, rules, and the pre-2019 twice-a-year call policy. The steelman is real: voluntariness and reported benefits are genuine, and 'unpaid labor' framing understates member agency. But the claim describes facts the institution itself confirms. Severity is low because the practice is transparent and consented to."},
{"id":"prophetic-fallibility-unfalsifiable","category":"canon-provenance","severity":"medium","verdict":"contested","title":"Failed prophetic teachings vs. 'never lead the church astray'","claim":"LDS prophets have taught, from prophetic platforms, doctrines the church later abandoned or disavowed: Brigham Young affirmed the moon and sun are inhabited (Journal of Discourses 13:271, 1870) and taught Adam-God in General Conference, later denounced as 'false doctrine' by Spencer W. Kimball; Bruce R. McConkie's 'Mormon Doctrine' (1958) required over 1,000 corrections identified by apostolic review, yet sold for decades before being pulled in 2010. Meanwhile Wilford Woodruff's declaration — 'The Lord will never permit me or any other man who stands as President of this Church to lead you astray' — is printed with Official Declaration 1 in the canon, creating an unfalsifiable loop: whatever prophets teach is prophetic until it isn't, and the errors retroactively become 'opinion.'","bom":["Official Declaration 1"],"bible":["Deuteronomy 18:21-22","Matthew 7:15-20","1 Thessalonians 5:21"],"sources":[{"name":"Journal of Discourses 13:268–274, Brigham Young, July 24, 1870 (full text)","type":"primary","url":"https://jod.mrm.org/13/268/"},{"name":"Official Declaration 1 with Woodruff excerpts (current LDS canon)","type":"primary","url":"https://www.churchofjesuschrist.org/study/scriptures/dc-testament/od/1?lang=eng"},{"name":"MRM: Early Mormon Leaders on the Inhabitants of the Sun and Moon","type":"apologetics","url":"https://mrm.org/moon-men"},{"name":"FAIR: Brigham Young on science and education","type":"apologetics","url":"https://www.fairlatterdaysaints.org/answers/Brigham_Young_on_science_and_education"}],"response":"The church expressly teaches prophets are fallible men: 'a prophet is only a prophet when acting as such' (Joseph Smith), and not every sermon is revelation. Young's moon/sun musing was explicit speculation ('I rather think it is'), consistent with mainstream 19th-century science (William Herschel believed the sun inhabited); it was never canonized or made a test of faith. Mormon Doctrine was a private book McConkie published without authorization — the correction and eventual withdrawal show the system self-correcting, not failing. Woodruff's statement, in context, addressed the specific fear that the Manifesto was apostasy; it promises God would remove a president who attempted to lead the church fundamentally astray, not that presidents never err.","responseSource":{"name":"FAIR, 'Brigham Young on science and education' and prophetic-fallibility materials"},"rationale":"The quotes are authentic and verifiable. But the claim's force depends on whether these were 'held as prophetic,' and the apologetic case has real substance: Young flagged the moon/sun comment as opinion, and McConkie's book was never official. Adam-God is the critics' strongest example (taught in conference as doctrine, later disavowed) and keeps the tension live. The unfalsifiability critique of Woodruff's dictum is a fair philosophical point, but as a factual claim of 'failed prophecy' this is genuinely contested territory."},
{"id":"abuse-helpline-2022","category":"institutional","severity":"high","verdict":"contested","title":"The abuse help line and the Bisbee, Arizona case","claim":"A 2022 AP investigation, drawing on ~12,000 pages of sealed records, reported that the church's abuse 'help line' routes bishops' reports of child sexual abuse to church lawyers (Kirton McConkie) rather than police; in the Bisbee, Arizona case, Paul Adams confessed abuse of his daughter to two bishops beginning in 2011, church counsel advised that Arizona's clergy-penitent privilege barred reporting, and the abuse continued for approximately seven more years — extending to a second, infant daughter — until Adams was independently caught in 2017. Critics allege the help line functions to manage legal risk ahead of child protection.","bom":[],"bible":["Mark 9:42","Luke 8:17","James 1:27"],"sources":[{"name":"AP investigation: 'Seven years of sex abuse: How Mormon officials let it happen'","type":"journalism","url":"https://www.azfamily.com/2022/08/04/seven-years-sex-abuse-bisbee-how-mormon-officials-let-it-happen/"},{"name":"Salt Lake Tribune: Sex abuse and the LDS Church 'help line' — 4 takeaways","type":"journalism","url":"https://www.sltrib.com/religion/local/2022/08/04/sex-abuse-lds-church-help-line-4/"},{"name":"Church Newsroom: Church Provides Further Details about the Arizona Abuse Case","type":"institutional","url":"https://newsroom.churchofjesuschrist.org/article/church-provides-further-details-about-arizona-abuse-case"}],"response":"The church calls the AP framing egregiously wrong: the bishop repeatedly urged Adams and his wife to report and tried to intervene; Arizona law made the confession privileged, meaning the bishop legally could not report confession-derived information without consent, and Arizona courts (ultimately the state supreme court, 2023) upheld the privilege and dismissed claims against the church. The help line exists so that untrained lay bishops immediately reach professionals who instruct them to comply with reporting laws — which vary by state — and the church says its first priority is protecting victims; the abuse was known to others (the mother; Adams posted it online) who also failed to report.","responseSource":{"name":"Church Newsroom, 'Church Provides Further Details about the Arizona Abuse Case' (Aug 2022)","url":"https://newsroom.churchofjesuschrist.org/article/church-provides-further-details-about-arizona-abuse-case"},"rationale":"The core timeline (confession 2011, no report, seven more years of abuse) is established by court records and undisputed. But the causal/culpability claim — that the help line exists to protect the institution over children — is genuinely contested: the legal advice tracked Arizona's actual privilege statute, courts sided with the church, and the bishops' constrained position is real. What remains unrefuted is that the system's design produced a catastrophic outcome and that help-line calls route through defense counsel; whether that is malice, negligence, or legal compliance is the contested question."},
{"id":"kirtland-safety-society","title":"The Kirtland Safety Society: An Illegal Bank Backed by Claimed Revelation","category":"provenance","claim":"In November 1836 Joseph Smith co-founded the Kirtland Safety Society bank; when the Ohio legislature denied a charter, it reorganized in January 1837 as the 'Kirtland Safety Society Anti-Banking Company' and issued notes anyway. On January 6, 1837, Wilford Woodruff recorded in his journal that Smith declared he had 'receieved that morning the word of the Lord upon the subject of the Kirtland Safety Society' — 'not ownly the voice of the spirit... but even an audaible voice' — and that if the commandments were heeded 'all would be well.' Warren Parrish, an officer of the bank who later left the church, claimed Smith prophesied it would 'like Aaron's rod... swallow up all other banks... and survive when all others should be laid in ruins.' The bank was massively undercapitalized; its notes lost most value within weeks. On October 24, 1837, Smith and Rigdon were each fined $1,000 plus costs for illegal banking (Rounds qui tam v. Smith, under Ohio's 1816 statute). Smith fled Kirtland the night of January 12, 1838. Historians estimate 200-300 members (roughly 10-15% of Kirtland membership, including about a third of general church leadership) left the church in the fallout; Heber C. Kimball later said that at the time, for every member who stood by Joseph Smith as prophet, 'there were twenty who did not.'","bom":[],"bible":["Deuteronomy 18:21-22","Proverbs 12:22","Jeremiah 23:21"],"sources":[{"name":"Wilford Woodruff journal, 6 Jan 1837 (Wilford Woodruff Papers)","type":"primary","url":"https://wilfordwoodruffpapers.org/day-in-the-life/1837-01-06"},{"name":"Transcript of Proceedings, Rounds qui tam v. Rigdon/Smith, Oct 1837 (Joseph Smith Papers)","type":"primary","url":"https://www.josephsmithpapers.org/paper-summary/transcript-of-proceedings-circa-25-october-1837-rounds-qui-tam-v-rigdon/2"},{"name":"Introduction to the Kirtland Safety Society (Joseph Smith Papers)","type":"institutional","url":"https://www.josephsmithpapers.org/paper-summary/introduction-to-the-kirtland-safety-society/1"},{"name":"Church History Topics: Kirtland Safety Society (LDS Church)","type":"institutional","url":"https://www.churchofjesuschrist.org/study/history/topics/kirtland-safety-society?lang=eng"},{"name":"Warren Parrish letter, Painesville Republican, 15 Feb 1838 (repr. UTLM)","type":"primary","url":"https://www.utlm.org/onlineresources/josephsmithsbank.htm"},{"name":"Heber C. Kimball discourse, 23 Aug 1857, Journal of Discourses 5:171-181","type":"primary","url":"https://jod.mrm.org/5/171/"},{"name":"Walker, 'The Kirtland Safety Society and the Fraud of Grandison Newell' (BYU Studies)","type":"scholarly","url":"https://byustudies.byu.edu/article/the-kirtland-safety-society-and-the-fraud-of-grandison-newell-a-legal-examination"}],"response":"FAIR and church historians argue: (1) the 1830s was the era of unregulated 'wildcat' banking, and hundreds of banks — many chartered — failed in the national Panic of 1837, so the KSS collapse reflects the economy, not fraud; (2) the charter denial owed to Ohio legislative politics (hard-money Democrats denied nearly all new charters that session, and anti-Mormon sentiment may have contributed), and operating as a joint-stock 'anti-banking' company followed legal counsel's advice under genuinely unsettled law; (3) Joseph Smith invested more of his own money than almost anyone and lost heavily — the opposite of a fraudster's profile; (4) Smith resigned in June 1837 and publicly warned the Saints against the notes before the worst of the collapse; (5) Woodruff's journal does not record the content of the claimed revelation, and the grandiose 'swallow up all banks' prophecy comes only from Warren Parrish, by then a hostile ex-member with his own alleged role in the bank's failure.","responseSource":{"name":"FAIR: Creation of the Kirtland Safety Society","url":"https://www.fairlatterdaysaints.org/answers/Kirtland_Safety_Society"},"verdict":"admitted","rationale":"The load-bearing facts are conceded in the church's own publications: the Joseph Smith Papers and the Church History Topics essay acknowledge the charter denial, the decision to operate anyway, the October 1837 fines for illegal banking, Smith's flight to Missouri, and that leaders bore responsibility for 'failing to anticipate problems.' The revelation claim rests not on hostile sources but on the faithful, contemporaneous Woodruff journal published by the church-affiliated Woodruff Papers Project — Smith attached 'the word of the Lord' and an 'audible voice' to an enterprise that failed within months, was ruled illegal, and triggered the largest apostasy of his lifetime. The steelman genuinely mitigates intent (fraud is not established; the Panic of 1837 was real; Parrish's version deserves discounting as hostile) but does not touch the core problem under Deut 18:21-22: a claimed divine assurance ('all would be well') that events falsified. Severity tempered only in that the specific revelation's full wording was never recorded, so the strongest 'prophecy' framing depends partly on Parrish.","severity":"high"},
{"id":"post-manifesto-polygamy","title":"Post-Manifesto Polygamy (1890-1904): Public Denial, Private Practice — the Second Time","category":"polygamy-history","claim":"The 1890 Manifesto (Official Declaration 1) publicly announced the end of plural marriage, and church leaders repeatedly denied any new plural marriages thereafter. In fact, apostles and members of the First Presidency secretly authorized or performed roughly 250 new plural marriages between 1890 and 1904 (D. Michael Quinn, 'LDS Church Authority and New Plural Marriages, 1890-1904,' Dialogue 18:1, 1985; B. Carmon Hardy's Solemn Covenant appendix documents 262), many in Mexico, Canada, and at sea; nine or ten General Authorities themselves took new plural wives. The Reed Smoot Senate hearings (1904-1907) exposed the practice: church president Joseph F. Smith testified under oath in March 1904 that he had continued to cohabit with his five plural wives and had fathered eleven children with them since 1890, in acknowledged violation of the law. Weeks later he issued the 1904 Second Manifesto — while asserting no post-1890 marriages had occurred 'with the sanction, consent or knowledge of the Church,' a claim contradicted by the documented participation of his own counselors and apostles. Apostles John W. Taylor and Matthias F. Cowley were forced from the Quorum of the Twelve over the affair. This repeats the Nauvoo pattern (1841-1844), when Joseph Smith and other leaders publicly denied polygamy while privately practicing it — making 1890-1904 the second sustained episode of institutional public denial of a privately continued practice.","bom":["Jacob 2:24-30","D&C Official Declaration 1"],"bible":["Proverbs 12:22","Matthew 5:33-37","Ephesians 4:25","Numbers 30:2"],"sources":[{"name":"D. Michael Quinn, 'LDS Church Authority and New Plural Marriages, 1890-1904,' Dialogue 18:1 (1985): 9-105","type":"scholarly","url":"https://www.dialoguejournal.com/wp-content/uploads/sbi/articles/Dialogue_V18N01_11.pdf"},{"name":"Reed Smoot hearings, testimony of Joseph F. Smith (Proceedings, U.S. Senate Committee on Privileges and Elections, 1904, vol. 1; transcript excerpts)","type":"primary","url":"http://probationarystate.blogspot.com/2009/11/reed-smoot-hearings-day-3-testimony-of_04.html"},{"name":"Gospel Topics essay: 'The Manifesto and the End of Plural Marriage' (LDS Church)","type":"institutional","url":"https://www.churchofjesuschrist.org/study/manual/gospel-topics-essays/the-manifesto-and-the-end-of-plural-marriage?lang=eng"},{"name":"B. Carmon Hardy, Solemn Covenant: The Mormon Polygamous Passage (Univ. of Illinois Press, 1992) — BYU Studies review","type":"scholarly","url":"https://byustudies.byu.edu/article/solemn-covenant-the-mormon-polygamous-passage"},{"name":"1904 Second Manifesto statement (BYU-Idaho archives)","type":"primary","url":"https://archives.byui.edu/s/public/page/1904-statement"},{"name":"Church History Topics: Reed Smoot Hearings (LDS Church)","type":"institutional","url":"https://www.churchofjesuschrist.org/study/history/topics/reed-smoot-hearings?lang=eng"}],"response":"The church's own Gospel Topics essay supplies the steelman and concedes most of the record: 'After October 1890, plural marriages continued to be quietly performed' in Mexico and Canada; 'The Manifesto declared President Woodruff's intention to submit to the laws of the United States. It said nothing about the laws of other nations' — so leaders in good faith read it as a legally-scoped document, not a revelation banning the principle worldwide; 'many Church leaders believed the Manifesto merely suspended plural marriage for an indefinite time'; existing husbands 'continued to cohabit with their plural wives and fathered children with them well into the 20th century' rather than abandon covenant families; and only with the 1904 Second Manifesto were members 'put on notice that new plural marriages stood unapproved by God and the Church,' after which Taylor and Cowley 'were eventually dropped from the quorum.' Apologists add that the transition away from a practice leaders believed divinely commanded was wrenching, conducted under federal persecution, and that ambiguity — not coordinated conspiracy — explains the fifteen-year lag.","responseSource":{"name":"Gospel Topics essay: The Manifesto and the End of Plural Marriage","url":"https://www.churchofjesuschrist.org/study/manual/gospel-topics-essays/the-manifesto-and-the-end-of-plural-marriage?lang=eng"},"verdict":"admitted","rationale":"This is the rare case where the church's own essay concedes nearly every element of the critical claim: post-Manifesto plural marriages quietly performed with leader involvement, continued cohabitation and child-fathering, the Manifesto's deliberately limited legal scope, and the removal of two apostles. Joseph F. Smith's sworn Smoot testimony is a first-person presidential admission. What the steelman reframes — sincere ambiguity versus duplicity — cannot erase that leaders publicly and repeatedly denied what they privately authorized (including the Second Manifesto's 'sanction, consent or knowledge' claim, falsified by Quinn's and Hardy's documentation), and that this replays the Nauvoo denial pattern. Under the biblical standard of Prov 12:22 and Eph 4:25 the institutional pattern of public denial during private practice stands conceded in substance, contested only in motive.","severity":"high"},
{"id":"facsimile-1-lion-couch","title":"Facsimile 1: 'Abraham on the Altar' vs. a Standard Embalming/Resurrection Vignette","category":"translation-test","claim":"Joseph Smith published Facsimile 1 as Abraham 'fastened upon an altar' with 'the idolatrous priest of Elkenah attempting to offer up Abraham as a sacrifice' (Facsimile 1 Explanation, figs. 2-3; cf. Abraham 1:12-15). Egyptology identifies the original — extant as Papyrus Joseph Smith I, part of the Book of Breathings made for the Theban priest Hor (Ptolemaic era, ~2nd-1st century BC, some 1,500+ years after Abraham) — as a standard funerary lion-couch vignette: the jackal-headed god Anubis attending the deceased Osiris/Hor. The papyrus has a lacuna (missing section) exactly where the priest's head and alleged knife appear in the 1842 published version; the woodcut restoration shows a bald human head and a drawn knife, while Egyptologists (Ritner and others) note ink traces of a headdress at the shoulder indicating a jackal-headed Anubis, and no parallel vignette shows a knife. Smith's restoration and his identifications (bird as 'Angel of the Lord,' canopic jars as idolatrous gods of foreign nations, crocodile as 'idolatrous god of Pharaoh') do not match any accepted Egyptological reading.","bom":["Abraham 1:12-15","Book of Abraham, Facsimile 1 Explanation"],"bible":["Deuteronomy 18:21-22","1 Thessalonians 5:21"],"sources":[{"name":"Robert K. Ritner, The Joseph Smith Egyptian Papyri: A Complete Edition (2013); 'The Breathing Permit of Hor' (JNES 62, 2003) — summarized with translations","type":"scholarly","url":"https://www.ldsdiscussions.com/bookofabraham"},{"name":"Gospel Topics essay: 'Translation and Historicity of the Book of Abraham' (LDS Church)","type":"institutional","url":"https://www.churchofjesuschrist.org/study/manual/gospel-topics-essays/translation-and-historicity-of-the-book-of-abraham?lang=eng"},{"name":"FAIR: Book of Abraham facsimiles — missing portions of Facsimile 1","type":"apologetics","url":"https://www.fairlatterdaysaints.org/answers/Book_of_Abraham/Joseph_Smith_Papyri/Facsimiles/Missing_portions"},{"name":"Pearl of Great Price Central: 'The Idolatrous Priest (Facsimile 1, Figure 3)'","type":"apologetics","url":"https://pearlofgreatpricecentral.org/the-idolatrous-priest/"},{"name":"Book of Abraham Facsimile 1 analysis (4witness)","type":"journalism","url":"https://www.4witness.org/book-of-abraham-fac-1/"}],"response":"Gee, Muhlestein, and Pearl of Great Price Central argue: (1) the lacuna means no one knows what the original showed — some apologists contend the papyrus was already damaged in 1835 and that a knife and human head could have stood there, noting this vignette is unusual among lion-couch scenes (the figure on the couch appears alive, clothed, with both hands possibly raised); (2) there is Egyptian evidence for ritual slaying of enemies in temple contexts, so a 'sacrifice' reading is not absurd; (3) on the 'Semitic adaptation' theory, ancient Jews in Egypt demonstrably reused and reinterpreted Egyptian iconography (e.g., the Demotic 'Abraham' connection in later magical papyri), so the vignette could have served as an illustration for an Abraham text regardless of its funerary origin; (4) the Book of Abraham may be a revealed text for which the papyri were merely a catalyst, making the facsimile explanations inspired commentary rather than Egyptological translation.","responseSource":{"name":"Pearl of Great Price Central: The Idolatrous Priest (Facsimile 1, Figure 3)","url":"https://pearlofgreatpricecentral.org/the-idolatrous-priest/"},"verdict":"contested","rationale":"Unlike Facsimiles 2 and 3, Facsimile 1 contains a genuine evidentiary gap: the lacuna covers precisely the disputed elements (priest's head, knife), so the restoration argument runs on parallels and ink traces rather than a surviving original. The scholarly consensus — Anubis in a routine embalming/resurrection scene from Hor's Breathing Permit — is far better supported (headdress traces, hundreds of parallel vignettes, zero parallels with a knife), and the church's own essay concedes Egyptologists' readings differ from Smith's. But because apologists dispute what filled the lacuna rather than the Egyptology itself, and the vignette does have unusual features, this figure-level claim is scored contested rather than unrefuted — while noting the surrounding identifications (canopic jars as foreign gods, crocodile as Pharaoh's god) find no Egyptological support at all.","severity":"medium"},
{"id":"facsimile-2-hypocephalus","title":"Facsimile 2, Figure 7: The Fertility God Min as 'God Sitting upon His Throne'","category":"translation-test","claim":"Facsimile 2 is a hypocephalus (a funerary amulet placed under a mummy's head, from Book of the Dead spell 162, made for one Sheshonq) — a well-understood class of object meant to keep the deceased warm and aid resurrection. Joseph Smith's explanations instead present it as cosmology: fig. 1 as 'Kolob, signifying the first creation, nearest to the celestial, or the residence of God,' fig. 5 as the sun receiving light 'through the medium of Kae-e-vanrash,' etc. Most starkly, figure 7 — which Egyptologists uniformly identify as Min, an ithyphallic fertility god depicted seated with erect phallus and upraised flail, approached by a serpent — is labeled by Smith 'God sitting upon his throne, revealing through the heavens the grand Key-words of the Priesthood; as, also, the sign of the Holy Ghost unto Abraham, in the form of a dove.' Even LDS scholar Michael Rhodes's translation of the hypocephalus rim and panels yields standard funerary formulae for Sheshonq, not Abrahamic cosmology; portions of the original were missing and were filled in for the 1842 publication with characters copied from other papyri (including lines from the Hor Book of Breathings).","bom":["Abraham 3:2-4, 9","Book of Abraham, Facsimile 2 Explanation, Figs. 1, 5, 7"],"bible":["Deuteronomy 18:21-22","1 Thessalonians 5:21"],"sources":[{"name":"Ritner, The Joseph Smith Egyptian Papyri: A Complete Edition (2013) — hypocephalus translation; summarized with images","type":"scholarly","url":"https://www.ldsdiscussions.com/bookofabraham"},{"name":"BYU Studies / Pearl of Great Price Central: 'God Sitting upon His Throne (Facsimile 2, Figure 7)' — concedes the figure is Min","type":"apologetics","url":"https://byustudies.byu.edu/article/god-sitting-upon-his-throne-facsimile-2-figure-7"},{"name":"FAIR: Facsimile 2 — identification of the ithyphallic god Min as 'God sitting upon his throne'","type":"apologetics","url":"https://www.fairlatterdaysaints.org/answers/Book_of_Abraham/Joseph_Smith_Papyri/Facsimiles/Facsimile_2/Identification_of_the_ithyphallic_Egyptian_god_%22Min%22_as_%22God_sitting_upon_his_throne%22"},{"name":"Gospel Topics essay: 'Translation and Historicity of the Book of Abraham' (LDS Church)","type":"institutional","url":"https://www.churchofjesuschrist.org/study/manual/gospel-topics-essays/translation-and-historicity-of-the-book-of-abraham?lang=eng"}],"response":"LDS scholarship (Rhodes, Gee, Muhlestein; Pearl of Great Price Central) concedes figure 7 depicts a form of Min but argues: (1) Min was for Egyptians a supreme creator-god symbolizing regenerative, procreative power — so 'God sitting upon his throne' captures the figure's functional meaning within Egyptian religion even if the iconography shocks modern readers; (2) hypocephali were esoteric objects encoding cosmic geography and rebirth, so a cosmological reading is not categorically alien to the genre, and a few of Smith's identifications (e.g., fig. 1 associated with the creative force at the center; fig. 4 as expanse/firmament, a ship figure some Egyptologists relate to the sky-journey) are argued to land near Egyptian concepts; (3) under the Semitic-adaptation and catalyst frameworks, Smith's explanations were never meant as Egyptological decipherment but as inspired repurposing, paralleling how Egyptian Jews reused pagan iconography.","responseSource":{"name":"Pearl of Great Price Central: God Sitting Upon His Throne (Facsimile 2, Figure 7)","url":"https://pearlofgreatpricecentral.org/god-sitting-upon-his-throne-facsimile-2-figure-7/"},"verdict":"unrefuted","rationale":"There is no dispute about what figure 7 is — apologetic sources themselves identify it as ithyphallic Min. The dispute is only whether 'God sitting upon his throne, revealing the grand Key-words of the Priesthood... the sign of the Holy Ghost... in the form of a dove' can be rescued as a functional-equivalence reading of a pagan fertility figure being approached by a serpent. No Egyptologist reads the hypocephalus as teaching Kolob, priesthood key-words, or the Holy Ghost; Rhodes's own faithful translation of the object's actual text yields conventional funerary petitions for Sheshonq. The steelman does not counter the translation evidence; it relocates Smith's explanations outside translation entirely — which concedes the empirical point while contesting its theological weight. Under a Deut 18 / 1 Thess 5:21 test of a man who claimed to translate 'by the gift and power of God,' the specific, checkable claims fail checking and remain unrefuted by any counter-translation.","severity":"high"},
{"id":"facsimile-3-presentation","title":"Facsimile 3: Readable Captions Name the Figures — and Contradict Every Smith Label","category":"translation-test","claim":"Facsimile 3 is a standard 'presentation' vignette from the Book of Breathings of the priest Hor: the deceased Hor, led by Maat and Anubis, presented before the enthroned Osiris with Isis behind him. Unlike Facsimile 1, the hieroglyphic captions above/beside each figure survive in the published woodcut and name the figures, and Egyptologists can read them. Robert Ritner's translations: fig. 2 (which Smith labeled 'King Pharaoh, whose name is given in the characters above his head') is captioned 'Isis the great, the god's mother' — a goddess; fig. 4 (Smith: 'Prince of Pharaoh, King of Egypt, as written above the hand') is 'Maat, mistress of the gods' — also a goddess; fig. 1 (Smith: 'Abraham sitting upon Pharaoh's throne') is the god Osiris; fig. 5 (Smith: 'Shulem, one of the king's principal waiters') is captioned 'The Osiris Hor, justified forever' — the papyrus owner himself; fig. 6 (Smith: 'Olimlah, a slave belonging to the prince') is the god Anubis. Smith thus rendered two female goddesses as male royalty and claimed their names were 'given in the characters above' — characters that, once read, name Isis and Maat. Earlier Egyptologists shown the facsimiles (Deveria 1860, and the 1912 panel including Petrie and Breasted) reached the same conclusions independently.","bom":["Book of Abraham, Facsimile 3 Explanation"],"bible":["Deuteronomy 18:21-22","Proverbs 12:22","1 Thessalonians 5:21"],"sources":[{"name":"Ritner, The Joseph Smith Egyptian Papyri: A Complete Edition (2013) — Facsimile 3 caption translations; quoted in FAIR's treatment","type":"scholarly","url":"https://www.fairlatterdaysaints.org/answers/Book_of_Abraham_facsimiles/Facsimile_3"},{"name":"FAIR: responses to Joseph Smith's interpretations of Facsimile 3 (quotes Ritner, Parker, Baer readings)","type":"apologetics","url":"https://www.fairlatterdaysaints.org/answers/Question:_What_have_been_the_responses_to_Joseph's_interpretations_of_Facsimile_3%3F"},{"name":"Pearl of Great Price Central: 'Isis the Pharaoh (Facsimile 3, Figure 2)'","type":"apologetics","url":"https://pearlofgreatpricecentral.org/isis-the-pharaoh-facsimile-3-figure-2/"},{"name":"Gospel Topics essay: 'Translation and Historicity of the Book of Abraham' (LDS Church)","type":"institutional","url":"https://www.churchofjesuschrist.org/study/manual/gospel-topics-essays/translation-and-historicity-of-the-book-of-abraham?lang=eng"},{"name":"Book of Abraham Facsimile 3 analysis with caption images (4witness)","type":"journalism","url":"https://www.4witness.org/book-of-abraham-fac-3/"}],"response":"The strongest apologetic (Gee, Muhlestein, Pearl of Great Price Central) does not offer a rival translation of the captions; it accepts the Egyptological readings and argues reidentification: (1) in Egyptian theology Pharaoh was understood as the earthly embodiment of Osiris, and Isis could be ritually identified with the (female-titled) throne and even with the king — so 'Isis as Pharaoh' has attested conceptual precedent; (2) ancient Semitic peoples demonstrably adapted Egyptian vignettes for their own figures (Jewish reuse of Egyptian iconography, Abraham appearing in later Egyptian magical texts), so an ancient Jewish redactor could have relabeled this scene as an Abraham-at-court illustration; (3) presentation scenes involve dressing figures in others' iconography, so gender-crossing identifications are not unknown in Egyptian ritual texts; (4) some caption glyphs (notably the Isis name group) are poorly copied in the woodcut, complicating certainty about what stood on the original.","responseSource":{"name":"Pearl of Great Price Central: Isis the Pharaoh (Facsimile 3, Figure 2)","url":"https://pearlofgreatpricecentral.org/isis-the-pharaoh-facsimile-3-figure-2/"},"verdict":"unrefuted","rationale":"This is the hardest facsimile case for the LDS position because Smith explicitly staked his labels on the characters themselves — 'whose name is given in the characters above his head' — and those characters, now readable, name Isis and Maat, not any Pharaoh or prince, and name the papyrus owner Hor where Smith saw 'Shulem the waiter.' No apologetic source produces a counter-translation; the Semitic-adaptation steelman concedes the Egyptology and posits an undocumented ancient relabeling for which no direct evidence exists on this papyrus. The church's own essay concedes Egyptologists' interpretations do not match Smith's but stops short of conceding error, so the verdict is unrefuted rather than admitted. As a directly checkable translation claim made in the name of the gift and power of God, it fails the 1 Thess 5:21 / Deut 18 test on the evidence as it stands.","severity":"high"},
{"id":"adam-god-doctrine","title":"The Adam–God doctrine: Brigham Young taught that Adam is God the Father","category":"nature-of-god","claim":"On April 9, 1852, Brigham Young taught in general conference that Adam 'is our Father and our God, and the only God with whom we have to do' (Journal of Discourses 1:50–51). He repeated the teaching for over two decades — declaring in 1873 that 'Adam is my father' was doctrine God had revealed to him — and in 1877 had it incorporated into the temple lecture at the veil in the St. George Temple (L. John Nuttall journal, Feb. 7, 1877). The teaching contradicts Genesis (Adam is a creature formed by God, Gen 2:7), the Bible's insistence that God is not a man (Hosea 11:9), and canonized LDS scripture itself, which identifies Adam as the archangel Michael, subordinate to God (D&C 27:11; 107:53–55). In 1976 President Spencer W. Kimball told general conference: 'the Adam-God theory... We denounce that theory and hope that everyone will be cautioned against this and other kinds of false doctrine.' Either a prophet taught false doctrine over the pulpit and in the temple for 25 years, or the church now denounces true doctrine.","bom":["D&C 27:11","D&C 107:53-55"],"bible":["Genesis 2:7","Hosea 11:9","Isaiah 43:10","1 Corinthians 15:45"],"sources":[{"name":"MRM: 'Adam-God' — Brigham Young's Theory or Divine Doctrine?","type":"scholarly","url":"https://mrm.org/adam-god"},{"name":"Mormonr: Adam-God Theory (primary documents)","type":"apologetics","url":"https://mormonr.org/qnas/0JPssK/adam_god_theory"},{"name":"FAIR: Brigham Young and Adam-God theory","type":"apologetics","url":"https://www.fairlatterdaysaints.org/answers/Brigham_Young_and_Adam-God_theory"},{"name":"Institute for Religious Research: Adam-God Doctrine","type":"scholarly","url":"https://mit.irr.org/adam-god-doctrine"}],"response":"FAIR argues that Young's sermons survive in imperfect transcriptions, that he elsewhere taught things inconsistent with a strong Adam–God reading, and that the teaching was never canonized by common consent — so it was a prophet's personal theological speculation, not church doctrine. Kimball's 1976 denunciation is presented as the system working: the living church self-corrects, and doctrine is defined by canonized scripture and the united voice of the First Presidency, not every pulpit statement of a past president.","responseSource":{"name":"FAIR: Brigham Young and Adam-God theory","url":"https://www.fairlatterdaysaints.org/answers/Brigham_Young_and_Adam-God_theory"},"verdict":"admitted","rationale":"Kimball's 1976 denunciation concedes the substance: something Young taught as doctrine is now officially 'false doctrine.' The misreporting defense fails against multiple independent records — the Journal of Discourses, Young's own 1873 reaffirmation, Wilford Woodruff's journal, and the St. George temple lecture minutes. The remaining apologetic move ('never canonized') rescues the church's doctrinal process only by conceding the evangelistic point: a president of the church, speaking as prophet, taught for 25 years — including inside the temple — something the church now denounces, which collapses 'the prophet will never lead the church astray' as a working guarantee.","severity":"high"},
{"id":"priesthood-restoration-late-account","title":"The priesthood restoration: no account of angelic ordination until 1834–35","category":"origin-story","claim":"The church teaches that John the Baptist restored the Aaronic priesthood in May 1829 (D&C 13; JS–History 1:68–72) and Peter, James, and John the Melchizedek priesthood soon after. Yet no publication or record describes these angelic ordinations until Oliver Cowdery's October 1834 account in the Messenger and Advocate — five years later. Joseph's 1832 history does not narrate them; the 1833 Book of Commandments revelations contain none of the passages; and when the 1835 Doctrine and Covenants was prepared, the relevant text was added retroactively — what is now D&C 27 grew from a short 1830 revelation into one naming John the Baptist, Peter, James, and John (compare Book of Commandments 28). David Whitmer told interviewers he 'never heard that an Angel had ordained Joseph and Oliver to the Aaronic priesthood' until years after the church's 1830 organization, and William McLellin said the same. Critics conclude the restoration narrative developed after 1830 and was written back into the founding revelations.","bom":["D&C 13","D&C 27:5-13","Joseph Smith—History 1:68-72"],"bible":["Hebrews 7:23-24","1 Peter 2:9","Deuteronomy 4:2"],"sources":[{"name":"BYU Studies: Priesthood Restoration Documents","type":"scholarly","url":"https://byustudies.byu.edu/article/priesthood-restoration-documents"},{"name":"CES Letter: Priesthood Restoration","type":"scholarly","url":"https://read.cesletter.org/priesthood/"},{"name":"Joseph Smith Papers: Book of Commandments, 1833","type":"primary","url":"https://www.josephsmithpapers.org/paper-summary/book-of-commandments-1833/1"},{"name":"FAIR: Response to CES Letter — Priesthood Restoration","type":"apologetics","url":"https://www.fairlatterdaysaints.org/answers/Criticism_of_Mormonism/Online_documents/Letter_to_a_CES_Director/Priesthood_Restoration_Concerns_&_Questions"}],"response":"FAIR and BYU scholars reply that Joseph's 1832 history does mention receiving 'the holy Priesthood by the ministring of Aangels,' that an 1829-era revelation (now D&C 27) alludes to authority from heavenly messengers, and that Joseph and Oliver kept the details private because of intense persecution — Joseph said they were 'forced to keep secret the circumstances of having received the Priesthood.' The 1835 expansions are framed as the prophet clarifying earlier revelations under the same inspiration, and Whitmer's and McLellin's recollections are dismissed as hostile memories recorded four to five decades later.","responseSource":{"name":"FAIR: Priesthood Restoration Concerns & Questions","url":"https://www.fairlatterdaysaints.org/answers/Criticism_of_Mormonism/Online_documents/Letter_to_a_CES_Director/Priesthood_Restoration_Concerns_&_Questions"},"verdict":"contested","rationale":"The documented facts favor the critics: the named-angel narrative appears nowhere before 1834, and the 1835 D&C additions are visible in the church's own Joseph Smith Papers. But the apologetic case is not empty — the 1832 history's 'ministring of Aangels' phrase and the persecution-secrecy argument are genuine (if ambiguous) counters, and late hostile recollections deserve discounting. What is beyond dispute is the retroactive textual expansion; what remains arguable is whether it records suppressed events or invents them. That split — solid textual evidence, live alternative explanation — is the definition of contested, though the pattern matches the First Vision's evolving accounts.","severity":"high"},
{"id":"book-of-commandments-revisions","title":"Revelations rewritten: the 1833 Book of Commandments vs. the 1835 Doctrine and Covenants","category":"textual-transmission","claim":"Revelations published in 1833 as the direct word of God were materially rewritten for the 1835 Doctrine and Covenants — hundreds of changes, including substantive additions and reversals, all verifiable in the church's own Joseph Smith Papers scans. Examples: Book of Commandments 4:2 says God 'will grant him no other gift' than translating the Book of Mormon; D&C 5:4 rewrites this to 'no other gift until it is finished,' opening the door to Joseph's later revelatory career. BC 7 says Oliver Cowdery's gift is 'working with the rod' ('rod of nature'); D&C 8 renames the divining rod 'the gift of Aaron.' BC 28 (now D&C 27) grew from a short revelation into eighteen verses naming priesthood-restoring angels. Deuteronomy 4:2 and Proverbs 30:5–6 forbid adding to God's words; a 'thus saith the Lord' text that must be re-engineered years later to fit the movement's development looks like an evolving human composition, not delivered revelation.","bom":["D&C 5:4","D&C 8:6-9","D&C 27:5-13"],"bible":["Deuteronomy 4:2","Proverbs 30:5-6"],"sources":[{"name":"Joseph Smith Papers: Book of Commandments, 1833 (full scans)","type":"primary","url":"https://www.josephsmithpapers.org/paper-summary/book-of-commandments-1833/1"},{"name":"IRR: Scanned images of the 1833 Book of Commandments and 1835 D&C","type":"primary","url":"https://mit.irr.org/scanned-images-of-entire-1833-book-of-commandments-and-1835-doctrine-and-covenants"},{"name":"Tanner (UTLM): Changing the Revelations","type":"scholarly","url":"https://www.utlm.org/onlinebooks/changingtherevelations.htm"},{"name":"LDS Discussions: Overview of Changes to the Revelations","type":"scholarly","url":"https://www.ldsdiscussions.com/changes-to-revelations"},{"name":"FAIR: Doctrine and Covenants — Textual changes","type":"apologetics","url":"https://www.fairlatterdaysaints.org/answers/Doctrine_and_Covenants/Textual_changes"}],"response":"FAIR argues Joseph Smith never claimed word-for-word divine dictation: revelations came as impressions expressed in his own imperfect language, so the prophet who received them had authority to revise, expand, and update them as church organization and his understanding grew — section 20's ecclesiastical additions simply incorporated offices revealed after 1830. The church publishes every version openly through the Joseph Smith Papers, which FAIR presents as the opposite of concealment, and the revised texts were accepted by common consent of the 1835 conference.","responseSource":{"name":"FAIR: Doctrine and Covenants — Textual changes","url":"https://www.fairlatterdaysaints.org/answers/Doctrine_and_Covenants/Textual_changes"},"verdict":"admitted","rationale":"The changes themselves are conceded and published by the church — the Joseph Smith Papers project puts both editions side by side, and FAIR's defense is a justification of the edits, not a denial of them. That satisfies 'admitted': the church's own publications concede the substance. The remaining dispute is interpretive — whether a prophet may revise God's words — and there the apologetic answer creates its own problem: if revelations are Joseph's fallible paraphrases subject to later re-engineering, the epistemic weight of any given 'thus saith the Lord' (including D&C 132) is correspondingly reduced. Severity is medium because the fact is damaging chiefly in combination with the priesthood-restoration backdating.","severity":"medium"},
{"id":"egyptian-alphabet-grammar","title":"The 'Grammar and Alphabet of the Egyptian Language': Joseph Smith's translation method on paper","category":"translation-test","claim":"Alongside the Book of Abraham 'translation,' Joseph Smith's circle produced the Kirtland Egyptian Papers, including a bound 'Grammar and Alphabet of the Egyptian Language' (1835, in the hands of W. W. Phelps and Warren Parrish, published in full by the Joseph Smith Papers). Joseph's own journal records him 'studying the Egyptian language' and that the group was 'engaged in translating an alphabet to the Book of Abraham, and arranging a grammar of the Egyptian language.' The system assigns single Egyptian characters paragraph-long English meanings that multiply through five 'degrees' — a scheme Egyptologists uniformly reject as bearing no relation to actual Egyptian. Three Book of Abraham manuscripts place characters copied sequentially from the recovered Hor Book of Breathings papyrus in the margins beside the English text. Unlike the gold plates, here the working papers of a Joseph Smith translation project survive — and they show a method that was not translation.","bom":["Abraham 1:1-3"],"bible":["Deuteronomy 18:21-22","Jeremiah 23:16"],"sources":[{"name":"Joseph Smith Papers: Grammar and Alphabet of the Egyptian Language (1835)","type":"primary","url":"https://www.josephsmithpapers.org/paper-summary/grammar-and-alphabet-of-the-egyptian-language-circa-july-circa-november-1835/1"},{"name":"Wikipedia: Kirtland Egyptian papers","type":"scholarly","url":"https://en.wikipedia.org/wiki/Kirtland_Egyptian_papers"},{"name":"FAIR: What are the Kirtland Egyptian Papers and GAEL?","type":"apologetics","url":"https://www.fairlatterdaysaints.org/answers/Question:_What_are_the_Kirtland_Egyptian_Papers_and_Grammar_and_Alphabet_of_the_Egyptian_Language%3F"},{"name":"Pearl of Great Price Central: The Kirtland Egyptian Papers and the Book of Abraham","type":"apologetics","url":"https://pearlofgreatpricecentral.org/the-kirtland-egyptian-papers-and-the-book-of-abraham/"}],"response":"Apologists (Gee, Muhlestein, Pearl of Great Price Central) argue the direction of dependence is reversed: the Egyptian-language documents were the scribes' after-the-fact attempt to reverse-engineer Egyptian using the already-revealed English text, an intellectual exercise Joseph tolerated but did not author — most pages are in scribes' handwriting, the GAEL was never published or canonized, and textual evidence is argued to show the Abraham text preceding the Alphabet entries. On this view the KEP tell us about 1835 curiosity regarding Egyptian, not about how the Book of Abraham was produced.","responseSource":{"name":"Pearl of Great Price Central: The Kirtland Egyptian Papers and the Book of Abraham","url":"https://pearlofgreatpricecentral.org/the-kirtland-egyptian-papers-and-the-book-of-abraham/"},"verdict":"contested","rationale":"The narrow question — which came first, the English text or the Alphabet documents — is genuinely debated, with Joseph Smith Papers editors describing the documents as intertwined and scholars on both sides making textual arguments. So the strongest critical framing ('the GAEL was the translation engine') stays contested. But the apologetic escape is expensive: Joseph's own journal says he was arranging the grammar, and either direction leaves the prophet's circle producing, under his supervision, an 'Egyptian' system that is demonstrably nonsense. Paired with the papyri mismatch (covered separately), this is corroborating rather than standalone evidence — hence medium severity and a conservative contested grade.","severity":"medium"},
{"id":"zelph-white-lamanite","title":"Zelph: Joseph Smith identifies an Illinois skeleton as a 'white Lamanite' warrior","category":"archaeology","claim":"On June 3, 1834, during Zion's Camp, Joseph Smith's men dug a skeleton with an arrowhead between its ribs from a burial mound near the Illinois River (Naples-Russell Mound 8, a Hopewell-culture site in Pike County, Illinois). According to diaries kept by at least six participants — Wilford Woodruff, Heber C. Kimball, George A. Smith, Levi Hancock, Moses Martin, Reuben McBride — Joseph declared by vision that the bones belonged to 'Zelph,' a 'white Lamanite' warrior-chieftain under 'the great prophet Onandagus,' killed in battle; several accounts say Onandagus was 'known from the Rocky Mountains to the eastern sea.' The story entered History of the Church 2:79–80. The episode shows Joseph exercising his revelatory gift on a checkable claim — a Hopewell burial unrelated to any Israelite civilization — and locating Book of Mormon peoples in North America, which limited Mesoamerican geography models must explain away.","bom":[],"bible":["Deuteronomy 18:21-22"],"sources":[{"name":"Kenneth Godfrey, 'The Zelph Story' (BYU Studies)","type":"scholarly","url":"https://byustudies.byu.edu/article/the-zelph-story"},{"name":"Wikipedia: Zelph","type":"scholarly","url":"https://en.wikipedia.org/wiki/Zelph"},{"name":"MormonThink: Zelph, ancient Mormon warrior","type":"scholarly","url":"http://www.mormonthink.com/zelph.htm"},{"name":"FAIR: Joseph Smith and Zelph","type":"apologetics","url":"https://www.fairlatterdaysaints.org/answers/Book_of_Mormon/Geography/Statements/Nineteenth_century/Joseph_Smith's_lifetime_1829-1840/Joseph_Smith/Zelph"}],"response":"FAIR, drawing on Godfrey's source study, notes that Joseph himself wrote nothing about Zelph; the six diary accounts disagree on key details (which battle, whether the Rocky Mountains phrase was original), and the History of the Church version is a later scribal conflation that hardened a casual campfire comment into formal revelation. Even taken at face value, apologists argue Zelph could be a late-period Lamanite in the 'hinterlands' far from the Book of Mormon's core lands, so the story does not fix Book of Mormon geography.","responseSource":{"name":"FAIR: Joseph Smith and Zelph","url":"https://www.fairlatterdaysaints.org/answers/Book_of_Mormon/Geography/Statements/Nineteenth_century/Joseph_Smith's_lifetime_1829-1840/Joseph_Smith/Zelph"},"verdict":"contested","rationale":"The source-critical objections are real: the accounts genuinely diverge on details, and the canonical History version is a conflation — so the exact content of Joseph's statement is not recoverable with certainty, which keeps this out of 'unrefuted.' But all six independent diaries agree on the core: Joseph claimed a vision identifying a specific skeleton as a white Lamanite under a prophet named Onandagus. That core is either a false revelatory claim about a Hopewell burial or must be diluted to 'speculation' — the same unfalsifiability move seen elsewhere. Contested on the details, damaging on the pattern; medium severity.","severity":"medium"},
{"id":"bom-geography-retreat","title":"Book of Mormon geography: from hemispheric certainty to official 'no position'","category":"archaeology","claim":"For over a century the church taught a hemispheric Book of Mormon: canonized revelations identify North American Indians as Lamanites (D&C 28:8; 32:2; 54:8); Joseph Smith endorsed both Central American ruins (Times and Seasons, 1842) and North American sites ('plains of the Nephites,' Zelph) as Nephite; the New York hill where Joseph got the plates was officially Cumorah of the final battles (Mormon 6:6) — Joseph Fielding Smith warned the two-Cumorah theory would make members 'confused and disturbed in their faith,' and Marion Romney affirmed New York Cumorah in 1975 general conference. Under archaeological and DNA pressure, scholars retreated to limited-geography models; today the rival camps — Mesoamerican (FAIR, Scripture Central) and Heartland (Meldrum's FIRM Foundation) — each publish detailed refutations of the other. In 2019 the church's Gospel Topics statement declared it 'does not take a position on the specific geographic locations' and asked members not to teach any geography in church settings. No model reconciles the text, the founders' statements, and the evidence.","bom":["D&C 28:8","D&C 32:2","Mormon 6:6"],"bible":["Luke 3:1","Acts 26:26"],"sources":[{"name":"Gospel Topics: Book of Mormon Geography","type":"institutional","url":"https://www.churchofjesuschrist.org/study/manual/gospel-topics/book-of-mormon-geography?lang=eng"},{"name":"Wikipedia: Proposed Book of Mormon geographical setting","type":"scholarly","url":"https://en.wikipedia.org/wiki/Proposed_Book_of_Mormon_geographical_setting"},{"name":"FAIR: Heartland Model of Book of Mormon geography (apologists vs. apologists)","type":"apologetics","url":"https://www.fairlatterdaysaints.org/answers/Heartland_Model_of_Book_of_Mormon_geography"},{"name":"LDS Discussions: Book of Mormon Geography (annotated essay)","type":"scholarly","url":"https://www.ldsdiscussions.com/geography"},{"name":"Scripture Central: Church Releases Statement on Book of Mormon Geography","type":"apologetics","url":"https://scripturecentral.org/blog/church-releases-statement-on-book-of-mormon-geography"}],"response":"Apologists respond that the Book of Mormon text itself never names a modern location, and internal travel distances actually require a limited geography — so the hemispheric model was a cultural assumption early members (including Joseph, speaking as a man) layered onto the text, not revelation. Scripture Central argues a Mesoamerican setting satisfies dozens of textual criteria (writing systems, cities, warfare, demographics), and the church's official neutrality is appropriate humility on a question scripture leaves open, comparable to unresolved questions in biblical geography.","responseSource":{"name":"FAIR: Heartland Model of Book of Mormon geography","url":"https://www.fairlatterdaysaints.org/answers/Heartland_Model_of_Book_of_Mormon_geography"},"verdict":"unrefuted","rationale":"The retreat itself is documented in the church's own statement, and the 'text never specifies' defense fails against canonized text: the D&C — scripture, not speculation — identifies specific North American tribes as Lamanites, and prophets taught New York Cumorah as doctrine. The strongest evidence that no answer works is the apologists themselves: FAIR and Scripture Central publish refutations of the Heartland model whose arguments (anachronism, distance, archaeology) mirror the critics' case against Mesoamerica, and vice versa. When every proposed location is convincingly refuted by fellow believers, the claim has become unfalsifiable by relocation. Medium severity because it is a meta-argument that leans on the archaeology and DNA entries.","severity":"medium"},
{"id":"polygamy-coercion-angel-sword","title":"Coercive proposals: the angel with a drawn sword and salvation-for-marriage promises","category":"polygamy-history","claim":"The church's own Gospel Topics essay 'Plural Marriage in Kirtland and Nauvoo' concedes that Joseph Smith told women an angel appeared three times commanding polygamy, and that in the final appearance 'the angel came with a drawn sword, threatening Joseph with destruction unless he went forward.' He deployed this account in proposals: to Zina Diantha Huntington (proposed to while she was courting Henry Jacobs; sealed to Joseph after being told of the angel; Henry later stood as witness), to Mary Elizabeth Rollins Lightner (already married), and to Lucy Walker, a 16-year-old living in his home after her mother's death, who was told to seek confirmation and later described her anguish. Helen Mar Kimball, 14, recorded Joseph's promise: 'If you will take this step, it will ensure your eternal salvation and exaltation, and that of your father's household.' D&C 132 canonizes the pattern: wives who refuse are 'destroyed' (vv. 54, 64). Scripture warns that even an angel preaching another gospel is accursed (Gal 1:8) and that Satan appears as an angel of light (2 Cor 11:14).","bom":["D&C 132:52-55","D&C 132:63-65","Jacob 2:24"],"bible":["Galatians 1:8","2 Corinthians 11:14","Matthew 7:15-20","Jeremiah 23:14"],"sources":[{"name":"Gospel Topics essay: Plural Marriage in Kirtland and Nauvoo","type":"institutional","url":"https://www.churchofjesuschrist.org/study/manual/gospel-topics-essays/plural-marriage-in-kirtland-and-nauvoo?lang=eng"},{"name":"Brian Hales: The Accounts of the Angel with a Drawn Sword","type":"apologetics","url":"https://ensignpeakfoundation.org/wp-content/uploads/2013/03/Encouraging-Joseph-Smith-to-Practice-Plural-Marriage-The-Accounts-of-the-Angel-with-a-Drawn-Sword.pdf"},{"name":"FAIR: Helen Mar Kimball — circumstances of her plural marriage","type":"apologetics","url":"https://www.fairlatterdaysaints.org/answers/Joseph_Smith/Polygamy/Plural_wives/Helen_Mar_Kimball/Circumstances_of_her_plural_marriage"},{"name":"Christian Research Institute: Plural Marriage and Joseph Smith","type":"scholarly","url":"https://www.equip.org/articles/plural-marriage-joseph-smith-pr-nightmare-mormonism/"}],"response":"Hales and FAIR argue the angel accounts originate with faithful participants and demonstrate Joseph's reluctance — he delayed for years and acted only under divine compulsion, the opposite of a predator's eagerness. They note Helen Mar Kimball's sealing was likely unconsummated and dynastic ('eternity-only'), linking families for the next life; that women like Sarah Pratt and Cordelia Morley refused Joseph without spiritual penalty, showing real agency; and that mid-19th-century marriage norms for young women differed sharply from today's, so modern coercion categories are anachronistic.","responseSource":{"name":"Brian Hales: The Accounts of the Angel with a Drawn Sword","url":"https://ensignpeakfoundation.org/wp-content/uploads/2013/03/Encouraging-Joseph-Smith-to-Practice-Plural-Marriage-The-Accounts-of-the-Angel-with-a-Drawn-Sword.pdf"},"verdict":"admitted","rationale":"The essential facts are conceded in the church's own essay: the drawn-sword angel, Helen's marriage 'several months before her 15th birthday,' and sealings to already-married women. The salvation-promise to Helen is her own faithful memoir, and D&C 132's destruction threats are canon. The apologetic reframing (reluctance, dynastic sealings, era norms) disputes interpretation, not substance — and 'an angel threatened him into it' is itself the admission: the proposals bundled divine reward and divine threat, which is coercion by any biblical test, and Galatians 1:8 addresses precisely the scenario of angelic authorization for another gospel. High severity: it goes to the prophet's character and the fruit test.","severity":"high"},
{"id":"holocaust-proxy-baptisms","title":"Proxy baptism of Holocaust victims despite a signed agreement to stop","category":"practice-temple","claim":"LDS members performed proxy baptisms for hundreds of thousands of Holocaust victims. After Jewish organizations protested, the church signed a 1995 agreement to remove victims' names and stop the practice except for direct ancestors of members. Researcher Helen Radkey then repeatedly documented violations across two decades: Anne Frank's name submitted at least a dozen times and the ordinance performed at least nine times (including in the Santo Domingo Temple in February 2012, prompting a church condemnation); Simon Wiesenthal's parents baptized by proxy in early 2012, drawing a formal church apology to the family. The church revised its database controls in 2010 and threatened discipline for violators. The episode exposes the doctrine underneath: D&C 128:15 declares the dead 'cannot be made perfect' without our ordinances and that vicarious work is 'essential to our salvation' — resting on one disputed verse (1 Cor 15:29) against the Bible's teaching that judgment follows death (Heb 9:27) and that a fixed gulf separates the dead (Luke 16:26), a point the Book of Mormon itself makes (Alma 34:32–35).","bom":["D&C 128:15-18","Alma 34:32-35"],"bible":["1 Corinthians 15:29","Hebrews 9:27","Luke 16:26"],"sources":[{"name":"KSL: LDS Church issues statement after report of proxy baptism for Anne Frank","type":"journalism","url":"https://www.ksl.com/article/19319871/lds-church-issues-statement-after-report-of-proxy-baptism-for-anne-frank"},{"name":"CBS News: Mormons apologize to Wiesenthal family for posthumous baptism","type":"journalism","url":"https://www.cbsnews.com/sacramento/news/mormons-apologize-to-wiesenthal-family-for-posthumous-jewish-baptism"},{"name":"Fox 13: LDS Church condemns recent proxy baptism of Anne Frank","type":"journalism","url":"https://www.fox13now.com/2012/02/21/lds-church-condemns-recent-proxy-baptism-of-anne-frank"},{"name":"Mormonr: Holocaust Victims and Baptisms for the Dead","type":"apologetics","url":"https://mormonr.org/qnas/5GmWI/holocaust_victims_and_baptisms_for_the_dead"}],"response":"The church and Mormonr respond that proxy baptism compels no one — LDS doctrine holds the deceased may accept or reject the ordinance, so it is an offering, not a posthumous conversion; that the institution honored the 1995 agreement and each documented violation was the act of individual members contrary to explicit policy; and that the church responded seriously — removing names, engineering database blocks on Holocaust-victim submissions in 2010, apologizing to families, and warning that violators face loss of temple privileges or discipline.","responseSource":{"name":"Mormonr: Holocaust Victims and Baptisms for the Dead","url":"https://mormonr.org/qnas/5GmWI/holocaust_victims_and_baptisms_for_the_dead"},"verdict":"admitted","rationale":"Every load-bearing fact is conceded by the church itself: the practice occurred, the 1995 agreement existed, violations continued for years, and the church publicly condemned and apologized for specific cases (Wiesenthal, Frank). The individual-members defense is fair as far as it goes but concedes the systemic point — a doctrine that makes ordinances for the dead 'essential to our salvation' generates relentless pressure that policy could not contain for two decades. The deeper evangelistic use is doctrinal: the entire temple-for-the-dead system hangs on 1 Corinthians 15:29 read against Hebrews 9:27, Luke 16:26, and even Alma 34. Medium severity.","severity":"medium"},
