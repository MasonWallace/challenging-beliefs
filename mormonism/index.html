ba; foreign idolatrous wives), while D&C 132:38–39 says David sinned only 'in the case of Uriah' — the wives 'given of me' were the authorized ones (cf. 2 Samuel 12:8, Nathan: 'I gave thee thy master's wives'), so the contradiction dissolves on careful reading.","responseSource":{"name":"FAIR, 'Contradiction between Jacob and D&C 132'","url":"https://www.fairlatterdaysaints.org/archive/publications/contradiction_between_jacob_and_dc_132"},"rationale":"The FAIR harmonization is textually available: 2 Samuel 12:8 does have God 'giving' David wives, and Jacob 2:30's clause can be read as an exception (though recent scholarship, including some LDS writers, argues the verse's grammar means the opposite). The strain shows at Solomon: no biblical or Book of Mormon text authorizes Solomon's wives, which both Jacob and 1 Kings 11 condemn, yet D&C 132:38 lists Solomon among those who 'sinned not.' The rule-plus-exception reading keeps the texts formally consistent at the cost of making 'abominable' practices divinely grantable — the tension is narrowed but not eliminated."},
{"id":"unchangeable-god-vs-king-follett","category":"canon-provenance","severity":"high","verdict":"unrefuted","title":"God 'unchangeable from all eternity' vs. God as exalted man","claim":"Moroni 8:18 ('God is not a partial God, neither a changeable being; but he is unchangeable from all eternity to all eternity') and Mormon 9:9–10,19 agree with the Bible (Psalm 90:2; Malachi 3:6; Isaiah 43:10 — 'before me there was no God formed') but contradict Joseph Smith's 1844 King Follett Discourse ('We have imagined and supposed that God was God from all eternity. I will refute that idea… God himself, the Father of us all, dwelt on an earth, the same as Jesus Christ himself did') and Lorenzo Snow's couplet ('As man now is, God once was'). The Book of Mormon's own theology proves the later doctrine of eternal progression is an innovation foreign to Smith's founding scripture.","bom":["Moroni 8:18","Mormon 9:9–11, 19","Moroni 7:22","3 Nephi 24:6"],"bible":["Psalm 90:2","Malachi 3:6","Isaiah 43:10","Isaiah 44:6","James 1:17","Numbers 23:19"],"comparison":{"left":{"ref":"Moroni 8:18 (Book of Mormon, 1829)","text":"For I know that God is not a partial God, neither a changeable being; but he is unchangeable from all eternity to all eternity."},"right":{"ref":"Joseph Smith, King Follett Discourse (1844)","text":"We have imagined and supposed that God was God from all eternity. I will refute that idea… He was once a man like us; yea, God himself, the Father of us all, dwelt on an earth, the same as Jesus Christ himself did."},"hl":["unchangeable from all eternity to all eternity","God was God from all eternity","once a man like us"],"note":"Smith's 1844 sermon explicitly sets out to refute the doctrine his own 1829 scripture teaches — and the Bible sides with the 1829 text (Psalm 90:2: 'from everlasting to everlasting, thou art God')."},"sources":[{"name":"Institute for Religious Research, 'The Mormon God Has Not Always Been God'","type":"apologetics","url":"https://mit.irr.org/mormon-god-has-not-always-been-god-part-1"},{"name":"Robert M. Bowman Jr., 'Answers to Mormon Answers on Moroni 8:18'","type":"scholarly","url":"https://robertbowman.net/2018/08/18/answers-to-mormon-answers-on-moroni-818/"},{"name":"Richard Packham, 'Major Contradictions in Mormonism'","type":"apologetics","url":"https://packham.n4m.org/contra.htm"}],"response":"(1) LDS scholars (Blake Ostler; FAIR) argue Moroni 8:18 concerns God's moral character and covenant faithfulness — he is not 'partial' or fickle — not his metaphysical history; the immediate context is God's impartiality toward children, so pressing it into ontology is proof-texting. (2) 'From all eternity to all eternity' can be read as a Hebraic idiom meaning across all ages of this creation, compatible with an eternally self-existent intelligence who attained exaltation before this creation cycle. (3) Since attaining godhood, God is unchangeable in all salvifically relevant respects, which is all Mormon 9 requires for its argument (that miracles have not ceased).","responseSource":{"name":"FAIR / Blake Ostler, 'Mormonism and the nature of God'","url":"https://www.fairlatterdaysaints.org/answers/Mormonism_and_the_nature_of_God/Polytheism"},"rationale":"Bowman's rebuttal to the moral-character-only reading is difficult to escape: Moroni 8:18 and Mormon 9:9 use temporal-ontological language ('from all eternity to all eternity'), the same formulas the Bible uses of God's eternal deity (Psalm 90:2), and the Book of Mormon nowhere hints God was once a mortal man. King Follett explicitly frames the 1844 doctrine as overturning the earlier view — which is exactly what the 1829 text teaches. The idiom-and-eternity-cycles reply is speculative and post hoc, with no LDS canonical support. The Book of Mormon here sides with the Bible against later Mormonism; as a provenance criticism it stands effectively unanswered."},
{"id":"no-postmortem-repentance","category":"canon-provenance","severity":"medium","verdict":"contested","title":"No repentance after death (Alma 34) vs. postmortem salvation and baptism for the dead","claim":"Alma 34:32–35 teaches 'this life is the time for men to prepare to meet God… after this day of life… then cometh the night of darkness wherein there can be no labor performed'; those who procrastinate repentance are 'sealed' to the devil, and 'this is the final state of the wicked.' This agrees with the Bible (Hebrews 9:27; Luke 16:26's fixed gulf) but contradicts later LDS doctrine of postmortem evangelization, spirit-prison repentance, and proxy baptism for the dead (D&C 128; D&C 138) — a defining Nauvoo-era practice absent from the Book of Mormon.","bom":["Alma 34:32–35","2 Nephi 9:38","Mosiah 2:36–39","Mosiah 26:25–27"],"bible":["Hebrews 9:27","Luke 16:26","2 Corinthians 6:2","John 8:24"],"sources":[{"name":"Richard Packham, 'Major Contradictions in Mormonism'","type":"apologetics","url":"https://packham.n4m.org/contra.htm"},{"name":"Grant Palmer, An Insider's View of Mormon Origins","type":"scholarly","url":"https://en.wikipedia.org/wiki/An_Insider%27s_View_of_Mormon_Origins"},{"name":"CES Letter (aggregates the doctrinal-evolution case)","type":"apologetics","url":"https://read.cesletter.org/bom/"}],"response":"(1) Amulek's audience in Alma 34 is the Zoramites — apostates who had already received the gospel; his warning applies to those who reject the gospel in mortality, not to the billions who never heard it. D&C 138:32–34 restricts postmortem gospel acceptance to 'those who died without a knowledge of this gospel' — so the two texts partition humanity without overlap. (2) LDS teaching holds that character and disposition persist after death, so postmortem repentance is no easy second chance; Alma 34's practical urgency stands. (3) 1 Peter 3:19 and 4:6 (Christ preaching to the spirits in prison) and 1 Corinthians 15:29 give the later doctrine biblical footing.","responseSource":{"name":"LDS D&C 138 Student Manual","url":"https://www.churchofjesuschrist.org/study/manual/doctrine-and-covenants-student-manual/section-138-vision-of-the-redemption-of-the-dead?lang=eng"},"rationale":"The audience-partition harmonization is internally coherent and is the church's official teaching, and critics sometimes overclaim by ignoring it. But it strains the text: Amulek's language is universal in form ('this life is the time for MEN to prepare to meet God'; 'the FINAL state of the wicked'), the Book of Mormon elsewhere repeats the no-second-chance schema without the carve-out, and the entire apparatus of spirit prison, vicarious ordinances, and three degrees of glory is absent from — and in tone alien to — the Book of Mormon's binary heaven/hell eschatology. As evidence of doctrinal evolution between 1829 and Nauvoo it retains real force; as a strict logical contradiction it is answerable."},
{"id":"born-at-jerusalem","category":"prophecy","severity":"low","verdict":"contested","title":"Jesus born 'at Jerusalem' (Alma 7:10) vs. Bethlehem (Micah 5:2)","claim":"Alma 7:10 prophesies Jesus 'shall be born of Mary, at Jerusalem which is the land of our forefathers' — but the Bible's prophecy (Micah 5:2) and fulfillment (Matthew 2:1; Luke 2:4–7) place the birth in Bethlehem. Critics call this a straightforward geographical error by Joseph Smith, noting the Bible he knew made Bethlehem famous, and argue an American frontier author confusing prophecy-of-place is more plausible than an inspired record contradicting Micah.","bom":["Alma 7:10"],"bible":["Micah 5:2","Matthew 2:1–6","Luke 2:4–7","John 7:42"],"comparison":{"left":{"ref":"Alma 7:10 (Book of Mormon)","text":"And behold, he shall be born of Mary, at Jerusalem which is the land of our forefathers, she being a virgin, a precious and chosen vessel."},"right":{"ref":"Micah 5:2 (KJV)","text":"But thou, Bethlehem Ephratah, though thou be little among the thousands of Judah, yet out of thee shall he come forth unto me that is to be ruler in Israel."},"hl":["at Jerusalem which is the land","Bethlehem Ephratah"],"note":"The LDS defense turns on the apposition 'which is the land' — a regional reading with genuinely ancient parallels (Amarna letters; 4Q385a)."},"sources":[{"name":"Mormonism Research Ministry, 'Was Jesus Born \"at Jerusalem\"?'","type":"apologetics","url":"https://mrm.org/jerusalem"},{"name":"MRM, '\"The Land of Jerusalem\" and the Dead Sea Scrolls' (rebuttal of the LDS reply)","type":"apologetics","url":"https://mrm.org/land-of-jerusalem"},{"name":"MRM, 'Do the Amarna Letters support Alma 7:10?'","type":"apologetics","url":"https://mrm.org/do-the-amarna-letters-support-alma-710"}],"response":"(1) The verse itself says 'at Jerusalem WHICH IS THE LAND of our forefathers' — land, not city; the Book of Mormon consistently uses 'land of Jerusalem' (40+ times) for the region Lehi left, and every Book of Mormon writer was six centuries and an ocean removed from Judean village geography. (2) 'Land of Jerusalem' is an authentically ancient administrative idiom: Amarna letter EA 287 (14th c. BC) speaks of towns 'of the land of Jerusalem,' and the Dead Sea Scrolls pseudo-Jeremiah fragment 4Q385a says Jeremiah was taken captive 'from the land of Jerusalem' — usage unknowable in 1829, so the critics' 'obvious blunder' is arguably an authenticity marker. (3) Bethlehem is five miles from Jerusalem — squarely within any 'land of Jerusalem.'","responseSource":{"name":"FAIR, 'Born at Jerusalem, the land of our forefathers'","url":"https://www.fairlatterdaysaints.org/answers/Question:_Why_does_the_Book_of_Mormon_say_that_Jesus_would_be_born_%22at_Jerusalem_which_is_the_land_of_our_forefathers%22_when_the_Bible_states_that_he_was_born_in_Bethlehem%3F"},"rationale":"Among the stronger LDS replies in the corpus: the text's own apposition, the consistent land/city usage, and genuinely ancient 'land of Jerusalem' attestations give the harmonization real evidential footing. The counters retain some bite (the parallels are regional usages in non-birth contexts; a 19th-century author writing loosely also explains the data). Neither side can close the case; severity is limited because even on the critical reading it is an imprecision, not a doctrinal conflict."},
{"id":"plain-precious-things-removed","category":"textual-transmission","severity":"high","verdict":"contested","title":"'Plain and precious things' removed from the Bible vs. the manuscript evidence","claim":"1 Nephi 13:26–29,40 claims a 'great and abominable church' deliberately 'taken away from the gospel of the Lamb many parts which are plain and most precious, and also many covenants,' corrupting the Bible after the apostles — the foundational LDS justification for a Restoration. Critics reply that the manuscript record refutes wholesale excision: the Dead Sea Scrolls' Great Isaiah Scroll (c. 125 BC) matches the medieval Masoretic text with ~95%+ verbal identity across a 1,000-year gap, and the NT's 5,800+ Greek manuscripts, early papyri, versions, and patristic citations allow reconstruction of the text to within trivial variants — no doctrinally significant material was ever removed, and the Bible affirms its own preservation (Isaiah 40:8; Matthew 24:35).","bom":["1 Nephi 13:26–29, 34, 40","1 Nephi 14:20–26"],"bible":["Isaiah 40:8","Matthew 24:35","1 Peter 1:24–25","Psalm 119:89"],"sources":[{"name":"CARM, 'Mormonism and the Corruption of the Bible'","type":"apologetics","url":"https://carm.org/mormonism/mormonism-and-the-corruption-of-the-bible/"},{"name":"MRM, 'The Dead Sea Scrolls' (on LDS use of the scrolls)","type":"apologetics","url":"https://mrm.org/dead-sea-scroll-doctrine"},{"name":"Probe Ministries, 'The Dead Sea Scrolls Shed Light on the Accuracy of our Bible'","type":"apologetics","url":"https://probe.org/the-dead-sea-scrolls/"}],"response":"(1) Scripture Central and FAIR relocate the loss EARLY — in the 1st–2nd centuries, before our earliest substantial manuscripts (most complete NT codices are 4th century), so surviving-manuscript uniformity cannot rule it out; they cite mainstream critics (Bart Ehrman, 'Orthodox Corruption of Scripture') for theologically motivated early alterations. (2) The removal need not be textual deletion at all: 1 Nephi 13 speaks of 'plain and precious things' AND 'covenants' — lost books the Bible itself names (Jasher, the epistle to Laodicea), lost ordinances/covenant context, and lost interpretive keys, which is 'keeping back' without altering extant words. (3) The Dead Sea Scrolls actually complicate a single stable text (variant editions of Jeremiah, Samuel), showing fluidity in transmission.","responseSource":{"name":"Scripture Central KnoWhy, 'Were Plain and Precious Doctrines Lost?'","url":"https://scripturecentral.org/knowhy/were-plain-and-precious-doctrines-lost"},"rationale":"The manuscript evidence decisively refutes the claim in its popular LDS form (a post-apostolic institutional purge of doctrines from the Bible's text): the Dead Sea Scrolls close the OT gap, and NT transmission is too early, too dispersed, and too multiply attested for coordinated excision to escape the record. But the sophisticated reformulation (very early loss, lost books, non-textual 'keeping back') is constructed to sit exactly where evidence is sparsest and is effectively unfalsifiable — it cannot be refuted, but it also abandons the natural reading of 1 Nephi 13 and offers no positive evidence. The criticism prevails against the historic claim; the retreat position survives by retreating."},
{"id":"no-nephite-material-culture","category":"archaeology","severity":"high","verdict":"unrefuted","featured":true,"title":"No archaeological trace of Nephite civilization; no Book of Mormon site ever identified","claim":"The Book of Mormon describes literate, metal-working, city-building civilizations numbering in the millions and fighting battles with hundreds of thousands of casualties in the pre-Columbian New World. After ~190 years of professional Americanist archaeology, not one city, battlefield, road, temple, artifact, or skeleton has been identified as Nephite, Lamanite, or Jaredite; no site named in the text has been located on a modern map; and no non-LDS archaeologist uses the text as a field guide. Both the Smithsonian Institution and the National Geographic Society issued standing statements to that effect.","bom":["Mormon 6:10–15","Ether 15:2","Alma 2:19","Helaman 3:7–11","Mosiah 11:8–10","2 Nephi 5:15–16"],"bible":[],"sources":[{"name":"Michael D. Coe, 'Mormons and Archaeology: An Outside View,' Dialogue 8/2 (1973) — 'nothing, absolutely nothing, has ever shown up in any New World excavation which would suggest to a dispassionate observer that the Book of Mormon… is a historical document'","type":"scholarly","url":"https://scholarlypublishingcollective.org/uip/dial/article/8/2/40/244301/MORMONS-AND-ARCHAEOLOGY-AN-OUTSIDE-VIEW"},{"name":"Michael D. Coe, Mormon Stories interview transcript (2011) — reaffirms the 1973 verdict after 38 more years of Maya epigraphy","type":"scholarly","url":"https://medium.com/@jellistx/transcript-of-mormon-stories-2011-interview-with-michael-coe-73dc6438e99"},{"name":"Dee F. Green (LDS archaeologist), 'Book of Mormon Archaeology: The Myths and the Alternatives,' Dialogue 4/2 (1969) — 'no Book of Mormon location is known with reference to modern topography'","type":"scholarly","url":"https://www.dialoguejournal.com/articles/book-of-mormon-archaeology-the-myths-and-the-alternatives/"},{"name":"Smithsonian Institution, 'Statement Regarding the Book of Mormon' (rev. 1998)","type":"institutional","url":"https://mit.irr.org/smithsonian-institution-statement-on-book-of-mormon"},{"name":"National Geographic Society letter (1998)","type":"institutional","url":"https://mit.irr.org/file/national-geographic-society-statement-on-book-of-mormon"}],"response":"(1) The limited-geography model (John L. Sorenson, Mormon's Codex, 2013) confines the narrative to a ~500-mile Mesoamerican corridor, so hemispheric absence of evidence is irrelevant — Sorenson catalogs 400+ claimed correspondences with Mesoamerican culture. (2) Identification is structurally impossible, not merely unachieved: only Maya script is confidently read, ancient toponyms were largely erased by the conquest, and archaeologists cannot label most ruins by their original names — the Book of Mormon is not unique in this. (3) John Clark's tally holds that of ~60 concrete items the text asserts, archaeological support rose from 13% in 1842 to 75% by 2005 — cement, fortified cities, thrones, warfare, literacy. (4) The strongest positive datum is Old World: the NHM ('Nahom') altars from Yemen, dated to the 7th–6th c. BC, on the correct bearing for Lehi's route (1 Nephi 16:34) — a specific, falsifiable hit Joseph Smith had no plausible access to. (5) FAIR notes the Smithsonian statement is a form letter written to reduce mail volume, not a research finding.","responseSource":{"name":"FAIR, 'Archaeological Evidence and the Book of Mormon'; Sorenson, Mormon's Codex","url":"https://www.fairlatterdaysaints.org/archive/publications/archaeological-evidence-and-the-book-of-mormon"},"rationale":"The response explains why we would not find labeled Nephite cities, but not the harder form of the claim: the text asserts a distinct literate civilization with Old World crops, metallurgy, and writing, and no diagnostic material assemblage of that kind exists anywhere in the Americas — a finding that does not require reading a place-name. Clark's tally is generic (warfare, thrones, cities are true of virtually any complex society). NHM is a genuine hit, but it is in Arabia, where the narrative overlaps documented geography; it establishes nothing about the New World two-thirds of the book. The limited-geography model is also a post-hoc retreat from the hemispheric reading held by Joseph Smith and every 19th-century leader, and tends toward unfalsifiability."},
{"id":"no-semitic-inscriptions","category":"archaeology","severity":"high","verdict":"unrefuted","title":"No Hebrew or Egyptian inscriptions — no 'reformed Egyptian' — in pre-Columbian America","claim":"The Book of Mormon claims a thousand-year continuous scribal tradition writing Hebrew and a modified Egyptian script on metal plates and stone. No pre-Columbian inscription in Hebrew, Egyptian, or any Semitic-derived script has ever been authenticated in the Americas; no script called 'reformed Egyptian' is attested in Egyptology; the known Mesoamerican writing systems (Maya, Zapotec, Epi-Olmec) are unrelated to Afro-Asiatic writing in structure or sign inventory; and the artifacts periodically advanced as exceptions (Bat Creek Stone, Los Lunas Decalogue Stone, Newark Holy Stones, Michigan Relics) are documented or strongly suspected forgeries.","bom":["Mormon 9:32–34","1 Nephi 1:2","Omni 1:20–22","Mosiah 8:11–13","Jacob 4:1–3"],"bible":[],"sources":[{"name":"Michael D. Coe (Yale Mayanist), Mormon Stories interview (2011)","type":"scholarly","url":"https://medium.com/@jellistx/transcript-of-mormon-stories-2011-interview-with-michael-coe-73dc6438e99"},{"name":"Survey of the scholarly position and forgery history of claimed exceptions ('Reformed Egyptian')","type":"scholarly","url":"https://en.wikipedia.org/wiki/Reformed_Egyptian"},{"name":"Criticism of the Book of Mormon (survey with primary citations)","type":"scholarly","url":"https://en.wikipedia.org/wiki/Criticism_of_the_Book_of_Mormon"}],"response":"(1) 'Reformed Egyptian' is the text's own internal descriptor ('altered by us, according to our manner of speech,' Mormon 9:32), not a claim to a script Egyptologists should recognize — and Egyptian genuinely was 'reformed' repeatedly (hieroglyphic → hieratic → demotic); Nibley noted documented cases of Semitic languages written in Egyptian characters. (2) The record was an elite, small-corpus, metal-plate tradition kept by a handful of record-keepers and buried — not a monumental epigraphic habit; we would not expect it in the ground. (3) Brian Stubbs (Uto-Aztecan specialist) argues for ~1,500 proposed Semitic/Egyptian correspondences in Uto-Aztecan with claimed regular sound correspondences — the kind of systematic evidence historical linguistics accepts.","responseSource":{"name":"FAIR, 'Reformed Egyptian and the Book of Mormon'; Brian D. Stubbs","url":"https://www.fairlatterdaysaints.org/answers/Reformed_Egyptian_and_the_Book_of_Mormon"},"rationale":"The 'small elite corpus' argument is internally coherent but concedes the claim is unfalsifiable by design. Stubbs's work is the only substantive positive evidence, and it has not been accepted or seriously engaged by non-LDS historical linguists; the standard criticism is that his method searches a large lexical space for phonetic resemblances and can generate comparable 'correspondences' between arbitrary language families. Meanwhile the null result stands: an entire decipherment field has found zero Afro-Asiatic connection in Mesoamerican scripts."},
{"id":"dna-native-american-origins","category":"dna","severity":"high","verdict":"contested","title":"Native American genetics show Asian, not Israelite, ancestry — and the 2006 introduction change","claim":"Mitochondrial, Y-chromosome, and autosomal studies place essentially all pre-Columbian Native American ancestry in Siberian/East Asian source populations entering via Beringia 15,000+ years ago. No Middle Eastern founding lineage from ~600 BC has been identified. Two LDS scientists — Thomas Murphy (anthropologist) and Simon Southerton (geneticist, former bishop) — published this as a direct falsification of the Lamanite claim in 2002–2003; Murphy faced a disciplinary council (postponed 24 hours before convening) and Southerton was disciplined. In 2006 the church silently changed the Book of Mormon introduction from stating the Lamanites 'are the principal ancestors of the American Indians' to 'are among the ancestors.'","bom":["Title Page","1 Nephi 13:30","2 Nephi 30:4–6","Alma 10:3","Helaman 15:11–13","3 Nephi 21:2–7"],"bible":[],"sources":[{"name":"Thomas W. Murphy, 'Lamanite Genesis, Genealogy, and Genetics,' in American Apocrypha (Signature Books, 2002)","type":"scholarly","url":"https://www.academia.edu/11588731/Lamanite_Genesis_Genealogy_and_Genetics"},{"name":"Simon G. Southerton, 'Simply Implausible: DNA and a Mesoamerican Setting for the Book of Mormon,' Dialogue 36/4 (2003)","type":"scholarly","url":"https://scholarlypublishingcollective.org/uip/dial/article/36/4/109/236590/Simply-Implausible-DNA-and-a-Mesoamerican-Setting"},{"name":"Documentation of the 2002 Murphy disciplinary council","type":"primary","url":"https://en.wikipedia.org/wiki/Thomas_W._Murphy_(anthropologist)"},{"name":"MormonR, 'DNA and the Book of Mormon' — sourced documentation of the 1981 vs. 2006 introduction wording","type":"primary","url":"https://mormonr.org/qnas/37RI8b/dna_and_the_book_of_mormon"}],"response":"Per the church's own Gospel Topics essay, which concedes 'the majority of Native Americans carry largely Asian DNA': (1) Nothing in the text claims Lehi's party was the only population — the introduction was a 1981 editorial addition, not scripture, and 2006 corrected an over-reading. (2) A founding party of ~30 entering an already-large population would leave a signal below detection after 2,600 years — standard population genetics, not special pleading. (3) Founder effect, genetic drift, and the post-contact bottleneck each erase small founding lineages; we also do not know the ancient Israelite genetic profile to look for. (4) Ugo Perego (population geneticist) notes the Asian ancestor of haplogroup X2a is itself undetected in modern Asia — proof real founding lineages go missing. (5) The essay's honest bottom line: DNA studies 'cannot be used decisively to either affirm or reject' the Book of Mormon.","responseSource":{"name":"Gospel Topics Essay, 'Book of Mormon and DNA Studies'","url":"https://www.churchofjesuschrist.org/study/manual/gospel-topics-essays/book-of-mormon-and-dna-studies?lang=eng"},"rationale":"The population-genetics rebuttal is technically sound: drift, founder effects, and the bottleneck genuinely can erase a small founding lineage, and critics who claim DNA 'disproves' the book overstate what a null result can do. The concession is nonetheless enormous: the defense works only by shrinking the Book of Mormon peoples into a demographically marginal group inside a continent already full of Asians — contradicting the text's self-presentation (2 Nephi 1:8–9 has the land 'kept as yet from the knowledge of other nations'), 150 years of prophetic teaching, and requiring an unannounced edit to the printed introduction — the most concrete institutional concession in this entire list."},
{"id":"population-growth-impossible","category":"demographics","severity":"medium","verdict":"contested","title":"Population growth from Lehi's party to the reported armies is demographically implausible","claim":"A founding party of roughly 20–30 people arriving ~589 BC splits almost immediately into Nephites and Lamanites. Within ~500 years the text reports 19,094 Lamanites slain in a single battle (Alma 2:19), armies of tens of thousands throughout Alma, and 230,000 Nephites killed at Cumorah (Mormon 6:10–15), with the Jaredites reaching 'two millions' (Ether 15:2). John Kunich showed that reaching these figures from the stated founders requires sustained growth rates far above anything observed in pre-modern populations, and the text has the Nephites building temples and fielding kings and standing armies within two generations of a landing party of a couple of dozen.","bom":["1 Nephi 18:23","2 Nephi 5:6–16","Jarom 1:8","Alma 2:19","Alma 28:2","Mormon 6:10–15","Ether 15:2"],"bible":[],"sources":[{"name":"John C. Kunich, 'Multiply Exceedingly: Book of Mormon Population Sizes,' Sunstone (1990), repr. in New Approaches to the Book of Mormon (1993)","type":"scholarly","url":"https://en.wikipedia.org/wiki/Criticism_of_the_Book_of_Mormon"},{"name":"Deseret News, 'The genetics of the Book of Mormon' (2008)","type":"journalism","url":"https://www.deseret.com/2008/7/10/20262970/in-the-village-the-genetics-of-the-book-of-mormon/"}],"response":"(1) James E. Smith (professional historical demographer, FARMS Review 6/1, 1994) argues Kunich misapplies aggregate long-run averages to a colonizing population; frontier populations with abundant land routinely sustain 2–3%/yr for centuries (colonial New England; Pitcairn), and Smith's model-life-table simulations produce Book of Mormon-scale populations under defensible assumptions. (2) Polygamy is attested among Lamanites and early Nephites. (3) Critically, the demographic and DNA problems share one textual (not ad hoc) solution: the book never says the land was empty — Sherem appears from nowhere (Jacob 7), the Mulekites are found already numerous (Omni 1), and 'Lamanite' functions as a political category. If Lehi's party assimilated into existing populations, no impossible growth rate is required. (4) Ancient casualty numbers — biblical, classical, Mesoamerican — are notoriously inflated; treating them as census data is a category error.","responseSource":{"name":"James E. Smith, 'Nephi's Descendants?' (FARMS Review 6/1); FAIR, 'Adding Up the Book of Mormon Peoples'","url":"https://www.fairlatterdaysaints.org/archive/publications/adding-up-the-book-of-mormon-peoples"},"rationale":"This is the criticism the LDS side has answered best on its own terms: Smith is a credentialed demographer and his frontier-growth objection to Kunich is technically correct, and the 'others in the land' reading is textually defensible. But the resolution is costly and creates a squeeze: the more 'others' are imported to fix the demography and the DNA, the less the book is what its own narrators and 19th-century readers thought — and the text's total silence about a surrounding indigenous majority becomes itself strange. Standalone it does not sink the text; it functions as a force multiplier on the DNA and archaeology entries."},
{"id":"translation-seer-stone","category":"provenance","severity":"medium","verdict":"answered","title":"Translation method: a seer stone in a hat, plates often not present — vs. the narrative taught for 150 years","claim":"The best-attested translation procedure — from Emma Smith, David Whitmer, and Martin Harris — is that Joseph Smith placed a seer stone (the same stone he used for 1820s treasure-seeking, for which he faced an 1826 court examination) into his hat, buried his face in it, and dictated English text that appeared on the stone. The gold plates were frequently covered on the table or not in the room. For roughly 150 years, church curriculum and artwork depicted instead a Joseph studying the open plates. The church only conceded the seer-stone-in-hat account in its 2013 Gospel Topics essay and published photographs of the stone in 2015.","bom":["Mosiah 8:13–18","Mosiah 28:11–16","Ether 3:23–28"],"bible":[],"sources":[{"name":"Gospel Topics Essay, 'Book of Mormon Translation' — official acknowledgment of the stone-in-hat method","type":"institutional","url":"https://www.churchofjesuschrist.org/study/manual/gospel-topics-essays/book-of-mormon-translation?lang=eng"},{"name":"Emma Smith, 'Last Testimony of Sister Emma,' Saints' Herald (1879) — 'sitting with his face buried in his hat, with the stone in it'","type":"primary","url":"https://www.churchofjesuschrist.org/study/manual/gospel-topics-essays/book-of-mormon-translation?lang=eng"},{"name":"MRM annotated analysis of the translation essay (documenting the curriculum gap)","type":"apologetics","url":"https://mrm.org/book-of-mormon-translation-essay"}],"response":"(1) The church now teaches this openly — the Gospel Topics essay, the Joseph Smith Papers, the Saints volumes, and the 2015 Ensign photographs. The sources were published in the 19th century and discussed in BYU Studies long before 2013; there was no suppression. (2) 'Urim and Thummim' was used loosely by Joseph's contemporaries to cover both the Nephite interpreters and the single stone, so the older account is imprecise rather than false. (3) Method is theologically irrelevant: if revelation is real, the instrument is incidental — the Bible has comparable instruments (Urim and Thummim, Aaron's rod). (4) Skousen and Carmack's critical-text work argues the dictation was tightly controlled — an argument the seer-stone method supports rather than undermines.","responseSource":{"name":"Interpreter Foundation, 'Seeing with a Hat'; Gospel Topics Essay, 'Book of Mormon Translation'","url":"https://interpreterfoundation.org/journal/seeing-with-a-hat-how-joseph-smith-used-a-hat-in-translating-the-book-of-mormon"},"rationale":"On the historical question the church has fully conceded and the concession is now in official curriculum, so the factual claim is settled and no longer contested by anyone. Two residues survive: (a) the plates were functionally unnecessary to the translation, which sits oddly with the elaborate narrative of their retrieval and angelic custody; and (b) the continuity between the translation instrument and Joseph's documented treasure-seeking practice with the same stone is a provenance fact. Those are interpretive problems, not evidentiary ones — the criticism as usually told (a hidden method) is now answered."},
{"id":"lost-116-pages","category":"provenance","severity":"medium","verdict":"contested","title":"The lost 116 pages and the convenient pre-existing replacement text","claim":"Martin Harris lost the first 116 manuscript pages (the Book of Lehi) in summer 1828. Joseph Smith did not retranslate them. Instead, a revelation (D&C 10) explained that wicked men had altered the lost pages and would publish the altered version to discredit him, and directed him to translate instead the 'small plates of Nephi' — a second, previously unmentioned record covering the same period, which Mormon says he included 'for a wise purpose… I know not' (Words of Mormon 1:7). Critics argue this is the signature of a human author who cannot reproduce a lost draft verbatim — a test that would have been trivially passable for a text delivered word-for-word on a seer stone.","bom":["Words of Mormon 1:3–7","1 Nephi 9:2–6","1 Nephi 19:1–6"],"bible":[],"sources":[{"name":"Dan Vogel, Joseph Smith: The Making of a Prophet (Signature Books, 2004); Fawn Brodie, No Man Knows My History (1945)","type":"scholarly","url":"http://www.mormonthink.com/lost116web.htm"},{"name":"Doctrine and Covenants 10 (primary revelation text)","type":"primary","url":"https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/10?lang=eng"},{"name":"LDS Discussions, 'The Lost 116 Pages'","type":"primary","url":"https://www.ldsdiscussions.com/116pages"}],"response":"(1) The stated rationale is counter-forgery, not evasion: if enemies held the only other copy, a fresh translation differing in any wording — as dictated translation inevitably would — would be paraded as proof of fabrication. Declining the trap is the rational move. (2) The 'convenient replacement' framing ignores that the small plates are foreshadowed inside the text at 1 Nephi 9 and 19 as a second record made by Nephi, and Mormon's explicit 'I know not' why he included them reads as an ancient editor recording a prompting he did not understand — a strange thing for a fabricator to invent. (3) Believers read this as divine foreknowledge providing for a foreseen failure; the episode is also the origin of a permanent doctrinal lesson about Joseph's fallibility (D&C 3).","responseSource":{"name":"BYU Religious Studies Center, 'The Lost 116 Pages Story'","url":"https://rsc.byu.edu/coming-forth-book-mormon/lost-116-pages-story-what-we-do-know-what-we-dont-know-what-we-might-know"},"rationale":"This turns entirely on prior probability — both sides agree on every fact. The apologetic reading is internally coherent and the wording-variation point is genuinely correct about translation. But the naturalistic reading is the more economical explanation, with a specific edge: the seer-stone method as now officially described (fixed English words appearing on the stone) is a tight-control model, under which a retranslation should have matched — neutralizing the wording objection. The apologetic defense and the church's own translation essay are in mild tension. Nothing here is falsifiable either way."},
{"id":"witnesses-character-and-vision","category":"provenance","severity":"medium","verdict":"contested","title":"The Three and Eight Witnesses: visionary 'spiritual eyes' language and later religious careers","claim":"The Eleven Witnesses were all Smith family, Whitmer family, or Martin Harris — no disinterested observers — and shared a documented folk-magic worldview including 'second sight.' Harris and Whitmer later described the experience in visionary terms (Harris: 'with the eyes of faith' / 'spiritual eyes'; Stephen Burnett's 1838 letter reports Harris saying the witnesses saw the plates only in vision); all Three left or were excommunicated by 1838; Whitmer's 1887 pamphlet declared God told him by voice to leave the church — the same evidentiary channel he claimed for the plates; Harris subsequently endorsed the Shaker 'Sacred Roll' (which also carried multi-witness testimony of angelic visitation). No witness ever claimed to view the uncovered plates in a mundane, non-visionary setting.","bom":["Testimony of Three Witnesses","Testimony of Eight Witnesses","Ether 5:2–4","2 Nephi 27:12–13"],"bible":["Deuteronomy 19:15","2 Corinthians 13:1"],"sources":[{"name":"Dan Vogel, 'The Validity of the Witnesses' Testimonies,' in American Apocrypha (Signature Books, 2002)","type":"scholarly","url":"http://www.mormonthink.com/vogelwitnesses.htm"},{"name":"David Whitmer, An Address to All Believers in Christ (1887) — primary text","type":"primary","url":"https://witnessesofthebookofmormon.org/three-witnesses/david-whitmer/statements/"},{"name":"Martin Harris, collected primary statements (LDS-produced archive printing the 'spiritual eyes' statements alongside affirmations)","type":"primary","url":"https://witnessesofthebookofmormon.org/three-witnesses/martin-harris/statements/"}],"response":"(1) The strongest fact on this side: not one of the eleven ever recanted — including Cowdery, Harris, and Whitmer after bitter excommunications, when recantation would have cost nothing and gained vindication; Whitmer, who never returned, reaffirmed the testimony to hostile interviewers for 50 years and had it carved on his gravestone. (2) The Eight Witnesses' experience was explicitly ordinary and daylit — they 'hefted' and 'handled' the plates with no angel involved, a different evidentiary category untouched by the 'spiritual eyes' argument. (3) Richard Lloyd Anderson (Investigating the Book of Mormon Witnesses, 1981) shows 'spiritual eyes' in 19th-century usage frequently means an objectively real perception granted by the Spirit (cf. 2 Kings 6:17), and most 'spiritual eyes' quotations are late, secondhand, or hostile paraphrases. (4) The Whitmer-left point cuts the other way: a man who denounced Smith as fallen and never came back is precisely the witness whose sustained affirmation is hardest to explain as social pressure.","responseSource":{"name":"Richard Lloyd Anderson, Investigating the Book of Mormon Witnesses (Deseret Book, 1981); FAIR","url":"https://www.fairlatterdaysaints.org/answers/Book_of_Mormon/Witnesses/%22Eye_of_Faith%22_and_%22Spiritual_Eye%22_statements_by_Martin_Harris"},"rationale":"Genuinely two-sided, and the strongest surviving apologetic position in this list. The non-recantation record is real and not easily dismissed — especially Whitmer. Against that: the witnesses are not independent (kin and business partners in a single religious enterprise), their epistemology admitted visionary perception as 'seeing,' and Harris's willingness to extend comparable endorsement to the Shaker book materially devalues his testimony as a discriminating instrument. Be suspicious of any source that presents this one as settled — the criticism is weaker than critics claim and the defense stronger; but sincerity of witnesses establishes sincerity, not the objective content of what was witnessed."},
{"id":"gold-plates-never-examined","category":"gold-plates","severity":"medium","verdict":"unrefuted","title":"The gold plates were never examined by any independent party","claim":"The plates were reportedly kept covered or hidden, shown only to insiders selected by Smith (family, financial backers, early believers — the Three Witnesses in vision, the Eight in a private setting), and then returned to the angel, so no scholar, scientist, or neutral third party ever inspected them. Weight estimates from those who hefted the covered object cluster around 40–60 lbs, whereas a solid gold block of the described dimensions would weigh well over 100–200 lbs. The artifact central to the founding claim is permanently unavailable for verification.","bom":["Testimony of Eight Witnesses"],"bible":[],"sources":[{"name":"Mormonr, 'The weight of the plates' (Q&A with primary quotes)","type":"apologetics","url":"https://mormonr.org/qnas/rcOSW/the_weight_of_the_plates"},{"name":"FAIR, 'Weight and size of the gold plates'","type":"apologetics","url":"https://www.fairlatterdaysaints.org/answers/Weight_and_size_of_the_gold_plates"},{"name":"Scripture Central, 'Composition of the plates' (tumbaga argument)","type":"apologetics","url":"https://scripturecentral.org/evidence/book-of-mormon-evidence-composition-of-the-plates"},{"name":"Mormon Stories, 'Book of Mormon Witnesses' (critical analysis)","type":"journalism","url":"https://www.mormonstories.org/home/truth-claims/the-book-of-mormon/book-of-mormon-witnesses/"}],"response":"Apologists argue the reported 40–60 lb weight actually fits an authentic ancient artifact: Mesoamerican tumbaga (copper-gold alloy, surface-gilded) plates of the described dimensions would weigh roughly 53–58 lbs and would look like gold — a detail a fraudster guessing at 'gold plates' would be unlikely to get right. The plates' return to the angel is explained scripturally (the record was not to convince by empirical proof; witnesses were divinely appointed instead, per Ether 5), and Anderson's scholarship shows those witnesses stayed constant for life.","responseSource":{"name":"Scripture Central, 'Composition of the plates'","url":"https://scripturecentral.org/evidence/book-of-mormon-evidence-composition-of-the-plates"},"rationale":"The core factual claim — no independent examination ever occurred and none is possible — is conceded by all parties; the tumbaga response makes the weight internally consistent but cannot substitute for the missing artifact. What is contested is only how much evidentiary weight the insider witnesses can carry in its place."},
{"id":"kinderhook-plates","category":"provenance","severity":"low","verdict":"answered","title":"The Kinderhook plates: Joseph Smith and a known 19th-century forgery","claim":"In 1843 three men manufactured six bell-shaped brass plates with fabricated 'ancient' characters, planted them in an Illinois mound, and delivered them to Joseph Smith specifically to test whether he would translate. Smith's clerk William Clayton recorded that Smith said the plates contained 'the history of the person with whom they were found… a descendant of Ham through the loins of Pharaoh.' That statement entered the official History of the Church in the first person ('I have translated a portion of them'). Fugate confessed the hoax in 1879; destructive testing in 1980 confirmed a 19th-century etched brass fabrication.","bom":[],"bible":[],"sources":[{"name":"Stanley B. Kimball, 'Kinderhook Plates… Appear to Be a Nineteenth-Century Hoax,' Ensign (August 1981) — the church's own publication of the testing results","type":"institutional","url":"https://www.churchofjesuschrist.org/study/history/topics/kinderhook-plates?lang=eng"},{"name":"William Clayton journal, 1 May 1843 (primary)","type":"primary","url":"http://www.mormonthink.com/kinderhookweb.htm"},{"name":"Utah Lighthouse Ministry (Tanner), 'The Kinderhook Plates' — documentation of the History of the Church first-person conversion","type":"scholarly","url":"https://www.utlm.org/onlineresources/kinderhookplates.htm"}],"response":"This is the church's own current published position: (1) Joseph Smith never claimed a revelatory translation and never produced a translated text — Don Bradley and Mark Ashurst-McGee ('President Joseph Has Translated a Portion,' 2011) identify a specific character match against Smith's Egyptian Alphabet and Grammar documents, showing the identification was a secular, comparative exercise. (2) Smith took the matter no further and dropped the subject entirely — the opposite of a con artist walking into a baited trap. (3) The first-person 'I have translated' is a documented artifact of the History of the Church's editorial practice of converting clerks' journals into Smith's voice. (4) The church published the forgery finding itself in 1981, in the Ensign.","responseSource":{"name":"Church History Topics: 'Kinderhook Plates'","url":"https://www.churchofjesuschrist.org/study/history/topics/kinderhook-plates?lang=eng"},"rationale":"The Bradley/Ashurst-McGee reconstruction is decisive and is good scholarship, not spin: the 'descendant of Ham' content traces to a character match against Smith's own Egyptian Alphabet and Grammar, making it a mundane comparative identification rather than a revelatory claim — and the church disclosed the forgery finding itself. The residue is narrower than critics present: the comparative identification was still wrong (the characters are meaningless), which reflects on the reliability of the Egyptian Alphabet and Grammar — connecting directly to the Book of Abraham entry, where the same document is the problem. Treat Kinderhook as answered on its own terms and as corroborating evidence for the Book of Abraham case."},
{"id":"source-parallels-voth-late-war","category":"provenance","severity":"medium","verdict":"contested","title":"Claimed 19th-century sources: View of the Hebrews and The Late War","claim":"(a) Ethan Smith's View of the Hebrews (1823/1825) argued American Indians descended from the lost tribes and was published in the town where Oliver Cowdery's family lived; LDS General Authority B. H. Roberts privately compiled a 291-page study listing ~26 structural similarities (a divided people, a buried ancient record, Urim and Thummim, Egyptian writing), published posthumously in 1985. (b) A 2013 computational comparison of over 100,000 pre-1830 books found Gilbert Hunt's The Late War (1816) — a school textbook written deliberately in KJV biblical style about the War of 1812 — an unusually strong n-gram match, including 'curious workmanship' and war-narrative structures. Critics offer these as evidence of environmental sourcing for the Book of Mormon.","bom":["Alma 46:12–13","3 Nephi 24–25","Ether 1–15 (structure)"],"bible":["Ezekiel 37:15–20","Isaiah 18"],"sources":[{"name":"B. H. Roberts, Studies of the Book of Mormon (University of Illinois Press, 1985)","type":"primary","url":"https://www.dialoguejournal.com/articles/is-there-any-way-to-escape-these-difficulties-the-book-of-mormon-studies-of-b-h-roberts/"},{"name":"Chris and Duane Johnson, 'The Late War and the Book of Mormon' (n-gram corpus study, 2013)","type":"scholarly","url":"http://wordtree.org/thelatewar/"},{"name":"Ryan Thomas, 'The Book of Mormon and The Late War: Direct Literary Dependence?' — a non-apologist critic's negative methodological assessment","type":"scholarly","url":"https://www.patheos.com/blogs/faithpromotingrumor/2013/10/the-book-of-mormon-and-the-late-war-direct-literary-dependence/"},{"name":"MRM, 'The Late War and the Book of Mormon'","type":"apologetics","url":"https://mrm.org/the-late-war-and-the-book-of-mormon"}],"response":"(1) Roberts himself drew no conclusion of dependence, framed the work as questions a believer must answer, and died affirming the Book of Mormon — using him as a witness for the prosecution misrepresents his stated position. There is no evidence Joseph Smith saw View of the Hebrews before 1830; he cited it favorably in 1842 as corroboration — the behavior of someone who found it later. (2) The parallels are generic to the common 1820s 'Hebraic Indian origins' genre; the books differ on nearly every particular (View of the Hebrews has no Christ, no narrative, no named characters — and the Book of Mormon explicitly denies the lost-ten-tribes thesis it is built on). (3) On The Late War: 75 of the 'significant' parallels come from the books' boilerplate copyright statements; the shared phrasing is overwhelmingly the shared KJV register both books deliberately imitate — the method detects 'wrote in biblical English,' the Texas-sharpshooter fallacy. Notably the harshest methodological critique came from Ryan Thomas, himself a critic of Book of Mormon historicity.","responseSource":{"name":"FAIR, 'View of the Hebrews theory' and 'The Late War theory'","url":"https://www.fairlatterdaysaints.org/answers/View_of_the_Hebrews_theory_of_Book_of_Mormon_authorship"},"rationale":"The direct-dependence claims are among the weakest material in the critical canon: parallel-hunting across a large corpus is methodologically unreliable, the copyright-page contamination in the Johnson study is a genuine defect, and a critic-scholar independently rejected direct literary dependence. Roberts is routinely misused. What survives is the modest, well-supported version: the Book of Mormon is environmentally at home in 1820s New England religious culture — the Hebraic-Indian thesis, anti-Masonic language, the Arminian/Universalist debates of Alma 40–42 — which establishes availability of ideas, not copying. This app presents the KJV/Deutero-Isaiah entries (which rest on mainstream scholarship) as the strong textual case, and these named-source theories with explicit caveats."},
{"id":"book-of-abraham-papyri","category":"translation-test","severity":"high","verdict":"unrefuted","featured":true,"title":"The Book of Abraham papyri: the one case where Joseph Smith's source text survives","claim":"Unlike the gold plates, the source documents for the Book of Abraham exist. Smith purchased Egyptian papyri in 1835, declared one roll 'the writings of Abraham while he was in Egypt,' and published the Book of Abraham in 1842. Fragments rediscovered in 1966 were identified by Egyptologists — definitively in Robert Ritner's complete edition (2011) — as the Breathing Permit of the priest Hor and portions of the Book of the Dead: standard Ptolemaic funerary texts, ~1,500 years after Abraham, containing no reference to Abraham whatsoever. Smith's own Egyptian Alphabet and Grammar maps single characters from the surviving Hor fragment to long English paragraphs of the published Book of Abraham. His published interpretations of the three facsimiles do not match Egyptological readings — Facsimile 3's female figures are identified by Smith as male kings. This is the only external, controlled test of Joseph Smith's ability to translate an ancient document, and it fails.","bom":[],"bible":["Genesis 11–12","Abraham 1:1–3 (Pearl of Great Price)"],"sources":[{"name":"Robert K. Ritner (University of Chicago Oriental Institute), The Joseph Smith Egyptian Papyri: A Complete Edition (Signature Books, 2011)","type":"scholarly","url":"https://www.signaturebooks.com/books/p/the-joseph-smith-egyptian-papyri"},{"name":"Robert K. Ritner, 'The \"Breathing Permit of Hor\" Thirty-four Years Later,' Dialogue 33/4 (2000)","type":"scholarly","url":"https://www.dialoguejournal.com/wp-content/uploads/sbi/articles/Dialogue_V33N04_107.pdf"},{"name":"Institute for Religious Research, 'Translation and Historicity of the Book of Abraham — A Response'","type":"scholarly","url":"https://mit.irr.org/translation-and-historicity-of-book-of-abraham-response"},{"name":"Gospel Topics Essay — official concession: 'the characters on the fragments do not match the translation given in the book of Abraham'","type":"institutional","url":"https://www.churchofjesuschrist.org/study/manual/gospel-topics-essays/translation-and-historicity-of-the-book-of-abraham?lang=eng"}],"response":"Two defenses, both endorsed in the church's own essay: (1) The missing-scroll theory (John Gee, Kerry Muhlestein, BYU): the recovered fragments are a small remnant; eyewitnesses describe a 'long roll,' Gee calculates ~314 cm missing from the Hor roll, and much of the collection is believed destroyed in the 1871 Chicago fire — the Abraham text was on papyrus we do not have. (2) The catalyst theory: Joseph's study of the papyri 'provided an occasion for meditation, reflection, and revelation' — God gave a revelation about Abraham 'even if that revelation did not directly correlate to the characters.' Supporting arguments: the Kirtland Egyptian Papers may be a later scribal attempt to reverse-engineer an already-revealed text; and apologists cite claimed ancient corroborations of Book of Abraham content absent from Genesis — the attempted sacrifice of Abraham, Abraham teaching astronomy, the name 'Olishem' possibly matching the attested toponym Ulisum — appearing in extra-biblical traditions Smith is unlikely to have known.","responseSource":{"name":"Gospel Topics Essay, 'Translation and Historicity of the Book of Abraham'; Gee and Muhlestein (BYU Studies)","url":"https://byustudies.byu.edu/article/the-relationship-between-the-book-of-abraham-and-the-joseph-smith-papyri"},"rationale":"The strongest external test in the entire corpus: the source document exists, and Egyptology is a mature decipherment science with no LDS stake. The church has conceded the core factual claim in an official essay. The two defenses are individually intelligible but jointly telling — they contradict each other (either the Abraham text was on a lost papyrus, making translation real and the fragments irrelevant; or the papyri were a mere catalyst, making the lost scroll irrelevant). The missing-scroll theory faces an unovercome problem: Smith's own Egyptian Alphabet and Grammar aligns characters FROM THE SURVIVING FRAGMENT against Book of Abraham verses, locating his working source in documents we possess. The catalyst theory is unfalsifiable and dissolves the concept of 'translation' as the church used it for 130 years — retroactively removing evidentiary force from the Book of Mormon translation claim as well. The proposed content corroborations (Olishem) are parallels of the same weak type flagged elsewhere and cannot offset a direct decipherment mismatch."},
{"id":"stylometry-wordprint-studies","category":"stylometry","severity":"low","verdict":"contested","title":"Stylometry: the Spalding–Rigdon study vs. the BYU wordprints — why neither settles authorship","claim":"Two opposed bodies of computational authorship work exist. Pro-historicity: Larsen/Rencher/Layton (BYU Studies, 1980) and Hilton (BYU Studies, 1990) reported that the Book of Mormon's internal narrators are statistically distinguishable from one another and from Joseph Smith. Anti-historicity: Jockers, Witten, and Criddle (Literary and Linguistic Computing, 2008) applied nearest-shrunken-centroid classification and concluded the text's chapters attribute most strongly to Solomon Spalding and Sidney Rigdon, supporting the Spalding–Rigdon theory of composition.","bom":[],"bible":[],"sources":[{"name":"Jockers, Witten, Criddle, 'Reassessing authorship of the Book of Mormon…,' Literary and Linguistic Computing 23/4 (2008)","type":"scholarly","url":"https://www.researchgate.net/publication/250900139_Reassessing_authorship_of_the_Book_of_Mormon_using_delta_and_nearest_shrunken_centroid_classification"},{"name":"Larsen, Rencher, Layton, 'Who Wrote the Book of Mormon? An Analysis of Wordprints,' BYU Studies 20/3 (1980)","type":"apologetics","url":"https://scholarsarchive.byu.edu/byusq/vol20/iss3/2"},{"name":"Hilton, 'On Verifying Wordprint Studies,' BYU Studies 30/3 (1990)","type":"apologetics","url":"https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/hilton/2019-12-31/09_john_l._hilton_on_verifying_wordprint_studies_225-253.pdf"},{"name":"Roper, Fields, Schaalje, 'Stylometric Analyses of the Book of Mormon: A Short History,' JBMS 21/1 (2012)","type":"apologetics","url":"https://scholarsarchive.byu.edu/cgi/viewcontent.cgi?article=1492&context=jbms"}],"response":"G. Bruce Schaalje (BYU statistician) and colleagues identified the decisive defect in Jockers et al.: NSC is a closed-set classifier — mathematically obligated to assign every chapter to one of the supplied candidates — and Joseph Smith's own writings were largely excluded from the pool while Rigdon and Spalding were included. Schaalje's extended NSC permitting an 'author not in the set' outcome, rerun on the same data, gave Rigdon and Spalding each 0% relative likelihood and a 93% probability of authorship outside the candidate set. Independently, the Spalding–Rigdon theory is rejected by essentially all historians of Mormonism including non-believers (Brodie, Vogel) on documentary grounds — Rigdon had no demonstrable contact with Smith before late 1830, after publication.","responseSource":{"name":"Schaalje, Fields, Roper, 'Examining a Misapplication of NSC Classification' (Mormon Studies Review)","url":"https://archive.bookofmormoncentral.org/content/examining-misapplication-nearest-shrunken-centroid-classification-investigate-book-mormon"},"rationale":"Asymmetric, and worth presenting as a methodology lesson: the critical study is the weaker one — Schaalje's closed-set objection is correct, and the Spalding–Rigdon conclusion is independently rejected by mainstream naturalistic historians, so Jockers et al. should be treated as answered. But the pro-historicity studies do not therefore win: detecting multiple internal 'voices' does not distinguish ancient authors from a single author writing distinct characters — a known limitation of wordprint methods on narrative fiction — and the same 'author not in the set' logic applies against any positive ancient attribution. Stylometry as currently practiced cannot resolve Book of Mormon authorship in either direction; discount confident claims from either camp."},
{"id":"jst-genesis-50-choice-seer","category":"origin-story","severity":"high","verdict":"unrefuted","title":"JST Genesis 50: Joseph Smith inserts a prophecy of himself with no manuscript support","claim":"Joseph Smith's revision of the Bible (JST, 1830–33) expands Genesis 50 with roughly 14 verses (JST Genesis 50:24–38) in which the patriarch Joseph prophesies a latter-day 'choice seer' named Joseph, whose father is also named Joseph — matching Joseph Smith Jr., son of Joseph Smith Sr. The same prophecy appears in 2 Nephi 3, which quotes the 'lost' Genesis material. No Hebrew manuscript, Septuagint text, Dead Sea Scroll, Samaritan Pentateuch, targum, or any ancient version contains this passage; the entire known textual tradition of Genesis ends chapter 50 without it.","bom":["2 Nephi 3:6–18","2 Nephi 4:1–2"],"bible":["Genesis 50:22–26 (KJV)","JST Genesis 50:24–38"],"comparison":{"left":{"ref":"2 Nephi 3:15 — the 'lost' Genesis prophecy","text":"And his name shall be called after me; and it shall be after the name of his father. And he shall be like unto me; for the thing, which the Lord shall bring forth by his hand, by the power of the Lord shall bring my people unto salvation."},"right":{"ref":"Genesis 50:24 (KJV) — how every known manuscript ends","text":"And Joseph said unto his brethren, I die: and God will surely visit you, and bring you out of this land unto the land which he sware to Abraham, to Isaac, and to Jacob."},"hl":["his name shall be called after me","after the name of his father"],"note":"A prophecy naming the revelator himself — 'Joseph, son of Joseph' — appears in zero ancient witnesses: not the Masoretic text, not the Septuagint, not the Dead Sea Scrolls, not the Samaritan Pentateuch."},"sources":[{"name":"JST Genesis 50 (official LDS scripture text)","type":"primary","url":"https://www.churchofjesuschrist.org/study/scriptures/jst/jst-gen/50?lang=eng"},{"name":"FAIR: Relationship between the JST and biblical manuscripts","type":"apologetics","url":"https://www.fairlatterdaysaints.org/answers/What_is_the_relationship_between_the_JST_and_biblical_manuscripts"},{"name":"BYU Religious Studies Center: The Contribution of the JST","type":"scholarly","url":"https://rsc.byu.edu/joseph-smith-translation/contribution-jst-understanding-old-testament-prophets"},{"name":"2026 LDS Seminary manual lesson on JST Genesis 50 (current official use)","type":"institutional","url":"https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-manual-2026/12-genesis-42-50/122-jst-genesis-50?lang=eng"}],"response":"LDS scholarship (Robert Matthews, Kent Jackson, echoed by FAIR) grants that no ancient manuscript contains the passage and argues the JST was never claimed to be purely a restoration of lost text: it can be restoration of content, inspired commentary, harmonization, or prophetic expansion adapted to a latter-day audience. On this view JST Genesis 50 may restore a genuine prophecy preserved on the brass plates (hence 2 Nephi 3) that dropped out of the Hebrew tradition very early, or may be revealed content that was never in the biblical text — either way its authority rests on revelation, not manuscripts.","responseSource":{"name":"FAIR: The JST as a restoration of the original Bible text","url":"https://www.fairlatterdaysaints.org/answers/The_Bible/Joseph_Smith_Translation/As_a_restoration_of_the_original_Bible_text"},"rationale":"The textual fact is conceded on all sides: zero ancient witnesses contain the passage, and the prophecy names the revelator himself. The apologetic response does not rebut the evidence but reclassifies the JST so that missing manuscript support cannot count against it — which is unfalsifiable rather than a refutation."},
{"id":"angel-nephi-moroni-name-change","category":"origin-story","severity":"low","verdict":"contested","title":"Early published accounts name the angel 'Nephi,' later changed to Moroni","claim":"Joseph Smith's official 1838–39 manuscript history, as published under his own editorship in the Times and Seasons (April 15, 1842), names the angel of the gold plates 'Nephi,' not Moroni. The 'Nephi' reading was reprinted in the Millennial Star (1842), the first edition of the Pearl of Great Price (1851), and Lucy Mack Smith's 1853 history; Smith lived two years after the 1842 printing without publishing a correction. Later editions silently emended the name to Moroni.","bom":[],"bible":[],"sources":[{"name":"Joseph Smith Papers, History 1838–1856 vol. A-1 (manuscript showing 'Nephi')","type":"primary","url":"https://www.josephsmithpapers.org/paper-summary/history-1838-1856-volume-a-1-23-december-1805-30-august-1834/5"},{"name":"MormonThink: Did Joseph Smith see Nephi or Moroni?","type":"journalism","url":"http://www.mormonthink.com/nephiweb.htm"},{"name":"FAIR: Moroni's visit — Nephi or Moroni","type":"apologetics","url":"https://www.fairlatterdaysaints.org/answers/Moroni's_visit/Nephi_or_Moroni"}],"response":"FAIR and church historians argue the 'Nephi' reading was a scribal or editorial error introduced when clerks compiled the 1838–39 history: sources earlier than 1842 — Oliver Cowdery's 1835 letters in the Messenger and Advocate and D&C 27:5 (1835) — already identify the messenger as Moroni, so 'Moroni' predates 'Nephi' in the record. Joseph Smith did not personally proofread every installment of the serialized history, and the church corrected the name to match the earlier, better-attested identification rather than covering anything up.","responseSource":{"name":"FAIR: Moroni's visit — Nephi or Moroni","url":"https://www.fairlatterdaysaints.org/answers/Moroni's_visit/Nephi_or_Moroni"},"rationale":"The publication history (Nephi in 1842–1853 sources, later emended) is undisputed primary-source fact, but the apologetic point that 1835 sources name Moroni first is also solid, making 'clerical error' genuinely plausible. What remains unexplained is why the error propagated uncorrected through multiple official publications during and after Smith's lifetime."},
{"id":"first-vision-multiple-accounts","category":"first-vision","severity":"high","verdict":"contested","title":"First Vision: four differing firsthand accounts (1832, 1835, 1838, 1842)","claim":"Joseph Smith left at least four firsthand accounts of his First Vision that differ on core details: the 1832 account (in his own hand) describes one personage ('the Lord'), gives his age as about 15/16, says he had already concluded all churches were wrong before praying, and does not mention a revival; the 1835 account describes one personage followed by another plus 'many angels'; the canonized 1838 account describes two personages (the Father and the Son), age 14, and an 1820 revival as the trigger; the 1842 Wentworth letter describes 'two glorious personages.' The 1832 account was unpublished and effectively unknown to members until the 1960s.","bom":[],"bible":[],"sources":[{"name":"Joseph Smith Papers: Primary accounts of the First Vision","type":"primary","url":"https://www.josephsmithpapers.org/site/accounts-of-the-first-vision"},{"name":"LDS Discussions: Overview of First Vision accounts","type":"journalism","url":"https://www.ldsdiscussions.com/firstvision-overview"},{"name":"Dialogue: 'The First Vision Controversy — A Critique and Reconciliation'","type":"scholarly","url":"https://www.dialoguejournal.com/articles/the-first-vision-controversy-a-critique-and-reconciliation-2/"},{"name":"Gospel Topics essay: First Vision Accounts (church acknowledgment of the differences)","type":"institutional","url":"https://www.churchofjesuschrist.org/study/manual/gospel-topics-essays/first-vision-accounts?lang=eng"}],"response":"The church's Gospel Topics essay acknowledges all the accounts and argues the differences reflect audience, purpose, and memory, not fabrication: the 1832 account emphasizes personal forgiveness while the 1838 account emphasizes the founding of the church, and retellings that grow in detail are normal for repeated autobiographical narration. Historians such as Milton Backman and James Allen argue the accounts are complementary — 'the Lord' in 1832 can encompass two personages — and that multiple tellings with varying emphases are evidence of an authentic core experience rather than an evolving invention.","responseSource":{"name":"Gospel Topics essay: First Vision Accounts","url":"https://www.churchofjesuschrist.org/study/manual/gospel-topics-essays/first-vision-accounts?lang=eng"},"rationale":"The existence and content of the differing accounts is established primary-source fact the church itself now publishes; the dispute is whether the differences (especially one personage vs. two, and forgiveness-quest vs. which-church-is-true) are harmonizable memory variation or evidence of an evolving story. Both readings are argued by credentialed historians."},
{"id":"first-vision-revival-dating","category":"first-vision","severity":"medium","verdict":"contested","title":"No documented 1820 Palmyra revival; the documented revival was 1824–25","claim":"The canonized 1838 account ties the First Vision to an 'unusual excitement on the subject of religion' in the Palmyra area in 1820 that added 'great multitudes' to the churches. Wesley Walters ('New Light on Mormon Origins from the Palmyra Revival,' 1967/1969) examined Presbyterian, Methodist, and Baptist records and found no significant Palmyra-area revival or membership surge in 1819–20, but a large, well-documented revival in 1824–25 — after Moroni's claimed 1823 visit — suggesting Smith retrojected the later revival into the 1820 narrative.","bom":[],"bible":[],"sources":[{"name":"Wesley P. Walters, 'New Light on Mormon Origins from the Palmyra Revival,' Dialogue 4:1 (1969)","type":"scholarly","url":"https://www.dialoguejournal.com/articles/new-light-on-mormon-origins-from-the-palmyra-revival/"},{"name":"Walters' original 1967 article (Bulletin of the Evangelical Theological Society)","type":"scholarly","url":"https://etsjets.org/wp-content/uploads/2013/05/files_JETS-PDFs_10_10-4_BETS_10_4_227-244_Walters.pdf"},{"name":"Dialogue roundtable: The Question of the Palmyra Revival (Bushman/Walters exchange, 1969)","type":"scholarly","url":"https://www.dialoguejournal.com/wp-content/uploads/sbi/articles/Dialogue_V04N01_61.pdf"}],"response":"Milton Backman ('Awakenings in the Burned-over District,' BYU Studies 9:3, 1969), written in direct response to Walters, documented Methodist camp meetings near Palmyra in 1819–20 and revival activity across the broader Genesee region — arguing Smith described a regional awakening, not a formal Palmyra revival with recorded membership gains. The Gospel Topics essay adopts this reading: Smith, recalling as a teenager, described general religious excitement in 'the whole district of country,' and an 1818 Palmyra camp meeting and 1819 Methodist conference at nearby Vienna fit his description.","responseSource":{"name":"Gospel Topics essay: First Vision Accounts","url":"https://www.churchofjesuschrist.org/study/manual/gospel-topics-essays/first-vision-accounts?lang=eng"},"rationale":"Walters' negative finding for an 1820 Palmyra revival producing 'great multitudes' of converts stands largely unrebutted in the church records, but Backman's evidence of 1819–20 regional camp-meeting activity gives the 1838 account a defensible looser reading. The verdict turns on how literally 'great multitudes' joining churches must be taken."},
{"id":"quitmormon-resignation-difficulty","category":"exit-costs","severity":"medium","verdict":"unrefuted","title":"Formal resignation is burdensome enough that 150,000+ members have used a pro bono lawyer","claim":"Resigning LDS membership normally routes through one's bishop and stake president, with waiting periods and leader outreach; many resigners report continued visits, calls, and repeated contact despite explicit do-not-contact requests. Utah attorney Mark Naugle's free service QuitMormon.com — which sends resignation demands as legal representation so the church must deal with counsel instead of the member — has processed on the order of 150,000+ resignations since 2015. In 2019 the church added a notarization requirement for QuitMormon submissions, citing fraudulent requests, adding friction to third-party resignation.","bom":[],"bible":[],"sources":[{"name":"Salt Lake Tribune: 'LDS Church adds a new step for members using QuitMormon.com' (Aug 2019)","type":"journalism","url":"https://www.sltrib.com/religion/2019/08/04/lds-church-adds-new-step/"},{"name":"QuitMormon.com (the service itself)","type":"primary","url":"https://quitmormon.com/"},{"name":"Mormon Stories #1414: Mark Naugle — QuitMormon.com","type":"testimony","url":"https://www.mormonstories.org/mark-naugle-quitmormon-com/"},{"name":"NPR: 'More than 1,000 Mormons resign in protest' (Nov 2015)","type":"journalism","url":"https://www.npr.org/sections/thetwo-way/2015/11/16/456224955/more-than-1-000-mormons-resign-from-the-lds-church-in-protest"}],"response":"The church's General Handbook provides an official, no-cost path: a member may request removal of their membership record in writing to the bishop, the request is to be honored, and leaders are instructed to verify identity and ensure the person understands the consequences — steps the church frames as protecting members from fraudulent or impulsive removal (its stated reason for the 2019 notarization requirement was actual fraudulent submissions, including pranks resigning other people). Follow-up contact is framed as pastoral care from lay leaders taught to respond with love, not harassment; members may also simply stop participating with no penalty.","responseSource":{"name":"General Handbook ch. 32 (membership record removal provisions)","url":"https://www.churchofjesuschrist.org/study/manual/general-handbook/32-repentance-and-membership-councils?lang=eng"},"rationale":"The factual claims are established: QuitMormon's scale is documented in mainstream journalism, the 2019 notarization change is confirmed by both sides, and continued-contact experiences are abundantly attested — the service's entire value proposition, a legal buffer, exists because of them. The dispute is over motive (pastoral care vs. retention pressure), not the facts."},
{"id":"temple-wedding-family-exclusion","category":"exit-costs","severity":"medium","verdict":"admitted","title":"Temple weddings exclude family without recommends — including parents of the couple","claim":"Only members holding a current temple recommend may attend a temple sealing, so non-member, resigned, or non-recommend-holding family — including a bride's or groom's own parents — must wait outside during the wedding. Until May 2019, U.S. couples who held a civil ceremony first (so excluded family could attend) were penalized with a one-year wait before sealing, pressuring couples to choose the temple over excluded relatives. The First Presidency removed the one-year penalty in 2019, explicitly citing families feeling excluded, but the recommend requirement for attending sealings itself is unchanged.","bom":[],"bible":[],"sources":[{"name":"Religion News Service: 'Mormon leaders change policy on temple weddings' (May 2019, quotes First Presidency letter)","type":"journalism","url":"https://religionnews.com/2019/05/06/mormon-leaders-change-policy-on-temple-weddings-no-more-one-year-waiting-period-after-civil-ceremony/"},{"name":"Mormonism Research Ministry: 'The exclusion of non-Mormons at temple weddings'","type":"apologetics","url":"https://mrm.org/temple-exclusion"},{"name":"General Handbook ch. 27: Temple ordinances for the living (current policy)","type":"primary","url":"https://www.churchofjesuschrist.org/study/manual/general-handbook/27-temple-ordinances-for-the-living?lang=eng"}],"response":"The church holds that the temple is a sacred space whose ordinances require covenant worthiness — the same standard applied to every attendee for any temple ordinance, not targeted at wedding guests. The 2019 First Presidency change was expressly made so that 'when a temple marriage would cause parents or immediate family members to feel excluded, a civil marriage followed by a temple sealing is authorized,' letting couples hold a fully inclusive civil wedding first and be sealed immediately after — presented as resolving the family-exclusion dilemma while preserving the sanctity of the temple.","responseSource":{"name":"First Presidency policy change as reported with full quotation (RNS)","url":"https://religionnews.com/2019/05/06/mormon-leaders-change-policy-on-temple-weddings-no-more-one-year-waiting-period-after-civil-ceremony/"},"rationale":"The exclusion rule and the pre-2019 one-year penalty are documented church policy, and the church's own 2019 letter acknowledges the family-exclusion harm it was mitigating. The 2019 change is a genuine improvement but confirms rather than refutes the underlying factual claim."},
{"id":"byu-honor-code-disaffiliation","category":"exit-costs","severity":"high","verdict":"admitted","title":"BYU students who formally leave the church lose enrollment eligibility","claim":"BYU requires every student to maintain an annual ecclesiastical endorsement; under BYU's published policy, excommunication, disfellowshipment, or disaffiliation (resignation) from the LDS church automatically withdraws the endorsement, costing the student good Honor Code standing, enrollment eligibility, campus jobs and housing, and even graduation if coursework is complete. A student who ceases to believe mid-degree therefore faces expulsion or years of concealed non-belief; non-LDS students who never were members may attend (at higher tuition), but a member who converts out is treated more harshly than someone never baptized. FreeBYU's accreditation complaints were rejected, leaving the policy intact with a narrow petition-for-exception process added in 2015–16.","bom":[],"bible":[],"sources":[{"name":"BYU Honor Code Office: Withdrawn or denied ecclesiastical endorsements (official policy)","type":"primary","url":"https://honorcode.byu.edu/withdrawn-or-denied-ecclesiastical-endorsements"},{"name":"BYU Student Standing Policy","type":"primary","url":"https://policy.byu.edu/view/student-standing-policy"},{"name":"KSL: 'BYU adjusts honor code policies for students who leave LDS Church' (2016)","type":"journalism","url":"https://www.ksl.com/article/41111782/byu-adjusts-honor-code-policies-for-students-who-leave-lds-church"},{"name":"The Daily Universe: 'Ex-Mormon BYU alumni group seeks to force honor code change' (FreeBYU)","type":"journalism","url":"https://universe.byu.edu/2016/02/16/ex-mormon-byu-alumni-group-seeks-to-force-honor-code-change"}],"response":"BYU's position is that it is a private religious university subsidized heavily by church tithing: LDS students attend at a steep discount funded by the faith community, on the explicit contractual condition of remaining in good standing with the sponsoring church, which students accept at admission. The university notes accreditors and the ABA have upheld its right to religious conditions of enrollment, that a petition process now exists for students who resign membership, and that continuing endorsement requirements apply to all students (non-LDS students need an endorsement too, just not LDS membership).","responseSource":{"name":"BYU Honor Code Office: Ecclesiastical endorsements and resources","url":"https://honorcode.byu.edu/ecclesiastical-endorsements-and-resources"},"rationale":"The policy is stated verbatim in BYU's own published documents — disaffiliation automatically triggers endorsement withdrawal and loss of enrollment eligibility — so the factual claim is established from the institution itself. The live dispute is normative (religious-liberty contract vs. coercive faith-retention), not factual."},
{"id":"social-costs-shunning","category":"exit-costs","severity":"medium","verdict":"contested","title":"Leaving carries documented family and social costs — though the church formally discourages shunning","claim":"Ex-members widely report marital strain, family estrangement, lost community, and marginalization after leaving — patterns documented in journalism (NPR, HuffPost) and thousands of collected testimonies — driven partly by LDS theology in which mixed-faith families lose eternal sealing expectations and 'apostate' carries strong cultural stigma (Boyd K. Packer's 1993 naming of 'so-called scholars,' feminists, and gays as 'dangers' shaped this climate). Unlike Jehovah's Witnesses, the LDS church has no formal shunning doctrine, so the costs are cultural and familial rather than institutionally mandated.","bom":[],"bible":[],"sources":[{"name":"NPR: 'Shunned ex-Mormons form own communities' (2005)","type":"journalism","url":"https://www.npr.org/2005/10/21/4968585/shunned-ex-mormons-form-own-communities"},{"name":"HuffPost: 'Do Mormons Shun?'","type":"journalism","url":"https://www.huffpost.com/entry/do-mormons-shun_b_5a007e70e4b076eaaae27173"},{"name":"Faith After Mormonism: 'Feeling shunned after leaving Mormonism' (collected experiences)","type":"testimony","url":"https://faithaftermormonism.org/feeling-shunned-after-leaving-mormonism/"}],"response":"Church leaders have explicitly and repeatedly counseled against cutting off family who leave: Elder D. Todd Christofferson stated publicly that he 'would not cut that child out of family life,' and official teaching urges members to respond to departing family with continued love and inclusion; there is no doctrine, handbook provision, or discipline instructing members to shun ex-members. The church would add that strained relationships accompany religious switching in many traditions and reflect individual family behavior, not institutional policy.","responseSource":{"name":"Compiled Holland/Christofferson statements on members who leave","url":"https://followjesusnotwolves.com/does-the-lds-church-shun-members-who-leave-elders-holland-christofferson-give-answers/"},"rationale":"The social costs themselves are factually well-documented across journalism and mass testimony, but the causal claim that the institution drives them is genuinely contested: official policy discourages shunning while theology and rhetoric arguably incentivize distance. Both the harm and the absence of a formal shunning mandate are true simultaneously."},
